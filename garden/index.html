<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Bustan</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="A plant tracker for a Levant garden. Offline, local-first, no account." />
<meta name="theme-color" content="#2f4a33" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" type="image/png" href="../icons/garden-192.png" />
<link rel="apple-touch-icon" sizes="192x192" href="../icons/garden-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap">
<style>
/* Seasonal palettes. The whole app recolours on the turn of the season -
   the one Stardew habit that carries over completely intact. */
:root{
  --px:"Pixelify Sans", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --body:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --ink:#eef2e6; --dim:#a9b49f; --faint:#78846f;
  --panel:#22301f; --panel2:#2c3c28; --sunk:#18220f; --line:#3f5238;
  --good:#7fc257; --warn:#e0a93f; --bad:#d4653c; --cold:#6fa8d6; --bloom:#e089a8;
  --gold:#e8c35a;
}
:root[data-season="spring"]{ --page:#22331f; --hdr:#3a6b3a; --acc:#7fc257; --acc2:#c9e89a; }
:root[data-season="summer"]{ --page:#2e2a1c; --hdr:#8a6a2a; --acc:#e0a93f; --acc2:#f0d68a; }
:root[data-season="autumn"]{ --page:#2e241c; --hdr:#8a5326; --acc:#d4823c; --acc2:#f0c08a; }
:root[data-season="winter"]{ --page:#1e2730; --hdr:#3f6280; --acc:#6fa8d6; --acc2:#b8d8ee; }

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--page); color:var(--ink);
  font-family:var(--body); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  display:flex; flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom);
}
h1,h2,h3,.px{font-family:var(--px); font-weight:600; letter-spacing:.01em; margin:0}

/* ---- chrome: zero radius, hard shadows, chunky borders ---- */
.card{background:var(--panel); border:3px solid var(--line); box-shadow:4px 4px 0 0 rgba(0,0,0,.35); padding:.85rem}
.card.tight{padding:.6rem .7rem}
button,.btn{
  font-family:var(--px); font-size:1rem; color:var(--ink); background:var(--panel2);
  border:3px solid var(--line); box-shadow:3px 3px 0 0 rgba(0,0,0,.35);
  padding:.5rem .8rem; cursor:pointer; border-radius:0; text-align:center;
}
button:active,.btn:active{transform:translate(2px,2px); box-shadow:1px 1px 0 0 rgba(0,0,0,.35)}
button:focus-visible,.btn:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold); outline-offset:2px}
button.pri{background:var(--acc); color:#16200f; border-color:#16200f}
button.wide{width:100%}
button[disabled]{opacity:.45; cursor:default}
input,select,textarea{
  font-family:var(--body); font-size:1rem; color:var(--ink); background:var(--sunk);
  border:3px solid var(--line); padding:.5rem; border-radius:0; width:100%;
}
label{display:block; font-family:var(--px); font-size:.9rem; color:var(--dim); margin-bottom:.25rem}
.field{margin-bottom:.7rem}

/* ---- header ---- */
header{background:var(--hdr); border-bottom:4px solid rgba(0,0,0,.4); padding:calc(.7rem + env(safe-area-inset-top)) .9rem .7rem; flex:none}
header .row{display:flex; align-items:baseline; gap:.6rem}
header h1{font-size:1.5rem}
header .ar{font-family:var(--body); font-size:1rem; opacity:.8}
header .sub{font-size:.8rem; opacity:.85; margin-top:.15rem}

main{flex:1; overflow-y:auto; padding:.8rem .8rem 1.2rem; display:flex; flex-direction:column; gap:.8rem; -webkit-overflow-scrolling:touch}

/* ---- nav ---- */
nav{display:grid; grid-template-columns:repeat(4,1fr); background:var(--panel); border-top:4px solid var(--line); flex:none}
nav button{background:none; border:none; box-shadow:none; padding:.6rem .2rem; font-size:.82rem; color:var(--faint); display:flex; flex-direction:column; align-items:center; gap:.2rem}
nav button .ic{width:22px; height:22px; image-rendering:pixelated}
nav button.on{color:var(--acc)}
nav button:active{transform:none; box-shadow:none}

/* ---- bits ---- */
.sec{font-family:var(--px); font-size:.95rem; color:var(--dim); display:flex; align-items:center; gap:.5rem}
.sec::after{content:""; flex:1; height:3px; background:var(--line)}
.muted{color:var(--dim); font-size:.85rem}
.tiny{font-size:.75rem; color:var(--faint)}
.rowflex{display:flex; gap:.5rem; align-items:center}
.spread{display:flex; justify-content:space-between; align-items:baseline; gap:.5rem}
.stack{display:flex; flex-direction:column; gap:.5rem}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:.5rem}

.alert{border-left:6px solid var(--warn); background:var(--panel); border-top:3px solid var(--line); border-right:3px solid var(--line); border-bottom:3px solid var(--line); padding:.6rem .7rem}
.alert h3{font-size:1rem; margin-bottom:.15rem}
.alert p{margin:0; font-size:.85rem; color:var(--dim)}
.a-frost,.a-freeze{border-left-color:var(--cold)}
.a-heat,.a-khamsin{border-left-color:var(--bad)}
.a-rain,.a-firstrain{border-left-color:var(--good)}
.a-uv,.a-storm{border-left-color:var(--warn)}

.wx{display:grid; grid-template-columns:repeat(auto-fit,minmax(58px,1fr)); gap:.35rem}
.wxd{background:var(--sunk); border:2px solid var(--line); padding:.35rem .2rem; text-align:center}
.wxd b{display:block; font-family:var(--px); font-size:.78rem; color:var(--dim); font-weight:500}
.wxd .t{font-family:var(--px); font-size:.95rem}
.wxd .r{font-size:.68rem; color:var(--cold)}
.wxd.now{border-color:var(--acc)}

.plant{display:flex; gap:.7rem; align-items:center; background:var(--panel); border:3px solid var(--line); padding:.5rem .6rem; box-shadow:3px 3px 0 0 rgba(0,0,0,.3); cursor:pointer; text-align:left; width:100%; color:inherit; font-family:var(--body); font-size:15px}
.plant:active{transform:translate(2px,2px); box-shadow:1px 1px 0 0 rgba(0,0,0,.3)}
.plant canvas{width:52px; height:52px; image-rendering:pixelated; flex:none; background:var(--sunk); border:2px solid var(--line)}
.plant .nm{font-family:var(--px); font-size:1.02rem; line-height:1.2}
.plant .meta{font-size:.76rem; color:var(--faint)}
.bar{height:8px; background:var(--sunk); border:2px solid var(--line); margin-top:.3rem; position:relative}
.bar i{display:block; height:100%; background:var(--good)}
.bar i.due{background:var(--bad)}
.bar i.near{background:var(--warn)}

.gardengrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:.5rem}
.tile{background:var(--panel); border:3px solid var(--line); padding:.4rem .2rem .45rem; text-align:center; cursor:pointer; color:inherit; font-family:var(--body); box-shadow:3px 3px 0 0 rgba(0,0,0,.3)}
.tile:active{transform:translate(2px,2px); box-shadow:1px 1px 0 0 rgba(0,0,0,.3)}
.tile canvas{width:100%; max-width:64px; height:auto; image-rendering:pixelated}
.tile .nm{font-family:var(--px); font-size:.85rem; line-height:1.15; margin-top:.2rem; word-break:break-word}
.tile.due{border-color:var(--bad)}
.tile .dot{display:inline-block; width:8px; height:8px; background:var(--bad); margin-top:.15rem}

.sp{display:flex; gap:.6rem; align-items:center; background:var(--panel); border:3px solid var(--line); padding:.45rem .55rem; cursor:pointer; width:100%; text-align:left; color:inherit; font-family:var(--body); font-size:15px}
.sp canvas{width:44px; height:44px; image-rendering:pixelated; flex:none; background:var(--sunk)}
.sp .nm{font-family:var(--px); font-size:.98rem}
.sp .ar{font-size:.85rem; color:var(--dim)}
.sp .meta{font-size:.72rem; color:var(--faint)}

.hero{display:flex; gap:.8rem; align-items:center}
.hero canvas{width:110px; height:110px; image-rendering:pixelated; background:var(--sunk); border:3px solid var(--line); flex:none}
.chips{display:flex; flex-wrap:wrap; gap:.3rem}
.chip{font-family:var(--px); font-size:.75rem; background:var(--sunk); border:2px solid var(--line); padding:.15rem .4rem; color:var(--dim)}
.chip.on{background:var(--acc); color:#16200f; border-color:#16200f}
.acts{display:grid; grid-template-columns:repeat(auto-fit,minmax(88px,1fr)); gap:.4rem}
.log{display:flex; gap:.5rem; font-size:.82rem; padding:.3rem 0; border-bottom:1px solid var(--line)}
.log .w{font-family:var(--px); color:var(--dim); flex:none; width:82px}
.tips li{margin-bottom:.35rem; font-size:.86rem; color:var(--dim)}

.bloomcard{border:3px solid var(--bloom); background:var(--panel); padding:.7rem; box-shadow:4px 4px 0 0 rgba(0,0,0,.35)}
.bloomcard h3{color:var(--bloom); font-size:1.05rem}
.count{font-family:var(--px); font-size:1.6rem; color:var(--bloom)}

.months{display:grid; grid-template-columns:repeat(6,1fr); gap:.25rem}
.months button{padding:.35rem .1rem; font-size:.82rem; box-shadow:none; border-width:2px}
.months button.on{background:var(--acc); color:#16200f; border-color:#16200f}

dialog{border:none; background:none; padding:0; max-width:100%; width:100%}
dialog::backdrop{background:rgba(0,0,0,.65)}
.sheet{background:var(--panel); border:4px solid var(--line); padding:.9rem; max-height:86vh; overflow-y:auto; margin:auto; max-width:460px}
.empty{text-align:center; padding:1.6rem .8rem; color:var(--dim)}
.empty canvas{width:76px; height:76px; image-rendering:pixelated; margin-bottom:.5rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>
</head>
<body>
<header>
  <div class="row"><h1 id="hSeason">Bustan</h1><span class="ar" id="hAr"></span></div>
  <div class="sub" id="hSub">Loading…</div>
</header>

<main id="view"></main>

<nav>
  <button data-tab="today" class="on"><canvas class="ic" width="20" height="20"></canvas>Today</button>
  <button data-tab="garden"><canvas class="ic" width="20" height="20"></canvas>Garden</button>
  <button data-tab="almanac"><canvas class="ic" width="20" height="20"></canvas>Almanac</button>
  <button data-tab="more"><canvas class="ic" width="20" height="20"></canvas>More</button>
</nav>

<dialog id="dlg"><div class="sheet" id="sheet"></div></dialog>

<script src="./sprites.js"></script>
<script src="./species.js"></script>
<script src="./app.js"></script>
<script src="./ui.js"></script>
</body>
</html>
