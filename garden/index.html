<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Bustan</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="A plant tracker for a home full of plants. Offline, local-first, no account." />
<meta name="theme-color" content="#45301c" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" type="image/png" href="../icons/garden-192.png" />
<link rel="apple-touch-icon" sizes="192x192" href="../icons/garden-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Non-blocking: the pixel face is a nicety, and a hung font request must never
     hold up first paint or the load event. Falls back to a monospace stack. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Karla:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Karla:wght@400;500;600;700&display=swap"></noscript>
<style>
/* Parchment, wood and ink. Dark backgrounds read as tool, not game, so green
   only ever appears as a plant or a button — never as a ground.
   Across seasons only --page, --wood and --acc move; ink and parchment hold
   still so nothing ever loses contrast. */
:root{
  --px:"Pixelify Sans", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --body:Karla, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --ink:#45301c; --ink2:#5a422a; --dim:#8b6d4b; --faint:#a8916d;
  --paper:#fbf3dd; --parch:#f6e7c6; --sunk:#e4d0a6; --rule:#b79a6d;
  --good:#5f9b3c; --goodD:#3f6b2a; --warn:#c9962e; --bad:#b4442e;
  --cold:#5f8fb4; --bloom:#b8557a; --gold:#e8b53f;
  color-scheme:light;
}
:root[data-season="spring"]{ --page:#eadfc2; --wood:#7a5a34; --acc:#5f9b3c; --sky1:#8fc4e8; --sky2:#b4d9ee; --sky3:#cfe6f0; --land:#6f9b3c; }
:root[data-season="summer"]{ --page:#ecdcb4; --wood:#8b6238; --acc:#c96a2e; --sky1:#e8c07a; --sky2:#f0d69a; --sky3:#f6e7c0; --land:#9a8442; }
:root[data-season="autumn"]{ --page:#e8d6b6; --wood:#7d5228; --acc:#a8724a; --sky1:#dda15e; --sky2:#e8bd86; --sky3:#f2d7ac; --land:#a8724a; }
:root[data-season="winter"]{ --page:#e2ddcb; --wood:#6b5138; --acc:#5f8fb4; --sky1:#9db8cc; --sky2:#bcd0dd; --sky3:#d6e2e8; --land:#7a8a7a; }
/* the one night a year */
:root[data-night="1"]{ --page:#2a2620; --ink:#f2e3c4; --ink2:#e0cfae; --dim:#b3a082; --faint:#8b7a60;
  --paper:#3a332a; --parch:#332e26; --sunk:#241f19; --rule:#5c4c38; --wood:#241a12; --acc:#c9718f; }

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--page); color:var(--ink);
  font-family:var(--body); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  display:flex; flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom);
}
h1,h2,h3,.px{font-family:var(--px); font-weight:600; letter-spacing:.01em; margin:0}
canvas{image-rendering:pixelated}

/* ---- panels: thin ink rules on paper, one hard shadow. Never heavy frames. ---- */
.card{background:var(--paper); border:2px solid var(--ink); box-shadow:3px 3px 0 0 rgba(43,29,18,.22); padding:.85rem}
.card.plain{border-color:var(--rule); box-shadow:none; background:var(--parch)}
button,.btn{
  font-family:var(--px); font-size:1rem; color:var(--ink); background:var(--parch);
  border:2px solid var(--ink); box-shadow:2px 2px 0 0 rgba(43,29,18,.28);
  padding:.5rem .8rem; cursor:pointer; border-radius:0; text-align:center;
}
button:active,.btn:active{transform:translate(2px,2px); box-shadow:0 0 0 0 rgba(43,29,18,.28)}
button:focus-visible,.btn:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold); outline-offset:2px}
button.pri{background:var(--good); color:#f8f4e6; border-color:var(--ink)}
button.wide{width:100%}
button[disabled]{opacity:.45; cursor:default}
input,select,textarea{
  font-family:var(--body); font-size:1rem; color:var(--ink); background:var(--paper);
  border:2px solid var(--rule); padding:.5rem; border-radius:0; width:100%;
}
label{display:block; font-family:var(--px); font-size:.9rem; color:var(--dim); margin-bottom:.25rem}
.field{margin-bottom:.7rem}

/* ---- the windowsill: the room you are standing in ---- */
header{flex:none; overflow:hidden; padding-top:env(safe-area-inset-top); background:var(--wood)}
header svg{display:block; width:100%; height:auto}
/* the caption sits on the sill in its own parchment strip, so it is always
   readable whatever the season does to the sky */
header .cap{background:var(--parch); border-top:3px solid rgba(43,29,18,.55);
  padding:.4rem .8rem .45rem; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
header .cap h1{font-size:1.5rem; color:var(--ink); line-height:1.1}
header .cap .ar{font-size:.95rem; color:var(--dim)}
header .cap .sub{font-size:.76rem; color:var(--dim); margin-left:auto}

main{flex:1; overflow-y:auto; padding:.8rem .8rem 1.2rem; display:flex; flex-direction:column; gap:.8rem; -webkit-overflow-scrolling:touch}

nav{display:grid; grid-template-columns:repeat(4,1fr); background:var(--wood); border-top:3px solid rgba(43,29,18,.55); flex:none}
nav button{background:none; border:none; box-shadow:none; padding:.55rem .2rem; font-size:.8rem; color:rgba(246,231,198,.72); display:flex; flex-direction:column; align-items:center; gap:.15rem; font-family:var(--px)}
nav button canvas{width:24px; height:24px}
nav button.on{color:#fbf3dd}
nav button.on canvas{filter:drop-shadow(0 0 0 #fff)}
nav button:active{transform:none; box-shadow:none}

.sec{font-family:var(--px); font-size:.92rem; color:var(--dim); display:flex; align-items:center; gap:.5rem}
.sec::after{content:""; flex:1; height:1px; background:var(--rule)}
.muted{color:var(--dim); font-size:.85rem}
.tiny{font-size:.74rem; color:var(--faint); letter-spacing:.05em}
.rowflex{display:flex; gap:.5rem; align-items:center}
.stack{display:flex; flex-direction:column; gap:.5rem}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:.5rem}

.alert{display:flex; gap:.6rem; align-items:flex-start; background:var(--parch); border:2px solid var(--rule); border-left:5px solid var(--warn); padding:.55rem .65rem}
.alert canvas{width:22px; height:22px; flex:none; margin-top:1px}
.alert h3{font-size:.95rem; margin-bottom:.1rem}
.alert p{margin:0; font-size:.8rem; color:var(--dim)}
.a-frost,.a-freeze{border-left-color:var(--cold)}
.a-heat,.a-khamsin{border-left-color:var(--bad)}
.a-rain,.a-firstrain{border-left-color:var(--good)}

.wx{display:grid; grid-template-columns:repeat(auto-fit,minmax(46px,1fr)); gap:2px}
.wxd{background:var(--parch); border:1px solid var(--rule); padding:.3rem .1rem; text-align:center}
.wxd b{display:block; font-family:var(--px); font-size:.66rem; color:var(--faint); font-weight:500}
.wxd .t{font-family:var(--px); font-size:.88rem}
.wxd.now{border-color:var(--ink); background:var(--paper)}

.plant{display:flex; gap:.6rem; align-items:center; background:var(--paper); border:2px solid var(--rule); padding:.45rem .55rem; cursor:pointer; text-align:left; width:100%; color:inherit; font-family:var(--body); font-size:15px; box-shadow:none}
.plant:active{transform:translate(1px,1px)}
.plant canvas{width:66px; height:66px; flex:none}
.plant .nm{font-family:var(--px); font-size:1rem; line-height:1.2}
.plant .meta{font-size:.73rem; color:var(--faint)}
.bar{height:9px; background:var(--sunk); border:1px solid var(--dim); margin-top:.25rem}
.bar i{display:block; height:100%; background:var(--good)}
.bar i.due{background:var(--bad)}
.bar i.near{background:var(--warn)}

.hero{background:var(--paper); border:2px solid var(--ink); box-shadow:3px 3px 0 0 rgba(43,29,18,.22); padding:.7rem; display:flex; flex-direction:column; gap:.6rem}
.hero .top{display:flex; gap:.7rem; align-items:center}
.hero canvas{width:110px; height:110px; flex:none}
.hero .nm{font-family:var(--px); font-size:1.35rem; line-height:1.05}
.hero .ar{font-size:.9rem; color:var(--dim)}

.gardengrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(94px,1fr)); gap:.45rem}
.tile{background:var(--paper); border:2px solid var(--rule); padding:.3rem .2rem .4rem; text-align:center; cursor:pointer; color:inherit; font-family:var(--body)}
.tile canvas{width:100%; max-width:88px; height:auto}
.tile .nm{font-family:var(--px); font-size:.82rem; line-height:1.15; word-break:break-word}
.tile.due{border-color:var(--bad); border-width:2px}

.sp{display:flex; gap:.55rem; align-items:center; background:var(--paper); border:2px solid var(--rule); padding:.4rem .5rem; cursor:pointer; width:100%; text-align:left; color:inherit; font-family:var(--body); font-size:15px}
.sp canvas{width:44px; height:44px; flex:none}
.sp .nm{font-family:var(--px); font-size:.96rem}
.sp .ar{font-size:.85rem; color:var(--dim)}
.sp .meta{font-size:.7rem; color:var(--faint)}

.chips{display:flex; flex-wrap:wrap; gap:.25rem}
.chip{font-family:var(--px); font-size:.72rem; background:var(--parch); border:1px solid var(--rule); padding:.1rem .35rem; color:var(--dim)}
.chip.on{background:var(--acc); color:var(--paper); border-color:var(--ink)}
.acts{display:grid; grid-template-columns:repeat(auto-fit,minmax(82px,1fr)); gap:.35rem}
.log{display:flex; gap:.5rem; font-size:.8rem; padding:.25rem 0; border-bottom:1px dotted var(--rule)}
.log .w{font-family:var(--px); color:var(--faint); flex:none; width:76px}
.tips li{margin-bottom:.3rem; font-size:.84rem; color:var(--ink2)}

/* bloom night takes the whole screen; nothing else matters that evening */
.bloomnight{background:var(--paper); border:2px solid var(--bloom); box-shadow:3px 3px 0 0 rgba(0,0,0,.35); padding:1rem .8rem; display:flex; flex-direction:column; align-items:center; gap:.6rem; position:relative; overflow:hidden}
.bloomnight .glow{position:absolute; left:50%; top:6px; width:230px; height:230px; margin-left:-115px; background:radial-gradient(circle, rgba(224,137,168,.28) 0%, rgba(224,137,168,.10) 46%, rgba(224,137,168,0) 72%)}
.bloomnight canvas{width:176px; height:176px; position:relative}
.bloomnight h3{font-size:1.35rem; color:var(--bloom); text-align:center}
.count{font-family:var(--px); font-size:1.5rem; color:var(--bloom)}

.months{display:grid; grid-template-columns:repeat(6,1fr); gap:.2rem}
.months button{padding:.3rem .1rem; font-size:.8rem; box-shadow:none; border-width:1px}
.months button.on{background:var(--acc); color:var(--paper); border-color:var(--ink)}

dialog{border:none; background:none; padding:0; max-width:100%; width:100%}
dialog::backdrop{background:rgba(43,29,18,.6)}
.sheet{background:var(--paper); border:3px solid var(--ink); padding:.9rem; max-height:86vh; overflow-y:auto; margin:auto; max-width:460px}
.empty{text-align:center; padding:1.4rem .8rem; color:var(--dim)}
.empty canvas{width:110px; height:110px; margin-bottom:.4rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>
</head>
<body>
<header id="hdr"></header>
<main id="view"></main>
<nav>
  <button data-tab="today" class="on"><canvas class="ic" width="22" height="22"></canvas>Today</button>
  <button data-tab="garden"><canvas class="ic" width="22" height="22"></canvas>Home</button>
  <button data-tab="almanac"><canvas class="ic" width="22" height="22"></canvas>Year</button>
  <button data-tab="more"><canvas class="ic" width="22" height="22"></canvas>More</button>
</nav>
<dialog id="dlg"><div class="sheet" id="sheet"></div></dialog>

<script src="./sprites.js"></script>
<script src="./icons.js"></script>
<script src="./species.js"></script>
<script src="./app.js"></script>
<script src="./ui.js"></script>
</body>
</html>
