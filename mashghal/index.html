  /* ---------------- the week screen ---------------- */

  function currentWeek() { return weekOf || weekStart(today()); }

  function renderWeek() {
    var from = currentWeek(), to = addDays(from, 6);
    var isNow = from === weekStart(today());
    var rows = standing(from);
    var total = state.spans.reduce(function (t, sp) { return t + minsIn(sp, from, to); }, 0);
    var susp = suspenseMins(from, to);

    var h = pageHead("The week",
      esc(dayName(from) + " " + from + " to " + to),
      '<div class="tools">' +
      '<button class="btn" data-act="week-prev">‹ earlier</button>' +
      (isNow ? "" : '<button class="btn" data-act="week-now">this week</button>') +
      '<button class="btn" data-act="week-next" ' + (isNow ? "disabled" : "") + '>later ›</button>' +
      '<button class="btn" data-act="report-new">Report</button>' +
      '<button class="btn" data-act="span-add">Add time</button></div>');

    h += '<div class="tiles">' +
      tile("Counted", fmtMins(total), "across " + rows.length + " claimants") +
      tile("Not said", fmtMins(susp), susp ? "waiting to be attributed" : "nothing unattributed", susp ? "loss" : "") +
      "</div>";

    if (susp) {
      h += '<div class="card" style="border-left:2px solid var(--oxide)"><h3>Time at no bench</h3>' +
        '<p class="hint" style="margin:0.2rem 0 0.7rem">' + fmtMins(susp) +
        " this week is at no bench. It is not counted against anyone and it will not be guessed at — say whose it was.</p>" +
        state.spans.filter(function (sp) { return !sp.benchId && minsIn(sp, from, to) > 0; })
          .map(function (sp) { return spanRow(sp, true); }).join("") + "</div>";
    }

    h += '<div class="sect">Where the week went</div>';
    if (!rows.length) {
      h += '<p class="empty">No claimants yet — add one in Kit and the week has something to measure against.</p>';
    } else {
      h += '<div class="card">' + rows.map(function (r) {
        var pct = r.owed ? Math.min(100, Math.round(r.got / r.owed * 100)) : 0;
        var fig = r.unit === "d" ? r.got + (r.owed ? " of " + r.owed : "") + (r.got === 1 && !r.owed ? " day" : " days")
                                 : fmtMins(r.got) + (r.owed ? " of " + fmtMins(r.owed) : "");
        var note;
        if (!r.owed) note = "on demand — nothing is owed";
        else if (r.short) note = (r.floor ? "under its floor by " : "short by ") + amountWords(r.short, r.unit);
        else note = r.floor ? "over its floor" : "met";
        var beh = behindBy(r.c);
        return '<div class="wk"><span class="wk-dot" style="background:' + esc(r.c.colour) + '"></span>' +
          '<div class="wk-main"><div class="wk-top"><b>' + esc(r.c.name) + "</b><span>" + esc(fig) + "</span></div>" +
          '<div class="meter"><div class="' + (r.short ? "meter-pace" : "meter-fill") +
          '" style="width:' + pct + '%"></div></div>' +
          '<small>' + esc(note) +
          (beh && beh.amount ? " · <span style=\"color:var(--oxide)\">" + esc(amountWords(beh.amount, beh.unit)) +
            " behind over " + beh.weeks + (beh.weeks === 1 ? " earlier week" : " earlier weeks") + "</span>" : "") +
          "</small></div></div>";
      }).join("") + "</div>";
      h += '<p class="hint">A claimant behind is stated on its own. The app never says one claimant took the hours another lost — it cannot know that, and a plausible wrong reason is worse than none.</p>';
    }

    h += '<div class="sect">The days</div><div class="card">';
    for (var i = 0; i < 7; i++) {
      var day = addDays(from, i);
      var todays = state.spans.filter(function (sp) { return minsIn(sp, day, day) > 0; })
        .sort(function (a, b) { return a.startedAt < b.startedAt ? -1 : 1; });
      var dayMins = todays.reduce(function (t, sp) { return t + minsIn(sp, day, day); }, 0);
      h += '<div class="dayhead"><b>' + esc(dayName(day, "long")) + "</b><span>" +
        (dayMins ? fmtMins(dayMins) : "nothing") + "</span>" +
        '<button class="btn quiet" data-act="span-add" data-id="' + day + '">+</button></div>';
      h += todays.length ? todays.map(function (sp) { return spanRow(sp, false); }).join("")
                         : '<p class="empty" style="margin:0 0 0.5rem">—</p>';
    }
    h += "</div>";
    return h;
  }

  function spanRow(sp, flag) {
    var open = !sp.endedAt;
    return '<div class="row"><span class="pill ' + (sp.benchId ? "p-dim" : "p-oxide") + '">' +
      (open ? "open" : fmtMins(minsBetween(sp.startedAt, sp.endedAt))) + "</span>" +
      '<span class="grow"><b>' + esc(sp.benchId ? benchLabel(sp.benchId) : "Not said yet") + "</b><small>" +
      esc(String(sp.startedAt).slice(11) + (open ? " — still open" : " – " + String(sp.endedAt).slice(11)) +
          (stampDay(sp.startedAt) !== stampDay(sp.endedAt || sp.startedAt) ? " (crosses midnight)" : "") +
          (sp.note ? " · " + sp.note : "")) + "</small></span>" +
      '<span class="tools"><button class="btn quiet" data-act="span-edit" data-id="' + sp.id + '">' +
      (flag ? "Say whose" : "Edit") + "</button>" +
      '<button class="btn quiet danger" data-act="span-del" data-id="' + sp.id + '">×</button></span></div>';
  }

  function spanBenchOpts() {
    return [{ value: "", label: "Not said yet — goes to suspense" }].concat(
      opts(state.benches, function (b) { return benchLabel(b.id); }));
  }
  function timeOk(v) { return /^([01]\d|2[0-3]):[0-5]\d$/.test(String(v).trim()); }
  function hhmm(v) { v = String(v).trim(); return num(v.slice(0, 2)) * 60 + num(v.slice(3, 5)); }

  function spanDialog(sp, day) {
    var isNew = !sp;
    openModal({
      title: isNew ? "Add time" : "Edit time",
      confirmLabel: isNew ? "Add" : "Save",
      message: isNew ? "For a stretch you did not tap in for. Nothing here is guessed — if you do not know whose it was, leave the bench unsaid." : "",
      fields: [
        { key: "day", label: "Day", type: "text", value: sp ? stampDay(sp.startedAt) : (day || today()),
          span: true, hint: "YYYY-MM-DD" },
        { key: "from", label: "From", type: "text", value: sp ? String(sp.startedAt).slice(11) : "09:00" },
        { key: "to", label: "To", type: "text", value: sp && sp.endedAt ? String(sp.endedAt).slice(11) : "17:00" },
        { key: "benchId", label: "Bench", type: "select", span: true, options: spanBenchOpts(),
          value: sp ? sp.benchId : "" },
        { key: "note", label: "Note", type: "text", span: true, value: sp ? (sp.note || "") : "" }
      ],
      validate: function (v) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(v.day.trim())) return "A day must be YYYY-MM-DD.";
        if (!timeOk(v.from) || !timeOk(v.to)) return "A time must be HH:MM on the 24-hour clock.";
        if (hhmm(v.to) <= hhmm(v.from)) return "It has to end after it started.";
        return null;
      },
      onConfirm: function (v) {
        go(function () {
          var t = sp;
          if (!t) { t = { id: uid(), source: "repair" }; state.spans.push(t); }
          t.startedAt = v.day.trim() + "T" + v.from.trim();
          t.endedAt = v.day.trim() + "T" + v.to.trim();
          t.benchId = v.benchId;
          t.note = v.note.trim();
        });
      }
    });
  }

  function pickBench(title, onPick) {
    if (!live(state.benches).length) { toast("Add a bench in Kit first."); return; }
    openModal({
      title: title, confirmLabel: "Go",
      fields: [{ key: "benchId", label: "Bench", type: "select", span: true,
        options: spanBenchOpts(), value: live(state.benches)[0].id }],
      onConfirm: function (v) { onPick(v.benchId); }
    });
  }


  /* ================= the written report ================= */

  // For a meeting, or an email, or a funder. Two rules keep it worth trusting.
  // It computes NOTHING of its own: every figure comes from the same function
  // the screen uses, or the report and the app will eventually disagree and
  // only one of them will be right. And it states its own basis and its own
  // limits — how many weeks it rests on, what is unattributed, what is still
  // open — because a report that hides how thin its data is, is worse than no
  // report at all.
  var reportOn = null;   // {claimantId, from, to} — view state, never saved

  function wordDate(d) {
    return parseISO(d).toLocaleDateString(undefined, { day: "numeric", month: "long", year: "numeric" });
  }
  function pad(s, n) { s = String(s); return s + new Array(Math.max(1, n - s.length + 1)).join(" "); }

  function weeksBetween(from, to) {
    var out = [], w = weekStart(from), guard = 0;
    while (w <= to && guard++ < 400) { out.push(w); w = addDays(w, 7); }
    return out;
  }

  function boardsForClaimant(claimantId) {
    return boards().filter(function (b) {
      if (!claimantId) return true;
      var bn = byId(state.benches, b.benchId);
      return bn && bn.claimantId === claimantId;
    });
  }

  function buildReport(o) {
    var c = o.claimantId ? byId(state.claimants, o.claimantId) : null;
    var from = o.from, to = o.to;
    var L = [];
    L.push((c ? c.name : "Every claimant") + " — " + wordDate(from) + " to " + wordDate(to));
    L.push("");

    /* ---- hours, straight from the same sums the week screen reads ---- */
    var weeks = weeksBetween(from, to);
    var owed = c ? owedOf(c) : { unit: "h", owed: 0 };
    var rows = weeks.map(function (w) {
      var wTo = addDays(w, 6);
      var lo = w < from ? from : w, hi = wTo > to ? to : wTo;
      var got = c
        ? (owed.unit === "d" ? daysFor(c.id, lo, hi) : minsFor(c.id, lo, hi))
        : state.spans.reduce(function (t, sp) { return t + minsIn(sp, lo, hi); }, 0);
      var whole = (w >= from && wTo <= to);
      // Any entry at all, for anyone, means the week was lived in the app and a
      // nought for this claimant is a real nought. No entry anywhere means the
      // week is simply unrecorded, and it is not measured against anything.
      var lived = state.spans.some(function (sp) { return minsIn(sp, lo, hi) > 0; });
      return { w: w, lo: lo, hi: hi, got: got, whole: whole, lived: lived };
    });
    var withEntries = rows.filter(function (r) { return r.got > 0; });
    var totalGot = rows.reduce(function (t, r) { return t + r.got; }, 0);

    L.push("HOURS");
    if (!withEntries.length) {
      L.push("  Nothing was logged in this period, so every figure below that depends on hours is absent rather than nought. The difference matters, and the app will not print a nought it cannot stand behind.");
    } else {
      L.push("  " + amountWords(totalGot, owed.unit) + " across " +
             withEntries.length + (withEntries.length === 1 ? " week" : " weeks") +
             " with entries, of " + weeks.length + " in the period.");
      L.push("");
      rows.forEach(function (r) {
        var line = "    " + pad("w/c " + niceDate(r.w), 18) +
          pad(r.lived ? amountWords(r.got, owed.unit) : "—", 12);
        if (!r.lived) line += "nothing recorded that week";
        else if (owed.owed && r.whole) {
          var d = owed.owed - r.got;
          line += d > 0 ? "short by " + amountWords(d, owed.unit)
                        : (d < 0 ? "over by " + amountWords(-d, owed.unit) : "met");
        } else if (owed.owed) {
          line += "part week, not measured";
        }
        L.push(line.replace(/\s+$/, ""));
      });
      if (owed.owed) {
        var full = rows.filter(function (r) { return r.whole && r.lived; });
        var behind = full.reduce(function (t, r) { return t + Math.max(0, owed.owed - r.got); }, 0);
        L.push("");
        if (!full.length) {
          L.push("  No whole week in this period has an entry, so nothing here is measured against the " + amountWords(owed.owed, owed.unit) + " a week.");
        } else {
          L.push("  Against " + amountWords(owed.owed, owed.unit) + " a week, the " + full.length +
                 (full.length === 1 ? " whole week" : " whole weeks") + " with entries fall short by " +
                 amountWords(behind, owed.unit) + " in total. Weeks with nothing recorded are left out of that figure rather than counted as noughts.");
        }
      }
    }
    L.push("");

    /* ---- what the time went on: the notes, and nothing invented ---- */
    var notes = [];
    state.spans.forEach(function (sp) {
      if (!sp.note) return;
      if (minsIn(sp, from, to) <= 0) return;
      if (c && claimantOfSpan(sp) !== c.id) return;
      if (notes.indexOf(sp.note) < 0) notes.push(sp.note);
    });
    L.push("WHAT THE TIME WENT ON");
    L.push(notes.length ? "  " + notes.join("; ") + "."
                        : "  No stretch in this period carries a note, so this section is empty rather than guessed at.");
    L.push("");

    /* ---- the work itself ---- */
    var bs = boardsForClaimant(c ? c.id : "");
    var runs = bs.filter(function (b) { return b.kind === "run"; });
    L.push("THE WORK");
    if (!runs.length) {
      L.push("  No runs are filed against " + (c ? "this claimant" : "anything") + ".");
    } else {
      runs.forEach(function (b) {
        var p = runProgress(b);
        var act = activeNodes(b);
        var late = act.filter(function (n) { return nodeState(b, n) === "over"; });
        L.push("  " + b.name);
        L.push("    " + (b.closedOn ? "closed " + niceDate(b.closedOn) : "open") +
               " · " + p.done + " of " + p.total + " steps done" +
               (late.length ? " · " + late.length + " late" : ""));
        act.forEach(function (n) {
          var who = recipientsOf(b, n).map(function (t) { return t.label; }).join(", ");
          var st = nodeState(b, n);
          L.push("      " + pad(n.label, 34) +
                 (st === "over" ? "late by " + overdueBy(n) + "d"
                  : st === "waiting" ? "waiting " + daysWaiting(n) + "d"
                  : "in hand") +
                 (who ? " — with " + who : ""));
        });
        var uf = unfiled(b);
        if (!b.closedOn && !act.length && uf.length) {
          L.push("      not filed: " + uf.map(function (n) { return n.label; }).join(", "));
        }
      });
    }
    L.push("");

    /* ---- what is owed in the other direction ---- */
    var waits = [];
    runs.forEach(function (b) {
      if (b.closedOn) return;
      activeNodes(b).forEach(function (n) {
        if (n.act !== "send" && n.act !== "watch") return;
        var who = recipientsOf(b, n).map(function (t) { return t.label; }).join(", ");
        waits.push({ b: b, n: n, who: who });
      });
    });
    function waitLine(x, lead) {
      return "  " + pad(lead, 26) + x.n.label + " — " + daysWaiting(x.n) + "d" +
             (overdueBy(x.n) > 0 ? ", " + overdueBy(x.n) + "d past its chase" : "");
    }
    var onPeople = waits.filter(function (x) { return x.who; });
    var onWorld  = waits.filter(function (x) { return !x.who; });
    L.push("WAITING ON SOMEONE ELSE");
    if (!onPeople.length) L.push("  Nobody.");
    else onPeople.forEach(function (x) { L.push(waitLine(x, x.who)); });
    L.push("");
    if (onWorld.length) {
      L.push("WAITING, WITH NOBODY NAMED");
      onWorld.forEach(function (x) { L.push(waitLine(x, x.b.name)); });
      L.push("");
    }

    /* ---- and what all of it rests on ---- */
    var susp = suspenseMins(from, to);
    var openNow = openSpan();
    L.push("WHAT THIS RESTS ON");
    L.push("  " + withEntries.length + " of " + weeks.length +
           (weeks.length === 1 ? " week" : " weeks") + " in this period have any entry at all.");
    if (susp) {
      L.push("  " + fmtMins(susp) + " in this period is at no bench. It is excluded from every figure above rather than being attributed to anyone.");
    }
    if (openNow) {
      L.push("  One stretch is still open and is counted nowhere until it ends.");
    }
    if (rows.some(function (r) { return !r.whole; })) {
      L.push("  The first and last weeks are partial, so they are summed but not measured against a weekly figure.");
    }
    L.push("  Every figure is summed from logged stretches. Nothing is estimated, averaged or filled in.");
    L.push("");
    L.push("Written " + wordDate(today()) + " by Mashghal, from this device only.");
    return L.join("\n");
  }

  function renderReport() {
    var o = reportOn;
    var c = o.claimantId ? byId(state.claimants, o.claimantId) : null;
    var text = buildReport(o);
    var h = pageHead("Report", esc((c ? c.name : "Every claimant") + " · " + o.from + " to " + o.to),
      '<div class="tools">' +
      '<button class="btn" data-act="report-back">Back to the week</button>' +
      '<button class="btn" data-act="report-copy">Copy</button>' +
      '<button class="btn" data-act="report-save">Save as text</button>' +
      '<button class="btn" data-act="report-new">Change the range</button></div>');
    h += '<pre class="report" id="reportText">' + esc(text) + "</pre>";
    h += '<p class="hint">Read it before you send it. Every figure here comes from the same function the screens use, so if a number looks wrong the screen will be wrong in the same way — which is the point.</p>';
    return h;
  }

  /* ================= upkeep and the things it protects ================= */

  // A cadence is not a task and has no due date. It runs every so often since
  // the last time it was done, so falling behind never compounds into a pile of
  // missed occurrences — there is one of each, and it is however far past.
  var PLACES = { desk: "At the desk", away: "Away from the desk", out: "Out of the house" };
  // Reads an added place as readily as a built-in one.
  function placeLabel(k) { return k ? vocabLabel("places", k) : "Anywhere"; }
  var ASSET_KINDS = { laptop: "Laptop", phone: "Phone", audio: "Audio", other: "Other" };
  var placeFilter = "";   // view state, never saved

  function cadenceState(cd) {
    if (!cd.lastDoneOn) return { never: true, over: 0, since: 0, tone: "p-dim", word: "never done" };
    var since = daysBetween(cd.lastDoneOn, today());
    var over = since - num(cd.everyDays);
    if (over > 0) return { over: over, since: since, tone: "p-oxide", word: over + "d past" };
    if (over > -3) return { over: over, since: since, tone: "p-dim", word: "due in " + (-over) + "d" };
    return { over: over, since: since, tone: "p-grey", word: (-over) + "d to go" };
  }
  // One sentence, in this order: what it guards, where it is doable, when it
  // was last done. What it protects comes first because that is the reason to
  // bother — a stale backup is a threat to the work behind it, not a chore.
  function upkeepSays(x) {
    var cd = x.cd, p = protects(cd), bits = [];
    if (p) bits.push("Keeps " + p + " safe");
    bits.push((p ? "e" : "E") + "very " + cd.everyDays + " days, " +
              String(placeLabel(cd.place)).toLowerCase());
    bits.push(cd.lastDoneOn ? "last done " + niceDate(cd.lastDoneOn) : "never done yet");
    return bits.join(" · ");
  }

  function protects(cd) {
    if (cd.protectsAssetId) return nameOf(state.assets, cd.protectsAssetId, "thing");
    if (cd.protectsBenchId) return benchLabel(cd.protectsBenchId);
    return "";
  }
  function upkeep() {
    return live(state.cadences).map(function (cd) {
      return { cd: cd, st: cadenceState(cd) };
    }).sort(function (a, b) {
      var ra = a.st.never ? 1e6 : a.st.over, rb = b.st.never ? 1e6 : b.st.over;
      return rb - ra;
    });
  }
  function upkeepLate() {
    return upkeep().filter(function (x) { return x.st.never || x.st.over > 0; });
  }

  function upkeepCard() {

        '<div class="acts"><button class="btn' + (x.st.over > 0 ? " loud" : " quiet") +
        '" data-act="cadence-done" data-id="' + x.cd.id + '">Done now</button>' +

    }).join("") + "</div>"
      : '<p class="empty">Nothing to do ' + esc(placeFilter ? String(placeLabel(placeFilter)).toLowerCase() : "") + ".</p>";
    return h;
  }

  /* ================= sync ================= */

  // The book is encrypted on this device and only then sent. A secret gist is
  // unlisted, not private — anyone holding the link can read it — so the
  // encryption is the whole of the privacy and not a belt over braces.
  //
  // Nothing here ever reaches `state`: the token and the passphrase live in
  // their own storage keys, so a backup of the book carries neither.
  var SYNC_LISTS = ["jobs", "kinds", "claimants", "modes", "benches", "boards", "spans", "assets", "cadences"];
  var TOK_KEY = "mashghal.sync.token";
  var PASS_KEY = "mashghal.sync.pass";
  var DEV_KEY = "mashghal.sync.device";
  var GIST_FILE = "mashghal.json";
  var DIGEST_FILE = "digest.json";
  var snap = {};          // id -> the record as last stamped
  var syncing = false;

  function borrowed() { return !!(state.settings.sync && state.settings.sync.borrowed); }
  function vault() {
    try { return borrowed() ? window.sessionStorage : window.localStorage; }
    catch (e) { return null; }
  }
  function secret(k) { try { var v = vault(); return v ? (v.getItem(k) || "") : ""; } catch (e) { return ""; } }
  function setSecret(k, v) { try { var s = vault(); if (s) s.setItem(k, v); } catch (e) {} }
  function dropSecrets() {
    [window.localStorage, window.sessionStorage].forEach(function (s) {
      try { [TOK_KEY, PASS_KEY].forEach(function (k) { s.removeItem(k); }); } catch (e) {}
    });
  }
  function deviceId() {
    var id = "";
    try { id = localStorage.getItem(DEV_KEY) || ""; } catch (e) {}
    if (!id) { id = uid(); try { localStorage.setItem(DEV_KEY, id); } catch (e) {} }
    return id;
  }
  function syncCfg() {
    if (!state.settings.sync) {
      state.settings.sync = { mode: "none", gistId: "", deviceName: "", borrowed: false, lastPulledAt: "" };
    }
    return state.settings.sync;
  }
  function syncOn() { return syncCfg().mode === "gist" && syncCfg().gistId && secret(TOK_KEY) && secret(PASS_KEY); }

  /* ---------------- stamping and merging ---------------- */

  function stampNow() {
    var d = new Date();
    return d.toISOString();
  }
  function bare(r) {
    var o = {}, k;
    for (k in r) { if (k !== "updatedAt") o[k] = r[k]; }
    return JSON.stringify(o);
  }
  // Which records changed since the last pass, so a merge can be per record
  // rather than per file. Whole-file last-write-wins eventually eats a day of
  // spans logged on the phone, and it does it silently.
  function stampRecords() {
    var now = stampNow(), seen = {};
    SYNC_LISTS.forEach(function (k) {
      (state[k] || []).forEach(function (r) {
        if (!r || !r.id) return;
        seen[r.id] = 1;
        var j = bare(r);
        if (snap[r.id] !== j) { r.updatedAt = now; snap[r.id] = j; }
      });
    });
    Object.keys(snap).forEach(function (id) {
      if (!seen[id]) { state.tombstones[id] = now; delete snap[id]; }
    });
  }
  // A record that predates sync has no stamp and would lose every comparison,
  // so it is given one the first time it is seen rather than being treated as
  // infinitely old.
  function ensureStamps() {
    var now = stampNow(), touched = false;
    SYNC_LISTS.forEach(function (k) {
      (state[k] || []).forEach(function (r) {
        if (r && r.id && !r.updatedAt) { r.updatedAt = now; touched = true; }
        if (r && r.id) snap[r.id] = bare(r);
      });
    });
    return touched;
  }

  function mergeList(mine, theirs, tomb) {
    var pick = {};
    mine.concat(theirs).forEach(function (r) {
      if (!r || !r.id) return;
      var cur = pick[r.id];
      if (!cur || (r.updatedAt || "") > (cur.updatedAt || "")) pick[r.id] = r;
    });
    return Object.keys(pick).map(function (id) { return pick[id]; })
      .filter(function (r) { return !(tomb[r.id] && tomb[r.id] > (r.updatedAt || "")); });
  }

  // What a mailer may see. Numbers only — no label, no name, no note. A file
  // in an unlisted gist should be able to leak without telling anyone anything
  // about the work, so it says how much is late and not what.
  function digestPayload() {
    var late = dues().filter(function (d) { return d.st === "over"; });
    var worst = late.reduce(function (m, d) { return Math.max(m, d.over); }, 0);
    return {
      v: 1, at: stampNow(),
      late: late.length, worstDaysPast: worst,
      waiting: dues().length,
      unfiled: stuck().length,
      upkeepPast: upkeepLate().length
    };
  }

  function payload() {
    var o = { v: 1, tombstones: state.tombstones, forgotten: state.forgotten, devices: state.devices };
    SYNC_LISTS.forEach(function (k) { o[k] = state[k] || []; });
    return o;
  }
  // Merge is symmetrical and loses nothing it can avoid losing: a record that
  // exists on one side only survives unless a tombstone newer than it says it
  // was deleted on purpose.
  function mergeIn(remote) {
    var tomb = {};
    [state.tombstones, remote.tombstones || {}].forEach(function (src) {
      Object.keys(src).forEach(function (id) {
        if (!tomb[id] || src[id] > tomb[id]) tomb[id] = src[id];
      });
    });
    var counts = { added: 0, updated: 0, removed: 0 };
    SYNC_LISTS.forEach(function (k) {
      var before = {};
      (state[k] || []).forEach(function (r) { before[r.id] = r.updatedAt || ""; });
      var merged = mergeList(state[k] || [], remote[k] || [], tomb);
      merged.forEach(function (r) {
        if (before[r.id] === undefined) counts.added++;
        else if (before[r.id] !== (r.updatedAt || "")) counts.updated++;
      });
      counts.removed += Object.keys(before).length - merged.filter(function (r) { return before[r.id] !== undefined; }).length;
      state[k] = merged;
    });
    state.tombstones = tomb;
    Object.keys(remote.forgotten || {}).forEach(function (id) {
      if (!state.forgotten[id]) state.forgotten[id] = remote.forgotten[id];
    });
    var rd = remote.devices || {};
    Object.keys(rd).forEach(function (id) {
      if (!state.devices[id] || rd[id].at > state.devices[id].at) state.devices[id] = rd[id];
    });
    return counts;
  }

  /* ---------------- the sealing ---------------- */

  function b64(buf) {
    var a = new Uint8Array(buf), s = "";
    for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]);
    return btoa(s);
  }
  function unb64(s) {
    var b = atob(s), a = new Uint8Array(b.length);
    for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i);
    return a;
  }
  function subtle() {
    return (window.crypto && window.crypto.subtle) ? window.crypto.subtle : null;
  }
  function deriveKey(pass, salt) {
    var enc = new TextEncoder();
    return subtle().importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"])
      .then(function (base) {
        return subtle().deriveKey(
          { name: "PBKDF2", salt: salt, iterations: 250000, hash: "SHA-256" },
          base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
      });
  }
  function seal(text, pass) {
    var salt = crypto.getRandomValues(new Uint8Array(16));
    var iv = crypto.getRandomValues(new Uint8Array(12));
    return deriveKey(pass, salt).then(function (key) {
      return subtle().encrypt({ name: "AES-GCM", iv: iv }, key, new TextEncoder().encode(text));
    }).then(function (ct) {
      return JSON.stringify({ v: 1, kdf: "PBKDF2-SHA256", it: 250000,
                              salt: b64(salt), iv: b64(iv), ct: b64(ct) }, null, 1);
    });
  }
  function unseal(blob, pass) {
    var o;
    try { o = JSON.parse(blob); } catch (e) { return Promise.reject(new Error("That is not a Mashghal file.")); }
    if (!o || !o.ct || !o.salt || !o.iv) return Promise.reject(new Error("That file is not sealed the way this app seals things."));
    return deriveKey(pass, unb64(o.salt)).then(function (key) {
      return subtle().decrypt({ name: "AES-GCM", iv: unb64(o.iv) }, key, unb64(o.ct));
    }).then(function (pt) {
      return JSON.parse(new TextDecoder().decode(pt));
    }, function () {
      throw new Error("Wrong passphrase — nothing was changed.");
    });
  }

  /* ---------------- the gist ---------------- */

  function ghFetch(url, token, opts) {
    opts = opts || {};
    opts.headers = { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json" };
    if (opts.body) opts.headers["Content-Type"] = "application/json";
    return fetch(url, opts).then(function (res) {
      if (res.status === 401 || res.status === 403) {
        throw new Error("GitHub refused the token. It may have expired, or it may not carry gist access.");
      }
      if (res.status === 404) throw new Error("That gist was not found by this token.");
      if (!res.ok) throw new Error("GitHub answered " + res.status + ".");
      return res.json();
    }, function (e) {
      if (e instanceof TypeError) throw new Error("No answer from GitHub — you may be offline.");
      throw e;
    });
  }
  function gistRead(id, token) {
    return ghFetch("https://api.github.com/gists/" + id, token).then(function (g) {
      var f = g.files && g.files[GIST_FILE];
      if (!f) throw new Error("That gist has no " + GIST_FILE + " in it.");
      if (f.truncated && f.raw_url) return fetch(f.raw_url).then(function (r) { return r.text(); });
      return f.content;
    });
  }
  function gistWrite(id, token, content) {
    var files = {};
    files[GIST_FILE] = { content: content };
    files[DIGEST_FILE] = { content: JSON.stringify(digestPayload(), null, 1) };
    return ghFetch("https://api.github.com/gists/" + id, token,
      { method: "PATCH", body: JSON.stringify({ files: files }) });
  }
  function gistCreate(token, content) {
    var files = {}; files[GIST_FILE] = { content: content };
    return ghFetch("https://api.github.com/gists", token, {
      method: "POST",
      body: JSON.stringify({ description: "Mashghal — sealed", "public": false, files: files })
    });
  }

  /* ---------------- the act ---------------- */

  function noteDevice() {
    state.devices[deviceId()] = {
      name: syncCfg().deviceName || "unnamed device",
      at: stampNow(),
      borrowed: borrowed()
    };
  }

  // Pull, merge, push — one act, because pushing without having pulled is how
  // one device quietly overwrites another's day.
  function syncNow(quiet) {
    if (syncing) return;
    if (!syncOn()) { toast("Sync is not set up on this device."); return; }
    if (!subtle()) { toast("This browser has no Web Crypto, so nothing can be sealed."); return; }
    syncing = true;
    var cfg = syncCfg(), tok = secret(TOK_KEY), pass = secret(PASS_KEY);
    if (!quiet) toast("Syncing…");
    stampRecords();
    gistRead(cfg.gistId, tok)
      .then(function (blob) {
        if (!String(blob || "").trim()) return null;
        return unseal(blob, pass);
      })
      .then(function (remote) {
        var counts = remote ? mergeIn(remote) : { added: 0, updated: 0, removed: 0 };
        noteDevice();
        stampRecords();
        cfg.lastPulledAt = stampNow();
        save();
        return seal(JSON.stringify(payload()), pass).then(function (sealed) {
          return gistWrite(cfg.gistId, tok, sealed);
        }).then(function () { return counts; });
      })
      .then(function (counts) {
        syncing = false;
        render();
        var bits = [];
        if (counts.added) bits.push(counts.added + " new");
        if (counts.updated) bits.push(counts.updated + " updated");
        toast(bits.length ? "Synced — " + bits.join(", ") : "Synced — nothing had changed elsewhere");
      })
      .catch(function (e) {
        syncing = false;
        syncFail = e && e.message ? e.message : "it failed";
        render();
        if (!quiet) toast(e && e.message ? e.message : "Sync failed, and nothing was changed.");
      });
  }

  /* ---------------- syncing without being asked ----------------
     It used to be a button, and the button is exactly the failure: a board
     written on the phone stayed on the phone, because nobody pressed anything.
     "Sync is something you press" was a UX choice and it cost real work.

     What is NOT relaxed is the merge. Every automatic pass is the same
     pull-merge-push as the button, so the rule that matters — never push
     without having pulled, or you overwrite someone's day — is untouched.
     Only the trigger changed.

     Three triggers, because they answer different failures:
       a change, debounced, so an edit reaches the other device by itself;
       a heartbeat, so the OTHER device's edits reach this one while it sits open;
       coming back to the tab or to the network, which is the moment a phone
       picks up everything it missed in a pocket. */
  var AUTO_DEBOUNCE = 4000;    // after the last edit, not the first
  var AUTO_HEARTBEAT = 90000;  // ~30 calls an hour, against a 5000/hr budget
  var autoTimer = null, beatTimer = null, syncFail = "", lastAuto = 0;

  function autoOn() { return syncOn() && !syncing; }

  function nudgeSync(why) {
    if (!autoOn()) return;
    if (document.hidden) return;   // a hidden tab has nothing new to say
    if (Date.now() - lastAuto < 2500) return;
    lastAuto = Date.now();
    syncFail = "";
    syncNow(true);                 // quiet: no toast unless it actually fails
  }

  // Debounced, so typing a name does not fire a request per keystroke.
  function syncSoon() {
    if (!syncOn()) return;
    if (autoTimer) clearTimeout(autoTimer);
    autoTimer = setTimeout(function () { autoTimer = null; nudgeSync("edit"); }, AUTO_DEBOUNCE);
  }

  function startHeartbeat() {
    if (beatTimer) clearInterval(beatTimer);
    beatTimer = setInterval(function () { nudgeSync("heartbeat"); }, AUTO_HEARTBEAT);
  }

  function wireAutoSync() {
    startHeartbeat();
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) nudgeSync("back to the tab");
    });
    window.addEventListener("online", function () { nudgeSync("back online"); });
    // A last push on the way out, best effort — the tab may not get to finish.
    window.addEventListener("pagehide", function () {
      if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; nudgeSync("leaving"); }
    });
  }

  // What the screen says about it, in words rather than a spinner.
  function syncWords() {
    var cfg = syncCfg();
    if (!syncOn()) return "Off — this device keeps its own book";
    if (syncing) return "Syncing now…";
    if (!navigator.onLine) return "Offline — it will catch up by itself";
    if (syncFail) return "Last attempt failed: " + syncFail + ". It will try again.";
    if (!cfg.lastPulledAt) return "Set up, but it has not run yet";
    var mins = Math.round((Date.now() - new Date(cfg.lastPulledAt).getTime()) / 60000);
    if (mins < 1) return "Up to date, a moment ago";
    if (mins === 1) return "Up to date, a minute ago";
    if (mins < 60) return "Up to date, " + mins + " minutes ago";
    return "Last synced " + Math.round(mins / 60) + "h ago";
  }

  function syncSetupDialog() {
    var cfg = syncCfg();
    openModal({
      title: "Set up sync", wide: true, confirmLabel: "Save",
      message: "Your book is sealed on this device with the passphrase and only then sent, so GitHub holds characters it cannot read. " +
        "A <b>secret</b> gist is unlisted rather than private — anyone with the link can fetch it — which is why the sealing is the whole of the privacy. " +
        "Use a fine-grained token with gist access and nothing else.",
      fields: [
        { key: "token", label: "GitHub token", type: "text", span: true, value: secret(TOK_KEY),
          placeholder: "github_pat_…", hint: "Stored on this device only, never in a backup." },
        { key: "pass", label: "Passphrase", type: "text", span: true, value: secret(PASS_KEY),
          hint: "Lose this and the gist is unreadable. There is no recovery, by design." },
        { key: "gistId", label: "Gist id", type: "text", span: true, value: cfg.gistId,
          hint: "Leave blank on the first device and one will be made for you." },
        { key: "deviceName", label: "Call this device", type: "text", span: true,
          value: cfg.deviceName, placeholder: "Legion" },
        { key: "borrowed", label: "Is this your own machine?", type: "select", span: true,
          options: [{ value: "no", label: "Yes — remember it here" },
                    { value: "yes", label: "No — forget everything when I close the tab" }],
          value: cfg.borrowed ? "yes" : "no" }
      ],
      validate: function (v) {
        if (!v.token.trim()) return "A token is needed to reach the gist.";
        if (v.pass.trim().length < 8) return "Use a passphrase of at least eight characters.";
        if (!v.deviceName.trim()) return "Name the device, so you can tell from your phone which laptop is still signed in.";
        return null;
      },
      onConfirm: function (v) {
        cfg.borrowed = v.borrowed === "yes";
        cfg.deviceName = v.deviceName.trim();
        cfg.mode = "gist";
        setSecret(TOK_KEY, v.token.trim());
        setSecret(PASS_KEY, v.pass.trim());
        if (cfg.borrowed) armBorrowed();
        if (v.gistId.trim()) {
          cfg.gistId = v.gistId.trim();
          save(); render();
          syncNow();
          return;
        }
        toast("Making a gist…");
        seal(JSON.stringify(payload()), v.pass.trim())
          .then(function (sealed) { return gistCreate(v.token.trim(), sealed); })
          .then(function (g) {
            cfg.gistId = g.id;
            noteDevice(); save(); render();
            toast("Sync is on. The gist id is " + g.id);
          })
          .catch(function (e) {
            cfg.mode = "none"; save(); render();
            toast(e && e.message ? e.message : "Could not make the gist.");
          });
      }
    });
  }

  // On a machine that is not yours, nothing should outlive the tab.
  function armBorrowed() {
    if (armBorrowed.done) return;
    armBorrowed.done = true;
    window.addEventListener("pagehide", function () {
      if (!borrowed()) return;
      try { localStorage.removeItem(APP.storeKey); localStorage.removeItem(DEV_KEY); } catch (e) {}
      dropSecrets();
    });
  }

  /* ================= backups that happen without being asked =================

     Sync and a backup are different jobs and one does not cover the other.
     Sync propagates the CURRENT state — so a mistake propagates too, promptly
     and to every device. A backup preserves an EARLIER one, which is the only
     thing that helps after a bad delete or a sample loaded over a real book.

     Kept in IndexedDB rather than localStorage, because a rolling set of whole
     books would crowd out the book itself and browsers scope that quota to the
     site, which five sibling apps share. Ten are kept: roughly a fortnight at
     one a day, and small — a large book is a few hundred KB of text.

     It is still not an off-device copy, and the screen says so. A dropped
     laptop takes these with it. */
  /* ================= what a thing actually holds =================

     A photo node was a label and nothing else — the app said "frame 1962-04"
     and held no frame. Pictures live in IndexedDB, the same reasoning as
     Coffer's receipts: one phone photo is larger than the entire written record,
     and localStorage is scoped to the site, which five sibling apps share — one
     holiday's worth of pictures would stop every one of them being able to save.

     They are deliberately NOT synced. The gist holds a sealed text record; a
     few megabytes of photographs through the same door would make every sync
     slow and eventually fail, and the failure would be silent. The screen says
     so rather than letting it be discovered. */
  var PIC_DB = "mashghal-pics", PIC_STORE = "pics";
  var PIC_MAX = 1400;          // longest edge, after which it is resized
  var PIC_BYTES = 900 * 1024;  // refuse anything still larger than this

  function picOpen() {
    return new Promise(function (res, rej) {
      if (!window.indexedDB) { rej(new Error("This browser has no IndexedDB.")); return; }
      var r = indexedDB.open(PIC_DB, 1);
      r.onupgradeneeded = function () {
        if (!r.result.objectStoreNames.contains(PIC_STORE)) r.result.createObjectStore(PIC_STORE);
      };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error || new Error("could not open")); };
    });
  }
  function picPut(id, dataUrl) {
    return picOpen().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction(PIC_STORE, "readwrite");
        tx.objectStore(PIC_STORE).put(dataUrl, id);
        tx.oncomplete = function () { res(id); };
        tx.onerror = function () { rej(tx.error); };
      });
    });
  }
  function picGet(id) {
    return picOpen().then(function (db) {
      return new Promise(function (res) {
        var tx = db.transaction(PIC_STORE, "readonly");
        var q = tx.objectStore(PIC_STORE).get(id);
        q.onsuccess = function () { res(q.result || ""); };
        q.onerror = function () { res(""); };
      });
    }).catch(function () { return ""; });
  }
  function picDrop(id) {
    return picOpen().then(function (db) {
      return new Promise(function (res) {
        var tx = db.transaction(PIC_STORE, "readwrite");
        tx.objectStore(PIC_STORE).delete(id);
        tx.oncomplete = function () { res(); };
        tx.onerror = function () { res(); };
      });
    }).catch(function () {});
  }

  /* Resized before it is stored. A modern phone photo is four or five
     megabytes; at 1400px it is a couple of hundred KB and still far more than
     enough to recognise a frame or read a label. */
  function picShrink(file) {
    return new Promise(function (res, rej) {
      var fr = new FileReader();
      fr.onerror = function () { rej(new Error("Could not read that file.")); };
      fr.onload = function () {
        var img = new Image();
        img.onerror = function () { rej(new Error("That does not look like a picture.")); };
        img.onload = function () {
          var w = img.width, h = img.height, scale = Math.min(1, PIC_MAX / Math.max(w, h));
          var c = document.createElement("canvas");
          c.width = Math.round(w * scale); c.height = Math.round(h * scale);
          var x = c.getContext("2d");
          x.imageSmoothingQuality = "high";
          x.drawImage(img, 0, 0, c.width, c.height);
          var out = c.toDataURL("image/jpeg", 0.82);
          if (out.length > PIC_BYTES * 1.37) {
            out = c.toDataURL("image/jpeg", 0.6);
          }
          if (out.length > PIC_BYTES * 1.37) {
            rej(new Error("Still too large after resizing. Try a smaller picture."));
            return;
          }
          res(out);
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }

  var BK_DB = "mashghal-backups", BK_STORE = "snaps", BK_KEEP = 10;
  var BK_MIN_GAP = 6 * 60 * 60 * 1000;   // at most four a day
  var bkLast = 0;

  function bkOpen() {
    return new Promise(function (res, rej) {
      if (!window.indexedDB) { rej(new Error("no IndexedDB")); return; }
      var r = indexedDB.open(BK_DB, 1);
      r.onupgradeneeded = function () {
        if (!r.result.objectStoreNames.contains(BK_STORE)) {
          r.result.createObjectStore(BK_STORE, { keyPath: "at" });
        }
      };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error || new Error("could not open")); };
    });
  }
  function bkTx(mode, fn) {
    return bkOpen().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction(BK_STORE, mode);
        var out = fn(tx.objectStore(BK_STORE));
        tx.oncomplete = function () { res(out && out.result !== undefined ? out.result : out); };
        tx.onerror = function () { rej(tx.error); };
      });
    });
  }
  function bkList() {
    return bkTx("readonly", function (st) { return st.getAll(); })
      .then(function (rows) {
        return (rows || []).sort(function (a, z) { return a.at < z.at ? 1 : -1; });
      })
      .catch(function () { return []; });
  }

  /* Taken on a change, but rate-limited: a snapshot per keystroke is not a
     history, it is noise that pushes the useful one out of the window. */
  function bkMaybe() {
    var now = Date.now();
    if (now - bkLast < BK_MIN_GAP) return;
    bkLast = now;
    bkSnap("automatic");
  }
  function bkSnap(why) {
    var body;
    try { body = JSON.stringify(payload()); } catch (e) { return Promise.resolve(); }
    var row = { at: stampNow(), why: why || "automatic", bytes: body.length, body: body };
    return bkTx("readwrite", function (st) { st.put(row); })
      .then(bkList)
      .then(function (rows) {
        var extra = rows.slice(BK_KEEP);
        if (!extra.length) return;
        return bkTx("readwrite", function (st) {
          extra.forEach(function (r) { st.delete(r.at); });
        });
      })
      .catch(function () {});
  }
  // Rendered after the fact because IndexedDB is asynchronous and renderView
  // is not — the card paints "Looking…" and fills itself in.
  /* Thumbnails are fetched after the fact, because IndexedDB is asynchronous
     and renderView is not. A picture that is not on this device simply does not
     appear — the row still reads correctly without it. */
  function mountPics() {
    // Both kinds: an <img> in a row, and an SVG <image> on the sheet.
    var els = document.querySelectorAll("[data-pic]");
    Array.prototype.forEach.call(els, function (el) {
      var key = el.getAttribute("data-pic");
      if (!key) return;
      var svg = el.tagName.toLowerCase() === "image";
      if (el.getAttribute(svg ? "href" : "src")) return;
      picGet(key).then(function (src) {
        if (!src) { if (!svg) el.remove(); return; }
        if (svg) el.setAttributeNS("http://www.w3.org/1999/xlink", "href", src);
        el.setAttribute(svg ? "href" : "src", src);
      });
    });
  }

  function mountBackups() {
    var list = document.getElementById("bkList");
    if (!list) return;
    bkList().then(function (rows) {
      var sub = document.getElementById("bkSub");
      if (sub) {
        sub.textContent = rows.length
          ? rows.length + (rows.length === 1 ? " snapshot, newest " : " snapshots, newest ") +
            agoWords(rows[0].at)
          : "None yet — one is taken the next time you change something";
      }
      if (!rows.length) { list.innerHTML = ""; return; }
      list.innerHTML = '<div class="stack tight">' + rows.map(function (r) {
        return '<div class="panel calm"><div class="grow">' +
          '<div class="nm sm">' + esc(whenWords(r.at)) + "</div>" +
          '<div class="says">' + esc(r.why === "automatic" ? "Taken by itself" : "Taken by hand") +
          " · " + Math.max(1, Math.round(r.bytes / 1024)) + " KB</div></div>" +
          '<div class="acts"><button class="btn quiet" data-act="bk-restore" data-id="' +
          esc(r.at) + '">Put this back</button></div></div>';
      }).join("") + "</div>";
    });
  }

  function whenWords(stamp) {
    var d = new Date(stamp);
    if (isNaN(d.getTime())) return String(stamp);
    return dayName(iso(d), "long") + " " + d.getDate() + ", " + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
  }
  function agoWords(stamp) {
    var mins = Math.round((Date.now() - new Date(stamp).getTime()) / 60000);
    if (mins < 1) return "a moment ago";
    if (mins < 60) return mins + " minutes ago";
    var hrs = Math.round(mins / 60);
    if (hrs < 24) return hrs + (hrs === 1 ? " hour ago" : " hours ago");
    var days = Math.round(hrs / 24);
    return days + (days === 1 ? " day ago" : " days ago");
  }

  function bkRestore(at) {
    return bkTx("readonly", function (st) { return st.get(at); })
      .then(function (row) {
        if (!row) throw new Error("That snapshot is gone.");
        var parsed = JSON.parse(row.body);
        // Through APP.hydrate, which is this app's single adoption point —
        // hand-copying a key list here is exactly how Coffer lost grants once.
        var keepSync = syncCfg();
        state = APP.hydrate(parsed, APP.blank());
        state.settings.sync = keepSync;
        snap = {};
        ensureStamps();
        save(); render();
        return row;
      });
  }

  /* ================= jobs =================

     A job is the bag: one engagement, holding the benches you sit at for it,
     the boards you run for it, and the kit it hands you. "Claimant", "mode"
     and "bench" are the app's words for parts of a thing a person calls one
     job — so the parts stay, because the hours still have to be owed to
     somebody and the work still has a craft, but the job is what you open.

     Migration derives one job per claimant, because that is what a claimant
     already was in practice. Nothing is deleted and nothing is renamed: a
     bench and a board gain a jobId and keep everything else, so a book written
     before jobs existed opens with its work already filed. */
  var openJob = "";   // view state, never saved

  function jobs() { return live(state.jobs); }
  function jobOf(id) { return byId(state.jobs, id); }
  function jobName(id) {
    var j = jobOf(id);
    return j ? j.name : (state.forgotten[id] ? state.forgotten[id] + " (removed)" : "No job");
  }

  function ensureJobs() {
    if (!Array.isArray(state.jobs)) state.jobs = [];
    var touched = false;
    // Cheap exit for the overwhelmingly common case: already filed.
    if (state.jobs.length &&
        !live(state.benches).some(function (b) { return !b.jobId; }) &&
        !state.boards.some(function (b) { return !b.jobId && b.benchId; })) return false;
    // One job per claimant, the first time a book meets this.
    if (!state.jobs.length && live(state.claimants).length) {
      live(state.claimants).forEach(function (c) {
        state.jobs.push({ id: uid(), name: c.name, colour: c.colour || "",
                          claimantId: c.id, note: "", noteAt: "",
                          software: [], links: [], archived: false });
      });
      touched = true;
    }
    var byClaimant = {};
    state.jobs.forEach(function (j) { if (j.claimantId) byClaimant[j.claimantId] = j.id; });

    // A bench belongs to the job of its claimant; a board to the job of its bench.
    live(state.benches).forEach(function (bn) {
      if (!bn.jobId && byClaimant[bn.claimantId]) { bn.jobId = byClaimant[bn.claimantId]; touched = true; }
    });
    state.boards.forEach(function (b) {
      if (b.jobId) return;
      var bn = b.benchId && byId(state.benches, b.benchId);
      if (bn && bn.jobId) { b.jobId = bn.jobId; touched = true; }
    });
    // The kit was hung off a mode. It belongs to the job you are doing, since
    // that is what actually hands it to you.
    state.jobs.forEach(function (j) {
      if (j.software && j.software.length) return;
      var modes = jobModes(j.id);
      var sw = [], lk = [];
      modes.forEach(function (m) {
        (m.software || []).forEach(function (x) { sw.push(x); });
        (m.links || []).forEach(function (x) { lk.push(x); });
      });
      if (sw.length || lk.length) { j.software = sw; j.links = lk; touched = true; }
    });
    return touched;
  }

  function jobBenches(id) {
    return live(state.benches).filter(function (bn) { return bn.jobId === id; });
  }
  function jobModes(id) {
    var seen = {}, out = [];
    jobBenches(id).forEach(function (bn) {
      var m = byId(state.modes, bn.modeId);
      if (m && !seen[m.id]) { seen[m.id] = 1; out.push(m); }
    });
    return out;
  }
  function jobBoards(id) {
    return state.boards.filter(function (b) { return b.jobId === id && !b.archived; });
  }
  function jobDues(id) {
    return dues().filter(function (d) { return d.board.jobId === id; });
  }

  /* ================= which build is this =================

     There was no way to tell, from inside the app, which version you were
     looking at — so "it still shows the old stuff" and "it is deployed" could
     both be true and neither of us could prove anything. The stamp is printed
     in Settings and it is the first thing to read when something looks stale.

     Bumped with the service worker, every ship. */
  var BUILD = "v27 · 14 Sep 2026";

  var THEME_KEY = "mashghal.theme";
  var THEME_WORD = { auto: "Follow the system", light: "Paper", dark: "Evening ink" };

  function themeChoice() {
    try {
      var t = localStorage.getItem(THEME_KEY);
      return (t === "light" || t === "dark") ? t : "auto";
    } catch (e) { return "auto"; }
  }
  function setTheme(k) {
    try {
      if (k === "auto") localStorage.removeItem(THEME_KEY);
      else localStorage.setItem(THEME_KEY, k);
    } catch (e) {}
    var el = document.documentElement;
    if (k === "auto") el.removeAttribute("data-theme");
    else el.setAttribute("data-theme", k);
    inkFlush();
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) {
      // Read it back rather than writing a literal, or the two drift apart.
      m.setAttribute("content", ink("page") || "#1b1e24");
    }
    render();
  }

  /* The rail carries the work, not just the five tabs. The design puts your
     live boards under the nav, grouped by who they are for, each with a dot for
     how it is going and a count of what it is sitting on — so the thing you
     open twenty times a day is one click from anywhere, and you can see
     something is late without opening the page that says so.

     Rendered here rather than in renderNav(), which belongs to the shared
     runtime and has to stay byte-identical across the four apps. */
  function railWork() {
    var el = document.getElementById("railWork");
    if (!el) return;

    var live = boards("run").filter(function (b) { return !b.closedOn; });
    var tpls = boards("template");
    var groups = {}, order = [];
    live.forEach(function (b) {
      var key = b.jobId ? jobName(b.jobId) : b.benchId ? benchLabel(b.benchId) : "No job";
      if (!groups[key]) { groups[key] = []; order.push(key); }
      groups[key].push(b);
    });

    var h = "";
    order.forEach(function (key) {
      h += '<div class="rwgroup"><div class="rwhead">' + esc(key) + "</div>";
      h += groups[key].map(function (b) {
        var d = dues().filter(function (x) { return x.board.id === b.id; });
        var lateN = d.filter(function (x) { return x.st === "over"; }).length;
        var unf = unfiled(b).length;
        var tone = lateN ? "late" : d.length ? "live" : "idle";
        var right = lateN ? lateN : unf && !d.length ? "not filed" : d.length ? d.length : "";
        return '<button class="rwrow' + (openId === b.id ? " on" : "") +
          '" data-act="board-open" data-id="' + b.id + '">' +
          '<span class="rwdot ' + tone + '"></span>' +
          '<span class="rwname">' + esc(b.name) + "</span>" +
          (right ? '<span class="rwn ' + (lateN || (unf && !d.length) ? "bad" : "") + '">' +
            esc(String(right)) + "</span>" : "") + "</button>";
      }).join("");
      h += "</div>";
    });

    if (tpls.length) {
      h += '<div class="rwgroup"><div class="rwhead">Procedures</div>' +
        tpls.slice(0, 6).map(function (t) {
          return '<button class="rwrow quiet' + (openId === t.id ? " on" : "") +
            '" data-act="board-open" data-id="' + t.id + '">' +
            '<span class="rwname">' + esc(t.name) + "</span></button>";
        }).join("") + "</div>";
    }

    h += '<button class="rwnew" data-act="prose-open">Write a new procedure</button>';
    el.innerHTML = h;

    // The count the design puts on the nav item itself, so "something is late"
    // is visible from every screen rather than only from Waiting.
    var lateAll = dues().filter(function (d) { return d.st === "over"; }).length;
    var tab = document.querySelector('#nav [data-tab="waiting"]');
    if (tab) {
      var old = tab.querySelector(".tabn");
      if (old) old.remove();
      if (lateAll) {
        var sp = document.createElement("span");
        sp.className = "tabn";
        sp.textContent = lateAll + " late";
        tab.appendChild(sp);
      }
    }
    var bs = document.getElementById("brandSub");
    if (bs) bs.textContent = syncOn() ? syncWords() : "This computer only";
  }

  function railFoot() {
    var el = document.getElementById("railFoot");
    if (!el) return;
    var cfg = syncCfg();
    el.textContent = cfg.mode === "gist"
      ? "No account and no server. Sealed here with your passphrase, then kept in a gist — and only when you press sync."
      : "Stored only on this device. No account, no server, no network.";
  }

  function syncCard() {
    var cfg = syncCfg();
    var h = '<div class="card"><h3>Sync</h3>';
    if (cfg.mode !== "gist") {
      h += '<p class="card-sub">' + esc(syncWords()) + "</p>" +
        '<p class="hint" style="margin:0 0 0.7rem">Sealed on this device with a passphrase, then kept in a secret gist, so the phone and any laptop read the same book. Once it is set up it runs by itself — a board written on the phone reaches the laptop without anyone pressing anything.</p>' +
        '<div class="tools"><button class="btn" data-act="sync-setup">Set it up</button></div></div>';
      return h;
    }
    var devs = Object.keys(state.devices || {}).map(function (id) {
      return { id: id, d: state.devices[id] };
    }).sort(function (a, b) { return a.d.at < b.d.at ? 1 : -1; });

    h += '<p class="card-sub">' + esc(syncWords()) + "</p>" +
      '<p class="hint" style="margin:0 0 0.4rem">' + esc(cfg.deviceName || "unnamed device") +
      (cfg.borrowed ? " · borrowed, cleared when the tab closes" : "") +
      " · gist " + esc(String(cfg.gistId).slice(0, 10)) + "… (clipped — 32 characters in full)</p>";
    h += '<p class="hint" style="margin:0 0 0.7rem">' +
      (cfg.lastPulledAt ? "Last synced " + esc(String(cfg.lastPulledAt).slice(0, 16).replace("T", " ")) + "."
                        : "Not synced from here yet.") +
      " It runs by itself: a few seconds after you change something, every minute and a half while this is open, and the moment you come back to the tab or to the network. Each pass pulls, merges record by record, then pushes — so it can only add, never quietly replace. The button is there for when you want it now.</p>";
    h += '<div class="tools"><button class="btn primary" data-act="sync-now">Sync now</button>' +
      '<button class="btn" data-act="sync-setup">Change</button>' +
      '<button class="btn" data-act="sync-copy-id">Copy gist id</button>' +
      '<button class="btn danger" data-act="sync-wipe">Wipe this device</button></div>';

    if (devs.length) {
      h += '<div class="sect" style="margin-top:1.2rem">Devices on this book</div>';
      h += devs.map(function (x) {
        var mine = x.id === deviceId();
        return '<div class="row"><span class="pill ' + (mine ? "p-blue" : "p-grey") + '">' +
          (mine ? "this one" : "elsewhere") + "</span>" +
          '<span class="grow"><b>' + esc(x.d.name) + "</b><small>" +
          esc("last wrote " + String(x.d.at).slice(0, 16).replace("T", " ") + (x.d.borrowed ? " · borrowed" : "")) +
          "</small></span>" +
          (mine ? "" : '<span class="tools"><button class="btn quiet danger" data-act="device-forget" data-id="' +
            x.id + '">Forget</button></span>') + "</div>";
      }).join("");
      h += '<p class="hint">If a laptop you no longer have is still listed, wiping it is not enough on its own — revoke the token at github.com/settings/tokens, because anyone who copied it before the wipe still holds it.</p>';
    }
    return h + "</div>";
  }


  /* ================= the kit, and where you left off ================= */

  // What a mode hands you when you arrive: the software, the paths, the
  // filtered inboxes. And what you left behind: one line per bench, written
  // when you leave and read back when you return, because the cost of four
  // identities is not the software — it is the twenty minutes of "where was I".
  var openMode = "";   // view state, never saved

  function modeSoftware(m) { return m.software || (m.software = []); }
  function modeLinks(m) { return m.links || (m.links = []); }

  function benchesOfMode(id) {
    return live(state.benches).filter(function (b) { return b.modeId === id; });
  }
  function noteOf(benchId) {
    var b = byId(state.benches, benchId);
    return b && b.note ? b : null;
  }

  function kitModeDetail(m) {
    var sw = modeSoftware(m), lk = modeLinks(m), bs = benchesOfMode(m.id);
    var h = pageHead(m.name, "A mode and everything it hands you",
      '<div class="tools"><button class="btn" data-act="mode-back">All of Kit</button>' +
      '<button class="btn" data-act="mode-edit" data-id="' + m.id + '">Rename</button>' +
      '<button class="btn" data-act="sw-add" data-id="' + m.id + '">Add software</button>' +
      '<button class="btn" data-act="link-add" data-id="' + m.id + '">Add a link</button>' +
      '<button class="btn" data-act="kit-export" data-id="' + m.id + '">For the launcher</button></div>');

    h += '<div class="sect">Software and files</div><div class="card">';
    h += sw.length ? sw.map(function (x) {
      return '<div class="row"><span class="pill p-blue">' + (x.path ? "path" : "no path") + "</span>" +
        '<span class="grow"><b>' + esc(x.label) + "</b>" +
        (x.path ? "<small>" + esc(x.path) + "</small>" : "") + "</span>" +
        '<span class="tools">' +
        (x.path ? '<button class="btn" data-act="sw-copy" data-id="' + m.id + ":" + x.id + '">Copy path</button>' : "") +
        '<button class="btn quiet" data-act="sw-edit" data-id="' + m.id + ":" + x.id + '">Edit</button>' +
        '<button class="btn quiet danger" data-act="sw-del" data-id="' + m.id + ":" + x.id + '">×</button></span></div>';
    }).join("") : '<p class="empty">Nothing yet. A path here is one you can paste into Win+R.</p>';
    h += "</div>";

    h += '<div class="sect">Links</div><div class="card">' +
      '<p class="hint" style="margin:0 0 0.5rem">Anything a URL can reach, including a filtered search. <code>obsidian://search?query=…</code> works on Windows and on Android; webmail takes a search URL. Desktop Outlook does not, so for that one keep the search string here and paste it.</p>';
    h += lk.length ? lk.map(function (x) {
      return '<div class="row"><span class="pill p-brass">link</span>' +
        '<span class="grow"><b>' + esc(x.label) + "</b><small>" + esc(x.url) + "</small></span>" +
        '<span class="tools"><a class="btn" href="' + esc(x.url) + '" target="_blank" rel="noopener">Open</a>' +
        '<button class="btn quiet" data-act="link-edit" data-id="' + m.id + ":" + x.id + '">Edit</button>' +
        '<button class="btn quiet danger" data-act="link-del" data-id="' + m.id + ":" + x.id + '">×</button></span></div>';
    }).join("") : '<p class="empty">No links yet.</p>';
    h += "</div>";

    h += '<div class="sect">Where you left off</div><div class="card">' +
      '<p class="hint" style="margin:0 0 0.5rem">One line per bench, written when you leave and read back when you return.</p>';
    h += bs.length ? bs.map(function (b) {
      return '<div class="row"><span class="pill ' + (b.note ? "p-verd" : "p-grey") + '">' +
        (b.note ? "left a note" : "nothing") + "</span>" +
        '<span class="grow"><b>' + esc(benchLabel(b.id)) + "</b>" +
        (b.note ? "<small>" + esc(b.note + " · " + niceDate(stampDay(b.noteAt || ""))) + "</small>" : "") + "</span>" +
        '<span class="tools">' +
        (state.settings.companion ? '<a class="btn" href="mashghal://enter/' + esc(b.id) + '">Launch</a>' : "") +
        '<button class="btn quiet" data-act="note-edit" data-id="' + b.id + '">Edit</button></span></div>';
    }).join("") : '<p class="empty">This mode has no benches yet.</p>';
    h += "</div>";
    return h;
  }

  function swDialog(m, x) {
    openModal({
      title: x ? "Edit software" : "Add software",
      confirmLabel: x ? "Save" : "Add",
      message: x ? "" : "A name, and the path you would paste into Win+R to open it.",
      fields: [
        { key: "label", label: "Name", type: "text", span: true, value: x ? x.label : "", placeholder: "ArcGIS Pro" },
        { key: "path", label: "Path", type: "text", span: true, value: x ? (x.path || "") : "",
          hint: "Left blank it is just a reminder that this mode uses it." }
      ],
      validate: function (v) { return v.label.trim() ? null : "Give it a name."; },
      onConfirm: function (v) {
        go(function () {
          var t = x;
          if (!t) { t = { id: uid() }; modeSoftware(m).push(t); }
          t.label = v.label.trim(); t.path = v.path.trim();
        });
      }
    });
  }
  function linkDialog(m, x) {
    openModal({
      title: x ? "Edit link" : "Add a link",
      confirmLabel: x ? "Save" : "Add",
      fields: [
        { key: "label", label: "Name", type: "text", span: true, value: x ? x.label : "", placeholder: "AUB mail, this project" },
        { key: "url", label: "URL", type: "text", span: true, value: x ? x.url : "",
          placeholder: "obsidian://search?query=AUB", hint: "Any scheme, not only http." }
      ],
      validate: function (v) {
        if (!v.label.trim()) return "Give it a name.";
        if (!/^[a-z][a-z0-9+.-]*:/i.test(v.url.trim())) return "A URL needs a scheme — https:, obsidian:, mailto: and so on.";
        return null;
      },
      onConfirm: function (v) {
        go(function () {
          var t = x;
          if (!t) { t = { id: uid() }; modeLinks(m).push(t); }
          t.label = v.label.trim(); t.url = v.url.trim();
        });
      }
    });
  }
  function noteDialog(b) {
    openModal({
      title: "Where you left off",
      message: "One line, for the version of you that comes back to " + esc(benchLabel(b.id)) + ".",
      confirmLabel: "Save",
      fields: [{ key: "note", label: "Note", type: "text", span: true, value: b.note || "",
        placeholder: "still to export the cemetery layer" }],
      onConfirm: function (v) {
        go(function () {
          b.note = v.note.trim();
          b.noteAt = v.note.trim() ? nowStamp() : "";
        });
      }
    });
  }
  // Asked at the moment of leaving, when it is the only moment you still know.
  function askNote(benchId, after) {
    var b = byId(state.benches, benchId);
    if (!b) { if (after) after(); return; }
    openModal({
      title: "Where did you leave off?",
      message: "One line, for when you come back to " + esc(benchLabel(b.id)) + ". Skip it and the old note stays as it was.",
      confirmLabel: "Save it", cancelLabel: "Skip",
      fields: [{ key: "note", label: "Note", type: "text", span: true, value: "",
        placeholder: "still to export the cemetery layer" }],
      onConfirm: function (v) {
        if (v.note.trim()) {
          go(function () { b.note = v.note.trim(); b.noteAt = nowStamp(); });
        }
        if (after) after();
      },
      onCancel: function () { if (after) after(); }
    });
  }
  function greet(benchId) {
    var b = noteOf(benchId);
    if (b) toast("You left off: " + b.note);
  }

  // What the local launcher reads. The page never sends a path anywhere — it
  // writes this file for you, and the launcher looks a bench up in it. Nothing
  // arrives from the web except an id.
  function kitExport(m) {
    var out = { v: 1, mode: m.name, benches: {} };
    benchesOfMode(m.id).forEach(function (b) {
      out.benches[b.id] = {
        label: benchLabel(b.id),
        software: modeSoftware(m).map(function (x) { return { label: x.label, path: x.path || "" }; }),
        links: modeLinks(m).map(function (x) { return { label: x.label, url: x.url }; })
      };
    });
    download("mashghal-" + m.name.toLowerCase().replace(/[^a-z0-9]+/g, "-") + ".json",
             JSON.stringify(out, null, 2), "application/json");
  }

  /* ================= the canvas ================= */

  /* The design draws steps as rounded cards whose height follows what is on
     them — 56 for a bare step, 84 once there is a line of prose under the name,
     taller again for one holding a grid. Cut corners and one fixed size were
     the ModelBuilder reading; these are cards. */
  var SW = 215, SH1 = 56, SH2 = 84, TH = 40, CUT = 0;
  var CELL = 17, CGAP = 5, CLAB = 44;

  function gridOf(n) {
    var g = n.grid;
    if (!g || !g.rows || !g.cols || !g.rows.length || !g.cols.length) return null;
    return g;
  }
  function gridH(g) {
    return 11 + 15 + g.rows.length * (CELL + CGAP) + 20;
  }
  function thingW(n) {
    return Math.min(260, 64 + String(n.label || "").length * 7.2);
  }
function dims(n) {
    if (n.t !== "step") return n.pic ? { w: PW, h: PH + 20 } : { w: thingW(n), h: TH };
    var g = gridOf(n);
    var lines = wrap(n.label || "", n._room || 26).length;   // wrap() caps at two
    var h = lines > 1 ? SH2 : SH1;
    if (g) h = 34 + lines * 17 + gridH(g);
    else if (n._says) h = Math.max(h, SH2);
    if (n._pics) h += 34;
    return { w: SW, h: h };
  }
  var PW = 132, PH = 96;   // a thumbnail on the sheet
  var NS = "http://www.w3.org/2000/svg";
  var vb = { x: 0, y: 0, w: 1400, h: 800 }, drag = null, pan = null, hov = null, cvSvg = null;

  function canvasHtml(b) {
    return '<div class="cvbox">' +
      '<div class="cvbar">' +
      '<span class="sp"></span>' +
      '<button class="btn" data-act="cv-out">−</button>' +
      '<button class="btn" data-act="cv-in">+</button>' +
      '<button class="btn" data-act="cv-fit">Fit</button>' +
      '<button class="btn" data-act="cv-tidy" data-id="' + b.id + '">Tidy</button>' +
      "</div>" +
      '<svg id="cv" role="img" aria-label="The board drawn as steps, things and the lines between them"></svg>' +
      '<div class="tblock"><div><b>Board</b><span>' + esc(b.name) + "</span></div>" +
      "<div><b>Bench</b><span>" + esc(b.benchId ? benchLabel(b.benchId) : "none") + "</span></div></div>" +
      '<div class="cvleg"><span><i></i>comes after</span>' +
      '<span><i class="l-link"></i>belongs with, in no order</span>' +
      '<span><i class="l-step"></i>a step</span>' +
      '<span><i class="l-thing"></i>a thing or a person</span></div>' +
      "</div>";
  }

  function svgEl(n, a) {
    var e = document.createElementNS(NS, n);
    for (var k in a) { if (a[k] !== null && a[k] !== undefined) e.setAttribute(k, a[k]); }
    return e;
  }

  function centre(n) { var d = dims(n); return { x: n.x + d.w / 2, y: n.y + d.h / 2 }; }
  function anchor(n, tx, ty) {
    var c = centre(n), d = dims(n), dx = tx - c.x, dy = ty - c.y;
    if (!dx && !dy) return c;
    var s = Math.min(dx ? (d.w / 2 + 5) / Math.abs(dx) : Infinity,
                     dy ? (d.h / 2 + 5) / Math.abs(dy) : Infinity);
    return { x: c.x + dx * s, y: c.y + dy * s };
  }

  // Nobody should ever meet a blank sheet. Steps are ranked by how far they
  // sit from an entry point and laid out in columns; things are parked above
  // or below whatever they are linked to.
  /* How far along the flow each step sits. Used twice: to lay the sheet out,
     and to tell a genuine loop back from an edge that merely happens to run
     leftwards on screen. Its BFS ignores back edges, or the loop in a revision
     cycle drags its own target off to the right. */
  function flowDepth(b) {
    var depth = {}, steps = b.nodes.filter(function (n) { return n.t === "step"; });
    var queue = entryNodes(b).map(function (n) { return n.id; });
    queue.forEach(function (id) { depth[id] = 0; });
    var guard = 0;
    while (queue.length && guard++ < 500) {
      var id = queue.shift();
      nextOf(b, id).forEach(function (e) {
        if (depth[e.b] === undefined) { depth[e.b] = depth[id] + 1; queue.push(e.b); }
      });
    }
    steps.forEach(function (n, i) { if (depth[n.id] === undefined) depth[n.id] = 100 + i; });
    return depth;
  }

  function autoLayout(b) {
    var steps = b.nodes.filter(function (n) { return n.t === "step"; });
    var depth = flowDepth(b);

    var cols = {};
    steps.forEach(function (n) {
      var d = depth[n.id];
      cols[d] = cols[d] || [];
      cols[d].push(n);
    });
    /* Serpentine: five across, then drop a row and come back the other way.
       Stacked by MEASURED height, not a fixed pitch — a step holding a matrix
       is twice as tall as a bare one, and a constant 110 drew it straight
       through its neighbour. The band pitch is the tallest card in the band for
       the same reason. */
    var bandH = {};
    Object.keys(cols).forEach(function (d) {
      var band = Math.floor(num(d) / 5), tall = 0;
      cols[d].forEach(function (n) { tall = Math.max(tall, dims(n).h); });
      bandH[band] = Math.max(bandH[band] || 0, tall);
    });
    var bandY = {}, acc = 300;
    Object.keys(bandH).map(Number).sort(function (a, z) { return a - z; })
      .forEach(function (band) { bandY[band] = acc; acc += bandH[band] + 150; });

    Object.keys(cols).forEach(function (d) {
      var y = bandY[Math.floor(num(d) / 5)] || 300;
      cols[d].forEach(function (n, j) {
        var col = num(d) % 5, band = Math.floor(num(d) / 5);
        if (band % 2 === 1) col = 4 - col;
        n.x = 60 + col * 262;
        n.y = y;
        y += dims(n).h + 34;     // the next step in this column clears this one
      });
    });
    /* Things are parked near what they hang off, above and below in turn, and
       then nudged until they are clear of everything already placed. Two people
       linked to the same send used to be dropped in the same spot, and a person
       could land squarely on a step — which is what "send a draft to N. Aoun,
       S. Frem" produced the first time a procedure was written in prose. */
    var placed = b.nodes.filter(function (n) { return n.t === "step"; })
      .map(function (n) { var d = dims(n); return { x: n.x, y: n.y, w: d.w, h: d.h }; });

    function clashes(box) {
      return placed.some(function (o) {
        return Math.min(box.x + box.w, o.x + o.w) - Math.max(box.x, o.x) > 6 &&
               Math.min(box.y + box.h, o.y + o.h) - Math.max(box.y, o.y) > 6;
      });
    }

    b.nodes.filter(function (n) { return n.t === "thing"; }).forEach(function (n, i) {
      var link = b.edges.filter(function (e) { return e.k === "link" && (e.a === n.id || e.b === n.id); })[0];
      var host = link ? nodeOf(b, link.a === n.id ? link.b : link.a) : null;
      var d = dims(n);
      var box;
      if (host && host.t === "step") {
        var above = i % 2 === 0;
        var step = 0;
        do {
          box = { x: host.x + 18 + step * 26,
                  y: above ? host.y - (TH + 74) - step * (TH + 22)
                           : host.y + dims(host).h + 58 + step * (TH + 22),
                  w: d.w, h: d.h };
          step++;
        } while (clashes(box) && step < 8);
      } else {
        box = { x: 60 + i * 190, y: 110, w: d.w, h: d.h };
        var g = 0;
        while (clashes(box) && g < 8) { box.y -= TH + 22; g++; }
      }
      n.x = box.x; n.y = box.y;
      placed.push(box);
    });
  }

  /* Cards, not cut-corner boxes. The cut corner was the ModelBuilder reading,
     and the design replaced it — shape now says step-versus-thing by the
     radius alone: 13 for a step, fully round for a thing. */
  var NR = 13;
  // curvePath is gone — drawEdges routes right-angled paths through orth().
/* The sheet is drawn in JS, so it cannot inherit a custom property the way
     the rest of the app does — it reads them instead, once per draw. Hardcoded
     hexes here are what would leave an ink-dark board drawn on paper the moment
     a light theme existed, and the palette would then live in two places that
     could disagree. Cached because getComputedStyle in a node loop is slow;
     flushed whenever the theme moves. */
  var _ink = {};
  function ink(n) {
    if (_ink[n] === undefined) {
      _ink[n] = (getComputedStyle(document.documentElement)
                  .getPropertyValue("--" + n) || "").trim() || "#808080";
    }
    return _ink[n];
  }
  function inkFlush() { _ink = {}; }

  // The same ladder the rows use. Waiting is uncoloured on purpose.
  function nodeInk() {
    return {
      done:    { bar: ink("sage-deep"), stroke: ink("rule-soft"), text: ink("receded"), w: 1,   sink: 0.62 },
      now:     { bar: ink("sage"),      stroke: ink("sage-deep"), text: ink("ink"),     w: 1.6, sink: 1 },
      waiting: { bar: ink("receded"),   stroke: ink("rule-mid"),  text: ink("dim"),     w: 1.3, sink: 1 },
      over:    { bar: ink("apricot"),   stroke: ink("apricot"),   text: ink("ink"),     w: 1.6, sink: 1 },
      todo:    { bar: ink("rule"),      stroke: ink("rule-soft"), text: ink("faint"),   w: 1,   sink: 0.84 }
    };
  }

  function drawBoard(b, svg) {
    inkFlush();
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    var defs = svgEl("defs");
    [["mar", ink("line")], ["mar-dim", ink("line-dim")],
     ["mar-back", ink("brass")]].forEach(function (p) {
      var m = svgEl("marker", { id: p[0], viewBox: "0 0 10 8", refX: 9, refY: 4,
        markerWidth: 9, markerHeight: 7.5, orient: "auto-start-reverse" });
      m.appendChild(svgEl("polygon", { points: "0,0 10,4 0,8", fill: p[1] }));
      defs.appendChild(m);
    });
    var pmin = svgEl("pattern", { id: "gmin", width: 40, height: 40, patternUnits: "userSpaceOnUse" });
    pmin.appendChild(svgEl("path", { d: "M40,0 H0 V40", fill: "none", stroke: ink("ink"), "stroke-opacity": ".028" }));
    var pmaj = svgEl("pattern", { id: "gmaj", width: 200, height: 200, patternUnits: "userSpaceOnUse" });
    pmaj.appendChild(svgEl("rect", { width: 200, height: 200, fill: "url(#gmin)" }));
    pmaj.appendChild(svgEl("path", { d: "M200,0 H0 V200", fill: "none", stroke: ink("ink"), "stroke-opacity": ".055" }));
    defs.appendChild(pmin); defs.appendChild(pmaj);
    svg.appendChild(defs);
    svg.appendChild(svgEl("rect", { x: -6000, y: -6000, width: 12000, height: 12000, fill: "url(#gmaj)" }));

    var gE = svgEl("g"), gN = svgEl("g");
    svg.appendChild(gE); svg.appendChild(gN);
    svg._gE = gE; svg._gN = gN;
    drawEdges(b, svg); drawNodes(b, svg);
  }

  /* Right-angled, the way the artboards draw them and the way a site drawing
     does. Beziers looked soft and, worse, two curves leaving the same node were
     hard to tell apart; an orthogonal run reads as a route. Sequence is
     neutral, because a line is a path and not a state. An association is a fine
     dotted line with no head — that distinction is the whole model. A loop back
     arcs over the top in brass and SAYS "goes back", because the one thing a
     reader needs to know about a cycle is that it is one. */
  function side(n, which) {
    var d = dims(n);
    if (which === "r") return { x: n.x + d.w, y: n.y + d.h / 2 };
    if (which === "l") return { x: n.x, y: n.y + d.h / 2 };
    if (which === "t") return { x: n.x + d.w / 2, y: n.y };
    return { x: n.x + d.w / 2, y: n.y + d.h };
  }

  // An L or a Z, never a diagonal: out of one side, along, and in to the other.
  function orth(A, Z) {
    var da = dims(A), dz = dims(Z);
    var goingRight = Z.x >= A.x + da.w - 8;
    var p1 = goingRight ? side(A, "r") : side(A, "b");
    var p2 = goingRight ? side(Z, "l") : side(Z, "t");
    if (goingRight) {
      var mx = (p1.x + p2.x) / 2;
      if (Math.abs(p1.y - p2.y) < 3) return "M" + p1.x + "," + p1.y + " H" + p2.x;
      return "M" + p1.x + "," + p1.y + " H" + mx + " V" + p2.y + " H" + p2.x;
    }
    var my = (p1.y + p2.y) / 2;
    if (Math.abs(p1.x - p2.x) < 3) return "M" + p1.x + "," + p1.y + " V" + p2.y;
    return "M" + p1.x + "," + p1.y + " V" + my + " H" + p2.x + " V" + p2.y;
  }

  /* An edge a -> b goes back only if b can reach a again along flow edges —
     that is what makes it a cycle, and a cycle is the only thing a reader needs
     warning about.

     Three wrong tests came before this one, each caught by the next.
     "Is the target to the left" called the brochure's last three steps loops,
