  function planWords(a) {
    var pts = planPoints(a);
    return "A plan of " + a.name + " and " + numWord(pts.length - (geoOf(a) ? 1 : 0)) +
      " things in it, drawn from their stated coordinates. North is up." +
      (geoSpan(a) ? " " + cap(geoSpanWords(a)) + "." : "");
  }

  /* THE PROVENANCE GRAPH — the one data-driven visual the brief names that
     this app already holds the data for. (The other, a survey or site extent,
     it does NOT: there is no coordinate anywhere in the record, so drawing a
     footprint today would be inventing geometry, which is the fault every
     rule in this file is written against. That one waits for a field.)

     Provenance was two lists — what this was made from, and what was made
     from it — and a list answers "which" while saying nothing about "where in
     the chain". An orthophoto made from three hundred frames and a control
     file, feeding a building layer that feeds a report, is a SHAPE, and the
     shape is the fact you cannot get from two columns of names.

     Four things hold it:

     - **It computes nothing of its own.** Every node comes from `madeFrom`,
       `madeInto` and the entry itself, so the drawing cannot name a
       relationship the lists would deny. The same rule the report and the
       adviser live by.
     - **It is drawn vertically, so there is one layout at 1340px and at
       390px.** No media query, no second layout to keep in step: sources
       above, this entry in the middle, what came of it below, and the width
       is capped so three across never has to shrink to fit a phone.
     - **It never recurses.** One hop each way, because a node opens the
       entry it names and that entry draws its own chain — which is the
       navigation, not a shortcoming. How much further back the chain goes is
       STATED above it, off `madeFromAncestors`, or a two-deep drawing would
       read as the whole of it.
     - **Identity stays in the tile channel.** A node is a neutral oval with
       the kind written under it in words, never a hue — eight identity
       colours and four state colours on one screen is exactly what the two
       channels exist to keep apart, and "made from" is not a state.

     The vocabulary is the canvas's own, because its owner reads it
     professionally: an oval is data in ArcGIS ModelBuilder, and every node
     here is data. The subject carries an ink stroke rather than a fill, the
     same reasoning as the picked node on the sheet — "you are looking at
     this one" is not a state of the work. */
  function provGraph(a) {
    var from = madeFrom(a), into = madeInto(a);
    if (!from.length && !into.length) return "";

    var PW = 142, PH = 32, GX = 12, LBL = 14, ARR = 30, HW = 196, ACROSS = 3;
    /* THREE OVALS IS THE WHOLE BAND, counting the "+N more" as one of them —
       not three plus an overflow, which is what the first draft did and which
       put FOUR across at 604px: at 390px that scaled the names to 60% and
       7.5px of type, which is not a drawing anybody can read. Laid out
       however many there are it only gets worse, and the fold underneath
       carries the full list in words anyway.

       A "+N more" oval is a LABEL and not a control — dashed, hollow, and it
       takes no `data-act`, because a button that cannot open anything is the
       fault `openHandle` exists to prevent. */
    function band(list) {
      var over = list.length > ACROSS;
      var shown = over ? list.slice(0, ACROSS - 1) : list;
      return { shown: shown, more: list.length - shown.length,
               n: shown.length + (over ? 1 : 0) };
    }
    var src = band(from), out = band(into);
    function bw(n) { return n ? n * PW + (n - 1) * GX : 0; }
    var W = Math.max(bw(src.n), bw(out.n), HW);
    var hubY = src.n ? PH + LBL + ARR : 0;
    var outY = hubY + PH + LBL + ARR;
    var H = (out.n ? outY : hubY) + PH + LBL;
    var hubX = (W - HW) / 2;

    function oval(x, y, w, name, kind, id, cls) {
      var mid = Math.round(w / 2), chars = Math.floor((w - 22) / 6.4);
      return '<g class="pgn' + (cls ? " " + cls : "") + '"' +
        (id ? ' data-act="asset-open" data-id="' + esc(id) + '" tabindex="0" role="button"' : "") +
        ' transform="translate(' + x + "," + y + ')">' +
        "<title>" + esc(name) + (kind ? " — " + esc(kind) : "") + "</title>" +
        '<rect x="0" y="0" width="' + w + '" height="' + PH + '" rx="' + (PH / 2) + '"></rect>' +
        '<text class="pgnm" x="' + mid + '" y="' + (PH / 2 + 4.5) + '" text-anchor="middle">' +
        esc(clip(name, chars)) + "</text>" +
        (kind ? '<text class="pgkind" x="' + mid + '" y="' + (PH + 11) +
          '" text-anchor="middle">' + esc(clip(kind, 24)) + "</text>" : "") +
        "</g>";
    }
    /* The ways in fan onto the subject's own top edge rather than all meeting
       one point, so three sources read as three arrows arriving and not as one
       line drawn thrice. */
    function arrow(x1, y1, x2, y2) {
      return '<line class="pgline" x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 +
        '" y2="' + y2 + '" marker-end="url(#pgm)"></line>';
    }

    var g = "";
    if (src.n) {
      var sx0 = (W - bw(src.n)) / 2;
      src.shown.forEach(function (x, i) {
        var px = sx0 + i * (PW + GX);
        g += oval(px, 0, PW, x.name, String(assetKindLabel(x)).toLowerCase(), x.id, "");
        g += arrow(px + PW / 2, PH + LBL + 1,
                   hubX + HW * (i + 1) / (src.n + 1), hubY - 5);
      });
      if (src.more > 0) {
        var mx = sx0 + src.shown.length * (PW + GX);
        g += oval(mx, 0, PW, "+" + src.more + " more", "", "", "pgmore");
        g += arrow(mx + PW / 2, PH + LBL + 1,
                   hubX + HW * src.n / (src.n + 1), hubY - 5);
      }
    }
    g += oval(hubX, hubY, HW, a.name, String(assetKindLabel(a)).toLowerCase(), "", "pghub");
    if (out.n) {
      var ox0 = (W - bw(out.n)) / 2;
      out.shown.forEach(function (x, i) {
        var px = ox0 + i * (PW + GX);
        g += arrow(hubX + HW * (i + 1) / (out.n + 1), hubY + PH + LBL + 1,
                   px + PW / 2, outY - 5);
        g += oval(px, outY, PW, x.name, String(assetKindLabel(x)).toLowerCase(), x.id, "");
      });
      if (out.more > 0) {
        var ox = ox0 + out.shown.length * (PW + GX);
        g += arrow(hubX + HW * out.n / (out.n + 1), hubY + PH + LBL + 1,
                   ox + PW / 2, outY - 5);
        g += oval(ox, outY, PW, "+" + out.more + " more", "", "", "pgmore");
      }
    }

    /* HOW MUCH FURTHER BACK IT GOES IS SAID, NOT DRAWN. One hop is what the
       drawing shows; the sentence is what stops one hop reading as all of it. */
    var deeper = madeFromAncestors(a).length - from.length;
    var note = deeper > 0
      ? '<p class="pgcap">' + cap(numWord(deeper)) +
        (deeper === 1 ? " thing" : " things") +
        " further back — open a source to follow it.</p>"
      : "";

    /* THE NATURAL WIDTH IS THE CEILING, written inline because only this call
       knows it. A stylesheet cap alone inflated a two-node chain to 432px —
       `width: 100%` on a 182-wide viewBox scaled the text up 2.4× and the
       drawing read as a poster. It still shrinks below it on a phone, which
       is the half `width: 100%` is for. */
    return '<div class="pgraph" style="max-width:' + Math.round(W) + 'px">' + note +
      '<svg viewBox="0 0 ' + Math.round(W) + " " + Math.round(H) +
      '" role="img" aria-label="' + esc(provWords(a)) + '">' +
      '<defs><marker id="pgm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"' +
      ' markerHeight="6" orient="auto-start-reverse">' +
      '<path class="pghead" d="M0,1 L9,5 L0,9 z"></path></marker></defs>' +
      g + "</svg></div>";
  }
  /* The drawing's own sentence, for anybody who cannot see it. A picture with
     no text alternative is a picture that says nothing to a screen reader,
     and this one carries a fact nothing else on the page states as plainly. */
  function provWords(a) {
    var from = madeFrom(a), into = madeInto(a), bits = [];
    if (from.length) bits.push("made from " + from.map(function (x) { return x.name; }).join(", "));
    if (into.length) bits.push(into.length + (into.length === 1 ? " thing" : " things") +
      " was made from it: " + into.map(function (x) { return x.name; }).join(", "));
    return a.name + (bits.length ? " — " + bits.join("; ") : "");
  }

  function assetPage(a) {
    var tools = '<div class="tools">' +
      '<button class="btn" data-act="asset-back">All things</button>' +
      '<button class="btn" data-act="asset-edit" data-id="' + a.id + '">Edit</button>' +
      // The launcher first when it is on, because pasting into Win+R is the
      // fallback and not the point; the copy button stays either way, since a
      // managed laptop can block the scheme handler outright.
      (a.path && state.settings.companion ? launchLink(a.id, "Open it") : "") +
      (hasBody(a) && a.body ? '<button class="btn" data-act="snip-copy" data-id="' + a.id + '">Copy it</button>' : "") +
      (a.path ? '<button class="btn" data-act="asset-copy" data-id="' + a.id + '">Copy the path</button>' : "") +
      (geoOf(a) ? '<button class="btn" data-act="asset-geo-copy" data-id="' + a.id +
        '" title="Paste it into whatever map you use">Copy where it is</button>' : "") +
      (a.url ? '<a class="btn" href="' + esc(a.url) + '" target="_blank" rel="noopener">Open the link</a>' : "") +
      '<button class="btn" data-act="asset-from-add" data-id="' + a.id + '">It was made from…</button>' +
      '<button class="btn" data-act="asset-fact-add" data-id="' + a.id + '">Note something else</button>' +
      '<button class="btn" data-act="cadence-add" data-id="' + a.id + '">Add upkeep</button>' +
      '<button class="btn danger" data-act="asset-del" data-id="' + a.id + '">Delete</button></div>';

    var stt = thingState(a);
    var h = '<div class="page-head"><div><h2>' + esc(a.name) + "</h2>" +
      "<p>" + esc(assetSays(a, true)) + "</p>" +
      /* The pill and the last-used date were repeated here, directly above the
         facts table that now carries both. Said once. */
      "</div>" + tools + "</div>";

    /* THE FACTS, AS A TABLE BESIDE THE THING'S FACE. The mockup opens an asset
       with a thumbnail and a short column of label-and-value rows — Type,
       Created, Software, Size, Status — and that shape is right: these are
       the questions you ask of one entry, and as loose sentences they were
       spread down the page in four places.

       Only the rows that EXIST are printed. Half of the mockup's labels are
       fields this record does not have (a file's size, which program wrote
       it), and inventing them would be a table of blanks or, worse, a guess.
       Where a fact is genuinely unstated the row says so in words, because
       "Nothing said about how it stands" is already this app's answer to that
       and it belongs in the row rather than in a gap. The face is the
       identity tile at size: the registry keeps no picture of an entry — a
       thumbnail belongs to a photograph on a board — and a stand-in here
       would be a picture of nothing. */
    var facts = [];
    facts.push(["Kind", esc(assetKindLabel(a))]);
    if (hasBody(a)) {
      /* "Written in — not said" under a method is a gap the table invented:
         a method is not written in a language and never will be. The row is
         printed only where it is a question. */
      if (isCode(a)) facts.push(["Written in", esc(snipLangLabel(a))]);
      facts.push(["How long", snipLines(a).length + (snipLines(a).length === 1 ? " line" : " lines")]);
    }
    facts.push(["How it stands", stt.word
      ? '<span class="st ' + stt.tone + '"><i></i>' + esc(stt.word) + "</span>"
      : '<span class="fnone">Nothing said</span>']);
    /* `lastUsedWords` reads "last used Jul 18", which under a label reading
       "Last used" says it twice. A table wants the value alone. */
    if (a.lastUsedOn && dayOk(a.lastUsedOn)) facts.push(["Last used", esc(fullDate(a.lastUsedOn))]);
    if (a.where) facts.push(["Where it is kept", esc(a.where)]);
    /* WHERE ON EARTH, AND HOW BIG ARE TWO QUESTIONS, and only an extent can
       answer the second — a point has no size, so the row is not printed
       rather than reading nought. The figure says "about" because it is the
       one derived number here (a spherical degree), and a figure that cannot
       be exact may not be printed as though it were. */
    if (geoOf(a)) facts.push(["Where on earth", esc(geoWords(a))]);
    if (geoSpan(a)) facts.push(["How big", esc(geoSpanWords(a))]);
    if (partTrail(a).length) facts.push(["Part of", esc(partTrail(a).join(" › "))]);
    if (a.onDate) facts.push(["Dated", esc(fullDate(a.onDate))]);
    if (a.path) facts.push(["Path", '<span class="fbrk">' + esc(a.path) + "</span>"]);
    if (a.url) facts.push(["Link", '<a class="fbrk" href="' + esc(a.url) + '" target="_blank" rel="noopener">' + esc(a.url) + "</a>"]);
    /* THE READER'S OWN ROWS, in the same table as the stated ones, because a
       serial number is a fact about a laptop and not a different sort of
       thing. Each carries the one control it needs — the dialog that wrote
       it, where emptying the value is how the row comes off — icon-only with
       the label in `title` and `aria-label`, the way Coffer's Pending card
       does it, since the words are already the row's own `<dt>`. */
    assetFacts(a).forEach(function (f) {
      facts.push([f.k, '<span class="fval">' + esc(f.v) + "</span>" +
        '<button class="btn quiet fpen" data-act="asset-fact" data-id="' + a.id + ":" + f.id +
        '" title="Edit \u201c' + esc(f.k) + '\u201d" aria-label="Edit \u201c' + esc(f.k) +
        '\u201d">' + ICONS.pen + "</button>", "fmine"]);
    });
    var hdl = openHandle(a);
    /* A FACT ROW MAY NOT SAY SOMETHING THE READER CAN SEE IS UNTRUE. "Nothing
       to open — this is a thing, not a file" is right for a pair of
       headphones and plainly false three inches under a snippet's own body,
       which is the content and is right there. */
    facts.push(["Opening it", hdl ? esc(hdl.how)
      : hasBody(a)
        ? '<span class="fnone">The snippet itself is above — “Copy it” puts it on the clipboard</span>'
        : '<span class="fnone">Nothing to open — this is a thing, not a file</span>']);

    /* THE BODY FIRST, ABOVE THE FACTS. For every other entry the facts are
       what the page is for; for a snippet they are context and the text is
       the answer, so five rows of table above it would put the one thing the
       reader came for below the fold on a phone. */
    if (hasBody(a)) h += snipBlock(a);

    var look = assetLook(a);
    h += '<div class="aface"><span class="iface ' + look.tile + '">' + look.ico + "</span>" +
      '<dl class="afacts">' + facts.map(function (f) {
        return "<dt>" + esc(f[0]) + "</dt><dd" +
          (f[2] ? ' class="' + f[2] + '"' : "") + ">" + f[1] + "</dd>";
      }).join("") + "</dl></div>";

    /* TWO COLUMNS, AS THE POSTER LAYS THEM OUT: what the thing is connected to
       on the left, what you can do with it on the right. The poster puts
       everything on the left under one heading, "Related" — this app keeps
       them apart on purpose, because "made from three hundred frames", "found
       at trench 4" and "used on this board" are three different facts and the
       pickers that write them refuse to conflate them. So the shape is the
       poster's and the headings are this app's. */
    var left = "", right = "";

    /* WHAT YOU CAN DO NEXT, and every one of them is something this app can
       actually do — see `nextActions`. The mockup lists an application's menu
       ("Open in CloudCompare", "Import to QGIS"); offering those would be a
       row of buttons that cannot work, which is the fault `openHandle` exists
       to avoid. */
    var nx = nextActions(a);
    if (nx.length) {
      right += '<div class="sect">What you can do next</div><div class="stack tight">' +
        nx.map(function (x) {
          var inner = '<div class="grow"><div class="nm sm">' + esc(x.label) + "</div>" +
            '<div class="says">' + esc(x.how) + "</div></div>";
          return x.href
            ? '<a class="panel rowbtn calm" href="' + esc(x.href) + '"' +
              (x.kind === "url" ? ' target="_blank" rel="noopener"' : "") + ">" + inner + "</a>"
            : '<button type="button" class="panel rowbtn calm" data-act="' + x.act +
              '" data-id="' + esc(x.id) + '">' + inner + "</button>";
        }).join("") + "</div>";
    }

    if (a.notes) {
      left += '<div class="panel calm"><div class="grow"><div class="nm sm">' + esc(a.notes) + "</div></div></div>";
    }

    /* Provenance, both ways. The forward list is stated and the reverse is
       derived from it, so the two cannot disagree. */
    /* Where it sits, both ways, above what it was made from — because "this
       sherd is in trench 4 of the harbour site" is the first thing you want
       to know about a thing, and what it was manufactured out of is the
       second. The trail reads top-down (site, then trench) so it can be read
       as an address rather than decoded backwards. */
    /* `trail`, not `up` — `up` is the upkeep list further down this same
       function, and one `var` name declared twice in one scope is a trap
       waiting for whichever of the two moves first. */
    var trail = partTrail(a), inside = partsIn(a);
    if (trail.length || inside.length) {
      left += '<div class="sect">Where it sits</div>';
      if (trail.length) {
        left += '<div class="panel calm"><div class="grow"><div class="nm sm">' +
          esc(trail.concat([a.name]).join(" \u203a ")) + "</div>" +
          '<div class="says">Part of ' + esc(trail[trail.length - 1]) + "</div></div>" +
          '<div class="acts"><button class="btn quiet" data-act="asset-open" data-id="' +
          esc(partOf(a).id) + '">Look</button></div></div>';
      }
      /* THE PLAN GOES UNDER THE ADDRESS, because it answers the same
         question one level more precisely: "Trench 4 is in Anfeh harbour" is
         the address, and where in it is the drawing. Below two points there
         is no geometry to show and the facts table has already said the
         coordinate, so nothing is drawn rather than a lone dot in a frame. */
      left += sitePlan(a);
      if (inside.length) {
        left += '<div class="stack tight">' + inside.map(function (x) {
          var lk = assetLook(x);
          return '<button type="button" class="panel rowbtn calm" data-act="asset-open" data-id="' + x.id + '">' +
            '<span class="itile sm ' + lk.tile + '">' + lk.ico + "</span>" +
            '<div class="grow"><div class="nm sm">' + esc(x.name) + "</div>" +
            '<div class="says">' + esc(assetKindLabel(x)) +
            (partsIn(x).length ? " \u00b7 holds " + partsIn(x).length : "") + "</div></div></button>";
        }).join("") + "</div>";
      }
    }

    var tps = assetTopics(a);
    if (tps.length) {
      left += '<div class="sect">What it is about</div><div class="tools">' +
        tps.map(function (t) {
          return '<button class="btn" data-act="lib-topic" data-id="' + esc(t) + '">' + esc(t) + "</button>";
        }).join("") + "</div>";
    }

    /* PROVENANCE IS ONE QUESTION WITH TWO DIRECTIONS, so it is one heading
       and one drawing — `provGraph` covers both — with the same facts written
       out as rows behind a fold underneath. That is exactly the treatment the
       BOARD gets: the sheet is the screen and the words fold away under it,
       for the same reason, and it is what keeps "say it once" true while the
       row's own controls (Look, and the × that takes a source back off) stay
       where a keyboard can reach them. */
    var from = madeFrom(a), into = madeInto(a);
    left += '<div class="sect">What it came from, and what came of it</div>';
    if (!from.length && !into.length) {
      left += '<p class="empty">Nothing said. For anything derived — an orthophoto, a map, a report — this is the one fact the file itself will not tell you in six months. “It was made from…” above records it.</p>';
    } else {
      left += provGraph(a);
      left += '<details class="fold"><summary>The same, written out</summary>';
      if (from.length) {
        left += '<div class="sect">What it was made from</div><div class="stack tight">' + from.map(function (x) {
          var lk = assetLook(x);
          return '<div class="panel calm"><span class="itile sm ' + lk.tile + '">' + lk.ico + "</span>" +
            '<div class="grow"><div class="nm sm">' + esc(x.name) + "</div>" +
            '<div class="says">' + esc(assetKindLabel(x)) + "</div></div>" +
            '<div class="acts"><button class="btn quiet" data-act="asset-open" data-id="' + x.id + '">Look</button>' +
            '<button class="btn quiet danger" data-act="asset-from-del" data-id="' + a.id + ":" + x.id +
            '" title="Not made from this">×</button></div></div>';
        }).join("") + "</div>";
      }
      if (into.length) {
        left += '<div class="sect">What was made from it</div><div class="stack tight">' + into.map(function (x) {
          var lk = assetLook(x);
          return '<button type="button" class="panel rowbtn calm" data-act="asset-open" data-id="' + x.id + '">' +
            '<span class="itile sm ' + lk.tile + '">' + lk.ico + "</span>" +
            '<div class="grow"><div class="nm sm">' + esc(x.name) + "</div>" +
            '<div class="says">' + esc(assetKindLabel(x)) + "</div></div></button>";
        }).join("") + "</div>";
      }
      left += "</details>";
    }

    var uses = assetUses(a);
    left += '<div class="sect">Where it is used</div>';
    left += uses.length ? '<div class="stack tight">' + uses.map(function (u) {
      return '<button type="button" class="panel rowbtn calm" data-act="board-open" data-id="' + u.board.id + '">' +
        '<div class="grow"><div class="nm sm">' + esc(u.board.name) + "</div>" +
        '<div class="says">' + esc("as “" + u.node.label + "”" +
          (u.proj ? " · " + u.proj.name : "")) + "</div></div></button>";
    }).join("") + "</div>"
      /* NOT "ON THE RIGHT". The page is two columns on a laptop and one
         stacked column on a phone, so under 900px that button is BELOW —
         a screen may not name a place that does not exist, and this one
         named a direction that is only true on half the devices. The
         control's own words are the whole of the route. */
      : '<p class="empty">Not on any board yet. “Put it on a board” does it from here — a copy is taken, so the board keeps working even if this entry changes.</p>';

    var up = assetUpkeep(a);
    if (up.length) {
      right += '<div class="sect">Upkeep on it</div><div class="stack tight">' + up.map(function (cd) {
        var st = cadenceState(cd);
        return '<div class="panel calm"><div class="grow"><div class="nm sm">' + esc(cd.label) + "</div>" +
          '<div class="says">' + esc("every " + cd.everyDays + "d · " + placeLabel(cd.place)) + "</div></div>" +
          '<span class="st ' + (st.word === "overdue" ? "late" : st.word === "due" ? "watch" : "idle") +
          '"><i></i>' + esc(st.word) + "</span></div>";
      }).join("") + "</div>";
    }
    h += '<div class="agrid"><div class="acol">' + left + "</div>" +
      '<div class="acol">' + right + "</div></div>";

    return h;

  /* ================= people =================

     The one cut of the record the app could not give. Waiting answers "what
     is late", step by step; nobody could ask "I am about to write to Rita —
     what else is outstanding with her", because a person existed only as a
     node inside whichever frozen board named them. So a person is assembled
     here from both halves:

     **Derived**, and it is nearly all of it: every `send` and `watch` they are
     linked to, across every board, with how long it has been waiting and
     whether it is past its chase. Nothing about a thread is stored — the same
     rule the hours and the projects live by.

     **Stated**, and only what no board could know: where they work, what they
     do, how to reach them, one line of your own. Boards never point into that
     record, so renaming a contact cannot rewrite a board that named them
     three years ago.

     The two halves are matched by `fromContactId` where a board node was
     brought in from the list, and by lowercased NAME otherwise — which is how
     `allThings()` has always folded people together, and the only key the
     older frozen copies carry. */

  var openPerson = "";   // view state, never saved

  function contactOf(id) { return byId(state.contacts, id); }

  /* Everyone the book knows, from both halves, folded by name. A contact with
     no board mention still appears (you added them for a reason); a person
     named only on a board appears too, with nothing stated about them. */
  function people() {
    var byKey = {}, out = [];
    /* Keyed on the CONTACT where there is one, and on the lowercased name
       otherwise. Name alone was wrong and the screenshot showed it: renaming
       a contact (which deliberately does not rewrite the boards) split one
       person into two rows — "Prof. Supervisor" with the address and nothing
       outstanding, "Supervisor" with three boards and a late send. The id
       survives a rename; the name is the fallback for the copies that predate
       `fromContactId`, and the display name is always the contact's, since
       that is the current truth. */
    function slot(name, contact) {
      var key = contact ? "c:" + contact.id : "n:" + String(name).toLowerCase();
      if (!byKey[key]) {
        byKey[key] = { key: key, name: contact ? contact.name : name,
                       contact: contact || null, boards: [], waits: [], seen: 0 };
        out.push(byKey[key]);
      }
      return byKey[key];
    }
    // The legacy match, so a book written before contacts existed still folds
    // its people together: a board node naming somebody who is now in the
    // list belongs to them.
    var byName = {};
    live(state.contacts).forEach(function (c) {
      byName[c.name.toLowerCase()] = c;
      slot(c.name, c);
    });

    state.boards.forEach(function (b) {
      if (b.archived) return;
      (b.nodes || []).forEach(function (n) {
        if (n.t !== "thing" || n.kind !== "person" || !n.label) return;
        var c = n.fromContactId ? contactOf(n.fromContactId) : null;
        if (c && c.archived) c = null;          // forgotten: back to a bare name
        if (!c) c = byName[String(n.label).toLowerCase()] || null;
        var p = slot(n.label, c);
        p.seen++;
        if (p.boards.indexOf(b) < 0) p.boards.push(b);

        /* What is outstanding with them: the waits they are linked to that are
           still open. A template's steps are not outstanding — nothing has
           been sent yet — so only a live run counts, which is the same test
           `dues()` makes. */
        if (b.kind !== "run" || b.closedOn) return;
        edgesOf(b, n.id, "link").forEach(function (e) {
          var st = nodeOf(b, e.a === n.id ? e.b : e.a);
          if (!st || st.t !== "step") return;
          if (st.act !== "send" && st.act !== "watch") return;
          if (!st.enteredAt || st.doneAt) return;
          p.waits.push({ board: b, node: st, over: overdueBy(st), days: daysWaiting(st) });
        });
      });
    });

    out.forEach(function (p) {
      p.waits.sort(function (x, y) {
        if ((x.over > 0) !== (y.over > 0)) return x.over > 0 ? -1 : 1;
        return y.over - x.over || y.days - x.days;
      });
      p.late = p.waits.filter(function (w) { return w.over > 0; }).length;
    });
    // Worst first, then whoever you are waiting on at all, then by name.
    return out.sort(function (a, z) {
      if (a.late !== z.late) return z.late - a.late;
      if (a.waits.length !== z.waits.length) return z.waits.length - a.waits.length;
      return a.name.localeCompare(z.name);
    });
  }

  function personOf(key) {
    var all = people();
    for (var i = 0; i < all.length; i++) if (all[i].key === key) return all[i];
    return null;
  }

  function personSays(p) {
    var bits = [], c = p.contact;
    if (c && c.role) bits.push(c.role);
    if (c && c.org) bits.push(c.org);
    if (p.late) bits.push(p.late + (p.late === 1 ? " thing is late" : " things are late") + " with them");
    else if (p.waits.length) bits.push("waiting on " + p.waits.length +
      (p.waits.length === 1 ? " thing" : " things"));
    else if (p.boards.length) bits.push("on " + p.boards.length +
      (p.boards.length === 1 ? " board" : " boards") + ", nothing outstanding");
    else bits.push("nothing on a board yet");
    return bits.join(" · ");
  }

  function personRow(p) {
    var tone = p.late ? "late" : p.waits.length ? "watch" : "idle";
    var word = p.late ? "late" : p.waits.length ? "waiting" : "clear";
    return '<button type="button" class="panel rowbtn calm' + (p.late ? " late" : "") +
      '" data-act="person-open" data-id="' + esc(p.key) + '">' +
      '<span class="itile t-person">' + ICONS.person + "</span>" +
      '<div class="grow"><div class="nm sm">' + esc(p.name) + "</div>" +
      '<div class="says">' + esc(personSays(p)) + "</div></div>" +
      '<span class="st ' + tone + '"><i></i>' + word + "</span></button>";
  }

  function personPage(p) {
    var c = p.contact;
    var tools = '<div class="tools">' +
      '<button class="btn" data-act="person-back">Everyone</button>' +
      (c ? '<button class="btn" data-act="contact-edit" data-id="' + c.id + '">Edit</button>'
         : '<button class="btn" data-act="contact-add" data-id="' + esc(p.name) + '">Say who they are</button>') +
      (c && c.email ? '<a class="btn" href="mailto:' + esc(c.email) + '">Write to them</a>' : "") +
      (c ? '<button class="btn danger" data-act="contact-del" data-id="' + c.id + '">Forget them</button>' : "") +
      "</div>";

    var h = '<div class="page-head"><div><h2>' + esc(p.name) + "</h2>" +
      "<p>" + esc(personSays(p)) + "</p></div>" + tools + "</div>";

    if (c && (c.email || c.note)) {
      h += '<div class="card">' +
        (c.email ? '<div class="row"><span class="grow"><b>Email</b><small>' + esc(c.email) + "</small></span></div>" : "") +
        (c.note ? '<div class="row"><span class="grow"><b>Note</b><small>' + esc(c.note) + "</small></span></div>" : "") +
        "</div>";
    }
    if (!c) {
      h += '<p class="hint">Nothing is stated about them — they are here because a board names them. ' +
        "Saying who they are adds where they work and how to reach them, and no board changes when you do.</p>";
    }

    /* The whole point of the page. Worst first, and each row says which run it
       is on, because "waiting three weeks" means nothing without it. */
    h += '<div class="sect">What is outstanding with them</div>';
    h += p.waits.length ? '<div class="stack tight">' + p.waits.map(function (w) {
      var late = w.over > 0;
      return '<button type="button" class="panel rowbtn calm' + (late ? " late" : "") +
        '" data-act="board-open" data-id="' + w.board.id + '">' +
        '<div class="grow"><div class="nm sm">' + esc(w.node.label) + "</div>" +
        '<div class="says">' + esc(w.board.name + " · " + vocabLabel("acts", w.node.act) +
          " · " + w.days + (w.days === 1 ? " day" : " days") +
          // "6 days, 1 past the chase" reads as a fragment; the unit belongs
          // on both figures or on neither.
          (late ? ", " + w.over + (w.over === 1 ? " day" : " days") + " past the chase" : "")) +
        "</div></div>" +
        '<span class="st ' + (late ? "late" : "watch") + '"><i></i>' +
        (late ? "late" : "waiting") + "</span></button>";
    }).join("") + "</div>"
      : '<p class="empty">Nothing. Every send and watch that names them is either finished or not started.</p>';

    if (p.boards.length) {
      h += '<div class="sect">Where they appear</div><div class="stack tight">' + p.boards.map(function (b) {
        return '<button type="button" class="panel rowbtn calm" data-act="board-open" data-id="' + b.id + '">' +
          '<div class="grow"><div class="nm sm">' + esc(b.name) + "</div>" +
          '<div class="says">' + esc(b.kind === "run" ? (b.closedOn ? "closed run" : "run") : "procedure") +
          "</div></div></button>";
      }).join("") + "</div>";
    }
    return h;
  }

  function kitPeopleHtml() {
    var all = people();
    var h = '<div class="tools" style="margin-bottom:0.9rem">' +
      '<button class="btn" data-act="contact-add">Add someone</button></div>';
    if (!all.length) {
      return h + '<p class="empty">Nobody yet. A person arrives here the moment a board names them — or add one, so their address is somewhere you can find it.</p>';
    }
    var owing = all.filter(function (p) { return p.waits.length; });
    var clear = all.filter(function (p) { return !p.waits.length; });
    if (owing.length) {
      h += '<div class="subhead">Waiting on them</div><div class="stack tight" style="margin-bottom:1rem">' +
        owing.map(personRow).join("") + "</div>";
    }
    if (clear.length) {
      h += '<div class="subhead">Everyone else</div><div class="stack tight">' +
        clear.map(personRow).join("") + "</div>";
    }
    return h;
  }

  function contactDialog(c, name) {
    var mk = !c;
    openModal({
      title: mk ? "Add someone" : "Edit " + c.name,
      confirmLabel: mk ? "Add" : "Save",
      wide: true,
      message: mk ? "Only what no board could know: where they work, what they do, and how to reach them. What is outstanding with them is read off the sends that name them, and never typed."
                  : "",
      fields: [
        { key: "name", label: "Name", type: "text", span: true,
          value: c ? c.name : (name || ""), placeholder: "N. Haddad" },
        { key: "role", label: "What they do", type: "text", value: c ? (c.role || "") : "",
          placeholder: "reviewer" },
        { key: "org", label: "Where", type: "text", value: c ? (c.org || "") : "",
          placeholder: "U. of Balamand" },
        { key: "email", label: "Email", type: "text", span: true, value: c ? (c.email || "") : "" },
        { key: "note", label: "One line of your own", type: "textarea", span: true, rows: 2,
          value: c ? (c.note || "") : "" }
      ],
      validate: function (v) {
        if (!v.name.trim()) return "Give them a name.";
        /* Not a validator for email in general — that is a fool's errand — but
           a mailto: link built from something with no @ in it fails silently
           when you press it, which is worse than refusing it here. */
        if (v.email.trim() && v.email.trim().indexOf("@") < 0)
          return "An email address needs an @, or leave it blank.";
        var dup = live(state.contacts).some(function (x) {
          return x !== c && x.name.toLowerCase() === v.name.trim().toLowerCase();
        });
        if (dup) return "Somebody of that name is already here.";
        return null;
      },
      onConfirm: function (v) {
        go(function () {
          var t = c;
          if (!t) { t = { id: uid(), archived: false }; state.contacts.push(t); }
          t.name = v.name.trim(); t.role = v.role.trim(); t.org = v.org.trim();
          t.email = v.email.trim(); t.note = v.note.trim();
          openPerson = "c:" + t.id;
        });
        toast(mk ? "Added" : "Saved");
      }
    });
  }

  /* The registry, grouped by kind. It was a flat list of four pieces of
     hardware; now that it holds files, photographs, datasets and software as
     well, the kind is what you scan by and every row opens a page. */
  function kitThingsHtml() {
    var as = live(state.assets), byKind = {}, order = [];
    as.forEach(function (a) {
      var k = assetKindLabel(a) || "Other";
      if (!byKind[k]) { byKind[k] = []; order.push(k); }
      byKind[k].push(a);
    });

        byKind[k].map(assetRow).join("") + "</div>";

      : '<p class="empty">Nothing yet. Start with the file you can never find.</p>';

  function kitUpkeepHtml() {
    var h = '<div class="card">' +
      '<p class="hint" style="margin:0 0 0.5rem">Every so often since it was last done. It shows up under Actions, filtered by where you have to be to do it.</p>' +
      '<div class="tools" style="margin-bottom:0.5rem"><button class="btn" data-act="cadence-add">Add upkeep</button></div>' +
      (live(state.cadences).length ? live(state.cadences).map(function (cd) {
        var st = cadenceState(cd), p = protects(cd);
        return '<div class="row"><span class="pill ' + st.tone + '">' + esc(st.word) + "</span>" +
          '<span class="grow"><b>' + esc(cd.label) + "</b><small>" +
          esc("every " + cd.everyDays + "d · " + placeLabel(cd.place) + (p ? " · protects " + p : "")) +
          "</small></span>" +
          '<span class="tools"><button class="btn quiet" data-act="cadence-edit" data-id="' + cd.id + '">Edit</button>' +
          '<button class="btn quiet danger" data-act="cadence-del" data-id="' + cd.id + '">×</button></span></div>';
      }).join("") : '<p class="empty">Nothing yet.</p>') + "</div>";
    return h;
  }


  /* ================= sync ================= */

  // The book is encrypted on this device and only then sent. A secret gist is
  // unlisted, not private — anyone holding the link can read it — so the
  // encryption is the whole of the privacy and not a belt over braces.
  //
  // Nothing here ever reaches `state`: the token and the passphrase live in
  // their own storage keys, so a backup of the book carries neither.
  /* EVERY SYNCED LIST, and the one place that decides. `stampRecords`,
     `ensureStamps`, `payload` and the merge all walk this array, so a list
     added to the state shape and left out here would save, back up and render
     while never crossing to another device — and never leaving a tombstone
     either, so deleting one on the phone would be undone by the next pull.
     `tasks` was exactly that for one commit. Anything added to STATE_LISTS
     belongs here too unless there is a stated reason it is local. */
  var SYNC_LISTS = ["jobs", "projects", "kinds", "claimants", "modes", "benches", "boards", "spans", "assets", "contacts", "cadences", "tasks"];
  var TOK_KEY = "mashghal.sync.token";
  var PASS_KEY = "mashghal.sync.pass";
  var DEV_KEY = "mashghal.sync.device";
  var GIST_FILE = "mashghal.json";
  var DIGEST_FILE = "digest.json";
  /* Thumbnails travel in their own file, sealed separately. The record must
     never fail to sync because of pictures: the book is a few kilobytes and
     always fits, while twenty travelling thumbnails measured 1.3MB inside it
     and forty-seven measured 3MB, past what a gist hands back inline. Split,
     the book syncs whatever happens to the pictures, and a failure on one
     side says so instead of taking the other down with it. */
  var THUMB_FILE = "thumbs.json";
  var snap = {};          // id -> the record as last stamped
  var syncing = false;

  function borrowed() { return !!(state.settings.sync && state.settings.sync.borrowed); }
  function vault() {
    try { return borrowed() ? window.sessionStorage : window.localStorage; }
    catch (e) { return null; }
  }
  function secret(k) { try { var v = vault(); return v ? (v.getItem(k) || "") : ""; } catch (e) { return ""; } }
  function setSecret(k, v) { try { var s = vault(); if (s) s.setItem(k, v); } catch (e) {} }
  function dropSecrets() {
    [window.localStorage, window.sessionStorage].forEach(function (s) {
      try { [TOK_KEY, PASS_KEY].forEach(function (k) { s.removeItem(k); }); } catch (e) {}
    });
  }
  function deviceId() {
    var id = "";
    try { id = localStorage.getItem(DEV_KEY) || ""; } catch (e) {}
    if (!id) { id = uid(); try { localStorage.setItem(DEV_KEY, id); } catch (e) {} }
    return id;
  }
  function syncCfg() {
    if (!state.settings.sync) {
      state.settings.sync = { mode: "none", gistId: "", deviceName: "", borrowed: false, lastPulledAt: "" };
    }
    return state.settings.sync;
  }
  function syncOn() { return syncCfg().mode === "gist" && syncCfg().gistId && secret(TOK_KEY) && secret(PASS_KEY); }

  /* ---------------- stamping and merging ---------------- */

  function stampNow() {
    var d = new Date();
    return d.toISOString();
  }
  function bare(r) {
    var o = {}, k;
    for (k in r) { if (k !== "updatedAt") o[k] = r[k]; }
    return JSON.stringify(o);
  }
  // Which records changed since the last pass, so a merge can be per record
  // rather than per file. Whole-file last-write-wins eventually eats a day of
  // spans logged on the phone, and it does it silently.
  function stampRecords() {
    var now = stampNow(), seen = {};
    SYNC_LISTS.forEach(function (k) {
      (state[k] || []).forEach(function (r) {
        if (!r || !r.id) return;
        seen[r.id] = 1;
        var j = bare(r);
        if (snap[r.id] !== j) { r.updatedAt = now; snap[r.id] = j; }
      });
    });
    Object.keys(snap).forEach(function (id) {
      if (!seen[id]) { state.tombstones[id] = now; delete snap[id]; }
    });
  }
  // A record that predates sync has no stamp and would lose every comparison,
  // so it is given one the first time it is seen rather than being treated as
  // infinitely old.
  function ensureStamps() {
    var now = stampNow(), touched = false;
    SYNC_LISTS.forEach(function (k) {
      (state[k] || []).forEach(function (r) {
        if (r && r.id && !r.updatedAt) { r.updatedAt = now; touched = true; }
        if (r && r.id) snap[r.id] = bare(r);
      });
    });
    return touched;
  }

  function mergeList(mine, theirs, tomb) {
    var pick = {};
    mine.concat(theirs).forEach(function (r) {
      if (!r || !r.id) return;
      var cur = pick[r.id];
      if (!cur || (r.updatedAt || "") > (cur.updatedAt || "")) pick[r.id] = r;
    });
    return Object.keys(pick).map(function (id) { return pick[id]; })
      .filter(function (r) { return !(tomb[r.id] && tomb[r.id] > (r.updatedAt || "")); });
  }

  // What a mailer may see. Numbers only — no label, no name, no note. A file
  // in an unlisted gist should be able to leak without telling anyone anything
  // about the work, so it says how much is late and not what.
  function digestPayload() {
    var late = dues().filter(function (d) { return d.st === "over"; });
    var worst = late.reduce(function (m, d) { return Math.max(m, d.over); }, 0);
    return {
      v: 1, at: stampNow(),
      late: late.length, worstDaysPast: worst,
      waiting: dues().length,
      unfiled: stuck().length,
      upkeepPast: upkeepLate().length
    };
  }

  function payload() {
    var o = { v: 1, tombstones: state.tombstones, forgotten: state.forgotten, devices: state.devices };
    SYNC_LISTS.forEach(function (k) { o[k] = state[k] || []; });
    /* The boards go without their thumbnails. Copied rather than stripped in
       place: `payload()` hands back the live arrays, and deleting a field off
       them would take the pictures off the screen as a side effect of
       syncing. Shallow copies all the way to the node, which is as deep as
       the field lives. */
    o.boards = (state.boards || []).map(function (b) {
      var c = {}, k;
      for (k in b) if (k !== "nodes") c[k] = b[k];
      c.nodes = (b.nodes || []).map(function (n) {
        if (!n.thumb) return n;
        var m = {}, j;
        for (j in n) if (j !== "thumb") m[j] = n[j];
        return m;
      });
      return c;
    });
    return o;
  }

  /* Keyed by the PICTURE id, not the node id. Node ids are unique within a
     board and no further — `startRun()` deep-copies a template without
     re-issuing them, so a run and the procedure it came from share every node
     id. `pic` is a fresh `uid()` per picture, which is what a thumbnail
     actually belongs to.

     Pruned to pictures something still points at, or the map only ever grows. */
  function thumbPayload() {
    var out = {}, seen = {};
    (state.boards || []).forEach(function (b) {
      (b.nodes || []).forEach(function (n) {
        if (!n.pic) return;
        seen[n.pic] = 1;
        if (n.thumb) out[n.pic] = n.thumb;
      });
    });
    return { v: 1, thumbs: out };
  }

  // Union, and the local copy wins: a thumbnail is derived from a picture this
  // device may hold in full, and there is nothing to lose by keeping ours.
  function mergeThumbs(remote) {
    var mine = thumbPayload().thumbs;
    var all = {}, k;
    var theirs = (remote && remote.thumbs) || {};
    for (k in theirs) all[k] = theirs[k];
    for (k in mine) all[k] = mine[k];
    var put = 0;
    (state.boards || []).forEach(function (b) {
      (b.nodes || []).forEach(function (n) {
        // Never clear one: a node with no thumb in the map keeps whatever it
        // had, which is how a device that has the full picture stays ahead.
        if (n.pic && all[n.pic] && n.thumb !== all[n.pic]) { n.thumb = all[n.pic]; put++; }
      });
    });
    return put;
  }
  // Merge is symmetrical and loses nothing it can avoid losing: a record that
  // exists on one side only survives unless a tombstone newer than it says it
  // was deleted on purpose.
  function mergeIn(remote) {
    var tomb = {};
    [state.tombstones, remote.tombstones || {}].forEach(function (src) {
      Object.keys(src).forEach(function (id) {
        if (!tomb[id] || src[id] > tomb[id]) tomb[id] = src[id];
      });
    });
    var counts = { added: 0, updated: 0, removed: 0 };
    SYNC_LISTS.forEach(function (k) {
      var before = {};
      (state[k] || []).forEach(function (r) { before[r.id] = r.updatedAt || ""; });
      var merged = mergeList(state[k] || [], remote[k] || [], tomb);
      merged.forEach(function (r) {
        if (before[r.id] === undefined) counts.added++;
        else if (before[r.id] !== (r.updatedAt || "")) counts.updated++;
      });
      counts.removed += Object.keys(before).length - merged.filter(function (r) { return before[r.id] !== undefined; }).length;
      state[k] = merged;
    });
    state.tombstones = tomb;
    Object.keys(remote.forgotten || {}).forEach(function (id) {
      if (!state.forgotten[id]) state.forgotten[id] = remote.forgotten[id];
    });
    var rd = remote.devices || {};
    Object.keys(rd).forEach(function (id) {
      if (!state.devices[id] || rd[id].at > state.devices[id].at) state.devices[id] = rd[id];
    });
    return counts;
  }

  /* ---------------- the sealing ---------------- */

  function b64(buf) {
    var a = new Uint8Array(buf), s = "";
    for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]);
    return btoa(s);
  }
  function unb64(s) {
    var b = atob(s), a = new Uint8Array(b.length);
    for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i);
    return a;
  }
  function subtle() {
    return (window.crypto && window.crypto.subtle) ? window.crypto.subtle : null;
  }
  function deriveKey(pass, salt) {
    var enc = new TextEncoder();
    return subtle().importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"])
      .then(function (base) {
        return subtle().deriveKey(
          { name: "PBKDF2", salt: salt, iterations: 250000, hash: "SHA-256" },
          base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
      });
  }
  /* Compressed before it is sealed, because the measured payload runs into a
     cliff. The bare book is 23KB of JSON and seals to 31KB of base64; twenty
     travelling thumbnails take it to 1.3MB and forty-seven to 3MB, which is
     past what a gist hands back inline. Gzipped, the bare book is 6KB and the
     thumb-heavy one 735KB — base64 wastes a third and gzip reclaims most of
     it even on already-compressed JPEG.

     `CompressionStream` is a platform API, not a dependency: nothing is
     fetched and nothing is installed. Where it is missing the blob is sealed
     uncompressed exactly as before, and `z` is simply absent.

     Compress THEN encrypt, in that order — the other way round compresses
     random bytes and saves nothing. The usual caveat about compression
     leaking plaintext length needs an adaptive oracle to exploit, and there
     is none here: an attacker sees one static blob, whose length already
     leaked before any of this. */
  function zipOK() {
    return typeof CompressionStream === "function" &&
           typeof DecompressionStream === "function" &&
           typeof Response === "function";
  }
  function zipThrough(stream, bytes) {
    var w = stream.writable.getWriter();
    w.write(bytes); w.close();
    return new Response(stream.readable).arrayBuffer();
  }
  function deflate(bytes) { return zipThrough(new CompressionStream("gzip"), bytes); }
  function inflate(bytes) { return zipThrough(new DecompressionStream("gzip"), bytes); }

  function seal(text, pass) {
    var salt = crypto.getRandomValues(new Uint8Array(16));
    var iv = crypto.getRandomValues(new Uint8Array(12));
    var raw = new TextEncoder().encode(text);
    var zipped = zipOK();
    return (zipped ? deflate(raw).then(function (buf) { return new Uint8Array(buf); })
                   : Promise.resolve(raw))
      .then(function (body) {
        return deriveKey(pass, salt).then(function (key) {
          return subtle().encrypt({ name: "AES-GCM", iv: iv }, key, body);
        });
      })
      .then(function (ct) {
        var o = { v: 1, kdf: "PBKDF2-SHA256", it: 250000,
                  salt: b64(salt), iv: b64(iv), ct: b64(ct) };
        if (zipped) o.z = "gzip";
        return JSON.stringify(o, null, 1);
      });
  }
  function unseal(blob, pass) {
    var o;
    try { o = JSON.parse(blob); } catch (e) { return Promise.reject(new Error("That is not a Mashghal file.")); }
    if (!o || !o.ct || !o.salt || !o.iv) return Promise.reject(new Error("That file is not sealed the way this app seals things."));
    return deriveKey(pass, unb64(o.salt)).then(function (key) {
      return subtle().decrypt({ name: "AES-GCM", iv: unb64(o.iv) }, key, unb64(o.ct));
    }).then(function (pt) {
      /* A blob with no `z` is one sealed before this and is read unchanged,
         which is the whole point of the marker. The reverse is not true: an
         older copy of the app meeting a gzipped blob decrypts it and fails to
         parse, and says "wrong passphrase" — misleading, but loud, and both
         devices are the same person's. */
      if (o.z !== "gzip") return JSON.parse(new TextDecoder().decode(pt));
      if (!zipOK()) throw new Error("This book was compressed by another device and this browser cannot unpack it.");
      return inflate(new Uint8Array(pt)).then(function (buf) {
        return JSON.parse(new TextDecoder().decode(new Uint8Array(buf)));
      });
    }, function () {
      /* The rejection handler is the SECOND argument of this `then`, not of
         the one above: a handler cannot catch the rejection of its own
         sibling, so attached one link earlier it never saw a failed decrypt at
         all and a wrong passphrase came out as an unhandled DOMException. */
      throw new Error("Wrong passphrase — nothing was changed.");
    });
  }

  /* ---------------- the gist ---------------- */

  function ghFetch(url, token, opts) {
    opts = opts || {};
    opts.headers = { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json" };
    if (opts.body) opts.headers["Content-Type"] = "application/json";
    return fetch(url, opts).then(function (res) {
      if (res.status === 401 || res.status === 403) {
        throw new Error("GitHub refused the token. It may have expired, or it may not carry gist access.");
      }
      if (res.status === 404) throw new Error("That gist was not found by this token.");
      if (!res.ok) throw new Error("GitHub answered " + res.status + ".");
      return res.json();
    }, function (e) {
      if (e instanceof TypeError) throw new Error("No answer from GitHub — you may be offline.");
      throw e;
    });
  }
  // One request, both files: the book and the pictures are read together and
  // a second round trip would only widen the window in which they disagree.
  function gistRead(id, token) {
    return ghFetch("https://api.github.com/gists/" + id, token).then(function (g) {
      var files = g.files || {};
      var f = files[GIST_FILE];
      if (!f) throw new Error("That gist has no " + GIST_FILE + " in it.");
      function body(x) {
        if (!x) return Promise.resolve("");
        if (x.truncated && x.raw_url) return fetch(x.raw_url).then(function (r) { return r.text(); });
        return Promise.resolve(x.content || "");
      }
      return body(f).then(function (book) {
        /* A thumbnail file that will not come back is not a reason to fail the
           sync. The book is the record; pictures are a convenience, and a
           device that cannot read them keeps the ones it already has. */
        return body(files[THUMB_FILE]).then(
          function (th) { return { book: book, thumbs: th }; },
          function () { return { book: book, thumbs: "", thumbsFailed: true }; });
      });
    });
  }
  function gistWrite(id, token, content, thumbBlob) {
    var files = {};
    files[GIST_FILE] = { content: content };
    files[DIGEST_FILE] = { content: JSON.stringify(digestPayload(), null, 1) };
    if (thumbBlob) files[THUMB_FILE] = { content: thumbBlob };
    return ghFetch("https://api.github.com/gists/" + id, token,
      { method: "PATCH", body: JSON.stringify({ files: files }) });
  }
  function gistCreate(token, content, thumbBlob) {
    var files = {}; files[GIST_FILE] = { content: content };
    // The pictures go in at creation too, or the first device keeps them to
    // itself until something else happens to change.
    if (thumbBlob) files[THUMB_FILE] = { content: thumbBlob };
    return ghFetch("https://api.github.com/gists", token, {
      method: "POST",
      body: JSON.stringify({ description: "Mashghal — sealed", "public": false, files: files })
    });
  }

  /* ---------------- the act ---------------- */

  function noteDevice() {
    state.devices[deviceId()] = {
      name: syncCfg().deviceName || "unnamed device",
      at: stampNow(),
      borrowed: borrowed()
    };
  }

  // Pull, merge, push — one act, because pushing without having pulled is how
  // one device quietly overwrites another's day.
  function syncNow(quiet) {
    if (syncing) return;
    if (!syncOn()) { toast("Sync is not set up on this device."); return; }
    if (!subtle()) { toast("This browser has no Web Crypto, so nothing can be sealed."); return; }
    syncing = true;
    var cfg = syncCfg(), tok = secret(TOK_KEY), pass = secret(PASS_KEY);
    if (!quiet) toast("Syncing…");
    stampRecords();
    var picsFailed = false;
    gistRead(cfg.gistId, tok)
      .then(function (got) {
        picsFailed = !!got.thumbsFailed;
        var book = String(got.book || "").trim();
        var th = String(got.thumbs || "").trim();
        return (book ? unseal(book, pass) : Promise.resolve(null)).then(function (remote) {
          /* A thumbnail file that will not open is not a reason to fail the
             sync. The book is the record; pictures are a convenience, and a
             device that cannot read them keeps the ones it already has. */
          if (!th) return { remote: remote, thumbs: null };
          return unseal(th, pass).then(
            function (t) { return { remote: remote, thumbs: t }; },
            function () { picsFailed = true; return { remote: remote, thumbs: null }; });
        });
      })
      .then(function (got) {
        var counts = got.remote ? mergeIn(got.remote) : { added: 0, updated: 0, removed: 0 };
        /* After the book, never before: the merge replaces the node records,
           and the remote copies carry no `thumb` at all now. Re-attaching
           from the merged map is what keeps a picture on the screen through a
           sync that did not carry it. */
        counts.pics = mergeThumbs(got.thumbs);
        noteDevice();
        stampRecords();
        cfg.lastPulledAt = stampNow();
        save();
        return seal(JSON.stringify(payload()), pass).then(function (sealed) {
          return seal(JSON.stringify(thumbPayload()), pass).then(
            function (th) { return gistWrite(cfg.gistId, tok, sealed, th); },
            // Sealing the pictures failed; push the book without them rather
            // than not at all.
            function () { picsFailed = true; return gistWrite(cfg.gistId, tok, sealed, null); });
        }).then(function () { return counts; });
      })
      .then(function (counts) {
        syncing = false;
        render();
        var bits = [];
        if (counts.added) bits.push(counts.added + " new");
        if (counts.updated) bits.push(counts.updated + " updated");
        if (counts.pics) bits.push(counts.pics + (counts.pics === 1 ? " picture" : " pictures"));
        /* `quiet` was honoured in the .catch and IGNORED here, so the 90s
           heartbeat and the every-change debounce both announced themselves —
           "Synced — nothing had changed elsewhere", over the card you were
           reading, on a sync nobody asked for. A background pass says
           something only when something actually crossed, or when the
           pictures did not: silence is the correct report for a no-op, and a
           toast is for something that happened. Pressing Sync yourself still
           always gets an answer, because then you asked. */
        var said = bits.length ? "Synced — " + bits.join(", ") : "Synced — nothing had changed elsewhere";
        if (picsFailed) toast(said + ". The pictures did not travel this time; the book did.");
        else if (bits.length || !quiet) toast(said);
      })
      .catch(function (e) {
        syncing = false;
        syncFail = e && e.message ? e.message : "it failed";
        render();
        if (!quiet) toast(e && e.message ? e.message : "Sync failed, and nothing was changed.");
      });
  }

  /* ---------------- syncing without being asked ----------------
     It used to be a button, and the button is exactly the failure: a board
     written on the phone stayed on the phone, because nobody pressed anything.
     "Sync is something you press" was a UX choice and it cost real work.

     What is NOT relaxed is the merge. Every automatic pass is the same
     pull-merge-push as the button, so the rule that matters — never push
     without having pulled, or you overwrite someone's day — is untouched.
     Only the trigger changed.

     Three triggers, because they answer different failures:
       a change, debounced, so an edit reaches the other device by itself;
       a heartbeat, so the OTHER device's edits reach this one while it sits open;
       coming back to the tab or to the network, which is the moment a phone
       picks up everything it missed in a pocket. */
  var AUTO_DEBOUNCE = 4000;    // after the last edit, not the first
  var AUTO_HEARTBEAT = 90000;  // ~30 calls an hour, against a 5000/hr budget
  var autoTimer = null, beatTimer = null, syncFail = "", lastAuto = 0;

  function autoOn() { return syncOn() && !syncing; }

  function nudgeSync(why) {
    if (!autoOn()) return;
    if (document.hidden) return;   // a hidden tab has nothing new to say
    if (Date.now() - lastAuto < 2500) return;
    lastAuto = Date.now();
    syncFail = "";
    syncNow(true);                 // quiet: no toast unless it actually fails
  }

  // Debounced, so typing a name does not fire a request per keystroke.
  function syncSoon() {
    if (!syncOn()) return;
    if (autoTimer) clearTimeout(autoTimer);
    autoTimer = setTimeout(function () { autoTimer = null; nudgeSync("edit"); }, AUTO_DEBOUNCE);
  }

  function startHeartbeat() {
    if (beatTimer) clearInterval(beatTimer);
    beatTimer = setInterval(function () { nudgeSync("heartbeat"); }, AUTO_HEARTBEAT);
  }

  function wireAutoSync() {
    startHeartbeat();
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) nudgeSync("back to the tab");
    });
    window.addEventListener("online", function () { nudgeSync("back online"); });
    // A last push on the way out, best effort — the tab may not get to finish.
    window.addEventListener("pagehide", function () {
      if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; nudgeSync("leaving"); }
    });
  }

  // What the screen says about it, in words rather than a spinner.
  function syncWords() {
    var cfg = syncCfg();
    if (!syncOn()) return "Off — this device keeps its own book";
    if (syncing) return "Syncing now…";
    if (!navigator.onLine) return "Offline — it will catch up by itself";
    if (syncFail) return "Last attempt failed: " + syncFail + ". It will try again.";
    if (!cfg.lastPulledAt) return "Set up, but it has not run yet";
    var mins = Math.round((Date.now() - new Date(cfg.lastPulledAt).getTime()) / 60000);
    if (mins < 1) return "Up to date, a moment ago";
    if (mins === 1) return "Up to date, a minute ago";
    if (mins < 60) return "Up to date, " + mins + " minutes ago";
    return "Last synced " + Math.round(mins / 60) + "h ago";
  }

  function syncSetupDialog() {
    var cfg = syncCfg();
    openModal({
      title: "Set up sync", wide: true, confirmLabel: "Save",
      message: "Your book is sealed on this device with the passphrase and only then sent, so GitHub holds characters it cannot read. " +
        "A <b>secret</b> gist is unlisted rather than private — anyone with the link can fetch it — which is why the sealing is the whole of the privacy. " +
        "Use a fine-grained token with gist access and nothing else.",
      fields: [
        /* Both were plain text, so they sat readable on screen on exactly the
           kind of machine this design was written for — a laptop that is not
           yours. type=password also stops them being offered to a password
           manager as ordinary text. */
        { key: "token", label: "GitHub token", type: "password", span: true, value: secret(TOK_KEY),
          placeholder: "github_pat_…", hint: "Stored on this device only, never in a backup." },
        { key: "pass", label: "Passphrase", type: "password", span: true, value: secret(PASS_KEY),
          hint: "Lose this and the gist is unreadable. There is no recovery, by design." },
        { key: "gistId", label: "Gist id", type: "text", span: true, value: cfg.gistId,
          hint: "Leave blank on the first device and one will be made for you." },
        { key: "deviceName", label: "Call this device", type: "text", span: true,
          value: cfg.deviceName, placeholder: "Legion" },
        { key: "borrowed", label: "Is this your own machine?", type: "select", span: true,
          options: [{ value: "no", label: "Yes — remember it here" },
                    { value: "yes", label: "No — forget everything when I close the tab" }],
          value: cfg.borrowed ? "yes" : "no" }
      ],
      validate: function (v) {
        if (!v.token.trim()) return "A token is needed to reach the gist.";
        if (v.pass.trim().length < 8) return "Use a passphrase of at least eight characters.";
        if (!v.deviceName.trim()) return "Name the device, so you can tell from your phone which laptop is still signed in.";
        return null;
      },
      onConfirm: function (v) {
        cfg.borrowed = v.borrowed === "yes";
        cfg.deviceName = v.deviceName.trim();
        cfg.mode = "gist";

        setSecret(PASS_KEY, v.pass.trim());
        if (cfg.borrowed) armBorrowed();
        if (v.gistId.trim()) {
          cfg.gistId = v.gistId.trim();
          save(); render();
          syncNow();
          return;
        }
        toast("Making a gist…");
        seal(JSON.stringify(payload()), v.pass.trim())
          .then(function (sealed) {
            return seal(JSON.stringify(thumbPayload()), v.pass.trim()).then(
              function (th) { return gistCreate(v.token.trim(), sealed, th); },
              function () { return gistCreate(v.token.trim(), sealed, null); });
          })
          .then(function (g) {
            cfg.gistId = g.id;
            noteDevice(); save(); render();
            toast("Sync is on. The gist id is " + g.id);
          })
          .catch(function (e) {
            cfg.mode = "none"; save(); render();

  // On a machine that is not yours, nothing should outlive the tab.
  function armBorrowed() {
    if (armBorrowed.done) return;
    armBorrowed.done = true;
    window.addEventListener("pagehide", function () {
      if (!borrowed()) return;
      try { localStorage.removeItem(APP.storeKey); localStorage.removeItem(DEV_KEY); } catch (e) {}
      dropSecrets();
    });
  }

  /* ================= backups that happen without being asked =================

     Sync and a backup are different jobs and one does not cover the other.
     Sync propagates the CURRENT state — so a mistake propagates too, promptly
     and to every device. A backup preserves an EARLIER one, which is the only
     thing that helps after a bad delete or a sample loaded over a real book.

     Kept in IndexedDB rather than localStorage, because a rolling set of whole
     books would crowd out the book itself and browsers scope that quota to the
     site, which five sibling apps share. Ten are kept: roughly a fortnight at
     one a day, and small — a large book is a few hundred KB of text.

     It is still not an off-device copy, and the screen says so. A dropped
     laptop takes these with it. */
  /* ================= what a thing actually holds =================

     A photo node was a label and nothing else — the app said "frame 1962-04"
     and held no frame. Pictures live in IndexedDB, the same reasoning as
     Coffer's receipts: one phone photo is larger than the entire written record,
     and localStorage is scoped to the site, which five sibling apps share — one
     holiday's worth of pictures would stop every one of them being able to save.

     They are deliberately NOT synced. The gist holds a sealed text record; a
     few megabytes of photographs through the same door would make every sync
     slow and eventually fail, and the failure would be silent. The screen says
     so rather than letting it be discovered. */
  var PIC_DB = "mashghal-pics", PIC_STORE = "pics";
  var PIC_MAX = 1400;          // longest edge, after which it is resized
  var PIC_BYTES = 900 * 1024;  // refuse anything still larger than this

  /* ---- the one piece of a picture that DOES travel ----

     "The photo is on this device only" is a true sentence and a useless app:
     a board built at the desk and read on the phone showed a named frame and
     no frame. So a picture is now two things, deliberately different sizes.

     The full one (PIC_MAX, a couple of hundred KB) stays in IndexedDB on the
     machine that took it — through the sealed gist it would make every sync
     slow and then fail, silently, which is the one failure this app is not
     allowed to have.

     A THUMBNAIL (PIC_THUMB, about the size of a paragraph of text) is stored
     on the node itself, so it goes wherever the record goes: sync, backup,
     every device. It is capped hard, and a picture whose thumbnail will not
     fit under the cap simply does not get one rather than quietly turning the
     record into an album — a board of ten photographs costs about 150KB, and
     that is the budget being spent knowingly.

     So: everywhere shows the thumbnail; the device that holds the full one
     shows that instead. And `url` is there for the third case — the full-size
     file kept in Google Drive (or anywhere with a link), which is the only way
     a large picture can be opened on another machine. Drive's own API is not
     used and will not be: it needs Google's script from a CDN and an OAuth
     client, and this repo fetches nothing and holds no secret. */
  var PIC_THUMB = 300;            // longest edge of the travelling copy
  var THUMB_CHARS = 34 * 1024;    // data-URL characters; over this, no thumbnail

  /* ---------------- getting a picture in, off the main thread ----------------

     The old route did every expensive part on the thread that paints: a
     FileReader turned a five-megabyte phone photo into a seven-megabyte base64
     string, `new Image()` decoded that string, and `toDataURL` encoded the
     result. On a phone — which is where a photograph is actually taken — the
     app froze for the duration of all three, with nothing on screen to say
     why.

     `createImageBitmap` takes the Blob straight and decodes **off** the main
     thread, so the base64 round trip on the way in disappears entirely.
     `OffscreenCanvas.convertToBlob` encodes off it too. Both are platform
     APIs; where either is missing the old path is still here and still
     correct, which is the only honest way to use a capability that is not
     everywhere. */

  /* The dimensions, without asking for the pixels. An <img> reports
     naturalWidth once it has loaded, and loading only needs the header — the
     decode happens when something draws it, which is exactly what we are
     avoiding on this thread. */
  function sizeOf(blob) {
    return new Promise(function (res, rej) {
      if (!window.URL || !URL.createObjectURL) { rej(new Error("no object urls")); return; }
      var url = URL.createObjectURL(blob);
      var img = new Image();
      img.onload = function () {
        var out = { w: img.naturalWidth || img.width, h: img.naturalHeight || img.height };
        URL.revokeObjectURL(url);
        if (!out.w || !out.h) rej(new Error("That does not look like a picture."));
        else res(out);
      };
      img.onerror = function () {
        URL.revokeObjectURL(url);
        rej(new Error("That does not look like a picture."));
      };
      img.src = url;
    });
  }

  /* Decode AND resize in one off-thread call. This is the whole of the fix:
     `createImageBitmap(file)` alone decodes off the thread but hands back the
     full 3000×2250 bitmap, and the `drawImage` that scales it down runs on
     the thread that paints — which measured as a 1.3-second freeze on a
     phone-sized photograph. With `resizeWidth`/`resizeHeight` the scaling
     happens inside the decode, and all the main thread ever does is blit a
     bitmap that is already the right size. */
  function bitmapAt(blob, w, h, edge) {
    if (typeof createImageBitmap !== "function") return Promise.reject(new Error("no bitmap"));
    var scale = Math.min(1, edge / Math.max(w, h));
    var cw = Math.max(1, Math.round(w * scale));
    var ch = Math.max(1, Math.round(h * scale));
    return createImageBitmap(blob, {
      resizeWidth: cw, resizeHeight: ch, resizeQuality: "high"
    }).then(function (bmp) { return { bmp: bmp, w: cw, h: ch }; });
  }
  function offscreenOK() {
    return typeof OffscreenCanvas === "function" &&
           typeof OffscreenCanvas.prototype.convertToBlob === "function";
  }
  function blobToDataUrl(blob) {
    return new Promise(function (res, rej) {
      var fr = new FileReader();
      fr.onerror = function () { rej(new Error("Could not read that picture back.")); };
      fr.onload = function () { res(fr.result); };
      fr.readAsDataURL(blob);
    });
  }
  /* Draw a source of known size into a canvas at `edge` and encode it. The
     encode is the part worth moving: a 1400px JPEG is the difference between
     a visible stall and none. */
  function drawTo(src, w, h, edge, quality) {
    var scale = Math.min(1, edge / Math.max(w, h));
    var cw = Math.max(1, Math.round(w * scale));
    var ch = Math.max(1, Math.round(h * scale));
    if (offscreenOK()) {
      var oc = new OffscreenCanvas(cw, ch);
      var ox = oc.getContext("2d");
      ox.imageSmoothingQuality = "high";
      ox.drawImage(src, 0, 0, cw, ch);
      return oc.convertToBlob({ type: "image/jpeg", quality: quality }).then(blobToDataUrl);
    }
    var c = document.createElement("canvas");
    c.width = cw; c.height = ch;
    var x = c.getContext("2d");
    x.imageSmoothingQuality = "high";
    x.drawImage(src, 0, 0, cw, ch);
    return Promise.resolve(c.toDataURL("image/jpeg", quality));
  }

  /* The thumbnail, from the bitmap where there is one. Encoding it from the
     full data URL meant decoding the whole picture a second time, which is
     the same stall again for no reason. */
  function thumbFrom(src, w, h) {
    return drawTo(src, w, h, PIC_THUMB, 0.62).then(function (out) {
      if (out.length <= THUMB_CHARS) return out;
      return drawTo(src, w, h, PIC_THUMB, 0.45).then(function (small) {
        return small.length > THUMB_CHARS ? "" : small;
      });
    });
  }

  // picThumb is gone: it took a finished data URL and decoded the whole picture
  // a second time to make the small one. thumbFrom() works from whatever was
  // already decoded, and picPair() makes both copies from one decode.

  /* A node HAS a picture if either copy is here: the full one on this device,
     or the travelling thumbnail, which is what a phone sees of a photograph
     added at the desk. Reading `n.pic` alone is how the other device came to
     show a named frame and no frame. */
  function hasPic(n) { return !!(n && (n.pic || n.thumb)); }

  /* Node ids are uids, so the id alone finds it — which is what lets the sheet
     and the rows both carry `data-thumb` without also carrying which board
     they are on. */
  function thumbOf(nodeId) {
    var found = "";
    (state.boards || []).some(function (b) {
      return (b.nodes || []).some(function (n) {
        if (n.id === nodeId && n.thumb) { found = n.thumb; return true; }
        return false;
      });
    });
    return found;
  }

  function picOpen() {
    return new Promise(function (res, rej) {
      if (!window.indexedDB) { rej(new Error("This browser has no IndexedDB.")); return; }
      var r = indexedDB.open(PIC_DB, 1);
      r.onupgradeneeded = function () {
        if (!r.result.objectStoreNames.contains(PIC_STORE)) r.result.createObjectStore(PIC_STORE);
      };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error || new Error("could not open")); };
    });
  }
  function picPut(id, dataUrl) {
    return picOpen().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction(PIC_STORE, "readwrite");
        tx.objectStore(PIC_STORE).put(dataUrl, id);
        tx.oncomplete = function () { res(id); };
        tx.onerror = function () { rej(tx.error); };
      });
    });
  }
  function picGet(id) {
    return picOpen().then(function (db) {
      return new Promise(function (res) {
        var tx = db.transaction(PIC_STORE, "readonly");
        var q = tx.objectStore(PIC_STORE).get(id);
        q.onsuccess = function () { res(q.result || ""); };
        q.onerror = function () { res(""); };
      });
    }).catch(function () { return ""; });
  }
  function picDrop(id) {
    return picOpen().then(function (db) {
      return new Promise(function (res) {
        var tx = db.transaction(PIC_STORE, "readwrite");
        tx.objectStore(PIC_STORE).delete(id);
        tx.oncomplete = function () { res(); };
        tx.onerror = function () { res(); };
      });
    }).catch(function () {});
  }

  /* Resized before it is stored. A modern phone photo is four or five
     megabytes; at 1400px it is a couple of hundred KB and still far more than
     enough to recognise a frame or read a label. */
  /* Both copies, each from its own off-thread decode-and-resize. Two decodes
     rather than one is deliberate: they happen off the thread that paints,
     and the alternative — decode once at full size, then scale twice here —
     puts both scalings exactly where they hurt. */
  function picPair(file) {
    function legacy() {
      // No createImageBitmap or no object URLs: the old route, unchanged and
      // still correct, and still slow — which is why it is the fallback.
      function fromSource(src, w, h) {
        return drawTo(src, w, h, PIC_MAX, 0.82).then(function (out) {
          if (out.length <= PIC_BYTES * 1.37) return out;
          return drawTo(src, w, h, PIC_MAX, 0.6);
        }).then(function (full) {
          if (full.length > PIC_BYTES * 1.37) {
            throw new Error("Still too large after resizing. Try a smaller picture.");
          }
          return thumbFrom(src, w, h).then(function (small) {
            return { full: full, thumb: small };
          }, function () { return { full: full, thumb: "" }; });
        });
      }
      return new Promise(function (res, rej) {
        var fr = new FileReader();
        fr.onerror = function () { rej(new Error("Could not read that file.")); };
        fr.onload = function () {
          var img = new Image();
          img.onerror = function () { rej(new Error("That does not look like a picture.")); };
          img.onload = function () { fromSource(img, img.width, img.height).then(res, rej); };
          img.src = fr.result;
        };
        fr.readAsDataURL(file);
      });
    }

    if (typeof createImageBitmap !== "function") return legacy();

    return sizeOf(file).then(function (nat) {
      // the full copy
      return bitmapAt(file, nat.w, nat.h, PIC_MAX).then(function (big) {
        return drawTo(big.bmp, big.w, big.h, PIC_MAX, 0.82).then(function (out) {
          if (out.length <= PIC_BYTES * 1.37) return out;
          return drawTo(big.bmp, big.w, big.h, PIC_MAX, 0.6);
        }).then(function (full) {
          if (big.bmp.close) big.bmp.close();
          if (full.length > PIC_BYTES * 1.37) {
            throw new Error("Still too large after resizing. Try a smaller picture.");
          }
          return full;
        }, function (e) {
          if (big.bmp.close) big.bmp.close();
          throw e;
        });
      }).then(function (full) {
        // and the travelling one, from its own decode at 300px
        return bitmapAt(file, nat.w, nat.h, PIC_THUMB).then(function (small) {
          return thumbFrom(small.bmp, small.w, small.h).then(function (th) {
            if (small.bmp.close) small.bmp.close();
            return { full: full, thumb: th };
          }, function () {
            if (small.bmp.close) small.bmp.close();
            return { full: full, thumb: "" };
          });
        }, function () { return { full: full, thumb: "" }; });
      });
    }, legacy);
  }

  var BK_DB = "mashghal-backups", BK_STORE = "snaps", BK_KEEP = 10;
  var BK_MIN_GAP = 6 * 60 * 60 * 1000;   // at most four a day
  var bkLast = 0;

  function bkOpen() {
    return new Promise(function (res, rej) {
      if (!window.indexedDB) { rej(new Error("no IndexedDB")); return; }
      var r = indexedDB.open(BK_DB, 1);
      r.onupgradeneeded = function () {
        if (!r.result.objectStoreNames.contains(BK_STORE)) {
          r.result.createObjectStore(BK_STORE, { keyPath: "at" });
        }
      };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error || new Error("could not open")); };
    });
  }
  function bkTx(mode, fn) {
    return bkOpen().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction(BK_STORE, mode);
        var out = fn(tx.objectStore(BK_STORE));
        tx.oncomplete = function () { res(out && out.result !== undefined ? out.result : out); };
        tx.onerror = function () { rej(tx.error); };
      });
    });
  }
  function bkList() {
    return bkTx("readonly", function (st) { return st.getAll(); })
      .then(function (rows) {
