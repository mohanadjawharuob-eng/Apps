        }).join("") + "</div>";
    }

    /* What the preview owes the reader beyond the step list: where the work
       STARTS, and anything the sequence could not attach. A board with two
       ways in starts a run on both at once, which is how the worked example
       used to open on "watch the printing" — so the one figure worth checking
       before accepting is how many ways in it has. */
    if (read.steps.length) {
      var lk = links;
      var into = {};
      lk.chain.forEach(function (c) { into[c.to] = 1; });
      var ins = read.steps.filter(function (st, i) { return !into[i]; });
      h += '<div class="sect">Where it starts</div>' +
        '<p class="saynote" style="margin:-0.3rem 0 0.7rem">' +
        (ins.length === 1
          ? "One way in \u2014 <b>" + esc(ins[0].label) + "</b>. A run begins there and nowhere else."
          : cap(numWord(ins.length)) + " ways in \u2014 " +
            esc(ins.map(function (x) { return x.label; }).join(", ")) +
            ". A run would begin at all of them at once, which is usually not what was meant.") +
        "</p>";
      if (lk.unjoined.length) {
        h += '<div class="sect">' + (lk.unjoined.length === 1 ? "One line it could not join up" :
          cap(numWord(lk.unjoined.length)) + " lines it could not join up") + "</div>" +
          '<div class="stack tight">' + lk.unjoined.map(function (u) {
            return '<div class="panel dashed"><div class="grow">' +
              '<div class="nm sm">\u201c' + esc(u.label) + '\u201d</div>' +
              '<div class="says">After \u201c' + esc(u.after) + '\u201d, ' + esc(u.why) +
              ", so it cannot tell which branch this follows. It will be written down unattached \u2014 " +
              "draw the line yourself, or name the branch it belongs to.</div></div></div>";
          }).join("") + "</div>";
      }
    }

    h += '<div class="tools" style="margin-top:1.2rem">' +
      '<button class="btn primary" data-act="prose-accept"' + (read.steps.length ? "" : " disabled") + '>' +
      (read.steps.length ? "Accept — " + read.steps.length + (read.steps.length === 1 ? " step" : " steps") : "Nothing to accept") + "</button>" +
      '<span class="saynote" style="margin:0;align-self:center">Nothing exists until you accept it.</span></div>';
    h += "</div></div>";
    return h;
  }

  /* Re-reads as you type, but debounced and never while the cursor is in the
     box — re-rendering a textarea under someone's hands loses the caret, which
     is the single most annoying thing a live preview can do. The reading is
     refreshed on a pause and on blur. */
  var proseTimer = null;
  function mountProse() {
    var ta = document.getElementById("proseIn");
    if (!ta) return;
    ta.addEventListener("input", function () {
      proseText = ta.value;
      if (proseTimer) clearTimeout(proseTimer);
      proseTimer = setTimeout(function () {
        proseTimer = null;
        var at = ta.selectionStart;
        render();
        var again = document.getElementById("proseIn");
        if (again) { again.focus(); try { again.setSelectionRange(at, at); } catch (e) {} }
      }, 500);
    });
    ta.addEventListener("blur", function () { proseText = ta.value; });
  }

  function proseSays(st, read) {
    var bits = [vocabLabel("acts", st.act)];
    if (st.act === "send" && st.to.length) bits.push("to " + st.to.join(" and "));
    if (st.chaseDays) bits.push("remind after " + st.chaseDays + (num(st.chaseDays) === 1 ? " day" : " days"));
    else if (st.act === "send" || st.act === "watch") bits.push("no reminder set");
    if (st.act === "file") bits.push("will block closing");
    if (st.dueWords) bits.push("dated: " + st.dueWords);
    return bits.join(" · ");
  }

  /* ================= actions ================= */

  function split(id) { var p = String(id).split(":"); return { b: byId(state.boards, p[0]), n: p[1] }; }
  function go(fn) { fn(); stampRecords(); save(); render(); syncSoon(); bkMaybe(); }

  // editNode is gone: a tap on the sheet selects the node now and the edit
  // dialog is one button on the selection bar — see selPanel().

  APP.actions = {
    /* ---- boards ---- */
    /* Every route that leaves the board unmaximizes. `board-open` does it too:
       arriving from the finder while the previous board was maximized would
       otherwise open the new one full-screen with no box carrying the class,
       so `html.cvmax` locked the scroll over an ordinary page. */
    "board-open": function (id) { unmaximize(); openId = id; view = "boards"; render(); },
    "board-back": function () { unmaximize(); openId = ""; foldOpen = false; render(); },

    /* ---- the finder ---- */
    "find-open": function () { findOpen(); },

    /* ---- projects ---- */
    "proj-open": function (id) { openProj = id; projTab = "over"; view = "jobs"; render(); },
    /* A project lands on its overview, every time. Opening on whichever page
       you last looked at is the trap Horizon fell into: the screen shows
       something different depending on what you did ten minutes ago, and
       nobody can learn where anything is. */
    "proj-page":  function (id) { projTab = id; render(); },
    // Back goes to the job it is for, or to the list when it has none — one
    // level up, never two, the same rule as every other Back in the app.
    "proj-back": function () {
      var p = projOf(openProj);
      openProj = "";
      openJob = p && p.jobId && jobOf(p.jobId) ? p.jobId : "";
      render();
    },
    "owner-set": function () {
      openModal({
        title: "Your name", confirmLabel: "Save",
        message: "Whose workspace this is. It heads the sidebar, greets you on Home, and is stored in your book \u2014 nothing is sent anywhere.",
        fields: [{ key: "owner", label: "Name", type: "text", value: ownerName(), span: true,
                   placeholder: "Mohannad Haysam Jawhar" }],
        onConfirm: function (v) {
          go(function () { state.settings.owner = String(v.owner || "").trim(); });
          toast(ownerName() ? "Saved" : "Taken off");
        }
      });
    },

    "owner-clear": function () {
      confirmAction({
        title: "Take your name off?",
        message: "The sidebar goes back to reading Mashghal and Home greets the time of day. Nothing else changes.",
        confirmLabel: "Take it off",
        onConfirm: function () { go(function () { state.settings.owner = ""; }); toast("Taken off"); }
      });
    },

    "proj-add": function (id) {
      if (id && jobOf(id)) openJob = id;
      projDialog(null);
    },
    "proj-edit": function (id) { projDialog(projOf(id)); },

    /* Setting a project down is the one thing about a project that is stated
       rather than derived: from the outside, work deliberately parked and work
       with nothing running look identical, and nothing in the record can tell
       them apart. */
    "proj-park": function (id) {
      var p = projOf(id); if (!p) return;
      var was = !!p.parked;
      go(function () { p.parked = !was; });
      toast(was ? "Picked back up" : "Set down — it stays on the list, quietly",
        function () { go(function () { p.parked = was; }); });
    },

    /* Deleting a project keeps every board, exactly as Coffer's pocket delete
       keeps every entry: the boards are the work and the project was only a
       bag for it. They move to "not in a project" on the job page, and the
       name is kept so a board that still names it reads "(removed)" rather
       than losing where it came from. */
    "proj-del": function (id) {
      var p = projOf(id); if (!p) return;
      var bs = projBoards(id), runs = bs.filter(function (b) { return b.kind === "run" && !b.closedOn; }).length;
      confirmAction({
        title: "Delete " + p.name + "?",
        message: (bs.length
          ? "Its " + numWord(bs.length) + (bs.length === 1 ? " board" : " boards") +
            (runs ? " (" + numWord(runs) + " still running)" : "") +
            (bs.length === 1 ? " stays" : " stay") + " exactly as " +
            (bs.length === 1 ? "it is" : "they are") + " \u2014 " +
            (bs.length === 1 ? "it moves" : "they move") + " to \u201cnot in a project\u201d under " +
            (p.jobId ? esc(jobName(p.jobId)) : "no job") + ". "
          : "It holds no boards. ") +
          "Nothing recorded is deleted and no step loses its dates."
      }, function () {
        var undo = { id: p.id, rec: JSON.parse(JSON.stringify(p)) };
        go(function () {
          state.forgotten[p.id] = p.name;
          state.projects = state.projects.filter(function (x) { return x.id !== p.id; });
          if (openProj === p.id) {
            openProj = "";
            openJob = undo.rec.jobId && jobOf(undo.rec.jobId) ? undo.rec.jobId : "";
          }
        });
        toast("Deleted — its boards were not touched", function () {
          go(function () {
            state.projects.push(undo.rec);
            delete state.forgotten[undo.id];
            delete state.tombstones[undo.id];
          });
        });
      });
    },

    /* `id` is the project to put it in when the button was pressed on a
       project's own page — there is no sense in asking again on the screen
       that already answered it. */
    "board-new": function (id) {
      var into = id && projOf(id) ? id : (openProj || "");
      openModal({
        title: "New procedure", confirmLabel: "Create",
        message: "A board is a procedure you can run again and again. A bench is optional — a visa belongs to no employer.",
        fields: [
          { key: "name", label: "Name", type: "text", value: "", span: true, placeholder: "Brochure" },
          { key: "kindId", label: "Kind", type: "select", options: kindOpts(), value: "" },
          { key: "benchId", label: "Bench", type: "select", options: benchOpts(), value: "" },
          { key: "projectId", label: "Project", type: "select", span: true,
            options: projOpts(openJob), value: into }
        ],
        validate: function (v) { return v.name.trim() ? null : "Give it a name."; },
        onConfirm: function (v) {
          go(function () {
            var b = newBoard(v.name.trim(), v.kindId, v.benchId);
            b.projectId = v.projectId;
            state.boards.push(b);
            openId = b.id;
            // Opening the new board means leaving the project page, or the
            // board is created and nothing on screen changes.
            if (openProj) { openProj = ""; }
          });
          toast("Board created");
        }
      });
    },

    "board-edit": function (id) {
      var b = byId(state.boards, id); if (!b) return;
      openModal({
        title: "Rename board", confirmLabel: "Save",
        fields: [
          { key: "name", label: "Name", type: "text", value: b.name, span: true },
          { key: "kindId", label: "Kind", type: "select", options: kindOpts(), value: b.kindId },
          { key: "benchId", label: "Bench", type: "select", options: benchOpts(), value: b.benchId },
          { key: "projectId", label: "Project", type: "select", span: true,
            options: projOpts(b.jobId), value: b.projectId || "" }
        ],
        validate: function (v) { return v.name.trim() ? null : "Give it a name."; },
        onConfirm: function (v) {
          go(function () {
            b.name = v.name.trim(); b.kindId = v.kindId; b.benchId = v.benchId;
            b.projectId = v.projectId;
          });
        }
      });
    },

    "board-del": function (id) {
      var b = byId(state.boards, id); if (!b) return;
      var runs = state.boards.filter(function (r) { return r.fromBoardId === b.id && !r.archived; });
      confirmAction({
        title: "Delete " + b.name + "?",
        message: b.kind === "template" && runs.length
          ? "Its " + runs.length + " run" + (runs.length === 1 ? "" : "s") +
            " will be left alone — a run froze its own copy when it started, so nothing of theirs is lost."
          : "This cannot be undone from here, though a backup would still have it."
      }, function () {
        go(function () {
          b.archived = true;
          state.forgotten[b.id] = b.name;
          if (openId === b.id) openId = "";
        });
        toast("Deleted " + b.name);
      });
    },

    /* ---- runs ---- */
    "run-start": function () {
      var tpls = boards("template");
      if (!tpls.length) { toast("Write a procedure first."); return; }
      openModal({
        title: "Start a run", confirmLabel: "Start",
        message: "The run takes its own frozen copy of the procedure. Editing the procedure later will not disturb it.",
        fields: [
          { key: "boardId", label: "Procedure", type: "select",
            options: tpls.map(function (t) { return { value: t.id, label: t.name }; }), value: tpls[0].id },
          { key: "title", label: "Call this run", type: "text", value: "", span: true, placeholder: "Harbour festival brochure" }
        ],
        validate: function (v) { return v.title.trim() ? null : "Give the run a name you will recognise."; },
        onConfirm: function (v) {
          var tpl = byId(state.boards, v.boardId);
          if (!tpl) return;
          go(function () { openId = startRun(tpl, v.title.trim()).id; });
          toast("Run started");
        }
      });
    },

    "run-this": function (id) {
      var tpl = byId(state.boards, id); if (!tpl) return;
      if (!tpl.nodes.filter(function (n) { return n.t === "step"; }).length) {
        toast("Add a step before running it."); return;
      }
      openModal({
        title: "Run " + tpl.name, confirmLabel: "Start",
        fields: [{ key: "title", label: "Call this run", type: "text", value: "", span: true }],
        validate: function (v) { return v.title.trim() ? null : "Give the run a name."; },
        onConfirm: function (v) {
          go(function () { openId = startRun(tpl, v.title.trim()).id; });
          toast("Run started");
        }
      });
    },

    "run-close": function (id) {
      var b = byId(state.boards, id); if (!b) return;
      var uf = unfiled(b);
      if (uf.length) {
        openModal({
          title: "Not filed yet",
          message: "This run still has " + uf.length + " filing step" + (uf.length === 1 ? "" : "s") +
            " undone — <b>" + esc(uf.map(function (n) { return n.label; }).join(", ")) +
            "</b>. Filing is the thing that gets forgotten, so a run will not close until it is done.",
          /* The destructive branch used to sit on onCancel, which is also what
             Escape, the scrim and the × fire — so every "I didn't mean that"
             gesture closed a run with its filing undone, on the one dialog
             guarding the thing that actually gets forgotten. Confirm closes
             it now; cancel, Escape and the scrim leave it open. */
          confirmLabel: "Close it anyway", cancelLabel: "Leave it open", danger: true,
          onCancel: function () {},
          onConfirm: function () {
            go(function () { b.closedOn = today(); });
            toast("Closed " + b.name + " with filing undone");
          }
        });
        return;
      }
      /* Nothing left to file, so it closes — but it may still be sitting on
         a step in somebody else's court, and chasing is the FIRST of the
         three forgettings. No second dialog for a routine act; the toast
         says what it took with it, and the undo is right there. The archive
         lock guards filing and only filing, which is why this is said rather
         than refused. */
      var open = activeNodes(b).filter(function (n) { return n.t === "step"; });
      go(function () { b.closedOn = today(); });
      toast("Closed " + b.name +
        (open.length ? " \u00b7 " + open.length + (open.length === 1 ? " step was still open" : " steps were still open") : ""),
        function () { b.closedOn = ""; });
    },

    "run-reopen": function (id) {
      var b = byId(state.boards, id); if (!b) return;
      go(function () { b.closedOn = ""; });
      toast("Reopened");
    },

    /* ---- steps in a run ---- */
    "step-done": function (id) {
      var s = split(id); if (!s.b) return;
      var n = nodeOf(s.b, s.n); if (!n) return;
      var before = JSON.stringify(s.b.nodes);
      go(function () { finishStep(s.b, s.n); });
      toast("Done: " + n.label, function () { s.b.nodes = JSON.parse(before); });
    },
    "step-enter": function (id) {
      var s = split(id); if (!s.b) return;
      go(function () { enter(s.b, s.n); });
    },
    "step-reopen": function (id) {
      var s = split(id); if (!s.b) return;
      go(function () { reopenStep(s.b, s.n); });
    },
    "step-answer": function (id) {
      var s = split(id); if (!s.b) return;
      var n = nodeOf(s.b, s.n); if (!n) return;
      var answers = exitsOf(s.b, n);
      if (!answers.length) { toast("This decision has no exits yet — add one first."); return; }
      openModal({
        title: n.label, confirmLabel: "That one",
        message: "Whichever you pick is the only exit that opens. This is how the cycle repeats.",
        fields: [{ key: "answer", label: "Answer", type: "select", span: true,
          options: answers.map(function (a) {
            var t = nodeOf(s.b, a.goTo);
            return { value: a.label, label: a.label + (t ? "  →  " + t.label : "") };
          }), value: answers[0].label }],
        onConfirm: function (v) {
          var before = JSON.stringify(s.b.nodes);
          go(function () { finishStep(s.b, s.n, v.answer); });
          toast("Answered: " + v.answer, function () { s.b.nodes = JSON.parse(before); });
        }
      });
    },

    /* ---- nodes ---- */
    "node-add": function (id) { nodeDialog(byId(state.boards, id), null); },
    "thing-add": function (id) { thingDialog(byId(state.boards, id), null); },
    /* Adding a photo used to be three decisions deep: Add thing, change the
       kind to Photo, then find "Add a picture". One button, one picker — see
       pickPicture, which every route into a picture goes through. */
    "photo-add": function (id) { pickPicture(byId(state.boards, id), null, null, null); },
    "thing-borrow": function (id) { borrowDialog(byId(state.boards, id)); },
    "node-edit": function (id) {
      var s = split(id); if (!s.b) return;
      var n = nodeOf(s.b, s.n); if (!n) return;
      if (n.t === "thing") thingDialog(s.b, n); else nodeDialog(s.b, n);
    },
    "node-del": function (id) {
      var s = split(id); if (!s.b) return;
      var n = nodeOf(s.b, s.n); if (!n) return;
      confirmAction({
        title: "Remove " + n.label + "?",
        message: "Every line into and out of it goes too." +
          (n.pic ? " The picture kept on this device goes with it." : "")
      }, function () {
        // Its picture goes too, or IndexedDB fills with pictures nothing points
        // at — the same discipline as deleting a record taking its money.
        if (n.pic) picDrop(n.pic);
        go(function () {
          s.b.nodes = s.b.nodes.filter(function (x) { return x.id !== n.id; });
          s.b.edges = s.b.edges.filter(function (e) { return e.a !== n.id && e.b !== n.id; });
        });
        toast("Removed " + n.label);
      });
    },

    // An exit is a labelled line out of the decision. Naming it and choosing
    // where it goes are the same act, so they are one dialog and they write one
    // thing — no exit can exist without a line, and no line goes unlabelled.
    "exit-add": function (id) {
      var s = split(id); if (!s.b) return;
      var n = nodeOf(s.b, s.n); if (!n) return;
      var targets = s.b.nodes.filter(function (x) { return x.t === "step" && x.id !== n.id; });
      if (!targets.length) { toast("Add another step first — an exit has to go somewhere."); return; }
      openModal({
        title: "Add an exit to " + n.label, confirmLabel: "Add",
        message: "An exit that points back at an earlier step is how a cycle repeats.",
        fields: [
          { key: "label", label: "Call it", type: "text", value: "", span: true, placeholder: "repeat" },
          { key: "goTo", label: "Goes to", type: "select", span: true,
            options: targets.map(function (t) { return { value: t.id, label: t.label }; }),
            value: targets[0].id }
        ],
        validate: function (v) {
          if (!v.label.trim()) return "Give the exit a name — it is what you will be asked.";
          var dup = exitsOf(s.b, n).some(function (x) { return x.label === v.label.trim(); });
          return dup ? "That exit already exists." : null;
        },
        onConfirm: function (v) {
          go(function () {
            s.b.edges.push({ id: uid(), a: n.id, b: v.goTo, k: "flow", label: v.label.trim() });
          });
        }
      });
    },

    // Linking a person to a send IS addressing it, so this writes the same
    // link edge the Connect dialog would, from the step that needs it.
    "send-to": function (id) {
      var s = split(id); if (!s.b) return;
      var n = nodeOf(s.b, s.n); if (!n) return;
      var have = recipientsOf(s.b, n).map(function (t) { return t.id; });
      var people = s.b.nodes.filter(function (x) {
        return x.t === "thing" && x.kind === "person" && have.indexOf(x.id) < 0;
      });
      if (!people.length) {
        toast(have.length ? "Everyone on this board is already on it." : "Add a person to the board first.");
        return;
      }
      openModal({
        title: "Send " + n.label + " to", confirmLabel: "Add",
        message: have.length ? "Already goes to " + esc(recipientsOf(s.b, n).map(function (t) { return t.label; }).join(", ")) + "." : "",
        fields: [{ key: "who", label: "Person", type: "select", span: true,
          options: people.map(function (t) { return { value: t.id, label: t.label }; }), value: people[0].id }],
        onConfirm: function (v) {
          go(function () { s.b.edges.push({ id: uid(), a: n.id, b: v.who, k: "link", label: "" }); });
        }
      });
    },

    /* ---- edges ---- */
    /* Takes a board, or a board AND a node — "Connect\u2026" on one node's
       strip or menu opens this with that node already in the From box, which
       is the brief's "select source, then destination" without making the
       reader find their step again in a list of forty. */
    "edge-add": function (id) {
      var q = String(id).split(":");
      var b = byId(state.boards, q[0]); if (!b || b.nodes.length < 2) return;
      var all = b.nodes;
      var from = q[1] && nodeOf(b, q[1]) ? q[1] : all[0].id;
      var to = all.filter(function (n) { return n.id !== from; })[0].id;
      openModal({
        title: "Connect two things", confirmLabel: "Connect",
        message: "<b>Then</b> is sequence — one step follows another. <b>About</b> is association and says nothing about order, which is how a photo or a piece of kit hangs off a step without coming before it.",
        fields: [
          { key: "a", label: "From", type: "select", options: nodeOpts(b, ""), value: from },
          { key: "b", label: "To", type: "select", options: nodeOpts(b, ""), value: to },
          { key: "k", label: "Line", type: "select", value: "flow",
            options: [{ value: "flow", label: "Then — sequence" }, { value: "link", label: "About — association" }] },
          { key: "label", label: "Label (optional)", type: "text", value: "" }
        ],
        validate: function (v) {
          if (v.a === v.b) return "A line needs two different ends.";
          var dup = b.edges.some(function (e) { return e.a === v.a && e.b === v.b && e.k === v.k; });
          return dup ? "Those two are already connected that way." : null;
        },
        onConfirm: function (v) {
          go(function () {
            b.edges.push({ id: uid(), a: v.a, b: v.b, k: v.k, label: v.label.trim() });
          });
        }
      });
    },
    /* DUPLICATE AND DISCONNECT — the two of the brief's six menu items the
       app did not have. Both are what it calls routine and reversible, so
       neither confirms and both put an undo on the message: the rule in this
       file is that every removal confirms, says what it touches and offers an
       undo, and a line between two steps is the one removal where the
       confirmation is the part that gets in the way. A step carrying five
       weeks of hours is a different matter and `node-del` still asks. */
    "node-dup": function (id) {
      var s = split(id); if (!s.b || s.b.derived) return;
      var n = nodeOf(s.b, s.n); if (!n) return;
      /* A COPY AND NOT A SECOND REFERENCE, and it carries NO EDGES — the
         brief's "do not automatically connect it" applies here more than
         anywhere: a duplicated step that inherited its original's lines would
         silently put a second path through the run. The picture comes too
         (`pic` is what a thumbnail belongs to, so both nodes point at the
         same one and neither owns it), and `enteredAt`/`doneAt` do NOT: a
         copy of a finished step has not itself been done. */
      var copy = JSON.parse(JSON.stringify(n));
      copy.id = uid();
      delete copy.enteredAt; delete copy.doneAt; delete copy.chasedOn;
      copy.label = n.label + " (copy)";
      copy.x = (typeof n.x === "number" ? n.x : 0) + 28;
      copy.y = (typeof n.y === "number" ? n.y : 0) + 28;
      go(function () { s.b.nodes.push(copy); settleNode(s.b, copy); });
      sel = copy.id;
      toast("Copied " + clip(n.label, 28) + " — the copy has no lines of its own",
            function () {
              go(function () {
                s.b.nodes = s.b.nodes.filter(function (x) { return x.id !== copy.id; });
              });
              sel = n.id;
            });
    },
    "node-cut": function (id) {
      var s = split(id); if (!s.b || s.b.derived) return;
      var n = nodeOf(s.b, s.n); if (!n) return;
      var cut = edgesAt(s.b, n);
      /* A refusal says why rather than doing nothing: this is reachable from
         the strip and from the menu, and a control that quietly does nothing
         is worse than no control. (It is not offered at all when there are
         none — this is the belt.) */
      if (!cut.length) { toast("Nothing is connected to " + clip(n.label, 28) + "."); return; }
      var was = s.b.edges.slice();
      go(function () {
        s.b.edges = s.b.edges.filter(function (e) { return e.a !== n.id && e.b !== n.id; });
      });
      toast("Cut " + numWord(cut.length) + (cut.length === 1 ? " line" : " lines") +
            " off " + clip(n.label, 24),
            function () { go(function () { s.b.edges = was; }); });
    },
    /* ADD A RELATED THING, which is what the LINK edge exists for: a
       reference photo or a pair of headphones hanging off a step without
       becoming a predecessor. So it is one act, not two — the thing and the
       line it hangs by — because adding a thing and then remembering to
       connect it is exactly the step people forget. */
    "thing-here": function (id) {
      var s = split(id); if (!s.b || s.b.derived) return;
      var n = nodeOf(s.b, s.n); if (!n) return;
      thingDialog(s.b, null, { linkTo: n.id, at: { x: (typeof n.x === "number" ? n.x : 0),
                                                   y: (typeof n.y === "number" ? n.y : 0) + 150 } });
    },
    /* This was three lines straight to `go()` with no undo — the same shape
       `bench-del` had, and the rule is the same: a removal offers a way back.
       No confirmation, because one line is routine and reversible, which is
       what the brief asks for too. */
    "edge-del": function (id) {
      var p = String(id).split(":"), b = byId(state.boards, p[0]);
      if (!b) return;
      var e = byId(b.edges, p[1]); if (!e) return;
      var was = b.edges.slice();
      go(function () { b.edges = b.edges.filter(function (x) { return x.id !== p[1]; }); });
      toast(e.k === "flow" ? "Line cut" : "Association cut",
            function () { go(function () { b.edges = was; }); });
    },

    /* ---- canvas ---- */
    "cv-in":  function () { zoomBy(1.25, vb.x + vb.w / 2, vb.y + vb.h / 2); },
    "cv-out": function () { zoomBy(1 / 1.25, vb.x + vb.w / 2, vb.y + vb.h / 2); },
    "cv-fit": function () { var b = openBoard(); if (b) fitBoard(b); },
    "cv-max": function () { setMax(!cvMax); },
    "cv-tidy": function (id) {
      var b = byId(state.boards, id); if (!b) return;
      go(function () { autoLayout(b); });
      toast("Tidied");
    },

    /* ---- the switch ---- */
    /* The Job page offers its benches as one tap each. It carried
       data-act="bench-go" and there was no handler of that name, so every
       button on the most prominent row of that page did nothing — and the
       dispatcher ignores an unknown action without a word, which is why it
       went unnoticed. It is a switch, not a second kind of start: going to a
       bench while another is open ends the old span at the moment the new one
       begins, the same as the switch bar, or a minute would belong to both. */
    "bench-go": function (id) {
      var bn = byId(state.benches, id); if (!bn || bn.archived) return;
      var sp = openSpan(), leaving = sp ? sp.benchId : "";
      if (leaving === id) { toast("Already at " + benchLabel(id)); return; }
      go(function () {
        var at = nowStamp();
        if (sp) sp.endedAt = at;
        state.spans.push({ id: uid(), startedAt: at, endedAt: "",
                           benchId: id, note: "", source: "switch" });
      });
      if (leaving) askNote(leaving, function () { greet(id); });
      else greet(id);
    },

    "span-start": function () {
      pickBench("Where are you starting?", function (benchId) {
        go(function () {
          state.spans.push({ id: uid(), startedAt: nowStamp(), endedAt: "",
                             benchId: benchId, note: "", source: "switch" });
        });
        greet(benchId);
      });
    },
    // Switching is one act, not two: the span you were in ends at the moment
    // the next one starts, so no minute belongs to both and none falls between.
    "span-switch": function () {
      var sp = openSpan(), leaving = sp ? sp.benchId : "";
      pickBench("Switching to", function (benchId) {
        go(function () {
          var at = nowStamp();
          if (sp) sp.endedAt = at;
          state.spans.push({ id: uid(), startedAt: at, endedAt: "",
                             benchId: benchId, note: "", source: "switch" });
        });
        // Ask about the bench being left, then greet the one being entered.
        if (leaving && leaving !== benchId) askNote(leaving, function () { greet(benchId); });
        else greet(benchId);
      });
    },
    "span-stop": function () {
      var sp = openSpan(); if (!sp) return;
      var was = sp.endedAt;
      go(function () { sp.endedAt = nowStamp(); });
      toast("Stopped after " + fmtMins(minsBetween(sp.startedAt, sp.endedAt)),
            function () { sp.endedAt = was; });
      if (sp.benchId) askNote(sp.benchId);
    },
    // A runaway is closed by being told when it ended, never by assuming now.
    "span-close": function () {
      var sp = runaway(); if (!sp) return;
      openModal({
        title: "When did you leave?",
        message: "This has been open since " + esc(niceDate(stampDay(sp.startedAt))) +
          ". It is not being counted until it has an end, and the app will not invent one.",
        confirmLabel: "Close it",
        fields: [
          { key: "day", label: "Day", type: "text", value: stampDay(sp.startedAt), span: true, hint: "YYYY-MM-DD" },
          { key: "to", label: "Time", type: "text", value: "17:00", span: true, hint: "HH:MM" }
        ],
        validate: function (v) {
          if (!dayOk(v.day.trim())) return "A day must be a real date, written YYYY-MM-DD.";
          if (!timeOk(v.to)) return "A time must be HH:MM on the 24-hour clock.";
          if (v.day.trim() + "T" + v.to.trim() <= sp.startedAt) return "It has to end after it started.";
          return null;
        },
        onConfirm: function (v) {
          go(function () { sp.endedAt = v.day.trim() + "T" + v.to.trim(); });
          toast("Closed at " + fmtMins(minsBetween(sp.startedAt, sp.endedAt)));
        }
      });
    },

    /* ---- repairing the week ---- */
    "span-add":  function (day) { spanDialog(null, day || ""); },
    "span-edit": function (id) { spanDialog(byId(state.spans, id), ""); },
    "span-del":  function (id) {
      var sp = byId(state.spans, id); if (!sp) return;
      var i = state.spans.indexOf(sp);
      go(function () { state.spans.splice(i, 1); });
      toast("Removed that stretch", function () { state.spans.splice(i, 0, sp); });
    },
    "week-prev": function () { weekOf = addDays(currentWeek(), -7); render(); },
    "week-next": function () {
      var n = addDays(currentWeek(), 7);
      if (n > weekStart(today())) return;
      weekOf = n; render();
    },
    "week-now":  function () { weekOf = ""; render(); },

    /* ---- upkeep ---- */
    "place-filter": function (id) { placeFilter = id || ""; render(); },
    // `id` is the thing it protects when the button was pressed on that
    // thing's own page — a stale backup is a threat to the work behind it, and
    // asking again on the screen that already said which thing is a second job.
    "cadence-add":  function (id) { cadenceDialog(null, id && assetOf(id) ? id : ""); },
    "cadence-edit": function (id) { cadenceDialog(byId(state.cadences, id)); },
    "cadence-done": function (id) {
      var cd = byId(state.cadences, id); if (!cd) return;
      var was = cd.lastDoneOn;
      var tpl = cd.runsBoardId ? byId(state.boards, cd.runsBoardId) : null;
      /* A DRILL starts its run and stamps the date in ONE act, and the undo
         takes both back — a half-undone drill would leave a run nobody
         started beside a date saying it was done. A cadence naming a
         procedure that has since been deleted falls back to being ticked,
         rather than refusing: the interval is still true. */
      if (tpl && tpl.kind === "template") {
        var made = null;
        go(function () {
          made = startRun(tpl, tpl.name + " \u2014 " + plainDate(today()));
          cd.lastDoneOn = today();
        });
        toast(cd.label + " \u2014 the run is open, next in " + everyDaysWords(cd.everyDays),
          function () {
            cd.lastDoneOn = was;
            if (made) state.boards = state.boards.filter(function (b) { return b.id !== made.id; });
          });
        if (made) { jobMap = null; openId = made.id; view = "boards"; render(); }
        return;
      }
      go(function () { cd.lastDoneOn = today(); });
      toast(cd.label + " \u2014 next in " + everyDaysWords(cd.everyDays), function () { cd.lastDoneOn = was; });
    },

    /* ---- field mode ---- */
    "field-on":  function () { go(function () { state.settings.field = true; }); toast("Field mode \u00b7 big targets, few choices"); },
    "field-off": function () { go(function () { state.settings.field = false; }); toast("Back to the whole list"); },
    /* One tap to a photograph, and it never guesses which run it belongs to:
       one open run and it goes there, several and it asks, none and it says
       so rather than opening a camera with nowhere to put the result. */
    "field-shot": function () {
      var runs = boards("run").filter(function (b) { return !b.closedOn; });
      if (!runs.length) { toast("Start a run first \u2014 a photograph has to belong to something"); return; }
      if (runs.length === 1) { pickPicture(runs[0], null, null, null); return; }
      openModal({
        title: "Which run is it for?",
        confirmLabel: "Take it",
        fields: [{ key: "id", label: "Run", type: "select", span: true,
                   options: opts(runs, function (b) { return b.name; }),
                   value: runs[0].id }],
        onConfirm: function (v) {
          var b = byId(state.boards, v.id);

      });
    },

    /* ---- tasks: the one thing that is typed ---- */
    "task-add":  function () { taskDialog(null, {}); },
    "keys-help": function () { keysDialog(); },
    "task-edit": function (id) { taskDialog(taskOf(id), {}); },
    /* Attached where it was written, so the question that makes a task worth
       having here is answered without being asked. */
    "task-add-job":   function (id) { taskDialog(null, { jobId: id }); },
    "task-add-proj":  function (id) { taskDialog(null, { projId: id }); },
    "task-add-board": function (id) { taskDialog(null, { boardId: id }); },
    "task-done": function (id) {

      go(function () { t.doneAt = nowStamp(); });

    },
    /* Every removal confirms, says what it touches and offers an undo. A task
       touches nothing but itself, and the confirmation says so — otherwise a
       reader has to wonder whether the board it named goes with it. */
    "task-del": function (id) {
      var t = taskOf(id); if (!t) return;
      confirmAction({
        title: "Remove \u201c" + t.label + "\u201d?",

      }, function () {

      });

    "cadence-del": function (id) {

      confirmAction({ title: "Remove " + cd.label + "?", message: "It stops appearing under Actions." }, function () {

    "asset-add":  function () { assetDialog(null); },
    /* The EDIT ROUTE IS CHOSEN BY THE RECORD, so a snippet always opens in
       the dialog built for it however it was reached — the registry's
       thirteen boxes have no field for a body, and a form that silently
       cannot edit half the entry is worse than no form. */
    "asset-edit": function (id) {
      var a = assetOf(id);
      if (hasBody(a)) bodyDialog(a); else assetDialog(a);
    },
    "lib-add":    function () { libAddDialog(); },
    /* The reverse of "Bring one in", and it writes through the same
       `borrowInto` — two copies of that would drift the first time a kind
       was added. The boards are GROUPED into procedures and open runs,
       because putting a thing on a template and putting it on a run in
       progress are different acts: the template is edited for next time, the
       run is only this pass. A closed run is not offered at all; its
       procedure is history. */
    "asset-to-board": function (id) {
      var a = assetOf(id); if (!a) return;
      var tpl = boards().filter(function (b) { return b.kind !== "run"; });
      var run = boards().filter(function (b) { return b.kind === "run" && !b.closedAt; });
      if (!tpl.length && !run.length) {
        needWords("Nothing to put it on yet",
                  "A thing joins a procedure, or a run of one. Write a procedure and it can carry this entry, its path and its link.",
                  "board-new");
        return;
      }
      var gs = [];
      if (tpl.length) gs.push({ group: "Procedures (" + tpl.length + ")",
                                options: tpl.map(function (b) { return { value: b.id, label: b.name }; }) });
      if (run.length) gs.push({ group: "Runs under way (" + run.length + ")",
                                options: run.map(function (b) { return { value: b.id, label: b.name }; }) });
      openModal({
        title: "Put " + a.name + " on a board",
        confirmLabel: "Put it on",
        message: "A COPY is taken, not a link: a run freezes its procedure when it starts, and a node reaching back into the registry would be a hole in that freeze — renaming this entry next year would rewrite a board you closed last year. What travels is the name, the path, the link and the thumbnail, plus a pointer home so this page can still answer where it is used.",
        fields: [
          { key: "board", label: "Which board", type: "select", span: true,
            value: gs[0].options[0].value, options: gs,
            hint: "It lands unlinked. Draw a line from it to the step it belongs with — that is the association edge, and it carries no ordering meaning." }
        ],
        onConfirm: function (v) {
          var b = byId(state.boards, v.board); if (!b) return;
          var already = (b.nodes || []).some(function (n) {
            return n.fromAssetId === a.id ||
                   String(n.label).toLowerCase() === String(a.name).toLowerCase();
          });
          if (already) { toast(a.name + " is already on " + b.name); return; }
          go(function () { borrowInto(b, borrowLine(a)); });
          toast("On " + b.name + " — link it to a step to say where it belongs");
        }
      });
    },
    "snip-copy":  function (id) {
      var a = assetOf(id);
      if (!a || !a.body) { toast("Nothing to copy — this one has no body yet"); return; }
      var n = snipLines(a).length;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(a.body).then(
          function () { toast("Copied " + n + (n === 1 ? " line" : " lines")); },
          function () { toast("The browser would not let the app reach the clipboard"); });
      } else { toast("This browser gives the app no clipboard"); }
    },
    "asset-open": function (id) { openAsset = id; view = "vocab"; openMode = ""; render(); },
    /* A rail row opens the Assets tab on its own section. `view` is set here
       as well as `repoTab`, because these rows fire from every screen. */
    "repo-sect":  function (id) { view = "repo"; repoTab = id; libTopic = ""; libKind = ""; libLang = ""; openAsset = ""; render(); },

    "out-page":   function (id) { outTab = id; reportOn = null; render(); },
    "proj-list":  function (id) { projList = id; openJob = ""; openProj = ""; jobMap = null; render(); },

    "repo-page":  function (id) { repoTab = id; libTopic = ""; libKind = ""; libLang = ""; openAsset = ""; render(); },
    /* Reached from the Library's own strip AND from a topic pill on a thing's
       page, which is the route that makes writing a subject down worth it:
       you are looking at one dataset and one tap shows everything else on
       the same subject. */
    /* Picking a subject clears the kind: the chips belong to the subject that
       is open, and carrying "Dataset" across to a subject with no dataset in

    "lib-topic":  function (id) { repoTab = "lib"; libTopic = id; libKind = ""; openAsset = ""; view = "repo"; render(); },
    "lib-kind":   function (id) { libKind = id || ""; render(); },
    "lib-lang":   function (id) { libLang = id || ""; render(); },
    /* Adding from the Repo lands in the section you were looking at, rather

    "asset-back": function () { openAsset = ""; render(); },
    "asset-copy": function (id) {
      var a = assetOf(id);
      if (!a || !a.path) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(a.path).then(

    /* A COORDINATE IS COPY-ONLY, AND THE SCREEN SAYS WHY. Not a link to a
       map: a basemap is tiles off a network, and this app fetches nothing —
       so a "show it on a map" button would be a control that works at a desk
       and does nothing on the site where the coordinate was taken, which is
       exactly the fault `openHandle` exists to prevent. Copying it is what
       the launcher-off path already does, for the same reason. */
    "asset-geo-copy": function (id) {
      var a = assetOf(id);
      if (!a || !geoOf(a)) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(geoPlain(a)).then(
          function () { toast("Copied \u2014 paste it into whatever map you use"); },
          function () { toast("This browser would not let the page copy it."); });
      } else { toast("This browser has no clipboard for pages."); }
    },

    /* Provenance is stated, one source at a time, because it is the one fact
       about a derived file that cannot be reconstructed later. It refuses a
       cycle: A made from B made from A is not a history, and it would make
       both pages recurse. */
    "asset-from-add": function (id) {
      var a = assetOf(id); if (!a) return;
      var have = a.fromIds || [];
      var pool = live(state.assets).filter(function (x) {
        if (x.id === a.id || have.indexOf(x.id) >= 0) return false;
        // Not something this is already an ancestor of.
        return !madeFromAncestors(x).some(function (y) { return y.id === a.id; });
      });
      if (!pool.length) { toast("Nothing else in the registry it could have come from."); return; }
      openModal({
        title: "What was " + a.name + " made from?",
        confirmLabel: "Add it",
        message: "One source at a time. This is what the file itself will not tell you in six months — an orthophoto is three hundred frames and a control file, and nothing in the file says so.",
        fields: [
          { key: "pick", label: "Made from", type: "select", span: true, value: pool[0].id,
            options: pool.map(function (x) {
              return { value: x.id, label: x.name + " — " + String(assetKindLabel(x)).toLowerCase() };
            }) }
        ],
        onConfirm: function (v) {
          go(function () {
            a.fromIds = (a.fromIds || []).concat([v.pick]);
          });
          toast("Recorded");
        }
      });
    },
    "asset-fact-add": function (id) {
      var a = assetOf(id); if (!a) return;
      factDialog(a, null);
    },
    "asset-fact": function (id) {
      var q = String(id).split(":"), a = assetOf(q[0]); if (!a) return;
      var f = assetFacts(a).filter(function (x) { return x.id === q[1]; })[0];
      if (!f) return;
      factDialog(a, f);
    },
    "asset-from-del": function (id) {
      var q = String(id).split(":"), a = assetOf(q[0]); if (!a) return;
      var was = (a.fromIds || []).slice();
      go(function () {
        a.fromIds = (a.fromIds || []).filter(function (x) { return x !== q[1]; });
      });
      toast("No longer made from it", function () { go(function () { a.fromIds = was; }); });
    },

    /* Removing a registry entry leaves every board alone. A board node is a
       copy, so nothing on a board breaks — but the copies keep `fromAssetId`,
       which is why the name goes to `forgotten`: without it the page that
       asked "where did this come from" would answer with an id. */
    "asset-del":  function (id) {
      var a = assetOf(id); if (!a) return;
      var ups = assetUpkeep(a), uses = assetUses(a), into = madeInto(a);
      var bits = [];
      if (uses.length) bits.push("It is on " + uses.length + (uses.length === 1 ? " board" : " boards") +
        " as a copy, and those copies stay exactly as they are — nothing on a board breaks.");
      if (into.length) bits.push(into.length + (into.length === 1 ? " thing" : " things") +
        " here says it was made from this, and will stop naming it.");
      if (ups.length) bits.push("The " + ups.length + (ups.length === 1 ? " upkeep" : " upkeeps") +
        " attached to it stay, and stop naming what they protect.");
      confirmAction({
        title: "Remove " + a.name + "?",
        message: bits.length ? bits.join(" ") : "Nothing is attached to it."
      }, function () {
        go(function () {
          state.forgotten[id] = a.name;
          a.archived = true;
          if (openAsset === id) openAsset = "";
        });
        toast("Removed", function () { go(function () { a.archived = false; delete state.forgotten[id]; }); });
      });
    },

    /* ---- people ---- */
    /* A person is addressed by the key `people()` built, not by an id: half of
       them exist only as a node on a frozen board and have no record at all.
       `c:<id>` for somebody in the list, `n:<lowercased name>` for somebody a
       board merely mentions. */

    /* The escape hatch. An installed app is served by its own worker, and a
       worker written before the network-first fix will keep handing out the
       page it cached until it is replaced — which can take two launches. This
       makes it one: drop the registration, delete this app's caches, reload.

       It deliberately does not touch localStorage or IndexedDB: the book, the
       pictures and the snapshots are not what is stale. */
    "refresh-app": function () {
      confirmAction({
        title: "Throw away the offline copy?",
        message: "The app will be fetched again from scratch. Everything you have recorded stays exactly as it is — this only clears the copy of the app itself, which is what can be out of date.",
        confirmLabel: "Get the newest", danger: false
      }, function () {
        toast("Fetching the newest…");
        var jobs = [];
        if (window.caches && caches.keys) {
          jobs.push(caches.keys().then(function (keys) {
            return Promise.all(keys.filter(function (k) {
              return k.indexOf("pwa-mashghal-") === 0;
            }).map(function (k) { return caches.delete(k); }));
          }));
        }
        if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
          jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
            return Promise.all(rs.map(function (r) { return r.unregister(); }));
          }));
        }
        Promise.all(jobs).catch(function () {}).then(function () {
          // A query string the old copy was never cached under, so the reload
          // cannot be answered from a cache that is on its way out.
          location.replace(location.pathname + "?fresh=" + Date.now());
        });
      });
    },

        toast("Removed " + benchLabel(id), function () { b.archived = false; });
      });
    },
    "kind-add": function () { kindDialog(null); },
    "kind-edit": function (id) { kindDialog(byId(state.kinds, id)); },
    "kind-del": function (id) {
      var k = byId(state.kinds, id); if (!k) return;
      go(function () {
        state.forgotten[id] = k.name;
        state.kinds = state.kinds.filter(function (x) { return x.id !== id; });
      });
    },

    /* ---- sync ---- */
    "launch-export": function () { launchExport(); },
    "companion-toggle": function () {
      go(function () { state.settings.companion = !state.settings.companion; });
      toast(state.settings.companion
        ? "Launch links are on. They do nothing until the launcher is installed."
        : "Launch links are off.");
    },
    "sync-setup": function () { syncSetupDialog(); },
    "sync-now":   function () { syncNow(); },
    "device-forget": function (id) {
      go(function () { delete state.devices[id]; });
    },
    // Wiping clears this machine and never touches the gist. The book is safe;
    // this only empties the browser in front of you.
    "sync-wipe": function () {
      confirmAction({
        title: "Wipe this device?",
        confirmLabel: "Wipe it",
        message: "Everything in this browser goes: the book, the token and the passphrase. " +
          "<b>The gist is not touched</b> — your record is safe and any other device still has it. " +
          "This does not revoke the token, so if you are leaving a machine you do not own, revoke it at github.com/settings/tokens as well."
      }, function () {
        dropSecrets();
        try { localStorage.removeItem(APP.storeKey); localStorage.removeItem(DEV_KEY); } catch (e) {}
        state = APP.blank(); snap = {};
        save(); render();

      });

    /* ---- settings ---- */
    "backup": function () {
      backupDialog("mashghal-backup-" + today() + ".json", JSON.stringify(state, null, 2),
        boards("template").length + " procedures, " + boards("run").length + " runs");
    },
    "restore": function () {
      restoreDialog(function (p) {
        if (!p || !p.boards) return null;
        return (p.boards || []).length + " boards, " + (p.claimants || []).length + " claimants";
      }, function (parsed) {

    /* Asking "everything is replaced?" over an empty book is a question about
       nothing, so a first run loads it straight away and anything else asks. */
    "sample": function () {

        title: "Load the example?",

      }, load);

        title: "Erase everything?",
        message: "Every board, run and claimant on this device. Export a backup first if you might want it. How this device reaches a synced book is kept — use Wipe this device in Sync to drop that too."
      }, function () {

  /* ================= dialogs ================= */

  function nodeDialog(b, n) {
    if (!b) return;
    openModal({
      title: n ? "Edit step" : "New step",
      confirmLabel: n ? "Save" : "Add",
      message: "<b>Do</b> is work you perform. <b>Send</b> opens a wait on the people linked to it. <b>Watch</b> waits with nobody to chase. <b>Decide</b> branches along its labelled exits. <b>File</b> puts it somewhere — and a run will not close while one is undone.",
      fields: [
        { key: "label", label: "Step", type: "text", value: n ? n.label : "", span: true, placeholder: "Send draft for review" },
        { key: "act", label: "Act", type: "select", value: n ? n.act : "do",
          options: vocabOpts("acts"),
          hint: "A Send goes to whoever is linked to it; a Decide gets its exits from the step row." },
        otherField("acts", "actOther"),
        { key: "chaseDays", label: "Chase after (days)", type: "number", min: 0, value: n ? (n.chaseDays || 0) : 0 },
        { key: "dueAt", label: "On a date (optional)", type: "text", span: true,
          value: n ? (n.dueAt || "") : "", placeholder: "YYYY-MM-DD", hint: "Leave blank unless it is genuinely dated." }
        /* There was a sixth field here with NO LABEL, always empty, which
           `onConfirm` never read: a text box in the app's most-used dialog
           that silently threw away whatever was typed into it, added only to
           carry a sentence. "A control that quietly does nothing is worse
           than no control" is this repo's own rule about file paths, and it
           holds for a form field. The sentence it carried belongs to the Act
           picker it is about, so that is where it is. */
      ],
      validate: function (v) {
        if (!v.label.trim()) return "Give the step a name.";
        /* `dayOk`, not the shape regex: `2026-13-45` matches the pattern,
           stores, parses to Invalid Date and appears on no screen. The rule
           is already written down and this was the one date field still
           breaking it. */
        if (v.dueAt.trim() && !dayOk(v.dueAt.trim()))
          return "A date has to be a real day, written YYYY-MM-DD \u2014 or blank.";
        return null;
      },
      onConfirm: function (v) {
        var made = null;
        go(function () {
          var t = n;
          if (!t) {
            t = { id: uid(), t: "step", label: "", act: "do", chaseDays: 0, dueAt: "",
                  enteredAt: "", doneAt: "", answer: "" };
            b.nodes.push(t); made = t;
          }
          t.label = v.label.trim();
          t.act = vocabTake("acts", v.act, v.actOther, "do");
          t.chaseDays = num(v.chaseDays);
          t.dueAt = v.dueAt.trim();
          /* IT LANDS WHERE YOU ARE LOOKING, and nothing else moves. This was
             `autoLayout(b)` — which re-ranks the whole board, so arranging a
             sheet by hand and then adding one step threw the arrangement
             away. See `newSpot`. */
          if (made) { var p = newSpot(b); made.x = p.x; made.y = p.y; settleNode(b, made); }
        });
        if (made) sel = made.id;
      }
    });
  }

  /* Every thing on every board, collapsed by name and kind. The same person
     turns up on five boards and the same headphones on three, and typing them
     out again each time is how a name ends up spelled three ways.

     A COPY is taken, deliberately, not a reference. A run freezes its procedure
     the moment it starts, and a thing reaching back into a shared table would
     be a hole in that freeze: renaming a person next year would silently
     rewrite a board you closed last year. What is borrowed is the typing. */
  function allThings() {
    var seen = {}, out = [];
    state.boards.forEach(function (bd) {
      (bd.nodes || []).forEach(function (n) {
        if (n.t !== "thing" || !n.label) return;
        var key = (n.kind || "") + "\u0000" + n.label.toLowerCase();
        if (seen[key]) { seen[key].seen++; return; }
        seen[key] = { kind: n.kind, label: n.label, path: n.path || "", url: n.url || "",
                      pic: n.pic || "", thumb: n.thumb || "", seen: 1, from: bd.name };
        out.push(seen[key]);
      });
    });
    return out.sort(function (a, z) { return z.seen - a.seen; });
  }

  /* The pool under headings, keeping every entry's position in `pool` as its
     value so the lookup on confirm is untouched. A group is emitted only when
     something is in it. */
  function borrowGroups(pool) {
    /* A registry entry is described in the REGISTRY'S words, not the board's.
       The two vocabularies are different lists — ArcGIS Pro is "software" in
       one and lands as "app" on a board — so under a heading reading
       "Devices" the picker said "Lenovo Legion \u2014 kit" while the Repo
       calls it a laptop, which is one thing described two ways in two places
       a tap apart. The board kind still decides what gets drawn; it is only
       the reading that changes. */
    function line(t) {
      var a = t.assetId ? byId(state.assets, t.assetId) : null;
      var word = a ? assetKindLabel(a) : vocabLabel("things", t.kind);
      return { value: String(pool.indexOf(t)),
               label: t.label + " \u2014 " + String(word).toLowerCase() +
                 (t.seen > 1 ? ", on " + t.seen + " boards" : "") };
    }
    var out = [], seen = [];
    REPO_PAGES.forEach(function (sec) {
      /* The Library used to be skipped here, because it was the same store
         read by subject and `repoOf` never returned it — a heading that could
         never hold anything. It holds snippets now, and a script IS a thing a
         step is done with, which is exactly what the link edge carries. The
         empty-group guard below already does the job the skip was doing.
         Connections is still never returned by `repoOf`, so it drops out on
         its own the same way. */
      var g = pool.filter(function (t) {
        return t.assetId && byId(state.assets, t.assetId) &&
               repoOf(byId(state.assets, t.assetId)) === sec.id;
      });
      if (!g.length) return;
      g.forEach(function (t) { seen.push(t); });
      out.push({ group: sec.label + " (" + g.length + ")", options: g.map(line) });
    });
    var pp = pool.filter(function (t) { return t.contactId; });
    if (pp.length) {
      pp.forEach(function (t) { seen.push(t); });
      out.push({ group: "Your people (" + pp.length + ")", options: pp.map(line) });
    }
    /* Whatever is left is a thing typed onto a board and never added to the
       registry. It goes LAST and under its own heading rather than being
       dropped: the pool is what you can bring in, and a picker that silently
       omits part of it is worse than one with an awkward heading. */
    var rest = pool.filter(function (t) { return seen.indexOf(t) < 0; });
    if (rest.length) {
      out.push({ group: "On another board (" + rest.length + ")", options: rest.map(line) });
    }
    return out;
  }

  /* ONE PLACE TURNS A REGISTRY ENTRY INTO A BOARD NODE, because there are two
     routes into it now — "Bring one in" from the sheet, and "Put it on a
     board" from the entry's own page, which is the relationship the brief
     puts at the centre of the whole model ("a library method can explain a
     workflow step"). Two copies of this mapping would drift the first time a
     kind was added, and the mapping is the fiddly half: the board's
     vocabulary and the registry's are different lists, so the kind is MAPPED
     rather than passed through — a node whose kind read "dataset" would
     draw as the fallback circle. A written entry lands as a file (it is
     content) or a note (it is prose); a reader who wants a Script node of its
     own writes one in, the way every vocabulary in this app invites. */
  function borrowKind(a) {
    var k = a.kind;
    if (k === "photo") return "photo";
    if (k === "file" || k === "doc" || k === "dataset" || k === "snippet") return "file";
    if (k === "method") return "note";
    if (k === "software") return "device";
    return "asset";
  }
  function borrowLine(a) {
    return { kind: borrowKind(a), label: a.name, path: a.path || "", url: a.url || "",
             pic: "", thumb: a.thumb || "", seen: 1,
             from: "the registry", assetId: a.id };
  }
  /* And one place writes it: `borrowDialog` picks from a pool and hands the
     pick over, the entry page hands `borrowLine(a)` straight in. A COPY is
     taken either way — a run freezes its procedure at the start, and a node
     reaching back into the registry would be a hole in that freeze. */
  function borrowInto(b, pick) {
    b.nodes.push({ id: uid(), t: "thing", kind: pick.kind, label: pick.label,
                   path: pick.path, url: pick.url, pic: pick.pic,
                   thumb: pick.thumb || "",
                   fromAssetId: pick.assetId || "",
                   fromContactId: pick.contactId || "" });
    autoLayout(b);
  }

  function borrowDialog(b) {
    if (!b) return;
    var here = {};
    (b.nodes || []).forEach(function (n) {
      if (n.t === "thing") here[(n.kind || "") + "\u0000" + String(n.label).toLowerCase()] = 1;
    });
    var pool = allThings().filter(function (t) {
      return !here[(t.kind || "") + "\u0000" + t.label.toLowerCase()];
    });
    /* The registry is the other half of the pool, and the same rule covers
       both: a copy is taken. A registry entry brings its path, its link and
       its thumbnail with it, and the copy keeps `fromAssetId` so the registry
       can still answer "where is this used" without any board depending on
       it. The board node's kind is the board's vocabulary, not the
       registry's, so it is mapped rather than passed through — a node whose
       kind is "dataset" would draw as the fallback circle. */
    /* Already-here is tested on the NAME alone for a registry entry, not on
       kind and name: the board's vocabulary and the registry's are different
       lists, so the same ArcGIS Pro is "software" in one and was filed as
       "kit" on the board — and a kind+name key then offered it a second time.
       `fromAssetId` settles it outright where it is present. */
    var hereByName = {}, hereByAsset = {};
    (b.nodes || []).forEach(function (n) {
      if (n.t !== "thing") return;
      hereByName[String(n.label).toLowerCase()] = 1;
      if (n.fromAssetId) hereByAsset[n.fromAssetId] = 1;
    });
    live(state.assets).forEach(function (a) {
      if (hereByAsset[a.id] || hereByName[String(a.name).toLowerCase()]) return;
      pool.push(borrowLine(a));
    });
    // And the people list, which is what gets borrowed most: a send needs
    // somebody on it, and typing a name again is how two spellings of one
    // person end up in the book.
    live(state.contacts).forEach(function (c) {
      if (hereByName[String(c.name).toLowerCase()]) return;
      pool.push({ kind: "person", label: c.name, path: "", url: "",
                  pic: "", thumb: "", seen: 1,
                  from: "your people", contactId: c.id });
    });

    /* One name, one entry. The registry and the boards hold the same
       headphones, so the list offered both — twice the same thing, and
       choosing wrongly loses either the registry link or a picture. The
       registry entry wins on principle, since it is the record the rest of
       the app points at, EXCEPT where the board copy carries a picture it
       does not have: a photograph is not something to silently drop. */
    var byName = {}, keep = [];
    pool.forEach(function (t) {
      var k = String(t.label).toLowerCase(), had = byName[k];
      if (!had) { byName[k] = t; keep.push(t); return; }
      var betterPic = (t.pic || t.thumb) && !(had.pic || had.thumb);
      var betterReg = t.assetId && !had.assetId && !(had.pic || had.thumb);
      if (betterPic || betterReg) {
        keep[keep.indexOf(had)] = t;
        byName[k] = t;
      }
    });
    pool = keep;

    if (!pool.length) {
      toast("Nothing in the registry, your people or another board that is not already here.");
      return;
    }
    /* The default is the FIRST option of the FIRST group, not pool index 0.
       `pool` is ordered by how often a thing has been used, so index 0 is
       usually a board thing and lands at the bottom of the picker — the
       select would then open on a row nowhere near the top of what is on
       screen. Same shape as reading `.value` off a group: a grouped list
       needs its first entry found, not assumed. */
    var gs = borrowGroups(pool);
    var firstV = gs.length && gs[0].options.length ? gs[0].options[0].value : "0";
    openModal({
      title: "Bring one in",
      message: "From the registry, your people, or another board. A copy is taken, not a link. A run freezes its procedure when it starts, and a thing reaching back into a shared list would be a hole in that — renaming someone next year would rewrite a board you closed last year. What you are saving is the typing.",
      confirmLabel: "Bring it in",
      fields: [
        /* GROUPED, AND THE GROUPS ARE THE ONES THE APP ALREADY HAS. The
           mockup's palette is five hardcoded headings (Software · Web ·
           Files · GIS Tools · Hardware) and two of those are not kinds at
           all — "GIS Tools" is a topic, and the vocabulary here is
           extensible by design, so a fixed five would be wrong the first
           time somebody writes in a sixth. The headings are `REPO_PAGES`
           for anything in the registry, plus your people and the other
           boards: the same words, in the same order, as the Repo's own
           strip, so a thing is filed under the heading you would go looking
           for it under. Each says how many, because a heading with nothing
           under it is worth seeing before you open it.

           The value is the position in the list, not a composed key: a NUL
           separator does not survive a round trip through an option value, so
           the lookup found nothing and confirming quietly did nothing at
           all. */
        { key: "pick", label: "Which", type: "select", span: true, value: firstV,
          options: gs }
      ],
      onConfirm: function (v) {
        var pick = pool[num(v.pick)];
        if (!pick) return;
        go(function () { borrowInto(b, pick); });
        toast("Brought in — link it to a step to say where it belongs");
      }
    });
  }

  /* `opts` is the third argument for "Add related thing": a node id to hang
     the new thing off, and where to put it. Two rules in it.

     THE LINE IS A `link` AND NEVER A `flow`. That is the whole distinction the
     model rests on — a reference photo or a pair of headphones belongs WITH a
     step without coming before it — and drawn as sequence it would put a
     second path through the run.

     AND IT IS ONE ACT. Adding a thing and then remembering to connect it is
     exactly the step people forget, which is why the dialog says so in the
     branch where the line is coming: an unlinked thing floats on the sheet
     saying nothing about what it is for. */
  function thingDialog(b, n, opts) {
    if (!b) return;
    opts = opts || {};
    var host = opts.linkTo ? nodeOf(b, opts.linkTo) : null;
    openModal({
      title: n ? "Edit thing" : host ? "Add something to " + clip(host.label, 24) : "New thing",
      confirmLabel: n ? "Save" : "Add",
      message: n ? ""
        : host ? "A person, a file, a photograph, a piece of kit. It is joined to <b>" +
                 esc(clip(host.label, 30)) + "</b> with an <b>About</b> line, which says " +
                 "nothing about order — so it belongs with that step without coming before it."
               : "A person, a file, a photograph, a piece of kit. Link it to a step afterwards — a link says nothing about order.",
      fields: [
        { key: "label", label: "Name", type: "text", value: n ? n.label : "", span: true },
        { key: "kind", label: "What is it", type: "select", value: n ? n.kind : "person",
          options: vocabOpts("things") },
        otherField("things", "kindOther"),
        { key: "path", label: "Where it is", type: "text", span: true, value: n ? (n.path || "") : "",
          hint: "A path for a file or a device, a room for a piece of kit. Left blank it is just named." },
        { key: "url", label: "A link to it", type: "text", span: true, value: n ? (n.url || "") : "",
          hint: "Any scheme — https:, obsidian:, mailto:" }
      ],
      validate: function (v) {
        if (!v.label.trim()) return "Give it a name.";
        if (v.url.trim() && !/^[a-z][a-z0-9+.-]*:/i.test(v.url.trim())) {
          return "A link needs a scheme — https:, obsidian:, mailto: and so on.";
        }
        return null;
      },
      onConfirm: function (v) {
        var made = null;
        go(function () {
          var t = n;
          if (!t) { t = { id: uid(), t: "thing", kind: "person", label: "" }; b.nodes.push(t); made = t; }
          t.label = v.label.trim();
          t.kind = vocabTake("things", v.kind, v.kindOther, "person");
          t.path = v.path.trim(); t.url = v.url.trim();
          /* WHERE IT LANDS, and `autoLayout` is the last resort rather than
             the default. Laying out the whole board on every add throws away
             every position anybody placed by hand — which is precisely what
             `settleNode` was written to avoid, and Tidy is the button that
             asks for it. */
          if (made) {
            if (opts.at) { made.x = Math.round(opts.at.x); made.y = Math.round(opts.at.y); }
            else { var p = newSpot(b); made.x = p.x; made.y = p.y; }
            settleNode(b, made);
          }
          if (made && host) {
            b.edges.push({ id: uid(), a: host.id, b: made.id, k: "link", label: "" });
          }
        });
        if (made) sel = made.id;
      }
    });
  }

  function claimantDialog(c) {
    openModal({
      title: c ? "Edit claimant" : "New claimant",
      confirmLabel: c ? "Save" : "Add",
      fields: [
        { key: "name", label: "Name", type: "text", value: c ? c.name : "", span: true, placeholder: "AUB Tripoli 21st Century" },
        { key: "kind", label: "Shape", type: "select", value: c ? c.kind : "budget",
          options: vocabOpts("claimKinds") },
        otherField("claimKinds", "kindOther"),
        /* A text field with no check turned "twenty" into nothing owed and
           "-5" into "3h of 0h · met" — num() gives 0 for anything it cannot
           parse, so nonsense became a confident figure about an employer.
           A number field, validated, and blank still means on demand. */
        { key: "hours", label: "How much a week", type: "number", min: 0, step: 0.5,
          value: c ? (c.hours || "") : "", placeholder: "20",
          hint: "Hours, or days if the shape above is days. Blank means on demand." },
        { key: "colour", label: "Colour", type: "text", value: c ? c.colour : "#6f96b8", span: true, hint: "A hex colour — it marks this claimant everywhere." }
      ],
      validate: function (v) {
        if (!v.name.trim()) return "Give it a name.";
        var h = String(v.hours).trim();
        if (h) {
          if (!/^\d+(\.\d+)?$/.test(h)) return "How much has to be a number, or blank for on demand.";
          if (num(h) > 168) return "There are only 168 hours in a week.";
        }
        if (!/^#[0-9a-fA-F]{3,8}$/.test(v.colour.trim())) return "A colour must be a hex value like #6f96b8.";
        return null;
      },
      onConfirm: function (v) {
        go(function () {
          var t = c;
          if (!t) { t = { id: uid(), archived: false }; state.claimants.push(t); }
          t.name = v.name.trim();
          t.kind = vocabTake("claimKinds", v.kind, v.kindOther, "budget");
          // A number field hands back a number, not a string — String() first
          // or .trim() throws on every save.
          t.hours = String(v.hours).trim(); t.colour = v.colour.trim();
        });
      }
    });
  }

  function modeDialog(m) {
    openModal({
      title: m ? "Edit craft" : "New craft",
      confirmLabel: m ? "Save" : "Add",
      fields: [{ key: "name", label: "Craft", type: "text", value: m ? m.name : "", span: true, placeholder: "Photogrammetry" }],
      validate: function (v) { return v.name.trim() ? null : "Give it a name."; },
      onConfirm: function (v) {
        go(function () {
          var t = m;
          if (!t) { t = { id: uid(), archived: false }; state.modes.push(t); }
          t.name = v.name.trim();
        });
      }
    });
  }

  function kindDialog(k) {
    openModal({
      title: k ? "Edit kind" : "New kind",
      confirmLabel: k ? "Save" : "Add",
      message: k ? "" : "A kind groups boards that are not jobs — training, an application, a visa.",
      fields: [
        { key: "name", label: "Kind", type: "text", value: k ? k.name : "", span: true, placeholder: "Application" },
        { key: "colour", label: "Colour", type: "text", value: k ? k.colour : "#8a9ac9", span: true }
      ],
      validate: function (v) {
        if (!v.name.trim()) return "Give it a name.";
        if (!/^#[0-9a-fA-F]{3,8}$/.test(v.colour.trim())) return "A colour must be a hex value like #8a9ac9.";
        return null;
      },
      onConfirm: function (v) {
        go(function () {
          var t = k;
          if (!t) { t = { id: uid() }; state.kinds.push(t); }
          t.name = v.name.trim(); t.colour = v.colour.trim();
        });
      }
    });
  }

  /* ================= the example ================= */

  // What the sample has to exercise: a send that opens a wait on two named
  // people, a decision that loops back, a run sitting at four steps at once,
  // a board with no employer at all, and a run that will not close because
  // its filing is undone. A feature with no representation here cannot be
  // shown to anyone.
  function sampleData() {
    var s = APP.blank();
    function mk(o) { o.id = uid(); return o; }
    function back(n) { return addDays(today(), -n); }
