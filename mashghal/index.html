<script>
(function () {
  "use strict";

  /* ============================================================
     Mashghal — work leaves a wake, and the app holds the wake.

     Four nouns and nothing else:
       a BOARD is a procedure (a template) or a run of one
       a NODE is a step (do/send/watch/ask/file) or a thing
       an EDGE is flow (sequence) or link (association, no order)
       a DUE is a step of a live run that is waiting for you

     Two rules the whole thing rests on:
       • A run FREEZES its template when it starts. Editing the
         template never moves a run already under way, and a run's
         own attachments never leak back into the template.
       • A run advances on a tap and never on its own. An `ask` is
         answered by a person, never inferred from elapsed time.
     ============================================================ */

  /* ================= drawn icons =================

     The tabs were single unicode glyphs — ◱ ◴ ▤ ◈ — which are whatever the
     font on the machine decides they are, sit on the wrong baseline, and mean
     nothing. Acts and things had none at all, so the only way to tell a send
     from a watch in a list was to read the word.

     One set, drawn: a 20-unit box, currentColor, 1.6 stroke, round caps, so an
     icon takes the colour of whatever it sits in and needs no second version
     for the light theme. */
  function svgIcon(d, extra) {
    return '<svg viewBox="0 0 20 20" width="18" height="18" fill="none" ' +
      'stroke="currentColor" stroke-width="1.6" stroke-linecap="round" ' +
      'stroke-linejoin="round" aria-hidden="true">' + d + (extra || "") + "</svg>";
  }
  var ICONS = {
    // tabs
    boards:  svgIcon('<rect x="2.5" y="4" width="6" height="5" rx="1.5"/><rect x="11.5" y="11" width="6" height="5" rx="1.5"/><path d="M8.5 6.5h3a2 2 0 0 1 2 2v2.5"/>'),
    waiting: svgIcon('<circle cx="10" cy="10" r="7"/><path d="M10 6v4.2l2.8 1.7"/>'),
    week:    svgIcon('<path d="M3 5h14M3 10h9M3 15h11"/>'),
    cal:     svgIcon('<rect x="3" y="4.5" width="14" height="12.5" rx="2"/><path d="M3 8.5h14M7 2.8v3.2M13 2.8v3.2"/><circle cx="7.4" cy="12.3" r="1" fill="currentColor" stroke="none"/>'),
    jobs:    svgIcon('<rect x="2.5" y="6.5" width="15" height="10" rx="2"/><path d="M7.5 6.5V5a1.8 1.8 0 0 1 1.8-1.8h1.4A1.8 1.8 0 0 1 12.5 5v1.5M2.5 11h15"/>'),
    settings: svgIcon('<path d="M4 6h12M4 10h12M4 14h12"/><circle cx="7.5" cy="6" r="1.9" fill="var(--surface)"/><circle cx="12.5" cy="10" r="1.9" fill="var(--surface)"/><circle cx="8.5" cy="14" r="1.9" fill="var(--surface)"/>'),
    // acts
    do:    svgIcon('<circle cx="10" cy="10" r="6.6"/><path d="M7.2 10.2l2 2 3.6-4"/>'),
    send:  svgIcon('<path d="M17 3.5L9 11"/><path d="M17 3.5l-5 13.5-2.8-5.7L3.5 8.5z"/>'),
    watch: svgIcon('<path d="M2.2 10S5.4 4.8 10 4.8 17.8 10 17.8 10 14.6 15.2 10 15.2 2.2 10 2.2 10z"/><circle cx="10" cy="10" r="2.2"/>'),
    ask:   svgIcon('<path d="M10 3.2v5.3M10 8.5L5 13.4M10 8.5l5 4.9"/><circle cx="10" cy="3.2" r="1.5"/><circle cx="4.6" cy="14.6" r="1.7"/><circle cx="15.4" cy="14.6" r="1.7"/>'),
    file:  svgIcon('<path d="M3 11.5V5.4A1.9 1.9 0 0 1 4.9 3.5h3.4l1.6 2h5.2A1.9 1.9 0 0 1 17 7.4v4.1"/><path d="M3 11.5h3.6l1.2 2h4.4l1.2-2H17v3.2a1.9 1.9 0 0 1-1.9 1.9H4.9A1.9 1.9 0 0 1 3 14.7z"/>'),
    // things
    person: svgIcon('<circle cx="10" cy="7" r="3.2"/><path d="M4.4 16.4a5.9 5.9 0 0 1 11.2 0"/>'),
    doc:    svgIcon('<path d="M5 3.2h6l4 4v9.6H5z"/><path d="M11 3.2v4h4"/>'),
    photo:  svgIcon('<rect x="2.8" y="4.4" width="14.4" height="11.2" rx="2"/><circle cx="7.4" cy="8.4" r="1.5"/><path d="M3.2 13.6l3.8-3.4 3 2.6 2.6-2.4 4.2 3.8"/>'),
    kit:    svgIcon('<path d="M3.4 7.2h13.2v8.4a1.4 1.4 0 0 1-1.4 1.4H4.8a1.4 1.4 0 0 1-1.4-1.4z"/><path d="M7.4 7.2V5.4a1.6 1.6 0 0 1 1.6-1.6h2a1.6 1.6 0 0 1 1.6 1.6v1.8"/>'),
    device: svgIcon('<rect x="6" y="2.8" width="8" height="14.4" rx="1.9"/><path d="M8.8 5.2h2.4"/><circle cx="10" cy="14.4" r="0.9" fill="currentColor" stroke="none"/>'),
    note:   svgIcon('<path d="M4.4 3.6h11.2v9l-3.6 3.8H4.4z"/><path d="M15.6 12.6h-3.6v3.8M7 7.4h6M7 10.2h4"/>'),
    thing:  svgIcon('<circle cx="10" cy="10" r="6.4"/>')
  };
  function actIcon(act) { return ICONS[act] || ICONS.do; }
  function thingIcon(kind) {
    return ICONS[kind === "file" ? "doc" : kind === "asset" ? "kit" : kind] || ICONS.thing;
  }

  var ACTS = {
    do:    { label: "Do",     word: "do",     tone: "blue"  },
    send:  { label: "Send",   word: "send",   tone: "brass" },
    watch: { label: "Watch",  word: "watch",  tone: "brass" },
    ask:   { label: "Decide", word: "decide", tone: "blue"  },
    file:  { label: "File",   word: "file",   tone: "verd"  }
  };
  /* What a connection can mean, beyond "then". The graph could always express
     all of these — a labelled flow edge is a branch, an edge to an earlier step
     is a loop — but you had to know that, which made it invisible. Naming them
     is the whole change: the model underneath is unchanged.

     `wait` is the one that carries real meaning for a run: a step with several
     ways in can either start when the FIRST of them arrives or wait for all of
     them. The GIS run needs both — metadata can start once any area is
     digitised, but filing waits for every one. */
  var EDGE_KINDS = {
    then:   { word: "then",         says: "comes after" },
    yes:    { word: "if yes",       says: "when the answer is yes" },
    no:     { word: "if no",        says: "when the answer is no" },
    again:  { word: "go round",     says: "back for another pass" },
    stop:   { word: "stop here",    says: "the way out of the loop" },
    all:    { word: "and the rest", says: "waits for every way in" },
    any:    { word: "whichever",    says: "starts on the first way in" }
  };

  var THINGS = {
    person: "Person", file: "File", photo: "Photo", asset: "Kit",
    device: "Device", note: "Note"
  };
  /* ================= a list you can add to from the dialog =================

     Every fixed list in this app was a wall: five acts, six kinds of thing,
     three places. The moment your work needed a sixth act or a fourth place,
     the app said no and there was nowhere to say otherwise.

     So each of them is now a FLOOR rather than a ceiling. The built-ins below
     are what a book starts with; `state.vocab` holds what you added, it syncs
     and backs up like everything else, and every dropdown built from one ends
     with "Other — write it in". Choosing that reveals a box, and what you type
     is added to the list for good, so the next dialog offers it.

     The rule is systemic on purpose: a picker that cannot be extended is a
     picker that will eventually be wrong, and adding the escape hatch to one
     dialog at a time is how half of them end up without it. */
  var VOCABS = {
    acts:       { of: function () { return ACTS; },        word: "act",
                  make: function (label) { return { label: label, word: label.toLowerCase(), tone: "blue" }; } },
    things:     { of: function () { return THINGS; },      word: "kind of thing",
                  make: function (label) { return label; } },
    places:     { of: function () { return PLACES; },      word: "place",
                  make: function (label) { return label; } },
    claimKinds: { of: function () { return CLAIM_KINDS; }, word: "shape",
                  make: function (label) { return label; } },
    edgeKinds:  { of: function () { return EDGE_KINDS; },  word: "kind of connection",
                  make: function (label) { return { word: label.toLowerCase(), says: label.toLowerCase() }; } }
  };
  var OTHER = "__other";

  function vocabAdded(which) {
    if (!state.vocab) state.vocab = {};
    if (!state.vocab[which]) state.vocab[which] = {};
    return state.vocab[which];
  }
  // Built-ins first, in their own order, then whatever you have added.
  function vocabAll(which) {
    var base = VOCABS[which].of(), out = {}, k;
    for (k in base) out[k] = base[k];
    var mine = (state.vocab && state.vocab[which]) || {};
    for (k in mine) out[k] = mine[k];
    return out;
  }
  function vocabLabel(which, key) {
    var v = vocabAll(which)[key];
    if (!v) return key || "";
    return typeof v === "string" ? v : (v.label || v.word || key);
  }
  // The options a picker shows, with the way out at the bottom.
  function vocabOpts(which) {
    var all = vocabAll(which);
    return Object.keys(all).map(function (k) {
      return { value: k, label: vocabLabel(which, k) };
    }).concat([{ value: OTHER, label: "Other — write it in" }]);
  }
  /* Resolves what the dialog came back with. If "Other" was chosen and
     something was typed, it is added to the list and its new key returned; if
     "Other" was chosen and nothing was typed, the fallback is used rather than
     writing an entry with no name. Must be called inside go(), because it
     writes to state. */
  function vocabTake(which, pick, typed, fallback) {
    if (pick !== OTHER) return pick;
    var label = String(typed || "").trim();
    if (!label) return fallback || Object.keys(vocabAll(which))[0];
    var all = vocabAll(which), k;
    for (k in all) {
      if (String(vocabLabel(which, k)).toLowerCase() === label.toLowerCase()) return k;
    }
    var key = label.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || uid();
    if (all[key]) key = key + "-" + uid().slice(0, 4);
    vocabAdded(which)[key] = VOCABS[which].make(label);
    return key;
  }
  // The text field that sits under a vocabulary picker in every dialog.
  function otherField(which, key) {
    return { key: key || "other", label: "If other, what is it called",
             type: "text", span: true, value: "",
             hint: "Only needed if you picked “Other” above. It is added to the list for next time." };
  }

  var CLAIM_KINDS = {
    budget:   "Hours a week",
    days:     "Days a week",
    ondemand: "On demand",
    floor:    "At least, a week",
    watch:    "Watched only"
  };

  var APP = {
    storeKey: "mashghal.v1",
    tabs: [
      { id: "boards",  label: "Boards",   ico: ICONS.boards },
      { id: "waiting", label: "Waiting",  ico: ICONS.waiting },
      { id: "week",    label: "The week", ico: ICONS.week },
      { id: "cal",     label: "Calendar", ico: ICONS.cal },
      { id: "jobs",    label: "Jobs",     ico: ICONS.jobs },
      { id: "settings",label: "Settings", ico: ICONS.settings }
    ],

    blank: function () {
      return {
        version: 1,
        // What you have added to the app's own lists — acts, kinds of thing,
        // places. Syncs and backs up like everything else.
        vocab: {},
        /* A job is the top of the hierarchy and holds everything about one
           engagement: which claimants it bills to, which modes of work it
           involves, the benches those make, and its boards. It exists because
           "claimant", "mode" and "bench" are the app's words for parts of a
           thing a person calls one job — so the parts stay, and a job is the
           bag you actually open. The kit folds in here too, rather than being
           a tab of its own that has to be decoded. */
        jobs: [],        // {id,name,colour,note,noteAt,software[],links[],archived}
        kinds: [],       // {id,name,colour}
        claimants: [],   // {id,name,kind,hours,colour,archived}
        modes: [],       // {id,name,software[],links[],archived}
        benches: [],     // {id,modeId,claimantId,note,noteAt,archived}
        boards: [],      // see newBoard()
        spans: [],       // {id,startedAt,endedAt,benchId,note,source}
        assets: [],      // {id,name,kind,notes,archived}
        cadences: [],    // {id,label,everyDays,lastDoneOn,place,protects…,archived}
        settings: { showDone: true, companion: false,
                    sync: { mode: "none", gistId: "", deviceName: "", borrowed: false, lastPulledAt: "" } },
        forgotten: {},   // id -> name, so a removed thing still reads in history
        tombstones: {},  // id -> when it was deleted, so a merge cannot resurrect it
        devices: {}      // deviceId -> {name, at} so you can see what is still signed in
      };
    },

    // One adoption path. load() and the backup restore both come through
    // here — hand-copying key lists is how Coffer quietly lost grants.
    hydrate: function (parsed, shape) {
      var s = shape;
      ["jobs", "kinds", "claimants", "modes", "benches", "boards", "spans", "assets", "cadences"].forEach(function (k) {
        if (Array.isArray(parsed[k])) s[k] = parsed[k];
      });
      ["forgotten", "tombstones", "devices", "vocab"].forEach(function (k) {
        if (parsed[k] && typeof parsed[k] === "object") s[k] = parsed[k];
      });
      if (parsed.settings) {
        if (typeof parsed.settings.showDone === "boolean") s.settings.showDone = parsed.settings.showDone;
        if (typeof parsed.settings.companion === "boolean") s.settings.companion = parsed.settings.companion;
        if (parsed.settings.sync && typeof parsed.settings.sync === "object") {
          ["mode", "gistId", "deviceName", "lastPulledAt"].forEach(function (k) {
            if (typeof parsed.settings.sync[k] === "string") s.settings.sync[k] = parsed.settings.sync[k];
          });
          s.settings.sync.borrowed = !!parsed.settings.sync.borrowed;
        }
      }
      return s;
    },

    renderView: function (v) {
      // "write" is a page, not a tab — reached from the rail and from Boards,
      // and cleared the moment a tab is pressed, so a tab always lands on its
      // own list rather than on whatever you were doing ten minutes ago.
      if (v === "write")    return renderWrite();
      if (v === "boards")   return renderBoards();
      if (v === "waiting")  return renderWaiting();
      if (v === "week")     return reportOn ? renderReport() : renderWeek();
      if (v === "cal")      return renderCal();
      if (v === "jobs")     return openJob ? renderJob(jobOf(openJob) || { name: "?", id: "" }) : renderJobs();
      if (v === "vocab")    return openMode ? kitModeDetail(byId(state.modes, openMode) || { name: "?", id: "" }) : renderKit();
      return renderSettings();
    },

    // The switch bar lives outside the view, so render() never touches it.
    beforeRender: function () { if (ensureJobs()) save(); },

    afterRender: function () { mountCanvas(); mountBar(); railFoot(); railWork(); mountProse(); mountBackups(); mountPics(); },

    // The Boards tab always lands on the list. Opening on whichever board you
    // last looked at means one tab shows a different screen depending on what
    // you did ten minutes ago, which is how nobody learns where anything is.
    onTabChange: function () { openId = ""; weekOf = ""; reportOn = null; openMode = ""; openJob = ""; calMonth = ""; },

    actions: {}
  };

  /* ================= vocabulary helpers ================= */

  function byId(list, id) {
    for (var i = 0; i < list.length; i++) { if (list[i].id === id) return list[i]; }
    return null;
  }
  function nameOf(list, id, what) {
    var r = byId(list, id);
    if (r) return r.name;
    if (state.forgotten[id]) return state.forgotten[id] + " (removed)";
    return id ? "(removed " + what + ")" : "";
  }
  function claimantName(id) { return nameOf(state.claimants, id, "claimant"); }
  function modeName(id) { return nameOf(state.modes, id, "mode"); }
  function kindName(id) { return nameOf(state.kinds, id, "kind"); }

  function benchLabel(id) {
    var b = byId(state.benches, id);
    if (!b) return id ? "(removed bench)" : "no bench";
    return modeName(b.modeId) + " · " + claimantName(b.claimantId);
  }
  function live(list) { return list.filter(function (r) { return !r.archived; }); }

  function forget(list, id) {
    var r = byId(list, id);
    if (r) state.forgotten[id] = r.name;
  }

  /* ================= boards, nodes, edges ================= */

  function newBoard(name, kindId, benchId) {
    return {
      id: uid(), kind: "template", name: name, kindId: kindId || "", benchId: benchId || "",
      fromBoardId: "", nodes: [], edges: [],
      startedOn: "", closedOn: "", archived: false
    };
  }
  function boards(kind) {
    return state.boards.filter(function (b) { return !b.archived && (!kind || b.kind === kind); });
  }
  // Which board is open is where you are looking, not something you own, so
  // it lives here rather than in state and never reaches a backup.
  var openId = "";
  function openBoard() { return byId(state.boards, openId); }

  function nodeOf(b, id) { return byId(b.nodes, id); }
  function edgesOf(b, id, k) {
    return b.edges.filter(function (e) {
      return (!k || e.k === k) && (e.a === id || e.b === id);
    });
  }
  function nextOf(b, id) {
    return b.edges.filter(function (e) { return e.k === "flow" && e.a === id; });
  }
  function prevOf(b, id) {
    return b.edges.filter(function (e) { return e.k === "flow" && e.b === id; });
  }
  // Who a send goes to is not a second list to keep in step — it is the people
  // linked to it. Linking a person to a send is what "this goes to them" means,
  // so there is one fact and one place to change it.
  function recipientsOf(b, n) {
    return edgesOf(b, n.id, "link").map(function (e) {
      return nodeOf(b, e.a === n.id ? e.b : e.a);
    }).filter(function (t) { return t && t.t === "thing" && t.kind === "person"; });
  }

  // A decision's exits are its labelled outgoing lines, and nothing else. They
  // used to be a list on the node as well, which meant routing read one of them
  // and the screen read the other — two truths, and only one of them right.
  function exitsOf(b, n) {
    return nextOf(b, n.id).filter(function (e) { return e.label; })
      .map(function (e) { return { label: e.label, goTo: e.b, edgeId: e.id }; });
  }

  function entryNodes(b) {
    return b.nodes.filter(function (n) {
      return n.t === "step" && prevOf(b, n.id).length === 0;
    });
  }

  // Where a node stands in a run. Derived from doneAt / enteredAt and the
  // clock — never stored, so it cannot drift away from the dates.
  function nodeState(b, n) {
    if (n.t !== "step") return "thing";
    if (b.kind !== "run") return "todo";
    if (n.doneAt) return "done";
    if (!n.enteredAt) return "todo";
    if (n.act === "send" || n.act === "watch") {
      return overdueBy(n) > 0 ? "over" : "waiting";
    }
    return "now";
  }
  function daysWaiting(n) {
    if (!n.enteredAt) return 0;
    return Math.max(0, daysBetween(n.enteredAt, today()));
  }
  // Positive means past the chase. A step with no chase interval can wait
  // for ever without being called late — silence is not always a failure.
  // Measured from the last chase rather than from the start, so chasing buys
  // another interval: otherwise a step chased this morning still reads eleven
  // days past, and the one number you would act on is the one that is wrong.
  // The total wait is a separate figure and does not move.
  function overdueBy(n) {
    if (!n.chaseDays) return 0;
    return sinceChase(n) - num(n.chaseDays);
  }
  function sinceChase(n) {
    var from = n.chasedAt || n.enteredAt;
    if (!from) return 0;
    return Math.max(0, daysBetween(stampDay(from), today()));
  }
  function chaseCount(n) { return num(n.chases || 0); }
  function activeNodes(b) {
    return b.nodes.filter(function (n) {
      return n.t === "step" && n.enteredAt && !n.doneAt;
    });
  }
  function runProgress(b) {
    var steps = b.nodes.filter(function (n) { return n.t === "step"; });
    var done = steps.filter(function (n) { return n.doneAt; }).length;
    return { done: done, total: steps.length };
  }
  // The archive lock: a run is not finished while a filing step is undone.
  // Printed and never archived is exactly the thing that gets forgotten.
  function unfiled(b) {
    return b.nodes.filter(function (n) {
      return n.t === "step" && n.act === "file" && !n.doneAt;
    });
  }

  /* ================= running a board ================= */

  function startRun(tpl, title) {
    var r = JSON.parse(JSON.stringify(tpl));
    r.id = uid();
    r.kind = "run";
    r.fromBoardId = tpl.id;
    r.name = title;
    r.startedOn = today();
    r.closedOn = "";
    r.nodes.forEach(function (n) {
      n.enteredAt = ""; n.doneAt = ""; n.answer = "";
    });
    entryNodes(r).forEach(function (n) { n.enteredAt = today(); });
    state.boards.push(r);
    return r;
  }

  function enter(b, id) {
    var n = nodeOf(b, id);
    if (n && !n.enteredAt) n.enteredAt = today();
  }

  // Finishing a step opens whatever the flow says comes next. An `ask`
  // opens only the exit that was chosen, which is how the loop works.
  function finishStep(b, id, answer) {
    var n = nodeOf(b, id);
    if (!n || n.doneAt) return;
    n.doneAt = today();
    if (answer) n.answer = answer;
    var outs = nextOf(b, id);
    outs.forEach(function (e) {
      if (n.act === "ask" && answer && e.label !== answer) return;
      var t = nodeOf(b, e.b);
      if (!t) return;
      /* A step whose ways in are marked "and the rest" does not start until
         every one of them is done. Without this the label would be a lie: the
         board would say a step waits for all of its inputs and the run would
         start it on the first. The GIS example needs both readings — metadata
         can begin once any area is digitised, filing waits for every one. */
      if (!readyToEnter(b, t)) return;
      // Re-entering a step that ran before is a new pass of the cycle.
      t.doneAt = ""; t.answer = ""; t.enteredAt = today();
    });
  }

  /* Whether a step may start yet. "Whichever comes first" is the default and
     the old behaviour; "and the rest" holds the step until every way in has
     been done. An unfinished predecessor that is itself unreachable would
     deadlock the run, so only ways in that have actually been entered count —
     a branch never taken cannot hold the work up for ever. */
  function readyToEnter(b, t) {
    var ins = b.edges.filter(function (e) { return e.k === "flow" && e.b === t.id; });
    var all = ins.filter(function (e) { return e.join === "all"; });
    if (!all.length) return true;
    return !all.some(function (e) {
      var from = nodeOf(b, e.a);
      return from && from.enteredAt && !from.doneAt;
    });
  }

  function reopenStep(b, id) {
    var n = nodeOf(b, id);
    if (!n) return;
    n.doneAt = ""; n.answer = "";
    if (!n.enteredAt) n.enteredAt = today();
  }

  /* ================= dues ================= */

  // Every live step of every open run, worst first. This is the only list
  // the phone needs, and it is derived — nothing here is typed by hand.
  function dues() {
    var out = [];
    boards("run").forEach(function (b) {
      if (b.closedOn) return;
      activeNodes(b).forEach(function (n) {
        var st = nodeState(b, n);
        out.push({
          board: b, node: n, st: st,
          over: overdueBy(n), days: daysWaiting(n),
          rank: st === "over" ? 0 : st === "waiting" ? 1 : 2
        });
      });
    });
    out.sort(function (x, y) {
      if (x.rank !== y.rank) return x.rank - y.rank;
      if (x.rank === 0) return y.over - x.over;
      return y.days - x.days;
    });
    return out;
  }

  function stuck() {
    return boards("run").filter(function (b) {
      return !b.closedOn && activeNodes(b).length === 0 && unfiled(b).length > 0;
    });
  }

  /* ================= pickers ================= */

  function opts(list, labelFn) {
    return live(list).map(function (r) {
      return { value: r.id, label: labelFn ? labelFn(r) : r.name };
    });
  }
  function benchOpts() {
    return [{ value: "", label: "No bench — belongs to no employer" }].concat(
      opts(state.benches, function (b) { return benchLabel(b.id); }));
  }
  function kindOpts() {
    return [{ value: "", label: "No kind" }].concat(opts(state.kinds));
  }
  function nodeOpts(b, exceptId) {
    return b.nodes.filter(function (n) { return n.id !== exceptId; })
      .map(function (n) { return { value: n.id, label: (n.t === "step" ? "■ " : "● ") + n.label }; });
  }

  /* ================= Boards ================= */

  function renderBoards() {
    var b = openBoard();
    if (b) return renderBoard(b);

    var runs = boards("run").filter(function (r) { return !r.closedOn; });
    var closed = boards("run").filter(function (r) { return r.closedOn; });
    var tpls = boards("template");

    var h = pageHead("Boards", "A procedure is written once. A run is one pass through it.",
      '<div class="tools">' +
      '<button class="btn" data-act="board-new">New board</button>' +
      '<button class="btn" data-act="prose-open">Write one in prose</button>' +
      (tpls.length ? '<button class="btn primary" data-act="run-start">Start a run</button>' : "") +
      "</div>");

    h += '<div class="sect">Running</div>';
    h += runs.length ? '<div class="boards">' + runs.map(runCard).join("") + "</div>"
                     : '<p class="empty">Nothing under way.</p>';

    h += '<div class="sect">Procedures</div>';
    h += tpls.length ? '<div class="boards">' + tpls.map(tplCard).join("") + "</div>"
                     : '<p class="empty">No procedures yet. Write one, then run it as many times as you like.</p>';

    if (closed.length) {
      h += '<div class="sect">Finished</div><div class="boards">' + closed.map(runCard).join("") + "</div>";
    }
    return h;
  }

  function cardTop(b) {
    var k = byId(state.kinds, b.kindId);
    return k ? ' style="border-top-color:' + esc(k.colour) + '"' : "";
  }

  function tplCard(b) {
    var steps = b.nodes.filter(function (n) { return n.t === "step"; });
    var runs = boards("run").filter(function (r) { return r.fromBoardId === b.id; }).length;
    return '<button class="bcard" data-act="board-open" data-id="' + b.id + '"' + cardTop(b) + ">" +
      "<h3>" + esc(b.name) + "</h3>" +
      '<div class="bsub">' + esc(jobOrBench(b)) + "</div>" +
      // The same track, all of it waiting: the shape of the procedure itself.
      '<div class="track">' + steps.map(function (n) {
        return '<i class="t-todo" title="' + esc(n.label) + '"></i>';
      }).join("") + "</div>" +
      '<div class="bstat">' + (runs ? "Run " + runs + (runs === 1 ? " time" : " times") : "Never run yet") +
      '<span class="bnum">' + steps.length + "</span></div></button>";
  }

  /* A card that SHOWS the run rather than describing it.

     "3 of 8 done" is a sentence you have to parse; a track of eight marks, three
     filled, is the same fact at a glance — and it also shows WHERE in the work
     you are, which the sentence never did. Under it go the pictures on the
     board, because on a run about aerial photographs the photographs are the
     most recognisable thing about it.

     This is the difference between a list of records and a screen: the same
     data, arranged so the eye does the reading. */
  function runCard(b) {
    var p = runProgress(b);
    var act = activeNodes(b);
    var late = act.filter(function (n) { return nodeState(b, n) === "over"; }).length;
    var steps = b.nodes.filter(function (n) { return n.t === "step"; });
    var pics = b.nodes.filter(function (n) { return n.t === "thing" && n.pic; });

    var head = b.closedOn ? "Finished " + niceDate(b.closedOn)
             : late ? (late === 1 ? "One thing is late" : cap(numWord(late)) + " things are late")
             : act.length ? (act.length === 1 ? "One step in hand" : cap(numWord(act.length)) + " steps in hand")
             : "Nothing on the go";

    return '<button class="bcard' + (late ? " late" : "") + '" data-act="board-open" data-id="' +
      b.id + '"' + cardTop(b) + ">" +
      "<h3>" + esc(b.name) + "</h3>" +
      '<div class="bsub">' + esc(jobOrBench(b)) + "</div>" +
      // The track: one mark per step, in order, so you can see the shape of it.
      '<div class="track">' + steps.map(function (n) {
        var st = nodeState(b, n);
        return '<i class="t-' + st + '" title="' + esc(n.label) + '"></i>';
      }).join("") + "</div>" +
      '<div class="bstat' + (late ? " bad" : "") + '">' + esc(head) +
      '<span class="bnum">' + p.done + "/" + p.total + "</span></div>" +
      (pics.length ? '<div class="bpics">' + pics.slice(0, 4).map(function (t) {
        return '<img data-pic="' + esc(t.pic) + '" alt="">';
      }).join("") + "</div>" : "") +
      "</button>";
  }

  function jobOrBench(b) {
    var bits = [];
    if (b.jobId) bits.push(jobName(b.jobId));
    else if (b.benchId) bits.push(benchLabel(b.benchId));
    if (b.kindId) bits.push(kindName(b.kindId));
    return bits.length ? bits.join(" · ") : "Belongs to no job";
  }

  /* ---------------- one board ---------------- */

  /* How the run stands, as dot-and-word pairs rather than a count buried in the
     provenance line. The last pair is the archive lock: a run that has printed
     but never been filed LOOKS finished, and this is the only place that says
     out loud that it is not. */
  function boardStand(b, p) {
    if (b.kind !== "run") return "";
    var d = dues().filter(function (x) { return x.board.id === b.id; });
    var late = d.filter(function (x) { return x.st === "over"; }).length;
    var hand = d.length - late;
    var uf = unfiled(b).length;
    var bits = [];
    if (late) bits.push('<span class="sp"><i class="d-late"></i>' +
      (late === 1 ? "One late" : cap(numWord(late)) + " late") + "</span>");
    if (hand) bits.push('<span class="sp"><i class="d-hand"></i>' +
      (hand === 1 ? "One in hand" : cap(numWord(hand)) + " in hand") + "</span>");
    if (!d.length) bits.push('<span class="sp muted">Nothing active</span>');
    bits.push('<span class="sp muted">' + p.done + " of " + p.total + " done</span>");
    if (uf) bits.push('<span class="sp muted">can’t be closed yet</span>');
    else if (b.closedOn) bits.push('<span class="sp muted">closed ' + esc(niceDate(b.closedOn)) + "</span>");
    return '<div class="stand">' + bits.join("") + "</div>";
  }

  function renderBoard(b) {
    var isRun = b.kind === "run";
    var p = runProgress(b);
    var sub = (b.benchId ? benchLabel(b.benchId) : "no employer") +
      (b.kindId ? " · " + kindName(b.kindId) : "") +
      (isRun
        ? (b.startedOn ? " · started " + niceDate(b.startedOn) : "") +
          (b.fromBoardId && byId(state.boards, b.fromBoardId)
            ? ", from “" + byId(state.boards, b.fromBoardId).name + "”" : "")
        : " · a procedure, not a run");

    var tools = '<div class="tools">' +
      '<button class="btn" data-act="board-back">All boards</button>' +
      '<button class="btn" data-act="node-add" data-id="' + b.id + '">Add step</button>' +
      '<button class="btn" data-act="photo-add" data-id="' + b.id + '">Add a photo</button>' +
      '<button class="btn" data-act="thing-add" data-id="' + b.id + '">Add a person or thing</button>' +
      (allThings().length ? '<button class="btn" data-act="thing-borrow" data-id="' + b.id + '">From another board</button>' : "") +
      (b.nodes.length > 1 ? '<button class="btn" data-act="edge-add" data-id="' + b.id + '">Connect</button>' : "") +
      (isRun ? "" : '<button class="btn primary" data-act="run-this" data-id="' + b.id + '">Run it</button>') +
      (isRun && !b.closedOn ? '<button class="btn" data-act="run-close" data-id="' + b.id + '">Close run</button>' : "") +
      '<button class="btn" data-act="board-edit" data-id="' + b.id + '">Rename</button>' +
      '<button class="btn danger" data-act="board-del" data-id="' + b.id + '">Delete</button>' +
      "</div>";

    /* Built inline rather than through pageHead(), which belongs to the shared
       runtime and knows nothing about a status cluster. */
    var h = '<div class="page-head"><div><h2>' + esc(b.name) + "</h2>" +
      "<p>" + esc(sub) + "</p>" + boardStand(b, p) + "</div>" + tools + "</div>";

    if (isRun && b.closedOn) {
      h += '<div class="card"><p class="hint" style="margin:0">Closed on ' + niceDate(b.closedOn) +
        ". Nothing here can move; reopen it if there is more to do. " +
        '<button class="btn quiet" data-act="run-reopen" data-id="' + b.id + '">Reopen</button></p></div>';
    }

    if (isRun && !b.closedOn) {
      var uf = unfiled(b), act = activeNodes(b);
      if (!act.length && uf.length) {
        h += '<div class="card" style="border-left:2px solid var(--oxide)">' +
          "<h3>Not finished</h3><p class=\"hint\" style=\"margin:0.2rem 0 0\">Nothing is in hand, but " +
          uf.length + (uf.length === 1 ? " filing step is" : " filing steps are") +
          " still undone — " + esc(uf.map(function (n) { return n.label; }).join(", ")) +
          ". A run will not close until the filing is done, because filing is the thing that gets forgotten.</p></div>";
      }
    }

    h += canvasHtml(b);

    /* One list, not three tables.

       Steps, Things and Connections as separate lists meant the board could
       only be read by cross-referencing: this step waits on somebody, and the
       somebody is in another table, and the fact that they are connected is in
       a third. So a step carries its own people, its own pictures and its own
       ways out, in the row — and the only things listed separately are the ones
       genuinely not attached to anything yet, which is a real state worth
       seeing rather than a table to join.

       The full list of connections survives behind a fold, because deleting one
       has to be possible somewhere and the sheet is for drawing them, not for
       tidying up. */
    var steps = b.nodes.filter(function (n) { return n.t === "step"; });
    var things = b.nodes.filter(function (n) { return n.t === "thing"; });
    var loose = things.filter(function (n) { return !edgesOf(b, n.id, "link").length; });

    h += '<div class="sect">' + (isRun ? "Where the work is" : "The steps, in order") + "</div>";
    h += steps.length ? '<div class="stack tight">' + steps.map(function (n) { return stepRow(b, n); }).join("") + "</div>"
                      : '<p class="empty">No steps yet. Add the first thing you actually do.</p>';

    if (loose.length) {
      h += '<div class="sect">On the board, not attached to anything</div>' +
        '<p class="saynote" style="margin:-0.3rem 0 0.7rem">Drag from a step\u2019s handle to one of these to say where it belongs.</p>' +
        '<div class="stack tight">' + loose.map(function (n) { return thingRow(b, n); }).join("") + "</div>";
    }

    if (b.edges.length) {
      h += '<details class="fold"><summary>All ' + b.edges.length +
        " connections, if you need to remove one</summary><div class=\"stack tight\">" +
        b.edges.map(function (e) { return edgeRow(b, e); }).join("") + "</div></details>";
    }
    return h;
  }

  // stateTone is gone: it mapped a state onto a pill class, and there are no
  // pills left. A state is a word beside a drawn icon now — see stepRow().
function stateWord(b, n) {
    var st = nodeState(b, n);
    if (st === "done") return "done";
    if (st === "over") return "late";
    if (st === "waiting") return "waiting";
    if (st === "now") return "in hand";
    return "not started";
  }

  function linkedPics(b, n) {
    return edgesOf(b, n.id, "link").map(function (e) {
      return nodeOf(b, e.a === n.id ? e.b : e.a);
    }).filter(function (t) { return t && t.pic; });
  }

  function stepRow(b, n) {
    var isRun = b.kind === "run";
    var st = nodeState(b, n);
    var who = recipientsOf(b, n).map(function (t) { return t.label; }).join(", ");

    var meta = [ACTS[n.act].label];
    if (who) meta.push("to " + who);
    else if (n.act === "send") meta.push("nobody linked yet");
    if (n.chaseDays) meta.push("chase after " + n.chaseDays + "d");
    if (n.dueAt) meta.push(niceDate(n.dueAt));
    if (isRun && n.enteredAt && !n.doneAt) meta.push(daysWaiting(n) + "d");
    if (isRun && n.doneAt) meta.push("done " + niceDate(n.doneAt));
    if (isRun && n.answer) meta.push("chose: " + n.answer);

    var exits = n.act === "ask" ? exitsOf(b, n) : [];
    if (n.act === "ask") {
      meta.push(exits.length ? exits.map(function (x) {
        var t = nodeOf(b, x.goTo);
        return x.label + " → " + (t ? t.label : "?");
      }).join(" · ") : "no exits yet");
    }

    var tools = "";
    if (isRun && !b.closedOn) {
      if (!n.doneAt && n.enteredAt) {
        tools += n.act === "ask"
          ? '<button class="btn" data-act="step-answer" data-id="' + b.id + ":" + n.id + '">Answer</button>'
          : '<button class="btn" data-act="step-done" data-id="' + b.id + ":" + n.id + '">Mark done</button>';
      } else if (!n.enteredAt) {
        tools += '<button class="btn quiet" data-act="step-enter" data-id="' + b.id + ":" + n.id + '">Start</button>';
      } else {
        tools += '<button class="btn quiet" data-act="step-reopen" data-id="' + b.id + ":" + n.id + '">Reopen</button>';
      }
    }
    if (n.act === "ask") {
      tools += '<button class="btn quiet" data-act="exit-add" data-id="' + b.id + ":" + n.id + '">Add exit</button>';
    }
    if (n.act === "send") {
      tools += '<button class="btn quiet" data-act="send-to" data-id="' + b.id + ":" + n.id + '">Send to</button>';
    }
    tools += '<button class="btn quiet" data-act="node-edit" data-id="' + b.id + ":" + n.id + '">Edit</button>';
    tools += '<button class="btn quiet danger" data-act="node-del" data-id="' + b.id + ":" + n.id + '">×</button>';

    var late = st === "over";
    return '<div class="panel calm' + (late ? " late" : "") + '">' +
      '<span class="ic ic-' + esc(n.act) + '" title="' + esc(vocabLabel("acts", n.act)) + '">' +
      actIcon(n.act) + "</span>" +
      '<div class="grow"><div class="nm sm">' + esc(n.label) + "</div>" +
      '<div class="says">' + esc(meta.join(" · ")) + "</div>" +
      (function () {
        var out = "";
        // Everything hanging off this step, named on the step itself.
        var hangs = edgesOf(b, n.id, "link").map(function (e) {
          return nodeOf(b, e.a === n.id ? e.b : e.a);
        }).filter(function (t) { return t && !t.pic; });
        if (hangs.length) {
          out += '<div class="chips">' + hangs.map(function (t) {
            return '<span class="chip" data-act="node-edit" data-id="' + b.id + ":" + t.id + '">' +
              '<span class="ci">' + thingIcon(t.kind) + "</span>" + esc(clip(t.label, 22)) + "</span>";
          }).join("") + "</div>";
        }
        var pics = linkedPics(b, n);
        if (pics.length) {
          out += '<div class="strip">' + pics.map(function (t) {
            return '<img class="tinypic" data-pic="' + esc(t.pic) + '" alt="" title="' +
              esc(t.label) + '" data-act="pic-open" data-id="' + b.id + ":" + t.id + '">';
          }).join("") + "</div>";
        }
        // And where it goes, so the order is readable without the sheet.
        var nexts = nextOf(b, n.id);
        if (nexts.length > 1 || (nexts.length === 1 && nexts[0].label)) {
          out += '<div class="chips">' + nexts.map(function (e) {
            var t = nodeOf(b, e.b);
            return '<span class="chip way">' + (e.label ? esc(e.label) + " → " : "then → ") +
              esc(clip(t ? t.label : "?", 20)) + "</span>";
          }).join("") + "</div>";
        }
        return out;
      })() + "</div>" +
      (isRun ? '<div class="age' + (late ? " bad" : st === "now" ? " ok" : "") + '">' +
        esc(stateWord(b, n)) + "</div>" : "") +
      '<div class="acts">' + tools + "</div></div>";
  }

  function thingRow(b, n) {
    var links = edgesOf(b, n.id, "link").length;
    var says = [String(vocabLabel("things", n.kind)).toLowerCase()];
    says.push(links ? links + (links === 1 ? " link" : " links") : "not linked to anything");
    if (n.path) says.push(n.path);
    if (n.url) says.push(n.url);
    return '<div class="panel calm">' +
      (n.pic ? '<img class="thumb" data-pic="' + esc(n.pic) + '" alt="">'
             : '<span class="ic" title="' + esc(vocabLabel("things", n.kind)) + '">' +
               thingIcon(n.kind) + "</span>") +
      '<div class="grow"><div class="nm sm">' + esc(n.label) + "</div>" +
      '<div class="says">' + esc(says.join(" · ")) + "</div></div>" +
      '<div class="acts">' +
      (n.kind === "photo" ? '<button class="btn quiet" data-act="pic-add" data-id="' + b.id + ":" + n.id + '">' +
        (n.pic ? "Replace picture" : "Add a picture") + "</button>" : "") +
      (n.pic ? '<button class="btn quiet" data-act="pic-open" data-id="' + b.id + ":" + n.id + '">Look</button>' : "") +
      '<button class="btn quiet" data-act="node-edit" data-id="' + b.id + ":" + n.id + '">Edit</button>' +
      '<button class="btn quiet danger" data-act="node-del" data-id="' + b.id + ":" + n.id + '">×</button></div></div>';
  }

  function edgeRow(b, e) {
    var a = nodeOf(b, e.a), z = nodeOf(b, e.b);
    if (!a || !z) return "";
    var flow = e.k === "flow";
    var arrow = flow ? " → " : " ·· ";
    // The line itself rather than a word for it: solid with a head for
    // sequence, dotted without one for association — the same two marks the
    // sheet uses, so the list and the board read the same way.
    var mark = flow
      ? '<svg viewBox="0 0 24 10" width="24" height="10" aria-hidden="true">' +
        '<path d="M1 5h17" stroke="currentColor" stroke-width="1.6"/>' +
        '<path d="M17 1.6L21.5 5 17 8.4z" fill="currentColor"/></svg>'
      : '<svg viewBox="0 0 24 10" width="24" height="10" aria-hidden="true">' +
        '<path d="M1 5h22" stroke="currentColor" stroke-width="1.6" ' +
        'stroke-dasharray="1 4" stroke-linecap="round"/></svg>';
    var says = flow
      ? (e.join === "all" ? "waits for every way in" : e.label ? "a way out: " + e.label : "comes after")
      : "belongs with, in no order";
    return '<div class="panel calm">' +
      '<span class="ic"' + (flow ? "" : ' style="color:var(--brass)"') + ">" + mark + "</span>" +
      '<div class="grow"><div class="nm sm">' + esc(a.label) + arrow + esc(z.label) + "</div>" +
      '<div class="says">' + esc(says) + "</div></div>" +
      '<div class="acts"><button class="btn quiet danger" data-act="edge-del" data-id="' + b.id + ":" + e.id + '">×</button></div></div>';
  }

  /* ================= Waiting ================= */

  /* The screen opens on the finding, not on a count. Four tiles reading
     "OPEN 5 · LATE 3 · RUNS 4 · UPKEEP 2" is an instrument panel: it makes you
     do the reading. "Two things are late" has already done it. Nothing on this
     screen is a pill either — a state is a sentence, because "7D PAST" tells
     you less than "a day past your reminder" in the same space. */
  function renderWaiting() {
    var list = dues();
    var over = list.filter(function (d) { return d.st === "over"; });
    var calm = list.filter(function (d) { return d.st !== "over"; });
    var s = stuck();
    var up = upkeepLate();

    var h = '<div class="finding"><h1>' + esc(waitingHeadline(over.length, s.length, up.length)) + "</h1>" +
      '<span class="stamp">' + esc(nowWords()) + "</span></div>" +
      '<p class="saynote">Nothing will buzz at you. This is the whole list.</p>';

    if (!list.length && !s.length && !live(state.cadences).length) {
      h += '<p class="empty">Nothing is waiting on you. Either everything is done, or nothing has been started.</p>';
      return h;
    }

    if (over.length) h += '<div class="stack">' + over.map(lateCard).join("") + "</div>";

    if (s.length) {
      h += '<div class="sect">Finished, but not put away</div><div class="stack">' +
        s.map(function (b) {
          var uf = unfiled(b);
          return '<div class="panel dashed"><div class="grow">' +
            '<div class="nm">' + esc(uf.length === 1 ? uf[0].label : b.name) + "</div>" +
            '<div class="says">It looks done from the outside. It is not, and the run knows: it will not close while ' +
            esc(uf.map(function (n) { return String(n.label).charAt(0).toLowerCase() + String(n.label).slice(1); })
                  .join(" and ")) + " is undone.</div></div>" +
            '<div class="acts"><button class="btn" data-act="board-open" data-id="' + b.id + '">Open it</button></div></div>';
        }).join("") + "</div>";
    }

    if (calm.length) {
      h += '<div class="sect">Waiting, and that is fine</div><div class="stack tight">' +
        calm.map(calmRow).join("") + "</div>";
    }

    h += upkeepCard();
    h += '<p class="saynote foot">Nothing here was typed in by hand. Every line came out of a procedure, or out of a day passing.</p>';
    return h;
  }

  // The headline is the reading, so it has to be true for every shape of list —
  // including the one where nothing is late but something is unfiled.
  function waitingHeadline(late, stuckN, upN) {
    if (late) return late === 1 ? "One thing is late." : cap(numWord(late)) + " things are late.";
    if (stuckN) return stuckN === 1 ? "One run is finished but not put away."
                                    : cap(numWord(stuckN)) + " runs are finished but not put away.";
    if (upN) return upN === 1 ? "One piece of upkeep is past its interval."
                              : cap(numWord(upN)) + " pieces of upkeep are past their interval.";
    return "Nothing is late.";
  }
  function numWord(n) {
    var w = ["no", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten"];
    return w[n] || String(n);
  }
  // The headline opens a sentence, so the word that starts it is capitalised
  // there rather than in the list — "three things are late." read as a fragment.
  function cap(t) { return t ? t.charAt(0).toUpperCase() + t.slice(1) : t; }
  function clockNow() {
    var d = new Date();
    return pad2(d.getHours()) + ":" + pad2(d.getMinutes());
  }
  /* Named nowWords, not stampNow: the sync module already declares stampNow in
     this same scope, and a later function declaration wins — so the first
     version of this printed a raw sync timestamp on the screen. The orphan scan
     cannot catch that, because both names are used. */
  function nowWords() {
    var d = new Date();
    return dayName(iso(d), "long") + " " + d.getDate() + " " +
      parseISO(today()).toLocaleDateString(undefined, { month: "long" }) + ", " + clockNow();
  }

  // A late thing is a tinted panel: the fill is the alarm, so no pill is needed
  // to say so. The figure on the right is the total wait; the line under it is
  // how far past the chase, which is the part you can act on.
  function lateCard(d) {
    var b = d.board, n = d.node;
    var who = recipientsOf(b, n).map(function (t) { return t.label; }).join(" and ");
    var named = !!who;
    var days = d.days;
    var chased = chaseCount(n);

    var why = named
      ? (d.over === 1 ? "A day past your reminder" : d.over + " days past your reminder")
      : (d.over === 1 ? "A day past your own check-back" : d.over + " days past your own check-back");

    var acts = named
      ? '<button class="btn loud" data-act="step-chased" data-id="' + b.id + ":" + n.id + '">I chased today</button>' +
        '<button class="btn" data-act="step-done" data-id="' + b.id + ":" + n.id + '">It came back</button>'
      : '<button class="btn loud" data-act="step-chased" data-id="' + b.id + ":" + n.id + '">I looked today</button>' +
        '<button class="btn" data-act="step-done" data-id="' + b.id + ":" + n.id + '">It happened</button>';

    return '<div class="panel late' + (named ? "" : " unnamed") + '">' +
      '<div class="grow"><div class="nm">' +
      esc(named ? who + " — " + n.label.toLowerCase() : n.label) + "</div>" +
      '<div class="says">' + esc(b.name + (b.benchId ? " · " + benchLabel(b.benchId) : "")) +
      (named ? "" : " · nobody named, so this is yours to check") + "</div></div>" +
      '<div class="bigage"><b>' + days + (days === 1 ? " day" : " days") + "</b>" +
      '<span>' + esc(why) + (chased ? ", chased " + chased + (chased === 1 ? " time" : " times") : "") + "</span></div>" +
      '<div class="acts">' + acts + "</div></div>";
  }

  // Not late, so it takes no colour and no pill — one line saying why it is
  // waiting, which is the only thing that distinguishes these from each other.
  function calmRow(d) {
    var b = d.board, n = d.node;
    var dated = n.dueAt && d.st === "waiting";
    var says, right;

    if (dated) {
      var away = daysBetween(today(), n.dueAt);
      says = esc(b.name);
      right = esc(niceDate(n.dueAt) + (away > 0 ? ", in " + away + (away === 1 ? " day" : " days") : ""));
    } else if (d.st === "waiting") {
      says = n.chaseDays
        ? "You will chase this after " + n.chaseDays + " days"
        : "You never set a reminder for this one, so it can wait for ever";
      right = d.days + "d";
    } else {
      says = "In your hands. Waiting on nobody but you";
      right = d.days ? d.days + "d" : "today";
    }

    return '<div class="panel calm' + (dated ? " dated" : "") + '">' +
      '<div class="grow"><div class="nm sm">' + esc(n.label) + "</div>" +
      '<div class="says">' + says + "</div></div>" +
      '<div class="age' + (dated ? " ok" : "") + '">' + right + "</div>" +
      '<div class="acts"><button class="btn quiet" data-act="board-open" data-id="' + b.id + '">Board</button>' +
      (n.act === "ask"
        ? '<button class="btn quiet" data-act="step-answer" data-id="' + b.id + ":" + n.id + '">Answer</button>'
        : '<button class="btn quiet" data-act="step-done" data-id="' + b.id + ":" + n.id + '">Done</button>') +
      "</div></div>";
  }

  /* ================= Kit ================= */

  /* The list of jobs, and then one job with everything about it on one page.
     There is no Kit tab any more: the software, the links and the note about
     where you left off are sections of the job that hands them to you, which is
     where you would look for them. */
  function jobDialog(j) {
    openModal({
      title: j ? "Rename the job" : "New job",
      message: j ? "" : "A job is one engagement — an employer, a scholarship, a visa, a thesis. It holds the benches you sit at for it and the boards you run for it.",
      confirmLabel: j ? "Save" : "Create",
      fields: [
        { key: "name", label: "Called", type: "text", span: true, value: j ? j.name : "",
          placeholder: "AUB Tripoli 21st Century" },
        { key: "note", label: "Where you left off", type: "text", span: true, value: j ? (j.note || "") : "",
          hint: "One line, for the version of you that comes back to it." }
      ],
      validate: function (v) { return v.name.trim() ? null : "Give it a name."; },
      onConfirm: function (v) {
        go(function () {
          var t = j;
          if (!t) { t = { id: uid(), software: [], links: [], archived: false }; state.jobs.push(t); }
          t.name = v.name.trim();
          if ((v.note || "").trim() !== (t.note || "")) { t.note = v.note.trim(); t.noteAt = nowStamp(); }
        });
      }
    });
  }
  function jobSwDialog(j) {
    if (!j) return;
    openModal({
      title: "Add software", confirmLabel: "Add",
      message: "A name, and the path you would paste into Win+R to open it.",
      fields: [
        { key: "label", label: "Name", type: "text", span: true, value: "", placeholder: "ArcGIS Pro" },
        { key: "path", label: "Path", type: "text", span: true, value: "",
          hint: "Left blank it is just a reminder that this job uses it." }
      ],
      validate: function (v) { return v.label.trim() ? null : "Give it a name."; },
      onConfirm: function (v) {
        go(function () {
          j.software = j.software || [];
          j.software.push({ id: uid(), label: v.label.trim(), path: v.path.trim() });
        });
      }
    });
  }
  function jobLinkDialog(j) {
    if (!j) return;
    openModal({
      title: "Add a link", confirmLabel: "Add",
      fields: [
        { key: "label", label: "Name", type: "text", span: true, value: "", placeholder: "AUB mail, this project" },
        { key: "url", label: "URL", type: "text", span: true, value: "",
          placeholder: "obsidian://search?query=AUB", hint: "Any scheme, not only http." }
      ],
      validate: function (v) {
        if (!v.label.trim()) return "Give it a name.";
        if (!/^[a-z][a-z0-9+.-]*:/i.test(v.url.trim())) return "A URL needs a scheme — https:, obsidian:, mailto: and so on.";
        return null;
      },
      onConfirm: function (v) {
        go(function () {
          j.links = j.links || [];
          j.links.push({ id: uid(), label: v.label.trim(), url: v.url.trim() });
        });
      }
    });
  }

  /* ================= the calendar =================

     A month of what is already dated, and nothing typed into it. It computes
     nothing of its own — the same rule the report lives by — so every mark on
     it comes from the function the rest of the app reads: a dated step from the
     board that holds it, a chase that has come due from overdueBy(), a cadence
     from cadenceState(). If a figure here ever disagrees with Waiting, one of
     them is wrong and it will not be silent about which.

     There is nothing to add here on purpose. A calendar you can type into is a
     second place for a commitment to live, and then two places disagree. */
  var calMonth = "";   // view state, never saved

  function calOf() { return calMonth || String(today()).slice(0, 7); }
  function monthDays(ym) {
    var first = parseISO(ym + "-01");
    var out = [], d = new Date(first);
    while (iso(d).slice(0, 7) === ym) { out.push(iso(d)); d.setDate(d.getDate() + 1); }
    return out;
  }
  function shiftMonth(ym, by) {
    var d = parseISO(ym + "-01");
    d.setMonth(d.getMonth() + by);
    return iso(d).slice(0, 7);
  }
  function monthName(ym) {
    return parseISO(ym + "-01").toLocaleDateString(undefined, { month: "long", year: "numeric" });
  }

  // Everything already dated, keyed by day. Derived, never stored.
  function calMarks(ym) {
    var by = {};
    function put(day, mark) { if (!day) return; (by[day] = by[day] || []).push(mark); }

    boards("run").forEach(function (b) {
      if (b.closedOn) return;
      activeNodes(b).forEach(function (n) {
        if (n.dueAt) put(n.dueAt, { tone: "dated", label: n.label, where: b.name, id: b.id });
        // The day a chase falls due, which is a date you can plan around even
        // though nobody wrote it down.
        if (n.chaseDays && n.enteredAt) {
          var due = addDays(stampDay(n.chasedAt || n.enteredAt), num(n.chaseDays));
          if (due.slice(0, 7) === ym) {
            var over = overdueBy(n) > 0;
            put(due, { tone: over ? "late" : "chase",
                       label: (over ? "Chase " : "Chase due · ") + n.label, where: b.name, id: b.id });
          }
        }
      });
    });

    live(state.cadences).forEach(function (cd) {
      if (!cd.lastDoneOn || !cd.everyDays) return;
      var due = addDays(cd.lastDoneOn, num(cd.everyDays));
      if (due.slice(0, 7) !== ym) return;
      put(due, { tone: due < today() ? "late" : "upkeep", label: cd.label,
                 where: placeLabel(cd.place), id: "" });
    });

    return by;
  }

  function renderCal() {
    var ym = calOf(), days = monthDays(ym), by = calMarks(ym);
    var first = parseISO(ym + "-01").getDay();          // 0 = Sunday
    var lead = (first + 6) % 7;                          // weeks start Monday
    var count = Object.keys(by).reduce(function (n, k) { return n + by[k].length; }, 0);

    var h = '<div class="finding"><h1>' + esc(monthName(ym)) + "</h1>" +
      '<span class="stamp">' + (count ? count + (count === 1 ? " thing is dated" : " things are dated")
                                      : "nothing dated this month") + "</span></div>" +
      '<p class="saynote">Everything here came off a board or a cadence. There is nothing to add: a calendar you can type into is a second place for a commitment to live, and then two places disagree.</p>' +
      '<div class="tools" style="margin-bottom:1rem">' +
      '<button class="btn" data-act="cal-move" data-id="-1">Back</button>' +
      '<button class="btn" data-act="cal-move" data-id="0">This month</button>' +
      '<button class="btn" data-act="cal-move" data-id="1">On</button></div>';

    h += '<div class="cal">';
    ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].forEach(function (d) {
      h += '<div class="cal-dow">' + d + "</div>";
    });
    for (var i = 0; i < lead; i++) h += '<div class="cal-pad"></div>';
    days.forEach(function (day) {
      var marks = by[day] || [];
      h += '<div class="cal-day' + (day === today() ? " now" : "") + (marks.length ? " has" : "") + '">' +
        '<div class="cal-n">' + Number(day.slice(8)) + "</div>" +
        marks.slice(0, 3).map(function (m) {
          return '<div class="cal-m t-' + m.tone + '"' +
            (m.id ? ' data-act="board-open" data-id="' + m.id + '" style="cursor:pointer"' : "") +
            ' title="' + esc(m.label + " — " + m.where) + '">' + esc(clip(m.label, 22)) + "</div>";
        }).join("") +
        (marks.length > 3 ? '<div class="cal-more">+' + (marks.length - 3) + " more</div>" : "") +
        "</div>";
    });
    h += "</div>";
    return h;
  }

  function renderJobs() {
    var js = jobs();
    var h = '<div class="finding"><h1>' +
      (js.length ? (js.length === 1 ? "One job." : cap(numWord(js.length)) + " jobs.") : "No jobs yet.") +
      "</h1></div>" +
      '<p class="saynote">A job is a bag: the benches you sit at for it, the boards you run for it, and what it hands you when you arrive.</p>' +
      '<div class="tools" style="margin-bottom:1.2rem"><button class="btn primary" data-act="job-add">New job</button>' +
      '<button class="btn" data-act="tab-vocab">Claimants, modes and benches</button></div>';

    if (!js.length) {
      return h + '<p class="empty">Nothing yet. A job is AUB Tripoli 21st Century, or a visa, or a thesis — anything that has its own work and its own things.</p>';
    }

    h += '<div class="stack">' + js.map(function (j) {
      var d = jobDues(j.id), late = d.filter(function (x) { return x.st === "over"; }).length;
      var bs = jobBoards(j.id).filter(function (b) { return b.kind === "run" && !b.closedOn; });
      return '<div class="panel' + (late ? " late" : "") + '" data-act="job-open" data-id="' + j.id + '" style="cursor:pointer">' +
        '<div class="grow"><div class="nm">' + esc(j.name) + "</div>" +
        '<div class="says">' + esc(jobSays(j, bs.length, d.length)) + "</div></div>" +
        (late ? '<div class="bigage"><b>' + late + "</b><span>" +
          (late === 1 ? "late" : "late") + "</span></div>" : "") + "</div>";
    }).join("") + "</div>";
    return h;
  }

  function jobSays(j, runs, waiting) {
    var bits = [];
    var bn = jobBenches(j.id).length;
    bits.push(bn ? bn + (bn === 1 ? " bench" : " benches") : "no bench yet");
    bits.push(runs ? runs + (runs === 1 ? " run under way" : " runs under way") : "nothing running");
    if (waiting) bits.push(waiting + " waiting on you");
    if (j.note) bits.push("you left off: " + j.note);
    return bits.join(" · ");
  }

  function renderJob(j) {
    var d = jobDues(j.id);
    var late = d.filter(function (x) { return x.st === "over"; }).length;
    var runs = jobBoards(j.id).filter(function (b) { return b.kind === "run" && !b.closedOn; });
    var tpls = jobBoards(j.id).filter(function (b) { return b.kind === "template"; });

    var tools = '<div class="tools">' +
      '<button class="btn" data-act="job-back">All jobs</button>' +
      '<button class="btn" data-act="job-edit" data-id="' + j.id + '">Rename</button>' +
      '<button class="btn" data-act="job-sw-add" data-id="' + j.id + '">Add software</button>' +
      '<button class="btn" data-act="job-link-add" data-id="' + j.id + '">Add a link</button>' +
      '<button class="btn danger" data-act="job-del" data-id="' + j.id + '">Delete</button></div>';

    var h = '<div class="page-head"><div><h2>' + esc(j.name) + "</h2>" +
      "<p>" + esc(jobSays(j, runs.length, d.length)) + "</p>" +
      '<div class="stand">' +
      (late ? '<span class="sp"><i class="d-late"></i>' + cap(numWord(late)) + " late</span>" : "") +
      (d.length - late ? '<span class="sp"><i class="d-hand"></i>' + cap(numWord(d.length - late)) + " in hand</span>" : "") +
      (!d.length ? '<span class="sp muted">Nothing waiting</span>' : "") +
      "</div></div>" + tools + "</div>";

    // Where you sit for this job — one tap each.
    var bs = jobBenches(j.id);
    h += '<div class="sect">Where you sit for it</div>';
    h += bs.length ? '<div class="tools">' + bs.map(function (bn) {
      var here = openSpan() && openSpan().benchId === bn.id;
      return '<button class="btn' + (here ? " primary" : "") + '" data-act="bench-go" data-id="' + bn.id + '">' +
        esc(benchLabel(bn.id)) + (here ? " · here now" : "") + "</button>";
    }).join("") + "</div>"
      : '<p class="empty">No bench yet. A bench is a claimant and a craft together — add one under “Claimants, modes and benches”.</p>';

    if (j.note) {
      h += '<div class="sect">Where you left off</div>' +
        '<div class="panel calm"><div class="grow"><div class="nm sm">' + esc(j.note) + "</div>" +
        '<div class="says">' + esc(j.noteAt ? "Written " + agoWords(j.noteAt) : "") + "</div></div></div>";
    }

    h += '<div class="sect">Running</div>';
    h += runs.length ? '<div class="stack tight">' + runs.map(function (b) {
      var bd = dues().filter(function (x) { return x.board.id === b.id; });
      var bl = bd.filter(function (x) { return x.st === "over"; }).length;
      return '<div class="panel calm' + (bl ? " late" : "") + '" data-act="board-open" data-id="' + b.id + '" style="cursor:pointer">' +
        '<div class="grow"><div class="nm sm">' + esc(b.name) + "</div>" +
        '<div class="says">' + (bl ? bl + " late · " : "") + bd.length + " waiting · " +
        runProgress(b).done + " of " + runProgress(b).total + " done</div></div></div>";
    }).join("") + "</div>" : '<p class="empty">Nothing running for this job.</p>';

    if (tpls.length) {
      h += '<div class="sect">Procedures for it</div><div class="stack tight">' + tpls.map(function (b) {
        return '<div class="panel calm" data-act="board-open" data-id="' + b.id + '" style="cursor:pointer">' +
          '<div class="grow"><div class="nm sm">' + esc(b.name) + "</div>" +
          '<div class="says">' + b.nodes.filter(function (n) { return n.t === "step"; }).length + " steps</div></div></div>";
      }).join("") + "</div>";
    }

    h += '<div class="sect">What it hands you</div>';
    var sw = j.software || [], lk = j.links || [];
    h += (sw.length || lk.length) ? '<div class="stack tight">' +
      sw.map(function (x) {
        return '<div class="panel calm"><div class="grow"><div class="nm sm">' + esc(x.label) + "</div>" +
          '<div class="says">' + esc(x.path || "no path — just a reminder that this job uses it") + "</div></div>" +
          '<div class="acts">' + (x.path ? '<button class="btn quiet" data-act="job-sw-copy" data-id="' +
          j.id + ":" + x.id + '">Copy path</button>' : "") +
          '<button class="btn quiet danger" data-act="job-sw-del" data-id="' + j.id + ":" + x.id + '">×</button></div></div>';
      }).join("") +
      lk.map(function (x) {
        return '<div class="panel calm"><div class="grow"><div class="nm sm">' + esc(x.label) + "</div>" +
          '<div class="says">' + esc(x.url) + "</div></div>" +
          '<div class="acts"><a class="btn quiet" href="' + esc(x.url) + '" target="_blank" rel="noopener">Open</a>' +
          '<button class="btn quiet danger" data-act="job-link-del" data-id="' + j.id + ":" + x.id + '">×</button></div></div>';
      }).join("") + "</div>"
      : '<p class="empty">Nothing yet. A path you would paste into Win+R, or a link to the filtered inbox for this job.</p>';
    return h;
  }

  function renderKit() {
    var h = pageHead("Kit", "Everything here is yours to add, rename and remove. None of it is written into the app.");

  /* ================= time, spans, and the week ================= */

  // A span is a stretch of time at one bench. Hours are never stored as a
  // total anywhere — every figure on the week is summed from these, so no
  // figure can drift away from the record it came from.
  var LONG_DAY = 14 * 60;   // minutes past which an open span is not believed
  var weekOf = "";          // which week is being read; view state, never saved

  function nowStamp() {
    var d = new Date();
    return iso(d) + "T" + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
  }
  function stampDay(s) { return String(s).slice(0, 10); }
  function stampMin(s) {
    var t = String(s).slice(11);
    return num(t.slice(0, 2)) * 60 + num(t.slice(3, 5));
  }
  function minsBetween(a, b) {
    return daysBetween(stampDay(a), stampDay(b)) * 1440 + stampMin(b) - stampMin(a);
  }
  function fmtMins(m) {
    m = Math.round(m);
    if (m <= 0) return "0h";
    var h = Math.floor(m / 60), r = m % 60;
    return h ? (r ? h + "h " + r + "m" : h + "h") : r + "m";
  }

  function openSpan() {
    for (var i = state.spans.length - 1; i >= 0; i--) {
      if (!state.spans[i].endedAt) return state.spans[i];
    }
    return null;
  }
  // An open span that started yesterday, or has run longer than any real day,
  // is not an amount of time — it is a question. It is never counted and never
  // closed on your behalf.
  function runaway() {
    var sp = openSpan();
    if (!sp) return null;
    var m = minsBetween(sp.startedAt, nowStamp());
    return (m > LONG_DAY || stampDay(sp.startedAt) !== today()) ? sp : null;
  }

  // Minutes of one span that fall inside a range of days. An open span
  // contributes nothing: it is not an hour until it has ended.
  function minsIn(sp, fromDay, toDay) {
    if (!sp.endedAt) return 0;
    var lo = fromDay + "T00:00", hi = toDay + "T23:59";
    if (sp.endedAt < lo || sp.startedAt > hi) return 0;
    var a = sp.startedAt < lo ? lo : sp.startedAt;
    var b = sp.endedAt > hi ? hi : sp.endedAt;
    return Math.max(0, minsBetween(a, b));
  }
  function claimantOfSpan(sp) {
    var bn = byId(state.benches, sp.benchId);
    return bn ? bn.claimantId : "";
  }
  function minsFor(claimantId, fromDay, toDay) {
    return state.spans.reduce(function (t, sp) {
      return claimantOfSpan(sp) === claimantId ? t + minsIn(sp, fromDay, toDay) : t;
    }, 0);
  }
  // Days a claimant was touched at all. A claimant owed days is not owed hours,
  // and counting one in the other's unit is a plausible wrong number.
  function daysFor(claimantId, fromDay, toDay) {
    var seen = {};
    state.spans.forEach(function (sp) {
      if (claimantOfSpan(sp) !== claimantId) return;
      for (var i = 0; i < 7; i++) {
        var d = addDays(fromDay, i);
        if (d > toDay) break;
        if (minsIn(sp, d, d) > 0) seen[d] = 1;
      }
    });
    return Object.keys(seen).length;
  }
  // Time at no bench at all. It is shown and never distributed — the app does
  // not know whose it was, and guessing would put hours on an employer's name.
  function suspenseMins(fromDay, toDay) {
    return state.spans.reduce(function (t, sp) {
      return sp.benchId ? t : t + minsIn(sp, fromDay, toDay);
    }, 0);
  }

  function owedOf(c) {
    if (c.kind === "budget") return { unit: "h", owed: num(c.hours) * 60 };
    if (c.kind === "floor")  return { unit: "h", owed: num(c.hours) * 60, floor: true };
    if (c.kind === "days")   return { unit: "d", owed: num(c.hours) };
    return { unit: c.kind === "watch" ? "" : "h", owed: 0 };
  }

  function standing(fromDay) {
    var toDay = addDays(fromDay, 6);
    return live(state.claimants).filter(function (c) { return c.kind !== "watch"; })
      .map(function (c) {
        var o = owedOf(c);
        var got = o.unit === "d" ? daysFor(c.id, fromDay, toDay) : minsFor(c.id, fromDay, toDay);
        return { c: c, unit: o.unit, owed: o.owed, got: got, floor: !!o.floor,
                 short: o.owed ? Math.max(0, o.owed - got) : 0 };
      });
  }

  // How far behind a claimant has fallen, added up over whole weeks and never
  // reset. It is a co-occurrence and not a cause: the app never says one
  // claimant took the hours another lost, because it cannot know that.
  function behindBy(c) {
    var o = owedOf(c);
    if (!o.owed) return null;
    var first = state.spans.reduce(function (m, sp) {
      var d = stampDay(sp.startedAt);
      return (!m || d < m) ? d : m;
    }, "");
    if (!first) return null;
    var w = weekStart(first), thisWeek = weekStart(today()), total = 0, weeks = 0, guard = 0;
    while (w < thisWeek && guard++ < 400) {
      var to = addDays(w, 6);
      var got = o.unit === "d" ? daysFor(c.id, w, to) : minsFor(c.id, w, to);
      total += Math.max(0, o.owed - got);
      weeks++;
      w = addDays(w, 7);
    }
    return weeks ? { amount: total, unit: o.unit, weeks: weeks } : null;
  }
  function amountWords(n, unit) {
    return unit === "d" ? (n + (n === 1 ? " day" : " days")) : fmtMins(n);
  }

  /* ---------------- the switch bar ---------------- */

  function switchBarHtml() {
    var sp = openSpan(), run = runaway();
    if (run) {
      return '<div class="sb sb-warn"><span class="sb-txt"><b>Still at ' +
        esc(benchLabel(run.benchId) || "no bench") + '</b>' +
        '<small>since ' + esc(niceDate(stampDay(run.startedAt))) + " " + esc(String(run.startedAt).slice(11)) +
        " — say when you left, or this is not an amount of time</small></span>" +
        '<span class="tools"><button class="btn primary" data-act="span-close">Close it</button></span></div>';
    }
    if (sp) {
      var m = minsBetween(sp.startedAt, nowStamp());
      return '<div class="sb"><span class="sb-dot"></span><span class="sb-txt"><b>' +
        esc(benchLabel(sp.benchId) || "Not said yet") + "</b>" +
        "<small>since " + esc(String(sp.startedAt).slice(11)) + " · " + fmtMins(m) +
        (noteOf(sp.benchId) ? " · left off: " + esc(noteOf(sp.benchId).note) : "") + "</small></span>" +
        '<span class="tools"><button class="btn" data-act="span-switch">Switch</button>' +
        '<button class="btn" data-act="span-stop">Stop</button></span></div>';

    return '<div class="sb sb-idle"><span class="sb-txt"><b>Not at a bench</b>' +
      "<small>nothing is being counted</small></span>" +

  }
  function mountBar() {
    var el = document.getElementById("sbar");
    if (el) el.innerHTML = switchBarHtml();
