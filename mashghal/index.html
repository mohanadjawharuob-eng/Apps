          t.runsBoardId = byId(state.boards, v.runsBoardId) ? v.runsBoardId : "";
        });
      }
    });
  }

  /* ================= the registry =================

     What the work is made of and made with, in one list, so that "where is
     that orthophoto" and "which laptop needs backing up" are the same
     question asked of the same place. Two rules hold it:

     **A board never points into it.** A run freezes its procedure at the
     start, so a node reaching back into a shared list would be a hole in that
     freeze — renaming a file next year would rewrite a board closed last
     year. A node made from a registry entry is a COPY that carries
     `fromAssetId`, which is enough for the registry to answer "where is this
     used" without any board depending on it.

     **Provenance is stated, never guessed.** `fromIds` is what this was made
     from, because that is the one fact about a derived file that cannot be
     reconstructed afterwards: an orthophoto is 340 frames and a control file,
     and six months later the file itself says none of that. The reverse — what
     was made FROM this — is derived by walking the other way. */

  var openAsset = "";   // view state, never saved

  function assetOf(id) { return byId(state.assets, id); }
  function assetKindLabel(a) { return vocabLabel("assetKinds", a.kind) || a.kind; }
  // What this was made from, dropping ids whose record has gone so a deleted
  // source cannot make the page throw.
  function madeFrom(a) {
    return (a.fromIds || []).map(assetOf).filter(function (x) { return !!x && !x.archived; });
  }
  // And the other way round, derived rather than stored — two lists to keep in
  // step is two lists that will disagree.
  function madeInto(a) {
    return live(state.assets).filter(function (x) {
      return (x.fromIds || []).indexOf(a.id) >= 0;
    });
  }
  /* Every board node copied from this entry, with the board and project it
     sits on. This is the whole reason a copy carries `fromAssetId`: without it
     a file in the registry could not say which piece of work used it, and the
     registry would be a list rather than a record. */
  function assetUses(a) {
    var out = [];
    state.boards.forEach(function (b) {
      if (b.archived) return;
      (b.nodes || []).forEach(function (n) {
        if (n.fromAssetId !== a.id) return;
        out.push({ board: b, node: n,
                   proj: b.projectId ? projOf(b.projectId) : null });
      });
    });
    return out;
  }
  /* Everything upstream of this, however far back, so a cycle can be refused
     before it is written. Walked with a seen-set rather than trusted to
     terminate: a book that somehow already holds a cycle (a bad merge, a
     hand-edited backup) must not take the page down with it. */
  function madeFromAncestors(a) {
    var seen = {}, out = [], queue = madeFrom(a);
    while (queue.length) {
      var x = queue.shift();
      if (!x || seen[x.id]) continue;
      seen[x.id] = 1; out.push(x);
      madeFrom(x).forEach(function (y) { queue.push(y); });
    }
    return out;
  }
  /* ---------------- where on earth ----------------

     THE ONE FACT THE RECORD DID NOT HOLD, AND THE REASON THE EXTENT COULD NOT
     BE DRAWN. The brief names a survey or site extent as a data-driven visual
     beside the provenance chain, and provenance was buildable because
     `fromIds` was already stated. A footprint was not: there was no
     coordinate anywhere in the book, so anything drawn would have been
     geometry the app invented — which is the fault every rule in this file is
     written against. So the field comes first and the drawing comes off it.

     `a.geo` is `{lat, lon}` for a point and `{lat, lon, lat2, lon2}` for an
     extent, normalised to south-west and north-east corners on the way in.
     Decimal degrees and nothing else: a parser that took 34°20'20"N would be
     guessing about primes, hemispheres and which of three punctuation
     conventions somebody typed, and this app refuses a plausible wrong answer
     in favour of a visible failure. `geoParse` says what it wanted when it
     will not take something. */
  function geoParse(raw) {
    var v = String(raw == null ? "" : raw).trim();
    if (!v) return { geo: null };
    var parts = v.split(/[,;\s]+/).filter(function (x) { return x !== ""; });
    if (parts.length !== 2 && parts.length !== 4)
      return { why: "A place is two numbers (north, east) or four for a box (two corners). Decimal degrees, like 34.3390, 35.7290." };
    var n = [], i;
    for (i = 0; i < parts.length; i++) {
      if (!/^[+-]?\d+(\.\d+)?$/.test(parts[i]))
        return { why: "“" + parts[i] + "” is not a decimal number. Degrees and minutes are not read here — write 34.3390, not 34°20′20″." };
      n.push(parseFloat(parts[i]));
    }
    for (i = 0; i < n.length; i += 2) {
      if (n[i] < -90 || n[i] > 90) return { why: "A latitude runs from −90 to 90. " + n[i] + " is not one." };
      if (n[i + 1] < -180 || n[i + 1] > 180) return { why: "A longitude runs from −180 to 180. " + n[i + 1] + " is not one." };
    }
    if (n.length === 2) return { geo: { lat: n[0], lon: n[1] } };
    /* Normalised to south-west then north-east, so nothing downstream has to
       wonder which corner it was handed. Two identical corners is a POINT
       typed as a box — the same fact either way, so it is taken rather than
       refused. */
    var s = Math.min(n[0], n[2]), w = Math.min(n[1], n[3]),
        nn = Math.max(n[0], n[2]), e = Math.max(n[1], n[3]);
    if (s === nn && w === e) return { geo: { lat: s, lon: w } };
    return { geo: { lat: s, lon: w, lat2: nn, lon2: e } };
  }
  function geoOf(a) {
    var g = a && a.geo;
    if (!g || typeof g.lat !== "number" || typeof g.lon !== "number") return null;
    return g;
  }
  function geoIsBox(g) { return !!g && typeof g.lat2 === "number" && typeof g.lon2 === "number"; }
  // What was typed, given back exactly as it is stored — this is the string
  // the copy button hands over, so it has to be the one a map will take.
  function geoPlain(a) {
    var g = geoOf(a); if (!g) return "";
    /* `String`, not `toFixed`: this is the string the copy button hands to a
       map and the string the dialog reopens with, so rounding it here would
       hand out a coordinate nobody recorded — and pressing Save would write
       the rounded one over the real one. */
    return geoIsBox(g) ? [g.lat, g.lon, g.lat2, g.lon2].join(", ")
                       : g.lat + ", " + g.lon;
  }
  // And the reading, with the hemispheres written out rather than left as a
  // sign for the reader to decode.
  function geoWords(a) {
    var g = geoOf(a); if (!g) return "";
    /* The hemispheres written out rather than left as a sign for the reader
       to decode — and the figure itself unrounded, for the same reason
       `geoPlain` is: four decimal places is eleven metres, which is coarser
       than the figure somebody typed. */
    function one(la, lo) {
      return Math.abs(la) + "° " + (la < 0 ? "S" : "N") + ", " +
             Math.abs(lo) + "° " + (lo < 0 ? "W" : "E");
    }
    return geoIsBox(g) ? one(g.lat, g.lon) + " to " + one(g.lat2, g.lon2) : one(g.lat, g.lon);
  }
  /* HOW BIG, AND THE FIGURE SAYS IT IS APPROXIMATE. A degree of latitude is
     about 111,320 m and a degree of longitude that times the cosine of the
     latitude — a spherical figure, right to well inside a percent at the
     scale of a trench and wrong in the last digit by construction. Printed
     bare it would be a plausible wrong number, so it is printed as "about",
     and it is the only figure here that is derived rather than stated. */
  var DEG_M = 111320;
  function geoSpan(a) {
    var g = geoOf(a);
    if (!geoIsBox(g)) return null;
    var mid = (g.lat + g.lat2) / 2;
    return { ns: (g.lat2 - g.lat) * DEG_M,
             ew: (g.lon2 - g.lon) * DEG_M * Math.cos(mid * Math.PI / 180) };
  }
  function metreWords(m) {
    var x = Math.abs(m);
    if (x < 1000) return Math.round(x) + " m";
    return (Math.round(x / 100) / 10) + " km";
  }
  function geoSpanWords(a) {
    var s = geoSpan(a);
    return s ? "about " + metreWords(s.ew) + " east–west by " + metreWords(s.ns) + " north–south" : "";
  }

  /* ---------------- containment, and topics ----------------

     THE ARCHAEOLOGICAL DATA MODEL, ANSWERED WITH ONE FIELD RATHER THAN FOUR
     NOUNS. The spec asks for Site, Artifact, Feature and Survey. Hardcoding
     those four would break this app's first rule — nothing is hardcoded, the
     vocabulary is a floor and not a ceiling — and it would make the app
     absurd for the thesis, the visa and the lecture, which are half of what
     is actually in it. `assetKinds` already lets the reader add every one of
     those words and have the registry, the finder, provenance, upkeep and the
     boards all work on them.

     What was genuinely missing is the relation those four nouns are FOR:
     containment. An artifact is found in a feature, a feature is in a site, a
     photograph is of a trench. `fromIds` is provenance — what this was made
     FROM — and that is a different relation: an orthophoto is *made from*
     three hundred frames, and a sherd is *found at* a site. Conflating them
     would put the site in the list of things the sherd was manufactured out
     of. So `atId` is one generic field, "part of / found at", and Site →
     Feature → Artifact falls out of it for anybody, with archaeology named
     nowhere in the code.

     Same discipline as provenance: the forward link is stated, the reverse is
     derived so the two cannot disagree, and a cycle is refused. */
  function partOf(a) {
    var x = a && a.atId ? assetOf(a.atId) : null;
    return x && !x.archived ? x : null;
  }
  function partsIn(a) {
    return live(state.assets).filter(function (x) { return x.atId === a.id; });
  }
  /* The whole chain upward, with a seen-set — a book that somehow already
     holds a loop (a bad merge, a hand-edited backup) must not take the page
     down with it, which is the same reason `madeFromAncestors` has one. */
  function partAncestors(a) {
    var seen = {}, out = [], x = partOf(a);
    while (x && !seen[x.id]) { seen[x.id] = 1; out.push(x); x = partOf(x); }
    return out;
  }
  function partTrail(a) {
    return partAncestors(a).reverse().map(function (x) { return x.name; });
  }

  /* TOPICS ARE THE KNOWLEDGE LIBRARY, and they are not a new store either.
     The spec asks for a library of what you have learned — methods,
     references, reading that outlives one project. The registry already holds
     exactly those objects: a document, a dataset, a PDF, with a link, a path,
     notes, provenance and `assetUses()` answering where it was used. What it
     could not do is answer "everything I have on harbour surveying", because
     nothing said what a thing was ABOUT.

     So a topic is a word from the extensible vocabulary, an entry carries any
     number of them, and the Library is the registry read by topic instead of
     by kind. One store, two questions — the same relationship the Repo has to
     the workbench, and the reason there is no second list to keep in step. */
  function assetTopics(a) {
    return (a.topics || []).filter(function (t) { return !!t; });
  }
  /* Split, trimmed, blanks dropped and de-duplicated case-insensitively —
     "Harbour, harbour" is one topic typed twice, and two rows in the Library
     for one word would be the "one name, one entry" fault in the one screen
     built to pool things. Extracted from inside the registry dialog the day a
     second dialog started writing topics: two copies of a rule is the same
     bug as no rule. */
  function topicList(raw) {
    var seen = {}, out = [];
    String(raw || "").split(",").forEach(function (x) {
      var w = x.trim(); if (!w) return;
      var k = w.toLowerCase();
      if (!seen[k]) { seen[k] = 1; out.push(w); }
    });
    return out;
  }

  /* THE BRIEF'S PER-TYPE FIELDS ARE ONE STATED LIST, NOT SIXTEEN BOXES.
     Round 3 names them by kind: a file's extension, size, modified date and
     checksum; an app's category, platform and version; a device's
     specifications, serial, accessories, manuals and drivers; a site's
     alternative names, location, period and type. Hardcoding those four sets
     is wrong three times over. `assetKinds` is a FLOOR AND NOT A CEILING —
     the archaeology nouns are already write-ins, so a fixed set of fields per
     kind would be wrong the first time somebody writes in a fifth. The
     registry's dialog is already thirteen boxes behind a fold, because a
     dialog of twelve is a dialog people close, and this would be twenty-nine.
     And two of them are figures this app CANNOT KNOW: a browser is not
     allowed to read `C:\…` at all, so a size and a checksum would be numbers
     typed by hand and wrong the next time the file is saved — a plausible
     wrong number, which is the one thing every rule in this file refuses.

     So a fact is `{id, k, v}`: a label and a value, both typed, printed as
     rows in the facts table the page already has. The brief's own words are
     offered as a HINT per section rather than as fields, which is the same
     fold as four archaeology nouns being one write-in, and the same reason:
     a suggestion can be ignored and a field cannot. */
  var FACT_HINTS = {
    device: "Serial, Specifications, Accessories, Warranty \u2014 or anything else you would want to find it by.",
    app:    "Version, Platform, Licence, Category \u2014 or anything else worth writing down.",
    site:   "Login, Account, What it is for \u2014 never a password: this book is not a place for one.",
    file:   "Extension, Made with, Period, Alternative names \u2014 whatever the file itself does not say.",
    lib:    "Written for, Depends on, Where it came from \u2014 whatever you would need to reuse it."
  };
  function factHint(a) {
    return FACT_HINTS[repoOf(a)] ||
      "A label and a value \u2014 whatever this thing's own kind does not have a row for.";
  }
  /* Stated, and only where both halves are there: a label with no value is a
     row that says nothing, and a value with no label is a row nobody can
     read. Same test as `assetTopics`. */
  function assetFacts(a) {
    return (a.facts || []).filter(function (f) { return f && f.k && f.v; });
  }
  /* ONE DIALOG, AND EMPTYING THE VALUE IS HOW A ROW COMES OFF. There is no
     second delete button on a two-field record — Coffer's allowance days
     already answer a wrong figure with "nought clears the month", and the
     dialog says so in as many words. The undo is on the toast, like every
     other removal in this app. */
  function factDialog(a, f) {
    openModal({
      title: f ? "Edit \u201c" + clip(f.k, 24) + "\u201d" : "Note something else",
      message: f
        ? "Empty the value to take the row off the table."
        : "It goes on this thing\u2019s own facts, and the finder reads it \u2014 so a serial number is findable by typing the serial number.",
      fields: [
        { key: "k", label: "What is it called", type: "text", span: true,
          value: f ? f.k : "", hint: factHint(a) },
        { key: "v", label: "And what is it", type: "text", span: true,
          value: f ? f.v : "" }
      ],
      validate: function (v) {
        if (!String(v.k || "").trim())
          return "Give it a label \u2014 a value with nothing naming it is a row nobody can read.";
        if (!f && !String(v.v || "").trim())
          return "Give it a value. An empty row says nothing, which is why emptying one is how it comes off.";
        return "";
      },
      confirmLabel: f ? "Save" : "Note it",
      onConfirm: function (v) {
        var was = (a.facts || []).map(function (x) { return { id: x.id, k: x.k, v: x.v }; });
        var k = String(v.k || "").trim(), val = String(v.v || "").trim();
        /* A label typed twice with the same value is a double tap, not two
           facts. Two accessories both labelled "Accessory" are two facts, so
           only the exact pair refuses. */
        if (!f && was.some(function (x) {
          return String(x.k).toLowerCase() === k.toLowerCase() &&
                 String(x.v).toLowerCase() === val.toLowerCase();
        })) { toast("That is already on it."); return; }
        go(function () {
          var list = was.map(function (x) { return { id: x.id, k: x.k, v: x.v }; });
          if (!f) list.push({ id: uid(), k: k, v: val });
          else if (!val) list = list.filter(function (x) { return x.id !== f.id; });
          else list.forEach(function (x) { if (x.id === f.id) { x.k = k; x.v = val; } });
          a.facts = list;
        });
        toast(f && !val ? "Row taken off" : f ? "Saved" : "Noted",
              function () { go(function () { a.facts = was; }); });
      }
    });
  }

  /* A SNIPPET IS A REGISTRY ENTRY WITH A BODY, and that is the whole of it —
     no fifth noun. Asked for a Library holding "formulas for excels" and
     "scripts I might use to extract certain photos in Python", the shape that
     does not unravel the model is the one already here: the registry holds
     what the work is made of and made with, and the ONE thing a path cannot
     carry is the content itself. So `a.body` is the text and `a.lang` is what
     it is written in. A separate `state.snippets` would have been a second
     list to keep in step, and it would have started the day it shipped by
     losing the topics, the provenance, `assetUses()` and the finder.

     The test is the record, not the kind: an entry carrying a body IS a
     snippet however its kind reads, which is what stops a body becoming
     unreachable the moment somebody changes the kind in the other dialog. */
  /* THE TEST IS THE BODY, NOT THE KIND, so an entry carrying one stays a
     written entry however its kind reads — otherwise changing the kind in the
     registry dialog would make the body unreachable while it sat in the
     record. It was called `isSnippet`, which stopped being true the day a
     method could be written out: a method is not a snippet, and the question
     the code was always asking is whether there is a body. */
  function hasBody(a) {
    return !!a && (a.kind === "snippet" || a.kind === "method" || !!a.body);
  }
  /* And the language decides the READING. A body with a language is code, set
     in mono and never wrapped; a body without one is prose and wraps like
     prose. Setting a method in a monospace box that refuses to wrap would
     make the one entry type meant to be READ the hardest one to read. */
  function isCode(a) { return hasBody(a) && !!(a && a.lang); }
  function snipLangLabel(a) {
    return a && a.lang ? (vocabLabel("langs", a.lang) || a.lang) : "";
  }
  function snipLines(a) { return String((a && a.body) || "").split("\n"); }
  /* WHAT YOU REUSE IS THE LIBRARY'S OWN HALF, and it is decided the way every
     section is: stated, not derived. `repoOf(a) === "lib"` means somebody
     filed it there, which is what the five words of "What are you saving?"
     all do.

     It was `hasBody`, and that was wrong twice over the moment a Reference
     could be saved. A reference has NO body — it points at a paper — so it
     vanished out of the very section it had just been saved into, and the
     only place it showed up was one subject row further down the page. The
     other half of the same fault was a figure disagreeing with its own
     parts: "All 5" stood above five rows while the language chips summed to
     four, because a method has no language and so belonged to no chip. */
  function libOwn() {
    return live(state.assets).filter(function (a) { return repoOf(a) === "lib"; })
      .sort(function (x, y) { return String(x.name).localeCompare(String(y.name)); });
  }
  /* EXACTLY ONE CHIP PER ENTRY, so the chips partition the list and All is
     their sum. Three kinds of facet, because there are three kinds of entry:
     code is filed under its language, prose under "written out", and an
     entry with no body at all under "referenced". */
  var LIB_WROTE = "__wrote", LIB_REF = "__ref";
  function libFacet(a) {
    if (isCode(a)) return a.lang;
    if (hasBody(a)) return LIB_WROTE;
    return LIB_REF;
  }
  function libFacetLabel(k) {
    if (k === LIB_WROTE) return "Written out";
    if (k === LIB_REF) return "Referenced";
    return vocabLabel("langs", k) || k;
  }
  /* What the Library actually holds, in ONE unit: entries. A snippet is in it
     whether or not a subject has been written on it — a formula with no
     subject is still something you reuse and has nowhere else to be — and
     everything else joins the moment it is given one. The strip's count reads
     this rather than the number of subjects, because a count of subjects over
     a page listing entries is two units in one figure. */
  function libEntries() {
    return live(state.assets).filter(function (a) {
      return hasBody(a) || assetTopics(a).length;
    });
  }

  function allTopics() {
    var seen = {}, out = [];
    live(state.assets).forEach(function (a) {
      assetTopics(a).forEach(function (t) {
        var k = String(t).toLowerCase();
        if (!seen[k]) { seen[k] = 1; out.push(t); }
      });
    });
    return out.sort(function (x, y) { return String(x).localeCompare(String(y)); });
  }
  function assetsOnTopic(t) {
    var k = String(t).toLowerCase();
    return live(state.assets).filter(function (a) {
      return assetTopics(a).some(function (x) { return String(x).toLowerCase() === k; });
    }).sort(function (x, y) { return String(x.name).localeCompare(String(y.name)); });
  }

  /* ---------------- where a thing IS, and when it was last used ----------

     The mockup's Equipment panel shows **Available · In field · Maintenance**
     with a last-used date, and its Assets panel shows a status
     ("Processing complete") beside what you can do next. Both are the same
     question — *can I pick this up right now* — and both are STATED, because
     no derivation can answer it: a total station in the van and a total
     station on the bench look identical to the record, and only the person
     who put it there knows which. `parked` on a project is the same argument.

     `lastUsedOn` is stated too, deliberately, even though it looks derivable.
     A board copy carries `fromAssetId`, so "used on three boards" is derived
     and IS — but *when* is not: a board that named the sonar in March says
     nothing about whether you took it out last week. Guessing a date from a
     board's `updatedAt` would put a plausible wrong date on screen, which is
     the one thing this app refuses. Blank means nobody said, and the row says
     "not said" rather than inventing a day. */
  var THING_STATES = {
    "": { word: "", tone: "" },
    ready: { word: "available", tone: "p-sage" },
    out: { word: "in the field", tone: "p-dim" },
    fixing: { word: "maintenance", tone: "p-oxide" },
    busy: { word: "processing", tone: "p-dim" },
    done: { word: "complete", tone: "p-sage" },
    lost: { word: "missing", tone: "p-oxide" }
  };
  function thingState(a) {
    var k = a.state || "";
    return THING_STATES[k] || { word: k, tone: "p-grey" };
  }
  function lastUsedWords(a) {
    if (!a.lastUsedOn || !dayOk(a.lastUsedOn)) return "";
    return "last used " + niceDate(a.lastUsedOn);
  }

  /* WHAT YOU CAN DO NEXT WITH IT, and every one of them is something the app
     can actually do. The mockup lists "Open in CloudCompare · Import to QGIS
     · Create measurement · Archive", which are an application's menu rather
     than this app's — and offering a button that cannot work is the fault
     `openHandle` exists to avoid. So the list is built from what this entry
     really has: a way to open it, a place to look at what it was made from,
     a subject to follow, upkeep to attach. Nothing here is decoration. */
  function nextActions(a) {
    var out = [], h = openHandle(a);
    if (h) out.push({ label: h.label, how: h.how, kind: h.kind, href: h.href, act: "asset-copy", id: a.id });
    /* A SMALL COUNT IN PROSE IS A WORD, and the verb follows the count.
       These read "1 thing(s) were made from this" until they were read. */
    var mi = madeInto(a).length, pi = partsIn(a).length;
    if (mi) out.push({ label: "What came out of it", act: "asset-open", id: madeInto(a)[0].id,
                       how: numWord(mi) + (mi === 1 ? " thing was" : " things were") + " made from this" });
    if (pi) out.push({ label: "What is inside it", act: "asset-open", id: partsIn(a)[0].id,
                       how: numWord(pi) + (pi === 1 ? " thing is" : " things are") + " filed in this" });
    if (assetTopics(a).length) out.push({ label: "Everything on " + assetTopics(a)[0], act: "lib-topic",
                                          id: assetTopics(a)[0], how: "read the Library on this subject" });
    /* PUT IT ON A BOARD — the relationship the brief puts at the centre of
       the whole model: "a library method can explain a workflow step and be
       reusable in another project". Borrowing has always worked the other way
       round, from the sheet, which means it only occurred to you while you
       were already on the board. From the entry you are reading, one tap. It
       is offered for every kind, not only a written one, because the borrow
       pool has always held the whole registry. */
    if (boards().length) out.push({ label: "Put it on a board", act: "asset-to-board", id: a.id,
                                    how: "a copy joins a procedure or a run, and this entry still answers where it is used" });
    if (!assetUpkeep(a).length) out.push({ label: "Add upkeep", act: "cadence-add", id: a.id,
                                           how: "something to do to it every so often" });
    return out;
  }

  function assetUpkeep(a) {
    return live(state.cadences).filter(function (cd) { return cd.protectsAssetId === a.id; });
  }
  /* `brief` drops the note, for the one caller that prints the note in full
     twenty pixels below: the entry's own page had the whole of it twice, in
     the sub-line under the title and again in its own panel — "say it once",
     and on a snippet whose note is three lines that was most of the screen.
     Every other caller is a ROW, where this is the only place the note gets
     said at all. */
  function assetSays(a, brief) {
    var bits = [assetKindLabel(a)];
    if (a.where) bits.push(a.where);
    var n = assetUses(a).length;
    if (n) bits.push("used on " + n + (n === 1 ? " board" : " boards"));
    var from = madeFrom(a).length;
    // "made from 2" is a count with nothing attached; a row has to read as a
    // sentence, the same rule the warnings live by.
    if (from) bits.push("made from " + from + (from === 1 ? " thing" : " things"));
    if (a.notes && !brief) bits.push(a.notes);
    return bits.join(" · ");
  }

  /* `into` is the Repo section the reader was standing in when they pressed
     New, so it is what the picker opens on. Editing an existing entry opens
     on whatever `repoOf` says today, which is its stated section or the one
     its kind falls back to — so saving an entry written before this field
     existed writes down what the app was already showing, rather than
     quietly moving it. */
  /* `kindPre` is the third argument and only "What are you saving?" passes
     it: a Reference is this dialog with its kind and its section already
     answered, so the reader is not asked twice for something they have just
     said. */
  function assetDialog(a, into, kindPre) {
    var mk = !a;
    openModal({
      title: mk ? "New thing" : "Edit " + a.name,
      confirmLabel: mk ? "Add" : "Save",
      wide: true,
      message: mk ? "Anything the work is made of or made with: a file, a photograph, a dataset, a piece of software, a laptop. Upkeep can be attached to one afterwards."
                  : "",
      fields: [
        { key: "name", label: "Name", type: "text", value: a ? a.name : "", span: true,
          placeholder: "Orthophoto, area 1" },
        { key: "kind", label: "What is it", type: "select",
          value: a ? a.kind : (kindPre || (into === "device" ? "gear" : into === "app" ? "software"
                               : into === "site" ? "site" : "file")),
          options: vocabOpts("assetKinds") },
        otherField("assetKinds", "kindOther"),
        { key: "repo", label: "Which list it shows in", type: "select",
          value: a ? repoOf(a) : (into || "file"),
          options: REPO_PAGES.map(function (p) { return { value: p.id, label: p.label }; }),
          hint: "Devices are what you own, Apps what you open, Sites what you log into, Files what the work is made of." },
        { key: "path", label: "Where it is", type: "text", span: true,
          value: a ? (a.path || "") : "",
          hint: "A path you would paste into Win+R, or a room for a piece of kit. Left blank it is just named." },
        { key: "url", label: "A link to it", type: "text", span: true,
          value: a ? (a.url || "") : "",
          hint: "A Google Drive share link, so the full-size copy opens on any device." },
        /* Everything from here down is behind the fold. Four questions are
           what anybody types when they add something — what it is called,
           what it is, which list, and how to reach it. The other seven were
           on screen every time, which made "New thing" a form of twelve
           labelled boxes and, on a phone, a scroll before the Add button. */
        { key: "where", label: "Kept where", type: "text", value: a ? (a.where || "") : "",
          placeholder: "field bag", more: true },
        /* Stated, because no derivation can tell a total station in the van
           from one on the bench. Blank is the honest default — "nobody has
           said" is a real answer and better than a guessed one. */
        { key: "state", label: "How it stands", type: "select", more: true,
          value: a ? (a.state || "") : "",
          options: [{ value: "", label: "Nothing said" }].concat(
            Object.keys(THING_STATES).filter(function (k) { return !!k; })
              .map(function (k) { return { value: k, label: cap(THING_STATES[k].word) }; })) },
        { key: "lastUsedOn", label: "Last used", type: "text", more: true,
          value: a ? (a.lastUsedOn || "") : "", placeholder: "YYYY-MM-DD",
          hint: "Stated, not worked out: a board that named this in March says nothing about last week." },
        { key: "onDate", label: "Made or acquired on", type: "text", more: true,
          value: a ? (a.onDate || "") : "", placeholder: "YYYY-MM-DD" },
        /* Containment, offered as a plain picker over everything else in the
           registry. An entry cannot be inside itself, and the options drop
           anything that is already below it — picking one would make a loop
           and both pages would recurse. */
        { key: "atId", label: "Part of / found at", type: "select", span: true, more: true,
          value: a ? (a.atId || "") : "",
          options: [{ value: "", label: "Nothing \u2014 it stands on its own" }].concat(
            opts(live(state.assets).filter(function (x) {
              if (!a) return true;
              if (x.id === a.id) return false;
              // anything already under `a` would close a loop
              var up = x, seen = {};
              while (up && !seen[up.id]) { seen[up.id] = 1; if (up.id === a.id) return false; up = partOf(up); }
              return true;
            }), function (x) { return x.name; })),
          hint: "A trench is part of a site, a photograph is of a trench. This is where it IS, not what it was made from." },
        /* BEHIND THE FOLD, because it is not one of the four things anybody
           types when adding something — but it is validated on the way in
           like every date in the app, and refused with a reason rather than
           stored as a string shaped like a coordinate. */
        { key: "geo", label: "Where on earth", type: "text", span: true, more: true,
          value: a ? geoPlain(a) : "", placeholder: "34.3390, 35.7290",
          hint: "Decimal degrees: north, east. Four numbers \u2014 two corners \u2014 make an extent instead of a point. Degrees and minutes are not read." },
        { key: "topics", label: "What it is about", type: "text", span: true, more: true,
          value: a ? assetTopics(a).join(", ") : "",
          placeholder: "harbour surveying, photogrammetry",
          hint: "Comma-separated. The Library lists everything on a topic, whatever kind it is." },
        { key: "notes", label: "Notes", type: "textarea", span: true, rows: 2, more: true,
          value: a ? (a.notes || "") : "" }
      ],
      validate: function (v) {
        if (!v.name.trim()) return "Give it a name.";
        // The same round-trip every other date in the app goes through: a
        // string shaped like a date is not a date.
        if (v.onDate.trim() && !dayOk(v.onDate.trim()))
          return "A date has to be a real day, written YYYY-MM-DD.";
        if (v.lastUsedOn.trim() && !dayOk(v.lastUsedOn.trim()))
          return "\u201cLast used\u201d has to be a real day, written YYYY-MM-DD, or blank.";
        if (v.lastUsedOn.trim() > today())
          return "It cannot have been used in the future.";
        var gp = geoParse(v.geo);
        if (gp.why) return gp.why;
        return null;
      },
      onConfirm: function (v) {
        go(function () {
          var t = a;
          if (!t) { t = { id: uid(), fromIds: [], archived: false }; state.assets.push(t); }
          t.name = v.name.trim();
          t.kind = vocabTake("assetKinds", v.kind, v.kindOther, t.kind || "other");
          t.repo = v.repo;
          t.atId = assetOf(v.atId) && v.atId !== t.id ? v.atId : "";
          t.topics = topicList(v.topics);
          t.path = v.path.trim(); t.url = v.url.trim();
          t.where = v.where.trim(); t.onDate = v.onDate.trim();
          t.state = v.state; t.lastUsedOn = v.lastUsedOn.trim();
          // Already validated above, so this cannot store a half-parsed one.
          t.geo = geoParse(v.geo).geo;
          t.notes = v.notes.trim();
          if (mk) openAsset = t.id;
        });
        toast(mk ? "Added" : "Saved");
      }
    });
  }

  /* One place decides how a kind is drawn, because the row, the finder and the
     detail page all have to agree — three copies of this mapping is three
     chances for a photograph to be a green document in one of them. A kind the
     reader invented falls through to the kit glyph rather than to nothing. */
  function assetLook(a) {
    var k = a.kind;
    if (k === "snippet") return { tile: "t-know", ico: ICONS.code };
    if (k === "photo") return { tile: "t-photo", ico: ICONS.photo };
    if (k === "software") return { tile: "t-soft", ico: ICONS.device };
    if (k === "file" || k === "doc" || k === "dataset") return { tile: "t-doc", ico: ICONS.doc };
    if (k === "laptop" || k === "phone" || k === "audio" || k === "gear")
      return { tile: "t-equip", ico: k === "phone" ? ICONS.device : ICONS.kit };
    return { tile: "t-kit", ico: ICONS.kit };
  }

  /* THE ROW IS THE OPEN CONTROL. This tab is a launcher — its owner asked for
     "all apps and all webs and all files that i use" — and the old route was
     row, then page, then "Open the link": two taps to do the one thing. So in
     the Repo the row opens the thing and a separate small button opens its
     page. Everywhere else (the workbench, the finder) the row still
     navigates, because there the question is "tell me about this", not "open
     it".

     An entry with nothing to open is not a dead link: the row navigates
     instead, and the sub-line says it is only named. A control that does
     nothing is worse than no control. */
  function repoRow(a) {
    var look = assetLook(a), h = openHandle(a);
    var n = assetUses(a).length;
    var says = [assetKindLabel(a)], stt = thingState(a);
    if (h) says.push(h.brief || h.how);
    /* "nothing to open yet" reads as a gap to fill, and for a device it is
       not one — a pair of headphones has nothing to open, ever. So it is said
       only where a handle is the point (an app, a site, a file) and the
       entry has none; on a device the row says where the thing is instead,
       which is the question you actually ask of one. */
    else if (repoOf(a) !== "device") says.push("nothing to open yet");
    if (a.where) says.push(a.where);
    if (n) says.push("on " + n + (n === 1 ? " board" : " boards"));

    /* The state is a PILL CARRYING A WORD, which is the app's one channel for
       "how is this going" — never a coloured row, and never a colour on its
       own, so it survives a reader who cannot separate the hues. */
    /* THE STATE AND THE DATE SIT ON THE RIGHT, as the mockup draws an
       equipment row: how it stands over when it was last used, at the far end
       of the row, so a column of them reads down rather than having to be
       hunted for inside a run of prose. The state is still a PILL CARRYING A
       WORD — this app's one channel for "how is this going" — and a
       thing nobody has said anything about carries nothing at all rather than
       a guess dressed as a fact. */
    var rmeta = (stt.word || lastUsedWords(a))
      ? '<div class="rmeta">' +
        (stt.word ? '<span class="st ' + stt.tone + '"><i></i>' + esc(stt.word) + "</span>" : "") +
        (lastUsedWords(a) ? '<span class="rwhen">' + esc(lastUsedWords(a)) + "</span>" : "") +
        "</div>"
      : "";
    var face = '<span class="itile ' + look.tile + '">' + look.ico + "</span>" +
      '<div class="grow"><div class="nm sm">' + esc(a.name) + "</div>" +
      '<div class="says">' + esc(says.join(" \u00b7 ")) + "</div></div>" + rmeta;

    /* `repo-open` so a phone can drop it: under 560px the acts move onto
       their own line, and the row is already the open control — so a second
       button saying the same thing costs a line per row for nothing. It
       stays on a laptop, where the row is wide and a labelled button is
       what a pointer reaches for. */
    var open = !h ? ""
      : h.kind === "copy"
        ? '<button class="btn quiet repo-open" data-act="asset-copy" data-id="' + a.id +
          '" title="' + esc(h.how) + '">' + esc(h.label) + "</button>"
        : '<a class="btn quiet repo-open" href="' + esc(h.href) + '"' +
          (h.kind === "url" ? ' target="_blank" rel="noopener"' : "") +
          ' title="' + esc(h.how) + '">' + esc(h.label) + "</a>";

    /* Two controls, and the BIG one is the open. A whole row that is an <a>
       cannot hold a button inside it (a link may not contain one), so the row
       is a flex panel holding the open control across the face and a small
       "About" beside it — both real, both reachable by keyboard. */
    return '<div class="panel calm repo-row">' +
      (h
        ? (h.kind === "copy"
            ? '<button type="button" class="repo-hit" data-act="asset-copy" data-id="' + a.id + '">' + face + "</button>"
            : '<a class="repo-hit" href="' + esc(h.href) + '"' +
              (h.kind === "url" ? ' target="_blank" rel="noopener"' : "") + ">" + face + "</a>")
        : '<button type="button" class="repo-hit" data-act="asset-open" data-id="' + a.id + '">' + face + "</button>") +
      (h
        ? '<div class="repo-acts">' + open +
          '<button class="btn quiet" data-act="asset-open" data-id="' + a.id +
          '" title="What it is, where it is used, what it was made from">About</button></div>'
        /* Nothing to open means the row's own hit IS "About" — the same
           action twice with one of them labelled, which looks like a choice
           and is not. A chevron says the row opens a page, the way every
           other row in the app does. */
        : '<span class="rchev" aria-hidden="true">\u203a</span>') + "</div>";
  }

  /* The Library: subjects, then what is filed under the open one. A row here
     NAVIGATES rather than opening the thing — the question on this page is
     "what do I know about this", not "open it", which is the same reason the
     workbench row navigates and the Repo row does not. */
  /* The mockup's Library has chips across the top — All · Methods · Papers ·
     Manuals · Tutorials · Notes. Those are KINDS, and this app already has a
     reader-extensible list of them, so the chips are built from the kinds
     actually present rather than from five hardcoded words: a reader who
     files manuals as "Document" sees Document, and one who typed "Manual"
     into "Other — write it in" sees Manual. Five fixed words would be the
     "nothing is hardcoded" rule broken in the one screen most likely to grow
     a vocabulary. */
  var libKind = "";   // view state, like libTopic
  var libLang = "";   // which language's snippets are showing; view state too

  /* THE BODY IS THE ENTRY, SO IT IS SHOWN AND NEVER SUMMARISED. A fold would
     hide the one thing the reader came for, and wrapping a Python script at
     forty characters changes what it says — so the block scrolls in both
     directions inside a capped height, and the line count is printed above
     it. Nothing is hidden silently: the figure says how much is there.

     Copy is the one thing anybody does with a snippet, so it is on the head
     row rather than three taps down a menu. */
  function snipBlock(a) {
    if (!a.body) {
      return '<p class="empty">Nothing written in yet — "Edit" above is where it goes.</p>';
    }
    var n = snipLines(a).length;
    var head = '<div class="sniphead">' +
      '<span class="lpill">' + esc(snipLangLabel(a) || "written out") + "</span>" +
      '<span class="snipn">' + n + (n === 1 ? " line" : " lines") + "</span>" +
      '<button class="btn quiet" data-act="snip-copy" data-id="' + a.id + '">Copy it</button></div>';
    /* CODE IS SET IN MONO AND DOES NOT WRAP; PROSE WRAPS. A method is the one
       entry type written to be read straight through, and putting it in the
       code box — mono, `white-space: pre`, scrolling sideways at the first
       long sentence — would make it the hardest thing in the app to read.
       Same block, same head row, same Copy; one rule different, and the pill
       says which reading you are being given. */
    return head + (isCode(a)
      ? '<pre class="snip"><code>' + esc(a.body) + "</code></pre>"
      : '<div class="wrote">' + esc(a.body) + "</div>");
  }

  /* The row names it by what it DOES and shows the first line that is not
     blank, because a name and a language alone do not tell two ArcPy scripts
     apart. The row opens the entry and a small button beside it copies — the
     Repo's two-control shape, for the same reason: the row is the big target
     and the thing you usually want is one tap, not two. */
  /* ONE ROW, THREE SHAPES. Code shows its first line in mono and offers
     Copy; prose shows its first line as prose and offers Copy; a reference
     has neither, so it shows what it POINTS at and offers whatever
     `openHandle` really can do — the one place in the app that decides
     what "open" means, so a reference can never grow a button that does
     nothing. The pill is the FACET, so the row and the chip above it can
     never disagree about which group the row is in. */
  function snipRow(a) {
    var code = isCode(a), body = hasBody(a);
    var first = snipLines(a).filter(function (l) { return l.trim(); })[0] || "";
    var look = assetLook(a), hd = openHandle(a);
    var sub = body
      ? (first ? esc(first) : "nothing written in yet")
      : (hd ? esc(hd.brief || hd.how) : esc(a.notes || "named, with nothing to open"));
    return '<div class="panel calm repo-row">' +
      '<button type="button" class="repo-hit" data-act="asset-open" data-id="' + a.id +
        '" title="' + esc(a.name) + '">' +
        '<span class="itile ' + (body ? "t-know" : look.tile) + '">' +
        (code ? ICONS.code : body ? ICONS.book : look.ico) + "</span>" +
        '<div class="grow"><div class="nm sm">' + esc(a.name) + "</div>" +
        '<div class="' + (code ? "snipone" : "says") + '">' + sub + "</div></div>" +
        '<div class="rmeta"><span class="lpill">' +
        esc(libFacetLabel(libFacet(a))) + "</span></div>" +
      "</button>" +
      (a.body
        ? '<div class="repo-acts"><button class="btn quiet" data-act="snip-copy" data-id="' + a.id +
          '" title="Copy the whole thing to the clipboard">Copy</button></div>'
        : hd && hd.kind !== "copy"
          ? '<div class="repo-acts"><a class="btn quiet" href="' + esc(hd.href) + '"' +
            (hd.kind === "url" ? ' target="_blank" rel="noopener"' : "") +
            ' title="' + esc(hd.how) + '">' + esc(hd.label) + "</a></div>"
          : '<span class="rchev" aria-hidden="true">›</span>') + "</div>";
  }

  /* A WRITTEN ENTRY GETS ITS OWN DIALOG, because the registry's is thirteen
     boxes with a two-line note at the bottom and here the body IS the entry:
     a twelve-row textarea belongs at the top of a form with five boxes, not
     behind a fold in a form with thirteen. Both write the same record and the
     edit route is chosen by the RECORD (`hasBody`), so an entry carrying a
     body always opens in the dialog built for it and the two can never offer
     one field in two shapes.

     ONE DIALOG, TWO MODES, because the difference between a script and a
     method is one field and one reading, not two forms. `mode` is "code",
     "formula" or "prose"; on an EDIT it is left out and comes from the record
     (`isCode`), so an entry always reopens in the shape it was written in and
     the language box is absent rather than present-and-blank where it could
     never apply. The picker cannot be hidden reactively here — `showWhen`
     matches another field's value and this is settled before the dialog
     opens — which is exactly why the mode is chosen first, by
     `libAddDialog`. */
  function bodyDialog(a, mode) {
    var mk = !a;
    var code = mode ? (mode === "code" || mode === "formula") : isCode(a);
    var lang0 = a && a.lang ? a.lang : (mode === "formula" ? "excel" : "python");
    openModal({
      title: mk ? (code ? "Save a script or formula" : "Write out a method")
                : "Edit " + a.name,
      confirmLabel: mk ? "Save it" : "Save",
      wide: true,
      message: mk
        ? (code
            ? "A formula, a script, a command line — anything you worked out once and will want again. It is filed in the Library beside everything else on the same subject."
            : "How something is done, in your own words: how to georeference a 1916 aerial, the order a bathymetric survey goes in, a report skeleton. Written out here rather than pointed at, because the one thing a path cannot carry is the content itself.")
        : "",
      fields: [
        { key: "name", label: "What it does", type: "text", span: true,
          value: a ? a.name : "",
          placeholder: code ? "Rename a folder of photos by the date they were taken"
                            : "Georeference a 1916 aerial against the modern sheet",
          hint: "Name it by what it DOES, not what it is — in six months that is the only half you will remember." }
      ].concat(code ? [
        { key: "lang", label: "Written in", type: "select",
          value: lang0, options: vocabOpts("langs") },
        otherField("langs", "langOther")
      ] : []).concat([
        { key: "body", label: code ? "The snippet itself" : "Written out",
          type: "textarea", rows: 12, span: true,
          value: a ? (a.body || "") : "",
          hint: code
            ? "Pasted exactly as it is. Nothing is run and nothing is checked — this is text the app keeps for you."
            : "Prose, in the order you would do it. It wraps and is read straight through, so it is not set in a code box." },
        { key: "topics", label: "What it is about", type: "text", span: true,
          value: a ? assetTopics(a).join(", ") : "",
          placeholder: "photogrammetry, file handling",
          hint: "Comma-separated. It appears under each of them in the Library, beside the datasets and papers on the same subject." },
        { key: "notes", label: code ? "What it assumes" : "What to watch out for",
          type: "textarea", span: true, rows: 2,
          value: a ? (a.notes || "") : "",
          hint: code
            ? "The columns it expects, the folder layout, the version it was written against — the half that is not in the code."
            : "The step people get wrong, the thing that has to be true before you start." },
        { key: "url", label: "Where it came from", type: "text", span: true, more: true,
          value: a ? (a.url || "") : "", placeholder: "https://…" }
      ]),
      validate: function (v) {
        if (!v.name.trim()) return "Say what it does.";
        if (!v.body.trim()) {
          return code ? "A snippet with no body is a note — paste the formula or the script in."
                      : "Nothing is written out yet. A method with no body is a title.";
        }
        return null;
      },
      onConfirm: function (v) {
        go(function () {
          var t = a;
          if (!t) { t = { id: uid(), fromIds: [], archived: false }; state.assets.push(t); }
          t.name = v.name.trim();
          /* The kind and the language move together: prose has no language,
             and a language sitting on a record whose kind says prose would
             leave the record saying two things at once. */
          t.kind = code ? "snippet" : "method";
          t.repo = "lib";
          t.lang = code ? vocabTake("langs", v.lang, v.langOther, t.lang || "other") : "";
          /* Never trimmed at the front: leading whitespace is what a Python
             block MEANS. Only the trailing blank lines a textarea collects. */
          t.body = String(v.body).replace(/\s+$/, "");
          t.topics = topicList(v.topics);
          t.notes = v.notes.trim();
          t.url = v.url.trim();
          if (mk) openAsset = t.id;
        });
        toast(mk ? "Added" : "Saved");
      }
    });
  }

  /* THE BRIEF ASKS THE QUESTION AND NAMES THE FIVE ANSWERS, so the dialog
     asks it in its words: "What are you saving?" over Method, Script,
     Formula, Reference, Template. What it does NOT do is invent five records.
     A Script and a Formula are one record with a different language; a Method
     and a Template are one record with none; a Reference is a link with a
     note, which the registry has always held. So five doors, three rooms
     — and the rows SAY SO, because five choices that quietly land on
     three forms would read as the app losing track of what you picked. Same
     fold, and the same reason, as four archaeology nouns being one write-in
     field. */
  var SAVE_KINDS = [
    { id: "method", word: "Method",
      says: "How something is done, in your own words. Written out and read straight through." },
    { id: "script", word: "Script",
      says: "Python, ArcPy, GDAL, PowerShell, SQL. Kept as code, in mono, with a Copy button." },
    { id: "formula", word: "Formula",
      says: "A spreadsheet formula and what it assumes. The same record as a script, with Excel as its language." },
    { id: "reference", word: "Reference",
      says: "A paper, a manual, a standard, a link. Nothing is written out — it points at where it lives." },
    { id: "template", word: "Template",
      says: "A report skeleton, a metadata sheet, a naming convention. Written out, like a method." }
  ];
  function libAddDialog() {
    openModal({
      title: "What are you saving?",
      confirmLabel: "Go on",
      message: "Everything here lands in one registry and can carry the same subjects, the same provenance and the same route onto a board. What you pick decides the form you get, not a separate list.",
      fields: [
        { key: "what", label: "It is a", type: "select", span: true, value: "script",
          options: SAVE_KINDS.map(function (k) { return { value: k.id, label: k.word }; }),
          /* The hint carries all five readings at once rather than one at a
             time: a picker whose description changes as you move through it
             cannot be compared, and comparing is the whole reason there are
             five words. `hint` is the runtime's own slot for a sentence about
             the control it sits under; a new field type would have to land in
             all four apps byte-identically for one dialog. */
          hint: SAVE_KINDS.map(function (k) { return k.word + " — " + k.says; }).join("  ") }
      ],
      onConfirm: function (v) {
        /* Handed on rather than done here: this dialog chooses a shape and
           writes nothing, so there is still exactly one place each record is
           written. A Reference is the registry's own dialog with its kind and
           its section set — it has no body, and a body field on it would be
           a box that never gets read. */
        if (v.what === "reference") assetDialog(null, "lib", "doc");
        else if (v.what === "script") bodyDialog(null, "code");
        else if (v.what === "formula") bodyDialog(null, "formula");
        else bodyDialog(null, "prose");
      }
    });
  }

  function renderLibrary() {
    /* Inside a subject first, because that branch is a different screen and
       reading it after the landing's three sections is how the landing came
       to be built twice. */
    if (libTopic) return librarySubject();

    var topics = allTopics(), own = libOwn();
    var h = '<div class="tools" style="margin:0.9rem 0 0.5rem">' +
      '<button class="btn primary" data-act="lib-add">Save something</button>' +
      '<button class="btn" data-act="tab-vocab">The workbench</button></div>' +
      '<p class="hint" style="margin:0 0 0.9rem">Two questions on one page. <b>What you reuse</b> is what you have saved here on purpose: a method, a script, a formula, a reference, a template. <b>By subject</b> is the whole registry read by what a thing is ABOUT rather than by what kind it is \u2014 a subject is written onto a thing, so there is no list of topics to maintain and nothing here is a second copy of anything.</p>';

    if (!topics.length && !own.length) {
      return h + '<p class="empty">Nothing in the Library yet. \u201cSave something\u201d above asks what it is \u2014 a method, a script, a formula, a reference, a template \u2014 and anything else under Assets joins the subject list the moment you write down what it is about.</p>';
    }

    /* WHAT YOU REUSE comes first, because it is the half you open the Library
       to fetch. The subjects below it answer the slower question. */
    if (own.length) {
      /* THE CHIPS PARTITION THE LIST, so All is their sum. One facet per
         entry \u2014 its language if it is code, "written out" if it is prose,
         "referenced" if it has no body at all \u2014 because the first version
         chipped only the languages and stood "All 5" above five rows whose
         chips summed to four: the method had no language and belonged to no
         chip. A figure may never disagree with its own parts. */
      var fs = {};
      own.forEach(function (x) { var k = libFacet(x); fs[k] = (fs[k] || 0) + 1; });
      var fk = Object.keys(fs).sort(function (x, y) {
        return String(libFacetLabel(x)).localeCompare(String(libFacetLabel(y)));
      });
      h += '<div class="sect">What you reuse</div>';
      if (fk.length > 1) {
        h += '<div class="tools" style="margin-bottom:0.7rem">' +
          '<button class="btn' + (libLang ? "" : " primary") + '" data-act="lib-lang" data-id="">All' +
          ' <span class="cnt">' + own.length + "</span></button>" +
          fk.map(function (k) {
            return '<button class="btn' + (libLang === k ? " primary" : "") +
              '" data-act="lib-lang" data-id="' + esc(k) + '">' + esc(libFacetLabel(k)) +
              ' <span class="cnt">' + fs[k] + "</span></button>";
          }).join("") + "</div>";
      }
      var sr = libLang ? own.filter(function (x) { return libFacet(x) === libLang; }) : own;
      h += '<div class="stack tight">' + sr.map(snipRow).join("") + "</div>";
    }

    if (!topics.length) {
      return h + '<div class="sect">By subject</div><p class="empty">Nothing carries a subject yet. Open anything under Assets, press Edit, and write what it is about — "harbour surveying, photogrammetry". Everything carrying a word appears here under it, whatever kind of thing it is.</p>';
    }

    /* A SUBJECT IS A ROW, NOT A CHIP OVER AN EMPTY SCREEN. The landing used to
       be a strip of subject chips above "Pick a subject" — a screen whose
       whole content was an instruction to press something, which is the
       "an empty list's one job is to say what to do" rule applied to a list
       that was not empty at all. The mockup draws what it should have been:
       one row per subject, what it holds, and the first few things in it, so
       the page answers "what do I know about" without a tap. */
    var pool = live(state.assets).filter(function (a) { return assetTopics(a).length; });
    /* The chips are the kinds actually present across the library, counted,
       so no chip can empty the list — and selecting one re-counts every
       subject row beneath it rather than filtering a list that is not
       there. A subject holding none of the chosen kind drops out, which is
       the honest reading of "Papers" and not a row saying nought. */
    var ks = {};
    pool.forEach(function (a) { ks[a.kind] = (ks[a.kind] || 0) + 1; });
    var kk = Object.keys(ks).sort(function (x, y) {
      return String(assetKindLabel({ kind: x })).localeCompare(String(assetKindLabel({ kind: y })));
    });
    h += '<div class="sect">By subject</div>';
    if (kk.length > 1) {
      h += '<div class="tools" style="margin-bottom:0.9rem">' +
        '<button class="btn' + (libKind ? "" : " primary") + '" data-act="lib-kind" data-id="">All' +
        ' <span class="cnt">' + pool.length + "</span></button>" +
        kk.map(function (k) {
          return '<button class="btn' + (libKind === k ? " primary" : "") +
            '" data-act="lib-kind" data-id="' + esc(k) + '">' + esc(assetKindLabel({ kind: k })) +
            ' <span class="cnt">' + ks[k] + "</span></button>";
        }).join("") + "</div>";
    }

    var subj = topics.map(function (t) {
      var things = assetsOnTopic(t).filter(function (a) { return !libKind || a.kind === libKind; });
      return { t: t, things: things };
    }).filter(function (x) { return x.things.length; });

    if (!subj.length) {
      h += '<p class="empty">Nothing under ' + esc(assetKindLabel({ kind: libKind })) +
        " carries a subject yet.</p>";
      return h;
    }

    h += '<div class="stack tight">' + subj.map(function (x) {
      var n = x.things.length;
      return '<button type="button" class="panel rowbtn calm" data-act="lib-topic" data-id="' + esc(x.t) +
        '" title="' + esc(x.t) + '">' +
        '<span class="itile t-know">' + ICONS.book + "</span>" +
        '<div class="grow"><div class="nm sm">' + esc(x.t) + "</div>" +
        '<div class="says">' + esc(x.things.slice(0, 3).map(function (a) { return a.name; }).join(", ")) +
        (n > 3 ? "…" : "") + "</div></div>" +
        '<div class="dmeta">' + n + (n === 1 ? " thing" : " things") + "</div></button>";
    }).join("") + "</div>";

    /* QUICK ACCESS, as drawn — and derived rather than a list to keep: the
       library entries you have actually leaned on most, which is what
       `assetUses()` counts, and only the ones there is really something to
       open. A button that cannot do what it names is the fault
       `openHandle()` exists to prevent. */
    var quick = pool.map(function (a) { return { a: a, n: assetUses(a).length, h: openHandle(a) }; })
      .filter(function (x) { return x.h && x.n; })
      .sort(function (x, y) { return y.n - x.n; }).slice(0, 3);
    if (quick.length) {
      h += '<div class="sect">Quick access</div><div class="tools">' + quick.map(function (x) {
        return x.h.kind === "copy"
          ? '<button class="btn" data-act="asset-copy" data-id="' + x.a.id + '" title="' + esc(x.h.how) + '">' + esc(x.a.name) + "</button>"
          : '<a class="btn" href="' + esc(x.h.href) + '"' + (x.h.kind === "url" ? ' target="_blank" rel="noopener"' : "") +
            ' title="' + esc(x.h.how) + '">' + esc(x.a.name) + "</a>";
      }).join("") + "</div>";
    }
    return h;
  }

  /* One subject: the way back, then its own kinds, then everything filed
     under it whatever kind it is. A snippet is drawn as a snippet here too,
     because a row saying "Snippet or formula" and nothing else would be the
     one row on the page that says least about itself. */
  function librarySubject() {
    var h = '<div class="tools" style="margin:0.9rem 0 0.9rem">' +
      '<button class="btn" data-act="lib-topic" data-id="">← All subjects</button></div>';

    var all = assetsOnTopic(libTopic);
    /* The chips are the kinds present UNDER THIS SUBJECT, with a count each,
       so a chip is never offered that would empty the list — the same reason
       the Repo strip carries counts. */
    var kinds = {};
    all.forEach(function (a) { kinds[a.kind] = (kinds[a.kind] || 0) + 1; });
    var keys = Object.keys(kinds).sort(function (x, y) {
      return String(assetKindLabel({ kind: x })).localeCompare(String(assetKindLabel({ kind: y })));
    });
    if (keys.length > 1) {
      h += '<div class="tools" style="margin-bottom:0.7rem">' +
        '<button class="btn' + (libKind ? "" : " primary") + '" data-act="lib-kind" data-id="">All' +
        ' <span class="cnt">' + all.length + "</span></button>" +
        keys.map(function (k) {
          return '<button class="btn' + (libKind === k ? " primary" : "") +
            '" data-act="lib-kind" data-id="' + esc(k) + '">' + esc(assetKindLabel({ kind: k })) +
            ' <span class="cnt">' + kinds[k] + "</span></button>";
        }).join("") + "</div>";
    }
    var rows = libKind ? all.filter(function (a) { return a.kind === libKind; }) : all;
    h += '<div class="sect">' + esc(libTopic) +
      (libKind ? " · " + esc(assetKindLabel({ kind: libKind })) : "") + "</div>";
    h += rows.length ? '<div class="stack tight">' + rows.map(function (a) {
      if (hasBody(a)) return snipRow(a);
      var look = assetLook(a), trail = partTrail(a);
      var says = [assetKindLabel(a)];
      if (trail.length) says.push("in " + trail[trail.length - 1]);
      if (a.notes) says.push(a.notes);
      return '<button type="button" class="panel rowbtn calm" data-act="asset-open" data-id="' + a.id + '">' +
        '<span class="itile ' + look.tile + '">' + look.ico + "</span>" +
        '<div class="grow"><div class="nm sm">' + esc(a.name) + "</div>" +
        '<div class="says">' + esc(says.join(" · ")) + "</div></div></button>";
    }).join("") + "</div>"
      : '<p class="empty">Nothing under ' + esc(libTopic) + " any more.</p>";
    return h;
  }

  /* CONNECTIONS. Grouped the way the mockup groups them, and a row's tick is
     `openHandle()` answering rather than anything stored: a url opens in the
     browser and is a tick; a path with the companion on opens through the
     launcher and is a tick; a path with the companion OFF can only be copied,
     which is the browser refusing and not this app failing, so it reads as
     half a connection and says why. Hardware has nothing to open, ever, so
     its rows carry where the thing is and how it stands instead — the
     question you actually ask of a total station. */
  function connGroups() {
    return [
      { label: "Software", ico: ICONS.device, tile: "t-soft", ids: ["app"] },
      { label: "Web services", ico: ICONS.plug, tile: "t-conn", ids: ["site"] },
      { label: "Hardware", ico: ICONS.kit, tile: "t-equip", ids: ["device"] }
    ].map(function (g) {
      g.rows = g.ids.reduce(function (acc, id) { return acc.concat(repoIn(id)); }, []);
      return g;
    });
  }

  function renderConn() {
    var gs = connGroups();
    var any = gs.some(function (g) { return g.rows.length; });
    var h = '<p class="hint" style="margin:0 0 0.9rem">Nothing is set up here and nothing is signed in. A tick means this app can really open that one \u2014 read off the same function every Open button in the app goes through, so a tick can never be a promise it cannot keep.</p>';
    if (!any) {
      return h + '<p class="empty">Nothing to reach yet. Add an app, a site or a device under Assets and it appears here with what this app can do about it.</p>';
    }
    gs.forEach(function (g) {
      h += '<div class="sect">' + esc(g.label) + "</div>";
      if (!g.rows.length) {
        h += '<p class="dempty">Nothing under ' + esc(g.label.toLowerCase()) + " yet.</p>";
        return;
      }
      h += '<div class="cgrid">' + g.rows.map(function (a) {
        var hd = openHandle(a), st = thingState(a);
        var mark = hd && hd.kind !== "copy" ? '<span class="ctick on" title="' + esc(hd.how) + '">\u2713</span>'
                 : hd ? '<span class="ctick half" title="' + esc(hd.how) + '">\u2295</span>'
                 : "";
        var say = hd ? (hd.brief || hd.how)
                : st.word ? st.word + (a.where ? " \u00b7 " + a.where : "")
                : a.where ? a.where : "nothing to open";
        var inner = '<span class="itile sm ' + g.tile + '">' + g.ico + "</span>" +
          '<span class="grow"><span class="nm">' + esc(a.name) + "</span>" +
          '<span class="says">' + esc(say) + "</span></span>" + mark;
        return hd && hd.kind === "url"
          ? '<a class="crow" href="' + esc(hd.href) + '" target="_blank" rel="noopener" title="' + esc(a.name + " \u2014 " + hd.how) + '">' + inner + "</a>"
          : '<button type="button" class="crow" data-act="asset-open" data-id="' + a.id +
            '" title="' + esc(a.name) + '">' + inner + "</button>";
      }).join("") + "</div>";
    });
    return h;
  }

  function renderRepo() {
    if (openAsset && byId(state.assets, openAsset)) return assetPage(byId(state.assets, openAsset));
    var page = REPO_PAGES.filter(function (p) { return p.id === repoTab; })[0] || REPO_PAGES[0];
    var rows = page.id === "lib" || page.id === "conn" ? [] : repoIn(page.id);
    var total = live(state.assets).length;

    var h = '<div class="finding"><h1>' +
      (total ? (total === 1 ? "One thing." : cap(numWord(total)) + " things.") : "Nothing under Assets yet.") +
      "</h1></div>" +
      '<p class="saynote">Everything you own and everything you open, in one place \u2014 and a tap on a row opens it. The same entries carry their upkeep and what they were made from on the workbench.</p>';

    // The strip carries a count each, so an empty section is visible without
    // being opened.
    h += '<div class="subnav">' + REPO_PAGES.map(function (p) {
      /* Connections counts what can be REACHED rather than what is filed:
         the question that section asks. A count of things you have written
         down would be the Repo's own total said twice. */
      /* Entries, not subjects: the Library lists snippets and subject-carrying
         things, and a count of subjects over a page listing entries is two
         units in one figure. */
      var n = p.id === "lib" ? libEntries().length
            : p.id === "conn" ? connGroups().reduce(function (t, g) {
                return t + g.rows.filter(function (a) { return !!openHandle(a); }).length; }, 0)
            : repoIn(p.id).length;
      return '<button class="btn' + (p.id === repoTab ? " primary" : "") +
        '" data-act="repo-page" data-id="' + p.id + '">' + p.label +
        (n ? ' <span class="cnt">' + n + "</span>" : "") + "</button>";
    }).join("") + "</div>";

    if (page.id === "lib") return h + renderLibrary();
    if (page.id === "conn") return h + renderConn();

    h += '<div class="tools" style="margin:0.9rem 0 0.5rem">' +
      '<button class="btn primary" data-act="repo-add" data-id="' + page.id + '">New ' + esc(page.one) + "</button>" +
      '<button class="btn" data-act="tab-vocab">The workbench</button></div>';

    h += '<p class="hint" style="margin:0 0 0.8rem">' + esc(page.blurb) + "</p>";

    /* Said once, above the list, and only where it is true: with the launcher
       off every path in the app is copy-only, and that is a fact about the
       machine rather than about any one row. In every row it was the same
       sentence over and over. */
    if (page.id !== "site" && !state.settings.companion &&
        rows.some(function (a) { return a.path && !a.url; })) {
      h += '<div class="panel calm"><div class="grow"><div class="nm sm">A browser cannot open a file on your machine</div>' +
        '<div class="says">That is the browser refusing, not this app failing \u2014 a page served over https may not follow a file:// link, and Chrome refuses it without a word. ' +
        'The launcher is the way round it: one small handler, and every path here becomes one tap.</div></div>' +
        '<div class="acts"><button class="btn" data-act="tab-settings">Turn the launcher on</button></div></div>';
    }

    /* The empty line used to repeat `page.blurb`, which is printed in full
       forty words above it — the same sentence twice on a screen with
       nothing else on it. It says what to do instead, which is the one thing
       an empty list is for. */
    h += rows.length ? '<div class="stack tight">' + rows.map(repoRow).join("") + "</div>"
      : '<p class="empty">Nothing under ' + esc(page.label) + ' yet \u2014 "New ' +
        esc(page.one) + '" above puts the first one in.</p>';
    return h;
  }

  function assetRow(a) {
    var look = assetLook(a);
    return '<button type="button" class="panel rowbtn calm" data-act="asset-open" data-id="' + a.id + '">' +
      '<span class="itile ' + look.tile + '">' + look.ico + "</span>" +
      '<div class="grow"><div class="nm sm">' + esc(a.name) + "</div>" +
      '<div class="says">' + esc(assetSays(a)) + "</div></div></button>";
  }

  /* THE SITE PLAN — the brief's second data-driven visual, and the reason the
     field above had to come first.

     WHAT IT DELIBERATELY IS NOT: a map. A basemap is tiles off a network and
     this app fetches nothing, so there is no aerial under this and there
     never will be. What is left when you take the basemap away is not
     nothing, though — it is the one thing a list of coordinates cannot say:
     RELATIVE POSITION. A site with three trenches in it, each with a
     coordinate, has a shape, and that shape is drawn here from stated
     numbers with nothing invented. It is `atId` and `geo` composed, which is
     why neither of them needed a new noun.

     Four rules:

     - **Two points or it is not drawn.** One coordinate has no geometry — a
       lone dot in a frame is a picture of nothing, so an entry whose parts
       have no coordinates gets the figures and no drawing.
     - **It computes nothing but the projection.** Every position is `geoOf`
       on an entry the containment relation already named; nothing is stored,
       nothing is guessed, and an entry with no coordinate is LISTED as
       unplaced rather than dropped, because a plan that silently omits half
       a site is worse than one with an awkward line under it.
     - **A plan without a scale is a picture**, so there is a scale bar in
       metres and a north arrow. The projection is the same spherical
       approximation `geoSpan` uses — right to well inside a percent across a
       site, and stated as "about" wherever a figure is printed.
     - **North is up and east is right**, which is the one convention a site
       drawing may not get wrong. Longitude is scaled by cos(latitude) so a
       square on the ground is a square on the sheet.

     The frame is the subject's own extent when it has one; otherwise it is
     the bounding box of everything placed, padded, so the drawing is never
     tight against its own edge. */
  function planPoints(a) {
    var out = [], g = geoOf(a);
    if (g) out.push({ a: a, g: g, self: true });
    partsIn(a).forEach(function (x) {
      var xg = geoOf(x);
      if (xg) out.push({ a: x, g: xg, self: false });
    });
    return out;
  }
  function sitePlan(a) {
    var pts = planPoints(a);
    if (pts.length < 2) return "";
    var W = 360, PAD = 26, LEGEND = 34;

    // Everything in degrees first, then one projection to the sheet.
    var lo = 1e9, la = 1e9, hi = -1e9, ha = -1e9;
    pts.forEach(function (p) {
      lo = Math.min(lo, p.g.lon, geoIsBox(p.g) ? p.g.lon2 : p.g.lon);
      hi = Math.max(hi, p.g.lon, geoIsBox(p.g) ? p.g.lon2 : p.g.lon);
      la = Math.min(la, p.g.lat, geoIsBox(p.g) ? p.g.lat2 : p.g.lat);
      ha = Math.max(ha, p.g.lat, geoIsBox(p.g) ? p.g.lat2 : p.g.lat);
    });
    var midLat = (la + ha) / 2, kx = Math.cos(midLat * Math.PI / 180);
    /* A single degree span of nought in either axis (a row of points on one
       line) would divide by zero and put every mark on top of the others, so
       the span has a floor — in METRES, so the floor means the same thing at
       every latitude. */
    var FLOOR = 20 / DEG_M;
    var spanX = Math.max((hi - lo) * kx, FLOOR), spanY = Math.max(ha - la, FLOOR);
    var inner = W - PAD * 2;
    var scale = inner / Math.max(spanX, spanY);          // sheet units per degree-equivalent
    var H = Math.round(spanY * scale) + PAD * 2 + LEGEND;
    var cx0 = (lo + hi) / 2, cy0 = (la + ha) / 2;
    var midY = (H - LEGEND) / 2;
    function X(lon) { return W / 2 + (lon - cx0) * kx * scale; }
    function Y(lat) { return midY - (lat - cy0) * scale; }   // north is UP

    var g = "", unplaced = [], lab = [];
    partsIn(a).forEach(function (x) { if (!geoOf(x)) unplaced.push(x.name); });

    pts.forEach(function (p) {
      /* The subject is not labelled: the page heading names it three inches
         above, and the dashed frame is what says which mark is it. Printed
         here too it was one of three names landing on the same line — and
         the only one of the three that said nothing new. */
      var nm = p.self ? "" : clip(p.a.name, 22);
      if (geoIsBox(p.g)) {
        var x1 = X(p.g.lon), x2 = X(p.g.lon2), y1 = Y(p.g.lat2), y2 = Y(p.g.lat);
        g += '<rect class="plbox' + (p.self ? " plself" : "") + '" x="' + x1.toFixed(1) +
          '" y="' + y1.toFixed(1) + '" width="' + Math.max(2, x2 - x1).toFixed(1) +
          '" height="' + Math.max(2, y2 - y1).toFixed(1) + '"></rect>';
        if (nm) lab.push({ x: (x1 + x2) / 2, y: y1 - 6, w: nm.length * 5.6, t: nm });
      } else {
        var px = X(p.g.lon), py = Y(p.g.lat);
        g += '<circle class="pldot' + (p.self ? " plself" : "") + '" cx="' + px.toFixed(1) +
          '" cy="' + py.toFixed(1) + '" r="' + (p.self ? 5 : 3.6) + '"></circle>';
        if (nm) lab.push({ x: px, y: py - 10, w: nm.length * 5.6, t: nm });
      }
    });
    /* A LABEL THAT WOULD LAND ON ANOTHER IS PUSHED DOWN, NOT DROPPED — the
       sheet's `settleNode` rule in a smaller place. A sherd four metres from
       its trench is a real pair of coordinates, and two names on top of each
       other is a plan that reads as one illegible word. Only vertically:
       sideways would move a label off the mark it belongs to.

       IT MOVES A LABEL DOWN AND NEVER UP, WHICH IS WHAT MAKES IT TERMINATE.
       The first version restarted the scan on every push (`j = -1`) and set
       `L.y = K.y + 13` unconditionally — so a label could be moved UP onto an
       earlier one, pushed back down onto a third, and round again for ever.
       Five coordinates on one site FROZE THE PAGE: no error, no render, and
       every Playwright click after it timed out at thirty seconds with
       nothing intercepting anything, which is what that symptom actually
       means. Sorted by y and only ever increasing, each placed label can
       force at most one move past it; the guard is belt and braces. */
    var marks = "";
    lab.sort(function (p, q) { return p.y - q.y; });
    lab.forEach(function (L, i) {
      var moved = true, guard = 0;
      while (moved && guard++ < 40) {
        moved = false;
        for (var j = 0; j < i; j++) {
          var K = lab[j];
          if (Math.abs(L.y - K.y) < 13 && Math.abs(L.x - K.x) < (L.w + K.w) / 2 &&
              L.y <= K.y + 13) { L.y = K.y + 13; moved = true; }
        }
      }
      /* A LABEL IS MASKED AGAINST WHAT IS BEHIND IT, which is what a real
         drawing does and the only fix that holds in general: pushing a label
         clear of another label does nothing about a label landing on a LINE,
         and the orthophoto's north edge sits three metres under the site's,
         so its name was written straight through the site's own frame. */
      marks += '<rect class="plmask" x="' + (L.x - L.w / 2 - 3).toFixed(1) + '" y="' +
        (L.y - 9).toFixed(1) + '" width="' + (L.w + 6).toFixed(1) + '" height="12" rx="3"></rect>' +
        '<text class="pllab" x="' + L.x.toFixed(1) + '" y="' + L.y.toFixed(1) +
        '" text-anchor="middle">' + esc(L.t) + "</text>";
    });

    /* THE SCALE BAR IS A ROUND NUMBER OF METRES, not whatever length happens
       to fit — a bar reading "137 m" is a bar nobody can measure against. It
       picks the largest 1·2·5 step that fits in a third of the sheet. */
    var mPerUnit = DEG_M / scale;    // scale is units per DEGREE, not per metre
    var want = inner / 3 * mPerUnit, step = 1;
    while (step * 10 <= want) step *= 10;
    var bar = step;
    if (step * 5 <= want) bar = step * 5; else if (step * 2 <= want) bar = step * 2;
    var barU = bar / mPerUnit;
    var by = H - LEGEND + 18;
    g += '<line class="plrule" x1="' + PAD + '" y1="' + by + '" x2="' + (PAD + barU).toFixed(1) +
      '" y2="' + by + '"></line>' +
      '<line class="plrule" x1="' + PAD + '" y1="' + (by - 4) + '" x2="' + PAD + '" y2="' + (by + 4) + '"></line>' +
      '<line class="plrule" x1="' + (PAD + barU).toFixed(1) + '" y1="' + (by - 4) + '" x2="' +
      (PAD + barU).toFixed(1) + '" y2="' + (by + 4) + '"></line>' +
      '<text class="pllab" x="' + (PAD + barU + 8).toFixed(1) + '" y="' + (by + 4) + '">about ' +
      esc(metreWords(bar)) + "</text>";
    // North up, said with an arrow AND the letter, because an arrow alone is
    // a convention and the letter is the fact.
    g += '<line class="plrule" x1="' + (W - 16) + '" y1="' + (by + 5) + '" x2="' + (W - 16) +
      '" y2="' + (by - 9) + '" marker-end="url(#plm)"></line>' +
      '<text class="pllab" x="' + (W - 16) + '" y="' + (by + 16) + '" text-anchor="middle">N</text>';

    var foot = unplaced.length
      ? '<p class="pgcap">' + cap(numWord(unplaced.length)) +
        (unplaced.length === 1 ? " thing in it has" : " things in it have") +
        " no coordinate, so " + (unplaced.length === 1 ? "it is" : "they are") +
        " not on the plan: " + esc(unplaced.slice(0, 4).join(", ")) +
        (unplaced.length > 4 ? " and more" : "") + ".</p>"
      : "";

    return '<div class="pgraph" style="max-width:' + W + 'px">' +
      '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(planWords(a)) + '">' +
      '<defs><marker id="plm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"' +
      ' markerHeight="6" orient="auto-start-reverse">' +
      '<path class="pghead" d="M0,1 L9,5 L0,9 z"></path></marker></defs>' +
      g + marks + "</svg></div>" + foot;
  }
  // The plan's own sentence, for anybody who cannot see it — the same reason
  // `provWords` exists.
