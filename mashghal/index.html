     which meant inventing a `ro` property the shared runtime does not have —
     the same trap `type: "note"` was last round, and a field spec is not the
     place to put a reference table anyway. `openModal`'s `message` takes raw
     markup, so the table goes there; it is wrapped in a `<p>`, so every
     element here is INLINE — a `<div>` or a `<dl>` inside a paragraph is
     hoisted out of it by the parser and the layout comes apart. */
  /* A LIST, NOT A FORM, AND ONE WAY OUT. Two drafts were wrong before this
     one. Ten read-only text fields meant inventing a `ro` property the
     shared runtime does not have — the same trap `type: "note"` was last
     round, and a field spec is not the place to put a reference table. And
     `openModal` with `cancelLabel: ""` still drew **Cancel** beside Close,
     because the runtime reads `opts.cancelLabel || "Cancel"` and an empty
     string falls through: two buttons that both dismiss, one of them dressed
     as a choice, which is the fault this file already records about the
     equipment row. A reference table changes nothing, so it has exactly one
     way out — and the app's route for a dialog that is not a form is to
     write the overlay and call `trapOverlay`, the way `backupDialog` does.
     Missing that call is the other rule here: Escape and the focus trap
     belong to the OVERLAY, not to `openModal`. */
  function keysDialog() {
    closeModal();
    overlay.innerHTML = '<div class="scrim" data-scrim="1">' +
      '<div class="modal" style="max-width:560px" role="dialog" aria-modal="true" aria-label="Keyboard">' +
      '<div class="modal-head"><h3>Keyboard</h3>' +
      "<p>On a Mac read Cmd for Ctrl. Every one of these presses a control that is already on the screen " +
      "\u2014 there is nothing here you cannot also do with a tap.</p></div>" +
      '<div class="modal-body">' +
      SHORTCUTS.map(function (sc) {
        return '<div class="kbdrow"><span class="kbdk">' +
          sc.k.map(function (k) { return "<kbd>" + esc(k) + "</kbd>"; }).join(" ") +
          '</span><span class="kbdw">' + esc(sc.what) + "</span></div>";
      }).join("") + "</div>" +
      '<div class="modal-foot"><button class="btn primary" data-mclose="1">Close</button></div>' +
      "</div></div>";
    trapOverlay();
    overlay.querySelector("[data-mclose]").addEventListener("click", closeModal);
    overlay.querySelector("[data-scrim]").addEventListener("mousedown", function (e) {
      if (e.target.hasAttribute("data-scrim")) closeModal();
    });
    overlay.querySelector("[data-mclose]").focus();
  }

  /* WHAT "NEW ITEM IN CURRENT SECTION" MEANS, stated as a table rather than
     guessed at, and it goes by DEPTH: on an open sheet the thing you make is
     a step, not another procedure. Where a screen makes nothing — Home is
     five other screens, Schedule and Outputs are both derived — it returns
     null, and the press SAYS so rather than doing nothing silently, which is
     the fault a control that quietly does nothing already carries a rule
     about. */
  function newHere() {
    if (view === "boards") {
      var b = openBoard();
      if (b && !b.derived) return { act: "node-add", id: b.id, what: "step on this sheet" };
      return { act: "board-new", id: "", what: "procedure" };
    }
    if (view === "jobs") {
      if (openProj) return { act: "task-add-proj", id: openProj, what: "task on this project" };
      if (projList === "jobs") return { act: "job-add", id: "", what: "job" };
      return { act: "proj-add", id: "", what: "project" };
    }
    if (view === "waiting") return { act: "task-add", id: "", what: "task" };
    if (view === "repo") {
      if (repoTab === "lib") return { act: "lib-add", id: "", what: "Library entry" };
      return { act: "repo-add", id: repoTab, what: "thing" };
    }
    return null;
  }
  function keyNew() {
    var n = newHere();
    if (!n) {
      /* Naming the screens that DO make something, because "nothing here"
         on its own reads as the shortcut being broken. */
      toast("Nothing is made on this screen. Ctrl+N makes a procedure on Workflows, a project on Projects, a task on Actions and a thing on Assets.");
      return;
    }
    APP.actions[n.act](n.id);
  }
  /* Ctrl+S is the dialog's own confirm button, pressed. It earns its place on
     one case: the runtime wires Enter to confirm, and inside a TEXTAREA Enter
     is a new line — so a note or a body was the one field you had to reach for
     the mouse from. */
  function keySave() {
    var ok = overlay && overlay.querySelector("[data-mok]");
    if (ok) { ok.click(); return; }
    toast("Nothing is being edited. Ctrl+S saves an open dialog.");
  }
  /* THE UNDO IS THE TOAST'S, AND IT LIVES EXACTLY AS LONG AS THE TOAST DOES.
     This app has never had an undo stack: every change that can be taken back
     offers its own undo on the message it prints, as a closure over the
     records it touched. Keeping one reachable for longer than the message
     would widen a real hole — the sample, a restored backup and a sync merge
     all REPLACE state, and a closure captured before that would mutate
     objects no longer in the book. So Ctrl+Z presses the Undo that is on
     screen, and when there is none it says what the app's undo actually is
     rather than pretending to have lost one. */
  function keyUndo() {
    var box = document.getElementById("toasts");
    var btns = box ? box.querySelectorAll(".toast button") : [];
    if (btns.length) { btns[btns.length - 1].click(); return; }
    toast("Nothing to undo. An undo is offered on the message a change prints, and only while it is up.");
  }
  /* AND THERE IS NO REDO, so it says so. Offering one would mean keeping the
     state from before the undo and putting it back through `APP.hydrate` —
     which works once and then cannot re-offer the undo, because the closure
     that performed it captured records the restore has just replaced. A redo
     that silently stops being reversible is worse than not having one. */
  function keyRedo() {
    toast("There is no redo. An undo belongs to the change that made it, so taking it back is the change again.");
  }

  /* ================= Boards ================= */

  // Nothing has been written down yet — the same test the first run used.
  function emptyBook() {
    return !state.boards.length && !live(state.claimants).length && !live(state.modes).length;
  }

  function firstRun() {
    return '<div class="card" style="border-left:2px solid var(--sage-deep)">' +
      "<h3>Nothing written down yet</h3>" +
      '<p class="hint" style="margin:0.2rem 0 0.9rem">Mashghal holds what work leaves behind: ' +
      "who you are waiting on, where you got to, and what still has to be filed. " +
      "You write a procedure once and run it as often as you like \u2014 and the run remembers, " +
      "not you. Two ways to start.</p>" +
      /* Three routes, not two: suppressing the header tools on an empty book
         took "New board" away with them, and building one step at a time is a
         perfectly good way to start. */
      '<div class="tools"><button class="btn primary" data-act="prose-open">Write one in prose</button>' +
      '<button class="btn" data-act="board-new">Start an empty one</button>' +
      '<button class="btn" data-act="sample">Open the worked example</button></div>' +
      '<p class="saynote" style="margin:0.9rem 0 0">The example is one designer\u2019s week \u2014 a brochure ' +
      "mid-revision, a survey sitting at four steps at once, a visa. It replaces nothing, because there is " +
      "nothing here yet, and <b>Erase everything</b> in Settings clears it whenever you like.</p></div>";
  }

  function renderBoards() {
    var b = openBoard();
    if (b) return renderBoard(b);

    var runs = boards("run").filter(function (r) { return !r.closedOn; });
    var closed = boards("run").filter(function (r) { return r.closedOn; });
    var tpls = boards("template");

    var h = pageHead("Workflows", "A procedure is written once. A run is one pass through it.",
      emptyBook() ? "" : '<div class="tools">' +
      '<button class="btn" data-act="board-new">New procedure</button>' +
      '<button class="btn" data-act="prose-open">Write one in prose</button>' +
      (tpls.length ? '<button class="btn primary" data-act="run-start">Start a run</button>' : "") +
      "</div>");

    /* A first run used to replace the empty book with the worked example and
       SAVE it — you met three jobs, six boards, named people and "three things
       are late", all fiction, none of it marked as such, and Settings still
       offered to load the example as though it had not. The example is now an
       offer, which is what it always was. */
    if (emptyBook()) return h + firstRun();

    h += '<div class="sect">Running</div>';
    h += runs.length ? '<div class="boards">' + runs.map(runCard).join("") + "</div>"
                     : '<p class="empty">Nothing under way.</p>';

    h += '<div class="sect">Procedures</div>';
    h += tpls.length ? '<div class="boards">' + tpls.map(tplCard).join("") + "</div>"
                     : '<p class="empty">No procedures yet. Write one, then run it as many times as you like.</p>';

    if (closed.length) {
      h += '<div class="sect">Finished</div><div class="boards">' + closed.map(runCard).join("") + "</div>";
    }
    return h;
  }

  function cardTop(b) {
    var k = byId(state.kinds, b.kindId);
    return k ? ' style="border-top-color:' + esc(k.colour) + '"' : "";
  }

  function tplCard(b) {
    var steps = b.nodes.filter(function (n) { return n.t === "step"; });
    var runs = boards("run").filter(function (r) { return r.fromBoardId === b.id; }).length;
    return '<button class="bcard" data-act="board-open" data-id="' + b.id + '"' + cardTop(b) + ">" +
      "<h3>" + esc(b.name) + "</h3>" +
      '<div class="bsub">' + esc(jobOrBench(b)) + "</div>" +
      // The same track, all of it waiting: the shape of the procedure itself.
      '<div class="track">' + steps.map(function (n) {
        return '<i class="t-todo" title="' + esc(n.label) + '"></i>';
      }).join("") + "</div>" +
      '<div class="bstat">' + (runs ? "Run " + runs + (runs === 1 ? " time" : " times") : "Never run yet") +
      '<span class="bnum">' + steps.length + (steps.length === 1 ? " step" : " steps") +
      "</span></div></button>";
  }

  /* A card that SHOWS the run rather than describing it.

     "3 of 8 done" is a sentence you have to parse; a track of eight marks, three
     filled, is the same fact at a glance — and it also shows WHERE in the work
     you are, which the sentence never did. Under it go the pictures on the
     board, because on a run about aerial photographs the photographs are the
     most recognisable thing about it.

     This is the difference between a list of records and a screen: the same
     data, arranged so the eye does the reading. */
  function runCard(b) {
    var p = runProgress(b);
    var act = activeNodes(b);
    var late = act.filter(function (n) { return nodeState(b, n) === "over"; }).length;
    var steps = b.nodes.filter(function (n) { return n.t === "step"; });
    var pics = b.nodes.filter(function (n) { return n.t === "thing" && hasPic(n); });

    var head = b.closedOn ? "Finished " + niceDate(b.closedOn)
             : late ? (late === 1 ? "One thing is late" : cap(numWord(late)) + " things are late")
             : act.length ? (act.length === 1 ? "One step in hand" : cap(numWord(act.length)) + " steps in hand")
             : "Nothing on the go";

    return '<button class="bcard' + (late ? " late" : "") + '" data-act="board-open" data-id="' +
      b.id + '"' + cardTop(b) + ">" +
      "<h3>" + esc(b.name) + "</h3>" +
      '<div class="bsub">' + esc(jobOrBench(b)) + "</div>" +
      // The track: one mark per step, in order, so you can see the shape of it.
      '<div class="track">' + steps.map(function (n) {
        var st = nodeState(b, n);
        return '<i class="t-' + st + '" title="' + esc(n.label) + '"></i>';
      }).join("") + "</div>" +
      /* "0 of 5" with no word said nothing about WHAT it counted, and sat
         directly beside "Two steps in hand" — two different measures on one
         line, which is the "a figure may never disagree with its own parts"
         rule in miniature. `boardStand` had the word all along; the card had
         dropped it. */
      '<div class="bstat' + (late ? " bad" : "") + '">' + esc(head) +
      '<span class="bnum">' + p.done + " of " + p.total + " done</span></div>" +
      (pics.length ? '<div class="bpics">' + pics.slice(0, 4).map(function (t) {
        return '<img data-pic="' + esc(t.pic || "") + '" data-thumb="' + esc(t.id) + '" alt="">';
      }).join("") + "</div>" : "") +
      "</button>";
  }

  function jobOrBench(b) {
    var bits = [];
    if (b.jobId) bits.push(jobName(b.jobId));
    else if (b.benchId) bits.push(benchLabel(b.benchId));
    if (b.kindId) bits.push(kindName(b.kindId));
    return bits.length ? bits.join(" · ") : "Belongs to no job";
  }

  /* ---------------- one board ---------------- */

  /* How the run stands, as dot-and-word pairs rather than a count buried in the
     provenance line. The last pair is the archive lock: a run that has printed
     but never been filed LOOKS finished, and this is the only place that says
     out loud that it is not. */
  function boardStand(b, p) {
    if (b.kind !== "run") return "";
    var d = dues().filter(function (x) { return x.board.id === b.id; });
    var late = d.filter(function (x) { return x.st === "over"; }).length;
    var hand = d.length - late;
    var uf = unfiled(b).length;
    var bits = [];
    if (late) bits.push('<span class="sp"><i class="d-late"></i>' +
      (late === 1 ? "One late" : cap(numWord(late)) + " late") + "</span>");
    if (hand) bits.push('<span class="sp"><i class="d-hand"></i>' +
      (hand === 1 ? "One in hand" : cap(numWord(hand)) + " in hand") + "</span>");
    if (!d.length) bits.push('<span class="sp muted">Nothing active</span>');
    bits.push('<span class="sp muted">' + p.done + " of " + p.total + " done</span>");
    if (uf) bits.push('<span class="sp muted">can’t be closed yet</span>');
    else if (b.closedOn) bits.push('<span class="sp muted">closed ' + esc(niceDate(b.closedOn)) + "</span>");
    return '<div class="stand">' + bits.join("") + "</div>";
  }

  // Whether the written-out list under a board is open. View state, never
  // saved: a board opens on the board, every time.
  var foldOpen = false;

  function renderBoard(b) {
    var isRun = b.kind === "run";
    var p = runProgress(b);
    var sub = (b.benchId ? benchLabel(b.benchId) : "no employer") +
      (b.kindId ? " · " + kindName(b.kindId) : "") +
      (isRun
        ? (b.startedOn ? " · started " + niceDate(b.startedOn) : "") +
          (b.fromBoardId && byId(state.boards, b.fromBoardId)
            ? ", from “" + byId(state.boards, b.fromBoardId).name + "”" : "")
        : " · a procedure, not a run");

    /* Eight buttons in one row above the board wrapped to three lines on a
       phone and read as a wall. They are two different jobs, so they sit in
       two places: what you do to the BOARD stays in the header, and what you
       ADD TO THE SHEET goes on the sheet's own bar — which had an empty half
       beside the zoom controls, and is where you are looking when you want
       another step. */
    var tools = '<div class="tools">' +
      '<button class="btn" data-act="board-back">All workflows</button>' +
      /* Not the primary action on a board with nothing to run — it was the
         loudest button on a new board and all it could do was refuse. */
      (isRun ? "" : '<button class="btn' + (b.nodes.some(function (n) { return n.t === "step"; }) ? " primary" : "") +
        '" data-act="run-this" data-id="' + b.id + '"' +
        (b.nodes.some(function (n) { return n.t === "step"; }) ? "" : " disabled title=\"Add a step first\"") +
        ">Run it</button>") +
      (isRun && !b.closedOn ? '<button class="btn" data-act="run-close" data-id="' + b.id + '">Close run</button>' : "") +
      '<button class="btn" data-act="task-add-board" data-id="' + b.id + '">Something to do</button>' +
      '<button class="btn" data-act="board-edit" data-id="' + b.id + '">Rename</button>' +
      '<button class="btn danger" data-act="board-del" data-id="' + b.id + '">Delete</button>' +
      "</div>";

    /* Typed against this board. NOT on the sheet: a task is not a step — it
       is not in the flow, nothing waits on it and a run does not advance
       through it — and drawing one as a node would be exactly the conflation
       the two edge kinds exist to prevent. It sits above the sheet as a row,
       where it reads as what it is: a note to yourself about this board. */
    var bt = tasksFor("board", b.id);

    /* One handle rather than five buttons: on a phone the five plus the four
       zoom controls wrapped to four rows and stood taller than a third of the
       sheet. Adding something is occasional; zoom and Tidy are constant, so
       only the adding folds away. */
    var sheetTools = '<div class="cvadd">' +
      '<button class="btn" data-act="node-add" data-id="' + b.id + '">Add step</button>' +
      '<button class="btn" data-act="photo-add" data-id="' + b.id + '">Add a photo</button>' +
      '<button class="btn" data-act="thing-add" data-id="' + b.id + '">Add a person or thing</button>' +
      /* The gate has to test the WHOLE pool, not one third of it. It read
         `allThings()`, which is only the things already on a board — so a
         book with a full registry and a bare board vocabulary hid the one
         button that would have brought any of it in. */
      (allThings().length || live(state.assets).length || live(state.contacts).length
        ? '<button class="btn" data-act="thing-borrow" data-id="' + b.id + '">Bring one in</button>' : "") +
      (b.nodes.length > 1 ? '<button class="btn" data-act="edge-add" data-id="' + b.id + '">Connect</button>' : "") +
      "</div>";

    /* Built inline rather than through pageHead(), which belongs to the shared
       runtime and knows nothing about a status cluster. */
    var h = '<div class="page-head"><div><h2>' + esc(b.name) + "</h2>" +
      "<p>" + esc(sub) + "</p>" + boardStand(b, p) + "</div>" + tools + "</div>";

    if (bt.length) {
      h += '<div class="sect">Written down for this board</div><div class="stack tight">' +
        bt.map(taskRow).join("") + "</div>";
    }

    if (isRun && b.closedOn) {
      h += '<div class="card"><p class="hint" style="margin:0">Closed on ' + niceDate(b.closedOn) +
        ". Nothing here can move; reopen it if there is more to do. " +
        '<button class="btn quiet" data-act="run-reopen" data-id="' + b.id + '">Reopen</button></p></div>';
    }

    if (isRun && !b.closedOn) {
      var uf = unfiled(b), act = activeNodes(b);
      if (!act.length && uf.length) {
        h += '<div class="card" style="border-left:2px solid var(--oxide)">' +
          "<h3>Not finished</h3><p class=\"hint\" style=\"margin:0.2rem 0 0\">Nothing is in hand, but " +
          uf.length + (uf.length === 1 ? " filing step is" : " filing steps are") +
          " still undone — " + esc(uf.map(function (n) { return n.label; }).join(", ")) +
          ". A run will not close until the filing is done, because filing is the thing that gets forgotten.</p></div>";
      }
    }

    h += canvasHtml(b, sheetTools);

    /* One list, not three tables.

       Steps, Things and Connections as separate lists meant the board could
       only be read by cross-referencing: this step waits on somebody, and the
       somebody is in another table, and the fact that they are connected is in
       a third. So a step carries its own people, its own pictures and its own
       ways out, in the row — and the only things listed separately are the ones
       genuinely not attached to anything yet, which is a real state worth
       seeing rather than a table to join.

       The full list of connections survives behind a fold, because deleting one
       has to be possible somewhere and the sheet is for drawing them, not for
       tidying up. */
    var steps = b.nodes.filter(function (n) { return n.t === "step"; });
    var things = b.nodes.filter(function (n) { return n.t === "thing"; });
    var loose = things.filter(function (n) { return !edgesOf(b, n.id, "link").length; });

    /* Open a board and you see THE BOARD. Everything written out underneath it
       folds away, because the sheet already says all of it and a list of the
       same facts below is just the sheet again in words. The fold is there for
       the two jobs the sheet is bad at — reading a long sentence, and deleting
       something — and it remembers nothing, so a board always opens closed. */
    h += '<details class="fold big"' + (foldOpen ? " open" : "") + ' data-fold="1">' +
      "<summary>" + (isRun ? "The work, written out" : "The steps, written out") +
      ' <span class="foldn">' + steps.length + "</span></summary>";

    h += steps.length ? '<div class="stack tight">' + steps.map(function (n) { return stepRow(b, n); }).join("") + "</div>"
                      : '<p class="empty">No steps yet. Add the first thing you actually do.</p>';

    if (loose.length) {
      h += '<div class="sect">Not attached to anything yet</div>' +
        '<p class="saynote" style="margin:-0.3rem 0 0.7rem">Drag from a step\u2019s handle on the board to one of these to say where it belongs.</p>' +
        '<div class="stack tight">' + loose.map(function (n) { return thingRow(b, n); }).join("") + "</div>";
    }

    if (b.edges.length) {
      h += '<div class="sect">Connections</div><div class="stack tight">' +
        b.edges.map(function (e) { return edgeRow(b, e); }).join("") + "</div>";
    }
    h += "</details>";
    return h;
  }

  // stateTone is gone: it mapped a state onto a pill class, and there are no
  // pills left. A state is a word beside a drawn icon now — see stepRow().
function stateWord(b, n) {
    var st = nodeState(b, n);
    if (st === "done") return "done";
    if (st === "over") return "late";
    if (st === "waiting") return "waiting";
    if (st === "now") return "in hand";
    return "not started";
  }

  function linkedPics(b, n) {
    return edgesOf(b, n.id, "link").map(function (e) {
      return nodeOf(b, e.a === n.id ? e.b : e.a);
    }).filter(function (t) { return t && hasPic(t); });
  }

  function stepRow(b, n) {
    var isRun = b.kind === "run";
    var st = nodeState(b, n);
    var who = recipientsOf(b, n).map(function (t) { return t.label; }).join(", ");

    /* Through vocabLabel, never ACTS[…] directly: an act the reader invented
       through "Other — write it in" is in state.vocab and NOT in ACTS, so the
       direct lookup threw and took the whole board page with it. After a
       reload the board could not be opened at all — so the bad step could
       never be edited out, which made one dropdown choice unrecoverable
       without a backup. Same fix in proseSays(). */
    var meta = [vocabLabel("acts", n.act)];
    if (who) meta.push("to " + who);
    else if (n.act === "send") meta.push("nobody linked yet");
    if (n.chaseDays) meta.push("chase after " + n.chaseDays + "d");
    if (n.dueAt) meta.push(niceDate(n.dueAt));
    if (isRun && n.enteredAt && !n.doneAt) meta.push(daysWaiting(n) + "d");
    if (isRun && n.doneAt) meta.push("done " + niceDate(n.doneAt));
    if (isRun && n.answer) meta.push("chose: " + n.answer);

    var exits = n.act === "ask" ? exitsOf(b, n) : [];
    if (n.act === "ask") {
      meta.push(exits.length ? exits.map(function (x) {
        var t = nodeOf(b, x.goTo);
        return x.label + " → " + (t ? t.label : "?");
      }).join(" · ") : "no exits yet");
    }

    var tools = "";
    if (isRun && !b.closedOn) {
      if (!n.doneAt && n.enteredAt) {
        tools += n.act === "ask"
          ? '<button class="btn" data-act="step-answer" data-id="' + b.id + ":" + n.id + '">Answer</button>'
          : '<button class="btn" data-act="step-done" data-id="' + b.id + ":" + n.id + '">Mark done</button>';
      } else if (!n.enteredAt) {
        tools += '<button class="btn quiet" data-act="step-enter" data-id="' + b.id + ":" + n.id + '">Start</button>';
      } else {
        tools += '<button class="btn quiet" data-act="step-reopen" data-id="' + b.id + ":" + n.id + '">Reopen</button>';
      }
    }
    if (n.act === "ask") {
      tools += '<button class="btn quiet" data-act="exit-add" data-id="' + b.id + ":" + n.id + '">Add exit</button>';
    }
    if (n.act === "send") {
      tools += '<button class="btn quiet" data-act="send-to" data-id="' + b.id + ":" + n.id + '">Send to</button>';
    }
    tools += '<button class="btn quiet" data-act="node-edit" data-id="' + b.id + ":" + n.id + '">Edit</button>';
    tools += '<button class="btn quiet danger" data-act="node-del" data-id="' + b.id + ":" + n.id + '">×</button>';

    var late = st === "over";
    return '<div class="panel calm' + (late ? " late" : "") + '">' +
      '<span class="ic ic-' + esc(n.act) + '" title="' + esc(vocabLabel("acts", n.act)) + '">' +
      actIcon(n.act) + "</span>" +
      '<div class="grow"><div class="nm sm">' + esc(n.label) + "</div>" +
      '<div class="says">' + esc(meta.join(" · ")) + "</div>" +
      (function () {
        var out = "";
        // Everything hanging off this step, named on the step itself.
        var hangs = edgesOf(b, n.id, "link").map(function (e) {
          return nodeOf(b, e.a === n.id ? e.b : e.a);
        }).filter(function (t) { return t && !hasPic(t); });
        if (hangs.length) {
          out += '<div class="chips">' + hangs.map(function (t) {
            return '<span class="chip" data-act="node-edit" data-id="' + b.id + ":" + t.id + '">' +
              '<span class="ci">' + thingIcon(t.kind) + "</span>" + esc(clip(t.label, 22)) + "</span>";
          }).join("") + "</div>";
        }
        var pics = linkedPics(b, n);
        if (pics.length) {
          out += '<div class="strip">' + pics.map(function (t) {
            return '<img class="tinypic" data-pic="' + esc(t.pic || "") + '" data-thumb="' + esc(t.id) + '" alt="" title="' +
              esc(t.label) + '" data-act="pic-open" data-id="' + b.id + ":" + t.id + '">';
          }).join("") + "</div>";
        }
        // And where it goes, so the order is readable without the sheet.
        var nexts = nextOf(b, n.id);
        if (nexts.length > 1 || (nexts.length === 1 && nexts[0].label)) {
          out += '<div class="chips">' + nexts.map(function (e) {
            var t = nodeOf(b, e.b);
            return '<span class="chip way">' + (e.label ? esc(e.label) + " → " : "then → ") +
              esc(clip(t ? t.label : "?", 20)) + "</span>";
          }).join("") + "</div>";
        }
        return out;
      })() + "</div>" +
      (isRun ? '<div class="age' + (late ? " bad" : st === "now" ? " ok" : "") + '">' +
        esc(stateWord(b, n)) + "</div>" : "") +
      '<div class="acts">' + tools + "</div></div>";
  }

  function thingRow(b, n) {
    var links = edgesOf(b, n.id, "link").length;
    var says = [String(vocabLabel("things", n.kind)).toLowerCase()];
    says.push(links ? links + (links === 1 ? " link" : " links") : "not linked to anything");
    if (n.path) says.push(n.path);
    if (n.url) says.push(n.url);
    return '<div class="panel calm">' +
      (hasPic(n) ? '<img class="thumb" data-pic="' + esc(n.pic || "") + '" data-thumb="' + esc(n.id) + '" alt="">'
             : '<span class="ic" title="' + esc(vocabLabel("things", n.kind)) + '">' +
               thingIcon(n.kind) + "</span>") +
      '<div class="grow"><div class="nm sm">' + esc(n.label) + "</div>" +
      '<div class="says">' + esc(says.join(" · ")) + "</div></div>" +
      '<div class="acts">' +
      (n.kind === "photo" ? '<button class="btn quiet" data-act="pic-add" data-id="' + b.id + ":" + n.id + '">' +
        (hasPic(n) ? "Replace picture" : "Add a picture") + "</button>" : "") +
      (hasPic(n) ? '<button class="btn quiet" data-act="pic-open" data-id="' + b.id + ":" + n.id + '">Look</button>' : "") +
      '<button class="btn quiet" data-act="node-edit" data-id="' + b.id + ":" + n.id + '">Edit</button>' +
      '<button class="btn quiet danger" data-act="node-del" data-id="' + b.id + ":" + n.id + '">×</button></div></div>';
  }

  function edgeRow(b, e) {
    var a = nodeOf(b, e.a), z = nodeOf(b, e.b);
    if (!a || !z) return "";
    var flow = e.k === "flow";
    var arrow = flow ? " → " : " ·· ";
    // The line itself rather than a word for it: solid with a head for
    // sequence, dotted without one for association — the same two marks the
    // sheet uses, so the list and the board read the same way.
    var mark = flow
      ? '<svg viewBox="0 0 24 10" width="24" height="10" aria-hidden="true">' +
        '<path d="M1 5h17" stroke="currentColor" stroke-width="1.6"/>' +
        '<path d="M17 1.6L21.5 5 17 8.4z" fill="currentColor"/></svg>'
      : '<svg viewBox="0 0 24 10" width="24" height="10" aria-hidden="true">' +
        '<path d="M1 5h22" stroke="currentColor" stroke-width="1.6" ' +
        'stroke-dasharray="1 4" stroke-linecap="round"/></svg>';
    var says = flow
      ? (e.join === "all" ? "waits for every way in" : e.label ? "a way out: " + e.label : "comes after")
      : "belongs with, in no order";
    return '<div class="panel calm">' +
      '<span class="ic"' + (flow ? "" : ' style="color:var(--brass)"') + ">" + mark + "</span>" +
      '<div class="grow"><div class="nm sm">' + esc(a.label) + arrow + esc(z.label) + "</div>" +
      '<div class="says">' + esc(says) + "</div></div>" +
      '<div class="acts"><button class="btn quiet danger" data-act="edge-del" data-id="' + b.id + ":" + e.id + '">×</button></div></div>';
  }

  /* ================= Waiting ================= */

  /* The screen opens on the finding, not on a count. Four tiles reading
     "OPEN 5 · LATE 3 · RUNS 4 · UPKEEP 2" is an instrument panel: it makes you
     do the reading. "Two things are late" has already done it. Nothing on this
     screen is a pill either — a state is a sentence, because "7D PAST" tells
     you less than "a day past your reminder" in the same space. */
  /* ================= tasks =================

     The one thing in this app somebody types. Everything else on Waiting is
     derived — a live step of a run, or a day passing — and the standing rule
     was that a due is born, never typed. Its owner asked for tasks, so the
     shape is the one that does not unravel the model: a task NAMES THE WORK
     IT BELONGS TO. That attachment is the whole reason it lives here and not
     in Daybook, which already owns errands; and it is why a task shows up on
     the job, the project or the board it was written against rather than only
     on one list.

     Kept out of `dues()` deliberately. A due is derived from a run, and
     folding typed lines into that function would make every figure built on
     it — the tab badge, the report, `projState` — quietly stop meaning what
     it says. Waiting carries them in their own section and says out loud that
     these are the typed ones. */
  function tasks() { return live(state.tasks); }
  function taskOf(id) { return byId(state.tasks, id); }
  function openTasks() { return tasks().filter(function (t) { return !t.doneAt; }); }
  /* Late is a date gone by and nothing else. A task with no date is not late
     however long it sits — the same rule as a wait with no chase interval,
     which `overdueBy()` returns 0 for. */
  function taskLate(t) {
    return !t.doneAt && t.dueAt && dayOk(t.dueAt) && t.dueAt < today();
  }
  function tasksLate() { return openTasks().filter(taskLate); }
  // Everything typed against one piece of work, at whatever level it was hung.
  function tasksFor(kind, id) {
    return openTasks().filter(function (t) {
      return kind === "job" ? t.jobId === id
           : kind === "proj" ? t.projId === id
           : t.boardId === id;
    });
  }
  function taskSays(t) {
    var bits = [];
    if (t.dueAt && dayOk(t.dueAt)) {
      bits.push(taskLate(t) ? "was due " + plainDate(t.dueAt) : "due " + niceDate(t.dueAt));
    } else bits.push("no date");
    var where = t.boardId && byId(state.boards, t.boardId) ? byId(state.boards, t.boardId).name
              : t.projId && projOf(t.projId) ? projName(t.projId)
              : t.jobId && jobOf(t.jobId) ? jobName(t.jobId) : "";
    if (where) bits.push("on " + where);
    if (t.place) bits.push(vocabLabel("places", t.place) || t.place);
    if (t.note) bits.push(t.note);
    return bits.join(" \u00b7 ");
  }
  function taskRow(t) {
    var late = taskLate(t);
    return '<div class="panel calm' + (late ? " late" : "") + '"><div class="grow">' +
      '<div class="nm sm">' + esc(t.label) + "</div>" +
      '<div class="says">' + esc(taskSays(t)) + "</div></div>" +
      (late ? '<span class="st late"><i></i>late</span>' : "") +
      '<div class="acts">' +
      '<button class="btn" data-act="task-done" data-id="' + t.id + '">Done</button>' +
      '<button class="btn quiet" data-act="task-edit" data-id="' + t.id + '">Edit</button>' +
      '<button class="btn quiet danger" data-act="task-del" data-id="' + t.id + '" title="Remove it">\u00d7</button>' +
      "</div></div>";
  }

  /* `at` pre-attaches the task to whatever page it was written from, so the
     one question that makes a task worth having here is answered without
     being asked twice. */
  function taskDialog(t, at) {
    var mk = !t;
    at = at || {};
    openModal({
      title: mk ? "Something to do" : "Edit it",
      confirmLabel: mk ? "Add" : "Save",
      wide: true,
      message: mk ? "The one thing in this app you type rather than derive. Say what it belongs to and it shows up there as well as under Actions \u2014 an errand that belongs to nothing belongs in Daybook."
                  : "",
      fields: [
        { key: "label", label: "What", type: "text", span: true,
          value: t ? t.label : "", placeholder: "Chase the print quote" },
        { key: "dueAt", label: "By when", type: "text",
          value: t ? (t.dueAt || "") : "", placeholder: "YYYY-MM-DD",
          hint: "Blank is fine \u2014 then it is never called late." },
        { key: "place", label: "Where", type: "select",
          value: t ? (t.place || "") : "", options: [{ value: "", label: "Anywhere" }].concat(vocabOpts("places")) },
        { key: "jobId", label: "For which job", type: "select", span: true,
          value: t ? (t.jobId || "") : (at.jobId || ""),
          options: [{ value: "", label: "No job" }].concat(opts(live(state.jobs), function (j) { return j.name; })) },
        { key: "projId", label: "\u2026or which project", type: "select", span: true,
          value: t ? (t.projId || "") : (at.projId || ""),
          options: [{ value: "", label: "No project" }].concat(opts(live(state.projects), function (p) { return p.name; })) },
        { key: "boardId", label: "\u2026or which board", type: "select", span: true,
          value: t ? (t.boardId || "") : (at.boardId || ""),
          options: [{ value: "", label: "No board" }].concat(opts(state.boards.filter(function (b) { return !b.archived; }), function (b) { return b.name; })) },
        { key: "note", label: "Note", type: "textarea", span: true, rows: 2,
          value: t ? (t.note || "") : "" }
      ],
      validate: function (v) {
        if (!v.label.trim()) return "Say what it is.";
        if (v.dueAt.trim() && !dayOk(v.dueAt.trim()))
          return "A date has to be a real day, written YYYY-MM-DD, or blank.";
        return null;
      },
      onConfirm: function (v) {
        go(function () {
          var x = t;
          if (!x) { x = { id: uid(), doneAt: "", archived: false }; state.tasks.push(x); }
          x.label = v.label.trim();
          x.dueAt = v.dueAt.trim();
          x.place = v.place;
          x.note = v.note.trim();
          /* One attachment, not three. Offering job, project and board and
             then storing all three would put the same task under a project
             AND under its job, which is the "two of everything" fault the job
             page already had. The narrowest wins, because it is the most
             specific thing the writer said. */
          x.boardId = byId(state.boards, v.boardId) ? v.boardId : "";
          x.projId = !x.boardId && projOf(v.projId) ? v.projId : "";
          x.jobId = !x.boardId && !x.projId && jobOf(v.jobId) ? v.jobId : "";
        });
        toast(mk ? "Written down" : "Saved");
      }
    });
  }

  /* ================= Home =================

     "Your mission control. See what you're working on, what's next, and what
     you need to open." The app had no home at all: it opened on Boards, which
     is a list of procedures — the right screen once you know what you are
     doing and the wrong one to arrive on.

     NOTHING HERE IS STORED AND NOTHING HERE IS NEW. Every card reads a
     function another screen already reads, which is the rule the report and
     the adviser live by and the reason Home cannot drift from the rest of the
     app: `dues()`, `projState()`, `runProgress()`, `openTasks()`,
     `openHandle()`. Even "recent" is derived — `updatedAt` is already stamped
     on every record for the sync merge, so the trail exists without a second
     list to keep in step.

     The order is the argument. TODAY first, because it is the only thing that
     cannot wait. Then WHAT IS MOVING, because that is what you came to work
     on. Then QUICK RUN, because the next thing you do is open something. Then
     CONTINUE WORKING and RECENT FILES, which answer "where was I" — the
     second of the three forgettings this app was built around. */

  /* Everything touched lately, newest first, out of the stamps sync already
     keeps. `kind` is what to do with a hit; nothing is recorded for this. */
  function recentlyTouched(kinds, n) {
    var out = [];
    if (kinds.boards) {
      state.boards.forEach(function (b) {
        if (b.archived) return;
        out.push({ at: b.updatedAt || "", kind: "board", id: b.id, name: b.name,
                   says: boardRecentSays(b) });
      });
    }
    if (kinds.assets) {
      live(state.assets).forEach(function (a) {
        out.push({ at: a.updatedAt || "", kind: "asset", id: a.id, name: a.name,
                   says: assetKindLabel(a) + (partTrail(a).length ? " \u00b7 in " + partTrail(a)[partTrail(a).length - 1] : "") });
      });
    }
    out.sort(function (x, y) { return String(y.at).localeCompare(String(x.at)); });
    return out.filter(function (r) { return !!r.at; }).slice(0, n || 4);
  }
  /* A BRACE THAT WAS NEVER THERE MADE THIS RETURN ON ITS FIRST LINE. Written
     `if (cond) var n = …` with the return on the next line and no braces,
     the return sat OUTSIDE the if — so every board on Home read
     "a procedure \u00b7 undefined steps", a run included, and the three lines
     below that describe a run were unreachable. It parses, it throws nothing,
     and every screen that printed it said the same wrong thing quietly. The
     word "undefined" on a screen is the only reason it was ever noticed, and
     reading the screen is what found it. */
  function boardRecentSays(b) {
    if (b.kind !== "run") {
      var n = runProgress(b).total;
      return "a procedure \u00b7 " + n + (n === 1 ? " step" : " steps");
    }
    var p = runProgress(b);
    if (b.closedOn) return "closed \u00b7 " + p.done + " of " + p.total + " done";
    var act = activeNodes(b);
    return (act.length ? (act.length === 1 ? "one step in hand" : act.length + " steps in hand") : "nothing on the go") +
      " \u00b7 " + p.done + " of " + p.total + " done";
  }

  /* What is moving, with a figure for each. A project's percentage is the
     steps done across its boards — derived from `runProgress`, the same
     function the cards use, so the bar and the card can never disagree. A
     project with nothing started reads 0% rather than being hidden, because
     "nothing has begun" is the most useful thing that screen can tell you. */
  /* One place, because the bar is drawn on Home and again on a project's own
     Overview and the two may not disagree — the same fault as `stateTone()`
     and `NODE_INK` being one ladder in two renderings. */
  function barTone(st) {
    if (!st) return "";
    if (st.tone === "late") return "b-late";
    if (st.word === "in hand" || st.word === "to file") return "";
    return "b-idle";
  }

  function projPace(p) {
    var bs = projBoards(p.id).filter(function (b) { return b.kind === "run"; });
    var done = 0, total = 0;
    bs.forEach(function (b) { var r = runProgress(b); done += r.done; total += r.total; });
    return { done: done, total: total, pct: total ? Math.round(done / total * 100) : 0, runs: bs.length };
  }

  function renderHome() {
    var over = dues().filter(function (d) { return d.st === "over"; });
    var tkLate = tasksLate();
    var tk = openTasks();
    var s = stuck();
    var up = upkeepLate();
    /* A DEADLINE THAT HAS GONE IS THE ONE MOST WORTH COUNTING. This filtered
       on `p.endsOn >= today()`, so the tile read "0 deadlines \u00b7 none
       inside a fortnight" directly above a card saying "Balamand print work
       2025 \u2014 past its date". A figure may never disagree with what is on
       the screen below it, and of the two readings the one to keep is
       obvious: a date you have missed does not stop mattering.
       `projState().overdue` is not the test here — that is true for a
       chase as well, and this tile is about dates. A project already
       delivered is out: `endsOn` gone with every run closed and nothing left
       to file is a finished job, not a missed one. */
    var deadlines = projects().filter(function (p) {
      if (!p.endsOn || !dayOk(p.endsOn)) return false;
      if (p.endsOn >= today()) return daysBetween(today(), p.endsOn) <= 14;
      return projState(p).word !== "done";
    }).sort(function (a, b) { return a.endsOn.localeCompare(b.endsOn); });
    var dlGone = deadlines.filter(function (p) { return p.endsOn < today(); }).length;

    var h = '<div class="finding"><h1>' + esc(homeGreeting()) + "</h1>" +
      '<span class="stamp">' + esc(nowWords()) + "</span></div>";

    if (emptyBook()) return h + firstRun();

    /* THE ALARMS COME FIRST AND ARE THE ONLY FULL-WIDTH THING ON THE SCREEN.
       The mockup has no slot for them, and it should: a run finished but not
       filed and upkeep past its interval are the third and the quietest of
       the three forgettings, and both of them outrank a dashboard. Said once,
       and only when true. */
    if (s.length || up.length) {
      h += '<div class="stack tight" style="margin-bottom:0.9rem">';
      if (s.length) {
        h += '<button type="button" class="panel rowbtn late" data-act="tab-waiting">' +
          '<div class="grow"><div class="nm sm">' +
          (s.length === 1 ? "One run is finished but not put away" : cap(numWord(s.length)) + " runs are finished but not put away") +
          "</div><div class=\"says\">A run will not close while a filing step is undone \u2014 which is exactly the thing that gets forgotten.</div></div></button>";
      }
      if (up.length) {
        h += '<button type="button" class="panel rowbtn drift" data-act="tab-waiting">' +
          '<div class="grow"><div class="nm sm">' +
          (up.length === 1 ? "One piece of upkeep is past its interval" : cap(numWord(up.length)) + " pieces of upkeep are past their interval") +
          '</div><div class="says">' + esc(up.slice(0, 3).map(function (x) { return x.cd.label; }).join(" \u00b7 ")) + "</div></div></button>";
      }
      h += "</div>";
    }

    /* ROW ONE: what cannot wait · what is moving · what you open. */
    h += '<div class="hgrid">';

    /* TODAY. Three rows of one shape, each a route to the screen that can do
       something about it — a figure you cannot act on is worse than no
       figure. The sub-line is the fact behind the figure, which is what stops
       "1 deadline" reading as a deadline that is still ahead of you. */
    h += dcard("Today", { label: "View all", act: "tab-waiting" },
      dRow(tk.length, tk.length === 1 ? "task" : "tasks",
           tkLate.length ? cap(numWord(tkLate.length)) + " past its date" : "none past its date",
           tkLate.length ? "late" : "", "task-add") +
      dRow(deadlines.length, deadlines.length === 1 ? "deadline" : "deadlines",
           !deadlines.length ? "none inside a fortnight"
             : dlGone ? cap(numWord(dlGone)) + " already gone \u00b7 " + niceDate(deadlines[0].endsOn)
             : "nearest " + niceDate(deadlines[0].endsOn),
           dlGone ? "late" : "", "tab-jobs") +
      dRow(over.length, over.length === 1 ? "chase" : "chases",
           over.length ? "somebody is waiting on you" : "nobody is waiting",
           over.length ? "late" : "", "tab-waiting"));

    // WHAT IS MOVING — the projects, with the bar in its row's own tone.
    var ps = projects().filter(function (p) { return !p.parked; })
      .map(function (p) { return { p: p, pace: projPace(p), st: projState(p) }; })
      .filter(function (x) { return x.pace.runs || x.p.endsOn; })
      .sort(function (a, b) { return b.pace.pct - a.pace.pct; })
      .slice(0, 4);
    h += dcard("Active projects", { label: "View all", act: "tab-jobs" },
      ps.length ? ps.map(function (x) {
        return '<button type="button" class="drow" data-act="proj-open" data-id="' + x.p.id +
          '" title="' + esc(x.p.name) + '">' +
          '<span class="itile t-proj">' + ICONS.proj + "</span>" +
          '<span class="grow"><span class="nm">' + esc(x.p.name) + "</span>" +
          '<span class="bar ' + barTone(x.st) + '"><i style="width:' + x.pace.pct + '%"></i></span>' +
          '<span class="says">' + esc(x.st.word) + " \u00b7 " + x.pace.done + " of " + x.pace.total +
          (x.pace.total === 1 ? " step done" : " steps done") + "</span></span>" +
          '<span class="dpct">' + x.pace.pct + "%</span></button>";
      }).join("") : '<p class="dempty">Nothing is running. A project with a board under it appears here.</p>');

    /* QUICK RUN. Every row goes through `openHandle()`, so a row exists only
       where there is really something to open — and a path with the
       companion off is a copy, which the row says rather than pretending. */
    var apps = repoIn("app").concat(repoIn("site")).filter(function (a) { return !!openHandle(a); }).slice(0, 5);
    h += dcard("Quick run", { label: "All of it", act: "tab-repo" },
      apps.length ? apps.map(function (a) {
        var hd = openHandle(a), look = assetLook(a);
        var inner = '<span class="dgl">' + look.ico + "</span>" +
          '<span class="grow"><span class="nm">' + esc(a.name) + "</span>" +
          '<span class="says">' + esc(hd.brief || hd.how) + "</span></span>";
        return hd.kind === "copy"
          ? '<button type="button" class="drow" data-act="asset-copy" data-id="' + a.id + '" title="' + esc(a.name + " \u2014 " + hd.how) + '">' + inner + "</button>"
          : '<a class="drow" href="' + esc(hd.href) + '"' + (hd.kind === "url" ? ' target="_blank" rel="noopener"' : "") +
            ' title="' + esc(a.name + " \u2014 " + hd.how) + '">' + inner + "</a>";
      }).join("") : '<p class="dempty">Nothing to open yet. Put the apps and sites you use into Assets and they appear here, one tap each.</p>');

    h += "</div>";

    /* ROW TWO: WHERE WAS I — the second of the three forgettings, and the
       whole reason `updatedAt` is read rather than a recents list stored. */
    var recentB = recentlyTouched({ boards: true }, 4);
    var recentA = recentlyTouched({ assets: true }, 5);
    if (recentB.length || recentA.length) {
      h += '<div class="hgrid two">';
      h += dcard("Continue working", { label: "Workflows", act: "tab-boards" },
        recentB.length ? recentB.map(function (r) {
          /* The mockup tags each of these rows with a short word — Maps,
             Research, 3D \u2014 and the app already has that list: the board's
             KIND, which the reader writes themselves. A project name was the
             obvious choice and the wrong one: "Harbour festival 2026" in a
             pill clipped mid-word at every width, and a pill that has to be
             decoded is worse than no pill. Nothing shows when no kind is
             written rather than a word standing in for one. */
          var b = byId(state.boards, r.id) || {};
          var tag = b.kindId ? kindName(b.kindId) : "";
          return '<button type="button" class="drow" data-act="board-open" data-id="' + r.id +
            '" title="' + esc(r.name) + '">' +
            '<span class="grow"><span class="nm">' + esc(r.name) + "</span>" +
            '<span class="says">' + esc(r.says) + "</span></span>" +
            (tag ? '<span class="pill p-grey dtag">' + esc(tag) + "</span>" : "") +
            '<span class="dmeta">' + esc(agoWords(r.at)) + "</span></button>";
        }).join("") : '<p class="dempty">Nothing opened yet.</p>');
      h += dcard("Recent things", { label: "All of it", act: "tab-repo" },
        recentA.length ? recentA.map(function (r) {
          var a = assetOf(r.id), look = assetLook(a);
          return '<button type="button" class="drow" data-act="asset-open" data-id="' + r.id +
            '" title="' + esc(r.name) + '">' +
            '<span class="itile ' + look.tile + '">' + look.ico + "</span>" +
            '<span class="grow"><span class="nm">' + esc(r.name) + "</span></span>" +
            '<span class="dmeta">' + esc(agoWords(r.at)) + "</span></button>";
        }).join("") : '<p class="dempty">Nothing touched yet.</p>');
      h += "</div>";
    }

    /* This said the same thing in the language of the code \u2014 "read off the
       record by the same function the screen it belongs to uses" is a fact
       about where the figures come from, and the reader is not the person who
       wrote them. What they need from it is whether to trust the numbers. */
    h += '<p class="saynote foot">Nothing on this screen is a second copy. Every figure is counted from the record itself, so it cannot fall behind what the rest of the app says.</p>';
    return h;
  }

  /* A DASHBOARD CARD IS A HEADER AND ROWS, and the header's one action is the
     way into the screen that answers the same question in full. It is built
     here rather than written out five times, so every card on Home is the
     same shape — a bigger or differently-dressed card reads as a more
     important question, and these are five equal ones. */
  function dcard(title, act, body) {
    return '<section class="dcard"><div class="dhead"><h3>' + esc(title) + "</h3>" +
      (act ? '<button type="button" class="dact" data-act="' + act.act + '"' +
             (act.id ? ' data-id="' + act.id + '"' : "") + ">" + esc(act.label) + " \u2192</button>" : "") +
      "</div>" + body + "</section>";
  }

  /* A Today row: a figure, what it counts, and the fact behind it. The dot
     carries the state and the figure takes the state's colour with it, so the
     row says it twice — in a hue and in a word — for a reader who cannot
     separate the two. */
  function dRow(n, unit, says, tone, act) {
    return '<button type="button" class="drow' + (tone ? " " + tone : "") +
      '" data-act="' + act + '"><span class="ddot' + (tone ? " " + tone : "") + '"></span>' +
      '<span class="dfig">' + n + "</span>" +
      '<span class="grow"><span class="nm">' + esc(unit) + "</span>" +
      '<span class="says">' + esc(says) + "</span></span></button>";
  }
  /* The time of day, and nothing else pretending to be personal. A name here
     would have to come from somewhere, and this app asks for nothing. */
  function homeGreeting() {
    var hr = new Date().getHours();
    var w = hr < 5 ? "Still up" : hr < 12 ? "Good morning" : hr < 18 ? "Good afternoon" : "Good evening";
    /* The mockup greets its owner by name. The name comes from Settings and
       from nowhere else, so with none typed this is the time of day on its
       own, exactly as before. First name only: "Good morning, Mohannad Haysam
       Jawhar." is not how anybody is greeted. */
    var nm = ownerName().split(/\s+/)[0];
    return nm ? w + ", " + nm + "." : w + ".";
  }

  function renderWaiting() {
    /* Waiting is already the screen the phone really needs, so field mode
       takes it over rather than adding a seventh tab. Same tab, same place in
       the bar, a different posture. */
    if (fieldOn()) return renderField();
    var list = dues();
    var over = list.filter(function (d) { return d.st === "over"; });
    var calm = list.filter(function (d) { return d.st !== "over"; });
    var s = stuck();
    var up = upkeepLate();

    var h = '<div class="finding"><h1>' + esc(waitingHeadline(over.length, s.length, up.length, tasksLate().length)) + "</h1>" +
      '<span class="stamp">' + esc(nowWords()) + "</span></div>" +
      '<p class="saynote">Nothing will buzz at you. This is the whole list.</p>';

    var tk = openTasks(), tkLate = tasksLate();

    h += '<div class="tools" style="margin:0 0 1rem">' +
      '<button class="btn" data-act="task-add">Write something down</button>' +
      '<button class="btn" data-act="field-on">Field mode</button></div>';

    if (!list.length && !s.length && !tk.length && !live(state.cadences).length) {
      /* "Either everything is done, or nothing has been started" \u2014 the app
         knows which, and offering the reader two readings of their own book
         is the app declining to answer the one question this screen exists
         for. Counted, and said. */
      var anyRun = state.boards.some(function (b) { return b.kind === "run" && !b.closedOn; });
      h += '<p class="empty">Nothing is waiting on you. ' +
        (anyRun ? "Every open run is sitting on a step in your hands, or on nothing at all."
                : "Nothing is running \u2014 start a run of a procedure and its steps appear here.") +
        "</p>";
      return h;
    }

    if (over.length) h += '<div class="stack">' + over.map(lateCard).join("") + "</div>";

    if (s.length) {
      h += '<div class="sect">Finished, but not put away</div><div class="stack">' +
        s.map(function (b) {
          var uf = unfiled(b);
          return '<div class="panel dashed"><div class="grow">' +
            '<div class="nm">' + esc(uf.length === 1 ? uf[0].label : b.name) + "</div>" +
            /* Lowercasing the first letter put "while archive the files is
               undone" on screen — the same defect as Coffer's "pausing cyprus
               move". A step's name is written as it was written, in quotes. */
            '<div class="says">It looks done from the outside. It is not, and the run knows: it will not close while ' +
            esc(uf.map(function (n) { return "\u201c" + n.label + "\u201d"; }).join(" and ")) +
            (uf.length === 1 ? " is" : " are") + " undone.</div></div>" +
            '<div class="acts"><button class="btn" data-act="board-open" data-id="' + b.id + '">Open it</button></div></div>';
        }).join("") + "</div>";
    }

    /* The typed ones, in their own section and said to be typed. A late task
       goes above the calm dues for the same reason a late send does — a date
       gone by outranks a wait that is fine. */
    if (tkLate.length) {
      h += '<div class="sect">Written down, and past its date</div><div class="stack tight">' +
        tkLate.map(taskRow).join("") + "</div>";
    }

    /* IN YOUR HANDS IS NOT WAITING, and this screen is the one that answers
       "what happens next". Everything that was not late went under one
       heading reading "Waiting, and that is fine" — including every step
       nobody else is holding up, which is the opposite of what it says.
       Start a run and its first step landed there: the app filed the one
       thing you could actually get on with under a sentence telling you it
       was fine to do nothing. Two sections, and the yours-to-do one comes
       first, beside the other two things that are yours (the unfiled runs
       above it and the typed lines below). `calmRow` already wrote the right
       words for both cases — "In your hands. Waiting on nobody but you"
       was being printed under a heading that contradicted it. */
    var mine = calm.filter(function (d) { return d.st !== "waiting"; });
    var theirs = calm.filter(function (d) { return d.st === "waiting"; });
    if (mine.length) {
      h += '<div class="sect">In your hands</div><div class="stack tight">' +
        mine.map(calmRow).join("") + "</div>";
    }
    if (theirs.length) {
      h += '<div class="sect">Waiting, and that is fine</div><div class="stack tight">' +
        theirs.map(calmRow).join("") + "</div>";
    }

    var tkCalm = tk.filter(function (t) { return !taskLate(t); });
    if (tkCalm.length) {
      h += '<div class="sect">Written down</div><div class="stack tight">' +
        tkCalm.map(taskRow).join("") + "</div>";
    }

    h += upkeepCard();
    /* This line used to say "nothing here was typed in by hand", and with
       tasks on the screen that would be a screen contradicting itself. It says
       which half is which instead. */
    h += '<p class="saynote foot">' +
      (tk.length
        ? "Everything above the written-down sections came out of a procedure or out of a day passing. The written-down ones are yours."
        : "Nothing here was typed in by hand. Every line came out of a procedure, or out of a day passing.") +
      "</p>";
    return h;
  }

  // The headline is the reading, so it has to be true for every shape of list —
  // including the one where nothing is late but something is unfiled.
  /* A FIGURE MAY NEVER DISAGREE WITH ITS OWN PARTS, and a headline is a
     figure. Left counting only derived dues, it read "Nothing is late." above
     a rose row saying a typed task was past its date — so `tkLate` is folded
     into the first branch, because a late thing is a late thing however it
     got onto the list. */
  function waitingHeadline(late, stuckN, upN, tkLate) {
    late = (late || 0) + (tkLate || 0);
    if (late) return late === 1 ? "One thing is late." : cap(numWord(late)) + " things are late.";
    if (stuckN) return stuckN === 1 ? "One run is finished but not put away."
                                    : cap(numWord(stuckN)) + " runs are finished but not put away.";
    if (upN) return upN === 1 ? "One piece of upkeep is past its interval."
                              : cap(numWord(upN)) + " pieces of upkeep are past their interval.";
    return "Nothing is late.";
  }
  function numWord(n) {
    var w = ["no", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten"];
    return w[n] || String(n);
  }
  // The headline opens a sentence, so the word that starts it is capitalised
  // there rather than in the list — "three things are late." read as a fragment.
  function cap(t) { return t ? t.charAt(0).toUpperCase() + t.slice(1) : t; }
  function clockNow() {
    var d = new Date();
    return pad2(d.getHours()) + ":" + pad2(d.getMinutes());
  }
  /* Named nowWords, not stampNow: the sync module already declares stampNow in
     this same scope, and a later function declaration wins — so the first
     version of this printed a raw sync timestamp on the screen. The orphan scan
     cannot catch that, because both names are used. */
  function nowWords() {
    var d = new Date();
    return dayName(iso(d), "long") + " " + d.getDate() + " " +
      parseISO(today()).toLocaleDateString(undefined, { month: "long" }) + ", " + clockNow();
  }

  // A late thing is a tinted panel: the fill is the alarm, so no pill is needed
  // to say so. The figure on the right is the total wait; the line under it is
  // how far past the chase, which is the part you can act on.
  function lateCard(d) {
    var b = d.board, n = d.node;
    var who = recipientsOf(b, n).map(function (t) { return t.label; }).join(" and ");
    var named = !!who;
    var days = d.days;
    var chased = chaseCount(n);

    var why = named
      ? (d.over === 1 ? "A day past your reminder" : d.over + " days past your reminder")
      : (d.over === 1 ? "A day past your own check-back" : d.over + " days past your own check-back");

    var acts = named
      ? '<button class="btn loud" data-act="step-chased" data-id="' + b.id + ":" + n.id + '">I chased today</button>' +
        '<button class="btn" data-act="step-done" data-id="' + b.id + ":" + n.id + '">It came back</button>'
      : '<button class="btn loud" data-act="step-chased" data-id="' + b.id + ":" + n.id + '">I looked today</button>' +
        '<button class="btn" data-act="step-done" data-id="' + b.id + ":" + n.id + '">It happened</button>';

    return '<div class="panel late' + (named ? "" : " unnamed") + '">' +
      '<span class="st ' + (named ? "late" : "watch") + '"><i></i>' +
      (named ? "Late" : "Unchecked") + "</span>" +
      '<div class="grow"><div class="nm">' +
      esc(named ? who + " — " + n.label.toLowerCase() : n.label) + "</div>" +
      '<div class="says">' + esc(b.name + (b.benchId ? " · " + benchLabel(b.benchId) : "")) +
      (named ? "" : " · nobody named, so this is yours to check") + "</div></div>" +
      '<div class="bigage"><b>' + days + (days === 1 ? " day" : " days") + "</b>" +
      '<span>' + esc(why) + (chased ? ", chased " + chased + (chased === 1 ? " time" : " times") : "") + "</span></div>" +
      '<div class="acts">' + acts + "</div></div>";
  }

  // Not late, so it takes no colour and no pill — one line saying why it is
  // waiting, which is the only thing that distinguishes these from each other.
  function calmRow(d) {
    var b = d.board, n = d.node;
    var dated = n.dueAt && d.st === "waiting";
    var says, right;

    if (dated) {
      var away = daysBetween(today(), n.dueAt);
      says = esc(b.name);
      right = esc(niceDate(n.dueAt) + (away > 0 ? ", in " + away + (away === 1 ? " day" : " days") : ""));
    } else if (d.st === "waiting") {
      /* Which run it is on, then why it is waiting. The board's name was
         missing from both of these branches, so a screen listing steps from
         five runs printed "Digitise the layers" with nothing saying which
         piece of work it belonged to — and the one row you could act on
         was the one that said least about itself. */
      says = esc(b.name) + " · " + (n.chaseDays
        ? "you will chase this after " + n.chaseDays + (num(n.chaseDays) === 1 ? " day" : " days")
        : "no reminder set, so it can wait for ever");
      right = "waiting " + d.days + "d";
    } else {
      /* "In your hands. Waiting on nobody but you" was the whole line, which
         under a heading now reading "In your hands" says the same thing
         twice and still never names the work. The heading carries the
         meaning; the row carries the fact. */
      says = esc(b.name) + (b.benchId ? " · " + esc(benchLabel(b.benchId)) : "");
      right = d.days ? "in hand " + d.days + "d" : "started today";
    }

    return '<div class="panel calm' + (dated ? " dated" : "") + '">' +
      '<div class="grow"><div class="nm sm">' + esc(n.label) + "</div>" +
      '<div class="says">' + says + "</div></div>" +
      '<div class="age' + (dated ? " ok" : "") + '">' + right + "</div>" +
      '<div class="acts"><button class="btn quiet" data-act="board-open" data-id="' + b.id + '">Board</button>' +
      (n.act === "ask"
        ? '<button class="btn quiet" data-act="step-answer" data-id="' + b.id + ":" + n.id + '">Answer</button>'
        : '<button class="btn quiet" data-act="step-done" data-id="' + b.id + ":" + n.id + '">Done</button>') +
      "</div></div>";
  }

  /* ================= Kit ================= */

  /* The list of jobs, and then one job with everything about it on one page.
     There is no Kit tab any more: the software, the links and the note about
     where you left off are sections of the job that hands them to you, which is
     where you would look for them. */
  function jobDialog(j) {
    openModal({
      title: j ? "Rename the job" : "New job",
      message: j ? "" : "A job is one engagement — an employer, a scholarship, a visa, a thesis. It holds the benches you sit at for it and the boards you run for it.",
      confirmLabel: j ? "Save" : "Create",
      fields: [
        { key: "name", label: "Called", type: "text", span: true, value: j ? j.name : "",
          placeholder: "AUB Tripoli 21st Century" },
        { key: "note", label: "Where you left off", type: "text", span: true, value: j ? (j.note || "") : "",
          hint: "One line, for the version of you that comes back to it." }
      ],
      validate: function (v) { return v.name.trim() ? null : "Give it a name."; },
      onConfirm: function (v) {
        go(function () {
          var t = j;
          if (!t) { t = { id: uid(), software: [], links: [], archived: false }; state.jobs.push(t); }
          t.name = v.name.trim();
          if ((v.note || "").trim() !== (t.note || "")) { t.note = v.note.trim(); t.noteAt = nowStamp(); }
        });
      }
    });
  }
  function jobSwDialog(j) {
    if (!j) return;
    openModal({
      title: "Add software", confirmLabel: "Add",
      message: "A name, and the path you would paste into Win+R to open it.",
      fields: [
        { key: "label", label: "Name", type: "text", span: true, value: "", placeholder: "ArcGIS Pro" },
        { key: "path", label: "Path", type: "text", span: true, value: "",
          hint: "Left blank it is just a reminder that this job uses it." }
      ],
      validate: function (v) { return v.label.trim() ? null : "Give it a name."; },
      onConfirm: function (v) {
        go(function () {
          j.software = j.software || [];
          j.software.push({ id: uid(), label: v.label.trim(), path: v.path.trim() });
        });
      }
    });
  }
  function jobLinkDialog(j) {
    if (!j) return;
    openModal({
      title: "Add a link", confirmLabel: "Add",
      fields: [
        { key: "label", label: "Name", type: "text", span: true, value: "", placeholder: "AUB mail, this project" },
        { key: "url", label: "URL", type: "text", span: true, value: "",
          placeholder: "obsidian://search?query=AUB", hint: "Any scheme, not only http." }
      ],
      validate: function (v) {
        if (!v.label.trim()) return "Give it a name.";
        if (!/^[a-z][a-z0-9+.-]*:/i.test(v.url.trim())) return "A URL needs a scheme — https:, obsidian:, mailto: and so on.";
        return null;
      },
      onConfirm: function (v) {
        go(function () {
          j.links = j.links || [];
          j.links.push({ id: uid(), label: v.label.trim(), url: v.url.trim() });
        });
      }
    });
  }

  /* ================= the calendar =================

     A month of what is already dated, and nothing typed into it. It computes
     nothing of its own — the same rule the report lives by — so every mark on
     it comes from the function the rest of the app reads: a dated step from the
     board that holds it, a chase that has come due from overdueBy(), a cadence
     from cadenceState(). If a figure here ever disagrees with Waiting, one of
     them is wrong and it will not be silent about which.

     There is nothing to add here on purpose. A calendar you can type into is a
     second place for a commitment to live, and then two places disagree. */
  var calMonth = "";   // view state, never saved

  function calOf() { return calMonth || String(today()).slice(0, 7); }
  function monthDays(ym) {
    var first = parseISO(ym + "-01");
    var out = [], d = new Date(first);
    while (iso(d).slice(0, 7) === ym) { out.push(iso(d)); d.setDate(d.getDate() + 1); }
    return out;
  }
  function shiftMonth(ym, by) {
    var d = parseISO(ym + "-01");
    d.setMonth(d.getMonth() + by);
    return iso(d).slice(0, 7);
  }
  function monthName(ym) {
    return parseISO(ym + "-01").toLocaleDateString(undefined, { month: "long", year: "numeric" });
  }

  // Everything already dated, keyed by day. Derived, never stored.
  function calMarks(ym) {
    var by = {};
    function put(day, mark) { if (!day) return; (by[day] = by[day] || []).push(mark); }

    boards("run").forEach(function (b) {
      if (b.closedOn) return;
      activeNodes(b).forEach(function (n) {
        /* `.slice(0, 7) === ym` on THIS branch too. It was the only one
           without the test, which the grid never noticed because it reads
           `by[day]` for the days of the month it is drawing and nothing else
           — so a step dated in November sat in September's map, unread. The
           moment a second caller walked the map itself (`upcoming()`, over
           three months), every dated step came back three times. A function
           called `calMarks(ym)` has to return the marks in `ym`: a name that
           is only true for its first caller is a trap laid for the second. */
        if (n.dueAt && String(n.dueAt).slice(0, 7) === ym) {
          put(n.dueAt, { tone: "dated", label: n.label, where: b.name, id: b.id });
        }
        // The day a chase falls due, which is a date you can plan around even
        // though nobody wrote it down.
        if (n.chaseDays && n.enteredAt) {
          var due = addDays(stampDay(n.chasedAt || n.enteredAt), num(n.chaseDays));
          if (due.slice(0, 7) === ym) {
            var over = overdueBy(n) > 0;
            put(due, { tone: over ? "late" : "chase",
                       label: (over ? "Chase " : "Chase due · ") + n.label, where: b.name, id: b.id });
          }
        }
      });
    });

    live(state.cadences).forEach(function (cd) {
      if (!cd.lastDoneOn || !cd.everyDays) return;
      var due = addDays(cd.lastDoneOn, num(cd.everyDays));
      if (due.slice(0, 7) !== ym) return;
      put(due, { tone: due < today() ? "late" : "upkeep", label: cd.label,
                 where: placeLabel(cd.place), id: "" });
    });

    /* A project's due date is the one dated thing in the app that nobody has
       to work out — it was typed on the project — so it belongs here more
       plainly than anything else on the month. A date already gone with the
       work unfinished draws late, which is the same reading `projState()`
       gives it; the calendar still computes none of that itself. */
    projects().forEach(function (p) {
      if (!p.endsOn || !dayOk(p.endsOn) || p.endsOn.slice(0, 7) !== ym) return;
      var pst = projState(p);
      put(p.endsOn, { tone: pst.overdue ? "late" : "due",
                      label: p.name + " due", where: projSays(p),
                      id: p.id, act: "proj-open" });
    });

    /* A task's date is the same kind of fact as a project's: typed, not
       worked out. It belongs on the month for exactly that reason — the
       calendar is where you look for what is dated, and a typed line with a
       day on it that appeared nowhere on it would be the one thing the tab
       exists for and cannot show. */
    openTasks().forEach(function (t) {
      if (!t.dueAt || !dayOk(t.dueAt) || t.dueAt.slice(0, 7) !== ym) return;
      put(t.dueAt, { tone: taskLate(t) ? "late" : "due", label: t.label,
                     where: "written down", id: "", act: "" });
    });

    return by;
  }

  /* WHAT IS COMING, ACROSS MONTHS. The month grid answers "what is dated in
     September"; the mockup's Schedule panel also carries an Upcoming list,
     which is the question you actually have on the 28th — the next few
     things, whichever month they fall in. It reads `calMarks()` for this
     month and the two after it rather than walking the record again: two
     walks would eventually answer one question differently, which is the rule
     the report and the adviser both live by. */
  function upcoming(n) {
    var out = [], ym = String(today()).slice(0, 7);
    for (var i = 0; i < 3; i++) {
      var by = calMarks(ym);
      Object.keys(by).forEach(function (day) {
        if (day < today()) return;
        by[day].forEach(function (m) { out.push({ day: day, m: m }); });
      });
      var d = parseISO(ym + "-01");
      ym = iso(new Date(d.getFullYear(), d.getMonth() + 1, 1)).slice(0, 7);
    }
    out.sort(function (a, b) { return a.day.localeCompare(b.day); });
    return out.slice(0, n || 6);
  }

  function renderCal() {
    var ym = calOf(), days = monthDays(ym), by = calMarks(ym);
    var first = parseISO(ym + "-01").getDay();          // 0 = Sunday
    var lead = (first + 6) % 7;                          // weeks start Monday
    var count = Object.keys(by).reduce(function (n, k) { return n + by[k].length; }, 0);

    var h = '<div class="finding"><h1>' + esc(monthName(ym)) + "</h1>" +
      '<span class="stamp">' + (count ? count + (count === 1 ? " thing is dated" : " things are dated")
                                      : "nothing dated this month") + "</span></div>" +
      /* "A cadence" is the word in the code and nowhere on screen: every
         other surface calls it upkeep. A screen may not use a word it has
         not defined \u2014 the same rule that took "out of promises" out of
         Coffer's afford card. */
      '<p class="saynote">Everything here came off a board, a task or a piece of upkeep. There is nothing to add: a calendar you can type into is a second place for a commitment to live, and then two places disagree.</p>' +
      '<div class="tools" style="margin-bottom:1rem">' +
      /* "Back · This month · On" — "On" was nobody's word for next month. The
         same three the week uses, so one habit covers both screens. */
      '<button class="btn" data-act="cal-move" data-id="-1">\u2039 earlier</button>' +
      '<button class="btn" data-act="cal-move" data-id="0">this month</button>' +
      '<button class="btn" data-act="cal-move" data-id="1">later \u203a</button></div>';

    h += '<div class="cal">';
    ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].forEach(function (d) {
      h += '<div class="cal-dow">' + d + "</div>";
    });
    for (var i = 0; i < lead; i++) h += '<div class="cal-pad"></div>';
    days.forEach(function (day) {
      var marks = by[day] || [];
      h += '<div class="cal-day' + (day === today() ? " now" : "") + (marks.length ? " has" : "") + '">' +
        '<div class="cal-n">' + Number(day.slice(8)) + "</div>" +
        marks.slice(0, 3).map(function (m) {
          // A button when it opens something, a plain div when it does not:
          // a div with a click handler is invisible to the keyboard.
          var tag = m.id ? "button" : "div";
          return "<" + tag + ' class="cal-m t-' + m.tone + '"' +
            (m.id ? ' type="button" data-act="' + (m.act || "board-open") +
                    '" data-id="' + m.id + '"' : "") +
            ' title="' + esc(m.label + " \u2014 " + m.where) + '">' + esc(clip(m.label, 38)) +
            "</" + tag + ">";
        }).join("") +
        (marks.length > 3 ? '<div class="cal-more">+' + (marks.length - 3) + " more</div>" : "") +
        "</div>";
    });
    h += "</div>";

    /* Seven columns across 390px is 47px a cell, and a month grid on a phone
       draws every entry as "Chase As…" clipped mid-word. So the same month is
       also written as a list, in date order, and CSS shows whichever one the
       screen can carry — rendered both ways rather than measured, because a
       render that reads the window width is a render that is wrong after a
       resize. Same reasoning as the sheet on the laptop and the rows on the
       phone. */
    /* Under the grid on a wide screen, where the grid says what is dated in
       the month you are looking at and this says what is next whatever month
       it is in. On a phone the list below already reads in date order, so
       printing both would be the same information twice. */
    var up = upcoming(6);
    if (up.length) {
      h += '<div class="upcbox"><div class="sect">Upcoming</div>' + up.map(function (x) {
        var tag = x.m.id ? "button" : "div";
        return "<" + tag + ' class="upc t-' + x.m.tone + '"' +
          (x.m.id ? ' type="button" data-act="' + (x.m.act || "board-open") + '" data-id="' + x.m.id + '"' : "") +
          ' title="' + esc(x.m.label + " — " + x.m.where) + '">' +
          '<span class="upcd"><b>' + Number(x.day.slice(8)) + "</b><small>" +
          esc(parseISO(x.day).toLocaleDateString(undefined, { month: "short" })) + "</small></span>" +
          '<span class="grow"><span class="nm">' + esc(x.m.label) + "</span>" +
          '<span class="says">' + esc(x.m.where) + "</span></span>" +
          /* The badge already says the date, so this says WHICH DAY it is —
             "20 SEP ... Sep 20" was the same fact twice on one row. */
          '<span class="dmeta">' + esc(x.day === today() ? "today"
            : x.day === addDays(today(), 1) ? "tomorrow" : dayName(x.day)) + "</span></" + tag + ">";
      }).join("") + "</div>";
    }

    h += '<div class="calist">';
    var listed = days.filter(function (d) { return (by[d] || []).length; });
    if (!listed.length) {
      h += '<p class="empty">Nothing is dated this month.</p>';
    } else {
      listed.forEach(function (day) {
        h += '<div class="cl-day' + (day === today() ? " now" : "") + '"><b>' +
          Number(day.slice(8)) + "</b><span>" + esc(dayName(day)) +
          (day === today() ? " \u00b7 today" : "") + "</span></div>";
        (by[day] || []).forEach(function (m) {
          var tag = m.id ? "button" : "div";
          h += "<" + tag + ' class="cl-row t-' + m.tone + '"' +
            (m.id ? ' type="button" data-act="' + (m.act || "board-open") +
                    '" data-id="' + m.id + '"' : "") +
            '><div class="grow"><div class="nm sm">' + esc(m.label) + "</div>" +
            '<div class="says">' + esc(m.where) + "</div></div></" + tag + ">";
        });
      });
    }
    h += "</div>";
    return h;
  }

  /* ================= PROJECTS =================

     "Project-based organization" is the first line of the poster's Key
     Features, and this tab was landing on a list of EMPLOYERS. Both levels
     are real and both are kept — a job is who the work is for and holds the
     benches, the kit and the hours; a project is what you are actually doing,
     and a thesis or a visa belongs to no employer at all. What changed is
     which one you arrive at: the work first, who it is for behind a strip
     press. Before this, the two projects with nobody paying for them were the
     only ones on the landing screen, and everything else was two taps down
     inside a bag named after a university.

     One strip, two questions: what am I working on, and who is it for. */
  var PROJ_LIST = [
    { id: "projects", label: "Projects" },
    { id: "jobs",     label: "Jobs" }
  ];
  var projList = "projects";   // view state, resets on a tab press

  function renderProjectsTab() {
    var ps = projects(), js = jobs();
    var h = '<div class="finding"><h1>' +
      (ps.length ? (ps.length === 1 ? "One project." : cap(numWord(ps.length)) + " projects.")
                 : "No projects yet.") + "</h1></div>" +
      '<p class="saynote">A project is what you are working on. A job is who it is for — and plenty of work belongs to no employer at all, which is why neither contains the other.</p>';

    h += '<div class="subnav">' + PROJ_LIST.map(function (pg) {
      var n = pg.id === "projects" ? ps.length : js.length;
