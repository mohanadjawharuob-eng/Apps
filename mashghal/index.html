      return '<button class="btn' + (pg.id === projList ? " primary" : "") +
        '" data-act="proj-list" data-id="' + pg.id + '">' + pg.label +
        (n ? ' <span class="cnt">' + n + "</span>" : "") + "</button>";
    }).join("") + "</div>";

    return h + (projList === "jobs" ? jobsPage(js) : projectsPage(ps));
  }

  /* EVERY PROJECT, WORST FIRST, whoever it is for. The order is the one the
     rest of the app uses for work — late, then past its date, then what is
     still to file, then what is in hand — read off `projState()`, so this
     list can never rank a project differently from the way its own page
     describes it. */
  function projectsPage(ps) {
    var h = '<div class="tools" style="margin:0.2rem 0 0.9rem">' +
      '<button class="btn primary" data-act="proj-add">New project</button>' +
      '<button class="btn" data-act="board-new">New procedure</button></div>';
    if (!ps.length) {
      return h + '<p class="empty">Nothing yet. A project is a bounded piece of work with an end to it — the harbour brochure, the aerial survey, the thesis. Procedures and runs hang off it, and what it produces is filed under it.</p>';
    }
    var rank = { late: 0, "past its date": 1, "to file": 2, "in hand": 3, "set down": 4 };
    var rows = ps.slice().sort(function (a, b) {
      var ra = rank[projState(a).word], rb = rank[projState(b).word];
      ra = ra === undefined ? 5 : ra; rb = rb === undefined ? 5 : rb;
      if (ra !== rb) return ra - rb;
      return String(a.name).localeCompare(String(b.name));
    });
    return h + '<div class="stack tight">' + rows.map(projRow).join("") + "</div>";
  }

  function jobsPage(js) {
    var h = '<div class="tools" style="margin:0.2rem 0 0.9rem">' +
      '<button class="btn primary" data-act="job-add">New job</button>' +
      '<button class="btn" data-act="tab-vocab">The workbench</button></div>' +
      '<p class="hint" style="margin:0 0 0.9rem">A job is a bag: the benches you sit at for it, the boards you run for it, the hours owed by it, and what it hands you when you arrive.</p>';

    if (!js.length) {
      h += '<p class="empty">No jobs yet. One is AUB Tripoli 21st Century, or a funder, or a university — anything that has its own work and its own things. Work that belongs to nobody needs no job at all.</p>';
    } else {
      h += '<div class="stack">' + js.map(function (j) {
        var d = jobDues(j.id), late = d.filter(function (x) { return x.st === "over"; }).length;
        var bs = jobBoards(j.id).filter(function (b) { return b.kind === "run" && !b.closedOn; });
        return '<button type="button" class="panel rowbtn' + (late ? " late" : "") +
          '" data-act="job-open" data-id="' + j.id + '">' +
          '<span class="itile t-job">' + ICONS.jobs + "</span>" +
          '<div class="grow"><div class="nm">' + esc(j.name) + "</div>" +
          '<div class="says">' + esc(jobSays(j, bs.length, d.length)) + "</div></div>" +
          (late ? '<div class="bigage"><b>' + late + "</b><span>late</span></div>" : "") + "</button>";
      }).join("") + "</div>";
    }

    /* Work under no job is not an error state and is not hidden: it is the
       brief's "life underneath that belongs to none of them", and on the Jobs
       page it is the one thing the list above cannot show. */
    var loose = projects().filter(function (p) { return !p.jobId || !jobOf(p.jobId); });
    if (loose.length) {
      h += '<div class="sect">Yours, under no job</div><div class="stack tight">' +
        loose.map(projRow).join("") + "</div>";
    }
    return h;
  }

  function jobSays(j, runs, waiting) {
    var bits = [];
    var bn = jobBenches(j.id).length;
    var pn = jobProjects(j.id).length;
    if (pn) bits.push(pn + (pn === 1 ? " project" : " projects"));
    bits.push(bn ? bn + (bn === 1 ? " bench" : " benches") : "no bench yet");
    bits.push(runs ? runs + (runs === 1 ? " run under way" : " runs under way") : "nothing running");
    if (waiting) bits.push(waiting + " waiting on you");
    if (j.note) bits.push("you left off: " + j.note);
    return bits.join(" · ");
  }

  /* The page around the derived sheet. Deliberately thin: a heading, a way
     back, and the sheet — because the job page below it already says
     everything in words, and this screen exists to say it in one shape. */
  function renderJobMap(j) {
    var d = jobDues(j.id);
    var late = d.filter(function (x) { return x.st === "over"; }).length;
    var bs = jobBoards(j.id);
    var runs = bs.filter(function (b) { return b.kind === "run" && !b.closedOn; });

    var h = '<div class="page-head"><div><h2>' + esc(j.name) + "</h2>" +
      "<p>Every project and every board in this job, on one sheet. A tap opens one.</p>" +
      '<div class="stand">' +
      '<span class="sp muted">' + jobProjects(j.id).length +
        (jobProjects(j.id).length === 1 ? " project" : " projects") + "</span>" +
      '<span class="sp muted">' + bs.length + (bs.length === 1 ? " board" : " boards") + "</span>" +
      (late ? '<span class="sp"><i class="d-late"></i>' + cap(numWord(late)) + " late</span>" : "") +
      (runs.length ? '<span class="sp"><i class="d-hand"></i>' + cap(numWord(runs.length)) +
        (runs.length === 1 ? " run under way" : " runs under way") + "</span>" : "") +
      "</div></div>" +
      '<div class="tools">' +
      '<button class="btn" data-act="job-map-close" data-id="' + j.id + '">Back to the job</button>' +
      "</div></div>";

    /* No sheet toolbar: there is nothing to add to a sheet nobody authored.
       The zoom, Fit, Tidy and Fill buttons come from sheetHtml itself, which
       is what makes this screen worth having on a phone at all. */
    h += canvasHtml(jobMap, "");
    if (!bs.length && !jobProjects(j.id).length) {
      h += '<p class="empty">Nothing in this job yet. A project is a bounded piece of work with a date; a board is a procedure you run. Either one makes this sheet worth looking at.</p>';
    }
    return h;
  }

  function renderJob(j) {
    var d = jobDues(j.id);
    var late = d.filter(function (x) { return x.st === "over"; }).length;
    var runs = jobBoards(j.id).filter(function (b) { return b.kind === "run" && !b.closedOn; });
    var tpls = jobBoards(j.id).filter(function (b) { return b.kind === "template"; });

    var tools = '<div class="tools">' +
      '<button class="btn" data-act="job-back">All jobs</button>' +
      /* First after the way out, because it is the thing you came to the job
         page to see: where all of this actually stands. */
      '<button class="btn primary" data-act="job-map" data-id="' + j.id + '">The whole job</button>' +
      '<button class="btn" data-act="job-edit" data-id="' + j.id + '">Rename</button>' +
      '<button class="btn" data-act="proj-add" data-id="' + j.id + '">New project</button>' +
      '<button class="btn" data-act="task-add-job" data-id="' + j.id + '">Something to do</button>' +
      '<button class="btn" data-act="job-sw-add" data-id="' + j.id + '">Add software</button>' +
      '<button class="btn" data-act="job-link-add" data-id="' + j.id + '">Add a link</button>' +
      '<button class="btn danger" data-act="job-del" data-id="' + j.id + '">Delete</button></div>';

    var h = '<div class="page-head"><div><h2>' + esc(j.name) + "</h2>" +
      "<p>" + esc(jobSays(j, runs.length, d.length)) + "</p>" +
      '<div class="stand">' +
      (late ? '<span class="sp"><i class="d-late"></i>' + cap(numWord(late)) + " late</span>" : "") +
      (d.length - late ? '<span class="sp"><i class="d-hand"></i>' + cap(numWord(d.length - late)) + " in hand</span>" : "") +
      (!d.length ? '<span class="sp muted">Nothing waiting</span>' : "") +
      "</div></div>" + tools + "</div>";

    // Where you sit for this job — one tap each.
    var bs = jobBenches(j.id);
    h += '<div class="sect">Where you sit for it</div>';
    h += bs.length ? '<div class="tools">' + bs.map(function (bn) {
      var here = openSpan() && openSpan().benchId === bn.id;
      return '<button class="btn' + (here ? " primary" : "") + '" data-act="bench-go" data-id="' + bn.id + '">' +
        esc(benchLabel(bn.id)) + (here ? " · here now" : "") + "</button>";
    }).join("") + "</div>"
      : '<p class="empty">No bench yet. A bench is a claimant and a craft together — add one on the workbench, under Words.</p>' +
        '<div class="tools"><button class="btn" data-act="kit-words">The workbench \u00b7 Words</button></div>';

    if (j.note) {
      h += '<div class="sect">Where you left off</div>' +
        '<div class="panel calm"><div class="grow"><div class="nm sm">' + esc(j.note) + "</div>" +
        '<div class="says">' + esc(j.noteAt ? "Written " + agoWords(j.noteAt) : "") + "</div></div></div>";
    }

    /* Typed lines against this job, above the projects: it is the half of
       the page nothing else in the app will remind you about, because unlike
       a due it was never derived from anything. */
    var jt = tasksFor("job", j.id);
    if (jt.length) {
      h += '<div class="sect">Written down for this job</div><div class="stack tight">' +
        jt.map(taskRow).join("") + "</div>";
    }

    /* The projects come before the loose boards, because a project is the
       thing you mean when you say what you are working on — and the boards
       under it are how it gets done. */
    var ps = jobProjects(j.id);
    h += '<div class="sect">Projects</div>';
    h += ps.length ? '<div class="stack tight">' + ps.map(projRow).join("") + "</div>"
      : '<p class="empty">No project yet. A project is a bounded piece of work with a date — the 2026 season, the harbour report — and its boards hang under it.</p>';

    /* Only the boards that are NOT in a project. A board inside one is listed
       on its project's page; printing it twice made the job page read as
       though there were two of everything. */
    var free = looseBoards(j.id);
    var freeRuns = free.filter(function (b) { return b.kind === "run" && !b.closedOn; });
    var freeTpls = free.filter(function (b) { return b.kind === "template"; });

    h += '<div class="sect">On its own — not in a project</div>';
    h += freeRuns.length ? '<div class="stack tight">' + freeRuns.map(function (b) {
      var bd = dues().filter(function (x) { return x.board.id === b.id; });
      var bl = bd.filter(function (x) { return x.st === "over"; }).length;
      return '<button type="button" class="panel rowbtn calm' + (bl ? " late" : "") +
        '" data-act="board-open" data-id="' + b.id + '">' +
        '<div class="grow"><div class="nm sm">' + esc(b.name) + "</div>" +
        '<div class="says">' + (bl ? bl + " late · " : "") + bd.length + " waiting · " +
        runProgress(b).done + " of " + runProgress(b).total + " done</div></div></button>";
    }).join("") + "</div>"
      : '<p class="empty">Nothing running outside a project.</p>';

    if (freeTpls.length) {
      h += '<div class="sect">Procedures for it</div><div class="stack tight">' + freeTpls.map(function (b) {
        var ns = b.nodes.filter(function (n) { return n.t === "step"; }).length;
        return '<button type="button" class="panel rowbtn calm" data-act="board-open" data-id="' + b.id + '">' +
          '<div class="grow"><div class="nm sm">' + esc(b.name) + "</div>" +
          '<div class="says">' + ns + (ns === 1 ? " step" : " steps") + "</div></div></button>";
      }).join("") + "</div>";
    }

    h += '<div class="sect">What it hands you</div>';
    var sw = j.software || [], lk = j.links || [];
    h += (sw.length || lk.length) ? '<div class="stack tight">' +
      sw.map(function (x) {
        return '<div class="panel calm"><div class="grow"><div class="nm sm">' + esc(x.label) + "</div>" +
          '<div class="says">' + esc(x.path || "no path — just a reminder that this job uses it") + "</div></div>" +
          '<div class="acts">' + (x.path ? '<button class="btn quiet" data-act="job-sw-copy" data-id="' +
          j.id + ":" + x.id + '">Copy path</button>' : "") +
          '<button class="btn quiet danger" data-act="job-sw-del" data-id="' + j.id + ":" + x.id + '">×</button></div></div>';
      }).join("") +
      lk.map(function (x) {
        return '<div class="panel calm"><div class="grow"><div class="nm sm">' + esc(x.label) + "</div>" +
          '<div class="says">' + esc(x.url) + "</div></div>" +
          '<div class="acts"><a class="btn quiet" href="' + esc(x.url) + '" target="_blank" rel="noopener">Open</a>' +
          '<button class="btn quiet danger" data-act="job-link-del" data-id="' + j.id + ":" + x.id + '">×</button></div></div>';
      }).join("") + "</div>"
      : '<p class="empty">Nothing yet. A path you would paste into Win+R, or a link to the filtered inbox for this job.</p>';
    return h;
  }

  /* ================= the workbench =================

     This was one page called "Kit" with six sections on it: claimants, modes,
     benches, things, upkeep and board kinds. Once the registry grew past four
     pieces of hardware it stood 3,300 pixels tall, which is Coffer's Today
     tab all over again — the screen everybody scrolls past. Coffer's rule
     applies: a page past about three cards has stopped answering one
     question, so split it or give it a strip.

     A strip, because these are three questions and not three levels: **Things**
     (the registry), **Upkeep** (what has to be done to them every so often)
     and **Words** (the vocabulary the app has none of its own). Which one is
     open is view state like everything else, and the tab always lands on
     Things — the one opened daily.

     It is also no longer called Kit. Its owner said, of the version that was:
     "the kit i didn't really get the way it's working and what is what the
     vocab is kinda weird to get". */

  var kitTab = "things";   // view state, never saved

  var KIT_PAGES = [
    { id: "things", label: "Things" },
    { id: "people", label: "People" },
    { id: "upkeep", label: "Upkeep" },
    { id: "words",  label: "Words" }
  ];

  function kitStrip() {
    return '<div class="subnav">' + KIT_PAGES.map(function (p) {
      return '<button class="btn' + (kitTab === p.id ? " primary" : "") +
        '" data-act="kit-page" data-id="' + p.id + '">' + p.label + "</button>";
    }).join("") + "</div>";
  }

  function renderKit() {
    var subs = {
      things: "Anything the work is made of or made with. Each one says what it was made from, where it is used, and what upkeep it carries.",
      people: "Everyone the book names, worst first. What is outstanding with each of them is read off the sends that name them — it is never typed.",
      upkeep: "Every so often since it was last done, never on a date — so falling behind never piles up.",
      words:  "Claimants, crafts, benches and board kinds. None of it is written into the app: it is all yours to add, rename and remove."
    };
    var h = pageHead("The workbench", esc(subs[kitTab] || subs.things)) + kitStrip();

    if (kitTab === "things") return h + kitThingsHtml();
    if (kitTab === "people") return h + kitPeopleHtml();
    if (kitTab === "upkeep") return h + kitUpkeepHtml();
    return h + kitWordsHtml();
  }

  function kitWordsHtml() {
    var h = "";
    h += '<div class="sect">Claimants</div><div class="card">' +
      '<div class="tools" style="margin-bottom:0.5rem"><button class="btn" data-act="claimant-add">Add claimant</button></div>' +
      (live(state.claimants).length ? live(state.claimants).map(function (c) {
        var shape = vocabLabel("claimKinds", c.kind);
        return '<div class="row"><span class="pill p-grey" style="color:' + esc(c.colour) + ';border-color:' + esc(c.colour) + '">' +
          esc(c.kind) + "</span>" +
          '<span class="grow"><b>' + esc(c.name) + "</b><small>" + esc(shape) +
          (c.hours ? ": " + c.hours : "") + "</small></span>" +
          '<span class="tools"><button class="btn quiet" data-act="claimant-edit" data-id="' + c.id + '">Edit</button>' +
          '<button class="btn quiet danger" data-act="claimant-del" data-id="' + c.id + '">×</button></span></div>';
      }).join("") : '<p class="empty">No claimants yet.</p>') + "</div>";

    /* ONE WORD FOR ONE THING. "Mode" meant two unrelated things in this
       app — the craft you are working in, and Field mode, the posture you
       switch on at a site — and the owner said of this screen that "the
       vocab is kinda weird to get". The record still stores `modes`, because
       renaming a state key migrates nothing and risks everything; what
       changed is the word on the screen, which is the only one anybody
       reads. CLAUDE.md's own prose already called it a craft. */
    h += '<div class="sect">Crafts</div><div class="card">' +
      '<p class="hint" style="margin:0 0 0.5rem">A craft is the kind of work \u2014 GIS, design, photogrammetry \u2014 and it carries the programs, files and links that work needs.</p>' +
      '<div class="tools" style="margin-bottom:0.5rem"><button class="btn" data-act="mode-add">Add craft</button></div>' +
      (live(state.modes).length ? live(state.modes).map(function (m) {
        var sw = modeSoftware(m).length, lk = modeLinks(m).length;
        return '<div class="row"><span class="grow"><b>' + esc(m.name) + "</b><small>" +
          esc(sw + (sw === 1 ? " program" : " programs") + " · " + lk + (lk === 1 ? " link" : " links")) +
          "</small></span>" +
          '<span class="tools"><button class="btn" data-act="mode-open" data-id="' + m.id + '">Its kit</button>' +
          '<button class="btn quiet danger" data-act="mode-del" data-id="' + m.id + '">×</button></span></div>';
      }).join("") : '<p class="empty">No crafts yet \u2014 "Add craft" above makes the first one.</p>') + "</div>";

    h += '<div class="sect">Benches</div><div class="card">' +
      '<p class="hint" style="margin:0 0 0.5rem">A bench is a craft and a claimant together \u2014 GIS for one employer is not GIS for another.</p>' +

  /* ================= Settings ================= */

  /* ================= time, spans, and the week ================= */

  // A span is a stretch of time at one bench. Hours are never stored as a
  // total anywhere — every figure on the week is summed from these, so no
  // figure can drift away from the record it came from.
  var LONG_DAY = 14 * 60;   // minutes past which an open span is not believed
  var weekOf = "";          // which week is being read; view state, never saved

  function nowStamp() {
    var d = new Date();
    return iso(d) + "T" + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
  }
  function stampDay(s) { return String(s).slice(0, 10); }
  function stampMin(s) {
    var t = String(s).slice(11);
    return num(t.slice(0, 2)) * 60 + num(t.slice(3, 5));
  }
  function minsBetween(a, b) {
    return daysBetween(stampDay(a), stampDay(b)) * 1440 + stampMin(b) - stampMin(a);
  }
  function fmtMins(m) {
    m = Math.round(m);
    if (m <= 0) return "0h";
    var h = Math.floor(m / 60), r = m % 60;
    return h ? (r ? h + "h " + r + "m" : h + "h") : r + "m";
  }

  function openSpan() {
    for (var i = state.spans.length - 1; i >= 0; i--) {
      if (!state.spans[i].endedAt) return state.spans[i];
    }
    return null;
  }
  // An open span that started yesterday, or has run longer than any real day,
  // is not an amount of time — it is a question. It is never counted and never
  // closed on your behalf.
  function runaway() {
    var sp = openSpan();
    if (!sp) return null;
    var m = minsBetween(sp.startedAt, nowStamp());
    return (m > LONG_DAY || stampDay(sp.startedAt) !== today()) ? sp : null;
  }

  // Minutes of one span that fall inside a range of days. An open span
  // contributes nothing: it is not an hour until it has ended.
  function minsIn(sp, fromDay, toDay) {
    if (!sp.endedAt) return 0;
    var lo = fromDay + "T00:00", hi = toDay + "T23:59";
    if (sp.endedAt < lo || sp.startedAt > hi) return 0;
    var a = sp.startedAt < lo ? lo : sp.startedAt;
    var b = sp.endedAt > hi ? hi : sp.endedAt;
    return Math.max(0, minsBetween(a, b));
  }
  function claimantOfSpan(sp) {
    var bn = byId(state.benches, sp.benchId);
    return bn ? bn.claimantId : "";
  }
  function minsFor(claimantId, fromDay, toDay) {
    return state.spans.reduce(function (t, sp) {
      return claimantOfSpan(sp) === claimantId ? t + minsIn(sp, fromDay, toDay) : t;
    }, 0);
  }
  // Days a claimant was touched at all. A claimant owed days is not owed hours,
  // and counting one in the other's unit is a plausible wrong number.
  function daysFor(claimantId, fromDay, toDay) {
    var seen = {};
    state.spans.forEach(function (sp) {
      if (claimantOfSpan(sp) !== claimantId) return;
      for (var i = 0; i < 7; i++) {
        var d = addDays(fromDay, i);
        if (d > toDay) break;
        if (minsIn(sp, d, d) > 0) seen[d] = 1;
      }
    });
    return Object.keys(seen).length;
  }
  // Time at no bench at all. It is shown and never distributed — the app does
  // not know whose it was, and guessing would put hours on an employer's name.
  function suspenseMins(fromDay, toDay) {
    return state.spans.reduce(function (t, sp) {
      return sp.benchId ? t : t + minsIn(sp, fromDay, toDay);
    }, 0);
  }

  function owedOf(c) {
    if (c.kind === "budget") return { unit: "h", owed: num(c.hours) * 60 };
    if (c.kind === "floor")  return { unit: "h", owed: num(c.hours) * 60, floor: true };
    if (c.kind === "days")   return { unit: "d", owed: num(c.hours) };
    return { unit: c.kind === "watch" ? "" : "h", owed: 0 };
  }

  /* Every claimant with something to say about this week, which is not the
     same as every LIVE claimant. A removed one that still has hours logged in
     the week has to appear, or the week reads "counted 7h across 2 claimants"
     above a breakdown accounting for nought — the figure and its parts
     disagreeing, silently, in the one number this screen exists to produce.
     Nothing is owed to somebody who is gone, so `owed` is forced to nought and
     the row says why rather than reporting them short. */
  function standing(fromDay) {
    var toDay = addDays(fromDay, 6);
    var list = state.claimants.filter(function (c) {
      if (c.kind === "watch") return false;
      if (!c.archived) return true;
      return minsFor(c.id, fromDay, toDay) > 0;
    });
    return list.map(function (c) {
      var o = owedOf(c);
      var gone = !!c.archived;
      var got = o.unit === "d" ? daysFor(c.id, fromDay, toDay) : minsFor(c.id, fromDay, toDay);
      var owed = gone ? 0 : o.owed;
      return { c: c, unit: o.unit, owed: owed, got: got, gone: gone,
               floor: !gone && !!o.floor,
               short: owed ? Math.max(0, owed - got) : 0 };
    });
  }

  // How far behind a claimant has fallen, added up over whole weeks and never
  // reset. It is a co-occurrence and not a cause: the app never says one
  // claimant took the hours another lost, because it cannot know that.
  function behindBy(c) {
    var o = owedOf(c);
    if (!o.owed) return null;
    var first = state.spans.reduce(function (m, sp) {
      var d = stampDay(sp.startedAt);
      return (!m || d < m) ? d : m;
    }, "");
    if (!first) return null;
    var w = weekStart(first), thisWeek = weekStart(today()), total = 0, weeks = 0, guard = 0;
    while (w < thisWeek && guard++ < 400) {
      var to = addDays(w, 6);
      var got = o.unit === "d" ? daysFor(c.id, w, to) : minsFor(c.id, w, to);
      total += Math.max(0, o.owed - got);
      weeks++;
      w = addDays(w, 7);
    }
    return weeks ? { amount: total, unit: o.unit, weeks: weeks } : null;
  }
  function amountWords(n, unit) {
    return unit === "d" ? (n + (n === 1 ? " day" : " days")) : fmtMins(n);
  }

  /* ---------------- the switch bar ---------------- */

  function switchBarHtml() {
    var sp = openSpan(), run = runaway();
    if (run) {
      return '<div class="sb sb-warn"><span class="sb-txt"><b>Still at ' +
        esc(benchLabel(run.benchId) || "no bench") + '</b>' +
        '<small>since ' + esc(niceDate(stampDay(run.startedAt))) + " " + esc(String(run.startedAt).slice(11)) +
        " — say when you left, or this is not an amount of time</small></span>" +
        '<span class="tools"><button class="btn primary" data-act="span-close">Close it</button></span></div>';
    }
    if (sp) {
      var m = minsBetween(sp.startedAt, nowStamp());
      return '<div class="sb"><span class="sb-dot"></span><span class="sb-txt"><b>' +
        esc(benchLabel(sp.benchId) || "Not said yet") + "</b>" +
        "<small>since " + esc(String(sp.startedAt).slice(11)) + " · " + fmtMins(m) +
        (noteOf(sp.benchId) ? " · left off: " + esc(noteOf(sp.benchId).note) : "") + "</small></span>" +
        '<span class="tools"><button class="btn" data-act="span-switch">Switch</button>' +
        '<button class="btn" data-act="span-stop">Stop</button></span></div>';
    }
    return '<div class="sb sb-idle"><span class="sb-txt"><b>Not at a bench</b>' +
      "<small>nothing is being counted</small></span>" +
      '<span class="tools"><button class="btn" data-act="span-start">Start</button></span></div>';
  }
  function mountBar() {
    var el = document.getElementById("sbar");
    if (!el) return;
    el.innerHTML = switchBarHtml();
    /* The bar's own height, published so the toasts can sit above it. Measured
       rather than written down: it wraps to two lines when there is a
       re-entry note to read back, and a constant would put a toast half
       behind it exactly when the bar had most to say. */
    var h = el.getBoundingClientRect().height;
    if (h) document.documentElement.style.setProperty("--sbh", Math.round(h) + "px");
  }

  /* ---------------- the week screen ---------------- */

  function currentWeek() { return weekOf || weekStart(today()); }

  /* "Mon 2026-09-14 to 2026-09-20" is a log line, not a date. The month is
     written once when both ends share it, which is six weeks in seven. */
  function weekWords(from, to) {
    var a = parseISO(from), z = parseISO(to);
    var d1 = a.toLocaleDateString(undefined, { day: "numeric" });
    var same = a.getMonth() === z.getMonth();
    var m1 = a.toLocaleDateString(undefined, { month: "long" });
    var m2 = z.toLocaleDateString(undefined, { month: "long" });
    var yr = z.getFullYear() === parseISO(today()).getFullYear() ? "" : " " + z.getFullYear();
    return (same ? d1 + " \u2013 " + z.getDate() + " " + m2
                 : d1 + " " + m1 + " \u2013 " + z.getDate() + " " + m2) + yr;
  }

  /* ================= OUTPUTS =================

     The fifth box of the poster's Core Structure: *Results — maps, models,
     reports*. Everything under it already existed and none of it had a place
     of its own. A filing step that is done is the only thing in the book that
     says a piece of work LEFT THE BUILDING, and it could only be seen from
     inside the project it belonged to; the written report was a button on the
     week; and the week was a tab of its own, which said that hours are a
     section of the workspace rather than one of the things the work produces.

     Three pages, and each is a different answer to "what came out of this":
     what was FILED, what was WRITTEN, and the HOURS the writing is made of.
     Nothing here computes anything: `filings()` is the one walk (the project
     page's `projOutputs()` is the same function unranged) and the report is
     `buildReport()`, which reads the screens' own figures. */
  var OUT_PAGES = [
    { id: "filed",   label: "Filed",   one: "filing" },
    { id: "reports", label: "Reports", one: "report" },
    { id: "hours",   label: "Hours",   one: "week" }
  ];
  var outTab = "filed";   // view state, never saved, resets on a tab press

  function renderOut() {
    var all = filings(state.boards);
    /* THE HEADLINE BELONGS TO THE PAGE, NOT THE SECTION. Written once for the
       whole tab it read "Nothing has left the building yet." above the Hours
       page showing sixteen hours of real work — a figure of nought over a
       screen contradicting it, which is the fault this file already records
       from Home's deadline tile. Each page states its own finding. */
    var head = outTab === "hours" ? "Where the hours went."
             : outTab === "reports" ? "Write the period out."
             : all.length ? (all.length === 1 ? "One thing filed." : cap(numWord(all.length)) + " things filed.")
             : "Nothing has left the building yet.";
    var h = '<div class="finding"><h1>' + esc(head) + "</h1></div>" +
      '<p class="saynote">What the work produced: what you archived, what you wrote out, and the hours underneath both. Every figure here is the one the screen it came from shows.</p>';

    h += '<div class="subnav">' + OUT_PAGES.map(function (pg) {
      var n = pg.id === "filed" ? all.length : 0;
      return '<button class="btn' + (pg.id === outTab ? " primary" : "") +
        '" data-act="out-page" data-id="' + pg.id + '">' + pg.label +
        (n ? ' <span class="cnt">' + n + "</span>" : "") + "</button>";
    }).join("") + "</div>";

    if (outTab === "hours")   return h + renderWeek();
    if (outTab === "reports") return h + outReports();
    return h + outFiled(all);
  }

  /* WHAT WAS FILED, newest first, and it says which board and which project
     it came off — a filing on its own is a name with no home. The path is
     printed where there is one, because the whole point of a `file` step is
     that the thing went somewhere. */
  function outFiled(all) {
    if (!all.length) {
      return '<p class="empty">Nothing filed yet. A run cannot close while a filing step is undone, so what lands here is exactly the work you finished AND put away — which is the third of the three things that get forgotten.</p>';
    }
    return '<div class="stack tight">' + all.map(function (o) {
      var b = byId(state.boards, o.boardId);
      var pj = b && b.projectId && projOf(b.projectId) ? projName(b.projectId) : "";
      return '<div class="panel calm"><span class="itile sm t-out">' + ICONS.file + "</span>" +
        '<div class="grow"><div class="nm sm">' + esc(o.label) + "</div>" +
        '<div class="says">' + esc(o.board + (pj ? " · " + pj : "") +
          " · filed " + agoWords(o.at) + (o.path ? " · " + o.path : "")) + "</div></div>" +
        (b ? '<div class="acts"><button class="btn quiet" data-act="board-open" data-id="' + b.id + '">Open it</button></div>' : "") +
        "</div>";
    }).join("") + "</div>";
  }

  /* THE REPORT IS BUILT, NEVER STORED. Nothing is kept here between visits:
     a saved report would be a second copy of figures the record already
     holds, and the day it disagreed with the app the older one would be the
     one somebody had already sent. So this page is the builder and what it
     says about itself. */
  function outReports() {
    var h = '<div class="tools" style="margin:0.2rem 0 0.9rem">' +
      '<button class="btn primary" data-act="report-new">Build a report</button></div>';
    h += '<p class="hint" style="margin:0 0 0.9rem">Any range, any claimant or all of them. It writes the whole period out as prose — the projects and where each stands, the hours by week, who is waiting on what, and what was filed — for a meeting, an email, an accountant or a visa office. Copy it or save it as text; it is never edited here.</p>';
    h += '<p class="hint" style="margin:0 0 0.9rem">Nothing is kept between visits. Every figure in it comes from the same function the screens use, so a report built twice from the same range says the same thing, and a stored copy could only ever go stale.</p>';
    var wk = weekStart(today());
    h += '<div class="sect">What it would cover today</div>';
    h += '<div class="tiles">' +
      tile("Filed", String(filings(state.boards).length), "since the book began") +
      tile("Projects", String(projects().length), "each with where it stands") +
      tile("This week", fmtMins(state.spans.reduce(function (t, sp) {
        return t + minsIn(sp, wk, addDays(wk, 6)); }, 0)), "logged so far") +
      "</div>";
    return h;
  }

  function renderWeek() {
    var from = currentWeek(), to = addDays(from, 6);
    var isNow = from === weekStart(today());
    var rows = standing(from);
    var total = state.spans.reduce(function (t, sp) { return t + minsIn(sp, from, to); }, 0);
    var susp = suspenseMins(from, to);

    /* The week is a page of Outputs now, which already carries the section
       heading, so this head names the RANGE rather than repeating the
       section's name — the same rule that stopped the report page
       repeating the report's own first line. */
    var h = pageHead(weekWords(from, to) + (isNow ? " — this week" : ""),
      "Summed from the stretches you logged, and nothing else: an open stretch counts nowhere and time at no bench is shown rather than shared out.",
      '<div class="tools">' +
      '<button class="btn" data-act="week-prev">‹ earlier</button>' +
      (isNow ? "" : '<button class="btn" data-act="week-now">this week</button>') +
      '<button class="btn" data-act="week-next" ' + (isNow ? "disabled" : "") + '>later ›</button>' +
      /* The "Report" button that was here is gone: Reports is the page
         directly above this one on the same strip, and two controls a
         thumb-width apart doing the same thing is a choice that is not one. */
      '<button class="btn" data-act="span-add">Add time</button></div>');

    h += '<div class="tiles">' +
      tile("Counted", fmtMins(total),
           "across " + rows.length + (rows.length === 1 ? " claimant" : " claimants")) +
      tile("Not said", fmtMins(susp), susp ? "waiting to be attributed" : "nothing unattributed", susp ? "loss" : "") +
      "</div>";

    if (susp) {
      h += '<div class="card" style="border-left:2px solid var(--oxide)"><h3>Time at no bench</h3>' +
        '<p class="hint" style="margin:0.2rem 0 0.7rem">' + fmtMins(susp) +
        " this week is at no bench. It is not counted against anyone and it will not be guessed at — say whose it was.</p>" +
        state.spans.filter(function (sp) { return !sp.benchId && minsIn(sp, from, to) > 0; })
          .map(function (sp) { return spanRow(sp, true); }).join("") + "</div>";
    }

    h += '<div class="sect">Where the week went</div>';
    if (!rows.length) {
      /* It said "add one in Kit". Kit was renamed the workbench, split into
         four pages and moved off the tab bar, so this sentence sent the
         reader to a screen that does not exist — and it is the one sentence
         on an empty week that is supposed to say what to do. A dead
         instruction is worse than none, so it names the page it means AND
         carries the button, which is one tap instead of three. */
      h += '<p class="empty">Nothing to measure against yet. A claimant is whoever is owed the hours \u2014 an employer, a funder, your own thesis.</p>' +
        '<div class="tools"><button class="btn primary" data-act="claimant-add">Add a claimant</button>' +
        '<button class="btn" data-act="kit-words">The workbench \u00b7 Words</button></div>';
    } else {
      h += '<div class="card">' + rows.map(function (r) {
        var pct = r.owed ? Math.min(100, Math.round(r.got / r.owed * 100)) : 0;
        var fig = r.unit === "d" ? r.got + (r.owed ? " of " + r.owed : "") + (r.got === 1 && !r.owed ? " day" : " days")
                                 : fmtMins(r.got) + (r.owed ? " of " + fmtMins(r.owed) : "");
        var note;
        if (r.gone) note = "removed — these hours stay on the record and are measured against nothing";
        else if (!r.owed) note = "on demand — nothing is owed";
        else if (r.short) note = (r.floor ? "under its floor by " : "short by ") + amountWords(r.short, r.unit);
        else note = r.floor ? "over its floor" : "met";
        // A removed claimant is not behind: nothing is owed to somebody gone,
        // and a cumulative shortfall against them would be a figure about
        // nothing.
        var beh = r.gone ? null : behindBy(r.c);
        return '<div class="wk"><span class="wk-dot" style="background:' + esc(r.c.colour) + '"></span>' +
          '<div class="wk-main"><div class="wk-top"><b>' +
          esc(r.gone ? r.c.name + " (removed)" : r.c.name) + "</b><span>" + esc(fig) + "</span></div>" +
          '<div class="meter"><div class="' + (r.short ? "meter-pace" : "meter-fill") +
          '" style="width:' + pct + '%"></div></div>' +
          '<small>' + esc(note) +
          (beh && beh.amount ? " · <span style=\"color:var(--oxide)\">" + esc(amountWords(beh.amount, beh.unit)) +
            " behind over " + beh.weeks + (beh.weeks === 1 ? " earlier week" : " earlier weeks") + "</span>" : "") +
          "</small></div></div>";
      }).join("") + "</div>";
      h += '<p class="hint">A claimant behind is stated on its own. The app never says one claimant took the hours another lost — it cannot know that, and a plausible wrong reason is worse than none.</p>';
    }

    h += '<div class="sect">The days</div><div class="card">';
    for (var i = 0; i < 7; i++) {
      var day = addDays(from, i);
      var todays = state.spans.filter(function (sp) { return minsIn(sp, day, day) > 0; })
        .sort(function (a, b) { return a.startedAt < b.startedAt ? -1 : 1; });
      var dayMins = todays.reduce(function (t, sp) { return t + minsIn(sp, day, day); }, 0);
      /* An empty day was a heading, then a card, then a dash — 115px of screen
         to say nothing, six times over, which is most of why this page read as
         a form. It is one quiet line now, and the button says what it does. */
      h += '<div class="dayhead' + (dayMins ? "" : " bare") + '"><b>' +
        esc(dayName(day, "long")) + "</b><span>" +
        (dayMins ? fmtMins(dayMins) : "nothing logged") + "</span>" +
        '<button class="btn quiet" data-act="span-add" data-id="' + day +
        '" title="Add time on this day">Add time</button></div>';
      if (todays.length) h += todays.map(function (sp) { return spanRow(sp, false); }).join("");
    }
    h += "</div>";
    return h;
  }

  function spanRow(sp, flag) {
    var open = !sp.endedAt;
    return '<div class="row"><span class="pill ' + (sp.benchId ? "p-dim" : "p-oxide") + '">' +
      (open ? "open" : fmtMins(minsBetween(sp.startedAt, sp.endedAt))) + "</span>" +
      '<span class="grow"><b>' + esc(sp.benchId ? benchLabel(sp.benchId) : "Not said yet") + "</b><small>" +
      esc(String(sp.startedAt).slice(11) + (open ? " — still open" : " – " + String(sp.endedAt).slice(11)) +
          (stampDay(sp.startedAt) !== stampDay(sp.endedAt || sp.startedAt) ? " (crosses midnight)" : "") +
          (sp.note ? " · " + sp.note : "")) + "</small></span>" +
      '<span class="tools"><button class="btn quiet" data-act="span-edit" data-id="' + sp.id + '">' +
      (flag ? "Say whose" : "Edit") + "</button>" +
      '<button class="btn quiet danger" data-act="span-del" data-id="' + sp.id + '">×</button></span></div>';
  }

  function spanBenchOpts() {
    return [{ value: "", label: "Not said yet — goes to suspense" }].concat(
      opts(state.benches, function (b) { return benchLabel(b.id); }));
  }
  function timeOk(v) { return /^([01]\d|2[0-3]):[0-5]\d$/.test(String(v).trim()); }
  function hhmm(v) { v = String(v).trim(); return num(v.slice(0, 2)) * 60 + num(v.slice(3, 5)); }

  /* A date that EXISTS, not a string shaped like one. The old test was the
     regex alone, so 2026-13-45 passed: it stored, parsed to Invalid Date,
     counted in no week, showed on no screen and was named by no report — eight
     hours in a hole nothing could see. Round-tripping through the calendar is
     the only test that catches it. */
  function dayOk(v) {
    v = String(v).trim();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) return false;
    var d = parseISO(v);
    return !!d && !isNaN(d.getTime()) && iso(d) === v;
  }

  /* No minute may belong to two stretches.

     Switching benches already enforces this — the old span ends exactly when
     the new one starts — but Add time is the path used for everything you
     forgot to tap, and it had no check at all. 10:00-11:00 beside 10:30-11:30
     was accepted and the week read 2h for 90 minutes of life. The one figure
     this app exists to produce was wrong, silently, and it is the figure that
     goes to an employer.

     Returns the stretches that clash, so the message can name them rather than
     just refusing. `skipId` is the span being edited, which must not clash
     with itself. */
  function clashesWith(dayStr, fromMin, toMin, skipId) {
    return state.spans.filter(function (sp) {
      if (sp.id === skipId) return false;
      if (stampDay(sp.startedAt) !== dayStr) return false;
      if (!sp.endedAt) return false;                 // an open span is not an hour
      var a = hhmm(String(sp.startedAt).slice(11)), z = hhmm(String(sp.endedAt).slice(11));
      return fromMin < z && toMin > a;               // half-open: touching is fine
    });
  }
  function clashWords(list) {
    return list.map(function (sp) {
      return String(sp.startedAt).slice(11) + "\u2013" + String(sp.endedAt).slice(11) +
        " at " + (sp.benchId ? benchLabel(sp.benchId) : "no bench");
    }).join(", ");
  }

  // The bench of the most recent stretch, or none if there has never been one.
  function lastBench() {
    var best = null;
    state.spans.forEach(function (x) {
      if (x.benchId && byId(state.benches, x.benchId) && (!best || x.startedAt > best.startedAt)) best = x;
    });
    return best ? best.benchId : "";
  }

  function spanDialog(sp, day) {
    var isNew = !sp;
    openModal({
      title: isNew ? "Add time" : "Edit time",
      confirmLabel: isNew ? "Add" : "Save",
      message: isNew ? "For a stretch you did not tap in for. Nothing here is guessed — if you do not know whose it was, leave the bench unsaid." : "",
      fields: [
        { key: "day", label: "Day", type: "text", value: sp ? stampDay(sp.startedAt) : (day || today()),
          span: true, hint: "YYYY-MM-DD" },
        { key: "from", label: "From", type: "text", value: sp ? String(sp.startedAt).slice(11) : "09:00" },
        { key: "to", label: "To", type: "text", value: sp && sp.endedAt ? String(sp.endedAt).slice(11) : "17:00" },
        /* Defaulting to "not said" meant pressing Add time and then Add gave
           you eight hours at no bench, a suspense tile and a card to clear.
           The bench you were last at is the likely answer and the one you can
           correct in the same dialog; "not said" is still there, and still
           what an unknown stretch should be. */
        { key: "benchId", label: "Bench", type: "select", span: true, options: spanBenchOpts(),
          value: sp ? sp.benchId : lastBench() },
        { key: "note", label: "Note", type: "text", span: true, value: sp ? (sp.note || "") : "" }
      ],
      validate: function (v) {
        if (!dayOk(v.day)) return "A day must be a real date, written YYYY-MM-DD.";
        if (!timeOk(v.from) || !timeOk(v.to)) return "A time must be HH:MM on the 24-hour clock.";
        if (hhmm(v.to) <= hhmm(v.from)) return "It has to end after it started.";
        if (v.day.trim() > today()) return "It cannot be a day that has not happened yet.";
        var clash = clashesWith(v.day.trim(), hhmm(v.from), hhmm(v.to), sp ? sp.id : "");
        if (clash.length) {
          return "That overlaps " + clashWords(clash) +
            ". Two stretches cannot claim the same minute \u2014 fix one of them first.";
        }
        return null;
      },
      onConfirm: function (v) {
        go(function () {
          var t = sp;
          if (!t) { t = { id: uid(), source: "repair" }; state.spans.push(t); }
          t.startedAt = v.day.trim() + "T" + v.from.trim();
          t.endedAt = v.day.trim() + "T" + v.to.trim();
          t.benchId = v.benchId;
          t.note = v.note.trim();
        });
      }
    });
  }

  /* A REFUSAL HAS TO CARRY THE WAY OUT. Both refusals below were toasts
     naming "Kit" — a screen renamed the workbench, split into four pages and
     moved off the tab bar — so the one sentence telling a new reader what to
     do pointed at a place that does not exist, and pressing Start on an empty
     book produced two of them in a row from a bar pinned to every screen.
     A dialog instead: it says what the missing thing IS, and its confirm
     button lands on the page that makes one. */
  function needWords(title, message, act) {
    openModal({
      title: title, message: message,
      confirmLabel: "Take me there", cancelLabel: "Not now",
      onConfirm: function () { APP.actions[act || "kit-words"](); }
    });
  }

  function pickBench(title, onPick) {
    if (!live(state.benches).length) {
      needWords("No bench to count against yet",
        "A bench is a craft and a claimant together \u2014 GIS for one employer is different work from GIS for another, and the hours have to be owed to somebody. They are made on the workbench, under Words.");
      return;
    }
    openModal({
      title: title, confirmLabel: "Go",
      fields: [{ key: "benchId", label: "Bench", type: "select", span: true,
        options: spanBenchOpts(), value: live(state.benches)[0].id }],
      onConfirm: function (v) { onPick(v.benchId); }
    });
  }


  /* ================= the written report ================= */

  // For a meeting, or an email, or a funder. Two rules keep it worth trusting.
  // It computes NOTHING of its own: every figure comes from the same function
  // the screen uses, or the report and the app will eventually disagree and
  // only one of them will be right. And it states its own basis and its own
  // limits — how many weeks it rests on, what is unattributed, what is still
  // open — because a report that hides how thin its data is, is worse than no
  // report at all.
  var reportOn = null;   // {claimantId, from, to} — view state, never saved

  function wordDate(d) {
    return parseISO(d).toLocaleDateString(undefined, { day: "numeric", month: "long", year: "numeric" });
  }
  /* A date in a table, never relative. `niceDate()` says "yesterday" for
     recent days, which reads well in a sentence and reads as nonsense in a
     column of week-commencing dates — the report printed "w/c yesterday". */
  function plainDate(d) {
    return parseISO(d).toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }
  /* A DATE IN A TABLE CARRIES ITS YEAR. `plainDate` is month and day, which is
     right for a week-commencing column and wrong for a thing dated 1916 ("Jan
     1"), and `niceDate` is relative, which belongs in a sentence. */
  function fullDate(d) {
    return parseISO(d).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
  }
  function pad(s, n) { s = String(s); return s + new Array(Math.max(1, n - s.length + 1)).join(" "); }

  function weeksBetween(from, to) {
    var out = [], w = weekStart(from), guard = 0;
    while (w <= to && guard++ < 400) { out.push(w); w = addDays(w, 7); }
    return out;
  }

  function boardsForClaimant(claimantId) {
    return boards().filter(function (b) {
      if (!claimantId) return true;
      var bn = byId(state.benches, b.benchId);
      return bn && bn.claimantId === claimantId;
    });
  }

  function buildReport(o) {
    var saidUnfiled = false;   // true once THE WORK has really printed one
    var c = o.claimantId ? byId(state.claimants, o.claimantId) : null;
    var from = o.from, to = o.to;
    var L = [];
    L.push((c ? c.name : "Every claimant") + " — " + wordDate(from) + " to " + wordDate(to));
    L.push("");

    /* ---- hours, straight from the same sums the week screen reads ---- */
    var weeks = weeksBetween(from, to);
    var owed = c ? owedOf(c) : { unit: "h", owed: 0 };
    var rows = weeks.map(function (w) {
      var wTo = addDays(w, 6);
      var lo = w < from ? from : w, hi = wTo > to ? to : wTo;
      var got = c
        ? (owed.unit === "d" ? daysFor(c.id, lo, hi) : minsFor(c.id, lo, hi))
        : state.spans.reduce(function (t, sp) { return t + minsIn(sp, lo, hi); }, 0);
      var whole = (w >= from && wTo <= to);
      // Any entry at all, for anyone, means the week was lived in the app and a
      // nought for this claimant is a real nought. No entry anywhere means the
      // week is simply unrecorded, and it is not measured against anything.
      var lived = state.spans.some(function (sp) { return minsIn(sp, lo, hi) > 0; });
      return { w: w, lo: lo, hi: hi, got: got, whole: whole, lived: lived };
    });
    var withEntries = rows.filter(function (r) { return r.got > 0; });
    var totalGot = rows.reduce(function (t, r) { return t + r.got; }, 0);

    L.push("HOURS");
    if (!withEntries.length) {
      L.push("  Nothing was logged in this period, so every figure below that depends on hours is absent rather than nought. The difference matters, and the app will not print a nought it cannot stand behind.");
    } else {
      L.push("  " + amountWords(totalGot, owed.unit) + " across " +
             withEntries.length + (withEntries.length === 1 ? " week" : " weeks") +
             " with entries, of " + weeks.length + " in the period.");
      L.push("");
      /* A run of weeks with nothing in them is one line, not one line each.
         Over four months that was sixteen identical rows of "nothing recorded
         that week" above the two rows anybody wanted to read — and a report
         nobody reads to the end is worse than a shorter one. The weeks are
         still all accounted for: the line says how many. */
      var run = null;
      function flushRun() {
        if (!run) return;
        L.push("    " + pad(run.n === 1 ? "w/c " + plainDate(run.from)
                                        : plainDate(run.from) + " – " + plainDate(addDays(run.to, 6)), 18) +
               pad("—", 12) +
               (run.n === 1 ? "nothing recorded that week"
                            : "nothing recorded in " + run.n + " weeks"));
        run = null;
      }
      rows.forEach(function (r) {
        if (!r.lived) {
          if (run) { run.to = r.w; run.n++; } else { run = { from: r.w, to: r.w, n: 1 }; }
          return;
        }
        flushRun();
        var line = "    " + pad("w/c " + plainDate(r.w), 18) +
          pad(amountWords(r.got, owed.unit), 12);
        if (owed.owed && r.whole) {
          var d = owed.owed - r.got;
          line += d > 0 ? "short by " + amountWords(d, owed.unit)
                        : (d < 0 ? "over by " + amountWords(-d, owed.unit) : "met");
        } else if (owed.owed) {
          line += "part week, not measured";
        }
        L.push(line.replace(/\s+$/, ""));
      });
      flushRun();
      if (owed.owed) {
        var full = rows.filter(function (r) { return r.whole && r.lived; });
        var behind = full.reduce(function (t, r) { return t + Math.max(0, owed.owed - r.got); }, 0);
        L.push("");
        if (!full.length) {
          L.push("  No whole week in this period has an entry, so nothing here is measured against the " + amountWords(owed.owed, owed.unit) + " a week.");
        } else {
          /* "the 1 whole week with entries fall short" — the count was a
             digit in prose and the verb did not follow it. The report is the
             thing that goes to an accountant or a visa office, so it is the
             last place a sentence should fail to agree with itself. */
          L.push("  Against " + amountWords(owed.owed, owed.unit) + " a week, the " + numWord(full.length) +
                 (full.length === 1 ? " whole week with entries falls" : " whole weeks with entries fall") +
                 " short by " + amountWords(behind, owed.unit) +
                 " in total. Weeks with nothing recorded are left out of that figure rather than counted as noughts.");
        }
      }
    }
    L.push("");

    /* ---- what the time went on: the notes, and nothing invented ---- */
    var notes = [];
    state.spans.forEach(function (sp) {
      if (!sp.note) return;
      if (minsIn(sp, from, to) <= 0) return;
      if (c && claimantOfSpan(sp) !== c.id) return;
      if (notes.indexOf(sp.note) < 0) notes.push(sp.note);
    });
    L.push("WHAT THE TIME WENT ON");
    L.push(notes.length ? "  " + notes.join("; ") + "."
                        : "  No stretch in this period carries a note, so this section is empty rather than guessed at.");
    L.push("");

    /* ---- the projects, above the boards that do them ----

       Added because the report knew about runs and nothing about what they
       were for, which is the first thing anybody reading it asks. Every word
       here comes from `projState()` and `projSays()`, the same two the Jobs
       tab reads, so the report cannot say a project is late while the screen
       says it is in hand. */
    var bs = boardsForClaimant(c ? c.id : "");
    var projIds = {}, projList = [];
    bs.forEach(function (b) {
      if (!b.projectId) return;
      var p = projOf(b.projectId);
      if (!p || p.archived || projIds[p.id]) return;
      projIds[p.id] = 1; projList.push(p);
    });
    L.push("PROJECTS");
    if (!projList.length) {
      L.push("  No board in this report belongs to a project, so there is nothing to roll up. That is not a gap: a one-off procedure needs no project.");
    } else {
      projList.forEach(function (p) {
        var st = projState(p);
        L.push("  " + pad(p.name, 34) + st.word);
        L.push("    " + projSays(p));
      });
    }
    L.push("");

    /* ---- the work itself ---- */
    var runs = bs.filter(function (b) { return b.kind === "run"; });
    L.push("THE WORK");
    if (!runs.length) {
      L.push("  No runs are filed against " + (c ? "this claimant" : "anything") + ".");
    } else {
      runs.forEach(function (b) {
        var p = runProgress(b);
        var act = activeNodes(b);
        var late = act.filter(function (n) { return nodeState(b, n) === "over"; });
        L.push("  " + b.name);
        L.push("    " + (b.closedOn ? "closed " + niceDate(b.closedOn) : "open") +
               " · " + p.done + " of " + p.total + " steps done" +
               (late.length ? " · " + late.length + " late" : ""));
        act.forEach(function (n) {
          var who = recipientsOf(b, n).map(function (t) { return t.label; }).join(", ");
          var st = nodeState(b, n);
          L.push("      " + pad(n.label, 34) +
                 (st === "over" ? "late by " + overdueBy(n) + "d"
                  : st === "waiting" ? "waiting " + daysWaiting(n) + "d"
                  : "in hand") +
                 (who ? " — with " + who : ""));
        });
        var uf = unfiled(b);
        if (!b.closedOn && !act.length && uf.length) {
          L.push("      not filed: " + uf.map(function (n) { return n.label; }).join(", "));
          saidUnfiled = true;
        }
      });
    }
    L.push("");

    /* ---- what was actually produced in the period ----

       A filing step that is done is the only thing in the book that says a
       piece of work left the building, which is exactly what a report is for.
       Dated by when it was FILED, not when the run started, and read through
       `filings()` — the same walk the project page uses, so the two cannot
       disagree. */
    var filed = filings(bs, from, to);
    L.push("WHAT WAS FILED IN THIS PERIOD");
    if (!filed.length) {
      /* "the unfiled lines above say which" pointed at lines that are often
         not there: a report whose work carries no undone filing step prints
         none, and the sentence sent the reader up the page looking for
         something it does not contain. Said only when the report really did
         print one — the same rule as a screen never naming a place that
         does not exist. */
      L.push(saidUnfiled
        ? "  Nothing. Either nothing finished, or it finished and was never archived — the unfiled lines above say which."
        : "  Nothing was archived in this period.");
    } else {
      filed.forEach(function (f) {
        L.push("  " + pad(plainDate(stampDay(f.at)), 14) + pad(f.label, 34) + f.board);
        if (f.path) L.push("    " + f.path);
      });
    }
    L.push("");

    /* ---- what is owed in the other direction ---- */
    var waits = [];
    runs.forEach(function (b) {
      if (b.closedOn) return;
      activeNodes(b).forEach(function (n) {
        if (n.act !== "send" && n.act !== "watch") return;
        var who = recipientsOf(b, n).map(function (t) { return t.label; }).join(", ");
        waits.push({ b: b, n: n, who: who });
      });
    });
    function waitLine(x, lead) {
      return "  " + pad(lead, 26) + x.n.label + " — " + daysWaiting(x.n) + "d" +
             (overdueBy(x.n) > 0 ? ", " + overdueBy(x.n) + "d past its chase" : "");
    }
    var onPeople = waits.filter(function (x) { return x.who; });
    var onWorld  = waits.filter(function (x) { return !x.who; });
    L.push("WAITING ON SOMEONE ELSE");
    if (!onPeople.length) L.push("  Nobody.");
    else onPeople.forEach(function (x) { L.push(waitLine(x, x.who)); });
    L.push("");
    if (onWorld.length) {
      L.push("WAITING, WITH NOBODY NAMED");
      onWorld.forEach(function (x) { L.push(waitLine(x, x.b.name)); });
      L.push("");
    }

    /* ---- and what all of it rests on ---- */
    var susp = suspenseMins(from, to);
    var openNow = openSpan();
    L.push("WHAT THIS RESTS ON");
    L.push("  " + withEntries.length + " of " + weeks.length +
           (weeks.length === 1 ? " week" : " weeks") + " in this period have any entry at all.");
    if (susp) {
      L.push("  " + fmtMins(susp) + " in this period is at no bench. It is excluded from every figure above rather than being attributed to anyone.");
    }
    if (openNow) {
      L.push("  One stretch is still open and is counted nowhere until it ends.");
    }
    if (rows.some(function (r) { return !r.whole; })) {
      L.push("  The first and last weeks are partial, so they are summed but not measured against a weekly figure.");
    }
    L.push("  Every figure is summed from logged stretches. Nothing is estimated, averaged or filled in.");
    if (projList.length) {
      L.push("  A project's state is read off its boards, never stored, so it cannot disagree with the screen — and “past its date” means the date has gone by on work that is not finished, not that anything was late.");
    }
    if (filed.length) {
      L.push("  A filing is dated by the day it was archived, not by when the work was done, so a run that finished in March and was filed in May appears under May.");
    }
    L.push("");
    L.push("Written " + wordDate(today()) + " by Mashghal, from this device only.");
    return L.join("\n");
  }

  function renderReport() {
    var o = reportOn;
    var text = buildReport(o);
    /* The sub-line used to repeat what the report's own first line says —
       "AUB Tripoli 21st C · 2026-05-01 to 2026-09-17" two lines above "AUB
       Tripoli 21st C — May 1, 2026 to September 17, 2026". The same fact

    var h = pageHead("Report", "Written out as prose, for a meeting, an email or a funder. It is copied or saved, never edited here.",

  /* ================= upkeep and the things it protects ================= */

  // A cadence is not a task and has no due date. It runs every so often since
  // the last time it was done, so falling behind never compounds into a pile of
  // missed occurrences — there is one of each, and it is however far past.
  var PLACES = { desk: "At the desk", away: "Away from the desk", out: "Out of the house" };
  // Reads an added place as readily as a built-in one.
  function placeLabel(k) { return k ? vocabLabel("places", k) : "Anywhere"; }
  /* The built-in floor, not the ceiling — `vocabAll("assetKinds")` is the
     whole of it. Broadened from four pieces of hardware, because the registry
     holds what the work is made of as well as what it is made with. */
  var ASSET_KINDS = {
    file: "File", photo: "Photo", dataset: "Dataset", doc: "Document",
    /* THE TWO KINDS WHOSE CONTENT THE RECORD HOLDS rather than points at —
       see `bodyDialog`. Both carry `a.body`; what separates them is `a.lang`,
       and THE LANGUAGE IS WHAT SAYS WHETHER A BODY IS CODE. That one fact is
       why the brief's five library types are three routes here: a Script and
       a Formula are one record with a different language, a Method and a
       Template are one record with none, and a Reference is a link with a
       note, which the registry already held. Five kinds would have been five
       doors onto three rooms, with nothing on screen saying so. */
    snippet: "Snippet or formula",
    method:  "Method or template",
    software: "Software", site: "Website or service", laptop: "Laptop",
    phone: "Phone", audio: "Audio", gear: "Field kit", other: "Other"
  };

  /* ---------------- the Repo: what you own and what you use ----------------

     Four sections over ONE store. `state.assets` already held files, photos,
     datasets, documents, software and field kit with a path, a link, upkeep
     and provenance — so a second list for "the apps and sites and files I log
     into" would be the same mistake this app already has a rule against:
     one name, one entry, in every list that pools them. The registry IS the
     repo; the Repo tab is where you open things from, and the workbench page
     is where you describe them.

     WHICH SECTION IS STATED, NOT GUESSED. It is tempting to derive it — a url
     and no path is a site, `.exe` is an app — and it is wrong for the same
     reason `parked` is stored on a project: ArcGIS Pro has a path AND a
     licence page, a dataset lives on a share AND in Drive, and a reader who
     types a name should never have to wonder which of four lists it landed
     in. So `a.repo` is asked, with `repoOf()` falling back on the kind so
     every entry written before this lands somewhere sensible with no
     migration. */
  var REPO_PAGES = [
    { id: "device", label: "Devices", one: "device",
      blurb: "What you own and carry. A laptop, a phone, a total station, the headphones." },
    { id: "app",    label: "Apps",    one: "app",
      blurb: "What you open to work. ArcGIS Pro, Agisoft, Illustrator \u2014 with the path the launcher opens." },
    { id: "site",   label: "Sites",   one: "site",
      blurb: "What you log into. Drive, the library catalogue, a mail search you keep coming back to." },
    { id: "file",   label: "Files",   one: "file",
      blurb: "What the work is made of. The orthophoto, the control file, the brochure." },
    /* THE LIBRARY IS THE SAME STORE READ BY TOPIC INSTEAD OF BY KIND. It sits
       on this strip rather than in a tab of its own because it is not a
       different set of things — it is the fifth question you ask of the same
       registry, and a second list would be a second thing to keep in step.
       You do not create a topic either: you write one onto a thing, which is
       what keeps the vocabulary a description of the work rather than a
       taxonomy to maintain. */
    { id: "lib",    label: "Library", one: "entry",
      blurb: "Everything you know, by subject rather than by kind \u2014 the method note beside the dataset beside the paper." },
    /* CONNECTIONS IS THE SAME STORE ASKED A DIFFERENT QUESTION: what can this
       app actually open for me? The mockup draws it as Software / Web
       services / Hardware with a tick against each, and every part of that is
       already in the record — `openHandle()` is the one place that decides
       what "open" means, so a tick here is not a stored flag but that
       function answering yes. A second list of "integrations" would be the
       one name, one entry mistake this file records twice. */
    { id: "conn",   label: "Connections", one: "connection",
      blurb: "What this app can reach: the software it launches, the sites it opens, the hardware you have written down." }
  ];
  var repoTab = "device";   // view state, never saved — a tab lands on its list
  var libTopic = "";        // which subject is open; view state too

  /* The one place a kind decides its section, so the row, the strip's counts
     and the picker cannot disagree. Hardware is a device, software an app, a
     link-shaped thing a site, everything else a file — and an entry that says
     so itself always wins. */
  function repoOf(a) {
    if (a.repo && REPO_PAGES.some(function (p) { return p.id === a.repo; })) return a.repo;
    var k = a.kind;
    /* THE LIBRARY IS A SECTION NOW, not only a lens. It was the same store
       read by subject and `repoOf` never returned it; a snippet has no other
       home — it is not a device, an app, a site or a file on disk — so it
       is filed here, and the Library goes on answering the subject question
       for everything else at the same time. */
    if (k === "snippet") return "lib";
    if (k === "laptop" || k === "phone" || k === "audio" || k === "gear") return "device";
    if (k === "software") return "app";
    if (k === "site") return "site";
    if (k === "other" && a.url && !a.path) return "site";
    return "file";
  }
  function repoIn(id) {
    return live(state.assets).filter(function (a) { return repoOf(a) === id; })
      .sort(function (x, y) { return String(x.name).localeCompare(String(y.name)); });
  }

  /* WHAT "OPEN" MEANS, in one place, because there are three different
     answers and only one of them is a plain link.

     A `url` opens. A PATH ON THIS MACHINE CANNOT: a page served over https is
     not allowed to navigate to `file:///C:/...` — every browser blocks it and
     Chrome blocks it *silently*, so the tap does nothing at all. That is
     exactly what this app's owner reported ("clicking open file from the pc
     don't open the file, it only work with links on web") and the app was not
     broken; the browser was refusing. There are only two real routes and the
     screen now says which one it is on rather than showing a control that
     quietly does nothing:

       - the companion is on   -> mashghal://enter/<id>, which hands the
                                  handler an ID and never a path
       - the companion is off  -> copy the path, and SAY why it cannot just
                                  open, with the one-line fix

     `kind` is what the caller renders; `how` is what to tell the reader. */
  /* `how` is the whole reason, for the tooltip and for the card that states
     it once above the list. `brief` is what a ROW says — because the reason
     is a fact about the machine and not about any one entry, and printed in
     full on every row it was the same twenty words four times on the Files
     page, directly under a card already saying it. Said once, and the rows
     say only what is true of themselves. */
  function openHandle(a) {
    if (a.url) return { kind: "url", href: a.url, label: "Open",
                        how: "opens in the browser", brief: "opens in the browser" };
    if (a.path && state.settings.companion)
      return { kind: "launch", href: "mashghal://enter/" + a.id, label: "Open",
               how: "opens on this machine through the launcher",
               brief: "opens through the launcher" };
    if (a.path) return { kind: "copy", label: "Copy the path",
                         how: "a browser is not allowed to open a file on your machine \u2014 turn the launcher on in Settings and this becomes one tap",
                         brief: "on this machine only" };
    return null;
  }
  var placeFilter = "";   // view state, never saved

  function cadenceState(cd) {
    if (!cd.lastDoneOn) return { never: true, over: 0, since: 0, tone: "p-dim", word: "never done" };
    var since = daysBetween(cd.lastDoneOn, today());
    var over = since - num(cd.everyDays);
    if (over > 0) return { over: over, since: since, tone: "p-oxide", word: over + "d past" };
    if (over > -3) return { over: over, since: since, tone: "p-dim", word: "due in " + (-over) + "d" };
    return { over: over, since: since, tone: "p-grey", word: (-over) + "d to go" };
  }
  // One sentence, in this order: what it guards, where it is doable, when it
  // was last done. What it protects comes first because that is the reason to
  // bother — a stale backup is a threat to the work behind it, not a chore.
  /* "every 1 days" is what a daily backup read as. Two shapes because the
     sentence wants "every day" and the toast wants "in 1 day". */
  function everyWords(n) { return num(n) === 1 ? "every day" : "every " + n + " days"; }
  function everyDaysWords(n) { return num(n) === 1 ? "1 day" : n + " days"; }

  function upkeepSays(x) {
    var cd = x.cd, p = protects(cd), bits = [];
    if (p) bits.push("Keeps " + p + " safe");
    /* "every 1 days" on a daily backup. One helper, because the same
       interval is printed in five places. */
    bits.push((p ? everyWords(cd.everyDays) : cap(everyWords(cd.everyDays))) + ", " +
              String(placeLabel(cd.place)).toLowerCase());
    bits.push(cd.lastDoneOn ? "last done " + niceDate(cd.lastDoneOn) : "never done yet");
    return bits.join(" · ");
  }

  function protects(cd) {
    if (cd.protectsAssetId) return nameOf(state.assets, cd.protectsAssetId, "thing");
    if (cd.protectsBenchId) return benchLabel(cd.protectsBenchId);
    return "";
  }
  function upkeep() {
    return live(state.cadences).map(function (cd) {
      return { cd: cd, st: cadenceState(cd) };
    }).sort(function (a, b) {
      var ra = a.st.never ? 1e6 : a.st.over, rb = b.st.never ? 1e6 : b.st.over;
      return rb - ra;
    });
  }
  function upkeepLate() {
    return upkeep().filter(function (x) { return x.st.never || x.st.over > 0; });
  }

  /* ================= field mode =================

     FIELD MODE IS A POSTURE, NOT A NOUN. The spec asks for it and it would be
     wrong to answer with a fifth kind of record: on site you are not creating
     a new sort of thing, you are doing the same three things under worse
     conditions — one hand, bright sun, no signal, and no patience for
     navigating four levels to reach a camera.

     So it composes what is already here and adds no state but a switch:

       - `place` already exists on upkeep, and out of the house is already a
         place, so "only what is doable where I am" is a filter this app has
         had since upkeep shipped;
       - a photograph already goes straight onto a board, and `pickPicture`
         is already the one way in for every route;
       - a task is already the one thing you type, and one written in a trench
         is the clearest case there is for typing one.

     What field mode changes is the SIZE and the NUMBER of choices. Nothing is
     hidden that would otherwise be reachable — it is the same record, read
     through a screen built for a thumb.

     It is a setting rather than view state, deliberately and against this
     app's usual rule: you turn it on at the site and off in the car, and
     having it survive a reload is the entire point. Every other mode-ish
     thing here (`openId`, `sel`, `repoTab`) resets because a tab should land
     on its list; this one is a fact about where you are. */
  function fieldOn() { return !!state.settings.field; }

  function renderField() {
    var late = dues().filter(function (d) { return d.st === "over"; });
    var tk = openTasks();
    var up = upkeep().filter(function (x) {
      // Out of the house first, but never ONLY: a thing doable anywhere is
      // doable here too, and hiding it would be the app deciding for you.
      return x.st.over > 0 && (!x.cd.place || x.cd.place === "out" || x.cd.place === "away");
    });
    var runs = boards("run").filter(function (b) { return !b.closedOn; });

    var h = '<div class="fieldbar"><div class="grow"><b>Field mode</b>' +
      '<span>Big targets, few choices, nothing that needs two hands.</span></div>' +
      '<button class="btn" data-act="field-off">Leave it</button></div>';

    /* The camera first and biggest, because it is the thing you actually
       came here to do and the thing a small button loses you. It picks the
       board for you when there is only one run going, and asks when there is
       more than one — never silently guessing which piece of work a
       photograph belongs to. */
    h += '<div class="fieldgrid">' +
      '<button class="btn field-big" data-act="field-shot">' +
        '<b>Take a photograph</b><span>' +
        (runs.length === 1 ? esc("straight onto " + runs[0].name)
         : runs.length ? "you choose which run" : "start a run first") +
        "</span></button>" +
      '<button class="btn field-big" data-act="task-add"><b>Write something down</b>' +
        '<span>one line, for later</span></button>' +
      "</div>";

    if (late.length) {
      h += '<div class="sect">Late, and chaseable from here</div><div class="stack tight">' +
        late.slice(0, 5).map(function (d) {
          return '<button type="button" class="panel rowbtn late" data-act="board-open" data-id="' +
            d.board.id + '"><div class="grow"><div class="nm sm">' + esc(d.node.label) + "</div>" +
            '<div class="says">' + esc(d.board.name) + "</div></div></button>";
        }).join("") + "</div>";
    }

    if (up.length) {
      h += '<div class="sect">Doable while you are out</div><div class="stack tight">' +
        up.map(function (x) {
          return '<div class="panel calm late"><div class="grow"><div class="nm sm">' + esc(x.cd.label) + "</div>" +
            '<div class="says">' + esc(x.st.word) + "</div></div>" +
            '<div class="acts"><button class="btn loud" data-act="cadence-done" data-id="' +
            x.cd.id + '">Done</button></div></div>';
        }).join("") + "</div>";
    }

    if (tk.length) {
      h += '<div class="sect">Written down</div><div class="stack tight">' +
        tk.slice(0, 8).map(taskRow).join("") + "</div>";
    }

    if (!late.length && !up.length && !tk.length) {
      h += '<p class="empty">Nothing is waiting on you out here. The camera and the note are above.</p>';
    }
    h += '<p class="saynote foot">Everything is still where it was \u2014 this is the same record with bigger buttons. Nothing has been hidden that you could otherwise reach.</p>';
    return h;
  }

  function upkeepCard() {
    var all = upkeep();
    if (!all.length) {
      return '<div class="sect">Upkeep</div><p class="empty">No cadences yet. They live in Kit — a backup, a firmware update, a haircut.</p>';
    }
    var shown = placeFilter ? all.filter(function (x) { return x.cd.place === placeFilter; }) : all;
    var h = '<div class="sect">Upkeep</div>';
    h += '<div class="tools" style="margin-bottom:0.6rem">' +
      [""].concat(Object.keys(vocabAll("places"))).map(function (pl) {
        return '<button class="btn' + (placeFilter === pl ? " primary" : "") +
          '" data-act="place-filter" data-id="' + pl + '">' +
          esc(pl ? placeLabel(pl) : "Anywhere") + "</button>";
      }).join("") + "</div>";

    h += shown.length ? '<div class="stack tight">' + shown.map(function (x) {
      return '<div class="panel calm' + (x.st.over > 0 ? " late" : "") + '">' +
        '<div class="grow"><div class="nm sm">' + esc(x.cd.label) + "</div>" +
        '<div class="says">' + esc(upkeepSays(x)) + "</div></div>" +
        '<div class="age' + (x.st.over > 0 ? " bad" : "") + '">' + esc(x.st.word) + "</div>" +
        '<div class="acts"><button class="btn' + (x.st.over > 0 ? " loud" : " quiet") +
        '" data-act="cadence-done" data-id="' + x.cd.id + '">Done now</button>' +
        '<button class="btn quiet" data-act="cadence-edit" data-id="' + x.cd.id + '">Edit</button></div></div>';
    }).join("") + "</div>"
      : '<p class="empty">Nothing to do ' + esc(placeFilter ? String(placeLabel(placeFilter)).toLowerCase() : "") + ".</p>";
    return h;
  }

  function assetOpts() {
    return [{ value: "", label: "Nothing in particular" }].concat(opts(state.assets));
  }
  function cadenceDialog(cd, protects) {
    openModal({
      title: cd ? "Edit upkeep" : "New upkeep",
      confirmLabel: cd ? "Save" : "Add",
      message: cd ? "" : "Every so often since it was last done, not on a date. Falling behind never piles up — there is one of each, however far past it is.",
      fields: [
        { key: "label", label: "What", type: "text", value: cd ? cd.label : "", span: true, placeholder: "Back up the GIS project" },
        { key: "everyDays", label: "Every (days)", type: "number", min: 1, value: cd ? num(cd.everyDays) : 30 },
        { key: "place", label: "Where", type: "select", value: cd ? cd.place : "desk",
          options: vocabOpts("places") },
        otherField("places", "placeOther"),
        { key: "lastDoneOn", label: "Last done", type: "text", span: true,
          value: cd ? (cd.lastDoneOn || "") : "", hint: "YYYY-MM-DD, or blank if never" },
        { key: "protectsAssetId", label: "Protects a thing", type: "select", span: true,

        { key: "protectsBenchId", label: "…or protects a bench", type: "select", span: true,
          options: [{ value: "", label: "No bench" }].concat(opts(state.benches, function (b) { return benchLabel(b.id); })),
          value: cd ? (cd.protectsBenchId || "") : "" },
        /* A DRILL IS A CADENCE THAT STARTS A RUN, and that is the whole of it
           — no fifth noun. Asked for "a repeating drill", the two nouns to
           compose were already here: upkeep says *every so often since it was
           last done*, and a procedure says *what to actually do*. A chore you
           tick is upkeep with no procedure named; a drill is upkeep that
           names one, and ticking it starts a run and stamps the date in the
           same act. Only templates are offered: starting a run OF a run is
           not a thing. */
        { key: "runsBoardId", label: "…or runs a whole procedure", type: "select", span: true,
          options: [{ value: "", label: "Nothing \u2014 it is just ticked off" }]
            .concat(opts(boards("template"), function (b) { return b.name; })),
          value: cd ? (cd.runsBoardId || "") : "",
          hint: "A drill: every so often, run this procedure again. Ticking it off starts the run." }
      ],
      validate: function (v) {
        if (!v.label.trim()) return "Give it a name.";
        if (num(v.everyDays) < 1) return "It has to repeat at least every day.";
        /* dayOk, not the shape regex: `2026-13-45` is shaped like a date and
           is not one, and this file already records what that costs — it
           stores, parses to Invalid Date, counts in no week and appears on no
           screen. This dialog had been missed when the rest were fixed. */
        if (v.lastDoneOn.trim() && !dayOk(v.lastDoneOn.trim())) return "A date has to be a real day, written YYYY-MM-DD, or blank.";
        if (v.lastDoneOn.trim() > today()) return "It cannot have been done in the future.";
        return null;
      },
      onConfirm: function (v) {
        go(function () {
          var t = cd;
          if (!t) { t = { id: uid(), archived: false }; state.cadences.push(t); }
          t.label = v.label.trim();
          t.everyDays = num(v.everyDays);
          t.place = vocabTake("places", v.place, v.placeOther, "desk");
          t.lastDoneOn = v.lastDoneOn.trim();
          t.protectsAssetId = v.protectsAssetId;
          t.protectsBenchId = v.protectsAssetId ? "" : v.protectsBenchId;
          // Dropped if the procedure it named has since been deleted, so a
          // drill can never point at a board that is not there.
