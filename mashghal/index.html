     because they run down and leftwards while being perfectly forward.
     Comparing flow depth called a JOIN a loop: "digitise the layers" and
     "types and metadata" both sat at rank 1, because the second is also fed by
     an earlier watch, so a forward edge between them was inked brass and
     labelled "goes back". Plain reachability then flagged EVERY edge in a
     cycle, since each of them can reach its own source — three brass arrows
     round the revision loop instead of one. The stack test marks exactly the
     edge that closes it. */
  function backEdges(b) {
    var back = {}, onStack = {}, done = {};
    function visit(id) {
      onStack[id] = 1;
      nextOf(b, id).forEach(function (e) {
        // Pointing at a node still on the stack means pointing at an ancestor,
        // which is exactly one edge per cycle — the one that closes it.
        if (onStack[e.b]) { back[e.id] = 1; return; }
        if (!done[e.b]) visit(e.b);
      });
      onStack[id] = 0;
      done[id] = 1;
    }
    entryNodes(b).forEach(function (n) { if (!done[n.id]) visit(n.id); });
    // A cycle nothing leads into still has to have its closing edge marked.
    b.nodes.forEach(function (n) { if (n.t === "step" && !done[n.id]) visit(n.id); });
    return back;
  }

  function drawEdges(b, svg) {
    var back$ = backEdges(b);
    var g = svg._gE;
    while (g.firstChild) g.removeChild(g.firstChild);
    b.edges.forEach(function (e) {
      var A = nodeOf(b, e.a), Z = nodeOf(b, e.b);
      if (!A || !Z) return;
      var on = hov && (hov === e.a || hov === e.b);

      if (e.k === "link") {
        var ca = centre(A), cz = centre(Z);
        g.appendChild(svgEl("path", {
          d: "M" + ca.x + "," + ca.y + " L" + cz.x + "," + cz.y,
          fill: "none", stroke: ink("rule-mid"), "stroke-width": on ? 1.6 : 1.3,
          "stroke-dasharray": "1 6", "stroke-linecap": "round",
          "stroke-opacity": on ? 1 : 0.85
        }));
        return;
      }

      var back = !!back$[e.id];
      var live = nodeState(b, A) !== "todo";
      var col = back ? ink("brass") : live ? ink("line") : ink("line-dim");
      var mk = back ? "url(#mar-back)" : live ? "url(#mar)" : "url(#mar-dim)";
      var lx, ly, d;

      if (back) {
        // Over the top, clear of both cards, so a revision cycle reads as a shape.
        var top = Math.min(A.y, Z.y) - 46;
        var ax = A.x + dims(A).w / 2, zx = Z.x + dims(Z).w / 2;
        d = "M" + ax + "," + A.y + " V" + top + " H" + zx + " V" + Z.y;
        lx = (ax + zx) / 2; ly = top - 7;
      } else {
        d = orth(A, Z);
        var pa = side(A, Z.x >= A.x + dims(A).w - 8 ? "r" : "b");
        var pz = side(Z, Z.x >= A.x + dims(A).w - 8 ? "l" : "t");
        lx = (pa.x + pz.x) / 2; ly = (pa.y + pz.y) / 2 - 8;
      }

      g.appendChild(svgEl("path", { d: d, fill: "none", stroke: col,
        "stroke-width": on ? 2 : 1.6, "stroke-linejoin": "round",
        "stroke-opacity": on ? 1 : 0.9, "marker-end": mk }));

      var words = back ? (e.label ? e.label + " — goes back" : "goes back")
                : e.join === "all" ? (e.label ? e.label + " · and the rest" : "and the rest")
                : e.label;
      if (words) {
        var w = Math.min(150, 7 + String(words).length * 6.2);
        g.appendChild(svgEl("rect", { x: lx - w / 2, y: ly - 11, width: w, height: 15, rx: 4,
          fill: ink("sheet"), opacity: 0.96 }));
        var t = svgEl("text", { x: lx, y: ly, fill: back ? ink("brass") : ink("dim"),
          "text-anchor": "middle", "font-size": 11 });
        t.textContent = words;
        g.appendChild(t);
      }
    });
  }

  function drawNodes(b, svg) {
    var INK = nodeInk();
    setTimeout(mountPics, 0);   // the sheet was just rebuilt; refill its frames
    var g = svg._gN;
    while (g.firstChild) g.removeChild(g.firstChild);
    b.nodes.forEach(function (n) {
      var isStep = n.t === "step";
      var st = isStep ? nodeState(b, n) : "";
      var late = st === "over", done = st === "done";
      var isAsk = isStep && n.act === "ask", isFile = isStep && n.act === "file";
      var dated = isStep && !!n.dueAt;
      var says = isStep ? stepMeta(b, n) : "";

      /* Measured BEFORE the card is drawn, and stashed on the node, because
         dims() decides the height from how many lines the name takes and the
         name gets less room on a card carrying a pill. Reading the state after
         calling dims() was how the first version drew a two-line name into a
         one-line card. */
      var room = late ? 18 : st === "now" ? 16 : 26;
      n._room = isStep ? room : 26;
      n._says = says;
      n._pics = isStep ? linkedPics(b, n).length : 0;
      var d = dims(n);

      var outer = svgEl("g", { transform: "translate(" + n.x + "," + n.y + ")", "data-id": n.id });
      var inner = svgEl("g", { "class": "nd" });
      outer.appendChild(inner);

      if (!isStep) { drawThing(n, d, inner); addHandle(outer, d); g.appendChild(outer); return; }

      var fill = late ? ink("late-tint")
               : done ? ink("sunken")
               : (isAsk || isFile) ? ink("sunken")
               : ink("raised");
      var edge = late ? ink("apricot-deep")
               : isFile ? ink("apricot-deep")
               : isAsk ? ink("rule-mid")
               : "";

      if (late) {
        inner.appendChild(svgEl("rect", { "class": "halo", x: -3, y: -3, width: d.w + 6, height: d.h + 6,
          rx: NR + 3, fill: "none", stroke: ink("apricot"), "stroke-width": 5, opacity: 0.14 }));
      }
      inner.appendChild(svgEl("rect", { x: 0, y: 0, width: d.w, height: d.h, rx: NR, fill: fill,
        stroke: edge || "none", "stroke-width": edge ? 1.4 : 0,
        "stroke-dasharray": isFile ? "5 4" : null }));
      if (dated && !done) {
        // Clipped to the card's own radius, or the bar's square corner pokes out.
        var cid = "cl" + n.id;
        var cp = svgEl("clipPath", { id: cid });
        cp.appendChild(svgEl("rect", { x: 0, y: 0, width: d.w, height: d.h, rx: NR }));
        inner.appendChild(cp);
        inner.appendChild(svgEl("rect", { x: 0, y: 0, width: 4, height: d.h,
          fill: ink("sage"), "clip-path": "url(#" + cid + ")" }));
      }
      inner.setAttribute("opacity", done ? 0.72 : 1);

      var pad = dated ? 18 : 15, y = 24;
      var lines = wrap(n.label, room);
      lines.forEach(function (ln, i) {
        var t = svgEl("text", { x: pad, y: y + i * 17,
          fill: done ? ink("receded") : ink("ink"),
          "font-family": isAsk ? "var(--display)" : "inherit",
          "font-weight": isAsk ? 500 : 400,
          "font-size": isAsk ? 16 : 14.5 });
        t.textContent = ln;
        inner.appendChild(t);
      });
      y += lines.length * 17;

      // The one filled mark on the sheet, and only ever on a late step.
      if (late) {
        var pw = 38;
        inner.appendChild(svgEl("rect", { x: d.w - pw - 12, y: 11, width: pw, height: 17, rx: 8.5,
          fill: ink("apricot") }));
        var lp = svgEl("text", { x: d.w - pw / 2 - 12, y: 23.5, fill: ink("page"),
          "text-anchor": "middle", "font-size": 11 });
        lp.textContent = "late";
        inner.appendChild(lp);
      } else if (st === "now") {
        inner.appendChild(svgEl("circle", { cx: d.w - 58, cy: 18, r: 3.4, fill: ink("sage") }));
        var ih = svgEl("text", { x: d.w - 50, y: 22, fill: ink("sage-lift"), "font-size": 11.5 });
        ih.textContent = "in hand";
        inner.appendChild(ih);
      }

      var pics = linkedPics(b, n);
      if (pics.length) {
        // A row of small frames along the bottom of the card, so the sheet
        // shows what the step is actually about rather than that a link exists.
        var tw = 34, th = 26, gap = 4;
        pics.slice(0, 4).forEach(function (t, i) {
          var px = pad + i * (tw + gap), py = d.h - th - 8;
          var cid2 = "sp" + n.id + i;
          var cp2 = svgEl("clipPath", { id: cid2 });
          cp2.appendChild(svgEl("rect", { x: px, y: py, width: tw, height: th, rx: 5 }));
          inner.appendChild(cp2);
          inner.appendChild(svgEl("image", { x: px, y: py, width: tw, height: th,
            "clip-path": "url(#" + cid2 + ")", preserveAspectRatio: "xMidYMid slice",
            "data-pic": t.pic }));
        });
      }

      var gr = gridOf(n);
      if (gr) { drawGrid(gr, d, inner, y + 4); }
      else if (says) {
        wrap(says, 34).slice(0, 2).forEach(function (ln, i) {
          // Lifted clear of the picture strip, which the card grew to hold —
          // otherwise the prose is drawn straight through the thumbnails.
          var m = svgEl("text", { x: pad,
            y: d.h - 14 + i * 15 - (says.length > 34 ? 15 : 0) - (pics.length ? 34 : 0),
            fill: late ? ink("apricot-mute") : done ? ink("receded") : ink("faint"),
            "font-size": 11.5 });
          m.textContent = ln;
          inner.appendChild(m);
        });
      }
      addHandle(outer, d);
      g.appendChild(outer);
    });
  }

  /* The handle you drag to connect. It sits outside the card on the right and
     only shows on hover, so the sheet is not covered in dots — but it is a real
     target, not a hairline, because this is the gesture the whole model rests
     on and it has to be hittable with a trackpad. */
  function addHandle(outer, d) {
    var h = svgEl("g", { "class": "hnd", "data-handle": "1" });
    h.appendChild(svgEl("circle", { cx: d.w + 11, cy: d.h / 2, r: 12, fill: "transparent" }));
    h.appendChild(svgEl("circle", { cx: d.w + 11, cy: d.h / 2, r: 5.5,
      fill: ink("sheet"), stroke: ink("line"), "stroke-width": 1.5 }));
    outer.appendChild(h);
  }

  /* A thing is a pill with its KIND written inside it, small and faint, then
     its name — "person  R. Haddad". The kind was carried only by colour before,
     which meant the board could not be read by anyone who had not been told
     the code. */
  /* A thing holding a picture is drawn AS the picture, with its name on a strip
     underneath. The <image> is filled in afterwards by mountPics(), because
     IndexedDB is asynchronous and the sheet is not — a picture not on this
     device leaves the frame empty and the name still reads.

     This is most of the point of pictures being here: on a sheet about aerial
     photographs, "frame 1962-04" and the actual frame are not the same
     information. */
  function drawThing(n, d, inner) {
    if (n.pic) {
      var cid = "pc" + n.id;
      var cp = svgEl("clipPath", { id: cid });
      cp.appendChild(svgEl("rect", { x: 0, y: 0, width: d.w, height: PH, rx: 10 }));
      inner.appendChild(cp);
      inner.appendChild(svgEl("rect", { x: 0, y: 0, width: d.w, height: d.h, rx: 11,
        fill: ink("sunken"), stroke: ink("rule"), "stroke-width": 1 }));
      inner.appendChild(svgEl("image", { x: 0, y: 0, width: d.w, height: PH,
        "clip-path": "url(#" + cid + ")", preserveAspectRatio: "xMidYMid slice",
        "data-pic": n.pic }));
      var cap = svgEl("text", { x: d.w / 2, y: d.h - 6, fill: ink("dim"),
        "text-anchor": "middle", "font-size": 11 });
      cap.textContent = clip(n.label, 20);
      inner.appendChild(cap);
      return;
    }
    inner.appendChild(svgEl("rect", { x: 0, y: 0, width: d.w, height: d.h, rx: d.h / 2,
      fill: ink("sunken"), stroke: ink("rule"), "stroke-width": 1 }));
    var kind = String(vocabLabel("things", n.kind) || "thing").toLowerCase();
    var kt = svgEl("text", { x: 15, y: d.h / 2 + 4, fill: ink("faint"), "font-size": 10.5 });
    kt.textContent = kind;
    inner.appendChild(kt);
    var nx = 15 + String(kind).length * 6 + 10;
    var t = svgEl("text", { x: nx, y: d.h / 2 + 4.5, fill: ink("dim"), "font-size": 12.5 });
    t.textContent = clip(n.label, 22);
    inner.appendChild(t);
  }

  /* The thing every one of the five board treatments drew independently: a
     small matrix INSIDE one step, so "digitise the layers" is one step holding
     nine cells rather than nine steps. Filled is done, outlined is in hand,
     empty is still to go — and the count is written underneath, because a grid
     of squares is a picture and the sentence is the fact. */
  function drawGrid(gr, d, inner, top) {
    var x0 = 15 + CLAB, cw = (d.w - 30 - CLAB - (gr.cols.length - 1) * CGAP) / gr.cols.length;
    gr.cols.forEach(function (c, i) {
      var t = svgEl("text", { x: x0 + i * (cw + CGAP) + cw / 2, y: top + 9,
        fill: ink("faint"), "font-size": 10, "text-anchor": "middle" });
      t.textContent = clip(String(c), 5);
      inner.appendChild(t);
    });
    var done = 0, hand = 0, togo = 0;
    gr.rows.forEach(function (r, ri) {
      var ry = top + 17 + ri * (CELL + CGAP);
      var rl = svgEl("text", { x: 15, y: ry + CELL - 4, fill: ink("dim"), "font-size": 10 });
      rl.textContent = clip(String(r), 6);
      inner.appendChild(rl);
      gr.cols.forEach(function (c, ci) {
        var v = (gr.cells && gr.cells[ri + ":" + ci]) || "";
        if (v === "done") done++; else if (v === "hand") hand++; else togo++;
        inner.appendChild(svgEl("rect", {
          x: x0 + ci * (cw + CGAP), y: ry, width: cw, height: CELL, rx: 5,
          fill: v === "done" ? ink("sage-deep") : v === "hand" ? "none" : ink("rule"),
          stroke: v === "hand" ? ink("sage") : "none", "stroke-width": v === "hand" ? 1.5 : 0
        }));
      });
    });
    var sum = svgEl("text", { x: 15, y: d.h - 10, fill: ink("faint"), "font-size": 11.5 });
    sum.textContent = done + " done, " + hand + " in hand, " + togo + " to go";
    inner.appendChild(sum);
  }

  function stepMeta(b, n) {
    // A template has no history, so it describes what it WILL do.
    if (b.kind !== "run") {
      if (n.act === "send") {
        return n.chaseDays ? "Starts a wait · remind after " + n.chaseDays + "d"
                           : "Starts a wait · no reminder set";
      }
      if (n.act === "watch") return n.chaseDays ? "A wait · check back after " + n.chaseDays + "d"
                                                : "A wait with nobody to chase";
      if (n.act === "ask") return "Two ways out — one goes back";
      if (n.act === "file") return "Putting away · will block closing";
      return n.dueAt ? "Fixed by the day, not by you" : "";
    }
    var st = nodeState(b, n), d = daysWaiting(n);
    var who = recipientsOf(b, n).map(function (t) { return t.label; }).join(" and ");

    if (st === "done") return n.doneAt ? "Done " + niceDate(n.doneAt) : "Done";
    if (st === "over") {
      var past = overdueBy(n);
      return (who ? "With " + who + " " + numWord(d) + " days. " : numWord(d) + " days. ") +
        "You meant to chase after " + num(n.chaseDays) + ".";
    }
    if (st === "waiting") {
      if (n.dueAt) return niceDate(n.dueAt) + ". Fixed by the day, not by you.";
      if (!n.chaseDays) return numWord(d) + " days. Nobody to chase, so it is not late.";
      return numWord(d) + " days. You will chase after " + num(n.chaseDays) + ".";
    }
    if (st === "now") {
      if (n.dueAt) return niceDate(n.dueAt) + ". Fixed by the day, not by you.";
      if (n.act === "file") return "Until this is done, nothing closes.";
      return d ? numWord(d) + " days in hand." : "Yours, from today.";
    }
    return "";
  }
  function wrap(s, max) {
    var words = String(s).split(/\s+/), lines = [], cur = "";
    words.forEach(function (w) {
      if (!cur) { cur = w; return; }
      if ((cur + " " + w).length <= max) cur += " " + w;
      else { lines.push(cur); cur = w; }
    });
    if (cur) lines.push(cur);
    return lines.slice(0, 2);
  }
  function clip(s, max) { return String(s).length > max ? String(s).slice(0, max - 1) + "…" : String(s); }

  function boundsOf(b) {
    var x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9;
    b.nodes.forEach(function (n) {
      var d = dims(n);
      x1 = Math.min(x1, n.x); y1 = Math.min(y1, n.y);
      x2 = Math.max(x2, n.x + d.w); y2 = Math.max(y2, n.y + d.h);
    });
    if (x1 > x2) { x1 = 0; y1 = 0; x2 = 800; y2 = 400; }
    return { x1: x1, y1: y1, x2: x2, y2: y2 };
  }
  function applyVB() { if (cvSvg) cvSvg.setAttribute("viewBox", vb.x + " " + vb.y + " " + vb.w + " " + vb.h); }

  function fitBoard(b) {
    if (!cvSvg) return;
    var bd = boundsOf(b), pad = 52, r = cvSvg.getBoundingClientRect();
    var ar = (r.height && r.width) ? r.height / r.width : 0.6;
    var cw = (bd.x2 - bd.x1) + pad * 2, ch = (bd.y2 - bd.y1) + pad * 2;
    var w = cw, h = w * ar;
    if (h < ch) { h = ch; w = h / ar; }
    // The title block and the legend float over the foot of the sheet, so the
    // fit leaves their height clear at the bottom — otherwise the last row of
    // steps sits underneath them and cannot be read.
    var foot = (r.height && ar) ? (58 / r.height) * h : 0;
    if (foot) { h += foot; w = h / ar; }
    vb = { x: (bd.x1 + bd.x2) / 2 - w / 2,
           y: (bd.y1 + bd.y2) / 2 - h / 2 + foot / 2, w: w, h: h };
    applyVB();
  }

  function toSvg(ev) {
    var r = cvSvg.getBoundingClientRect();
    return { x: vb.x + (ev.clientX - r.left) / r.width * vb.w,
             y: vb.y + (ev.clientY - r.top) / r.height * vb.h };
  }
  function zoomBy(f, cx, cy) {
    var nw = vb.w / f, nh = vb.h / f;
    if (nw < 380 || nw > 6000) return;
    vb.x = cx - (cx - vb.x) * (nw / vb.w);
    vb.y = cy - (cy - vb.y) * (nh / vb.h);
    vb.w = nw; vb.h = nh; applyVB();
  }

  var wire = null;   // a connection being drawn, never saved

  function clearWire() {
    if (!cvSvg) return;
    var old = cvSvg.querySelector("#wireline");
    if (old) old.remove();
  }
  function drawWire(b) {
    clearWire();
    var d = dims(wire.from);
    var g = svgEl("g", { id: "wireline" });
    g.appendChild(svgEl("path", {
      d: "M" + (wire.from.x + d.w) + "," + (wire.from.y + d.h / 2) +
         " L" + wire.x + "," + wire.y,
      fill: "none", stroke: ink(wire.over ? "sage" : "line"),
      "stroke-width": 1.8, "stroke-dasharray": wire.over ? "" : "4 4",
      "stroke-linecap": "round"
    }));
    g.appendChild(svgEl("circle", { cx: wire.x, cy: wire.y, r: 4,
      fill: ink(wire.over ? "sage" : "line") }));
    cvSvg.appendChild(g);
  }

  /* Dropping on a node asks WHAT the connection is, because sequence and
     association are different edges and the app must never decide which.
     A step onto a step offers both; anything involving a thing can only be an
     association, so it does not ask a question with one answer. */
  function askConnect(b, from, to) {
    var canFlow = from.t === "step" && to.t === "step";
    if (!canFlow) {
      go(function () {
        b.edges.push({ id: uid(), a: from.id, b: to.id, k: "link", label: "" });
      });
      toast("Linked — belongs with, in no order");
      return;
    }
    openModal({
      title: "What is this connection?",
      message: "Sequence and association are different things and the board draws them differently. One is the order the work happens in; the other is a reference that has no order at all.",
      confirmLabel: "Connect",
      fields: [
        { key: "k", label: "It means", type: "select", span: true, value: "then", options:
          Object.keys(EDGE_KINDS).map(function (k) {
            return { value: k, label: "“" + clip(to.label, 20) + "” " + EDGE_KINDS[k].says };
          }).concat([{ value: "link", label: "They belong together, in no order" }]) },
        { key: "label", label: "Or your own words", type: "text", span: true, value: "",
          hint: "What this way out is called on the board. Left blank it takes the name above." }
      ],
      onConfirm: function (v) {
        var isLink = v.k === "link";
        var kind = EDGE_KINDS[v.k];
        go(function () {
          b.edges.push({ id: uid(), a: from.id, b: to.id,
                         k: isLink ? "link" : "flow",
                         join: v.k === "all" ? "all" : v.k === "any" ? "any" : "",
                         label: isLink ? "" :
                           (v.label.trim() || (v.k === "then" ? "" : kind ? kind.word : "")) });
        });
        toast(isLink ? "Linked" : "Connected — " + (kind ? kind.says : "comes after"));
      }
    });
  }

  function mountCanvas() {
    cvSvg = document.getElementById("cv");
    if (!cvSvg) return;
    var b = openBoard();
    if (!b) { cvSvg = null; return; }
    if (b.nodes.some(function (n) { return typeof n.x !== "number"; })) { autoLayout(b); save(); }
    drawBoard(b, cvSvg);
    fitBoard(b);

    cvSvg.addEventListener("pointerdown", function (ev) {
      var g = ev.target.closest ? ev.target.closest("g[data-id]") : null;
      var onHandle = ev.target.closest ? ev.target.closest("[data-handle]") : null;
      var p = toSvg(ev);
      if (g && onHandle) {
        // Drawing a connection, not moving the node.
        var from = nodeOf(b, g.getAttribute("data-id"));
        if (from) {
          wire = { from: from, x: p.x, y: p.y };
          cvSvg.setPointerCapture(ev.pointerId);
          return;
        }
      }
      if (g) {
        var n = nodeOf(b, g.getAttribute("data-id"));
        if (n) { drag = { n: n, dx: p.x - n.x, dy: p.y - n.y, moved: false };
                 cvSvg.setPointerCapture(ev.pointerId); return; }
      }
      pan = { x: p.x, y: p.y };
      cvSvg.classList.add("grabbing");
      cvSvg.setPointerCapture(ev.pointerId);
    });

    cvSvg.addEventListener("pointermove", function (ev) {
      if (wire) {
        var w = toSvg(ev);
        wire.x = w.x; wire.y = w.y;
        /* Pointer capture is on, so every event targets the svg itself and
           ev.target can never be the node under the cursor. Ask the document
           what is actually there. (#wireline is pointer-events:none, or the
           line being dragged would shadow its own target.) */
        var el = document.elementFromPoint(ev.clientX, ev.clientY);
        var t = el && el.closest ? el.closest("g[data-id]") : null;
        wire.over = t ? t.getAttribute("data-id") : null;
        if (wire.over === wire.from.id) wire.over = null;
        drawWire(b);
        return;
      }
      if (drag) {
        var p = toSvg(ev);
        drag.n.x = Math.round(p.x - drag.dx);
        drag.n.y = Math.round(p.y - drag.dy);
        drag.moved = true;
        var g = cvSvg._gN.querySelector('g[data-id="' + drag.n.id + '"]');
        if (g) g.setAttribute("transform", "translate(" + drag.n.x + "," + drag.n.y + ")");
        drawEdges(b, cvSvg);
      } else if (pan) {
        var q = toSvg(ev);
        vb.x -= (q.x - pan.x); vb.y -= (q.y - pan.y); applyVB();
      } else {
        var t = ev.target.closest ? ev.target.closest("g[data-id]") : null;
        var id = t ? t.getAttribute("data-id") : null;
        if (id !== hov) { hov = id; drawEdges(b, cvSvg); }
      }
    });

    function endPointer(ev) {
      if (wire) {
        var to = wire.over ? nodeOf(b, wire.over) : null;
        var from = wire.from;
        wire = null;
        clearWire();
        if (to) askConnect(b, from, to);
      }
      if (drag && drag.moved) save();
      if (drag && !drag.moved) editNode(b, drag.n);
      drag = null; pan = null;
      cvSvg.classList.remove("grabbing");
      if (cvSvg.hasPointerCapture && cvSvg.hasPointerCapture(ev.pointerId)) cvSvg.releasePointerCapture(ev.pointerId);
    }
    cvSvg.addEventListener("pointerup", endPointer);
    cvSvg.addEventListener("pointercancel", endPointer);
    cvSvg.addEventListener("pointerleave", function () { if (hov) { hov = null; drawEdges(b, cvSvg); } });
    cvSvg.addEventListener("wheel", function (ev) {
      ev.preventDefault();
      var p = toSvg(ev);
      zoomBy(ev.deltaY < 0 ? 1.12 : 1 / 1.12, p.x, p.y);
    }, { passive: false });
  }

  /* ================= writing a procedure as prose =================

     The most useful thing in the whole design round, and the thing that makes
     the graph model bearable: you type the procedure the way you already write
     it, and the app reads it back. Nobody drags nine boxes and eighteen arrows
     to describe something they can say in nine lines.

         design it
         → send a draft to N. Aoun, S. Frem (remind me after 5 days)
         → fix their notes
         → go round again, or stop?
             again → fix their notes
             stop  → file the final version
         → watch the printing
         → archive

     Two rules hold it honest.

     It NEVER guesses. A line it cannot place comes back as unplaced, named, and
     left for you — "keep the press quote near watch the printing" is either a
     step or a thing hanging off one, and only the writer knows which. Guessing
     would quietly put a wrong shape in the record, which is the failure this
     whole app is built to avoid.

     And nothing exists until it is accepted. parseProse() returns a reading;
     it writes nothing. The screen shows what it understood, and a tap is what
     commits it — the same discipline as the adviser proposing and never acting.
  */

  var ARROW = /^\s*(?:→|->|=>|>|·|\*|-|—|\d+[.)])\s+/;

  // "(remind me after 5 days)", "(chase after 5d)", "(after 5 days)"
  var RE_CHASE = /\((?:remind(?:\s+me)?|chase|check\s*back|nudge)?\s*(?:after\s*)?(\d+)\s*(?:d|days?)\)/i;
  // "on Friday", "by 18 September", "at 3:45" — a date the writer states.
  var RE_DATED = /\b(?:on|by|due)\s+([A-Z][a-z]+day|\d{1,2}\s+[A-Z][a-z]+|\d{4}-\d{2}-\d{2})\b/;

  var VERBS = [
    { act: "send",  re: /^(?:send|email|mail|share|submit|post|give)\b/i },
    { act: "watch", re: /^(?:watch|monitor|wait|await|follow\s+up|track|chase)\b/i },
    { act: "file",  re: /^(?:file|archive|put\s+away|store|upload|deposit|save)\b/i },
    { act: "ask",   re: /\?\s*$/ }
  ];

  function actOf(text) {
    for (var i = 0; i < VERBS.length; i++) if (VERBS[i].re.test(text)) return VERBS[i].act;
    return "do";
  }

  // "send a draft to N. Aoun, S. Frem" -> ["N. Aoun", "S. Frem"]
  function peopleIn(text) {
    var m = /\bto\s+(.+?)(?:\s*\(|$)/i.exec(text);
    if (!m) return [];
    return m[1].split(/\s*(?:,|\band\b|&)\s*/)
      .map(function (x) { return x.trim().replace(/[.;:]+$/, ""); })
      .filter(function (x) {
        // A name, not the rest of the sentence: short, and starting upper case.
        return x && x.length <= 34 && /^[A-Z\u0600-\u06FF]/.test(x) && x.split(/\s+/).length <= 4;
      });
  }

  function parseProse(text) {
    var raw = String(text || "").split(/\n/);
    var steps = [], exits = [], unplaced = [], people = {};

    raw.forEach(function (line, idx) {
      var t = line.replace(/\s+$/, "");
      if (!t.trim()) return;
      var indented = /^\s{2,}|^\t/.test(line);
      var body = t.replace(ARROW, "").trim();
      if (!body) return;

      // An indented "again → fix their notes" is an EXIT of the question above
      // it, not a step of its own. This is how a branch gets written by hand.
      var ex = /^(.+?)\s*(?:→|->|=>)\s*(.+)$/.exec(body);
      if (indented && ex) {
        exits.push({ label: ex[1].trim(), target: ex[2].trim(), line: idx });
        return;
      }
      // A line with no arrow, not indented, and not the first — the writer was
      // saying something about the work rather than naming a step. Do not
      // guess which: hand it back.
      if (!ARROW.test(t) && steps.length && !indented) {
        unplaced.push({ text: body, line: idx,
          why: "a step of its own, or a thing hanging off one? It won't guess." });
        return;
      }

      var chase = RE_CHASE.exec(body);
      var dated = RE_DATED.exec(body);
      var clean = body.replace(RE_CHASE, "").trim().replace(/\s{2,}/g, " ");
      var act = actOf(clean);
      var to = act === "send" ? peopleIn(clean) : [];
      to.forEach(function (n) { people[n] = 1; });

      steps.push({
        label: cap(clean.replace(/\s*[.;]$/, "")),
        act: act,
        chaseDays: chase ? num(chase[1]) : (act === "send" || act === "watch" ? 0 : 0),
        dueWords: dated ? dated[1] : "",
        to: to,
        line: idx
      });
    });

    /* Each way out names where it goes. Matching an existing step is a jump or
       a loop; naming one that has not been written yet MAKES it, because the
       writer named it — in the worked example "file the final version" appears
       only as the stop branch and is plainly a step. That is not the parser
       guessing: it is taking the writer at their word. What it still refuses to
       do is decide the SHAPE of a line nobody pointed anywhere. */
    exits.forEach(function (x) {
      var want = x.target.toLowerCase();
      var hit = -1;
      steps.forEach(function (st, i) {
        var lab = st.label.toLowerCase();
        if (hit < 0 && (lab === want || lab.indexOf(want) === 0 || want.indexOf(lab) === 0)) hit = i;
      });
      if (hit < 0) {
        var made = { label: cap(x.target), act: actOf(x.target), chaseDays: 0,
                     dueWords: "", to: [], line: x.line, made: true };
        steps.push(made);
        hit = steps.length - 1;
      }
      x.toIndex = hit;
    });

    return { steps: steps, exits: exits, unplaced: unplaced, people: Object.keys(people) };
  }

  // Turn an accepted reading into a real board. Separate from the parse on
  // purpose: the parse is allowed to run on every keystroke, this is not.
  function boardFromProse(name, benchId, kindId, read) {
    var nodes = [], edges = [], byIdx = {};
    read.steps.forEach(function (st, i) {
      var n = { id: uid(), t: "step", act: st.act, label: st.label,
                chaseDays: st.chaseDays || "", dueAt: "", enteredAt: "", doneAt: "", answer: "" };
      byIdx[i] = n; nodes.push(n);
    });
    // Sequence: each step follows the one above, except where an exit already
    // says otherwise — a question's ways out replace its straight-through.
    var branched = {};
    read.exits.forEach(function (x) {
      var from = -1;
      read.steps.forEach(function (st, i) { if (st.line < x.line) from = i; });
      if (from < 0) return;
      branched[from] = 1;
      edges.push({ id: uid(), a: byIdx[from].id, b: byIdx[x.toIndex].id, k: "flow", label: x.label });
    });
    read.steps.forEach(function (st, i) {
      if (i + 1 >= read.steps.length || branched[i]) return;
      edges.push({ id: uid(), a: byIdx[i].id, b: byIdx[i + 1].id, k: "flow", label: "" });
    });
    // People named in a send become things, linked to the step that names them.
    read.steps.forEach(function (st, i) {
      st.to.forEach(function (who) {
        var t = { id: uid(), t: "thing", kind: "person", label: who };
        nodes.push(t);
        edges.push({ id: uid(), a: t.id, b: byIdx[i].id, k: "link", label: "" });
      });
    });
    return { id: uid(), kind: "template", name: name, benchId: benchId || "", kindId: kindId || "",
             fromBoardId: "", nodes: nodes, edges: edges, startedOn: "", closedOn: "", archived: false };
  }

  /* The writing screen. Prose on the left, what it understood on the right,
     and nothing written until it is accepted. */
  var proseText = "";   // view state, never saved

  var PROSE_SEED = [
    "design it",
    "→ send a draft to N. Aoun, S. Frem (remind me after 5 days)",
    "→ fix their notes",
    "→ send v2, ask for a backup",
    "→ go round again, or stop?",
    "    again → fix their notes",
    "    stop → file the final version",
    "→ watch the printing",
    "→ archive"
  ].join("\n");

  function renderWrite() {
    var read = parseProse(proseText);
    var h = '<div class="finding"><h1>Write a procedure</h1></div>' +
      '<p class="saynote">Type it the way you already write it. An arrow for what comes next, an indented line for a way out of a question, and brackets for when to be reminded.</p>';

    h += '<div class="writegrid">';
    h += '<div class="writebox"><textarea id="proseIn" spellcheck="false" placeholder="' +
      esc(PROSE_SEED) + '">' + esc(proseText) + "</textarea>" +
      '<div class="tools"><button class="btn" data-act="prose-seed">Use the worked example</button>' +
      '<button class="btn" data-act="prose-clear">Clear</button></div></div>';

    h += '<div class="readback">';
    if (!read.steps.length) {
      h += '<p class="empty">Nothing read yet. Every line becomes a step; nothing is written down until you accept it.</p>';
    } else {
      h += '<div class="sect" style="margin-top:0">Read back — ' +
        read.steps.length + (read.steps.length === 1 ? " step" : " steps") + "</div>";
      h += '<div class="stack tight">' + read.steps.map(function (st, i) {
        var out = read.exits.filter(function (x) {
          var from = -1;
          read.steps.forEach(function (s2, j) { if (s2.line < x.line) from = j; });
          return from === i;
        });
        return '<div class="panel calm"><div class="grow">' +
          '<div class="nm sm">' + esc(st.label) + (st.made ? ' <span class="made">made from a way out</span>' : "") + "</div>" +
          '<div class="says">' + esc(proseSays(st, read)) + "</div>" +
          (out.length ? '<div class="says">' + out.map(function (x) {
            return "<b>" + esc(x.label) + "</b> → " + esc(read.steps[x.toIndex].label) +
              (x.toIndex <= i ? " <em>(goes back)</em>" : "");
          }).join("<br>") + "</div>" : "") +
          "</div></div>";
      }).join("") + "</div>";

      if (read.people.length) {
        h += '<div class="sect">People it names</div><p class="saynote" style="margin:0">' +
          esc(read.people.join(" · ")) + " — each becomes a thing hanging off the step that names them.</p>";
      }
    }

    if (read.unplaced.length) {
      h += '<div class="sect">' + (read.unplaced.length === 1 ? "One line it could not place" :
        cap(numWord(read.unplaced.length)) + " lines it could not place") + "</div>" +
        '<div class="stack tight">' + read.unplaced.map(function (u) {
          return '<div class="panel dashed"><div class="grow">' +
            '<div class="nm sm">“' + esc(u.text) + '”</div>' +
            '<div class="says">' + esc(u.why) + " Left for you.</div></div></div>";
        }).join("") + "</div>";
    }

    h += '<div class="tools" style="margin-top:1.2rem">' +
      '<button class="btn primary" data-act="prose-accept"' + (read.steps.length ? "" : " disabled") + '>' +
      (read.steps.length ? "Accept — " + read.steps.length + " steps" : "Nothing to accept") + "</button>" +
      '<span class="saynote" style="margin:0;align-self:center">Nothing exists until you accept it.</span></div>';
    h += "</div></div>";
    return h;
  }

  /* Re-reads as you type, but debounced and never while the cursor is in the
     box — re-rendering a textarea under someone's hands loses the caret, which
     is the single most annoying thing a live preview can do. The reading is
     refreshed on a pause and on blur. */
  var proseTimer = null;
  function mountProse() {
    var ta = document.getElementById("proseIn");
    if (!ta) return;
    ta.addEventListener("input", function () {
      proseText = ta.value;
      if (proseTimer) clearTimeout(proseTimer);
      proseTimer = setTimeout(function () {
        proseTimer = null;
        var at = ta.selectionStart;
        render();
        var again = document.getElementById("proseIn");
        if (again) { again.focus(); try { again.setSelectionRange(at, at); } catch (e) {} }
      }, 500);
    });
    ta.addEventListener("blur", function () { proseText = ta.value; });
  }

  function proseSays(st, read) {
    var bits = [ACTS[st.act].label];
    if (st.act === "send" && st.to.length) bits.push("to " + st.to.join(" and "));
    if (st.chaseDays) bits.push("remind after " + st.chaseDays + " days");
    else if (st.act === "send" || st.act === "watch") bits.push("no reminder set");
    if (st.act === "file") bits.push("will block closing");
    if (st.dueWords) bits.push("dated: " + st.dueWords);
    return bits.join(" · ");
  }

  /* ================= actions ================= */

  function split(id) { var p = String(id).split(":"); return { b: byId(state.boards, p[0]), n: p[1] }; }
  function go(fn) { fn(); stampRecords(); save(); render(); syncSoon(); bkMaybe(); }

  function editNode(b, n) { APP.actions["node-edit"](b.id + ":" + n.id); }

  APP.actions = {
    /* ---- boards ---- */
    "board-open": function (id) { openId = id; view = "boards"; render(); },
    "board-back": function () { openId = ""; render(); },

    "board-new": function () {
      openModal({
        title: "New board", confirmLabel: "Create",
        message: "A board is a procedure you can run again and again. A bench is optional — a visa belongs to no employer.",
        fields: [
          { key: "name", label: "Name", type: "text", value: "", span: true, placeholder: "Brochure" },
          { key: "kindId", label: "Kind", type: "select", options: kindOpts(), value: "" },
          { key: "benchId", label: "Bench", type: "select", options: benchOpts(), value: "" }
        ],
        validate: function (v) { return v.name.trim() ? null : "Give it a name."; },
        onConfirm: function (v) {
          go(function () {
            var b = newBoard(v.name.trim(), v.kindId, v.benchId);
            state.boards.push(b);
            openId = b.id;
          });
          toast("Board created");
        }
      });
    },

    "board-edit": function (id) {
      var b = byId(state.boards, id); if (!b) return;
      openModal({
        title: "Rename board", confirmLabel: "Save",
        fields: [
          { key: "name", label: "Name", type: "text", value: b.name, span: true },
          { key: "kindId", label: "Kind", type: "select", options: kindOpts(), value: b.kindId },
          { key: "benchId", label: "Bench", type: "select", options: benchOpts(), value: b.benchId }
        ],
        validate: function (v) { return v.name.trim() ? null : "Give it a name."; },
        onConfirm: function (v) {
          go(function () { b.name = v.name.trim(); b.kindId = v.kindId; b.benchId = v.benchId; });
        }
      });
    },

    "board-del": function (id) {
      var b = byId(state.boards, id); if (!b) return;
      var runs = state.boards.filter(function (r) { return r.fromBoardId === b.id && !r.archived; });
      confirmAction({
        title: "Delete " + b.name + "?",
        message: b.kind === "template" && runs.length
          ? "Its " + runs.length + " run" + (runs.length === 1 ? "" : "s") +
            " will be left alone — a run froze its own copy when it started, so nothing of theirs is lost."
          : "This cannot be undone from here, though a backup would still have it."
      }, function () {
        go(function () {
          b.archived = true;
          state.forgotten[b.id] = b.name;
          if (openId === b.id) openId = "";
        });
        toast("Deleted " + b.name);
      });
    },

    /* ---- runs ---- */
    "run-start": function () {
      var tpls = boards("template");
      if (!tpls.length) { toast("Write a procedure first."); return; }
      openModal({
        title: "Start a run", confirmLabel: "Start",
        message: "The run takes its own frozen copy of the procedure. Editing the procedure later will not disturb it.",
        fields: [
          { key: "boardId", label: "Procedure", type: "select",
            options: tpls.map(function (t) { return { value: t.id, label: t.name }; }), value: tpls[0].id },
          { key: "title", label: "Call this run", type: "text", value: "", span: true, placeholder: "Harbour festival brochure" }
        ],
        validate: function (v) { return v.title.trim() ? null : "Give the run a name you will recognise."; },
        onConfirm: function (v) {
          var tpl = byId(state.boards, v.boardId);
          if (!tpl) return;
          go(function () { openId = startRun(tpl, v.title.trim()).id; });
          toast("Run started");
        }
      });
    },

    "run-this": function (id) {
      var tpl = byId(state.boards, id); if (!tpl) return;
      if (!tpl.nodes.filter(function (n) { return n.t === "step"; }).length) {
        toast("Add a step before running it."); return;
      }
      openModal({
        title: "Run " + tpl.name, confirmLabel: "Start",
        fields: [{ key: "title", label: "Call this run", type: "text", value: "", span: true }],
        validate: function (v) { return v.title.trim() ? null : "Give the run a name."; },
        onConfirm: function (v) {
          go(function () { openId = startRun(tpl, v.title.trim()).id; });
          toast("Run started");
        }
      });
    },

    "run-close": function (id) {
      var b = byId(state.boards, id); if (!b) return;
      var uf = unfiled(b);
      if (uf.length) {
        openModal({
          title: "Not filed yet",
          message: "This run still has " + uf.length + " filing step" + (uf.length === 1 ? "" : "s") +
            " undone — <b>" + esc(uf.map(function (n) { return n.label; }).join(", ")) +
            "</b>. Filing is the thing that gets forgotten, so a run will not close until it is done.",
          confirmLabel: "Leave it open", cancelLabel: "Close anyway",
          onConfirm: function () {},
          onCancel: function () {
            go(function () { b.closedOn = today(); });
            toast("Closed " + b.name + " with filing undone");
          }
        });
        return;
      }
      go(function () { b.closedOn = today(); });
      toast("Closed " + b.name, function () { b.closedOn = ""; });
    },

    "run-reopen": function (id) {
      var b = byId(state.boards, id); if (!b) return;
      go(function () { b.closedOn = ""; });
      toast("Reopened");
    },

    /* ---- steps in a run ---- */
    "step-done": function (id) {
      var s = split(id); if (!s.b) return;
      var n = nodeOf(s.b, s.n); if (!n) return;
      var before = JSON.stringify(s.b.nodes);
      go(function () { finishStep(s.b, s.n); });
      toast("Done: " + n.label, function () { s.b.nodes = JSON.parse(before); });
    },
    "step-enter": function (id) {
      var s = split(id); if (!s.b) return;
      go(function () { enter(s.b, s.n); });
    },
    "step-reopen": function (id) {
      var s = split(id); if (!s.b) return;
      go(function () { reopenStep(s.b, s.n); });
    },
    "step-answer": function (id) {
      var s = split(id); if (!s.b) return;
      var n = nodeOf(s.b, s.n); if (!n) return;
      var answers = exitsOf(s.b, n);
      if (!answers.length) { toast("This decision has no exits yet — add one first."); return; }
      openModal({
        title: n.label, confirmLabel: "That one",
        message: "Whichever you pick is the only exit that opens. This is how the cycle repeats.",
        fields: [{ key: "answer", label: "Answer", type: "select", span: true,
          options: answers.map(function (a) {
            var t = nodeOf(s.b, a.goTo);
            return { value: a.label, label: a.label + (t ? "  →  " + t.label : "") };
          }), value: answers[0].label }],
        onConfirm: function (v) {
          var before = JSON.stringify(s.b.nodes);
          go(function () { finishStep(s.b, s.n, v.answer); });
          toast("Answered: " + v.answer, function () { s.b.nodes = JSON.parse(before); });
        }
      });
    },

    /* ---- nodes ---- */
    "node-add": function (id) { nodeDialog(byId(state.boards, id), null); },
    "thing-add": function (id) { thingDialog(byId(state.boards, id), null); },
    /* Adding a photo used to be three decisions deep: Add thing, change the
       kind to Photo, then find "Add a picture". It is one button and one file
       picker now, and the picture is chosen FIRST — that is the thing you
       actually have in mind, and the name can be filled in from the filename. */
    "photo-add": function (id) {
      var b = byId(state.boards, id); if (!b) return;
      var inp = document.createElement("input");
      inp.type = "file"; inp.accept = "image/*";
      inp.addEventListener("change", function () {
        var f = inp.files && inp.files[0];
        if (!f) return;
        toast("Reading it…");
        picShrink(f).then(function (dataUrl) {
          var key = uid();
          return picPut(key, dataUrl).then(function () {
            var guess = String(f.name || "").replace(/\.[a-z0-9]+$/i, "").replace(/[_-]+/g, " ").trim();
            openModal({
              title: "What is this a picture of?",
              message: '<img src="' + dataUrl + '" alt="" style="max-width:100%;max-height:200px;border-radius:12px;display:block;margin:0 0 0.7rem">' +
                "Kept on this device. Pictures do not travel with sync and are not in a backup file.",
              confirmLabel: "Put it on the board",
              fields: [
                { key: "label", label: "Called", type: "text", span: true, value: guess || "",
                  placeholder: "frame 1962-04" },
                { key: "linkTo", label: "Belongs with", type: "select", span: true, value: "",
                  options: [{ value: "", label: "Nothing yet — just put it on the board" }]
                    .concat(b.nodes.filter(function (n) { return n.t === "step"; })
                      .map(function (n) { return { value: n.id, label: n.label }; })) }
              ],
              validate: function (v) { return v.label.trim() ? null : "Give it a name."; },
              onConfirm: function (v) {
                go(function () {
                  var t = { id: uid(), t: "thing", kind: "photo", label: v.label.trim(),
                            path: "", url: "", pic: key };
                  b.nodes.push(t);
                  if (v.linkTo) {
                    b.edges.push({ id: uid(), a: t.id, b: v.linkTo, k: "link", label: "" });
                  }
                  autoLayout(b);
                });
                toast(v.linkTo ? "On the board, beside that step" : "On the board");
              },
              onCancel: function () { picDrop(key); }
            });
          });
        }).catch(function (e) { toast(e && e.message ? e.message : "Could not read that picture."); });
      });
      inp.click();
    },
    "thing-borrow": function (id) { borrowDialog(byId(state.boards, id)); },
    "node-edit": function (id) {
      var s = split(id); if (!s.b) return;
      var n = nodeOf(s.b, s.n); if (!n) return;
      if (n.t === "thing") thingDialog(s.b, n); else nodeDialog(s.b, n);
    },
    "node-del": function (id) {
      var s = split(id); if (!s.b) return;
      var n = nodeOf(s.b, s.n); if (!n) return;
      confirmAction({
        title: "Remove " + n.label + "?",
        message: "Every line into and out of it goes too." +
          (n.pic ? " The picture kept on this device goes with it." : "")
      }, function () {
        // Its picture goes too, or IndexedDB fills with pictures nothing points
        // at — the same discipline as deleting a record taking its money.
        if (n.pic) picDrop(n.pic);
        go(function () {
          s.b.nodes = s.b.nodes.filter(function (x) { return x.id !== n.id; });
          s.b.edges = s.b.edges.filter(function (e) { return e.a !== n.id && e.b !== n.id; });
        });
        toast("Removed " + n.label);
      });
    },

    // An exit is a labelled line out of the decision. Naming it and choosing
    // where it goes are the same act, so they are one dialog and they write one
    // thing — no exit can exist without a line, and no line goes unlabelled.
    "exit-add": function (id) {
      var s = split(id); if (!s.b) return;
      var n = nodeOf(s.b, s.n); if (!n) return;
      var targets = s.b.nodes.filter(function (x) { return x.t === "step" && x.id !== n.id; });
      if (!targets.length) { toast("Add another step first — an exit has to go somewhere."); return; }
      openModal({
        title: "Add an exit to " + n.label, confirmLabel: "Add",
        message: "An exit that points back at an earlier step is how a cycle repeats.",
        fields: [
          { key: "label", label: "Call it", type: "text", value: "", span: true, placeholder: "repeat" },
          { key: "goTo", label: "Goes to", type: "select", span: true,
            options: targets.map(function (t) { return { value: t.id, label: t.label }; }),
            value: targets[0].id }
        ],
        validate: function (v) {
          if (!v.label.trim()) return "Give the exit a name — it is what you will be asked.";
          var dup = exitsOf(s.b, n).some(function (x) { return x.label === v.label.trim(); });
          return dup ? "That exit already exists." : null;
        },
        onConfirm: function (v) {
          go(function () {
            s.b.edges.push({ id: uid(), a: n.id, b: v.goTo, k: "flow", label: v.label.trim() });
          });
        }
      });
    },

    // Linking a person to a send IS addressing it, so this writes the same
    // link edge the Connect dialog would, from the step that needs it.
    "send-to": function (id) {
      var s = split(id); if (!s.b) return;
      var n = nodeOf(s.b, s.n); if (!n) return;
      var have = recipientsOf(s.b, n).map(function (t) { return t.id; });
      var people = s.b.nodes.filter(function (x) {
        return x.t === "thing" && x.kind === "person" && have.indexOf(x.id) < 0;
      });
      if (!people.length) {
        toast(have.length ? "Everyone on this board is already on it." : "Add a person to the board first.");
        return;
      }
      openModal({
        title: "Send " + n.label + " to", confirmLabel: "Add",
        message: have.length ? "Already goes to " + esc(recipientsOf(s.b, n).map(function (t) { return t.label; }).join(", ")) + "." : "",
        fields: [{ key: "who", label: "Person", type: "select", span: true,
          options: people.map(function (t) { return { value: t.id, label: t.label }; }), value: people[0].id }],
        onConfirm: function (v) {
          go(function () { s.b.edges.push({ id: uid(), a: n.id, b: v.who, k: "link", label: "" }); });
        }
      });
    },

    /* ---- edges ---- */
    "edge-add": function (id) {
      var b = byId(state.boards, id); if (!b || b.nodes.length < 2) return;
      var all = b.nodes;
      openModal({
        title: "Connect two things", confirmLabel: "Connect",
        message: "<b>Then</b> is sequence — one step follows another. <b>About</b> is association and says nothing about order, which is how a photo or a piece of kit hangs off a step without coming before it.",
        fields: [
          { key: "a", label: "From", type: "select", options: nodeOpts(b, ""), value: all[0].id },
          { key: "b", label: "To", type: "select", options: nodeOpts(b, ""), value: all[1].id },
          { key: "k", label: "Line", type: "select", value: "flow",
            options: [{ value: "flow", label: "Then — sequence" }, { value: "link", label: "About — association" }] },
          { key: "label", label: "Label (optional)", type: "text", value: "" }
        ],
        validate: function (v) {
          if (v.a === v.b) return "A line needs two different ends.";
          var dup = b.edges.some(function (e) { return e.a === v.a && e.b === v.b && e.k === v.k; });
          return dup ? "Those two are already connected that way." : null;
        },
        onConfirm: function (v) {
          go(function () {
            b.edges.push({ id: uid(), a: v.a, b: v.b, k: v.k, label: v.label.trim() });
          });
        }
      });
    },
    "edge-del": function (id) {
      var p = String(id).split(":"), b = byId(state.boards, p[0]);
      if (!b) return;
      go(function () { b.edges = b.edges.filter(function (e) { return e.id !== p[1]; }); });
    },

    /* ---- canvas ---- */
    "cv-in":  function () { zoomBy(1.25, vb.x + vb.w / 2, vb.y + vb.h / 2); },
    "cv-out": function () { zoomBy(1 / 1.25, vb.x + vb.w / 2, vb.y + vb.h / 2); },
    "cv-fit": function () { var b = openBoard(); if (b) fitBoard(b); },
    "cv-tidy": function (id) {
      var b = byId(state.boards, id); if (!b) return;
      go(function () { autoLayout(b); });
      toast("Tidied");
    },

    /* ---- the switch ---- */
    "span-start": function () {
      pickBench("Where are you starting?", function (benchId) {
        go(function () {
          state.spans.push({ id: uid(), startedAt: nowStamp(), endedAt: "",
                             benchId: benchId, note: "", source: "switch" });
        });
        greet(benchId);
      });
    },
    // Switching is one act, not two: the span you were in ends at the moment
    // the next one starts, so no minute belongs to both and none falls between.
    "span-switch": function () {
      var sp = openSpan(), leaving = sp ? sp.benchId : "";
      pickBench("Switching to", function (benchId) {
        go(function () {
          var at = nowStamp();
          if (sp) sp.endedAt = at;
          state.spans.push({ id: uid(), startedAt: at, endedAt: "",
                             benchId: benchId, note: "", source: "switch" });
        });
        // Ask about the bench being left, then greet the one being entered.
        if (leaving && leaving !== benchId) askNote(leaving, function () { greet(benchId); });
        else greet(benchId);
      });
    },
    "span-stop": function () {
      var sp = openSpan(); if (!sp) return;
      var was = sp.endedAt;
      go(function () { sp.endedAt = nowStamp(); });
      toast("Stopped after " + fmtMins(minsBetween(sp.startedAt, sp.endedAt)),
            function () { sp.endedAt = was; });
      if (sp.benchId) askNote(sp.benchId);
    },
    // A runaway is closed by being told when it ended, never by assuming now.
    "span-close": function () {
      var sp = runaway(); if (!sp) return;
      openModal({
        title: "When did you leave?",
        message: "This has been open since " + esc(niceDate(stampDay(sp.startedAt))) +
          ". It is not being counted until it has an end, and the app will not invent one.",
        confirmLabel: "Close it",
        fields: [
          { key: "day", label: "Day", type: "text", value: stampDay(sp.startedAt), span: true, hint: "YYYY-MM-DD" },
          { key: "to", label: "Time", type: "text", value: "17:00", span: true, hint: "HH:MM" }
        ],
        validate: function (v) {
          if (!/^\d{4}-\d{2}-\d{2}$/.test(v.day.trim())) return "A day must be YYYY-MM-DD.";
          if (!timeOk(v.to)) return "A time must be HH:MM on the 24-hour clock.";
          if (v.day.trim() + "T" + v.to.trim() <= sp.startedAt) return "It has to end after it started.";
          return null;
        },
        onConfirm: function (v) {
          go(function () { sp.endedAt = v.day.trim() + "T" + v.to.trim(); });
          toast("Closed at " + fmtMins(minsBetween(sp.startedAt, sp.endedAt)));
        }
      });
    },

    /* ---- repairing the week ---- */
    "span-add":  function (day) { spanDialog(null, day || ""); },
    "span-edit": function (id) { spanDialog(byId(state.spans, id), ""); },
    "span-del":  function (id) {
      var sp = byId(state.spans, id); if (!sp) return;
      var i = state.spans.indexOf(sp);
      go(function () { state.spans.splice(i, 1); });
      toast("Removed that stretch", function () { state.spans.splice(i, 0, sp); });
    },
    "week-prev": function () { weekOf = addDays(currentWeek(), -7); render(); },
    "week-next": function () {
      var n = addDays(currentWeek(), 7);
      if (n > weekStart(today())) return;
      weekOf = n; render();
    },
    "week-now":  function () { weekOf = ""; render(); },

    /* ---- upkeep ---- */
    "place-filter": function (id) { placeFilter = id || ""; render(); },
    "cadence-add":  function () { cadenceDialog(null); },
    "cadence-edit": function (id) { cadenceDialog(byId(state.cadences, id)); },
    "cadence-done": function (id) {
      var cd = byId(state.cadences, id); if (!cd) return;
      var was = cd.lastDoneOn;
      go(function () { cd.lastDoneOn = today(); });
      toast(cd.label + " — next in " + cd.everyDays + " days", function () { cd.lastDoneOn = was; });
    },
    "cadence-del": function (id) {
      var cd = byId(state.cadences, id); if (!cd) return;
      confirmAction({ title: "Remove " + cd.label + "?", message: "It stops appearing on Waiting." }, function () {
        go(function () { state.forgotten[id] = cd.label; cd.archived = true; });
      });
    },
    "asset-add":  function () { assetDialog(null); },
    "asset-edit": function (id) { assetDialog(byId(state.assets, id)); },
    "asset-del":  function (id) {
      var a = byId(state.assets, id); if (!a) return;
      var uses = live(state.cadences).filter(function (cd) { return cd.protectsAssetId === id; });
      confirmAction({
        title: "Remove " + a.name + "?",
        message: uses.length
          ? "The " + uses.length + (uses.length === 1 ? " cadence" : " cadences") +
            " attached to it stay, and stop naming what they protect."
          : "Nothing is attached to it."
      }, function () {
        go(function () { state.forgotten[id] = a.name; a.archived = true; });
      });
    },

    /* ---- the report ---- */
    "report-new":  function () { reportDialog(); },
    "report-back": function () { reportOn = null; render(); },
    "report-copy": function () {
      var el = document.getElementById("reportText");
      if (!el) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(el.textContent).then(function () { toast("Copied"); },
          function () { toast("This browser would not let the page copy it — select it and copy by hand."); });
      } else {
        toast("This browser has no clipboard for pages — select it and copy by hand.");
      }
    },
    "report-save": function () {
      var el = document.getElementById("reportText");
      if (!el) return;
      var c = reportOn && reportOn.claimantId ? byId(state.claimants, reportOn.claimantId) : null;
      var name = (c ? c.name.toLowerCase().replace(/[^a-z0-9]+/g, "-") : "everything");
      download("mashghal-" + name + "-" + today() + ".txt", el.textContent, "text/plain");
    },

    /* ---- vocabulary ---- */
    "claimant-add": function () { claimantDialog(null); },
    "claimant-edit": function (id) { claimantDialog(byId(state.claimants, id)); },
    "claimant-del": function (id) {
      var c = byId(state.claimants, id); if (!c) return;
      confirmAction({
        title: "Remove " + c.name + "?",
        message: "Boards already filed against it keep reading &ldquo;" + esc(c.name) +
          " (removed)&rdquo; rather than losing their history."
      }, function () {
        go(function () { forget(state.claimants, id); c.archived = true; });
        toast("Removed " + c.name);
      });
    },
    "mode-open": function (id) { openMode = id; render(); },
    "mode-back": function () { openMode = ""; render(); },
    "note-edit": function (id) { var b = byId(state.benches, id); if (b) noteDialog(b); },
    "kit-export": function (id) { var m = byId(state.modes, id); if (m) kitExport(m); },
    "sw-add":  function (id) { var m = byId(state.modes, id); if (m) swDialog(m, null); },
    "sw-edit": function (id) {
      var p = String(id).split(":"), m = byId(state.modes, p[0]);
      if (m) swDialog(m, byId(modeSoftware(m), p[1]));
    },
    "sw-del": function (id) {
      var p = String(id).split(":"), m = byId(state.modes, p[0]);
      if (!m) return;
      go(function () { m.software = modeSoftware(m).filter(function (x) { return x.id !== p[1]; }); });
    },
    // Chasing is not finishing. It buys another chase interval and records that
    // you did it, so the count is visible rather than something you remember.
    "step-chased": function (id) {
      var p = String(id).split(":"), b = byId(state.boards, p[0]);
      var n = b && nodeOf(b, p[1]);
      if (!n) return;
      go(function () { n.chasedAt = nowStamp(); n.chases = chaseCount(n) + 1; });
      toast("Chased. Next nudge in " + (n.chaseDays || "?") + " days.");
    },
    /* Writing a procedure in prose. The parse runs on every keystroke because
       it writes nothing; only accept does. */
    "prose-open": function () { proseText = proseText || ""; view = "write"; openId = ""; render(); },
    "prose-seed": function () { proseText = PROSE_SEED; render(); },
    "prose-clear": function () { proseText = ""; render(); },
    "prose-accept": function () {
      var read = parseProse(proseText);
      if (!read.steps.length) { toast("Nothing to accept yet."); return; }
      openModal({
        title: "Name the procedure",

    /* The escape hatch. An installed app is served by its own worker, and a
       worker written before the network-first fix will keep handing out the
       page it cached until it is replaced — which can take two launches. This
       makes it one: drop the registration, delete this app's caches, reload.

       It deliberately does not touch localStorage or IndexedDB: the book, the
       pictures and the snapshots are not what is stale. */
    "refresh-app": function () {
      confirmAction({
        title: "Throw away the offline copy?",
        message: "The app will be fetched again from scratch. Everything you have recorded stays exactly as it is — this only clears the copy of the app itself, which is what can be out of date.",
        confirmLabel: "Get the newest", danger: false
      }, function () {
        toast("Fetching the newest…");
        var jobs = [];
        if (window.caches && caches.keys) {
          jobs.push(caches.keys().then(function (keys) {
            return Promise.all(keys.filter(function (k) {
              return k.indexOf("pwa-mashghal-") === 0;
            }).map(function (k) { return caches.delete(k); }));
          }));
        }
        if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
          jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
            return Promise.all(rs.map(function (r) { return r.unregister(); }));
          }));
        }
        Promise.all(jobs).catch(function () {}).then(function () {
          // A query string the old copy was never cached under, so the reload
          // cannot be answered from a cache that is on its way out.
          location.replace(location.pathname + "?fresh=" + Date.now());
        });
      });
    },

  /* Every thing on every board, collapsed by name and kind. The same person
     turns up on five boards and the same headphones on three, and typing them
     out again each time is how a name ends up spelled three ways.

     A COPY is taken, deliberately, not a reference. A run freezes its procedure
     the moment it starts, and a thing reaching back into a shared table would
     be a hole in that freeze: renaming a person next year would silently
     rewrite a board you closed last year. What is borrowed is the typing. */
  function allThings() {
    var seen = {}, out = [];
    state.boards.forEach(function (bd) {
      (bd.nodes || []).forEach(function (n) {
        if (n.t !== "thing" || !n.label) return;
        var key = (n.kind || "") + "\u0000" + n.label.toLowerCase();
        if (seen[key]) { seen[key].seen++; return; }
        seen[key] = { kind: n.kind, label: n.label, path: n.path || "", url: n.url || "",
                      pic: n.pic || "", seen: 1, from: bd.name };
        out.push(seen[key]);
      });
    });
    return out.sort(function (a, z) { return z.seen - a.seen; });
  }

  function borrowDialog(b) {
    if (!b) return;
    var here = {};
    (b.nodes || []).forEach(function (n) {
      if (n.t === "thing") here[(n.kind || "") + "\u0000" + String(n.label).toLowerCase()] = 1;
    });
    var pool = allThings().filter(function (t) {
      return !here[(t.kind || "") + "\u0000" + t.label.toLowerCase()];
    });
    if (!pool.length) {
      toast("Nothing on another board that is not already here.");
      return;
    }
    openModal({
      title: "Bring one in from another board",
      message: "A copy is taken, not a link. A run freezes its procedure when it starts, and a thing reaching back into a shared list would be a hole in that — renaming someone next year would rewrite a board you closed last year. What you are saving is the typing.",
      confirmLabel: "Bring it in",
      fields: [
        // The value is the position in the list, not a composed key: a NUL
        // separator does not survive a round trip through an option value, so
        // the lookup found nothing and confirming quietly did nothing at all.
        { key: "pick", label: "Which", type: "select", span: true, value: "0",
          options: pool.map(function (t, i) {
            return { value: String(i),
                     label: t.label + " — " + String(vocabLabel("things", t.kind)).toLowerCase() +
                       (t.seen > 1 ? ", on " + t.seen + " boards" : ", on " + t.from) };
          }) }
      ],
      onConfirm: function (v) {
        var pick = pool[num(v.pick)];
        if (!pick) return;
        go(function () {
          b.nodes.push({ id: uid(), t: "thing", kind: pick.kind, label: pick.label,
                         path: pick.path, url: pick.url, pic: pick.pic });
          autoLayout(b);
        });
        toast("Brought in — link it to a step to say where it belongs");
      }
    });
  }

  /* ================= the example ================= */

  // What the sample has to exercise: a send that opens a wait on two named
  // people, a decision that loops back, a run sitting at four steps at once,
  // a board with no employer at all, and a run that will not close because
  // its filing is undone. A feature with no representation here cannot be
  // shown to anyone.
  function sampleData() {
    var s = APP.blank();
    function mk(o) { o.id = uid(); return o; }
    function back(n) { return addDays(today(), -n); }

    var kWork  = mk({ name: "Work", colour: "#8a9ac9" });
    var kTrain = mk({ name: "Trainings and workshops", colour: "#8fae6a" });
