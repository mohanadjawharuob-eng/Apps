  function menuPick(b, n, cx, cy) {
    if (sel !== n.id) { sel = n.id; paintSel(b); }
    requestAnimationFrame(function () { menuOpen(b, n, cx, cy); });
  }

  function menuOpen(b, n, cx, cy) {
    menuClose();
    if (!b || !n || b.derived) return;
    var acts = nodeActs(b, n);
    if (!acts.length) return;
    var what = n.t === "step" ? vocabLabel("acts", n.act) : vocabLabel("things", n.kind);
    var el = document.createElement("div");
    el.className = "cvmenu";
    el.setAttribute("role", "menu");
    el.innerHTML = '<div class="cvmhead"><span class="selkind">' +
      esc(String(what).toLowerCase()) + "</span><b>" + esc(clip(n.label, 28)) + "</b></div>" +
      acts.map(function (a) { return nodeActBtn(b, n, a, " cvmrow"); }).join("");
    document.body.appendChild(el);
    cvMenu = el;

    /* Placed so it never hangs off an edge — measured after it is in the
       document, because its height is however many acts this node has and
       that is four on a template step and nine on a live one. */
    var r = el.getBoundingClientRect();
    var x = Math.min(cx, window.innerWidth - r.width - 8);
    var y = Math.min(cy, window.innerHeight - r.height - 8);
    el.style.left = Math.max(8, x) + "px";
    el.style.top = Math.max(8, y) + "px";
    var first = el.querySelector(".cvmrow");
    if (first) first.focus();
  }

  /* One listener each, at the document, because the menu is appended to the
     body rather than to the sheet — and it closes on the press that fires one
     of its own buttons too, which is why this is on the CAPTURE phase: the
     dispatcher runs on the bubble, so without capture the menu would still be
     standing over whatever dialog its button just opened. */
  function menuWire() {
    document.addEventListener("pointerdown", function (e) {
      if (cvMenu && !e.target.closest(".cvmenu")) menuClose();
    }, true);
    document.addEventListener("click", function (e) {
      if (cvMenu && e.target.closest(".cvmenu")) menuClose();
    }, true);
    document.addEventListener("keydown", function (e) {
      if (!cvMenu) return;
      if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); menuClose(); return; }
      /* Down and up walk it, because a menu that can be opened from the
         keyboard nowhere is still a menu somebody lands in by right-clicking
         with a trackpad and then cannot leave without a mouse. */
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        var rows = [].slice.call(cvMenu.querySelectorAll(".cvmrow"));
        var i = rows.indexOf(document.activeElement);
        var step = e.key === "ArrowDown" ? 1 : -1;
        var next = rows[(i + step + rows.length) % rows.length];
        if (next) next.focus();
      }
    }, true);
    window.addEventListener("resize", menuClose);
    window.addEventListener("scroll", menuClose, true);
  }

  /* A NEW NODE LANDS WHERE YOU ARE LOOKING, and nothing else moves.

     The brief asks for "node appears at current viewport center. Do not
     automatically connect it", and the second half was already true. The
     first half was not, and what stood in its place was worse than a wrong
     position: every add called `autoLayout(b)`, which re-ranks the WHOLE
     board. So arranging a sheet by hand and then adding one step threw the
     arrangement away — which is exactly the fault `settleNode` was written
     against ("Tidy would fix it by moving everything, including whatever was
     placed by hand"), reappearing on the one path nobody had looked at.

     `autoLayout` keeps two jobs and loses the third: seeding a brand-new
     board so nobody ever meets a blank sheet, and Tidy, which is the button
     that ASKS for everything to move.

     `vb` is the live viewBox, so the centre is in sheet units already and no
     conversion is needed. The node is placed with its centre there rather
     than its corner, or a card drawn 260 wide sits visibly right of where
     you were looking. */
  function newSpot(b) {
    var w = 260, h = 92;
    var x = Math.round(vb.x + vb.w / 2 - w / 2);
    var y = Math.round(vb.y + vb.h / 2 - h / 2);
    /* If the middle is already taken, step off it rather than stacking one
       card exactly on another — `settleNode` will push whatever is still in
       the way, but starting on top of something makes the push look like the
       new node jumping somewhere random. */
    var tries = 0;
    while (tries < 12 && (b.nodes || []).some(function (n) {
      return typeof n.x === "number" && Math.abs(n.x - x) < 40 && Math.abs(n.y - y) < 30;
    })) { x += 34; y += 26; tries++; }
    return { x: x, y: y };
  }

  function autoLayout(b) {
    var steps = b.nodes.filter(function (n) { return n.t === "step"; });
    var depth = flowDepth(b);

    var cols = {};
    steps.forEach(function (n) {
      var d = depth[n.id];
      cols[d] = cols[d] || [];
      cols[d].push(n);
    });
    /* Serpentine: five across, then drop a row and come back the other way.
       Stacked by MEASURED height, not a fixed pitch — a step holding a matrix
       is twice as tall as a bare one, and a constant 110 drew it straight
       through its neighbour. The band pitch is the tallest card in the band for
       the same reason. */
    var bandH = {};
    Object.keys(cols).forEach(function (d) {
      var band = Math.floor(num(d) / 5), tall = 0;
      cols[d].forEach(function (n) { tall = Math.max(tall, dims(n).h); });
      bandH[band] = Math.max(bandH[band] || 0, tall);
    });
    var bandY = {}, acc = 300;
    Object.keys(bandH).map(Number).sort(function (a, z) { return a - z; })
      .forEach(function (band) { bandY[band] = acc; acc += bandH[band] + 150; });

    Object.keys(cols).forEach(function (d) {
      var y = bandY[Math.floor(num(d) / 5)] || 300;
      cols[d].forEach(function (n, j) {
        var col = num(d) % 5, band = Math.floor(num(d) / 5);
        if (band % 2 === 1) col = 4 - col;
        n.x = 60 + col * 262;
        n.y = y;
        y += dims(n).h + 34;     // the next step in this column clears this one
      });
    });
    /* Things are parked near what they hang off, above and below in turn, and
       then nudged until they are clear of everything already placed. Two people
       linked to the same send used to be dropped in the same spot, and a person
       could land squarely on a step — which is what "send a draft to N. Aoun,
       S. Frem" produced the first time a procedure was written in prose. */
    var placed = b.nodes.filter(function (n) { return n.t === "step"; })
      .map(function (n) { var d = dims(n); return { x: n.x, y: n.y, w: d.w, h: d.h }; });

    function clashes(box) {
      return placed.some(function (o) {
        return Math.min(box.x + box.w, o.x + o.w) - Math.max(box.x, o.x) > 6 &&
               Math.min(box.y + box.h, o.y + o.h) - Math.max(box.y, o.y) > 6;
      });
    }

    b.nodes.filter(function (n) { return n.t === "thing"; }).forEach(function (n, i) {
      var link = b.edges.filter(function (e) { return e.k === "link" && (e.a === n.id || e.b === n.id); })[0];
      var host = link ? nodeOf(b, link.a === n.id ? link.b : link.a) : null;
      var d = dims(n);
      var box;
      if (host && host.t === "step") {
        var above = i % 2 === 0;
        var step = 0;
        do {
          box = { x: host.x + 18 + step * 26,
                  y: above ? host.y - (TH + 74) - step * (TH + 22)
                           : host.y + dims(host).h + 58 + step * (TH + 22),
                  w: d.w, h: d.h };
          step++;
        } while (clashes(box) && step < 8);
      } else {
        box = { x: 60 + i * 190, y: 110, w: d.w, h: d.h };
        var g = 0;
        while (clashes(box) && g < 8) { box.y -= TH + 22; g++; }
      }
      n.x = box.x; n.y = box.y;
      placed.push(box);
    });
  }

  /* Cards, not cut-corner boxes. The cut corner was the ModelBuilder reading,
     and the design replaced it — shape now says step-versus-thing by the
     radius alone: 13 for a step, fully round for a thing. */
  var NR = 13;
  // curvePath is gone — drawEdges routes right-angled paths through orth().
/* The sheet is drawn in JS, so it cannot inherit a custom property the way
     the rest of the app does — it reads them instead, once per draw. Hardcoded
     hexes here are what would leave an ink-dark board drawn on paper the moment
     a light theme existed, and the palette would then live in two places that
     could disagree. Cached because getComputedStyle in a node loop is slow;
     flushed whenever the theme moves. */
  var _ink = {};
  function ink(n) {
    if (_ink[n] === undefined) {
      _ink[n] = (getComputedStyle(document.documentElement)
                  .getPropertyValue("--" + n) || "").trim() || "#808080";
    }
    return _ink[n];
  }
  function inkFlush() { _ink = {}; }

  // The same ladder the rows use. Waiting is uncoloured on purpose.
  function nodeInk() {
    return {
      done:    { bar: ink("sage-deep"), stroke: ink("rule-soft"), text: ink("receded"), w: 1,   sink: 0.62 },
      now:     { bar: ink("sage"),      stroke: ink("sage-deep"), text: ink("ink"),     w: 1.6, sink: 1 },
      waiting: { bar: ink("receded"),   stroke: ink("rule-mid"),  text: ink("dim"),     w: 1.3, sink: 1 },
      over:    { bar: ink("apricot"),   stroke: ink("apricot"),   text: ink("ink"),     w: 1.6, sink: 1 },
      todo:    { bar: ink("rule"),      stroke: ink("rule-soft"), text: ink("faint"),   w: 1,   sink: 0.84 }
    };
  }

  function drawBoard(b, svg) {
    inkFlush();
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    var defs = svgEl("defs");
    /* The head follows the line. Drawn from the old tokens, a line raised to
       3.9:1 still ended in a tip at 1.54:1 — an arrow pointing at nothing. */
    [["mar", ink("edge")], ["mar-dim", ink("edge-dead")],
     ["mar-back", ink("edge-back")]].forEach(function (p) {
      var m = svgEl("marker", { id: p[0], viewBox: "0 0 10 8", refX: 9, refY: 4,
        markerWidth: 9, markerHeight: 7.5, orient: "auto-start-reverse" });
      m.appendChild(svgEl("polygon", { points: "0,0 10,4 0,8", fill: p[1] }));
      defs.appendChild(m);
    });
    var pmin = svgEl("pattern", { id: "gmin", width: 40, height: 40, patternUnits: "userSpaceOnUse" });
    pmin.appendChild(svgEl("path", { d: "M40,0 H0 V40", fill: "none", stroke: ink("ink"), "stroke-opacity": ".028" }));
    var pmaj = svgEl("pattern", { id: "gmaj", width: 200, height: 200, patternUnits: "userSpaceOnUse" });
    pmaj.appendChild(svgEl("rect", { width: 200, height: 200, fill: "url(#gmin)" }));
    pmaj.appendChild(svgEl("path", { d: "M200,0 H0 V200", fill: "none", stroke: ink("ink"), "stroke-opacity": ".055" }));
    defs.appendChild(pmin); defs.appendChild(pmaj);
    svg.appendChild(defs);
    svg.appendChild(svgEl("rect", { x: -6000, y: -6000, width: 12000, height: 12000, fill: "url(#gmaj)" }));

    svg.appendChild(gE); svg.appendChild(gN);

  }

  /* Right-angled, the way the artboards draw them and the way a site drawing
     does. Beziers looked soft and, worse, two curves leaving the same node were
     hard to tell apart; an orthogonal run reads as a route. Sequence is
     neutral, because a line is a path and not a state. An association is a fine
     dotted line with no head — that distinction is the whole model. A loop back
     arcs over the top in brass and SAYS "goes back", because the one thing a
     reader needs to know about a cycle is that it is one. */
  function side(n, which) {
    var d = dims(n);
    if (which === "r") return { x: n.x + d.w, y: n.y + d.h / 2 };
    if (which === "l") return { x: n.x, y: n.y + d.h / 2 };
    if (which === "t") return { x: n.x + d.w / 2, y: n.y };
    return { x: n.x + d.w / 2, y: n.y + d.h };
  }

  // An L or a Z, never a diagonal: out of one side, along, and in to the other.
  function orth(A, Z) {
    var da = dims(A), dz = dims(Z);
    var goingRight = Z.x >= A.x + da.w - 8;
    var p1 = goingRight ? side(A, "r") : side(A, "b");
    var p2 = goingRight ? side(Z, "l") : side(Z, "t");
    if (goingRight) {
      var mx = (p1.x + p2.x) / 2;
      if (Math.abs(p1.y - p2.y) < 3) return "M" + p1.x + "," + p1.y + " H" + p2.x;
      return "M" + p1.x + "," + p1.y + " H" + mx + " V" + p2.y + " H" + p2.x;
    }
    var my = (p1.y + p2.y) / 2;
    if (Math.abs(p1.x - p2.x) < 3) return "M" + p1.x + "," + p1.y + " V" + p2.y;
    return "M" + p1.x + "," + p1.y + " V" + my + " H" + p2.x + " V" + p2.y;
  }

  /* An edge a -> b goes back only if b can reach a again along flow edges —
     that is what makes it a cycle, and a cycle is the only thing a reader needs
     warning about.

     Three wrong tests came before this one, each caught by the next.
     "Is the target to the left" called the brochure's last three steps loops,
     because they run down and leftwards while being perfectly forward.
     Comparing flow depth called a JOIN a loop: "digitise the layers" and
     "types and metadata" both sat at rank 1, because the second is also fed by
     an earlier watch, so a forward edge between them was inked brass and
     labelled "goes back". Plain reachability then flagged EVERY edge in a
     cycle, since each of them can reach its own source — three brass arrows
     round the revision loop instead of one. The stack test marks exactly the
     edge that closes it. */
  function backEdges(b) {
    var back = {}, onStack = {}, done = {};
    function visit(id) {
      onStack[id] = 1;
      nextOf(b, id).forEach(function (e) {
        // Pointing at a node still on the stack means pointing at an ancestor,
        // which is exactly one edge per cycle — the one that closes it.
        if (onStack[e.b]) { back[e.id] = 1; return; }
        if (!done[e.b]) visit(e.b);
      });
      onStack[id] = 0;
      done[id] = 1;
    }
    entryNodes(b).forEach(function (n) { if (!done[n.id]) visit(n.id); });
    // A cycle nothing leads into still has to have its closing edge marked.
    b.nodes.forEach(function (n) { if (n.t === "step" && !done[n.id]) visit(n.id); });
    return back;
  }

  function drawEdges(b, svg) {
    var back$ = backEdges(b);
    var g = svg._gE;
    while (g.firstChild) g.removeChild(g.firstChild);
    b.edges.forEach(function (e) {
      var A = nodeOf(b, e.a), Z = nodeOf(b, e.b);
      if (!A || !Z) return;
      var on = hov && (hov === e.a || hov === e.b);

      if (e.k === "link") {
        var ca = centre(A), cz = centre(Z);
        g.appendChild(svgEl("path", {
          d: "M" + ca.x + "," + ca.y + " L" + cz.x + "," + cz.y,
          fill: "none", stroke: ink("edge-assoc"), "stroke-width": on ? 1.8 : 1.5,
          "stroke-dasharray": "1.5 5", "stroke-linecap": "round",
          "stroke-opacity": on ? 1 : 0.9
        }));
        return;
      }

      var back = !!back$[e.id];
      var live = nodeState(b, A) !== "todo";
      var col = back ? ink("edge-back") : live ? ink("edge") : ink("edge-dead");
      var mk = back ? "url(#mar-back)" : live ? "url(#mar)" : "url(#mar-dim)";
      var lx, ly, d;

      if (back) {
        // Over the top, clear of both cards, so a revision cycle reads as a shape.
        var top = Math.min(A.y, Z.y) - 46;
        var ax = A.x + dims(A).w / 2, zx = Z.x + dims(Z).w / 2;
        d = "M" + ax + "," + A.y + " V" + top + " H" + zx + " V" + Z.y;
        lx = (ax + zx) / 2; ly = top - 7;
      } else {
        d = orth(A, Z);
        var pa = side(A, Z.x >= A.x + dims(A).w - 8 ? "r" : "b");
        var pz = side(Z, Z.x >= A.x + dims(A).w - 8 ? "l" : "t");
        lx = (pa.x + pz.x) / 2; ly = (pa.y + pz.y) / 2 - 8;
      }

      g.appendChild(svgEl("path", { d: d, fill: "none", stroke: col,
        "stroke-width": on ? 2 : 1.6, "stroke-linejoin": "round",
        "stroke-opacity": on ? 1 : 0.9, "marker-end": mk }));

      var words = back ? (e.label ? e.label + " — goes back" : "goes back")
                : e.join === "all" ? (e.label ? e.label + " · and the rest" : "and the rest")
                : e.label;
      if (words) {
        var w = Math.min(150, 7 + String(words).length * 6.2);
        g.appendChild(svgEl("rect", { x: lx - w / 2, y: ly - 11, width: w, height: 15, rx: 4,
          fill: ink("sheet"), opacity: 0.96 }));
        var t = svgEl("text", { x: lx, y: ly, fill: back ? ink("edge-back") : ink("dim"),
          "text-anchor": "middle", "font-size": 11 });
        t.textContent = words;
        g.appendChild(t);
      }
    });
  }

  function drawNodes(b, svg) {
    var INK = nodeInk();
    setTimeout(mountPics, 0);   // the sheet was just rebuilt; refill its frames
    var g = svg._gN;
    while (g.firstChild) g.removeChild(g.firstChild);
    b.nodes.forEach(function (n) {
      var isStep = n.t === "step";
      /* A derived sheet's nodes carry their own state and their own sub-line
         (`_mapState`, `_says`), because `nodeState` and `stepMeta` answer
         questions a BOARD does not have — a chase interval, a due date, which
         ways in are done. Asking them about a board would be guessing, and
         this app's whole discipline is that it does not. */
      var st = n._mapState !== undefined ? n._mapState : (isStep ? nodeState(b, n) : "");
      var late = st === "over", done = st === "done";
      var isAsk = isStep && n.act === "ask", isFile = isStep && n.act === "file";
      var dated = isStep && !!n.dueAt;
      var says = n._says !== undefined ? n._says : (isStep ? stepMeta(b, n) : "");

      /* Measured BEFORE the card is drawn, and stashed on the node, because
         dims() decides the height from how many lines the name takes and the
         name gets less room on a card carrying a pill. Reading the state after
         calling dims() was how the first version drew a two-line name into a
         one-line card. */
      var room = late ? 18 : st === "now" ? 16 : 26;
      n._room = isStep ? room : 26;
      n._says = says;
      n._pics = isStep ? linkedPics(b, n).length : 0;
      var d = dims(n);

      var outer = svgEl("g", { transform: "translate(" + n.x + "," + n.y + ")", "data-id": n.id });
      /* The picked node is ringed rather than recoloured: every hue on this

      if (sel === n.id) {

        outer.appendChild(svgEl("rect", { x: -6, y: -6, width: d.w + 12, height: d.h + 12,

      if (late) {
        inner.appendChild(svgEl("rect", { "class": "halo", x: -3, y: -3, width: d.w + 6, height: d.h + 6,

      // The one filled mark on the sheet, and only ever on a late step.
      if (late) {
        var pw = 38;
        inner.appendChild(svgEl("rect", { x: d.w - pw - 12, y: 11, width: pw, height: 17, rx: 8.5,
          fill: ink("apricot") }));
        var lp = svgEl("text", { x: d.w - pw / 2 - 12, y: 23.5, fill: ink("page"),
          "text-anchor": "middle", "font-size": 11 });
        lp.textContent = "late";
        inner.appendChild(lp);
      } else if (st === "now") {
        inner.appendChild(svgEl("circle", { cx: d.w - 58, cy: 18, r: 3.4, fill: ink("sage") }));
        var ih = svgEl("text", { x: d.w - 50, y: 22, fill: ink("sage-lift"), "font-size": 11.5 });
        ih.textContent = "in hand";

      if (pics.length) {

        // shows what the step is actually about rather than that a link exists.
        var tw = 34, th = 26, gap = 4;
        pics.slice(0, 4).forEach(function (t, i) {
          var px = pad + i * (tw + gap), py = d.h - th - 8;
          var cid2 = "sp" + n.id + i;
          var cp2 = svgEl("clipPath", { id: cid2 });
          cp2.appendChild(svgEl("rect", { x: px, y: py, width: tw, height: th, rx: 5 }));
          inner.appendChild(cp2);
          inner.appendChild(svgEl("image", { x: px, y: py, width: tw, height: th,
            "clip-path": "url(#" + cid2 + ")", preserveAspectRatio: "xMidYMid slice",
            "data-pic": t.pic || "", "data-thumb": t.id }));
        });
      }

      var gr = gridOf(n);
      if (gr) { drawGrid(gr, d, inner, y + 4); }
      else if (says) {
        wrap(says, 34).slice(0, 2).forEach(function (ln, i) {
          // Lifted clear of the picture strip, which the card grew to hold —
          // otherwise the prose is drawn straight through the thumbnails.
          var m = svgEl("text", { x: pad,
            y: d.h - 14 + i * 15 - (says.length > 34 ? 15 : 0) - (pics.length ? 34 : 0),
            fill: late ? ink("apricot-mute") : done ? ink("receded") : ink("faint"),
            "font-size": 11.5 });

    });
  }

  /* The handle you drag to connect. It sits outside the card on the right and
     only shows on hover, so the sheet is not covered in dots — but it is a real
     target, not a hairline, because this is the gesture the whole model rests
     on and it has to be hittable with a trackpad. */
  function addHandle(outer, d) {
    var h = svgEl("g", { "class": "hnd", "data-handle": "1" });
    h.appendChild(svgEl("circle", { cx: d.w + 11, cy: d.h / 2, r: 12, fill: "transparent" }));
    h.appendChild(svgEl("circle", { cx: d.w + 11, cy: d.h / 2, r: 5.5,
      fill: ink("sheet"), stroke: ink("line"), "stroke-width": 1.5 }));

  }

  /* A thing is a pill with its KIND written inside it, small and faint, then
     its name — "person  R. Haddad". The kind was carried only by colour before,
     which meant the board could not be read by anyone who had not been told
     the code. */
  /* A thing holding a picture is drawn AS the picture, with its name on a strip
     underneath. The <image> is filled in afterwards by mountPics(), because
     IndexedDB is asynchronous and the sheet is not — a picture not on this
     device leaves the frame empty and the name still reads.

     photographs, "frame 1962-04" and the actual frame are not the same
     information. */

    if (hasPic(n)) {
      var cid = "pc" + n.id;
      var cp = svgEl("clipPath", { id: cid });
      cp.appendChild(svgEl("rect", { x: 0, y: 0, width: d.w, height: PH, rx: 10 }));
      inner.appendChild(cp);
      inner.appendChild(svgEl("rect", { x: 0, y: 0, width: d.w, height: d.h, rx: 11,
        fill: ink("sunken"), stroke: ink("rule"), "stroke-width": 1 }));
      inner.appendChild(svgEl("image", { x: 0, y: 0, width: d.w, height: PH,
        "clip-path": "url(#" + cid + ")", preserveAspectRatio: "xMidYMid slice",
        "data-pic": n.pic || "", "data-thumb": n.id }));
      var cap = svgEl("text", { x: d.w / 2, y: d.h - 6, fill: ink("dim"),
        "text-anchor": "middle", "font-size": 11 });
      cap.textContent = clip(n.label, 20);
      inner.appendChild(cap);
      return;
    }
    inner.appendChild(svgEl("rect", { x: 0, y: 0, width: d.w, height: d.h, rx: d.h / 2,
      fill: ink("sunken"), stroke: ink("rule"), "stroke-width": 1 }));
    /* `_pill` lets a derived sheet name its own containers. Drawn from the
       thing vocabulary, the job and "on its own" both read "note" — a word
       that belongs to neither and says nothing about either. */
    var kind = String(n._pill !== undefined ? n._pill
                      : (vocabLabel("things", n.kind) || "thing")).toLowerCase();
    var kt = svgEl("text", { x: 15, y: d.h / 2 + 4, fill: ink("faint"), "font-size": 10.5 });
    kt.textContent = kind;
    inner.appendChild(kt);
    var nx = 15 + String(kind).length * 6 + 10;
    var t = svgEl("text", { x: nx, y: d.h / 2 + 4.5, fill: ink("dim"), "font-size": 12.5 });

    inner.appendChild(t);
  }

  /* The thing every one of the five board treatments drew independently: a
     small matrix INSIDE one step, so "digitise the layers" is one step holding
     nine cells rather than nine steps. Filled is done, outlined is in hand,
     empty is still to go — and the count is written underneath, because a grid

    gr.cols.forEach(function (c, i) {
      var t = svgEl("text", { x: x0 + i * (cw + CGAP) + cw / 2, y: top + 9,
        fill: ink("faint"), "font-size": 10, "text-anchor": "middle" });
      t.textContent = clip(String(c), 5);
      inner.appendChild(t);
    });
    var done = 0, hand = 0, togo = 0;
    gr.rows.forEach(function (r, ri) {
      var ry = top + 17 + ri * (CELL + CGAP);
      var rl = svgEl("text", { x: 15, y: ry + CELL - 4, fill: ink("dim"), "font-size": 10 });
      rl.textContent = clip(String(r), 6);
      inner.appendChild(rl);
      gr.cols.forEach(function (c, ci) {
        var v = (gr.cells && gr.cells[ri + ":" + ci]) || "";
        if (v === "done") done++; else if (v === "hand") hand++; else togo++;
        inner.appendChild(svgEl("rect", {
          x: x0 + ci * (cw + CGAP), y: ry, width: cw, height: CELL, rx: 5,
          fill: v === "done" ? ink("sage-deep") : v === "hand" ? "none" : ink("rule"),
          stroke: v === "hand" ? ink("sage") : "none", "stroke-width": v === "hand" ? 1.5 : 0

    inner.appendChild(sum);
  }

  function stepMeta(b, n) {
    // A template has no history, so it describes what it WILL do.
    if (b.kind !== "run") {
      if (n.act === "send") {
        return n.chaseDays ? "Starts a wait · remind after " + n.chaseDays + "d"
                           : "Starts a wait · no reminder set";
      }
      if (n.act === "watch") return n.chaseDays ? "A wait · check back after " + n.chaseDays + "d"
                                                : "A wait with nobody to chase";
      if (n.act === "ask") return "Two ways out — one goes back";
      if (n.act === "file") return "Putting away · will block closing";
      return n.dueAt ? "Fixed by the day, not by you" : "";
    }
    var st = nodeState(b, n), d = daysWaiting(n);
    var who = recipientsOf(b, n).map(function (t) { return t.label; }).join(" and ");

    if (st === "done") return n.doneAt ? "Done " + niceDate(n.doneAt) : "Done";
    if (st === "over") {
      var past = overdueBy(n);
      /* "With N. Haddad and L. Mroueh six days." ran the names straight into
         the count with nothing between them, which reads as a sentence that
         lost a word. The names and the wait are two facts. */
      return (who ? "With " + who + ", " + numWord(d) + " days. " : numWord(d) + " days. ") +
        "You meant to chase after " + num(n.chaseDays) + ".";
    }
    if (st === "waiting") {
      if (n.dueAt) return niceDate(n.dueAt) + ". Fixed by the day, not by you.";
      if (!n.chaseDays) return numWord(d) + " days. Nobody to chase, so it is not late.";
      return numWord(d) + " days. You will chase after " + num(n.chaseDays) + ".";
    }
    if (st === "now") {
      if (n.dueAt) return niceDate(n.dueAt) + ". Fixed by the day, not by you.";
      if (n.act === "file") return "Until this is done, nothing closes.";
      return d ? numWord(d) + " days in hand." : "Yours, from today.";

  function wrap(s, max) {

    words.forEach(function (w) {

      else { lines.push(cur); cur = w; }
    });
    if (cur) lines.push(cur);
    return lines.slice(0, 2);

  function clip(s, max) { return String(s).length > max ? String(s).slice(0, max - 1) + "…" : String(s); }

  function boundsOf(b) {
    var x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9;
    b.nodes.forEach(function (n) {
      var d = dims(n);
      x1 = Math.min(x1, n.x); y1 = Math.min(y1, n.y);
      x2 = Math.max(x2, n.x + d.w); y2 = Math.max(y2, n.y + d.h);
    });
    if (x1 > x2) { x1 = 0; y1 = 0; x2 = 800; y2 = 400; }
    return { x1: x1, y1: y1, x2: x2, y2: y2 };
  }
  /* Repainting the whole view on a tap would re-mount the sheet and re-fit it,
     so picking a node would throw away wherever you had panned to. The bar and
     the nodes are the only two things a selection changes. */
  function paintSel(b) {
    var host = document.getElementById("selHost");
    if (host) host.innerHTML = selPanel(b);
    if (cvSvg && cvSvg._gN) drawNodes(b, cvSvg);
  }

  /* ================= the sheet, from the keyboard =================

     The sheet was the one screen a pointer was compulsory for. Everything you
     can do to a node lives behind picking it, and picking it was a tap — so
     with no mouse the board could be looked at and nothing more.

     Two axes, because the sheet has two meanings. **Left and right walk the
     nodes in reading order**, which always works and can never dead-end: it is
     the order `autoLayout` places them, top to bottom and left to right, so it
     matches what you see. **Down and up follow the flow**, which is what the
     board is actually saying — a way on, a way back — and cycle when a step has
     several. Enter hands the focus to the strip of things you can do, which is
     already in the document and already tabbable; Escape lets go. */

  // Reading order, and it must be stable: two nodes at the same y sort by x.
  function readOrder(b) {
    return (b.nodes || []).slice().sort(function (p, q) {
      var dy = (p.y || 0) - (q.y || 0);
      if (Math.abs(dy) > 8) return dy;
      return (p.x || 0) - (q.x || 0);
    });
  }

  /* Bring a node inside the view without changing the zoom. Panning rather
     than re-fitting on purpose: a fit would throw away wherever the reader had
     got to, which is the same reason `paintSel()` exists instead of a full
     render. Only moves when the node is actually outside. */
  function panTo(n) {
    if (!cvSvg || !n) return;
    var d = dims(n), pad = 40;
    if (n.x - pad < vb.x) vb.x = n.x - pad;
    else if (n.x + d.w + pad > vb.x + vb.w) vb.x = n.x + d.w + pad - vb.w;
    if (n.y - pad < vb.y) vb.y = n.y - pad;
    else if (n.y + d.h + pad > vb.y + vb.h) vb.y = n.y + d.h + pad - vb.h;
    applyVB();
  }

  function selectNode(b, n) {
    if (!n) return false;
    sel = n.id;
    paintSel(b);
    panTo(n);
    return true;
  }

  function stepAlong(b, n, dir) {
    var edges = dir > 0 ? nextOf(b, n.id) : prevOf(b, n.id);
    if (!edges.length) return null;
    /* Cycle, so a step with three ways on can reach all three: the one after
       whichever is selected now, or the first. `sel` is the node we are on, so
       the cycle is kept on the node itself rather than in a second variable
       that could disagree with it. */
    var targets = edges.map(function (e) { return nodeOf(b, dir > 0 ? e.b : e.a); })
                       .filter(function (x) { return !!x; });
    if (!targets.length) return null;
    var at = targets.map(function (t) { return t.id; }).indexOf(n._kbLast || "");
    var pick = targets[(at + 1) % targets.length];
    n._kbLast = pick.id;
    return pick;
  }

  function mountKeys(b) {
    if (!cvSvg || cvSvg._keys) return;
    cvSvg._keys = true;

    cvSvg.addEventListener("focus", function () {
      // Arriving with nothing picked lands on what matters: late first, then
      // what is in hand, then the way in — the same order the fit uses.
      if (!sel || !nodeOf(b, sel)) selectNode(b, focusNode(b));
    });

    cvSvg.addEventListener("keydown", function (ev) {
      var bd = openBoard();
      if (!bd) return;
      var n = sel && nodeOf(bd, sel);
      var order = readOrder(bd);
      if (!order.length) return;

      if (ev.key === "ArrowRight" || ev.key === "ArrowLeft") {
        ev.preventDefault();
        var i = n ? order.map(function (x) { return x.id; }).indexOf(n.id) : -1;
        var step = ev.key === "ArrowRight" ? 1 : -1;
        var next = order[(i + step + order.length) % order.length];
        selectNode(bd, next);
        return;
      }
      if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
        ev.preventDefault();
        if (!n) { selectNode(bd, order[0]); return; }
        var along = stepAlong(bd, n, ev.key === "ArrowDown" ? 1 : -1);
        if (along) selectNode(bd, along);
        /* A dead end is said out loud rather than swallowed: `#toasts` is the
           app's live region, so this is the one channel a screen reader hears.
           Nothing else in the app announces a refusal any other way. */
        else toast(ev.key === "ArrowDown"
          ? "Nothing comes after " + n.label + ". Left and right still walk the sheet."
          : "Nothing comes before " + n.label + ". Left and right still walk the sheet.");
        return;
      }
      if (ev.key === "Enter") {
        // Into the strip of things you can do to it. The strip is rendered
        // before the sheet in the document, so Tab alone would walk away from
        // the board rather than into it.
        ev.preventDefault();
        if (!n) { selectNode(bd, focusNode(bd)); return; }
        var first = document.querySelector("#selHost .selacts .btn, #selHost .selacts a");
        if (first) first.focus();
        return;
      }
      /* SPACE DOES THE MAIN THING, AND THE STRIP DECIDES WHICH IT IS — the
         `loud` button when there is one (Mark done, Answer it, Add a
         picture), otherwise whatever the strip offers first (Reopen on a
         finished step, Start it on one not begun). Read off the DOM the strip
         has already drawn rather than worked out again here, so Space can
         never do something the screen is not showing, and it cannot drift
         from `selPanel` the next time that is reordered.

         Space used to share Enter's job, which was one of them too many:
         Enter says "show me what I can do" and Space does it. */
      if (ev.key === " ") {
        ev.preventDefault();
        if (!n) { selectNode(bd, focusNode(bd)); return; }
        var main = document.querySelector("#selHost .selacts .btn.loud") ||
                   document.querySelector("#selHost .selacts .btn:not(.danger), #selHost .selacts a");
        if (main) main.click();
        else toast("Nothing to do to " + n.label + " from here. Enter opens the strip, Delete removes it.");
        return;
      }
      /* Delete is the strip's own Remove, which confirms and says what goes
         with it — the brief asks for exactly that, and it is already built. */
      if (ev.key === "Delete" || ev.key === "Backspace") {
        ev.preventDefault();
        if (!n) return;
        APP.actions["node-del"](bd.id + ":" + n.id);
        return;
      }
      if (ev.key === "Escape") {
        /* Innermost first: one Escape lets go of the node, the next comes out
           of the full screen. `stopPropagation` matters as much as the order
           — without it the document-level handler below fires on the same
           press and takes the second step too. */
        if (sheetEscape(bd)) { ev.preventDefault(); ev.stopPropagation(); }
        return;
      }
    });
  }

  function applyVB() { if (cvSvg) cvSvg.setAttribute("viewBox", vb.x + " " + vb.y + " " + vb.w + " " + vb.h); }

  /* A card that gains a picture grows from one line to a hundred pixels tall,
     and positions persist — so the first photograph added to a board drew its
     frame straight through the step underneath it. Tidy would fix it by moving
     everything, including whatever was placed by hand, so instead only what is
     actually in the way moves, and only far enough to be out of it. */
  function settleNode(b, n, seen) {
    /* dims() reads `_pics`, which drawNodes stamps on the node — so before the
       next draw it is the count from the LAST one, and a step that just gained
       its first picture measures 34px shorter than it is about to be drawn.
       That is exactly the height the card then sat on top of its neighbour by.
       Refreshed once, on the way in. */
    if (!seen) {
      (b.nodes || []).forEach(function (m) {
        if (m.t === "step") m._pics = linkedPics(b, m).length;
      });
    }
    seen = seen || {};
    if (!b || !n || typeof n.x !== "number" || seen[n.id]) return;
    seen[n.id] = 1;
    var gap = 18, a = dims(n), moved = [];
    (b.nodes || []).forEach(function (m) {
      if (m === n || typeof m.x !== "number" || seen[m.id]) return;
      var d = dims(m);
      var ox = Math.min(n.x + a.w, m.x + d.w) - Math.max(n.x, m.x);
      var oy = Math.min(n.y + a.h, m.y + d.h) - Math.max(n.y, m.y);
      if (ox <= 0 || oy <= 0) return;
      // Out of the way vertically: the sheet is read left to right, so moving
      // a card sideways would change the order it appears to be in.
      m.y = (m.y + d.h / 2 < n.y + a.h / 2) ? n.y - d.h - gap : n.y + a.h + gap;
      moved.push(m);
    });
    // What was pushed can land on something else — the first version moved a
    // step down onto the piece of kit hanging under it. Each card that moves
    // settles in its turn, and `seen` stops two cards pushing each other about
    // for ever.
    moved.forEach(function (m) { settleNode(b, m, seen); });
  }

  /* What the sheet should open ON, when it cannot open on all of it: the step
     that is late, then the step in hand, then the way in. A board fitted whole
     into a phone is a picture of a board and not a board — eight cards across
     370px draws the names at four pixels. */
  function focusNode(b) {
    /* A node you have just picked is what you are looking at, so the fit
       centres on that rather than on whatever is late. The finder rests on
       this: a hit on one step of a forty-node board has to land on the step,
       and it arrives by setting `sel` and nothing else. */
    var picked = sel ? nodeOf(b, sel) : null;
    if (picked) return picked;
    var steps = (b.nodes || []).filter(function (n) { return n.t === "step"; });
    var late = steps.filter(function (n) { return nodeState(b, n) === "over"; })[0];
    if (late) return late;
    var now = steps.filter(function (n) {
      var st = nodeState(b, n);
      return st === "now" || st === "waiting";
    })[0];
    if (now) return now;
    return steps[0] || (b.nodes || [])[0] || null;
  }

  /* Below this the sheet stops being readable, so it stops zooming out and
     pans to what matters instead. Fit is still there for seeing the shape.

     Two floors, because the two screens are different problems. On a phone the
     whole board is hopeless at any size, so it opens close in and you pan. On a
     laptop fitting the board IS the point — a sheet nearly a thousand pixels
     wide draws eight cards perfectly legibly at 0.6 — so the floor there only
     catches a board so large that the fit would be a diagram of nothing. */
  /* Two floors, because the screens are two problems — and a THIRD case, the
     derived sheet, which has neither. On a phone a forty-node procedure is
     hopeless at any size, so the floor is high and the fit falls back to
     opening on the step that matters and letting you pan. A job map is the
     opposite: it is a handful of nodes and the WHOLE POINT is the shape, so
     refusing to zoom out far enough left the job itself clipped off the top
     of a phone with arrows arriving from nowhere. No floor for it. */
  function minScale(w, b) { return (b && b.derived) ? 0.05 : (w < 620 ? 0.7 : 0.45); }

  /* Toggling is NOT a render. `render()` would rebuild the sheet and re-fit
     it, throwing away wherever the reader had panned to — the same reason
     `paintSel()` exists. So the class goes on the box, the button relabels
     itself, and `fitBoard` runs once because the box really did change shape:
     the viewBox is in sheet coordinates and its aspect has to follow the
     element's, or the board comes back stretched. */
  function setMax(on) {
    var box = document.querySelector(".cvbox");
    if (!box) { cvMax = false; return; }
    cvMax = !!on;
    box.classList.toggle("max", cvMax);
    document.documentElement.classList.toggle("cvmax", cvMax);
    var btn = box.querySelector('[data-act="cv-max"]');
    if (btn) {
      btn.innerHTML = cvMax ? "\u2715 Close" : "\u2922 Fill";
      btn.className = "btn" + (cvMax ? " primary" : "");
      btn.title = cvMax ? "Back to the page (Esc)" : "Fill the screen";
      btn.setAttribute("aria-label", cvMax ? "Back to the page" : "Fill the screen");
    }
    if (typeof mountBar === "function") mountBar();
    var b = openBoard();
    if (b) fitBoard(b);
    if (cvSvg) cvSvg.focus();
    // The only channel a screen reader hears; the sheet has no other.
    toast(cvMax ? "Filling the screen \u00b7 Esc to come back" : "Back on the page");
  }
  /* Called from every route that leaves the board — a tab press, closing the
     board, the finder navigating away. Leaving the class on `html` after the
     box is gone would lock the page's scroll with nothing to unlock it, which
     reads exactly like the app hanging. */
  function unmaximize() {
    cvMax = false;
    document.documentElement.classList.remove("cvmax");
  }

  /* THE STACK LIVES HERE AND NOWHERE ELSE. It was written twice — once in the
     sheet's own key handler and once in the document-level one — and both
     listeners saw the same keypress, because the sheet's handler called
     `preventDefault` but not `stopPropagation` and they sit on different
     targets. So one Escape cleared the node AND left the full screen, which
     is the opposite of stacking: the reader lost their place while trying to
     deselect. Two copies of a rule is the same bug as no rule.

     Returns true when it consumed the key, so a caller can leave Escape alone
     when there was nothing to let go of. */
  function sheetEscape(bd) {
    if (sel) { sel = ""; if (bd) paintSel(bd); return true; }
    if (cvMax) { setMax(false); return true; }
    return false;
  }

  function fitBoard(b) {
    if (!cvSvg) return;
    var bd = boundsOf(b), pad = 52, r = cvSvg.getBoundingClientRect();
    var ar = (r.height && r.width) ? r.height / r.width : 0.6;
    var cw = (bd.x2 - bd.x1) + pad * 2, ch = (bd.y2 - bd.y1) + pad * 2;
    var w = cw, h = w * ar;
    if (h < ch) { h = ch; w = h / ar; }
    // The title block and the legend float over the foot of the sheet, so the
    // fit leaves their height clear at the bottom — otherwise the last row of
    // steps sits underneath them and cannot be read.
    var foot = (r.height && ar) ? (58 / r.height) * h : 0;
    if (foot) { h += foot; w = h / ar; }
    if (r.width && w > r.width / minScale(r.width, b)) {
      w = r.width / minScale(r.width, b); h = w * ar;
      var f = focusNode(b);
      if (f) {
        var c = centre(f);
        vb = { x: c.x - w / 2, y: c.y - h / 2, w: w, h: h };
        applyVB();
        return;
      }
    }
    vb = { x: (bd.x1 + bd.x2) / 2 - w / 2,
           y: (bd.y1 + bd.y2) / 2 - h / 2 + foot / 2, w: w, h: h };
    applyVB();
  }

  function toSvg(ev) {
    var r = cvSvg.getBoundingClientRect();
    return { x: vb.x + (ev.clientX - r.left) / r.width * vb.w,
             y: vb.y + (ev.clientY - r.top) / r.height * vb.h };
  }
  function zoomBy(f, cx, cy) {
    var nw = vb.w / f, nh = vb.h / f;
    if (nw < 380 || nw > 6000) return;
    vb.x = cx - (cx - vb.x) * (nw / vb.w);
    vb.y = cy - (cy - vb.y) * (nh / vb.h);
    vb.w = nw; vb.h = nh; applyVB();
  }

  var wire = null;   // a connection being drawn, never saved
  var sel = "";      // the node picked on the sheet, never saved

  /* One way in for every picture: the button on the board, "add a photo" on a
     selected step, and a file let go on the sheet all end up here. The picture
     is chosen FIRST because that is the thing you actually have in mind, and
     the name can be filled in from the filename. `host` is the step it belongs
     with (the link is made for you, or asking twice is a second job), and `at`
     is where on the sheet it landed — given one, the node keeps that spot
     rather than being tidied into the layout, because you put it there. */
  function pickPicture(b, host, at, file) {
    if (!b) return;
    if (!file) {
      var inp = document.createElement("input");
      inp.type = "file"; inp.accept = "image/*";
      inp.addEventListener("change", function () {
        var f = inp.files && inp.files[0];
        if (f) pickPicture(b, host, at, f);
      });
      inp.click();
      return;
    }
    toast("Reading it\u2026");
    // One decode, both copies — see picPair.
    picPair(file).then(function (pair) {
      var dataUrl = pair.full, key = uid();
      return picPut(key, dataUrl).then(function () { return pair.thumb; }).then(function (small) {
        var guess = String(file.name || "").replace(/\.[a-z0-9]+$/i, "").replace(/_+/g, " ").replace(/\s+/g, " ").trim();
        var steps = b.nodes.filter(function (n) { return n.t === "step"; });
        openModal({
          title: "What is this a picture of?",
          message: '<img src="' + dataUrl + '" alt="" style="max-width:100%;max-height:200px;border-radius:12px;display:block;margin:0 0 0.7rem">' +
            (host ? "It will sit beside <b>" + esc(clip(host.label, 40)) + "</b> and be marked as belonging with it. " : "") +
            (small
              ? "The full-size picture stays on this device; a thumbnail travels with sync, so you will see it on your phone."
              : "Too large for a travelling thumbnail, so this one stays on this device only \u2014 a link is the way to reach it elsewhere."),
          confirmLabel: "Put it on the board",
          fields: [
            { key: "label", label: "Called", type: "text", span: true, value: guess || "",
              placeholder: "frame 1962-04" },
            { key: "linkTo", label: "Belongs with", type: "select", span: true,
              value: host ? host.id : "",
              options: [{ value: "", label: "Nothing yet \u2014 just put it on the board" }]
                .concat(steps.map(function (n) { return { value: n.id, label: n.label }; })) },
            /* The only honest way to open the FULL picture on another machine.
               Google Drive's own API is not used and will not be: it needs
               Google's script from a CDN and an OAuth client, and this app
               fetches nothing and holds no secret. A share link does the job
               with neither. */
            { key: "url", label: "Full one kept at", type: "text", span: true, value: "",
              placeholder: "a Google Drive share link \u2014 optional" }
          ],
          validate: function (v) { return v.label.trim() ? null : "Give it a name."; },
          onConfirm: function (v) {
            go(function () {
              var t = { id: uid(), t: "thing", kind: "photo", label: v.label.trim(),
                        path: "", url: String(v.url || "").trim(), pic: key, thumb: small };
              if (at) { t.x = Math.round(at.x); t.y = Math.round(at.y); }
              b.nodes.push(t);
              if (v.linkTo) {
                b.edges.push({ id: uid(), a: t.id, b: v.linkTo, k: "link", label: "" });
              }
              if (at) settleNode(b, t); else autoLayout(b);
            });
            toast(v.linkTo ? "On the board, beside that step" : "On the board");
          },
          onCancel: function () { picDrop(key); }
        });
      });
    }).catch(function (e) { toast(e && e.message ? e.message : "Could not read that picture."); });
  }

  /* Tapping a node used to open the edit dialog straight away, which meant
     every accidental tap was a modal. It selects instead, and the things you
     can do to it appear over the sheet — edit, a photo, delete, look — so the
     board is the place you work rather than a picture of the work with the
     controls somewhere else. */
  /* WHAT CAN BE DONE TO ONE NODE, AS A LIST RATHER THAN AS MARKUP — because
     it is now rendered in TWO places: the strip under the toolbar, and the
     menu a right-click or a long-press opens at the pointer. Two copies of
     this mapping would drift the first time an act was added, which is the
     same reason `borrowInto`/`borrowLine` are one pair and the reason
     `openHandle()` is the single place that decides what "open" means.

     The invariant that makes the menu safe: **nothing is only in the menu.**
     Both surfaces render this array, so a pointer affordance can never be the
     sole route to anything — the strip stays keyboard-reachable through
     Enter, and Space fires whichever of these comes first. There is a test
     that compares the two lists.

     The brief names six items for that menu (Edit · Duplicate · Connect · Add
     related thing · Disconnect · Delete) and four of them existed under other
     names. The two that did not are here, and both are what the brief calls
     routine and reversible: no confirmation, an undo on the message. */
  function nodeActs(b, n) {
    var out = [];
    if (!b || !n) return out;
    var isStep = n.t === "step";
    if (isStep) {
      var st = nodeState(b, n);
      if (b.kind === "run" && !b.closedOn) {
        if (n.enteredAt && !n.doneAt) {
          out.push(n.act === "ask"
            ? { act: "step-answer", label: "Answer it", loud: true }
            : { act: "step-done", label: "Mark done", loud: true });
          if (st === "over") out.push({ act: "step-chased", label: "I chased today" });
        } else if (!n.enteredAt) {
          out.push({ act: "step-enter", label: "Start it" });
        } else {
          out.push({ act: "step-reopen", label: "Reopen" });
        }
      }
      /* What this step needs, opened in one press. It is the strongest thing
         the launcher does: the reference photo, the project file and the
         filtered inbox for THIS piece of work, rather than everything the
         craft owns. Only on a live step of an open run — opening the folder a
         closed run filed into is not what you meant — and only when the
         launcher is switched on and the table has been written. */
      if (state.settings.companion && b.kind === "run" && !b.closedOn &&
          n.enteredAt && !n.doneAt && hasNeeds(b, n)) {
        var need = stepNeeds(b, n);
        out.push({ launch: true, label: "Open what it needs (" +
                   (need.software.length + need.links.length) + ")" });
      }
      out.push({ act: "photo-here", label: "Add a photo" });
      if (n.act === "send") out.push({ act: "send-to", label: "Waiting on…" });
      if (n.act === "ask") out.push({ act: "exit-add", label: "Add a way out" });
    } else if (hasPic(n)) {
      out.push({ act: "pic-open", label: "Look at it" });
      out.push({ act: "pic-add", label: "Replace" });
    } else if (n.kind === "photo") {
      out.push({ act: "pic-add", label: "Add a picture", loud: true });
    }
    if (n.url) out.push({ href: n.url, label: "Open the link" });
    /* CONNECT FROM HERE, with this node already in the From box — the brief's
       "select source, then destination". The drag handle does the same thing
       with a pointer; this is the route for somebody who cannot drag. */
    if (b.nodes.length > 1) out.push({ act: "edge-add", label: "Connect…" });
    out.push({ act: "thing-here", label: "Add related thing…" });
    if (edgesAt(b, n).length) out.push({ act: "node-cut", label: "Disconnect" });
    out.push({ act: "node-dup", label: "Duplicate" });
    out.push({ act: "node-edit", label: "Edit" });
    out.push({ act: "node-del", label: "Remove", danger: true });
    return out;
  }
  // Every line touching a node, either end, both kinds.
  function edgesAt(b, n) {
    return (b.edges || []).filter(function (e) { return e.a === n.id || e.b === n.id; });
  }
  /* One button from one entry in that list, so the strip and the menu draw the
     same thing. A launcher row is the one that is not a plain button:
     `launchLink()` is the single place that link is built. */
  function nodeActBtn(b, n, a, extra) {
    var cls = "btn" + (a.loud ? " loud" : "") + (a.danger ? " danger" : "") + (extra || "");
    if (a.launch) return launchLink(n.id, a.label);
    if (a.href) return '<a class="' + cls + '" href="' + esc(a.href) +
      '" target="_blank" rel="noopener">' + esc(a.label) + "</a>";
    return '<button type="button" class="' + cls + '" data-act="' + a.act +
      '" data-id="' + b.id + ":" + n.id + '">' + esc(a.label) + "</button>";
  }

  function selPanel(b) {
    var n = sel && nodeOf(b, sel);
    if (!n) return "";
    var what = n.t === "step" ? vocabLabel("acts", n.act) : vocabLabel("things", n.kind);
    var acts = nodeActs(b, n).map(function (a) { return nodeActBtn(b, n, a); }).join("");
    return '<div class="selbar">' +
      '<div class="selwho"><span class="selkind">' + esc(String(what).toLowerCase()) + "</span>" +
      '<b>' + esc(clip(n.label, 40)) + "</b></div>" +
      '<div class="selacts">' + acts + "</div>" +
      '<button class="btn quiet selx" data-act="sel-clear" title="Nothing selected">×</button></div>';
  }

  function clearWire() {
    if (!cvSvg) return;
    var old = cvSvg.querySelector("#wireline");
    if (old) old.remove();
  }
  function drawWire(b) {
    clearWire();
    var d = dims(wire.from);
    var g = svgEl("g", { id: "wireline" });
    g.appendChild(svgEl("path", {
      d: "M" + (wire.from.x + d.w) + "," + (wire.from.y + d.h / 2) +
         " L" + wire.x + "," + wire.y,
      fill: "none", stroke: ink(wire.over ? "sage" : "line"),
      "stroke-width": 1.8, "stroke-dasharray": wire.over ? "" : "4 4",
      "stroke-linecap": "round"
    }));
    g.appendChild(svgEl("circle", { cx: wire.x, cy: wire.y, r: 4,
      fill: ink(wire.over ? "sage" : "line") }));
    cvSvg.appendChild(g);
  }

  /* Dropping on a node asks WHAT the connection is, because sequence and
     association are different edges and the app must never decide which.
     A step onto a step offers both; anything involving a thing can only be an
     association, so it does not ask a question with one answer. */
  function askConnect(b, from, to) {
    var canFlow = from.t === "step" && to.t === "step";
    if (!canFlow) {
      go(function () {
        b.edges.push({ id: uid(), a: from.id, b: to.id, k: "link", label: "" });
      });
      toast("Linked — belongs with, in no order");
      return;
    }
    openModal({
      title: "What is this connection?",
      message: "Sequence and association are different things and the board draws them differently. One is the order the work happens in; the other is a reference that has no order at all.",
      confirmLabel: "Connect",
      fields: [
        { key: "k", label: "It means", type: "select", span: true, value: "then", options:
          Object.keys(EDGE_KINDS).map(function (k) {
            return { value: k, label: "“" + clip(to.label, 20) + "” " + EDGE_KINDS[k].says };
          }).concat([{ value: "link", label: "They belong together, in no order" }]) },
        { key: "label", label: "Or your own words", type: "text", span: true, value: "",
          hint: "What this way out is called on the board. Left blank it takes the name above." }
      ],
      onConfirm: function (v) {
        var isLink = v.k === "link";
        var kind = EDGE_KINDS[v.k];
        go(function () {
          b.edges.push({ id: uid(), a: from.id, b: to.id,
                         k: isLink ? "link" : "flow",
                         join: v.k === "all" ? "all" : v.k === "any" ? "any" : "",
                         label: isLink ? "" :
                           (v.label.trim() || (v.k === "then" ? "" : kind ? kind.word : "")) });
        });
        toast(isLink ? "Linked" : "Connected — " + (kind ? kind.says : "comes after"));
      }
    });
  }

  /* <details> opens itself, so nothing needs to re-render — the listener only
     remembers the state, or the fold would snap shut the next time anything on
     the page changed. Not in `state`: which fold you left open is view state,
     the same rule as which board is open. */
  function mountFold() {
    var d = document.querySelector("details[data-fold]");
    if (!d) return;
    d.addEventListener("toggle", function () { foldOpen = d.open; });
  }

  /* Letting go of a picture on the sheet puts it where you let go of it. The
     drop position is converted through the same toSvg() the drags use, so a
     photo dropped on a step lands on that step whatever the zoom. dragover
     must preventDefault on EVERY event or the browser navigates to the file
     instead, which looks exactly like the app crashing. */
  function mountDrop(b) {
    var box = cvSvg && cvSvg.closest ? cvSvg.closest(".cvbox") : null;
    var note = document.getElementById("dropNote");
    if (!box) return;
    function hasFile(ev) {
      var dt = ev.dataTransfer;
      if (!dt) return false;
      var t = dt.types;
      return t && (Array.prototype.indexOf.call(t, "Files") >= 0);
    }
    /* Whether the thing being dragged is a picture. dragover carries the TYPE
       but not the name, which is all this needs — the hint used to say "let go
       to put the picture here" over a .txt and then refuse it. */
    function hasImage(ev) {
      var dt = ev.dataTransfer;
      if (!dt || !dt.items) return hasFile(ev);
      return Array.prototype.some.call(dt.items, function (it) {
        return it.kind === "file" && /^image\//.test(it.type || "");
      });
    }
    box.addEventListener("dragover", function (ev) {
      if (!hasFile(ev)) return;
      ev.preventDefault();
      var pic = hasImage(ev);
      ev.dataTransfer.dropEffect = pic ? "copy" : "none";
      if (note) {
        note.textContent = pic ? "Let go to put the picture here" : "Only a picture can go on the sheet";
        note.classList.toggle("no", !pic);
        note.classList.add("on");
      }
    });
    box.addEventListener("dragleave", function (ev) {
      if (ev.target === box && note) note.classList.remove("on");
    });
    box.addEventListener("drop", function (ev) {
      if (!hasFile(ev)) return;
      ev.preventDefault();
      if (note) note.classList.remove("on");
      var f = ev.dataTransfer.files && ev.dataTransfer.files[0];
      if (!f) return;
      if (!/^image\//.test(f.type)) { toast("That is not a picture."); return; }
      var at = toSvg(ev);
      /* Dropped ON a step, it belongs with that step — which is what dropping
         it there plainly means, and the alternative is asking twice. */
      var el = document.elementFromPoint(ev.clientX, ev.clientY);
      var g = el && el.closest ? el.closest("g[data-id]") : null;
      var over = g ? nodeOf(b, g.getAttribute("data-id")) : null;
      var host = over && over.t === "step" ? over : null;
      pickPicture(b, host, { x: at.x - PW / 2, y: at.y - PH / 2 }, f);
    });
  }

  function mountCanvas() {
    cvSvg = document.getElementById("cv");
    if (!cvSvg) return;
    var b = openBoard();
    if (!b) { cvSvg = null; return; }
    if (b.derived) {
      // Rebuilt every render, so it is laid out every render — and laying out
      // a throwaway is not a change to the book, so nothing is saved. A tree
      // needs a tree layout; see mapLayout.
      mapLayout(b);
    } else if (b.nodes.some(function (n) { return typeof n.x !== "number"; })) {
      autoLayout(b); save();
    }
    drawBoard(b, cvSvg);
    fitBoard(b);
    mountKeys(b);

    /* RIGHT-CLICK, and it picks the node first so the strip and the menu
       agree about what is selected — opening a menu on a node the strip is
       not showing would be two surfaces disagreeing in the one place they
       must not. */
    /* THE NODE COMES FROM THE PRESS, NOT FROM A HIT TEST IN A LATER EVENT —
       and this took three wrong fixes to see. `ev.target` is no good, because
       `pointerdown` has already set pointer capture on the svg and under
       capture everything after it targets the svg itself (`pointermove`
       carries that note too). So the obvious repair is
       `document.elementFromPoint(ev.clientX, ev.clientY)` — and that fails as
       well, for a reason nothing on screen suggests: **the sheet is
       `tabindex="0"`, so pressing it FOCUSES it, and a browser scrolls a
       newly focused element into view.** Measured, the svg's top moved 85px
       between `pointerdown` and `contextmenu` on a scrolled page, so the
       coordinates the menu was resolving were stale by one event and landed
       on the background rect.

       `pointerdown` already found the node correctly — it is `drag.n` — so
       the menu reads it from there and no coordinate is trusted twice. The
       menu still OPENS at the cursor, because that is where a menu belongs,
       and its head names the node so the two can never be read as different
       things. */
    cvSvg.addEventListener("contextmenu", function (ev) {
      var n = drag && drag.n;
      if (!n || b.derived) { menuClose(); return; }   // the browser's menu on bare sheet
      ev.preventDefault();
      menuPick(b, n, ev.clientX, ev.clientY);
    });

    cvSvg.addEventListener("pointerdown", function (ev) {
      menuClose();
      /* LONG-PRESS, touch only. Half a second, cancelled by moving more than
         a few pixels — a drag is how a node is moved and how the sheet is
         panned, and both start with a finger going down, so the timer has to
         lose to either of them. Mouse and pen are left alone: they have a
         right button. */
      if (ev.pointerType === "touch") {
        var sx = ev.clientX, sy = ev.clientY;
        clearTimeout(cvHold);
        cvHold = setTimeout(function () {
          /* The node the press found, for the same reason the right-click
             above reads it there: focusing the sheet scrolls it, so half a
             second later the coordinates mean a different row. */
          var nn = drag && drag.n;
          if (!nn || b.derived) return;
          /* Take the drag and the pan back, or letting go after the menu
             opens would also move the node it is a menu for. */
          drag = null; pan = null;
          cvSvg.classList.remove("grabbing");
          menuPick(b, nn, sx, sy);
        }, 500);
      }
      var g = ev.target.closest ? ev.target.closest("g[data-id]") : null;
      var onHandle = ev.target.closest ? ev.target.closest("[data-handle]") : null;
      var p = toSvg(ev);
      if (g && onHandle && !b.derived) {
        // Drawing a connection, not moving the node. Never on a derived
        // sheet: there is no edge there anybody authored.
        var from = nodeOf(b, g.getAttribute("data-id"));
        if (from) {
          wire = { from: from, x: p.x, y: p.y };
          cvSvg.setPointerCapture(ev.pointerId);
          return;
        }
      }
      if (g) {
        var n = nodeOf(b, g.getAttribute("data-id"));
        if (n) { drag = { n: n, dx: p.x - n.x, dy: p.y - n.y, moved: false };
                 cvSvg.setPointerCapture(ev.pointerId); return; }
      }
      pan = { x: p.x, y: p.y };
      cvSvg.classList.add("grabbing");
      cvSvg.setPointerCapture(ev.pointerId);
    });

    cvSvg.addEventListener("pointermove", function (ev) {
      if (wire) {
        var w = toSvg(ev);
        wire.x = w.x; wire.y = w.y;
        /* Pointer capture is on, so every event targets the svg itself and
           ev.target can never be the node under the cursor. Ask the document
           what is actually there. (#wireline is pointer-events:none, or the
           line being dragged would shadow its own target.) */
        var el = document.elementFromPoint(ev.clientX, ev.clientY);
        var t = el && el.closest ? el.closest("g[data-id]") : null;
        wire.over = t ? t.getAttribute("data-id") : null;
        if (wire.over === wire.from.id) wire.over = null;
        drawWire(b);
        return;
      }
      if (cvHold) clearTimeout(cvHold);   // a move is a drag or a pan, not a hold
      if (drag) {
        var p = toSvg(ev);
        drag.n.x = Math.round(p.x - drag.dx);
        drag.n.y = Math.round(p.y - drag.dy);
        drag.moved = true;
        var g = cvSvg._gN.querySelector('g[data-id="' + drag.n.id + '"]');
        if (g) g.setAttribute("transform", "translate(" + drag.n.x + "," + drag.n.y + ")");
        drawEdges(b, cvSvg);
      } else if (pan) {
        var q = toSvg(ev);
        if (Math.abs(q.x - pan.x) > 2 || Math.abs(q.y - pan.y) > 2) pan.moved = true;
        vb.x -= (q.x - pan.x); vb.y -= (q.y - pan.y); applyVB();
      } else {
        var t = ev.target.closest ? ev.target.closest("g[data-id]") : null;
        var id = t ? t.getAttribute("data-id") : null;
        if (id !== hov) { hov = id; drawEdges(b, cvSvg); }
      }
    });

    function endPointer(ev) {
      clearTimeout(cvHold); cvHold = null;
      if (wire) {
        var to = wire.over ? nodeOf(b, wire.over) : null;
        var from = wire.from;
        wire = null;
        clearWire();
        if (to) askConnect(b, from, to);
      }
      if (drag && drag.moved && !b.derived) save();
      /* On a real sheet a tap SELECTS, because everything you can do to a node
         lives behind picking it. On the job map there is exactly one thing to
         do with a node — open what it stands for — so picking it would be a
         step to nowhere. */
      if (drag && !drag.moved && b.derived) { mapTap(drag.n); return; }
      /* Only when it actually changes. Repainting the strip for the node it
         is already showing is a layout shift for nothing — and with the
         menu open it is a layout shift underneath it. */
      if (drag && !drag.moved && sel !== drag.n.id) { sel = drag.n.id; paintSel(b); }
      if (pan && !pan.moved && sel) { sel = ""; paintSel(b); }
      drag = null; pan = null;
      cvSvg.classList.remove("grabbing");
      if (cvSvg.hasPointerCapture && cvSvg.hasPointerCapture(ev.pointerId)) cvSvg.releasePointerCapture(ev.pointerId);
    }
    cvSvg.addEventListener("pointerup", endPointer);
    cvSvg.addEventListener("pointercancel", endPointer);
    cvSvg.addEventListener("pointerleave", function () { if (hov) { hov = null; drawEdges(b, cvSvg); } });
    cvSvg.addEventListener("wheel", function (ev) {
      ev.preventDefault();
      var p = toSvg(ev);
      zoomBy(ev.deltaY < 0 ? 1.12 : 1 / 1.12, p.x, p.y);
    }, { passive: false });
    // A picture dropped on a derived sheet has nowhere to live: the node it
    // landed on is thrown away on the next render.
    if (!b.derived) mountDrop(b);
  }

  /* One tap, one destination. A node that stands for nothing openable (the
     job itself, "on its own", "nothing running yet") says so rather than
     doing nothing, because a tap that appears to fail reads as the app being
     broken. */
  function mapTap(n) {
    if (n._open && byId(state.boards, n._open)) {
      jobMap = null; openId = n._open; view = "boards"; unmaximize(); render(); return;
    }
    if (n._openProj && projOf(n._openProj)) {
      jobMap = null; openProj = n._openProj; projTab = "over"; view = "jobs"; unmaximize(); render(); return;
    }
    toast(n._root ? "This is the job itself \u2014 tap a board to open it"
                  : "Nothing to open here \u2014 the boards are the ones that open");
  }

  /* ================= writing a procedure as prose =================

     The most useful thing in the whole design round, and the thing that makes
     the graph model bearable: you type the procedure the way you already write
     it, and the app reads it back. Nobody drags nine boxes and eighteen arrows
     to describe something they can say in nine lines.

         design it
         → send a draft to N. Aoun, S. Frem (remind me after 5 days)
         → fix their notes
         → go round again, or stop?
             again → fix their notes
             stop  → file the final version
         → watch the printing
         → archive

     Two rules hold it honest.

     It NEVER guesses. A line it cannot place comes back as unplaced, named, and
     left for you — "keep the press quote near watch the printing" is either a
     step or a thing hanging off one, and only the writer knows which. Guessing
     would quietly put a wrong shape in the record, which is the failure this
     whole app is built to avoid.

     And nothing exists until it is accepted. parseProse() returns a reading;
     it writes nothing. The screen shows what it understood, and a tap is what
     commits it — the same discipline as the adviser proposing and never acting.
  */

  var ARROW = /^\s*(?:→|->|=>|>|·|\*|-|—|\d+[.)])\s+/;

  // "(remind me after 5 days)", "(chase after 5d)", "(after 5 days)"
  var RE_CHASE = /\((?:remind(?:\s+me)?|chase|check\s*back|nudge)?\s*(?:after\s*)?(\d+)\s*(?:d|days?)\)/i;
  // "on Friday", "by 18 September", "at 3:45" — a date the writer states.
  var RE_DATED = /\b(?:on|by|due)\s+([A-Z][a-z]+day|\d{1,2}\s+[A-Z][a-z]+|\d{4}-\d{2}-\d{2})\b/;

  var VERBS = [
    { act: "send",  re: /^(?:send|email|mail|share|submit|post|give)\b/i },
    { act: "watch", re: /^(?:watch|monitor|wait|await|follow\s+up|track|chase)\b/i },
    { act: "file",  re: /^(?:file|archive|put\s+away|store|upload|deposit|save)\b/i },
    { act: "ask",   re: /\?\s*$/ }
  ];

  function actOf(text) {
    for (var i = 0; i < VERBS.length; i++) if (VERBS[i].re.test(text)) return VERBS[i].act;
    return "do";
  }

  // "send a draft to N. Aoun, S. Frem" -> ["N. Aoun", "S. Frem"]
  function peopleIn(text) {
    var m = /\bto\s+(.+?)(?:\s*\(|$)/i.exec(text);
    if (!m) return [];
    return m[1].split(/\s*(?:,|\band\b|&)\s*/)
      .map(function (x) { return x.trim().replace(/[.;:]+$/, ""); })
      .filter(function (x) {
        // A name, not the rest of the sentence: short, and starting upper case.
        return x && x.length <= 34 && /^[A-Z؀-ۿ]/.test(x) && x.split(/\s+/).length <= 4;
      });
  }

  function parseProse(text) {
    var raw = String(text || "").split(/\n/);
    var steps = [], exits = [], unplaced = [], people = {};

    raw.forEach(function (line, idx) {
      var t = line.replace(/\s+$/, "");
      if (!t.trim()) return;
      var indented = /^\s{2,}|^\t/.test(line);
      var body = t.replace(ARROW, "").trim();
      if (!body) return;

      // An indented "again → fix their notes" is an EXIT of the question above
      // it, not a step of its own. This is how a branch gets written by hand.
      var ex = /^(.+?)\s*(?:→|->|=>)\s*(.+)$/.exec(body);
      if (indented && ex) {
        exits.push({ label: ex[1].trim(), target: ex[2].trim(), line: idx });
        return;
      }
      // A line with no arrow, not indented, and not the first — the writer was
      // saying something about the work rather than naming a step. Do not
      // guess which: hand it back.
      if (!ARROW.test(t) && steps.length && !indented) {
        unplaced.push({ text: body, line: idx,
          why: "a step of its own, or a thing hanging off one? It won't guess." });
        return;
      }

      var chase = RE_CHASE.exec(body);
      var dated = RE_DATED.exec(body);
      var clean = body.replace(RE_CHASE, "").trim().replace(/\s{2,}/g, " ");
      var act = actOf(clean);
      var to = act === "send" ? peopleIn(clean) : [];
      to.forEach(function (n) { people[n] = 1; });

      steps.push({
        label: cap(clean.replace(/\s*[.;]$/, "")),
        act: act,
        chaseDays: chase ? num(chase[1]) : (act === "send" || act === "watch" ? 0 : 0),
        dueWords: dated ? dated[1] : "",
        to: to,
        line: idx
      });
    });

    /* Each way out names where it goes. Matching an existing step is a jump or
       a loop; naming one that has not been written yet MAKES it, because the
       writer named it — in the worked example "file the final version" appears
       only as the stop branch and is plainly a step. That is not the parser
       guessing: it is taking the writer at their word. What it still refuses to
       do is decide the SHAPE of a line nobody pointed anywhere. */
    exits.forEach(function (x) {
      var want = x.target.toLowerCase();
      var hit = -1;
      steps.forEach(function (st, i) {
        var lab = st.label.toLowerCase();
        if (hit < 0 && (lab === want || lab.indexOf(want) === 0 || want.indexOf(lab) === 0)) hit = i;
      });
      if (hit < 0) {
        var made = { label: cap(x.target), act: actOf(x.target), chaseDays: 0,
                     dueWords: "", to: [], line: x.line, made: true };
        steps.push(made);
        hit = steps.length - 1;
      }
      x.toIndex = hit;
    });

    return { steps: steps, exits: exits, unplaced: unplaced, people: Object.keys(people) };
  }

  // Turn an accepted reading into a real board. Separate from the parse on
  // purpose: the parse is allowed to run on every keystroke, this is not.
  /* Where the sequence comes from — and the one place this used to guess.

     Indices into read.steps are NOT positions in the procedure. A step invented
     from a branch target ("file the final version", named only as the stop
     branch) is appended to the end of the list, and the old code chained
     step i to step i+1 straight down that array. Three things went wrong at
     once, on the app's own worked example:

       · the lines written AFTER an indented block were never joined to the
         question above them, so "watch the printing" had no way in and became
         a second entry node — every run of the example opened telling you to
         watch the printing of a brochure nobody had designed;
       · "archive" was chained to the invented "file the final version" purely
         because it sat next in the array, inventing an edge the writer never
         wrote and running it backwards;
       · and the stop branch dead-ended, so choosing it never reached the
         monitoring or the archiving.

     So sequence is read off the WRITTEN COLUMN — the lines the writer actually
     typed, in the order they typed them — and the indented block is understood
     as a detour the column continues after. It continues from the way out that
     goes FORWARD: the one whose target is not already above it. Exactly one
     forward way out and that is unambiguous. None, or more than one, and the
     app genuinely does not know which branch the next line belongs to, so it
     refuses to join it and says which line it could not place — the same rule
     as a line nobody pointed anywhere.

     Pure over indices, and used by both the preview and the writer, so what
     you are shown cannot drift from what gets written down. */
  function proseLinks(read) {
    var column = [];
    read.steps.forEach(function (st, i) { if (!st.made) column.push(i); });

    // Which written step does each way out leave from: the last line above it.
    // Written steps only — an invented one carries the line of the exit that
    // made it, which used to let a second exit hang off the first one's target.
    var waysOf = {};
    read.exits.forEach(function (x) {
      var from = -1;
      column.forEach(function (i) { if (read.steps[i].line < x.line) from = i; });
      if (from < 0) return;
      (waysOf[from] = waysOf[from] || []).push(x);
    });

    function forward(x, k) {
      var at = column.indexOf(x.toIndex);
      return at < 0 || at > k;            // invented, or further down the column
    }

    var chain = [], unjoined = [];
    column.forEach(function (i, k) {
      (waysOf[i] || []).forEach(function (x) {
        x.back = !forward(x, k);          // read by the preview: it loops
        chain.push({ from: i, to: x.toIndex, label: x.label });
      });
    });

    for (var k = 0; k < column.length - 1; k++) {
      var here = column[k], next = column[k + 1], ways = waysOf[here];
      if (!ways) { chain.push({ from: here, to: next, label: "" }); continue; }
      var fwd = ways.filter(function (x) { return forward(x, k); });
      if (fwd.length === 1) chain.push({ from: fwd[0].toIndex, to: next, label: "" });
      else unjoined.push({ label: read.steps[next].label, after: read.steps[here].label,
                           why: fwd.length ? "more than one way out leads onward" : "every way out loops back" });
    }
    return { column: column, waysOf: waysOf, chain: chain, unjoined: unjoined };
  }

  function boardFromProse(name, benchId, kindId, read) {
    var nodes = [], edges = [], byIdx = {};
    read.steps.forEach(function (st, i) {
      var n = { id: uid(), t: "step", act: st.act, label: st.label,
                chaseDays: st.chaseDays || "", dueAt: "", enteredAt: "", doneAt: "", answer: "" };
      byIdx[i] = n; nodes.push(n);
    });
    proseLinks(read).chain.forEach(function (c) {
      edges.push({ id: uid(), a: byIdx[c.from].id, b: byIdx[c.to].id, k: "flow", label: c.label });
    });
    // People named in a send become things, linked to the step that names them.
    read.steps.forEach(function (st, i) {
      st.to.forEach(function (who) {
        var t = { id: uid(), t: "thing", kind: "person", label: who };
        nodes.push(t);
        edges.push({ id: uid(), a: t.id, b: byIdx[i].id, k: "link", label: "" });
      });
    });
    return { id: uid(), kind: "template", name: name, benchId: benchId || "", kindId: kindId || "",
             fromBoardId: "", nodes: nodes, edges: edges, startedOn: "", closedOn: "", archived: false };
  }

  /* The writing screen. Prose on the left, what it understood on the right,
     and nothing written until it is accepted. */
  var proseText = "";   // view state, never saved

  var PROSE_SEED = [
    "design it",
    "→ send a draft to N. Aoun, S. Frem (remind me after 5 days)",
    "→ fix their notes",
    "→ send v2, ask for a backup",
    "→ go round again, or stop?",
    "    again → fix their notes",
    "    stop → file the final version",
    "→ watch the printing",
    "→ archive"
  ].join("\n");

  function renderWrite() {
    var read = parseProse(proseText);
    var h = '<div class="finding"><h1>Write a procedure</h1></div>' +
      '<p class="saynote">Type it the way you already write it. An arrow for what comes next, an indented line for a way out of a question, and brackets for when to be reminded.</p>';

    h += '<div class="writegrid">';
    h += '<div class="writebox"><textarea id="proseIn" spellcheck="false" placeholder="' +
      esc(PROSE_SEED) + '">' + esc(proseText) + "</textarea>" +
      '<div class="tools"><button class="btn" data-act="prose-seed">Use the worked example</button>' +
      '<button class="btn" data-act="prose-clear">Clear</button></div></div>';

    h += '<div class="readback">';
    if (!read.steps.length) {
      h += '<p class="empty">Nothing read yet. Every line becomes a step; nothing is written down until you accept it.</p>';
    } else {
      h += '<div class="sect" style="margin-top:0">Read back — ' +
        read.steps.length + (read.steps.length === 1 ? " step" : " steps") + "</div>";
      // Ownership comes from proseLinks, which counts written lines only.
      // Recomputing it here over every step let a step invented by an earlier
      // way out take a later one: "web → Upload it" showed under "Send to the
      // printer" rather than under the question that asked it.
      var links = proseLinks(read);
      h += '<div class="stack tight">' + read.steps.map(function (st, i) {
        var out = links.waysOf[i] || [];
        return '<div class="panel calm"><div class="grow">' +
          '<div class="nm sm">' + esc(st.label) + (st.made ? ' <span class="made">made from a way out</span>' : "") + "</div>" +
          '<div class="says">' + esc(proseSays(st, read)) + "</div>" +
          (out.length ? '<div class="says">' + out.map(function (x) {
            return "<b>" + esc(x.label) + "</b> → " + esc(read.steps[x.toIndex].label) +
              (x.back ? " <em>(goes back)</em>" : "");
          }).join("<br>") + "</div>" : "") +
          "</div></div>";
      }).join("") + "</div>";

      if (read.people.length) {
        h += '<div class="sect">People it names</div><p class="saynote" style="margin:0">' +
          esc(read.people.join(" · ")) + " — each becomes a thing hanging off the step that names them.</p>";
      }
    }

    if (read.unplaced.length) {
      h += '<div class="sect">' + (read.unplaced.length === 1 ? "One line it could not place" :
        cap(numWord(read.unplaced.length)) + " lines it could not place") + "</div>" +
        '<div class="stack tight">' + read.unplaced.map(function (u) {
          return '<div class="panel dashed"><div class="grow">' +
            '<div class="nm sm">“' + esc(u.text) + '”</div>' +
            '<div class="says">' + esc(u.why) + " Left for you.</div></div></div>";
