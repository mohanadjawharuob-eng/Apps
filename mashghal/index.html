  .subnav { display: flex; gap: 0.4rem; flex-wrap: wrap; margin: 0 0 1.2rem; }
  /* A heading inside a page, below `.sect`. `.rwhead` was borrowed for this
     and it belongs to the rail. */
  .subhead {
    font-size: 0.72rem; color: var(--faint); letter-spacing: 0.04em;
    text-transform: uppercase; padding: 0 0 0.35rem 0.2rem;
  }

  @media (max-width: 880px) {
    .findrow { padding: 0 0.8rem 0.7rem; }
    .find { padding: 4vh 0.6rem 0.6rem; }
  }

  /* ---------------- the finding, and panels that carry prose ----------------
     Replaces the pills and the tile row. A state is a sentence here, so the
     panel needs room for one and the figure needs to be big enough to read
     without looking for it. */
  .finding { display: flex; align-items: baseline; gap: 0.9rem; flex-wrap: wrap; margin: 0 0 0.25rem; }
  .finding h1 {
    margin: 0; font-family: var(--display); font-weight: 500;
    font-size: clamp(1.5rem, 4.2vw, 1.95rem); letter-spacing: -0.015em; line-height: 1.15;
  }
  .finding .stamp { font-size: 0.82rem; color: var(--faint); }
  .saynote { margin: 0 0 1.3rem; font-size: 0.85rem; color: var(--faint); }
  .saynote.foot { margin: 1.6rem 0 0; color: var(--faint); }

  .stack { display: flex; flex-direction: column; gap: 0.65rem; margin-bottom: 1.5rem; }
  .stack.tight { gap: 0.5rem; }

  .panel {
    display: flex; align-items: center; gap: 1.4rem;
    padding: 1.15rem 1.35rem; background: var(--surface);
    border: 1px solid transparent; border-radius: 16px;
  }
  .panel .grow { flex: 1; min-width: 0; }
  /* A whole row that opens something is a button, so the keyboard can reach it
     — these were divs with click handlers, which meant the Jobs tab could not
     be opened without a pointer at all. The element changes; the look does not. */
  .panel.rowbtn, button.cal-m, button.cl-row {
    width: 100%; font: inherit; color: inherit; text-align: left;
    cursor: pointer; -webkit-appearance: none; appearance: none;
  }
  .panel.rowbtn:hover { border-color: var(--rule-mid); }
  .panel .nm {
    font-family: var(--display); font-weight: 500; font-size: 1.22rem;
    letter-spacing: -0.012em; line-height: 1.25;
  }
  .panel .nm.sm { font-family: var(--sans); font-weight: 400; font-size: 1rem; letter-spacing: 0; }
  .panel .says { font-size: 0.84rem; color: var(--faint); margin-top: 0.25rem; line-height: 1.5; }
  .panel .acts { display: flex; gap: 0.5rem; flex-wrap: wrap; }

  /* The fill is the alarm. Nothing here says "LATE" in ink because it does not
     need to — and the second tint is a late thing with nobody named, which is
     a quieter fact than a person who has not replied. */
  /* State reads from a pill and an edge, not from washing the whole row.
     Recolouring the old apricot wash to rose made the top half of Waiting
     one continuous alarm, with rose panel, rose prose, rose figure and rose
     buttons all competing — and a screen where everything shouts says
     nothing. The row stays a card; the edge and the pill carry the state. */
  .panel.late { background: var(--surface); border-color: var(--rule);
                border-left: 3px solid var(--apricot); }
  /* DRIFT HAS ITS OWN EDGE. Upkeep past its interval is not late — nobody is
     waiting on you and nothing has a date — but on Home it was an ordinary
     card, indistinguishable from prose, directly under a rose one. Amber is
     drift and staleness, which is exactly what this is, and a state with no
     channel is a state the screen does not say. */
  .panel.drift { background: var(--surface); border-color: var(--rule);
                 border-left: 3px solid var(--amber); }
  .panel.late.unnamed { border-left-color: var(--amber); }
  .panel.late .says { color: var(--faint); }

  /* The one pill. A word, so the state survives a reader who cannot separate
     the hues, and the only place high chroma is spent on a row. */
  .st {
    display: inline-flex; align-items: center; gap: 0.3rem; flex: 0 0 auto;
    font-size: 0.72rem; font-weight: 600; letter-spacing: 0.02em;
    padding: 0.18rem 0.5rem; border-radius: 999px; white-space: nowrap;
  }
  .st i { width: 6px; height: 6px; border-radius: 99px; background: currentColor; }
  .st.late  { color: var(--apricot); background: color-mix(in srgb, var(--apricot) 14%, transparent); }
  .st.watch { color: var(--amber);   background: color-mix(in srgb, var(--amber) 14%, transparent); }
  .st.hand  { color: var(--sage);    background: color-mix(in srgb, var(--sage) 14%, transparent); }
  .st.idle  { color: var(--faint);   background: var(--raised); }
  .panel.dashed { border: 1.5px dashed var(--apricot-deep); }
  .panel.calm { padding: 0.85rem 1.1rem; border-radius: 14px; gap: 1rem; }
  .panel.calm.dated { border-left: 4px solid var(--sage); }
  /* The same channel rule as `.panel.late`, and this copy was missed when that
     one was rebuilt — so a late run inside a project page was still a rose
     card with rose prose on it while the identical row on Waiting was a
     neutral card with a rose edge. Two rules for one state is how a look
     drifts back. */
  .panel.calm.late { background: var(--surface); border-color: var(--rule);
                     border-left: 3px solid var(--apricot); }

  .bigage { text-align: right; flex: 0 0 auto; }
  .bigage b {
    display: block; font-family: var(--display); font-weight: 500;
    font-size: 1.6rem; line-height: 1; color: var(--apricot-lift); letter-spacing: -0.015em;
  }
  .bigage span { display: block; font-size: 0.78rem; color: var(--faint); margin-top: 0.25rem; }
  .panel .age { flex: 0 0 auto; font-size: 1rem; color: var(--dim); }
  .panel .age.ok { color: var(--sage-lift); }
  .panel .age.bad { color: var(--apricot-lift); }

  /* The one emphatic action in a panel. Filled, because on a late panel an
     outlined button disappears into the tint. */
  /* An action is neither late nor healthy, so it takes contrast rather than a
     state hue — a row of rose buttons competed with the figure that was
     actually the alarm. */
  .btn.loud {
    background: var(--ink); border-color: var(--ink); color: var(--page); font-weight: 600;
  }
  /* Not `#fff` beside `color: var(--page)`: on paper that is #fbf7ef-white
     under near-white text, the same 1.01:1 vanishing that cost
     `.btn.primary:hover` its label. `--ink-hover` is defined per theme. */
  .btn.loud:hover, .btn.loud:focus-visible {
    background: var(--ink-hover); border-color: var(--ink-hover); color: var(--page);
  }

  @media (max-width: 700px) {
    .panel { flex-wrap: wrap; gap: 0.6rem 0.9rem; padding: 0.95rem 1.05rem; }
    .panel .grow { flex: 1 1 100%; order: 1; }
    /* An identity tile and the name it belongs to stay on one line. `.grow`
       claiming the whole row put every tile on a line of its own, which read
       as a stray green square above each person's name.

       `1 1 0` and not `1 1 auto`, which is what this was and which only half
       worked: with the basis at `auto` the grow starts at its max-content
       width, so a SHORT name stayed on the tile's line and a long one — "Amphora
       sherd 4.12 · Artifact · in Trench 4 · Rim, combed…" — pushed the tile
       onto its own row again. A name can be any length and the layout may not
       depend on it being short; from a basis of nought the text wraps inside
       the grow, where it belongs, and the tile never moves. */
    .panel:has(> .itile) > .grow { flex: 1 1 0; }
    .bigage { order: 2; text-align: left; }
    .bigage b { font-size: 1.35rem; }
    .panel .age { order: 2; }
    .panel .acts { order: 3; flex: 1 1 100%; }
    .panel .acts .btn { flex: 1; text-align: center; }
  }

  /* ---------------- dues ---------------- */
  .due { display: grid; grid-template-columns: 2px 1fr auto; gap: 0 0.75rem; padding: 0.7rem 0; border-bottom: 1px solid var(--rule-soft); }
  .due:last-child { border-bottom: 0; }
  .due s { text-decoration: none; display: block; min-height: 2.1rem; }
  .due .who { font-size: 0.95rem; }
  .due .sub { font-size: 0.78rem; color: var(--faint); margin-top: 0.12rem; }
  .due .sub em { font-style: italic; color: var(--dim); font-family: var(--serif); }
  .due .age { font-family: var(--mono); font-size: 0.78rem; white-space: nowrap; text-align: right; }
  .due .age b { display: block; font-weight: 400; }
  .due .acts { grid-column: 2 / -1; display: flex; gap: 0.35rem; flex-wrap: wrap; margin-top: 0.5rem; }

  /* ---------------- modal ---------------- */
  .scrim {
    position: fixed; inset: 0; background: rgba(8,7,6,0.72); backdrop-filter: blur(2px);
    display: flex; align-items: center; justify-content: center; padding: 1rem; z-index: 60;
  }
  .modal { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); width: 100%; max-width: 430px; max-height: 88vh; overflow: auto; }
  .modal-head { padding: 1rem 1.1rem 0.6rem; }
  .modal-head h3 { margin: 0; font-size: 1.1rem; }
  .modal-head p { margin: 0.4rem 0 0; color: var(--dim); font-size: 0.86rem; line-height: 1.55; }
  .modal-body { padding: 0.8rem 1.1rem 0.2rem; }
  /* ONE COLUMN ON A PHONE. Two columns of 175px, each under a label and over
     four lines of hint, is not a form anybody fills in on a handset — and the
     three sibling apps have had this rule since they were written. */
  .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.7rem; }
  @media (max-width: 620px) { .fields { grid-template-columns: 1fr; } }
  /* The fold the shared runtime puts the rarely-needed fields behind. It sits
     inside the dialog body, so it takes the rule vocabulary of a dialog
     rather than the page's `.fold`. */
  .modal-more { margin: 0.9rem 0 0; border-top: 1px solid var(--rule-soft); }
  .modal-more summary {
    cursor: pointer; list-style: none; padding: 0.55rem 0 0.2rem;
    font-size: var(--fs-sm); color: var(--faint); letter-spacing: 0.01em;
  }
  .modal-more summary::-webkit-details-marker { display: none; }
  .modal-more summary::before { content: "\25b8"; margin-right: 0.35em; color: var(--receded); }
  .modal-more[open] summary::before { content: "\25be"; }
  .modal-more summary:hover { color: var(--dim); }
  .modal-more > .fields { padding: 0.3rem 0 0.2rem; }
  .field { display: flex; flex-direction: column; gap: 0.25rem; }
  /* `.wide` is the class the SHARED RUNTIME emits for `span: true`, and this
     stylesheet defined `.field.span` — a name nothing in the app writes. So
     `span: true` had never done anything here: every field declared to run
     the full width, a name, a date, a note, a text area, sat in a half
     column. The three older apps have always had `.field.wide`; copying the
     runtime verbatim and then naming its hook something else is the same
     class of fault as the `.tile` collision, inverted — a rule nothing
     matches instead of two rules matching one thing. `.span` stays as an
     alias so anything written against the old name keeps working. */
  .field.wide, .field.span { grid-column: 1 / -1; }
  @media (max-width: 620px) { .field.wide, .field.span { grid-column: span 1; } }
  .field label { font-size: 0.78rem; color: var(--dim); }
  .field input, .field select, .field textarea {
    background: var(--sheet); border: 1px solid var(--rule); color: var(--ink);
    padding: 0.45rem 0.55rem; font: inherit; font-size: 0.92rem; width: 100%;
  }
  .field textarea { resize: vertical; font-size: 0.88rem; }
  /* A long option clipped mid-glyph ("belongs tc") rather than trailing off.
     The whole text is still there once the select is opened. */
  .field select { text-overflow: ellipsis; }
  .field input:focus, .field select:focus, .field textarea:focus { outline: 1px solid var(--brass); outline-offset: -1px; border-color: var(--brass-deep); }
  .field .hint { font-size: 0.72rem; }
  /* A refused form says so here, beside the button that refused it. It used to
     go to a toast at the foot of the page — 340px below on a tall window, and
     the same channel every routine success uses. */
  .modal-bad {
    margin: 0; padding: 0.5rem 1.1rem 0; color: var(--apricot-lift);
    font-size: 0.86rem; line-height: 1.45;
  }
  .modal-foot { display: flex; justify-content: flex-end; gap: 0.5rem; padding: 0.9rem 1.1rem 1.1rem; }

  /* The sheet's menu. Not a modal — no scrim, no trap — so it is styled as
     a small floating card rather than a dialog: over the maximised sheet (55)
     and the switch bar (50), under the storage alarm (70) and the overlay
     (90), so any dialog one of its rows opens lands on top of it. */
  /* A NODE'S MENU IS AS LONG AS THE NODE, so it can be taller than the phone
     it is on — a live send with three ways out and two pictures runs to
     fourteen rows. Clamped to the top by `Math.max(8, y)`, the rows past the
     bottom would simply not be there: exactly the control that quietly does
     nothing. It scrolls instead, and the scroll is contained so the page
     behind does not move with it. */
  .cvmenu {
    position: fixed; z-index: 60; min-width: 12.5rem; max-width: 17rem;
    max-height: calc(100vh - 16px); overflow-y: auto; overscroll-behavior: contain;
    background: var(--raised); border: 1px solid var(--rule-mid);
    border-radius: 12px; padding: 0.3rem; box-shadow: 0 10px 28px rgba(0, 0, 0, 0.32);
    display: flex; flex-direction: column; gap: 0.1rem;
  }
  .cvmhead {
    display: flex; flex-direction: column; gap: 0.1rem;
    padding: 0.35rem 0.5rem 0.4rem; border-bottom: 1px solid var(--rule-soft);
    margin-bottom: 0.2rem;
  }
  .cvmhead b { font-size: 0.84rem; color: var(--ink); overflow-wrap: anywhere; }
  /* A row, not a pill: the strip lays these out across and the menu lays the
     same buttons down, so the shape changes and the list does not. */
  .cvmenu .cvmrow {
    justify-content: flex-start; text-align: left; width: 100%;
    border-color: transparent; background: transparent; padding: 0.42rem 0.5rem;
  }
  .cvmenu .cvmrow:hover, .cvmenu .cvmrow:focus-visible { background: var(--sunken); }
  /* The menu says "primary" and "destructive" exactly the way the strip does,
     or two renderings of one list disagree about what its rows mean. Weight,
     not sage — a row is neither a pill nor a left edge, so it is not a place
     state is allowed to speak — and the remove row is quiet until the finger
     is on it, like every other `.btn.danger` outside a dialog. */
  .cvmenu .cvmrow.loud { color: var(--ink); font-weight: 600; }
  .cvmenu .cvmrow.danger { color: var(--dim); }
  .cvmenu .cvmrow.danger:hover, .cvmenu .cvmrow.danger:focus-visible {
    color: var(--apricot); background: var(--late-tint);
  }

  /* ---------------- toasts + tip ---------------- */
  /* Above the switch bar, which is pinned to the bottom of every screen — a
     toast at `bottom: 1.1rem` sat behind it, so half of "Removed · Undo" was
     under the bar and the Undo was unreachable on a short window. The bar
     measures itself into `--sbh` on every render (mountBar), because its
     height is not a constant: it wraps to two lines when there is a re-entry
     note to read back. */
  .toasts {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(var(--sbh, 3.4rem) + 0.9rem); z-index: 80;
    display: flex; flex-direction: column; gap: 0.4rem; align-items: center;
    pointer-events: none;
  }
  /* The box ignores the pointer so it never blocks what is under it; each
     toast takes it back, or Undo could not be pressed. */
  .toasts > * { pointer-events: auto; }
  .toast {
    background: var(--raised); border: 1px solid var(--rule); color: var(--ink);
    padding: 0.5rem 0.8rem; font-size: 0.85rem; display: flex; align-items: center; gap: 0.7rem;
    border-radius: 10px; box-shadow: 0 14px 30px -18px #000; max-width: min(92vw, 460px);
  }
  .toast button { background: none; border: 0; color: var(--brass); cursor: pointer; font-size: 0.82rem; text-decoration: underline; padding: 0; }
  .tip {
    position: fixed; z-index: 90; pointer-events: none; opacity: 0; transition: opacity var(--t);
    background: var(--raised); border: 1px solid var(--rule); color: var(--ink);
    padding: 0.3rem 0.5rem; font-size: 0.78rem; max-width: 260px;
  }
  .tip.on { opacity: 1; }
  .report {
    background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 1.1rem 1.2rem;
    font-family: var(--mono); font-size: 0.78rem; line-height: 1.75; color: var(--ink);
    white-space: pre-wrap; overflow-x: auto; margin: 0 0 0.8rem;
  }
  .chart { display: block; max-width: 100%; }
  .meter { height: 5px; background: var(--rule-soft); overflow: hidden; }
  .meter-fill { height: 100%; background: var(--blue); }
  .meter-pace { height: 100%; background: var(--brass); }

  /* ---------------- the switch bar ---------------- */
  .switchbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; }
  .sb {
    display: flex; align-items: center; gap: 0.7rem;
    background: var(--raised); border-top: 1px solid var(--rule);
    padding: 0.55rem 1rem calc(0.55rem + env(safe-area-inset-bottom));
    box-shadow: 0 -10px 26px -20px #000;
  }
  .sb-txt { flex: 1; min-width: 0; }
  .sb-txt b { display: block; font-size: 0.92rem; font-weight: 500; }
  .sb-txt small { display: block; font-size: 0.78rem; color: var(--faint); }
  .sb-dot { width: 7px; height: 7px; flex: none; background: var(--blue); animation: tick 2.6s ease-in-out infinite; }
  @keyframes tick { 0%, 100% { opacity: 0.35 } 50% { opacity: 1 } }
  .sb-idle .sb-txt b { color: var(--dim); font-weight: 400; }
  .sb-warn { border-top-color: var(--oxide); }
  .sb-warn .sb-txt b { color: var(--oxide); }
  body { padding-bottom: 4rem; }

  /* ---------------- the week ---------------- */
  .wk { display: flex; gap: 0.7rem; padding: 0.7rem 0; border-bottom: 1px solid var(--rule-soft); }
  .wk:last-child { border-bottom: 0; }
  .wk-dot { width: 6px; flex: none; margin-top: 0.25rem; height: 1.6rem; }
  .wk-main { flex: 1; min-width: 0; }
  .wk-top { display: flex; justify-content: space-between; gap: 1rem; align-items: baseline; margin-bottom: 0.3rem; }
  .wk-top span { font-size: 0.84rem; color: var(--dim); }

<script>
(function () {
  "use strict";

  /* ============================================================
     Mashghal — work leaves a wake, and the app holds the wake.

     Four nouns and nothing else:
       a BOARD is a procedure (a template) or a run of one
       a NODE is a step (do/send/watch/ask/file) or a thing
       an EDGE is flow (sequence) or link (association, no order)
       a DUE is a step of a live run that is waiting for you

     Two rules the whole thing rests on:
       • A run FREEZES its template when it starts. Editing the
         template never moves a run already under way, and a run's
         own attachments never leak back into the template.
       • A run advances on a tap and never on its own. An `ask` is
         answered by a person, never inferred from elapsed time.
     ============================================================ */

  /* ================= drawn icons =================

     The tabs were single unicode glyphs — ◱ ◴ ▤ ◈ — which are whatever the
     font on the machine decides they are, sit on the wrong baseline, and mean
     nothing. Acts and things had none at all, so the only way to tell a send
     from a watch in a list was to read the word.

     One set, drawn: a 20-unit box, currentColor, 1.6 stroke, round caps, so an
     icon takes the colour of whatever it sits in and needs no second version
     for the light theme. */
  function svgIcon(d, extra) {
    return '<svg viewBox="0 0 20 20" width="18" height="18" fill="none" ' +
      'stroke="currentColor" stroke-width="1.6" stroke-linecap="round" ' +
      'stroke-linejoin="round" aria-hidden="true">' + d + (extra || "") + "</svg>";
  }
  var ICONS = {
    // tabs
    home:    svgIcon('<path d="M3 9.2 10 3.4l7 5.8V16a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 3 16z"/><path d="M8 17.5v-5h4v5"/>'),
    boards:  svgIcon('<rect x="2.5" y="4" width="6" height="5" rx="1.5"/><rect x="11.5" y="11" width="6" height="5" rx="1.5"/><path d="M8.5 6.5h3a2 2 0 0 1 2 2v2.5"/>'),
    waiting: svgIcon('<circle cx="10" cy="10" r="7"/><path d="M10 6v4.2l2.8 1.7"/>'),
    week:    svgIcon('<path d="M3 5h14M3 10h9M3 15h11"/>'),
    cal:     svgIcon('<rect x="3" y="4.5" width="14" height="12.5" rx="2"/><path d="M3 8.5h14M7 2.8v3.2M13 2.8v3.2"/><circle cx="7.4" cy="12.3" r="1" fill="currentColor" stroke="none"/>'),
    jobs:    svgIcon('<rect x="2.5" y="6.5" width="15" height="10" rx="2"/><path d="M7.5 6.5V5a1.8 1.8 0 0 1 1.8-1.8h1.4A1.8 1.8 0 0 1 12.5 5v1.5M2.5 11h15"/>'),
    settings: svgIcon('<path d="M4 6h12M4 10h12M4 14h12"/><circle cx="7.5" cy="6" r="1.9" fill="var(--surface)"/><circle cx="12.5" cy="10" r="1.9" fill="var(--surface)"/><circle cx="8.5" cy="14" r="1.9" fill="var(--surface)"/>'),
    // acts
    do:    svgIcon('<circle cx="10" cy="10" r="6.6"/><path d="M7.2 10.2l2 2 3.6-4"/>'),
    send:  svgIcon('<path d="M17 3.5L9 11"/><path d="M17 3.5l-5 13.5-2.8-5.7L3.5 8.5z"/>'),
    watch: svgIcon('<path d="M2.2 10S5.4 4.8 10 4.8 17.8 10 17.8 10 14.6 15.2 10 15.2 2.2 10 2.2 10z"/><circle cx="10" cy="10" r="2.2"/>'),
    ask:   svgIcon('<path d="M10 3.2v5.3M10 8.5L5 13.4M10 8.5l5 4.9"/><circle cx="10" cy="3.2" r="1.5"/><circle cx="4.6" cy="14.6" r="1.7"/><circle cx="15.4" cy="14.6" r="1.7"/>'),
    file:  svgIcon('<path d="M3 11.5V5.4A1.9 1.9 0 0 1 4.9 3.5h3.4l1.6 2h5.2A1.9 1.9 0 0 1 17 7.4v4.1"/><path d="M3 11.5h3.6l1.2 2h4.4l1.2-2H17v3.2a1.9 1.9 0 0 1-1.9 1.9H4.9A1.9 1.9 0 0 1 3 14.7z"/>'),
    // things
    person: svgIcon('<circle cx="10" cy="7" r="3.2"/><path d="M4.4 16.4a5.9 5.9 0 0 1 11.2 0"/>'),
    doc:    svgIcon('<path d="M5 3.2h6l4 4v9.6H5z"/><path d="M11 3.2v4h4"/>'),
    photo:  svgIcon('<rect x="2.8" y="4.4" width="14.4" height="11.2" rx="2"/><circle cx="7.4" cy="8.4" r="1.5"/><path d="M3.2 13.6l3.8-3.4 3 2.6 2.6-2.4 4.2 3.8"/>'),
    kit:    svgIcon('<path d="M3.4 7.2h13.2v8.4a1.4 1.4 0 0 1-1.4 1.4H4.8a1.4 1.4 0 0 1-1.4-1.4z"/><path d="M7.4 7.2V5.4a1.6 1.6 0 0 1 1.6-1.6h2a1.6 1.6 0 0 1 1.6 1.6v1.8"/>'),
    device: svgIcon('<rect x="6" y="2.8" width="8" height="14.4" rx="1.9"/><path d="M8.8 5.2h2.4"/><circle cx="10" cy="14.4" r="0.9" fill="currentColor" stroke="none"/>'),
    note:   svgIcon('<path d="M4.4 3.6h11.2v9l-3.6 3.8H4.4z"/><path d="M15.6 12.6h-3.6v3.8M7 7.4h6M7 10.2h4"/>'),
    thing:  svgIcon('<circle cx="10" cy="10" r="6.4"/>'),
    // the finder
    find:   svgIcon('<circle cx="8.8" cy="8.8" r="5.4"/><path d="M12.8 12.8l4 4"/>'),
    run:    svgIcon('<circle cx="10" cy="10" r="7"/><path d="M8.4 7l4.4 3-4.4 3z"/>'),
    bench:  svgIcon('<path d="M3 8.2h14v2.2H3zM5 10.4v5.4M15 10.4v5.4M3 8.2l2-4h10l2 4"/>'),
    cmd:    svgIcon('<path d="M4 6.2l3.4 3.8L4 13.8M9.6 14h6.4"/>'),
    pen:    svgIcon('<path d="M13.4 3.4l3.2 3.2L7.2 16H4v-3.2z"/><path d="M11.6 5.2l3.2 3.2"/>'),
    // a project: a bounded body of work with a date on it
    out:    svgIcon('<path d="M3.4 12.4v2.8a1.8 1.8 0 0 0 1.8 1.8h9.6a1.8 1.8 0 0 0 1.8-1.8v-2.8"/><path d="M10 3v9.2"/><path d="M6.6 8.6 10 12l3.4-3.4"/>'),
        book:   svgIcon('<path d="M3.4 4.6a1.4 1.4 0 0 1 1.4-1.4h3.4A2 2 0 0 1 10 5v10.6a1.8 1.8 0 0 0-1.4-.8H3.4z"/><path d="M16.6 4.6a1.4 1.4 0 0 0-1.4-1.4h-3.4A2 2 0 0 0 10 5v10.6a1.8 1.8 0 0 1 1.4-.8h5.2z"/>'),
        code:   svgIcon('<path d="M7.2 6.2 3.6 10l3.6 3.8"/><path d="M12.8 6.2 16.4 10l-3.6 3.8"/><path d="M11.3 4.3 8.7 15.7"/>'),
    plug:   svgIcon('<path d="M7.6 2.8v3.4M12.4 2.8v3.4"/><path d="M5.4 6.2h9.2v2.4A4.6 4.6 0 0 1 10 13.2a4.6 4.6 0 0 1-4.6-4.6z"/><path d="M10 13.2v4"/>'),
        proj:   svgIcon('<path d="M3.2 6.4a1.8 1.8 0 0 1 1.8-1.8h3l1.5 2h5.3a1.8 1.8 0 0 1 1.8 1.8v6.4a1.8 1.8 0 0 1-1.8 1.8H5a1.8 1.8 0 0 1-1.8-1.8z"/><path d="M7 11.4h6"/>')
  };
  function actIcon(act) { return ICONS[act] || ICONS.do; }
  function thingIcon(kind) {
    return ICONS[kind === "file" ? "doc" : kind === "asset" ? "kit" : kind] || ICONS.thing;
  }

  var ACTS = {
    do:    { label: "Do",     word: "do",     tone: "blue"  },
    send:  { label: "Send",   word: "send",   tone: "brass" },
    watch: { label: "Watch",  word: "watch",  tone: "brass" },
    ask:   { label: "Decide", word: "decide", tone: "blue"  },
    file:  { label: "File",   word: "file",   tone: "verd"  }
  };
  /* What a connection can mean, beyond "then". The graph could always express
     all of these — a labelled flow edge is a branch, an edge to an earlier step
     is a loop — but you had to know that, which made it invisible. Naming them
     is the whole change: the model underneath is unchanged.

     `wait` is the one that carries real meaning for a run: a step with several
     ways in can either start when the FIRST of them arrives or wait for all of
     them. The GIS run needs both — metadata can start once any area is
     digitised, but filing waits for every one. */
  var EDGE_KINDS = {
    then:   { word: "then",         says: "comes after" },
    yes:    { word: "if yes",       says: "when the answer is yes" },
    no:     { word: "if no",        says: "when the answer is no" },
    again:  { word: "go round",     says: "back for another pass" },
    stop:   { word: "stop here",    says: "the way out of the loop" },
    all:    { word: "and the rest", says: "waits for every way in" },
    any:    { word: "whichever",    says: "starts on the first way in" }
  };

  var THINGS = {
    person: "Person", file: "File", photo: "Photo", asset: "Kit",
    device: "Device", note: "Note"
  };
  /* ================= a list you can add to from the dialog =================

     Every fixed list in this app was a wall: five acts, six kinds of thing,
     three places. The moment your work needed a sixth act or a fourth place,
     the app said no and there was nowhere to say otherwise.

     So each of them is now a FLOOR rather than a ceiling. The built-ins below
     are what a book starts with; `state.vocab` holds what you added, it syncs
     and backs up like everything else, and every dropdown built from one ends
     with "Other — write it in". Choosing that reveals a box, and what you type
     is added to the list for good, so the next dialog offers it.

     The rule is systemic on purpose: a picker that cannot be extended is a
     picker that will eventually be wrong, and adding the escape hatch to one
     dialog at a time is how half of them end up without it. */
  /* A SNIPPET'S LANGUAGE IS A VOCABULARY LIKE EVERY OTHER. The floor is what
     this book's owner actually reuses; "Other \u2014 write it in" is what stops
     the list being wrong the first time somebody pastes VBA or a Praat
     script. Hardcoding five would be the app's first rule broken in the one
     screen most likely to grow a word. */
  var SNIP_LANGS = {
    excel:      "Excel formula",
    python:     "Python",
    arcpy:      "ArcPy",
    gdal:       "GDAL / OGR",
    powershell: "PowerShell",
    bash:       "Shell",
    sql:        "SQL",
    js:         "JavaScript",
    r:          "R",
    regex:      "Regular expression",
    other:      "Other"
  };

  var VOCABS = {
    acts:       { of: function () { return ACTS; },        word: "act",
                  make: function (label) { return { label: label, word: label.toLowerCase(), tone: "blue" }; } },
    things:     { of: function () { return THINGS; },      word: "kind of thing",
                  make: function (label) { return label; } },
    places:     { of: function () { return PLACES; },      word: "place",
                  make: function (label) { return label; } },
    /* No edgeKinds entry: the connect dialog carries its own "Or your own
       words" field, which puts the meaning on the edge's label where the board
       reads it. A second mechanism that wrote into state.vocab and was never
       offered by any picker is a trap, not a feature. */
    claimKinds: { of: function () { return CLAIM_KINDS; }, word: "shape",
                  make: function (label) { return label; } },
    /* The registry's own list, and it was the last hardcoded one: four keys
       (laptop, phone, audio, other) for a book that has to hold aerials, an
       orthophoto, a brochure, ArcGIS Pro and a pair of headphones. Read
       through `vocabLabel("assetKinds", …)` everywhere — `ASSET_KINDS[k]`
       printed the raw key for anything the reader added. */
    assetKinds: { of: function () { return ASSET_KINDS; }, word: "kind of thing",
                  make: function (label) { return label; } },
    langs:      { of: function () { return SNIP_LANGS; },  word: "language",
                  make: function (label) { return label; } }
  };
  var OTHER = "__other";

  function vocabAdded(which) {
    if (!state.vocab) state.vocab = {};
    if (!state.vocab[which]) state.vocab[which] = {};
    return state.vocab[which];
  }
  // Built-ins first, in their own order, then whatever you have added.
  function vocabAll(which) {
    var base = VOCABS[which].of(), out = {}, k;
    for (k in base) out[k] = base[k];
    var mine = (state.vocab && state.vocab[which]) || {};
    for (k in mine) out[k] = mine[k];
    return out;
  }
  function vocabLabel(which, key) {
    var v = vocabAll(which)[key];
    if (!v) return key || "";
    return typeof v === "string" ? v : (v.label || v.word || key);
  }
  // The options a picker shows, with the way out at the bottom.
  function vocabOpts(which) {
    var all = vocabAll(which);
    return Object.keys(all).map(function (k) {
      return { value: k, label: vocabLabel(which, k) };
    }).concat([{ value: OTHER, label: "Other — write it in" }]);
  }
  /* Resolves what the dialog came back with. If "Other" was chosen and
     something was typed, it is added to the list and its new key returned; if
     "Other" was chosen and nothing was typed, the fallback is used rather than
     writing an entry with no name. Must be called inside go(), because it
     writes to state. */
  function vocabTake(which, pick, typed, fallback) {
    if (pick !== OTHER) return pick;
    var label = String(typed || "").trim();
    if (!label) return fallback || Object.keys(vocabAll(which))[0];
    var all = vocabAll(which), k;
    for (k in all) {
      if (String(vocabLabel(which, k)).toLowerCase() === label.toLowerCase()) return k;
    }
    var key = label.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || uid();
    if (all[key]) key = key + "-" + uid().slice(0, 4);
    vocabAdded(which)[key] = VOCABS[which].make(label);
    return key;
  }
  // The text field that sits under a vocabulary picker in every dialog.
  function otherField(which, key) {
    // Hidden until "Other" is the answer, through the runtime's showWhen —
    // it used to stand in every one of these dialogs saying it was probably

  /* ================= vocabulary helpers ================= */

  function byId(list, id) {
    for (var i = 0; i < list.length; i++) { if (list[i].id === id) return list[i]; }
    return null;
  }
  /* An ARCHIVED record is removed, and has to read that way. This checked the
     list first and returned the plain name, so a bench kept reading
     "GIS · AUB Tripoli 21st C" after that claimant was removed — `forget()`
     had put the name in `forgotten` and nothing ever looked, because the
     record was still there. The record survives on purpose (it is what the
     spans point at); what it must not do is look live. */
  function nameOf(list, id, what) {
    var r = byId(list, id);
    if (r) return r.archived ? r.name + " (removed)" : r.name;
    if (state.forgotten[id]) return state.forgotten[id] + " (removed)";
    return id ? "(removed " + what + ")" : "";
  }
  function claimantName(id) { return nameOf(state.claimants, id, "claimant"); }
  function modeName(id) { return nameOf(state.modes, id, "mode"); }
  function kindName(id) { return nameOf(state.kinds, id, "kind"); }

  function benchLabel(id) {
    var b = byId(state.benches, id);
    if (!b) return id ? "(removed bench)" : "no bench";
    return modeName(b.modeId) + " · " + claimantName(b.claimantId);
  }
  function live(list) { return list.filter(function (r) { return !r.archived; }); }

  function forget(list, id) {
    var r = byId(list, id);
    if (r) state.forgotten[id] = r.name;
  }

  /* ================= boards, nodes, edges ================= */

  function newBoard(name, kindId, benchId) {
    return {
      id: uid(), kind: "template", name: name, kindId: kindId || "", benchId: benchId || "",
      projectId: "", fromBoardId: "", nodes: [], edges: [],
      startedOn: "", closedOn: "", archived: false
    };
  }
  function boards(kind) {
    return state.boards.filter(function (b) { return !b.archived && (!kind || b.kind === kind); });
  }
  // Which board is open is where you are looking, not something you own, so
  // it lives here rather than in state and never reaches a backup.
  var openId = "";
  /* Whether the sheet is filling the screen is where you are looking too, so
     it is view state like `openId` and `sel`: it never reaches a backup, and a
     tab press or a reload puts you back on the page. */
  var cvMax = false;
  /* The job map is a board as far as the canvas is concerned. Returning it
     here is what lets Fill, Fit, the zoom, the pan and the arrow keys all
     work on it without a second copy of any of them — and `b.derived` is what
     stops the mutating half from writing to a board that is not in
     `state.boards`. */
  function openBoard() { return jobMap || byId(state.boards, openId); }

  function nodeOf(b, id) { return byId(b.nodes, id); }
  function edgesOf(b, id, k) {
    return b.edges.filter(function (e) {
      return (!k || e.k === k) && (e.a === id || e.b === id);
    });
  }
  function nextOf(b, id) {
    return b.edges.filter(function (e) { return e.k === "flow" && e.a === id; });
  }
  function prevOf(b, id) {
    return b.edges.filter(function (e) { return e.k === "flow" && e.b === id; });
  }
  // Who a send goes to is not a second list to keep in step — it is the people
  // linked to it. Linking a person to a send is what "this goes to them" means,
  // so there is one fact and one place to change it.
  function recipientsOf(b, n) {
    return edgesOf(b, n.id, "link").map(function (e) {
      return nodeOf(b, e.a === n.id ? e.b : e.a);
    }).filter(function (t) { return t && t.t === "thing" && t.kind === "person"; });
  }

  // A decision's exits are its labelled outgoing lines, and nothing else. They
  // used to be a list on the node as well, which meant routing read one of them
  // and the screen read the other — two truths, and only one of them right.
  function exitsOf(b, n) {
    return nextOf(b, n.id).filter(function (e) { return e.label; })
      .map(function (e) { return { label: e.label, goTo: e.b, edgeId: e.id }; });
  }

  function entryNodes(b) {
    return b.nodes.filter(function (n) {
      return n.t === "step" && prevOf(b, n.id).length === 0;
    });
  }

  // Where a node stands in a run. Derived from doneAt / enteredAt and the
  // clock — never stored, so it cannot drift away from the dates.
  function nodeState(b, n) {
    if (n.t !== "step") return "thing";
    if (b.kind !== "run") return "todo";
    if (n.doneAt) return "done";
    if (!n.enteredAt) return "todo";
    if (n.act === "send" || n.act === "watch") {
      return overdueBy(n) > 0 ? "over" : "waiting";
    }
    return "now";
  }
  function daysWaiting(n) {
    if (!n.enteredAt) return 0;
    return Math.max(0, daysBetween(n.enteredAt, today()));
  }
  // Positive means past the chase. A step with no chase interval can wait
  // for ever without being called late — silence is not always a failure.
  // Measured from the last chase rather than from the start, so chasing buys
  // another interval: otherwise a step chased this morning still reads eleven
  // days past, and the one number you would act on is the one that is wrong.
  // The total wait is a separate figure and does not move.
  function overdueBy(n) {
    if (!n.chaseDays) return 0;
    return sinceChase(n) - num(n.chaseDays);
  }
  function sinceChase(n) {
    var from = n.chasedAt || n.enteredAt;
    if (!from) return 0;
    return Math.max(0, daysBetween(stampDay(from), today()));
  }
  function chaseCount(n) { return num(n.chases || 0); }
  function activeNodes(b) {
    return b.nodes.filter(function (n) {
      return n.t === "step" && n.enteredAt && !n.doneAt;
    });
  }
  function runProgress(b) {
    var steps = b.nodes.filter(function (n) { return n.t === "step"; });
    var done = steps.filter(function (n) { return n.doneAt; }).length;
    return { done: done, total: steps.length };
  }
  // The archive lock: a run is not finished while a filing step is undone.
  // Printed and never archived is exactly the thing that gets forgotten.
  function unfiled(b) {
    return b.nodes.filter(function (n) {
      return n.t === "step" && n.act === "file" && !n.doneAt;
    });
  }

  /* ================= running a board ================= */

  function startRun(tpl, title) {
    var r = JSON.parse(JSON.stringify(tpl));
    r.id = uid();
    r.kind = "run";
    r.fromBoardId = tpl.id;
    r.name = title;
    r.startedOn = today();
    r.closedOn = "";
    r.nodes.forEach(function (n) {
      n.enteredAt = ""; n.doneAt = ""; n.answer = "";
    });
    entryNodes(r).forEach(function (n) { n.enteredAt = today(); });
    state.boards.push(r);
    return r;
  }

  function enter(b, id) {
    var n = nodeOf(b, id);
    if (n && !n.enteredAt) n.enteredAt = today();
  }

  // Finishing a step opens whatever the flow says comes next. An `ask`
  // opens only the exit that was chosen, which is how the loop works.
  function finishStep(b, id, answer) {
    var n = nodeOf(b, id);
    if (!n || n.doneAt) return;
    n.doneAt = today();
    if (answer) n.answer = answer;
    var outs = nextOf(b, id);
    outs.forEach(function (e) {
      if (n.act === "ask" && answer && e.label !== answer) return;
      var t = nodeOf(b, e.b);
      if (!t) return;
      /* A step whose ways in are marked "and the rest" does not start until
         every one of them is done. Without this the label would be a lie: the
         board would say a step waits for all of its inputs and the run would
         start it on the first. The GIS example needs both readings — metadata
         can begin once any area is digitised, filing waits for every one. */
      if (!readyToEnter(b, t)) return;
      // Re-entering a step that ran before is a new pass of the cycle.
      t.doneAt = ""; t.answer = ""; t.enteredAt = today();
    });
  }

  /* Whether a step may start yet. "Whichever comes first" is the default and
     the old behaviour; "and the rest" holds the step until every way in has
     been done. An unfinished predecessor that is itself unreachable would
     deadlock the run, so only ways in that have actually been entered count —
     a branch never taken cannot hold the work up for ever. */
  function readyToEnter(b, t) {
    var ins = b.edges.filter(function (e) { return e.k === "flow" && e.b === t.id; });
    var all = ins.filter(function (e) { return e.join === "all"; });
    if (!all.length) return true;
    return !all.some(function (e) {
      var from = nodeOf(b, e.a);
      return from && from.enteredAt && !from.doneAt;
    });
  }

  function reopenStep(b, id) {
    var n = nodeOf(b, id);
    if (!n) return;
    n.doneAt = ""; n.answer = "";
    if (!n.enteredAt) n.enteredAt = today();
  }

  /* ================= dues ================= */

  // Every live step of every open run, worst first. This is the only list
  // the phone needs, and it is derived — nothing here is typed by hand.
  function dues() {
    var out = [];
    boards("run").forEach(function (b) {
      if (b.closedOn) return;
      activeNodes(b).forEach(function (n) {
        var st = nodeState(b, n);
        out.push({
          board: b, node: n, st: st,
          over: overdueBy(n), days: daysWaiting(n),
          rank: st === "over" ? 0 : st === "waiting" ? 1 : 2
        });
      });
    });
    out.sort(function (x, y) {
      if (x.rank !== y.rank) return x.rank - y.rank;
      if (x.rank === 0) return y.over - x.over;
      return y.days - x.days;
    });
    return out;
  }

  function stuck() {
    return boards("run").filter(function (b) {
      return !b.closedOn && activeNodes(b).length === 0 && unfiled(b).length > 0;
    });
  }

  /* ================= pickers ================= */

  function opts(list, labelFn) {
    return live(list).map(function (r) {
      return { value: r.id, label: labelFn ? labelFn(r) : r.name };
    });
  }
  function benchOpts() {
    return [{ value: "", label: "No bench — belongs to no employer" }].concat(
      opts(state.benches, function (b) { return benchLabel(b.id); }));
  }
  function kindOpts() {
    return [{ value: "", label: "No kind" }].concat(opts(state.kinds));
  }
  function nodeOpts(b, exceptId) {
    return b.nodes.filter(function (n) { return n.id !== exceptId; })
      .map(function (n) { return { value: n.id, label: (n.t === "step" ? "■ " : "● ") + n.label }; });
  }

  /* ================= going back =================

     The URL never changed, so the app had no history: installed on a phone,
     the back gesture — the primary way anyone navigates Android — quit the
     app instead of going up a level from an open board.

     The four things that are navigation get an entry: which tab, which board,
     which job, which mode's kit. Which week you are looking at and which month
     the calendar shows do not — those are controls inside a screen, and giving
     them entries would mean twenty-six presses of Back to leave the week after
     paging through a year.

     Tracked in afterRender rather than pushed from each action, because there
     are a dozen ways to open a board and only one place that has certainly
     finished changing the view. Nothing goes in the URL itself: these are
     module-level view state, and putting them in the address bar would make a
     shared link carry someone else's board id. */
  var navAt = null, navLock = false;

  function navSnap() {
    /* Every strip that navigates is in here, because Back has to undo the
       last thing you did and a strip press IS a navigation. `kitTab` was in
       and `repoTab` and `projTab` were not, so Back from the Library left the
       Repo altogether while Back from the workbench's Upkeep page went one
       step. One rule for all three. */
    return { view: view, openId: openId, openJob: openJob, openProj: openProj,
             openMode: openMode, openAsset: openAsset, openPerson: openPerson,
             kitTab: kitTab, repoTab: repoTab, projTab: projTab };
  }
  function navTrack() {
    var at = navSnap(), key = JSON.stringify(at);
    if (navLock) { navAt = key; return; }
    try {
      if (navAt === null) history.replaceState({ mash: at }, "");
      else if (key !== navAt) history.pushState({ mash: at }, "");
    } catch (e) {}          // a sandbox with no history is not a reason to fail
    navAt = key;
  }
  window.addEventListener("popstate", function (ev) {
    var at = ev.state && ev.state.mash;
    if (!at) return;
    navLock = true;
    view = at.view || "boards";
    openId = at.openId || ""; openJob = at.openJob || "";
    openProj = at.openProj || ""; openMode = at.openMode || "";
    openAsset = at.openAsset || ""; openPerson = at.openPerson || "";
    kitTab = at.kitTab || "things";
    repoTab = at.repoTab || "device"; projTab = at.projTab || "over";
    foldOpen = false; sel = "";
    render();
    navLock = false;
  });

  /* ================= the finder =================

     Ctrl+K, or the box at the top of the rail. It exists because nothing in
     the app could be reached by its name: six sections, boards inside them,
     steps inside those, and a person's name only ever written on a step three
     levels down. To find "Patricia" you had to already know which board she
     was on. An audit of the running app turned that up as the one missing
     thing that made every other screen slower than it needed to be.

     Two rules it keeps. It **searches the record, not the screen** — every
     hit is built from `state` through the same helpers the views use, so a hit
     can never name something the app would then fail to open. And **nothing
     here changes anything**: a hit navigates, and the few commands at the
     bottom hand straight over to `APP.actions`, which is the only place a
     figure may move. */

  var findRows = [], findAt = 0, findQ = "";

  // A word-start match beats a match buried inside a word, and an exact
  // prefix beats both — otherwise "pat" put every board with "update" in its
  // name above the person called Patricia.
  /* EVERY WORD SOMEWHERE BEATS NOTHING AT ALL. The score was the position of
     the whole query as one substring, so a two-word search only ever matched
     a name that carried both words together in that order — and the
     renamed sections made that visible: "new board" scored nought against a
     command called "New procedure" whose key carries "board" as an alias,
     because the phrase "new board" appears nowhere in it. Anything that
     matches the phrase still ranks above anything that only matches the
     words, so the order this file already describes is unchanged: an exact
     prefix beats a word start, which beats a match buried inside a word. All
     the terms have to hit, or typing two words would widen the search instead
     of narrowing it. */
  function findScore(text, q) {
    if (!text) return 0;
    var t = String(text).toLowerCase();
    var i = t.indexOf(q);
    if (i >= 0) return i === 0 ? 3 : /[\s·—\-\/(]/.test(t.charAt(i - 1)) ? 2 : 1;
    var terms = q.split(/\s+/).filter(Boolean);
    if (terms.length < 2) return 0;
    for (var k = 0; k < terms.length; k++) { if (t.indexOf(terms[k]) < 0) return 0; }
    return 0.5;
  }

  function findTile(cls, ico) {
    return '<span class="itile sm ' + cls + '">' + ico + "</span>";
  }

  /* ================= being asked a question =================

     The finder matches NAMES. It could not be asked anything — "what am I
     waiting on from Rita", "how many hours for Balamand this week", "where
     are the headphones" — and those are the questions this app exists to
     answer, so answering them by typing a name and reading a screen was the
     long way round every time.

     THERE IS NO MODEL BEHIND THIS, AND THAT IS THE WHOLE DESIGN. A language
     model here would need a key that can be spent, a network the app
     otherwise does without, and — the disqualifying one — it would put a
     thing that GUESSES between the reader and the record, in an app whose
     first rule about figures is that a plausible wrong number is worse than a
     visible failure. Every answer below is a function call: the same function
     the screen it points at uses (`dues`, `people`, `standing`, `projState`,
     `runProgress`, `thingState`, `filings`), so an answer can no more drift
     from the app than Home's tiles can.

     Four rules hold it:

     IT SAYS WHAT IT READ THE QUESTION AS. Every answer carries the shape it
     matched, so the reader can tell the app understood them rather than
     guessing from a plausible-looking reply. That line is the only defence
     against a pattern matching the wrong question.

     IT NEVER HALF-ANSWERS. A query that looks like a question and matches no
     shape says so, and lists what it CAN be asked — it does not quietly fall
     through to a name search that finds nothing, which reads as being
     ignored.

     IT PROPOSES AND NEVER ACTS. Anything that would change the record is a
     row that hands to `APP.actions` on a tap, exactly like the finder's
     existing commands. Nothing moves because of what you typed.

     AND THE TABLE IS THE HELP. `ASK_SHAPES` is data, so the list of what the
     app understands cannot drift from what it does — the alternative is a
     help text somebody has to remember to update, which is the "screen
     explaining a colour it no longer uses" fault one level up. */

  function askTile(cls, ico) { return findTile(cls, ico); }

  // One row of an answer: the sentence, and underneath it the shape it was
  // read as. Both are needed — the figure alone cannot be checked.
  function askSaid(said, shape, run) {
    return { g: "Answer", tile: askTile("t-cmd", ICONS.cmd), title: said,
             sub: "read as: " + shape, run: run || function () { findClose(); } };
  }

  /* Names are matched against the record with the finder's own scorer, so
     "balamand" finds "U. of Balamand" here exactly as it does in a search.
     It returns the best match and how good it was, because a weak match on a
     name is where a wrong answer would come from — the caller refuses rather
     than answering about something the reader did not mean. */
  /* "what am I waiting on FROM Haddad" captured "from haddad", and the whole
     answer then read "Nobody in the book matches from haddad" — right in its
     refusal and wrong about what was asked. A capture is the tail of a
     sentence, so the joining words come off it. */
  function askName(text) {
    return String(text || "")
      .replace(/^(?:from|with|for|about|on|of|to)\s+/i, "")
      .replace(/^(?:the|my|a|an)\s+/i, "")
      .replace(/[?.!,;:]+$/, "")
      .trim();
  }

  function askPick(list, text, nameOf) {
    var q = askName(text).toLowerCase();
    if (!q) return null;
    var best = null, bs = 0;
    list.forEach(function (x) {
      var s = findScore(nameOf ? nameOf(x) : x.name, q);
      if (s > bs) { bs = s; best = x; }
    });
    return bs > 0 ? { it: best, score: bs } : null;
  }

  var ASK_SHAPES = [
    {
      name: "what is late",

      run: function () {
        var over = dues().filter(function (d) { return d.st === "over"; });
        var tk = tasksLate();
        var rows = [askSaid(waitingHeadline(over.length, stuck().length, upkeepLate().length, tk.length),
                            "what is late", function () { findClose(); findTab("waiting"); })];

                      title: d.node.label, sub: d.board.name,

                      run: function () { findBoard(d.board.id, d.node.id); } });

          rows.push({ g: "Late", tile: askTile("t-cmd", ICONS.note), title: t.label,
                      sub: taskSays(t),

                      run: function () { findClose(); findTab("waiting"); } });

      hint: "what is outstanding with <person>  ·  waiting on <person>",
      re: /(?:outstanding with|waiting (?:on|for)|hear back from|owes? me)\s+(.+?)\??$/,
      run: function (m) {
        var hit = askPick(people(), m[1]);
        if (!hit) return [askSaid("Nobody in the book matches “" + askName(m[1]) + "”.",
                                  "what is outstanding with a person")];
        var p = hit.it;
        var rows = [askSaid(p.name + " — " + personSays(p),
                            "what is outstanding with a person",
                            function () { findClose(); findTab("vocab"); kitTab = "people"; openPerson = p.key; render(); })];
        p.waits.slice(0, 6).forEach(function (w) {
          rows.push({ g: "With " + p.name, tile: askTile("t-step", actIcon(w.node.act)),
                      title: w.node.label, sub: w.board.name + " · " + w.days + "d",
                      st: w.over > 0 ? '<span class="st late"><i></i>' + w.over + "d over</span>" : "",
                      run: function () { findBoard(w.board.id, w.node.id); } });
        });
        /* PROPOSES, NEVER ACTS: marking a chase is a tap on the row, not a
           consequence of having typed the question. */
        p.waits.filter(function (w) { return w.over > 0; }).slice(0, 3).forEach(function (w) {
          rows.push({ g: "Do", tile: askTile("t-cmd", ICONS.send),
                      title: "I chased today — " + w.node.label, sub: w.board.name,
                      run: function () { findClose(); APP.actions["step-chased"](w.board.id + ":" + w.node.id); } });

    },

      name: "where was I",

        var rows = [askSaid("Last on " + rec[0].name + " — " + agoWords(rec[0].at),

        rec.slice(1).forEach(function (r) {

    },
    {
      name: "hours, this week or for somebody",
      hint: "hours  ·  hours for <claimant>  ·  hours last week",
      re: /^(?:how many\s+)?hours\b\s*(?:for\s+)?(.*?)\??$/,
      run: function (m) {
        var rest = String(m[1] || "").trim().toLowerCase();

        var wk = last ? addDays(weekStart(today()), -7) : weekStart(today());

        var rowsIn = standing(wk);
        if (who) {
          var hit = askPick(rowsIn, who, function (r) { return r.c.name; });

          var r = hit.it;
          var said = r.c.name + " — " + amountWords(r.got, r.unit) + " " + span +

           its own" forbids — and this one disagreed on the sample. */
        var wkTo = addDays(wk, 6);
        var mins = state.spans.reduce(function (t, sp) { return t + minsIn(sp, wk, wkTo); }, 0);
        var rows = [askSaid(fmtMins(mins) + " " + span + " across " +
                            numWord(rowsIn.length) + (rowsIn.length === 1 ? " claimant" : " claimants"),

        rowsIn.forEach(function (x) {

                      sub: amountWords(x.got, x.unit) + (x.owed ? " of " + amountWords(x.owed, x.unit) : " · nothing owed"),
                      st: x.short ? '<span class="st watch"><i></i>short</span>' : "",
                      run: function () { findClose(); weekOf = wk; outTab = "hours"; findTab("out"); } });

        return rows;
      }
    },
    {
      name: "how a project or a board is going",
      hint: "how is <project> going  ·  what is on <project>",
      re: /^(?:how(?:'s| is)\s+(.+?)\s+going|what(?:'s| is)\s+on\s+(.+?))\??$/,
      run: function (m) {

        if (pj && pj.score >= 2) {

          var rows = [askSaid(p.name + " — " + projSays(p), "how a project is going",

          projBoards(p.id).slice(0, 6).forEach(function (b) {

                        sub: boardStand ? b.kind === "run" ? runProgress(b).done + " of " + runProgress(b).total + " done" : "a procedure" : "",

          on.slice(0, 8).forEach(function (a) {

        if (hd.kind === "copy") {
          return [askSaid(a.name + " — " + hd.how, "open something",
                          function () { findClose(); APP.actions["asset-copy"](a.id); })];
        }
        return [askSaid("Open " + a.name + " — " + hd.how, "open something",
                        function () { findClose(); window.open(hd.href, hd.kind === "url" ? "_blank" : "_self"); })];
      }
    }
  ];

  /* Looks like a question? Only then is silence a failure. A bare name is a
     search and always has been; "what is the ..." that matched nothing is the
     app appearing to ignore somebody. */
  function askShaped(q) {
    return /\?$/.test(q) ||
      /^(?:what|where|when|who|which|how|why|am i|is there|do i|did i|can i)\b/.test(q) ||
      /^(?:remind me|add a task|start |run |open |chase )/.test(q);
  }

  /* A task that exists only in the dialog. `taskDialog` reads its first
     argument for the field values and its `mk` flag off whether one was
     given, so a half-record would open as "Edit it" and save over nothing —
     hence `askTaskDialog` writes the record itself on confirm, the same way
     `task-add` does, and the dialog is only ever the form. */
  function askTaskDialog(label) {
    taskDialog(null, {});
    var el = document.getElementById("mf_label");
    if (el) { el.value = label; el.focus(); el.setSelectionRange(label.length, label.length); }
  }

  function askRecord(raw) {
    var q = String(raw).trim();
    if (!q) return { rows: [], unread: false };
    var low = q.toLowerCase();
    for (var i = 0; i < ASK_SHAPES.length; i++) {
      var m = low.match(ASK_SHAPES[i].re);
      if (!m) continue;
      var rows = ASK_SHAPES[i].run(m) || [];
      if (rows.length) return { rows: rows, unread: false };
    }
    return { rows: [], unread: askShaped(low) };
  }

  /* Every searchable thing in the book, as one flat list. Built fresh on each
     keystroke rather than cached: the book is a few hundred records, and a
     cache here is a cache that can disagree with the record. */
  function findAll() {
    var out = [];

    APP.tabs.forEach(function (t) {
      out.push({ g: "Sections", key: t.label + " " + (t.alias || ""), tile: findTile("t-go", t.ico),
                 title: t.label, sub: "section", k: 7,
                 run: function () { findTab(t.id); } });
    });
    /* The section was renamed the workbench and the finder went on calling
       it Kit, which is the one place the old name could still be read — and
       the finder is how somebody looks for a screen whose name they have
       forgotten. The old word stays in `key`, so typing "kit" still finds it;
       what it SAYS is the current name. */
    out.push({ g: "Sections", key: "workbench kit vocabulary crafts acts kinds places words things people upkeep",
               tile: findTile("t-go", ICONS.kit),
               title: "The workbench", sub: "section \u00b7 things, people, upkeep and the app's own words", k: 7,
               run: function () { findTab("vocab"); } });
    out.push({ g: "Sections", key: "Write a procedure prose", tile: findTile("t-go", ICONS.note),
               title: "Write a procedure", sub: "page · type it out in words", k: 7,
               run: function () { findTab("write"); } });
    /* SETTINGS WAS IN NO LIST THE FINDER READS. It is not a tab — it gave
       up its slot for the seventh one and moved to the gear — and the
       finder builds its section rows from `APP.tabs`, so typing "settings"
       found nothing. That is the fault this file already records twice as a
       screen the finder cannot name, and on a phone it was worse than that:
       the gear lives in `.railme`, which is `display: none` under 760px, so
       the whole screen had NO ROUTE. Every word somebody might reach for is
       in the key, because the things people actually go there for are the
       theme, their name, sync, Field mode and the build string. */
    out.push({ g: "Sections", key: "Settings preferences options theme light dark appearance name sync wipe erase field mode keyboard shortcuts build version update accessibility",
               tile: findTile("t-go", ICONS.settings),
               title: "Settings", sub: "section · the theme, your name, sync, Field mode and this build", k: 7,
               run: function () { findTab("settings"); } });

    boards().forEach(function (b) {
      var run = b.kind === "run";
      var d = run ? dues().filter(function (x) { return x.board.id === b.id; }) : [];
      var lateN = d.filter(function (x) { return x.st === "over"; }).length;
      out.push({
        g: run ? "Runs" : "Procedures",
        key: b.name + " " + (b.kindId ? kindName(b.kindId) : "") + " " + (b.benchId ? benchLabel(b.benchId) : ""),
        tile: findTile(run ? "t-run" : "t-board", run ? ICONS.run : ICONS.boards),
        title: b.name,
        sub: (run ? (b.closedOn ? "closed run" : "run") : "procedure") +
             (b.projectId && projOf(b.projectId) ? " · " + projName(b.projectId) : "") +
             (b.benchId ? " · " + benchLabel(b.benchId) : "") +
             (b.kindId ? " · " + kindName(b.kindId) : ""),
        st: lateN ? '<span class="st late"><i></i>' + lateN + " late</span>" : "",
        k: run ? (lateN ? 0 : 1) : 3,
        run: function () { findBoard(b.id, ""); }
      });

      (b.nodes || []).forEach(function (n) {
        if (!n.label) return;
        var step = n.t === "step";
        /* A thing copied from the registry is not a second thing. Typing
           "aerials" listed the registry entry and one row per board that had
           borrowed it — three near-identical hits, with the only one that
           knows where it is used buried under the copies. The registry entry
           is the canonical hit and it names every board itself; a copy whose
           source has been removed is listed again, because then nothing else
           answers for it. */
        if (!step && n.fromAssetId && assetOf(n.fromAssetId) &&
            !assetOf(n.fromAssetId).archived) return;
        /* And people are never listed from a board at all: `people()` folds
           every mention of one person into a single row that says what is
           outstanding with them, which is strictly more than a board node can
           say. Four boards naming a supervisor gave four identical hits. */
        if (!step && n.kind === "person") return;
        out.push({
          g: step ? "Steps" : "People and things",
          key: n.label,
          tile: findTile(step ? "t-step" : "t-thing",
                         step ? actIcon(n.act) : thingIcon(n.kind)),
          title: n.label,
          sub: (step ? vocabLabel("acts", n.act) : vocabLabel("things", n.kind)) + " · " + b.name,
          st: step && run ? '<span class="st ' + findTone(nodeState(b, n)) + '"><i></i>' +
              stateWord(b, n) + "</span>" : "",
          k: step ? (run && nodeState(b, n) === "over" ? 0 : 2) : 4,
          run: function () { findBoard(b.id, n.id); }
        });
      });
    });

    projects().forEach(function (p) {
      var st = projState(p);
      out.push({ g: "Projects", key: p.name + " " + (p.jobId ? jobName(p.jobId) : ""),
                 tile: findTile("t-proj", ICONS.proj),
                 title: p.name, sub: projSays(p),
                 st: '<span class="st ' + st.tone + '"><i></i>' + st.word + "</span>",
                 k: st.tone === "late" ? 0 : 2,
                 run: function () { findTab("jobs"); openProj = p.id; projTab = "over"; render(); } });
    });
    live(state.jobs).forEach(function (j) {
      out.push({ g: "Jobs", key: j.name, tile: findTile("t-job", ICONS.jobs),
                 title: j.name, sub: "job", k: 5,
                 run: function () { findTab("jobs"); openJob = j.id; render(); } });
    });
    live(state.benches).forEach(function (bn) {
      out.push({ g: "Benches", key: benchLabel(bn.id), tile: findTile("t-bench", ICONS.bench),
                 title: benchLabel(bn.id), sub: "bench · a craft and who it is for", k: 6,
                 run: function () { outTab = "hours"; findTab("out"); } });
    });
    people().forEach(function (p) {
      var tone = p.late ? "late" : p.waits.length ? "watch" : "idle";
      out.push({ g: "People", key: p.name + " " + (p.contact ? (p.contact.org || "") + " " +
                   (p.contact.role || "") + " " + (p.contact.email || "") : ""),
                 tile: findTile("t-person", ICONS.person),
                 title: p.name, sub: personSays(p),
                 st: p.waits.length ? '<span class="st ' + tone + '"><i></i>' +
                     (p.late ? p.late + " late" : "waiting") + "</span>" : "",
                 k: p.late ? 0 : 4,
                 run: function () { findTab("vocab"); kitTab = "people"; openPerson = p.key; render(); } });
    });
    live(state.assets).forEach(function (a) {
      var look = assetLook(a);
      /* The body is in the key, because the question six months later is
         "the thing that renames photos" and the name is the half you have
         forgotten. The topics are in it for the same reason. */
      out.push({ g: hasBody(a) ? "Library" : "Things",
                 key: a.name + " " + (a.notes || "") + " " + (a.path || "") + " " +
                      assetTopics(a).join(" ") + " " + snipLangLabel(a) + " " + (a.body || "") +
                      " " + assetFacts(a).map(function (f) { return f.k + " " + f.v; }).join(" "),
                 tile: findTile(look.tile, look.ico),
                 title: a.name, sub: assetSays(a), k: 4,
                 run: function () { findTab("vocab"); openAsset = a.id; render(); } });
    });
    live(state.cadences).forEach(function (cd) {
      var st = cadenceState(cd);
      var tpl = cd.runsBoardId ? byId(state.boards, cd.runsBoardId) : null;
      out.push({ g: tpl ? "Drills" : "Upkeep", key: cd.label,
                 tile: findTile(tpl ? "t-run" : "t-up", tpl ? ICONS.run : ICONS.waiting),
                 title: cd.label,
                 sub: (tpl ? "runs \u201c" + tpl.name + "\u201d every " : "every ") +
                      cd.everyDays + "d \u00b7 " + placeLabel(cd.place),
                 st: st.word === "due" || st.word === "overdue"
                     ? '<span class="st watch"><i></i>' + esc(st.word) + "</span>" : "",
                 k: 6, run: function () { findTab("waiting"); } });
    });
    /* Typed lines are searchable too, or the one thing in the app you wrote
       in your own words is the one thing you cannot find by typing it. */
    openTasks().forEach(function (t) {
      out.push({ g: "Written down", key: t.label + " " + (t.note || ""),
                 tile: findTile("t-note", ICONS.note),
                 title: t.label, sub: taskSays(t),
                 st: taskLate(t) ? '<span class="st late"><i></i>late</span>' : "",
                 k: 5, run: function () { findTab("waiting"); } });
    });

    findCmds().forEach(function (c) { out.push(c); });
    return out;
  }

  // Four states, and the pill classes are the same four the rows use, so a
  // hit and the row it opens read identically.
  function findTone(st) {
    return st === "over" ? "late" : st === "now" ? "hand" : st === "waiting" ? "watch" : "idle";
  }

  function findCmds() {
    var cs = [
      { name: "New project", act: "proj-add", sub: "a bounded piece of work with a date on it" },
      { name: "Add a thing", act: "asset-add", sub: "a file, a photograph, a dataset, a laptop" },
      { name: "Save something to the Library", act: "lib-add",
        sub: "a method, a script, a formula, a reference, a template",
        alias: "snippet script formula method reference template library reuse" },
      { name: "Add someone", act: "contact-add", sub: "where they work and how to reach them" },
      { name: "New procedure", act: "board-new", sub: "write one from a blank sheet", alias: "board workflow" },
      { name: "Write a procedure in words", act: "prose-open", sub: "arrows and indentation, read back as a procedure" },
      { name: "Build a report", act: "report-new", sub: "the week written out as prose" },
      { name: "Back up now", act: "bk-now", sub: "a snapshot on this device" },
      { name: "Switch bench", act: "span-switch", sub: "end the stretch you are in and start another" },
      /* A SHORTCUT NOBODY CAN FIND IS A SHORTCUT NOBODY HAS, and the finder is
         where somebody looks up a thing whose name they have forgotten. */
      { name: "Keyboard shortcuts", act: "keys-help", sub: "the ten keys, and what each one presses",
        alias: "keys hotkeys ctrl cmd accessibility" }
    ];
    if (syncOn()) cs.push({ name: "Sync now", act: "sync-now", sub: "pull, merge, push" });
    return cs.map(function (c) {
      /* `alias` for the same reason the sections carry one: somebody who
         learned "new board" should not have to learn the new word to find the
         thing it renamed. */
      return { g: "Do", key: c.name + " " + (c.alias || ""), tile: findTile("t-cmd", ICONS.cmd),
               title: c.name, sub: c.sub, k: 8,
               run: function () {
                 findClose();
                 if (APP.actions[c.act]) APP.actions[c.act]();
               } };
    });
  }

  function findTab(v) {
    if (APP.onTabChange) APP.onTabChange(v);
    view = v;
    render();
    window.scrollTo({ top: 0, behavior: "auto" });
  }
  function findBoard(id, nodeId) {
    if (APP.onTabChange) APP.onTabChange("boards");
    view = "boards"; openId = id; sel = nodeId || "";
    render();
    window.scrollTo({ top: 0, behavior: "auto" });
  }

  /* With nothing typed the box is not empty: it opens on the three things the
     app exists to stop you forgetting — who is late, which runs are unfinished,
     and where you were. A blank palette makes you think of a search term
     before it will tell you anything. */
  function findDefault() {
    var out = [];
    /* The one thing the empty box did not say is that it can be ASKED
       something. A capability nobody can discover is a capability nobody
       has — the same reason the sheet's keys are written under it rather
       than hidden in a tooltip. */
    out.push({ g: "Ask it something", tile: findTile("t-cmd", ICONS.cmd),
               title: "what is late", sub: "or: hours this week \u00b7 where is the headphones \u00b7 what is outstanding with \u2026",
               run: function () {
                 var input = document.getElementById("findQ");
                 if (input) { input.value = "what is late"; findQ = input.value; findAt = 0; findPaint(); input.focus(); }
               } });
    dues().filter(function (d) { return d.st === "over"; }).slice(0, 4).forEach(function (d) {
      out.push({ g: "Late", tile: findTile("t-step", actIcon(d.node.act)),
                 title: d.node.label, sub: d.board.name + " · " + vocabLabel("acts", d.node.act),
                 st: '<span class="st late"><i></i>' + d.over + "d over</span>",
                 run: function () { findBoard(d.board.id, d.node.id); } });
    });
    boards("run").filter(function (b) { return !b.closedOn; }).slice(0, 5).forEach(function (b) {
      out.push({ g: "Open runs", tile: findTile("t-run", ICONS.run),
                 title: b.name, sub: b.benchId ? benchLabel(b.benchId) : "no bench",
                 run: function () { findBoard(b.id, ""); } });
    });
    APP.tabs.forEach(function (t) {
      out.push({ g: "Sections", tile: findTile("t-go", t.ico), title: t.label, sub: "section",
                 run: function () { findTab(t.id); } });
    });
    /* AND SETTINGS, WHICH IS ON NO TAB. It gave up its slot for the seventh
       one and moved to the gear — and the gear rides in `.railme`, which is
       hidden under 760px. So on a phone this row is the ONLY route to the
       theme, your name, sync and "Get the newest", and it has to be in the
       list the box opens on: a row findable only by somebody who already
       thinks to type "settings" is not a route for a screen whose own name
       is the thing you have forgotten. */
    out.push({ g: "Sections", tile: findTile("t-go", ICONS.settings), title: "Settings",
               sub: "section · the theme, your name, sync and this build",
               run: function () { findTab("settings"); } });
    return out;
  }

  function findPaint() {
    var el = document.getElementById("findList");
    if (!el) return;
    var q = findQ.trim().toLowerCase();

    var asked = { rows: [], unread: false };
    if (!q) findRows = findDefault();
    else {
      /* AN ANSWER BEATS A LIST OF NAME MATCHES, so it goes first. The name
         search still runs underneath: "balamand" is both a question shape's
         object and a name, and dropping the names would make the box worse at
         the thing it was already good at. */
      asked = askRecord(q);
      findRows = asked.rows.concat(findAll().map(function (r) {
        return { r: r, s: findScore(r.key, q) };
      }).filter(function (x) { return x.s > 0; }).sort(function (a, b) {
        if (a.s !== b.s) return b.s - a.s;
        if (a.r.k !== b.r.k) return a.r.k - b.r.k;
        return a.r.title.length - b.r.title.length;
      }).slice(0, 40).map(function (x) { return x.r; }));
    }

    if (findAt >= findRows.length) findAt = 0;

    if (!findRows.length) {
      /* A QUESTION THAT MATCHED NOTHING SAYS SO, and says what it can be
         asked. Falling through to "nothing matches that by name" reads as
         the app ignoring the question, and the list of shapes is the table
         itself, so it cannot go stale. */
      el.innerHTML = asked.unread
        ? '<p class="find-none"><b>I did not read that as a question I know.</b> ' +
          "There is no language model in here \u2014 every answer is counted off the record, " +
          "so it only understands these shapes:</p><ul class=\"find-shapes\">" +
          ASK_SHAPES.map(function (x) { return "<li>" + esc(x.hint) + "</li>"; }).join("") +
          "</ul><p class=\"find-none\">Anything else is searched for by name.</p>"
        : '<p class="find-none">Nothing in the book matches that. ' +
          "It searches boards, steps, people, things, jobs, benches and upkeep by name, " +
          "and it can be asked a question \u2014 try <b>what is late</b>.</p>";
      return;
    }
    var last = "";
    el.innerHTML = findRows.map(function (r, i) {
      var h = "";
      if (r.g && r.g !== last) { h += '<div class="find-head">' + esc(r.g) + "</div>"; last = r.g; }
      return h + '<button class="find-hit' + (i === findAt ? " on" : "") +
        '" data-fi="' + i + '" role="option" aria-selected="' + (i === findAt) + '">' +
        r.tile + '<span class="txt"><b>' + esc(r.title) + "</b>" +
        (r.sub ? "<small>" + esc(r.sub) + "</small>" : "") + "</span>" +
        (r.st || "") + "</button>";
    }).join("");

    var on = el.querySelector(".find-hit.on");
    if (on && on.scrollIntoView) on.scrollIntoView({ block: "nearest" });
  }

  function findOpen() {
    var box = document.getElementById("find");
    if (!box) return;
    findQ = ""; findAt = 0;
    box.hidden = false;
    var input = document.getElementById("findQ");
    if (input) { input.value = ""; input.focus(); }
    findPaint();
  }
  function findClose() {
    var box = document.getElementById("find");
    if (box) box.hidden = true;
    findRows = []; findQ = "";
  }
  function findIsOpen() {
    var box = document.getElementById("find");
    return !!(box && !box.hidden);
  }
  function findTake() {
    var r = findRows[findAt];
    if (!r) return;
    // A command closes the box itself, because it opens a dialog on top of it
    // and the box would otherwise sit behind the scrim.
    findClose();
    r.run();
  }

  function mountFind() {
    var box = document.getElementById("find"), input = document.getElementById("findQ");
    if (!box || !input || box._wired) return;
    box._wired = true;

    input.addEventListener("input", function () { findQ = input.value; findAt = 0; findPaint(); });
    input.addEventListener("keydown", function (e) {
      if (e.key === "ArrowDown") { e.preventDefault(); findAt = Math.min(findAt + 1, findRows.length - 1); findPaint(); }
      else if (e.key === "ArrowUp") { e.preventDefault(); findAt = Math.max(findAt - 1, 0); findPaint(); }
      else if (e.key === "Enter") { e.preventDefault(); findTake(); }
      else if (e.key === "Escape") { e.preventDefault(); findClose(); }
    });
    // A click anywhere off the box closes it, the way the scrim does.
    box.addEventListener("mousedown", function (e) {
      if (!e.target.closest(".find-box")) findClose();
    });
    box.addEventListener("click", function (e) {
      var hit = e.target.closest("[data-fi]");
      if (!hit) return;
      findAt = +hit.getAttribute("data-fi");
      findTake();
    });

    /* Ctrl+K anywhere, and a bare "/" when you are not typing into something.
       Guarded on the modal being closed: a dialog has its own Escape and its
       own focus trap, and opening the finder over one would leave two things
       claiming the keyboard. */
    document.addEventListener("keydown", function (e) {
      var typing = /^(INPUT|TEXTAREA|SELECT)$/.test((e.target && e.target.tagName) || "");
      if ((e.key === "k" || e.key === "K") && (e.metaKey || e.ctrlKey)) {
        e.preventDefault();
        if (overlay && overlay.firstChild) return;
        findIsOpen() ? findClose() : findOpen();
        return;
      }
      if (e.key === "/" && !typing && !findIsOpen() && !(overlay && overlay.firstChild)) {
        e.preventDefault(); findOpen();
      }
      /* THE OTHER SIX THE BRIEF NAMES. Ctrl+S is the only one that fires WITH
         a dialog open — it is the dialog's own confirm — so the rest are
         guarded on the overlay and the finder being shut, the same way Ctrl+K
         is: two things claiming the keyboard at once is how a modal stops
         being modal. */
      if ((e.metaKey || e.ctrlKey) && (e.key === "s" || e.key === "S")) {
        e.preventDefault(); keySave(); return;
      }
      if (findIsOpen() || (overlay && overlay.firstChild)) return;
      if ((e.metaKey || e.ctrlKey) && (e.key === "n" || e.key === "N")) {
        e.preventDefault(); keyNew(); return;
      }
      if ((e.metaKey || e.ctrlKey) && (e.key === "z" || e.key === "Z")) {
        e.preventDefault();
        if (e.shiftKey) keyRedo(); else keyUndo();
        return;
      }
      /* Escape out of the full screen from anywhere on it. The sheet has its
         own Escape, but it only fires while the sheet itself has focus — and
         pressing Fill, or any button on the bar, moves focus off it, so the
         one key everybody reaches for did nothing. Guarded the same way as
         Ctrl+K: a dialog and the finder own Escape while they are up. */
      if (e.key === "Escape" && cvMax && !findIsOpen() && !(overlay && overlay.firstChild)) {
        if (sheetEscape(openBoard())) e.preventDefault();
      }
    });
  }

  /* ================= the keyboard =================

     THE BRIEF NAMES TEN SHORTCUTS AND FOUR OF THEM ALREADY WORKED — Ctrl+K,
     Escape, `/` and Enter came with the finder and the sheet. The other six
     are here, and every one of them is a keyboard route to a control that is
     already on the screen rather than a second way to change the record.
     That is the whole discipline: `APP.actions` stays the only place a figure
     moves, so a shortcut cannot do something a reader could not have done
     with a tap, and it cannot drift from the button it fires.

     `SHORTCUTS` is one table, read by the dialog that prints it and by
     nothing else — the same rule the finder's ask table lives by. **A
     shortcut nobody can find is a shortcut nobody has**, which is already
     written under the sheet in `.cvkeys`; this is that rule for the app. */
  var SHORTCUTS = [
    { k: ["Ctrl", "K"], what: "Open the finder. It reaches everything by name, and it can be asked a question." },
    { k: ["/"], what: "The same, when you are not typing into something." },
    { k: ["Ctrl", "N"], what: "Make a new one of whatever the screen you are on is a list of — a procedure on Workflows, a step on an open sheet, a thing in Assets." },
    { k: ["Ctrl", "S"], what: "Save the dialog that is open. Enter does it too, except inside a note, where Enter is a new line." },
    { k: ["Ctrl", "Z"], what: "Take the undo the last message is offering. This app has no undo stack: an undo belongs to the change that made it and lives as long as the message does." },
    { k: ["Esc"], what: "Close a dialog, let go of a picked step, leave the full screen — innermost first." },
    { k: ["Enter"], what: "Open the finder's picked row; on the sheet, show what can be done to the picked step." },
    { k: ["Space"], what: "On the sheet, do the main thing to the picked step — whichever the strip under the toolbar shows first." },
    /* Backspace as well, because that is the key a Mac keyboard actually
       has — and it is safe to accept here precisely because Remove confirms:
       somebody reaching for Backspace out of go-back habit gets a question,
       not a loss. */
    { k: ["Delete"], what: "On the sheet, remove the picked step — or Backspace, which is the key a Mac keyboard has. It confirms, and says what goes with it." },
    { k: ["←", "→", "↑", "↓"], what: "On the sheet: left and right walk the steps in order, down and up follow a line on and back." }
  ];
  /* A LIST, NOT A FORM. The first draft made it ten read-only text fields,
