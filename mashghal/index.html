        return (rows || []).sort(function (a, z) { return a.at < z.at ? 1 : -1; });
      })
      .catch(function () { return []; });
  }

  /* Taken on a change, but rate-limited: a snapshot per keystroke is not a
     history, it is noise that pushes the useful one out of the window. */
  function bkMaybe() {
    var now = Date.now();
    if (now - bkLast < BK_MIN_GAP) return;
    bkLast = now;
    bkSnap("automatic");
  }
  function bkSnap(why) {
    var body;
    try { body = JSON.stringify(payload()); } catch (e) { return Promise.resolve(); }
    var row = { at: stampNow(), why: why || "automatic", bytes: body.length, body: body };
    return bkTx("readwrite", function (st) { st.put(row); })
      .then(bkList)
      .then(function (rows) {
        var extra = rows.slice(BK_KEEP);
        if (!extra.length) return;
        return bkTx("readwrite", function (st) {
          extra.forEach(function (r) { st.delete(r.at); });
        });
      })
      .catch(function () {});
  }
  // Rendered after the fact because IndexedDB is asynchronous and renderView
  // is not — the card paints "Looking…" and fills itself in.
  /* Filled in after the fact, because IndexedDB is asynchronous and renderView
     is not. The full picture if this device has it, the travelling thumbnail if
     it does not — and only a picture with neither leaves the frame empty. */
  function mountPics() {
    // Both kinds: an <img> in a row, and an SVG <image> on the sheet.
    var els = document.querySelectorAll("[data-pic],[data-thumb]");
    Array.prototype.forEach.call(els, function (el) {
      var key = el.getAttribute("data-pic");
      var nid = el.getAttribute("data-thumb");
      var svg = el.tagName.toLowerCase() === "image";
      if (el.getAttribute(svg ? "href" : "src")) return;
      var fall = nid ? thumbOf(nid) : "";
      function put(src) {
        if (!src) { if (!svg) el.remove(); return; }
        if (svg) el.setAttributeNS("http://www.w3.org/1999/xlink", "href", src);
        el.setAttribute(svg ? "href" : "src", src);
      }
      if (!key) { put(fall); return; }
      picGet(key).then(function (src) { put(src || fall); });
    });
  }

  function mountBackups() {
    var list = document.getElementById("bkList");
    if (!list) return;
    bkList().then(function (rows) {
      var sub = document.getElementById("bkSub");
      if (sub) {
        sub.textContent = rows.length
          ? rows.length + (rows.length === 1 ? " snapshot, newest " : " snapshots, newest ") +
            agoWords(rows[0].at)
          : "None yet — one is taken the next time you change something";
      }
      if (!rows.length) { list.innerHTML = ""; return; }
      list.innerHTML = '<div class="stack tight">' + rows.map(function (r) {
        return '<div class="panel calm"><div class="grow">' +
          '<div class="nm sm">' + esc(whenWords(r.at)) + "</div>" +
          '<div class="says">' + esc(r.why === "automatic" ? "Taken by itself" : "Taken by hand") +
          " · " + Math.max(1, Math.round(r.bytes / 1024)) + " KB</div></div>" +
          '<div class="acts"><button class="btn quiet" data-act="bk-restore" data-id="' +
          esc(r.at) + '">Put this back</button></div></div>';
      }).join("") + "</div>";
    });
  }

  function whenWords(stamp) {
    var d = new Date(stamp);
    if (isNaN(d.getTime())) return String(stamp);
    return dayName(iso(d), "long") + " " + d.getDate() + ", " + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
  }
  function agoWords(stamp) {
    var mins = Math.round((Date.now() - new Date(stamp).getTime()) / 60000);
    if (mins < 1) return "a moment ago";
    if (mins < 60) return mins + " minutes ago";
    var hrs = Math.round(mins / 60);
    if (hrs < 24) return hrs + (hrs === 1 ? " hour ago" : " hours ago");
    var days = Math.round(hrs / 24);
    /* PAST ABOUT A MONTH, A COUNT OF DAYS STOPS BEING AN ANSWER. Outputs read
       "filed 120 days ago" for something archived in May: nobody holds four
       months as a number of days, and the date is the fact you would use.
       Under that, elapsed time is what you want ("6 days ago" places a thing
       in this week without arithmetic), so both readings are kept and the
       switch is where one stops being useful. */
    if (days <= 30) return days + (days === 1 ? " day ago" : " days ago");
    return "on " + fullDate(iso(new Date(stamp)));
  }

  function bkRestore(at) {
    return bkTx("readonly", function (st) { return st.get(at); })
      .then(function (row) {
        if (!row) throw new Error("That snapshot is gone.");
        var parsed = JSON.parse(row.body);
        // Through APP.hydrate, which is this app's single adoption point —
        // hand-copying a key list here is exactly how Coffer lost grants once.
        var keepSync = syncCfg();
        state = APP.hydrate(parsed, APP.blank());
        state.settings.sync = keepSync;
        snap = {};
        ensureStamps();
        save(); render();
        return row;
      });
  }

  /* ================= jobs =================

     A job is the bag: one engagement, holding the benches you sit at for it,
     the boards you run for it, and the kit it hands you. "Claimant", "mode"
     and "bench" are the app's words for parts of a thing a person calls one
     job — so the parts stay, because the hours still have to be owed to
     somebody and the work still has a craft, but the job is what you open.

     Migration derives one job per claimant, because that is what a claimant
     already was in practice. Nothing is deleted and nothing is renamed: a
     bench and a board gain a jobId and keep everything else, so a book written
     before jobs existed opens with its work already filed. */
  var openJob = "";   // view state, never saved

  function jobs() { return live(state.jobs); }
  function jobOf(id) { return byId(state.jobs, id); }
  function jobName(id) {
    var j = jobOf(id);
    return j ? j.name : (state.forgotten[id] ? state.forgotten[id] + " (removed)" : "No job");
  }

  function ensureJobs() {
    if (!Array.isArray(state.jobs)) state.jobs = [];
    var touched = false;
    // Cheap exit for the overwhelmingly common case: already filed.
    if (state.jobs.length &&
        !live(state.benches).some(function (b) { return !b.jobId; }) &&
        !(state.projects || []).some(function (p) { return !!p.claimantId; }) &&
        !state.boards.some(function (b) { return !b.jobId && b.benchId; })) return false;
    /* One job per claimant, the first time a book meets this — and ONCE.
       The test used to be "jobs is empty", so deleting your last job put it
       back on the next render and the delete you confirmed quietly reversed
       itself. The flag records that the derivation has happened, which is a
       fact about the book rather than something to infer from its contents. */
    if (!state.jobs.length && !state.settings.jobsDerived && live(state.claimants).length) {
      state.settings.jobsDerived = true;
      live(state.claimants).forEach(function (c) {
        state.jobs.push({ id: uid(), name: c.name, colour: c.colour || "",
                          claimantId: c.id, note: "", noteAt: "",
                          software: [], links: [], archived: false });
      });
      touched = true;
    }
    var byClaimant = {};
    state.jobs.forEach(function (j) { if (j.claimantId) byClaimant[j.claimantId] = j.id; });

    // A bench belongs to the job of its claimant; a board to the job of its bench.
    live(state.benches).forEach(function (bn) {
      if (!bn.jobId && byClaimant[bn.claimantId]) { bn.jobId = byClaimant[bn.claimantId]; touched = true; }
    });
    state.boards.forEach(function (b) {
      if (b.jobId) return;
      var bn = b.benchId && byId(state.benches, b.benchId);
      if (bn && bn.jobId) { b.jobId = bn.jobId; touched = true; }
    });
    /* A project seeded with a claimant rather than a job id — which is all the
       sample can honestly name, since the jobs do not exist until this runs —
       is filed the same way, and the handle is dropped once it has been used
       so this never runs twice on the same record. */
    (state.projects || []).forEach(function (p) {
      if (!p.claimantId) return;
      if (!p.jobId && byClaimant[p.claimantId]) p.jobId = byClaimant[p.claimantId];
      delete p.claimantId;
      touched = true;
    });
    // The kit was hung off a mode. It belongs to the job you are doing, since
    // that is what actually hands it to you.
    state.jobs.forEach(function (j) {
      if (j.software && j.software.length) return;
      var modes = jobModes(j.id);
      var sw = [], lk = [];
      modes.forEach(function (m) {
        (m.software || []).forEach(function (x) { sw.push(x); });
        (m.links || []).forEach(function (x) { lk.push(x); });
      });
      if (sw.length || lk.length) { j.software = sw; j.links = lk; touched = true; }
    });
    return touched;
  }

  function jobBenches(id) {
    return live(state.benches).filter(function (bn) { return bn.jobId === id; });
  }
  function jobModes(id) {
    var seen = {}, out = [];
    jobBenches(id).forEach(function (bn) {
      var m = byId(state.modes, bn.modeId);
      if (m && !seen[m.id]) { seen[m.id] = 1; out.push(m); }
    });
    return out;
  }
  function jobBoards(id) {
    return state.boards.filter(function (b) { return b.jobId === id && !b.archived; });
  }
  function jobDues(id) {
    return dues().filter(function (d) { return d.board.jobId === id; });
  }

  /* ---------------- the whole job, on one sheet ----------------

     "From the outside there's a broad board for the whole job showing all
     boards." A job page is a list of lists — projects, then the boards under
     each, then the boards under none — and a list cannot show you the shape of
     a season the way the sheet shows the shape of a procedure. This is the
     same sheet, one level up: the job, its projects, and every board hanging
     off them.

     THREE RULES, and they are what keep it honest rather than decorative.

     It is DERIVED AND THROWAWAY. `jobSheet()` builds a fresh board object on
     every render out of `state`, with `autoLayout` placing it; nothing is
     stored, so it can never disagree with the jobs and boards it is drawn
     from, and there is no second copy of the hierarchy to keep in step. The
     cost is that you cannot arrange it — which is right, because there is
     nothing here you authored.

     It is READ-ONLY, and the canvas is told so. `b.derived` guards every
     mutating path: dragging does not persist (`save()` would write a board
     that is not in `state.boards`), a dragged connection does not open the
     connect dialog, and a picture dropped on it is refused. A sheet that
     looked editable and silently dropped every edit would be worse than no
     sheet.

     A TAP OPENS THE BOARD. On a real sheet a tap selects, because everything
     you can do to a node lives behind picking it; here there is exactly one
     thing to do with a node, so picking it would be a step to nowhere.

     The vocabulary is the sheet's own, unchanged: a board is a step (a
     rectangle — a thing you do), a project is a thing (an oval — a thing that
     holds), and the line between them is `flow`, because a board really does
     come after the project that contains it. */
  function jobSheet(j) {
    var nodes = [], edges = [], seq = 0;
    function nid(p) { return p + (++seq); }

    var ps = jobProjects(j.id);
    var free = looseBoards(j.id);

    function boardNode(b) {
      var st = b.kind === "run"
        ? (b.closedOn ? "done"
           : dues().some(function (d) { return d.board.id === b.id && d.st === "over"; }) ? "over"
           : activeNodes(b).length ? "now" : "waiting")
        : "todo";
      var p = runProgress(b);
      return {
        id: nid("b"), t: "step", act: b.kind === "run" ? "do" : "file",
        label: b.name,
        /* Stamped so `stepMeta` is never asked about a board — it would go
           looking for a chase interval and a due date that a board has
           neither of. `_says` is what the card prints under the name. */
        _says: b.kind === "run"
          ? (b.closedOn ? "closed \u00b7 " + p.done + " of " + p.total + " done"
             : p.done + " of " + p.total + " done")
          : "a procedure \u00b7 " + p.total + (p.total === 1 ? " step" : " steps"),
        _mapState: st, _open: b.id
      };
    }

    // The job itself, so the sheet has one way in and the shape reads as a
    // tree rather than as several unrelated columns.
    var root = { id: nid("j"), t: "thing", kind: "note", label: j.name,
                 _pill: "job", _mapState: "now", _root: true };
    nodes.push(root);

    ps.forEach(function (p) {
      var stt = projState(p);
      var pn = { id: nid("p"), t: "thing", kind: "note", _pill: "project",
                 label: p.name, _mapState: stt.overdue ? "over" : "waiting",
                 _openProj: p.id };
      nodes.push(pn);
      edges.push({ id: nid("e"), a: root.id, b: pn.id, k: "flow", label: "" });
      var bs = projBoards(p.id);
      if (!bs.length) {
        var none = { id: nid("n"), t: "thing", kind: "note", _pill: "empty",
                     label: "nothing running yet", _mapState: "todo" };
        nodes.push(none);
        edges.push({ id: nid("e"), a: pn.id, b: none.id, k: "flow", label: "" });
      }
      bs.forEach(function (b) {
        var bn = boardNode(b);
        nodes.push(bn);
        edges.push({ id: nid("e"), a: pn.id, b: bn.id, k: "flow", label: "" });
      });
    });

    /* Boards in no project hang off the job directly, under a node that says
       so. This is not an error state — a one-off procedure needs no project —
       and the job page already says as much in words. */
    if (free.length) {
      var on = { id: nid("o"), t: "thing", kind: "note", _pill: "no project",
                 label: "on its own", _mapState: "waiting" };
      nodes.push(on);
      edges.push({ id: nid("e"), a: root.id, b: on.id, k: "flow", label: "" });
      free.forEach(function (b) {
        var bn = boardNode(b);
        nodes.push(bn);
        edges.push({ id: nid("e"), a: on.id, b: bn.id, k: "flow", label: "" });
      });
    }

    return { id: "jobmap:" + j.id, name: j.name + " \u2014 everything in it",
             kind: "template", derived: true, benchId: "", jobId: j.id,
             nodes: nodes, edges: edges };
  }

  /* THE MAP LAYS ITSELF OUT, because `autoLayout` is built for a procedure
     and this is a tree. That function ranks STEPS into columns and parks
     THINGS above them, which is right on a board — a reference photo is
     context hanging off a step, not a stage of the work. Here the containers
     are things, so the job and "on its own" landed side by side on one row
     with a line dropping from the wrong one, and the shape read as nothing.

     A job is three deep and never more: job, project, board. So the layout is
     the obvious one — depth down, siblings across, each parent centred over
     its children — walked bottom-up so a project sits above the middle of its
     boards rather than at the left edge of them. */
  function mapLayout(b) {
    var ROWH = 150, GAP = 34;
    var kids = {}, depth = {}, root = b.nodes[0];
    if (!root) return;
    b.nodes.forEach(function (n) { kids[n.id] = []; });
    b.edges.forEach(function (e) { if (kids[e.a]) kids[e.a].push(e.b); });

    // Depth first, so every node knows its row before anything is placed.
    (function walk(id, d) {
      if (depth[id] !== undefined) return;   // a malformed map must not spin
      depth[id] = d;
      kids[id].forEach(function (k) { walk(k, d + 1); });
    })(root.id, 0);

    /* Place the leaves left to right in one pass, then give every parent the
       midpoint of its children. `cursor` is shared across the whole tree, so
       two projects can never overlap however many boards each holds. */
    var cursor = 0;
    function place(id) {
      var n = byId(b.nodes, id);
      var ks = kids[id];
      if (!n) return 0;
      n.y = depth[id] * ROWH;
      if (!ks.length) {
        n.x = cursor;
        cursor += dims(n).w + GAP;
        return n.x + dims(n).w / 2;
      }
      var mids = ks.map(place);
      var mid = (Math.min.apply(null, mids) + Math.max.apply(null, mids)) / 2;
      n.x = mid - dims(n).w / 2;
      return mid;
    }
    place(root.id);

    // Anything the walk never reached (a node with no edge to it) still needs
    // a position, or the canvas draws it at NaN and the whole sheet vanishes.
    b.nodes.forEach(function (n) {
      if (typeof n.x !== "number" || typeof n.y !== "number") {
        n.x = cursor; n.y = 0; cursor += dims(n).w + GAP;
      }
    });
  }

  /* Set while a job map is on screen, and read by `openBoard()` so the whole
     canvas — drawing, fitting, panning, zooming, Fill, the arrow keys —
     works on it with no second copy of any of that. View state, never saved. */
  var jobMap = null;

  /* ================= projects =================

     A job is who the work is for. A project is a bounded body of work with a
     date on it — the 2026 season, chapter three, the harbour report — and the
     two are different questions: a paper written between two universities is
     one project across two jobs, and a job holds many projects over years. So
     a project names its job when it has one and leaves it blank when it does
     not, the same way a board may have no bench.

     Nothing about how a project is GOING is stored. `projState()` reads it off
     the project's boards, so the two can never disagree — which is the same
     rule as the hours being derived from spans. `parked` is the single
     exception and is a statement, not a figure: work deliberately set down
     looks identical, from the outside, to work with nothing running, and no
     derivation can tell them apart. */

  var openProj = "";   // view state, never saved

  function projects() { return live(state.projects); }
  function projOf(id) { return byId(state.projects, id); }
  function projName(id) {
    var p = projOf(id);
    return p ? p.name : (state.forgotten[id] ? state.forgotten[id] + " (removed)" : "");
  }
  function projBoards(id) {
    return state.boards.filter(function (b) { return b.projectId === id && !b.archived; });
  }
  function projDues(id) {
    return dues().filter(function (d) { return d.board.projectId === id; });
  }
  function jobProjects(jobId) {
    return projects().filter(function (p) { return p.jobId === jobId; });
  }
  // The boards of a job that are not in any project. They are not an error —
  // a one-off procedure needs no project — so they keep their own heading
  // rather than being swept into a project that does not exist.
  function looseBoards(jobId) {
    return jobBoards(jobId).filter(function (b) { return !b.projectId || !projOf(b.projectId); });
  }

  function projRuns(id) {
    return projBoards(id).filter(function (b) { return b.kind === "run"; });
  }

  /* Derived, in the order the reader needs it. Late outranks everything, the
     same as on every other screen; a project past its own date with work still
     open is late too, because that is exactly the thing a date is for. */
  function projState(p) {
    var bs = projBoards(p.id);
    var runs = projRuns(p.id);
    var open = runs.filter(function (b) { return !b.closedOn; });
    var d = projDues(p.id);
    var late = d.filter(function (x) { return x.st === "over"; }).length;
    var over = p.endsOn && dayOk(p.endsOn) && daysUntil(p.endsOn) < 0;
    var unf = open.reduce(function (n, b) { return n + unfiled(b).length; }, 0);

    /* Finished means every run closed with nothing left to file. It is worth
       stating separately from "nothing running": a project with three closed
       runs is done, and a project with three procedures nobody has started is
       not — from a count of open runs alone the two look the same. */
    var done = runs.length && !open.length && !unf;
    /* Published rather than left inside the ladder, because the ladder answers
       "how is this going" and the calendar needs the narrower question "has
       this date gone by on unfinished work" — a project late for a chase is
       not a reason to paint a date three weeks out. */
    var overdue = !!(over && !done);

    function st(word, tone, why) {
      return { word: word, tone: tone, why: why, overdue: overdue, done: !!done };
    }

    if (late) return st("late", "late",
                       late + (late === 1 ? " step is" : " steps are") + " past its chase");
    /* A date that has gone by on work that is not finished is a fact about the
       project, so it outranks having been set down: parking something does not
       move its deadline, and a screen that said "set down" over an overdue
       project would be hiding the one thing worth knowing. Only a project that
       is actually done escapes this. */
    if (overdue) return st("past its date", "late",
                       "was due " + niceDate(p.endsOn) + " and is not finished");
    if (p.parked) return st("set down", "idle", "you set it down");
    if (d.length) return st("in hand", "hand",
                       d.length + (d.length === 1 ? " step" : " steps") + " waiting on you");
    if (unf) return st("to file", "watch",
                       unf + (unf === 1 ? " thing" : " things") + " still to archive");
    if (done) return st("done", "idle", "every run closed and filed");
    if (bs.length) return st("nothing running", "idle",
                       bs.length + (bs.length === 1 ? " board" : " boards") + ", none under way");
    return st("nothing yet", "idle", "no boards on it");
  }

  function projSays(p) {
    var bits = [], st = projState(p);
    if (p.jobId) bits.push(jobName(p.jobId));
    bits.push(st.why);
    /* Three cases, and the middle one is why this is not one line. The state
       already names the date when it IS the finding, so repeating it says one
       thing twice ("was due Aug 16 and is not finished · 30d past Aug 16").
       A project late for a chase AND past its date has to say both, or the
       deadline goes unmentioned on the row that most needs it. And "-30d left"
       is what a single unguarded branch printed. */
    if (p.endsOn && dayOk(p.endsOn)) {
      if (st.overdue) {
        if (st.word !== "past its date") bits.push("also past " + niceDate(p.endsOn));
      } else {
        var n = daysUntil(p.endsOn);
        bits.push(n === 0 ? "due today" : n + "d left");
      }
    }
    return bits.join(" · ");
  }

  /* What a project has actually produced: the filing steps that are done. It
     is the one list nobody can reconstruct later — the archive lock knows
     which filings are outstanding, and this is the other half of it. */
  /* One walk, ranged or not, because the project page and the written report
     both ask this question and two walks would eventually answer it
     differently. `from`/`to` are optional; omitted, it is every filing there
     has ever been. */
  function filings(boardList, from, to) {
    var out = [];
    boardList.forEach(function (b) {
      b.nodes.forEach(function (n) {
        if (n.t !== "step" || n.act !== "file" || !n.doneAt) return;
        var day = stampDay(n.doneAt);
        if (from && day < from) return;
        if (to && day > to) return;
        /* The id as well as the name: Outputs offers a way into the board a
           filing came off, and looking that up BY NAME would open the wrong
           one the first time two boards were called the same thing — which
           is exactly what a run and the procedure it came from often are. */
        out.push({ label: n.label, board: b.name, boardId: b.id, at: n.doneAt, path: n.path || "" });
      });
    });
    return out.sort(function (a, b) { return a.at < b.at ? 1 : -1; });
  }
  function projOutputs(id) { return filings(projBoards(id)); }

  /* `projPeople()` was here and is gone: it assembled the project's people
     from the board nodes itself, which is a second answer to a question
     `people()` already answers — and the two would have disagreed the first
     time somebody renamed a contact, since only `people()` folds on the
     contact id. The project's People page is `people()` filtered to boards
     with this project's id; see `projPeoplePage`. */

  function projOpts(jobId) {
    var ps = projects();
    // A project on this job first, because that is nearly always the answer;
    // the rest stay reachable, since a project can span two jobs.
    var mine = ps.filter(function (p) { return p.jobId === jobId; });
    var rest = ps.filter(function (p) { return p.jobId !== jobId; });
    return [{ value: "", label: "No project — a one-off" }].concat(
      mine.map(function (p) { return { value: p.id, label: p.name }; }),
      rest.map(function (p) {
        return { value: p.id, label: p.name + (p.jobId ? " — " + jobName(p.jobId) : "") };
      }));
  }

  function projRow(p) {
    var st = projState(p);
    var d = projDues(p.id), late = d.filter(function (x) { return x.st === "over"; }).length;
    return '<button type="button" class="panel rowbtn' + (st.tone === "late" ? " late" : "") +
      '" data-act="proj-open" data-id="' + p.id + '">' +
      '<span class="itile t-proj">' + ICONS.proj + "</span>" +
      '<div class="grow"><div class="nm">' + esc(p.name) + "</div>" +
      '<div class="says">' + esc(projSays(p)) + "</div></div>" +
      '<span class="st ' + st.tone + '"><i></i>' + esc(st.word) + "</span>" +
      (late ? '<div class="bigage"><b>' + late + "</b><span>late</span></div>" : "") + "</button>";
  }

  /* THE PROJECT'S FIVE QUESTIONS, NOT EIGHT LISTS. The mockup's project
     workspace carries a strip of eight — Overview · Tasks · Data · Maps ·
     Workflows · Documents · Links · People — and eight on one strip is the
     mistake this repo has already made and written down twice: Horizon's
     eight sub-tabs put the last three off the edge of a phone and nobody
     opened them, and the workbench stood 3,300 pixels tall before it became
     four pages. So the eight are folded into five, and every fold has a
     reason rather than being a shortening.

     Data · Maps · Documents · Links are one page. They are four KINDS of the
     same thing, and the registry already says which section an entry is in
     (`repoOf`, stated rather than derived) — so splitting them per project
     would be four lists of one item each, and a reader who typed a name would
     have to guess which of four to look in. Grouped under the registry's own
     headings, it is one list that still answers "what is the work made of".

     Workflows is called Work, because on this project it is the boards —
     running, their procedures, and what has closed.

     And NOTHING ON THIS STRIP IS A NEW LIST TO MAINTAIN. A project's things
     are derived from the boards in it and its people are `people()` narrowed
     to those boards, so a thing cannot be on the project page and missing
     from the Repo, and a person cannot read "two things are late" on one
     screen and "clear" on the other. */
  var PROJ_PAGES = [
    { id: "over",   label: "Overview" },
    { id: "work",   label: "Work" },
    { id: "tasks",  label: "Tasks" },
    { id: "things", label: "Things" },
    { id: "people", label: "People" }
  ];
  var projTab = "over";   // view state, never saved — a project opens on its overview

  /* What the project is made of, derived from its boards and never stored.
     A board node carrying `fromAssetId` IS the registry entry — the same
     "one name, one entry" rule the borrow pool and the finder live by — so
     the registry entry is what gets listed, which is how it arrives with its
     section, its state, its upkeep and something to open. A thing typed
     straight onto a board has no registry entry and is listed as itself,
     under its own heading, because offering to open it would be a button
     that cannot do what it says. */
  function projThings(id) {
    var byAsset = {}, loose = {}, out = [];
    /* The name is the fallback match, because a board copy written before
       `fromAssetId` existed carries nothing pointing back — and without this
       the project page filed the headphones under "Only on a board" while
       the Repo had them on Devices with a state and a place. Third time this
       exact fold has been needed (the borrow pool, the finder, and now here),
       and it is the same rule every time: one name, one entry. */
    var regByName = {};
    live(state.assets).forEach(function (a) { regByName[String(a.name).toLowerCase()] = a; });
    projBoards(id).forEach(function (b) {
      (b.nodes || []).forEach(function (n) {
        if (n.t !== "thing" || n.kind === "person" || !n.label) return;
        var a = n.fromAssetId ? byId(state.assets, n.fromAssetId) : null;
        if (!a || a.archived) a = regByName[String(n.label).toLowerCase()] || null;
        if (a && !a.archived) {
          if (byAsset[a.id]) { byAsset[a.id].on.push(b.name); return; }
          byAsset[a.id] = { asset: a, on: [b.name] };
          out.push(byAsset[a.id]);
          return;
        }
        var k = String(n.label).toLowerCase();
        if (loose[k]) { loose[k].on.push(b.name); return; }
        loose[k] = { node: n, on: [b.name] };
        out.push(loose[k]);
      });
    });
    return out;
  }

  function renderProj(p) {
    var st = projState(p);
    var bs = projBoards(p.id);
    var runs = bs.filter(function (b) { return b.kind === "run" && !b.closedOn; });
    var shut = bs.filter(function (b) { return b.kind === "run" && b.closedOn; });
    var tpls = bs.filter(function (b) { return b.kind === "template"; });
    var d = projDues(p.id);
    var late = d.filter(function (x) { return x.st === "over"; }).length;
    var pt = tasksFor("proj", p.id);
    var things = projThings(p.id);
    var pep = people().filter(function (x) {
      return x.boards.some(function (b) { return b.projectId === p.id; });
    });

    var tools = '<div class="tools">' +
      '<button class="btn" data-act="proj-back">' + (p.jobId ? esc(jobName(p.jobId)) : "All projects") + "</button>" +
      '<button class="btn" data-act="proj-edit" data-id="' + p.id + '">Edit</button>' +
      '<button class="btn" data-act="proj-park" data-id="' + p.id + '">' +
      (p.parked ? "Pick it back up" : "Set it down") + "</button>" +
      '<button class="btn danger" data-act="proj-del" data-id="' + p.id + '">Delete</button></div>';

    var h = '<div class="page-head"><div><h2>' + esc(p.name) + "</h2>" +
      "<p>" + esc(projSays(p)) + "</p>" +
      '<div class="stand"><span class="st ' + st.tone + '"><i></i>' + esc(st.word) + "</span>" +
      (late ? '<span class="sp"><i class="d-late"></i>' + cap(numWord(late)) + " late</span>" : "") +
      (d.length - late ? '<span class="sp"><i class="d-hand"></i>' + cap(numWord(d.length - late)) + " in hand</span>" : "") +
      (!d.length ? '<span class="sp muted">Nothing waiting</span>' : "") +
      "</div></div>" + tools + "</div>";

    // A count each, so an empty page is visible without being opened — the
    // same rule as the Repo's strip.
    var counts = { over: 0, work: bs.length, tasks: pt.length,
                   things: things.length, people: pep.length };
    var page = PROJ_PAGES.filter(function (x) { return x.id === projTab; })[0] || PROJ_PAGES[0];
    h += '<div class="subnav">' + PROJ_PAGES.map(function (x) {
      return '<button class="btn' + (x.id === page.id ? " primary" : "") +
        '" data-act="proj-page" data-id="' + x.id + '">' + x.label +
        (counts[x.id] ? ' <span class="cnt">' + counts[x.id] + "</span>" : "") + "</button>";
    }).join("") + "</div>";

    if (page.id === "over")   return h + projOver(p, runs, tpls);
    if (page.id === "work")   return h + projWork(p, runs, tpls, shut);
    if (page.id === "tasks")  return h + projTasksPage(p, pt);
    if (page.id === "things") return h + projThingsPage(p, things);
    return h + projPeoplePage(p, pep);
  }

  /* WHERE IT STANDS, AND WHAT HAS LEFT THE BUILDING — the two ends of the
     project, which is the shape the written report already has (it opens with
     PROJECTS and closes with WHAT WAS FILED). The percentage and the bar's
     width are the same figure out of `projPace`, so the two cannot
     disagree. */
  /* THE PROJECT'S OVERVIEW IS THE POSTER'S PROJECT WORKSPACE: where the work
     stands on the left, and on the right the two things the panel puts beside
     it — what to do next, and what the project is made of. Both are leads
     rather than copies of the pages behind them: a card that grows into a
     whole page is how Coffer's Today tab became the screen everybody scrolled
     past, and both carry the route to the full list.

     NEXT ACTIONS IS DERIVED AND TYPED, SIDE BY SIDE, AND SAYS WHICH IS WHICH.
     A live step of a run is born from the record; a task is the one thing
     somebody types. Folding the two into one undifferentiated list is exactly
     what `dues()` refuses to do, and for the same reason — so they sit in
     one card in two groups, each row ticking through the action that screen
     already uses (`step-done`, `task-done`), so nothing here can mark
     something done in a way the rest of the app would not. */
  function projOver(p, runs, tpls) {
    var pace = projPace(p);
    /* Read here rather than taken from `renderProj`'s local: `barTone(st)`
       referenced a name this function never had, which the `new Function`
       parse check cannot see (a free variable is legal JavaScript) and which
       threw at render time — the project page simply refused to open. The
       suite caught it; the parser never would. */
    var st = projState(p);
    var left = "", right = "";
    if (p.note) {
      left += '<div class="panel calm"><div class="grow"><div class="nm sm">' + esc(p.note) + "</div></div></div>";
    }

    left += '<div class="sect">How far along</div>';
    left += '<div class="panel calm"><div class="grow">' +
      '<div class="nm sm">' + pace.done + " of " + pace.total +
      (pace.total === 1 ? " step done" : " steps done") +
      (pace.runs ? "" : " — nothing has been started") + "</div>" +
      '<div class="bar ' + barTone(st) + '"><i style="width:' + pace.pct + '%"></i></div>' +
      '<div class="says">' + pace.pct + "% \u00b7 " +
      (pace.runs ? pace.runs + (pace.runs === 1 ? " run" : " runs") : "no runs") +
      (tpls.length ? " \u00b7 " + tpls.length + (tpls.length === 1 ? " procedure" : " procedures") : "") +
      "</div></div></div>";

    if (p.endsOn && dayOk(p.endsOn)) {
      var gone = p.endsOn < today();
      left += '<div class="panel calm' + (gone ? " late" : "") + '"><div class="grow">' +
        '<div class="nm sm">' + esc((gone ? "Was due " : "Due ") + niceDate(p.endsOn)) + "</div>" +
        /* The full date with its year underneath, not `plainDate` — that
           returns the same "Oct 5" the line above already says, so the card
           printed one date twice and the second line was noise. A deadline is
           exactly the figure worth spelling out unambiguously. */
        '<div class="says">' + esc(wordDate(p.endsOn)) + "</div></div>" +
        (gone ? '<span class="st late"><i></i>past its date</span>' : "") + "</div>";
    }

    var outs = projOutputs(p.id);
    left += '<div class="sect">What it has produced</div>';
    left += outs.length ? '<div class="stack tight">' + outs.map(function (o) {
      return '<div class="panel calm"><span class="itile sm t-out">' + ICONS.file + "</span>" +
        '<div class="grow"><div class="nm sm">' + esc(o.label) + "</div>" +
        '<div class="says">' + esc(o.board + " \u00b7 filed " + agoWords(o.at) + (o.path ? " \u00b7 " + o.path : "")) +
        "</div></div></div>";
    }).join("") + "</div>"
      : '<p class="empty">Nothing filed yet. A filing step that is done is what lands here — the same steps the archive lock watches.</p>';

    /* NEXT ACTIONS. The derived half first, worst first, because a chase
       outranks anything typed — the order Waiting itself uses. */
    var pb = {};
    projBoards(p.id).forEach(function (b) { pb[b.id] = 1; });
    var pd = dues().filter(function (d) { return pb[d.board.id]; }).slice(0, 4);
    var pt = openTasks().filter(function (t) { return t.projId === p.id; }).slice(0, 4);
    var body = "";
    if (pd.length) {
      body += '<div class="nhead">From the boards</div>' + pd.map(function (d) {
        return '<div class="nrow' + (d.st === "over" ? " late" : "") + '">' +
          '<button type="button" class="ntick" data-act="step-done" data-id="' + d.board.id + ":" + d.node.id +
          '" title="Mark it done" aria-label="Mark done: ' + esc(d.node.label) + '"></button>' +
          '<button type="button" class="nopen" data-act="board-open" data-id="' + d.board.id +
          '" title="' + esc(d.node.label + " — " + d.board.name) + '">' +
          '<span class="nm">' + esc(d.node.label) + "</span>" +
          /* The step's own words come from `stepMeta`, the same function the
             board and Waiting print — a due carries no sentence of its own,
             and writing one here is how two screens come to disagree about
             one step. */
          '<span class="says">' + esc(d.board.name + " \u00b7 " + stepMeta(d.board, d.node)) + "</span></button></div>";
      }).join("");
    }
    if (pt.length) {
      body += '<div class="nhead">Written down</div>' + pt.map(function (t) {
        return '<div class="nrow' + (taskLate(t) ? " late" : "") + '">' +
          '<button type="button" class="ntick" data-act="task-done" data-id="' + t.id +
          '" title="Mark it done" aria-label="Mark done: ' + esc(t.label) + '"></button>' +
          '<button type="button" class="nopen" data-act="task-edit" data-id="' + t.id +
          '" title="' + esc(t.label) + '">' +
          '<span class="nm">' + esc(t.label) + "</span>" +
          '<span class="says">' + esc(taskSays(t)) + "</span></button></div>";
      }).join("");
    }
    if (!body) {
      body = '<p class="dempty">Nothing is waiting on this project. Start a run of one of its procedures, or write something down.</p>';
    }
    right += dcard("Next actions", { label: "Tasks", act: "proj-page", id: "tasks" }, body);

    /* WHAT IT IS MADE OF, under the registry's own headings. Derived from the
       boards (`projThings`), so it cannot disagree with the Things page or
       with the Repo, and capped: this is a lead, and the page behind it is
       one tap away on the strip. */
    var things = projThings(p.id).filter(function (t) { return t.asset; });
    var groups = {};
    things.forEach(function (t) { (groups[repoOf(t.asset)] = groups[repoOf(t.asset)] || []).push(t); });
    var made = "";
    REPO_PAGES.forEach(function (sec) {
      var g = groups[sec.id];
      if (!g || !g.length) return;
      made += '<div class="nhead">' + esc(sec.label) + "</div>" + g.slice(0, 3).map(function (t) {
        var lk = assetLook(t.asset);
        return '<button type="button" class="drow" data-act="asset-open" data-id="' + t.asset.id +
          '" title="' + esc(t.asset.name) + '">' +
          '<span class="itile sm ' + lk.tile + '">' + lk.ico + "</span>" +
          '<span class="grow"><span class="nm">' + esc(t.asset.name) + "</span></span></button>";
      }).join("");
    });
    if (made) {
      right += dcard("What it is made of", { label: "Things", act: "proj-page", id: "things" }, made);
    }

    return '<div class="agrid"><div class="acol">' + left + "</div>" +
      '<div class="acol">' + right + "</div></div>";
  }

  function projWork(p, runs, tpls, shut) {
    var h = '<div class="tools" style="margin:0.9rem 0 0.2rem">' +
      '<button class="btn primary" data-act="board-new" data-id="' + p.id + '">New procedure</button></div>';

    h += '<div class="sect">Running</div>';
    h += runs.length ? '<div class="stack tight">' + runs.map(function (b) {
      var bd = dues().filter(function (x) { return x.board.id === b.id; });
      var bl = bd.filter(function (x) { return x.st === "over"; }).length;
      var pr = runProgress(b);
      return '<button type="button" class="panel rowbtn calm' + (bl ? " late" : "") +
        '" data-act="board-open" data-id="' + b.id + '">' +
        '<div class="grow"><div class="nm sm">' + esc(b.name) + "</div>" +
        '<div class="says">' + (bl ? bl + " late \u00b7 " : "") + bd.length + " waiting \u00b7 " +
        pr.done + " of " + pr.total + " done</div></div></button>";
    }).join("") + "</div>" : '<p class="empty">Nothing running. Start a run from one of its procedures.</p>';

    h += '<div class="sect">Procedures</div>';
    h += tpls.length ? '<div class="stack tight">' + tpls.map(function (b) {
      var ns = b.nodes.filter(function (n) { return n.t === "step"; }).length;
      return '<button type="button" class="panel rowbtn calm" data-act="board-open" data-id="' + b.id + '">' +
        '<div class="grow"><div class="nm sm">' + esc(b.name) + "</div>" +
        '<div class="says">' + ns + (ns === 1 ? " step" : " steps") + "</div></div></button>";
    }).join("") + "</div>"
      : '<p class="empty">No procedure of its own yet. Write one and every run of it starts from the same shape.</p>';

    if (shut.length) {
      h += '<div class="sect">Closed</div><div class="stack tight">' + shut.map(function (b) {
        return '<button type="button" class="panel rowbtn calm" data-act="board-open" data-id="' + b.id + '">' +
          '<div class="grow"><div class="nm sm">' + esc(b.name) + "</div>" +
          '<div class="says">' + esc("closed " + agoWords(b.closedOn)) + "</div></div></button>";
      }).join("") + "</div>";
    }
    return h;
  }

  /* A task is the one thing somebody types, so this page says so — the rest
     of the project is derived and a screen mixing the two without saying
     which is which is how a figure comes to disagree with its parts. */
  function projTasksPage(p, pt) {
    var h = '<div class="tools" style="margin:0.9rem 0 0.2rem">' +
      '<button class="btn primary" data-act="task-add-proj" data-id="' + p.id + '">Something to do</button></div>';
    h += pt.length ? '<div class="stack tight">' + pt.map(taskRow).join("") + "</div>"
      : '<p class="empty">Nothing written down for it. Everything else on this project is derived from its boards \u2014 this is the one list you type.</p>';
    return h;
  }

  /* Grouped under the registry's own headings, because which section an entry
     is in is stated and not guessed — so the grouping is free and the words
     are the same ones the Repo uses. The row is `repoRow`, verbatim: a thing
     has to read the same here as it does there, state and open control
     included, or one of the two screens is wrong. */
  function projThingsPage(p, things) {
    if (!things.length) {
      return '<p class="empty">Nothing on its boards yet. A thing lands here by being on a board of this project \u2014 there is no list to keep, which is why it can never be out of date.</p>';
    }
    var h = '<p class="saynote">Derived from the boards in this project. Bring one in on a board and it appears here; there is nothing to maintain.</p>';
    var groups = {};
    things.forEach(function (t) {
      var key = t.asset ? repoOf(t.asset) : "loose";
      (groups[key] = groups[key] || []).push(t);
    });
    REPO_PAGES.forEach(function (sec) {
      var g = groups[sec.id];
      if (!g || !g.length) return;
      h += '<div class="sect">' + esc(sec.label) + "</div><div class=\"stack tight\">" +
        g.map(function (t) { return repoRow(t.asset); }).join("") + "</div>";
    });
    if (groups.loose) {
      h += '<div class="sect">Only on a board</div>' +
        '<p class="hint" style="margin:0 0 0.6rem">Typed straight onto a board and not in the registry, so there is nothing to open and no upkeep on it. Add it under Assets if it is a thing you keep coming back to.</p>' +
        '<div class="stack tight">' + groups.loose.map(function (t) {
          return '<div class="panel calm"><span class="itile sm t-thing">' +
            (ICONS[t.node.kind] || ICONS.thing) + "</span>" +
            '<div class="grow"><div class="nm sm">' + esc(t.node.label) + "</div>" +
            '<div class="says">' + esc(String(vocabLabel("things", t.node.kind) || t.node.kind).toLowerCase() +
              " \u00b7 on " + t.on.slice(0, 2).join(", ") +
              (t.on.length > 2 ? " and " + (t.on.length - 2) + " more" : "")) + "</div></div></div>";
        }).join("") + "</div>";
    }
    return h;
  }

  /* `people()` narrowed to this project's boards, and drawn with `personRow`
     — so what is outstanding with somebody reads identically here and on
     their own page. Assembling the list again from the board nodes would
     eventually answer the same question two ways. */
  function projPeoplePage(p, pep) {
    if (!pep.length) {
      return '<p class="empty">Nobody named on its boards yet. Link a person to a send or a wait and they appear here, with whatever is outstanding.</p>';
    }
    return '<p class="saynote">Everyone named on a board of this project, worst first \u2014 the same reading as their own page.</p>' +
      '<div class="stack tight">' + pep.map(personRow).join("") + "</div>";
  }

  function projDialog(p) {
    var mk = !p;
    openModal({
      title: mk ? "New project" : "Edit project",
      confirmLabel: mk ? "Create" : "Save",
      message: mk ? "A project is a bounded piece of work with a date on it — a season, a chapter, a report. Its job is who it is for, and it can be left blank: a thesis belongs to no employer."
                  : "",
      fields: [
        { key: "name", label: "Name", type: "text", span: true,
          value: p ? p.name : "", placeholder: "Harbour report 2026" },
        { key: "jobId", label: "For which job", type: "select",
          options: [{ value: "", label: "No job — it is mine" }].concat(opts(state.jobs)),
          value: p ? p.jobId : (openJob || "") },
        { key: "endsOn", label: "Due by (optional)", type: "text",
          value: p ? (p.endsOn || "") : "", placeholder: "YYYY-MM-DD" },
        { key: "note", label: "What it is", type: "textarea", span: true, rows: 2,
          value: p ? (p.note || "") : "" }
      ],
      validate: function (v) {
        if (!v.name.trim()) return "Give it a name.";
        // A date that exists, not a string shaped like one — the same test
        // every other date in the app goes through.
        if (v.endsOn.trim() && !dayOk(v.endsOn.trim()))
          return "A due date has to be a real day, written YYYY-MM-DD.";
        return null;
      },
      onConfirm: function (v) {
        go(function () {
          var t = p;
          if (!t) { t = { id: uid(), parked: false, archived: false }; state.projects.push(t); }
          t.name = v.name.trim(); t.jobId = v.jobId;
          t.endsOn = v.endsOn.trim(); t.note = v.note.trim();
          if (mk) { openProj = t.id; projTab = "over"; }
        });
        toast(mk ? "Project created" : "Saved");
      }
    });
  }


  /* ================= which build is this =================

     There was no way to tell, from inside the app, which version you were
     looking at — so "it still shows the old stuff" and "it is deployed" could
     both be true and neither of us could prove anything. The stamp is printed
     in Settings and it is the first thing to read when something looks stale.

     Bumped with the service worker, every ship. */
  var BUILD = "v70 · 19 Sep 2026";

  var THEME_KEY = "mashghal.theme";
  var THEME_WORD = { auto: "Follow the system", light: "Paper", dark: "Evening ink" };

  function themeChoice() {
    try {
      var t = localStorage.getItem(THEME_KEY);
      return (t === "light" || t === "dark") ? t : "auto";
    } catch (e) { return "auto"; }
  }
  function setTheme(k) {
    try {
      if (k === "auto") localStorage.removeItem(THEME_KEY);
      else localStorage.setItem(THEME_KEY, k);
    } catch (e) {}
    var el = document.documentElement;
    if (k === "auto") el.removeAttribute("data-theme");
    else el.setAttribute("data-theme", k);
    inkFlush();
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) {
      // Read it back rather than writing a literal, or the two drift apart.
      m.setAttribute("content", ink("page") || "#1b1e24");
    }
    render();
  }

  /* The rail carries the work, not just the five tabs. The design puts your
     live boards under the nav, grouped by who they are for, each with a dot for
     how it is going and a count of what it is sitting on — so the thing you
     open twenty times a day is one click from anywhere, and you can see
     something is late without opening the page that says so.

     Rendered here rather than in renderNav(), which belongs to the shared
     runtime and has to stay byte-identical across the four apps. */
  function railWork() {
    var el = document.getElementById("railWork");
    if (!el) return;

    var live = boards("run").filter(function (b) { return !b.closedOn; });
    var tpls = boards("template");
    var groups = {}, order = [];
    live.forEach(function (b) {
      /* The project is the heading when there is one: it is what the person
         calls the thing they are working on, and the employer is a fact about
         it rather than its name. The job is the fallback, then the bench. */
      var key = b.projectId && projOf(b.projectId) ? projName(b.projectId)
              : b.jobId ? jobName(b.jobId)
              : b.benchId ? benchLabel(b.benchId) : "No job";
      if (!groups[key]) { groups[key] = []; order.push(key); }
      groups[key].push(b);
    });

    var h = "";
    order.forEach(function (key) {
      h += '<div class="rwgroup"><div class="rwhead">' + esc(key) + "</div>";
      h += groups[key].map(function (b) {
        var d = dues().filter(function (x) { return x.board.id === b.id; });
        var lateN = d.filter(function (x) { return x.st === "over"; }).length;
        var unf = unfiled(b).length;
        var tone = lateN ? "late" : d.length ? "live" : "idle";
        var right = lateN ? lateN : unf && !d.length ? "not filed" : d.length ? d.length : "";
        return '<button class="rwrow' + (openId === b.id ? " on" : "") +
          '" data-act="board-open" data-id="' + b.id + '">' +
          '<span class="rwdot ' + tone + '"></span>' +
          '<span class="rwname">' + esc(b.name) + "</span>" +
          /* Three rungs, not two: late is rose, unfiled is amber, and a live
             count is neutral. They all shared the late colour, so a finished
             run waiting to be archived looked as urgent as a person who has
             not replied in three weeks. */
          (right ? '<span class="rwn ' + (lateN ? "bad" : unf && !d.length ? "warn" : "") + '">' +
            esc(String(right)) + "</span>" : "") + "</button>";
      }).join("");
      h += "</div>";
    });

    if (tpls.length) {
      h += '<div class="rwgroup"><div class="rwhead">Procedures</div>' +
        tpls.slice(0, 6).map(function (t) {
          return '<button class="rwrow quiet' + (openId === t.id ? " on" : "") +
            '" data-act="board-open" data-id="' + t.id + '">' +
            '<span class="rwname">' + esc(t.name) + "</span></button>";
        }).join("") + "</div>";
    }

    h += '<button class="rwnew" data-act="prose-open">Write a new procedure</button>';
    el.innerHTML = h;

    // The count the design puts on the nav item itself, so "something is late"
    // is visible from every screen rather than only from Waiting.
    var lateAll = dues().filter(function (d) { return d.st === "over"; }).length;
    var tab = document.querySelector('#nav [data-tab="waiting"]');
    if (tab) {
      var old = tab.querySelector(".tabn");
      if (old) old.remove();
      if (lateAll) {
        var sp = document.createElement("span");
        sp.className = "tabn";
        /* The word is dropped under 760px by CSS, not here, so one render
           serves both and the rail keeps "3 late" in words. */
        sp.textContent = lateAll + " late";
        sp.setAttribute("data-n", lateAll);
        tab.appendChild(sp);
      }
    }
  }

  /* WHOSE WORKSPACE, AND WHERE THE BOOK IS. The mockup's footer reads a name
     over "\u25cf Online"; there is no account here to be online with, so the
     second line says where this book is kept and the dot is green only when it
     actually reaches another device. Saying "Online" would be the app stating
     something it cannot know, which is the one thing every rule in this file
     is against. */
  function ownerName() { return String((state.settings || {}).owner || "").trim(); }
  function ownerInitials() {
    var parts = ownerName().split(/\s+/).filter(Boolean);
    if (!parts.length) return "";
    return (parts[0].charAt(0) + (parts.length > 1 ? parts[parts.length - 1].charAt(0) : "")).toUpperCase();
  }
  /* THE POSTER'S THREE OTHER SECTIONS. Equipment, Knowledge and Connections
     are not views — they are three of the six questions the one registry
     answers — so they go on the rail as rows that open the Assets tab on
     their own section. Written HERE and not in `renderNav()`, which belongs
     to the shared runtime and has to stay byte-identical across four apps;
     `railWork()` already fills the rail the same way and for the same reason.

     They are rail-only: a phone's bar was measured at six and now carries
     seven, and ten would be the mistake this repo has already refused twice.
     Nothing is hidden by that — each one is a section of the Assets strip,
     one tap in, on every screen. */
  var NAV_SECTS = [
    { id: "device", label: "Equipment",   ico: "device" },
    { id: "lib",    label: "Knowledge",   ico: "book" },
    { id: "conn",   label: "Connections", ico: "plug" }
  ];
  function navSects() {
    var nav = document.getElementById("nav");
    if (!nav) return;
    var after = nav.querySelector('[data-tab="repo"]');
    if (!after) return;
    Array.prototype.slice.call(nav.querySelectorAll(".tab.sect-row")).forEach(function (el) { el.remove(); });
    NAV_SECTS.slice().reverse().forEach(function (sc) {
      var b = document.createElement("button");
      b.className = "tab sect-row";
      b.setAttribute("data-act", "repo-sect");
      b.setAttribute("data-id", sc.id);
      /* Current when the Assets tab is open ON THAT SECTION. The Assets row
         itself reads current on the other three (Files, Apps, Sites), or two
         rows would light up for one screen. */
      if (view === "repo" && repoTab === sc.id && !openAsset) b.setAttribute("aria-current", "page");
      b.innerHTML = '<span class="ico">' + ICONS[sc.ico] + "</span><span>" + esc(sc.label) + "</span>";
      after.parentNode.insertBefore(b, after.nextSibling);
    });
    /* And the Assets row gives its mark up while one of them is showing. */
    if (view === "repo" && NAV_SECTS.some(function (sc) { return sc.id === repoTab; }) && !openAsset) {
      after.removeAttribute("aria-current");
    }
  }

  function railFoot() {
    var el = document.getElementById("railFoot");
    if (el) {
      var nm = ownerName(), ini = ownerInitials();
      el.innerHTML = '<span class="mepic" aria-hidden="true">' +
        (ini || ICONS.person) + "</span>" +
        '<span class="megrow"><b>' + esc(nm || "This book") + "</b>" +
        '<span class="mesay"><i' + (syncOn() ? ' class="on"' : "") + '></i>' +
        '<span id="brandSub">' + esc(syncOn() ? syncWords() : "This computer only") + "</span></span></span>" +
        '<button class="gearbtn" data-act="tab-settings" title="Settings" aria-label="Settings">' +
        '<span class="ico" aria-hidden="true">' + ICONS.settings + "</span></button>";
    }
    /* The sidebar is headed with the workspace name, so it moves with the one
       typed in Settings and falls back to the app's own. */
    var bn = document.getElementById("brandName");
    if (bn) bn.textContent = ownerName() ? ownerName().split(/\s+/)[0] + " Workspace" : "Mashghal";
  }

  function syncCard() {
    var cfg = syncCfg();
    var h = '<div class="card"><h3>Sync</h3>';
    if (cfg.mode !== "gist") {
      h += '<p class="card-sub">' + esc(syncWords()) + "</p>" +
        '<p class="hint" style="margin:0 0 0.7rem">Sealed on this device with a passphrase, then kept in a secret gist, so the phone and any laptop read the same book. Once it is set up it runs by itself — a board written on the phone reaches the laptop without anyone pressing anything.</p>' +
        '<div class="tools"><button class="btn" data-act="sync-setup">Set it up</button></div></div>';
      return h;
    }
    var devs = Object.keys(state.devices || {}).map(function (id) {
      return { id: id, d: state.devices[id] };
    }).sort(function (a, b) { return a.d.at < b.d.at ? 1 : -1; });

    h += '<p class="card-sub">' + esc(syncWords()) + "</p>" +
      '<p class="hint" style="margin:0 0 0.4rem">' + esc(cfg.deviceName || "unnamed device") +
      (cfg.borrowed ? " · borrowed, cleared when the tab closes" : "") +
      " · gist " + esc(String(cfg.gistId).slice(0, 10)) + "… (clipped — 32 characters in full)</p>";
    h += '<p class="hint" style="margin:0 0 0.7rem">' +
      (cfg.lastPulledAt ? "Last synced " + esc(String(cfg.lastPulledAt).slice(0, 16).replace("T", " ")) + "."
                        : "Not synced from here yet.") +
      " It runs by itself: a few seconds after you change something, every minute and a half while this is open, and the moment you come back to the tab or to the network. Each pass pulls, merges record by record, then pushes — so it can only add, never quietly replace. The button is there for when you want it now.</p>";
    h += '<div class="tools"><button class="btn primary" data-act="sync-now">Sync now</button>' +
      '<button class="btn" data-act="sync-setup">Change</button>' +
      '<button class="btn" data-act="sync-copy-id">Copy gist id</button>' +
      '<button class="btn danger" data-act="sync-wipe">Wipe this device</button></div>';

    if (devs.length) {
      h += '<div class="sect" style="margin-top:1.2rem">Devices on this book</div>';
      h += devs.map(function (x) {
        var mine = x.id === deviceId();
        return '<div class="row"><span class="pill ' + (mine ? "p-blue" : "p-grey") + '">' +
          (mine ? "this one" : "elsewhere") + "</span>" +
          '<span class="grow"><b>' + esc(x.d.name) + "</b><small>" +
          esc("last wrote " + String(x.d.at).slice(0, 16).replace("T", " ") + (x.d.borrowed ? " · borrowed" : "")) +
          "</small></span>" +
          (mine ? "" : '<span class="tools"><button class="btn quiet danger" data-act="device-forget" data-id="' +
            x.id + '">Forget</button></span>') + "</div>";
      }).join("");
      h += '<p class="hint">If a laptop you no longer have is still listed, wiping it is not enough on its own — revoke the token at github.com/settings/tokens, because anyone who copied it before the wipe still holds it.</p>';
    }
    return h + "</div>";
  }


  /* ================= the kit, and where you left off ================= */

  // What a mode hands you when you arrive: the software, the paths, the
  // filtered inboxes. And what you left behind: one line per bench, written
  // when you leave and read back when you return, because the cost of four
  // identities is not the software — it is the twenty minutes of "where was I".
  var openMode = "";   // view state, never saved

  function modeSoftware(m) { return m.software || (m.software = []); }
  function modeLinks(m) { return m.links || (m.links = []); }

  function benchesOfMode(id) {
    return live(state.benches).filter(function (b) { return b.modeId === id; });
  }
  function noteOf(benchId) {
    var b = byId(state.benches, benchId);
    return b && b.note ? b : null;
  }

  function kitModeDetail(m) {
    var sw = modeSoftware(m), lk = modeLinks(m), bs = benchesOfMode(m.id);
    var h = pageHead(m.name, "A craft and everything it hands you",
      '<div class="tools"><button class="btn" data-act="mode-back">All of Kit</button>' +
      '<button class="btn" data-act="mode-edit" data-id="' + m.id + '">Rename</button>' +
      '<button class="btn" data-act="sw-add" data-id="' + m.id + '">Add software</button>' +
      '<button class="btn" data-act="link-add" data-id="' + m.id + '">Add a link</button>' +
      '<button class="btn" data-act="kit-export" data-id="' + m.id + '">For the launcher</button></div>');

    h += '<div class="sect">Software and files</div><div class="card">';
    h += sw.length ? sw.map(function (x) {
      return '<div class="row"><span class="pill p-blue">' + (x.path ? "path" : "no path") + "</span>" +
        '<span class="grow"><b>' + esc(x.label) + "</b>" +
        (x.path ? "<small>" + esc(x.path) + "</small>" : "") + "</span>" +
        '<span class="tools">' +
        (x.path ? '<button class="btn" data-act="sw-copy" data-id="' + m.id + ":" + x.id + '">Copy path</button>' : "") +
        '<button class="btn quiet" data-act="sw-edit" data-id="' + m.id + ":" + x.id + '">Edit</button>' +
        '<button class="btn quiet danger" data-act="sw-del" data-id="' + m.id + ":" + x.id + '">×</button></span></div>';
    }).join("") : '<p class="empty">Nothing yet. A path here is one you can paste into Win+R.</p>';
    h += "</div>";

    h += '<div class="sect">Links</div><div class="card">' +
      '<p class="hint" style="margin:0 0 0.5rem">Anything a URL can reach, including a filtered search. <code>obsidian://search?query=…</code> works on Windows and on Android; webmail takes a search URL. Desktop Outlook does not, so for that one keep the search string here and paste it.</p>';
    h += lk.length ? lk.map(function (x) {
      return '<div class="row"><span class="pill p-brass">link</span>' +
        '<span class="grow"><b>' + esc(x.label) + "</b><small>" + esc(x.url) + "</small></span>" +
        '<span class="tools"><a class="btn" href="' + esc(x.url) + '" target="_blank" rel="noopener">Open</a>' +
        '<button class="btn quiet" data-act="link-edit" data-id="' + m.id + ":" + x.id + '">Edit</button>' +
        '<button class="btn quiet danger" data-act="link-del" data-id="' + m.id + ":" + x.id + '">×</button></span></div>';
    }).join("") : '<p class="empty">No links yet.</p>';
    h += "</div>";

    h += '<div class="sect">Where you left off</div><div class="card">' +
      '<p class="hint" style="margin:0 0 0.5rem">One line per bench, written when you leave and read back when you return.</p>';
    h += bs.length ? bs.map(function (b) {
      return '<div class="row"><span class="pill ' + (b.note ? "p-verd" : "p-grey") + '">' +
        (b.note ? "left a note" : "nothing") + "</span>" +
        '<span class="grow"><b>' + esc(benchLabel(b.id)) + "</b>" +
        (b.note ? "<small>" + esc(b.note + " · " + niceDate(stampDay(b.noteAt || ""))) + "</small>" : "") + "</span>" +
        '<span class="tools">' +
        (state.settings.companion ? '<a class="btn" href="mashghal://enter/' + esc(b.id) + '">Launch</a>' : "") +
        '<button class="btn quiet" data-act="note-edit" data-id="' + b.id + '">Edit</button></span></div>';
    }).join("") : '<p class="empty">This craft has no benches yet.</p>';
    h += "</div>";
    return h;
  }

  function swDialog(m, x) {
    openModal({
      title: x ? "Edit software" : "Add software",
      confirmLabel: x ? "Save" : "Add",
      message: x ? "" : "A name, and the path you would paste into Win+R to open it.",
      fields: [
        { key: "label", label: "Name", type: "text", span: true, value: x ? x.label : "", placeholder: "ArcGIS Pro" },
        { key: "path", label: "Path", type: "text", span: true, value: x ? (x.path || "") : "",
          hint: "Left blank it is just a reminder that this craft uses it." }
      ],
      validate: function (v) { return v.label.trim() ? null : "Give it a name."; },
      onConfirm: function (v) {
        go(function () {
          var t = x;
          if (!t) { t = { id: uid() }; modeSoftware(m).push(t); }
          t.label = v.label.trim(); t.path = v.path.trim();
        });
      }
    });
  }
  function linkDialog(m, x) {
    openModal({
      title: x ? "Edit link" : "Add a link",
      confirmLabel: x ? "Save" : "Add",
      fields: [
        { key: "label", label: "Name", type: "text", span: true, value: x ? x.label : "", placeholder: "AUB mail, this project" },
        { key: "url", label: "URL", type: "text", span: true, value: x ? x.url : "",
          placeholder: "obsidian://search?query=AUB", hint: "Any scheme, not only http." }
      ],
      validate: function (v) {
        if (!v.label.trim()) return "Give it a name.";
        if (!/^[a-z][a-z0-9+.-]*:/i.test(v.url.trim())) return "A URL needs a scheme — https:, obsidian:, mailto: and so on.";
        return null;
      },
      onConfirm: function (v) {
        go(function () {
          var t = x;
          if (!t) { t = { id: uid() }; modeLinks(m).push(t); }
          t.label = v.label.trim(); t.url = v.url.trim();
        });
      }
    });
  }
  function noteDialog(b) {
    openModal({
      title: "Where you left off",
      message: "One line, for the version of you that comes back to " + esc(benchLabel(b.id)) + ".",
      confirmLabel: "Save",
      fields: [{ key: "note", label: "Note", type: "text", span: true, value: b.note || "",
        placeholder: "still to export the cemetery layer" }],
      onConfirm: function (v) {
        go(function () {
          b.note = v.note.trim();
          b.noteAt = v.note.trim() ? nowStamp() : "";
        });
      }
    });
  }
  // Asked at the moment of leaving, when it is the only moment you still know.
  function askNote(benchId, after) {
    var b = byId(state.benches, benchId);
    if (!b) { if (after) after(); return; }
    openModal({
      title: "Where did you leave off?",
      message: "One line, for when you come back to " + esc(benchLabel(b.id)) + ". Skip it and the old note stays as it was.",
      confirmLabel: "Save it", cancelLabel: "Skip",
      fields: [{ key: "note", label: "Note", type: "text", span: true, value: "",
        placeholder: "still to export the cemetery layer" }],
      onConfirm: function (v) {
        if (v.note.trim()) {
          go(function () { b.note = v.note.trim(); b.noteAt = nowStamp(); });
        }
        if (after) after();
      },
      onCancel: function () { if (after) after(); }
    });
  }
  function greet(benchId) {
    var b = noteOf(benchId);
    if (b) toast("You left off: " + b.note);
  }

  // What the local launcher reads. The page never sends a path anywhere — it
  // writes this file for you, and the launcher looks a bench up in it. Nothing
  // arrives from the web except an id.
  function kitExport(m) {
    var out = { v: 1, mode: m.name, benches: {} };
    benchesOfMode(m.id).forEach(function (b) {
      out.benches[b.id] = {
        label: benchLabel(b.id),
        software: modeSoftware(m).map(function (x) { return { label: x.label, path: x.path || "" }; }),
        links: modeLinks(m).map(function (x) { return { label: x.label, url: x.url }; })
      };
    });
    download("mashghal-" + m.name.toLowerCase().replace(/[^a-z0-9]+/g, "-") + ".json",
             JSON.stringify(out, null, 2), "application/json");
  }

  /* ================= what a step needs =================

     A bench's kit is what the craft hands you. A *step* is narrower and more
     useful: the reference photo, the project file and the filtered inbox that
     this one piece of work needs, which is exactly what the link edge was
     built to carry. Linking a thing to a step already means "this belongs with
     it", so there is nothing new to record — `stepNeeds()` reads it.

     A step's own `path` or `url` counts too: a `file` step often carries the
     folder it files into, and that is the thing you want open. */
  function stepNeeds(b, n) {
    var sw = [], lk = [], seen = {};
    function take(label, path, url) {
      if (path && !seen["p" + path]) { seen["p" + path] = 1; sw.push({ label: label, path: path }); }
      if (url && !seen["u" + url]) { seen["u" + url] = 1; lk.push({ label: label, url: url }); }
    }
    take(n.label, n.path || "", n.url || "");
    edgesOf(b, n.id, "link").forEach(function (e) {
      var t = nodeOf(b, e.a === n.id ? e.b : e.a);
      if (!t || t.t !== "thing") return;
      take(t.label, t.path || "", t.url || "");
    });
    return { software: sw, links: lk };
  }
  function hasNeeds(b, n) {
    var w = stepNeeds(b, n);
    return !!(w.software.length || w.links.length);
  }

  /* One table for the whole book, because the launcher is handed an id and has
     to be able to find it whatever kind of thing it names. Three maps, one
     shape each, and the URL scheme is unchanged: `mashghal://enter/<id>` still
     carries an opaque id and nothing else, so nothing executable arrives from
     the web — there is simply one more place on the machine to look it up.

     Only OPEN runs contribute steps. A closed run's paths are history, and a
     lookup table is not an archive. */
  function launchTable() {
    var out = { v: 2, madeOn: today(), benches: {}, steps: {}, things: {} };

    state.benches.forEach(function (bn) {
      if (bn.archived) return;
      var m = byId(state.modes, bn.modeId);
      out.benches[bn.id] = {
        label: benchLabel(bn.id),
        software: m ? modeSoftware(m).map(function (x) { return { label: x.label, path: x.path || "" }; }) : [],
        links: m ? modeLinks(m).map(function (x) { return { label: x.label, url: x.url }; }) : []
      };
    });

    boards("run").forEach(function (b) {
      if (b.closedOn) return;
      activeNodes(b).forEach(function (n) {
        var w = stepNeeds(b, n);
        if (!w.software.length && !w.links.length) return;
        out.steps[n.id] = { label: n.label + " — " + b.name,
                            software: w.software, links: w.links };
      });
    });

    live(state.assets).forEach(function (a) {
      if (!a.path && !a.url) return;
      out.things[a.id] = {
        label: a.name,
        software: a.path ? [{ label: a.name, path: a.path }] : [],
        links: a.url ? [{ label: a.name, url: a.url }] : []
      };
    });
    return out;
  }

  function launchExport() {
    var t = launchTable();
    var n = Object.keys(t.benches).length + Object.keys(t.steps).length + Object.keys(t.things).length;
    download("mashghal-launch.json", JSON.stringify(t, null, 2), "application/json");
    toast(n + (n === 1 ? " thing" : " things") + " the launcher can now open");
  }

  // The link itself, and the only place it is built. It is nothing but the id:
  // a link that carried a path would be the hole the launcher exists to avoid.
  function launchLink(id, label) {
    return '<a class="btn" href="mashghal://enter/' + esc(id) + '">' + esc(label || "Open it") + "</a>";
  }

  /* ================= the canvas ================= */

  /* The design draws steps as rounded cards whose height follows what is on
     them — 56 for a bare step, 84 once there is a line of prose under the name,
     taller again for one holding a grid. Cut corners and one fixed size were
     the ModelBuilder reading; these are cards. */
  var SW = 215, SH1 = 56, SH2 = 84, TH = 40, CUT = 0;
  var CELL = 17, CGAP = 5, CLAB = 44;

  function gridOf(n) {
    var g = n.grid;
    if (!g || !g.rows || !g.cols || !g.rows.length || !g.cols.length) return null;
    return g;
  }
  function gridH(g) {
    return 11 + 15 + g.rows.length * (CELL + CGAP) + 20;
  }
  function thingW(n) {
    return Math.min(260, 64 + String(n.label || "").length * 7.2);
  }
function dims(n) {
    if (n.t !== "step") return hasPic(n) ? { w: PW, h: PH + 20 } : { w: thingW(n), h: TH };
    var g = gridOf(n);
    var lines = wrap(n.label || "", n._room || 26).length;   // wrap() caps at two
    var h = lines > 1 ? SH2 : SH1;
    if (g) h = 34 + lines * 17 + gridH(g);
    else if (n._says) h = Math.max(h, SH2);
    if (n._pics) h += 34;
    return { w: SW, h: h };
  }
  var PW = 132, PH = 96;   // a thumbnail on the sheet
  var NS = "http://www.w3.org/2000/svg";
  var vb = { x: 0, y: 0, w: 1400, h: 800 }, drag = null, pan = null, hov = null, cvSvg = null;
  var cvHold = null;      // the long-press timer; view state, never saved

  function canvasHtml(b, tools) {
    /* The class is written into the markup as well as toggled by `setMax`,
       because any render that rebuilds the sheet (marking a step done, adding
       a node) builds a fresh box — and a box without it dropped out of the
       full screen mid-edit while `html.cvmax` stayed on, leaving the page
       unscrollable behind a sheet that was no longer covering it. */
    return '<div class="cvbox' + (cvMax ? " max" : "") + '">' +
      '<div class="cvbar">' +
      (tools || "") +
      '<span class="sp"></span>' +
      '<button class="btn" data-act="cv-out">−</button>' +
      '<button class="btn" data-act="cv-in">+</button>' +
      '<button class="btn" data-act="cv-fit">Fit</button>' +
      '<button class="btn" data-act="cv-tidy" data-id="' + b.id + '">Tidy</button>' +
      '<button class="btn' + (cvMax ? " primary" : "") + '" data-act="cv-max"' +
      ' title="' + (cvMax ? "Back to the page (Esc)" : "Fill the screen") + '"' +
      ' aria-label="' + (cvMax ? "Back to the page" : "Fill the screen") + '">' +
      (cvMax ? "\u2715 Close" : "\u2922 Fill") + "</button>" +
      "</div>" +
      '<div id="selHost">' + selPanel(b) + "</div>" +
      /* Focusable, and no longer role="img": an image cannot be walked, and the
         sheet was the one screen in the app that a pointer was compulsory for
         — every action on a node lives behind picking it. `aria-describedby`
         points at the written instructions, which are on the page rather than
         in a tooltip so they are readable by everyone. */
      '<svg id="cv" tabindex="0" role="application" aria-describedby="cvKeys"' +
      ' aria-label="The board. Arrow keys move between steps and things; Enter opens what can be done to the one you are on."></svg>' +
      '<div class="dropnote" id="dropNote">Let go to put the picture here</div>' +
      /* A new board was an empty grid the height of a laptop screen with
         nothing saying what to do with it, and the written-out list below it
         opens closed — so the first thing you ever make said nothing at all. */
      (b.nodes.length ? "" :
        '<div class="cvempty"><b>An empty sheet</b>' +
        "<span>Start with the first thing you actually do \u2014 <b>Add step</b> above. " +
        "A picture can be dragged straight onto the sheet, and dragging from one step\u2019s " +
        "handle to another draws the line between them.</span></div>") +
      '<div class="tblock"><div><b>Board</b><span>' + esc(b.name) + "</span></div>" +
      "<div><b>Bench</b><span>" + esc(b.benchId ? benchLabel(b.benchId) : "none") + "</span></div></div>" +
      '<div class="cvleg"><span><i></i>comes after</span>' +
      '<span><i class="l-link"></i>belongs with, in no order</span>' +
      '<span><i class="l-step"></i>a step</span>' +
      '<span><i class="l-thing"></i>a thing or a person</span></div>' +
      "</div>" +
      /* Under the sheet, not inside it: `.cvbox` clips its overflow and every
         other child of it is absolutely positioned. */
      '<p class="cvkeys" id="cvKeys">On the sheet: <kbd>←</kbd> <kbd>→</kbd> move through the steps in order, ' +
      '<kbd>↓</kbd> <kbd>↑</kbd> follow a line on or back, <kbd>Enter</kbd> opens what you can do, ' +
      '<kbd>Space</kbd> does the main one, <kbd>Del</kbd> removes it, <kbd>Esc</kbd> lets go.</p>';
  }

  function svgEl(n, a) {
    var e = document.createElementNS(NS, n);
    for (var k in a) { if (a[k] !== null && a[k] !== undefined) e.setAttribute(k, a[k]); }
    return e;
  }

  function centre(n) { var d = dims(n); return { x: n.x + d.w / 2, y: n.y + d.h / 2 }; }
  /* `anchor(n, tx, ty)` is gone. It found the point on a card's edge facing a
     target, for a line drawn centre-to-centre; `drawEdges()` draws from the
     card's side instead and the arrowhead sits on the border, so nothing had
     called it for some time. It survived because the orphan scan's word
     boundary allowed a hyphen in front — every `"text-anchor": "middle"` on
     the sheet read as a caller. */

  // Nobody should ever meet a blank sheet. Steps are ranked by how far they
  // sit from an entry point and laid out in columns; things are parked above
  // or below whatever they are linked to.
  /* How far along the flow each step sits. Used twice: to lay the sheet out,
     and to tell a genuine loop back from an edge that merely happens to run
     leftwards on screen. Its BFS ignores back edges, or the loop in a revision
     cycle drags its own target off to the right. */
  function flowDepth(b) {
    var depth = {}, steps = b.nodes.filter(function (n) { return n.t === "step"; });
    var queue = entryNodes(b).map(function (n) { return n.id; });
    queue.forEach(function (id) { depth[id] = 0; });
    var guard = 0;
    while (queue.length && guard++ < 500) {
      var id = queue.shift();
      nextOf(b, id).forEach(function (e) {
        if (depth[e.b] === undefined) { depth[e.b] = depth[id] + 1; queue.push(e.b); }
      });
    }
    steps.forEach(function (n, i) { if (depth[n.id] === undefined) depth[n.id] = 100 + i; });
    return depth;
  }

  /* ---------------- the sheet's own menu ----------------

     THE BRIEF ASKS FOR A DESKTOP RIGHT-CLICK AND A PHONE LONG-PRESS, and the
     reason it earns its place over simply picking the node is distance: on a
     laptop the strip is at the top of the sheet and the cursor is wherever the
     node is, and on a phone it can be a scroll away. A menu at the pointer is
     the same actions nearer your hand.

     **Nothing is only in the menu.** It renders `nodeActs(b, n)`, the same
     array the strip renders, so this is a second surface over one list and
     never a second list — which is the `omniEl()` lesson, and the reason
     `borrowInto`/`borrowLine` are one pair. Everything here stays reachable
     with no pointer at all: Enter opens the strip, Space fires the first of
     these, Delete the last.

     It is NOT a modal. There is no scrim, no focus trap and no Escape stack
     entry beyond its own, because a menu is a shortcut to buttons that are
     already on the screen — putting a trap round it would make an accidental
     right-click something you have to get out of, which is the fault "a tap
     on the sheet selects; it does not open a dialog" exists to prevent.
     z-index 60: over the maximised sheet (55) and the switch bar (50), under
     the storage alarm (70) and the overlay (90), so every dialog it opens
     still lands on top of it. */
  var cvMenu = null;      // view state, never saved

  function menuClose() {
    if (cvMenu && cvMenu.parentNode) cvMenu.parentNode.removeChild(cvMenu);
    cvMenu = null;
  }

  /* PICK THE NODE, LET THE STRIP PAINT, THEN OPEN — in that order, and the
     order is the whole of it. Selecting a node makes `selPanel` appear, which
     is ~46px of layout the sheet did not have, which fires a `scroll` on the
     document, which is one of the things that closes this menu. Opened in the
     same tick the menu was built and destroyed between two frames and the
     right-click looked like it did nothing at all.

     A frame later the layout has settled, the coordinates are measured
     against what is actually on screen, and a real scroll still closes it. */
