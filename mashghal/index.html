  // What the local launcher reads. The page never sends a path anywhere — it
  // writes this file for you, and the launcher looks a bench up in it. Nothing
  // arrives from the web except an id.
  function kitExport(m) {
    var out = { v: 1, mode: m.name, benches: {} };
    benchesOfMode(m.id).forEach(function (b) {
      out.benches[b.id] = {

             JSON.stringify(out, null, 2), "application/json");

  /* ================= the canvas ================= */

  var SW = 186, SH = 78, CUT = 11, TW = 148, TH = 32;
  var NS = "http://www.w3.org/2000/svg";
  var vb = { x: 0, y: 0, w: 1400, h: 800 }, drag = null, pan = null, hov = null, cvSvg = null;

  function canvasHtml(b) {
    return '<div class="cvbox">' +
      '<div class="cvbar">' +
      '<span class="sp"></span>' +
      '<button class="btn" data-act="cv-out">−</button>' +
      '<button class="btn" data-act="cv-in">+</button>' +
      '<button class="btn" data-act="cv-fit">Fit</button>' +
      '<button class="btn" data-act="cv-tidy" data-id="' + b.id + '">Tidy</button>' +
      "</div>" +
      '<svg id="cv" role="img" aria-label="The board drawn as steps, things and the lines between them"></svg>' +
      '<div class="tblock"><div><b>Board</b><span>' + esc(b.name) + "</span></div>" +
      "<div><b>Bench</b><span>" + esc(b.benchId ? benchLabel(b.benchId) : "none") + "</span></div></div>" +
      "</div>";
  }

  function svgEl(n, a) {
    var e = document.createElementNS(NS, n);
    for (var k in a) { if (a[k] !== null && a[k] !== undefined) e.setAttribute(k, a[k]); }
    return e;
  }
  function dims(n) { return n.t === "step" ? { w: SW, h: SH } : { w: TW, h: TH }; }
  function centre(n) { var d = dims(n); return { x: n.x + d.w / 2, y: n.y + d.h / 2 }; }
  function anchor(n, tx, ty) {
    var c = centre(n), d = dims(n), dx = tx - c.x, dy = ty - c.y;
    if (!dx && !dy) return c;
    var s = Math.min(dx ? (d.w / 2 + 5) / Math.abs(dx) : Infinity,
                     dy ? (d.h / 2 + 5) / Math.abs(dy) : Infinity);
    return { x: c.x + dx * s, y: c.y + dy * s };
  }

  // Nobody should ever meet a blank sheet. Steps are ranked by how far they
  // sit from an entry point and laid out in columns; things are parked above
  // or below whatever they are linked to.
  function autoLayout(b) {
    var depth = {}, steps = b.nodes.filter(function (n) { return n.t === "step"; });
    var queue = entryNodes(b).map(function (n) { return n.id; });
    queue.forEach(function (id) { depth[id] = 0; });
    var guard = 0;
    while (queue.length && guard++ < 500) {
      var id = queue.shift();
      nextOf(b, id).forEach(function (e) {
        // A back edge is a cycle, not a deeper rank — ignore it, or the
        // loop in a revision cycle drags its own target off to the right.
        if (depth[e.b] === undefined) { depth[e.b] = depth[id] + 1; queue.push(e.b); }
      });
    }
    steps.forEach(function (n, i) { if (depth[n.id] === undefined) depth[n.id] = i; });

    var cols = {};
    steps.forEach(function (n) {
      var d = depth[n.id];
      cols[d] = cols[d] || [];
      cols[d].push(n);
    });
    // Serpentine: five across, then drop a row and come back the other way.
    Object.keys(cols).forEach(function (d) {
      cols[d].forEach(function (n, j) {
        var col = num(d) % 5, band = Math.floor(num(d) / 5);
        if (band % 2 === 1) col = 4 - col;
        n.x = 60 + col * 262;
        n.y = 300 + band * 230 + j * 110;
      });
    });
    b.nodes.filter(function (n) { return n.t === "thing"; }).forEach(function (n, i) {
      var link = b.edges.filter(function (e) { return e.k === "link" && (e.a === n.id || e.b === n.id); })[0];
      var host = link ? nodeOf(b, link.a === n.id ? link.b : link.a) : null;
      if (host && host.t === "step") {
        n.x = host.x + 18;
        n.y = host.y + (i % 2 === 0 ? -140 : SH + 70);
      } else {
        n.x = 60 + i * 170; n.y = 120;
      }
    });
  }

  function stepPath(w, h) { return "M0,0 H" + w + " V" + (h - CUT) + " L" + (w - CUT) + "," + h + " H0 Z"; }
  function curvePath(x1, y1, x2, y2) {
    var dx = x2 - x1, dy = y2 - y1;
    if (Math.abs(dx) >= Math.abs(dy)) {
      var k = Math.max(30, Math.abs(dx) * 0.42);
      return "M" + x1 + "," + y1 + " C" + (x1 + k) + "," + y1 + " " + (x2 - k) + "," + y2 + " " + x2 + "," + y2;
    }
    var j = Math.max(26, Math.abs(dy) * 0.45);
    return "M" + x1 + "," + y1 + " C" + x1 + "," + (y1 + j) + " " + x2 + "," + (y2 - j) + " " + x2 + "," + y2;
  }

  var NODE_INK = {
    done:    { bar: "#74a086", stroke: "#332d25", text: "#a2977f", w: 1,   sink: 0.62 },
    now:     { bar: "#7fa9ce", stroke: "#7fa9ce", text: "#ece4d5", w: 1.6, sink: 1 },
    waiting: { bar: "#c9a227", stroke: "#6d5a1c", text: "#ece4d5", w: 1.3, sink: 1 },
    over:    { bar: "#d0604a", stroke: "#d0604a", text: "#ece4d5", w: 1.6, sink: 1 },
    todo:    { bar: "#443b30", stroke: "#312a22", text: "#6e6553", w: 1,   sink: 0.84 }
  };

  function drawBoard(b, svg) {
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    var defs = svgEl("defs");
    [["mar", "#7fa9ce"], ["mar-dim", "#4f4536"]].forEach(function (p) {
      var m = svgEl("marker", { id: p[0], viewBox: "0 0 10 8", refX: 9, refY: 4,
        markerWidth: 9, markerHeight: 7.5, orient: "auto-start-reverse" });
      m.appendChild(svgEl("polygon", { points: "0,0 10,4 0,8", fill: p[1] }));
      defs.appendChild(m);
    });
    var pmin = svgEl("pattern", { id: "gmin", width: 40, height: 40, patternUnits: "userSpaceOnUse" });
    pmin.appendChild(svgEl("path", { d: "M40,0 H0 V40", fill: "none", stroke: "#ece4d5", "stroke-opacity": ".05" }));
    var pmaj = svgEl("pattern", { id: "gmaj", width: 200, height: 200, patternUnits: "userSpaceOnUse" });
    pmaj.appendChild(svgEl("rect", { width: 200, height: 200, fill: "url(#gmin)" }));
    pmaj.appendChild(svgEl("path", { d: "M200,0 H0 V200", fill: "none", stroke: "#ece4d5", "stroke-opacity": ".095" }));
    defs.appendChild(pmin); defs.appendChild(pmaj);
    svg.appendChild(defs);
    svg.appendChild(svgEl("rect", { x: -6000, y: -6000, width: 12000, height: 12000, fill: "url(#gmaj)" }));

    var gE = svgEl("g"), gN = svgEl("g");
    svg.appendChild(gE); svg.appendChild(gN);
    svg._gE = gE; svg._gN = gN;
    drawEdges(b, svg); drawNodes(b, svg);
  }

  function drawEdges(b, svg) {
    var g = svg._gE;
    while (g.firstChild) g.removeChild(g.firstChild);
    b.edges.forEach(function (e) {
      var A = nodeOf(b, e.a), Z = nodeOf(b, e.b);
      if (!A || !Z) return;
      var ca = centre(A), cz = centre(Z);
      var on = hov && (hov === e.a || hov === e.b);
      var p1 = anchor(A, cz.x, cz.y), p2 = anchor(Z, ca.x, ca.y);

      if (e.k === "link") {
        g.appendChild(svgEl("path", { d: curvePath(p1.x, p1.y, p2.x, p2.y), fill: "none",
          stroke: "#c9a227", "stroke-width": on ? 1.7 : 1.3, "stroke-dasharray": "3.5 5.5",
          "stroke-opacity": on ? 0.95 : 0.5, "stroke-linecap": "round" }));
        return;
      }
      var back = Z.x < A.x - 40;
      var liveEdge = nodeState(b, A) !== "todo";
      var col = liveEdge ? "#7fa9ce" : "#4f4536";
      var mk = liveEdge ? "url(#mar)" : "url(#mar-dim)";
      var lx, ly;

      if (back) {
        // A loop back over the top, so a revision cycle reads as a shape.
        var mx = (ca.x + cz.x) / 2, my = Math.min(ca.y, cz.y) - 150;
        var a1 = anchor(A, mx, my), z1 = anchor(Z, mx, my);
        g.appendChild(svgEl("path", { d: "M" + a1.x + "," + a1.y + " Q" + mx + "," + my + " " + z1.x + "," + z1.y,
          fill: "none", stroke: col, "stroke-width": on ? 2 : 1.5, "stroke-opacity": on ? 1 : 0.82, "marker-end": mk }));
        lx = mx; ly = my - 9;
      } else {
        g.appendChild(svgEl("path", { d: curvePath(p1.x, p1.y, p2.x, p2.y), fill: "none",
          stroke: col, "stroke-width": on ? 2 : 1.5, "stroke-opacity": on ? 1 : 0.82, "marker-end": mk }));
        lx = (p1.x + p2.x) / 2; ly = (p1.y + p2.y) / 2 - 9;
      }
      if (e.label) {
        g.appendChild(svgEl("rect", { x: lx - 26, y: ly - 11, width: 52, height: 15, fill: "#181612", opacity: 0.92 }));
        var t = svgEl("text", { x: lx, y: ly, fill: "#a2977f", "text-anchor": "middle",
          "font-family": "ui-monospace, Menlo, monospace", "font-size": 9.5, "letter-spacing": ".1em" });
        t.textContent = e.label.toUpperCase();
        g.appendChild(t);
      }
    });
  }

  function drawNodes(b, svg) {
    var g = svg._gN;
    while (g.firstChild) g.removeChild(g.firstChild);
    b.nodes.forEach(function (n) {
      var outer = svgEl("g", { transform: "translate(" + n.x + "," + n.y + ")", "data-id": n.id });
      var inner = svgEl("g", { "class": "nd" });
      outer.appendChild(inner);
      var d = dims(n);

      if (n.t === "step") {
        var st = NODE_INK[nodeState(b, n)] || NODE_INK.todo;
        inner.setAttribute("opacity", st.sink);
        if (nodeState(b, n) === "over") {
          inner.appendChild(svgEl("path", { "class": "halo", d: stepPath(d.w, d.h),
            fill: "none", stroke: "#d0604a", "stroke-width": 6, opacity: 0.16 }));
        }
        inner.appendChild(svgEl("path", { d: stepPath(d.w, d.h), transform: "translate(3,3)", fill: "#0d0b09", opacity: 0.5 }));
        inner.appendChild(svgEl("path", { d: stepPath(d.w, d.h), fill: "#27231d", stroke: st.stroke, "stroke-width": st.w }));
        inner.appendChild(svgEl("rect", { x: 0, y: 0, width: 2.5, height: d.h, fill: st.bar }));

        var a = svgEl("text", { x: 13, y: 18, fill: "#6e6553",
          "font-family": "ui-monospace, Menlo, monospace", "font-size": 9, "letter-spacing": ".18em" });
        a.textContent = ACTS[n.act].word.toUpperCase();
        inner.appendChild(a);

        wrap(n.label, 24).forEach(function (ln, i) {
          var t = svgEl("text", { x: 13, y: 36 + i * 15, fill: st.text,
            "font-family": "inherit", "font-size": 13 });
          t.textContent = ln;
          inner.appendChild(t);
        });

        if (n.doneAt) {
          var ck = svgEl("text", { x: d.w - 13, y: 18, fill: "#74a086", "text-anchor": "end",
            "font-family": "ui-monospace, Menlo, monospace", "font-size": 11 });
          ck.textContent = "✓";
          inner.appendChild(ck);
        }
        var meta = stepMeta(b, n);
        if (meta) {
          var m = svgEl("text", { x: 13, y: d.h - 10, fill: nodeState(b, n) === "over" ? "#d0604a" : "#6e6553",
            "font-family": "ui-monospace, Menlo, monospace", "font-size": 9.5 });
          m.textContent = meta;
          inner.appendChild(m);
        }
      } else {
        inner.appendChild(svgEl("rect", { x: 3, y: 3, width: d.w, height: d.h, rx: d.h / 2, fill: "#0d0b09", opacity: 0.45 }));
        inner.appendChild(svgEl("rect", { x: 0, y: 0, width: d.w, height: d.h, rx: d.h / 2,
          fill: "#181612", stroke: "#c9a227", "stroke-opacity": 0.72 }));
        var tx = svgEl("text", { x: d.w / 2, y: d.h / 2 + 4.5, fill: "#c9a227", "text-anchor": "middle",
          "font-family": "inherit", "font-size": 11.5 });
        tx.textContent = clip(n.label, 20);
        inner.appendChild(tx);
      }
      g.appendChild(outer);
    });
  }

  function stepMeta(b, n) {
    if (b.kind !== "run") {
      if (n.chaseDays) return "chase " + n.chaseDays + "d";
      return n.dueAt ? "dated" : "";
    }
    var st = nodeState(b, n);
    if (st === "over") return daysWaiting(n) + "d · " + overdueBy(n) + " past chase";
    if (st === "waiting") return daysWaiting(n) + "d waiting";
    if (st === "now") return n.dueAt ? niceDate(n.dueAt) : daysWaiting(n) + "d in hand";
    return "";
  }
  function wrap(s, max) {
    var words = String(s).split(/\s+/), lines = [], cur = "";
    words.forEach(function (w) {
      if (!cur) { cur = w; return; }
      if ((cur + " " + w).length <= max) cur += " " + w;
      else { lines.push(cur); cur = w; }
    });
    if (cur) lines.push(cur);
    return lines.slice(0, 2);
  }
  function clip(s, max) { return String(s).length > max ? String(s).slice(0, max - 1) + "…" : String(s); }

  function boundsOf(b) {
    var x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9;
    b.nodes.forEach(function (n) {
      var d = dims(n);
      x1 = Math.min(x1, n.x); y1 = Math.min(y1, n.y);
      x2 = Math.max(x2, n.x + d.w); y2 = Math.max(y2, n.y + d.h);
    });
    if (x1 > x2) { x1 = 0; y1 = 0; x2 = 800; y2 = 400; }
    return { x1: x1, y1: y1, x2: x2, y2: y2 };
  }
  function applyVB() { if (cvSvg) cvSvg.setAttribute("viewBox", vb.x + " " + vb.y + " " + vb.w + " " + vb.h); }

  function fitBoard(b) {
    if (!cvSvg) return;
    var bd = boundsOf(b), pad = 52, r = cvSvg.getBoundingClientRect();
    var ar = (r.height && r.width) ? r.height / r.width : 0.6;
    var cw = (bd.x2 - bd.x1) + pad * 2, ch = (bd.y2 - bd.y1) + pad * 2;
    var w = cw, h = w * ar;
    if (h < ch) { h = ch; w = h / ar; }
    vb = { x: (bd.x1 + bd.x2) / 2 - w / 2, y: (bd.y1 + bd.y2) / 2 - h / 2, w: w, h: h };
    applyVB();
  }

  function toSvg(ev) {
    var r = cvSvg.getBoundingClientRect();
    return { x: vb.x + (ev.clientX - r.left) / r.width * vb.w,
             y: vb.y + (ev.clientY - r.top) / r.height * vb.h };
  }
  function zoomBy(f, cx, cy) {
    var nw = vb.w / f, nh = vb.h / f;
    if (nw < 380 || nw > 6000) return;
    vb.x = cx - (cx - vb.x) * (nw / vb.w);
    vb.y = cy - (cy - vb.y) * (nh / vb.h);
    vb.w = nw; vb.h = nh; applyVB();
  }

  function mountCanvas() {
    cvSvg = document.getElementById("cv");
    if (!cvSvg) return;
    var b = openBoard();
    if (!b) { cvSvg = null; return; }
    if (b.nodes.some(function (n) { return typeof n.x !== "number"; })) { autoLayout(b); save(); }
    drawBoard(b, cvSvg);
    fitBoard(b);

    cvSvg.addEventListener("pointerdown", function (ev) {
      var g = ev.target.closest ? ev.target.closest("g[data-id]") : null;
      var p = toSvg(ev);
      if (g) {
        var n = nodeOf(b, g.getAttribute("data-id"));
        if (n) { drag = { n: n, dx: p.x - n.x, dy: p.y - n.y, moved: false };
                 cvSvg.setPointerCapture(ev.pointerId); return; }
      }
      pan = { x: p.x, y: p.y };
      cvSvg.classList.add("grabbing");
      cvSvg.setPointerCapture(ev.pointerId);
    });

    cvSvg.addEventListener("pointermove", function (ev) {
      if (drag) {
        var p = toSvg(ev);
        drag.n.x = Math.round(p.x - drag.dx);
        drag.n.y = Math.round(p.y - drag.dy);
        drag.moved = true;
        var g = cvSvg._gN.querySelector('g[data-id="' + drag.n.id + '"]');
        if (g) g.setAttribute("transform", "translate(" + drag.n.x + "," + drag.n.y + ")");
        drawEdges(b, cvSvg);
      } else if (pan) {
        var q = toSvg(ev);
        vb.x -= (q.x - pan.x); vb.y -= (q.y - pan.y); applyVB();
      } else {
        var t = ev.target.closest ? ev.target.closest("g[data-id]") : null;
        var id = t ? t.getAttribute("data-id") : null;
        if (id !== hov) { hov = id; drawEdges(b, cvSvg); }
      }
    });

    function endPointer(ev) {
      if (drag && drag.moved) save();
      if (drag && !drag.moved) editNode(b, drag.n);
      drag = null; pan = null;
      cvSvg.classList.remove("grabbing");
      if (cvSvg.hasPointerCapture && cvSvg.hasPointerCapture(ev.pointerId)) cvSvg.releasePointerCapture(ev.pointerId);
    }
    cvSvg.addEventListener("pointerup", endPointer);
    cvSvg.addEventListener("pointercancel", endPointer);
    cvSvg.addEventListener("pointerleave", function () { if (hov) { hov = null; drawEdges(b, cvSvg); } });
    cvSvg.addEventListener("wheel", function (ev) {
      ev.preventDefault();
      var p = toSvg(ev);
      zoomBy(ev.deltaY < 0 ? 1.12 : 1 / 1.12, p.x, p.y);
    }, { passive: false });
  }

  /* ================= actions ================= */

  function split(id) { var p = String(id).split(":"); return { b: byId(state.boards, p[0]), n: p[1] }; }
  function go(fn) { fn(); stampRecords(); save(); render(); }

  function editNode(b, n) { APP.actions["node-edit"](b.id + ":" + n.id); }

  APP.actions = {
    /* ---- boards ---- */
    "board-open": function (id) { openId = id; view = "boards"; render(); },
    "board-back": function () { openId = ""; render(); },

    "board-new": function () {
      openModal({
        title: "New board", confirmLabel: "Create",
        message: "A board is a procedure you can run again and again. A bench is optional — a visa belongs to no employer.",
        fields: [
          { key: "name", label: "Name", type: "text", value: "", span: true, placeholder: "Brochure" },
          { key: "kindId", label: "Kind", type: "select", options: kindOpts(), value: "" },
          { key: "benchId", label: "Bench", type: "select", options: benchOpts(), value: "" }
        ],
        validate: function (v) { return v.name.trim() ? null : "Give it a name."; },
        onConfirm: function (v) {
          go(function () {
            var b = newBoard(v.name.trim(), v.kindId, v.benchId);
            state.boards.push(b);
            openId = b.id;
          });
          toast("Board created");
        }
      });
    },

    "board-edit": function (id) {
      var b = byId(state.boards, id); if (!b) return;
      openModal({
        title: "Rename board", confirmLabel: "Save",
        fields: [
          { key: "name", label: "Name", type: "text", value: b.name, span: true },
          { key: "kindId", label: "Kind", type: "select", options: kindOpts(), value: b.kindId },
          { key: "benchId", label: "Bench", type: "select", options: benchOpts(), value: b.benchId }
        ],
        validate: function (v) { return v.name.trim() ? null : "Give it a name."; },
        onConfirm: function (v) {
          go(function () { b.name = v.name.trim(); b.kindId = v.kindId; b.benchId = v.benchId; });
        }
      });
    },

    "board-del": function (id) {
      var b = byId(state.boards, id); if (!b) return;
      var runs = state.boards.filter(function (r) { return r.fromBoardId === b.id && !r.archived; });
      confirmAction({
        title: "Delete " + b.name + "?",
        message: b.kind === "template" && runs.length
          ? "Its " + runs.length + " run" + (runs.length === 1 ? "" : "s") +
            " will be left alone — a run froze its own copy when it started, so nothing of theirs is lost."
          : "This cannot be undone from here, though a backup would still have it."
      }, function () {
        go(function () {
          b.archived = true;
          state.forgotten[b.id] = b.name;
          if (openId === b.id) openId = "";
        });
        toast("Deleted " + b.name);
      });
    },

    /* ---- runs ---- */
    "run-start": function () {
      var tpls = boards("template");
      if (!tpls.length) { toast("Write a procedure first."); return; }
      openModal({
        title: "Start a run", confirmLabel: "Start",
        message: "The run takes its own frozen copy of the procedure. Editing the procedure later will not disturb it.",
        fields: [
          { key: "boardId", label: "Procedure", type: "select",
            options: tpls.map(function (t) { return { value: t.id, label: t.name }; }), value: tpls[0].id },
          { key: "title", label: "Call this run", type: "text", value: "", span: true, placeholder: "Harbour festival brochure" }
        ],
        validate: function (v) { return v.title.trim() ? null : "Give the run a name you will recognise."; },
        onConfirm: function (v) {
          var tpl = byId(state.boards, v.boardId);
          if (!tpl) return;
          go(function () { openId = startRun(tpl, v.title.trim()).id; });
          toast("Run started");
        }
      });
    },

    "run-this": function (id) {
      var tpl = byId(state.boards, id); if (!tpl) return;
      if (!tpl.nodes.filter(function (n) { return n.t === "step"; }).length) {
        toast("Add a step before running it."); return;
      }
      openModal({
        title: "Run " + tpl.name, confirmLabel: "Start",
        fields: [{ key: "title", label: "Call this run", type: "text", value: "", span: true }],
        validate: function (v) { return v.title.trim() ? null : "Give the run a name."; },
        onConfirm: function (v) {
          go(function () { openId = startRun(tpl, v.title.trim()).id; });
          toast("Run started");
        }
      });
    },

    "run-close": function (id) {
      var b = byId(state.boards, id); if (!b) return;
      var uf = unfiled(b);
      if (uf.length) {
        openModal({
          title: "Not filed yet",
          message: "This run still has " + uf.length + " filing step" + (uf.length === 1 ? "" : "s") +
            " undone — <b>" + esc(uf.map(function (n) { return n.label; }).join(", ")) +
            "</b>. Filing is the thing that gets forgotten, so a run will not close until it is done.",
          confirmLabel: "Leave it open", cancelLabel: "Close anyway",
          onConfirm: function () {},
          onCancel: function () {
            go(function () { b.closedOn = today(); });
            toast("Closed " + b.name + " with filing undone");
          }
        });
        return;
      }
      go(function () { b.closedOn = today(); });
      toast("Closed " + b.name, function () { b.closedOn = ""; });
    },

    "run-reopen": function (id) {
      var b = byId(state.boards, id); if (!b) return;
      go(function () { b.closedOn = ""; });
      toast("Reopened");
    },

    /* ---- steps in a run ---- */
    "step-done": function (id) {
      var s = split(id); if (!s.b) return;
      var n = nodeOf(s.b, s.n); if (!n) return;
      var before = JSON.stringify(s.b.nodes);
      go(function () { finishStep(s.b, s.n); });
      toast("Done: " + n.label, function () { s.b.nodes = JSON.parse(before); });
    },
    "step-enter": function (id) {
      var s = split(id); if (!s.b) return;
      go(function () { enter(s.b, s.n); });
    },
    "step-reopen": function (id) {
      var s = split(id); if (!s.b) return;
      go(function () { reopenStep(s.b, s.n); });
    },
    "step-answer": function (id) {
      var s = split(id); if (!s.b) return;
      var n = nodeOf(s.b, s.n); if (!n) return;
      var answers = exitsOf(s.b, n);
      if (!answers.length) { toast("This decision has no exits yet — add one first."); return; }
      openModal({
        title: n.label, confirmLabel: "That one",
        message: "Whichever you pick is the only exit that opens. This is how the cycle repeats.",
        fields: [{ key: "answer", label: "Answer", type: "select", span: true,
          options: answers.map(function (a) {
            var t = nodeOf(s.b, a.goTo);
            return { value: a.label, label: a.label + (t ? "  →  " + t.label : "") };
          }), value: answers[0].label }],
        onConfirm: function (v) {
          var before = JSON.stringify(s.b.nodes);
          go(function () { finishStep(s.b, s.n, v.answer); });
          toast("Answered: " + v.answer, function () { s.b.nodes = JSON.parse(before); });
        }
      });
    },

    /* ---- nodes ---- */
    "node-add": function (id) { nodeDialog(byId(state.boards, id), null); },
    "thing-add": function (id) { thingDialog(byId(state.boards, id), null); },
    "node-edit": function (id) {
      var s = split(id); if (!s.b) return;
      var n = nodeOf(s.b, s.n); if (!n) return;
      if (n.t === "thing") thingDialog(s.b, n); else nodeDialog(s.b, n);
    },
    "node-del": function (id) {
      var s = split(id); if (!s.b) return;
      var n = nodeOf(s.b, s.n); if (!n) return;
      confirmAction({
        title: "Remove " + n.label + "?",
        message: "Every line into and out of it goes too."
      }, function () {
        go(function () {
          s.b.nodes = s.b.nodes.filter(function (x) { return x.id !== n.id; });
          s.b.edges = s.b.edges.filter(function (e) { return e.a !== n.id && e.b !== n.id; });
        });
        toast("Removed " + n.label);
      });
    },

    // An exit is a labelled line out of the decision. Naming it and choosing
    // where it goes are the same act, so they are one dialog and they write one
    // thing — no exit can exist without a line, and no line goes unlabelled.
    "exit-add": function (id) {
      var s = split(id); if (!s.b) return;
      var n = nodeOf(s.b, s.n); if (!n) return;
      var targets = s.b.nodes.filter(function (x) { return x.t === "step" && x.id !== n.id; });
      if (!targets.length) { toast("Add another step first — an exit has to go somewhere."); return; }
      openModal({
        title: "Add an exit to " + n.label, confirmLabel: "Add",
        message: "An exit that points back at an earlier step is how a cycle repeats.",
        fields: [
          { key: "label", label: "Call it", type: "text", value: "", span: true, placeholder: "repeat" },
          { key: "goTo", label: "Goes to", type: "select", span: true,
            options: targets.map(function (t) { return { value: t.id, label: t.label }; }),
            value: targets[0].id }
        ],
        validate: function (v) {
          if (!v.label.trim()) return "Give the exit a name — it is what you will be asked.";
          var dup = exitsOf(s.b, n).some(function (x) { return x.label === v.label.trim(); });
          return dup ? "That exit already exists." : null;
        },
        onConfirm: function (v) {
          go(function () {
            s.b.edges.push({ id: uid(), a: n.id, b: v.goTo, k: "flow", label: v.label.trim() });
          });
        }
      });
    },

    // Linking a person to a send IS addressing it, so this writes the same
    // link edge the Connect dialog would, from the step that needs it.
    "send-to": function (id) {
      var s = split(id); if (!s.b) return;
      var n = nodeOf(s.b, s.n); if (!n) return;
      var have = recipientsOf(s.b, n).map(function (t) { return t.id; });
      var people = s.b.nodes.filter(function (x) {
        return x.t === "thing" && x.kind === "person" && have.indexOf(x.id) < 0;
      });
      if (!people.length) {
        toast(have.length ? "Everyone on this board is already on it." : "Add a person to the board first.");
        return;
      }
      openModal({
        title: "Send " + n.label + " to", confirmLabel: "Add",

        title: "Connect two things", confirmLabel: "Connect",

        fields: [
          { key: "a", label: "From", type: "select", options: nodeOpts(b, ""), value: all[0].id },

    /* ---- the switch ---- */
    "span-start": function () {
      pickBench("Where are you starting?", function (benchId) {
        go(function () {
          state.spans.push({ id: uid(), startedAt: nowStamp(), endedAt: "",
                             benchId: benchId, note: "", source: "switch" });
        });
        greet(benchId);
      });
    },
    // Switching is one act, not two: the span you were in ends at the moment
    // the next one starts, so no minute belongs to both and none falls between.
    "span-switch": function () {
      var sp = openSpan(), leaving = sp ? sp.benchId : "";
      pickBench("Switching to", function (benchId) {
        go(function () {
          var at = nowStamp();
          if (sp) sp.endedAt = at;
          state.spans.push({ id: uid(), startedAt: at, endedAt: "",
                             benchId: benchId, note: "", source: "switch" });
        });
        // Ask about the bench being left, then greet the one being entered.
        if (leaving && leaving !== benchId) askNote(leaving, function () { greet(benchId); });
        else greet(benchId);
      });
    },
    "span-stop": function () {
      var sp = openSpan(); if (!sp) return;
      var was = sp.endedAt;
      go(function () { sp.endedAt = nowStamp(); });
      toast("Stopped after " + fmtMins(minsBetween(sp.startedAt, sp.endedAt)),
            function () { sp.endedAt = was; });
      if (sp.benchId) askNote(sp.benchId);
    },
    // A runaway is closed by being told when it ended, never by assuming now.
    "span-close": function () {
      var sp = runaway(); if (!sp) return;
      openModal({
        title: "When did you leave?",
        message: "This has been open since " + esc(niceDate(stampDay(sp.startedAt))) +
          ". It is not being counted until it has an end, and the app will not invent one.",
        confirmLabel: "Close it",
        fields: [
          { key: "day", label: "Day", type: "text", value: stampDay(sp.startedAt), span: true, hint: "YYYY-MM-DD" },
          { key: "to", label: "Time", type: "text", value: "17:00", span: true, hint: "HH:MM" }
        ],
        validate: function (v) {
          if (!/^\d{4}-\d{2}-\d{2}$/.test(v.day.trim())) return "A day must be YYYY-MM-DD.";
          if (!timeOk(v.to)) return "A time must be HH:MM on the 24-hour clock.";
          if (v.day.trim() + "T" + v.to.trim() <= sp.startedAt) return "It has to end after it started.";
          return null;
        },
        onConfirm: function (v) {
          go(function () { sp.endedAt = v.day.trim() + "T" + v.to.trim(); });
          toast("Closed at " + fmtMins(minsBetween(sp.startedAt, sp.endedAt)));
        }
      });
    },

  function nodeDialog(b, n) {
    if (!b) return;
    openModal({
      title: n ? "Edit step" : "New step",
      confirmLabel: n ? "Save" : "Add",
      message: "<b>Do</b> is work you perform. <b>Send</b> opens a wait on the people linked to it. <b>Watch</b> waits with nobody to chase. <b>Decide</b> branches along its labelled exits. <b>File</b> puts it somewhere — and a run will not close while one is undone.",
      fields: [
        { key: "label", label: "Step", type: "text", value: n ? n.label : "", span: true, placeholder: "Send draft for review" },
        { key: "act", label: "Act", type: "select", value: n ? n.act : "do",
          options: Object.keys(ACTS).map(function (k) { return { value: k, label: ACTS[k].label }; }) },
        { key: "chaseDays", label: "Chase after (days)", type: "number", min: 0, value: n ? (n.chaseDays || 0) : 0 },
        { key: "dueAt", label: "On a date (optional)", type: "text", span: true,
          value: n ? (n.dueAt || "") : "", placeholder: "YYYY-MM-DD", hint: "Leave blank unless it is genuinely dated." },
        { key: "note", label: "", type: "text", span: true, value: "",
          hint: "A Send goes to whoever is linked to it; a Decide gets its exits from the step row." }
      ],
      validate: function (v) {
        if (!v.label.trim()) return "Give the step a name.";
        if (v.dueAt && !/^\d{4}-\d{2}-\d{2}$/.test(v.dueAt.trim())) return "A date must be YYYY-MM-DD, or blank.";
        return null;
      },
      onConfirm: function (v) {
        go(function () {
          var t = n;
          if (!t) {
            t = { id: uid(), t: "step", label: "", act: "do", chaseDays: 0, dueAt: "",
                  enteredAt: "", doneAt: "", answer: "" };
            b.nodes.push(t);
          }
          t.label = v.label.trim();
          t.act = v.act;
          t.chaseDays = num(v.chaseDays);
          t.dueAt = v.dueAt.trim();
          if (typeof t.x !== "number") { autoLayout(b); }
        });
      }
    });
  }

/* ============================================================
   Shared runtime for all of these apps.

   Two rules learned the hard way, because a published page runs inside
   a sandboxed frame:
     • native confirm() silently returns false  -> never use it
     • <form> submit events never fire          -> never rely on them
   So: every confirmation is an in-page modal, and every action is an
   explicit button click with Enter wired up by hand.
   ============================================================ */

var STORE_KEY = APP.storeKey;

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function num(v) { var n = parseFloat(v); return isFinite(n) ? n : 0; }
function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }
function pad2(n) { return String(n).padStart(2, "0"); }

function iso(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
function today() { return iso(new Date()); }
function parseISO(s) { return new Date(s + "T00:00:00"); }
function addDays(dateStr, n) { var d = parseISO(dateStr); d.setDate(d.getDate() + n); return iso(d); }
function daysBetween(a, b) { return Math.round((parseISO(b) - parseISO(a)) / 86400000); }
function daysUntil(s) { return daysBetween(today(), s); }

function dayName(dateStr, style) {
  return parseISO(dateStr).toLocaleDateString(undefined, { weekday: style || "short" });
}
function niceDate(dateStr) {
  var d = daysUntil(dateStr);
  if (d === 0) return "today";
  if (d === 1) return "tomorrow";
  if (d === -1) return "yesterday";
  return parseISO(dateStr).toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
// Monday-start week containing dateStr
function weekStart(dateStr) {
  var d = parseISO(dateStr);
  var shift = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - shift);
  return iso(d);
}

/* ---------------- storage ---------------- */

function loadState(shape) {
  try {
    var raw = localStorage.getItem(STORE_KEY);
    if (!raw) return shape();
    var p = JSON.parse(raw);
    return APP.hydrate(p, shape());
  } catch (e) { return shape(); }
}
function persist(state) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  catch (e) { toast("Could not save — this browser's storage may be full or blocked."); }
}

/* ---------------- modal ---------------- */

var overlay, escHandler = null;

function closeModal() {
  overlay.innerHTML = "";
  if (escHandler) { document.removeEventListener("keydown", escHandler); escHandler = null; }
}

// fields: [{key,label,type,value,options,placeholder,step,min,hint,span,rows}]
function openModal(opts) {
  closeModal();
  var fields = opts.fields || [];

  var html = '<div class="scrim" data-scrim="1"><div class="modal"' +
    (opts.wide ? ' style="max-width:620px"' : "") +
    ' role="dialog" aria-modal="true" aria-label="' + esc(opts.title) + '">' +
    '<div class="modal-head"><h3>' + esc(opts.title) + "</h3>" +
    (opts.message ? "<p>" + opts.message + "</p>" : "") + "</div>";

  if (fields.length) {
    html += '<div class="modal-body"><div class="fields">' + fields.map(function (f) {
      var id = "mf_" + f.key, inner;
      if (f.type === "select") {
        inner = '<select id="' + id + '">' + (f.options || []).map(function (o) {
          var v = typeof o === "string" ? o : o.value;
          var l = typeof o === "string" ? o : o.label;
          return '<option value="' + esc(v) + '"' + (String(v) === String(f.value) ? " selected" : "") + ">" + esc(l) + "</option>";
        }).join("") + "</select>";
      } else if (f.type === "textarea") {
        inner = '<textarea id="' + id + '" rows="' + (f.rows || 4) + '" spellcheck="false" placeholder="' +
          esc(f.placeholder || "") + '">' + esc(f.value == null ? "" : f.value) + "</textarea>";
      } else {
        inner = '<input id="' + id + '" type="' + (f.type || "text") + '" value="' + esc(f.value == null ? "" : f.value) + '"' +
          (f.placeholder ? ' placeholder="' + esc(f.placeholder) + '"' : "") +
          (f.type === "number" ? ' step="' + (f.step || "0.01") + '"' : "") +
          (f.min != null ? ' min="' + f.min + '"' : "") + ' autocomplete="off" />';
      }
      return '<div class="field' + (f.span ? " wide" : "") + '">' +
        '<label class="label" for="' + id + '">' + esc(f.label) + "</label>" + inner +
        (f.hint ? '<span class="hint">' + esc(f.hint) + "</span>" : "") + "</div>";
    }).join("") + "</div>" + (opts.extraBody || "") + "</div>";
  } else if (opts.extraBody) {
    html += '<div class="modal-body">' + opts.extraBody + "</div>";
  }

  html += '<div class="modal-foot">' +
    '<button class="btn quiet" data-mclose="1">' + esc(opts.cancelLabel || "Cancel") + "</button>" +
    '<button class="btn ' + (opts.danger ? "danger" : "primary") + '" data-mok="1">' +
    esc(opts.confirmLabel || "Save") + "</button></div></div></div>";

  overlay.innerHTML = html;

  function collect() {
    var out = {};
    fields.forEach(function (f) {
      var el = document.getElementById("mf_" + f.key);
      out[f.key] = f.type === "number" ? num(el.value) : el.value;
    });
    return out;
  }
  function accept() {
    var v = collect();
    if (opts.validate) {
      var bad = opts.validate(v);
      if (bad) { toast(bad); return; }
    }
    closeModal();
    if (opts.onConfirm) opts.onConfirm(v);
  }

  overlay.querySelector("[data-mok]").addEventListener("click", accept);
  overlay.querySelector("[data-mclose]").addEventListener("click", function () {
    closeModal(); if (opts.onCancel) opts.onCancel();
  });
  overlay.querySelector("[data-scrim]").addEventListener("mousedown", function (e) {
    if (e.target === e.currentTarget) { closeModal(); if (opts.onCancel) opts.onCancel(); }
  });
  overlay.querySelectorAll(".modal input").forEach(function (i) {
    i.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); accept(); } });
  });
  escHandler = function (e) { if (e.key === "Escape") { closeModal(); if (opts.onCancel) opts.onCancel(); } };
  document.addEventListener("keydown", escHandler);

  var first = overlay.querySelector(".modal input, .modal select, .modal textarea");
  if (first) first.focus(); else overlay.querySelector("[data-mok]").focus();
  if (opts.afterOpen) opts.afterOpen();
}

function confirmAction(opts, onYes) {
  openModal({
    title: opts.title, message: opts.message,
    confirmLabel: opts.confirmLabel || "Delete",
    cancelLabel: opts.cancelLabel || "Keep it",
    danger: opts.danger !== false,
    onConfirm: onYes
  });
}

/* ---------------- toast + undo ---------------- */

function toast(msg, undo) {
  var box = document.getElementById("toasts");
  var el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = "<span>" + esc(msg) + "</span>";
  function remove() { if (el.parentNode) el.parentNode.removeChild(el); }
  if (undo) {
    var b = document.createElement("button");
    b.textContent = "Undo";
    b.addEventListener("click", function () { undo(); remove(); save(); render(); });
    el.appendChild(b);
  }
  box.appendChild(el);
  while (box.children.length > 3) box.removeChild(box.firstChild);
  setTimeout(remove, undo ? 7000 : 3800);
}

/* ---------------- download ---------------- */

function download(name, content, mime) {
  try {
    var blob = new Blob([content], { type: mime });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = name; a.rel = "noopener";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  } catch (e) {
    toast("This browser blocked the download. Open the saved file directly rather than in a preview frame.");
  }
}
/* A file save can be ignored outright by the browser — inside an embedded
   frame it fails with no error at all — so never claim success. Always offer
   the text too: that route cannot silently fail. */
function backupDialog(name, text, summary) {
  closeModal();
  overlay.innerHTML = '<div class="scrim" data-scrim="1"><div class="modal" style="max-width:640px" role="dialog" aria-modal="true" aria-label="Your backup">' +
    '<div class="modal-head"><h3>Your backup</h3>' +
    "<p>Two ways to keep this. <b>Save as file</b> puts it in your downloads — but some browsers block that " +
    "silently, so if nothing turns up there, use <b>Copy</b> and paste it somewhere safe. Either can be " +
    "restored later.</p></div>" +
    '<div class="modal-body">' +
    '<textarea id="bkText" readonly rows="9" spellcheck="false" ' +
    'style="width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:0.76rem;padding:0.6rem;' +
    'border-radius:8px;border:1px solid var(--rule-mid);background:var(--raised);color:var(--ink);resize:vertical">' +
    esc(text) + "</textarea>" +
    '<p class="hint" style="margin-top:0.5rem">' + (text.length / 1024).toFixed(1) + " KB" +
    (summary ? " · " + esc(summary) : "") + "</p></div>" +
    '<div class="modal-foot">' +
    '<button class="btn quiet" data-mclose="1">Done</button>' +
    '<button class="btn" id="bkFile">Save as file</button>' +
    '<button class="btn primary" id="bkCopy">Copy</button>' +
    "</div></div></div>";

  var ta = document.getElementById("bkText");
  overlay.querySelector("[data-mclose]").addEventListener("click", closeModal);
  overlay.querySelector("[data-scrim]").addEventListener("mousedown", function (e) {
    if (e.target === e.currentTarget) closeModal();
  });
  document.getElementById("bkFile").addEventListener("click", function () {
    download(name, text, "application/json");
    toast("If nothing appears in your downloads, this browser blocked it — use Copy.");
  });
  document.getElementById("bkCopy").addEventListener("click", function () {
    function fallback() {
      ta.removeAttribute("readonly");
      ta.focus();
      ta.setSelectionRange(0, ta.value.length);
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) {}
      ta.setAttribute("readonly", "readonly");
      toast(ok ? "Backup copied — paste it somewhere safe."
               : "Couldn't copy automatically. The text is selected — copy it by hand.");
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        toast("Backup copied — paste it somewhere safe.");
      }, fallback);
    } else { fallback(); }
  });
}

// describe(parsed) -> string summary, or null if it isn't one of ours
function restoreDialog(describe, onJson) {
  closeModal();
  overlay.innerHTML = '<div class="scrim" data-scrim="1"><div class="modal" style="max-width:640px" role="dialog" aria-modal="true" aria-label="Restore a backup">' +
    '<div class="modal-head"><h3>Restore a backup</h3>' +
    "<p>Paste the backup text below, or pick the .json file if you saved one. Everything currently in this " +
    "browser will be replaced — you'll get one more chance to confirm.</p></div>" +
    '<div class="modal-body">' +
    '<textarea id="rsText" rows="9" spellcheck="false" placeholder=\'{ "version": 1, … }\' ' +
    'style="width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:0.76rem;padding:0.6rem;' +
    'border-radius:8px;border:1px solid var(--rule-mid);background:var(--surface);color:var(--ink);resize:vertical"></textarea>' +
    '<div id="rsInfo" class="hint" style="margin-top:0.5rem">Nothing pasted yet.</div></div>' +
    '<div class="modal-foot">' +
    '<button class="btn quiet" data-mclose="1">Cancel</button>' +
    '<label class="btn" style="cursor:pointer">Choose a file' +
    '<input type="file" id="rsFile" accept="application/json,.json" style="display:none" /></label>' +
    '<button class="btn primary" id="rsGo">Restore</button>' +
    "</div></div></div>";

  var ta = document.getElementById("rsText");
  var info = document.getElementById("rsInfo");

  function peek() {
    var t = ta.value.trim();
    if (!t) { info.textContent = "Nothing pasted yet."; info.style.color = ""; return null; }
    var p;
    try { p = JSON.parse(t); }
    catch (e) { info.textContent = "That isn't valid JSON yet — make sure you pasted all of it."; info.style.color = "var(--warn)"; return null; }
    var sum = describe(p);
    if (!sum) { info.textContent = "Valid JSON, but it isn't a backup from this app."; info.style.color = "var(--warn)"; return null; }
    info.textContent = "Looks good — " + sum + ".";
    info.style.color = "var(--gain)";
    return p;
  }

  ta.addEventListener("input", peek);
  overlay.querySelector("[data-mclose]").addEventListener("click", closeModal);
  overlay.querySelector("[data-scrim]").addEventListener("mousedown", function (e) {
    if (e.target === e.currentTarget) closeModal();
  });
  document.getElementById("rsFile").addEventListener("change", function (e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    var r = new FileReader();
    r.onload = function () { ta.value = r.result; peek(); };
    r.readAsText(file);
  });
  document.getElementById("rsGo").addEventListener("click", function () {
    var parsed = peek();
    if (!parsed) { toast("Paste a valid backup first."); return; }
    closeModal();
    onJson(parsed);
  });
  ta.focus();
}

function csvEscape(rows) {
  return rows.map(function (r) {
    return r.map(function (c) {
      var s = String(c == null ? "" : c).replace(/"/g, '""');
      return /[",\n]/.test(s) ? '"' + s + '"' : s;
    }).join(",");
  }).join("\n");
}

/* ---------------- tooltip ---------------- */

var tipEl;
function showTip(text, x, y) {
  tipEl.textContent = text;
  tipEl.style.left = x + "px";
  tipEl.style.top = y + "px";
  tipEl.classList.add("on");
}
function hideTip() { tipEl.classList.remove("on"); }

function wireHovers(root) {
  root.querySelectorAll("[data-tip]").forEach(function (el) {
    el.addEventListener("mousemove", function (e) { showTip(el.getAttribute("data-tip"), e.clientX, e.clientY); });
    el.addEventListener("mouseleave", hideTip);
  });
}

/* ---------------- charts ---------------- */

function areaChart(points, o) {
  o = o || {};
  if (!points.length) return "";
  var W = 100, H = o.height || 40, pad = 2;
  var vals = points.map(function (p) { return p.value; });
  var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  if (o.baseZero && lo > 0) lo = 0;
  if (lo === hi) { lo -= 1; hi += 1; }
  var span = hi - lo;
  function px(i) { return pad + (points.length === 1 ? (W - 2 * pad) / 2 : i * (W - 2 * pad) / (points.length - 1)); }
  function py(v) { return H - pad - ((v - lo) / span) * (H - 2 * pad); }

  var line = points.map(function (p, i) { return (i ? "L" : "M") + px(i).toFixed(2) + " " + py(p.value).toFixed(2); }).join(" ");
  var area = line + " L" + px(points.length - 1).toFixed(2) + " " + (H - pad) + " L" + px(0).toFixed(2) + " " + (H - pad) + " Z";
  var gid = "g" + Math.random().toString(36).slice(2, 8);
  var stroke = o.color || "var(--c1)";
  var zero = (lo < 0 && hi > 0)
    ? '<line x1="' + pad + '" y1="' + py(0).toFixed(2) + '" x2="' + (W - pad) + '" y2="' + py(0).toFixed(2) +
      '" stroke="var(--rule-strong)" stroke-width="0.25" vector-effect="non-scaling-stroke" />' : "";
  var hits = points.map(function (p, i) {
    var w = (W - 2 * pad) / points.length;
    return '<rect data-tip="' + esc(p.tip || p.label) + '" x="' + (px(i) - w / 2).toFixed(2) +
      '" y="0" width="' + w.toFixed(2) + '" height="' + H + '" fill="transparent" />';
  }).join("");

  return '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none" style="height:' +
    (o.cssHeight || 100) + 'px" role="img" aria-label="' + esc(o.aria || "trend") + '">' +
    '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0%" stop-color="' + stroke + '" stop-opacity="0.26" />' +
    '<stop offset="100%" stop-color="' + stroke + '" stop-opacity="0.02" /></linearGradient></defs>' +
    zero + '<path d="' + area + '" fill="url(#' + gid + ')" />' +
    '<path d="' + line + '" fill="none" stroke="' + stroke + '" stroke-width="1.1" stroke-linejoin="round" ' +
    'stroke-linecap="round" vector-effect="non-scaling-stroke" />' +
    '<circle cx="' + px(points.length - 1).toFixed(2) + '" cy="' + py(points[points.length - 1].value).toFixed(2) +
    '" r="1.5" fill="' + stroke + '" stroke="var(--surface)" stroke-width="0.6" />' + hits + "</svg>";
}

function barChart(rows, o) {
  o = o || {};
  var H = o.height || 118;
  var max = Math.max.apply(null, rows.map(function (r) { return r.value; }).concat([o.min || 1]));
  return '<div style="display:flex;align-items:flex-end;gap:' + (o.gap || "0.4rem") +
    ';border-bottom:1px solid var(--rule-strong);padding-top:0.3rem">' +
    rows.map(function (r) {
      var h = r.value > 0 ? Math.max(Math.round(r.value / max * H), 2) : 0;
      return '<div style="flex:1;display:flex;align-items:flex-end;justify-content:center;height:' + H + 'px">' +
        '<div data-tip="' + esc(r.tip || (r.label + ": " + r.value)) + '" style="width:62%;max-width:26px;height:' + h +
        "px;background:" + (r.color || o.color || "var(--c1)") + ';border-radius:3px 3px 0 0"></div></div>';
    }).join("") + "</div>" +
    '<div style="display:flex;gap:' + (o.gap || "0.4rem") + ';margin-top:0.35rem">' +
    rows.map(function (r) {
      return '<span style="flex:1;text-align:center;font-size:0.66rem;color:var(--faint)">' + esc(r.label) + "</span>";
    }).join("") + "</div>";
}

function meter(pct, color, pacePct) {
  return '<div class="meter">' +
    (pacePct != null && pacePct > 0.02 && pacePct < 0.98
      ? '<div class="meter-pace" style="left:' + (pacePct * 100).toFixed(1) + '%"></div>' : "") +
    '<div class="meter-fill" style="width:' + (clamp(pct, 0, 1) * 100).toFixed(1) + "%;background:" + color + '"></div></div>';
}

/* ---------------- shared bits of markup ---------------- */

function pageHead(title, sub, right) {
  return '<div class="page-head"><div><h2>' + esc(title) + "</h2>" +
    (sub ? "<p>" + sub + "</p>" : "") + "</div>" + (right || "") + "</div>";
}
function notesHtml(notes, emptyMsg) {
  if (!notes.length) return '<p class="empty">' + esc(emptyMsg) + "</p>";
  return '<div class="notes">' + notes.map(function (n) {
    return '<div class="note"><span class="note-mark ' + n.tone + '">' + n.mark + "</span><div>" + n.html + "</div></div>";
  }).join("") + "</div>";
}
function tile(label, fig, foot, cls) {
  return '<div class="tile"><span class="label">' + esc(label) + '</span><div class="tile-fig' +
    (cls ? " " + cls : "") + '"' + (cls === "gain" ? ' style="color:var(--gain)"' : cls === "loss" ? ' style="color:var(--loss)"' : "") +
    ">" + fig + "</div>" + (foot ? '<div class="tile-foot">' + foot + "</div>" : "") + "</div>";
}

/* ---------------- boot harness ---------------- */

var state, view, viewEl;

function save() { persist(state); }

function renderNav() {
  document.getElementById("nav").innerHTML = APP.tabs.map(function (t) {
    return '<button class="tab" data-tab="' + t.id + '"' + (t.id === view ? ' aria-current="page"' : "") + ">" +
      '<span class="ico">' + t.ico + "</span><span>" + t.label + "</span></button>";
  }).join("");
}

function render() {
  if (APP.beforeRender) APP.beforeRender();
  renderNav();
  viewEl.innerHTML = APP.renderView(view);
  if (APP.afterRender) APP.afterRender();
  wireHovers(viewEl);
}

function boot() {
  overlay = document.getElementById("overlay");
  tipEl = document.getElementById("tip");
  viewEl = document.getElementById("view");
  state = loadState(APP.blank);
  view = APP.tabs[0].id;

  document.addEventListener("click", function (e) {
    var tab = e.target.closest("[data-tab]");
    if (tab) {
      view = tab.getAttribute("data-tab");
      hideTip();
      if (APP.onTabChange) APP.onTabChange(view);
      render();
      window.scrollTo({ top: 0, behavior: "auto" });
      return;
    }
    var act = e.target.closest("[data-act]");
    if (!act) return;
    var name = act.getAttribute("data-act");
    if (APP.actions[name]) { hideTip(); APP.actions[name](act.getAttribute("data-id"), act); }
  });

  render();
  if (APP.afterBoot) APP.afterBoot();
}


  boot();
})();
</script>

<script>
  // Registered immediately, not inside window.load. A blocked third-party
  // host once left readyState at "interactive" for ever, so the worker never
  // registered and the app installed as a shortcut instead of an app.
  if ('serviceWorker' in navigator &&
      (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  }
</script>
