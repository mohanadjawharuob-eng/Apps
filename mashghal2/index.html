  .w-phead { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .w-phead h2 { margin: 0; flex: 1; font-family: var(--display); font-weight: 500; font-size: 17px; letter-spacing: 0; }
  .w-weeks {
    display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; align-items: end; height: 92px;
  }
  .w-weeks.is-labels { height: auto; margin-top: 6px; }
  .w-week {
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px;
    height: 100%; min-width: 0;
  }
  .w-wdots { display: flex; gap: 3px; min-height: 8px; }
  .w-wdot { width: 9px; height: 9px; padding: 0; border-radius: 50%; border: 0; cursor: pointer; }
  .w-bar { width: 100%; max-width: 38px; border-radius: 5px 5px 2px 2px; background: var(--sidebar); }
  .w-bar.is-now { background: var(--blue); }
  .w-bar.is-some { background: var(--blue-border); }
  .w-wlab { font-family: var(--mono); font-size: 10.5px; color: var(--faint); text-align: center; white-space: nowrap; }
  .w-pins { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .w-pin {
    position: relative; height: 170px; border-radius: 10px; overflow: hidden; cursor: pointer;
    border: 1.5px dashed var(--rule-mid); background: var(--wash);
    display: flex; align-items: center; justify-content: center;
  }
  .w-pin.is-over { border-color: var(--blue); background: var(--blue-tint-2); }
  .w-pin.is-full { border-style: solid; border-color: var(--rule); }
  .w-pinfile { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .w-pinph { font-size: 13px; color: var(--faint); }
  .w-pin.is-full .w-pinph { display: none; }
  .w-pinimg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .w-pinx {
    position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; border-radius: 7px; border: 0;
    background: var(--code-bg); color: var(--on-ink); cursor: pointer; font-size: 15px; line-height: 1;
  }
  .w-tabs { display: flex; flex-wrap: wrap; gap: 0; margin-top: 22px; border-bottom: 1px solid var(--rule); }
  .w-tab {
    font: inherit; font-size: 14px; padding: 9px 12px; border: 0; background: none; color: var(--dim);
    box-shadow: inset 0 -2px 0 0 transparent; cursor: pointer; white-space: nowrap;
  }
  .w-tab.is-on { color: var(--ink); box-shadow: inset 0 -2px 0 0 var(--blue); }
  .w-tn { font-size: 11px; color: var(--faint); }
  .w-hint { margin: 14px 0 0; font-size: 13px; color: var(--faint); }
  .w-day { margin: 22px 0 8px; font-family: var(--mono); font-size: 12px; color: var(--faint); }
  .w-stream { background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; }
  .w-srec {
    display: flex; align-items: flex-start; gap: 12px; width: 100%; padding: 12px 16px; border: 0;
    border-bottom: 1px solid var(--rule-soft); background: transparent; font: inherit; color: inherit;
    text-align: left; cursor: pointer;
  }
  .w-srec:last-child { border-bottom: 0; }
  .w-srec.is-sel { background: var(--selected); }
  .w-snip { display: block; font-size: 13px; line-height: 1.5; color: var(--dim); margin-top: 2px;
    white-space: pre-line; overflow-wrap: anywhere; }

  /* ---- the record pane ---- */
  .w-pane {
    width: clamp(400px, 36vw, 440px); flex: none; position: sticky; top: 77px; height: calc(100vh - 77px);
    overflow: auto; background: var(--sheet); border-left: 1px solid var(--rule); padding: 22px 24px 40px;
  }
  .w-scrim { display: none; }
  .w-phead2 { display: flex; align-items: center; gap: 8px; }
  .w-ptype {
    flex: 1; font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  }
  .w-pclose {
    width: 30px; height: 30px; border: 1px solid var(--rule); border-radius: 8px; background: none;
    font-size: 16px; color: var(--dim); cursor: pointer; white-space: nowrap; flex: none;
  }
  .w-ptitle {
    margin: 12px 0 0; font-family: var(--display); font-weight: 500; font-size: 26px; line-height: 1.15;
    letter-spacing: -0.02em; overflow-wrap: anywhere;
  }
  .w-pmeta { margin: 8px 0 0; font-size: 13px; color: var(--dim); }
  .w-dark {
    margin-top: 14px; font: inherit; font-size: 14px; font-weight: 600; padding: 7px 14px; border-radius: 9px;
    border: 1px solid var(--ink); background: var(--ink); color: var(--on-ink); cursor: pointer; white-space: nowrap;
  }
  .w-seg {
    display: flex; gap: 0; margin-top: 14px; border: 1px solid var(--rule-mid); border-radius: 10px;
    overflow: hidden; width: fit-content;
  }
  .w-segb {
    font: inherit; font-size: 13px; padding: 7px 13px; border: 0; border-right: 1px solid var(--rule);
    background: var(--sheet); color: var(--ink-2); cursor: pointer; white-space: nowrap;
  }
  .w-segb:last-child { border-right: 0; }
  .w-segb.is-on { background: var(--ink); color: var(--on-ink); }
  .w-phelp { margin: 8px 0 0; font-size: 12px; color: var(--faint); }
  .w-pbody { margin: 18px 0 0; font-size: 15px; line-height: 1.65; white-space: pre-wrap; text-wrap: pretty; }
  .w-pcode {
    margin: 18px 0 0; padding: 14px; border-radius: 10px; background: var(--code-bg); color: var(--code-ink);
    font-family: var(--mono); font-size: 12.5px; line-height: 1.6; overflow: auto; white-space: pre;
  }
  .w-ppath {
    display: flex; align-items: center; gap: 8px; margin-top: 18px; padding: 10px 12px;
    border: 1px solid var(--rule); border-radius: 10px; background: var(--wash);
  }
  .w-ppath .w-mono { font-size: 12.5px; overflow-wrap: anywhere; }
  .w-pbtn {
    flex: none; font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 7px;
    border: 1px solid var(--rule-mid); background: var(--sheet); color: var(--ink); cursor: pointer;
    white-space: nowrap; text-decoration: none;
  }
  .w-pbtn.is-danger:hover { background: var(--late-bg); color: var(--late); border-color: var(--late-bg); }
  .w-pq { margin: 20px 0 8px; font-size: 13px; color: var(--dim); }
  .w-conn { display: flex; align-items: baseline; gap: 8px; margin: 26px 0 10px; }
  .w-clabel2 {
    margin: 0; flex: 1; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--faint);
  }
  .w-linkbox {
    margin-bottom: 12px; padding: 10px; border: 1px solid var(--blue-border); border-radius: 10px;
    background: var(--link-tint);
  }
  .w-linkbox input {
    width: 100%; font: inherit; font-size: 14px; padding: 7px 10px; border: 1px solid var(--rule-strong);
    border-radius: 8px; background: var(--sheet); color: var(--ink);
  }
  .w-graph {
    position: relative; height: 250px; border: 1px solid var(--rule); border-radius: 12px;
    background: var(--wash); overflow: hidden;
  }
  .w-gedge {
    position: absolute; pointer-events: none; height: 1.5px; background: var(--graph-edge); transform-origin: 0 50%;
  }
  .w-gcentre {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); max-width: 150px;
    padding: 7px 11px; border-radius: 10px; background: var(--ink); color: var(--on-ink);
    font-size: 12px; font-weight: 600; text-align: center; line-height: 1.3;
  }
  .w-gnode {
    position: absolute; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 5px;
    max-width: 124px; padding: 4px 8px; border-radius: 999px; border: 1px solid var(--rule-mid);
    background: var(--sheet); font: inherit; font-size: 11px; color: var(--ink); cursor: pointer;
    white-space: nowrap;
  }
  .w-gnode:hover { border-color: var(--spoke); }
  .w-gnode:active { transform: translate(-50%, calc(-50% + 1px)); }
  .w-plinks { margin-top: 10px; }
  .w-plink { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--rule-soft); }
  .w-plbtn {
    display: flex; align-items: center; gap: 10px; padding: 9px 0; border: 0; background: none; font: inherit;
    color: inherit; text-align: left; cursor: pointer; font-size: 13px;
  }
  .w-cut {
    flex: none; width: 24px; height: 24px; border: 0; border-radius: 6px; background: none;
    color: var(--faint); cursor: pointer; white-space: nowrap;
  }
  .w-cut:hover { background: var(--late-bg); color: var(--late); }

  /* ---- the key card, and the toast ---- */
  .w-keys {
    position: fixed; right: 24px; bottom: 24px; z-index: 60; width: 280px; padding: 16px 18px;
    border-radius: 14px; background: var(--ink); color: var(--on-ink); box-shadow: var(--sh-keys);
  }
  .w-khead { display: flex; align-items: center; margin-bottom: 10px; }
  .w-khead b { flex: 1; font-family: var(--display); font-weight: 500; font-size: 16px; }
  .w-khead button { border: 0; background: none; color: var(--on-ink); font-size: 16px; cursor: pointer; }
  .w-kgrid { display: grid; grid-template-columns: auto 1fr; gap: 7px 14px; font-size: 13px; }
  .w-kk { color: var(--keys-ink); white-space: nowrap; }
  .toasts > .toast {
    display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 10px; border: 0;
    background: var(--ink); color: var(--on-ink); font-size: 14px; box-shadow: var(--sh-toast);
  }
  .toasts .toast button {
    font: inherit; font-size: 12px; padding: 3px 9px; border-radius: 6px; border: 1px solid var(--faint);
    background: none; color: var(--on-ink); cursor: pointer; white-space: nowrap;
  }
  .toasts .toast button:hover { border-color: var(--on-ink); }

  /* ---- Library ---- */
  .w-lead.is-62 { max-width: 62ch; }
  .w-subjects { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 24px 0 0; }
  .w-subj {
    font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--rule-mid);
    background: var(--sheet); color: var(--ink-2); cursor: pointer; white-space: nowrap;
  }
  .w-subj .w-mono { font-size: 11px; }
  .w-subj.is-on { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
  .w-tabs.is-lib { margin-top: 16px; }
  .w-shelf { margin-top: 34px; }
  .w-shead {
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding-bottom: 10px; margin-bottom: 14px;
    border-bottom: 1px solid var(--rule);
  }
  .w-ssq { width: 10px; height: 10px; border-radius: 3px; align-self: center; }
  .w-shead h2 { margin: 0; font-family: var(--display); font-weight: 500; font-size: 22px; letter-spacing: -0.015em; }
  .w-sline { flex: 1 1 16rem; font-size: 13px; color: var(--faint); text-align: right; }
  .w-lgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(250px, 100%), 1fr)); gap: 14px; }
  .w-lcard {
    display: flex; flex-direction: column; gap: 10px; min-width: 0; padding: 14px 15px; border: 1px solid var(--rule);
    border-radius: 12px; background: var(--sheet); font: inherit; color: inherit; text-align: left; cursor: pointer;
  }
  .w-lcard:hover { border-color: var(--hover-border); }
  .w-lcard.is-sel { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
  .w-ltitle { font-family: var(--display); font-size: 16px; line-height: 1.3; }
  .w-lcode {
    display: block; max-height: 78px; overflow: hidden; padding: 10px 11px; border-radius: 8px; background: var(--code-bg);
    color: var(--code-ink); font-family: var(--mono); font-size: 11.5px; line-height: 1.55; white-space: pre;
  }
  .w-ltext {
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; font-size: 13px;
    line-height: 1.55; color: var(--dim);
  }
  .w-lcite {
    display: block; padding-left: 10px; border-left: 2px solid var(--rule); font-family: var(--serif); font-size: 13px;
    line-height: 1.5; color: var(--ink-2);
  }
  .w-lpath {
    display: block; padding: 7px 9px; border-radius: 7px; background: var(--inset); font-family: var(--mono);
    font-size: 11.5px; color: var(--ink-2); overflow-wrap: anywhere;
  }
  .w-ltags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: auto; }
  .w-tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--sidebar); color: var(--ink-2); white-space: nowrap; }
  .w-tag.is-skill { background: var(--blue-tint-2); color: var(--blue-deep); }
  .w-tag.is-now { background: var(--today-bg); color: var(--today); }
  .w-tag.is-amber { background: var(--amber-bg); color: var(--amber); }

  /* ---- Record ---- */
  .w-h1.is-flush { margin-top: 0; }
  .w-rgrid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); gap: 22px;
    margin-top: 28px; align-items: start;
  }
  .w-h2s { margin: 0 0 12px; font-family: var(--display); font-weight: 500; font-size: 20px; letter-spacing: 0; }
  .w-rcol { display: flex; flex-direction: column; gap: 10px; }
  .w-scard { background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; padding: 14px 16px; }
  .w-scrow { display: flex; align-items: baseline; gap: 10px; }
  .w-sname {
    flex: 1; border: 0; background: none; padding: 0; font-family: var(--display); font-size: 17px; color: var(--ink);
    text-align: left; cursor: pointer;
  }
  .w-scount2 { font-size: 12px; color: var(--dim); white-space: nowrap; }
  .w-scount2.is-amber { color: var(--amber); }
  .w-evs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .w-evs:empty { display: none; }
  .w-ev {
    display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 12px; padding: 3px 9px;
    border-radius: 999px; border: 1px solid var(--rule); background: var(--wash); color: var(--ink-2);
    cursor: pointer; max-width: 100%;
  }
  .w-cvhead { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  .w-cvhead .w-h2s { margin: 0; flex: 1; }
  .w-cv {
    background: #fff; border: 1px solid var(--rule); border-radius: 6px; padding: 28px 30px; box-shadow: var(--sh-cv);
  }
  .w-cvname { margin: 0; font-family: var(--display); font-size: 24px; }
  .w-cvsub { margin: 2px 0 0; font-size: 13px; color: var(--dim); }
  .w-cvh {
    margin: 16px 0 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--faint);
  }
  .w-cvsub + .w-cvh, .w-cvname + .w-cvh { margin-top: 20px; }
  .w-cvl { margin: 0 0 6px; font-size: 13px; line-height: 1.6; }
  .w-cvl b { font-weight: 600; }
  .w-cvl.is-none { color: var(--faint); }
  .w-cvw { color: var(--faint); }
  .w-cvwhat { margin: 16px 0 8px; font-size: 13px; color: var(--dim); }
  .w-empty.is-tight { margin: 0; }

  /* ---- Weekly review ---- */
  .w-steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 24px 0 22px; }
  .w-step {
    display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border: 1px solid var(--rule);
    border-radius: 10px; background: transparent; font: inherit; color: inherit; text-align: left; cursor: pointer; min-width: 0;
  }
  .w-step.is-on { border-color: var(--ink); background: var(--sheet); }
  .w-step.is-on .w-stepl { font-weight: 600; }
  .w-stepn { font-size: 11px; color: var(--faint); }
  .w-stepl { font-size: 14px; }
  .w-stephead { padding: 16px 18px 12px; }
  .w-stephead h2 { margin: 0; font-family: var(--display); font-weight: 500; font-size: 20px; letter-spacing: 0; }
  .w-stephead p { margin: 4px 0 0; font-size: 14px; color: var(--dim); }
  .w-irow.is-review { padding: 12px 18px; }
  .w-stepempty { margin: 0; padding: 14px 18px 18px; border-top: 1px solid var(--rule-soft); font-size: 14px; color: var(--today); }
  .w-stepfoot {
    display: flex; justify-content: space-between; gap: 10px; padding: 12px 18px; border-top: 1px solid var(--rule-soft);
    background: var(--wash);
  }
  .w-light {
    font: inherit; font-size: 14px; padding: 7px 14px; border-radius: 9px; border: 1px solid var(--rule-mid);
    background: var(--sheet); color: var(--ink-2); cursor: pointer; white-space: nowrap;
  }
  .w-dark.is-foot { margin-top: 0; padding: 7px 16px; }

  /* ---- Map: a graph of every record ---- */
  .g-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 18px; }
  .g-chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;
    border: 1px solid var(--rule); background: var(--sheet); font: inherit; font-size: 13px; color: var(--dim);
    cursor: pointer;
  }
  .g-chip .w-mono { font-size: 11px; }
  .g-chip.is-on { color: var(--ink); border-color: var(--rule-strong); }
  .g-chip:not(.is-on) .g-csq { opacity: 0.35; }
  .g-csq { width: 9px; height: 9px; border-radius: 2.5px; flex: none; }
  .g-wrap { margin-top: 14px; }
  .g-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .g-sp { flex: 1 1 0; }
  .g-q {
    flex: 0 1 17rem; min-width: 0; height: 32px; padding: 0 10px; border: 1px solid var(--rule-mid); border-radius: 9px;
    background: var(--sheet); font: inherit; font-size: 14px; color: var(--ink);
  }
  .g-tb {
    height: 32px; padding: 0 11px; border: 1px solid var(--rule-mid); border-radius: 9px; background: var(--sheet);
    font: inherit; font-size: 13.5px; color: var(--ink-2); cursor: pointer; white-space: nowrap;
  }
  .g-tb[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); }
  .g-tb:disabled { color: var(--faint); cursor: default; border-color: var(--rule); }
  .g-tb:hover:not(:disabled) { border-color: var(--hover-border); }
  .g-local { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--ink-2); }
  /* PICKING A NODE MAY NOT MOVE THE SHEET UNDER THE FINGER. Wrapped, the
     strip grew to three lines on a phone the moment a node was picked and
     pushed the sheet 85px down, so the next press landed on something
     else. It is one row of a stated height that scrolls sideways. */
  .g-strip {
    display: flex; flex-wrap: nowrap; align-items: center; gap: 6px; height: 48px; margin-top: 8px;
    overflow-x: auto; overflow-y: hidden; scrollbar-width: thin;
  }
  .g-strip > * { flex: none; }
  .g-sname {
    display: inline-flex; align-items: center; gap: 7px; margin-right: 6px; font-size: 14.5px;
    max-width: min(22rem, 45vw);
  }
  .g-sname b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .g-shint { font-size: 13.5px; color: var(--faint); }
  .g-sb, .g-mrow {
    font: inherit; font-size: 13.5px; padding: 6px 11px; border-radius: 9px; border: 1px solid var(--rule-mid);
    background: var(--sheet); color: var(--ink-2); cursor: pointer; white-space: nowrap;
  }
  .g-sb.is-loud, .g-mrow.is-loud { color: var(--ink); font-weight: 600; border-color: var(--ink); }
  .g-sb.is-danger, .g-mrow.is-danger { color: var(--dim); }
  .g-sb.is-danger:hover, .g-mrow.is-danger:hover { color: var(--late); border-color: var(--late); }
  .g-box {
    position: relative; height: max(360px, calc(100vh - 360px)); border: 1px solid var(--rule); border-radius: 14px;
    overflow: hidden; background-color: var(--wash-2);
    background-image: linear-gradient(to right, var(--rule-soft) 1px, transparent 1px),
      linear-gradient(to bottom, var(--rule-soft) 1px, transparent 1px);
  }
  .g-sheet { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; user-select: none; }
  .g-sheet:active { cursor: grabbing; }
  .g-sheet:focus-visible { outline: 2px solid var(--blue); outline-offset: -3px; }
  .g-e .g-ehit { stroke: transparent; stroke-width: 12; cursor: pointer; }
  .g-e .g-eln { stroke: var(--graph-edge); stroke-width: 1.4; pointer-events: none; }
  .g-e.is-in .g-eln { stroke-dasharray: 5 4; stroke: var(--rule-strong); }
  .g-e.is-wiki .g-eln { stroke-dasharray: 1.5 4; stroke-linecap: round; stroke-width: 2; }
  .g-e.is-hot .g-eln { stroke: var(--ink-2); stroke-width: 2; }
  .g-e.is-sel .g-eln { stroke: var(--ink); stroke-width: 2.6; }
  .g-e.is-dim { opacity: 0.2; }
  .g-cut { cursor: pointer; }
  .g-cut circle { fill: var(--sheet); stroke: var(--ink); stroke-width: 1.5; }
  .g-cut path { stroke: var(--ink); stroke-width: 1.8; stroke-linecap: round; }
  .g-n { cursor: pointer; }
  .g-n .g-rect { fill: var(--sheet); stroke: var(--rule-mid); stroke-width: 1; }
  .g-n.t-bench .g-rect { stroke: var(--rule-strong); stroke-width: 1.4; }
  .g-n.is-hot .g-rect { stroke: var(--ink-2); }
  .g-n.is-local .g-rect { stroke-dasharray: 4 3; stroke: var(--ink); }
  .g-n.is-sel .g-rect { stroke: var(--ink); stroke-width: 2.2; }
  .g-n.is-late .g-rect { stroke: var(--late); stroke-width: 1.6; }
  .g-n.is-sel.is-late .g-rect { stroke-width: 2.4; }
  .g-n.is-dim { opacity: 0.22; }
  .g-n.is-done .g-lab { fill: var(--dim); text-decoration: line-through; }
  .g-lab { fill: var(--ink); font-family: var(--sans); font-size: 13px; }
  .g-n.t-bench .g-lab { font-family: var(--display); font-size: 16px; }
  .g-st { fill: var(--today); font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.04em; }
  .g-st.is-late { fill: var(--late); }
  .g-hand { fill: var(--sheet); stroke: var(--blue); stroke-width: 2; cursor: crosshair; }
  .g-hand:hover { fill: var(--blue-tint); }
  .g-draw { stroke: var(--blue); stroke-width: 2; stroke-dasharray: 6 4; pointer-events: none; }
  .g-foot { margin: 8px 0 0; font-size: 13px; color: var(--faint); }
  .g-keys { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 6px 0 0; font-size: 12.5px; color: var(--faint); }
  .g-keys .w-mono { color: var(--ink-2); }
  .g-menu {
    position: fixed; z-index: 80; min-width: 180px; max-height: calc(100vh - 16px); overflow-y: auto;
    overscroll-behavior: contain; display: flex; flex-direction: column; gap: 2px; padding: 5px;
    border: 1px solid var(--rule-mid); border-radius: 12px; background: var(--sheet); box-shadow: var(--sh-drop);
  }
  .g-menu .g-mrow { border-color: transparent; text-align: left; }
  .g-menu .g-mrow:hover, .g-menu .g-mrow:focus-visible { background: var(--row-hover); }
  .g-menu .g-mrow.is-loud { border-color: transparent; }
  /* Full screen is a fixed box over the page, not the Fullscreen API: that
     is refused without a gesture, swallows dialogs, and is left by a
     different key on every platform. Above the page's own chrome, below
     the storage alarm and the overlay. */
  .g-wrap.is-max {
    position: fixed; inset: 0; z-index: 55; margin: 0; padding: 12px 14px; background: var(--paper);
    display: flex; flex-direction: column;
  }
  .g-wrap.is-max .g-host { flex: 1 1 auto; min-height: 0; }
  .g-wrap.is-max .g-box { height: 100%; }
  html.g-maxed { overflow: hidden; }

  /* ---- files, and the folder tree ---- */
  .w-dropall {
    position: fixed; inset: 0; z-index: 85; display: flex; align-items: center; justify-content: center;
    background: rgba(29, 28, 25, 0.28); pointer-events: none;
  }
  .w-dropall[hidden] { display: none; }
  .w-dropcard {
    display: flex; flex-direction: column; gap: 6px; max-width: 26rem; margin: 16px; padding: 22px 26px;
    border: 2px dashed var(--blue); border-radius: 18px; background: var(--sheet); box-shadow: var(--sh-drop);
  }
  .w-dropcard b { font-family: var(--display); font-weight: 500; font-size: 22px; }
  .w-dropcard span { font-size: 14px; line-height: 1.5; color: var(--ink-2); }
  .w-fprev { margin-top: 14px; }
  .w-fbox { margin-top: 8px; border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; background: var(--wash-2); }
  .w-fbox > .w-phelp { margin: 12px; }
  .w-fimg { display: block; max-width: 100%; max-height: 50vh; margin: 0 auto; }
  .w-fpdf { display: block; width: 100%; height: 50vh; border: 0; background: var(--sheet); }
  .w-fbtns { display: flex; gap: 8px; margin-top: 8px; }
  .w-pfold { margin: 12px 0 0; font-size: 13.5px; color: var(--dim); }
  .w-pfold b { color: var(--ink-2); font-weight: 600; }
  .w-lthumb {
    display: flex; align-items: center; justify-content: center; height: 96px; margin-top: 8px; border-radius: 8px;
    background: var(--wash-2); overflow: hidden; font-family: var(--mono); font-size: 12px; color: var(--dim);
  }
  .w-lthumb.is-img > span { display: none; }
  .w-lthumb img { width: 100%; height: 100%; object-fit: cover; }
  .w-seg.is-libby { margin-top: 18px; }
  .w-fwrap { display: grid; grid-template-columns: minmax(12rem, 15rem) minmax(0, 1fr); gap: 22px; margin-top: 22px; align-items: start; }
  .w-ftree {
    display: flex; flex-direction: column; gap: 1px; padding: 8px; border: 1px solid var(--rule); border-radius: 12px;
    background: var(--sheet); position: sticky; top: 100px;
  }
  .w-frow {
    display: flex; align-items: center; gap: 7px; min-height: 34px; padding: 5px 10px; border: 1px solid transparent;
    border-radius: 8px; background: none; font: inherit; font-size: 14px; color: var(--ink-2); text-align: left; cursor: pointer;
  }
  .w-frow .w-mono { font-size: 11px; color: var(--dim); }
  .w-frow:hover { background: var(--row-hover); }
  .w-frow.is-on { background: var(--selected); color: var(--ink); font-weight: 600; }
  .w-frow.is-over { border-color: var(--blue); background: var(--blue-tint); }
  .w-fico { font-size: 11px; color: var(--dim); }
  .w-fnew { margin: 8px 2px 2px; align-self: flex-start; }
  .w-fmain { min-width: 0; }
  .w-crumbs { margin: 0; font-size: 13.5px; color: var(--dim); }
  .w-crumbs b { color: var(--ink); font-weight: 600; }
  .w-fhead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; }
  .w-fhead .w-h2 { margin: 0; }
  .w-fnote { margin: 20px 0 0; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
  .w-fmain .w-lgrid { margin-top: 14px; }
  .w-fmain > .w-fnote:first-child { margin-top: 0; }

  .w-ptabs { display: none; }

  /* ---- the older screens, inside the new shell ---- */
  .w-main .page-head h2 { font-size: 30px; letter-spacing: -0.02em; }

  .w-chev { font-size: 18px; color: var(--faint); align-self: center; }
  .w-stream.is-more { margin-top: 22px; }
  .w-bgrid.is-list { margin-top: 22px; }
  .w-btitle.is-idea { font-style: italic; }

  /* ================= the phone =================

     Under 880px, as the handoff's phone reference draws it: the line moves
     to the bottom, where the thumb already is, with a keep button and a
     row of tabs under it; the benches become a swipe row above what needs
     you; and a record opens as a sheet over the list rather than a pane
     beside it. */
  @media (max-width: 879px) {
    html { scroll-padding-top: 16px; scroll-padding-bottom: 150px; }
    .w-app { display: block; }
    .w-side { display: none; }
    .w-top {
      position: fixed; top: auto; left: 0; right: 0; bottom: calc(34px + env(safe-area-inset-bottom, 0px));
      z-index: 40; border-bottom: 0; padding: 10px 14px 6px;
      background: linear-gradient(to top, var(--paper) 70%, rgba(245, 243, 238, 0));
    }
    .w-linewrap { max-width: none; }
    .w-line {
      height: 52px; padding: 0 6px 0 14px; border-radius: 16px;
      box-shadow: 0 8px 20px -12px rgba(40, 30, 10, 0.4);
    }
    .w-line > svg, .w-line .w-kbd { display: none; }
    .w-keep {
      display: block; flex: none; width: 40px; height: 40px; border-radius: 12px; border: 0;
      background: var(--blue); color: #fff; font-size: 20px; cursor: pointer;
    }
    .w-drop { top: auto; bottom: 60px; max-height: 60vh; }
    .w-ptabs {
      display: flex; justify-content: space-around; position: fixed; left: 0; right: 0; bottom: 0; z-index: 41;
      padding: 2px 8px calc(6px + env(safe-area-inset-bottom, 0px)); background: var(--paper);
    }
    .w-ptab {
      flex: 1; min-height: 32px; border: 0; background: none; font: inherit; font-size: 12px; color: var(--dim);
      cursor: pointer; white-space: nowrap;
    }
    .w-ptab.is-on { font-weight: 600; color: var(--ink); }
    .w-app .view.w-main { padding: 22px 18px 170px; }
    .w-h1 { font-size: 30px; letter-spacing: -0.02em; margin-top: 4px; }
    .w-h1.is-today { font-size: 30px; }
    .w-eyebrow { font-size: 11px; }
    .w-lead { font-size: 14px; margin-top: 6px; }

    /* Today: the benches come first, as a row you swipe. */
    body[data-view="today"] .w-main { display: flex; flex-direction: column; }
    body[data-view="today"] .w-main > .w-eyebrow,
    body[data-view="today"] .w-main > .w-h1,
    body[data-view="today"] .w-main > .w-lead { order: -2; }
    body[data-view="today"] .w-benchsec { order: -1; }
    .w-benchsec .w-h2 { display: none; }
    .w-benchsec .w-bgrid {
      display: flex; gap: 10px; overflow-x: auto; margin: 18px -18px 0; padding: 0 18px 4px;
      scroll-snap-type: x mandatory; scroll-padding: 0 18px;
    }
    .w-benchsec .w-bcard { flex: none; width: 170px; padding: 12px; gap: 6px; border-radius: 12px; scroll-snap-align: start; }
    .w-benchsec .w-brole, .w-benchsec .w-brecent, .w-benchsec .w-bhours { display: none; }
    .w-benchsec .w-btitle { font-size: 15px; }
    .w-benchsec .w-bnext { font-size: 12px; }
    .w-two { margin-top: 22px; }
    .w-arow { min-height: 56px; padding: 8px 14px; }
    .w-tick { width: 28px; height: 28px; border-radius: 8px; font-size: 15px; }
    .w-abtn { min-height: 44px; }
    .w-chip { padding: 7px 11px; }
    .w-steps { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .w-sline { text-align: left; }

    /* The pane is a sheet: 62% of the height, a handle, a dimmed ground
       that closes it on a tap. */
    .w-scrim {
      display: block; position: fixed; inset: 0; z-index: 64; background: rgba(29, 28, 25, 0.35);
    }
    .w-scrim[hidden] { display: none; }
    .w-pane {
      position: fixed; top: auto; left: 0; right: 0; bottom: 0; width: auto; height: 62vh; z-index: 65;
      border-left: 0; border-radius: 22px 22px 0 0; padding: 10px 20px 40px;
      box-shadow: 0 -12px 30px -12px rgba(0, 0, 0, 0.3);
    }
    .w-pane::before {
      content: ""; display: block; width: 40px; height: 5px; border-radius: 3px; background: var(--rule-mid);
      margin: 0 auto 14px;
    }
    .w-ptitle { font-size: 24px; }
    .w-pane .w-dark { width: 100%; min-height: 48px; border-radius: 12px; font-size: 15px; }
    .w-plbtn { min-height: 44px; }
    .toasts { bottom: calc(110px + env(safe-area-inset-bottom, 0px)); }
    /* The map's kinds are one row you swipe on a phone: wrapped, twenty
       of them took most of a screen above the sheet they filter. */
    .g-chips {
      flex-wrap: nowrap; overflow-x: auto; margin: 14px -18px 0; padding: 0 18px 4px; scrollbar-width: none;
    }
    .g-chip { flex: none; }
    .g-q { flex: 1 1 100%; }
    .g-sp { display: none; }
    .g-box { height: max(340px, calc(100vh - 330px)); }
    .g-keys { display: none; }
    /* The tree goes above the list on a phone, as a row of folders. */
    .w-fwrap { grid-template-columns: minmax(0, 1fr); gap: 14px; }
    .w-ftree { position: static; }
    .w-keys { bottom: 120px; right: 12px; }
  }
</style>

<body>


<!-- THE WORKBENCH SHELL: a sidebar, then a column holding the capture line
     over the screen and the record pane beside it. On a phone the line
     moves to the bottom and the pane becomes a sheet (see the phone rules
     in 02b-wb.css). -->
<div class="w-app">
  <aside class="w-side" id="side">
    <div class="w-brand">
      <svg viewBox="0 0 512 512" width="24" height="24" fill="none" aria-hidden="true">
        <path d="M300 168 L372 130" stroke="var(--spoke)" stroke-width="16" stroke-dasharray="2 34" stroke-linecap="round"/>
        <circle cx="392" cy="120" r="30" stroke="var(--spoke)" stroke-width="18"/>
        <circle cx="216" cy="196" r="80" stroke="var(--blue)" stroke-width="42"/>
        <path d="M216 276 C216 344 292 352 292 424" stroke="var(--blue)" stroke-width="42" stroke-linecap="round"/>
        <circle cx="292" cy="424" r="24" fill="var(--today)"/>
      </svg>
      <span id="brandName">Mashghal</span>
    </div>
    <nav id="nav" class="w-nav" aria-label="Sections"></nav>
    <div class="w-sidework" id="sideWork"></div>
    <div class="w-foot" id="railFoot"></div>
  </aside>

  <div class="w-col">
    <div class="w-top">
      <div class="w-linewrap">
        <div class="w-line">
          <svg viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="var(--faint)" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="8.8" cy="8.8" r="5.3"/><path d="M12.8 12.8l4 4"/></svg>
          <span class="w-ctx" id="lineCtx" hidden></span>
          <input id="line" type="text" autocomplete="off" spellcheck="false"
                 placeholder="Type anything to keep it · search · or ask: what needs me?"
                 aria-label="Capture, search or ask" />
          <span class="w-kbd">Ctrl K</span>
          <button class="w-keep" id="lineKeep" aria-label="Keep it">↑</button>
        </div>
        <div class="w-drop" id="drop" hidden></div>
      </div>
    </div>
    <div class="w-body">
      <main class="view w-main" id="view"></main>
      <div class="w-scrim" id="paneScrim" hidden></div>
      <aside class="w-pane" id="pane" hidden aria-label="Record"></aside>
    </div>
  </div>
</div>

<!-- The phone's tab row. The runtime draws the sidebar's nav; this is the
     same four places at the bottom of a phone, drawn by the app. -->
<nav class="w-ptabs" id="ptabs" aria-label="Sections"></nav>

<div class="w-keys" id="keys" role="dialog" aria-label="Keyboard" hidden></div>

<!-- Every confirmation and every refused form speaks through here, so it has
     to be a live region: the toast is the only channel validation has. -->
<div class="alarm" id="alarm" role="alert" aria-live="assertive"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite" aria-atomic="false"></div>
<div class="tip" id="tip" role="status" aria-live="polite"></div>
<div id="overlay"></div>

<script>
(function () {
  "use strict";

  /* ============================================================
     MASHGHAL — My Career & Work Hub.

     One sentence, and it is the whole reset:

       Mashghal is not a productivity app with career features added to it.
       It is a personal Career & Work Hub in which professional identity,
       experience, training, skills, projects, workflows, actions,
       knowledge, assets, outputs, portfolio evidence, timelines and CVs are
       different connected VIEWS of the same underlying professional record.

     Which is why this file is the records and the relationships, and not a
     screen. The plan's §32 and §24 both say the same thing in different
     words — build the entities and the relationships outward, never the
     screens inward — and the last three rounds of this app did the
     opposite, which is the fault its owner named.

     THE THREE WORLDS. Everything is filed under one of them, and the two
     cross-cutting views are built from all three:

       CAREER      who I am professionally   profile · education · roles ·
                                             training · skills
       WORK        what I am doing and did   jobs · projects · workflows ·
                                             runs · actions · people ·
                                             assets · outputs · hours
       KNOWLEDGE   what I know and reuse     the library: scripts,
                                             formulas, methods, templates,
                                             references, places

       PORTFOLIO   what I can show           a selection, never a copy
       CV          a presentation of it      a selection, never the truth

     ONE RULE ABOVE THE REST: the same record appears in six places and is
     one record. "Historical Tripoli GIS" is a project on Work, evidence of
     experience on Career, a card in the Portfolio, a 2026 event on the
     Timeline, evidence under the GIS skill, and a bullet in a CV. Six
     views. Not six copies.

     AND WHAT THIS APP WILL NOT DO, because the plan says so in §27 and
     because every earlier round of it drifted toward doing exactly this:
     it does not infer a skill, score an experience, rate a proficiency,
     measure productivity or predict a career. Where something is unknown
     it says "not said". Where a figure is derived it names what from.
     ============================================================ */

  /* The shared runtime reads `APP.storeKey` on its very first line, so the
     object has to exist before that block runs — it is assigned at the
     foot of the app's own code. */
  var APP;

  var BUILD = "w11 · 26 Sep 2026";

  /* Its own storage, and this is not cosmetic. `localStorage` is scoped to
     the SITE and not the folder — which is exactly how Coffer's two paths
     came to share one ledger, and how loading the sample in one wiped the
     real book in the other. `mashghal2.hub` is a new name beside the two
     older ones, so neither w3's book nor w4's is read, written or lost;
     each is OFFERED for import, once, and brought in only on a tap. */
  var STORE_KEY_APP = "mashghal2.hub";
  var OLD_KEYS = [
    { key: "mashghal2.v2", what: "the card-and-link rebuild", list: "cards" },
    { key: "mashghal2.v1", what: "the workspace rebuild", list: "projects" }
  ];
  var THEME_KEY = "mashghal2.theme";

  /* ============================================================
     THE RECORDS.

     Seventeen lists and one profile. `STATE_LISTS`, `STATE_MAPS` and
     `adoptState`'s own settings block are the ONLY places any of them is
     named — Coffer lost grants out of a restored backup because two sites
     hand-copied one key list and only one of them was updated.
     ============================================================ */

  function blank() {
    return {
      version: 1,

      /* ---- CAREER ---- */
      profile: {
        name: "", headline: "", fields: "", interests: "",
        email: "", phone: "", site: "", place: "", summary: ""
      },
      education: [],   // {id,institution,degree,field,startedOn,endedOn,place,note}
      jobs: [],        // {id,name,kind,place,url,note}          — the employer
      roles: [],       // {id,jobId,title,startedOn,endedOn,place,duties,note}
      training: [],    // {id,name,institution,kind,startedOn,endedOn,place,path,url,note}
      skills: [],      // {id,name,group,level,note}             — level typed or blank

      /* ---- WORK ---- */
      projects: [],    // {id,name,jobId,roleId,startedOn,endedOn,status,note}
      workflows: [],   // {id,name,note,steps:[{id,name,note}]}  — the procedure
      runs: [],        // {id,workflowId,projectId,startedOn,endedOn,outcome,note}
      actions: [],     // {id,name,kind,projectId,when,waitOn,chaseDays,chasedOn,doneAt,note}
      people: [],      // {id,name,org,role,email,note}
      assets: [],      // {id,name,kind,place,state,lastUsedOn,path,url,note}
      outputs: [],     // {id,name,kind,projectId,on,path,url,note}
      hours: [],       // {id,projectId,on,minutes,note}
      notes: [],       // {id,name,kind:"note"|"meeting"|"idea",projectId,on,body,inbox}

      /* ---- KNOWLEDGE ---- */
      lib: [],         // the library — see LIB_KINDS below

      /* ---- THE TWO PRESENTATION VIEWS ---- */
      portfolio: [],   // {id,name,note,on}    its evidence is links
      cvs: [],         // {id,name,aim,note}   its picks are links

      /* ---- THE RELATIONSHIP LAYER ---- */
      links: [],       // {id,rel,a,b,note}    a and b are "kind:id"

      /* ---- THE FOLDER TREE ---- */
      folders: [],     // {id,name,folderId} — a library entry and a note carry folderId too

      /* ---- WHERE THINGS SIT ON THE MAP ---- */
      spots: [],       // {id: a record's ref, x, y} — layout, never structure

      settings: { owner: "", offered: false, shape: "rows", demo: false, showGraph: true, libBy: "kind" },
      forgotten: {},   // id -> name, so a removed record still reads
      tombstones: {},  // id -> when it was deleted, so sync cannot resurrect it
      devices: {}      // device id -> {name, at, borrowed} — who last wrote
    };
  }

  var STATE_LISTS = ["education", "jobs", "roles", "training", "skills",
    "projects", "workflows", "runs", "actions", "people", "assets",
    "outputs", "hours", "lib", "portfolio", "cvs", "links", "notes", "folders", "spots"];
  /* A spot is where a record sits on the map. It is its own record so a
     drag cannot stamp — and so outrank — the record it positions, but it
     is layout and not work: no count of the book includes it. */
  var LAYOUT_LISTS = { spots: 1 };
  var STATE_MAPS = ["forgotten", "tombstones", "devices"];

  var PROFILE_KEYS = ["name", "headline", "fields", "interests",
    "email", "phone", "site", "place", "summary"];

  function adoptState(raw, shape) {
    var s = shape || blank();
    if (!raw || typeof raw !== "object") return s;
    STATE_LISTS.forEach(function (k) { if (Array.isArray(raw[k])) s[k] = raw[k]; });
    STATE_MAPS.forEach(function (k) {

  /* ============================================================

    hand:    { word: "In hand",  tone: "hand",  rank: 3 },
    waiting: { word: "Waiting",  tone: "calm",  rank: 4 },
    done:    { word: "Done",     tone: "done",  rank: 5 }

    { value: "do", label: "Something to do" },

  /* ---------------- a project's status ----------------

  /* ---------------- the ten the plan names ---------------- */

  /* getCareerTimeline() — DERIVED, never a second database. Every event

  function getCareerTimeline() {
    var out = [];
    function add(on, kind, id, word, name, sub) {
      if (!on) return;

    return state.projects.filter(function (p) {

  }

    return state.roles.filter(function (r) { return r.jobId === jobId; });
  }
  function jobProjects(jobId) {
    return state.projects.filter(function (p) { return p.jobId === jobId; });
  }

  function getLibraryBySkill(skillId) {

  /* ---------------- the library ---------------- */

  function libOf(kind) {

  var LIB_LANGS = ["python", "arcpy", "sql", "powershell", "bash", "javascript",

  function topicList(raw) {
    var seen = {}, out = [];
    String(raw || "").split(",").forEach(function (t) {
      t = t.trim();
      if (!t) return;
      var k = t.toLowerCase();
      if (seen[k]) return;

  function allTopics() {
    var by = {};
    state.lib.forEach(function (e) {
      (e.topics || []).forEach(function (t) {
        var k = t.toLowerCase();
        if (!by[k]) by[k] = { word: t, n: 0 };

    var bits = [];
    if (isCode(e)) bits.push(e.lang);
    if (hasBody(e) && e.body) bits.push(countWords(e.body.split("\n").length, "line", "lines"));
    if (e.kind === "reference") {

        .filter(Boolean).join(" ");

      bits.push(said || (gaps.length ? "no " + listWords(gaps) + " on it yet"

      bits.push(h.brief || "nothing recorded to open");

    if (!opts.noTopics && (e.topics || []).length) bits.push((e.topics || []).join(", "));

  }
  function libUses(e) {
    return both(ref("lib", e.id)).filter(recOf);
  }

  /* THREE ANSWERS TO "OPEN", AND ONLY ONE IS A PLAIN LINK. A page served
     over https may not navigate to file:///C:/… — every browser blocks it
     and Chrome blocks it SILENTLY, so a path rendered as a link is a
     control that quietly does nothing, which is worse than no control. */
  function openHandle(e) {
    if (e.url) {
      return { href: e.url, label: "Open the link", brief: clip(e.url.replace(/^https?:\/\//, ""), 48),
        how: "" };
    }
    if (e.path) {
      return { href: "", label: "Copy the path", brief: clip(e.path, 48),
        how: "A page on the web is not allowed to open a file on this computer \u2014 the " +
          "browser refuses, and Chrome refuses silently. So the path is handed to you " +
          "to paste into Explorer or Finder." };
    }
    return { href: "", label: "", brief: "", how: "" };
  }

  /* ---------------- hours ----------------

     Summed from the entries and never stored as a total, so no figure can
     drift from the record. */
  function hoursFor(projectId, from, to) {
    return state.hours.filter(function (h) {
      if (projectId && h.projectId !== projectId) return false;
      if (from && h.on < from) return false;
      if (to && h.on > to) return false;
      return true;
    }).reduce(function (n, h) { return n + num(h.minutes); }, 0);
  }
  function hoursMonths() {
    var by = {}, order = [];
    state.hours.forEach(function (h) {
      var k = (h.on || "").slice(0, 7);
      if (!k) return;
      if (!by[k]) { by[k] = 0; order.push(k); }
      by[k] += num(h.minutes);
    });
    return order.sort().reverse().map(function (k) { return { month: k, minutes: by[k] }; });
  }

  /* ---------------- what the record holds, in the reader's words ----------------
     A WORD THE CODE USES IS NOT A WORD THE SCREEN MAY USE: Settings used
     to count straight off the state keys and print "21 wf nodes". */
  var LIST_WORDS = {
    education: ["piece of education", "pieces of education"],
    jobs: ["employer", "employers"], roles: ["role", "roles"], folders: ["folder", "folders"],
    training: ["training", "trainings"], skills: ["skill", "skills"],
    projects: ["project", "projects"], workflows: ["workflow", "workflows"],
    runs: ["run", "runs"], actions: ["action", "actions"],
    people: ["person", "people"], assets: ["piece of equipment", "pieces of equipment"],
    outputs: ["output", "outputs"], hours: ["time entry", "time entries"],
    lib: ["library entry", "library entries"],
    portfolio: ["portfolio item", "portfolio items"], cvs: ["CV", "CVs"],
    links: ["link", "links"]
  };
  function bookCount() {
    return STATE_LISTS.reduce(function (n, k) { return n + (LAYOUT_LISTS[k] ? 0 : state[k].length); }, 0);
  }
  /* bookWords() — the same figures in the READER'S vocabulary. A screen
     may not print a state key at somebody: "21 wf nodes · four person
     links" was the fault the round before this. A count of nought is not
     worth a clause, so an empty list simply does not appear. */
  function bookWords() {
    return STATE_LISTS.filter(function (k) {
      return k !== "links" && !LAYOUT_LISTS[k] && state[k].length;
    }).map(function (k) {
      var w = LIST_WORDS[k] || [k, k];
      return countWords(state[k].length, w[0], w[1]);
    });
  }
  function emptyBook() { return bookCount() === 0 && !state.profile.name; }

  /* ============================================================
     REFERENCES, AND GETTING A BIBLIOGRAPHY BACK OUT.

     Asked for: "for the references, implement somehow something to make it
     accessible for me when I want to export certain bibliography, at least
     in text formation."

     The honest shape of that, and the reason it is shaped this way:

       · BIBTEX, RIS and CSL-JSON are EXACT. They are field mappings with
         no style judgement in them at all, so they cannot be subtly wrong
         — and they are what a reference manager actually eats. Those are
         the trustworthy exports.
       · ONE PLAIN-TEXT LIST, in author-date order, for pasting into a
         document you are writing now. It is labelled as author-date and
         the screen says it is not a certified implementation of a named
         style, because a citation string that is ALMOST APA is the
         plausible-wrong-answer this whole app refuses: a reader would
         paste it into a thesis and never look again.

     being typed field by field; it arrives as a BibTeX or RIS record off

      wants: "Authors, year, title, publisher, place, edition, ISBN" },
    { value: "chapter",    label: "Book chapter",    bib: "incollection",  ris: "CHAP",
      wants: "Authors, year, chapter title, book title, editors, publisher, pages" },
    { value: "thesis",     label: "Thesis",          bib: "phdthesis",     ris: "THES",
      wants: "Author, year, title, institution, kind of thesis" },
    { value: "report",     label: "Report",          bib: "techreport",    ris: "RPRT",
      wants: "Authors, year, title, institution, number, place" },
    { value: "conference", label: "Conference paper", bib: "inproceedings", ris: "CPAPER",
      wants: "Authors, year, title, proceedings, place, pages" },
    { value: "manual",     label: "Manual or documentation", bib: "manual", ris: "RPRT",
      wants: "Organisation, year, title, version, URL" },
    { value: "standard",   label: "Standard",        bib: "misc",          ris: "STAND",
      wants: "Body, year, number, title" },
    { value: "dataset",    label: "Dataset",         bib: "misc",          ris: "DATA",
      wants: "Authors, year, title, repository, DOI, version" },
    { value: "map",        label: "Map or imagery",  bib: "misc",          ris: "MAP",
      wants: "Maker, year, title, scale, sheet, publisher" },
    { value: "web",        label: "Web page",        bib: "misc",          ris: "ELEC",

  ];
  function citeType(v) {
    return CITE_TYPES.filter(function (t) { return t.value === v; })[0] || CITE_TYPES[0];
  }
  var CITE_FIELDS = ["authors", "year", "title", "container", "editors", "edition",
    "volume", "issue", "pages", "publisher", "place", "institution",
    "doi", "isbn", "issn", "url", "accessed", "extra"];
  var CITE_LABELS = {
    authors: "Authors", year: "Year", title: "Title",
    container: "Journal, book or site", editors: "Editors", edition: "Edition",
    volume: "Volume", issue: "Issue", pages: "Pages", publisher: "Publisher",
    place: "Place of publication", institution: "Institution or body",
    doi: "DOI", isbn: "ISBN", issn: "ISSN", url: "URL",
    accessed: "Date you looked at it", extra: "Anything else"

    var c = { type: "article" };

    var c = blankCite();
    var raw = e && e.cite ? e.cite : {};
    if (raw.type) c.type = raw.type;
    CITE_FIELDS.forEach(function (k) { if (typeof raw[k] === "string") c[k] = raw[k]; });
    return c;

  /* WHAT A REFERENCE ACTUALLY HAS is what gets printed. A table of blanks

  function citeRows(e) {
    var c = citeOf(e), out = [];
    CITE_FIELDS.forEach(function (k) {

  }
  function citeComplete(e) {
    var c = citeOf(e);
    var need = ["authors", "year", "title"];
    return need.filter(function (k) { return !c[k]; });
  }

  /* ---------------- authors ----------------

     ONE FIELD, semicolons between people, and each person written either
     "Haddad, N." or "N. Haddad". Both are read; the convention is stated
     on the field. A structured author list would be five boxes per person
     and nobody would fill it in, and "Haddad, N.; Mroueh, L." is what
     everyone already pastes. */

  function authorParts(raw) {
    return String(raw || "").split(/\s*;\s*|\s+\band\b\s+/)
      .map(function (s) { return s.trim(); }).filter(Boolean)
      .map(function (s) {
        if (s.indexOf(",") >= 0) {
          var p = s.split(",");
          return { family: p[0].trim(), given: p.slice(1).join(",").trim() };

        var w = s.split(/\s+/);
        if (w.length === 1) return { family: s, given: "", whole: true };
        if (w.length === 2) return { family: w[1], given: w[0] };
        var initials = w.slice(0, -1).every(function (x) {

    if (a.length === 1) return a[0];

    return a.slice(0, -1).join("; ") + " and " + a[a.length - 1];

     agrees on. */
  function citeInText(e) {

    var who = !a.length ? (c.institution || c.container || "Anon.")

     every \cite already written into a document. Family name, year, first
     real word of the title — and the id's tail only if two entries would
     otherwise collide. */
  function citeKey(e) {
    var c = citeOf(e), a = authorParts(c.authors);
    var fam = (a.length ? a[0].family : (c.institution || c.container || "anon"))
      .toLowerCase().replace(/[^a-z0-9]/g, "");
    var w = String(c.title || "").toLowerCase().split(/\s+/)
      .filter(function (x) { return x.length > 3; })[0] || "";
    var key = (fam || "anon") + (c.year || "") + w.replace(/[^a-z0-9]/g, "");
    var same = state.lib.filter(function (o) {
      return o.kind === "reference" && o.id !== e.id && citeKeyRaw(o) === key;
    });
    return same.length ? key + "-" + String(e.id).slice(-3) : key;

  function citeKeyRaw(e) {
    var c = citeOf(e), a = authorParts(c.authors);
    var fam = (a.length ? a[0].family : (c.institution || c.container || "anon"))
      .toLowerCase().replace(/[^a-z0-9]/g, "");
    var w = String(c.title || "").toLowerCase().split(/\s+/)
      .filter(function (x) { return x.length > 3; })[0] || "";

  /* ---------------- the three exact formats ---------------- */

  function bibEscape(s) {
    /* Only what would break the file: braces and a bare backslash. A

       macros gets them wrong for one language in three, so the text goes
       out as the UTF-8 it came in as — which every modern engine reads. */

    function f(k, v) { if (v) out.push("  " + k + " = {" + bibEscape(v) + "}"); }
    function raw(k, v) { if (v) out.push("  " + k + " = {" + v + "}"); }
    raw("author", authorsBib(c.authors));
    f("title", c.title || e.name);
    if (c.type === "article") f("journal", c.container);
    else if (c.type === "chapter" || c.type === "conference") f("booktitle", c.container);
    else if (c.container) f("howpublished", c.container);
    raw("editor", authorsBib(c.editors));
    f("year", c.year);
    f("volume", c.volume);
    f("number", c.issue);
    f("pages", (c.pages || "").replace(/\s*-\s*/g, "--"));
    f("publisher", c.publisher);
    f("address", c.place);
    f("institution", c.institution || (c.type === "thesis" ? c.publisher : ""));
    f("school", c.type === "thesis" ? (c.institution || c.publisher) : "");
    f("edition", c.edition);
    f("doi", c.doi);
    f("isbn", c.isbn);
    f("issn", c.issn);
    f("url", c.url);

  function risOne(e) {

    authorParts(c.editors).forEach(function (a) {
      f("ED", a.given ? a.family + ", " + a.given : a.family);
    });
    f("TI", c.title || e.name);
    if (c.type === "article") f("JO", c.container);
    else if (c.container) f("T2", c.container);
    f("PY", c.year);
    f("VL", c.volume);
    f("IS", c.issue);

      var p = String(c.pages).split(/\s*[-\u2013]+\s*/);
      f("SP", p[0]);

    f("PB", c.publisher);
    f("CY", c.place);
    f("IN", c.institution);
    f("ET", c.edition);
    f("DO", c.doi);
    f("SN", c.isbn || c.issn);

      thesis: "thesis", report: "report", conference: "paper-conference",
      manual: "document", standard: "standard", dataset: "dataset",
      map: "map", web: "webpage" };
    var o = { id: citeKey(e), type: CSL[c.type] || "document" };
    if (c.title || e.name) o.title = c.title || e.name;
    var au = authorParts(c.authors).map(function (a) {
      return a.given ? { family: a.family, given: a.given } : { literal: a.family };
    });
    if (au.length) o.author = au;
    var ed = authorParts(c.editors).map(function (a) {
      return a.given ? { family: a.family, given: a.given } : { literal: a.family };

    if (c.year) o.issued = { "date-parts": [[num(c.year)]] };
    if (c.container) o["container-title"] = c.container;
    if (c.volume) o.volume = c.volume;
    if (c.issue) o.issue = c.issue;
    if (c.pages) o.page = c.pages;
    if (c.publisher) o.publisher = c.publisher;
    if (c.place) o["publisher-place"] = c.place;
    if (c.institution) o.publisher = o.publisher || c.institution;
    if (c.edition) o.edition = c.edition;
    if (c.doi) o.DOI = c.doi;
    if (c.isbn) o.ISBN = c.isbn;

  /* ---------------- the one readable list ----------------

     Author-date, for pasting. It is NOT a named style and the export says

     volume(issue), pages. publisher, place. doi/url. Each part printed
     only when it exists, so it never prints an empty bracket. */

  function plainCite(e) {
    var c = citeOf(e), bits = [];
    var who = authorsPlain(c.authors) || c.institution || c.container || "";
    var head = who + (c.year ? " (" + c.year + ")" : "");
    bits.push(head.trim());

    if (title) {
      /* A standalone work takes its title plain; a piece inside something
         else takes quotes, because that is the one distinction every
         author-date convention does share. */

        c.type === "conference" || c.type === "web";
      bits.push(inside ? "\u2018" + title + "\u2019" : title);

    if (c.container) {
      bits.push(c.container +
        (c.volume ? ", " + c.volume + (c.issue ? "(" + c.issue + ")" : "") : ""));
    } else if (c.volume) {
      bits.push(c.volume + (c.issue ? "(" + c.issue + ")" : ""));

      bits.push(/^(\d|first|second|third|fourth|fifth|revised|rev\b|new\b)/i.test(c.edition)

    if (c.pages) bits.push((/^\d+$/.test(c.pages.trim()) ? "p. " : "pp. ") + c.pages);
    var pub = [c.place, c.publisher || c.institution].filter(Boolean).join(": ");

    if (c.doi) bits.push("doi:" + c.doi.replace(/^https?:\/\/(dx\.)?doi\.org\//, ""));
    else if (c.url) bits.push(c.url + (c.accessed ? " (accessed " + shortDate(c.accessed) + ")" : ""));
    if (c.extra) bits.push(c.extra);

  /* ---------------- the export ----------------

     It hands back TEXT, always, which is the format that cannot silently
     fail: the dialog it lands in has Copy beside Save-as-file, because a
     browser inside a frame refuses a download without saying so. */

  var BIB_FORMATS = [
    { value: "plain", label: "A plain author-date list", ext: "txt",
      says: "for pasting into something you are writing now" },
    { value: "bibtex", label: "BibTeX (.bib)", ext: "bib",
      says: "for LaTeX, Overleaf, Zotero, JabRef" },
    { value: "ris", label: "RIS (.ris)", ext: "ris",
      says: "for EndNote, Mendeley, Zotero, Papers" },
    { value: "csl", label: "CSL-JSON (.json)", ext: "json",
      says: "for anything that formats a named style properly" },
    { value: "keys", label: "Just the cite keys", ext: "txt",
      says: "the \\cite{\u2026} handles, one per line" }

  function bibFormat(v) {
    return BIB_FORMATS.filter(function (f) { return f.value === v; })[0] || BIB_FORMATS[0];

  function bibSort(list, how) {
    return list.slice().sort(function (a, b) {
      var ca = citeOf(a), cb = citeOf(b);
      if (how === "title") {
        return String(ca.title || a.name).toLowerCase()
          .localeCompare(String(cb.title || b.name).toLowerCase());
      }
      if (how === "year") {
        /* Newest first, and a reference with NO year goes last rather than
           being sorted as though it were year nought. */
        var ya = ca.year || "", yb = cb.year || "";
        if (ya && !yb) return -1;
        if (!ya && yb) return 1;
        if (ya !== yb) return String(yb).localeCompare(String(ya));
      }
      var fa = (authorParts(ca.authors)[0] || {}).family || ca.institution || a.name;
      var fb = (authorParts(cb.authors)[0] || {}).family || cb.institution || b.name;
      var c = String(fa).toLowerCase().localeCompare(String(fb).toLowerCase());
      if (c) return c;
      return String(ca.year).localeCompare(String(cb.year));
    });
  }
  function bibExport(list, format, how) {
    var fmt = bibFormat(format);
    format = fmt.value;
    var refs = bibSort(list.filter(function (e) { return e.kind === "reference"; }), how);
    if (format === "bibtex") {
      return "% " + refs.length + " reference" + (refs.length === 1 ? "" : "s") +
        " from Mashghal, " + today() + "\n\n" +
        refs.map(bibtexOne).join("\n\n") + "\n";
    }
    if (format === "ris") return refs.map(risOne).join("\n\n") + "\n";
    if (format === "csl") return JSON.stringify(refs.map(cslOne), null, 2) + "\n";
    if (format === "keys") return refs.map(citeKey).join("\n") + "\n";
    /* The plain list says what it is at the top of the file, because a
       bibliography pasted into a thesis has to be checked against the
       style that thesis actually requires, and a reader who cannot see
       where it came from will not check. */
    var ORDER = { year: "Newest first", title: "In title order" };
    return "Bibliography \u2014 " + refs.length + " reference" +
      (refs.length === 1 ? "" : "s") + ", " + today() + "\n" +
      (ORDER[how] || "Author-date order") +
      ". This is a plain readable list, not an implementation of\n" +
      "APA, MLA, Chicago or Harvard: check it against the style you are asked for,\n" +
      "or export BibTeX / RIS / CSL-JSON and let your reference manager format it.\n" +
      "\n" + refs.map(function (e) { return plainCite(e); }).join("\n\n") + "\n";
  }

  /* ---------------- and the same mapping, backwards ----------------

     A reference arrives as a record off a journal page. This reads BibTeX
     and RIS, names every field it could not place, and refuses to guess:
     an entry with no title is refused by name rather than being saved as
     "(unnamed)". */

  var BIB_TO_TYPE = { article: "article", book: "book", incollection: "chapter",
    inbook: "chapter", phdthesis: "thesis", mastersthesis: "thesis",
    techreport: "report", inproceedings: "conference", conference: "conference",
    manual: "manual", misc: "web", online: "web", electronic: "web",
    dataset: "dataset", booklet: "book", unpublished: "report" };
  var RIS_TO_TYPE = { JOUR: "article", BOOK: "book", CHAP: "chapter", THES: "thesis",
    RPRT: "report", CONF: "conference", CPAPER: "conference", ELEC: "web",
    STAND: "standard", DATA: "dataset", MAP: "map", GEN: "web", MGZN: "article",
    NEWS: "article", EDBOOK: "book" };

  /* citeParse — SEVERAL AT ONCE, because that is what a catalogue hands
     you and the dialog says so in as many words. It splits first and reads
     each record on its own, so one malformed entry in ten does not lose the
     other nine: it is named in `bad` instead. Every return has the same
     shape (`records`, `unplaced`, `bad`, `why`) — the first draft's
     failure path had no `records` at all and the caller read `.length` off
     undefined, which threw before the reader saw a word. */
  function citeParse(text) {
    var raw = String(text || "").trim();
    var out = { records: [], unplaced: [], bad: [], why: "" };
    if (!raw) { out.why = "Nothing pasted yet."; return out; }
    var chunks = [], kind = "";
    if (/^\s*TY\s{0,2}-/m.test(raw)) {
      kind = "RIS";
      chunks = raw.split(/^\s*ER\s{0,2}-.*$/m).map(function (x) { return x.trim(); })
        .filter(function (x) { return /TY\s{0,2}-/.test(x); });
    } else if (/^\s*@\w+\s*[{(]/m.test(raw)) {
      kind = "BibTeX";
      /* Split ON the @type header rather than before it, so the header stays
         with its own body. */
      raw.replace(/@\w+\s*[{(]/g, function (m2, at) {
        chunks.push({ at: at });
        return m2;
      });
      chunks = chunks.map(function (c, i) {
        return raw.slice(c.at, i + 1 < chunks.length ? chunks[i + 1].at : raw.length).trim();
      });
    }
    if (!chunks.length) {
      out.why = "That is neither a BibTeX record (it would start with @article{\u2026) " +
        "nor an RIS one (it would start with TY  - and end with ER  -). Paste one of " +
        "those, or fill the fields in by hand.";
      return out;
    }
    chunks.forEach(function (chunk) {
      var got = kind === "RIS" ? parseRIS(chunk) : parseBib(chunk);
      if (got.ok) {
        out.records.push(got);
        got.unread.forEach(function (u) {
          if (out.unplaced.indexOf(u) < 0) out.unplaced.push(u);
        });
      } else {
        out.bad.push(got.why);
      }
    });
    if (!out.records.length) {
      out.why = out.bad[0] || "Nothing in that could be read as a reference.";
    }
    return out;
  }
  function parseBib(raw) {
    var m = /@(\w+)\s*[{(]\s*([^,\s]*)\s*,/.exec(raw);
    if (!m) return { ok: false, why: "That looks like BibTeX but has no @type{key, header." };
    var c = blankCite();
    c.type = BIB_TO_TYPE[m[1].toLowerCase()] || "web";
    var body = raw.slice(m.index + m[0].length);
    var unread = [];
    /* One field at a time, balancing braces, so a title holding {Anfeh}
       does not end the field early. */
    var re = /(\w+)\s*=\s*/g, f;
    while ((f = re.exec(body))) {
      var i = re.lastIndex, v = "", ch = body.charAt(i);
      if (ch === "{") {
        var d = 0, j = i;
        for (; j < body.length; j++) {
          if (body.charAt(j) === "{") d++;
          else if (body.charAt(j) === "}") { d--; if (!d) break; }
        }
        v = body.slice(i + 1, j);
        re.lastIndex = j + 1;
      } else if (ch === '"') {
        var k = body.indexOf('"', i + 1);
        v = body.slice(i + 1, k < 0 ? body.length : k);
        re.lastIndex = (k < 0 ? body.length : k) + 1;
      } else {
        var e2 = body.slice(i).search(/[,\n}]/);
        v = body.slice(i, e2 < 0 ? body.length : i + e2).trim();
        re.lastIndex = i + (e2 < 0 ? 0 : e2);
      }
      /* Braces in a BibTeX value are grouping and capitalisation armour,
         never text — "The Roman mole at {Anfeh}" put them on screen. They
         come out once the field has been read WITH them (the balancing above
         is what stops a braced word ending the field early). */
      v = v.replace(/\s+/g, " ").replace(/[{}]/g, "").trim();
      if (!v) continue;
      var key = f[1].toLowerCase();
      if (key === "author") c.authors = v.replace(/\s+and\s+/g, "; ");
      else if (key === "editor") c.editors = v.replace(/\s+and\s+/g, "; ");
      else if (key === "title") c.title = v;
      else if (key === "journal" || key === "booktitle" || key === "howpublished") c.container = v;
      else if (key === "year" || key === "date") c.year = (/\d{4}/.exec(v) || [v])[0];
      else if (key === "volume") c.volume = v;
      else if (key === "number") c.issue = v;
      else if (key === "pages") c.pages = v.replace(/--+/g, "\u2013");
      else if (key === "publisher") c.publisher = v;
      else if (key === "address" || key === "location") c.place = v;
      else if (key === "school" || key === "institution" || key === "organization") c.institution = v;
      else if (key === "edition") c.edition = v;
      else if (key === "doi") c.doi = v;
      else if (key === "isbn") c.isbn = v;
      else if (key === "issn") c.issn = v;
      else if (key === "url") c.url = v;
      else if (key === "urldate") c.accessed = v;
      else if (key === "note" || key === "annote") c.extra = v;
      else if (key === "keywords") c.keywords = v;
      else unread.push(f[1]);
    }
    return finishParse(c, unread, "BibTeX");
  }
  function parseRIS(raw) {
    var c = blankCite(), unread = [], au = [], ed = [], kw = [], sp = "", ep = "";
    raw.split(/\r?\n/).forEach(function (line) {
      var m = /^([A-Z][A-Z0-9])\s{0,2}-\s?(.*)$/.exec(line.trim());
      if (!m) return;
      var tag = m[1], v = m[2].trim();
      if (!v && tag !== "ER") return;
      if (tag === "TY") c.type = RIS_TO_TYPE[v] || "web";
      else if (tag === "AU" || tag === "A1" || tag === "A2") au.push(v);
      else if (tag === "ED" || tag === "A3") ed.push(v);
      else if (tag === "TI" || tag === "T1") c.title = v;
      else if (tag === "JO" || tag === "JF" || tag === "T2") c.container = v;
      else if (tag === "PY" || tag === "Y1" || tag === "DA") {
        if (!c.year) c.year = (/\d{4}/.exec(v) || [""])[0];
      } else if (tag === "VL") c.volume = v;
      else if (tag === "IS") c.issue = v;
      else if (tag === "SP") sp = v;
      else if (tag === "EP") ep = v;
      else if (tag === "PB") c.publisher = v;
      else if (tag === "CY" || tag === "PP") c.place = v;
      else if (tag === "IN" || tag === "AD") c.institution = v;
      else if (tag === "ET") c.edition = v;
      else if (tag === "DO") c.doi = v;
      else if (tag === "SN") { if (/^97[89]|^\d{9}[\dXx]$/.test(v.replace(/-/g, ""))) c.isbn = v; else c.issn = v; }
      else if (tag === "UR" || tag === "L1") c.url = c.url || v;
      else if (tag === "Y2") c.accessed = v;
      else if (tag === "N1" || tag === "AB") c.extra = c.extra || v;
      else if (tag === "KW") kw.push(v);
      else if (tag !== "ER") unread.push(tag);
    });
    c.authors = au.join("; ");
    c.editors = ed.join("; ");
    c.pages = sp && ep ? sp + "\u2013" + ep : (sp || ep || "");
    if (kw.length) c.keywords = kw.join(", ");

  }
  function finishParse(c, unread, from) {
    if (!c.title) {
      return { ok: false, why: "That " + from + " record has no title, so there is " +
        "nothing to call it. Add a title line and paste it again." };
    }
    var kw = c.keywords || "";
    delete c.keywords;
    var missing = ["authors", "year"].filter(function (k) { return !c[k]; });
    return { ok: true, cite: c, topics: topicList(kw), from: from,
      missing: missing, unread: unread,
      /* It SAYS what it read and what was not there, rather than filling a
         year in from the accessed date or the DOI. */
      says: "Read as a " + from + " " + citeType(c.type).label.toLowerCase() +
        (unread.length ? ". Not placed: " + unread.filter(function (x, i, a) {
          return a.indexOf(x) === i; }).join(", ") : "") +
        (missing.length ? ". No " + missing.join(" and ") + " in it \u2014 " +
          "add " + (missing.length === 1 ? "it" : "them") + " by hand." : "") };
  }

  /* ---------------- which references to export ----------------

     "certain bibliography" is the whole point: nobody exports all of them.
     Every scope is a walk over records that already exist. */

  function bibScopes() {
    var out = [{ value: "all", label: "Every reference \u2014 " +
      libOf("reference").length, get: function () { return libOf("reference"); } }];
    allTopics().forEach(function (t) {
      var n = libByTopic(t.word).filter(function (e) { return e.kind === "reference"; }).length;
      if (n) {
        out.push({ value: "topic:" + t.word, label: "On \u201c" + t.word + "\u201d \u2014 " + n,
          get: function () {
            return libByTopic(t.word).filter(function (e) { return e.kind === "reference"; });
          } });
      }
    });
    state.projects.forEach(function (p) {
      var n = getProjectLib(p.id).map(recOf)
        .filter(function (e) { return e && e.kind === "reference"; });
      if (n.length) {
        out.push({ value: "project:" + p.id, label: "Used on " + p.name + " \u2014 " + n.length,
          get: function () {
            return getProjectLib(p.id).map(recOf)
              .filter(function (e) { return e && e.kind === "reference"; });
          } });
      }
    });
    state.skills.forEach(function (s) {
      var n = getLibraryBySkill(s.id).map(recOf)
        .filter(function (e) { return e && e.kind === "reference"; });
      if (n.length) {
        out.push({ value: "skill:" + s.id, label: "About " + s.name + " \u2014 " + n.length,
          get: function () {
            return getLibraryBySkill(s.id).map(recOf)
              .filter(function (e) { return e && e.kind === "reference"; });
          } });
      }
    });
    state.outputs.forEach(function (o) {
      var n = ofKind(both(ref("output", o.id), "cites"), "lib").map(recOf)
        .filter(function (e) { return e && e.kind === "reference"; });
      if (n.length) {
        out.push({ value: "output:" + o.id, label: "Cited by " + o.name + " \u2014 " + n.length,
          get: function () {
            return ofKind(both(ref("output", o.id), "cites"), "lib").map(recOf)
              .filter(function (e) { return e && e.kind === "reference"; });
          } });

  }
  function bibScope(v) {
    return bibScopes().filter(function (s) { return s.value === v; })[0] || bibScopes()[0];
  }

  /* ============================================================
     THE SCREENS ARE VIEWS OVER THE RECORD.

     Five tabs, because a phone's bar was measured at six in this repo and
     carries seven only by taking the label off the gear:

       HOME      what matters across my professional life right now
       CAREER    who I am professionally
       WORK      what I am doing and have done
       LIBRARY   what I know and can reuse
       SHOW      what I can present — the portfolio and the CVs

     with Settings on the gear and the finder above the tabs, because it
     reaches further than any of them.

     Each tab is a STRIP of pages, not a stack of levels, and every page is
     one list. Which page is open, which record is open and what was typed
     into the finder are all VIEW STATE — module-level, never in `state`, so
     none of it reaches a backup or survives a reload. Keeping it in
     settings meant a tab showed a different screen depending on what you
     did ten minutes ago.
     ============================================================ */

  var openRec = "";     // "kind:id" — whose page is open
  var pageAt = {};      // tab id -> the page open inside it
  var back = [];        // where Back goes, one push per navigation
  var libTopic = "";    // the Library's topic lens
  var projFilter = "";  // the Projects chip
  var sift = {};        // page key -> what is typed in its sift box
  var dirFacet = "";    // the Directory's chip

  var PAGES = {
    career: [
      { id: "profile",   label: "Profile" },
      { id: "roles",     label: "Experience", kind: "role" },
      { id: "education", label: "Education",  kind: "education" },
      { id: "training",  label: "Training",   kind: "training" },
      { id: "skills",    label: "Skills",     kind: "skill" },
      { id: "timeline",  label: "Timeline" }
    ],
    work: [
      { id: "projects",  label: "Projects",  kind: "project" },
      { id: "workflows", label: "Workflows", kind: "workflow" },
      { id: "actions",   label: "Actions",   kind: "action" },
      { id: "people",    label: "People",    kind: "person" },
      { id: "equipment", label: "Equipment", kind: "asset" },
      { id: "outputs",   label: "Outputs",   kind: "output" },
      { id: "jobs",      label: "Employers", kind: "job" },
      { id: "hours",     label: "Hours" }
    ],
    library: [
      { id: "scripts",    label: "Scripts",    lib: "script" },
      { id: "formulas",   label: "Formulas",   lib: "formula" },
      { id: "methods",    label: "Methods",    lib: "method" },
      { id: "templates",  label: "Templates",  lib: "template" },
      { id: "references", label: "References", lib: "reference" },
      { id: "places",     label: "Places",     lib: "place" },
      { id: "topics",     label: "By subject" }
    ],
    show: [
      { id: "portfolio", label: "Portfolio", kind: "portfolio" },
      { id: "cvs",       label: "CVs",       kind: "cv" }
    ]
  };
  /* Which tab a record belongs to, so the rail marks the right one and
     Back from a record page lands on the page that lists it. */
  var TAB_OF = {
    role: "career", job: "work", education: "career", training: "career",
    skill: "career", project: "work", workflow: "work", run: "work",
    action: "work", person: "work", asset: "work", output: "work",
    lib: "library", portfolio: "show", cv: "show"
  };
  var PAGE_OF = {
    role: "roles", job: "jobs", education: "education", training: "training",
    skill: "skills", project: "projects", workflow: "workflows", run: "workflows",
    action: "actions", person: "people", asset: "equipment", output: "outputs",
    portfolio: "portfolio", cv: "cvs"
  };
  var LIB_PAGE = { script: "scripts", formula: "formulas", method: "methods",
    template: "templates", reference: "references", place: "places" };

  function pageNow(tab) {
    var list = PAGES[tab];

  }

  function pageCount(tab, p) {
    if (p.kind) return listOf(p.kind).length;
    if (p.lib) return libOf(p.lib).length;

      return '<button class="sbtn" data-act="page" data-id="' + tab + "|" + p.id +

    }).join("") + "</div>";
  }

  /* ---------------- the one row ----------------

     Every list in the app draws this, so a record reads the same way
     wherever it appears. `opts.knows` is what the page around it already
     names — SAY IT ONCE: an action row on a project's own page printing
     that project's name three inches under the heading that IS the
     project's name is the fault this repo records twice. */

  function rowOf(kind, rec, opts) {
    opts = opts || {};

    var sub = opts.says != null ? opts.says : saysOf(kind, rec, opts);

    if (opts.when) right.push('<span class="when">' + esc(opts.when) + "</span>");

      (sub ? '<span class="sub">' + (opts.rawSays ? sub : esc(sub)) + "</span>" : "") +
      "</span>" +

      esc(opts.unpick + "|" + r) + '" aria-label="' +

  }
  /* ---------------- THE OTHER SHAPE ----------------

     A list is the right rendering of "what is next" and a poor one of
     "what have I got": twenty skills in five groups read as a column of
     identical rows, which is what its owner said in as many words. A grid
     of cards gives every entry a shape of its own and puts five or six on
     a screen instead of one and a half.

     read `recName`, `standOf` and `saysOf`; the card adds a facts strip and
     a footer, which is room a row does not have. */
  function cardOf(kind, rec, opts) {
    opts = opts || {};
    var r = ref(kind, rec.id);
    var st = opts.stand || standOf(kind, rec);
    var sub = opts.says != null ? opts.says : saysOf(kind, rec, opts);
    var edge = st && st.tone && st.tone !== "done" && st.tone !== "calm"
      ? " e-" + st.tone : "";
    var foot = [];
    if (st && st.word) {
      foot.push('<span class="pill p-' + st.tone + '">' + esc(st.word) + "</span>");
    }
    (opts.foot || []).forEach(function (h) { foot.push(h); });
    return '<div class="card' + edge + '">' +
      '<button class="cardhit" data-act="open" data-id="' + esc(r) + '" title="' +
      esc(recName(rec, kind)) + '">' +
      '<span class="cardtop">' + itile(kind, rec) +
      '<span class="nm">' + esc(recName(rec, kind)) + "</span></span>" +
      (sub ? '<span class="sub">' + (opts.rawSays ? sub : esc(sub)) + "</span>" : "") +
      ((opts.facts || []).length
        ? '<span class="cardfacts">' + opts.facts.map(function (f) {
            return "<span>" + esc(f) + "</span>"; }).join("") + "</span>"
        : "") +
      "</button>" +

  }
  /* The mono strip along a card's foot: the two or three facts a row puts

     card of a project on one screen matches a card of a project on
     another, and a path appearing here is the same path the Directory
     lists. */
  function cardFacts(kind, rec) {
    if (!hasDoc(rec)) return [];
    return [clip((rec.url || rec.path).replace(/^https?:\/\//, ""), 42)];
  }

    return cardsOf(kind, list, function (rec) {
      var o = {};
      Object.keys(opts || {}).forEach(function (k) { o[k] = opts[k]; });
      if (!o.facts) o.facts = cardFacts(kind, rec);
      return o;
    });
  }
  G.rows = '<svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3.5 6h13M3.5 10h13M3.5 14h13"/></svg>';
  G.grid = '<svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3.2" y="3.2" width="6" height="6" rx="1.2"/><rect x="10.8" y="3.2" width="6" height="6" rx="1.2"/><rect x="3.2" y="10.8" width="6" height="6" rx="1.2"/><rect x="10.8" y="10.8" width="6" height="6" rx="1.2"/></svg>';

  /* THE SWITCH AND THE SIFT BOX SIT IN ONE ROW, because both are about how

     appears past a threshold: a filter over three rows is a control that
     answers a question nobody has. */
  function shapeRow(key, n, what) {
    var typed = sift[key] || "";
    var box = "";
    if (n > 7 || typed) {

        'placeholder="Sift ' + esc(countWords(n, what[0], what[1])) + '\u2026" ' +
        'value="' + esc(typed) + '" data-sift="' + esc(key) + '" ' +
        'aria-label="Sift the list by name" />';
