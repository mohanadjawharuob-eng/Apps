<script>
  /* Runs before the stylesheet, so the theme is decided before the first paint.
     It has its own copy of the key expression because the main script has not
     loaded yet — the same reason Coffer's pre-paint reader repeats its own. */
  (function () {
    try {
      var t = localStorage.getItem("mashghal2.theme");
      if (t === "light" || t === "dark") {
        document.documentElement.setAttribute("data-theme", t);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", t === "light" ? "#f4efe4" : "#1b1e24");
      }
    } catch (e) {}
  })();
</script>

  /* ================= Deep field =================

     The palette the owner picked from a dashboard mock-up: a deep navy ground
     with cards lifted off it, and colour used in two DIFFERENT channels that
     must never be confused.

       · IDENTITY (what kind of thing this is) lives in the small rounded ICON
         TILE and nowhere else — a tinted ground at low alpha with a muted
         glyph. Projects read blue, workflows violet, assets green, and so on.
       · STATE (how is this going) lives in a PILL WITH A WORD beside it, and
         in a row's left edge. High chroma, three rungs, and the word carries
         it for anyone who cannot separate the hues.

     Separating the channels by chroma as well as position is the whole trick:
     the mock-up used green for "assets" and green for "available" at once, and
     without the split the screen stops meaning anything. It also means the old
     rule — "two hues, each says one thing" — survives in a palette that now
     has eight, because each CHANNEL still says one thing.

     Every role is defined on bare :root, so nothing has its only definition
     inside a media query. This design is dark-first, so light is applied twice
     over the top — once for the system setting, guarded so an explicit dark
     choice still wins, and once for the explicit light choice.

     Contrast was measured, not eyeballed: every text role clears AA on every
     ground it appears on, in both themes. --receded is the one deliberate
     exception, because it is the bottom of the state ladder where a finished
     thing sinks, and its state is written as a word. */
  :root {
    --page: #0b1220;
    --rail: #0d1524;
    --sheet: #0f1829;
    --surface: #121c2e;
    --raised: #18243a;
    --sunken: #080e19;
    --rule: #1e2d45;
    --rule-soft: #162236;
    --rule-mid: #27395a;
    --rule-strong: #3a5074;
    --ink: #e9eff8;
    --ink-hover: #fbf7ef;    /* a primary button under the finger: lifts off the ink */
    --dim: #b3c4d8;
    --faint: #8ba0b8;
    --receded: #5b7089;

    /* the state ladder: in hand · attention · late. Waiting has no colour. */
    --sage: #34d399;
    --sage-lift: #6ee7b7;
    --sage-deep: #0f6b50;
    --amber: #fbbf24;
    --amber-lift: #fcd34d;
    --amber-deep: #4a3410;
    --apricot: #fb7185;
    --apricot-lift: #fda4af;
    --apricot-mute: #c05868;
    --apricot-deep: #4a1d27;
    --late-tint: #241620;
    --late-tint2: #1d1823;
    --late-edge2: #3c2b38;

    /* identity, for icon tiles only — never on text, a border or a pill */
    --nav-on: #1d4ed8;
    --nav-on-ink: #ffffff;
    --id-project: #60a5fa;
    --id-workflow: #a78bfa;
    --id-asset: #4ade80;
    --id-action: #fbbf24;
    --id-output: #2dd4bf;
    --id-equip: #f472b6;
    --id-know: #818cf8;
    --id-conn: #22d3ee;
    --id-soft: #38bdf8;
    --tile-a: 0.14;          /* how strongly an icon tile is tinted */

    /* the names the app already speaks, aliased onto the new values */
    --blue: #60a5fa;
    --blue-deep: #1e3a5f;
    --brass: #60a5fa;
    --brass-deep: #1e3a5f;
    --oxide: #fb7185;
    --oxide-deep: #4a1d27;
    --verd: #34d399;
    --gain: #34d399;
    --loss: #fb7185;
    --warn: #fbbf24;
    --line: #5d7590;
    --line-dim: #27395a;
    /* A LINE ON THE SHEET IS NOT A HAIRLINE, and borrowing the hairline
       tokens is what made the board unreadable in the dark. A flow edge out
       of a step that has not started drew with --line-dim and an association
       drew with --rule-mid; both are #27395a, which is 1.54:1 against the
       sheet — and on a template board NOTHING has started, so that was every
       edge on the screen. Measured, not guessed: these four are 3.9:1 to
       8.2:1, and the dead edge stays visibly dimmer than the live one
       without disappearing. --line-dim keeps its own job (a hairline, where
       low contrast is right) and the sheet no longer reads it. */
    --edge: #9db2cb;        /* 8.17:1 — sequence, live */
    --edge-dead: #5f7899;   /* 3.92:1 — sequence out of a step not started */
    --edge-assoc: #8fa5c9;  /* 7.10:1 — association, dashed, no order */
    --edge-back: #7cb3fb;   /* 8.20:1 — a loop back, over the top */
    --grain: 0.04;
    --shade: #05090f;
    --veil: rgba(18,28,46,0.94);
    --c1: #60a5fa;
    --display: "Mashghal Display", "Bricolage Grotesque", "Work Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
    --sans: "Work Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --serif: "Newsreader", Georgia, "Times New Roman", serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --r: 12px;
    --t: 140ms;
    color-scheme: dark;
  }

  /* ============================================================
     The rebuild's own stylesheet. The tokens above are the navy design
     system verbatim, because the look is settled and was earned by
     measurement — every run of text in both themes. What follows is
     written fresh, one rule per thing the screens actually draw, so the
     dead-CSS scan stays a real test: a rule nothing emits is how
     `span: true` came to do nothing in the original for its whole life.
     ============================================================ */

  /* THERE IS NO SWITCH BAR HERE. It was rev-1's spine, pinned to the
     bottom of every screen, and it is in none of the round-3 brief and
     none of the poster's twelve panels — so the toasts have no bar to
     clear and `--sbh` is nought rather than a guess. */
  :root { --sbh: 0rem; }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--page); color: var(--ink);
    font-family: var(--sans); font-size: 15px; line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { font-family: var(--display); font-weight: 500; letter-spacing: -0.022em; }
  button { font: inherit; }
  a { color: var(--brass); }
  code { font-family: var(--mono); font-size: 0.86em; }
  [hidden] { display: none !important; }

  /* ---------------- the shell ---------------- */
  .shell { display: flex; min-height: 100vh; }
  /* A sticky full-height column. Without the height the rail stretches to
     the height of the DOCUMENT, so on a long screen its footer — the one
     control pinned to the bottom corner — sits two thousand pixels below
     the fold. */
  .rail {
    position: sticky; top: 0; height: 100vh;
    width: 252px; flex: none; border-right: 1px solid var(--rule);
    background: var(--rail); padding: 1.1rem 0 1rem;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .railtop { display: contents; }
  .brand { display: flex; align-items: center; gap: 0.6rem; padding: 0 1rem 0.7rem; min-width: 0; }
  .brand-mark { display: inline-flex; line-height: 0; }
  .brand-mark svg { display: block; }
  .brand h1 {
    margin: 0; min-width: 0; font-size: 0.9rem; letter-spacing: -0.01em; color: var(--ink);
    font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #nav { display: flex; flex-direction: column; gap: 2px; padding: 0 0.55rem; }
  /* THE OPEN SECTION IS A FILLED PILL. This is the one place a solid
     identity fill is right: it is not claiming a thing is healthy or
     late, it is saying you are standing here. Defined per theme, never
     hardcoded beside a token — that shortcut has already cost this app a
     label that vanished at 1.01:1. */
  .tab {
    display: flex; align-items: center; gap: 0.6rem; width: 100%;
    background: transparent; border: 0; border-radius: 9px; cursor: pointer;
    padding: 0.5rem 0.65rem; color: var(--dim); font-size: 0.88rem;
    text-align: left; transition: var(--t);
  }
  .tab .ico { display: inline-flex; color: var(--faint); transition: var(--t); }
  .tab:hover { background: var(--raised); color: var(--ink); }
  .tab[aria-current="page"] { background: var(--nav-on); color: #fff; font-weight: 500; }
  .tab[aria-current="page"] .ico { color: #fff; }
  .railquick { margin-top: 1.2rem; padding: 0 0.55rem; }
  .rwhead {
    font-size: 0.66rem; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--faint); padding: 0 0.65rem 0.4rem;
  }
  .rwrow {
    display: flex; align-items: center; gap: 0.6rem; width: 100%;
    background: transparent; border: 0; border-radius: 9px; cursor: pointer;
    padding: 0.42rem 0.65rem; color: var(--dim); font-size: 0.84rem;
    text-align: left; transition: var(--t);
  }
  .rwrow:hover { background: var(--raised); color: var(--ink); }
  .rwico { display: inline-flex; color: var(--faint); flex: none; }
  .rwname { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rwname small { display: block; font-size: 0.7rem; color: var(--faint); }
  /* The footer says where the book is, not that you are online: there is
     no account here to be online with. */
  .railme { margin-top: auto; padding: 0.6rem 0.55rem 0; border-top: 1px solid var(--rule-soft); }
  .view { flex: 1; min-width: 0; padding: 1.4rem 1.6rem 4rem; max-width: 1180px; }

  /* ---------------- page furniture ---------------- */
  .page-head {
    display: flex; align-items: flex-start; gap: 1rem; flex-wrap: wrap;
    margin: 0 0 1.1rem;
  }
  .ph-main { flex: 1 1 0; min-width: 0; }
  .page-head h2 { margin: 0; font-size: 1.45rem; overflow-wrap: anywhere; }
  .page-head p { margin: 0.25rem 0 0; color: var(--faint); font-size: 0.84rem; }
  .acts { display: flex; gap: 0.4rem; flex-wrap: wrap; }

  .panel {
    background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r);
    padding: 0.95rem 1.1rem; margin: 0 0 0.9rem;
  }
  .phead { display: flex; align-items: center; gap: 0.8rem; margin: 0 0 0.6rem; }
  .phead h3 { margin: 0; flex: 1 1 0; min-width: 0; font-size: 0.94rem; }
  .says { margin: 0.5rem 0 0; color: var(--faint); font-size: 0.8rem; line-height: 1.55; }
  .says.foot { margin-top: 1.2rem; }
  .says.drift-says { color: var(--amber-lift); }
  .dim { color: var(--faint); }
  /* Two equal columns, and one column under 900px. Nothing here needs a
     third breakpoint: a card is a card at every width. */
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 0.9rem; }
  .grid2 > * { min-width: 0; }

  /* ---------------- a finding, then what to do about it ---------------- */
  .empty { padding: 0.5rem 0 0.2rem; }
  .ehead { margin: 0; color: var(--dim); font-size: 0.9rem; }
  .esub { margin: 0.2rem 0 0; color: var(--faint); font-size: 0.8rem; }

  /* ---------------- identity tiles ----------------
     Colour runs in two channels and they never mix: identity lives only
     here, as a low-alpha tint behind a muted glyph, and state lives only
     in a pill carrying a word and in a row's left edge. */
  .itile {
    width: 30px; height: 30px; flex: none; border-radius: 9px;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--raised); color: var(--faint);
  }
  /* NINE IDENTITY HUES AND ELEVEN THINGS TO IDENTIFY, so two of them
     share — and the shares are where the meanings are closest: a person
     and a connection are both something you reach, and a place and a
     file are both a section of the one registry. Inventing a tenth hue
     would be a colour with no reason behind it, and the alternative —
     letting a section borrow sage, amber or rose — is the one thing the
     two channels exist to prevent. */
  .itile.id-proj   { background: color-mix(in srgb, var(--id-project) 16%, transparent);  color: var(--id-project); }
  .itile.id-job    { background: color-mix(in srgb, var(--id-output) 16%, transparent);   color: var(--id-output); }
  .itile.id-flow   { background: color-mix(in srgb, var(--id-workflow) 16%, transparent); color: var(--id-workflow); }
  .itile.id-run    { background: color-mix(in srgb, var(--id-action) 16%, transparent);   color: var(--id-action); }
  .itile.id-person { background: color-mix(in srgb, var(--id-conn) 16%, transparent);     color: var(--id-conn); }
  .itile.id-device { background: color-mix(in srgb, var(--id-equip) 16%, transparent);    color: var(--id-equip); }
  .itile.id-app    { background: color-mix(in srgb, var(--id-soft) 16%, transparent);     color: var(--id-soft); }
  .itile.id-site   { background: color-mix(in srgb, var(--id-asset) 16%, transparent);    color: var(--id-asset); }
  .itile.id-file   { background: color-mix(in srgb, var(--id-asset) 16%, transparent);    color: var(--id-asset); }
  .itile.id-lib    { background: color-mix(in srgb, var(--id-know) 16%, transparent);     color: var(--id-know); }
  .itile.id-conn   { background: color-mix(in srgb, var(--id-conn) 16%, transparent);     color: var(--id-conn); }
  .itile.id-thing  { background: var(--raised); color: var(--faint); }
  .itile.id-n      { background: var(--raised); color: var(--faint); }
  .itile svg { width: 17px; height: 17px; }

  /* ---------------- the state pill ----------------
     A WORD, always. Never colour alone — the brief says so and so does
     every reader who cannot separate the hues. */
  .pill {
    display: inline-flex; align-items: center; flex: 0 0 auto;
    font-size: 0.7rem; font-weight: 600; letter-spacing: 0.02em;
    padding: 0.16rem 0.5rem; border-radius: 999px; white-space: nowrap;
  }
  .pill.p-late  { color: var(--apricot-lift); background: var(--late-tint); }
  .pill.p-drift { color: var(--amber-lift);   background: color-mix(in srgb, var(--amber) 15%, transparent); }
  .pill.p-live  { color: var(--sage-lift);    background: color-mix(in srgb, var(--sage) 15%, transparent); }
  .pill.p-idle  { color: var(--faint);        background: var(--raised); }
  .pill.p-done  { color: var(--faint);        background: transparent; border: 1px solid var(--rule); }

  /* ---------------- figure tiles ---------------- */
  .ftiles {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 0.6rem; margin: 0 0 0.9rem;
  }
  .ftile {
    background: var(--surface); border: 1px solid var(--rule); border-radius: 12px;
    border-left: 3px solid var(--rule); padding: 0.7rem 0.85rem;
    display: flex; flex-direction: column; gap: 0.1rem; min-width: 0;
  }
  .ftile.t-late  { border-left-color: var(--apricot); }
  .ftile.t-drift { border-left-color: var(--amber); }
  .ftile.t-live  { border-left-color: var(--sage); }
  .ftile.t-idle  { border-left-color: var(--rule-strong); }
  .ftile.t-done  { border-left-color: var(--rule); }
  .flab { font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); }
  .ffig { font-family: var(--display); font-weight: 500; font-size: 1.5rem; line-height: 1.1; color: var(--ink); }
  .ffoot { font-size: 0.74rem; color: var(--faint); }

  /* ---------------- the two rows ----------------
     A whole row that opens something is a <button>, never a div carrying
     a data-act: that is the difference between a screen a keyboard can
     reach and one it cannot. */
  .rows { display: flex; flex-direction: column; }
  .drow, .arow {
    display: flex; align-items: center; gap: 0.7rem;
    border-bottom: 1px solid var(--rule-soft); border-left: 3px solid transparent;
    padding: 0.6rem 0.5rem 0.6rem 0.55rem; min-width: 0;
  }
  .rows > *:last-child { border-bottom: 0; }
  .drow {
    width: 100%; background: transparent; border-top: 0; border-right: 0;
    color: var(--ink); cursor: pointer; text-align: left; transition: var(--t);
  }
  .drow:hover { background: var(--raised); }
  .drow:active { transform: translateY(1px); }
  /* A LATE ROW IS A NEUTRAL CARD WITH A COLOURED EDGE AND A PILL, never a
     coloured card with coloured prose on it. Recolouring the row was how
     the top of the original's Waiting screen became one continuous alarm. */
  .e-late  { border-left-color: var(--apricot); }
  .e-drift { border-left-color: var(--amber); }
  .e-live  { border-left-color: var(--sage); }
  .e-idle  { border-left-color: var(--rule-strong); }
  .e-done  { border-left-color: var(--rule); }
  .dmain { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 0.1rem; }
  .dnm { font-size: 0.92rem; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dsub { font-size: 0.76rem; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dright { flex: 0 0 auto; display: flex; align-items: center; gap: 0.5rem; }
  /* `--receded` is for something deliberately SUNK — a finished step, a
     marker beside a label that already carries the meaning. The chevron is
     not that: it is the only thing on the row saying the row opens
     something, and on `--receded` it measured 3.35:1 in the dark and
     2.46:1 on paper. Dimmer is not the same as invisible. */
  .dchev { flex: none; color: var(--faint); font-size: 1.1rem; line-height: 1; }
  .dprog { display: flex; flex-direction: column; align-items: flex-end; gap: 0.05rem; }
  .dpct { font-family: var(--display); font-weight: 500; font-size: 1rem; color: var(--ink); }
  /* A FIGURE STATES ITS OWN BASIS: "67%" with nothing saying what of is a
     number nobody can check. */
  .dpbasis { font-size: 0.68rem; color: var(--faint); white-space: nowrap; }

  .atick {
    width: 30px; height: 30px; flex: none; border-radius: 9px;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; border: 1px solid var(--rule); color: var(--faint);
    cursor: pointer; transition: var(--t);
  }
  .atick:hover { color: var(--sage-lift); border-color: var(--sage-deep); background: var(--raised); }
  .atick.flat { border-color: transparent; background: var(--raised); cursor: default; }
  .atick svg { width: 16px; height: 16px; }
  .amain {
    flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 0.1rem;
    background: transparent; border: 0; color: var(--ink); cursor: pointer;
    text-align: left; padding: 0; transition: var(--t);
  }
  .amain.flat { cursor: default; }
  .amain:not(.flat):hover .anm { color: var(--brass); }
  .anm { font-size: 0.92rem; overflow-wrap: anywhere; }
  .asub { font-size: 0.76rem; color: var(--faint); }
  .aright { flex: 0 0 auto; display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; justify-content: flex-end; }
  .adate { font-family: var(--mono); font-size: 0.72rem; color: var(--faint); white-space: nowrap; }
  /* A derived row is marked, because a due born from the record and a task
     somebody typed are different kinds of fact and a screen that folds
     them together stops meaning what it says. */
  .a-derived .asub { font-style: italic; }

  /* ---------------- strips and chips ---------------- */
  .strip {
    display: flex; gap: 0.3rem; overflow-x: auto; margin: 0 0 0.9rem;
    border-bottom: 1px solid var(--rule); padding-bottom: 0.4rem;
  }
  .spage {
    flex: none; background: transparent; border: 1px solid transparent; border-radius: 8px;
    padding: 0.34rem 0.7rem; color: var(--faint); font-size: 0.84rem; cursor: pointer;
    white-space: nowrap; transition: var(--t);
  }
  .spage:hover { color: var(--ink); background: var(--raised); }
  .spage.on { color: var(--page); background: var(--ink); border-color: var(--ink); font-weight: 500; }
  .spage.on:hover { background: var(--ink-hover); border-color: var(--ink-hover); color: var(--page); }
  .chips { display: flex; gap: 0.35rem; flex-wrap: wrap; margin: 0 0 0.8rem; }
  .chip {
    background: transparent; border: 1px solid var(--rule); border-radius: 999px;
    padding: 0.2rem 0.65rem; color: var(--dim); font-size: 0.78rem; cursor: pointer;
    transition: var(--t);
  }
  .chip:hover { color: var(--ink); border-color: var(--brass-deep); }
  .chip.on { color: var(--page); background: var(--ink); border-color: var(--ink); }
  /* A chip carries its own count, so no chip can empty the list it filters
     and the chips are a partition of what is under them. */
  .cn { font-family: var(--mono); font-size: 0.72rem; opacity: 0.72; }

  /* ---------------- the identity block on a page ---------------- */
  .ident {
    display: flex; align-items: flex-start; gap: 0.8rem;
    background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r);
    border-left: 3px solid var(--rule); padding: 0.9rem 1.1rem; margin: 0 0 0.9rem;
  }
  .igrow { flex: 1 1 0; min-width: 0; }
  .isays { margin: 0; font-size: 0.9rem; color: var(--dim); overflow-wrap: anywhere; }
  .imeta { margin: 0.45rem 0 0; display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; font-size: 0.8rem; }

  /* ---------------- the progress bar ----------------
     It takes its ROW'S tone. Green means healthy state and nothing else:
     a sage bar inside a card whose edge is rose and whose words read
     "past its date" is one card saying two opposite things. */
  .bar {
    display: inline-block; width: 64px; height: 5px; border-radius: 99px;
    background: var(--sunken); overflow: hidden; flex: none;
  }
  .bar > span { display: block; height: 100%; border-radius: 99px; background: var(--rule-strong); }
  .bar.b-late > span  { background: var(--apricot); }
  .bar.b-drift > span { background: var(--amber); }
  .bar.b-live > span  { background: var(--sage); }
  .bar.b-done > span  { background: var(--rule-strong); }

  /* ---------------- a facts table ---------------- */
  .afacts { margin: 0; display: grid; grid-template-columns: minmax(7rem, auto) 1fr; gap: 0.35rem 0.9rem; }
  .afacts dt { font-size: 0.74rem; color: var(--faint); letter-spacing: 0.01em; }
  .afacts dd { margin: 0; font-size: 0.86rem; color: var(--ink); overflow-wrap: anywhere;
               display: flex; align-items: baseline; gap: 0.4rem; }
  .fval { min-width: 0; overflow-wrap: anywhere; }
  /* The pen is DIM AND ALWAYS THERE, never revealed on hover: a hover is no
     gesture at all on a touch screen, and on a laptop it makes the only
     route to correcting what you typed something you have to discover by
     waving the pointer about. */
  .fpen {
    flex: none; background: transparent; border: 0; padding: 0; cursor: pointer;
    color: var(--receded); line-height: 0; transition: var(--t);
  }
  .fpen:hover { color: var(--brass); }
  .fpen svg { width: 13px; height: 13px; }

  /* ---------------- a body: code does not wrap, prose does ----------------
     Same card, same head row, one property different. Wrapping code at
     forty characters changes what it says; setting a method in the code
     box made the one entry type written to be READ scroll sideways at its
     first long sentence. */
  .snip, .wrote {
    margin: 0; background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px;
    padding: 0.7rem 0.85rem; font-size: 0.8rem; line-height: 1.6; color: var(--ink);
  }
  .snip { font-family: var(--mono); white-space: pre; overflow-x: auto; }
  .wrote { font-family: var(--sans); white-space: pre-wrap; }

  /* ---------------- quick run ---------------- */
  .qrun { display: flex; gap: 0.4rem; flex-wrap: wrap; }
  /* A LAUNCHER BUTTON IS ONE LINE. A 200-character name turning a button
     into a six-line paragraph passes every overflow check and is not a
     launcher. */
  .qbtn { max-width: 14rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btn.small { padding: 0.22rem 0.55rem; font-size: 0.76rem; }
  .modal-note { margin: 0.6rem 1.1rem 0; font-size: 0.78rem; color: var(--faint); }

  /* ---------------- a row with a field in it ---------------- */
  .frow { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
  .frow label { font-size: 0.78rem; color: var(--dim); flex: 0 0 auto; }
  .frow input {
    flex: 1 1 12rem; min-width: 0;
    background: var(--sheet); border: 1px solid var(--rule); color: var(--ink);
    padding: 0.4rem 0.55rem; font: inherit; font-size: 0.9rem; border-radius: 8px;
  }
  .frow input:focus { outline: 1px solid var(--brass); outline-offset: -1px; border-color: var(--brass-deep); }
  /* A label that carries the field's purpose for a screen reader where the
     placeholder is doing the work on screen. A placeholder is not a label. */
  .sr {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip-path: inset(50%); white-space: nowrap;
  }

  /* ---------------- the month grid ----------------
     Nothing is typed in here: every mark comes from a project's date, an
     action's due date or a schedule record. A day carries a COUNT as
     well as a tone, so the grid says how much is on it rather than only
     that something is. */
  .cnav { display: flex; align-items: center; gap: 0.5rem; margin: 0 0 0.6rem; }
  .cnav b { font-family: var(--display); font-weight: 500; font-size: 0.95rem; }
  .cweek, .cgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
  .cweek span {
    font-size: 0.64rem; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--faint); text-align: center; padding-bottom: 0.25rem;
  }
  .cday {
    aspect-ratio: 1 / 1; min-height: 34px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    background: var(--sheet); border: 1px solid var(--rule-soft); border-radius: 8px;
    color: var(--dim); cursor: pointer; padding: 0; transition: var(--t);
  }
  .cday.out { background: transparent; border-color: transparent; cursor: default; }
  .cday b { font-weight: 400; font-size: 0.82rem; }
  .cday .cn { font-family: var(--mono); font-size: 0.6rem; }
  .cday:hover { border-color: var(--brass-deep); color: var(--ink); }
  /* State on a cell is its LEFT EDGE and its count, the same two channels
     as a row — a day filled with a hue would be identity, and a date is
     not a category. */
  .cday.c-late  { border-left: 3px solid var(--apricot); color: var(--ink); }
  .cday.c-live  { border-left: 3px solid var(--sage); color: var(--ink); }
  .cday.c-idle  { border-left: 3px solid var(--rule-strong); color: var(--ink); }
  .cday.cnow b { font-weight: 600; color: var(--ink); }
  .cday.cnow { border-color: var(--rule-strong); }
  .cday.csel { background: var(--raised); border-color: var(--brass); }

  /* ---------------- ONE FOCUS RING FOR EVERY TAPPABLE THING ----------------
     Applied once, the way `--t` is, rather than per component. Without it
     every whole-row control falls back to Chromium's default outline,
     which on a deep navy surface is a pale double ring belonging to no
     design in this app. */
  .btn:focus-visible, .tab:focus-visible, .rwrow:focus-visible,
  .drow:focus-visible, .arow:focus-visible, .amain:focus-visible,
  .atick:focus-visible, .spage:focus-visible, .chip:focus-visible,
  .fpen:focus-visible, .cday:focus-visible {
    outline: 1px solid var(--brass); outline-offset: 2px;
  }
  .btn:disabled { opacity: 0.38; cursor: default; }

  /* ---------------- the phone ---------------- */
  @media (max-width: 900px) {
    .grid2 { grid-template-columns: 1fr; }
  }
  @media (max-width: 760px) {
    .shell { flex-direction: column; }
    /* On a phone the rail is a bar across the top: pinning it full-height
       would cost a row of the screen the app has least of. */
    .rail {
      position: static; height: auto; width: 100%; border-right: 0;
      border-bottom: 1px solid var(--rule); padding: 0.7rem 0 0.5rem;
    }
    .railtop { display: flex; align-items: center; gap: 0.5rem; padding: 0 0.9rem; }
    .brand { padding: 0; flex: 1 1 0; }
    /* Five tabs across one row, nothing wrapping and nothing scrolled off
       the edge: the icon over the label, and the label small enough that
       the longest of them ("Workflows") still fits at 320px. */
    #nav { flex-direction: row; gap: 0; padding: 0.5rem 0.4rem 0; }
    .tab {
      flex: 1 1 0; min-width: 0; flex-direction: column; gap: 0.15rem;
      justify-content: center; text-align: center; padding: 0.4rem 0.1rem;
      font-size: 0.66rem; white-space: nowrap;
    }
    .railquick { display: none; }
    .railme { margin-top: 0.5rem; }
    .railme .rwrow { justify-content: center; }
    .view { padding: 1rem 0.9rem 3rem; }
    .page-head h2 { font-size: 1.25rem; }
  }
  @media (max-width: 560px) {
    /* A pill, a sentence and a date on one 334px row leaves the sentence
       about ten characters wide. The right-hand end takes its own line

     Mashghal Workspace — the round-3 rebuild.

     It exists beside `mashghal/` rather than replacing it because the
     round-3 brief describes a DIFFERENT APP, and folding each of its
     features into the old structure — then grading the result against
     that structure and calling it a match — is the fault its owner
     named. The old app is the old app, still there, still theirs.

     So this file starts from the brief's §32, which is one sentence and
     the whole method:

       "Do not build the UI first and invent data underneath it. Build
        canonical records, relationships, and shared derived selectors
        first; then make each screen a view over that same underlying
        workspace."

     Which means, in order:

       1. ONE WORKSPACE. Jobs, Projects, People, Actions, Assets,
          Workflows (with Nodes, Edges, Runs and RunNodes as their own
          records), Library entries, Schedule records, Reports and
          TimeEntries. Nothing is stored twice and no screen owns a list.

          `action.projectId`, `run.workflowId` — stated one way round,
          and read the other way by walking, so the two can never
          disagree.

          fourteen and they are named here exactly as it names them, so
          the same figure is the same figure everywhere.

     a run at its start, so editing the template could never move a run
     already under way. The brief separates Workflow from WorkflowRun

     own nodes, which is what lets a failed run keep its failure point
     against the reusable workflow. The freeze's real job is kept by two
     narrower rules instead:

         would take a run's history with it, so the record stays, off the
         canvas, and the run still reads.

     deciding that a Survey is not a thing somebody records. What is
     closed is what the app's own arithmetic depends on: an action's
     type decides which rule derives it, and a node's type decides what
     a run does when it reaches it.
     ============================================================ */

  /* The brief's six Action types. Two are STORED — a task and a piece of
     upkeep are the only things somebody types — and four are DERIVED
     from the runs, which is what keeps "is this step done" a single
     fact. `actionAll()` is where the two halves meet. */
  var ACTION_TYPES = {
    task:                 { word: "Task",           stored: true,  ico: "tick" },
    upkeep:               { word: "Upkeep",         stored: true,  ico: "clock" },
    waiting:              { word: "Waiting on",     stored: false, ico: "send" },
    in_hand:              { word: "In your hands",  stored: false, ico: "do" },
    workflow_manual_step: { word: "Workflow step",  stored: false, ico: "ask" },
    unfiled:              { word: "Unfiled",        stored: false, ico: "file" }
  };

  /* The five node types, and the one Action type each of them derives.
     Five onto four, one rule each, nothing overlapping: a `file` step is
     the archiving that gets forgotten, so it reads Unfiled rather than
     being another manual step. */
  var NODE_TYPES = {
    do:    { word: "Do",        act: "in_hand",              ico: "do" },
    send:  { word: "Send",      act: "waiting",              ico: "send" },
    watch: { word: "Watch",     act: "waiting",              ico: "watch" },
    ask:   { word: "Decide",    act: "workflow_manual_step", ico: "ask" },
    file:  { word: "File",      act: "unfiled",              ico: "file" },
    thing: { word: "Thing",     act: "",                     ico: "thing" }
  };

  /* The brief's two edge types, and they must never be conflated: a run
     advances along `sequence` alone and never touches an `association`,
     which is what lets a reference photograph hang off a step without
     becoming a predecessor. */
  var EDGE_TYPES = { sequence: "comes after", association: "belongs with, no order" };

  /* Assets are one registry viewed six ways (the brief's §Assets), and
     which view an entry is in is STATED rather than derived — ArcGIS Pro
     has a path AND a licence page, and a reader who types a name should
     never have to wonder which of six lists it landed in. */
  var ASSET_SECTIONS = [
    { id: "device", label: "Devices",     ico: "device", q: "What do I own, and where is it?" },
    { id: "app",    label: "Apps",        ico: "flow",   q: "What do I open to do the work?" },
    { id: "site",   label: "Sites",       ico: "site",   q: "What places are part of my work?" },
    { id: "file",   label: "Files",       ico: "doc",    q: "What is the work made of?" },
    { id: "lib",    label: "Library",     ico: "book",   q: "What is worth reusing?" },
    { id: "conn",   label: "Connections", ico: "plug",   q: "What can I actually reach?" }
  ];

  /* The brief's five Library entry types. They land on three forms,
     because the LANGUAGE is what says whether a body is code: a script
     and a formula are one record with a different language, a method and
     a template are one record with none, and a reference is a link with
     a note and no body at all. */
  var LIB_TYPES = {
    method:    { word: "Method",    body: "prose", hint: "How something is done, written out to be read." },
    script:    { word: "Script",    body: "code",  hint: "Code you run again." },
    formula:   { word: "Formula",   body: "code",  hint: "A spreadsheet formula, in Excel's own language." },
    reference: { word: "Reference", body: "",      hint: "A link and a note. No body." },
    template:  { word: "Template",  body: "prose", hint: "A shape to start from." }
  };

  /* ============================================================
     THE RECORD. One shape, adopted in one place.
     ============================================================ */

  function blank() {
    return {
      version: 1,
      /* who the work is for, and who is owed hours for it */
      claimants: [],  // {id,name,weeklyHours,archived,updatedAt}
      jobs:      [],  // {id,name,description,claimantId,status,updatedAt}
      /* why the work exists */
      projects:  [],  // {id,name,description,jobId,status,startDate,endDate,createdAt,updatedAt}
      /* who is involved, and what is outstanding with them */
      people:    [],  // {id,name,organization,contactMethods[],notes,updatedAt}
      personLinks: [], // {id,personId,projectId,purpose,status,outstanding,since,updatedAt}
      /* what happens next — stored types only; see actionAll() */
      actions:   [],  // {id,title,type,projectId,personId,assetId,dueDate,completedAt,status,recurringRule,notes,updatedAt}
      /* what the work is made of and made with */
      assets:    [],  // {id,type,section,name,description,path,url,state,lastUsedOn,atId,fromIds[],topics[],facts[],geo,body,lang,subjects[],updatedAt}
      /* how the work is carried out — five records, deliberately */
      workflows: [],  // {id,name,description,version,projectId,updatedAt}
      wfNodes:   [],  // {id,workflowId,type,label,positionX,positionY,config,retired,updatedAt}
      wfEdges:   [],  // {id,workflowId,fromNodeId,toNodeId,type,label,updatedAt}
      runs:      [],  // {id,workflowId,projectId,title,startedAt,completedAt,status,workflowVersion,updatedAt}
      runNodes:  [],  // {id,runId,nodeId,status,startedAt,completedAt,answer,chasedOn,outputAssetIds[],updatedAt}
      /* when known dates occur */
      schedule:  [],  // {id,title,kind,at,projectId,notes,updatedAt}
      /* what the work produced. Filed is DERIVED from done file steps;
         only a report has a state nothing can derive (Draft/Submitted). */
      reports:   [],  // {id,title,projectId,fromISO,toISO,status,body,builtAt,updatedAt}
      timeEntries: [], // {id,projectId,claimantId,startedAt,endedAt,description,updatedAt}
      settings: {
        owner: "",
        theme: "",
        sampleLoaded: false
      },
      forgotten: {}   // id -> name, so a removed record's history still reads
    };
  }

  /* Anything added to the shape goes in one of these two lists or in
     adoptState's settings block, and NOWHERE else. Coffer lost grants
     out of a restored backup because two places hand-copied one key
     list and only one of them was updated. */
  var STATE_LISTS = ["claimants", "jobs", "projects", "people", "personLinks", "actions",
    "assets", "workflows", "wfNodes", "wfEdges", "runs", "runNodes", "schedule",
    "reports", "timeEntries"];

  function adoptState(raw, shape) {
    raw = raw || {};
    STATE_LISTS.forEach(function (k) {
      shape[k] = Array.isArray(raw[k]) ? raw[k] : [];
    });
    shape.forgotten = (raw.forgotten && typeof raw.forgotten === "object") ? raw.forgotten : {};
    var s = raw.settings || {};
    shape.settings.owner = typeof s.owner === "string" ? s.owner : "";
    shape.settings.theme = s.theme === "light" || s.theme === "dark" ? s.theme : "";
    shape.settings.sampleLoaded = !!s.sampleLoaded;
    return shape;
  }

  /* ============================================================
     Small helpers. Everything below reads the record and stores
     nothing, so nothing here can drift from what it describes.
     ============================================================ */

  function byId(list, id) {
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }
  function stamp(r) { r.updatedAt = new Date().toISOString(); return r; }

  /* A date has to EXIST, not merely be shaped like one. The shape regex
     passed 2026-13-45, which stored, parsed to Invalid Date, and then
     appeared on no screen at all — eight hours in a hole nothing could
     see. Round-tripping through the calendar is the only test for it. */
  function dayOk(v) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) return false;
    var d = parseISO(v);
    return !isNaN(d) && iso(d) === v;
  }

  /* Past about a month a count of days stops being an answer — nobody
     holds four months as a number of days, and the date is the fact you
     would actually use. Under a month, elapsed time places a thing in
     this week without arithmetic. */
  function agoWords(dateStr) {
    if (!dayOk(dateStr)) return "";
    var n = daysBetween(dateStr, today());
    if (n < 0) return "in " + numWord(-n) + " " + plural(-n, "day");
    if (n === 0) return "today";
    if (n === 1) return "yesterday";
    if (n < 31) return n + " days ago";
    return plainDate(dateStr);
  }
  function plainDate(dateStr) {
    if (!dayOk(dateStr)) return "";
    var d = parseISO(dateStr);
    return d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
  }
  /* A small count in prose is a WORD; a figure in a tile or a heading
     stays a figure. "1 steps" is the fault this catches. */
  var NUM_WORDS = ["no", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten"];
  function numWord(n) { return n >= 0 && n <= 10 ? NUM_WORDS[n] : String(n); }
  function plural(n, one, many) { return n === 1 ? one : (many || one + "s"); }
  function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
  /* A CLIP THAT CUTS MID-WORD CAN SAY THE OPPOSITE OF WHAT IT MEANT.
     "It loops while there are notes" cut at sixty characters read
     "…while there are no…", which is not a shortened sentence, it is a
     wrong one. Breaking at the last space inside the limit cannot do
     that: the worst it can do is stop a word early. */
  function clip(s, n) {
    s = String(s || "");
    if (s.length <= n) return s;
    var cut = s.slice(0, n - 1);
    var sp = cut.lastIndexOf(" ");
    if (sp > n * 0.6) cut = cut.slice(0, sp);
    return cut.replace(/[\s,;:.—-]+$/, "") + "…";
  }

  /* A removed record still has to READ. Its name goes to `forgotten` so
     an entry that names it says "Balamand (removed)" rather than losing
     the history — without it the row reads "(removed)" and the past
     stops being the past. */
  function nameOf(list, id) {
    if (!id) return "";
    var r = byId(state[list], id);
    if (r && !r.archived) return r.name;
    if (r) return r.name + " (removed)";
    if (state.forgotten[id]) return state.forgotten[id] + " (removed)";
    return "(removed)";
  }

  /* ============================================================
     THE DERIVED SELECTORS.

     The brief names fourteen and they are named here exactly as it
     names them, because its own rule is the reason they exist: "Every
     screen should use the same derived functions so that the same
     figure/state is identical everywhere." A screen that computes its
     own version of one of these is the bug.
     ============================================================ */

  /* ---------------- the workflow's five records ---------------- */

  function workflowNodes(wfId) {
    return state.wfNodes.filter(function (n) { return n.workflowId === wfId; });
  }
  function workflowEdges(wfId) {
    return state.wfEdges.filter(function (e) { return e.workflowId === wfId; });
  }
  /* Nodes that are still on the canvas. A node a run has entered is
     RETIRED and not deleted — the run's history points at it — so it
     drops out of the drawing and out of a new run, and stays readable
     wherever an old run names it. */
  function liveNodes(wfId) {
    return workflowNodes(wfId).filter(function (n) { return !n.retired; });
  }
  function getWorkflowRuns(wfId) {
    return state.runs.filter(function (r) { return r.workflowId === wfId; })
      .sort(function (a, b) { return (b.startedAt || "").localeCompare(a.startedAt || ""); });
  }
  function runNodeFor(runId, nodeId) {
    for (var i = 0; i < state.runNodes.length; i++) {
      var rn = state.runNodes[i];
      if (rn.runId === runId && rn.nodeId === nodeId) return rn;
    }
    return null;
  }
  function openRuns() {
    return state.runs.filter(function (r) { return !r.completedAt; });
  }

  /* A run's node states, in the brief's words. `pending` is a step the
     run has not reached, `active` one it is sitting at, `done` one it
     has passed, `blocked` one whose ways in are not all done, `skipped`
     a branch not taken and `failed` one recorded as having gone wrong.
     Derived from the runNode record plus the edges, never stored twice. */
  var RUN_NODE_STATES = {
    pending: { word: "Not started", tone: "idle" },
    active:  { word: "In progress", tone: "live" },
    blocked: { word: "Blocked",     tone: "drift" },
    done:    { word: "Done",        tone: "done" },
    skipped: { word: "Skipped",     tone: "idle" },
    failed:  { word: "Failed",      tone: "late" }
  };
  function runNodeState(run, node) {
    var rn = runNodeFor(run.id, node.id);
    if (!rn) return "pending";
    if (rn.status === "failed" || rn.status === "skipped") return rn.status;
    if (rn.completedAt) return "done";
    if (!rn.startedAt) return "pending";
    /* A step held until every marked way in is done says so, or the
       board claims it waits for all its inputs while the run started it
       on the first — a label that lies. */
    if (node.config && node.config.join === "all") {
      var ins = workflowEdges(run.workflowId).filter(function (e) {
        return e.toNodeId === node.id && e.type === "sequence";
      });
      var held = ins.some(function (e) {
        var up = runNodeFor(run.id, e.fromNodeId);
        return up && up.startedAt && !up.completedAt;
      });
      if (held) return "blocked";
    }
    return "active";
  }
  /* The set of steps a run is sitting at. A run is at a SET and never at
     one — the GIS example has buildings done, roads done, maps awaited
     and metadata being checked, concurrently — so this is derived from
     the runNode dates rather than a stored position, and can never
     disagree with them. */
  function activeRunNodes(run) {
    return workflowNodes(run.workflowId).filter(function (n) {
      return n.type !== "thing" && runNodeState(run, n) === "active";
    });
  }

  /* ---------------- the Actions, stored and derived ---------------- */

  /* Who a send or a watch is waiting on: the people the node names
     through an association edge, or written onto the node itself. A
     watch with nobody to chase is the legitimate case, not a gap. */
  function nodePeople(node) {
    var out = [];
    workflowEdges(node.workflowId).forEach(function (e) {
      if (e.type !== "association") return;
      var other = e.fromNodeId === node.id ? e.toNodeId : e.toNodeId === node.id ? e.fromNodeId : "";
      if (!other) return;
      var n = byId(state.wfNodes, other);
      if (n && n.type === "thing" && n.config && n.config.personId) out.push(n.config.personId);
    });
    if (node.config && node.config.personId) out.push(node.config.personId);
    return out.filter(function (p, i, a) { return a.indexOf(p) === i; });
  }

  /* An action born from the record. It carries `derived: true` because
     the screens have to be able to say which half is which — folding
     the typed and the derived into one undifferentiated list is what
     makes a figure stop meaning what it says. */
  function derivedActions() {
    var out = [];
    openRuns().forEach(function (run) {
      var wf = byId(state.workflows, run.workflowId);
      activeRunNodes(run).forEach(function (n) {
        var t = (NODE_TYPES[n.type] || {}).act;
        if (!t) return;
        var rn = runNodeFor(run.id, n.id) || {};
        var who = nodePeople(n);
        out.push({
          id: "rn:" + run.id + ":" + n.id,
          derived: true,
          type: t,
          title: n.label,
          projectId: run.projectId,
          workflowRunId: run.id,
          workflowId: run.workflowId,
          nodeId: n.id,
          personId: who[0] || "",
          personIds: who,
          dueDate: (n.config && n.config.dueAt) || "",
          chaseAfterDays: (n.config && n.config.chaseAfterDays) || 0,
          since: rn.startedAt || run.startedAt || "",
          chasedOn: rn.chasedOn || "",
          context: (wf ? wf.name : "") + (run.title && wf && run.title !== wf.name ? " — " + run.title : ""),
          completedAt: "",
          notes: (n.config && n.config.notes) || ""
        });
      });
      /* A run whose steps are all done but whose filing is not is the
         third forgetting, and it is the one thing in the book that says
         a piece of work has NOT left the building. */
    });
    /* Outstanding with a person, stated on the relationship rather than
       derived from a run — the brief's PersonRelationship.outstanding. */
    state.personLinks.forEach(function (pl) {
      if (!pl.outstanding) return;
      out.push({
        id: "pl:" + pl.id,
        derived: true,
        type: "waiting",
        title: pl.outstanding,
        projectId: pl.projectId,
        personId: pl.personId,
        personIds: [pl.personId],
        dueDate: "",
        chaseAfterDays: 0,
        since: pl.since || "",
        context: pl.purpose || "",
        completedAt: "",
        notes: ""
      });
    });
    return out;
  }

  /* Where the two halves meet. Everything that asks "what happens next"
     asks this — the attention tiles, the groups, Home, a project page —
     so no two of them can count differently. */
  function actionAll() {
    return state.actions.map(function (a) { return a; }).concat(derivedActions());
  }
  function actionOpen() {
    return actionAll().filter(function (a) { return !a.completedAt; });
  }

  /* Upkeep is "every so often since it was last done", never a date, so
     arrears never compound: there is one of each however far past. */
  function upkeepDue(a) {
    var rule = a.recurringRule || {};
    var every = num(rule.everyDays);
    if (!every) return { due: false, over: 0, next: "" };
    var last = dayOk(rule.lastDoneOn) ? rule.lastDoneOn : "";
    if (!last) return { due: true, over: 0, next: "", never: true };
    var next = addDays(last, every);
    var over = daysBetween(next, today());
    return { due: over >= 0, over: Math.max(over, 0), next: next };
  }

  /* THE SEVEN STATES THE BRIEF NAMES, and every open action is in
     exactly ONE of them — so the attention tiles are a partition of the
     list beneath them and a figure can never disagree with its own
     parts. Nothing here is stored: the brief says so in as many words
     ("Do not store a separate isLate boolean"). */
  var ACTION_STATES = {
    late:    { word: "Late",          tone: "late" },
    unfiled: { word: "Unfiled",       tone: "drift" },
    today:   { word: "Today",         tone: "live" },
    waiting: { word: "Waiting",       tone: "idle" },
    upkeep:  { word: "Recurring",     tone: "idle" },
    hands:   { word: "In your hands", tone: "live" },
    done:    { word: "Complete",      tone: "done" }
  };
  function actionState(a) {
    if (a.completedAt) return "done";
    var late = false;
    if (a.dueDate && dayOk(a.dueDate) && a.dueDate < today()) late = true;
    if (a.type === "waiting" && a.chaseAfterDays && a.since) {
      var from = (a.chasedOn || a.since).slice(0, 10);
      if (dayOk(from) && daysBetween(from, today()) > a.chaseAfterDays) late = true;
    }
    if (a.type === "upkeep") {
      var u = upkeepDue(a);
      if (u.due && u.over > 0) late = true;
    }
    if (late) return "late";
    if (a.type === "unfiled") return "unfiled";
    if (a.dueDate && a.dueDate === today()) return "today";
    if (a.type === "waiting") return "waiting";
    if (a.type === "upkeep") return "upkeep";
    return "hands";
  }
  function actionsInState(k) {
    return actionOpen().filter(function (a) { return actionState(a) === k; });
  }

  /* The brief's three, by name. Each is one line over actionAll(), so
     the Actions screen, Home's attention strip and a project page are
     reading the same list through the same test. */
  function getLateActions()    { return actionsInState("late"); }
  function getWaitingActions() { return actionsInState("waiting"); }
  function getUnfiledActions() { return actionsInState("unfiled"); }

  /* ---------------- projects ---------------- */

  function projectWorkflows(pid) {
    var direct = state.workflows.filter(function (w) { return w.projectId === pid; });
    var viaRuns = state.runs.filter(function (r) { return r.projectId === pid; })
      .map(function (r) { return byId(state.workflows, r.workflowId); })
      .filter(function (w) { return w && direct.indexOf(w) < 0; });
    return direct.concat(viaRuns.filter(function (w, i, a) { return a.indexOf(w) === i; }));
  }
  function projectRuns(pid) {
    return state.runs.filter(function (r) { return r.projectId === pid; });
  }

  /* A FIGURE STATES ITS OWN BASIS. Progress over a project's run steps
     is one thing and progress over its typed actions is another, and a
     screen that prints "67%" without saying which is inviting the
     reader to trust a number they cannot check. */
  function getProjectProgress(pid) {
    var runs = projectRuns(pid);
    if (runs.length) {
      var total = 0, done = 0;
      runs.forEach(function (r) {
        workflowNodes(r.workflowId).forEach(function (n) {
          if (n.type === "thing") return;
          total++;
          var st = runNodeState(r, n);
          if (st === "done" || st === "skipped") done++;
        });
      });
      if (total) return { done: done, total: total, pct: done / total, basis: "workflow steps" };
    }
    var acts = actionAll().filter(function (a) { return a.projectId === pid; });
    if (acts.length) {
      var d = acts.filter(function (a) { return a.completedAt; }).length;
      return { done: d, total: acts.length, pct: d / acts.length, basis: "actions" };
    }
    return { done: 0, total: 0, pct: 0, basis: "" };
  }

  function getProjectActions(pid) {
    return actionAll().filter(function (a) { return a.projectId === pid; });
  }

  /* What the project is made of. Derived from three places and folded,
     so a thing cannot be on the project page and missing from Assets:
     stated on the project, named by one of its workflow's thing nodes,
     or carried on one of its actions. */
  function getProjectThings(pid) {
    var ids = {};
    var p = byId(state.projects, pid);
    if (p && Array.isArray(p.assetIds)) p.assetIds.forEach(function (i) { ids[i] = 1; });
    projectWorkflows(pid).forEach(function (w) {
      workflowNodes(w.id).forEach(function (n) {
        if (n.type === "thing" && n.config && n.config.assetId) ids[n.config.assetId] = 1;
      });
    });
    getProjectActions(pid).forEach(function (a) { if (a.assetId) ids[a.assetId] = 1; });
    return Object.keys(ids).map(function (i) { return byId(state.assets, i); })
      .filter(function (a) { return !!a; });
  }

  /* Who is involved. The relationship is the stated half; the rest is
     read off the runs, so a person cannot read "one thing is late" here
     and "clear" on the Actions screen. */
  function getProjectPeople(pid) {
    var out = {};
    state.personLinks.filter(function (pl) { return pl.projectId === pid; }).forEach(function (pl) {
      out[pl.personId] = { person: byId(state.people, pl.personId), link: pl, outstanding: [] };
    });
    getProjectActions(pid).forEach(function (a) {
      (a.personIds || (a.personId ? [a.personId] : [])).forEach(function (id) {
        if (!out[id]) out[id] = { person: byId(state.people, id), link: null, outstanding: [] };
        if (!a.completedAt && a.type === "waiting") out[id].outstanding.push(a);
      });
    });
    return Object.keys(out).map(function (k) { return out[k]; })
      .filter(function (r) { return !!r.person; });
  }

  /* ---------------- outputs ---------------- */

  /* FILED IS DERIVED and only a report is stored. A done filing step is
     the one thing in the book that says a piece of work left the
     building, so it is read off the runs in ONE walk — two walks would
     eventually answer the same question differently. A report is the
     other case: Draft and Submitted are states nothing can derive. */
  function getFiled(fromISO, toISO) {
    var out = [];
    state.runs.forEach(function (run) {
      workflowNodes(run.workflowId).forEach(function (n) {
        if (n.type !== "file") return;
        var rn = runNodeFor(run.id, n.id);
        if (!rn || !rn.completedAt) return;
        var day = rn.completedAt.slice(0, 10);
        if (fromISO && day < fromISO) return;
        if (toISO && day > toISO) return;
        var wf = byId(state.workflows, run.workflowId);
        out.push({
          title: n.label, at: day, runId: run.id, nodeId: n.id,
          workflowId: run.workflowId, workflowName: wf ? wf.name : "",
          projectId: run.projectId,
          where: (n.config && n.config.path) || (n.config && n.config.url) || ""
        });
      });
    });
    return out.sort(function (a, b) { return b.at.localeCompare(a.at); });
  }
  function getProjectOutputs(pid) {
    return {
      filed: getFiled().filter(function (f) { return f.projectId === pid; }),
      reports: state.reports.filter(function (r) { return r.projectId === pid; }),
      hours: state.timeEntries.filter(function (t) { return t.projectId === pid; })
    };
  }

  /* ---------------- hours ---------------- */

  /* Duration is endedAt minus startedAt and no total is stored, so no
     figure on any screen can drift from the entries under it. An entry
     with no end is not an hour and counts nowhere. */
  function entryMinutes(t) {
    if (!t.startedAt || !t.endedAt) return 0;
    var a = new Date(t.startedAt), b = new Date(t.endedAt);
    if (isNaN(a) || isNaN(b) || b <= a) return 0;
    return Math.round((b - a) / 60000);
  }
  function hourWords(mins) {
    if (!mins) return "0h";
    var h = Math.floor(mins / 60), m = mins % 60;
    return (h ? h + "h" : "") + (m ? (h ? " " : "") + m + "m" : "");
  }
  function getClaimantHours(claimantId, fromISO, toISO) {
    var rows = state.timeEntries.filter(function (t) {
      if (claimantId && t.claimantId !== claimantId) return false;
      var day = (t.startedAt || "").slice(0, 10);
      if (fromISO && day < fromISO) return false;
      if (toISO && day > toISO) return false;
      return true;
    });
    var mins = 0, open = 0, byProject = {};
    rows.forEach(function (t) {
      if (!t.endedAt) { open++; return; }
      var m = entryMinutes(t);
      mins += m;
      byProject[t.projectId || ""] = (byProject[t.projectId || ""] || 0) + m;
    });
    return { minutes: mins, open: open, entries: rows, byProject: byProject };
  }

  /* ---------------- the library ---------------- */

  function libEntries() {
    return state.assets.filter(function (a) { return a.section === "lib"; });
  }
  function getLibraryEntriesByType() {
    var out = {};
    Object.keys(LIB_TYPES).forEach(function (k) { out[k] = []; });
    libEntries().forEach(function (a) {
      var k = LIB_TYPES[a.type] ? a.type : "reference";
      out[k].push(a);
    });
    return out;
  }
  function getLibraryEntriesBySubject() {
    var out = {};
    libEntries().forEach(function (a) {
      (a.subjects && a.subjects.length ? a.subjects : ["(no subject)"]).forEach(function (s) {
        (out[s] = out[s] || []).push(a);
      });
    });
    return out;
  }
  function searchLibrary(q) {
    q = String(q || "").trim().toLowerCase();
    if (!q) return libEntries();
    return libEntries().filter(function (a) {
      var hay = [a.name, a.description, a.body, a.lang, (a.subjects || []).join(" "),
        (a.topics || []).join(" ")].join(" ").toLowerCase();
      return q.split(/\s+/).every(function (t) { return hay.indexOf(t) >= 0; });
    });
  }

  /* ---------------- the schedule ---------------- */

  /* Every known date, from one walk: the stored records, plus anything
     open that carries a date. Two walks would eventually disagree, which
     is how the original's calendar came to print one meeting three
     times. */
  function getUpcomingSchedule(days) {
    var to = addDays(today(), days == null ? 60 : days);
    var out = [];
    state.schedule.forEach(function (s) {
      if (!dayOk(s.at) || s.at < today() || s.at > to) return;
      out.push({ at: s.at, title: s.title, kind: s.kind || "date", projectId: s.projectId, id: "sc:" + s.id });
    });
    actionOpen().forEach(function (a) {
      if (!a.dueDate || !dayOk(a.dueDate) || a.dueDate < today() || a.dueDate > to) return;
      out.push({ at: a.dueDate, title: a.title, kind: "action", projectId: a.projectId, id: "ac:" + a.id });
    });
    state.projects.forEach(function (p) {
      if (!dayOk(p.endDate) || p.endDate < today() || p.endDate > to) return;
      out.push({ at: p.endDate, title: p.name + " — deadline", kind: "deadline", projectId: p.id, id: "pj:" + p.id });
    });
    return out.sort(function (a, b) { return a.at.localeCompare(b.at); });
  }

  /* ---------------- projects: stated status, derived attention ----------------
     The brief is explicit about the split, and it is the right one:
     Active · Waiting · Completed · Archived are STATED, and "Drifting:
     only if explicitly marked; never infer it." What is derived is
     whether the project needs attention, which is read off its own
     actions — so a project cannot read clear here and late on the
     Actions screen. */

  var PROJECT_STATUS = {
    active:    { word: "Active",    tone: "live",  rank: 2 },
    waiting:   { word: "Waiting",   tone: "idle",  rank: 3 },
    drifting:  { word: "Drifting",  tone: "drift", rank: 1 },
    completed: { word: "Completed", tone: "done",  rank: 4 },
    archived:  { word: "Archived",  tone: "done",  rank: 5 }
  };
  function getProjectState(pid) {
    var p = byId(state.projects, pid);
    var key = p && PROJECT_STATUS[p.status] ? p.status : "active";
    var base = PROJECT_STATUS[key];
    var open = getProjectActions(pid).filter(function (a) { return !a.completedAt; });
    var late = open.filter(function (a) { return actionState(a) === "late"; }).length;
    var out = { status: key, word: base.word, tone: base.tone, rank: base.rank,
                late: late, open: open.length, next: nextActionIn(pid), overdue: false };
    /* A finished project is finished; a late action inside one is a
       question about the record, not an alarm about the work. */
    if (key === "completed" || key === "archived") { out.late = 0; return out; }
    if (late) { out.word = "Late"; out.tone = "late"; out.rank = 0; return out; }
    /* AND A DATE THAT HAS GONE BY IS NOT INFERRED DRIFT. The brief says
       Drifting is only ever stated, and it is right — but a project whose
       own end date is in the past reading "Active" is a pill
       contradicting the line above it, which prints that date. It is
       derived from a figure somebody typed, which is the difference. */
    if (p && dayOk(p.endDate) && p.endDate < today()) {
      out.overdue = true; out.word = "Past its date"; out.tone = "drift"; out.rank = 1;
    }
    return out;
  }
  /* The one thing a project row owes you beyond its name: what to do
     next. Worst first, so the row names the late step rather than the
     first one somebody happened to write down. */
  function nextActionIn(pid) {
    var open = getProjectActions(pid).filter(function (a) { return !a.completedAt; });
    var order = ["late", "today", "unfiled", "hands", "waiting", "upkeep"];
    open.sort(function (a, b) {
      return order.indexOf(actionState(a)) - order.indexOf(actionState(b));
    });
    return open[0] || null;
  }
  function projectsSorted() {
    return state.projects.slice().sort(function (a, b) {
      var sa = getProjectState(a.id), sb = getProjectState(b.id);
      if (sa.rank !== sb.rank) return sa.rank - sb.rank;
      if (sb.late !== sa.late) return sb.late - sa.late;
      return a.name.localeCompare(b.name);
    });
  }

  /* ---------------- running a workflow ----------------
     A run is never advanced for you: an `ask` is answered by a person,
     never inferred from elapsed time, and finishing one opens ONLY the
     way out that was chosen — which is how a revision cycle loops. */

  function nowISO() { return new Date().toISOString(); }

  function entryNodes(wfId) {
    var nodes = liveNodes(wfId).filter(function (n) { return n.type !== "thing"; });
    var seq = workflowEdges(wfId).filter(function (e) { return e.type === "sequence"; });
    var entries = nodes.filter(function (n) {
      return !seq.some(function (e) { return e.toNodeId === n.id; });
    });
    /* A workflow whose steps form a closed loop has no step with
       nothing before it. Rather than refusing to run at all, the first
       step written is the way in and the screen SAYS it was chosen for
       lack of one. */
    if (!entries.length && nodes.length) return [nodes[0]];
    return entries;
  }
  function enterNode(run, nodeId) {
    var rn = runNodeFor(run.id, nodeId);
    if (rn) {
      if (!rn.startedAt) { rn.startedAt = nowISO(); rn.status = "active"; stamp(rn); }
      return rn;
    }
    rn = stamp({
      id: uid(), runId: run.id, nodeId: nodeId, status: "active",
      startedAt: nowISO(), completedAt: "", answer: "", chasedOn: "", outputAssetIds: []
    });
    state.runNodes.push(rn);
    return rn;
  }
  function startRun(wf, projectId, title) {
    var run = stamp({
      id: uid(), workflowId: wf.id, projectId: projectId || wf.projectId || "",
      title: title || wf.name, startedAt: nowISO(), completedAt: "",
      status: "active", workflowVersion: num(wf.version) || 1
    });
    state.runs.push(run);
    entryNodes(wf.id).forEach(function (n) { enterNode(run, n.id); });
    return run;
  }
  /* Only the exit that was chosen, and only ways in that were actually
     ENTERED can hold a join — or a branch never taken deadlocks the run
     for ever. */
  function advanceFrom(run, node, answer) {
    var outs = workflowEdges(run.workflowId).filter(function (e) {
      return e.type === "sequence" && e.fromNodeId === node.id;
    });
    if (node.type === "ask" && answer) {
      var chosen = outs.filter(function (e) { return (e.label || "") === answer; });
      if (chosen.length) outs = chosen;
    }
    outs.forEach(function (e) {
      var target = byId(state.wfNodes, e.toNodeId);
      if (!target || target.type === "thing") return;
      if (target.config && target.config.join === "all") {
        var ins = workflowEdges(run.workflowId).filter(function (x) {
          return x.type === "sequence" && x.toNodeId === target.id;
        });
        var held = ins.some(function (x) {
          var up = runNodeFor(run.id, x.fromNodeId);
          return up && up.startedAt && !up.completedAt;
        });
        if (held) return;
      }
      enterNode(run, target.id);
    });
  }
  function finishRunNode(run, node, answer) {
    var rn = enterNode(run, node.id);
    rn.completedAt = nowISO();
    rn.status = "done";
    if (answer) rn.answer = answer;
    stamp(rn);
    advanceFrom(run, node, answer);
    stamp(run);
  }
  /* Where a run stands, without being opened. `word` is one sentence and
     the figures under it are the parts of it, so the two cannot
     disagree. */
  function runStand(run) {
    var nodes = workflowNodes(run.workflowId).filter(function (n) { return n.type !== "thing"; });
    var done = 0, active = 0, unfiled = [];
    nodes.forEach(function (n) {
      var st = runNodeState(run, n);
      if (st === "done" || st === "skipped") done++;
      else if (st === "active" || st === "blocked") active++;
      if (n.type === "file" && st !== "done" && st !== "skipped") unfiled.push(n);
    });
    var wf = byId(state.workflows, run.workflowId);
    return {
      total: nodes.length, done: done, active: active, unfiled: unfiled,
      pct: nodes.length ? done / nodes.length : 0,
      closed: !!run.completedAt,
      /* The workflow can be edited under a run now — that is the brief's
         model, and the freeze is gone — so the run says how far the two
         have parted rather than pretending they have not. */
      edits: wf ? Math.max(0, (num(wf.version) || 1) - (num(run.workflowVersion) || 1)) : 0,
      workflowName: wf ? wf.name : "(removed)"
    };
  }

  /* ---------------- assets: one selector for how a thing stands ----------------
     In the brief's words and per its own section, so the row, the facts
     table and a project's Things page cannot disagree. An UNSTATED
     state reads "Unknown": the brief's §28 says so in as many words —
     "Unknown information should be represented explicitly as unknown" —
     and a named absence is not a guess. */

  var DEVICE_STATES = {
    "":        "Unknown",
    ready:     "Available",
    out:       "In use",
    fixing:    "Maintenance",
    lost:      "Missing",
    archived:  "Archived"
  };
  function assetState(a) {
    if (!a) return { word: "Unknown", tone: "idle" };
    if (a.archived) return { word: "Archived", tone: "done" };
    var sec = a.section || "file";
    if (sec === "device") {
      var w = DEVICE_STATES[a.state || ""] || "Unknown";
      return { word: w, tone: w === "Missing" ? "late" : w === "Maintenance" || w === "In use" ? "drift" : w === "Available" ? "live" : "idle" };
    }
    if (sec === "lib") {
      var reusable = !!(a.body || a.url || a.path);
      return reusable ? { word: "Reusable", tone: "live" } : { word: "Needs review", tone: "drift" };
    }
    if (sec === "site") {
      return a.geo && a.geo.lat != null ? { word: "Located", tone: "live" }
                                        : { word: "Location unknown", tone: "idle" };
    }
    if (sec === "app") {
      if (a.url) return { word: "Web", tone: "live" };
      if (a.path) return { word: "Installed", tone: "live" };
      return { word: "Unknown", tone: "idle" };
    }
    if (sec === "conn") {
      if (a.url) return { word: "Connected", tone: "live" };
      if (a.path) return { word: "Available", tone: "drift" };
      return { word: "No opener recorded", tone: "idle" };
    }
    if (a.path || a.url) return { word: "Available", tone: "live" };
    return { word: "Unknown", tone: "idle" };
  }

  /* THE ONE PLACE THAT DECIDES WHAT "OPEN" MEANS, because there are
     three answers and only one of them is a plain link. A page served
     over https is NOT ALLOWED to navigate to file:///C:/… — every
     browser blocks it and Chrome blocks it silently — so a path is
     never rendered as a file:// href: a control that quietly does
     nothing is worse than no control. */
  function openHandle(a) {
    if (a && a.url) {
      return { can: true, kind: "link", href: a.url, label: "Open the link",
               brief: clip(a.url, 44) };
    }
    if (a && a.path) {
      return { can: false, kind: "copy", value: a.path, label: "Copy the path",
               brief: clip(a.path, 44),
               why: "A page served over https may not open a file on this computer — the browser refuses it, so the path is copied instead.",
               how: "Paste it into Win+R, or into Explorer's address bar." };
    }
    return { can: false, kind: "none", label: "",
             why: "This item has no usable open location." };
  }

  /* ============================================================
     Shared bits of markup. Every row in the app is built by one of
     these, so two renderings of one thing cannot disagree about what
     its parts mean — which is the fault a second copy of a list always
     eventually produces.
     ============================================================ */

  /* An identity tile: a low-alpha tint behind a muted glyph. Colour runs
     in TWO CHANNELS and they never mix — identity (which section, which
     kind) lives only here, and state (how is this going) lives only in
     a pill carrying a word and in a row's left edge. With the channels
     separated a green tile never claims a thing is healthy and a rose
     edge never claims it belongs to a category. */
  function itile(ico, id) {
    return '<span class="itile id-' + (id || "n") + '" aria-hidden="true">' + (ICONS[ico] || ICONS.thing) + "</span>";
  }
  /* State is a WORD, always. Never colour alone — the brief says so and
     so does every reader who cannot separate the hues. */
  function pill(word, tone) {
    if (!word) return "";
    return '<span class="pill p-' + (tone || "idle") + '">' + esc(word) + "</span>";
  }
  function tileFig(label, fig, foot, tone) {
    return '<div class="ftile' + (tone ? " t-" + tone : "") + '">' +
      '<span class="flab">' + esc(label) + "</span>" +
      '<span class="ffig">' + fig + "</span>" +
      (foot ? '<span class="ffoot">' + foot + "</span>" : "") + "</div>";
  }
  /* A finding, then the one thing to do about it — so the two lines are
     always set the same way round and the second is always the quieter
     one. An empty list's job is to say what to do, not to repeat what
     the section is. */
  function emptyLines(head, sub) {
    return '<div class="empty"><p class="ehead">' + esc(head) + "</p>" +
      (sub ? '<p class="esub">' + esc(sub) + "</p>" : "") + "</div>";
  }
  function panel(head, body, right) {
    return '<section class="panel"><div class="phead"><h3>' + esc(head) + "</h3>" +
      (right || "") + "</div>" + body + "</section>";
  }
  function pageHead2(title, sub, right) {
    return '<div class="page-head"><div class="ph-main"><h2>' + esc(title) + "</h2>" +
      (sub ? "<p>" + sub + "</p>" : "") + "</div>" + (right || "") + "</div>";
  }
  /* A whole row that opens something is a <button>, never a div with a
     data-act on it — otherwise the screen cannot be reached from a
     keyboard at all, which is what happened to the original's job list. */
  function rowBtn(o) {
    return '<button class="drow' + (o.tone ? " e-" + o.tone : "") + '" data-act="' + o.act +
      '" data-id="' + esc(o.id) + '"' + (o.title ? ' title="' + esc(o.title) + '"' : "") + ">" +
      (o.tile || "") +
      '<span class="dmain"><span class="dnm">' + esc(o.name) + "</span>" +
      (o.says ? '<span class="dsub">' + o.says + "</span>" : "") + "</span>" +
      (o.right ? '<span class="dright">' + o.right + "</span>" : "") +
      '<span class="dchev" aria-hidden="true">›</span></button>';
  }

  /* ============================================================
     HOME — "What matters about my work right now, and where can I
     continue immediately?"

     Nothing on this screen is stored and nothing on it is computed
     here. Every figure comes from the selector the screen it points at
     uses, so Home cannot drift from the rest of the app. Even "recent"
     is derived: `updatedAt` is already on every record, so there is no
     recents list to keep in step.
     ============================================================ */

  function greeting() {
    var h = new Date().getHours();
    var when = h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
    var who = (state.settings.owner || "").trim().split(/\s+/)[0];
    return who ? when + ", " + who + "." : when + ".";
  }
  function emptyBook() {
    return !state.projects.length && !state.assets.length && !state.workflows.length &&
      !state.actions.length && !state.people.length && !state.jobs.length;
  }
  function recentlyTouched(n) {
    var rows = [];
    function add(list, kind, act, ico) {
      state[list].forEach(function (r) {
        if (!r.updatedAt) return;
        rows.push({ at: r.updatedAt, kind: kind, act: act, ico: ico, id: r.id, name: r.name || r.title });
      });
    }
    add("projects", "project", "proj-open", "proj");
    add("workflows", "workflow", "wf-open", "flow");
    add("assets", "thing", "asset-open", "asset");
    return rows.sort(function (a, b) { return b.at.localeCompare(a.at); }).slice(0, n || 5);
  }

  function attentionStrip() {
    var late = getLateActions(), wait = getWaitingActions(), unf = getUnfiledActions();
    var todays = actionsInState("today");
    var total = late.length + todays.length + wait.length + unf.length;
    var tiles = '<div class="ftiles">' +
      tileFig("Late", String(late.length), late.length ? "needs doing now" : "nothing late", late.length ? "late" : "") +
      tileFig("Today", String(todays.length), todays.length ? "dated today" : "nothing dated today", todays.length ? "live" : "") +
      tileFig("Waiting", String(wait.length), wait.length ? "on somebody else" : "on nobody", wait.length ? "idle" : "") +
      tileFig("Unfiled", String(unf.length), unf.length ? "done but not put away" : "nothing unfiled", unf.length ? "drift" : "") +
      "</div>";
    var list = "";
    if (!total) {
      list = emptyLines("Nothing needs your attention right now.",
        "Actions will appear here when work needs your attention.");
    } else {
      var pick = late.concat(todays).concat(unf).concat(wait).slice(0, 5);
      list = '<div class="rows">' + pick.map(function (a) { return actionRow(a); }).join("") + "</div>" +
        (total > pick.length ? '<p class="says">' + cap(numWord(total - pick.length)) + " more on Actions.</p>" : "");
    }
    return panel("Needs attention", tiles + list,
      '<button class="btn quiet" data-act="tab-actions">View all →</button>');
  }

  function activeProjectsCard() {
    var rows = projectsSorted().filter(function (p) {
      var st = getProjectState(p.id);
      return st.status !== "completed" && st.status !== "archived";
    }).slice(0, 4);
    var body = rows.length
      ? '<div class="rows">' + rows.map(projectRow).join("") + "</div>"
      : emptyLines("No projects yet.", "Create a project to give your work a home.");
    return panel("Active projects", body,
      '<button class="btn quiet" data-act="tab-projects">View all →</button>');
  }

  function continueCard() {
    var rows = recentlyTouched(3);
    var body = rows.length
      ? '<div class="rows">' + rows.map(function (r) {
          return rowBtn({ act: r.act, id: r.id, name: r.name || "(unnamed)", tile: itile(r.ico, r.kind),
            says: cap(r.kind) + " · touched " + esc(agoWords(r.at.slice(0, 10))) });
        }).join("") + "</div>"
      : emptyLines("Nothing has been opened here yet.", "What you touch shows up here, newest first.");
    return panel("Continue working", body);
  }

  /* QUICK RUN offers only what `openHandle()` can really do. A button
     that cannot open what it names is the fault that function exists to
     prevent — so a path with no launcher is offered as a copy and says
     so, rather than as an Open that does nothing. */
  function quickRunCard() {
    var pool = state.assets.filter(function (a) {
      return (a.section === "app" || a.section === "conn") && (a.url || a.path);
    }).slice(0, 6);
    var body = pool.length
      ? '<div class="qrun">' + pool.map(function (a) {
          var h = openHandle(a);
          return h.can
            ? '<a class="btn qbtn" href="' + esc(h.href) + '" target="_blank" rel="noopener noreferrer" title="' +
              esc(a.name + " — " + h.brief) + '">' + esc(clip(a.name, 22)) + "</a>"
            : '<button class="btn qbtn" data-act="asset-copy" data-id="' + a.id + '" title="' +
              esc(a.name + " — " + h.why) + '">' + esc(clip(a.name, 22)) + " ⧉</button>";
        }).join("") + "</div>"
      : emptyLines("Nothing to launch yet.", "An app or a connection with a link or a path shows up here.");
    return panel("Quick run", body,
      '<button class="btn quiet" data-act="tab-assets">View all →</button>');
  }

  function recentThingsCard() {
    var rows = state.assets.slice().sort(function (a, b) {
      return (b.updatedAt || "").localeCompare(a.updatedAt || "");
    }).slice(0, 4);
    var body = rows.length
      ? '<div class="rows">' + rows.map(assetRow).join("") + "</div>"
      : emptyLines("Nothing recorded yet.", "Add a device, an app, a place or a file to Assets.");
    return panel("Recent things", body,
      '<button class="btn quiet" data-act="tab-assets">View all →</button>');
  }

  function renderHome() {
    if (emptyBook()) {
      return pageHead2("Home", esc(greeting())) +
        panel("Your workspace is empty.",
          emptyLines("Create a project, add a thing, or save something reusable.",
            "Or load the example workspace from Settings to see what the app looks like with work in it.") +
          '<div class="acts">' +
          '<button class="btn primary" data-act="proj-add">New project</button>' +
          '<button class="btn" data-act="wf-add">New workflow</button>' +
          '<button class="btn" data-act="tab-settings">Settings</button></div>');
    }
    var d = new Date();
    return pageHead2("Home", esc(greeting()) + " <span class=\"dim\">· " +
        esc(d.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" })) + "</span>") +
      attentionStrip() +
      '<div class="grid2">' + activeProjectsCard() + continueCard() + "</div>" +
      '<div class="grid2">' + quickRunCard() + recentThingsCard() + "</div>";
  }
