  var CV_SECTS = [
    { kind: "role", head: "Experience", says: "the roles, newest first" },
    { kind: "education", head: "Education", says: "degrees and programmes" },
    { kind: "training", head: "Training and certification", says: "courses, workshops, tickets" },
    { kind: "skill", head: "Skills", says: "and each one's evidence is in the record" },
    { kind: "project", head: "Selected projects", says: "" },
    { kind: "output", head: "Outputs", says: "maps, reports, datasets, models" },
    { kind: "lib", head: "Publications and references", says: "formatted as an author–date list" },
    { kind: "portfolio", head: "Portfolio", says: "" }
  ];

  function cvPage(c) {
    var picks = both(ref("cv", c.id), "picks").filter(recOf);
    var out = [crumbTo("show", "cvs", "CVs"),
      pageHeadOf(c.name, esc(c.aim || "No aim stated."),
        btn("cv-edit", c.id, "Edit", "btn primary") +
        docActs("cv", c) +
        btn("cv-pick", c.id, "Put something in it") +
        (picks.length ? btn("cv-build", c.id, "Write it out") : "") +
        btn("cv-del", c.id, "Remove", "btn danger"))];
    if (!picks.length) {
      out.push('<div class="panel">' + emptyLines("Nothing picked yet.",
        "Press “Put something in it”. A CV is a selection, so this list IS the CV.") +
        "</div>");
      return out.join("");
    }
    out.push('<div class="panel"><p class="says">' +
      countWords(picks.length, "thing", "things") + " picked. Nothing below is a copy: " +
      "every line is read off the record when the CV is written out, so correcting a date " +
      "anywhere corrects it here.</p></div>");
    CV_SECTS.forEach(function (s) {
      var got = ofKind(picks, s.kind);
      if (!got.length) return;
      out.push(sectHead(s.head, got.length));
      out.push(refRows(got, { unpick: ref("cv", c.id) }));
    });
    var other = picks.filter(function (r) {
      var k = parseRef(r).kind;
      return !CV_SECTS.some(function (s) { return s.kind === k; });
    });
    if (other.length) {
      out.push(sectHead("Also picked", other.length));
      out.push(refRows(other, { unpick: ref("cv", c.id) }));
    }
    /* WHAT IS MISSING IS NAMED, because a CV with no experience section is
       a document somebody is about to send. It is a note and not a refusal:
       an early-career CV legitimately leads on training. */
    var gaps = [];
    if (!ofKind(picks, "role").length && state.roles.length) gaps.push("no experience");
    if (!ofKind(picks, "education").length && state.education.length) gaps.push("no education");
    if (!ofKind(picks, "skill").length && state.skills.length) gaps.push("no skills");
    if (!state.profile.name) gaps.push("no name on the profile");
    if (gaps.length) {
      out.push('<div class="panel drift"><p class="says">' + cap(listWords(gaps)) +
        " — and the record has something to put there. Press “Put something in " +
        "it”, or leave it out on purpose.</p></div>");
    }
    out.push('<details class="fold"><summary><span class="label">What gets written out' +
      "</span></summary><div class=\"foldbody\"><pre class=\"snip\">" +
      esc(cvText(c)) + "</pre></div></details>");
    return out.join("");
  }

  /* cvText(cv) — the CV as plain text, read off the record at the moment
     it is asked for. Every line comes from the same function a screen uses,
     so the document and the app cannot disagree; and it states what it is
     rather than pretending to be a formatted CV. */
  function cvText(c) {
    var p = state.profile || {}, L = [];
    var picks = both(ref("cv", c.id), "picks").filter(recOf);
    if (p.name) L.push(p.name.toUpperCase());
    if (p.headline) L.push(p.headline);
    var contact = [p.email, p.phone, p.site, p.place].filter(Boolean).join("  ·  ");
    if (contact) L.push(contact);
    L.push("");
    if (p.summary) { L.push(p.summary); L.push(""); }

    CV_SECTS.forEach(function (s) {
      var got = ofKind(picks, s.kind).map(recOf).filter(Boolean);
      if (!got.length) return;
      L.push(s.head.toUpperCase());
      L.push(new Array(Math.min(s.head.length, 40) + 1).join("-"));
      if (s.kind === "role") {
        got.slice().sort(byDateDesc).forEach(function (r) {
          L.push(r.name + (r.jobId ? ", " + nameOf(ref("job", r.jobId)) : "") +
            (r.place ? ", " + r.place : ""));
          L.push("  " + spanWords(r.startedOn, r.endedOn));
          if (r.note) L.push("  " + r.note);
          /* Experience is where the plan wants projects to appear UNDER the
             role rather than as a separate list — and only the ones this CV
             picked, because a CV is a selection at every level. */
          getExperienceProjects(r.id).forEach(function (pr) {
            if (picks.indexOf(ref("project", pr.id)) < 0) return;
            L.push("  • " + pr.name + " (" + spanWords(pr.startedOn, pr.endedOn) + ")");
          });
          L.push("");
        });
      } else if (s.kind === "education") {
        got.slice().sort(byDateDesc).forEach(function (e) {
          L.push(e.name + (e.org ? ", " + e.org : ""));
          L.push("  " + spanWords(e.startedOn, e.endedOn) +
            (e.result ? " · " + e.result : ""));
          if (e.note) L.push("  " + e.note);
          L.push("");
        });
      } else if (s.kind === "training") {
        got.slice().sort(byDateDesc).forEach(function (t) {
          L.push(t.name + (t.org ? ", " + t.org : "") +
            (t.on ? " · " + partDate(t.on) : ""));
          if (t.hours) L.push("  " + hm(num(t.hours) * 60));
          if (t.ref) L.push("  Certificate: " + t.ref);
          L.push("");
        });
      } else if (s.kind === "skill") {
        /* NO PROFICIENCY IS PRINTED THAT WAS NOT TYPED. A level the app
           worked out from how many projects used a skill would be a number
           dressed as a fact, which is the one thing the plan forbids by
           name — so a skill with nothing stated prints its evidence count
           instead, which is checkable. */
        var byGroup = {}, order = [];
        got.forEach(function (sk) {
          var g = sk.group || "";
          if (!byGroup[g]) { byGroup[g] = []; order.push(g); }
          byGroup[g].push(sk);
        });
        order.forEach(function (g) {
          var names = byGroup[g].map(function (sk) {
            var lv = levelLabel(sk.level);
            var n = skillEvidenceCount(sk.id);
            return sk.name + (lv ? " (" + lv.toLowerCase() + ")"
              : n ? " (" + n + ")" : "");
          });
          L.push((g ? g + ": " : "") + names.join(", "));
        });
        L.push("");
        L.push("  A figure in brackets is how many records evidence that skill.");
        L.push("  Where a level is given it is one that was typed, not inferred.");
        L.push("");
      } else if (s.kind === "lib") {
        bibSort(got).forEach(function (e) { L.push(plainCite(e)); });
        L.push("");
      } else if (s.kind === "project") {
        got.slice().sort(byDateDesc).forEach(function (pr) {
          L.push(pr.name + (pr.jobId ? ", " + nameOf(ref("job", pr.jobId)) : ""));
          L.push("  " + spanWords(pr.startedOn, pr.endedOn));
          if (pr.note) L.push("  " + pr.note);
          var outs = getProjectOutputs(pr.id);
          if (outs.length) {
            L.push("  Produced: " + outs.map(function (o) { return o.name; }).join("; "));
          }
          L.push("");
        });
      } else if (s.kind === "output") {
        got.slice().sort(byDateDesc).forEach(function (o) {
          L.push(o.name + (o.kind ? " (" + o.kind + ")" : "") +
            (o.on ? " · " + partDate(o.on) : "") +
            (o.projectId ? " · " + nameOf(ref("project", o.projectId)) : ""));
        });
        L.push("");
      } else {
        got.forEach(function (r) {
          L.push(recName(ref(LIST_FOR[s.kind] ? s.kind : s.kind, r.id)) || r.name);
          if (r.note) L.push("  " + r.note);
        });
        L.push("");
      }
    });

    L.push("");
    L.push("--");
    L.push("Written out of Mashghal on " + partDate(today()) + " · " + BUILD + ".");
    L.push("This is the text of a selection, not a formatted CV: every line above is read");
    L.push("off the record, so a correction there is a correction here. It carries no");
    L.push("house style — paste it into whatever the reader expects.");
    return L.join("\n").replace(/\n{3,}/g, "\n\n");
  }

  /* cvBuild — hands the text over the way every other export in these apps
     does: a dialog you can read, copy out of and save from, so nothing
     depends on a download working. */
  function cvBuild(c) {
    var text = cvText(c);
    var picks = both(ref("cv", c.id), "picks").filter(recOf);
    handOver("cv-" + (c.name || "mashghal").toLowerCase().replace(/[^a-z0-9]+/g, "-") +
      ".txt", text, "Your CV, written out",
      cap(countWords(picks.length, "record", "records")) + " read off the book just now.");
  }

  /* ============================================================
     SETTINGS — opened a few times a year, so it is on the gear and not on
     the bar. It has to be reachable with no keyboard and findable by name,
     which is why it is in `findSects()` as well as on the gear: the one
     screen whose name is the thing you have forgotten is the one that must
     be searchable.
     ============================================================ */

  /* The sync card says what it is doing in words, and every fact on it is
     read from the vault or the book \u2014 never a token or a passphrase. */
  function syncCard() {
    if (!syncOn()) {
      return '<div class="panel"><p class="nm">' + esc(syncWords()) + "</p>" +
        '<p class="says">Turn it on and the book follows you: the laptop, the phone ' +
        "and a borrowed machine all read the same one. It is sealed here with a " +
        "passphrase only you know and kept in a secret gist on your GitHub account, " +
        "so there is no server and no account with anybody else. It syncs by itself " +
        "a few seconds after a change, and every minute and a half while open.</p>" +
        '<div class="page-acts" style="margin-top:0.6rem">' +
        btn("sync-setup", "", "Set up sync", "btn primary") + "</div></div>";
    }
    var cfg = syncCfg(), me = deviceId();
    var devs = Object.keys(state.devices || {}).map(function (id) {
      var d = state.devices[id]; return { id: id, name: d.name, at: d.at, borrowed: d.borrowed };
    }).sort(function (a, z) { return a.at < z.at ? 1 : -1; });
    return '<div class="panel"><p class="nm">' + esc(syncWords()) + "</p>" +
      '<p class="says">Sealed with your passphrase before it leaves; GitHub holds ' +
      "characters it cannot read. The gist id, to paste on another device: " +
      '<code class="lit">' + esc(cfg.gistId) + "</code></p>" +
      (devs.length ? '<div class="rows" style="margin-top:0.5rem">' + devs.map(function (d) {
        return '<div class="row flat"><span class="grow"><span class="nm">' +
          esc(d.name || "unnamed device") + (d.id === me ? " \u2014 this one" : "") +
          '</span><span class="sub">Last wrote ' + esc(stampWhen(d.at)) +
          (d.borrowed ? " \u00b7 a borrowed machine" : "") + "</span></span></div>";
      }).join("") + "</div>" : "") +
      '<div class="page-acts" style="margin-top:0.6rem">' +
      btn("sync-now", "", "Sync now", "btn primary") +
      btn("sync-setup", "", "Change sync") +
      btn("sync-wipe", "", "Wipe this device", "btn danger") + "</div>" +
      '<p class="says" style="margin-top:0.5rem">' + (borrowed()
        ? "This is marked as a borrowed machine: the book, the token and the " +
          "passphrase go when this tab closes. "
        : "") + "Wiping takes the book, the token, the passphrase and the snapshots " +
      "off this browser and sends nothing to GitHub, so the gist and your other " +
      "devices keep everything.</p></div>";
  }

      "It <strong>adds</strong> rather than replacing, a record whose name is already " +

      "before it writes one.</p>" +
      '<div class="page-acts" style="margin-top:0.6rem">' +
      btn("import-json", "", "Feed it from a file", "btn primary") + "</div>" +
      '<p class="says" style="margin-top:0.5rem">It is not a restore. A backup ' +
      "replaces the book; this adds to it, so a second file can name a project the " +
      "first one added.</p></div>");

    var old = oldBooks();
    if (old.length) {
      out.push(sectHead("An older book", null));
      out.push('<div class="panel drift"><p class="says">' +
        esc(cap(listWords(old.map(function (o) { return o.what; })))) +
        " is still in this browser. It is a different shape, so it is not read, not " +
        "written to and not lost. Importing is <strong>additive</strong> — nothing " +
        "here is replaced and the old key is never written to — and it is lossy, " +
        "which the dialog names before it runs.</p>" +
        '<div class="page-acts" style="margin-top:0.6rem">' +
        btn("old-import", "", "Look at what it holds", "btn primary") + "</div></div>");
    }

    out.push(sectHead("What it deliberately does not do", null));
    out.push('<div class="panel"><p class="says">Four things, each for a reason worth ' +
      "stating rather than leaving as a gap:</p>" +
      '<ul class="says" style="margin:0.5rem 0 0 1.1rem;display:grid;gap:0.35rem">' +
      "<li><strong>It does not score you.</strong> No proficiency is computed, no " +
      "streak is kept and no percentage is invented. The one percentage on any screen " +
      "is a count of actions you marked done, and it says so where it is printed.</li>" +
      "<li><strong>It does not infer a skill level.</strong> A level is typed or it is " +
      "blank; what the app derives is the <em>evidence</em> — which records back " +
      "the claim — because that is checkable and a number is not.</li>" +
      "<li><strong>It does not notify.</strong> A browser cannot send mail and nothing " +
      "runs while the app is shut, so what is late is waiting when you open it. " +
      "Implying otherwise would be worse than the limit.</li>" +
      "<li><strong>It fetches nothing it needs to run.</strong> No fonts, no " +
      "libraries, no service. Which is why it opens on a plane, and why the " +
      "bibliography is formatted here rather than by asking a service to do it. The " +
      "one thing it ever sends is your sealed book, to your own gist, and only once " +
      "you turn sync on.</li></ul></div>");

    out.push(sectHead("This build", null));
    out.push('<div class="panel"><p class="says" style="font-family:var(--mono)">' +
      esc(BUILD) + "</p><p class=\"says\">Mashghal rebuilt as a career and work hub: " +
      "three worlds — who you are professionally, what you do, what you know — " +
      "with the portfolio, the timeline and a CV as views across them rather than " +
      "records of their own.</p></div>");
    return out.join("");
  }

  /* ============================================================
     THE GUIDE.

     Not a tour and not a tooltip: a page you can read once and come back
     to, that names every record the app holds, where it lives, and what to
     link it to. Two rules hold it, and both are the same rule this whole
     app lives by:

       IT NAMES THE REAL CONTROL. Every instruction says the words actually
       printed on the button — "New role", "Link it to…", "Paste BibTeX or
       RIS" — because a guide that paraphrases the interface is a guide
       that goes wrong the first time a label changes, silently.

       IT IS REACHABLE WITHOUT ALREADY KNOWING IT IS THERE. It is on the
       first screen of an empty book is the Workbench's own offer, Settings
       names it, and on a phone it is on More. The one screen whose name
       you have forgotten is the one that has to be reachable.
     ============================================================ */

    { id: "g-start", word: "Start here" },
    { id: "g-shape", word: "How it is put together" },
    { id: "g-read", word: "Reading a long list" },
    { id: "g-career", word: "Career" },
    { id: "g-work", word: "Work" },
    { id: "g-lib", word: "The library" },
    { id: "g-bib", word: "References and the bibliography" },
    { id: "g-links", word: "Drawing the lines" },
    { id: "g-show", word: "Portfolio and CVs" },
    { id: "g-ask", word: "The line" },
    { id: "g-keys", word: "The keyboard" },
    { id: "g-dir", word: "Where your stuff is" },
    { id: "g-feed", word: "Filling it from a file" },
    { id: "g-sync", word: "Your book on every device" },
    { id: "g-record", word: "Your record" }

    return '<div class="gpart" id="' + id + '">' + sectHead(word, null) + body + "</div>";

     is, then why the field is worth filling. */

      '<span class="gwhat"><b>' + what + "</b>" +

  }
  function gnote(html) { return '<p class="says gnote">' + html + "</p>"; }

      'style="--tint:color-mix(in srgb, var(--blue) 16%, transparent);--glyph:var(--blue)">' +

  /* ============================================================
     THE DIALOGS.

     Four rules hold all of them, and each one is a fault this repo has
     already paid for:

       A DESTRUCTIVE BRANCH NEVER GOES ON `onCancel`. Escape, the scrim and
       the × all fire cancel — those are the universal "I did not mean
       that" gestures. Confirm does the thing.

       EVERY REMOVAL CONFIRMS, SAYS WHAT IT TOUCHES, AND OFFERS AN UNDO.
       The undo is the toast's, as a closure over the records, and this app
       has no undo stack on purpose: the example and a restore both REPLACE
       state, and a closure captured before that would mutate records the
       book no longer holds.

       A DATE HAS TO EXIST, not merely be shaped like one — `dayOk` and
       `partOk` round-trip through the calendar, so `2026-13-45` is refused
       where it is typed rather than storing and appearing on no screen.

       NAME THE RECORD, NOT ITS TYPE. "Edit Lenovo Legion", never "Edit
       thing": a generic noun in a title reads as a placeholder somebody
       forgot to fill in.
     ============================================================ */

  function stamp(rec) { rec.updatedAt = new Date().toISOString(); return rec; }
  function put(kind, rec) {
    listOf(kind).push(stamp(rec));
    return rec;
  }
  function saveGo(msg, undo) { commit(); render(); if (msg) toast(msg, undo); }

  /* A removal takes its links with it, because a link naming a record that
     is gone is a line to nowhere — and the undo puts both back. */
  function removeRec(kind, rec, what, extraSay, alsoDo) {
    var list = listOf(kind), i = list.indexOf(rec);
    var links = state.links.filter(function (l) {
      return l.a === ref(kind, rec.id) || l.b === ref(kind, rec.id);
    });
    confirmAction({
      title: "Remove " + recName(rec, kind) + "?",
      message: [esc(what || (KINDS[kind].word + " goes.")),
        links.length ? esc(cap(countWords(links.length, "link", "links")) +
          " to it " + (links.length === 1 ? "goes" : "go") + " with it.") : "",
        extraSay ? esc(extraSay) : ""].filter(Boolean).join(" "),
      confirmLabel: "Remove it"
    }, function () {
      var extra = alsoDo ? alsoDo() : null;
      if (i >= 0) list.splice(i, 1);
      state.forgotten[ref(kind, rec.id)] = recName(rec, kind);
      dropLinks(ref(kind, rec.id));
      openRec = null;
      saveGo("Removed " + recName(rec, kind), function () {
        if (i >= 0) list.splice(i, 0, rec);
        links.forEach(function (l) { state.links.push(l); });
        delete state.forgotten[ref(kind, rec.id)];
        if (extra && extra.undo) extra.undo();
        saveGo("Put back");
      });
    });
  }

  /* ---------------- pickers built out of the record ---------------- */

  function optsOf(kind, blankLabel) {
    var o = blankLabel == null ? [] : [{ value: "", label: blankLabel }];
    return o.concat(live(listOf(kind)).slice().sort(byName).map(function (r) {
      return { value: r.id, label: recName(r, kind) };
    }));
  }
  function vocabOpts(list, extra) {
    var seen = {}, out = [];
    (extra || []).forEach(function (v) { if (!seen[v]) { seen[v] = 1; out.push(v); } });
    list.forEach(function (r) {
      var v = (r.kind || "").trim();
      if (v && !seen[v]) { seen[v] = 1; out.push(v); }
    });
    return out;
  }
  function dateField(key, label, value, hint, more) {
    return { key: key, label: label, value: value || "", placeholder: "2026-09 or 2026-09-17",
      hint: hint, more: more };
  }
  function badDates(v, keys) {
    for (var i = 0; i < keys.length; i++) {
      var val = (v[keys[i][0]] || "").trim();
      if (val && !partOk(val)) {
        return keys[i][1] + ": “" + val + "” is not a date. " +
          "Write a year, a year and month, or a full day — 2026, 2026-09, 2026-09-17.";
      }
    }
    return "";
  }
