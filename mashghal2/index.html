  /* ============================================================
     THE BOOK ON EVERY DEVICE, AND A HISTORY OF IT ON THIS ONE.

     Ported from the original app, where it was built and tested over many
     rounds (`mashghal/index.html`, the sync and backup blocks) — not
     rebuilt, because a second engine written from memory would be the
     plausible wrong answer this repo refuses. What changed is named:

       THE HOW-TO-REACH-IT LIVES OUTSIDE THE BOOK. The original kept the
       gist id, the device name and the borrowed flag in `state.settings`,
       so every act that REPLACES the book — the example, a restore, erasing
       — took sync with it and switched it off silently; it needed a patch at
       each of those sites and one was missed once. Here the configuration
       lives beside the token, in the vault, and no replace can reach it. A
       backup cannot carry the gist id for the same reason.

       A WHOLESALE REPLACE NEVER WRITES A TOMBSTONE. Change tracking is a diff
       against a snapshot of the last-seen records, and a record that
       vanished becomes a tombstone — which is right for a delete and
       catastrophic for a replace: loading the example over a synced book
       would read as every real record deleted, and the next sync would
       delete it everywhere. So the snapshot remembers WHICH state object it
       was taken of, and a different object rebuilds it instead of diffing.

       IT REFUSES ANOTHER APP'S GIST. The owner may already hold a gist from
       the original app; pasting that id here would merge two different
       shapes of book. The payload carries `app`, and a gist without this
       app's file or marker is named and refused.

     Nothing here reaches `state` except the book itself: the token, the
     passphrase and the configuration live in their own keys, so a backup,
     an export and the gist all carry none of them.
     ============================================================ */

  var SYNC_APP = "mashghal2-hub";
  var SYNC_LISTS = STATE_LISTS;          // one place decides what travels
  var GIST_FILE = "mashghal2-book.json";
  var OLD_GIST_FILE = "mashghal.json";    // the original app's, never merged
  var TOK_KEY = "mashghal2.sync.token";
  var PASS_KEY = "mashghal2.sync.pass";
  var CFG_KEY = "mashghal2.sync.cfg";
  var DEV_KEY = "mashghal2.sync.device";
  var BORROW_KEY = "mashghal2.sync.borrowed";

  var snap = {};          // id -> the record as last stamped
  var snapOf = null;      // the state object `snap` was taken of
  var syncing = false, syncFail = "";

  /* ---------------- the vault ----------------

     On a machine that is not yours, nothing may outlive the tab: the
     borrowed flag lives in sessionStorage, and while it is set every secret
     and the configuration live there too. */
  function borrowed() {
    try { return window.sessionStorage.getItem(BORROW_KEY) === "1"; } catch (e) { return false; }
  }
  function vault() {
    try { return borrowed() ? window.sessionStorage : window.localStorage; }
    catch (e) { return null; }
  }
  function secret(k) {
    try { var v = vault(); return v ? (v.getItem(k) || "") : ""; } catch (e) { return ""; }
  }
  function setSecret(k, v) { try { var s = vault(); if (s) s.setItem(k, v); } catch (e) {} }
  function dropSecrets() {
    [window.localStorage, window.sessionStorage].forEach(function (s) {
      try {
        [TOK_KEY, PASS_KEY, CFG_KEY, BORROW_KEY].forEach(function (k) { s.removeItem(k); });
      } catch (e) {}
    });
  }
  function deviceId() {
    var s = vault(), id = "";
    try { id = (s && s.getItem(DEV_KEY)) || ""; } catch (e) {}
    if (!id) { id = uid(); try { if (s) s.setItem(DEV_KEY, id); } catch (e) {} }
    return id;
  }
  function syncCfg() {
    var c = {};
    try { c = JSON.parse(secret(CFG_KEY) || "{}") || {}; } catch (e) { c = {}; }
    return { gistId: c.gistId || "", deviceName: c.deviceName || "",
      lastPulledAt: c.lastPulledAt || "" };
  }
  function saveCfg(c) { setSecret(CFG_KEY, JSON.stringify(c)); }
  function syncOn() {
    return !!(syncCfg().gistId && secret(TOK_KEY) && secret(PASS_KEY));
  }

  /* ---------------- change tracking ---------------- */

  function nowStamp() { return new Date().toISOString(); }
  function bareOf(r) {
    var o = {}, k;
    for (k in r) { if (k !== "updatedAt") o[k] = r[k]; }
    return JSON.stringify(o);
  }
  /* The profile is ONE record, not a list, so it is tracked under a fixed
     id and merged newer-wins as a whole. */
  var PROFILE_ID = "__profile";

  /* A record that predates sync has no stamp and would lose every
     comparison, so it is given one the first time it is seen rather than
     being treated as infinitely old. Rebuilds the snapshot from nothing,
     which is also what a wholesale replace needs. */
  /* A RECORD THAT IS HERE IS NOT DELETED. A merge never leaves a tombstoned
     record in a list, so one that is present beside its own tombstone was
     brought back on this device — by an Undo, or a snapshot put back — and
     it has to be stamped NOW, or the tombstone (older than the deletion it
     records, newer than the copy that came back) deletes it again on the
     next merge. Without this, putting a snapshot back on a synced book could
     never undo the one mistake a snapshot exists for. */
  function revived(r, now) {
    if (!state.tombstones[r.id]) return false;
    delete state.tombstones[r.id];
    r.updatedAt = now;
    return true;
  }
  function ensureStamps() {
    var now = nowStamp();
    snap = {};
    SYNC_LISTS.forEach(function (k) {
      (state[k] || []).forEach(function (r) {
        if (!r || !r.id) return;
        revived(r, now);
        if (!r.updatedAt) r.updatedAt = now;
        snap[r.id] = bareOf(r);
      });
    });
    /* AN EMPTY PROFILE IS NOT A NEWER ONE. Stamped at boot like a record, a
       phone joining for the first time carried a blank profile stamped
       "now" \u2014 newer than the real one \u2014 and the merge blanked your
       name on every device. A profile nobody has written in stays unstamped,
       so any profile that says something wins over it. */
    var said = PROFILE_KEYS.some(function (k) { return !!state.profile[k]; });
    if (!state.profile.updatedAt && said) state.profile.updatedAt = now;
    snap[PROFILE_ID] = bareOf(state.profile);
    snapOf = state;
  }
  /* Which records changed since the last pass, so a merge can be per record
     rather than per file. Whole-file last-write-wins eventually eats a day
     of work logged on the phone, and it does it silently. */
  function stampRecords() {
    if (snapOf !== state) { ensureStamps(); return; }
    var now = nowStamp(), seen = {};
    SYNC_LISTS.forEach(function (k) {
      (state[k] || []).forEach(function (r) {
        if (!r || !r.id) return;
        seen[r.id] = 1;
        revived(r, now);
        var j = bareOf(r);
        if (snap[r.id] !== j) { r.updatedAt = now; snap[r.id] = j; }
      });
    });
    var pj = bareOf(state.profile);
    if (snap[PROFILE_ID] !== pj) { state.profile.updatedAt = now; snap[PROFILE_ID] = pj; }
    seen[PROFILE_ID] = 1;
    Object.keys(snap).forEach(function (id) {
      if (!seen[id]) { state.tombstones[id] = now; delete snap[id]; }
    });
  }

  /* EVERY WRITE GOES THROUGH HERE. The shared runtime's `save()` has to stay
     byte-identical across five apps, so the stamping, the sync nudge and the
     snapshot hang off this one app-level function instead. */
  function commit() {
    stampRecords();
    save();
    syncSoon();
    bkMaybe();
  }

  function mergeList(mine, theirs, tomb) {
    var pick = {};
    mine.concat(theirs).forEach(function (r) {
      if (!r || !r.id) return;
      var cur = pick[r.id];
      if (!cur || (r.updatedAt || "") > (cur.updatedAt || "")) pick[r.id] = r;
    });
    return Object.keys(pick).map(function (id) { return pick[id]; })
      .filter(function (r) { return !(tomb[r.id] && tomb[r.id] > (r.updatedAt || "")); });
  }

  function payload() {
    var o = { v: 1, app: SYNC_APP, tombstones: state.tombstones,
      forgotten: state.forgotten, devices: state.devices, profile: state.profile };
    SYNC_LISTS.forEach(function (k) { o[k] = state[k] || []; });
    return o;
  }

  /* Merge is symmetrical and loses nothing it can avoid losing: a record that
     exists on one side only survives unless a tombstone newer than it says
     it was deleted on purpose. */
  function mergeIn(remote) {
    var tomb = {};
    [state.tombstones, remote.tombstones || {}].forEach(function (src) {
      Object.keys(src).forEach(function (id) {
        if (!tomb[id] || src[id] > tomb[id]) tomb[id] = src[id];
      });
    });
    var counts = { added: 0, updated: 0, removed: 0 };
    SYNC_LISTS.forEach(function (k) {
      var before = {};
      (state[k] || []).forEach(function (r) { before[r.id] = r.updatedAt || ""; });
      var merged = mergeList(state[k] || [], remote[k] || [], tomb);
      merged.forEach(function (r) {
        if (before[r.id] === undefined) counts.added++;
        else if (before[r.id] !== (r.updatedAt || "")) counts.updated++;
      });
      counts.removed += Object.keys(before).length -
        merged.filter(function (r) { return before[r.id] !== undefined; }).length;
      state[k] = merged;
    });
    var rp = remote.profile;
    if (rp && typeof rp === "object" && (rp.updatedAt || "") > (state.profile.updatedAt || "")) {
      PROFILE_KEYS.forEach(function (k) {
        if (typeof rp[k] === "string") state.profile[k] = rp[k];
      });
      state.profile.updatedAt = rp.updatedAt;
      counts.updated++;
    }
    state.tombstones = tomb;
    Object.keys(remote.forgotten || {}).forEach(function (id) {
      if (!state.forgotten[id]) state.forgotten[id] = remote.forgotten[id];
    });
    var rd = remote.devices || {};
    Object.keys(rd).forEach(function (id) {
      if (!state.devices[id] || rd[id].at > state.devices[id].at) state.devices[id] = rd[id];
    });
    return counts;
  }

  /* ---------------- the sealing ----------------

     A secret gist is unlisted, not private — anyone holding the link can
     read it — so the encryption is the whole of the privacy. Compress THEN
     encrypt: the other way round compresses random bytes and saves nothing.
     The `z` marker is what lets a blob sealed without compression still
     open. */
  function b64(buf) {
    var a = new Uint8Array(buf), s = "";
    for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]);
    return btoa(s);
  }
  function unb64(s) {
    var b = atob(s), a = new Uint8Array(b.length);
    for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i);
    return a;
  }
  function subtle() {
    return (window.crypto && window.crypto.subtle) ? window.crypto.subtle : null;
  }
  function deriveKey(pass, salt) {
    var enc = new TextEncoder();
    return subtle().importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"])
      .then(function (base) {
        return subtle().deriveKey(
          { name: "PBKDF2", salt: salt, iterations: 250000, hash: "SHA-256" },
          base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
      });
  }
  function zipOK() {
    return typeof CompressionStream === "function" &&
      typeof DecompressionStream === "function" && typeof Response === "function";
  }
  function zipThrough(stream, bytes) {
    var w = stream.writable.getWriter();
    w.write(bytes); w.close();
    return new Response(stream.readable).arrayBuffer();
  }
  function deflate(bytes) { return zipThrough(new CompressionStream("gzip"), bytes); }
  function inflate(bytes) { return zipThrough(new DecompressionStream("gzip"), bytes); }

  function seal(text, pass) {
    var salt = crypto.getRandomValues(new Uint8Array(16));
    var iv = crypto.getRandomValues(new Uint8Array(12));
    var raw = new TextEncoder().encode(text);
    var zipped = zipOK();
    return (zipped ? deflate(raw).then(function (buf) { return new Uint8Array(buf); })
                   : Promise.resolve(raw))
      .then(function (body) {
        return deriveKey(pass, salt).then(function (key) {
          return subtle().encrypt({ name: "AES-GCM", iv: iv }, key, body);
        });
      })
      .then(function (ct) {
        var o = { v: 1, kdf: "PBKDF2-SHA256", it: 250000,
          salt: b64(salt), iv: b64(iv), ct: b64(ct) };

      });

  function unseal(blob, pass) {
    var o;
    try { o = JSON.parse(blob); } catch (e) {
      return Promise.reject(new Error("That gist does not hold a sealed book."));
    }
    if (!o || !o.ct || !o.salt || !o.iv) {
      return Promise.reject(new Error("That gist is not sealed the way this app seals things."));
    }
    return deriveKey(pass, unb64(o.salt)).then(function (key) {
      return subtle().decrypt({ name: "AES-GCM", iv: unb64(o.iv) }, key, unb64(o.ct));
    }).then(function (pt) {
      if (o.z !== "gzip") return JSON.parse(new TextDecoder().decode(pt));
      if (!zipOK()) {
        throw new Error("This book was compressed by another device and this browser " +
          "cannot unpack it.");
      }
      return inflate(new Uint8Array(pt)).then(function (buf) {
        return JSON.parse(new TextDecoder().decode(new Uint8Array(buf)));
      });
    }, function () {
      /* The SECOND argument of this `then`, not of the one above: a handler
         cannot catch its own sibling's rejection, and attached one link
         earlier it never saw a failed decrypt at all. */
      throw new Error("Wrong passphrase — nothing was changed.");
    });
  }

  /* PUTTING A BOOK BACK, from a snapshot or from a file. The tombstones
     travel INTO the restored book, so `revived()` can see which of its
     records were deleted since and stamp them back to life — the
     restored book's own older set does not know they were ever deleted, and
     without this a synced book would have them deleted again on the next
     merge. Everything else is `adoptState`, the one adoption point. */
  function adoptRestored(raw) {
    var tomb = state.tombstones || {};
    state = adoptState(raw);
    grReset();
    Object.keys(tomb).forEach(function (id) {
      if (!state.tombstones[id] || tomb[id] > state.tombstones[id]) state.tombstones[id] = tomb[id];
    });

  }

  /* ---------------- the gist ---------------- */

  function ghFetch(url, token, opts) {
    opts = opts || {};
    opts.headers = { "Authorization": "Bearer " + token,
      "Accept": "application/vnd.github+json" };
    if (opts.body) opts.headers["Content-Type"] = "application/json";
    return fetch(url, opts).then(function (res) {
      if (res.status === 401 || res.status === 403) {
        throw new Error("GitHub refused the token. It may have expired, or it may not " +
          "carry gist access.");
      }
      if (res.status === 404) throw new Error("That gist was not found by this token.");
      if (!res.ok) throw new Error("GitHub answered " + res.status + ".");
      return res.json();
    }, function (e) {
      if (e instanceof TypeError) throw new Error("No answer from GitHub — you may be offline.");
      throw e;
    });
  }
  function gistRead(id, token) {
    return ghFetch("https://api.github.com/gists/" + id, token).then(function (g) {
      var files = g.files || {};
      var f = files[GIST_FILE];
      if (!f) {
        /* THE ORIGINAL APP'S GIST IS NAMED, not merged. Its book is a
           different shape, and folding one into the other would be two books
           becoming neither. */
        if (files[OLD_GIST_FILE]) {
          throw new Error("That gist belongs to the original Mashghal app, whose book is " +
            "a different shape. Leave the gist id blank to make one for this app.");
        }
        throw new Error("That gist has no " + GIST_FILE + " in it.");
      }
      if (f.truncated && f.raw_url) {
        return fetch(f.raw_url).then(function (r) { return r.text(); });
      }
      return f.content || "";
    });
  }
  function gistWrite(id, token, content) {
    var files = {};
    files[GIST_FILE] = { content: content };
    return ghFetch("https://api.github.com/gists/" + id, token,
      { method: "PATCH", body: JSON.stringify({ files: files }) });
  }
  function gistCreate(token, content) {
    var files = {};
    files[GIST_FILE] = { content: content };
    return ghFetch("https://api.github.com/gists", token, {
      method: "POST",
      body: JSON.stringify({ description: "Mashghal (the hub) — sealed",
        "public": false, files: files })
    });
  }

  /* ---------------- the act ---------------- */

  function noteDevice() {
    state.devices[deviceId()] = {
      name: syncCfg().deviceName || "unnamed device",
      at: nowStamp(),
      borrowed: borrowed()
    };
  }

  /* Pull, merge, push — one act, because pushing without having pulled is
     how one device quietly overwrites another's day. */
  function syncNow(quiet) {
    if (syncing) return;
    if (!syncOn()) { if (!quiet) toast("Sync is not set up on this device."); return; }
    if (!subtle()) {
      if (!quiet) toast("This browser has no Web Crypto, so nothing can be sealed.");
      return;
    }
    syncing = true;
    var cfg = syncCfg(), tok = secret(TOK_KEY), pass = secret(PASS_KEY);
    if (!quiet) toast("Syncing…");
    stampRecords();
    gistRead(cfg.gistId, tok)
      .then(function (book) {
        book = String(book || "").trim();
        return book ? unseal(book, pass) : null;
      })
      .then(function (remote) {
        if (remote && remote.app && remote.app !== SYNC_APP) {
          throw new Error("That gist holds a different app's book, so nothing was merged.");
        }
        var counts = remote ? mergeIn(remote) : { added: 0, updated: 0, removed: 0 };
        /* A MERGED-IN RECORD IS NOT A LOCAL EDIT. Diffed against the
           snapshot it looks changed, and stamping it "now" would make a copy
           this device merely RECEIVED outrank an edit a third device made in
           between \u2014 which is a lost edit. The snapshot is rebuilt, not
           diffed; local edits were already stamped before the pull. */
        noteDevice();
        ensureStamps();
        cfg.lastPulledAt = nowStamp();
        saveCfg(cfg);
        save();
        return seal(JSON.stringify(payload()), pass)
          .then(function (sealed) {
            /* A PASS IN FLIGHT WHEN THE DEVICE WAS WIPED SENDS NOTHING. The
               pull may have started before "Wipe this device"; by the time
               the book is sealed the secrets are gone, and the write is the
               one request that must not happen. */
            if (!syncOn()) throw new Error("Sync was turned off on this device, so nothing was sent.");
            return gistWrite(cfg.gistId, tok, sealed);
          })
          .then(function () { return counts; });
      })
      .then(function (counts) {
        syncing = false; syncFail = "";
        render();
        var bits = [];
        if (counts.added) bits.push(countWords(counts.added, "thing came in", "things came in"));
        if (counts.updated) bits.push(countWords(counts.updated, "was changed", "were changed"));
        if (counts.removed) bits.push(countWords(counts.removed, "was removed", "were removed"));
        /* SILENCE IS THE CORRECT REPORT FOR A NO-OP. A background pass says
           something only when something actually crossed; pressing Sync
           yourself always gets an answer, because then you asked. */
        if (bits.length) toast("Synced — " + listWords(bits));
        else if (!quiet) toast("Synced — nothing had changed elsewhere");
      })
      .catch(function (e) {
        syncing = false;
        syncFail = e && e.message ? e.message : "it failed";
        render();
        if (!quiet) toast(e && e.message ? e.message : "Sync failed, and nothing was changed.");
      });
  }

  /* ---------------- syncing without being asked ----------------

     A button is exactly the failure: an edit on the phone stays on the phone
     because nobody pressed anything. Three triggers, because they answer
     different failures — an edit (debounced), the OTHER device's edits
     (a heartbeat), and coming back to the tab or the network. The merge is
     untouched: every automatic pass is the same pull-merge-push. */
  var AUTO_DEBOUNCE = 4000, AUTO_HEARTBEAT = 90000;
  var autoTimer = null, beatTimer = null, lastAuto = 0, autoWired = false;

  function nudgeSync(why) {
    if (!syncOn() || syncing) return;
    if (document.hidden) return;
    if (Date.now() - lastAuto < 2500) return;
    lastAuto = Date.now();
    syncNow(true);
  }
  function syncSoon() {
    if (!syncOn()) return;
    if (autoTimer) clearTimeout(autoTimer);
    autoTimer = setTimeout(function () { autoTimer = null; nudgeSync("edit"); }, AUTO_DEBOUNCE);
  }
  function wireAutoSync() {
    if (autoWired) return;
    autoWired = true;
    if (beatTimer) clearInterval(beatTimer);
    beatTimer = setInterval(function () { nudgeSync("heartbeat"); }, AUTO_HEARTBEAT);
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) nudgeSync("back to the tab");
    });
    window.addEventListener("online", function () { nudgeSync("back online"); });
    window.addEventListener("pagehide", function () {
      if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; nudgeSync("leaving"); }
      /* On a machine that is not yours, nothing outlives the tab. */
      if (borrowed()) {
        try { localStorage.removeItem(APP.storeKey); } catch (e) {}
        dropSecrets();
      }
    });
  }

  /* What the screen says about it, in words rather than a spinner. */
  function syncWords() {
    var cfg = syncCfg();
    if (!syncOn()) return "Off — this device keeps its own book";
    if (syncing) return "Syncing now…";
    if (!navigator.onLine) return "Offline — it will catch up by itself";
    if (syncFail) return "Last attempt failed: " + clause(syncFail) + ". It will try again.";
    if (!cfg.lastPulledAt) return "Set up, but it has not run yet";
    var mins = Math.round((Date.now() - new Date(cfg.lastPulledAt).getTime()) / 60000);
    if (mins < 1) return "Up to date, a moment ago";
    if (mins < 60) return "Up to date, " + countWords(mins, "minute", "minutes") + " ago";
    var hrs = Math.round(mins / 60);
    if (hrs < 24) return "Last synced " + countWords(hrs, "hour", "hours") + " ago";
    return "Last synced on " + shortDate(iso(new Date(cfg.lastPulledAt)));
  }
  function syncSetupDialog() {
    var cfg = syncCfg();
    openModal({
      title: syncOn() ? "Change sync" : "Set up sync", wide: true,
      confirmLabel: syncOn() ? "Save" : "Turn it on",
      message: "Your book is sealed on this device with the passphrase and only then " +
        "sent, so GitHub holds characters it cannot read. A secret gist is unlisted " +
        "rather than private — anyone with the link can fetch it — which is " +
        "why the sealing is the whole of the privacy. Use a fine-grained token with " +
        "gist access and nothing else.",
      fields: [
        { key: "token", label: "GitHub token", type: "password", span: true,
          value: secret(TOK_KEY), placeholder: "github_pat_…",
          hint: "Kept on this device only — never in the book, a backup or the gist." },
        { key: "pass", label: "Passphrase", type: "password", span: true,
          value: secret(PASS_KEY),
          hint: "Lose this and the gist is unreadable. There is no recovery, by design." },
        { key: "gistId", label: "Gist id", span: true, value: cfg.gistId,
          hint: "Blank on the first device and one is made for you. On every other " +
            "device, paste the id the first one shows." },
        { key: "deviceName", label: "Call this device", span: true,
          value: cfg.deviceName, placeholder: "Legion",
          hint: "So your phone can say which laptop last wrote." },
        { key: "borrowed", label: "Is this your own machine?", type: "select", span: true,
          value: borrowed() ? "yes" : "no",
          options: [{ value: "no", label: "Yes — remember it here" },
            { value: "yes", label: "No — forget everything when I close the tab" }] }
      ],
      validate: function (v) {
        if (!v.token.trim()) return "A token is needed to reach the gist.";
        if (v.pass.trim().length < 8) return "Use a passphrase of at least eight characters.";
        if (!v.deviceName.trim()) {
          return "Name the device, so you can tell from your phone which laptop is " +
            "still signed in.";
        }
        return null;
      },
      onConfirm: function (v) {
        /* The borrowed flag is set FIRST, because it decides which storage
           everything after it is written into. */
        try {
          if (v.borrowed === "yes") window.sessionStorage.setItem(BORROW_KEY, "1");
          else window.sessionStorage.removeItem(BORROW_KEY);
        } catch (e) {}
        var c = { gistId: v.gistId.trim(), deviceName: v.deviceName.trim(), lastPulledAt: "" };
        setSecret(TOK_KEY, v.token.trim());
        setSecret(PASS_KEY, v.pass.trim());
        wireAutoSync();
        if (c.gistId) { saveCfg(c); render(); syncNow(); return; }
        saveCfg(c);
        toast("Making a gist…");
        stampRecords();
        noteDevice();
        seal(JSON.stringify(payload()), v.pass.trim())
          .then(function (sealed) { return gistCreate(v.token.trim(), sealed); })
          .then(function (g) {
            c.gistId = g.id; c.lastPulledAt = nowStamp();
            saveCfg(c); save(); render();
            toast("Sync is on. Paste this gist id on your other devices: " + g.id);
          })
          .catch(function (e) {
            c.gistId = ""; saveCfg(c); render();
            toast(e && e.message ? e.message : "Could not make the gist.");
          });
      }
    });
  }

  /* WIPE THIS DEVICE never touches the gist, and the dialog says so in as
     many words, because on a borrowed laptop the fear is exactly that
     leaving might lose the work. It also says the honest limit: wiping here
     does not revoke the token, which anyone who copied it still holds. */
  function wipeDeviceDialog() {
    confirmAction({
      title: "Wipe this device?",
      message: "This removes the book, the token, the passphrase and the snapshots " +
        "from this browser, and nothing else. <b>Your book in the gist is not " +
        "touched</b> — no request is sent to GitHub — and your other devices " +
        "keep theirs. Wiping does not revoke the token: if anyone could have copied " +
        "it, revoke it at github.com/settings/tokens.",
      confirmLabel: "Wipe this device", danger: true
    }, function () {
      if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
      dropSecrets();
      try { localStorage.removeItem(DEV_KEY); sessionStorage.removeItem(DEV_KEY); } catch (e) {}
      try { localStorage.removeItem(APP.storeKey); } catch (e) {}
      try { if (window.indexedDB) indexedDB.deleteDatabase(BK_DB); } catch (e) {}
      /* The pinned pictures are this device's too, and a wipe that left
         them would leave the one thing nobody would think to look for. */
      try { if (window.indexedDB) indexedDB.deleteDatabase(PIN_DB); } catch (e) {}
      try { if (window.indexedDB) indexedDB.deleteDatabase(FILE_DB); } catch (e) {}
      state = APP.blank();
      grReset();
      ensureStamps();
      openRec = ""; pageAt = {}; back = [];
      save(); render();
      toast("Wiped from this browser. The gist and your other devices are untouched.");
    });
  }

  /* ================= snapshots on this device =================

     Sync and a backup are different jobs and one does not cover the other.
     Sync propagates the CURRENT book — so a mistake propagates too,
     promptly and to every device. A snapshot preserves an EARLIER one, which
     is the only thing that helps after a bad delete. Kept in IndexedDB
     because a rolling set of whole books would crowd out the book itself in
     localStorage, whose quota five sibling apps share. None are taken on a
     borrowed laptop, where nothing may outlive the tab. */
  var BK_DB = "mashghal2-backups", BK_STORE = "snaps", BK_KEEP = 10;
  var BK_MIN_GAP = 6 * 60 * 60 * 1000;   // at most four a day
  var bkLast = 0;

  /* READING NEVER CREATES. Opening a database that is not there makes it,
     so listing snapshots straight after "Wipe this device" put an empty
     `mashghal2-backups` back on a machine that had just been told to keep
     nothing. A read aborts the upgrade instead, which leaves no database. */
  function bkOpen(readOnly) {
    return new Promise(function (res, rej) {
      if (!window.indexedDB) { rej(new Error("no IndexedDB")); return; }
      var r = indexedDB.open(BK_DB, 1);
      r.onupgradeneeded = function (e) {
        if (readOnly && e.oldVersion === 0) { r.transaction.abort(); return; }
        if (!r.result.objectStoreNames.contains(BK_STORE)) {
          r.result.createObjectStore(BK_STORE, { keyPath: "at" });
        }
      };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error || new Error("could not open")); };
    });
  }
  function bkTx(mode, fn) {
    return bkOpen(mode === "readonly").then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction(BK_STORE, mode);
        var out = fn(tx.objectStore(BK_STORE));
        tx.oncomplete = function () {
          db.close();
          res(out && out.result !== undefined ? out.result : out);
        };
        tx.onerror = function () { db.close(); rej(tx.error); };
      });
    });
  }
  function bkList() {
    return bkTx("readonly", function (st) { return st.getAll(); })
      .then(function (rows) {
        return (rows || []).sort(function (a, z) { return a.at < z.at ? 1 : -1; });
      })
      .catch(function () { return []; });
  }
  /* Taken on a change, but rate-limited: a snapshot per keystroke is not a
     history, it is noise that pushes the useful one out of the window. */
  function bkMaybe() {
    if (borrowed() || emptyBook()) return;
    var now = Date.now();
    if (now - bkLast < BK_MIN_GAP) return;
    bkLast = now;
    bkSnap("automatic");
  }
  function bkSnap(why) {
    if (borrowed()) return Promise.resolve(null);
    var body;
    try { body = JSON.stringify(payload()); } catch (e) { return Promise.resolve(null); }
    var row = { at: nowStamp(), why: why || "automatic", bytes: body.length, body: body };
    return bkTx("readwrite", function (st) { st.put(row); })
      .then(bkList)
      .then(function (rows) {
        var extra = rows.slice(BK_KEEP);
        if (!extra.length) return row;
        return bkTx("readwrite", function (st) {
          extra.forEach(function (r) { st.delete(r.at); });
        }).then(function () { return row; });
      })
      .catch(function () { return null; });
  }
  /* A RESTORE IS ITSELF UNDOABLE: the book as it stands is snapshotted
     first, and the undo on the message puts that one back. Through
     `adoptState`, the single adoption point, because hand-copying a key
     list at a second site is exactly how Coffer lost grants. */
  function bkRestore(at, noSnap) {
    return bkTx("readonly", function (st) { return st.get(at); })
      .then(function (row) {
        if (!row) throw new Error("That snapshot is gone.");
        var parsed = JSON.parse(row.body);
        return (noSnap ? Promise.resolve(null) : bkSnap("before a restore")).then(function (before) {
          adoptRestored(parsed);
          openRec = ""; pageAt = {}; back = [];
          save(); render(); syncSoon();
          return { row: row, before: before };
        });
      });
  }
  function stampWhen(s) {
    var d = new Date(s);
    if (isNaN(d.getTime())) return String(s);
    return shortDate(iso(d)) + ", " + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
  }
  /* Filled in after the fact, because IndexedDB is asynchronous and
     renderView is not — the card paints what it knows and fills itself in. */
  function mountBackups() {
    var list = document.getElementById("bkList");
    if (!list) return;
    bkList().then(function (rows) {
      var sub = document.getElementById("bkSub");
      if (sub) {
        sub.textContent = borrowed()
          ? "None are kept on a borrowed laptop — nothing here outlives the tab."
          : rows.length
            ? cap(countWords(rows.length, "snapshot", "snapshots")) + " on this device, " +
              (rows.length === 1 ? "from " : "the newest from ") + stampWhen(rows[0].at) + "."
            : "None yet — one is taken the next time you change something.";
      }
      if (!rows.length) { list.innerHTML = ""; return; }
      list.innerHTML = '<div class="rows">' + rows.map(function (r) {
        return '<div class="row flat"><span class="grow"><span class="nm">' +
          esc(stampWhen(r.at)) + '</span><span class="sub">' +
          esc(r.why === "automatic" ? "Taken by itself"
            : r.why === "before a restore" ? "The book as it was before a restore"
            : "Taken by hand") + " · " +
          Math.max(1, Math.round(r.bytes / 1024)) + " KB</span></span>" +
          '<span class="right">' + btn("bk-restore", r.at, "Put this back", "btn tiny") +
          "</span></div>";
      }).join("") + "</div>";
    });
  }

  function bkRestoreDialog(at) {
    confirmAction({
      title: "Put the book back as it was on " + stampWhen(at) + "?",
      message: "The book as it stands now is kept as a snapshot first, so the undo on " +
        "the message puts it straight back." + (syncOn()
          ? " This book syncs: anything deleted since comes back everywhere, and " +
            "anything another device changed since returns with the next sync."
          : ""),
      confirmLabel: "Put this back", danger: false, cancelLabel: "Cancel"
    }, function () {
      bkRestore(at).then(function (r) {
        toast("Put back as it was on " + stampWhen(r.row.at), r.before ? function () {
          bkRestore(r.before.at, true).catch(function () {});
        } : null);
      }).catch(function (e) {
        toast(e && e.message ? e.message : "That snapshot could not be read.");
      });
    });
  }

  /* ============================================================
     THE WORKBENCH, AS A READING OF THE BOOK.

     The handoff's prototype (`reference/workbench-logic.js`, which is the
     spec) runs over one flat list of items and a list of undirected pairs.
     This book already holds every one of those things in typed lists, and
     the owner's book is in them. So the Workbench does not get a second
     store: `wbBuild()` DERIVES the prototype's item list from `state` on
     every render, with each item's id being the record's own ref
     (`project:p1`, `lib:x9`), and every change is written back onto the
     record that owns it. The prototype's rules are ported over that
     projection close to verbatim, so their wording is the spec's.

     Three things the prototype stored that this book does not:
       · `focus[]` — here `focusAt` on the action, newest three win, so it
         syncs per record like everything else;
       · the `HIST` weeks on a bench — here the real hours per week;
       · fixed dates — here the real day, with the reference's dates as
         RULES that land on them when the day is 25 September (the example
         book pins that day, so it can be laid beside the reference).
     ============================================================ */

  /* The type words and their colours. A colour is a TOKEN, never a literal,
     so the dark palette the owner will ship is one block of tokens. */
  var WB_T = {
    action: ["Action", "--t-action"], note: ["Note", "--t-note"],
    meeting: ["Meeting", "--t-meeting"], file: ["File", "--t-file"],
    link: ["Link", "--t-link"], reading: ["To read", "--t-reading"],
    script: ["Script", "--t-script"], formula: ["Formula", "--t-formula"],
    method: ["Method", "--t-method"], reference: ["Reference", "--t-reference"],
    place: ["Place", "--t-place"], output: ["Output", "--t-output"],
    skill: ["Skill", "--t-skill"], training: ["Training", "--t-training"],
    draft: ["Idea", "--t-draft"], hours: ["Hours", "--t-hours"],
    role: ["Role", "--t-role"], bench: ["Bench", "--t-bench"],
    /* The book holds more kinds than the prototype drew. They are readable
       and linkable here too, or a record would exist that the line cannot
       find and the pane cannot show. */
    template: ["Template", "--t-template"], person: ["Person", "--t-person"],
    job: ["Employer", "--t-job"], education: ["Education", "--t-education"],
    workflow: ["Workflow", "--t-workflow"], run: ["Run", "--t-workflow"],
    asset: ["Equipment", "--t-asset"], portfolio: ["Portfolio", "--t-output"],
    cv: ["CV", "--t-role"]
  };
  function tWord(t) { return (WB_T[t] || ["Record"])[0]; }
  function tCol(t) { return "var(" + (WB_T[t] || [0, "--t-note"])[1] + ")"; }

  /* The Library's shelves, in the prototype's order, with Templates kept so
     a book that already holds templates does not lose sight of them. */
  var WB_LIB = ["script", "formula", "method", "template", "reference", "reading",
    "place", "link", "file"];
  var BENCH_DOTS = ["--b1", "--b2", "--b3", "--b4", "--b5", "--b6", "--b7", "--b8"];

  var WB_NUM = ["No", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight",
    "Nine", "Ten"];
  var WB_DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  var WB_MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct",
    "Nov", "Dec"];
  var WB_LONGDAY = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday",
    "Saturday"];
  var WB_LONGMON = ["January", "February", "March", "April", "May", "June", "July",
    "August", "September", "October", "November", "December"];

  function wbFmt(d) {
    if (!d || !dayOk(d)) return "";
    var x = parseISO(d);
    return WB_DAYS[x.getDay()] + " " + x.getDate() + " " + WB_MON[x.getMonth()];
  }
  function wbHm(m) {
    m = Math.round(num(m));
    var h = Math.floor(m / 60), r = m % 60;
    return (h ? h + "h" : "") + (h && r ? " " : "") + (r || !h ? r + "m" : "");
  }
  function wbWords(n, one, many) {
    return (n <= 10 ? WB_NUM[n] : String(n)) + " " + (n === 1 ? one : many);
  }

  /* ---------------- the day ----------------

     The real day, except in the example book, whose records were written
     for Friday 25 September 2026 and read as nonsense on any other day. */
  var WB_DEMO_DAY = "2026-09-25";
  /* ONE DAY FOR THE WHOLE APP. Pinned for the Workbench alone, the older
     screens read the real clock and called Byblos's action late while
     Today said it was due today — two readings of one book. The shared
     runtime's `today()` has to stay byte-identical across five apps, so it
     is wrapped here rather than edited: the binding is a function
     declaration in this same scope, and replacing it changes what every
     caller in this app reads without touching a byte of the runtime. */
  var realToday = today;
  today = function () {
    return state && state.settings && state.settings.demo ? WB_DEMO_DAY : realToday();
  };
  function wbToday() { return today(); }
  function wbWeek() {
    var d = parseISO(wbToday()), back = (d.getDay() + 6) % 7;
    return addDays(wbToday(), -back);
  }
  /* The next date AFTER today that falls on this weekday. */
  function wbComing(dow) {
    var t = wbToday(), d = parseISO(t), n = (dow - d.getDay() + 7) % 7 || 7;
    return addDays(t, n);
  }
  /* The reference's fixed dates, as rules that land on them on 25 Sep:
     a week out (Fri 2 Oct), the coming Monday (28 Sep), the coming Tuesday
     (29 Sep), tomorrow (26 Sep). */
  function wbWeekOut() { return addDays(wbToday(), 7); }

  /* ---------------- the projection ---------------- */

  var WB = null;
  function pj(pid) { return pid ? ref("project", pid) : undefined; }

  /* A bench's short handle, typed as `#anfeh` in the line. Stated when it
     was given one, otherwise the first word of its name. */
  function benchKey(p) {
    if (p.key) return String(p.key).toLowerCase();
    return (String(p.name || "").toLowerCase().match(/[a-z0-9؀-ۿ]+/) || [""])[0];
  }
  /* The line over a bench's name. Stated when somebody typed one (the line
     writes "New bench" on a bench it makes); otherwise read off the role
     and employer the project already names, never invented. */
  function benchRole(p) {
    if (p.role) return p.role;
    if (p.status === "idea") return "Idea, not started";
    /* The employer is the project's own, or failing that its role's. */
    var r = p.roleId && byId("role", p.roleId);
    var j = (p.jobId && byId("job", p.jobId)) || (r && r.jobId && byId("job", r.jobId));
    if (r && j) return r.name + " · " + j.name;
    if (r) return r.name;
    if (j) return j.name;
    return "Bench";
  }
  /* A bench that is finished stays a bench — its stream still opens — but
     it leaves the sidebar, the Map and Today, which are about the work in
     front of you. */
  function benchLive(p) { return p.status !== "completed" && p.status !== "archived"; }

  function roleWhen(r) {
    var a = String(r.startedOn || "").slice(0, 4), b = String(r.endedOn || "").slice(0, 4);
    if (!a && !b) return "";
    return (a || "?") + " – " + (b || "now");
  }

  /* The live CV is the book's first CV record; its picks are `picks` links,
     so the Workbench's "on the CV" and the Show tab's CV are one fact. */
  function wbCv() { return state.cvs[0] || null; }
  function wbOnCv(r) {
    var cv = wbCv();
    if (!cv) return false;
    var c = ref("cv", cv.id);
    return state.links.some(function (l) { return l.a === c && l.b === r && l.rel === "picks"; });
  }

  function wbBuild() {

        key: benchKey(p), role: benchRole(p), draft: p.status === "idea",

        date: n.on || "", bench: pj(n.projectId), inbox: !!n.inbox });
    });
    state.lib.forEach(function (e) {

      put({ id: ref("lib", e.id), type: t, rec: e, title: e.name || "",
        code: code, body: code ? (e.note || "") : (e.body || e.note || ""),

    });
    state.skills.forEach(function (k) {

    });
    state.training.forEach(function (t) {
      var r = ref("training", t.id);
      put({ id: r, type: "training", rec: t, title: t.name || "",
        date: t.startedOn || t.endedOn || t.on || "", body: t.note || "",
        path: t.path || t.url || "", onCv: wbOnCv(r) });
    });
    state.roles.forEach(function (r) {
      var j = r.jobId && byId("job", r.jobId);
      put({ id: ref("role", r.id), type: "role", rec: r,
        title: (r.name || "") + (j ? ", " + j.name : ""), when: roleWhen(r),
        body: r.duties || r.note || "" });
    });
    [["person", "people"], ["job", "jobs"], ["education", "education"],
     ["workflow", "workflows"], ["run", "runs"], ["asset", "assets"],
     ["portfolio", "portfolio"], ["cv", "cvs"]].forEach(function (pair) {
      state[pair[1]].forEach(function (x) {
        put({ id: ref(pair[0], x.id), type: pair[0], rec: x, title: recName(x, pair[0]),
          body: x.note || "", path: x.path || x.url || "",
          bench: pair[0] === "run" ? pj(x.projectId) : undefined });
      });
    });
    state.links.forEach(function (l) {
      if (!by[l.a] || !by[l.b] || l.a === l.b) return;
      (nb[l.a] = nb[l.a] || []).push(l.b);
      (nb[l.b] = nb[l.b] || []).push(l.a);

  }

  function wbGet(id) { return (WB || wbBuild()).by[id] || null; }
  function wbBenches() { return WB.items.filter(function (x) { return x.type === "bench"; }); }
  function wbLiveBenches() { return wbBenches().filter(function (b) { return b.live; }); }
  function wbNbrs(id) {
    var seen = {};
    return (WB.nb[id] || []).filter(function (x) {

    }).map(wbGet).filter(Boolean);
  }
  function wbLinked(a, b) {
    return state.links.some(function (l) {

  }
  function wbBenchName(id) { var b = id && wbGet(id); return b ? b.title : ""; }

  /* Focus: the open actions picked in the weekly review, newest three. */
  function wbFocus() {
    return WB.items.filter(function (x) { return x.type === "action" && x.focusAt && !x.done; })
      .sort(function (a, b) { return a.focusAt < b.focusAt ? 1 : -1; }).slice(0, 3)
      .map(function (x) { return x.id; });
  }

  /* ---------------- reading an item (the prototype's own words) -------- */

  function wbStand(it) {
    var T = wbToday();
    if (it.done) return { w: "Done", c: "var(--dim)", bg: "var(--sidebar)" };
    if (it.waiting) return { w: "Waiting · " + it.waiting, c: "var(--dim)", bg: "var(--sidebar)" };
    if (it.due && it.due < T) return { w: "Late", c: "var(--late)", bg: "var(--late-bg)" };
    if (it.due === T) return { w: "Today", c: "var(--today)", bg: "var(--today-bg)" };
    if (wbFocus().indexOf(it.id) >= 0) {
      return { w: "Focus · " + wbFmt(it.due), c: "var(--blue-deep)", bg: "var(--blue-tint)" };
    }
    return { w: wbFmt(it.due) || "Open", c: "var(--dim)", bg: "transparent" };
  }
  function wbMeta(it) {
    if (it.inbox) return "Inbox · " + wbFmt(it.date);
    if (it.type === "hours") {
      return [wbHm(it.mins), wbBenchName(it.bench), wbFmt(it.date)].filter(Boolean).join(" · ");
    }
    if (it.type === "action") {
      return [wbBenchName(it.bench), it.due ? "due " + wbFmt(it.due) : ""].filter(Boolean).join(" · ");
    }
    if (it.type === "role") return it.when || "";
    return [wbBenchName(it.bench), it.path, wbFmt(it.date)].filter(Boolean).join(" · ");

  function wbTitle(it) { return it.type === "hours" ? wbHm(it.mins) + " · " + it.title : it.title; }
  function wbSnippet(it) {
    return it.body || it.path || (it.type === "action" ? wbStand(it).w : it.type === "hours" ? "Logged" : "");
  }

  /* ---------------- writing it back ----------------

     Every change that alters data snapshots the lists first, and the undo
     on the message puts them back INTO THE SAME `state` object, so the
     change-tracking that feeds sync sees a delete as a delete and a
     restored record as revived. Replacing `state` would skip both. */
  function wbSnap() {
    var s = {};
    STATE_LISTS.forEach(function (k) { s[k] = JSON.parse(JSON.stringify(state[k])); });
    return s;
  }
  function wbRestore(s) {
    STATE_LISTS.forEach(function (k) { state[k] = s[k]; });
    stampRecords();
    syncSoon();
  }
  function wbSay(msg, snap) {
    toast(msg, snap ? function () { wbRestore(snap); } : null);
  }
  function wbDone(msg, snap) { commit(); render(); wbSay(msg, snap); }

  function wbFile(id, benchId) {
    var rec = recOf(id);
    if (!rec) return;
    var snap = wbSnap();

    rec.projectId = parseRef(benchId).id;

  }
  /* A record takes its lines with it, the same rule every removal here
     follows; the undo brings both back. */
  function wbDiscard(id) {

    if (!rec) return;

    list.splice(list.indexOf(rec), 1);
    state.links = state.links.filter(function (l) { return l.a !== id && l.b !== id; });
    /* Where it sat on the map goes with it; the undo brings both back. */
    state.spots = state.spots.filter(function (s) { return s.id !== id; });
    if (wbSel === id) wbSel = null;

  }
  /* "Make it an action": a note, a file or an idea in the inbox BECOMES an
     action — a new record in the actions list, with every line that
     touched the old one moved onto it, so nothing it was linked to is
     lost. */
  function wbToAction(id) {
    var p = parseRef(id), rec = recOf(id);

    var snap = wbSnap(), due = wbComing(2);
    if (p.kind === "action") {
      delete rec.inbox; rec.when = due;
    } else {
      var a = { id: uid(), name: rec.name || "Untitled", kind: "do", when: due,
        on: rec.on || wbToday(), projectId: rec.projectId || "", note: rec.body || rec.note || "" };
      state.actions.push(a);
      var nr = ref("action", a.id);
      state.links.forEach(function (l) { if (l.a === id) l.a = nr; if (l.b === id) l.b = nr; });
      /* It stays where it sat on the map, as the new record. */
      state.spots.forEach(function (s) { if (s.id === id) state.spots.push({ id: nr, x: s.x, y: s.y }); });
      state.spots = state.spots.filter(function (s) { return s.id !== id; });
      var list = listOf(p.kind);
      list.splice(list.indexOf(rec), 1);

  }
  function wbToggleDone(id) {
    var a = recOf(id);
    if (!a) return;
    var snap = wbSnap(), was = !!a.doneAt;
    if (was) delete a.doneAt; else a.doneAt = wbToday();

  }
  function wbToggleLink(a, b) {
    var snap = wbSnap(), on = wbLinked(a, b);

        return !((l.a === a && l.b === b) || (l.a === b && l.b === a));
      });
    } else {
      state.links.push({ id: uid(), rel: "with", a: a, b: b, note: "" });
    }
    wbDone(on ? "Link taken out" : "Linked", snap);
  }
  function wbPush(id) {
    var a = recOf(id);
    if (!a) return;
    var snap = wbSnap(), d = wbWeekOut();
    a.when = d; delete a.waitOn;
    wbDone("Pushed to " + wbFmt(d), snap);
  }
  function wbSetFocus(id) {
    var a = recOf(id);
    if (!a) return;
    var snap = wbSnap();
    if (a.focusAt && wbFocus().indexOf(id) >= 0) delete a.focusAt;
    else {

      /* At most three, and the newest wins. */
      var keep = [id].concat(wbFocus().filter(function (x) { return x !== id; })).slice(0, 3);
      state.actions.forEach(function (x) {
        if (x.focusAt && keep.indexOf(ref("action", x.id)) < 0) delete x.focusAt;
      });
    }
    commit(); render();
    toast(a.focusAt ? "In focus" : "Out of focus", function () { wbRestore(snap); });
  }
  function wbReadStep(id, k) {
    var e = recOf(id);
    if (!e) return;
    var snap = wbSnap();
    if (k === "read") {
      e.rstat = "read";
      if (!e.body && !e.note) e.body = "Read " + wbFmt(wbToday()) + ".";
      wbDone("Read. Filed as a reference.", snap);
      return;
    }
    e.rstat = k;
    commit(); render();
  }
  function wbToggleCv(id) {
    var snap = wbSnap(), cv = wbCv();
    if (!cv) {
