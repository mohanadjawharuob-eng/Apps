      state.cvs.push(cv);
    }
    var c = ref("cv", cv.id), on = wbOnCv(id);
    if (on) {
      state.links = state.links.filter(function (l) {
        return !(l.a === c && l.b === id && l.rel === "picks");
      });
    } else {
      state.links.push({ id: uid(), rel: "picks", a: c, b: id, note: "" });
    }
    commit(); render();
    toast(on ? "Taken off the CV" : "On the CV", function () { wbRestore(snap); });
  }

  /* ---------------- the line: parse (the prototype's rules, in order) ---- */

  function wbParse(q) {
    var t = String(q || "").trim(), type = "note", mins = 0, due = null, m;
    var bench = wbCtxBench();
    var tag = t.match(/#([\w؀-ۿ]+)/);
    if (tag) {
      var b = wbBenches().filter(function (x) { return x.key === tag[1].toLowerCase(); })[0];
      if (b) bench = b.id;
      t = t.replace(tag[0], "").replace(/\s+/g, " ").trim();
    }
    if ((m = t.match(/^bench:\s*(.+)/i))) return { type: "bench", title: m[1].trim(), bench: null };
    if ((m = t.match(/^(\d+(?:\.\d+)?)\s*h\b\s*(?:(\d+)\s*m\b)?/i))) {
      mins = Math.round(parseFloat(m[1]) * 60) + (m[2] ? +m[2] : 0);
      type = "hours"; t = t.slice(m[0].length).trim();
    } else if ((m = t.match(/^(\d+)\s*m(in)?\b/i))) {
      mins = +m[1]; type = "hours"; t = t.slice(m[0].length).trim();
    } else if (/^(!|todo:?\s)/i.test(t)) {
      type = "action"; t = t.replace(/^(!|todo:?)\s*/i, "");
      due = /\btoday\b/i.test(t) ? wbToday() : /\btomorrow\b/i.test(t) ? addDays(wbToday(), 1)
        : /\bmon(day)?\b/i.test(t) ? wbComing(1) : wbWeekOut();
    } else if (/^https?:\/\//i.test(t)) type = "link";
    else if (/^read:?\s+/i.test(t)) { type = "reading"; t = t.replace(/^read:?\s+/i, ""); bench = null; }
    else if (/^idea:?\s+/i.test(t)) { type = "draft"; t = t.replace(/^idea:?\s+/i, ""); }
    else if (/^(met|call|meeting)\b/i.test(t)) {
      var parts = t.split(";").map(function (x) { return x.trim(); }).filter(Boolean);
      var head = parts[0].split(":");
      t = head[0].trim();
      if (bench) {
        var bn = wbGet(bench);
        t = t.replace(new RegExp("\\s*#?" + (bn ? bn.key.replace(/[^\w]/g, "") : "~~") + "\\b", "i"), "").trim();
      }
      return { type: "meeting", title: t, bench: bench,
        body: [head.slice(1).join(":").trim()].concat(parts.slice(1)).filter(Boolean).join("\n"),
        spawn: parts.slice(1).filter(function (x) {
          return /\b(needs?|send|by|book|do|chase|ask)\b/i.test(x);
        }) };
    }
    if (type === "hours" && !bench) {
      var first = wbLiveBenches()[0];
      bench = first ? first.id : null;
    }
    return { type: type, title: t || "Untitled", bench: bench, mins: mins, due: due };
  }

  /* KEEP. Each parsed type lands on the list that owns it. */
  function wbCapture(q) {
    var p = wbParse(q), on = wbToday(), snap = wbSnap();
    var pid = p.bench ? parseRef(p.bench).id : "";
    var inbox = !p.bench && p.type !== "reading" && p.type !== "bench";
    var made;
    if (p.type === "bench") {
      var key = (p.title.toLowerCase().match(/[a-z0-9؀-ۿ]+/) || [""])[0];
      state.projects.push(made = { id: uid(), name: p.title, key: key, role: "New bench",
        status: "active" });
      made = ref("project", made.id);
    } else if (p.type === "action") {
      state.actions.push(made = { id: uid(), name: p.title, kind: "do", when: p.due, on: on,
        projectId: pid });
      if (inbox) made.inbox = true;
      made = ref("action", made.id);
    } else if (p.type === "hours") {
      state.hours.push(made = { id: uid(), projectId: pid, on: on, minutes: p.mins, note: p.title });
      made = ref("hours", made.id);
    } else if (p.type === "link") {
      state.lib.push(made = { id: uid(), kind: "link", name: p.title, url: p.title, on: on,
        projectId: pid });
      if (inbox) made.inbox = true;
      made = ref("lib", made.id);
    } else if (p.type === "reading") {
      state.lib.push(made = { id: uid(), kind: "reference", name: p.title, rstat: "want", on: on });
      made = ref("lib", made.id);
    } else {
      state.notes.push(made = { id: uid(), kind: p.type === "draft" ? "idea" : p.type,
        name: p.title, on: on, projectId: pid, body: p.body || "" });
      if (inbox) made.inbox = true;
      made = ref("note", made.id);
    }
    var extra = (p.spawn || []).map(function (x) {
      var a = { id: uid(), name: x.charAt(0).toUpperCase() + x.slice(1), kind: "do", on: on,
        projectId: pid, when: /\bmon/i.test(x) ? wbComing(1) : wbWeekOut() };
      if (!p.bench) a.inbox = true;
      state.actions.push(a);
      state.links.push({ id: uid(), rel: "with", a: made, b: ref("action", a.id), note: "" });
      return a;
    });
    commit(); render();
    if (extra.length) {
      wbSay("Kept the meeting and " + wbWords(extra.length, "action", "actions").toLowerCase() +
        " from it", snap);
      return;
    }
    wbSay("Kept as " + tWord(p.type).toLowerCase() + (p.bench ? " on " + wbBenchName(p.bench)
      : p.type === "reading" ? " in your reading list" : p.type === "bench" ? "" : " in the inbox"),
      snap);
  }

  /* ---------------- the line: search and ask ---------------- */

  function wbIsQuestion(q) {
    return /\?\s*$/.test(q) || /^(what|where|which|who|how|when)\b/i.test(String(q).trim());
  }
  function wbMatches(it, s) {
    var hay = (it.title + " " + (it.body || "") + " " + (it.path || "") + " " + (it.code || "")).toLowerCase();
    var w = String(s).toLowerCase().replace(/[?]/g, "").split(/\s+/).filter(function (x) {
      return x && !/^(the|a|an|of|for|workflow|folder)$/.test(x);
    });
    return w.length > 0 && w.every(function (x) { return hay.indexOf(x) >= 0; });
  }
  function wbAsk(q) {
    var s = String(q).trim().replace(/\?+$/, ""), items = WB.items, m, T = wbToday();
    var rows = function (l) { return l.slice(0, 8); };
    if (/what needs me/i.test(s)) {
      var l = items.filter(function (x) {
        return x.type === "action" && !x.done && !x.waiting && x.due && x.due <= T;
      });
      var late = l.filter(function (x) { return x.due < T; }).length;
      return { text: wbWords(late, "thing is", "things are") + " late and " +
          wbWords(l.length - late, "is", "are").toLowerCase() + " due today.",
        readAs: "what needs me", rows: rows(l) };
    }
    if ((m = s.match(/evidence.*for (.+)$/i))) {
      var sk = items.filter(function (x) {
        return x.type === "skill" && x.title.toLowerCase().indexOf(m[1].toLowerCase()) >= 0;
      })[0];
      if (sk) {
        var ev = wbNbrs(sk.id).filter(function (x) { return x.type !== "skill"; });
        return { text: wbWords(ev.length, "record backs", "records back") + " " + sk.title + ".",
          readAs: "what evidence do I have for a skill", rows: rows(ev) };
      }
      return { text: "No skill by that name.", readAs: "what evidence do I have for a skill",
        rows: rows(items.filter(function (x) { return x.type === "skill"; })) };
    }
    if ((m = s.match(/where is (.+)$/i))) {
      var lp = items.filter(function (x) { return x.path && wbMatches(x, m[1]); });
      return { text: lp.length ? lp[0].path : "Nothing with a path matches that.",
        readAs: "where is a place", rows: rows(lp) };
    }
    if ((m = s.match(/which (?:projects|benches) used (.+)$/i))) {
      var hit = items.filter(function (x) { return x.type !== "bench" && wbMatches(x, m[1]); })[0];
      var lb = hit ? wbNbrs(hit.id).filter(function (x) { return x.type === "bench"; })
        .concat(hit.bench && wbGet(hit.bench) ? [wbGet(hit.bench)] : []) : [];
      return { text: hit ? wbWords(lb.length, "bench used", "benches used") + " " + hit.title + "."
          : "Nothing matches that name.", readAs: "which benches used something", rows: rows(lb) };
    }
    if ((m = s.match(/how long.* (?:on|did) (.+?)(?: take)?$/i))) {
      var want = m[1].replace(/\b(the|project|bench)\b/gi, "");
      var b = wbBenches().filter(function (x) { return wbMatches(x, want); })[0];
      if (b) {
        var hs = items.filter(function (x) { return x.type === "hours" && x.bench === b.id; });
        var t = hs.reduce(function (a, x) { return a + x.mins; }, 0);
        return { text: wbHm(t) + " logged on " + b.title + ".", readAs: "how long did a bench take",
          rows: rows(hs) };
      }
    }
    if (/who am i (waiting|chasing)/i.test(s)) {
      var lw = items.filter(function (x) { return x.waiting && !x.done; });
      return { text: wbWords(lw.length, "thing is", "things are") + " waiting on somebody.",
        readAs: "who am I waiting on", rows: rows(lw) };
    }
    return { text: "I couldn’t shape that into a question I know.",
      readAs: "not one of the six question shapes", rows: [] };
  }

  /* ============================================================
     THE WORKBENCH'S SCREENS.

     Every screen is a string built from `WB`, the projection `wbBuild()`
     makes once per render, so no screen can read the book differently from
     another. The markup follows the handoff's reference one element at a
     time; the measurements live in 02b-wb.css as classes, and every colour
     is a token.
     ============================================================ */

  /* View state: where you are, never saved. */
  var wbBench = "";        // the open bench's ref
  var wbSel = null;        // the record open in the pane
  var wbFilter = "all";    // the bench stream's filter
  var wbLinking = false, wbLinkQ = "";
  var wbKeysOn = false;
  var wbOrder = [];        // what j/k walk through on this screen

  var WB_VIEWS = { today: 1, bench: 1, map: 1, shelves: 1, record: 1, review: 1, benches: 1, more: 1 };

  function wbCtxBench() { return view === "bench" && wbGet(wbBench) ? wbBench : null; }

  /* ---------------- small pieces ---------------- */

  function wDot(t, cls) {
    return '<span class="w-dot' + (cls ? " " + cls : "") + '" style="background:' + tCol(t) + '"></span>';
  }
  function wTw(t, cls) {
    return '<span class="w-tw' + (cls ? " " + cls : "") + '" style="color:' + tCol(t) + '">' +
      esc(tWord(t)) + "</span>";
  }
  function wEyebrow(s) { return '<p class="w-eyebrow">' + esc(s) + "</p>"; }
  function wSelBg(id) { return wbSel === id ? " is-sel" : ""; }
  function wChip(act, id, label, cls) {
    return '<button class="w-chip' + (cls ? " " + cls : "") + '" data-act="' + act + '" data-id="' +
      esc(id) + '">' + esc(label) + "</button>";
  }
  /* The filing chips: every live bench that is not an idea, then the two
     other ways out. The prototype's own labels. */
  function wFileChips(it) {
    return wbLiveBenches().filter(function (b) { return !b.draft; }).map(function (b) {
      return wChip("wb-file", it.id + "|" + b.id, "→ " + b.title.split(/[ ,]/)[0]);
    }).join("") + wChip("wb-toact", it.id, "Make it an action") +
      wChip("wb-discard", it.id, "Discard");
  }
  /* One row that opens a record: a dot, the title, a meta line, the type
     word. Used by the line's results, the inbox and the review. */
  function wRow(it, cls) {
    return '<button class="w-row' + (cls ? " " + cls : "") + wSelBg(it.id) +
      '" data-act="wb-open" data-id="' + esc(it.id) + '">' + wDot(it.type) +
      '<span class="w-grow"><span class="w-rt">' + esc(wbTitle(it)) + '</span><span class="w-rm">' +
      esc(wbMeta(it)) + "</span></span>" + wTw(it.type) + "</button>";
  }

  /* ---------------- the sidebar ---------------- */

  function wbSide() {
    var acts = WB.items.filter(function (x) { return x.type === "action"; });
    var T = wbToday();
    var late = acts.filter(function (x) { return !x.done && !x.waiting && x.due && x.due < T; });
    var inbox = WB.items.filter(function (x) { return x.inbox; });
    var libN = WB.items.filter(function (x) { return WB_LIB.indexOf(x.type) >= 0 && !x.inbox; }).length;
    var counts = { today: late.length ? late.length + " late" : "", shelves: String(libN),
      review: inbox.length ? inbox.length + " to sort" : "" };
    var tone = { today: "late", review: "blue" };
    var tabs = document.querySelectorAll("#nav .tab");
    for (var i = 0; i < tabs.length; i++) {
      var id = tabs[i].getAttribute("data-tab");
      var n = counts[id] || "";
      var old = tabs[i].querySelector(".w-navn");
      if (old) old.parentNode.removeChild(old);
      if (n) {
        var s = document.createElement("span");
        s.className = "w-navn" + (tone[id] ? " is-" + tone[id] : "");
        s.textContent = n;
        tabs[i].appendChild(s);
      }
    }
    var el = document.getElementById("sideWork");
    if (el) {
      el.innerHTML = '<div class="w-sgroup"><p class="w-slabel">Benches</p>' +
        wbLiveBenches().map(function (b) {
          var open = acts.filter(function (a) { return a.bench === b.id && !a.done; }).length;
          var on = view === "bench" && wbBench === b.id;
          return '<button class="w-srow' + (on ? " is-on" : "") + '" data-act="wb-bench" data-id="' +
            esc(b.id) + '"' + (on ? ' aria-current="page"' : "") + '><span class="w-bdot" style="background:' +
            b.dot + '"></span><span class="w-stitle' + (b.draft ? " is-idea" : "") + '">' +
            esc(b.title) + '</span><span class="w-scount">' + (open || "") + "</span></button>";
        }).join("") +
        '<p class="w-shelp">Start a bench by typing <span class="w-mono">bench: name</span> in the line.</p></div>' +
        /* EVERYTHING ELSE. The Workbench has no screen for an employer, a
           degree, a person, a workflow or a portfolio item, and the book
           holds them; the handoff's own plan says the older screens "stay
           reachable", so they are here, quietly, under the benches. */
        '<div class="w-sgroup"><p class="w-slabel">Everything else</p>' +
        [["career", "Career"], ["work", "Work"], ["library", "Library pages"],
         ["dir", "Directory"], ["show", "Portfolio and CVs"]].map(function (x) {
          var on = view === x[0];
          return '<button class="w-srow is-quiet' + (on ? " is-on" : "") + '" data-act="wb-else" data-id="' +
            x[0] + '"' + (on ? ' aria-current="page"' : "") + '><span class="w-stitle">' + x[1] +
            "</span></button>";
        }).join("") + "</div>";
    }
    var foot = document.getElementById("railFoot");
    if (foot) {
      /* THE FOOTER SAYS WHERE THE BOOK IS. The handoff's fixed line reads
         "this browser only. Nothing is uploaded." — true of the prototype,
         and false the moment sync is on, so the words come from the sync
         state rather than from the copy. */
      var who = state.settings.demo ? "Maya Saad" : (state.profile.name || "Your book");
      foot.innerHTML = esc(who) + " · " + (syncOn()
        ? "synced across your devices, sealed before it leaves."
        : "this browser only. Nothing is uploaded.") +
        '<br>Press <span class="w-mono">?</span> for keys. ' +
        '<button class="w-footlink" data-act="settings">Settings</button>';
    }
    var pt = document.getElementById("ptabs");
    if (pt) {
      var MORE = { map: 1, record: 1, career: 1, work: 1, library: 1, dir: 1, show: 1, settings: 1, guide: 1, more: 1 };
      pt.innerHTML = [["today", "Today"], ["benches", "Benches"], ["shelves", "Library"],
        ["review", "Review"], ["more", "More"]].map(function (x) {
          var on = x[0] === "benches" ? (view === "bench" || view === "benches")
            : x[0] === "more" ? !!MORE[view] : view === x[0];
          return '<button class="w-ptab' + (on ? " is-on" : "") + '" data-act="wb-ptab" data-id="' +
            x[0] + '"' + (on ? ' aria-current="page"' : "") + ">" + x[1] + "</button>";
        }).join("");
    }
  }

  /* ---------------- the capture line ---------------- */

  /* The phone's line is narrower, and the reference gives it its own
     shorter words. */
  var WB_PHONE = window.matchMedia ? window.matchMedia("(max-width: 879px)") : null;
  function wbPlaceholder() {
    var inp = document.getElementById("line");
    if (inp) inp.placeholder = WB_PHONE && WB_PHONE.matches ? "Keep, find or ask\u2026"
      : "Type anything to keep it \u00b7 search \u00b7 or ask: what needs me?";
  }
  function wbLineCtx() {
    var el = document.getElementById("lineCtx"), b = wbCtxBench();
    if (!el) return;
    el.hidden = !b;
    el.textContent = b ? "→ " + wbGet(b).title : "";
  }
  function wbPaintDrop() {
    var inp = document.getElementById("line"), drop = document.getElementById("drop");
    if (!inp || !drop) return;
    var q = inp.value.trim();
    if (!q) { drop.hidden = true; drop.innerHTML = ""; return; }
    if (!WB) wbBuild();
    var html = "";
    if (wbIsQuestion(q)) {
      var a = wbAsk(q);
      html = '<div class="w-ans"><p class="w-anst">' + esc(a.text) + '</p><p class="w-ansr">read as: ' +
        esc(a.readAs) + "</p></div>" + a.rows.map(function (it) { return wRow(it, "is-ans"); }).join("");
    } else {
      var p = wbParse(q);
      if (p.spawn && p.spawn.length) p.due = null;
      var word = tWord(p.type) + (p.spawn && p.spawn.length ? " + " +
        wbWords(p.spawn.length, "action", "actions").toLowerCase() : "") +
        (p.type === "hours" ? " · " + wbHm(p.mins) : "") + (p.due ? " · due " + wbFmt(p.due) : "");
      var where = p.type === "bench" ? "a new bench" : p.bench ? "on " + wbBenchName(p.bench)
        : p.type === "reading" ? "in your reading list" : "in the inbox, to sort later";
      var found = WB.items.filter(function (x) { return x.type !== "hours" && wbMatches(x, q); }).slice(0, 7);
      html = '<div class="w-keepbar"><span class="w-kbd">Enter</span><span>keeps it as</span>' +
        '<span class="w-pillt" style="background:' + tCol(p.type) + '">' + esc(word) + "</span>" +
        '<span class="w-where">' + esc(where) + "</span></div>" +
        '<p class="w-dlabel">' + (found.length ? "Already kept" : "Nothing kept matches yet") + "</p>" +
        found.map(function (it) { return wRow(it, "is-find"); }).join("") +
        '<p class="w-dhelp">Start with <b>!</b> for an action, <b>2h</b> to log time, <b>read:</b> for your ' +
        "reading list, <b>idea:</b> for a draft, <b>#" + esc((wbLiveBenches()[0] || { key: "anfeh" }).key) +
        "</b> to put it on a bench. End with <b>?</b> to ask.</p>";
    }
    drop.innerHTML = html;
    drop.hidden = false;
  }
  function wbLineKeep() {
    var inp = document.getElementById("line");
    var q = inp.value.trim();
    if (!q || wbIsQuestion(q)) return;
    inp.value = "";
    wbPaintDrop();
    wbCapture(q);
  }
  function wbWireLine() {
    var inp = document.getElementById("line");
    inp.addEventListener("input", wbPaintDrop);
    inp.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); wbLineKeep(); }
      if (e.key === "Escape") { inp.value = ""; wbPaintDrop(); }
    });
    document.getElementById("lineKeep").addEventListener("click", wbLineKeep);
    wbPlaceholder();
    if (WB_PHONE && WB_PHONE.addEventListener) WB_PHONE.addEventListener("change", wbPlaceholder);
    /* A press on a result opens it, and the line lets go of what was typed:
       the prototype's `open()` clears the query too. */
    document.getElementById("drop").addEventListener("click", function (e) {
      if (e.target.closest("[data-act]")) { inp.value = ""; wbPaintDrop(); }
    });
  }

  /* ---------------- Today ---------------- */

  function wbGreeting() {
    var h = new Date().getHours();
    var part = state.settings.demo || h < 12 ? "morning" : h < 18 ? "afternoon" : "evening";
    var name = state.settings.demo ? "Maya" : String(state.profile.name || "").trim().split(/\s+/)[0];
    return "Good " + part + (name ? ", " + name : "") + ".";
  }
  function wbLongDate(d) {
    var x = parseISO(d);
    return WB_LONGDAY[x.getDay()] + " " + x.getDate() + " " + WB_LONGMON[x.getMonth()];
  }
  function wActRow(it) {
    var st = wbStand(it);
    return '<div class="w-arow' + wSelBg(it.id) + '"><button class="w-tick' + (it.done ? " is-done" : "") +
      '" data-act="wb-done" data-id="' + esc(it.id) + '" aria-label="' + (it.done ? "Reopen" : "Mark done") +
      '">' + (it.done ? "✓" : "") + '</button><button class="w-grow w-abtn" data-act="wb-open" data-id="' +
      esc(it.id) + '"><span class="w-rt' + (it.done ? " is-struck" : "") + '">' + esc(it.title) +
      '</span><span class="w-rm">' + esc(wbMeta(it)) + '</span></button><span class="w-state" style="color:' +
      st.c + ";background:" + st.bg + '">' + esc(st.w) + "</span></div>";
  }
  function wbTodayView() {
    var T = wbToday(), W = wbWeek(), items = WB.items;
    var acts = items.filter(function (x) { return x.type === "action"; });
    var late = acts.filter(function (x) { return !x.done && !x.waiting && x.due && x.due < T; });
    var inbox = items.filter(function (x) { return x.inbox; });
    var focus = wbFocus();
    var need = {};
    late.forEach(function (x) { need[x.id] = 1; });
    acts.forEach(function (x) { if (!x.done && x.due === T) need[x.id] = 1; });
    focus.forEach(function (id) { need[id] = 1; });
    var needRows = acts.filter(function (x) { return need[x.id] && !x.waiting; })
      .sort(function (a, b) { return (a.due || "z").localeCompare(b.due || "z"); });
    var waitRows = acts.filter(function (x) { return x.waiting && !x.done; });
    var weekMins = items.filter(function (x) { return x.type === "hours" && x.date >= W; })
      .reduce(function (a, x) { return a + x.mins; }, 0);
    wbOrder = needRows.map(function (x) { return x.id; }).concat(inbox.map(function (x) { return x.id; }));

    var out = wEyebrow(wbLongDate(T)) + '<h1 class="w-h1 is-today">' + esc(wbGreeting()) + "</h1>" +
      (emptyBook() ? "" : '<p class="w-lead">' + esc(wbWords(late.length, "thing is", "things are") + " late, " + inbox.length +
        " in the inbox, and " + wbHm(weekMins) + " logged this week across your benches.") + "</p>");

    /* AN EMPTY BOOK GETS AN OFFER, NOT A DASHBOARD OF NOUGHTS. Nothing is
       invented for you; the ways in are named. */
    if (emptyBook()) {
      out += '<section class="w-card w-first"><header class="w-chead"><h2>The book is empty</h2></header>' +
        '<p class="w-cempty">Nothing has been invented for you. Type anything in the line and it is ' +
        'kept \u2014 start a bench with <span class="w-mono">bench: name</span> \u2014 or begin from one of these.</p>' +
        '<div class="w-chips is-pad">' + wChip("sample", "", "Load the example") +
        wChip("import-json", "", "Feed it from a file") + wChip("profile-edit", "", "Start with your profile") +
        "</div>" + ((state.settings.offered || !oldBooks().length) ? "" :
          '<p class="w-cempty">There is an older Mashghal book on this browser. It is not read and not ' +
          "written to; it is offered.</p><div class=\"w-chips is-pad\">" +
          wChip("old-import", "", "Look at what it holds") + wChip("old-dismiss", "", "Leave it alone") + "</div>") +
        "</section>";
      return out;
    }
    out += '<div class="w-two">';
    out += '<section class="w-card"><header class="w-chead"><h2>Needs you</h2>' +
      '<span class="w-csub">late, today, and this week’s focus</span></header>' +
      (needRows.length ? needRows.map(wActRow).join("")
        : '<p class="w-cempty">Nothing is late, nothing is due today, and no focus is set.</p>') +
      (waitRows.length ? '<p class="w-clabel">Waiting on others</p>' + waitRows.map(function (it) {
        return '<button class="w-wrow' + wSelBg(it.id) + '" data-act="wb-open" data-id="' + esc(it.id) +
          '"><span class="w-grow">' + esc(it.title) + '</span><span class="w-wst">' + esc(wbStand(it).w) +
          "</span></button>";
      }).join("") : "") + "</section>";
    out += '<section class="w-card"><header class="w-chead"><h2>Inbox</h2><span class="w-mono w-cnum">' +
      inbox.length + "</span></header>" +
      (inbox.length ? "" : '<p class="w-cempty">Empty. Anything you type in the line above without a # lands here.</p>') +
      inbox.map(function (it) {
        return '<div class="w-irow' + wSelBg(it.id) + '"><button class="w-ihead" data-act="wb-open" data-id="' +
          esc(it.id) + '">' + wDot(it.type) + '<span class="w-grow w-rt">' + esc(it.title) + "</span>" +
          wTw(it.type) + '</button><div class="w-chips">' + wFileChips(it) + "</div></div>";
      }).join("") +
      (APP.tabs.some(function (t) { return t.id === "review"; })
        ? '<button class="w-cfoot" data-act="wb-go" data-id="review">Sort the rest in the weekly review →</button>' : "") +
      "</section></div>";

    var cards = wbLiveBenches().filter(function (b) { return !b.draft; });
    if (cards.length) {
      out += '<div class="w-benchsec"><h2 class="w-h2">On your benches</h2><div class="w-bgrid">' + cards.map(function (b) {
        var mine = items.filter(function (x) { return x.bench === b.id; });
        var next = mine.filter(function (x) { return x.type === "action" && !x.done && !x.waiting; })
          .sort(function (a, c) { return (a.due || "z").localeCompare(c.due || "z"); })[0];
        var mins = mine.filter(function (x) { return x.type === "hours" && x.date >= W; })
          .reduce(function (a, x) { return a + x.mins; }, 0);
        var recent = mine.filter(function (x) { return x.type !== "action" && x.type !== "hours" && x.date; })
          .sort(function (a, c) { return c.date.localeCompare(a.date); }).slice(0, 2);
        return '<button class="w-bcard" data-act="wb-bench" data-id="' + esc(b.id) + '">' +
          '<span class="w-bline"><span class="w-bsq" style="background:' + b.dot + '"></span><span class="w-brole">' +
          esc(b.role) + '</span></span><span class="w-btitle">' + esc(b.title) + "</span>" +
          '<span class="w-bnext">Next: ' + esc(next ? next.title : "nothing open") + "</span>" +
          '<span class="w-brecent">' + recent.map(function (x) {
            return '<span class="w-brec">' + wDot(x.type, "is-6") + '<span class="w-ell">' + esc(x.title) +
              "</span></span>";
          }).join("") + '</span><span class="w-mono w-bhours">' +
          (mins ? wbHm(mins) + " this week" : "no time this week") + "</span></button>";
      }).join("") + "</div></div>";
    }
    return out;
  }

  /* ---------------- a bench ---------------- */

  var WB_FIL = [["all", "Everything"], ["action", "Actions"], ["note", "Notes"], ["meeting", "Meetings"],
    ["file", "Files & links"], ["hours", "Hours"]];
  function wbInFil(x, f) {
    return f === "all" || x.type === f || (f === "file" && (x.type === "link" || x.type === "output"));
  }
  function wbBenchView() {
    var B = wbGet(wbBench);
    if (!B) { view = "today"; return wbTodayView(); }
    var items = WB.items, T = wbToday(), W = wbWeek();
    var mine = items.filter(function (x) { return x.bench === B.id && !x.inbox; });
    var bmins = mine.filter(function (x) { return x.type === "hours"; }).reduce(function (a, x) { return a + x.mins; }, 0);
    var skills = wbNbrs(B.id).filter(function (x) { return x.type === "skill"; });
    var hasMap = APP.tabs.some(function (t) { return t.id === "map"; });

    var out = wEyebrow(B.role) + '<h1 class="w-h1' + (B.draft ? " is-idea" : "") + '">' + esc(B.title) + "</h1>" +
      '<p class="w-stats">' + esc(wbWords(mine.filter(function (x) { return x.type === "action" && !x.done; }).length,
        "open action", "open actions") + " · " + wbHm(bmins) + " logged · " + mine.length + " things kept") +
      (hasMap ? ' · <button class="w-inlink" data-act="wb-tomap" data-id="' + esc(B.id) + '">See it on the map</button>' : "") +
      ' · <button class="w-inlink" data-act="wb-edit" data-id="' + esc(B.id) + '">Edit the bench</button></p>';
    out += '<div class="w-skills"><span class="w-slead">' + (skills.length ? "Building evidence for"
      : "Building evidence for no skill yet") + "</span>" + skills.map(function (s) {
        return '<button class="w-skill" data-act="wb-open" data-id="' + esc(s.id) + '">' + esc(s.title) + "</button>";
      }).join("") + "</div>";

    /* ITS LIFE SO FAR is the real hours, week by week, for the eight weeks
       ending this one. The prototype drew a stored history; this reads the
       stretches the book already holds, so the bars cannot disagree with the
       Hours filter underneath them. */
    var weeks = [];
    for (var i = 7; i >= 0; i--) weeks.push(addDays(W, -7 * i));
    var wmins = weeks.map(function (w, i) {
      var nx = i === 7 ? "9999" : weeks[i + 1];
      return mine.filter(function (x) { return x.type === "hours" && x.date >= w && x.date < nx; })
        .reduce(function (a, x) { return a + x.mins; }, 0);
    });
    var wmax = Math.max.apply(null, [60].concat(wmins));
    out += '<div class="w-panel"><div class="w-phead"><h2>Its life so far</h2><span class="w-csub">hours per week · ' +
      "dots are meetings, outputs and ideas</span></div><div class=\"w-weeks\">" + weeks.map(function (w, i) {
        var nx = i === 7 ? "9999" : weeks[i + 1];
        var dots = mine.filter(function (x) {
          return ["meeting", "output", "draft"].indexOf(x.type) >= 0 && x.date && x.date >= w && x.date < nx;
        });
        var cls = i === 7 ? "is-now" : wmins[i] ? "is-some" : "is-none";
        return '<div class="w-week"><div class="w-wdots">' + dots.map(function (x) {
          return '<button class="w-wdot" data-act="wb-open" data-id="' + esc(x.id) + '" title="' + esc(x.title) +
            '" aria-label="' + esc(x.title) + '" style="background:' + tCol(x.type) + '"></button>';
        }).join("") + '</div><div class="w-bar ' + cls + '" title="' + esc(wbHm(wmins[i]) + " in the week of " + wbFmt(w)) +
          '" style="height:' + Math.max(4, Math.round(wmins[i] / wmax * 64)) + 'px"></div></div>';
      }).join("") + '</div><div class="w-weeks is-labels">' + weeks.map(function (w) {
        return '<span class="w-wlab">' + esc(wbFmt(w).slice(4)) + "</span>";
      }).join("") + "</div></div>";

    out += wbPinsPanel(B);

    out += '<div class="w-tabs">' + WB_FIL.map(function (f) {
      var n = mine.filter(function (x) { return wbInFil(x, f[0]); }).length;
      return '<button class="w-tab' + (wbFilter === f[0] ? " is-on" : "") + '" data-act="wb-filter" data-id="' + f[0] +
        '">' + f[1] + ' <span class="w-mono w-tn">' + n + "</span></button>";
    }).join("") + '</div><p class="w-hint">Anything you type in the line above now lands on this bench.</p>';

    var groups = {}, keys = [];
    mine.filter(function (x) { return wbInFil(x, wbFilter); })
      .sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); })
      .forEach(function (x) {
        var k = x.date ? (x.date === T ? "Today" : wbFmt(x.date)) : "Kept here, undated";
        if (!groups[k]) { groups[k] = []; keys.push(k); }
        groups[k].push(x);
      });
    wbOrder = [];
    out += keys.map(function (k) {
      return '<p class="w-day">' + esc(k) + '</p><div class="w-stream">' + groups[k].map(function (x) {
        wbOrder.push(x.id);
        return '<button class="w-srec' + wSelBg(x.id) + '" data-act="wb-open" data-id="' + esc(x.id) + '">' +
          wDot(x.type, "is-top") + '<span class="w-grow"><span class="w-rt">' + esc(wbTitle(x)) +
          '</span><span class="w-snip">' + esc(wbSnippet(x)) + "</span></span>" + wTw(x.type, "is-top") + "</button>";
      }).join("") + "</div>";
    }).join("");
    if (!keys.length) {
      out += '<p class="w-empty">Nothing on this bench' + (wbFilter === "all" ? " yet" : " under that filter") +
        ". Type in the line above and it lands here.</p>";
    }
    return out;
  }

  /* ---------------- the record pane ---------------- */

  /* Which of the existing dialogs edits which kind. The pane never grows a
     second edit form: two forms for one record would drift. */
  var WB_EDIT = { role: "role", job: "job", education: "edu", training: "train", skill: "skill",

      if (((e.ctrlKey || e.metaKey) && (e.key === "k" || e.key === "K")) || (!typing && !inModal && e.key === "/")) {
        e.preventDefault();
        document.getElementById("line").focus();

      }
      if (typing && (e.ctrlKey || e.metaKey) && (e.key === "s" || e.key === "S")) {
        /* Inside a textarea Enter is a new line, so a body was the one
           field you had to reach for the mouse from. */
        var ok = overlay && overlay.querySelector("[data-mok]");
        if (ok) { e.preventDefault(); ok.click(); }

    var x = slot.querySelector(".w-pinx");

    return pos;
  }

  /* ---------------- the screen ---------------- */

  function wbMapView() {

      (L ? '<span class="g-local">Near <b>' + esc(clip(L.title, 24)) + '</b><button class="g-tb" data-act="gr-depth">' +
        (GR.depth === 1 ? "One step out" : "Two steps out") + '</button><button class="g-tb" data-act="gr-local" data-id="">Everything</button></span>' : "") +
      '<span class="g-sp"></span>' +

      '<button class="g-tb" data-act="gr-fit">Fit</button>' +

      '<button class="g-tb" data-act="gr-redo"' + (GR.redo.length ? "" : " disabled") + ' title="' +

      ["Delete", "cut the picked line"], ["+ − 0", "zoom, fit"], ["Esc", "let go"]].map(function (k) {

  /* The sheet is MOUNTED ONCE and moved into each fresh render's host.
     Rebuilding the <svg> destroyed the element holding the pointer
     capture on the first move of a drag in w4, and took the keyboard focus
     with it. Only its contents are redrawn. */
  function wbMountGraph() {
    var host = document.getElementById("grHost");
    if (!host) { grMenuClose(); return; }
    if (!grBox) grBuild();
    host.appendChild(grBox);
    grEnsureSpots();
    var q = document.getElementById("grQ");
    if (q) q.addEventListener("input", function () { GR.q = q.value; grPaint(); });
    document.documentElement.classList.toggle("g-maxed", GR.max);
    if (!GR.fitted) { grOpenView(); GR.fitted = true; }
    grPaint();
  }
  function grBuild() {
    grBox = document.createElement("div");
    grBox.className = "g-box";
    grBox.innerHTML = '<svg class="g-sheet" tabindex="0" role="application" aria-label="The map. Arrow keys walk the ' +
      'nodes, Enter shows what you can do to the picked one." xmlns="http://www.w3.org/2000/svg">' +
      '<g class="g-world"></g></svg>';
    grSvg = grBox.querySelector("svg");
    grWire();
  }

  function grStandWord(it) {
    if (it.type !== "action" || it.done) return "";
    var s = wbStand(it).w;
    return s === "Late" || s === "Today" ? s : "";
  }
  function grPaint() {
    if (!grSvg || !grSvg.isConnected) return;
    var edges = grEdges(), keep = grVisible(edges), pos = grPositions();
    var sel = wbSel && keep[wbSel] ? wbSel : "";
    var hot = {};
    if (sel) grNbrsOf(sel, edges).forEach(function (o) { hot[o] = 1; });
    var q = GR.q.trim(), out = [], cut = "";
    edges.forEach(function (e) {
      if (!keep[e.a] || !keep[e.b] || !pos[e.a] || !pos[e.b]) return;
      var a = pos[e.a], b = pos[e.b], picked = GR.edge === e.id;
      var cls = "g-e is-" + e.kind + (picked ? " is-sel" : "") + (sel && (e.a === sel || e.b === sel) ? " is-hot" : "") +
        (q && !(grMatches(WB.by[e.a], q) && grMatches(WB.by[e.b], q)) ? " is-dim" : "");
      var tip = WB.by[e.a].title + (e.kind === "in" ? " is on the bench " : e.kind === "wiki" ? " names " : " — " +
        (e.rel === "with" ? "linked to" : e.rel) + " — ") + WB.by[e.b].title;
      out.push('<g class="' + cls + '" data-edge="' + esc(e.id) + '"><line class="g-ehit" x1="' + a[0] + '" y1="' + a[1] +
        '" x2="' + b[0] + '" y2="' + b[1] + '"/><line class="g-eln" x1="' + a[0] + '" y1="' + a[1] + '" x2="' + b[0] +
        '" y2="' + b[1] + '"/><title>' + esc(tip) + "</title></g>");
      if (picked) {
        var mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
        cut = '<g class="g-cut" data-cut="' + esc(e.id) + '" transform="translate(' + mx + "," + my + ')"><circle r="11"/>' +
          '<path d="M-4,-4L4,4M4,-4L-4,4"/><title>' + (e.kind === "link" ? "Cut this link" :
            e.kind === "in" ? "Take it off the bench" : "Written in the note — edit the note to change it") + "</title></g>";
      }
    });
    if (GR.edge && !cut) GR.edge = "";
    var ids = Object.keys(keep).filter(function (id) { return pos[id]; });
    /* A picked node is drawn last, so its ring is never under a
       neighbour. */
    ids.sort(function (a, b) { return (a === sel) - (b === sel); });
    ids.forEach(function (id) {
      var it = WB.by[id], p = pos[id], w = grW(it), h = grHt(it), st = grStandWord(it);
      var cls = "g-n t-" + it.type + (id === sel ? " is-sel" : "") + (hot[id] ? " is-hot" : "") +
        (st === "Late" ? " is-late" : "") + (it.done ? " is-done" : "") + (q && !grMatches(it, q) ? " is-dim" : "") +
        (GR.local === id ? " is-local" : "");
      out.push('<g class="' + cls + '" data-node="' + esc(id) + '" transform="translate(' + p[0] + "," + p[1] + ')">' +
        '<rect class="g-rect" x="' + (-w / 2) + '" y="' + (-h / 2) + '" width="' + w + '" height="' + h + '" rx="' +
        (it.type === "bench" ? 12 : 8) + '"/>' +
        '<rect class="g-sq" x="' + (-w / 2 + 11) + '" y="-4.5" width="9" height="9" rx="2.5" style="fill:' + tCol(it.type) + '"/>' +
        '<text class="g-lab" x="' + (-w / 2 + 27) + '" y="' + (it.type === "bench" ? 5.5 : 4.5) + '">' + esc(grLabel(it)) + "</text>" +
        (st ? '<text class="g-st' + (st === "Late" ? " is-late" : "") + '" x="' + (-w / 2 + 4) + '" y="' + (h / 2 + 13) + '">' + st + "</text>" : "") +
        (id === sel ? '<circle class="g-hand" data-hand="' + esc(id) + '" cx="' + (w / 2) + '" cy="0" r="7"><title>Drag onto another node to link them</title></circle>' : "") +
        "<title>" + esc(tWord(it.type) + " · " + wbTitle(it)) + "</title></g>");
    });
    if (grDrag && grDrag.link && grDrag.to) {
      var s0 = pos[grDrag.link];
      if (s0) out.push('<line class="g-draw" x1="' + s0[0] + '" y1="' + s0[1] + '" x2="' + grDrag.to[0] + '" y2="' + grDrag.to[1] + '"/>');
    }
    out.push(cut);
    grSvg.querySelector(".g-world").innerHTML = out.join("");
    grSvg.querySelector(".g-world").setAttribute("transform", "translate(" + GR.ox + "," + GR.oy + ") scale(" + GR.k + ")");
    /* The survey grid pans and zooms with the work. */
    var g = 40 * GR.k;
    grBox.style.backgroundSize = g + "px " + g + "px";
    grBox.style.backgroundPosition = GR.ox + "px " + GR.oy + "px";
    grPaintStrip();
    var foot = document.getElementById("grFoot");
    if (foot) {
      /* A narrowed sheet says so, or a record switched off reads as a
         record gone missing. */
      var n = ids.length, all = WB.items.length;
      foot.textContent = n === all ? "Showing every record in the book."
        : "Showing " + n + " of " + all + " records. The rest are " +
          (GR.local ? "switched off above, or further from the picked one." : "switched off above.");
    }
  }

  /* ---------------- the strip, and the menu that is the strip laid down ------ */

  /* ONE LIST, TWO RENDERINGS. The strip lays it across, the menu lays it
     down, and a test reads both — two copies of one list drift the first
     time an act is added. */
  function grActs(id) {
    var it = wbGet(id);
    if (!it) return [];
    var acts = [];
    if (window.innerWidth < 880) acts.push({ act: "gr-pane", label: "Details" });
    if (it.type === "bench") acts.push({ act: "wb-bench", label: "Open the bench", loud: true });
    else if (it.type === "action") acts.push({ act: "wb-done", label: it.done ? "Reopen" : "Mark done", loud: true });
    acts.push({ act: "gr-link", label: "Link to…" });
    if (WB_EDIT[parseRef(id).kind]) acts.push({ act: "wb-edit", label: "Edit" });
    acts.push({ act: "gr-local", label: GR.local === id ? "Show everything" : "Only what is near it" });
    if (it.path) acts.push({ act: "wb-copy", label: /^https?:\/\//.test(it.path) ? "Copy the link" : "Copy the path" });
    if (WB_EDIT[parseRef(id).kind]) acts.push({ act: "wb-remove", label: "Remove", danger: true });
    return acts;
  }
  function grActBtn(a, id, cls) {
    return '<button class="' + cls + (a.loud ? " is-loud" : "") + (a.danger ? " is-danger" : "") + '" data-act="' + a.act +
      '" data-id="' + esc(a.act === "gr-local" && GR.local === id ? "" : id) + '">' + esc(a.label) + "</button>";
  }
  function grPaintStrip() {
    var s = document.getElementById("grStrip");
    if (!s) return;
    var it = wbSel && wbGet(wbSel);
    s.innerHTML = it ? '<span class="g-sname">' + wDot(it.type, "is-9") + '<b>' + esc(clip(wbTitle(it), 40)) + "</b></span>" +
      grActs(it.id).map(function (a) { return grActBtn(a, it.id, "g-sb"); }).join("")
      : '<span class="g-shint">Pick a node to see what you can do to it.</span>';
  }
  function grMenuClose() {
    if (grMenuEl && grMenuEl.parentNode) grMenuEl.parentNode.removeChild(grMenuEl);
    grMenuEl = null;
  }
  function grMenuOpen(html, x, y) {
    grMenuClose();
    grMenuEl = document.createElement("div");
    grMenuEl.className = "g-menu";
    grMenuEl.setAttribute("role", "menu");
    grMenuEl.innerHTML = html;
    document.body.appendChild(grMenuEl);
    var r = grMenuEl.getBoundingClientRect();
    grMenuEl.style.left = Math.max(8, Math.min(x, innerWidth - r.width - 8)) + "px";
    grMenuEl.style.top = Math.max(8, Math.min(y, innerHeight - r.height - 8)) + "px";
    grMenuEl.addEventListener("click", function () { setTimeout(grMenuClose, 0); });
    var first = grMenuEl.querySelector("button");
    if (first) first.focus({ preventScroll: true });
  }
  function grMenuNode(id, x, y) {
    grMenuOpen(grActs(id).map(function (a) { return grActBtn(a, id, "g-mrow"); }).join(""), x, y);
  }
  function grMenuSheet(at, x, y) {
    var w = Math.round(at.x) + "|" + Math.round(at.y);
    grMenuOpen('<button class="g-mrow" data-act="gr-new" data-id="note|' + w + '">New note here</button>' +
      '<button class="g-mrow" data-act="gr-new" data-id="bench|' + w + '">New bench here</button>', x, y);
  }

  /* ---------------- driving it ---------------- */

  function grAt(ev) {
    var r = grSvg.getBoundingClientRect();
    return { x: (ev.clientX - r.left - GR.ox) / GR.k, y: (ev.clientY - r.top - GR.oy) / GR.k };
  }
  function grZoomAt(k, px, py) {
    k = Math.max(0.15, Math.min(2.5, k));
    GR.ox = px - (px - GR.ox) * k / GR.k;
    GR.oy = py - (py - GR.oy) * k / GR.k;
    GR.k = k;
  }
  function grPick(id) {
    GR.edge = ""; GR.pane = false;
    wbSel = id || null; wbLinking = false; wbLinkQ = "";
    wbPaintPane();
    grPaint();
  }
  function grMoveSpot(id, x, y) {
    var s = grSpot(id);
    if (s) { s.x = Math.round(x); s.y = Math.round(y); }
  }

  function grWire() {
    var el = grSvg;
    el.addEventListener("pointerdown", function (ev) {
      if (ev.button === 2) return;
      grMenuClose();
      el.focus({ preventScroll: true });
      if (ev.pointerType === "touch") {
        grPinch = grPinch || {};
        grPinch[ev.pointerId] = [ev.clientX, ev.clientY];
        if (Object.keys(grPinch).length === 2) {
          /* A second finger turns the press into a pinch, and whatever the
             first finger was dragging stays where it was. */
          if (grDrag && grDrag.id && grDrag.moved) grMoveSpot(grDrag.id, grDrag.cx, grDrag.cy);
          grDrag = null;
          if (grPress) { clearTimeout(grPress); grPress = null; }
          return;
        }
      }
      var cutEl = ev.target.closest && ev.target.closest("[data-cut]");
      if (cutEl) { ev.preventDefault(); grCut(cutEl.getAttribute("data-cut")); return; }
      var hand = ev.target.closest && ev.target.closest("[data-hand]");
      var node = ev.target.closest && ev.target.closest("[data-node]");
      var edge = !node && ev.target.closest && ev.target.closest("[data-edge]");
      var id = node ? node.getAttribute("data-node") : "", s = id ? grSpot(id) : null;
      grDrag = { id: hand ? "" : id, link: hand ? hand.getAttribute("data-hand") : "", edge: edge ? edge.getAttribute("data-edge") : "",
        sx: ev.clientX, sy: ev.clientY, moved: false, cx: s ? num(s.x) : 0, cy: s ? num(s.y) : 0,
        ox: GR.ox, oy: GR.oy, at: grAt(ev) };
      el.setPointerCapture(ev.pointerId);
      /* A long press is a right-click on a phone. The node comes from THE
         PRESS: `ev.target` under capture is the <svg>, and a layout that
         moves between the press and the menu makes any later reading of
         the coordinates a reading of the last frame. */
      var cx = ev.clientX, cy = ev.clientY, at = grDrag.at;
      grPress = setTimeout(function () {
        grPress = null;
        if (!grDrag || grDrag.moved) return;
        var d = grDrag; grDrag = null;
        if (d.id) { grPick(d.id); requestAnimationFrame(function () { grMenuNode(d.id, cx, cy); }); }
        else if (!d.link && !d.edge) grMenuSheet(at, cx, cy);
      }, 520);
    });
    el.addEventListener("pointermove", function (ev) {
      if (grPinch && grPinch[ev.pointerId] && Object.keys(grPinch).length === 2) {
        var ids = Object.keys(grPinch), a = grPinch[ids[0]], b = grPinch[ids[1]];
        var d0 = Math.hypot(a[0] - b[0], a[1] - b[1]);
        grPinch[ev.pointerId] = [ev.clientX, ev.clientY];
        a = grPinch[ids[0]]; b = grPinch[ids[1]];
        var d1 = Math.hypot(a[0] - b[0], a[1] - b[1]), r = el.getBoundingClientRect();
        if (d0 > 0) grZoomAt(GR.k * d1 / d0, (a[0] + b[0]) / 2 - r.left, (a[1] + b[1]) / 2 - r.top);
        grPaint();
        return;
      }
      if (!grDrag) return;
      var dx = ev.clientX - grDrag.sx, dy = ev.clientY - grDrag.sy;
      if (!grDrag.moved && Math.abs(dx) + Math.abs(dy) < 4) return;
      grDrag.moved = true;
      if (grPress) { clearTimeout(grPress); grPress = null; }
      if (grDrag.link) {
        var p = grAt(ev);
        grDrag.to = [p.x, p.y];
      } else if (grDrag.id) {
        grMoveSpot(grDrag.id, grDrag.cx + dx / GR.k, grDrag.cy + dy / GR.k);
      } else {
        GR.ox = grDrag.ox + dx; GR.oy = grDrag.oy + dy;
      }
      grPaint();
    });
    function letGo(ev) {
      if (grPinch) { delete grPinch[ev.pointerId]; if (!Object.keys(grPinch).length) grPinch = null; }
      if (grPress) { clearTimeout(grPress); grPress = null; }
      if (!grDrag) return;
      var d = grDrag; grDrag = null;
      if (d.link) {
        grPaint();
        if (!d.moved) { grPick(d.link); return; }
        /* Where the finger was let go is a question about the drawing as
           it stands NOW, so it is asked of the document, not the capture
           target. */
        var under = document.elementFromPoint(ev.clientX, ev.clientY);
        var tn = under && under.closest && under.closest("[data-node]"), to = tn && tn.getAttribute("data-node");
        if (!to || to === d.link) { toast("Let go on another node to link them."); return; }
        if (wbLinked(d.link, to)) { toast("Those two are already linked."); return; }
        wbToggleLink(d.link, to);
        return;
      }
      if (d.id && d.moved) {
        var s = grSpot(d.id);
        if (s) {
          var id = d.id, wasX = d.cx, wasY = d.cy, nowX = num(s.x), nowY = num(s.y), it = wbGet(id);
          grPush("moving " + (it ? clip(it.title, 30) : "a node"),
            function () { grMoveSpot(id, wasX, wasY); }, function () { grMoveSpot(id, nowX, nowY); });
          commit();
        }
        /* Moving a node picks it, so the strip names what you just moved. */
        grPick(d.id);
        grBarPaint();
      } else if (d.id) {
        grPick(d.id);
      } else if (d.edge && !d.moved) {
        GR.edge = d.edge; grPaint();
      } else if (!d.moved) {
        /* Letting go on empty sheet has to mean letting go. */
        GR.edge = "";
        if (wbSel) grPick(null); else grPaint();
      }
    }
    el.addEventListener("pointerup", letGo);
    el.addEventListener("pointercancel", letGo);
    el.addEventListener("contextmenu", function (ev) {
      ev.preventDefault();
      if (grPress) { clearTimeout(grPress); grPress = null; }
      var n = ev.target.closest && ev.target.closest("[data-node]");
      var id = (grDrag && grDrag.id) || (n && n.getAttribute("data-node")) || "";
      var at = (grDrag && grDrag.at) || grAt(ev);
      grDrag = null;
      if (id) { grPick(id); var x = ev.clientX, y = ev.clientY; requestAnimationFrame(function () { grMenuNode(id, x, y); }); }
      else grMenuSheet(at, ev.clientX, ev.clientY);
    });
    el.addEventListener("wheel", function (ev) {
      ev.preventDefault();
      var r = el.getBoundingClientRect(), f = Math.exp(-ev.deltaY * (ev.ctrlKey ? 0.01 : 0.0015));
      grZoomAt(GR.k * f, ev.clientX - r.left, ev.clientY - r.top);
      grPaint();
    }, { passive: false });
    el.addEventListener("keydown", grKey);
  }

  /* Undo and Redo on the toolbar are for WHERE THINGS SIT — a move and a
     Tidy. Every entry closes over ids and values, never a record, so an
     entry about a node that has since gone does nothing. What changes the
     book (a link, a cut, a new node) is undone on its toast, the way every
     other change in the Workbench is: two undos for one act would be the
     fault two copies of one list is. */
  function grPush(label, undo, redo) {
    GR.undo.push({ label: label, undo: undo, redo: redo });
    if (GR.undo.length > 60) GR.undo.shift();
    GR.redo = [];
  }
  function grBarPaint() {
    var u = document.querySelector('[data-act="gr-undo"]'), r = document.querySelector('[data-act="gr-redo"]');
    if (u) { u.disabled = !GR.undo.length; u.title = GR.undo.length ? "Undo " + GR.undo[GR.undo.length - 1].label : "Nothing to undo"; }
    if (r) { r.disabled = !GR.redo.length; r.title = GR.redo.length ? "Redo " + GR.redo[GR.redo.length - 1].label : "Nothing to redo"; }
  }
  function grUndo(redo) {
    var from = redo ? GR.redo : GR.undo, to = redo ? GR.undo : GR.redo, e = from.pop();
    if (!e) { toast(redo ? "Nothing to redo." : "Nothing to undo on the map."); return; }
    (redo ? e.redo : e.undo)();
    to.push(e);
    commit(); grPaint(); grBarPaint();
    toast((redo ? "Redone: " : "Undone: ") + e.label);
  }

  function grCut(edgeId) {
    var kind = edgeId.slice(0, 2), rest = edgeId.slice(2);
    GR.edge = "";
    if (kind === "l:") {
      var snap = wbSnap();
      state.links = state.links.filter(function (l) { return l.id !== rest; });
      wbDone("Link cut", snap);
    } else if (kind === "m:") {
      var it = wbGet(rest), b = it && wbGet(it.bench);
      if (!it || !b) return;
      confirmAction({ title: "Take it off " + b.title + "?",
        message: "This line is not a link: “" + it.title + "” is kept on that bench. Taking it off leaves it in the book, " +
          "on no bench, and every link it has stays.", confirmLabel: "Take it off" }, function () {
        var s2 = wbSnap(), rec = recOf(rest);
        if (rec) rec.projectId = "";
        wbDone("Taken off " + b.title, s2);
      });
    } else {
      toast("That line is written in the note. Edit the note to change it.");
      grPaint();
    }
  }

  /* THE FIRST VIEW IS READABLE, AND FIT IS THE OVERVIEW. Fitting a
     sixty-node book into a laptop's box sets 13px labels at about seven
     pixels — a picture of the shape and not a thing anybody can read. So
     opening the map fits, then holds the zoom at a floor where a label
     reads, centred on what matters: the picked node, else a late one,
     else the middle of the work. The Fit button is the true fit. */
  function grOpenView() {
    grFit();
    var floor = window.innerWidth < 620 ? 0.62 : 0.78;
    if (GR.k >= floor || !grSvg) return;
    var pos = grPositions(), keep = grVisible(grEdges()), ids = Object.keys(keep).filter(function (id) { return pos[id]; });
    var at = wbSel && pos[wbSel] && keep[wbSel] ? wbSel : ids.filter(function (id) { return grStandWord(WB.by[id]) === "Late"; })[0];
    var c;
    if (at) c = pos[at];
    else {
      c = [0, 0];
      ids.forEach(function (id) { c[0] += pos[id][0] / ids.length; c[1] += pos[id][1] / ids.length; });
    }
    GR.k = floor;
    GR.ox = grSvg.clientWidth / 2 - c[0] * floor;
    GR.oy = grSvg.clientHeight / 2 - c[1] * floor;
  }
  function grFit() {
    if (!grSvg) return;
    var keep = grVisible(grEdges()), pos = grPositions(), ids = Object.keys(keep).filter(function (id) { return pos[id]; });
    var w = grSvg.clientWidth || 800, h = grSvg.clientHeight || 520;
    if (!ids.length) { GR.k = 1; GR.ox = w / 2; GR.oy = h / 2; return; }
    var x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    ids.forEach(function (id) {
      var p = pos[id], it = WB.by[id], hw = grW(it) / 2, hh = grHt(it) / 2;
      x0 = Math.min(x0, p[0] - hw); x1 = Math.max(x1, p[0] + hw);
      y0 = Math.min(y0, p[1] - hh); y1 = Math.max(y1, p[1] + hh + 16);
    });
    var k = Math.min((w - 40) / Math.max(1, x1 - x0), (h - 40) / Math.max(1, y1 - y0), 1.3);
    GR.k = Math.max(0.15, k);
    GR.ox = w / 2 - (x0 + x1) / 2 * GR.k;
    GR.oy = h / 2 - (y0 + y1) / 2 * GR.k;
  }
  /* Brings a node into view WITHOUT changing the zoom — a re-fit throws
     away wherever the reader had got to. */
  function grPanTo(id) {
    var s = grSpot(id);
    if (!s || !grSvg) return;
    var w = grSvg.clientWidth, h = grSvg.clientHeight, x = num(s.x) * GR.k + GR.ox, y = num(s.y) * GR.k + GR.oy, pad = 80;
    if (x < pad) GR.ox += pad - x; if (x > w - pad) GR.ox -= x - (w - pad);
    if (y < pad) GR.oy += pad - y; if (y > h - pad) GR.oy -= y - (h - pad);
  }
  function grTidy() {
    var before = {};
    state.spots.forEach(function (s) { before[s.id] = [num(s.x), num(s.y)]; });
    var ids = WB.items.map(function (it) { return it.id; }), pos = {};
    ids.forEach(function (id, i) {
      pos[id] = [Math.cos(i * 2.39996) * 40 * Math.sqrt(i + 1), Math.sin(i * 2.39996) * 30 * Math.sqrt(i + 1)];
    });
    grLayout(ids, pos, {}, grEdges());
    var after = {};
    ids.forEach(function (id) { after[id] = [Math.round(pos[id][0]), Math.round(pos[id][1])]; });
    function put(m) { Object.keys(m).forEach(function (id) { grMoveSpot(id, m[id][0], m[id][1]); }); }
    put(after);
    grPush("the tidy", function () { put(before); }, function () { put(after); });
    commit(); grFit(); grPaint(); grBarPaint();
    toast("Laid out again. Undo move puts every node back.");
  }

  /* Reading order: rows first, then left to right. It always works and can
     never dead-end, and it wraps rather than sticking. */
  function grOrder() {
    var keep = grVisible(grEdges()), pos = grPositions();
    return Object.keys(keep).filter(function (id) { return pos[id]; }).sort(function (a, b) {
      var ra = Math.round(pos[a][1] / 60), rb = Math.round(pos[b][1] / 60);
      return ra - rb || pos[a][0] - pos[b][0];
    });
  }
  var grNextSeen = 0;
  function grKey(ev) {
    var k = ev.key;
    if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
    if (k === "Escape") { ev.preventDefault(); ev.stopPropagation(); grEscape(); return; }
    if (k === "+" || k === "=") { ev.preventDefault(); grZoomAt(GR.k * 1.2, grSvg.clientWidth / 2, grSvg.clientHeight / 2); grPaint(); return; }
    if (k === "-") { ev.preventDefault(); grZoomAt(GR.k / 1.2, grSvg.clientWidth / 2, grSvg.clientHeight / 2); grPaint(); return; }
    if (k === "0") { ev.preventDefault(); grFit(); grPaint(); return; }
    if (k === "Delete" || k === "Backspace") {
      ev.preventDefault(); ev.stopPropagation();
      if (GR.edge) grCut(GR.edge);
      else if (wbSel && WB_EDIT[parseRef(wbSel).kind]) ACTIONS["wb-remove"](wbSel);
      return;
    }
    var order = grOrder();
    if (!order.length) return;
    if (k === "Enter") {
      ev.preventDefault(); ev.stopPropagation();
      if (!wbSel || order.indexOf(wbSel) < 0) { grPanTo(order[0]); grPick(order[0]); return; }
      var b = document.querySelector("#grStrip button");
      if (b) b.focus();
      return;
    }
    if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].indexOf(k) < 0) return;
    ev.preventDefault(); ev.stopPropagation();
    var cur = wbSel && order.indexOf(wbSel) >= 0 ? wbSel : "";
    var next;
    if (!cur) next = order[0];
    else if (k === "ArrowLeft" || k === "ArrowRight") {
      var i = order.indexOf(cur);
      next = order[(i + (k === "ArrowRight" ? 1 : -1) + order.length) % order.length];
    } else {
      /* Up and down follow the LINES, which is what the map is saying,
         cycling when a node has several. */
      var keep = grVisible(grEdges()), nb = grNbrsOf(cur, grEdges()).filter(function (o) { return keep[o]; });
      if (!nb.length) { toast("Nothing is linked to this one."); return; }
      nb.sort(function (a, b) { return order.indexOf(a) - order.indexOf(b); });
      if (k === "ArrowUp") nb.reverse();
      next = nb[grNextSeen++ % nb.length];
    }
    grPanTo(next);
    grPick(next);
  }
  /* AN ESCAPE STACK IS WRITTEN ONCE: the menu, then a picked line, then a
     picked node, then full screen. */
  function grEscape() {
    if (grMenuEl) { grMenuClose(); if (grSvg) grSvg.focus({ preventScroll: true }); return; }
    if (GR.edge) { GR.edge = ""; grPaint(); return; }
    if (wbSel) { grPick(null); return; }
    if (GR.max) { GR.max = false; render(); }
  }
  function grWireDoc() {
    document.addEventListener("pointerdown", function (ev) {
      if (grMenuEl && !grMenuEl.contains(ev.target)) grMenuClose();
    });
    document.addEventListener("scroll", function () { grMenuClose(); }, true);
    document.addEventListener("keydown", function (ev) {
      if (!grMenuEl) return;
      if (ev.key === "Escape") { ev.preventDefault(); ev.stopPropagation(); grEscape(); return; }
      if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
        var bs = Array.prototype.slice.call(grMenuEl.querySelectorAll("button")), i = bs.indexOf(document.activeElement);
        ev.preventDefault();
        bs[(i + (ev.key === "ArrowDown" ? 1 : -1) + bs.length) % bs.length].focus();
      }
    }, true);
    window.addEventListener("resize", function () { if (view === "map" && grSvg) grPaint(); });
  }

  /* A new node lands WHERE YOU PRESSED, and the dialog asks only its name. */
  function grNew(kind, x, y) {
    openModal({
      title: kind === "bench" ? "A new bench here" : "A new note here",
      fields: [{ key: "name", label: kind === "bench" ? "What the work is called" : "Title", value: "", span: true }],
      confirmLabel: "Add it",
      validate: function (v) { return v.name.trim() ? "" : "It needs a name."; },
      onConfirm: function (v) {
        var snap = wbSnap(), made, name = v.name.trim();
        if (kind === "bench") {
          var key = (name.toLowerCase().match(/[a-z0-9؀-ۿ]+/) || [""])[0];
          state.projects.push(made = { id: uid(), name: name, key: key, role: "New bench", status: "active" });
          made = ref("project", made.id);
        } else {
          state.notes.push(made = { id: uid(), kind: "note", name: name, on: wbToday(), projectId: "", body: "" });
          made = ref("note", made.id);
        }
        state.spots.push({ id: made, x: x, y: y });
        wbSel = made;
        wbDone(kind === "bench" ? "Bench added" : "Note added", snap);
      }
    });
  }

  /* ============================================================
     A FILE DROPPED ANYWHERE IS KEPT, AND THE LIBRARY HAS FOLDERS.

     Asked for "throwing a pdf or photo on the whole page" to put it in the
     Library, and for folders to organise what is there. Two rules from
     the pictures carry straight over:

       · THE BYTES ARE NOT THE BOOK. A PDF is bigger than the whole record,
         so it lives in its own IndexedDB (`mashghal2-files`) and never
         travels through the sealed gist — the same call the pins and the
         original app's photographs made. The RECORD syncs: a `file` entry
         in the library with `blobId`, `fname`, `mime` and `size`, so every
         device knows the file exists and the one without the bytes says so
         in as many words.
       · READING NEVER CREATES. Every read opens with the upgrade aborted,
         so looking for a file on a device that has none cannot leave an
         empty database behind.

     A FOLDER IS CONTAINMENT, STATED FORWARD AND WALKED BACK. `folders` is
     `{id, name, folderId}` and a library entry or a note carries the same
     `folderId` — one field for "which folder is this in", whatever it is. What a
     folder holds is walked, never stored, so it cannot disagree with what
     says it is in it — the discipline `atId` and a card's `in` already had.
     One tree holds both, because its owner chose a vault over two lists.
     ============================================================ */

  var FILE_DB = "mashghal2-files", FILE_STORE = "files";
  /* The one way into a small IndexedDB. The pins have used their own copy
     of this since w9; both now go through here. */
  function idbTx(name, store, mode, fn) {
    return new Promise(function (res, rej) {
      if (!window.indexedDB) { rej(new Error("no IndexedDB")); return; }
      var r = indexedDB.open(name, 1);
      r.onupgradeneeded = function (e) {
        if (mode === "readonly" && e.oldVersion === 0) { r.transaction.abort(); return; }
        r.result.createObjectStore(store, { keyPath: "id" });
      };
      r.onerror = function () { rej(r.error || new Error("could not open")); };
      r.onsuccess = function () {
        var db = r.result, tx = db.transaction(store, mode), out = fn(tx.objectStore(store));
        tx.oncomplete = function () { db.close(); res(out && out.result !== undefined ? out.result : null); };
        tx.onerror = function () { db.close(); rej(tx.error); };
      };
    });
  }
  function fileTx(mode, fn) { return idbTx(FILE_DB, FILE_STORE, mode, fn); }
  function fileGet(id) { return fileTx("readonly", function (st) { return st.get(id); }).catch(function () { return null; }); }

  var FILE_OK = /^(application\/pdf|image\/)/;
  function fileOk(f) {
    return FILE_OK.test(f.type || "") || /\.(pdf|png|jpe?g|gif|webp|heic|tiff?|bmp|svg)$/i.test(f.name || "");
  }
  function fileSize(n) {
    n = num(n);
    if (n < 1024) return n + " bytes";
    if (n < 1048576) return Math.round(n / 1024) + " KB";
    return (n / 1048576).toFixed(n < 10485760 ? 1 : 0) + " MB";
  }
  function fileKind(e) {
    var m = e.mime || "";
    return m === "application/pdf" || /\.pdf$/i.test(e.fname || "") ? "PDF" : /^image\//.test(m) ? "Picture" : "File";
  }

  /* ---------------- where a drop lands ---------------- */

  /* WHERE YOU ARE DECIDES WHERE IT GOES, and the scrim says which before
     you let go: the open folder in the Library, the bench on a bench's
     page, and the inbox anywhere else — the capture line's rule. */
  function dropCtx() {
    if (view === "shelves") {
      var f = libBy() === "folder" && wbLibFolder ? byId(state.folders, wbLibFolder) : null;
      return { folderId: f ? f.id : "", words: f ? "into the folder " + f.name : "into the Library",
        kept: f ? "in the folder " + f.name : "in the Library" };
    }
    if (view === "bench" && wbBench && wbGet(wbBench)) {
      return { projectId: parseRef(wbBench).id, words: "onto " + wbGet(wbBench).title, kept: "on " + wbGet(wbBench).title };
    }
    if (view === "notes" && typeof wbNoteFolder !== "undefined" && wbNoteFolder && byId(state.folders, wbNoteFolder)) {
      var nf = byId(state.folders, wbNoteFolder);
      return { folderId: nf.id, words: "into the folder " + nf.name, kept: "in the folder " + nf.name };
    }
    return { inbox: true, words: "into the inbox, to sort later", kept: "in the inbox" };
  }

  function hasFiles(e) {
    var t = e.dataTransfer && e.dataTransfer.types;
    return !!t && Array.prototype.indexOf.call(t, "Files") >= 0;
  }
  var dropDepth = 0;
  function dropScrim(on) {
    var el = document.getElementById("dropAll");
    if (!on) { if (el) el.hidden = true; return; }
    if (!el) {
      el = document.createElement("div");
      el.id = "dropAll"; el.className = "w-dropall";
      el.setAttribute("aria-hidden", "true");
      document.body.appendChild(el);
    }
    el.innerHTML = '<div class="w-dropcard"><b>Drop to keep in the Library</b><span>A PDF or a picture goes ' +
      esc(dropCtx().words) + ". The file stays on this device; the record goes wherever the book goes.</span></div>";
    el.hidden = false;
  }
  function wbWireDrop() {
    /* preventDefault on EVERY dragover, or the browser navigates to the
       file, which looks exactly like the app crashing. */
    document.addEventListener("dragenter", function (e) {
      if (!hasFiles(e)) return;
      e.preventDefault(); dropDepth++; dropScrim(true);
    });
    document.addEventListener("dragover", function (e) {
      if (!hasFiles(e)) return;
      e.preventDefault();
      if (e.dataTransfer) e.dataTransfer.dropEffect = "copy";
    });
    document.addEventListener("dragleave", function (e) {
      if (!hasFiles(e)) return;
      dropDepth = Math.max(0, dropDepth - 1);
      if (!dropDepth) dropScrim(false);
    });
    document.addEventListener("drop", function (e) {
      if (!hasFiles(e)) return;
      e.preventDefault();
      dropDepth = 0; dropScrim(false);
      if (overlay && overlay.innerHTML) return;
      keepFiles(Array.prototype.slice.call(e.dataTransfer.files || []), dropCtx());
    });
  }

  /* Several files are ONE act with one toast and one undo. A file that is
     not a PDF or a picture is refused by name, and the rest still come in. */
  function keepFiles(files, ctx) {
    var good = files.filter(fileOk), bad = files.filter(function (f) { return !fileOk(f); });
    if (!good.length) {
      toast(bad.length ? (bad.length === 1 ? bad[0].name + " is not a PDF or a picture." :
        "None of those is a PDF or a picture.") : "Nothing was dropped.");
      return Promise.resolve([]);
    }
    var snap = wbSnap(), on = wbToday(), made = [];
    return Promise.all(good.map(function (f) {
      var id = uid();
      return fileTx("readwrite", function (st) {
        st.put({ id: id, blob: f, name: f.name, type: f.type || "", size: f.size || 0, at: new Date().toISOString() });
      }).then(function () {
        var rec = { id: uid(), kind: "file", name: String(f.name || "File").replace(/\.[A-Za-z0-9]{1,5}$/, ""),
          fname: f.name || "", mime: f.type || "", size: f.size || 0, blobId: id, on: on,
          projectId: ctx.projectId || "", folderId: ctx.folderId || "" };
        if (ctx.inbox) rec.inbox = true;
        state.lib.push(rec);
        made.push({ rec: rec, blobId: id });
      }).catch(function () { bad.push(f); });
    })).then(function () {
      if (!made.length) { toast("This browser would not keep the file."); return made; }
      commit(); render();
      var msg = (made.length === 1 ? "Kept “" + made[0].rec.name + "”" : "Kept " + numWord(made.length) + " files") +
        " " + ctx.kept +
        (bad.length ? ". " + (bad.length === 1 ? bad[0].name + " is not a PDF or a picture." :
          cap(numWord(bad.length)) + " were not PDFs or pictures.") : "");
      toast(msg, function () {
        wbRestore(snap);
        /* The undo takes the bytes back as well, or they would sit in this
           device's storage belonging to nothing. */
        fileTx("readwrite", function (st) { made.forEach(function (m) { st.delete(m.blobId); }); }).catch(function () {});
      });
      return made;
    });
  }

  /* A file whose record has gone is swept at boot, not at the moment of
     deleting: the undo on a Remove toast has to be able to bring the
     record back WITH its bytes. */
  function sweepFiles() {
    if (bookTrouble.unread) return;
    var live = {};
    state.lib.forEach(function (e) { if (e.blobId) live[e.blobId] = 1; });
    fileTx("readonly", function (st) { return st.getAllKeys(); }).then(function (keys) {
      var dead = (keys || []).filter(function (k) { return !live[k]; });
      if (dead.length) fileTx("readwrite", function (st) { dead.forEach(function (k) { st.delete(k); }); }).catch(function () {});
    }).catch(function () {});
  }

  /* ---------------- showing one ---------------- */

  var fileUrls = [];
  function fileUrl(blob) {
    var u = URL.createObjectURL(blob);
    fileUrls.push(u);
    return u;
  }
  function releaseUrls() {
    fileUrls.forEach(function (u) { try { URL.revokeObjectURL(u); } catch (e) {} });
    fileUrls = [];
  }
  function filePaneHtml(it) {
    var e = it.rec;
    if (!e || !e.blobId) return "";
    return '<div class="w-fprev" data-fprev="' + esc(e.blobId) + '" data-mime="' + esc(e.mime || "") + '">' +
      '<p class="w-phelp">' + esc(fileKind(e) + (e.size ? " · " + fileSize(e.size) : "") + (e.fname ? " · " + e.fname : "")) + "</p>" +
      '<div class="w-fbox"><span class="w-phelp">Opening…</span></div>' +
      '<div class="w-fbtns"><button class="w-pbtn" data-act="wb-fopen" data-id="' + esc(it.id) + '">Open</button>' +
      '<button class="w-pbtn" data-act="wb-fsave" data-id="' + esc(it.id) + '">Save a copy</button></div></div>';
  }
  /* Called after every paint that may have drawn a preview or a thumbnail:
     the bytes come out of IndexedDB and in as object URLs, and the ones the
     last paint made are let go first. */
  function mountFiles() {
    releaseUrls();
    Array.prototype.forEach.call(document.querySelectorAll("[data-fprev]"), function (el) {
      var id = el.getAttribute("data-fprev"), box = el.querySelector(".w-fbox");
      fileGet(id).then(function (row) {
        if (!el.isConnected) return;
        if (!row || !row.blob) {
          box.innerHTML = '<p class="w-phelp">The file itself is on another device. Its record came here with the ' +
            "book; the bytes stay where they were dropped" + (typeof driveHolding === "function" && driveHolding(id)
              ? ", and a connected Drive folder holds a copy: " + esc(driveHolding(id)) + "." : ".") + "</p>";
          el.querySelector(".w-fbtns").hidden = true;
          return;
        }
        var u = fileUrl(row.blob), pdf = /pdf/.test(row.type || "") || /\.pdf$/i.test(row.name || "");
        box.innerHTML = pdf ? '<iframe class="w-fpdf" title="' + esc(row.name || "PDF") + '" src="' + u + '"></iframe>'
          : '<img class="w-fimg" alt="' + esc(row.name || "") + '" src="' + u + '" />';
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-fthumb]"), function (el) {
      fileGet(el.getAttribute("data-fthumb")).then(function (row) {
        if (!el.isConnected || !row || !row.blob || !/^image\//.test(row.type || "")) return;
        el.innerHTML = '<img alt="" src="' + fileUrl(row.blob) + '" />';
        el.classList.add("is-img");
      });
    });
  }
  function fileAct(idv, save) {
    var it = wbGet(idv), e = it && it.rec;
    if (!e || !e.blobId) return;
    fileGet(e.blobId).then(function (row) {
      if (!row || !row.blob) { toast("The file itself is on another device."); return; }
      if (save) { download(row.name || e.fname || e.name, row.blob, row.type || "application/octet-stream"); return; }
      var u = URL.createObjectURL(row.blob), w = window.open(u, "_blank", "noopener");
      if (!w) toast("The browser blocked the new tab. Save a copy instead.");
      setTimeout(function () { URL.revokeObjectURL(u); }, 60000);
    });
  }

  /* ---------------- the folder tree ---------------- */

  var wbLibFolder = "";
  function libBy() { return state.settings.libBy === "folder" ? "folder" : "kind"; }
  function folderKids(pid) {
    return state.folders.filter(function (f) { return (f.folderId || "") === (pid || ""); })
      .sort(function (a, b) { return String(a.name).localeCompare(String(b.name)); });
  }
  function folderTrail(id) {
    var out = [], seen = {}, f = id && byId(state.folders, id);
    while (f && !seen[f.id]) { seen[f.id] = 1; out.unshift(f); f = f.folderId && byId(state.folders, f.folderId); }
    return out;
  }
  function folderUnder(id) {
    var out = {}, front = [id];
    while (front.length) {
      var next = [];
      front.forEach(function (p) {
        state.folders.forEach(function (f) { if (f.folderId === p && !out[f.id] && f.id !== id) { out[f.id] = 1; next.push(f.id); } });
      });
      front = next;
    }
    return out;
  }
  /* What lives in the tree: everything on a Library shelf, and every note
     that is not somebody's bench note — a note filed in a folder, or one
     written on its own. A meeting on a bench is the bench's, until you
     file it somewhere. */
  var TREE_NOTE = { note: 1, meeting: 1, draft: 1 };
  function treeItems() {
    return WB.items.filter(function (x) {
      if (x.inbox) return false;
      if (WB_LIB.indexOf(x.type) >= 0) return true;
      return TREE_NOTE[x.type] && (x.rec.folderId || !x.bench);
    });
  }
  function folderOf(x) {
    var f = x.rec && x.rec.folderId;
    return f && byId(state.folders, f) ? f : "";
  }
  /* A folder's count is what is in it AND under it, and the top level's is
     the whole tree — one walk, so the parts add up to the whole. */
  function folderCounts() {
    var n = { "": 0 }, items = treeItems();
    state.folders.forEach(function (f) { n[f.id] = 0; });
    items.forEach(function (x) {
      n[""]++;
      folderTrail(folderOf(x)).forEach(function (f) { n[f.id]++; });
    });
    return n;
  }
  function treeRows(pid, depth, counts) {
    return folderKids(pid).map(function (f) {
      var on = wbLibFolder === f.id;
      return '<button class="w-frow' + (on ? " is-on" : "") + '" data-act="wb-folder" data-id="' + esc(f.id) +
        '" data-dropfolder="' + esc(f.id) + '" style="padding-left:' + (10 + depth * 16) + 'px"' +
        (on ? ' aria-current="true"' : "") + '><span class="w-fico" aria-hidden="true">▸</span><span class="w-grow w-ell">' +
        esc(f.name) + '</span><span class="w-mono">' + counts[f.id] + "</span></button>" +
        treeRows(f.id, depth + 1, counts);

  function folderDialog(f, parentId) {

      fields: [{ key: "name", label: "Its name", value: f ? f.name : "", span: true }],
      confirmLabel: f ? "Rename it" : "Make it",
      validate: function (v) {
        var nm = v.name.trim();
        if (!nm) return "It needs a name.";
        var clash = state.folders.some(function (o) {
          return o !== f && (o.folderId || "") === (f ? f.folderId || "" : parentId || "") && o.name.toLowerCase() === nm.toLowerCase();
        });
        return clash ? "There is already a folder called “" + nm + "” there." : "";
      },
      onConfirm: function (v) {
        var snap = wbSnap();
        if (f) f.name = v.name.trim();

          state.folders.push(made);

  function folderPicker(title, current, exclude, onPick) {
    var opts = [{ value: "", label: "— the top of the Library" }];
    (function walk(pid, depth) {
      folderKids(pid).forEach(function (f) {
        if (exclude[f.id]) return;
        opts.push({ value: f.id, label: new Array(depth + 1).join(" ") + f.name });
        walk(f.id, depth + 1);
      });
    })("", 0);
    openModal({
      title: title,
      fields: [{ key: "to", label: "Into", type: "select", value: current || "", options: opts }],
      confirmLabel: "Move it",
      onConfirm: function (v) { onPick(v.to); }

  /* A folder cannot go inside itself or anything under it: the picker
     withholds those, and the write refuses them again, because a bad merge
     can hand this function a book the picker never saw. */
  function folderMove(id) {
    var f = byId(state.folders, id);
    if (!f) return;
    var ex = folderUnder(id); ex[id] = 1;
    folderPicker("Move “" + f.name + "”", f.folderId || "", ex, function (to) {
      if (to && (to === id || folderUnder(id)[to])) { toast("A folder cannot go inside itself."); return; }
      var snap = wbSnap();
      f.folderId = to || "";
      wbDone(to ? "Moved into " + byId(state.folders, to).name : "Moved to the top", snap);
    });
  }
  /* REMOVING A FOLDER KEEPS EVERYTHING IN IT. What was in it moves up to
     where the folder was, the name is kept in `forgotten` so anything that
     remembers it still reads, and the toast carries the undo — the rule a
     pocket's delete has always followed. */
  function folderDel(id) {
    var f = byId(state.folders, id);
    if (!f) return;
    var kids = folderKids(id).length, things = treeItems().filter(function (x) { return folderOf(x) === id; }).length;
    var up = f.folderId && byId(state.folders, f.folderId);
    confirmAction({
      title: "Remove the folder “" + f.name + "”?",
      message: (kids || things ? "Nothing in it is removed: " + listWords([
        things ? countWords(things, "thing", "things") : "", kids ? countWords(kids, "folder", "folders") : ""
      ].filter(Boolean)) + " move up to " + (up ? "“" + up.name + "”" : "the top of the Library") + "."
        : "It is empty.") + " The undo on the message puts it back.",
      confirmLabel: "Remove the folder"
    }, function () {
      var snap = wbSnap(), to = f.folderId || "";
      state.folders.concat(state.lib, state.notes).forEach(function (r) { if (r.folderId === id) r.folderId = to; });
      state.folders = state.folders.filter(function (o) { return o.id !== id; });
      state.forgotten[id] = f.name;
      if (wbLibFolder === id) wbLibFolder = to;
      wbDone("Folder removed. What was in it moved up.", snap);
    });
  }
  function fileInto(ref2, to) {
    var rec = recOf(ref2);
    if (!rec) return;
    if (to && !byId(state.folders, to)) { toast("That folder is gone."); return; }
    var snap = wbSnap();
    rec.folderId = to || "";

  /* Dragging a card onto a folder files it there. Internal drags carry
     their own type, so the page-wide file drop ignores them. */
  var DRAG_T = "text/x-mashghal-ref";
  function wireFolderDrags() {
    Array.prototype.forEach.call(document.querySelectorAll("[data-dragref]"), function (el) {
      el.setAttribute("draggable", "true");
      el.addEventListener("dragstart", function (e) {
        e.dataTransfer.setData(DRAG_T, el.getAttribute("data-dragref"));
        e.dataTransfer.effectAllowed = "move";
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-dropfolder]"), function (el) {
      el.addEventListener("dragover", function (e) {
        if (Array.prototype.indexOf.call(e.dataTransfer.types, DRAG_T) < 0) return;
        e.preventDefault(); el.classList.add("is-over");
      });
      el.addEventListener("dragleave", function () { el.classList.remove("is-over"); });
      el.addEventListener("drop", function (e) {
        var r = e.dataTransfer.getData(DRAG_T);
        if (!r) return;
        e.preventDefault(); e.stopPropagation(); el.classList.remove("is-over");
        fileInto(r, el.getAttribute("data-dropfolder"));
      });
    });
  }
