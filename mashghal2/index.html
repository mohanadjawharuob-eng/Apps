<script>
  /* Runs before the stylesheet, so the theme is decided before the first
     paint. It has its own copy of the key expression because the main script
     has not loaded yet — the same reason Coffer's pre-paint reader repeats
     its own. */
  (function () {
    try {
      var t = localStorage.getItem("mashghal2.theme");
      if (t === "light" || t === "dark") {
        document.documentElement.setAttribute("data-theme", t);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", t === "light" ? "#f7f4ee" : "#0b1220");
      }
    } catch (e) {}
  })();
</script>

  /* ================= Deep field =================

     The palette the owner picked from a dashboard mock-up: a deep navy ground
     with cards lifted off it, and colour used in two DIFFERENT channels that
     must never be confused.

       · IDENTITY (what kind of thing this is) lives in the small rounded ICON
         TILE and nowhere else — a tinted ground at low alpha with a muted
         glyph. Projects read blue, workflows violet, assets green, and so on.
       · STATE (how is this going) lives in a PILL WITH A WORD beside it, and
         in a row's left edge. High chroma, three rungs, and the word carries
         it for anyone who cannot separate the hues.

     Separating the channels by chroma as well as position is the whole trick:
     the mock-up used green for "assets" and green for "available" at once, and
     without the split the screen stops meaning anything. It also means the old
     rule — "two hues, each says one thing" — survives in a palette that now
     has eight, because each CHANNEL still says one thing.

     Every role is defined on bare :root, so nothing has its only definition
     inside a media query. This design is dark-first, so light is applied twice
     over the top — once for the system setting, guarded so an explicit dark
     choice still wins, and once for the explicit light choice.

     Contrast was measured, not eyeballed: every text role clears AA on every
     ground it appears on, in both themes. --receded is the one deliberate
     exception, because it is the bottom of the state ladder where a finished
     thing sinks, and its state is written as a word. */
  :root {
    --page: #0b1220;
    --rail: #0d1524;
    --sheet: #0f1829;
    --surface: #121c2e;
    --raised: #18243a;
    --sunken: #080e19;
    --rule: #1e2d45;
    --rule-soft: #162236;
    --rule-mid: #27395a;
    --rule-strong: #3a5074;
    --ink: #e9eff8;
    --ink-hover: #fbf7ef;    /* a primary button under the finger: lifts off the ink */
    --dim: #b3c4d8;
    --faint: #8ba0b8;
    --receded: #5b7089;

    /* the state ladder: in hand · attention · late. Waiting has no colour. */
    --sage: #34d399;
    --sage-lift: #6ee7b7;
    --sage-deep: #0f6b50;
    --amber: #fbbf24;
    --amber-lift: #fcd34d;
    --amber-deep: #4a3410;
    --apricot: #fb7185;
    --apricot-lift: #fda4af;
    --apricot-mute: #c05868;
    --apricot-deep: #4a1d27;
    --late-tint: #241620;
    --late-tint2: #1d1823;
    --late-edge2: #3c2b38;

    /* identity, for icon tiles only — never on text, a border or a pill */
    --nav-on: #1d4ed8;
    --nav-on-ink: #ffffff;
    --id-project: #60a5fa;
    --id-workflow: #a78bfa;
    --id-asset: #4ade80;
    --id-action: #fbbf24;
    --id-output: #2dd4bf;
    --id-equip: #f472b6;
    --id-know: #818cf8;
    --id-conn: #22d3ee;
    --id-soft: #38bdf8;
    --tile-a: 0.14;          /* how strongly an icon tile is tinted */

    /* the names the app already speaks, aliased onto the new values */
    --blue: #60a5fa;
    --blue-deep: #1e3a5f;
    --brass: #60a5fa;
    --brass-deep: #1e3a5f;
    --oxide: #fb7185;
    --oxide-deep: #4a1d27;
    --verd: #34d399;
    --gain: #34d399;
    --loss: #fb7185;
    --warn: #fbbf24;
    --line: #5d7590;
    --line-dim: #27395a;
    /* A LINE ON THE SHEET IS NOT A HAIRLINE, and borrowing the hairline
       tokens is what made the board unreadable in the dark. A flow edge out
       of a step that has not started drew with --line-dim and an association
       drew with --rule-mid; both are #27395a, which is 1.54:1 against the
       sheet — and on a template board NOTHING has started, so that was every
       edge on the screen. Measured, not guessed: these four are 3.9:1 to
       8.2:1, and the dead edge stays visibly dimmer than the live one
       without disappearing. --line-dim keeps its own job (a hairline, where
       low contrast is right) and the sheet no longer reads it. */
    --edge: #9db2cb;        /* 8.17:1 — sequence, live */
    --edge-dead: #5f7899;   /* 3.92:1 — sequence out of a step not started */
    --edge-assoc: #8fa5c9;  /* 7.10:1 — association, dashed, no order */
    --edge-back: #7cb3fb;   /* 8.20:1 — a loop back, over the top */
    --grain: 0.04;
    --shade: #05090f;
    --veil: rgba(18,28,46,0.94);
    --c1: #60a5fa;
    --display: "Mashghal Display", "Bricolage Grotesque", "Work Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
    --sans: "Work Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --serif: "Newsreader", Georgia, "Times New Roman", serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --r: 12px;
    --t: 140ms;
    color-scheme: dark;
  }

     and carries no type ramp, because the original app grew eleven sizes a
     card at a time. One ramp here, four steps, and the two aliases this
     stylesheet reads. */

    --ui: var(--sans);
    --disp: var(--display);
    --fs-xs: 0.68rem;
    --fs-sm: 0.79rem;
    --fs-md: 0.88rem;

  /* THE SAGE PILL WAS THE ONE RUN OF TEXT THAT FAILED, in both themes:
     `--sage` on `--sage-deep` measures 3.37:1 dark and 4.28:1 light, and a
     pill CARRIES THE WORD — it is the channel state is allowed to use, so it
     is the last thing that may be hard to read. Lifting the ink to
     `--sage-lift` only reached 4.26:1 dark, so the pill gets its own two
     tokens, defined per theme like every other colour here: 10.07:1 dark and
     6.86:1 light. Measured, not guessed — `m5look.js` reads them back. */
  :root {
    --pill-hand-ink: #6ee7b7;
    --pill-hand-bg: #0b2a20;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --pill-hand-ink: #065f46;
      --pill-hand-bg: #d1fae5;
    }
  }
  :root[data-theme="light"] {
    --pill-hand-ink: #065f46;
    --pill-hand-bg: #d1fae5;
  }

  /* ================= The hub's own layout =================

     The palette above is the navy system, lifted VERBATIM from
     `mashghal/index.html` rather than invented a fourth time. Its owner
     picked those colours off a mock-up they sent, every text role in it was
     measured rather than eyeballed, and the round-3 plan says in as many
     words that the old workspace image "can remain as the visual ancestor".
     Three palettes in three rounds is three chances to be told it looks
     wrong; the fourth one was.

     So the two rules that palette carries come with it:

       · IDENTITY (which kind of record this is) lives ONLY in a small
         rounded icon tile — an `--id-*` token at `--tile-a` behind a muted
         glyph. Career reads one hue, work another, the library another.
       · STATE (how is this going) lives ONLY in a pill carrying a word and
         in a row's left edge. Sage is in hand, amber is drift, apricot is
         late, and waiting carries no colour at all. */

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font-family: var(--ui); font-size: var(--fs-md); line-height: 1.5;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  img { max-width: 100%; }
  [hidden] { display: none !important; }

  h1, h2, h3, h4 {
    font-family: var(--disp); font-weight: 500; letter-spacing: -0.015em; margin: 0;
  }
  h2 { font-size: 1.34rem; }
  h3 { font-size: var(--fs-lg); }
  h4 { font-size: var(--fs-md); }
  a { color: var(--blue); }

  .label, .sect, .rwhead, .tile > .label, .field > .label, .modal-more > summary,
  .facts th, .tbl th {
    font-family: var(--ui); font-size: var(--fs-xs); font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint);
  }
  p.empty { color: var(--faint); font-size: var(--fs-sm); margin: 0.4rem 0; }
  .hint { display: block; color: var(--faint); font-size: var(--fs-xs); margin-top: 0.25rem; }
  .says { color: var(--faint); font-size: var(--fs-sm); margin: 0.25rem 0 0; }
  .serif { font-family: var(--serif); }

  /* ---- shell ---- */

  .shell { display: flex; min-height: 100vh; align-items: stretch; }
  .rail {
    position: sticky; top: 0; height: 100vh; width: 232px; flex: 0 0 232px;
    border-right: 1px solid var(--rule); background: var(--rail);
    display: flex; flex-direction: column; gap: 0.7rem;
    padding: 0.9rem 0.7rem calc(0.7rem + env(safe-area-inset-bottom, 0px));
    overflow-y: auto;
  }
  .railhead { display: contents; }
  .brand { order: 1; display: flex; align-items: center; gap: 0.5rem; min-width: 0; }
  .brand h1 { font-size: 1.02rem; overflow-wrap: anywhere; }
  .brand-mark { display: inline-flex; flex: 0 0 auto; }
  .railsub {
    order: 2; font-size: var(--fs-xs); color: var(--faint); letter-spacing: 0.02em;
  }
  .findbtn {
    order: 3; display: flex; align-items: center; gap: 0.45rem; width: 100%;
    padding: 0.4rem 0.55rem; border: 1px solid var(--rule); border-radius: 8px;
    background: var(--sheet); color: var(--faint); font: inherit;
    font-size: var(--fs-sm); cursor: pointer; text-align: left; transition: var(--t);
  }
  .findbtn:hover { color: var(--ink); border-color: var(--rule-strong); }
  .findbtn .k {
    margin-left: auto; font-family: var(--mono); font-size: 0.62rem;
    border: 1px solid var(--rule); border-radius: 4px; padding: 0 0.25rem;
  }
  #nav { order: 4; display: flex; flex-direction: column; gap: 0.1rem; }
  .tab {
    display: flex; align-items: center; gap: 0.55rem; width: 100%; position: relative;
    padding: 0.44rem 0.55rem; border: 0; border-radius: 8px; background: none;
    cursor: pointer; color: var(--dim); font: inherit; font-size: var(--fs-sm);
    text-align: left; transition: var(--t);
  }
  .tab .ico { display: inline-flex; width: 18px; justify-content: center; }
  .tab:hover { color: var(--ink); background: var(--sheet); }
  .tab[aria-current="page"] {
    background: var(--nav-on); color: var(--nav-on-ink); font-weight: 600;
  }
  .tab .badge {
    margin-left: auto; font-family: var(--mono); font-size: var(--fs-xs);
    font-weight: 700; color: var(--apricot);
  }
  .tab[aria-current="page"] .badge { color: var(--nav-on-ink); }

  .railwork { order: 5; display: flex; flex-direction: column; gap: 0.1rem; }
  .rwrow {
    display: flex; align-items: center; gap: 0.5rem; width: 100%;
    padding: 0.32rem 0.55rem 0.32rem 1.5rem; border: 0; border-radius: 7px;
    background: none; cursor: pointer; color: var(--faint); font: inherit;
    font-size: var(--fs-sm); text-align: left; transition: var(--t);
  }
  .rwrow:hover { color: var(--ink); background: var(--sheet); }
  .rwrow[aria-current="page"] { color: var(--ink); font-weight: 600; }
  .rwrow .n { margin-left: auto; font-family: var(--mono); font-size: var(--fs-xs); }
  .railme { order: 6; margin-top: auto; border-top: 1px solid var(--rule); padding-top: 0.5rem; }
  .gearbtn {
    display: flex; align-items: center; gap: 0.5rem; width: 100%; border: 0;
    border-radius: 8px; background: none; cursor: pointer; color: var(--dim);
    font: inherit; font-size: var(--fs-sm); padding: 0.4rem 0.55rem; transition: var(--t);
  }
  .gearbtn:hover { color: var(--ink); background: var(--sheet); }
  .gearbtn[aria-current="page"] { background: var(--nav-on); color: var(--nav-on-ink); font-weight: 600; }

  .view {
    flex: 1 1 auto; min-width: 0; max-width: 1200px;
    padding: 1.3rem 1.4rem calc(3rem + env(safe-area-inset-bottom, 0px));
  }

  /* ---- page furniture ---- */

  .page-head {
    display: flex; gap: 0.9rem; align-items: flex-end; justify-content: space-between;
    flex-wrap: wrap; margin-bottom: 1rem;
  }
  .page-head > div:first-child { min-width: 0; flex: 1 1 15rem; }
  .page-head h2 { overflow-wrap: anywhere; }
  .page-head p { margin: 0.3rem 0 0; color: var(--faint); font-size: var(--fs-sm); }
  .page-acts { display: flex; gap: 0.4rem; flex-wrap: wrap; }

  .strip {
    display: flex; gap: 0.25rem; flex-wrap: wrap; margin: -0.3rem 0 1rem;
    padding-bottom: 0.5rem; border-bottom: 1px solid var(--rule);
  }
  .sbtn {
    border: 1px solid transparent; border-radius: 999px; background: none;
    color: var(--faint); font: inherit; font-size: var(--fs-sm); cursor: pointer;
    padding: 0.24rem 0.65rem; transition: var(--t); white-space: nowrap;
  }
  .sbtn:hover { color: var(--ink); border-color: var(--rule); }
  .sbtn[aria-current="page"] {
    color: var(--ink); background: var(--raised); border-color: var(--rule-mid); font-weight: 600;
  }
  .sbtn .n { font-family: var(--mono); font-size: var(--fs-xs); color: var(--faint); }
  .sbtn[aria-current="page"] .n { color: var(--dim); }

  .sect {
    display: flex; align-items: center; gap: 0.6rem; margin: 1.4rem 0 0.5rem;
  }
  .sect::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
  .sect .n { font-family: var(--mono); letter-spacing: 0; color: var(--faint); }

  .crumbs { display: flex; align-items: center; gap: 0.3rem; flex-wrap: wrap; margin-bottom: 0.5rem; }
  .bcrumb {
    border: 0; background: none; cursor: pointer; padding: 0.1rem 0.2rem; border-radius: 5px;
    font: inherit; font-size: var(--fs-sm); color: var(--faint); transition: var(--t);
  }
  .bcrumb:hover { color: var(--ink); }
  .crumbs .sep { color: var(--faint); font-size: var(--fs-xs); }

  /* ---- controls ---- */

  .btn {
    font: inherit; font-size: var(--fs-sm); cursor: pointer; border-radius: 8px;
    padding: 0.36rem 0.7rem; border: 1px solid var(--rule-mid);
    background: var(--surface); color: var(--dim); text-decoration: none;
    display: inline-flex; align-items: center; gap: 0.35rem; transition: var(--t);
  }
  .btn:hover { color: var(--ink); border-color: var(--rule-strong); }
  .btn:active { transform: translateY(1px); }
  .btn.primary {
    background: var(--ink); color: var(--page); border-color: var(--ink); font-weight: 600;
  }
  .btn.primary:hover { background: var(--ink-hover); border-color: var(--ink-hover); color: var(--page); }
  .btn.quiet { border-color: transparent; background: none; }
  .btn.quiet:hover { border-color: var(--rule-mid); }
  .btn.danger { color: var(--faint); }
  .btn.danger:hover { color: var(--apricot); border-color: var(--apricot-mute); }
  #overlay .btn.danger {
    background: var(--apricot); border-color: var(--apricot); color: var(--page); font-weight: 600;
  }
  #overlay .btn.danger:hover { color: var(--page); background: var(--apricot-lift); }
  .btn.tiny { padding: 0.18rem 0.45rem; font-size: var(--fs-xs); border-radius: 6px; }
  .btn[disabled] { opacity: 0.45; cursor: default; }
  .btn.clip { max-width: 100%; }
  .btn.clip > span {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
  }

  /* ONE FOCUS RING FOR EVERY TAPPABLE THING, declared once the way `--t` is.
     Every whole-row control otherwise falls back to Chromium's own outline,
     which on this ground is a pale double ring belonging to no design here. */
  .btn:focus-visible, .tab:focus-visible, .sbtn:focus-visible, .rwrow:focus-visible,
  .gearbtn:focus-visible, .findbtn:focus-visible, .row:focus-visible,
  .bcrumb:focus-visible, .chip:focus-visible, .tevt:focus-visible,
  .pcard:focus-visible, .mrow:focus-visible, summary:focus-visible,
  .panel.wide:focus-visible, .dact:focus-visible, .impprev:focus-visible,
  input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--blue); outline-offset: 2px;
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  .chip {
    font: inherit; font-size: var(--fs-xs); cursor: pointer; border-radius: 999px;
    padding: 0.2rem 0.6rem; border: 1px solid var(--rule-mid);
    background: none; color: var(--faint); transition: var(--t); white-space: nowrap;
  }
  .chip:hover { color: var(--ink); border-color: var(--rule-strong); }
  .chip[aria-pressed="true"] {
    color: var(--ink); background: var(--raised); border-color: var(--rule-strong); font-weight: 600;
  }
  .chips { display: flex; gap: 0.3rem; flex-wrap: wrap; }

  /* A state pill: the colour AND the word, always together. */
  .pill {
    display: inline-block; font-size: var(--fs-xs); font-weight: 700;
    letter-spacing: 0.04em; text-transform: uppercase; padding: 0.08rem 0.42rem;
    border-radius: 999px; white-space: nowrap; border: 1px solid currentColor;
  }
  .p-late { color: var(--apricot); background: var(--late-tint); }
  .p-drift { color: var(--amber); background: var(--amber-deep); }
  .p-hand { color: var(--pill-hand-ink); background: var(--pill-hand-bg); }
  .p-calm { color: var(--faint); background: var(--sunken); }
  .p-done { color: var(--faint); background: none; border-color: var(--rule-mid); }

  /* IDENTITY LIVES HERE AND NOWHERE ELSE. */
  .itile {
    flex: 0 0 auto; width: 30px; height: 30px; border-radius: 9px;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--glyph, var(--dim)); background: var(--tint, var(--raised));
  }
  .itile.big { width: 52px; height: 52px; border-radius: 14px; }

  /* ---- a row ---- */

  .row {
    display: flex; align-items: flex-start; gap: 0.6rem; width: 100%;
    padding: 0.55rem 0.7rem; border: 0; border-bottom: 1px solid var(--rule-soft);
    border-left: 2px solid transparent; border-radius: 0;
    background: var(--sheet); color: inherit; font: inherit; text-align: left;
    cursor: pointer; transition: var(--t);
  }
  .row:hover { background: var(--surface); }
  .row.e-late { border-left-color: var(--apricot); }
  .row.e-drift { border-left-color: var(--amber); }
  .row.e-hand { border-left-color: var(--sage); }
  .row.flat { cursor: default; }
  .row.flat:hover { background: var(--sheet); }
  .rows {
    border: 1px solid var(--rule); border-radius: 12px; overflow: hidden;
    background: var(--sheet);
  }
  .rows > .row:last-child { border-bottom: 0; }

  .grow { flex: 1 1 0; min-width: 0; }
  .nm { font-weight: 600; overflow-wrap: anywhere; }
  .nm.one { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { display: block; color: var(--faint); font-size: var(--fs-sm); overflow-wrap: anywhere; }
  .kindw {
    font-family: var(--mono); font-size: var(--fs-xs); color: var(--faint);
    letter-spacing: 0.02em;
  }
  .right { flex: 0 0 auto; display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }
  .when { font-family: var(--mono); font-size: var(--fs-xs); color: var(--faint); white-space: nowrap; }
  .chev { color: var(--faint); display: inline-flex; flex: 0 0 auto; }

  @media (max-width: 620px) {
    .row { flex-wrap: wrap; }
    .row > .right { width: 100%; padding-left: 2.2rem; }
  }

  /* ---- panels, tiles, meters ---- */

  .panel {
    border: 1px solid var(--rule); border-radius: 12px; background: var(--sheet);
    padding: 0.8rem 0.9rem;
  }
  .panel + .panel { margin-top: 0.6rem; }
  .panel.late { border-left: 3px solid var(--apricot); }
  .panel.drift { border-left: 3px solid var(--amber); }
  .panel.hand { border-left: 3px solid var(--sage); }

  .tiles {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr));
    gap: 0; border: 1px solid var(--rule); border-radius: 12px; overflow: hidden;
  }
  .tile { padding: 0.7rem 0.8rem; border-right: 1px solid var(--rule-soft); background: var(--sheet); }
  .tile:last-child { border-right: 0; }
  .tile-fig { font-family: var(--disp); font-size: 1.55rem; line-height: 1.15; }
  .tile-fig.late { color: var(--apricot); }
  .tile-fig.drift { color: var(--amber); }
  .tile-fig.hand { color: var(--sage); }
  .tile-foot { color: var(--faint); font-size: var(--fs-xs); margin-top: 0.1rem; }
  @media (max-width: 620px) {
    .tiles { grid-template-columns: 1fr; }
    .tile {
      border-right: 0; border-bottom: 1px solid var(--rule-soft);
      display: flex; align-items: baseline; gap: 0.6rem;
    }
    .tile:last-child { border-bottom: 0; }
    .tile > .label { flex: 1 1 auto; }
    .tile-fig { font-size: 1.2rem; }
  }

  .meter { height: 5px; border-radius: 3px; background: var(--sunken); overflow: hidden; }
  .meter-fill { height: 100%; }
  .meter-pace { position: relative; }
  .chart { width: 100%; }
  .notes { display: flex; flex-direction: column; gap: 0.4rem; }
  .note { display: flex; gap: 0.5rem; font-size: var(--fs-sm); }
  .note-mark { font-family: var(--mono); color: var(--faint); }
  .note-mark.bad { color: var(--apricot); }
  .note-mark.good { color: var(--sage); }
  /* The three tones `notesHtml` can emit. A partial set is worse than none:
     the runtime is copied verbatim into five apps, so its own class hooks
     are defined here whether this app happens to call the helper or not —
     which is the `.field.wide` fault in reverse. */
  .note-mark.warn { color: var(--amber); }

  /* ---- the facts table every record page opens on ---- */

  .facts { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
  .facts th {
    text-align: left; width: 11rem; vertical-align: top;
    padding: 0.4rem 0.7rem 0.4rem 0; border-bottom: 1px solid var(--rule-soft);
  }
  .facts td {
    padding: 0.4rem 0; border-bottom: 1px solid var(--rule-soft); overflow-wrap: anywhere;
  }
  .facts tr:last-child th, .facts tr:last-child td { border-bottom: 0; }
  .facts .unsaid { color: var(--faint); }
  @media (max-width: 560px) {
    .facts th { width: auto; display: block; border-bottom: 0; padding-bottom: 0.1rem; }
    .facts td { display: block; padding-top: 0; }
  }

  /* A plain table, for a bibliography or a week of hours. */
  .tbl { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
  .tbl th { text-align: left; padding: 0.35rem 0.6rem 0.35rem 0; border-bottom: 1px solid var(--rule); }
  .tbl td { padding: 0.4rem 0.6rem 0.4rem 0; border-bottom: 1px solid var(--rule-soft); overflow-wrap: anywhere; }
  .impprev {
    max-height: 46vh; overflow-y: auto; overscroll-behavior: contain;
    margin-top: 0.8rem;
  }
  .tbl td.lit { font-family: var(--mono); white-space: nowrap; vertical-align: top; }
  .tbl td.num { font-family: var(--mono); text-align: right; white-space: nowrap; }

  /* ---- a body of text: code does not wrap, prose does ---- */

  .blk {
    border: 1px solid var(--rule); border-radius: 10px; background: var(--sunken);
    margin-top: 0.5rem; overflow: hidden;
  }
  .blkhead {
    display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
    padding: 0.35rem 0.6rem; border-bottom: 1px solid var(--rule); background: var(--surface);
  }
  .blkhead .label { flex: 1 1 auto; }
  .snip {
    margin: 0; padding: 0.6rem; font-family: var(--mono); font-size: var(--fs-sm);
    white-space: pre; overflow-x: auto; color: var(--ink); tab-size: 4;
  }
  .wrote {
    margin: 0; padding: 0.6rem; font-family: var(--ui); font-size: var(--fs-md);
    white-space: pre-wrap; color: var(--ink);
  }

  /* ---- the timeline ---- */

  .tline { position: relative; padding-left: 1.6rem; }
  .tline::before {
    content: ""; position: absolute; left: 0.42rem; top: 0.4rem; bottom: 0.4rem;
    width: 2px; background: var(--rule); border-radius: 1px;
  }
  .tyear {
    font-family: var(--disp); font-size: 1.1rem; margin: 1.1rem 0 0.4rem -1.6rem;
    padding-left: 1.6rem; position: relative; color: var(--ink);
  }
  .tyear:first-child { margin-top: 0; }
  .tevt {
    display: flex; align-items: flex-start; gap: 0.55rem; width: 100%; position: relative;
    padding: 0.4rem 0.6rem; margin-bottom: 0.25rem; border: 1px solid transparent;
    border-radius: 9px; background: none; color: inherit; font: inherit;
    text-align: left; cursor: pointer; transition: var(--t);
  }
  .tevt:hover { background: var(--sheet); border-color: var(--rule); }
  .tevt::before {
    content: ""; position: absolute; left: -1.24rem; top: 0.86rem;
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--page); border: 2px solid var(--dot, var(--rule-strong));
  }
  .tevt .tdate {
    flex: 0 0 4.6rem; font-family: var(--mono); font-size: var(--fs-xs); color: var(--faint);
    padding-top: 0.15rem;
  }
  @media (max-width: 560px) {
    .tevt { flex-wrap: wrap; }
    .tevt .tdate { flex: 1 1 100%; order: 2; padding-left: 2.2rem; }
  }

  /* ---- portfolio cards ---- */

  .pcard {
    display: flex; flex-direction: column; gap: 0.4rem; align-items: flex-start;
    border: 1px solid var(--rule); border-radius: 12px; background: var(--sheet);
    padding: 0.8rem 0.9rem; cursor: pointer; text-align: left; color: inherit;
    font: inherit; transition: var(--t);
  }
  .pcard:hover { background: var(--surface); border-color: var(--rule-mid); }
  .pcard .nm { font-size: var(--fs-lg); font-family: var(--disp); font-weight: 500; }
  .pcards {
    display: grid; gap: 0.6rem;
    grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr));
  }
  .pchead { display: flex; align-items: center; gap: 0.55rem; width: 100%; }

  /* A ROW IS A BUTTON, so a per-row control cannot live inside it — nesting
     one button in another is invalid and the inner one stops being reachable.
     The pair puts the control beside the row instead. */
  .rowpair { display: flex; align-items: stretch; gap: 0.3rem; }
  .rowpair > .row { flex: 1 1 auto; min-width: 0; }
  .rowpair > .btn { flex: 0 0 auto; align-self: center; }

  /* ---- the finder ---- */

  #finder { position: fixed; inset: 0; z-index: 88; display: none; }
  #finder.on { display: block; }
  .find-scrim { position: absolute; inset: 0; background: rgba(4, 8, 16, 0.6); }
  .find-box {
    position: relative; margin: 6vh auto 0; width: min(40rem, calc(100vw - 2rem));
    max-height: 84vh; display: flex; flex-direction: column;
    border: 1px solid var(--rule-strong); border-radius: 14px; background: var(--rail);
    overflow: hidden; box-shadow: 0 18px 50px rgba(2, 5, 12, 0.55);
  }
  .find-box input {
    border: 0; border-bottom: 1px solid var(--rule); background: none; color: var(--ink);
    font: inherit; font-size: var(--fs-lg); padding: 0.75rem 0.9rem; width: 100%;
  }
  .find-box input:focus { outline: none; }
  .find-list { overflow-y: auto; overscroll-behavior: contain; }
  .mrow {
    display: flex; align-items: center; gap: 0.55rem; width: 100%;
    padding: 0.45rem 0.9rem; border: 0; background: none; color: inherit;
    font: inherit; font-size: var(--fs-sm); text-align: left; cursor: pointer;
    transition: var(--t);
  }
  .mrow:hover, .mrow.on { background: var(--surface); }
  .mrow .k { margin-left: auto; font-family: var(--mono); font-size: var(--fs-xs); color: var(--faint); }
  .find-foot {
    display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;

    padding: 0.75rem 0.85rem; display: flex; flex-direction: column; gap: 0.55rem;

  .gtoc {

<div class="shell">
  <aside class="rail">
    <!-- The meem the icon is drawn from: a bowl that is also a record, a
         tail that is also the line between two of them. -->
    <!-- On a phone the mark, the name, the finder and the gear share ONE row,
         because 780px of screen had 164px of chrome in it. On a laptop this
         wrapper is `display: contents`, so the rail's own stated order
         (brand 1 · sub 2 · finder 3 · tabs 4 · quick 5 · footer 6) is
         untouched — a wrapper with an auto margin inside it is exactly how
         the footer once pushed everything after it down. -->
    <div class="railhead">
    <div class="railtop">
      <div class="brand"><span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 512 512" width="25" height="25" fill="none">
          <path d="M300 168 L372 130" stroke="var(--faint)" stroke-width="16"
                stroke-dasharray="2 34" stroke-linecap="round"/>
          <circle cx="392" cy="120" r="30" stroke="var(--faint)" stroke-width="18"/>
          <circle cx="216" cy="196" r="80" stroke="var(--blue)" stroke-width="42"/>
          <path d="M216 276 C216 344 292 352 292 424" stroke="var(--blue)"
                stroke-width="42" stroke-linecap="round"/>
          <circle cx="292" cy="424" r="24" fill="var(--sage)" stroke="none"/>
        </svg></span><h1 id="brandName">Mashghal</h1></div>
    </div>
    <!-- The one control that reaches further than any tab. It looks like the
         field it is and is still a button: a real <input> in the rail would
         be a second place to type one query. -->
    <button class="findbtn" data-act="find">
      <span aria-hidden="true"><svg viewBox="0 0 20 20" width="15" height="15" fill="none"
        stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="8.8" cy="8.8" r="5.3"/><path d="M12.8 12.8l4 4"/></svg></span>
      <span>Find anything</span><span class="k">Ctrl K</span>
    </button>
    <div class="railme" id="railFoot"></div>
    </div>
    <div class="railsub" id="railSub"></div>
    <nav id="nav" aria-label="Sections"></nav>
    <!-- The pages of whichever section is open, written here rather than in
         `renderNav()`, which belongs to the shared runtime and has to stay
         byte-identical across five apps. -->
    <div class="railwork" id="railWork"></div>
  </aside>
  <main class="view" id="view"></main>
</div>

<!-- Ctrl+K, or `/` when you are not typing. -->
<div id="finder" role="dialog" aria-modal="true" aria-label="Find anything">
  <div class="find-scrim"></div>
  <div class="find-box">
    <input id="findInput" type="text" autocomplete="off" spellcheck="false"
           aria-label="Find anything, or ask a question"
           placeholder="Find anything — or ask: what needs me · what evidence do I have for… · where is…" />
    <div class="find-list" id="findList"></div>
    <div class="find-foot" id="findFoot"></div>
  </div>
</div>

<!-- Every confirmation and every refused form speaks through here, so it has
     to be a live region: the toast is the only channel validation has. -->
<div class="alarm" id="alarm" role="alert" aria-live="assertive"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite" aria-atomic="false"></div>
<div class="tip" id="tip" role="status" aria-live="polite"></div>
<div id="overlay"></div>

<script>
(function () {
  "use strict";

  /* ============================================================
     MASHGHAL — My Career & Work Hub.

     One sentence, and it is the whole reset:

       Mashghal is not a productivity app with career features added to it.
       It is a personal Career & Work Hub in which professional identity,
       experience, training, skills, projects, workflows, actions,
       knowledge, assets, outputs, portfolio evidence, timelines and CVs are
       different connected VIEWS of the same underlying professional record.

     Which is why this file is the records and the relationships, and not a
     screen. The plan's §32 and §24 both say the same thing in different
     words — build the entities and the relationships outward, never the
     screens inward — and the last three rounds of this app did the
     opposite, which is the fault its owner named.

     THE THREE WORLDS. Everything is filed under one of them, and the two
     cross-cutting views are built from all three:

       CAREER      who I am professionally   profile · education · roles ·
                                             training · skills
       WORK        what I am doing and did   jobs · projects · workflows ·
                                             runs · actions · people ·
                                             assets · outputs · hours
       KNOWLEDGE   what I know and reuse     the library: scripts,
                                             formulas, methods, templates,
                                             references, places

       PORTFOLIO   what I can show           a selection, never a copy
       CV          a presentation of it      a selection, never the truth

     ONE RULE ABOVE THE REST: the same record appears in six places and is
     one record. "Historical Tripoli GIS" is a project on Work, evidence of
     experience on Career, a card in the Portfolio, a 2026 event on the
     Timeline, evidence under the GIS skill, and a bullet in a CV. Six
     views. Not six copies.

     AND WHAT THIS APP WILL NOT DO, because the plan says so in §27 and
     because every earlier round of it drifted toward doing exactly this:
     it does not infer a skill, score an experience, rate a proficiency,
     measure productivity or predict a career. Where something is unknown
     it says "not said". Where a figure is derived it names what from.
     ============================================================ */

  /* The shared runtime reads `APP.storeKey` on its very first line, so the
     object has to exist before that block runs — it is assigned at the
     foot of the app's own code. */
  var APP;

  var BUILD = "w6 · 25 Sep 2026";

  /* Its own storage, and this is not cosmetic. `localStorage` is scoped to
     the SITE and not the folder — which is exactly how Coffer's two paths
     came to share one ledger, and how loading the sample in one wiped the
     real book in the other. `mashghal2.hub` is a new name beside the two
     older ones, so neither w3's book nor w4's is read, written or lost;
     each is OFFERED for import, once, and brought in only on a tap. */
  var STORE_KEY_APP = "mashghal2.hub";
  var OLD_KEYS = [
    { key: "mashghal2.v2", what: "the card-and-link rebuild", list: "cards" },
    { key: "mashghal2.v1", what: "the workspace rebuild", list: "projects" }
  ];
  var THEME_KEY = "mashghal2.theme";

  /* ============================================================
     THE RECORDS.

     Seventeen lists and one profile. `STATE_LISTS`, `STATE_MAPS` and
     `adoptState`'s own settings block are the ONLY places any of them is
     named — Coffer lost grants out of a restored backup because two sites
     hand-copied one key list and only one of them was updated.
     ============================================================ */

  function blank() {
    return {
      version: 1,

      /* ---- CAREER ---- */
      profile: {
        name: "", headline: "", fields: "", interests: "",
        email: "", phone: "", site: "", place: "", summary: ""
      },
      education: [],   // {id,institution,degree,field,startedOn,endedOn,place,note}
      jobs: [],        // {id,name,kind,place,url,note}          — the employer
      roles: [],       // {id,jobId,title,startedOn,endedOn,place,duties,note}
      training: [],    // {id,name,institution,kind,startedOn,endedOn,place,path,url,note}
      skills: [],      // {id,name,group,level,note}             — level typed or blank

      /* ---- WORK ---- */
      projects: [],    // {id,name,jobId,roleId,startedOn,endedOn,status,note}
      workflows: [],   // {id,name,note,steps:[{id,name,note}]}  — the procedure
      runs: [],        // {id,workflowId,projectId,startedOn,endedOn,outcome,note}
      actions: [],     // {id,name,kind,projectId,when,waitOn,chaseDays,chasedOn,doneAt,note}
      people: [],      // {id,name,org,role,email,note}
      assets: [],      // {id,name,kind,place,state,lastUsedOn,path,url,note}
      outputs: [],     // {id,name,kind,projectId,on,path,url,note}
      hours: [],       // {id,projectId,on,minutes,note}

      /* ---- KNOWLEDGE ---- */
      lib: [],         // the library — see LIB_KINDS below

      /* ---- THE TWO PRESENTATION VIEWS ---- */
      portfolio: [],   // {id,name,note,on}    its evidence is links
      cvs: [],         // {id,name,aim,note}   its picks are links

      /* ---- THE RELATIONSHIP LAYER ---- */
      links: [],       // {id,rel,a,b,note}    a and b are "kind:id"

      settings: { owner: "", offered: false },
      forgotten: {}    // id -> name, so a removed record still reads
    };
  }

  var STATE_LISTS = ["education", "jobs", "roles", "training", "skills",
    "projects", "workflows", "runs", "actions", "people", "assets",
    "outputs", "hours", "lib", "portfolio", "cvs", "links"];
  var STATE_MAPS = ["forgotten"];

  var PROFILE_KEYS = ["name", "headline", "fields", "interests",
    "email", "phone", "site", "place", "summary"];

  function adoptState(raw, shape) {
    var s = shape || blank();
    if (!raw || typeof raw !== "object") return s;
    STATE_LISTS.forEach(function (k) { if (Array.isArray(raw[k])) s[k] = raw[k]; });
    STATE_MAPS.forEach(function (k) {
      if (raw[k] && typeof raw[k] === "object" && !Array.isArray(raw[k])) s[k] = raw[k];
    });
    if (raw.profile && typeof raw.profile === "object") {
      PROFILE_KEYS.forEach(function (k) {
        if (typeof raw.profile[k] === "string") s.profile[k] = raw.profile[k];
      });
    }
    var t = raw.settings || {};
    s.settings.owner = typeof t.owner === "string" ? t.owner : "";
    s.settings.offered = !!t.offered;
    /* THE THEME IS NOT IN THE BOOK. It lived in `settings.theme` beside a
       pre-paint reader that has to read `localStorage`, because the main
       script has not loaded yet — two sources of truth for one fact, and
       they disagreed at once. Which theme this screen shows is a fact about
       the screen, like which device you are on, not part of the record. */
    return s;
  }

     A row, a finder hit, a timeline dot, a link chip and a record page all
     have to agree about a kind's word, its glyph and its identity hue — so
     they all read `KINDS`. Identity is the icon tile and nothing else: no
     hue on text, on a border or on a pill, because those three channels
     say STATE.
     ============================================================ */

  var G = {
    role: '<svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.2h14v8.3a1.4 1.4 0 0 1-1.4 1.4H4.4A1.4 1.4 0 0 1 3 15.5z"/><path d="M7.4 7.2V5a1.3 1.3 0 0 1 1.3-1.3h2.6A1.3 1.3 0 0 1 12.6 5v2.2"/><path d="M3 11h14"/></svg>',
    job: '<svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.2 17V6l5-2.4V17"/><path d="M8.2 8.6h6.3a1.3 1.3 0 0 1 1.3 1.3V17"/><path d="M2 17h16"/><path d="M5.3 8.6h.8M5.3 11.4h.8M11.2 11.4h1.4M11.2 14h1.4"/></svg>',

    mins = Math.round(num(mins));

    return (h ? h + "h" : "") + (h && m ? " " : "") + (m || !h ? m + "m" : "");
  }

  /* ============================================================
     ONE SELECTOR PER QUESTION, NOT ONE PER SCREEN.

     The plan's §24 phase 3 names ten of these and that naming is the
     point: when Career, the Portfolio, a CV and the finder all want "what
     is the evidence for this skill", they read the SAME function, so they
     cannot disagree. Every earlier round of this app grew a second walk
     for a second screen and then had two answers to one question.

     Nothing here stores anything, and nothing here infers anything.
     ============================================================ */

  function live(list) { return list.filter(function (x) { return !x.archived; }); }

  /* ---------------- the action ladder ----------------

     Five rungs, derived, and they PARTITION the actions — so a tile is the
     list's own parts and a figure can never disagree with what is under
     it. There is no stored `isLate`. */

  var RUNGS = {
    late:    { word: "Late",     tone: "late",  rank: 1 },
    today:   { word: "Today",    tone: "hand",  rank: 2 },
    hand:    { word: "In hand",  tone: "hand",  rank: 3 },
    waiting: { word: "Waiting",  tone: "calm",  rank: 4 },
    done:    { word: "Done",     tone: "done",  rank: 5 }
  };
  var ACTION_KINDS = [
    { value: "do", label: "Something to do" },
    { value: "send", label: "Something to send, then wait on" },
    { value: "watch", label: "Something to watch for" },
    { value: "file", label: "Something to file away" }
  ];

  function actionLate(a) {
    if (a.doneAt) return "";
    if (a.when && dayOk(a.when) && a.when < today()) {
      var n = daysBetween(a.when, today());
      return "its day was " + shortDate(a.when) + ", " + countWords(n, "day", "days") + " ago";
    }
    /* A chase interval of nought is not a chase: a wait nobody said when to
       chase can sit for ever without being called late. */
    if (a.waitOn && num(a.chaseDays) > 0 && a.chasedOn && dayOk(a.chasedOn)) {
      var w = daysBetween(a.chasedOn, today());
      if (w >= num(a.chaseDays)) {
        return "waiting " + countWords(w, "day", "days") + " on " + a.waitOn +
          ", and " + numWord(num(a.chaseDays)) + " was the chase";
      }
    }
    return "";
  }
  function actionRung(a) {
    if (a.doneAt) return "done";
    if (actionLate(a)) return "late";
    if (a.when && a.when === today()) return "today";
    /* A WATCH IS WAITING, EVEN WITH NOBODY TO CHASE. Left on the in-hand
       rung it read "Nothing is in the way" under a heading saying these are
       yours to do — for something whose whole nature is that it is not
       yours to do. Nobody to chase still means never late, which is what
       `actionLate` already refuses to claim. */
    if (a.waitOn || a.kind === "watch") return "waiting";
    return "hand";
  }
  function actionStand(a) {
    var k = actionRung(a), r = RUNGS[k];
    return { key: k, word: r.word, tone: r.tone, rank: r.rank };
  }
  function actionSays(a, opts) {
    opts = opts || {};
    var k = actionRung(a), bits = [];
    if (k === "late") bits.push(cap(actionLate(a)));
    else if (k === "today") bits.push("Its day is today");
    else if (k === "waiting") {
      var w = a.chasedOn && dayOk(a.chasedOn) ? daysBetween(a.chasedOn, today()) : 0;
      var chase = num(a.chaseDays) > 0
        ? "; the chase is " + countWords(num(a.chaseDays), "day", "days")
        : "; no chase set, so it is never called late";
      if (a.waitOn) {
        bits.push("With " + a.waitOn +
          (w > 0 ? " for " + countWords(w, "day", "days") : " since today") + chase);
      } else {
        bits.push("Watching for it, with nobody to chase" +
          (num(a.chaseDays) > 0 ? chase : ", so it is never called late"));
      }
    } else if (k === "done") bits.push("Done " + shortDate(a.doneAt));
    else bits.push("Nothing is in the way");
    if (!opts.inProject && a.projectId) bits.push(nameOf(ref("project", a.projectId)));
    return stop(bits.join(" \u00b7 "));
  }
  function openActions() {
    return state.actions.filter(function (a) { return !a.doneAt; });
  }
  function onRung(k) {
    return state.actions.filter(function (a) { return actionRung(a) === k; });
  }
  function rungCounts() {
    var out = {};
    Object.keys(RUNGS).forEach(function (k) { out[k] = 0; });
    state.actions.forEach(function (a) { out[actionRung(a)]++; });
    return out;
  }
  function worstActions(list) {
    return list.slice().sort(function (a, b) {
      var ra = actionStand(a).rank, rb = actionStand(b).rank;
      if (ra !== rb) return ra - rb;
      var da = a.when || "9999", db = b.when || "9999";
      if (da !== db) return da < db ? -1 : 1;
      return a.name.localeCompare(b.name);
    });
  }

  /* ---------------- a project's status ----------------

     STATED, per the plan: Active · Waiting · Completed · Archived, and
     "Drifting: only if explicitly marked; never infer it". What IS derived
     is whether it needs attention — and one derived reading is allowed to
     override the stated word, because it is read off a date the owner
     typed rather than inferred from behaviour: a project whose own end
     date has gone by may not read "Active" over a header printing that
     date. */

  var PROJ_STATUS = [
    { value: "active", label: "Active", tone: "hand" },
    { value: "waiting", label: "Waiting", tone: "calm" },
    { value: "drifting", label: "Drifting", tone: "drift" },
    { value: "completed", label: "Completed", tone: "done" },
    { value: "archived", label: "Archived", tone: "done" }
  ];
  function statusLook(v) {
    return PROJ_STATUS.filter(function (s) { return s.value === v; })[0] ||
      { value: "", label: "Not said", tone: "calm" };
  }
  function projOverdue(p) {
    if (p.status === "completed" || p.status === "archived") return false;
    return !!(p.endedOn && /^\d{4}-\d{2}-\d{2}$/.test(p.endedOn) && p.endedOn < today());
  }
  function projStand(p) {
    if (projOverdue(p)) {
      return { word: "Past its date", tone: "late",
        says: "Its end date was " + shortDate(p.endedOn) + " and it is not marked completed." };
    }
    var s = statusLook(p.status);
    var late = projActions(p.id).filter(function (a) { return actionRung(a) === "late"; }).length;
    if (late) {
      return { word: s.label, tone: "late",
        says: countWords(late, "action", "actions") + " on it " + (late === 1 ? "is" : "are") + " late." };
    }
    return { word: s.label, tone: s.tone, says: "" };
  }
  function projActions(pid) {
    return state.actions.filter(function (a) { return a.projectId === pid; });
  }
  /* Progress is the actions that are done over the actions there are —
     stated parts, counted. It is NOT a prediction and there is no percent
     anywhere that is not this fraction. */
  function projProgress(pid) {
    var all = projActions(pid);
    var done = all.filter(function (a) { return !!a.doneAt; }).length;
    return { done: done, total: all.length, pct: all.length ? done / all.length : 0 };
  }
  function barTone(tone) {
    return tone === "late" ? "var(--apricot)" : tone === "drift" ? "var(--amber)"
      : tone === "hand" ? "var(--sage)" : "var(--rule-strong)";
  }

  /* ---------------- the ten the plan names ---------------- */

  /* getCareerTimeline() — DERIVED, never a second database. Every event
     comes out of the record that already holds its date, so nothing has to
     be typed twice and the two can never disagree. */
  function getCareerTimeline() {
    var out = [];
    function add(on, kind, id, word, name, sub) {
      if (!on) return;
      out.push({ on: on, year: yearOf(on) || "\u2014", kind: kind, id: id,
        word: word, name: name, sub: sub || "" });
    }
    state.education.forEach(function (e) {
      add(e.endedOn || e.startedOn, "education", e.id, "Education",
        e.name, e.org);
    });
    state.roles.forEach(function (r) {
      add(r.startedOn, "role", r.id, "Started a role", r.name,
        r.jobId ? nameOf(ref("job", r.jobId)) : "");
    });
    state.training.forEach(function (t) {
      /* Training carries ONE date, not a span: a two-day workshop has a
         day, and a span would be two fields nobody fills. */
      add(t.on, "training", t.id, "Training", t.name, t.org);
    });
    state.projects.forEach(function (p) {
      add(p.startedOn, "project", p.id, "Project began", p.name,
        p.jobId ? nameOf(ref("job", p.jobId)) : "");
    });
    state.outputs.forEach(function (o) {
      add(o.on, "output", o.id, "Output", o.name,
        o.projectId ? nameOf(ref("project", o.projectId)) : "");
    });
    state.portfolio.forEach(function (i) {
      add(i.on, "portfolio", i.id, "Portfolio", i.name, "");
    });
    /* Newest first, because a career is read backwards. */
    return out.sort(function (a, b) { return a.on < b.on ? 1 : a.on > b.on ? -1 : 0; });
  }
  function timelineYears() {
    var by = {}, order = [];
    getCareerTimeline().forEach(function (e) {
      if (!by[e.year]) { by[e.year] = []; order.push(e.year); }
      by[e.year].push(e);
    });
    return order.map(function (y) { return { year: y, events: by[y] }; });
  }

  /* getExperienceProjects(roleId) — a role is the bridge between Career
     and Work, so its projects are the ones that name it, plus the ones
     that name only its employer. */
  function getExperienceProjects(roleId) {
    var r = byId("role", roleId);
    if (!r) return [];
    return state.projects.filter(function (p) {
      return p.roleId === roleId || (!p.roleId && p.jobId && p.jobId === r.jobId);
    });
  }
  function getCareerProjects() {
    return state.projects.filter(function (p) { return p.status !== "archived"; });
  }
  function jobRoles(jobId) {
    return state.roles.filter(function (r) { return r.jobId === jobId; });
  }
  function jobProjects(jobId) {
    return state.projects.filter(function (p) { return p.jobId === jobId; });
  }

  /* getSkillEvidence(skillId) — THE GLUE. It gathers, it does not judge:
     no score, no level, no "years of experience" arithmetic. Every entry
     is a record that really names this skill. */
  function getSkillEvidence(skillId) {
    var r = ref("skill", skillId);
    var touching = both(r);
    return {
      training: ofKind(touching, "training").filter(recOf),
      projects: ofKind(touching, "project").filter(recOf),
      workflows: ofKind(touching, "workflow").filter(recOf),
      outputs: ofKind(touching, "output").filter(recOf),
      lib: ofKind(touching, "lib").filter(recOf),
      roles: ofKind(touching, "role").filter(recOf),
      portfolio: ofKind(touching, "portfolio").filter(recOf)
    };
  }
  function skillEvidenceCount(skillId) {
    var e = getSkillEvidence(skillId);
    return e.training.length + e.projects.length + e.workflows.length +
      e.outputs.length + e.lib.length + e.roles.length + e.portfolio.length;
  }
  /* The one sentence a skill row carries, and it is a count of evidence
     rather than a claim about ability. */
  function skillSays(s) {
    var e = getSkillEvidence(s.id), bits = [];
    if (e.projects.length) bits.push(countWords(e.projects.length, "project", "projects"));
    if (e.training.length) bits.push(countWords(e.training.length, "training", "trainings"));
    if (e.workflows.length) bits.push(countWords(e.workflows.length, "workflow", "workflows"));
    if (e.lib.length) bits.push(countWords(e.lib.length, "library entry", "library entries"));
    if (e.outputs.length) bits.push(countWords(e.outputs.length, "output", "outputs"));
    if (!bits.length) return "No evidence linked to it yet.";
    return cap(listWords(bits)) + ".";
  }
  /* A LEVEL IS TYPED OR IT IS NOT SAID. The plan is explicit: the app
     never invents proficiency. */
  var SKILL_LEVELS = [
    { value: "", label: "Not said" },
    { value: "learning", label: "Learning" },
    { value: "working", label: "Working knowledge" },
    { value: "strong", label: "Strong" },
    { value: "teaching", label: "I teach it" }
  ];
  function levelLabel(v) {
    var x = SKILL_LEVELS.filter(function (l) { return l.value === v; })[0];
    return x && x.value ? x.label : "";
  }

  /* getTrainingSkills(trainingId) — what a training taught. */
  function getTrainingSkills(trainingId) {
    return ofKind(both(ref("training", trainingId), "learned"), "skill").filter(recOf);
  }
  /* getProjectOutputs(projectId) — a project's outputs are its own, by the
     stated pointer; the reverse is this walk. */
  function getProjectOutputs(projectId) {
    return state.outputs.filter(function (o) { return o.projectId === projectId; });
  }
  function getProjectSkills(projectId) {
    return ofKind(both(ref("project", projectId), "uses"), "skill").filter(recOf);
  }
  function getProjectPeople(projectId) {
    return ofKind(both(ref("project", projectId), "withp"), "person").filter(recOf);
  }
  function getProjectAssets(projectId) {
    return ofKind(both(ref("project", projectId), "uses"), "asset").filter(recOf);
  }
  function getProjectLib(projectId) {
    return ofKind(both(ref("project", projectId), "uses"), "lib").filter(recOf);
  }
  function getProjectRuns(projectId) {
    return state.runs.filter(function (r) { return r.projectId === projectId; });
  }
  function getProjectWorkflows(projectId) {
    var seen = {}, out = [];
    getProjectRuns(projectId).forEach(function (r) {
      if (r.workflowId && !seen[r.workflowId]) {
        seen[r.workflowId] = 1;
        if (byId("workflow", r.workflowId)) out.push(ref("workflow", r.workflowId));
      }
    });
    return out;
  }
  /* getWorkflowProjects(workflowId) — the same reusable procedure, many
     executions. This is the distinction the plan calls crucial, and it
     falls out of the runs rather than being stored on either side. */
  function getWorkflowProjects(workflowId) {
    var seen = {}, out = [];
    state.runs.forEach(function (r) {
      if (r.workflowId === workflowId && r.projectId && !seen[r.projectId]) {
        seen[r.projectId] = 1;
        if (byId("project", r.projectId)) out.push(ref("project", r.projectId));
      }
    });
    return out;
  }
  function getWorkflowRuns(workflowId) {
    return state.runs.filter(function (r) { return r.workflowId === workflowId; });
  }
  /* getLibraryBySkill(skillId) — the library becomes part of the career
     system rather than a detached notebook precisely because of this one. */
  function getLibraryBySkill(skillId) {
    return ofKind(both(ref("skill", skillId), "about"), "lib").filter(recOf)
      .concat(ofKind(both(ref("skill", skillId), "uses"), "lib").filter(recOf))
      .filter(function (r, i, a) { return a.indexOf(r) === i; });
  }
  /* getPortfolioEvidence(itemId) — what a portfolio item shows. A
     presentation view over records that already exist. */
  function getPortfolioEvidence(itemId) {
    var r = ref("portfolio", itemId);
    return both(r, "shows").filter(recOf);
  }
  /* getCVExperience(cvId) — and the rest of a CV's picks. A CV is a
     SELECTION, never the source of truth: nothing here is stored twice. */
  function getCVPicks(cvId, kind) {
    var picks = both(ref("cv", cvId), "picks").filter(recOf);
    return kind ? ofKind(picks, kind) : picks;
  }
  function getCVExperience(cvId) { return getCVPicks(cvId, "role"); }

  /* ---------------- the library ---------------- */

  function libOf(kind) {
    return state.lib.filter(function (e) { return e.kind === kind; });
  }
  function hasBody(e) {
    return e.kind === "script" || e.kind === "formula" ||
      e.kind === "method" || e.kind === "template";
  }
  /* The test is the LANGUAGE, not the kind: a script and a formula are one
     record with a different language, and the language is what says
     whether a body is code. */
  function isCode(e) { return hasBody(e) && !!e.lang; }
  var LIB_LANGS = ["python", "arcpy", "sql", "powershell", "bash", "javascript",
    "r", "excel", "google sheets", "gdal", "qgis expression", "markdown", "latex"];

  /* Topics are words the reader types onto a thing. You never create a
     topic; the vocabulary stays a description of the work rather than a
     taxonomy to maintain. De-duplicated case-insensitively, because
     "Harbour, harbour" is one word typed twice. */
  function topicList(raw) {
    var seen = {}, out = [];
    String(raw || "").split(",").forEach(function (t) {
      t = t.trim();
      if (!t) return;
      var k = t.toLowerCase();
      if (seen[k]) return;
      seen[k] = 1; out.push(t);
    });
    return out;
  }
  function allTopics() {
    var by = {};
    state.lib.forEach(function (e) {
      (e.topics || []).forEach(function (t) {
        var k = t.toLowerCase();
        if (!by[k]) by[k] = { word: t, n: 0 };
        by[k].n++;
      });
    });
    return Object.keys(by).sort().map(function (k) { return by[k]; });
  }
  function libByTopic(word) {
    var w = String(word || "").toLowerCase();
    return state.lib.filter(function (e) {
      return (e.topics || []).some(function (t) { return t.toLowerCase() === w; });
    });
  }
  function libSays(e, opts) {
    opts = opts || {};
    var bits = [];
    if (isCode(e)) bits.push(e.lang);
    if (hasBody(e) && e.body) bits.push(countWords(e.body.split("\n").length, "line", "lines"));
    if (e.kind === "reference") {
      var c = e.cite || {};
      var said = [c.authors, c.year && "(" + c.year + ")", c.container]
        .filter(Boolean).join(" ");
      var gaps = citeComplete(e);
      bits.push(said || (gaps.length ? "no " + listWords(gaps) + " on it yet"
        : "a title and nothing else"));
    }
    if (e.kind === "place") {
      var h = openHandle(e);
      bits.push(h.brief || "nothing recorded to open");
    }
    if (!opts.noTopics && (e.topics || []).length) bits.push((e.topics || []).join(", "));
    if (!bits.length && e.note) bits.push(clip(e.note, 90));
    return bits.filter(Boolean).join(" \u00b7 ");
  }
  function libUses(e) {
    return both(ref("lib", e.id)).filter(recOf);
  }

  /* THREE ANSWERS TO "OPEN", AND ONLY ONE IS A PLAIN LINK. A page served
     over https may not navigate to file:///C:/… — every browser blocks it
     and Chrome blocks it SILENTLY, so a path rendered as a link is a
     control that quietly does nothing, which is worse than no control. */
  function openHandle(e) {
    if (e.url) {
      return { href: e.url, label: "Open the link", brief: clip(e.url.replace(/^https?:\/\//, ""), 48),
        how: "" };
    }
    if (e.path) {
      return { href: "", label: "Copy the path", brief: clip(e.path, 48),
        how: "A page on the web is not allowed to open a file on this computer \u2014 the " +
          "browser refuses, and Chrome refuses silently. So the path is handed to you " +
          "to paste into Explorer or Finder." };
    }
    return { href: "", label: "", brief: "", how: "" };
  }

  /* ---------------- hours ----------------

     Summed from the entries and never stored as a total, so no figure can
     drift from the record. */
  function hoursFor(projectId, from, to) {
    return state.hours.filter(function (h) {
      if (projectId && h.projectId !== projectId) return false;
      if (from && h.on < from) return false;
      if (to && h.on > to) return false;
      return true;
    }).reduce(function (n, h) { return n + num(h.minutes); }, 0);
  }
  function hoursMonths() {
    var by = {}, order = [];
    state.hours.forEach(function (h) {
      var k = (h.on || "").slice(0, 7);
      if (!k) return;
      if (!by[k]) { by[k] = 0; order.push(k); }
      by[k] += num(h.minutes);
    });
    return order.sort().reverse().map(function (k) { return { month: k, minutes: by[k] }; });
  }

  /* ---------------- what the record holds, in the reader's words ----------------
     A WORD THE CODE USES IS NOT A WORD THE SCREEN MAY USE: Settings used
     to count straight off the state keys and print "21 wf nodes". */
  var LIST_WORDS = {
    education: ["piece of education", "pieces of education"],
    jobs: ["employer", "employers"], roles: ["role", "roles"],
    training: ["training", "trainings"], skills: ["skill", "skills"],
    projects: ["project", "projects"], workflows: ["workflow", "workflows"],
    runs: ["run", "runs"], actions: ["action", "actions"],
    people: ["person", "people"], assets: ["piece of equipment", "pieces of equipment"],
    outputs: ["output", "outputs"], hours: ["time entry", "time entries"],
    lib: ["library entry", "library entries"],
    portfolio: ["portfolio item", "portfolio items"], cvs: ["CV", "CVs"],
    links: ["link", "links"]
  };
  function bookCount() {
    return STATE_LISTS.reduce(function (n, k) { return n + state[k].length; }, 0);
  }
  /* bookWords() — the same figures in the READER'S vocabulary. A screen
     may not print a state key at somebody: "21 wf nodes · four person
     links" was the fault the round before this. A count of nought is not
     worth a clause, so an empty list simply does not appear. */
  function bookWords() {
    return STATE_LISTS.filter(function (k) {
      return k !== "links" && state[k].length;
    }).map(function (k) {
      var w = LIST_WORDS[k] || [k, k];
      return countWords(state[k].length, w[0], w[1]);
    });
  }
  function emptyBook() { return bookCount() === 0 && !state.profile.name; }

  /* ============================================================
     REFERENCES, AND GETTING A BIBLIOGRAPHY BACK OUT.

     Asked for: "for the references, implement somehow something to make it
     accessible for me when I want to export certain bibliography, at least
     in text formation."

     The honest shape of that, and the reason it is shaped this way:

       · BIBTEX, RIS and CSL-JSON are EXACT. They are field mappings with
         no style judgement in them at all, so they cannot be subtly wrong
         — and they are what a reference manager actually eats. Those are
         the trustworthy exports.
       · ONE PLAIN-TEXT LIST, in author-date order, for pasting into a
         document you are writing now. It is labelled as author-date and
         the screen says it is not a certified implementation of a named
         style, because a citation string that is ALMOST APA is the
         plausible-wrong-answer this whole app refuses: a reader would
         paste it into a thesis and never look again.

     And the same mapping runs backwards. A reference does not arrive by
     being typed field by field; it arrives as a BibTeX or RIS record off
     a journal page or out of Zotero. `citeParse()` reads both. That is
     mechanical too — it invents nothing, it names every field it could
     not place, and it never guesses at a missing year.
     ============================================================ */

  var CITE_TYPES = [
    { value: "article",    label: "Journal article", bib: "article",       ris: "JOUR",
      wants: "Authors, year, title, journal, volume, issue, pages, DOI" },
    { value: "book",       label: "Book",            bib: "book",          ris: "BOOK",
      wants: "Authors, year, title, publisher, place, edition, ISBN" },
    { value: "chapter",    label: "Book chapter",    bib: "incollection",  ris: "CHAP",
      wants: "Authors, year, chapter title, book title, editors, publisher, pages" },
    { value: "thesis",     label: "Thesis",          bib: "phdthesis",     ris: "THES",
      wants: "Author, year, title, institution, kind of thesis" },
    { value: "report",     label: "Report",          bib: "techreport",    ris: "RPRT",
      wants: "Authors, year, title, institution, number, place" },
    { value: "conference", label: "Conference paper", bib: "inproceedings", ris: "CPAPER",
