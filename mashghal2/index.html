    raw.split(/\r?\n/).forEach(function (line) {
      var m = /^([A-Z][A-Z0-9])\s{0,2}-\s?(.*)$/.exec(line.trim());
      if (!m) return;
      var tag = m[1], v = m[2].trim();
      if (!v && tag !== "ER") return;
      if (tag === "TY") c.type = RIS_TO_TYPE[v] || "web";
      else if (tag === "AU" || tag === "A1" || tag === "A2") au.push(v);
      else if (tag === "ED" || tag === "A3") ed.push(v);
      else if (tag === "TI" || tag === "T1") c.title = v;
      else if (tag === "JO" || tag === "JF" || tag === "T2") c.container = v;
      else if (tag === "PY" || tag === "Y1" || tag === "DA") {
        if (!c.year) c.year = (/\d{4}/.exec(v) || [""])[0];
      } else if (tag === "VL") c.volume = v;
      else if (tag === "IS") c.issue = v;
      else if (tag === "SP") sp = v;
      else if (tag === "EP") ep = v;
      else if (tag === "PB") c.publisher = v;
      else if (tag === "CY" || tag === "PP") c.place = v;
      else if (tag === "IN" || tag === "AD") c.institution = v;
      else if (tag === "ET") c.edition = v;
      else if (tag === "DO") c.doi = v;
      else if (tag === "SN") { if (/^97[89]|^\d{9}[\dXx]$/.test(v.replace(/-/g, ""))) c.isbn = v; else c.issn = v; }
      else if (tag === "UR" || tag === "L1") c.url = c.url || v;
      else if (tag === "Y2") c.accessed = v;
      else if (tag === "N1" || tag === "AB") c.extra = c.extra || v;
      else if (tag === "KW") kw.push(v);
      else if (tag !== "ER") unread.push(tag);
    });
    c.authors = au.join("; ");
    c.editors = ed.join("; ");
    c.pages = sp && ep ? sp + "\u2013" + ep : (sp || ep || "");
    if (kw.length) c.keywords = kw.join(", ");
    return finishParse(c, unread, "RIS");
  }
  function finishParse(c, unread, from) {
    if (!c.title) {
      return { ok: false, why: "That " + from + " record has no title, so there is " +
        "nothing to call it. Add a title line and paste it again." };
    }
    var kw = c.keywords || "";
    delete c.keywords;
    var missing = ["authors", "year"].filter(function (k) { return !c[k]; });
    return { ok: true, cite: c, topics: topicList(kw), from: from,
      missing: missing, unread: unread,
      /* It SAYS what it read and what was not there, rather than filling a
         year in from the accessed date or the DOI. */
      says: "Read as a " + from + " " + citeType(c.type).label.toLowerCase() +
        (unread.length ? ". Not placed: " + unread.filter(function (x, i, a) {
          return a.indexOf(x) === i; }).join(", ") : "") +
        (missing.length ? ". No " + missing.join(" and ") + " in it \u2014 " +
          "add " + (missing.length === 1 ? "it" : "them") + " by hand." : "") };
  }

  /* ---------------- which references to export ----------------

     "certain bibliography" is the whole point: nobody exports all of them.
     Every scope is a walk over records that already exist. */

  function bibScopes() {
    var out = [{ value: "all", label: "Every reference \u2014 " +
      libOf("reference").length, get: function () { return libOf("reference"); } }];
    allTopics().forEach(function (t) {
      var n = libByTopic(t.word).filter(function (e) { return e.kind === "reference"; }).length;
      if (n) {
        out.push({ value: "topic:" + t.word, label: "On \u201c" + t.word + "\u201d \u2014 " + n,
          get: function () {
            return libByTopic(t.word).filter(function (e) { return e.kind === "reference"; });
          } });
      }
    });
    state.projects.forEach(function (p) {
      var n = getProjectLib(p.id).map(recOf)
        .filter(function (e) { return e && e.kind === "reference"; });
      if (n.length) {
        out.push({ value: "project:" + p.id, label: "Used on " + p.name + " \u2014 " + n.length,
          get: function () {
            return getProjectLib(p.id).map(recOf)
              .filter(function (e) { return e && e.kind === "reference"; });
          } });
      }
    });
    state.skills.forEach(function (s) {
      var n = getLibraryBySkill(s.id).map(recOf)
        .filter(function (e) { return e && e.kind === "reference"; });
      if (n.length) {
        out.push({ value: "skill:" + s.id, label: "About " + s.name + " \u2014 " + n.length,
          get: function () {
            return getLibraryBySkill(s.id).map(recOf)
              .filter(function (e) { return e && e.kind === "reference"; });
          } });
      }
    });
    state.outputs.forEach(function (o) {
      var n = ofKind(both(ref("output", o.id), "cites"), "lib").map(recOf)
        .filter(function (e) { return e && e.kind === "reference"; });
      if (n.length) {
        out.push({ value: "output:" + o.id, label: "Cited by " + o.name + " \u2014 " + n.length,
          get: function () {
            return ofKind(both(ref("output", o.id), "cites"), "lib").map(recOf)
              .filter(function (e) { return e && e.kind === "reference"; });
          } });
      }
    });
    return out;
  }
  function bibScope(v) {
    return bibScopes().filter(function (s) { return s.value === v; })[0] || bibScopes()[0];
  }

  /* ============================================================
     THE SCREENS ARE VIEWS OVER THE RECORD.

     Five tabs, because a phone's bar was measured at six in this repo and
     carries seven only by taking the label off the gear:

       HOME      what matters across my professional life right now
       CAREER    who I am professionally
       WORK      what I am doing and have done
       LIBRARY   what I know and can reuse
       SHOW      what I can present — the portfolio and the CVs

     with Settings on the gear and the finder above the tabs, because it
     reaches further than any of them.

     Each tab is a STRIP of pages, not a stack of levels, and every page is
     one list. Which page is open, which record is open and what was typed
     into the finder are all VIEW STATE — module-level, never in `state`, so
     none of it reaches a backup or survives a reload. Keeping it in
     settings meant a tab showed a different screen depending on what you
     did ten minutes ago.
     ============================================================ */

  var openRec = "";     // "kind:id" — whose page is open
  var pageAt = {};      // tab id -> the page open inside it
  var back = [];        // where Back goes, one push per navigation
  var libTopic = "";    // the Library's topic lens
  var projFilter = "";  // the Projects chip

  var PAGES = {
    career: [
      { id: "profile",   label: "Profile" },
      { id: "roles",     label: "Experience", kind: "role" },
      { id: "education", label: "Education",  kind: "education" },
      { id: "training",  label: "Training",   kind: "training" },
      { id: "skills",    label: "Skills",     kind: "skill" },
      { id: "timeline",  label: "Timeline" }
    ],
    work: [
      { id: "projects",  label: "Projects",  kind: "project" },
      { id: "workflows", label: "Workflows", kind: "workflow" },
      { id: "actions",   label: "Actions",   kind: "action" },
      { id: "people",    label: "People",    kind: "person" },
      { id: "equipment", label: "Equipment", kind: "asset" },
      { id: "outputs",   label: "Outputs",   kind: "output" },
      { id: "jobs",      label: "Employers", kind: "job" },
      { id: "hours",     label: "Hours" }
    ],
    library: [
      { id: "scripts",    label: "Scripts",    lib: "script" },
      { id: "formulas",   label: "Formulas",   lib: "formula" },
      { id: "methods",    label: "Methods",    lib: "method" },
      { id: "templates",  label: "Templates",  lib: "template" },
      { id: "references", label: "References", lib: "reference" },
      { id: "places",     label: "Places",     lib: "place" },
      { id: "topics",     label: "By subject" }
    ],
    show: [
      { id: "portfolio", label: "Portfolio", kind: "portfolio" },
      { id: "cvs",       label: "CVs",       kind: "cv" }
    ]
  };
  /* Which tab a record belongs to, so the rail marks the right one and
     Back from a record page lands on the page that lists it. */
  var TAB_OF = {
    role: "career", job: "work", education: "career", training: "career",
    skill: "career", project: "work", workflow: "work", run: "work",
    action: "work", person: "work", asset: "work", output: "work",
    lib: "library", portfolio: "show", cv: "show"
  };
  var PAGE_OF = {
    role: "roles", job: "jobs", education: "education", training: "training",
    skill: "skills", project: "projects", workflow: "workflows", run: "workflows",
    action: "actions", person: "people", asset: "equipment", output: "outputs",
    portfolio: "portfolio", cv: "cvs"
  };
  var LIB_PAGE = { script: "scripts", formula: "formulas", method: "methods",
    template: "templates", reference: "references", place: "places" };

  function pageNow(tab) {
    var list = PAGES[tab];
    if (!list) return "";
    var want = pageAt[tab];
    return list.some(function (p) { return p.id === want; }) ? want : list[0].id;
  }
  /* A page that is not a list has NO count, and -1 is not a count: the
     finder printed "Career · -1" under Profile and Timeline. Callers test
     for null. */
  function pageCount(tab, p) {
    if (p.kind) return listOf(p.kind).length;
    if (p.lib) return libOf(p.lib).length;
    if (p.id === "hours") return state.hours.length;
    if (p.id === "topics") return allTopics().length;
    return null;
  }
  function pageStrip(tab) {
    return '<div class="strip">' + PAGES[tab].map(function (p) {
      var n = pageCount(tab, p);
      /* The separator is a pipe, because the `page` handler splits on one and
         a colon is already the separator INSIDE a ref ("project:abc123") —
         two meanings for one character is how every strip button in the app
         came to navigate nowhere. */
      return '<button class="sbtn" data-act="page" data-id="' + tab + "|" + p.id +
        '"' + (p.id === pageNow(tab) ? ' aria-current="page"' : "") + ">" + esc(p.label) +
        (n == null ? "" : ' <span class="n">' + n + "</span>") + "</button>";
    }).join("") + "</div>";
  }

  /* ---------------- the one row ----------------

     Every list in the app draws this, so a record reads the same way
     wherever it appears. `opts.knows` is what the page around it already
     names — SAY IT ONCE: an action row on a project's own page printing
     that project's name three inches under the heading that IS the
     project's name is the fault this repo records twice. */

  function rowOf(kind, rec, opts) {
    opts = opts || {};
    var r = ref(kind, rec.id);
    var st = opts.stand || standOf(kind, rec);
    var sub = opts.says != null ? opts.says : saysOf(kind, rec, opts);
    var right = [];
    if (opts.when) right.push('<span class="when">' + esc(opts.when) + "</span>");
    if (st && st.word) {
      right.push('<span class="pill p-' + st.tone + '">' + esc(st.word) + "</span>");
    }
    (opts.extra || []).forEach(function (h) { right.push(h); });
    var open1 = '<button class="row' + (st && st.tone && st.tone !== "done" ? " e-" + st.tone : "") +
      '" data-act="open" data-id="' + esc(r) + '" title="' + esc(recName(rec, kind)) + '">' +
      itile(kind, rec) +
      '<span class="grow"><span class="nm">' + esc(recName(rec, kind)) + "</span>" +
      (opts.kindw ? ' <span class="kindw">' + esc(opts.kindw.toUpperCase()) + "</span>" : "") +
      (sub ? '<span class="sub">' + (opts.rawSays ? sub : esc(sub)) + "</span>" : "") +
      "</span>" +
      '<span class="right">' + right.join("") +
      '<span class="chev" aria-hidden="true">' + G.chev + "</span></span></button>";
    if (!opts.unpick) return open1;
    /* Taking something out of a selection belongs on its row, and the row
       is a button — so the control sits beside it rather than inside it. */
    return '<div class="rowpair">' + open1 +
      '<button class="btn tiny danger" data-act="pick-drop" data-id="' +
      esc(opts.unpick + "|" + r) + '" aria-label="' +
      esc(opts.cutWord || "Take it out") + '" title="' +
      esc(opts.cutWord || "Take it out") + '">\u00d7</button></div>';
  }
  G.chev = '<svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M8 5.5l5 4.5-5 4.5"/></svg>';

  function rowsOf(kind, list, opts) {
    if (!list.length) return "";
    return '<div class="rows">' + list.map(function (rec) {
      return rowOf(kind, rec, opts);
    }).join("") + "</div>";
  }
  function refRows(refs, opts) {
    var live2 = refs.filter(recOf);
    if (!live2.length) return "";
    return '<div class="rows">' + live2.map(function (r) {
      var p = parseRef(r);
      return rowOf(p.kind, recOf(r), opts);
    }).join("") + "</div>";
  }

  /* ONE LADDER PER KIND, in one place, so a row and the record's own page
     cannot disagree about how it stands. A kind with nothing to say about
     its state carries NO PILL — a state nobody stated and nothing derives
     is not a state, and an invented one is the fault this app is built
     against. */
  function standOf(kind, rec) {
    if (kind === "action") return actionStand(rec);
    if (kind === "project") return projStand(rec);
    if (kind === "role") {
      return rec.endedOn ? { word: "", tone: "done" } : { word: "Current", tone: "hand" };
    }
    if (kind === "lib" && rec.kind === "reference") {
      var gaps = citeComplete(rec);
      return gaps.length ? { word: "Needs " + gaps[0], tone: "drift" } : { word: "", tone: "" };
    }
    if (kind === "asset") {
      var s = THING_STATES.filter(function (x) { return x.value === rec.state; })[0];
      return s && s.value ? { word: s.label, tone: s.tone } : { word: "Unknown", tone: "calm" };
    }
    if (kind === "cv") {
      var n = getCVPicks(rec.id).length;
      return n ? { word: "", tone: "" } : { word: "Nothing picked", tone: "drift" };
    }
    return { word: "", tone: "" };
  }
  var THING_STATES = [
    { value: "", label: "Unknown", tone: "calm" },
    { value: "ready", label: "Available", tone: "hand" },
    { value: "out", label: "In the field", tone: "drift" },
    { value: "fixing", label: "Maintenance", tone: "drift" },
    { value: "lost", label: "Missing", tone: "late" }
  ];

  function saysOf(kind, rec, opts) {
    opts = opts || {};
    var k = opts.knows || {};
    if (kind === "action") return actionSays(rec, { inProject: !!k.project });
    if (kind === "project") {
      var st = projStand(rec), pr = projProgress(rec.id), bits = [];
      if (st.says) bits.push(clause(st.says));
      if (pr.total) bits.push(ofWords(pr.done, pr.total, "action", "actions"));
      if (!k.job && rec.jobId) bits.push(nameOf(ref("job", rec.jobId)));
      var sp = spanWords(rec.startedOn, rec.endedOn);
      if (sp) bits.push(sp);
      return bits.join(" · ");
    }
    if (kind === "role") {
      var b2 = [];
      if (!k.job && rec.jobId) b2.push(nameOf(ref("job", rec.jobId)));
      var s2 = spanWords(rec.startedOn, rec.endedOn);
      if (s2) b2.push(s2);
      var np = getExperienceProjects(rec.id).length;
      if (np) b2.push(countWords(np, "project", "projects"));
      return b2.join(" · ");
    }
    if (kind === "job") {
      var b3 = [];
      if (rec.kind) b3.push(rec.kind);
      if (rec.place) b3.push(rec.place);
      var nr = jobRoles(rec.id).length, npj = jobProjects(rec.id).length;
      if (nr) b3.push(countWords(nr, "role", "roles"));
      if (npj) b3.push(countWords(npj, "project", "projects"));
      return b3.join(" · ");
    }
    if (kind === "education") {
      return [rec.org, rec.result, spanWords(rec.startedOn, rec.endedOn)]
        .filter(Boolean).join(" · ");
    }
    if (kind === "training") {
      var sk = getTrainingSkills(rec.id).length;
      return [rec.org, rec.kind, rec.on ? partDate(rec.on) : "",
        sk ? "taught " + countWords(sk, "skill", "skills") : ""]
        .filter(Boolean).join(" · ");
    }
    if (kind === "skill") {
      var lv = levelLabel(rec.level);
      return (lv ? lv + " · " : "") + skillSays(rec);
    }
    if (kind === "workflow") {
      var np2 = getWorkflowProjects(rec.id).length, nr2 = getWorkflowRuns(rec.id).length;
      return [countWords((rec.steps || []).length, "step", "steps"),
        np2 ? "used on " + countWords(np2, "project", "projects") : "",
        nr2 ? countWords(nr2, "run", "runs") : ""].filter(Boolean).join(" · ");
    }
    if (kind === "run") {
      return [rec.workflowId ? nameOf(ref("workflow", rec.workflowId)) : "",
        !k.project && rec.projectId ? nameOf(ref("project", rec.projectId)) : "",
        spanWords(rec.startedOn, rec.endedOn), rec.outcome].filter(Boolean).join(" · ");
    }
    if (kind === "person") {
      var out2 = both(ref("person", rec.id), "withp").filter(recOf).length;
      return [rec.role, rec.org, out2 ? "on " + countWords(out2, "project", "projects") : ""]
        .filter(Boolean).join(" · ");
    }
    if (kind === "asset") {
      return [rec.kind, rec.place,
        rec.lastUsedOn ? "last used " + shortDate(rec.lastUsedOn) : ""]
        .filter(Boolean).join(" · ");
    }
    if (kind === "output") {
      return [rec.kind, !k.project && rec.projectId ? nameOf(ref("project", rec.projectId)) : "",
        rec.on ? agoWords(rec.on) : ""].filter(Boolean).join(" · ");
    }
    if (kind === "lib") return libSays(rec, opts);
    if (kind === "portfolio") {
      var ev = getPortfolioEvidence(rec.id).length;
      return [ev ? "shows " + countWords(ev, "thing", "things") : "nothing linked to it yet",
        rec.on ? shortDate(rec.on) : ""].filter(Boolean).join(" · ");
    }
    if (kind === "cv") {
      var pk = getCVPicks(rec.id);
      return [rec.aim, pk.length ? countWords(pk.length, "thing picked", "things picked") : ""]
        .filter(Boolean).join(" · ");
    }
    return rec.note ? clip(rec.note, 100) : "";
  }

  /* A COUNT PAIR STILL HAS TO AGREE WITH ITSELF. "0 of 1 actions done"
     read a plural noun off the total while the number beside it was one. */
  function ofWords(done, total, one, many) {
    return done + " of " + total + " " + (total === 1 ? one : many) + " done";
  }
  /* A `says` is a SENTENCE on its own and a CLAUSE inside a sub-line, so the
     full stop comes off when it is being joined to something else. */
  function clause(s) { return String(s || "").replace(/\.\s*$/, ""); }

  function sectHead(word, n, act) {
    return '<div class="sect">' + esc(word) +
      (n == null ? "" : ' <span class="n">' + n + "</span>") +
      (act ? "" : "") + "</div>";
  }
  function pageHeadOf(title, sub, acts) {
    return '<div class="page-head"><div><h2>' + esc(title) + "</h2>" +
      (sub ? "<p>" + sub + "</p>" : "") + "</div>" +
      (acts ? '<div class="page-acts">' + acts + "</div>" : "") + "</div>";
  }
  function btn(act, id, label, cls) {
    return '<button class="' + (cls || "btn") + '" data-act="' + esc(act) + '"' +
      (id ? ' data-id="' + esc(id) + '"' : "") + ">" + esc(label) + "</button>";
  }
  /* THE EMPTY LINE READS THE BUTTON'S OWN LABEL, so the two cannot drift:
     renaming the control renames the sentence pointing at it. */
  function btnWord(html) {
    var m = /<button[^>]*>([^<]+)<\/button>/.exec(String(html || ""));
    return m ? m[1] : "the button above";
  }

  function factRows(rows) {
    return '<table class="facts"><tbody>' + rows.filter(Boolean).map(function (r) {
      return "<tr><th>" + esc(r[0]) + "</th><td>" + r[1] + "</td></tr>";
    }).join("") + "</tbody></table>";
  }
  function notePanel(rec) {
    if (!rec.note) return "";
    return '<div class="panel" style="margin-top:0.8rem"><span class="label">Note</span>' +
      '<p style="margin:0.3rem 0 0;white-space:pre-wrap">' + esc(rec.note) + "</p></div>";
  }
  function meterOf(pct, tone) {
    return '<div class="meter"><div class="meter-fill" style="width:' +
      (clamp(pct, 0, 1) * 100).toFixed(1) + "%;background:" + barTone(tone) + '"></div></div>';
  }

  /* ---------------- the links on a record ----------------

     Drawn as rows under a heading that reads in the direction the link was
     drawn, so the screen never claims a relationship the record does not
     hold. The `×` beside each one takes it back off, and it is where a
     keyboard can reach it. */

  /* Everything that touches this record, whichever end the link was drawn
     from — the question "what is connected to this" does not care. */
  function linkedRefs(r, rel) { return both(r, rel).filter(recOf); }

  /* ============================================================
     THE LIBRARY — what I know and what I can reuse.

     Its owner asked for this one by name and listed it: "Python codes,
     formulas, where my documents are, certain links, certain shortcuts,
     and directory for files, and Excel formulas, and references."

     Six kinds in ONE list, because they are six kinds of the same thing —
     something you keep in order to use it again — and a second list per
     kind is the fault this repo records three times over. What separates
     them is what each one actually holds:

       script    a body, and a language              (Python, ArcPy, SQL…)
       formula   a body, and a language              (Excel, Sheets)
       method    a body, read as prose
       template  a body, read as prose or as code
       reference a citation record, and no body
       place     a path or a URL, and no body

     "Where my documents are", "certain links", "certain shortcuts" and "a
     directory for files" are ONE kind, `place`, because all four are the
     same act: something you open. `openHandle()` already decides what
     open means and there are only three answers.

     And the Library is not a detached notebook: every entry can be linked
     to a project, a workflow, a skill or a training, which is what the
     plan's §12 asks for and what makes it part of the career system.
     ============================================================ */

  function renderLibrary() {
    var page = pageNow("library");
    var p = PAGES.library.filter(function (x) { return x.id === page; })[0];
    var out = [];
    if (p.lib) {
      var k = LIB_KINDS[p.lib], list = libOf(p.lib);
      /* ON THE REFERENCES PAGE, PASTING IS THE PRIMARY ACT. Typing
         eighteen fields per paper is how a bibliography feature goes unused,
         and every catalogue, Zotero and Scholar will hand you BibTeX or RIS
         for nothing. */
      out.push(pageHeadOf(k.many, esc(cap(k.says)) + ".",
        p.lib === "reference"
          ? btn("cite-paste", "", "Paste BibTeX or RIS", "btn primary") +
            btn("lib-add", "reference", "Type one in") +
            btn("bib-export", "", "Export a bibliography")
          : btn("lib-add", p.lib, "New " + k.word.toLowerCase(), "btn primary")));
      out.push(pageStrip("library"));
      if (p.lib === "reference") out.push(refsPage(list));
      else out.push(libListPage(p.lib, list));
    } else {
      out.push(pageHeadOf("By subject",
        "The same entries read by what they are ABOUT instead of by what kind they are. " +
        "You never create a subject: you write one onto an entry, which keeps the " +
        "vocabulary a description of the work rather than a taxonomy to maintain.",
        btn("lib-add", "method", "New entry", "btn primary")));
      out.push(pageStrip("library"));
      out.push(topicsPage());
    }
    return out.join("");
  }

  /* ---------------- a kind's list ---------------- */

  function libListPage(kind, list) {
    var out = [];
    if (!list.length) {
      /* The page's own sub-line already says what this kind IS, three
         inches above — printing it again here was most of the screen. */
      return '<div class="panel">' + emptyLines(
        "Nothing under " + LIB_KINDS[kind].many + " yet.",
        "Press New " + LIB_KINDS[kind].word.toLowerCase() + ".") + "</div>";
    }
    /* CHIPS ARE COUNTED FROM WHAT IS ACTUALLY HERE, so no chip can empty
       the list, and a chip for a language nothing is written in is not
       drawn at all. */
    var facet = kind === "script" || kind === "formula" ? "lang"
      : kind === "place" ? "where" : "";
    if (facet) {
      var by = {};
      list.forEach(function (e) {
        var w = facet === "lang" ? (e.lang || "no language said")
          : (e.url ? "a link" : e.path ? "a path on this computer" : "nothing to open");
        by[w] = (by[w] || 0) + 1;
      });
      var keys = Object.keys(by).sort();
      if (keys.length > 1) {
        out.push('<div class="chips" style="margin-bottom:0.6rem">' +
          '<button class="chip" data-act="lib-facet" data-id=""' +
          (libTopic ? "" : ' aria-pressed="true"') + ">All · " + list.length + "</button>" +
          keys.map(function (w) {
            return '<button class="chip" data-act="lib-facet" data-id="' + esc(w) + '"' +
              (libTopic === w ? ' aria-pressed="true"' : "") + ">" + esc(w) +
              " · " + by[w] + "</button>";
          }).join("") + "</div>");
        if (libTopic) {
          list = list.filter(function (e) {
            var w = facet === "lang" ? (e.lang || "no language said")
              : (e.url ? "a link" : e.path ? "a path on this computer" : "nothing to open");
            return w === libTopic;
          });
        }
      }
    }
    out.push(rowsOf("lib", list.slice().sort(byName), { kindw: "" }));
    if (!list.length) {
      out.push('<div class="panel">' + emptyLines("Nothing on that chip.",
        "The counts beside each chip say where the entries are.") + "</div>");
    }
    return out.join("");
  }
  function byName(a, b) { return String(a.name).localeCompare(String(b.name)); }

  /* ---------------- references, and the bibliography ---------------- */

  function refsPage(list) {
    var out = [];
    if (!list.length) {
      return '<div class="panel">' + emptyLines("No references yet.",
        "Press Paste BibTeX or RIS — that is how a reference actually arrives, " +
        "off a journal page or out of Zotero, and it is read exactly rather than " +
        "retyped.") + "</div>";
    }
    /* A reference missing an author, a year or a title cannot be exported
       into anything usable, so that is said HERE rather than being found
       out at the moment of export. */
    var gaps = list.filter(function (e) { return citeComplete(e).length; });
    if (gaps.length) {
      out.push('<div class="panel drift"><span class="label">Not ready to export</span>' +
        '<p class="says">' + cap(countWords(gaps.length, "reference", "references")) +
        (gaps.length === 1 ? " is" : " are") + " missing an author, a year or a title. " +
        "They export, but a bibliography entry with a hole in it is worse than a " +
        "missing one — the rows below say which.</p></div>");
    }
    var byType = {};
    list.forEach(function (e) {
      var t = citeType(citeOf(e).type).label;
      byType[t] = (byType[t] || 0) + 1;
    });
    var tkeys = Object.keys(byType).sort();
    if (tkeys.length > 1) {
      out.push('<div class="chips" style="margin-bottom:0.6rem">' +
        '<button class="chip" data-act="lib-facet" data-id=""' +
        (libTopic ? "" : ' aria-pressed="true"') + ">All · " + list.length + "</button>" +
        tkeys.map(function (t) {
          return '<button class="chip" data-act="lib-facet" data-id="' + esc(t) + '"' +
            (libTopic === t ? ' aria-pressed="true"' : "") + ">" + esc(t) +
            " · " + byType[t] + "</button>";
        }).join("") + "</div>");
    }
    var show = libTopic
      ? list.filter(function (e) { return citeType(citeOf(e).type).label === libTopic; })
      : list;
    /* Author-date order, because that is the order a bibliography is read
       in and a list of references sorted by when you happened to add them
       is not a bibliography. */
    out.push('<div class="rows">' + bibSort(show).map(function (e) {
      var gap = citeComplete(e);
      return '<button class="row' + (gap.length ? " e-drift" : "") +
        '" data-act="open" data-id="' + esc(ref("lib", e.id)) + '">' +
        itile("lib", e) +
        '<span class="grow"><span class="nm serif">' + esc(plainCite(e)) + "</span>" +
        '<span class="sub">' + esc([citeType(citeOf(e).type).label,
          (e.topics || []).join(", "), citeKey(e)].filter(Boolean).join(" · ")) +
        "</span></span>" +
        '<span class="right">' +
        (gap.length ? '<span class="pill p-drift">Needs ' + esc(gap[0]) + "</span>" : "") +
        '<span class="chev" aria-hidden="true">' + G.chev + "</span></span></button>";
    }).join("") + "</div>");
    if (!show.length) {
      out.push('<div class="panel">' + emptyLines("Nothing of that type.",
        "The counts beside each chip say where the references are.") + "</div>");
    }
    out.push('<details class="fold"><summary><span class="label">How a bibliography ' +
      "comes out of here</span></summary><div class=\"foldbody\">" +
      /* THE COUNT IS THE TABLE'S OWN LENGTH. Written out as "Four formats"
         it sat above five rows — a figure disagreeing with its own parts,
         in the one panel whose job is to explain the export. */
      '<p class="says">' + cap(countWords(BIB_FORMATS.length, "format", "formats")) +
      ", and the difference between them matters.</p>" +
      '<table class="tbl"><tbody>' + BIB_FORMATS.map(function (f) {
        return "<tr><td><b>" + esc(f.label) + "</b></td><td>" + esc(f.says) + "</td></tr>";
      }).join("") + "</tbody></table>" +
      '<p class="says">BibTeX, RIS and CSL-JSON are exact: they are field mappings with ' +
      "no style judgement in them, which is why they can be trusted. The plain list is " +
      "author-date for pasting, and it says on itself that it is not an implementation " +
      "of APA, MLA, Chicago or Harvard — a citation string that is <i>almost</i> a " +
      "named style is the one kind of wrong answer nobody checks.</p>" +
      '<p class="says">And you pick WHICH references: all of them, everything on one ' +
      "subject, everything used on one project, everything about one skill, or " +
      "everything a given output cites.</p></div></details>");
    return out.join("");
  }

  /* ---------------- by subject ---------------- */

  function topicsPage() {
    var topics = allTopics();
    if (!topics.length) {
      return '<div class="panel">' + emptyLines("Nothing is filed under a subject yet.",
        "Open any library entry and write a word or two into “What it is about” " +
        "— harbour surveying, photogrammetry, GIS. The subjects are whatever you type.") +
        "</div>";
    }
    /* A SUBJECT IS A ROW, not a chip over an empty screen. The page answers
       "what do I know about" without a tap. */
    return '<div class="rows">' + topics.map(function (t) {
      var list = libByTopic(t.word);
      var byKind = {};
      list.forEach(function (e) { byKind[e.kind] = (byKind[e.kind] || 0) + 1; });
      var words = Object.keys(byKind).map(function (k) {
        return countWords(byKind[k], LIB_KINDS[k].word.toLowerCase(),
          LIB_KINDS[k].many.toLowerCase());
      });
      return '<button class="row" data-act="lib-topic" data-id="' + esc(t.word) + '">' +
        itile("lib", { kind: "method" }) +
        '<span class="grow"><span class="nm">' + esc(t.word) + "</span>" +
        '<span class="sub">' + esc(cap(listWords(words))) + " · " +
        esc(clip(list.slice(0, 4).map(function (e) { return e.name; }).join(", "), 90)) +
        "</span></span>" +
        '<span class="right"><span class="when">' + list.length + "</span>" +
        '<span class="chev" aria-hidden="true">' + G.chev + "</span></span></button>";
    }).join("") + "</div>";
  }

  /* ---------------- one entry's own page ---------------- */

  function libRecPage(e) {
    var k = LIB_KINDS[e.kind] || LIB_KINDS.method;
    var h = openHandle(e);
    var acts = [];
    if (hasBody(e) && e.body) acts.push(btn("lib-copy", e.id, "Copy"));
    if (h.href) {
      acts.push('<a class="btn" href="' + esc(h.href) + '" target="_blank" rel="noopener">' +
        esc(h.label) + "</a>");
    } else if (h.label) acts.push(btn("lib-copy-path", e.id, h.label));
    if (e.kind === "reference") {
      acts.push(btn("cite-edit", e.id, "Citation details"));
      acts.push(btn("cite-one", e.id, "Export this one"));
    }
    acts.push(btn("lib-edit", e.id, "Edit"));
    acts.push(btn("link-add", ref("lib", e.id), "Link it to…"));
    acts.push(btn("lib-del", e.id, "Remove", "btn danger"));

    var out = [crumbTo("library", LIB_PAGE[e.kind], k.many),
      pageHeadOf(e.name,
        esc(k.word) + (isCode(e) ? " · " + esc(e.lang) : "") +
        (e.usedOn ? " · last used " + esc(agoWords(e.usedOn)) : ""),
        acts.join(""))];

    /* THE BODY SITS ABOVE THE FACTS. For every other kind the facts are
       the point; here five rows of table over the body would put the
       answer below the fold on a phone. */
    if (hasBody(e)) {
      if (e.body) {
        var lines = e.body.split("\n").length;
        out.push('<div class="blk"><div class="blkhead">' +
          '<span class="label">' + (isCode(e) ? esc(e.lang) : "Written out") + "</span>" +
          '<span class="when">' + countWords(lines, "line", "lines") + "</span>" +
          btn("lib-copy", e.id, "Copy", "btn tiny") + "</div>" +
          /* CODE DOES NOT WRAP; PROSE DOES. Wrapping code at forty
             characters changes what it says, and setting a method in the
             code box makes the one kind written to be READ scroll
             sideways at its first long sentence. */
          "<pre class=\"" + (isCode(e) ? "snip" : "wrote") + "\">" + esc(e.body) + "</pre></div>");
      } else {
        out.push('<div class="panel">' + emptyLines("Nothing written in it yet.",
          "Press Edit and paste the " + (isCode(e) ? "code" : "text") + " in. Leading " +
          "whitespace is kept exactly — it is what a Python block means.") + "</div>");
      }
    }

    if (e.kind === "reference") out.push(citePanel(e));

    if (h.how) {
      out.push('<div class="panel drift" style="margin-top:0.8rem">' +
        '<p class="says">' + esc(h.how) + "</p></div>");
    }

    var rows = [
      ["What it is", esc(k.word) + " — " + esc(k.says)],
      isCode(e) ? ["Written in", esc(e.lang)] : null,
      e.path ? ["Path", '<span style="font-family:var(--mono);font-size:var(--fs-xs)">' +
        esc(e.path) + "</span>"] : null,
      e.url ? ["Link", '<a href="' + esc(e.url) + '" target="_blank" rel="noopener">' +
        esc(clip(e.url, 64)) + "</a>"] : null,
      ["What it is about", (e.topics || []).length
        ? e.topics.map(function (t) {
            return '<button class="chip" data-act="lib-topic" data-id="' + esc(t) + '">' +
              esc(t) + "</button>";
          }).join(" ")
        : unsaid("no subject on it yet")],
      ["Last used", e.usedOn ? esc(partDate(e.usedOn)) : unsaid()],
      ["Put in", e.madeOn ? esc(partDate(e.madeOn)) : unsaid()]
    ];
    out.push('<div style="margin-top:0.9rem">' + factRows(rows) + "</div>");
    out.push(notePanel(e));

    /* WHERE IT IS USED — the half of the reason the library is part of the
       career system rather than a notebook. */
    var uses = libUses(e);
    out.push(sectHead("Where it is used", uses.length));
    if (uses.length) out.push(refRows(uses));
    else {
      out.push('<div class="panel">' + emptyLines("Not linked to anything yet.",
        "Press “Link it to…” and name the project, workflow, skill or " +
        "training it belongs with. That is what makes it findable six months from now.") +
        "</div>");
    }
    if ((e.topics || []).length) {
      var kin = [];
      e.topics.forEach(function (t) {
        libByTopic(t).forEach(function (o) {
          if (o.id !== e.id && kin.indexOf(o) < 0) kin.push(o);
        });
      });
      if (kin.length) {
        out.push(sectHead("Else on the same subject", kin.length));
        out.push(rowsOf("lib", kin));
      }
    }
    return out.join("");
  }

  function citePanel(e) {
    var rows = citeRows(e), c = citeOf(e), gaps = citeComplete(e);
    var out = ['<div class="panel" style="margin-top:0.8rem">' +
      '<span class="label">As it would be cited</span>' +
      '<p class="serif" style="margin:0.35rem 0 0;font-size:var(--fs-lg);line-height:1.45">' +
      esc(plainCite(e)) + "</p>" +
      '<p class="says">In text: ' + esc(citeInText(e)) +
      " · cite key <span style=\"font-family:var(--mono)\">" + esc(citeKey(e)) +
      "</span></p>" +
      '<div class="page-acts" style="margin-top:0.6rem">' +
      btn("cite-one", e.id, "Copy the full citation") +
      btn("cite-key", e.id, "Copy \u201c" + citeInText(e) + "\u201d") +
      btn("cite-edit", e.id, "Citation details") + "</div></div>"];
    if (gaps.length) {
      out.push('<div class="panel drift"><p class="says">It has no ' +
        esc(listWords(gaps)) + ". A bibliography entry with a hole in it is worse than " +
        "a missing one, so add " + (gaps.length === 1 ? "it" : "them") +
        " before you export.</p></div>");
    }
    out.push('<div style="margin-top:0.8rem"><span class="label">Citation record</span>' +
      '<div style="margin-top:0.3rem">' + factRows(
        [["Type", esc(citeType(c.type).label)]].concat(rows.map(function (r) {
          return [r.k, r.key === "url"
            ? '<a href="' + esc(r.v) + '" target="_blank" rel="noopener">' + esc(clip(r.v, 60)) + "</a>"
            : r.key === "doi"
              ? '<a href="https://doi.org/' + esc(r.v.replace(/^https?:\/\/(dx\.)?doi\.org\//, "")) +
                '" target="_blank" rel="noopener">' + esc(r.v) + "</a>"
              : esc(r.v)];
        }))) + "</div></div>");
    return out.join("");
  }

  function crumbTo(tab, page, word) {
    /* BACK IS A CONTROL, NOT A KEY. Escape does it too, but a phone has no
       Escape — a route that can only be reached from a keyboard is not a
       route. The crumb goes to the list; Back goes where you came from. */
    return '<div class="crumbs">' +
      '<button class="bcrumb" data-act="back" title="Back">' +
      '<span aria-hidden="true">‹</span> Back</button>' +
      '<span class="sep">·</span>' +
      '<button class="bcrumb" data-act="page" data-id="' + tab + "|" + page + '">' +
      esc(word) + '</button><span class="sep">›</span></div>';
  }

  /* ============================================================
     CAREER — who I am professionally.

     Six pages, and the one rule that keeps them honest: a Career page
     never holds a fact that a Work record already holds. A role's
     projects are the projects that name it; a skill's evidence is the
     records that link to it; the Timeline is DERIVED from the dates
     already on education, roles, training, projects and outputs, so
     nothing is typed twice and no two screens can disagree about when
     something happened.
     ============================================================ */

  function renderCareer() {
    var page = pageNow("career");
    if (page === "profile") return profilePage();
    if (page === "timeline") return timelinePage();
    var p = PAGES.career.filter(function (x) { return x.id === page; })[0];
    var kind = p.kind, list = listOf(kind);
    var out = [];
    if (kind === "role") {
      out.push(pageHeadOf("Experience",
        "A role is a real professional engagement, and it is the bridge between " +
        "who you are and what you did: an employer, a title, dates, and the projects " +
        "that ran under it.",
        btn("role-add", "", "New role", "btn primary") +
        btn("job-add", "", "New employer")));
    } else if (kind === "education") {
      out.push(pageHeadOf("Education",
        "Degrees and programmes: where you did them, when, and how they came out.",
        btn("edu-add", "", "New education", "btn primary")));
    } else if (kind === "training") {
      out.push(pageHeadOf("Training",
        "Training is a record, not a PDF in a folder — it has who gave it, a " +
        "date, a certificate and, most of all, the SKILLS it taught, which is what " +
        "turns training into evidence.",
        btn("train-add", "", "New training", "btn primary")));
    } else {
      out.push(pageHeadOf("Skills",
        "A skill here is not a word on a list: it is a word with EVIDENCE under it — " +
        "the training that taught it, the projects that used it, the workflows that " +
        "apply it, the outputs that demonstrate it and the library entries that support " +
        "it. Nothing is scored and no proficiency is inferred.",
        btn("skill-add", "", "New skill", "btn primary")));
    }
    out.push(pageStrip("career"));
    if (!list.length) {
      var word = { role: "Experience", education: "Education", training: "Training",
        skill: "Skills" }[kind];
      out.push('<div class="panel">' + emptyLines(
        "Nothing under " + word + " yet.",
        kind === "role" ? "Add an employer first if you like, then a role under it — " +
          "or just add the role and name the employer in it."
        : kind === "skill" ? "Press New skill, then link it to the training that taught " +
          "it and the projects that used it. The links are the point."
        : "Press New " + word.toLowerCase() + ".") + "</div>");
      return out.join("");
    }
    if (kind === "skill") out.push(skillsList(list));
    else if (kind === "role") out.push(rolesList(list));
    else {
      out.push(rowsOf(kind, list.slice().sort(byDateDesc), {}));
    }
    return out.join("");
  }
  function byDateDesc(a, b) {
    var da = a.startedOn || a.endedOn || a.on || "";
    var db = b.startedOn || b.endedOn || b.on || "";
    if (da !== db) return da < db ? 1 : -1;
    return String(a.name || a.title || "").localeCompare(String(b.name || b.title || ""));
  }

  /* Roles, grouped under their employer, because a job holds many roles
     over years and a flat list of titles loses which organisation each one
     was at. Work under no employer keeps its own heading rather than being
     hidden — a role on your own account is a real role. */
  function rolesList(list) {
    var out = [], seen = {};
    state.jobs.forEach(function (j) {
      var rs = jobRoles(j.id);
      if (!rs.length) return;
      rs.forEach(function (r) { seen[r.id] = 1; });
      out.push(sectHead(j.name, rs.length));
      out.push(rowsOf("role", rs.slice().sort(byDateDesc), { knows: { job: 1 } }));
    });
    var loose = list.filter(function (r) { return !seen[r.id]; });
    if (loose.length) {
      out.push(sectHead("Under no employer", loose.length));
      out.push(rowsOf("role", loose.slice().sort(byDateDesc), {}));
    }
    return out.join("");
  }

  /* Skills grouped by the group YOU typed, because "GIS" and "Field" and
     "Languages" are not a vocabulary this app could have known. A skill
     with no group sits under its own heading rather than being filed
     somewhere it was not put. */
  function skillsList(list) {
    var out = [], by = {}, order = [];
    list.forEach(function (s) {
      var g = (s.group || "").trim() || "—";
      if (!by[g]) { by[g] = []; order.push(g); }
      by[g].push(s);
    });
    order.sort(function (a, b) {
      if (a === "—") return 1;
      if (b === "—") return -1;
      return a.localeCompare(b);
    });
    var bare = list.filter(function (s) { return !skillEvidenceCount(s.id); });
    if (bare.length) {
      out.push('<div class="panel drift"><span class="label">No evidence yet</span>' +
        '<p class="says">' + cap(countWords(bare.length, "skill", "skills")) +
        (bare.length === 1 ? " has" : " have") + " nothing linked to " +
        (bare.length === 1 ? "it" : "them") + ": " +
        esc(clip(bare.map(function (s) { return s.name; }).join(", "), 120)) +
        ". A skill with no evidence is a word on a list, which is what this page " +
        "exists not to be.</p></div>");
    }
    order.forEach(function (g) {
      out.push(sectHead(g === "—" ? "No group said" : g, by[g].length));
      out.push(rowsOf("skill", by[g].slice().sort(function (a, b) {
        var d = skillEvidenceCount(b.id) - skillEvidenceCount(a.id);
        return d || String(a.name).localeCompare(String(b.name));
      }), {}));
    });
    return out.join("");
  }

  /* ---------------- the profile ----------------

     The one thing in the app that cannot be derived from anything else,
     and therefore the one thing that is typed. Blank is a first-class
     answer everywhere: the rail reads "Mashghal" and Home greets the hour.
     It is NOT a CV text box — it is the record a CV is later built from. */

  function profilePage() {
    var pr = state.profile;
    var out = [pageHeadOf("Profile",
      "Who you are professionally. This is the record, not a CV — a CV is a " +
      "selection out of it, and there can be several.",
      btn("profile-edit", "", "Edit", "btn primary"))];
    out.push(pageStrip("career"));
    if (!pr.name && !pr.headline && !pr.summary) {
      out.push('<div class="panel">' + emptyLines("Nothing written yet.",
        "Press Edit. Only a name is needed; everything else can wait, and blank " +
        "stays blank rather than being filled in for you.") + "</div>");
      return out.join("");
    }
    out.push('<div class="panel"><div style="display:flex;gap:0.8rem;align-items:flex-start">' +
      itile("role", null, true) +
      '<div class="grow"><h3>' + esc(pr.name || "No name yet") + "</h3>" +
      (pr.headline ? '<p class="says" style="font-size:var(--fs-md);color:var(--dim)">' +
        esc(pr.headline) + "</p>" : "") +
      "</div></div>" +
      (pr.summary ? '<p style="margin:0.7rem 0 0;white-space:pre-wrap">' +
        esc(pr.summary) + "</p>" : "") + "</div>");

    out.push('<div style="margin-top:0.9rem">' + factRows([
      ["Fields", pr.fields ? esc(pr.fields) : unsaid()],
      ["Areas of interest", pr.interests ? esc(pr.interests) : unsaid()],
      ["Where", pr.place ? esc(pr.place) : unsaid()],
      ["Email", pr.email ? '<a href="mailto:' + esc(pr.email) + '">' + esc(pr.email) + "</a>" : unsaid()],
      ["Phone", pr.phone ? esc(pr.phone) : unsaid()],
      ["Site", pr.site ? '<a href="' + esc(pr.site) + '" target="_blank" rel="noopener">' +
        esc(clip(pr.site, 56)) + "</a>" : unsaid()]
    ]) + "</div>");

    /* THE PROFILE IS A LEAD, NOT A COPY. Each of these is the count its
       own page holds, read from that page's own list. */
    var career = getCareerProjects();
    var n = {
      roles: state.roles.length, education: state.education.length,
      training: state.training.length, skills: state.skills.length
    };
    out.push(sectHead("What is under it"));
    out.push('<div class="tiles">' +
      tile("Roles", String(n.roles), n.roles ? "across " +
        countWords(state.jobs.length, "employer", "employers") : "none yet") +
      tile("Education", String(n.education), "") +
      tile("Training", String(n.training), n.training ? countWords(
        state.training.filter(function (t) { return getTrainingSkills(t.id).length; }).length,
        "with a skill on it", "with skills on them") : "none yet") +
      tile("Skills", String(n.skills), n.skills ? countWords(
        state.skills.filter(function (s) { return skillEvidenceCount(s.id); }).length,
        "with evidence", "with evidence") : "none yet") +
      /* `getCareerProjects()` leaves ARCHIVED work out and keeps completed
         work in, which is the right reading for a career figure: finished
         is the point, and archived is work you have put out of sight. The
         sub-line says so, or the tile and the Projects page disagree by a
         number nobody can account for. */
      tile("Projects", String(career.length), career.length
        ? (state.projects.length > career.length
            ? countWords(state.projects.length - career.length, "archived one",
                "archived ones") + " left out"
            : "completed work included")
        : "none yet") +
      "</div>");
    return out.join("");
  }

  /* ---------------- the timeline ----------------

     DERIVED. If a training's start date is X, the timeline gets X from the
     training — it is not a second database of career events, because a
     second one would eventually disagree with the first. Every row opens

      return '<div class="tyear">' + esc(y.year) + "</div>" + y.events.map(function (e) {

  /* ---------------- the record pages ---------------- */

  function jobPage(j) {
    var roles = jobRoles(j.id), projects = jobProjects(j.id);

      pageHeadOf(j.name, [j.kind, j.place].filter(Boolean).map(esc).join(" · "),

    ]));

    /* AN EMPLOYER HOLDS ROLES AND PROJECTS, AND THEY ARE DIFFERENT

       projects under each — printing a project under both its role and its
       employer would make the page read as though there were two of
       everything, so a project filed under a role is named there and only
       the ones filed under the employer alone appear here. */
    out.push(sectHead("Roles", roles.length));

  function eduPage(e) {

    out.push(factRows([

  function trainPage(t) {
    var skills = getTrainingSkills(t.id);
    /* THE CERTIFICATE IS ONE FIELD AND IT HOLDS TWO KINDS OF THING — a
       number you quote or a link you open — so which control is offered
       is decided by what is actually in it. Offering "Open it" on a
       certificate number would be a button that cannot do what it says. */
    var cert = (t.ref || "").trim();
    var certLink = /^https?:\/\//i.test(cert);
    var acts = btn("train-edit", t.id, "Edit", "btn primary") +
      btn("link-add", ref("training", t.id), "Link a skill it taught…");
    if (cert && certLink) {
      acts += '<a class="btn" href="' + esc(cert) + '" target="_blank" rel="noopener">' +
        "Open the certificate</a>";
    } else if (cert) {
      acts += btn("train-copy", t.id, "Copy the certificate line");
    }
    acts += btn("train-del", t.id, "Remove", "btn danger");
    var out = [crumbTo("career", "training", "Training"),
      pageHeadOf(t.name,
        [t.org, t.kind, t.on ? partDate(t.on) : ""]
          .filter(Boolean).map(esc).join(" · "), acts)];
    out.push(factRows([
      ["Who gave it", t.org ? esc(t.org) : unsaid()],
      ["Kind", t.kind ? esc(t.kind) : unsaid()],
      ["When", t.on ? esc(partDate(t.on)) : unsaid()],
      ["Hours", num(t.hours) > 0 ? esc(hm(num(t.hours) * 60))
        : unsaid("not counted in hours")],
      ["Certificate", cert
        ? (certLink
            ? '<a href="' + esc(cert) + '" target="_blank" rel="noopener">' +
              esc(clip(cert, 56)) + "</a>"
            : '<span style="font-family:var(--mono);font-size:var(--fs-xs)">' +
              esc(cert) + "</span>")
        : unsaid("not recorded")]
    ]));
    out.push(notePanel(t));
    /* TRAINING → SKILL → PROJECT → EVIDENCE is the chain the plan asks
       for, and this is its first link. */
    out.push(sectHead("Skills it taught", skills.length));
    if (skills.length) {
      out.push(refRows(skills));
      var onward = [];
      skills.forEach(function (s) {
        getSkillEvidence(parseRef(s).id).projects.forEach(function (p) {
          if (onward.indexOf(p) < 0) onward.push(p);
        });
      });
      if (onward.length) {
        out.push(sectHead("And the projects those skills were used on", onward.length));
        out.push(refRows(onward));
        out.push('<p class="says">That chain — training taught a skill, the skill ' +
          "was used on a project — is read off the links, not claimed. It is the " +
          "evidence, and it is why the training is worth recording as a record " +
          "rather than a PDF in a folder.</p>");
      }
    } else {
      out.push('<div class="panel">' + emptyLines("No skill linked to it yet.",
        "Press “Link a skill it taught…”. Without that, training is a " +
        "certificate; with it, training is evidence.") + "</div>");
    }
    var cv2 = tied(ref("training", t.id), "picks").filter(recOf);
    if (cv2.length) { out.push(sectHead("On these CVs", cv2.length)); out.push(refRows(cv2)); }
    return out.join("");
  }

  function skillPage(s) {
    var e = getSkillEvidence(s.id), lv = levelLabel(s.level);
    var total = skillEvidenceCount(s.id);
    var out = [crumbTo("career", "skills", "Skills"),
      pageHeadOf(s.name, [s.group, lv].filter(Boolean).map(esc).join(" · ") ||
        "No group or level said.",
        btn("skill-edit", s.id, "Edit", "btn primary") +

    /* THE EVIDENCE IS THE POINT, and the app states it rather than
       scoring it. There is no bar here, no "3 years", no percentage: a
       count of real records and a route into each one. */
    out.push('<div class="panel"><span class="label">Evidence</span>' +
      '<p class="says">' + esc(skillSays(s)) + "</p>" +
      (lv ? '<p class="says">You have written the level down as <b>' + esc(lv) +
        "</b>. That is yours: nothing here infers it, and there is no score.</p>"
        : '<p class="says">No level written down, and none is guessed. What is ' +
          "below is what the record actually holds.</p>") + "</div>");

    out.push(factRows([
      ["Group", s.group ? esc(s.group) : unsaid()],
      ["Level", lv ? esc(lv) : unsaid("not said, and not inferred")],
      ["Evidence", total ? esc(countWords(total, "record", "records")) + " linked to it"
        : unsaid("nothing linked yet")]
    ]));
    out.push(notePanel(s));

    [["Learned through", e.training, "training"],
     ["Used in", e.projects, "project"],
     ["Applied through", e.workflows, "workflow"],
     ["Demonstrated by", e.outputs, "output"],
     ["Supported by the library", e.lib, "lib"],
     ["Evidenced by a role", e.roles, "role"],
     ["Shown in the portfolio", e.portfolio, "portfolio"]
    ].forEach(function (pair) {

      out.push(sectHead(pair[0], pair[1].length));
      out.push(refRows(pair[1]));
    });

      out.push('<div class="panel">' + emptyLines("Nothing is linked to it.",
        "Press “Link evidence…” and name the training that taught it or a " +
        "project that used it. A skill with no evidence is a word on a list.") + "</div>");
    }
    var cv3 = tied(ref("skill", s.id), "picks").filter(recOf);
    if (cv3.length) { out.push(sectHead("On these CVs", cv3.length)); out.push(refRows(cv3)); }
    return out.join("");
  }

  /* ============================================================
     WORK — what I am doing and have done.

     The operational layer, and it is UNDER the career rather than beside
     it: a project names the role it ran under, so the same record is a
     current project here and evidence of experience there. Two rules from
     the plan matter most on these pages:

       A WORKFLOW IS THE PROCEDURE AND A RUN IS ONE EXECUTION OF IT.
       "Photogrammetry processing" is one workflow used on three projects;
       each use is a run. That is why `getWorkflowProjects()` walks the
       runs rather than reading a list off either side.

       ACTIONS BELONG TO WORK AND DO NOT BECOME THE APP. The plan is
       explicit that this must not turn into a to-do list, so Actions is
       one page of one tab, and nothing else in the app is a task.
     ============================================================ */

  function renderWork() {
    var page = pageNow("work");
    if (page === "hours") return hoursPage();
    var p = PAGES.work.filter(function (x) { return x.id === page; })[0];
    var kind = p.kind, list = listOf(kind);
    var out = [];
    var head = {
      project: ["Projects", "A project is a specific body of work. It names the employer " +
        "and the role it ran under, which is what connects it upward to the career and " +
        "downward to the workflows, actions and outputs under it.",
        btn("proj-add", "", "New project", "btn primary")],
      workflow: ["Workflows", "How you actually perform a kind of work. One workflow is " +
        "reused across projects — each use is a run — which is exactly the " +
        "distinction that makes a procedure worth writing down once.",
        btn("wf-add", "", "New workflow", "btn primary")],
      action: ["Actions", "What happens next. Late first, because that is the only thing " +
        "that cannot wait.", btn("act-add", "", "New action", "btn primary")],
      person: ["People", "Who you work with, and what is outstanding with them.",
        btn("person-add", "", "New person", "btn primary")],
      asset: ["Equipment", "What the work depends on, where it is and when it was last " +
        "used — all three stated, because no walk of the record can tell a machine in " +
        "the van from one back on the bench.",
        btn("asset-add", "", "New equipment", "btn primary")],
      output: ["Outputs", "What the work produced. An output is the evidence a project " +
        "actually finished something, and it is what a portfolio item and a skill both " +
        "point at.", btn("out-add", "", "New output", "btn primary")],
      job: ["Employers", "The organisations. An employer holds roles, and roles hold " +
        "projects — one organisation over years.",
        btn("job-add", "", "New employer", "btn primary")]
    }[kind];
    out.push(pageHeadOf(head[0], head[1], head[2]));
    out.push(pageStrip("work"));

    if (kind === "action") return out.join("") + actionsPage();
    if (!list.length) {
      /* The empty line NAMES the button. "Press the button above" was on
         six screens at once and points at nothing a reader could search
         for or be told about. The page's own heading is the noun, not
         `KINDS[kind].many` — this page is called Employers and Equipment,
         not Jobs and Assets. */
      out.push('<div class="panel">' + emptyLines(
        "Nothing under " + head[0] + " yet.",
        "Press " + btnWord(head[2]) + ".") + "</div>");
      return out.join("");
    }
    if (kind === "project") out.push(projectsList(list));
    else if (kind === "output") out.push(outputsList(list));
    else out.push(rowsOf(kind, list.slice().sort(byName), {}));
    return out.join("");
  }

  function projectsList(list) {
    var out = [];
    /* Chips by the STATED status, counted, plus one derived chip for past
       its date — which is the one reading allowed to override the word. */
    var by = {}, over = 0;
    list.forEach(function (p) {
      by[p.status || ""] = (by[p.status || ""] || 0) + 1;
      if (projOverdue(p)) over++;
    });
    var chips = ['<button class="chip" data-act="proj-filter" data-id=""' +
      (projFilter ? "" : ' aria-pressed="true"') + ">All · " + list.length + "</button>"];
    if (over) {
      chips.push('<button class="chip" data-act="proj-filter" data-id="overdue"' +
        (projFilter === "overdue" ? ' aria-pressed="true"' : "") +
        ">Past its date · " + over + "</button>");
    }
    PROJ_STATUS.forEach(function (s) {
      if (!by[s.value]) return;
      chips.push('<button class="chip" data-act="proj-filter" data-id="' + s.value + '"' +
        (projFilter === s.value ? ' aria-pressed="true"' : "") + ">" + esc(s.label) +
        " · " + by[s.value] + "</button>");
    });
    if (by[""]) {
      chips.push('<button class="chip" data-act="proj-filter" data-id="none"' +
        (projFilter === "none" ? ' aria-pressed="true"' : "") +
        ">No status · " + by[""] + "</button>");
    }
    if (chips.length > 1) {
      out.push('<div class="chips" style="margin-bottom:0.6rem">' + chips.join("") + "</div>");
    }
    var show = list;
    if (projFilter === "overdue") show = list.filter(projOverdue);
    else if (projFilter === "none") show = list.filter(function (p) { return !p.status; });
    else if (projFilter) show = list.filter(function (p) { return p.status === projFilter; });
    /* Worst first, off `projStand()`, so this list can never rank a
       project differently from the way its own page describes it. */
    show = show.slice().sort(function (a, b) {
      var order = { late: 0, drift: 1, hand: 2, calm: 3, done: 4 };
      var d = (order[projStand(a).tone] || 9) - (order[projStand(b).tone] || 9);
      return d || byDateDesc(a, b);
    });
    if (!show.length) {
      out.push('<div class="panel">' + emptyLines("Nothing on that chip.",
        "The counts beside each chip say where the projects are.") + "</div>");
      return out.join("");
    }
    out.push(rowsOf("project", show, {}));
    return out.join("");
  }

  function outputsList(list) {
    var out = [], by = {}, order = [];
    list.slice().sort(function (a, b) {
      return (b.on || "").localeCompare(a.on || "");
    }).forEach(function (o) {
      var y = yearOf(o.on) || "No date";
      if (!by[y]) { by[y] = []; order.push(y); }
      by[y].push(o);
    });
    order.forEach(function (y) {
      out.push(sectHead(y, by[y].length));
      out.push(rowsOf("output", by[y], {}));
    });
    return out.join("");
  }

  function actionsPage() {
    var n = rungCounts(), out = [];
    if (!state.actions.length) {
      return '<div class="panel">' + emptyLines("No actions yet.",
        "An action belongs to a project and answers one question: what happens next.") +
        "</div>";
    }
    /* THE TILES ARE THE LIST'S OWN PARTS. The rungs partition every
       action, so a figure here can never disagree with what is under it —
       and there is a test that adds them up. */
    out.push('<div class="tiles">' +
      tile("Late", String(n.late), n.late ? "past a day or a chase" : "nothing past its day",
        n.late ? "late" : "") +
      tile("Today", String(n.today), n.today ? "dated today" : "nothing dated today",
        n.today ? "hand" : "") +
      tile("In hand", String(n.hand), n.hand ? "nothing in the way" : "nothing free to start",
        n.hand ? "hand" : "") +
      tile("Waiting", String(n.waiting),
        n.waiting ? "on somebody, or on something" : "on nobody and nothing") +
      tile("Done", String(n.done), "") + "</div>");
    ["late", "today", "hand", "waiting", "done"].forEach(function (k) {
      var list = worstActions(onRung(k));
      if (!list.length) return;
      out.push(sectHead(RUNGS[k].word, list.length));
      out.push(rowsOf("action", k === "done" ? list.slice(0, 20) : list, {
        extra: list === undefined ? [] : []
      }));
      if (k === "done" && list.length > 20) {
        out.push('<p class="empty">' + (list.length - 20) + " more done, not listed.</p>");
      }
    });
    return out.join("");
  }

  function hoursPage() {
    var months = hoursMonths();
    var total = hoursFor();
    var out = [pageHeadOf("Hours",
      "Time against a project, summed from the entries and never stored as a total — " +
      "so no figure here can drift from the record. Nothing is scored and nothing is " +
      "compared to a target you did not set.",
      btn("hours-add", "", "Log time", "btn primary") +
      (state.hours.length ? btn("hours-export", "", "Export as CSV") : ""))];
    out.push(pageStrip("work"));
    if (!state.hours.length) {
      out.push('<div class="panel">' + emptyLines("No time logged.",
        "Press Log time. A project, a day and a number of minutes is all it takes.") +
        "</div>");
      return out.join("");
    }
    out.push('<div class="tiles">' +
      tile("All of it", hm(total), countWords(state.hours.length, "entry", "entries")) +
      tile("This month", hm(hoursFor("", today().slice(0, 7) + "-01", today())),
        partDate(today().slice(0, 7))) +
      tile("Projects with time on them",
        String(Object.keys(state.hours.reduce(function (m, h) {
          if (h.projectId) m[h.projectId] = 1; return m;
        }, {})).length), "") + "</div>");
    /* By project, because "how long did that take" is the question, and
       the figure names the entries it came from. */
    var byProj = {};
    state.hours.forEach(function (h) {
      var k = h.projectId || "";
      byProj[k] = (byProj[k] || 0) + num(h.minutes);
    });
    out.push(sectHead("By project", Object.keys(byProj).length));
    out.push('<table class="tbl"><thead><tr><th>Project</th><th class="num">Entries</th>' +
      '<th class="num">Time</th></tr></thead><tbody>' +
      Object.keys(byProj).sort(function (a, b) { return byProj[b] - byProj[a]; })
        .map(function (k) {
          var ents = state.hours.filter(function (h) { return (h.projectId || "") === k; });
          return "<tr><td>" + (k
            ? '<button class="bcrumb" data-act="open" data-id="' + esc(ref("project", k)) +
              '" style="font-weight:600">' + esc(nameOf(ref("project", k))) + "</button>"
