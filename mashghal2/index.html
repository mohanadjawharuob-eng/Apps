  /* ============================================================
     SHOW — the portfolio and the CVs.

     THE ONE RULE, AND IT IS THE PLAN'S OWN: a portfolio item and a CV are
     SELECTIONS OVER THE RECORD, NEVER COPIES OF IT. Nothing here holds a
     job title, a date, a project description or a citation of its own — it
     holds `picks` links at records that already exist. So correcting a
     role's end date corrects every CV that names it, and a CV can never
     quietly describe a version of your career that the rest of the app has
     stopped agreeing with.

     That is also why there is no template, no styling and no PDF: what is
     exported is the text of the selection. A layout would be a second
     record of the same facts, kept somewhere this app cannot see.
     ============================================================ */

  function renderShow() {
    var page = pageNow("show");
    if (page === "cvs") return cvsPage();
    return portfolioPage();
  }

  function portfolioPage() {
    var out = [pageHeadOf("Portfolio",
      "What you can show somebody. A portfolio item is a SELECTION — it points at " +
      "projects, outputs and roles that are already in the record rather than describing " +
      "them again, so nothing here can go out of date on its own.",
      btn("port-add", "", "New portfolio item", "btn primary"))];
    out.push(pageStrip("show"));
    if (!state.portfolio.length) {
      out.push('<div class="panel">' + emptyLines("Nothing in the portfolio yet.",
        "Press New portfolio item, then point it at the work it shows.") + "</div>");
      /* What COULD be shown, so the empty state is a route rather than an
         instruction to think of something. */
      var cand = state.outputs.concat(state.projects.filter(function (p) {
        return p.status === "completed";
      }));
      if (cand.length) {
        out.push(sectHead("Worth showing", cand.length));
        out.push('<p class="says">These are finished already. A portfolio item can point ' +
          "at any of them.</p>");
        out.push(rowsOf("output", state.outputs.slice(0, 8), {}));
      }
      return out.join("");
    }
    out.push('<div class="pcards">' + state.portfolio.slice().sort(byDateDesc)
      .map(function (i) {
        var ev = getPortfolioEvidence(i.id);
        return '<button class="pcard" data-act="open" data-id="' + esc(ref("portfolio", i.id)) +
          '"><span class="pchead">' + itile("portfolio", i) +
          '<span class="grow"><span class="nm">' + esc(i.name) + "</span>" +
          '<span class="sub">' + esc(i.on ? partDate(i.on) : "no date on it") + "</span>" +
          "</span></span>" +
          (i.note ? '<span class="sub">' + esc(clip(i.note, 120)) + "</span>" : "") +
          '<span class="sub">' + (ev.length
            ? esc(countWords(ev.length, "thing", "things")) + " behind it · " +
              esc(clip(ev.map(function (r) { return nameOf(r); }).join(", "), 70))
            : '<span class="unsaid">nothing behind it yet</span>') + "</span></button>";
      }).join("") + "</div>");
    return out.join("");
  }

  function portPage(i) {
    var ev = getPortfolioEvidence(i.id);
    var skills = ofKind(both(ref("portfolio", i.id), "uses"), "skill").filter(recOf);
    var out = [crumbTo("show", "portfolio", "Portfolio"),
      pageHeadOf(i.name, esc(i.on ? partDate(i.on) : "") ,
        btn("port-edit", i.id, "Edit", "btn primary") +
        btn("port-pick", i.id, "Point it at…") +
        btn("port-del", i.id, "Remove", "btn danger"))];
    out.push(notePanel(i));
    out.push(sectHead("What it shows", ev.length));
    if (ev.length) {
      out.push(refRows(ev, { unpick: ref("portfolio", i.id) }));
      out.push('<p class="says">These are the records themselves, not copies of them. ' +
        "Correcting one corrects it here.</p>");
    } else {
      out.push('<div class="panel">' + emptyLines("Nothing behind it.",
        "Press “Point it at…”. A portfolio item with nothing behind it is a " +
        "claim with no evidence, which is the one thing this app will not print for you.") +
        "</div>");
    }
    if (skills.length) {
      out.push(sectHead("Skills it evidences", skills.length));
      out.push(refRows(skills));
    }
    /* The evidence chain, walked one hop further out — a project shown here
       has outputs, and those outputs are what somebody would actually open. */
    var deeper = [];
    ev.forEach(function (r) {
      var p = parseRef(r);
      if (p.kind !== "project") return;
      getProjectOutputs(p.id).forEach(function (o) {
        if (ev.indexOf(ref("output", o.id)) < 0) deeper.push(ref("output", o.id));
      });
    });
    if (deeper.length) {
      out.push(sectHead("Under the projects it shows", deeper.length));
      out.push(refRows(deeper));
      out.push('<p class="says">Not pointed at directly — these are the outputs of the ' +
        "projects above. Point at one if it is the thing you would actually send.</p>");
    }
    return out.join("");
  }

  /* ---------------- CVs ---------------- */

  function cvsPage() {
    var out = [pageHeadOf("CVs",
      "A CV is a selection with an aim: which roles, which training, which skills and " +
      "which work to put in front of THIS reader. Several can exist at once, and none of " +
      "them holds a fact of its own — they all read the same record.",
      btn("cv-add", "", "New CV", "btn primary"))];
    out.push(pageStrip("show"));
    if (!state.cvs.length) {
      out.push('<div class="panel">' + emptyLines("No CVs yet.",
        "Press New CV. Give it an aim — the job or the application it is for — " +
        "then pick what belongs in it.") + "</div>");
      return out.join("");
    }
    out.push('<div class="rows">' + state.cvs.slice().map(function (c) {
      var n = both(ref("cv", c.id), "picks").filter(recOf).length;
      return '<button class="row" data-act="open" data-id="' + esc(ref("cv", c.id)) + '">' +
        itile("cv", c) + '<span class="grow"><span class="nm">' + esc(c.name) + "</span>" +
        '<span class="sub">' + esc([c.aim, n ? countWords(n, "thing", "things") + " in it"
          : "nothing picked yet"].filter(Boolean).join(" · ")) + "</span></span>" +
        '<span class="right"><span class="chev" aria-hidden="true">' + G.chev +
        "</span></span></button>";
    }).join("") + "</div>");
    return out.join("");
  }

  var CV_SECTS = [
    { kind: "role", head: "Experience", says: "the roles, newest first" },
    { kind: "education", head: "Education", says: "degrees and programmes" },
    { kind: "training", head: "Training and certification", says: "courses, workshops, tickets" },
    { kind: "skill", head: "Skills", says: "and each one's evidence is in the record" },
    { kind: "project", head: "Selected projects", says: "" },
    { kind: "output", head: "Outputs", says: "maps, reports, datasets, models" },
    { kind: "lib", head: "Publications and references", says: "formatted as an author–date list" },
    { kind: "portfolio", head: "Portfolio", says: "" }
  ];

  function cvPage(c) {
    var picks = both(ref("cv", c.id), "picks").filter(recOf);
    var out = [crumbTo("show", "cvs", "CVs"),
      pageHeadOf(c.name, esc(c.aim || "No aim stated."),
        btn("cv-edit", c.id, "Edit", "btn primary") +
        btn("cv-pick", c.id, "Put something in it") +
        (picks.length ? btn("cv-build", c.id, "Write it out") : "") +
        btn("cv-del", c.id, "Remove", "btn danger"))];
    if (!picks.length) {
      out.push('<div class="panel">' + emptyLines("Nothing picked yet.",
        "Press “Put something in it”. A CV is a selection, so this list IS the CV.") +
        "</div>");
      return out.join("");
    }
    out.push('<div class="panel"><p class="says">' +
      countWords(picks.length, "thing", "things") + " picked. Nothing below is a copy: " +
      "every line is read off the record when the CV is written out, so correcting a date " +
      "anywhere corrects it here.</p></div>");
    CV_SECTS.forEach(function (s) {
      var got = ofKind(picks, s.kind);
      if (!got.length) return;
      out.push(sectHead(s.head, got.length));
      out.push(refRows(got, { unpick: ref("cv", c.id) }));
    });
    var other = picks.filter(function (r) {
      var k = parseRef(r).kind;
      return !CV_SECTS.some(function (s) { return s.kind === k; });
    });
    if (other.length) {
      out.push(sectHead("Also picked", other.length));
      out.push(refRows(other, { unpick: ref("cv", c.id) }));
    }
    /* WHAT IS MISSING IS NAMED, because a CV with no experience section is
       a document somebody is about to send. It is a note and not a refusal:
       an early-career CV legitimately leads on training. */
    var gaps = [];
    if (!ofKind(picks, "role").length && state.roles.length) gaps.push("no experience");
    if (!ofKind(picks, "education").length && state.education.length) gaps.push("no education");
    if (!ofKind(picks, "skill").length && state.skills.length) gaps.push("no skills");
    if (!state.profile.name) gaps.push("no name on the profile");
    if (gaps.length) {
      out.push('<div class="panel drift"><p class="says">' + cap(listWords(gaps)) +
        " — and the record has something to put there. Press “Put something in " +
        "it”, or leave it out on purpose.</p></div>");
    }
    out.push('<details class="fold"><summary><span class="label">What gets written out' +
      "</span></summary><div class=\"foldbody\"><pre class=\"snip\">" +
      esc(cvText(c)) + "</pre></div></details>");
    return out.join("");
  }

  /* cvText(cv) — the CV as plain text, read off the record at the moment
     it is asked for. Every line comes from the same function a screen uses,
     so the document and the app cannot disagree; and it states what it is
     rather than pretending to be a formatted CV. */
  function cvText(c) {
    var p = state.profile || {}, L = [];
    var picks = both(ref("cv", c.id), "picks").filter(recOf);
    if (p.name) L.push(p.name.toUpperCase());
    if (p.headline) L.push(p.headline);
    var contact = [p.email, p.phone, p.site, p.place].filter(Boolean).join("  ·  ");
    if (contact) L.push(contact);
    L.push("");
    if (p.summary) { L.push(p.summary); L.push(""); }

    CV_SECTS.forEach(function (s) {
      var got = ofKind(picks, s.kind).map(recOf).filter(Boolean);
      if (!got.length) return;
      L.push(s.head.toUpperCase());
      L.push(new Array(Math.min(s.head.length, 40) + 1).join("-"));
      if (s.kind === "role") {
        got.slice().sort(byDateDesc).forEach(function (r) {
          L.push(r.name + (r.jobId ? ", " + nameOf(ref("job", r.jobId)) : "") +
            (r.place ? ", " + r.place : ""));
          L.push("  " + spanWords(r.startedOn, r.endedOn));
          if (r.note) L.push("  " + r.note);
          /* Experience is where the plan wants projects to appear UNDER the
             role rather than as a separate list — and only the ones this CV
             picked, because a CV is a selection at every level. */
          getExperienceProjects(r.id).forEach(function (pr) {
            if (picks.indexOf(ref("project", pr.id)) < 0) return;
            L.push("  • " + pr.name + " (" + spanWords(pr.startedOn, pr.endedOn) + ")");
          });
          L.push("");
        });
      } else if (s.kind === "education") {
        got.slice().sort(byDateDesc).forEach(function (e) {
          L.push(e.name + (e.org ? ", " + e.org : ""));
          L.push("  " + spanWords(e.startedOn, e.endedOn) +
            (e.result ? " · " + e.result : ""));
          if (e.note) L.push("  " + e.note);
          L.push("");
        });
      } else if (s.kind === "training") {
        got.slice().sort(byDateDesc).forEach(function (t) {
          L.push(t.name + (t.org ? ", " + t.org : "") +
            (t.on ? " · " + partDate(t.on) : ""));
          if (t.hours) L.push("  " + hm(num(t.hours) * 60));
          if (t.ref) L.push("  Certificate: " + t.ref);
          L.push("");
        });
      } else if (s.kind === "skill") {
        /* NO PROFICIENCY IS PRINTED THAT WAS NOT TYPED. A level the app
           worked out from how many projects used a skill would be a number
           dressed as a fact, which is the one thing the plan forbids by
           name — so a skill with nothing stated prints its evidence count
           instead, which is checkable. */
        var byGroup = {}, order = [];
        got.forEach(function (sk) {
          var g = sk.group || "";
          if (!byGroup[g]) { byGroup[g] = []; order.push(g); }
          byGroup[g].push(sk);
        });
        order.forEach(function (g) {
          var names = byGroup[g].map(function (sk) {
            var lv = levelLabel(sk.level);
            var n = skillEvidenceCount(sk.id);
            return sk.name + (lv ? " (" + lv.toLowerCase() + ")"
              : n ? " (" + n + ")" : "");
          });
          L.push((g ? g + ": " : "") + names.join(", "));
        });
        L.push("");
        L.push("  A figure in brackets is how many records evidence that skill.");
        L.push("  Where a level is given it is one that was typed, not inferred.");
        L.push("");
      } else if (s.kind === "lib") {
        bibSort(got).forEach(function (e) { L.push(plainCite(e)); });
        L.push("");
      } else if (s.kind === "project") {
        got.slice().sort(byDateDesc).forEach(function (pr) {
          L.push(pr.name + (pr.jobId ? ", " + nameOf(ref("job", pr.jobId)) : ""));
          L.push("  " + spanWords(pr.startedOn, pr.endedOn));
          if (pr.note) L.push("  " + pr.note);
          var outs = getProjectOutputs(pr.id);
          if (outs.length) {
            L.push("  Produced: " + outs.map(function (o) { return o.name; }).join("; "));
          }
          L.push("");
        });
      } else if (s.kind === "output") {
        got.slice().sort(byDateDesc).forEach(function (o) {
          L.push(o.name + (o.kind ? " (" + o.kind + ")" : "") +
            (o.on ? " · " + partDate(o.on) : "") +
            (o.projectId ? " · " + nameOf(ref("project", o.projectId)) : ""));
        });
        L.push("");
      } else {
        got.forEach(function (r) {
          L.push(recName(ref(LIST_FOR[s.kind] ? s.kind : s.kind, r.id)) || r.name);
          if (r.note) L.push("  " + r.note);
        });
        L.push("");
      }
    });

    L.push("");
    L.push("--");
    L.push("Written out of Mashghal on " + partDate(today()) + " · " + BUILD + ".");
    L.push("This is the text of a selection, not a formatted CV: every line above is read");
    L.push("off the record, so a correction there is a correction here. It carries no");
    L.push("house style — paste it into whatever the reader expects.");
    return L.join("\n").replace(/\n{3,}/g, "\n\n");
  }

  /* cvBuild — hands the text over the way every other export in these apps
     does: a dialog you can read, copy out of and save from, so nothing
     depends on a download working. */
  function cvBuild(c) {
    var text = cvText(c);
    var picks = both(ref("cv", c.id), "picks").filter(recOf);
    handOver("cv-" + (c.name || "mashghal").toLowerCase().replace(/[^a-z0-9]+/g, "-") +
      ".txt", text, "Your CV, written out",
      cap(countWords(picks.length, "record", "records")) + " read off the book just now.");
  }

  /* ============================================================
     HOME — the three worlds at once, and nothing of its own.

     The plan puts Home late (phase 9) for a reason worth keeping: a
     dashboard built first becomes the app, and everything behind it
     becomes a place the dashboard links to. Built last it can be what it
     should be — FOUR QUESTIONS, each one a card that is also the route to
     the screen answering it in full.

     NOTHING ON HOME IS STORED AND NOTHING ON IT IS COMPUTED HERE. Every
     figure comes from the selector the screen it points at uses, so Home
     cannot drift from the rest of the app. There is a test that reads the
     attention card against the Actions page's own tiles.
     ============================================================ */

  function renderHome() {
    if (emptyBook()) return firstRun();
    var out = [];
    var who = (state.profile.name || state.settings.owner || "").trim().split(/\s+/)[0];
    var h = new Date().getHours();
    var hour = h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
    out.push('<div class="page-head"><div class="ph-main"><h1>' +
      esc(who ? hour + ", " + who + "." : hour + ".") + "</h1>" +
      '<p class="sub">' + esc(state.profile.headline ||
        "Your career, your work and what you know — one record, seen four ways.") +
      "</p></div></div>");

    /* THE ALARMS ARE THE ONLY FULL-WIDTH THING, and each is said once and
       only when true. */
    var late = onRung("late"), unfiled = state.actions.filter(function (a) {
      return !a.doneAt && a.kind === "file";
    });
    if (late.length) {
      out.push('<button class="panel late wide" data-act="tab-work-page" data-id="actions">' +
        '<p class="nm">' + esc(cap(countWords(late.length, "thing", "things"))) +
        (late.length === 1 ? " is late." : " are late.") + "</p>" +
        '<p class="says">' + esc(clip(late.map(function (a) { return a.name; })
          .join(" · "), 120)) + "</p></button>");
    }
    var stale = state.skills.filter(function (s) { return !skillEvidenceCount(s.id); });
    if (stale.length) {
      out.push('<button class="panel drift wide" data-act="tab-career-page" data-id="skills">' +
        '<p class="nm">' + esc(cap(countWords(stale.length, "skill", "skills"))) +
        (stale.length === 1 ? " has no evidence behind it." : " have no evidence behind them.") +
        "</p><p class=\"says\">A skill is a claim until something in the record backs it. " +
        "Link one to a project, a piece of training or an output.</p></button>");
    }

    out.push('<div class="hgrid">');
    out.push(homeAttention());
    out.push(homeMoving());
    out.push(homeCareer());
    out.push(homeKnow());
    out.push("</div>");
    return out.join("");
  }

  /* dcard — every Home card is the same shape, because these are four
     equal questions and a bigger card reads as a more important one. Every
     header carries exactly ONE action: the way into the screen that
     answers the same question in full. A card that answers a question and
     is not a route to it is a dead end. */
  function dcard(title, act, id, go, body, foot) {
    return '<section class="dcard"><header class="dchead"><h2>' + esc(title) + "</h2>" +
      '<button class="dact" data-act="' + act + '"' + (id ? ' data-id="' + esc(id) + '"' : "") +
      ">" + esc(go) + " →</button></header>" + body +
      (foot ? '<p class="says dfoot">' + foot + "</p>" : "") + "</section>";
  }

  function homeAttention() {
    var n = rungCounts();
    var body = '<div class="tiles tight">' +
      tile("Late", String(n.late), "", n.late ? "late" : "") +
      tile("Today", String(n.today), "", n.today ? "hand" : "") +
      tile("In hand", String(n.hand), "", n.hand ? "hand" : "") +
      tile("Waiting", String(n.waiting), "") + "</div>";
    var top = worstActions(openActions()).slice(0, 4);
    if (top.length) {
      body += '<div class="rows">' + top.map(function (a) {
        return rowOf("action", a, {});
      }).join("") + "</div>";
    } else if (state.actions.length) {
      body += '<p class="empty">Every action is done.</p>';
    } else {
      body += '<div class="panel">' + emptyLines("No actions yet.",
        "An action belongs to a project and answers “what next”.") + "</div>";
    }
    return dcard("What needs me", "tab-work-page", "actions", "All actions", body,
      n.late || n.today || n.hand || n.waiting
        ? "The four figures are the parts of one list — they add to " +
          countWords(n.late + n.today + n.hand + n.waiting, "open action", "open actions") + "."
        : "");
  }

  function homeMoving() {
    var live2 = live(state.projects).filter(function (p) {
      return p.status !== "completed" && p.status !== "archived";
    });
    var show = live2.slice().sort(function (a, b) {
      var order = { late: 0, drift: 1, hand: 2, calm: 3, done: 4 };
      return (order[projStand(a).tone] || 9) - (order[projStand(b).tone] || 9);
    }).slice(0, 4);
    var body;
    if (!show.length) {
      body = '<div class="panel">' + emptyLines(
        state.projects.length ? "Nothing is running." : "No projects yet.",
        state.projects.length ? "Every project is completed or archived."
          : "A project is what everything else in the app hangs off.") + "</div>";
    } else {
      body = '<div class="rows">' + show.map(function (p) {
        var pr = projProgress(p.id), st = projStand(p);
        return '<button class="row' + (st.tone && st.tone !== "done" ? " e-" + st.tone : "") +
          '" data-act="open" data-id="' + esc(ref("project", p.id)) + '">' +
          itile("project", p) +
          '<span class="grow"><span class="nm">' + esc(p.name) + "</span>" +
          '<span class="sub">' + esc([st.word,
            p.jobId ? nameOf(ref("job", p.jobId)) : "", pr.total
              ? ofWords(pr.done, pr.total, "action", "actions") : ""]
            .filter(Boolean).join(" · ")) + "</span>" +
          /* The bar takes the ROW's tone, never sage by default: green
             means healthy and a green bar on a late row is one card saying
             two opposite things. */
          (pr.total ? meterOf(pr.pct, barTone(st.tone)) : "") + "</span>" +
          '<span class="right"><span class="chev" aria-hidden="true">' + G.chev +
          "</span></span></button>";
      }).join("") + "</div>";
    }
    return dcard("What is moving", "tab-work-page", "projects", "All projects", body,
      live2.length > show.length
        ? (live2.length - show.length) + " more running, not listed." : "");
  }

  function homeCareer() {
    var cur = live(state.roles).filter(function (r) { return !r.endedOn; });
    var body = "";
    if (cur.length) {
      body += '<div class="rows">' + cur.slice(0, 3).map(function (r) {
        return rowOf("role", r, {});
      }).join("") + "</div>";
    }
    body += '<div class="tiles tight">' +
      tile("Roles", String(live(state.roles).length), "") +
      tile("Training", String(live(state.training).length), "") +
      tile("Skills evidenced", String(live(state.skills).filter(function (s) {
        return skillEvidenceCount(s.id) > 0;
      }).length) + " of " + live(state.skills).length, "") +
      tile("Outputs", String(state.outputs.length), "") + "</div>";
    if (!cur.length && !state.roles.length) {
      body = '<div class="panel">' + emptyLines("Nothing about the career yet.",
        "A role is where the work happened, and it is what the projects hang under.") +
        "</div>" + body;
    }
    return dcard("Where I stand", "tab-career-page", "timeline", "The timeline", body,
      "“Skills evidenced” counts the skills something in the record backs. " +
      "Nothing here is a score.");
  }

  function homeKnow() {
    var body = "";
    var byKind = LIB_ORDER.map(function (k) {
      return { k: k, n: libOf(k).length };
    }).filter(function (x) { return x.n; });
    if (!state.lib.length) {
      body = '<div class="panel">' + emptyLines("The library is empty.",
        "This is where a script, a formula, a method, a template, a reference or the " +
        "place a document lives goes — the things you keep reusing.") + "</div>";
    } else {
      body += '<div class="chips">' + byKind.map(function (x) {
        return '<button class="chip" data-act="tab-library-page" data-id="' +
          esc(LIB_PAGE[x.k]) + '">' + esc(LIB_KINDS[x.k].many) + " · " + x.n + "</button>";
      }).join("") + "</div>";
      /* Most reused first, because "what do I keep reaching for" is the
         question a library answers that a folder cannot. */
      var hot = state.lib.slice().sort(function (a, b) {
        return libUses(b).length - libUses(a).length;
      }).slice(0, 4);
      body += '<div class="rows">' + hot.map(function (e) {
        return rowOf("lib", e, {});
      }).join("") + "</div>";
    }
    var refs = libOf("reference").length;
    return dcard("What I know", "tab-library", "", "The library", body,
      refs ? cap(countWords(refs, "reference", "references")) +
        " in it, and " + (refs === 1 ? "it exports" : "they export") +
        " as a bibliography." : "");
  }

  function firstRun() {
    return '<div class="page-head"><div class="ph-main"><h1>Mashghal</h1>' +
      '<p class="sub">A career and work hub: who you are professionally, what you are ' +
      "doing, and what you know — one record, seen four ways.</p></div></div>" +
      '<div class="panel"><p class="nm">The book is empty.</p>' +
      '<p class="says">Nothing has been invented for you. Two ways in:</p>' +
      '<div class="page-acts" style="margin-top:0.7rem">' +
      btn("sample", "", "Load the example", "btn primary") +
      btn("proj-add", "", "Start with a project") +
      btn("lib-add-script", "", "Start with a script") +
      btn("profile-edit", "", "Start with your profile") +
      btn("guide", "", "Read how it works first") + "</div>" +
      '<p class="says" style="margin-top:0.7rem">The example is one archaeologist’s ' +
      "book with every part of the app in it. It replaces nothing, because there is " +
      "nothing here yet.</p></div>" +
      ((state.settings.offered || !oldBooks().length) ? "" :
        '<div class="panel drift"><p class="nm">There is an older Mashghal book on this ' +
        'browser.</p><p class="says">' +
        esc(oldBooks().map(function (b) { return b.what; }).join(" and ")) +
        ". It is a different shape, so it is not read and not written to — it is " +
        "offered, and importing is additive and lossy, which the dialog says before it " +
        'runs.</p><div class="page-acts" style="margin-top:0.6rem">' +
        btn("old-import", "", "Look at what it holds", "btn primary") +
        btn("old-dismiss", "", "Leave it alone") + "</div></div>");
  }

  /* ============================================================
     THE COMMAND BAR — over the record, with no model behind it.

     Four rules, and the third is why this is worth building at all:

       IT SEARCHES THE RECORD, NOT THE SCREEN. Every hit is built from
       `state` through the same selectors the views use, so a hit can never
       name something the app would then fail to open.

       IT CHANGES NOTHING. A hit navigates; the commands at the foot hand
       straight to APP.actions, which is the only place a figure may move.

       IT ANSWERS A QUESTION BY READING, AND SAYS WHAT IT READ THE QUESTION
       AS. The plan's §26 lists the questions it must answer; each is a
       shape with a regex and a `run` that calls the screen's own selector.
       There is no key, no network and no guessing — and a question it
       cannot shape prints the table of what it CAN be asked rather than
       half-answering the nearest thing.

       IT OPENS ON THE WORK. With nothing typed it shows what is late, then
       what is running, then the sections — a palette that says nothing
       until you think of a term is a palette nobody opens twice.
     ============================================================ */

  var findOn = false, findAsked = null;

  function openFind() {
    findOn = true; findAsked = null;
    var box = document.getElementById("finder");
    box.classList.add("on");
    var inp = document.getElementById("findInput");
    inp.value = ""; paintFind("");
    setTimeout(function () { inp.focus(); }, 0);
  }
  function closeFind() {
    findOn = false;
    document.getElementById("finder").classList.remove("on");
  }

  /* Every searchable thing, once. A person mentioned only inside an
     action's `waitOn` is not listed separately — `state.people` folds
     that, and four actions naming one supervisor gave four identical
     hits in the app this replaces. */
  function findAll() {
    var rows = [];
    function push(kind, rec, extra) {
      rows.push({
        k: kind, r: ref(kind, rec.id), name: recName(rec, kind),
        key: [recName(rec, kind), extra || "", rec.note || ""].join(" ").toLowerCase(),
        says: saysOf(kind, rec, {}), stand: standOf(kind, rec)
      });
    }
    ["role", "job", "education", "training", "skill", "project", "workflow",
     "action", "person", "asset", "output", "portfolio", "cv"].forEach(function (k) {
      listOf(k).forEach(function (rec) { push(k, rec, k); });
    });
    /* A LIBRARY ENTRY IS SEARCHED BY ITS BODY AND ITS TOPICS TOO, which is
       most of why the library is worth having: six months later you
       remember what the script DID, not what you called it. */
    state.lib.forEach(function (e) {
      push("lib", e, [LIB_KINDS[e.kind] ? LIB_KINDS[e.kind].word : "", e.lang || "",
        (e.topics || []).join(" "), e.body || "", e.path || "", e.url || "",
        e.cite ? [e.cite.authors, e.cite.title, e.cite.container, e.cite.year]
          .filter(Boolean).join(" ") : ""].join(" "));
    });
    return rows;
  }

  /* Sections, so a screen whose name you have forgotten is findable by
     name — including Settings, which has no tab of its own. */
  function findSects() {
    var rows = [];
    Object.keys(PAGES).forEach(function (tab) {
      PAGES[tab].forEach(function (p) {
        rows.push({ k: "page", tab: tab, page: p.id, name: p.label,
          key: (p.label + " " + tab + " " + (p.alias || "")).toLowerCase(),
          says: cap(tab) + (pageCount(tab, p) == null ? ""
            : " · " + pageCount(tab, p)) });
      });
    });
    rows.push({ k: "page", tab: "guide", page: "", name: "How to use Mashghal",
      key: "guide help how to start manual instructions getting started tutorial " +
        "add everything what goes where",
      says: "every record, where it lives, and what to link it to" });
    rows.push({ k: "page", tab: "settings", page: "", name: "Settings",
      key: "settings theme dark light erase wipe export backup version shortcuts owner",
      says: "the theme, your name, the record, and erasing it" });
    rows.push({ k: "page", tab: "home", page: "", name: "Home",
      key: "home start dashboard", says: "the four questions at once" });
    return rows;
  }

  /* ---------------- the questions ----------------

     The plan's §26 examples, each answered through the selector the screen
     uses. `shape` is what the answer says it read the question as, because
     a box that answers a sentence has to say which sentence it thought it
     heard — a wrong answer is otherwise indistinguishable from a wrong
     question. */
  var ASK_SHAPES = [
    { shape: "what needs me",
      re: /^(what|whats|what is|what's)?\s*(needs? me|is late|am i late|late|next|due)\b/i,
      ask: "what needs me", run: function () {
        var n = rungCounts(), rows = worstActions(openActions()).slice(0, 12).map(actHit);
        return { head: n.late ? cap(countWords(n.late, "thing", "things")) +
          (n.late === 1 ? " is late" : " are late") + "." : "Nothing is late.",
          says: n.late + " late · " + n.today + " today · " + n.hand +
            " in hand · " + n.waiting + " waiting",
          rows: rows };
      } },
    { shape: "what evidence do I have for a skill",
      re: /\b(?:evidence|proof|backs?up|backs?)\b[^]*?\b(?:for|of|behind)\s+(.+)$/i,
      grab: 1, run: function (name) {
        var s = pickBy(state.skills, name);
        if (!s) return { head: "No skill in the book matches “" + name + "”.",
          rows: state.skills.slice(0, 8).map(function (x) { return recHit("skill", x); }) };
        var e = getSkillEvidence(s.id), rows = [];
        ["training", "projects", "workflows", "outputs", "lib", "roles", "portfolio"]
          .forEach(function (g) {
            (e[g] || []).forEach(function (r) { rows.push(refHit(r)); });
          });
        return { head: cap(skillSays(s)), says: "off " + esc(s.name) + "’s own page",
          rows: rows.slice(0, 14),
          go: { act: "open", id: ref("skill", s.id), label: "Open the skill" } };
      } },
    { shape: "what did I do at an employer",
      re: /\b(?:what did i do|what i did|work(?:ed)? (?:at|for)|projects? (?:at|for))\s+(.+)$/i,
      grab: 1, run: function (name) {
        var j = pickBy(state.jobs, name);
        if (!j) return { head: "No employer matches “" + name + "”.",
          rows: state.jobs.map(function (x) { return recHit("job", x); }) };
        var roles = state.roles.filter(function (r) { return r.jobId === j.id; });
        var projs = state.projects.filter(function (p) { return p.jobId === j.id; });
        return { head: cap(countWords(roles.length, "role", "roles")) + " and " +
          countWords(projs.length, "project", "projects") + " at " + j.name + ".",
          rows: roles.map(function (r) { return recHit("role", r); })
            .concat(projs.map(function (p) { return recHit("project", p); })),
          go: { act: "open", id: ref("job", j.id), label: "Open the employer" } };
      } },
    { shape: "which projects used a workflow",
      re: /\b(?:which|what)\s+projects?\s+(?:used|use|ran|run|have used)\s+(.+)$/i,
      grab: 1, run: function (name) {
        var w = pickBy(state.workflows, name);
        if (!w) return { head: "No workflow matches “" + name + "”.",
          rows: state.workflows.map(function (x) { return recHit("workflow", x); }) };
        var ps = getWorkflowProjects(w.id);
        return { head: ps.length ? w.name + " has been run on " +
            countWords(ps.length, "project", "projects") + "."
          : w.name + " has not been run on a project yet.",
          says: "derived from the runs, not from a list on either side",
          rows: ps.map(refHit),
          go: { act: "open", id: ref("workflow", w.id), label: "Open the workflow" } };
      } },
    { shape: "what do I have on a subject",
      re: /\b(?:what do i have|anything|what have i got|everything)\b[^]*?\bon\s+(.+)$/i,
      grab: 1, run: function (word) {
        var hits = libByTopic(word);
        return { head: hits.length ? cap(countWords(hits.length, "entry", "entries")) +
            " on " + word + "." : "Nothing in the library is marked “" + word + "”.",
          says: hits.length ? "read off the topics you typed onto them"
            : "topics are words you write onto an entry — " +
              (allTopics().length ? "you have used " + listWords(allTopics().slice(0, 6))
                : "none are written yet"),
          rows: hits.map(function (e) { return recHit("lib", e); }) };
      } },
    { shape: "what is outstanding with a person",
      re: /\b(?:outstanding|waiting|chasing|chase|owe[sd]?)\b(?:[^]*?\b(?:with|on|from)\s+([^?]+))?/i,
      grab: 0, run: function (name) {
        var p = name ? pickBy(state.people, name) : null;
        var who = p ? p.name : name;
        var acts = onRung("waiting").filter(function (a) {
          return a.waitOn && (!who ||
            a.waitOn.toLowerCase().indexOf(who.toLowerCase()) >= 0);
        });
        /* "Who am I chasing" names nobody, which is the commonest way the
           question is actually asked — so with no name it answers over
           everybody rather than looking up a person called "". */
        return { head: who
            ? (acts.length ? cap(countWords(acts.length, "thing", "things")) +
                (acts.length === 1 ? " is" : " are") + " outstanding with " + who + "."
              : "Nothing is waiting on " + who + ".")
            : (acts.length ? "You are waiting on " +
                countWords(acts.length, "thing", "things") + "."
              : "You are not waiting on anybody."),
          says: who ? "" : "read off the actions that name somebody",
          rows: acts.map(actHit),
          go: p ? { act: "open", id: ref("person", p.id), label: "Open the person" }
            : { act: "tab-work-page", id: "people", label: "Everybody in the book" } };
      } },
    { shape: "how long did a project take",
      re: /\b(?:how long|how much time|hours?)\b[^]*?\b(?:on|for|did)\s+(.+?)(?:\s+(?:take|taken|so far))?\s*\??$/i,
      grab: 1, run: function (name) {
        var p = pickBy(state.projects, name);
        if (!p) return { head: "No project matches “" + name + "”.",
          rows: state.projects.map(function (x) { return recHit("project", x); }) };
        var mins = hoursFor(p.id);
        return { head: mins ? hm(mins) + " logged against " + p.name + "."
            : "No time is logged against " + p.name + ".",
          says: mins ? "summed from the entries, never stored as a total"
            : "the dates on it read " + spanWords(p.startedOn, p.endedOn),
          go: { act: "open", id: ref("project", p.id), label: "Open the project" } };
      } },
    { shape: "what came out of a project",
      re: /\b(?:what came out of|outputs? (?:of|for)|produced by)\s+(.+)$/i,
      grab: 1, run: function (name) {
        var p = pickBy(state.projects, name);
        if (!p) return { head: "No project matches “" + name + "”.",
          rows: state.projects.map(function (x) { return recHit("project", x); }) };
        var outs = getProjectOutputs(p.id);
        return { head: outs.length ? cap(countWords(outs.length, "output", "outputs")) +
            " out of " + p.name + "." : "Nothing is recorded as an output of " + p.name + ".",
          rows: outs.map(function (o) { return recHit("output", o); }),
          go: { act: "open", id: ref("project", p.id), label: "Open the project" } };
      } },
    { shape: "where is a document",
      re: /\bwhere (?:is|are|do i keep|did i put)\s+(.+)$/i,
      grab: 1, run: function (name) {
        var hits = state.lib.filter(function (e) {
          return (e.name || "").toLowerCase().indexOf(name.toLowerCase()) >= 0 ||
            (e.path || "").toLowerCase().indexOf(name.toLowerCase()) >= 0;
        });
        return { head: hits.length ? cap(countWords(hits.length, "entry", "entries")) +
            " matching “" + name + "”." : "Nothing in the library matches “" +
            name + "”.",
          says: hits.length ? "a place carries the folder, the file or the link"
            : "a place is a library entry — press “New place” to record one",
          rows: hits.map(function (e) { return recHit("lib", e); }) };
      } },
    { shape: "what I can show somebody",
      re: /\b(portfolio|what can i show|show somebody|show someone)\b/i,
      run: function () {
        var rows = state.portfolio.map(function (i) { return recHit("portfolio", i); });
        return { head: rows.length ? cap(countWords(rows.length, "portfolio item",
            "portfolio items")) + " ready." : "Nothing is in the portfolio yet.",
          says: "a portfolio item points at the work, never a copy of it",
          rows: rows, go: { act: "tab-show", id: "", label: "Open the portfolio" } };
      } },
    { shape: "the bibliography",
      re: /\b(bibliograph|cite|citation|references?)\b/i,
      run: function () {
        var refs = libOf("reference");
        var bad = refs.filter(function (e) { return citeComplete(e).length; });
        return { head: refs.length ? cap(countWords(refs.length, "reference", "references")) +
            " in the library." : "No references yet.",
          says: refs.length ? (bad.length ? countWords(bad.length, "one", "of them") +
            " missing something an export needs" : "every one of them is ready to export")
            : "paste BibTeX or RIS and they come in whole",
          rows: refs.slice(0, 10).map(function (e) { return recHit("lib", e); }),
          go: refs.length ? { act: "bib-export", id: "", label: "Export a bibliography" }
            : { act: "cite-paste", id: "", label: "Paste one in" } };
      } }
  ];

  var STOPW = { the: 1, a: 1, an: 1, of: 1, on: 1, in: 1, for: 1, my: 1, and: 1,
    to: 1, take: 1, took: 1, taken: 1, workflow: 1, project: 1, skill: 1 };
  function pickBy(list, name) {
    if (!name) return null;
    var q = String(name).toLowerCase().trim().replace(/[?.!,]+$/, "");
    var exact = list.filter(function (x) {
      return String(x.name || "").toLowerCase() === q;
    })[0];
    if (exact) return exact;
    var sub = list.filter(function (x) {
      return String(x.name || "").toLowerCase().indexOf(q) >= 0;
    })[0];
    if (sub) return sub;
    /* Word overlap, ignoring the words a question carries but a name does
       not. Ranked, so the best match wins rather than the first one —
       and nought overlap is still nothing rather than a guess. */
    var terms = q.split(/\s+/).filter(function (t) { return t.length > 2 && !STOPW[t]; });
    if (!terms.length) return null;
    var best = null, bestN = 0;
    list.forEach(function (x) {
      var n2 = String(x.name || "").toLowerCase();
      var hit = terms.filter(function (t) { return n2.indexOf(t) >= 0; }).length;
      if (hit > bestN) { bestN = hit; best = x; }
    });
    return bestN ? best : null;
  }
  /* A CAPTURE KEEPS ITS PREPOSITION unless it is stripped: "from haddad"
     looked up a person called "from haddad" and answered that nobody
     matched somebody who is in the book. */
  function askName(raw) {
    return String(raw || "").replace(/^\s*(the|a|an|my|on|of|for|with|from|at|in)\s+/i, "")
      .replace(/[?.!,\s]+$/, "").trim();
  }

  function askRecord(raw) {
    var q = String(raw || "").trim();
    for (var i = 0; i < ASK_SHAPES.length; i++) {
      var sh = ASK_SHAPES[i], m = sh.re.exec(q);
      if (!m) continue;
      /* `grab` names the capture group. It is optional when the shape can
         answer without one — "who am I chasing" names nobody. */
      var arg = sh.grab ? askName(m[sh.grab]) : (sh.grab === 0 ? askName(m[1]) : "");
      if (sh.grab && !arg) continue;
      var ans = sh.run(arg);
      ans.shape = sh.ask || sh.shape;
      return ans;
    }
    return null;
  }

  function actHit(a) { return recHit("action", a); }
  function recHit(kind, rec) {
    return { k: kind, r: ref(kind, rec.id), name: recName(rec, kind),
      says: saysOf(kind, rec, {}), stand: standOf(kind, rec) };
  }
  function refHit(r) {
    var p = parseRef(r), rec = recOf(r);
    return rec ? recHit(p.kind, rec)
      : { k: p.kind, r: r, name: nameOf(r), says: "" };
  }

  function paintFind(q) {
    var box = document.getElementById("findList");
    var foot = document.getElementById("findFoot");
    q = String(q || "").trim();
    findAsked = null;
    var html = [];

    if (!q) {
      html.push(findDefault());
    } else if (isQuestion(q)) {
      var ans = askRecord(q);
      if (ans) {
        findAsked = ans;
        html.push(askHtml(ans));
        /* AN ANSWER WITH NOTHING IN IT IS NOT A DEAD END — the shape may
           have read the sentence one way and the reader meant another. But an
           answer that DID answer, and offers the route to what it answered
           about, must not carry "nothing matches that" underneath it: that is
           the screen contradicting itself in two consecutive lines. */
        if (!(ans.rows || []).length && !ans.go) html.push(findSearch(q));
      } else {
        /* A QUESTION IT CANNOT SHAPE MAY STILL BE A SEARCH. "how to" opens
           with a question word and matches no shape — printing only the
           table of what it can be asked, with the hits for those same words
           sitting unmentioned underneath, is the box refusing to look for
           the thing typed into it. */
        html.push(askUnread(q));
        html.push(findSearch(q));
      }
    } else {
      html.push(findSearch(q));
    }
    box.innerHTML = html.join("");
    foot.innerHTML = '<span class="says">Enter opens the first hit · Escape closes' +
      "</span>" + '<button class="btn tiny" data-act="ask-table">What it can be asked' +
      "</button>";
  }

  /* A QUESTION IS A QUESTION WHEN IT LOOKS LIKE ONE, and nothing else.
     Trying every multi-word query as a question first meant a plain search
     for "Chase the bathymetry licence renewal" matched the chasing shape
     and answered about a person called "bathymetry licence renewal" — the
     box quietly refusing to search for the thing typed into it. Ending with
     a question mark, or opening with a question word, is a rule a reader can
     predict and the placeholder can state. */
  function isQuestion(q) {
    return /\?\s*$/.test(q) ||
      /^(what|which|where|who|whom|whose|how|why|when|anything|everything|show me|list|am i|do i|have i)\b/i.test(q);
  }

  function findDefault() {
    var out = [];
    var late = worstActions(onRung("late")).slice(0, 4);
    if (late.length) {
      out.push(mgroup("Late", late.map(actHit)));
    }
    var run = live(state.projects).filter(function (p) {
      return p.status !== "completed" && p.status !== "archived";
    }).slice(0, 4);
    if (run.length) out.push(mgroup("Running", run.map(function (p) {
      return recHit("project", p);
    })));
    out.push(mgroup("Sections", findSects().slice(0, 8)));
    out.push(mgroup("Ask it something", [
      { k: "hint", name: "what needs me" },
      { k: "hint", name: "what evidence do I have for photogrammetry" },
      { k: "hint", name: "which projects used the orthophoto workflow" },
      { k: "hint", name: "what do I have on harbour surveying" }
    ]));
    return out.join("");
  }

  function score(key, name, terms) {
    var n = String(name || "").toLowerCase(), k = String(key || "");
    var s = 0;
    for (var i = 0; i < terms.length; i++) {
      var t = terms[i];
      if (k.indexOf(t) < 0) return 0;          /* every term has to hit */
      if (n.indexOf(t) === 0) s += 40;
      else if (new RegExp("\\b" + t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).test(n)) s += 24;
      else if (n.indexOf(t) >= 0) s += 12;
      else s += 4;
    }
    if (n === terms.join(" ")) s += 60;
    if (n.indexOf(terms.join(" ")) === 0) s += 20;
    return s;
  }

  function findSearch(q) {
    var terms = q.toLowerCase().split(/\s+/).filter(Boolean);
    var hits = findAll().map(function (h) {
      return { h: h, s: score(h.key, h.name, terms) };
    }).filter(function (x) { return x.s > 0; })
      .sort(function (a, b) { return b.s - a.s; })
      .slice(0, 24).map(function (x) { return x.h; });
    var pages = findSects().map(function (h) {
      return { h: h, s: score(h.key, h.name, terms) };
    }).filter(function (x) { return x.s > 0; })
      .sort(function (a, b) { return b.s - a.s; })
      .slice(0, 5).map(function (x) { return x.h; });
    var cmds = FIND_CMDS.map(function (c) {
      return { c: c, s: score(c.key + " " + c.label.toLowerCase(), c.label, terms) };
    }).filter(function (x) { return x.s > 0; })
      .sort(function (a, b) { return b.s - a.s; })
      .slice(0, 5).map(function (x) {
        return { k: "cmd", act: x.c.act, name: x.c.label, says: "runs it" };
      });
    var out = [];
    if (hits.length) out.push(mgroup("In the record", hits));
    if (pages.length) out.push(mgroup("Screens", pages));
    if (cmds.length) out.push(mgroup("Do", cmds));
    if (!out.length) {
      out.push('<p class="empty">Nothing matches “' + esc(q) + '”. ' +
        "Every word has to hit, so try one of them — or end with a question mark " +
        "and it is read as a question instead.</p>");
    }
    return out.join("");
  }

  function mgroup(head, rows) {
    return '<div class="mgroup"><p class="label">' + esc(head) + "</p>" +
      rows.map(mrow).join("") + "</div>";
  }
  function mrow(h) {
    var act = h.k === "cmd" ? h.act : h.k === "page" ? "find-page"
      : h.k === "hint" ? "find-hint" : "find-open";
    var id = h.k === "cmd" ? "" : h.k === "page" ? h.tab + "|" + h.page
      : h.k === "hint" ? h.name : h.r;
    return '<button class="mrow" data-act="' + act + '" data-id="' + esc(id) + '">' +
      (h.k === "cmd" || h.k === "hint" || h.k === "page"
        ? '<span class="mico">' + (h.k === "hint" ? G.ask : G.chev) + "</span>"
        : itile(h.k, recOf(h.r) || { id: "" })) +
      '<span class="grow"><span class="nm">' + esc(h.name) + "</span>" +
      (h.says ? '<span class="sub">' + esc(clip(h.says, 90)) + "</span>" : "") + "</span>" +
      (h.stand && h.stand.word
        ? '<span class="pill p-' + h.stand.tone + '">' + esc(h.stand.word) + "</span>" : "") +
      "</button>";
  }

  function askHtml(a) {
    var out = ['<div class="mgroup"><p class="label">Answer</p>' +
      '<div class="askhead"><p class="nm">' + esc(a.head) + "</p>" +
      (a.says ? '<p class="says">' + esc(a.says) + "</p>" : "") +
      '<p class="says faintline">read as: ' + esc(a.shape) + "</p></div>"];
    if (a.go) {
      out.push('<button class="mrow" data-act="find-cmd" data-id="' +
        esc(a.go.act + "|" + (a.go.id || "")) + '"><span class="mico">' + G.chev +
        '</span><span class="grow"><span class="nm">' + esc(a.go.label) +
        "</span></span></button>");
    }
    (a.rows || []).forEach(function (h) { out.push(mrow(h)); });
    out.push("</div>");
    return out.join("");
  }

  /* IT NEVER HALF-ANSWERS. A question it cannot shape prints the table of
     what it can be asked, in the words it wants them in. */
  function askUnread(q) {
    return '<div class="mgroup"><p class="label">Not read</p>' +
      '<div class="askhead"><p class="nm">That is not a shape it knows.</p>' +
      '<p class="says">It reads the record by pattern — there is no model behind it, ' +
      "which is why it can work offline and can never invent a figure. These are the " +
      "questions it can be asked:</p></div>" +
      ASK_SHAPES.map(function (s) {
        return '<button class="mrow" data-act="find-hint" data-id="' +
          esc(s.ask || s.shape) + '"><span class="mico">' + G.ask +
          '</span><span class="grow"><span class="nm">' + esc(cap(s.ask || s.shape)) +
          "</span></span></button>";
      }).join("") + "</div>";
  }
  function askTable() {
    var inp = document.getElementById("findInput");
    if (!findOn) openFind();
    setTimeout(function () {
      document.getElementById("findList").innerHTML = askUnread("");
      if (inp) inp.value = "";
    }, 0);
  }

  function findFirst() {
    var el = document.querySelector("#findList .mrow");
    if (el) el.click();
  }

  /* ============================================================
     SETTINGS — opened a few times a year, so it is on the gear and not on
     the bar. It has to be reachable with no keyboard and findable by name,
     which is why it is in `findSects()` as well as on the gear: the one
     screen whose name is the thing you have forgotten is the one that must
     be searchable.
     ============================================================ */

  function renderSettings() {
    var out = [pageHeadOf("Settings",
      "The theme, your name, and the record itself.", "")];

    out.push(sectHead("How to use it", null));
    out.push('<div class="panel"><p class="says">Every record the app holds, where it ' +
      "lives, and what to link it to \u2014 in the order that makes the later ones " +
      "worth having.</p>" +
      '<div class="page-acts" style="margin-top:0.6rem">' +
      btn("guide", "", "Open the guide", "btn primary") + "</div></div>");

    out.push(sectHead("The look", null));
    var th = localStorage.getItem(THEME_KEY) || "";
    out.push('<div class="panel"><p class="says">Dark by default, because that is what ' +
      "this palette was measured in — but both themes are real and every run of text " +
      "in both of them clears 4.5:1.</p>" +
      '<div class="page-acts" style="margin-top:0.6rem">' +
      ["", "dark", "light"].map(function (v) {
        return '<button class="btn' + (th === v ? " primary" : "") +
          '" data-act="theme-set" data-id="' + v + '">' +
          (v === "" ? "Follow the system" : v === "dark" ? "Dark" : "Light") + "</button>";
      }).join("") + "</div>" +
      '<p class="says" style="margin-top:0.5rem">Which theme this machine shows is a fact ' +
      "about the machine, like a window size — so it lives beside the book rather " +
      "than in it, and a backup does not carry it.</p></div>");

    out.push(sectHead("Your name", null));
    out.push('<div class="panel"><p class="nm">' +
      (state.profile.name ? esc(state.profile.name)
        : '<span class="unsaid">not said — and blank is a real answer</span>') +
      "</p><p class=\"says\">Home greets you by it and a CV heads itself with it. " +
      "Left blank, Home greets the hour and a CV has no name at the top, which is " +
      "the honest reading rather than an invented one.</p>" +
      '<div class="page-acts" style="margin-top:0.6rem">' +
      btn("profile-edit", "", "Edit the profile", "btn primary") + "</div></div>");

    out.push(sectHead("What is in the book", null));
    var counts = bookWords();
    out.push('<div class="panel">' + (counts.length
      ? '<p class="says">' + esc(listWords(counts)) + ". " +
        countWords(state.links.length, "link", "links") +
        " between them.</p><p class=\"says\">Those are the reader’s words for the " +
        "lists, not the record’s — a screen may not print a state key at " +
        "somebody.</p>"
      : '<p class="says">Nothing in it yet.</p>') + "</div>");

    out.push(sectHead("The record", null));
    out.push('<div class="panel"><p class="says">It lives in this browser under one key ' +
      "and goes nowhere else. There is no account, no server and no sync in this build " +
      "— so a backup is the only way it reaches another machine, and the app says so " +
      "rather than implying otherwise.</p>" +
      '<div class="page-acts" style="margin-top:0.6rem">' +
      btn("backup", "", "Back it up", "btn primary") +
      btn("restore", "", "Restore a backup") +
      (emptyBook() ? btn("sample", "", "Load the example") : "") +
      btn("wipe", "", "Erase everything", "btn danger") + "</div>" +
      '<p class="says" style="margin-top:0.5rem">Erasing asks first, says what goes, and ' +
      "is the only act in the app with no undo — which is why the backup button is " +
      "beside it rather than three screens away.</p></div>");

    out.push(sectHead("Feed it from a file", null));
    out.push('<div class="panel"><p class="says">A JSON file can fill the book in one ' +
      "go \u2014 which is how a CV gets in without being typed out a line at a time. " +
      "It <strong>adds</strong> rather than replacing, a record whose name is already " +
      "here is reused rather than copied, and it shows you every line it would write " +
      "before it writes one.</p>" +
      '<div class="page-acts" style="margin-top:0.6rem">' +
      btn("import-json", "", "Feed it from a file", "btn primary") + "</div>" +
      '<p class="says" style="margin-top:0.5rem">It is not a restore. A backup ' +
      "replaces the book; this adds to it, so a second file can name a project the " +
      "first one added.</p></div>");

    var old = oldBooks();
    if (old.length) {
      out.push(sectHead("An older book", null));
      out.push('<div class="panel drift"><p class="says">' +
        esc(cap(listWords(old.map(function (o) { return o.what; })))) +
        " is still in this browser. It is a different shape, so it is not read, not " +
        "written to and not lost. Importing is <strong>additive</strong> — nothing " +
        "here is replaced and the old key is never written to — and it is lossy, " +
        "which the dialog names before it runs.</p>" +
        '<div class="page-acts" style="margin-top:0.6rem">' +
        btn("old-import", "", "Look at what it holds", "btn primary") + "</div></div>");
    }

    out.push(sectHead("What it deliberately does not do", null));
    out.push('<div class="panel"><p class="says">Four things, each for a reason worth ' +
      "stating rather than leaving as a gap:</p>" +
      '<ul class="says" style="margin:0.5rem 0 0 1.1rem;display:grid;gap:0.35rem">' +
      "<li><strong>It does not score you.</strong> No proficiency is computed, no " +
      "streak is kept and no percentage is invented. The one percentage on any screen " +
      "is a count of actions you marked done, and it says so where it is printed.</li>" +
      "<li><strong>It does not infer a skill level.</strong> A level is typed or it is " +
      "blank; what the app derives is the <em>evidence</em> — which records back " +
      "the claim — because that is checkable and a number is not.</li>" +
      "<li><strong>It does not notify.</strong> A browser cannot send mail and nothing " +
      "runs while the app is shut, so what is late is waiting when you open it. " +
      "Implying otherwise would be worse than the limit.</li>" +
      "<li><strong>It fetches nothing.</strong> No fonts, no libraries, no service. " +
      "Which is why it opens on a plane, and why the bibliography is formatted here " +
      "rather than by asking a service to do it.</li></ul></div>");

    out.push(sectHead("This build", null));
    out.push('<div class="panel"><p class="says" style="font-family:var(--mono)">' +
      esc(BUILD) + "</p><p class=\"says\">Mashghal rebuilt as a career and work hub: " +
      "three worlds — who you are professionally, what you do, what you know — " +
      "with the portfolio, the timeline and a CV as views across them rather than " +
      "records of their own.</p></div>");
    return out.join("");
  }

  /* ============================================================
     THE GUIDE.

     Not a tour and not a tooltip: a page you can read once and come back
     to, that names every record the app holds, where it lives, and what to
     link it to. Two rules hold it, and both are the same rule this whole
     app lives by:

       IT NAMES THE REAL CONTROL. Every instruction says the words actually
       printed on the button — "New role", "Link it to…", "Paste BibTeX or
       RIS" — because a guide that paraphrases the interface is a guide
       that goes wrong the first time a label changes, silently.

       IT IS REACHABLE WITHOUT ALREADY KNOWING IT IS THERE. It is on the
       first screen of an empty book, on the gear beside Settings, and in
       the finder under every word somebody would type for it — guide,
       help, how, start, manual. The one screen whose name you have
       forgotten is the one that has to be searchable.
     ============================================================ */

  var GUIDE_PARTS = [
    { id: "g-start", word: "Start here" },
    { id: "g-shape", word: "How it is put together" },
    { id: "g-career", word: "Career" },
    { id: "g-work", word: "Work" },
    { id: "g-lib", word: "The library" },
    { id: "g-bib", word: "References and the bibliography" },
    { id: "g-links", word: "Drawing the lines" },
    { id: "g-show", word: "Portfolio and CVs" },
    { id: "g-ask", word: "Finding and asking" },
    { id: "g-keys", word: "The keyboard" },
    { id: "g-feed", word: "Filling it from a file" },
    { id: "g-record", word: "Your record" }
  ];

  function gp(id, word, body) {
    return '<div class="gpart" id="' + id + '">' + sectHead(word, null) + body + "</div>";
  }
  /* A HOW-TO ROW IS A ROUTE AND A REASON, in that order: where the button
     is, then why the field is worth filling. */
  function grow(where, what, why) {
    return '<div class="grow-row"><span class="gwhere">' + where + "</span>" +
      '<span class="gwhat"><b>' + what + "</b>" +
      (why ? '<span class="sub">' + why + "</span>" : "") + "</span></div>";
  }
  function gnote(html) { return '<p class="says gnote">' + html + "</p>"; }

  function renderGuide() {
    var out = [pageHeadOf("How to use Mashghal",
      "Every record the app holds, where it lives, and what to link it to — in the " +
      "order that makes the later ones worth having. Nothing here is a tour you have to " +

      btn("sample", "", emptyBook() ? "Load the example" : "Reload the example") +
      btn("settings", "", "Settings"))];

    out.push('<div class="gtoc">' + GUIDE_PARTS.map(function (p) {

    /* ---------------- start ---------------- */
    out.push(gp("g-start", "Start here",

    /* ---------------- career ---------------- */
    out.push(gp("g-career", "Career — who you are professionally",

      grow("Career → Profile → Edit", "Your profile",
        "Name, one line about what you do, the fields you work in, and a paragraph for " +

      grow("Work → Employers → New employer", "An employer",

    out.push(gp("g-work", "Work — what you are doing and have done",

      grow("a workflow → Run it on a project", "A run",

      grow("Work → Hours → Log time", "Time",

    out.push(gp("g-lib", "The library — what you know and can reuse",

  /* ============================================================
     THE DIALOGS.

     Four rules hold all of them, and each one is a fault this repo has
     already paid for:

       A DESTRUCTIVE BRANCH NEVER GOES ON `onCancel`. Escape, the scrim and
       the × all fire cancel — those are the universal "I did not mean
       that" gestures. Confirm does the thing.

       EVERY REMOVAL CONFIRMS, SAYS WHAT IT TOUCHES, AND OFFERS AN UNDO.
       The undo is the toast's, as a closure over the records, and this app
       has no undo stack on purpose: the example and a restore both REPLACE
       state, and a closure captured before that would mutate records the
       book no longer holds.

       A DATE HAS TO EXIST, not merely be shaped like one — `dayOk` and
       `partOk` round-trip through the calendar, so `2026-13-45` is refused
       where it is typed rather than storing and appearing on no screen.

       NAME THE RECORD, NOT ITS TYPE. "Edit Lenovo Legion", never "Edit
       thing": a generic noun in a title reads as a placeholder somebody
       forgot to fill in.
     ============================================================ */

  function stamp(rec) { rec.updatedAt = new Date().toISOString(); return rec; }
  function put(kind, rec) {
    listOf(kind).push(stamp(rec));
    return rec;
  }
  function saveGo(msg, undo) { save(); render(); if (msg) toast(msg, undo); }

  /* A removal takes its links with it, because a link naming a record that
     is gone is a line to nowhere — and the undo puts both back. */
  function removeRec(kind, rec, what, extraSay, alsoDo) {
    var list = listOf(kind), i = list.indexOf(rec);
    var links = state.links.filter(function (l) {
      return l.a === ref(kind, rec.id) || l.b === ref(kind, rec.id);
    });
    confirmAction({
      title: "Remove " + recName(rec, kind) + "?",
      message: [esc(what || (KINDS[kind].word + " goes.")),
        links.length ? esc(cap(countWords(links.length, "link", "links")) +
          " to it " + (links.length === 1 ? "goes" : "go") + " with it.") : "",
        extraSay ? esc(extraSay) : ""].filter(Boolean).join(" "),
      confirmLabel: "Remove it"
    }, function () {
      var extra = alsoDo ? alsoDo() : null;
      if (i >= 0) list.splice(i, 1);
      state.forgotten[ref(kind, rec.id)] = recName(rec, kind);
      dropLinks(ref(kind, rec.id));
      openRec = null;
      saveGo("Removed " + recName(rec, kind), function () {
        if (i >= 0) list.splice(i, 0, rec);
        links.forEach(function (l) { state.links.push(l); });
        delete state.forgotten[ref(kind, rec.id)];
        if (extra && extra.undo) extra.undo();
        saveGo("Put back");
      });
    });
  }

  /* ---------------- pickers built out of the record ---------------- */

  function optsOf(kind, blankLabel) {
    var o = blankLabel == null ? [] : [{ value: "", label: blankLabel }];
    return o.concat(live(listOf(kind)).slice().sort(byName).map(function (r) {
      return { value: r.id, label: recName(r, kind) };
    }));
  }
  function vocabOpts(list, extra) {
    var seen = {}, out = [];
    (extra || []).forEach(function (v) { if (!seen[v]) { seen[v] = 1; out.push(v); } });
    list.forEach(function (r) {
      var v = (r.kind || "").trim();
      if (v && !seen[v]) { seen[v] = 1; out.push(v); }
    });
    return out;
  }
  function dateField(key, label, value, hint, more) {
    return { key: key, label: label, value: value || "", placeholder: "2026-09 or 2026-09-17",
      hint: hint, more: more };
  }
  function badDates(v, keys) {
    for (var i = 0; i < keys.length; i++) {
      var val = (v[keys[i][0]] || "").trim();
      if (val && !partOk(val)) {
        return keys[i][1] + ": “" + val + "” is not a date. " +
          "Write a year, a year and month, or a full day — 2026, 2026-09, 2026-09-17.";
      }
    }
    return "";
  }
