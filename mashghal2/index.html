    "upkeep-add": function () {
      openModal({
        title: "New upkeep",
        message: "Every so often since it was last done, never on a date — so falling behind never piles up. There is one of each, however far past it is.",
        fields: [
          { key: "title", label: "What", span: true, placeholder: "Back up the GIS project" },
          { key: "everyDays", label: "Every (days)", type: "number", min: 1, step: "1", value: 30 },
          { key: "lastDoneOn", label: "Last done", placeholder: "YYYY-MM-DD",
            hint: "Blank means never, which is why it reads as due." },
          { key: "projectId", label: "Which work", type: "select", options: projectOptions("— all of it —"), more: true }
        ],
        validate: function (v) {
          if (!v.title.trim()) return "It needs a name.";
          if (!num(v.everyDays) || num(v.everyDays) < 1) return "How many days between one and the next?";
          if (v.lastDoneOn && !dayOk(v.lastDoneOn)) return "“" + v.lastDoneOn + "” is not a date that exists.";
          return "";
        },
        confirmLabel: "Add it",
        onConfirm: function (v) {
          var a = stamp({ id: uid(), title: v.title.trim(), type: "upkeep", projectId: v.projectId,
            personId: "", assetId: "", dueDate: "", completedAt: "", status: "open",
            recurringRule: { everyDays: num(v.everyDays), lastDoneOn: v.lastDoneOn, place: "" },
            notes: "", createdAt: nowISO() });
          state.actions.push(a); go();
          toast("Added " + clip(a.title, 30), function () {
            state.actions = state.actions.filter(function (x) { return x.id !== a.id; });
          });
        }
      });

  };

  /* The rest of them, in a second block only so this file can be read
     in sections. `ACTIONS` is still the one table, and the scan that
     checks every `data-act` has a handler reads it whole. */
  function addActions(more) {
    Object.keys(more).forEach(function (k) { ACTIONS[k] = more[k]; });
  }

  addActions({
    /* --- workflows --- */
    "wf-open": function (id) { view = "workflows"; clearOpen(); openWf = id; render(); },
    "wf-back": function () { clearOpen(); render(); },
    "wf-add": function (id) {
      openModal({
        title: "New workflow",
        message: "A procedure you can run again. Write the steps once; each run is one pass through it.",
        fields: [
          { key: "name", label: "What is it called", span: true, placeholder: "Brochure, design to archive" },
          { key: "projectId", label: "Part of which work", type: "select", value: id || "",
            options: projectOptions("— reusable across all of it —") },
          { key: "description", label: "What it is for", type: "textarea", span: true, more: true }
        ],
        validate: function (v) { return v.name.trim() ? "" : "It needs a name."; },
        confirmLabel: "Create it",
        onConfirm: function (v) {
          var w = stamp({ id: uid(), name: v.name.trim(), description: v.description.trim(),
            version: 1, projectId: v.projectId });
          state.workflows.push(w);
          view = "workflows"; clearOpen(); openWf = w.id;
          go();
          toast("Created " + w.name, function () {
            state.workflows = state.workflows.filter(function (x) { return x.id !== w.id; });
            clearOpen();
          });
        }
      });
    },
    "wf-edit": function (id) {
      var w = byId(state.workflows, id); if (!w) return;
      openModal({
        title: "Edit " + clip(w.name, 26),
        fields: [
          { key: "name", label: "What is it called", span: true, value: w.name },
          { key: "projectId", label: "Part of which work", type: "select", value: w.projectId,
            options: projectOptions("— reusable across all of it —") },
          { key: "description", label: "What it is for", type: "textarea", span: true, value: w.description }
        ],
        validate: function (v) { return v.name.trim() ? "" : "It needs a name."; },
        onConfirm: function (v) {
          w.name = v.name.trim(); w.projectId = v.projectId; w.description = v.description.trim();
          stamp(w); go(); toast("Saved " + w.name);
        }
      });
    },

    /* --- nodes and edges --- */
    "node-add": function (id) { nodeDialog(id, null); },
    "node-edit": function (id) {
      var n = byId(state.wfNodes, id); if (!n) return;
      nodeDialog(n.workflowId, n);
    },
    "node-del": function (id) {
      var n = byId(state.wfNodes, id); if (!n) return;
      var entered = state.runNodes.filter(function (rn) { return rn.nodeId === n.id; });
      var edges = state.wfEdges.filter(function (e) {
        return e.fromNodeId === n.id || e.toNodeId === n.id;
      });
      /* A NODE A RUN HAS ENTERED IS RETIRED, NEVER DELETED. Deleting it
         would take that run's history with it — the run points at this
         record and nothing else says what the step was. So it leaves the
         canvas and stays readable wherever an old run names it, and the
         confirmation says which of the two is about to happen. */
      var retire = entered.length > 0;
      confirmAction({
        title: retire ? "Retire “" + clip(n.label, 24) + "”?" : "Remove “" + clip(n.label, 24) + "”?",
        message: retire
          ? numWord(entered.length) + " " + plural(entered.length, "run") + " " +
            (entered.length === 1 ? "has" : "have") + " already reached this step, so the record stays: it comes off the procedure and off any new run, and every run that reached it still reads. " +
            (edges.length ? numWord(edges.length) + " " + plural(edges.length, "line") + " to and from it " + (edges.length === 1 ? "goes" : "go") + " too." : "")
          : "No run has reached it, so it goes for good. " +
            (edges.length ? numWord(edges.length) + " " + plural(edges.length, "line") + " to and from it " + (edges.length === 1 ? "goes" : "go") + " too." : "Nothing is joined to it."),
        confirmLabel: retire ? "Retire it" : "Remove it"
      }, function () {
        var keptEdges = state.wfEdges.slice();
        state.wfEdges = state.wfEdges.filter(function (e) {
          return e.fromNodeId !== n.id && e.toNodeId !== n.id;
        });
        if (retire) { n.retired = true; stamp(n); }
        else state.wfNodes = state.wfNodes.filter(function (x) { return x.id !== n.id; });
        bumpWorkflow(n.workflowId);
        go();
        toast((retire ? "Retired " : "Removed ") + clip(n.label, 24), function () {
          state.wfEdges = keptEdges;
          if (retire) { n.retired = false; stamp(n); }
          else state.wfNodes.push(n);
        });
      });
    },
    "thing-add": function (id) { thingDialog(id); },
    "edge-add": function (id) {
      var opts = nodeOptions(id);
      if (opts.length < 2) {
        openModal({
          title: "Two steps first",
          message: "A line joins one step to another, so there have to be two of them. Add a second step and this will have something to join.",
          confirmLabel: "Add a step", cancelLabel: "Not now",
          onConfirm: function () { nodeDialog(id, null); }
        });
        return;
      }
      openModal({
        title: "Join two steps",
        message: "A <b>sequence</b> line says one step comes after another and a run walks it. An <b>association</b> line says two things belong together and means nothing about order — a run never follows one.",
        fields: [
          { key: "from", label: "From", type: "select", options: opts, value: opts[0].value },
          { key: "to", label: "To", type: "select", options: opts, value: opts[1].value },
          { key: "type", label: "Which kind of line", type: "select",
            options: Object.keys(EDGE_TYPES).map(function (k) {
              return { value: k, label: cap(k) + " — " + EDGE_TYPES[k] };
            }) },
          { key: "label", label: "A way out’s answer", placeholder: "yes",
            hint: "Only for a decision: the answer that takes the run down this line." }
        ],
        validate: function (v) {
          if (v.from === v.to) return "A step cannot come after itself.";
          var dup = state.wfEdges.some(function (e) {
            return e.workflowId === id && e.fromNodeId === v.from && e.toNodeId === v.to && e.type === v.type;
          });
          return dup ? "Those two are already joined that way." : "";
        },
        confirmLabel: "Join them",
        onConfirm: function (v) {
          var e = stamp({ id: uid(), workflowId: id, fromNodeId: v.from, toNodeId: v.to,
            type: v.type, label: v.label.trim() });
          state.wfEdges.push(e);
          bumpWorkflow(id);
          go();
          toast("Joined", function () {
            state.wfEdges = state.wfEdges.filter(function (x) { return x.id !== e.id; });
          });
        }
      });
    },

    /* --- runs --- */
    "run-open": function (id) { view = "workflows"; clearOpen(); openRun = id; render(); },
    "run-back": function () { clearOpen(); render(); },
    "run-start": function (id, el) {
      var w = byId(state.workflows, id);
      if (!w) {
        /* Started from a screen with no workflow named, so ask which. A
           refusal has to carry the way out. */
        if (!state.workflows.length) {
          openModal({
            title: "No workflow to run",
            message: "A run is one pass through a procedure, so there has to be a procedure. Write one and it will be runnable from here.",
            confirmLabel: "New workflow", cancelLabel: "Not now",
            onConfirm: function () { ACTIONS["wf-add"](""); }
          });
          return;
        }
        openModal({
          title: "Run a workflow",
          fields: [
            { key: "workflowId", label: "Which procedure", type: "select",
              options: state.workflows.map(function (x) { return { value: x.id, label: x.name }; }) },
            { key: "projectId", label: "For which work", type: "select", options: projectOptions() },
            { key: "title", label: "Call this run", span: true,
              hint: "Left blank it takes the procedure's own name." }
          ],
          confirmLabel: "Start it",
          onConfirm: function (v) { ACTIONS["run-start"](v.workflowId, { _proj: v.projectId, _title: v.title }); }
        });
        return;
      }
      var steps = liveNodes(w.id).filter(function (n) { return n.type !== "thing"; });
      if (!steps.length) {
        openModal({
          title: "Nothing to run yet",
          message: "“" + esc(w.name) + "” has no steps, so a run of it would have nowhere to start. Add the first step and it becomes runnable.",
          confirmLabel: "Add a step", cancelLabel: "Not now",
          onConfirm: function () { view = "workflows"; clearOpen(); openWf = w.id; render(); nodeDialog(w.id, null); }
        });
        return;
      }
      var pid = (el && el._proj != null) ? el._proj
        : (el && el.getAttribute && el.getAttribute("data-proj")) || w.projectId || "";
      var title = (el && el._title) || "";
      var run = startRun(w, pid, title);
      view = "workflows"; clearOpen(); openRun = run.id;
      go();
      toast("Started " + (run.title || w.name) + " · " +
        numWord(entryNodes(w.id).length) + " " + plural(entryNodes(w.id).length, "way") + " in",
        function () {
          state.runNodes = state.runNodes.filter(function (rn) { return rn.runId !== run.id; });
          state.runs = state.runs.filter(function (r) { return r.id !== run.id; });
          clearOpen();
        });
    },
    /* THE ARCHIVE LOCK. A run will not close while a filing step is
       undone, and it says WHICH — filing is the third of the three
       things that actually get forgotten, and a printed-but-never-
       archived run tidied away is exactly the loss this guards. The
       refusal is on `onConfirm`, never `onCancel`: Escape, the scrim and
       the × are the universal "I didn't mean that" and they all fire
       cancel, so a destructive branch there would close the run on the
       one gesture that means don't. */
    "run-close": function (id) {
      var run = byId(state.runs, id); if (!run) return;
      var s = runStand(run);
      if (s.unfiled.length) {
        openModal({
          title: "It has not been filed",
          message: "This run will not close while a filing step is undone: " +
            s.unfiled.map(function (n) { return "<b>" + esc(n.label) + "</b>"; }).join(", ") +
            ". A run that is printed and never archived is the one thing worth keeping on the list.",
          confirmLabel: "Take me to it", cancelLabel: "Leave it open",
          onConfirm: function () { view = "workflows"; clearOpen(); openRun = run.id; render(); }
        });
        return;
      }
      var open = s.active;
      run.completedAt = nowISO(); run.status = "complete"; stamp(run);
      go();
      toast("Closed " + (run.title || s.workflowName) +
        (open ? " · " + numWord(open) + " " + plural(open, "step") + " " +
          (open === 1 ? "was" : "were") + " still open" : ""),
        function () { run.completedAt = ""; run.status = "active"; stamp(run); });
    },

    /* --- one step of a run --- */
    "step-done": function (id) {
      var parts = String(id).split(":");
      var run = byId(state.runs, parts[0]), n = byId(state.wfNodes, parts[1]);
      if (!run || !n) return;
      var before = JSON.stringify(state.runNodes);
      finishRunNode(run, n, "");
      go();
      toast("Done: " + clip(n.label, 30), function () {
        state.runNodes = JSON.parse(before);
      });
    },
    "step-answer": function (id) {
      var parts = String(id).split(":");
      var run = byId(state.runs, parts[0]), n = byId(state.wfNodes, parts[1]);
      if (!run || !n) return;
      var outs = workflowEdges(run.workflowId).filter(function (e) {
        return e.type === "sequence" && e.fromNodeId === n.id;
      });
      if (!outs.length) {
        openModal({
          title: "This decision has no ways out",
          message: "“" + esc(n.label) + "” is a decision, so each answer has to name the step it goes to. Join it to the steps its answers lead to and it becomes answerable.",
          confirmLabel: "Join two steps", cancelLabel: "Not now",
          onConfirm: function () { ACTIONS["edge-add"](run.workflowId); }
        });
        return;
      }
      openModal({
        title: "Answer “" + clip(n.label, 24) + "”",
        message: "Finishing a decision opens ONLY the way out you choose. That is how a revision cycle loops back rather than running on.",
        fields: [{
          key: "answer", label: "Which way out", type: "select",
          options: outs.map(function (e) {
            var t = byId(state.wfNodes, e.toNodeId);
            return { value: e.label || "", label: (e.label ? "“" + e.label + "” → " : "→ ") + (t ? t.label : "(removed)") };
          })
        }],
        confirmLabel: "That is the answer",
        onConfirm: function (v) {
          var before = JSON.stringify(state.runNodes);
          finishRunNode(run, n, v.answer);
          go();
          toast("Answered " + clip(n.label, 24), function () { state.runNodes = JSON.parse(before); });
        }
      });
    },
    "step-chase": function (id) {
      var parts = String(id).split(":");
      var run = byId(state.runs, parts[0]), n = byId(state.wfNodes, parts[1]);
      if (!run || !n) return;
      var rn = enterNode(run, n.id);
      var before = rn.chasedOn;
      rn.chasedOn = today(); stamp(rn); go();
      toast("Chased today — the clock starts again", function () { rn.chasedOn = before; stamp(rn); });
    },
    "step-fail": function (id) {
      var parts = String(id).split(":");
      var run = byId(state.runs, parts[0]), n = byId(state.wfNodes, parts[1]);
      if (!run || !n) return;
      /* A FAILED RUN KEEPS ITS FAILURE POINT and the procedure is not
         touched — which is the whole reason the brief separates the two
         records, and the one thing the old freeze model could not do. */
      openModal({
        title: "Record that “" + clip(n.label, 22) + "” failed",
        message: "The step stays where it is and the run stops advancing through it. Nothing about the procedure changes — the failure belongs to this run.",
        fields: [{ key: "why", label: "What went wrong", type: "textarea", span: true }],
        confirmLabel: "Record it", danger: true,
        onConfirm: function (v) {
          var rn = enterNode(run, n.id);
          var before = { status: rn.status, note: rn.note || "" };
          rn.status = "failed"; rn.note = v.why.trim(); stamp(rn);
          run.status = "failed"; stamp(run);
          go();
          toast("Recorded as failed", function () {
            rn.status = before.status; rn.note = before.note; stamp(rn);
            run.status = "active"; stamp(run);
          });
        }
      });
    },
    "step-reopen": function (id) {
      var parts = String(id).split(":");
      var run = byId(state.runs, parts[0]), n = byId(state.wfNodes, parts[1]);
      if (!run || !n) return;
      var rn = runNodeFor(run.id, n.id); if (!rn) return;
      var before = { completedAt: rn.completedAt, status: rn.status };
      rn.completedAt = ""; rn.status = "active"; stamp(rn); go();
      toast("Reopened " + clip(n.label, 26), function () {
        rn.completedAt = before.completedAt; rn.status = before.status; stamp(rn);
      });
    }
  });

  /* ---------------- a step, and a thing on a workflow ----------------
     A dialog NAMES THE RECORD, not its type. "Edit step" reads as a
     placeholder somebody forgot to fill in, and on a long procedure the
     one thing you want confirmed before typing over a name is which
     name it is. */
  function nodeDialog(wfId, n) {
    var wf = byId(state.workflows, wfId); if (!wf) return;
    openModal({
      title: n ? "Edit " + clip(n.label, 26) : "New step in " + clip(wf.name, 20),
      fields: [
        { key: "label", label: "What happens", span: true, value: n ? n.label : "",
          placeholder: "Send the draft for comments" },
        { key: "type", label: "What kind of step", type: "select", value: n ? n.type : "do",
          options: Object.keys(NODE_TYPES).filter(function (k) { return k !== "thing"; })
            .map(function (k) { return { value: k, label: NODE_TYPES[k].word }; }),
          hint: "Do is yours; Send and Watch wait on somebody else; Decide branches; File puts the work away." },
        { key: "personId", label: "Waiting on", type: "select", options: personOptions(),
          value: n && n.config ? n.config.personId || "" : "",
          hint: "A watch with nobody to chase is a real answer — it is never called late." },
        { key: "chaseAfterDays", label: "Chase after (days)", type: "number", min: 0, step: "1",
          value: n && n.config ? n.config.chaseAfterDays || "" : "",
          hint: "Left blank it can sit for ever without being called late, because nobody said when to chase." },
        { key: "dueAt", label: "On a date", placeholder: "YYYY-MM-DD", more: true,
          value: n && n.config ? n.config.dueAt || "" : "" },
        { key: "path", label: "Where it files to", placeholder: "D:\\Projects\\Anfeh\\final", more: true,
          value: n && n.config ? n.config.path || "" : "" },
        { key: "join", label: "Wait for every way in", type: "select", more: true,
          value: n && n.config ? n.config.join || "" : "",
          options: [{ value: "", label: "No — the first one that arrives starts it" },
                    { value: "all", label: "Yes — hold it until every way in is done" }] },
        { key: "notes", label: "Notes", type: "textarea", span: true, more: true,
          value: n && n.config ? n.config.notes || "" : "" }
      ],
      validate: function (v) {
        if (!v.label.trim()) return "It needs to say what happens.";
        if (v.dueAt && !dayOk(v.dueAt)) return "“" + v.dueAt + "” is not a date that exists. Write it as YYYY-MM-DD.";
        return "";
      },
      confirmLabel: n ? "Save" : "Add it",
      onConfirm: function (v) {
        var cfg = { personId: v.personId, chaseAfterDays: num(v.chaseAfterDays),
          dueAt: v.dueAt, path: v.path.trim(), join: v.join, notes: v.notes.trim() };
        if (n) {
          var before = { label: n.label, type: n.type, config: n.config };
          n.label = v.label.trim(); n.type = v.type; n.config = cfg; stamp(n);
          bumpWorkflow(wfId); go();
          toast("Saved " + clip(n.label, 26), function () {
            n.label = before.label; n.type = before.type; n.config = before.config; stamp(n);
          });
          return;
        }
        var seq = liveNodes(wfId).filter(function (x) { return x.type !== "thing"; });
        var node = stamp({ id: uid(), workflowId: wfId, type: v.type, label: v.label.trim(),
          positionX: 40 + (seq.length % 4) * 220, positionY: 40 + Math.floor(seq.length / 4) * 140,
          config: cfg, retired: false });
        state.wfNodes.push(node);
        /* A new step is JOINED TO THE LAST ONE, because a procedure is a
           sequence and a step floating free is almost never what was
           meant — and the list says so out loud when one is. */
        var last = seq[seq.length - 1];
        var edge = null;
        if (last) {
          edge = stamp({ id: uid(), workflowId: wfId, fromNodeId: last.id, toNodeId: node.id,
            type: "sequence", label: "" });
          state.wfEdges.push(edge);
        }
        bumpWorkflow(wfId); go();
        toast("Added " + clip(node.label, 26) + (last ? " after " + clip(last.label, 20) : " as the way in"),
          function () {
            state.wfNodes = state.wfNodes.filter(function (x) { return x.id !== node.id; });
            if (edge) state.wfEdges = state.wfEdges.filter(function (x) { return x.id !== edge.id; });
          });
      }
    });
  }

  /* A THING ON A WORKFLOW IS A COPY CARRYING `assetId`, never a pointer
     into the registry — and the line it is joined by is an ASSOCIATION
     and never a sequence, because nothing waits on a reference
     photograph and a run does not advance through it. */
  function thingDialog(wfId) {
    var wf = byId(state.workflows, wfId); if (!wf) return;
    var steps = nodeOptions(wfId).filter(function (o) { return o.label.indexOf("(Thing)") < 0; });
    openModal({
      title: "Add a thing to " + clip(wf.name, 20),
      message: "A person, a file, a device, a place. It is joined by an <b>association</b> line, which says nothing about order — so it belongs with a step without coming before it.",
      fields: [
        { key: "assetId", label: "Which thing", type: "select", options: assetOptions("— write in a name instead —") },
        { key: "label", label: "…or its name", value: "",
          hint: "Only needed if it is not in Assets yet." },
        { key: "at", label: "Belongs with which step", type: "select",
          options: [{ value: "", label: "— on its own —" }].concat(steps) }
      ],
      validate: function (v) {
        return (v.assetId || v.label.trim()) ? "" : "Pick something from Assets, or write a name in.";
      },
      confirmLabel: "Add it",
      onConfirm: function (v) {
        var a = v.assetId ? byId(state.assets, v.assetId) : null;
        var node = stamp({ id: uid(), workflowId: wfId, type: "thing",
          label: a ? a.name : v.label.trim(),
          positionX: 60, positionY: 260,
          config: { assetId: v.assetId, personId: "" }, retired: false });
        state.wfNodes.push(node);
        var edge = null;
        if (v.at) {
          edge = stamp({ id: uid(), workflowId: wfId, fromNodeId: v.at, toNodeId: node.id,
            type: "association", label: "" });
          state.wfEdges.push(edge);
        }
        bumpWorkflow(wfId); go();
        toast("Added " + clip(node.label, 26), function () {
          state.wfNodes = state.wfNodes.filter(function (x) { return x.id !== node.id; });
          if (edge) state.wfEdges = state.wfEdges.filter(function (x) { return x.id !== edge.id; });
        });
      }
    });
  }

  function copyText(text, said) {
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", "");
      ta.style.position = "fixed"; ta.style.left = "-9999px";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); toast(said); }
      catch (e) { backupDialog("copy.txt", text, "copy this by hand"); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast(said); }, fallback);
    } else fallback();
  }

  /* THE BRIEF'S PER-KIND FIELDS ARE A HINT, NOT SIXTEEN BOXES. It names
     a file's extension and checksum, an app's category and version, a
     device's serial and accessories, a site's period and type — and
     hardcoding those four sets would be wrong the first time somebody
     records a fifth kind, which the write-in invites. Two of them are
     also figures this app cannot know: a page served over https may not
     read a file at all, so a size and a checksum here would be numbers
     typed by hand and wrong the next time the file is saved. A
     plausible wrong number is worse than a visible failure.

     So `a.facts` is {k, v} — a label and a value, both typed — and the
     brief's own words are the suggestion above the box. */
  var FACT_HINTS = {
    device: "Serial, Specifications, Accessories, Warranty — or anything else you would want to find it by.",
    app:    "Version, Platform, Licence — or anything else about it.",
    site:   "Period, Type, Alternative names. Never a password: this book is not a place for one.",
    file:   "Extension, What made it, Resolution. Not a size or a checksum — the app cannot read the file, so either would be a figure typed by hand and wrong by next week.",
    lib:    "Where it came from, What it assumes, What it was last used on.",
    conn:   "Account, What it is for. Never a password."
  };
  var KIND_HINTS = {
    device: "Laptop, phone, total station, sonar — whatever you would call it.",
    app:    "Software, web service, script runner.",
    site:   "Site, feature, artifact, survey — the app has never heard of these and does not need to.",
    file:   "Dataset, orthophoto, document, point cloud.",
    lib:    "Method, script, formula, reference, template.",
    conn:   "Web service, mail search, shared drive."
  };

        { key: "subjects", label: "What it is about", more: true,

          hint: "A method written out, a script, a formula. Leading spaces are kept — they are what a Python block means." }
      ],
      moreLabel: "More — " + (isLib ? "the body, the subject, and where it sits" : "dates, place, subject and a body"),
      validate: function (v) {
        if (!v.name.trim()) return "It needs a name.";
        if (v.lastUsedOn && !dayOk(v.lastUsedOn)) return "“" + v.lastUsedOn + "” is not a date that exists.";
        if (v.geo.trim()) {
          var g = geoParse(v.geo);
          if (g.bad) return g.bad;
        }
        return "";
      },
      confirmLabel: a ? "Save" : "Add it",
      onConfirm: function (v) {
        var geo = v.geo.trim() ? geoParse(v.geo).geo : null;
        var fields = {
          name: v.name.trim(), type: v.type.trim(), section: v.section,
          url: v.url.trim(), path: v.path.trim(), state: v.state,
          lastUsedOn: v.lastUsedOn, description: v.description.trim(),
          atId: v.atId, geo: geo, lang: v.lang.trim(),
          /* The body is never trimmed at the FRONT: leading whitespace
             is what a Python block means. Only the blank lines a
             textarea collects at the end go. */
          body: v.body.replace(/\s+$/, ""),
          subjects: v.subjects.split(",").map(function (s) { return s.trim(); })
            .filter(Boolean).filter(function (s, i, arr) {
              return arr.findIndex(function (x) { return x.toLowerCase() === s.toLowerCase(); }) === i;
            })
        };
        if (a) {
          var before = JSON.parse(JSON.stringify(a));
          Object.keys(fields).forEach(function (k) { a[k] = fields[k]; });
          stamp(a); go();
          toast("Saved " + clip(a.name, 26), function () {
            Object.keys(before).forEach(function (k) { a[k] = before[k]; });
          });
          return;
        }
        var rec = stamp(Object.assign({ id: uid(), facts: [], fromIds: [], topics: [],
          archived: false, createdAt: nowISO() }, fields));
        state.assets.push(rec);
        repoSect = rec.section;
        go();
        toast("Added " + clip(rec.name, 26), function () {
          state.assets = state.assets.filter(function (x) { return x.id !== rec.id; });
        });
      }
    });
  }

  /* "HOW BIG" IS DERIVED AND SAYS SO. One spherical degree — 111,320
     metres, longitude times the cosine of the latitude — which is right
     to well inside a percent across a site and wrong in the last digit by
     construction. So every figure built on it reads "about". It is the
     only derived number here; everything else is stated. */
  var DEG_M = 111320;
  function geoSpan(g) {
    var ns = Math.abs(g.lat2 - g.lat) * DEG_M;
    var ew = Math.abs(g.lon2 - g.lon) * DEG_M * Math.cos(g.lat * Math.PI / 180);
    return "about " + Math.round(ew) + " m east–west by " + Math.round(ns) + " m north–south";
  }

  /* DECIMAL DEGREES AND NOTHING ELSE, and it says what it wanted. A
     parser that took 34°20′20″N would be guessing about primes,
     hemispheres and three punctuation conventions — and a coordinate is
     never rounded on its way back out, because four decimal places is
     about eleven metres, which is the difference between two trenches. */
  function geoParse(raw) {
    var parts = String(raw).split(",").map(function (s) { return s.trim(); }).filter(Boolean);
    if (!parts.length) return { geo: null };
    for (var i = 0; i < parts.length; i++) {
      if (!/^-?\d+(\.\d+)?$/.test(parts[i])) {
        return { bad: "“" + parts[i] + "” is not a decimal number. Degrees and minutes are not read here — write 34.3390." };
      }
    }
    if (parts.length !== 2 && parts.length !== 4) {
      return { bad: "Two numbers make a point and four make an extent. " + numWord(parts.length) +
        " is neither." };
    }
    var n = parts.map(parseFloat);
    if (Math.abs(n[0]) > 90) return { bad: n[0] + " is not a latitude — it has to be between -90 and 90." };
    if (Math.abs(n[1]) > 180) return { bad: n[1] + " is not a longitude — it has to be between -180 and 180." };
    if (parts.length === 2) return { geo: { lat: n[0], lon: n[1] } };
    if (Math.abs(n[2]) > 90) return { bad: n[2] + " is not a latitude." };
    if (Math.abs(n[3]) > 180) return { bad: n[3] + " is not a longitude." };
    return { geo: { lat: Math.min(n[0], n[2]), lon: Math.min(n[1], n[3]),
                    lat2: Math.max(n[0], n[2]), lon2: Math.max(n[1], n[3]) } };
  }

  /* EMPTYING THE VALUE IS HOW A ROW COMES OFF, and the dialog says so —
     a two-field record does not need a second delete button. The same
     label with the same value is a double tap rather than two facts, so
     only the exact pair refuses: two accessories both labelled
     "Accessory" are genuinely two facts. */
  function factDialog(assetId, factId) {
    var a = byId(state.assets, assetId); if (!a) return;
    var f = factId ? (a.facts || []).filter(function (x) { return x.id === factId; })[0] : null;
    openModal({
      title: f ? "Edit “" + clip(f.k, 20) + "”" : "Note something about " + clip(a.name, 20),
      message: f ? "Empty the value to take the row off the table."
                 : "It goes on this thing’s own facts, and the finder will read it — so a serial number is findable by typing the serial number.",
      fields: [
        { key: "k", label: "What is it called", value: f ? f.k : "", hint: FACT_HINTS[a.section || "file"] || "" },
        { key: "v", label: "And what is it", value: f ? f.v : "" }
      ],
      validate: function (v) {
        if (!v.k.trim()) return "It needs a label, or the row is one nobody can read.";
        if (!f && !v.v.trim()) return "It needs a value.";
        var dup = (a.facts || []).some(function (x) {
          return x.id !== (f ? f.id : "") && x.k.trim() === v.k.trim() && x.v.trim() === v.v.trim();
        });
        return dup ? "That exact label and value is already on the table." : "";
      },
      confirmLabel: f ? "Save" : "Note it",
      onConfirm: function (v) {
        var before = JSON.parse(JSON.stringify(a.facts || []));
        a.facts = a.facts || [];
        if (f) {
          if (!v.v.trim()) a.facts = a.facts.filter(function (x) { return x.id !== f.id; });
          else { f.k = v.k.trim(); f.v = v.v.trim(); }
        } else {
          a.facts.push({ id: uid(), k: v.k.trim(), v: v.v.trim() });
        }
        stamp(a); go();
        toast(f && !v.v.trim() ? "Took “" + clip(v.k, 20) + "” off" : "Noted",
          function () { a.facts = before; stamp(a); });
      }
    });
  }

  /* A date noted here is a RECORD, and the calendar only reads it — the
     brief's own rule, and the reason the grid can never disagree with
     the list under it: both walk the same records. */
  function schedDialog(r) {
    openModal({
      title: r ? "Edit " + clip(r.title, 26) : "Note a date",
      message: r ? "" : "A meeting, a deadline, a day in the field. Nothing is typed into the calendar itself — this is a record the calendar then reads.",
      fields: [

        { key: "kind", label: "What kind of day", type: "select", value: r ? r.kind : "date",
          options: [{ value: "date", label: "A date" }, { value: "meeting", label: "A meeting" },
                    { value: "fieldwork", label: "Fieldwork" }, { value: "training", label: "Training" },
                    { value: "deadline", label: "A deadline" }] },
        { key: "projectId", label: "Which work", type: "select", value: r ? r.projectId : "",
          options: projectOptions() },
        { key: "notes", label: "Notes", type: "textarea", span: true, more: true, value: r ? r.notes || "" : "" }
      ],
      validate: function (v) {

          : "It needs a day \u2014 an undated record stays undated, and belongs on Actions rather than here.";
        return "";
      },
      confirmLabel: r ? "Save" : "Note it",
      onConfirm: function (v) {
        if (r) {
          var before = JSON.parse(JSON.stringify(r));
          r.title = v.title.trim(); r.at = v.at; r.kind = v.kind;
          r.projectId = v.projectId; r.notes = v.notes.trim();

          projectId: v.projectId, notes: v.notes.trim() });
        state.schedule.push(rec);
        monthOf = v.at.slice(0, 7); dayOf = "";

          state.schedule = state.schedule.filter(function (x) { return x.id !== rec.id; });
        });
      }
    });
  }

  function paintTheme() {
    var t = state.settings.theme;
    if (t) document.documentElement.setAttribute("data-theme", t);
    else document.documentElement.removeAttribute("data-theme");
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute("content", t === "light" ? "#f4efe4" : "#1b1e24");
  }

/* ============================================================
   Shared runtime for all of these apps.

   Two rules learned the hard way, because a published page runs inside
   a sandboxed frame:
     • native confirm() silently returns false  -> never use it
     • <form> submit events never fire          -> never rely on them
   So: every confirmation is an in-page modal, and every action is an
   explicit button click with Enter wired up by hand.
   ============================================================ */

var STORE_KEY = APP.storeKey;

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function num(v) { var n = parseFloat(v); return isFinite(n) ? n : 0; }
function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }
function pad2(n) { return String(n).padStart(2, "0"); }

function iso(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
function today() { return iso(new Date()); }
function parseISO(s) { return new Date(s + "T00:00:00"); }
function addDays(dateStr, n) { var d = parseISO(dateStr); d.setDate(d.getDate() + n); return iso(d); }
function daysBetween(a, b) { return Math.round((parseISO(b) - parseISO(a)) / 86400000); }
function daysUntil(s) { return daysBetween(today(), s); }

function dayName(dateStr, style) {
  return parseISO(dateStr).toLocaleDateString(undefined, { weekday: style || "short" });
}
function niceDate(dateStr) {
  var d = daysUntil(dateStr);
  if (d === 0) return "today";
  if (d === 1) return "tomorrow";
  if (d === -1) return "yesterday";
  return parseISO(dateStr).toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
// Monday-start week containing dateStr
function weekStart(dateStr) {
  var d = parseISO(dateStr);
  var shift = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - shift);
  return iso(d);
}

/* ---------------- storage ---------------- */

/* Two ways the record can be in trouble, and the app used to carry on as
   though neither had happened.

   **It could not be read.** A truncated write, a half-finished sync, a pasted
   backup missing its tail — `JSON.parse` throws, the catch returned a blank
   shape, and the app opened on its first-run screen with not one word said. The
   only rational reading of that screen is "everything is gone", while the text
   was still sitting in storage, and the next thing that saved would write over
   it. An empty book presented as your book is the worst failure this app can
   have, so the raw text is KEPT and `persist()` refuses until somebody decides.

   **It could not be written.** The old code toasted and moved on: four seconds
   later nothing said so, and the screen went on showing a change that would
   vanish on reload. Worse, the sample's own "Example loaded" toast landed
   directly after two failures, so the app claimed success immediately after
   admitting failure. A refused save is sticky now, and the first one opens the
   backup dialog so the work can be copied out of the page it is still in. */
var bookTrouble = { unread: null, unsaved: false, said: false };

function loadState(shape) {
  var raw = null;
  try { raw = localStorage.getItem(STORE_KEY); } catch (e) { raw = null; }
  if (!raw) return shape();
  try {
    return APP.hydrate(JSON.parse(raw), shape());
  } catch (e) {
    bookTrouble.unread = { raw: raw, why: String((e && e.message) || e) };
    return shape();
  }
}

function persist(state) {
  // The unreadable text is the only copy of the work. Writing a blank book
  // over it IS the loss, so nothing is written until it has been dealt with.
  if (bookTrouble.unread) { alarmPaint(); return false; }
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
    if (bookTrouble.unsaved) { bookTrouble.unsaved = false; alarmPaint(); }
    return true;
  } catch (e) {
    bookTrouble.unsaved = true;
    alarmPaint();
    if (!bookTrouble.said) {
      bookTrouble.said = true;
      /* Deferred, because this can be reached from inside a dialog's confirm —
         `go()` saves — and backupDialog takes over the overlay. Opening it on
         top of a closing dialog leaves the scrim behind. */
      var text = "";
      try { text = JSON.stringify(state, null, 2); } catch (e2) { text = ""; }
      setTimeout(function () {
        if (!text) return;
        backupDialog(STORE_KEY + "-unsaved.json", text,
          "this could not be saved to the browser — keep a copy");
      }, 0);
    }
    return false;
  }
}

/* The standing alarm. Not a toast: a toast is for something that happened, and
   these are states the app is IN — it will keep being true until somebody acts,
   so it has to keep being on the screen. Wired with real listeners rather than
   `data-act`, so it works in every app that shares this runtime without any of
   them having to add an action. */
function alarmPaint() {
  var el = document.getElementById("alarm");
  if (!el) return;
  if (bookTrouble.unread) {
    var kb = (bookTrouble.unread.raw.length / 1024).toFixed(1);
    el.innerHTML = '<div class="alarm-box"><b>This book could not be read, and nothing has been saved over it.</b>' +
      "<p>There are " + kb + " KB of text in this browser's storage that is not valid " +
      "— a half-finished write, or a backup pasted in short. What you are looking at is an " +
      "EMPTY book, not yours: nothing has been lost yet, and nothing will be saved until you choose.</p>" +
      '<div class="alarm-acts"><button class="btn primary" data-alarm="keep">Show me the text</button>' +
      '<button class="btn danger" data-alarm="fresh">Throw it away and start fresh</button></div></div>';
    el.querySelector('[data-alarm="keep"]').addEventListener("click", function () {
      backupDialog(STORE_KEY + "-damaged.txt", bookTrouble.unread.raw,
        "the text as it is, unreadable — " + bookTrouble.unread.why);
    });
    el.querySelector('[data-alarm="fresh"]').addEventListener("click", function () {
      confirmAction({
        title: "Throw away the unreadable text?",
        confirmLabel: "Throw it away",
        message: "It is the only copy of whatever was in this browser. Copy it out first if you have not — " +
          "<b>Show me the text</b> hands it to you. After this the app saves normally again and that text is gone."
      }, function () {
        bookTrouble.unread = null;
        alarmPaint();
        save();
        render();
        toast("Starting fresh. Saving works again.");
      });
    });
    return;
  }
  if (bookTrouble.unsaved) {
    /* One line, not a card. The unread alarm can take the top of the screen
       because the page behind it is an empty book and covering it costs
       nothing; this one stands while you carry on working, and a three-line
       card permanently over the top of every screen is its own problem. The
       whole essential fact fits on one line. */
    el.innerHTML = '<div class="alarm-box thin"><b>Not saved.</b>' +
      "<span>Storage is full or blocked, so everything on screen lives only in this tab.</span>" +
      '<button class="btn primary" data-alarm="copy">Copy my book out</button></div>';
    el.querySelector('[data-alarm="copy"]').addEventListener("click", function () {
      var text = "";
      try { text = JSON.stringify(state, null, 2); } catch (e) {}
      if (text) backupDialog(STORE_KEY + "-unsaved.json", text, "what is on the screen, unsaved");
    });
    return;
  }
  el.innerHTML = "";
}

/* ---------------- modal ---------------- */

var overlay, escHandler = null;

function closeModal() {
  overlay.innerHTML = "";
  if (escHandler) { document.removeEventListener("keydown", escHandler); escHandler = null; }
}

/* Escape and a focus trap, for ANY dialog in the overlay. Tab used to walk out
   of the last button and into the page behind the scrim, where a keyboard
   reader could reach controls they could neither see nor click.

   Extracted because openModal was not the only dialog: the backup and restore
   dialogs build the overlay by hand, so they had no Escape at all — the one
   key everybody presses to get out of a modal did nothing, and Tab walked
   straight through the scrim. Anything that writes overlay.innerHTML itself
   calls this. */
function trapOverlay(onEscape) {
  /* `offsetParent !== null` is NOT enough once a dialog can fold fields away.
     Chrome keeps the children of a closed <details> in the layout tree
     (content-visibility: hidden), so they have an offsetParent and Tab walked
     straight into seven fields nobody could see — which is the same fault as
     Tab walking out through the scrim, one level in. The closed-fold test is
     explicit rather than relying on `checkVisibility`, whose options are not
     the same everywhere. */
  var trap = function () {
    return Array.prototype.filter.call(
      overlay.querySelectorAll("button, input, select, textarea, a[href], label, [tabindex]:not([tabindex='-1'])"),
      function (el) {
        if (el.disabled || el.offsetParent === null) return false;
        var fold = el.closest && el.closest("details:not([open])");
        return !(fold && fold !== el && fold.querySelector("summary") !== el);
      });
  };
  escHandler = function (e) {
    if (e.key === "Escape") { closeModal(); if (onEscape) onEscape(); return; }
    if (e.key !== "Tab") return;
    var f = trap();
    if (!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if (!overlay.contains(document.activeElement)) { e.preventDefault(); first.focus(); return; }
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  };
  document.addEventListener("keydown", escHandler);
}

// fields: [{key,label,type,value,options,placeholder,step,min,hint,span,rows}]
function openModal(opts) {
  closeModal();
  var fields = opts.fields || [];

  var html = '<div class="scrim" data-scrim="1"><div class="modal"' +
    (opts.wide ? ' style="max-width:620px"' : "") +
    ' role="dialog" aria-modal="true" aria-label="' + esc(opts.title) + '">' +
    '<div class="modal-head"><h3>' + esc(opts.title) + "</h3>" +
    (opts.message ? "<p>" + opts.message + "</p>" : "") + "</div>";

  /* `more: true` puts a field behind a fold. A dialog asking twelve questions
     is a dialog people close, and the registry's asked for a name, a kind, a
     write-in, which list, a path, a link, where it is kept, how it stands,
     when it was last used, when it was made, what it is part of, what it is
     about and a note — four of which are what anybody actually types. Same
     reasoning as `showWhen`, one level up: a field needed one time in five
     should not be on screen every time.

     Native `<details>`, so a closed fold is out of the tab order for free
     (its contents have no `offsetParent`, which is exactly what
     `trapOverlay` filters on), and `collect()` reads by id, so a folded
     field is still read and still saved. The summary says how many, because
     a fold that does not is a fold nobody opens. */
  if (fields.length) {
    var fieldHtml = function (f) {
      var id = "mf_" + f.key, inner;
      if (f.type === "select") {
        /* An option, or a GROUP of them: `{group, options}` becomes an
           <optgroup>, so a picker over a hundred things can say which section
           each one came from. Native, so on a phone it is the operating
           system's own picker with the headings in it rather than a list this
           app would have to build, scroll and trap focus in. A group carries
           no value of its own — anything that needs a first entry to default
           to has to flatten the list first, which is the lesson Coffer's
           `accountOptions()` learned by defaulting a debt payment to
           `undefined`. */
        function optHtml(o) {
          var v = typeof o === "string" ? o : o.value;
          var l = typeof o === "string" ? o : o.label;
          return '<option value="' + esc(v) + '"' + (String(v) === String(f.value) ? " selected" : "") + ">" + esc(l) + "</option>";
        }
        inner = '<select id="' + id + '">' + (f.options || []).map(function (o) {
          if (o && o.group && o.options) {
            return '<optgroup label="' + esc(o.group) + '">' +
              o.options.map(optHtml).join("") + "</optgroup>";
          }
          return optHtml(o);
        }).join("") + "</select>";
      } else if (f.type === "textarea") {
        inner = '<textarea id="' + id + '" rows="' + (f.rows || 4) + '" spellcheck="false" placeholder="' +
          esc(f.placeholder || "") + '">' + esc(f.value == null ? "" : f.value) + "</textarea>";
      } else {
        inner = '<input id="' + id + '" type="' + (f.type || "text") + '" value="' + esc(f.value == null ? "" : f.value) + '"' +
          (f.placeholder ? ' placeholder="' + esc(f.placeholder) + '"' : "") +
          (f.type === "number" ? ' step="' + (f.step || "0.01") + '"' : "") +
          (f.min != null ? ' min="' + f.min + '"' : "") + ' autocomplete="off" />';
      }
      /* showWhen: {key, is} keeps a field out of the way until the field it
         depends on has that value. The write-in box beside an "Other" picker
         was on screen in every one of these dialogs, under the words "only
         needed if you picked Other above" — a whole extra field, always, to
         serve the one time in fifty it is used. */
      return '<div class="field' + (f.span ? " wide" : "") + '"' +
        (f.showWhen ? ' data-when="' + esc(f.showWhen.key) + '" data-is="' + esc(f.showWhen.is) + '" hidden' : "") +
        '><label class="label" for="' + id + '">' + esc(f.label) + "</label>" + inner +
        (f.hint ? '<span class="hint">' + esc(f.hint) + "</span>" : "") + "</div>";
    };
    var plain = fields.filter(function (f) { return !f.more; });
    var extra = fields.filter(function (f) { return f.more; });
    html += '<div class="modal-body"><div class="fields">' +
      plain.map(fieldHtml).join("") + "</div>";
    if (extra.length) {
      html += '<details class="modal-more"><summary>' +
        esc(opts.moreLabel || ("More \u2014 " + extra.length + (extra.length === 1 ? " field" : " fields"))) +
        '</summary><div class="fields">' + extra.map(fieldHtml).join("") + "</div></details>";
    }
    html += (opts.extraBody || "") + "</div>";
  } else if (opts.extraBody) {
    html += '<div class="modal-body">' + opts.extraBody + "</div>";
  }

  html += '<p class="modal-bad" data-mbad="1" role="alert" hidden></p>' +
    '<div class="modal-foot">' +
    '<button class="btn quiet" data-mclose="1">' + esc(opts.cancelLabel || "Cancel") + "</button>" +
    '<button class="btn ' + (opts.danger ? "danger" : "primary") + '" data-mok="1">' +
    esc(opts.confirmLabel || "Save") + "</button></div></div></div>";

  overlay.innerHTML = html;

  function collect() {
    var out = {};
    fields.forEach(function (f) {
      var el = document.getElementById("mf_" + f.key);
      out[f.key] = f.type === "number" ? num(el.value) : el.value;
    });
    return out;
  }
  /* A refusal belongs in the dialog. It used to go to a toast at the foot of
     the page — 340px below the button on a tall window, behind the eye that
     was on the form — and a toast is also where every routine success goes,
     so the one message that means "nothing happened" looked like all the ones
     that mean "it worked". role="alert" so it is announced as well as shown. */
  function say(bad) {
    var el = overlay.querySelector("[data-mbad]");
    if (!el) { toast(bad); return; }
    el.textContent = bad;
    el.hidden = false;
  }
  function accept() {
    var v = collect();
    if (opts.validate) {
      var bad = opts.validate(v);
      if (bad) { say(bad); return; }
    }
    closeModal();
    if (opts.onConfirm) opts.onConfirm(v);
  }

  overlay.querySelector("[data-mok]").addEventListener("click", accept);
  overlay.querySelector("[data-mclose]").addEventListener("click", function () {
    closeModal(); if (opts.onCancel) opts.onCancel();
  });
  overlay.querySelector("[data-scrim]").addEventListener("mousedown", function (e) {
    if (e.target === e.currentTarget) { closeModal(); if (opts.onCancel) opts.onCancel(); }
  });
  overlay.querySelectorAll(".modal input").forEach(function (i) {
    i.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); accept(); } });
  });
  overlay.querySelectorAll(".modal input, .modal select, .modal textarea").forEach(function (i) {
    i.addEventListener("input", function () {
      var el = overlay.querySelector("[data-mbad]");
      if (el && !el.hidden) el.hidden = true;     // the message outlived the problem
    });
  });

  // Fields that only apply once another answer has been given.
  function dependants() {
    overlay.querySelectorAll("[data-when]").forEach(function (wrap) {
      var on = document.getElementById("mf_" + wrap.getAttribute("data-when"));
      var want = wrap.getAttribute("data-is");
      var show = !!on && String(on.value) === want;
      wrap.hidden = !show;
      if (!show) { var f = wrap.querySelector("input, select, textarea"); if (f) f.value = ""; }
    });
  }
  overlay.querySelectorAll(".modal select, .modal input").forEach(function (i) {
    i.addEventListener("change", dependants);
  });
  dependants();

  trapOverlay(opts.onCancel);

  var firstField = overlay.querySelector(".modal input, .modal select, .modal textarea");
  if (firstField) firstField.focus(); else overlay.querySelector("[data-mok]").focus();
  if (opts.afterOpen) opts.afterOpen();
}

function confirmAction(opts, onYes) {
  openModal({
    title: opts.title, message: opts.message,
    confirmLabel: opts.confirmLabel || "Delete",
    cancelLabel: opts.cancelLabel || "Keep it",
    danger: opts.danger !== false,
    onConfirm: onYes
  });
}

/* ---------------- toast + undo ---------------- */

function toast(msg, undo) {
  var box = document.getElementById("toasts");
  var el = document.createElement("div");
  el.className = "toast";
  /* While the book cannot be written, EVERY message the app gives you says so.
     Without this the app contradicted itself in two channels at once: the
     alarm said the last change was not saved, and a toast beside it said
     "Headphone firmware — next in 90 days · Undo", which reads as done and
     durable. One place, because every success message in every app that shares
     this runtime comes through here. */
  el.innerHTML = "<span>" + esc(msg) +
    (bookTrouble.unsaved ? " \u00b7 <b>not saved</b>" : "") + "</span>";
  function remove() { if (el.parentNode) el.parentNode.removeChild(el); }
  if (undo) {
    var b = document.createElement("button");
    b.textContent = "Undo";
    b.addEventListener("click", function () { undo(); remove(); save(); render(); });
    el.appendChild(b);
  }
  box.appendChild(el);
  while (box.children.length > 3) box.removeChild(box.firstChild);
  setTimeout(remove, undo ? 7000 : 3800);
}

/* ---------------- download ---------------- */

function download(name, content, mime) {
  try {
    var blob = new Blob([content], { type: mime });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = name; a.rel = "noopener";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  } catch (e) {
    toast("This browser blocked the download. Open the saved file directly rather than in a preview frame.");
  }
}
/* A file save can be ignored outright by the browser — inside an embedded
   frame it fails with no error at all — so never claim success. Always offer
   the text too: that route cannot silently fail. */
function backupDialog(name, text, summary) {
  closeModal();
  overlay.innerHTML = '<div class="scrim" data-scrim="1"><div class="modal" style="max-width:640px" role="dialog" aria-modal="true" aria-label="Your backup">' +
    '<div class="modal-head"><h3>Your backup</h3>' +
    "<p>Two ways to keep this. <b>Save as file</b> puts it in your downloads — but some browsers block that " +
    "silently, so if nothing turns up there, use <b>Copy</b> and paste it somewhere safe. Either can be " +
    "restored later.</p></div>" +
    '<div class="modal-body">' +
    '<textarea id="bkText" readonly rows="9" spellcheck="false" ' +
    'style="width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:0.76rem;padding:0.6rem;' +
    'border-radius:8px;border:1px solid var(--rule-mid);background:var(--raised);color:var(--ink);resize:vertical">' +
    esc(text) + "</textarea>" +
    '<p class="hint" style="margin-top:0.5rem">' + (text.length / 1024).toFixed(1) + " KB" +
    (summary ? " · " + esc(summary) : "") + "</p></div>" +
    '<div class="modal-foot">' +
    '<button class="btn quiet" data-mclose="1">Done</button>' +
    '<button class="btn" id="bkFile">Save as file</button>' +
    '<button class="btn primary" id="bkCopy">Copy</button>' +
    "</div></div></div>";

  var ta = document.getElementById("bkText");
  trapOverlay();
  ta.focus();
  overlay.querySelector("[data-mclose]").addEventListener("click", closeModal);
  overlay.querySelector("[data-scrim]").addEventListener("mousedown", function (e) {
    if (e.target === e.currentTarget) closeModal();
  });
  document.getElementById("bkFile").addEventListener("click", function () {
    download(name, text, "application/json");
    toast("If nothing appears in your downloads, this browser blocked it — use Copy.");
  });
  document.getElementById("bkCopy").addEventListener("click", function () {
    function fallback() {
      ta.removeAttribute("readonly");
      ta.focus();
      ta.setSelectionRange(0, ta.value.length);
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) {}
      ta.setAttribute("readonly", "readonly");
      toast(ok ? "Backup copied — paste it somewhere safe."
               : "Couldn't copy automatically. The text is selected — copy it by hand.");
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        toast("Backup copied — paste it somewhere safe.");
      }, fallback);
    } else { fallback(); }
  });
}

// describe(parsed) -> string summary, or null if it isn't one of ours
function restoreDialog(describe, onJson) {
  closeModal();
  overlay.innerHTML = '<div class="scrim" data-scrim="1"><div class="modal" style="max-width:640px" role="dialog" aria-modal="true" aria-label="Restore a backup">' +
    '<div class="modal-head"><h3>Restore a backup</h3>' +
    "<p>Paste the backup text below, or pick the .json file if you saved one. Everything currently in this " +
    "browser will be replaced — you'll get one more chance to confirm.</p></div>" +
    '<div class="modal-body">' +
    '<textarea id="rsText" rows="9" spellcheck="false" placeholder=\'{ "version": 1, … }\' ' +
    'style="width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:0.76rem;padding:0.6rem;' +
    'border-radius:8px;border:1px solid var(--rule-mid);background:var(--surface);color:var(--ink);resize:vertical"></textarea>' +
    '<div id="rsInfo" class="hint" style="margin-top:0.5rem">Nothing pasted yet.</div></div>' +
    '<div class="modal-foot">' +
    '<button class="btn quiet" data-mclose="1">Cancel</button>' +
    '<label class="btn" style="cursor:pointer">Choose a file' +
    '<input type="file" id="rsFile" accept="application/json,.json" style="display:none" /></label>' +
    '<button class="btn primary" id="rsGo">Restore</button>' +
    "</div></div></div>";

  var ta = document.getElementById("rsText");
  var info = document.getElementById("rsInfo");

  function peek() {
    var t = ta.value.trim();
    if (!t) { info.textContent = "Nothing pasted yet."; info.style.color = ""; return null; }
    var p;
    try { p = JSON.parse(t); }
    catch (e) { info.textContent = "That isn't valid JSON yet — make sure you pasted all of it."; info.style.color = "var(--warn)"; return null; }
    var sum = describe(p);
    if (!sum) { info.textContent = "Valid JSON, but it isn't a backup from this app."; info.style.color = "var(--warn)"; return null; }
    info.textContent = "Looks good — " + sum + ".";
    info.style.color = "var(--gain)";
    return p;
  }

  ta.addEventListener("input", peek);
  trapOverlay();
  ta.focus();
  overlay.querySelector("[data-mclose]").addEventListener("click", closeModal);
  overlay.querySelector("[data-scrim]").addEventListener("mousedown", function (e) {
    if (e.target === e.currentTarget) closeModal();
  });
  document.getElementById("rsFile").addEventListener("change", function (e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    var r = new FileReader();
    r.onload = function () { ta.value = r.result; peek(); };
    r.readAsText(file);
  });
  document.getElementById("rsGo").addEventListener("click", function () {
    var parsed = peek();
    if (!parsed) { toast("Paste a valid backup first."); return; }
    closeModal();
    onJson(parsed);
  });
  ta.focus();
}

function csvEscape(rows) {
  return rows.map(function (r) {
    return r.map(function (c) {
      var s = String(c == null ? "" : c).replace(/"/g, '""');
      return /[",\n]/.test(s) ? '"' + s + '"' : s;
    }).join(",");
  }).join("\n");
}

/* ---------------- tooltip ---------------- */

var tipEl;
function showTip(text, x, y) {
  tipEl.textContent = text;
  tipEl.style.left = x + "px";
  tipEl.style.top = y + "px";
  tipEl.classList.add("on");
}
function hideTip() { tipEl.classList.remove("on"); }

function wireHovers(root) {
  root.querySelectorAll("[data-tip]").forEach(function (el) {
    el.addEventListener("mousemove", function (e) { showTip(el.getAttribute("data-tip"), e.clientX, e.clientY); });
    el.addEventListener("mouseleave", hideTip);
  });
}

/* ---------------- charts ---------------- */

function areaChart(points, o) {
  o = o || {};
  if (!points.length) return "";
  var W = 100, H = o.height || 40, pad = 2;
  var vals = points.map(function (p) { return p.value; });
  var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  if (o.baseZero && lo > 0) lo = 0;
  if (lo === hi) { lo -= 1; hi += 1; }
  var span = hi - lo;
  function px(i) { return pad + (points.length === 1 ? (W - 2 * pad) / 2 : i * (W - 2 * pad) / (points.length - 1)); }
  function py(v) { return H - pad - ((v - lo) / span) * (H - 2 * pad); }

  var line = points.map(function (p, i) { return (i ? "L" : "M") + px(i).toFixed(2) + " " + py(p.value).toFixed(2); }).join(" ");
  var area = line + " L" + px(points.length - 1).toFixed(2) + " " + (H - pad) + " L" + px(0).toFixed(2) + " " + (H - pad) + " Z";
  var gid = "g" + Math.random().toString(36).slice(2, 8);
  var stroke = o.color || "var(--c1)";
  var zero = (lo < 0 && hi > 0)
    ? '<line x1="' + pad + '" y1="' + py(0).toFixed(2) + '" x2="' + (W - pad) + '" y2="' + py(0).toFixed(2) +
      '" stroke="var(--rule-strong)" stroke-width="0.25" vector-effect="non-scaling-stroke" />' : "";
  var hits = points.map(function (p, i) {
    var w = (W - 2 * pad) / points.length;
    return '<rect data-tip="' + esc(p.tip || p.label) + '" x="' + (px(i) - w / 2).toFixed(2) +
      '" y="0" width="' + w.toFixed(2) + '" height="' + H + '" fill="transparent" />';
  }).join("");

  return '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none" style="height:' +
    (o.cssHeight || 100) + 'px" role="img" aria-label="' + esc(o.aria || "trend") + '">' +
    '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0%" stop-color="' + stroke + '" stop-opacity="0.26" />' +
    '<stop offset="100%" stop-color="' + stroke + '" stop-opacity="0.02" /></linearGradient></defs>' +
    zero + '<path d="' + area + '" fill="url(#' + gid + ')" />' +
    '<path d="' + line + '" fill="none" stroke="' + stroke + '" stroke-width="1.1" stroke-linejoin="round" ' +
    'stroke-linecap="round" vector-effect="non-scaling-stroke" />' +
    '<circle cx="' + px(points.length - 1).toFixed(2) + '" cy="' + py(points[points.length - 1].value).toFixed(2) +
    '" r="1.5" fill="' + stroke + '" stroke="var(--surface)" stroke-width="0.6" />' + hits + "</svg>";
}

function barChart(rows, o) {
  o = o || {};
  var H = o.height || 118;
  var max = Math.max.apply(null, rows.map(function (r) { return r.value; }).concat([o.min || 1]));
  return '<div style="display:flex;align-items:flex-end;gap:' + (o.gap || "0.4rem") +
    ';border-bottom:1px solid var(--rule-strong);padding-top:0.3rem">' +
    rows.map(function (r) {
      var h = r.value > 0 ? Math.max(Math.round(r.value / max * H), 2) : 0;
      return '<div style="flex:1;display:flex;align-items:flex-end;justify-content:center;height:' + H + 'px">' +
        '<div data-tip="' + esc(r.tip || (r.label + ": " + r.value)) + '" style="width:62%;max-width:26px;height:' + h +
        "px;background:" + (r.color || o.color || "var(--c1)") + ';border-radius:3px 3px 0 0"></div></div>';
    }).join("") + "</div>" +
    '<div style="display:flex;gap:' + (o.gap || "0.4rem") + ';margin-top:0.35rem">' +
    rows.map(function (r) {
      return '<span style="flex:1;text-align:center;font-size:0.66rem;color:var(--faint)">' + esc(r.label) + "</span>";
    }).join("") + "</div>";
}

function meter(pct, color, pacePct) {
  return '<div class="meter">' +
    (pacePct != null && pacePct > 0.02 && pacePct < 0.98
      ? '<div class="meter-pace" style="left:' + (pacePct * 100).toFixed(1) + '%"></div>' : "") +
    '<div class="meter-fill" style="width:' + (clamp(pct, 0, 1) * 100).toFixed(1) + "%;background:" + color + '"></div></div>';
}

/* ---------------- shared bits of markup ---------------- */

function pageHead(title, sub, right) {
  return '<div class="page-head"><div><h2>' + esc(title) + "</h2>" +
    (sub ? "<p>" + sub + "</p>" : "") + "</div>" + (right || "") + "</div>";
}
function notesHtml(notes, emptyMsg) {
  if (!notes.length) return '<p class="empty">' + esc(emptyMsg) + "</p>";
  return '<div class="notes">' + notes.map(function (n) {
    return '<div class="note"><span class="note-mark ' + n.tone + '">' + n.mark + "</span><div>" + n.html + "</div></div>";
  }).join("") + "</div>";
}
function tile(label, fig, foot, cls) {
  return '<div class="tile"><span class="label">' + esc(label) + '</span><div class="tile-fig' +
    (cls ? " " + cls : "") + '"' + (cls === "gain" ? ' style="color:var(--gain)"' : cls === "loss" ? ' style="color:var(--loss)"' : "") +
    ">" + fig + "</div>" + (foot ? '<div class="tile-foot">' + foot + "</div>" : "") + "</div>";
}

/* ---------------- boot harness ---------------- */

var state, view, viewEl;

function save() { persist(state); }

function renderNav() {
  document.getElementById("nav").innerHTML = APP.tabs.map(function (t) {
    return '<button class="tab" data-tab="' + t.id + '"' + (t.id === view ? ' aria-current="page"' : "") + ">" +
      '<span class="ico">' + t.ico + "</span><span>" + t.label + "</span></button>";
  }).join("");
}

function render() {
  if (APP.beforeRender) APP.beforeRender();
  renderNav();
  viewEl.innerHTML = APP.renderView(view);
  if (APP.afterRender) APP.afterRender();
  wireHovers(viewEl);
}

function boot() {
  overlay = document.getElementById("overlay");
  tipEl = document.getElementById("tip");
  viewEl = document.getElementById("view");
  state = loadState(APP.blank);
  view = APP.tabs[0].id;

  document.addEventListener("click", function (e) {
    var tab = e.target.closest("[data-tab]");
    if (tab) {
      view = tab.getAttribute("data-tab");
      hideTip();
      if (APP.onTabChange) APP.onTabChange(view);
      render();
      window.scrollTo({ top: 0, behavior: "auto" });
      return;
    }
    var act = e.target.closest("[data-act]");
    if (!act) return;
    var name = act.getAttribute("data-act");
    if (APP.actions[name]) { hideTip(); APP.actions[name](act.getAttribute("data-id"), act); }
  });

  render();
  alarmPaint();
  if (APP.afterBoot) APP.afterBoot();
}


  boot();
})();
</script>

<script>
  // Registered immediately, not inside window.load. A blocked third-party
  // host once left readyState at "interactive" for ever, so the worker never
  // registered and the app installed as a shortcut instead of an app.
  if ('serviceWorker' in navigator &&
      (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    navigator.serviceWorker.register('./sw.js').catch(function () {});

    /* When a new worker takes over, the page on screen is still the old one —
       skipWaiting and clients.claim swap the controller but never reload the
       document. That is the other half of why a change took two launches to
       show up on the phone. Reloading once on the swap closes it.

       Guarded on there already being a controller, because controllerchange
       also fires on the very first registration, and reloading then is a
       pointless flash on a first visit. */
    if (navigator.serviceWorker.controller) {
      var swapped = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (swapped) return;
        swapped = true;
        location.reload();
      });
    }
  }
</script>
