<script>
  /* Runs before the stylesheet, so the theme is decided before the first
     paint. It has its own copy of the key expression because the main script
     has not loaded yet — the same reason Coffer's pre-paint reader repeats
     its own. */
  (function () {
    try {
      var t = localStorage.getItem("mashghal2.theme");
      if (t === "light" || t === "dark") {
        document.documentElement.setAttribute("data-theme", t);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", t === "light" ? "#f7f4ee" : "#0b1220");
      }
    } catch (e) {}
  })();
</script>

  /* ================= Paper =================

     The Workbench's palette, from the handoff's token table, and LIGHT
     ONLY for now: the owner will ship a dark one. That is why every colour
     below is a token and no rule anywhere writes a hex — the dark ship is
     one more block of these, under the same names.

     The older screens (Career, Work, Directory, Show, Settings, the
     dialogs) read the navy system's names — `--page`, `--sheet`, `--ink`,
     `--faint` and the rest. Every one of those names is still defined,
     aliased onto the paper values, so those screens follow the new look
     without a line of their CSS changing. Colour still runs in two
     channels: a record's KIND is a dot and a word in its type colour, and
     a STATE is a pill carrying a word — late, today, waiting, done. */
  :root {
    color-scheme: light;

    /* ---- the handoff's tokens ---- */
    --paper: #f5f3ee;
    --sidebar: #efece5;
    --sheet: #fffdf9;
    --wash: #f8f6f1;
    --wash-2: #fbf9f4;
    --rule: #e2ddd2;
    --rule-soft: #efeae1;
    --rule-mid: #d8d1c3;
    --rule-strong: #cfc8b9;
    --hover-border: #b9b1a1;
    --ink: #1d1c19;
    --ink-2: #3d3a34;
    --dim: #54514a;
    --faint: #6e6a61;
    --blue: #2445b0;
    --blue-deep: #1a3386;
    --blue-tint: #e6eaf7;
    --blue-tint-2: #eef1fa;
    --blue-border: #c9d2ee;
    --blue-line: #6f86c9;
    --late: #b3203f;
    --late-bg: #fbe9ec;
    --today: #0f6e4f;
    --today-bg: #e2f2ea;
    --amber: #8a5600;
    --amber-bg: #f8eed9;
    --selected: #efeadf;
    --code-bg: #1d1c19;
    --code-ink: #efe9dc;
    --graph-edge: #b9b1a1;
    --tick-border: #a39c8c;
    --placeholder: #7a756b;
    --spoke: #8a8478;
    --row-hover: #f3efe7;
    --inset: #f3efe7;
    --link-tint: #f4f6fc;
    --on-ink: #f5f3ee;
    --keys-ink: #cfc8b9;

    /* ---- type colours: a record's kind, as a dot and a word ---- */
    --t-action: oklch(0.5 0.11 70);    --t-note: oklch(0.47 0.03 80);
    --t-meeting: oklch(0.5 0.13 305);  --t-file: oklch(0.5 0.1 195);
    --t-link: oklch(0.5 0.1 235);      --t-reading: oklch(0.5 0.11 45);
    --t-script: oklch(0.5 0.14 262);   --t-formula: oklch(0.5 0.13 285);
    --t-method: oklch(0.5 0.12 150);   --t-reference: oklch(0.5 0.13 12);
    --t-place: oklch(0.48 0.04 250);   --t-output: oklch(0.5 0.11 172);
    --t-skill: oklch(0.48 0.15 262);   --t-training: oklch(0.5 0.12 325);
    --t-draft: oklch(0.52 0.12 95);    --t-hours: oklch(0.47 0.02 80);
    --t-role: oklch(0.47 0.08 262);    --t-bench: oklch(0.42 0.1 262);
    /* The book's other kinds, which the prototype never drew. Quiet hues,
       none of them borrowing a state colour. */
    --t-template: oklch(0.5 0.1 120);  --t-person: oklch(0.5 0.1 340);
    --t-job: oklch(0.46 0.06 230);     --t-education: oklch(0.5 0.1 300);
    --t-workflow: oklch(0.5 0.1 210);  --t-asset: oklch(0.48 0.06 30);

    /* ---- bench dots: the reference's four, then four more ---- */
    --b1: oklch(0.55 0.13 262); --b2: oklch(0.55 0.12 172);
    --b3: oklch(0.55 0.12 45);  --b4: oklch(0.62 0.12 95);
    --b5: oklch(0.55 0.12 305); --b6: oklch(0.55 0.1 20);
    --b7: oklch(0.55 0.1 220);  --b8: oklch(0.52 0.05 80);

    /* ---- shadows, as the handoff states them ---- */
    --sh-line: 0 1px 0 rgba(40,30,10,0.04);
    --sh-drop: 0 18px 40px -18px rgba(40,30,10,0.35);
    --sh-cv: 0 20px 40px -30px rgba(40,30,10,0.4);
    --sh-bench: 0 10px 24px -16px rgba(40,30,10,0.45);
    --sh-toast: 0 14px 30px -12px rgba(0,0,0,0.5);
    --sh-keys: 0 20px 40px -16px rgba(0,0,0,0.5);

    /* ---- the navy system's names, aliased onto paper ---- */
    --page: var(--paper);
    --rail: var(--sidebar);
    --surface: var(--sheet);
    --raised: var(--wash);
    --sunken: var(--sidebar);
    --ink-hover: var(--ink-2);
    --receded: #a39c8c;
    --sage: var(--today);
    --sage-lift: #0b5a40;
    --sage-deep: var(--today-bg);
    --amber-lift: #6f4500;
    --amber-deep: var(--amber-bg);
    --apricot: var(--late);
    --apricot-lift: #8f1832;
    --apricot-mute: var(--late);
    --apricot-deep: var(--late-bg);
    --late-tint: var(--late-bg);
    --late-tint2: var(--late-bg);
    --late-edge2: #f0c9d1;
    --nav-on: var(--sheet);
    --nav-on-ink: var(--ink);
    --id-project: var(--t-bench);
    --id-workflow: var(--t-workflow);
    --id-asset: var(--t-method);
    --id-action: var(--t-action);
    --id-output: var(--t-output);
    --id-equip: var(--t-asset);
    --id-know: var(--t-formula);
    --id-conn: var(--t-link);
    --id-soft: var(--t-script);
    --tile-a: 0.10;
    --brass: var(--blue);
    --brass-deep: var(--blue-tint);
    --oxide: var(--late);
    --oxide-deep: var(--late-bg);
    --verd: var(--today);
    --gain: var(--today);
    --loss: var(--late);
    --warn: var(--amber);
    --line: var(--spoke);
    --line-dim: var(--rule-mid);
    --edge: #5d6f86;
    --edge-dead: #8494a9;
    --edge-assoc: #6d7f9b;
    --edge-back: var(--blue);
    --grain: 0;
    --shade: var(--rule-mid);
    --veil: rgba(255,253,249,0.95);
    --c1: var(--blue);
    --pill-hand-ink: var(--today);
    --pill-hand-bg: var(--today-bg);

    /* ---- type ---- */
    --display: "Mashghal Display", "IBM Plex Sans", system-ui, sans-serif;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --serif: Georgia, "Times New Roman", serif;
    --r: 12px;
    --t: 120ms;
  }

  /* The bridge the older stylesheet reads: one ramp, four steps. */
  :root {
    --ui: var(--sans);
    --disp: var(--display);
    --fs-xs: 0.72rem;
    --fs-sm: 0.8125rem;
    --fs-md: 0.875rem;
    --fs-lg: 1.04rem;
  }

  /* The type ramp and the pill tokens that lived here are in palette.css
     now, beside every other colour: one place defines a token, and the dark
     palette to come is one block there. */

  /* ================= The hub's own layout =================

     The palette above is the navy system, lifted VERBATIM from
     `mashghal/index.html` rather than invented a fourth time. Its owner
     picked those colours off a mock-up they sent, every text role in it was
     measured rather than eyeballed, and the round-3 plan says in as many
     words that the old workspace image "can remain as the visual ancestor".
     Three palettes in three rounds is three chances to be told it looks
     wrong; the fourth one was.

     So the two rules that palette carries come with it:

       · IDENTITY (which kind of record this is) lives ONLY in a small
         rounded icon tile — an `--id-*` token at `--tile-a` behind a muted
         glyph. Career reads one hue, work another, the library another.
       · STATE (how is this going) lives ONLY in a pill carrying a word and
         in a row's left edge. Sage is in hand, amber is drift, apricot is
         late, and waiting carries no colour at all. */

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font-family: var(--ui); font-size: var(--fs-md); line-height: 1.5;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  img { max-width: 100%; }
  [hidden] { display: none !important; }

  h1, h2, h3, h4 {
    font-family: var(--disp); font-weight: 500; letter-spacing: -0.015em; margin: 0;
  }
  h2 { font-size: 1.34rem; }
  h3 { font-size: var(--fs-lg); }
  h4 { font-size: var(--fs-md); }
  a { color: var(--blue); }

  .label, .sect, .rwhead, .tile > .label, .field > .label, .modal-more > summary,
  .facts th, .tbl th {
    font-family: var(--ui); font-size: var(--fs-xs); font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint);
  }
  p.empty { color: var(--faint); font-size: var(--fs-sm); margin: 0.4rem 0; }
  .hint { display: block; color: var(--faint); font-size: var(--fs-xs); margin-top: 0.25rem; }
  .says { color: var(--faint); font-size: var(--fs-sm); margin: 0.25rem 0 0; }
  .serif { font-family: var(--serif); }

  /* ---- shell ---- */

  .tab {
    display: flex; align-items: center; gap: 0.55rem; width: 100%; position: relative;
    padding: 0.44rem 0.55rem; border: 0; border-radius: 8px; background: none;
    cursor: pointer; color: var(--dim); font: inherit; font-size: var(--fs-sm);
    text-align: left; transition: var(--t);
  }
  .tab .ico { display: inline-flex; width: 18px; justify-content: center; }
  .tab:hover { color: var(--ink); background: var(--sheet); }
  .tab[aria-current="page"] {
    background: var(--nav-on); color: var(--nav-on-ink); font-weight: 600;
  }
  .tab .badge {
    margin-left: auto; font-family: var(--mono); font-size: var(--fs-xs);
    font-weight: 700; color: var(--apricot);
  }
  .tab[aria-current="page"] .badge { color: var(--nav-on-ink); }

  .view {
    flex: 1 1 auto; min-width: 0; max-width: 1200px;
    padding: 1.3rem 1.4rem calc(3rem + env(safe-area-inset-bottom, 0px));
  }

  /* ---- page furniture ---- */

  .page-head {
    display: flex; gap: 0.9rem; align-items: flex-end; justify-content: space-between;
    flex-wrap: wrap; margin-bottom: 1rem;
  }
  .page-head > div:first-child { min-width: 0; flex: 1 1 15rem; }
  .page-head h2 { overflow-wrap: anywhere; }
  .page-head p { margin: 0.3rem 0 0; color: var(--faint); font-size: var(--fs-sm); }
  .page-acts { display: flex; gap: 0.4rem; flex-wrap: wrap; }

  .strip {
    display: flex; gap: 0.25rem; flex-wrap: wrap; margin: -0.3rem 0 1rem;
    padding-bottom: 0.5rem; border-bottom: 1px solid var(--rule);
  }
  .sbtn {
    border: 1px solid transparent; border-radius: 999px; background: none;
    color: var(--faint); font: inherit; font-size: var(--fs-sm); cursor: pointer;
    padding: 0.24rem 0.65rem; transition: var(--t); white-space: nowrap;
  }
  .sbtn:hover { color: var(--ink); border-color: var(--rule); }
  .sbtn[aria-current="page"] {
    color: var(--ink); background: var(--raised); border-color: var(--rule-mid); font-weight: 600;
  }
  .sbtn .n { font-family: var(--mono); font-size: var(--fs-xs); color: var(--faint); }
  .sbtn[aria-current="page"] .n { color: var(--dim); }

  .sect {
    display: flex; align-items: center; gap: 0.6rem; margin: 1.4rem 0 0.5rem;
  }
  .sect::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
  .sect .n { font-family: var(--mono); letter-spacing: 0; color: var(--faint); }

  .crumbs { display: flex; align-items: center; gap: 0.3rem; flex-wrap: wrap; margin-bottom: 0.5rem; }
  .bcrumb {
    border: 0; background: none; cursor: pointer; padding: 0.1rem 0.2rem; border-radius: 5px;
    font: inherit; font-size: var(--fs-sm); color: var(--faint); transition: var(--t);
  }
  .bcrumb:hover { color: var(--ink); }
  .crumbs .sep { color: var(--faint); font-size: var(--fs-xs); }

  /* ---- controls ---- */

  .btn {
    font: inherit; font-size: var(--fs-sm); cursor: pointer; border-radius: 8px;
    padding: 0.36rem 0.7rem; border: 1px solid var(--rule-mid);
    background: var(--surface); color: var(--dim); text-decoration: none;
    display: inline-flex; align-items: center; gap: 0.35rem; transition: var(--t);
  }
  .btn:hover { color: var(--ink); border-color: var(--rule-strong); }
  .btn:active { transform: translateY(1px); }
  .btn.primary {
    background: var(--ink); color: var(--page); border-color: var(--ink); font-weight: 600;
  }
  .btn.primary:hover { background: var(--ink-hover); border-color: var(--ink-hover); color: var(--page); }
  .btn.quiet { border-color: transparent; background: none; }
  .btn.quiet:hover { border-color: var(--rule-mid); }
  .btn.danger { color: var(--faint); }
  .btn.danger:hover { color: var(--apricot); border-color: var(--apricot-mute); }
  #overlay .btn.danger {
    background: var(--apricot); border-color: var(--apricot); color: var(--page); font-weight: 600;
  }
  #overlay .btn.danger:hover { color: var(--page); background: var(--apricot-lift); }
  .btn.tiny { padding: 0.18rem 0.45rem; font-size: var(--fs-xs); border-radius: 6px; }
  .btn[disabled] { opacity: 0.45; cursor: default; }
  .btn.clip { max-width: 100%; }
  .btn.clip > span {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
  }

  /* ONE FOCUS RING FOR EVERY TAPPABLE THING, declared once the way `--t` is.
     Every whole-row control otherwise falls back to Chromium's own outline,
     which on this ground is a pale double ring belonging to no design here. */
    .btn:focus-visible, .tab:focus-visible, .sbtn:focus-visible, .row:focus-visible,
  .bcrumb:focus-visible, .chip:focus-visible, .tevt:focus-visible,
  .pcard:focus-visible, summary:focus-visible,
  .panel.wide:focus-visible, .impprev:focus-visible,
  .cardhit:focus-visible, .diropen:focus-visible, .dirgo:focus-visible,
  .shapebtn:focus-visible,
  input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--blue); outline-offset: 2px;
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  .chip {
    font: inherit; font-size: var(--fs-xs); cursor: pointer; border-radius: 999px;
    padding: 0.2rem 0.6rem; border: 1px solid var(--rule-mid);
    background: none; color: var(--faint); transition: var(--t); white-space: nowrap;
  }
  .chip:hover { color: var(--ink); border-color: var(--rule-strong); }
  .chip[aria-pressed="true"] {
    color: var(--ink); background: var(--raised); border-color: var(--rule-strong); font-weight: 600;
  }
  .chips { display: flex; gap: 0.3rem; flex-wrap: wrap; }

  /* A state pill: the colour AND the word, always together. */
  .pill {
    display: inline-block; font-size: var(--fs-xs); font-weight: 700;
    letter-spacing: 0.04em; text-transform: uppercase; padding: 0.08rem 0.42rem;
    border-radius: 999px; white-space: nowrap; border: 1px solid currentColor;
  }
  .p-late { color: var(--apricot); background: var(--late-tint); }
  .p-drift { color: var(--amber); background: var(--amber-deep); }
  .p-hand { color: var(--pill-hand-ink); background: var(--pill-hand-bg); }
  .p-calm { color: var(--faint); background: var(--sunken); }
  .p-done { color: var(--faint); background: none; border-color: var(--rule-mid); }

  /* IDENTITY LIVES HERE AND NOWHERE ELSE. */
  .itile {
    flex: 0 0 auto; width: 30px; height: 30px; border-radius: 9px;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--glyph, var(--dim)); background: var(--tint, var(--raised));
  }
  .itile.big { width: 52px; height: 52px; border-radius: 14px; }

  /* ---- a row ---- */

  .row {
    display: flex; align-items: flex-start; gap: 0.6rem; width: 100%;
    padding: 0.55rem 0.7rem; border: 0; border-bottom: 1px solid var(--rule-soft);
    border-left: 2px solid transparent; border-radius: 0;
    background: var(--sheet); color: inherit; font: inherit; text-align: left;
    cursor: pointer; transition: var(--t);
  }
  .row:hover { background: var(--surface); }
  .row.e-late { border-left-color: var(--apricot); }
  .row.e-drift { border-left-color: var(--amber); }
  .row.e-hand { border-left-color: var(--sage); }
  .row.flat { cursor: default; }
  .row.flat:hover { background: var(--sheet); }
  .rows {
    border: 1px solid var(--rule); border-radius: 12px; overflow: hidden;
    background: var(--sheet);
  }
  .rows > .row:last-child { border-bottom: 0; }

  .grow { flex: 1 1 0; min-width: 0; }
  .nm { font-weight: 600; overflow-wrap: anywhere; }
  .nm.one { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { display: block; color: var(--faint); font-size: var(--fs-sm); overflow-wrap: anywhere; }
  .kindw {
    font-family: var(--mono); font-size: var(--fs-xs); color: var(--faint);
    letter-spacing: 0.02em;
  }
  .right { flex: 0 0 auto; display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }
  .when { font-family: var(--mono); font-size: var(--fs-xs); color: var(--faint); white-space: nowrap; }
  .chev { color: var(--faint); display: inline-flex; flex: 0 0 auto; }

  @media (max-width: 620px) {
    .row { flex-wrap: wrap; }
    .row > .right { width: 100%; padding-left: 2.2rem; }
  }

  /* ---- panels, tiles, meters ---- */

  .panel {
    border: 1px solid var(--rule); border-radius: 12px; background: var(--sheet);
    padding: 0.8rem 0.9rem;
  }
  .panel + .panel { margin-top: 0.6rem; }
  .panel.late { border-left: 3px solid var(--apricot); }
  .panel.drift { border-left: 3px solid var(--amber); }
  .panel.hand { border-left: 3px solid var(--sage); }

  .tiles {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr));
    gap: 0; border: 1px solid var(--rule); border-radius: 12px; overflow: hidden;
  }
  .tile { padding: 0.7rem 0.8rem; border-right: 1px solid var(--rule-soft); background: var(--sheet); }
  .tile:last-child { border-right: 0; }
  .tile-fig { font-family: var(--disp); font-size: 1.55rem; line-height: 1.15; }
  .tile-fig.late { color: var(--apricot); }
  .tile-fig.drift { color: var(--amber); }
  .tile-fig.hand { color: var(--sage); }
  .tile-foot { color: var(--faint); font-size: var(--fs-xs); margin-top: 0.1rem; }
  @media (max-width: 620px) {
    .tiles { grid-template-columns: 1fr; }
    .tile {
      border-right: 0; border-bottom: 1px solid var(--rule-soft);
      display: flex; align-items: baseline; gap: 0.6rem;
    }
    .tile:last-child { border-bottom: 0; }
    .tile > .label { flex: 1 1 auto; }
    .tile-fig { font-size: 1.2rem; }
  }

  .meter { height: 5px; border-radius: 3px; background: var(--sunken); overflow: hidden; }
  .meter-fill { height: 100%; }
  .meter-pace { position: relative; }
  .chart { width: 100%; }
  .notes { display: flex; flex-direction: column; gap: 0.4rem; }
  .note { display: flex; gap: 0.5rem; font-size: var(--fs-sm); }
  .note-mark { font-family: var(--mono); color: var(--faint); }
  .note-mark.bad { color: var(--apricot); }
  .note-mark.good { color: var(--sage); }
  /* The three tones `notesHtml` can emit. A partial set is worse than none:
     the runtime is copied verbatim into five apps, so its own class hooks
     are defined here whether this app happens to call the helper or not —
     which is the `.field.wide` fault in reverse. */
  .note-mark.warn { color: var(--amber); }

  /* ---- the facts table every record page opens on ---- */

  .facts { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
  .facts th {
    text-align: left; width: 11rem; vertical-align: top;
    padding: 0.4rem 0.7rem 0.4rem 0; border-bottom: 1px solid var(--rule-soft);
  }
  .facts td {
    padding: 0.4rem 0; border-bottom: 1px solid var(--rule-soft); overflow-wrap: anywhere;
  }
  .facts tr:last-child th, .facts tr:last-child td { border-bottom: 0; }
  .facts .unsaid { color: var(--faint); }
  @media (max-width: 560px) {
    .facts th { width: auto; display: block; border-bottom: 0; padding-bottom: 0.1rem; }
    .facts td { display: block; padding-top: 0; }
  }

  /* A plain table, for a bibliography or a week of hours. */
  .tbl { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
  .tbl th { text-align: left; padding: 0.35rem 0.6rem 0.35rem 0; border-bottom: 1px solid var(--rule); }
  .tbl td { padding: 0.4rem 0.6rem 0.4rem 0; border-bottom: 1px solid var(--rule-soft); overflow-wrap: anywhere; }
  /* ---- CARDS: THE OTHER SHAPE ----

     A list answers "what is next" and a grid answers "what have I got" —
     twenty skills in five groups, nine pieces of training, thirteen
     projects. Both readings are real, so neither replaces the other and
     which one you get is a SETTING rather than view state: it is how you
     like to read, not where you have navigated to.

     The card is a <div> with a full-bleed <button> inside it, because a
     card that can be opened AND carries its own controls cannot be one
     button — the same trick `.rowpair` uses one level down. */

  .cards {
    display: grid; gap: 0.7rem;
    grid-template-columns: repeat(auto-fill, minmax(min(15.5rem, 100%), 1fr));
  }
  .card {
    display: flex; flex-direction: column; min-width: 0;
    border: 1px solid var(--rule); border-radius: 12px; background: var(--raised);
    overflow: hidden; transition: var(--t);
  }
  .card:hover { border-color: var(--rule-strong); }
  /* State stays in the one channel it is allowed: a pill with a word, and
     the card's left edge. Never a coloured card. */
  .card.e-late  { box-shadow: inset 3px 0 0 var(--oxide); }
  .card.e-drift { box-shadow: inset 3px 0 0 var(--brass); }
  .card.e-hand  { box-shadow: inset 3px 0 0 var(--sage); }
  .cardhit {
    appearance: none; -webkit-appearance: none; background: none; border: 0;
    font: inherit; color: inherit; text-align: left; cursor: pointer;
    display: flex; flex-direction: column; gap: 0.3rem; min-width: 0;
    padding: 0.7rem 0.75rem; flex: 1 1 auto; transition: var(--t);
  }
  .cardhit:hover { background: var(--surface); }
  .cardtop { display: flex; align-items: center; gap: 0.45rem; min-width: 0; }
  .cardtop .nm {
    font-family: var(--disp); font-size: var(--fs-md); color: var(--ink);
    min-width: 0; overflow-wrap: anywhere;
  }
  .cardhit .sub {
    font-size: var(--fs-sm); color: var(--faint); line-height: 1.45;
    overflow-wrap: anywhere;
  }
  .cardfacts {
    display: flex; flex-wrap: wrap; gap: 0.3rem 0.45rem; margin-top: 0.1rem;
    min-width: 0; max-width: 100%;
  }
  .cardfacts > span {
    font-size: var(--fs-xs); color: var(--dim); font-family: var(--mono);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 100%; min-width: 0;
  }
  .cardfoot {
    display: flex; align-items: center; gap: 0.35rem; flex-wrap: wrap;
    padding: 0.45rem 0.6rem; border-top: 1px solid var(--rule-soft);
    background: var(--sunken);
  }
  .cardfoot .grow { flex: 1 1 0; min-width: 0; }

  /* ---- the shape switch, and the box that sifts a long page ---- */

  .shaperow {
    display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
    margin: 0.2rem 0 0.7rem;
  }
  .sift {
    flex: 0 1 22rem; min-width: 0; font: inherit; font-size: var(--fs-sm);
    padding: 0.4rem 0.6rem; border-radius: 9px; border: 1px solid var(--rule);
    background: var(--raised); color: var(--ink);
  }
  .sift::placeholder { color: var(--faint); }
  .shapeset { display: flex; gap: 0.2rem; }
  .shapebtn {
    appearance: none; background: none; border: 1px solid transparent;
    border-radius: 8px; padding: 0.3rem 0.4rem; cursor: pointer;
    color: var(--faint); display: grid; place-items: center; transition: var(--t);
  }
  .shapebtn:hover { color: var(--ink); border-color: var(--rule); }
  .shapebtn[aria-pressed="true"] {
    color: var(--ink); border-color: var(--rule-strong); background: var(--raised);
  }
  .siftsays { font-size: var(--fs-xs); color: var(--faint); }

  /* ---- the Directory: the row IS the open control ---- */

  .dirline {
    display: flex; align-items: stretch; gap: 0; min-width: 0;
    border: 1px solid var(--rule); border-radius: 10px; background: var(--raised);
    overflow: hidden; transition: var(--t);
  }
  .dirline:hover { border-color: var(--rule-strong); }
  .dirline + .dirline { margin-top: 0.4rem; }
  .diropen {
    appearance: none; background: none; border: 0; font: inherit; color: inherit;
    text-align: left; cursor: pointer; display: flex; align-items: center;
    gap: 0.55rem; padding: 0.55rem 0.7rem; flex: 1 1 0; min-width: 0;
    text-decoration: none; transition: var(--t);
  }
  .diropen:hover { background: var(--surface); }
  .diropen .grow { flex: 1 1 0; min-width: 0; }
  .diropen .nm { display: block; }
  .dirwhere {
    display: block; font-family: var(--mono); font-size: var(--fs-xs);
    color: var(--dim); white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; max-width: 100%;
  }
  .dirgo {
    appearance: none; background: none; border: 0; border-left: 1px solid var(--rule-soft);
    color: var(--faint); cursor: pointer; padding: 0 0.5rem; display: grid;
    place-items: center; transition: var(--t);
  }
  .dirgo:hover { color: var(--ink); background: var(--surface); }

  .impprev {
    max-height: 46vh; overflow-y: auto; overscroll-behavior: contain;
    margin-top: 0.8rem;
  }
  .tbl td.lit { font-family: var(--mono); white-space: nowrap; vertical-align: top; }
  .tbl td.num { font-family: var(--mono); text-align: right; white-space: nowrap; }

  /* ---- a body of text: code does not wrap, prose does ---- */

  .blk {
    border: 1px solid var(--rule); border-radius: 10px; background: var(--sunken);
    margin-top: 0.5rem; overflow: hidden;
  }
  .blkhead {
    display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
    padding: 0.35rem 0.6rem; border-bottom: 1px solid var(--rule); background: var(--surface);
  }
  .blkhead .label { flex: 1 1 auto; }
  .snip {
    margin: 0; padding: 0.6rem; font-family: var(--mono); font-size: var(--fs-sm);
    white-space: pre; overflow-x: auto; color: var(--ink); tab-size: 4;
  }
  .wrote {
    margin: 0; padding: 0.6rem; font-family: var(--ui); font-size: var(--fs-md);
    white-space: pre-wrap; color: var(--ink);
  }

  /* ---- the timeline ---- */

  .tline { position: relative; padding-left: 1.6rem; }
  .tline::before {
    content: ""; position: absolute; left: 0.42rem; top: 0.4rem; bottom: 0.4rem;
    width: 2px; background: var(--rule); border-radius: 1px;
  }
  .tyear {
    font-family: var(--disp); font-size: 1.1rem; margin: 1.1rem 0 0.4rem -1.6rem;
    padding-left: 1.6rem; position: relative; color: var(--ink);
  }
  .tyear:first-child { margin-top: 0; }
  .tevt {
    display: flex; align-items: flex-start; gap: 0.55rem; width: 100%; position: relative;
    padding: 0.4rem 0.6rem; margin-bottom: 0.25rem; border: 1px solid transparent;
    border-radius: 9px; background: none; color: inherit; font: inherit;
    text-align: left; cursor: pointer; transition: var(--t);
  }
  .tevt:hover { background: var(--sheet); border-color: var(--rule); }
  .tevt::before {
    content: ""; position: absolute; left: -1.24rem; top: 0.86rem;
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--page); border: 2px solid var(--dot, var(--rule-strong));
  }
  .tevt .tdate {
    flex: 0 0 4.6rem; font-family: var(--mono); font-size: var(--fs-xs); color: var(--faint);
    padding-top: 0.15rem;
  }
  @media (max-width: 560px) {
    .tevt { flex-wrap: wrap; }
    .tevt .tdate { flex: 1 1 100%; order: 2; padding-left: 2.2rem; }
  }

  /* ---- portfolio cards ---- */

  .pcard {
    display: flex; flex-direction: column; gap: 0.4rem; align-items: flex-start;
    border: 1px solid var(--rule); border-radius: 12px; background: var(--sheet);
    padding: 0.8rem 0.9rem; cursor: pointer; text-align: left; color: inherit;
    font: inherit; transition: var(--t);
  }
  .pcard:hover { background: var(--surface); border-color: var(--rule-mid); }
  .pcard .nm { font-size: var(--fs-lg); font-family: var(--disp); font-weight: 500; }
  .pcards {
    display: grid; gap: 0.6rem;
    grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr));
  }
  .pchead { display: flex; align-items: center; gap: 0.55rem; width: 100%; }

  /* A ROW IS A BUTTON, so a per-row control cannot live inside it — nesting
     one button in another is invalid and the inner one stops being reachable.
     The pair puts the control beside the row instead. */
  .rowpair { display: flex; align-items: stretch; gap: 0.3rem; }
  .rowpair > .row { flex: 1 1 auto; min-width: 0; }
  .rowpair > .btn { flex: 0 0 auto; align-self: center; }

  /* ---- the finder ---- */

  /* IT SAYS WHAT IT READ THE QUESTION AS — quietly, but it says it. */


  /* ---- Home: four equal cards ---- */

  /* A MINIMUM TRACK WIDTH IS A MINIMUM, and 20rem is the whole of a 320px
     screen before the view's own padding — so the three cards came out
     13px wider than the phone. One column below the point where two would
     not fit anyway. */
  
  /* Two by two, so four parts of one figure read as four. */

  .panel.wide {
    width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer;
    display: block;
  }

  /* ---- forms (the shared runtime's own markup) ---- */

  #overlay:empty { display: none; }
  .scrim {
    position: fixed; inset: 0; z-index: 90; background: rgba(4, 8, 16, 0.62);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 4vh 1rem; overflow-y: auto;
  }
  .modal {
    width: 100%; max-width: 500px; background: var(--rail);
    border: 1px solid var(--rule-strong); border-radius: 14px; overflow: hidden;
  }
  .modal-head { padding: 0.85rem 1rem; border-bottom: 1px solid var(--rule); }
  .modal-head p { margin: 0.35rem 0 0; color: var(--faint); font-size: var(--fs-sm); }
  .modal-body { padding: 0.85rem 1rem; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; }
  .field { display: flex; flex-direction: column; gap: 0.2rem; min-width: 0; }
  .field.wide { grid-column: 1 / -1; }
  .field input, .field select, .field textarea {
    font: inherit; font-size: var(--fs-md); padding: 0.42rem 0.55rem; border-radius: 8px;
    border: 1px solid var(--rule-mid); background: var(--sheet); color: var(--ink);
    width: 100%; min-width: 0;
  }
  .field textarea { resize: vertical; font-family: var(--ui); }
  .modal-more { grid-column: 1 / -1; margin-top: 0.7rem; }
  .modal-more > summary { cursor: pointer; padding: 0.3rem 0; }
  .modal-more > .fields { margin-top: 0.5rem; }
  .modal-bad {
    margin: 0; padding: 0.5rem 1rem; color: var(--apricot); font-size: var(--fs-sm);
    background: var(--late-tint);
  }
  .modal-foot {
    display: flex; justify-content: flex-end; gap: 0.4rem; flex-wrap: wrap;
    padding: 0.7rem 1rem; border-top: 1px solid var(--rule);
  }
  @media (max-width: 520px) { .fields { grid-template-columns: 1fr; } }

  /* ---- toasts, tip, alarm, folds ---- */

  .toasts {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    z-index: 50; display: flex; flex-direction: column; align-items: center; gap: 0.35rem;
    max-width: calc(100vw - 32px); pointer-events: none;
  }
  .toasts > .toast {
    pointer-events: auto; background: var(--raised); color: var(--ink);
    border: 1px solid var(--rule-strong); border-radius: 10px;
    padding: 0.5rem 0.7rem; font-size: var(--fs-sm);
    display: flex; align-items: center; gap: 0.6rem;
    box-shadow: 0 10px 28px rgba(2, 5, 12, 0.45);
  }
  /* The runtime's own undo is a bare <button> inside `.toast`, not a `.btn` —
     styling `.toasts .btn` leaves it wearing Chromium's default. */
  .toasts .toast button {
    font: inherit; font-size: var(--fs-xs); cursor: pointer; border-radius: 6px;
    background: none; border: 1px solid var(--rule-strong); color: var(--ink);
    padding: 0.12rem 0.45rem; transition: var(--t);
  }
  .toasts .toast button:hover { border-color: var(--ink); }
  .tip {
    position: fixed; z-index: 86; pointer-events: none; max-width: 18rem;
    background: var(--raised); color: var(--ink); border: 1px solid var(--rule-strong);
    border-radius: 7px; padding: 0.3rem 0.5rem; font-size: var(--fs-xs);
    opacity: 0; transition: opacity var(--t);
  }
  .tip.on { opacity: 1; }
  .alarm { position: fixed; top: 0; left: 0; right: 0; z-index: 70; }
  .alarm:empty { display: none; }
  .alarm-box {
    background: var(--late-tint); border-bottom: 2px solid var(--apricot);
    padding: 0.8rem 1rem; color: var(--ink);
  }
  .alarm-box p { margin: 0.4rem 0 0; font-size: var(--fs-sm); }
  .alarm-box.thin {
    display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; padding: 0.4rem 0.8rem;
  }
  .alarm-box.thin span { flex: 1 1 14rem; font-size: var(--fs-sm); color: var(--dim); }
  .alarm-acts { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.6rem; }

  .fold {
    border: 1px solid var(--rule); border-radius: 12px; background: var(--sheet);
    margin-top: 0.6rem;
  }
  .fold > summary { cursor: pointer; padding: 0.5rem 0.75rem; }
  .fold > summary > .label { display: inline; }
  .foldbody { padding: 0 0.75rem 0.75rem; }

  /* ---- the phone ---- */

  @media (max-width: 880px) {
    /* THE MARK, THE NAME AND THE GEAR SHARE ONE ROW WITH THE FINDER, because
       a phone has 780px and 164px of it was chrome. The finder is the one
       control that reaches further than any tab, so it keeps its width and
       the rest of the row shrinks around it: 164px → 122px, measured, and
       nothing was taken out. */

    .tab {
      flex: 1 1 0; min-width: 0; flex-direction: column; gap: 0.06rem;
      align-items: center; text-align: center; padding: 0.3rem 0.12rem;
      border-radius: 0; font-size: var(--fs-xs);
    }
    .tab[aria-current="page"] {
      background: none; color: var(--ink);
      box-shadow: inset 0 -2px 0 0 var(--blue);
    }
    .tab[aria-current="page"] .badge { color: var(--apricot); }
    .tab > span:not(.ico):not(.badge) { white-space: nowrap; }
    .tab .ico { position: relative; }
    .tab .badge { position: absolute; top: 0; right: 0.18rem; margin: 0; }
    /* On a phone the footer is the gear and nothing else: "This browser only"
       is a fact worth stating on a laptop rail with room for it, and a third
       line of chrome on a 780px screen everywhere else. Settings says the
       same thing in full. */

    .view { padding: 1rem 0.8rem calc(2.4rem + env(safe-area-inset-bottom, 0px)); }
  }
  
  
  @media (max-width: 400px) { .tab { font-size: 0.62rem; } }

  /* ---- the guide ----
     A page you read rather than a screen you scan, so it takes a measure and
     a shape of its own: the contents strip jumps, the route sits left of the
     instruction, and the notes are quieter than the rows they qualify. */
  .gtoc {
    display: flex; flex-wrap: wrap; gap: 0.3rem; margin: 0.2rem 0 0.4rem;
    padding-bottom: 0.7rem; border-bottom: 1px solid var(--rule);
  }
  .gtoclink {
    font-size: var(--fs-xs); color: var(--dim); text-decoration: none;
    border: 1px solid var(--rule); border-radius: 999px;
    padding: 0.18rem 0.6rem; transition: var(--t);
  }
  .gtoclink:hover { color: var(--ink); border-color: var(--rule-strong); background: var(--sheet); }
  .gtoclink:focus-visible {
    outline: 1px solid var(--blue); outline-offset: 2px;
  }
  .gpart { scroll-margin-top: 1rem; }
  .gpart + .gpart { margin-top: 0.4rem; }
  .growlist { display: grid; gap: 0.4rem; }
  .grow-row {
    display: flex; gap: 0.9rem; align-items: baseline;
    border: 1px solid var(--rule); border-radius: 10px; background: var(--sheet);
    padding: 0.6rem 0.75rem;
  }
  .gwhere {
    flex: 0 0 13rem; font-family: var(--mono); font-size: var(--fs-xs);
    color: var(--faint); line-height: 1.5;
  }
  .gwhat { flex: 1 1 auto; min-width: 0; display: grid; gap: 0.12rem; }
  .gwhat > b { font-size: var(--fs-sm); }
  .gnote {
    border-left: 2px solid var(--rule-mid); padding-left: 0.7rem;
    margin-top: 0.6rem;
  }
  @media (max-width: 620px) {
    .grow-row { flex-direction: column; gap: 0.25rem; }
    .gwhere { flex: none; }
  }

  /* THE DOT IS GREEN ONLY WHEN THE BOOK REALLY REACHES ANOTHER DEVICE.
     Green means healthy state and nothing else, so "this browser only" is a
     hollow ring in the neutral ink rather than a red one: it is not wrong,
     it is just not travelling. */

  code.lit { font-family: var(--mono, ui-monospace, monospace); font-size: 0.85em;
    overflow-wrap: anywhere; }

  /* ================= The Workbench =================

     Measurements from the handoff's reference, element by element: a
     220px sidebar, a sticky top bar holding the capture line, the screen,
     and a record pane beside it. Every colour is a token from palette.css,
     and every class here is `w-` prefixed, because the older stylesheet
     above already owns `.tab`, `.chip`, `.card` and `.row` and a second
     rule for one bare class name is how a tile once turned into a box. */

  /* The top bar is sticky, so anything scrolled into view — by a key, a
     hash or a focus — has to stop below it, not under it. */
  html { scroll-padding-top: 92px; }
  body { background: var(--paper); color: var(--ink); font-family: var(--sans);
    -webkit-font-smoothing: antialiased; }
  a { color: var(--blue); }
  a:hover { color: var(--blue-deep); }
  ::placeholder { color: var(--placeholder); }
  button:not([disabled]):active { transform: translateY(1px); }
  .w-app button:focus-visible, .w-app input:focus-visible, .w-app a:focus-visible,
  .w-ptabs button:focus-visible, .w-keys button:focus-visible, .w-pin:focus-within {
    outline: 2px solid var(--blue); outline-offset: 2px;
  }
  .w-mono { font-family: var(--mono); }
  .w-grow { flex: 1; min-width: 0; }
  .w-ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---- the shell ---- */
  .w-app { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100vh; }
  .w-side {
    position: sticky; top: 0; height: 100vh; overflow: auto; background: var(--sidebar);
    border-right: 1px solid var(--rule); padding: 18px 12px 16px;
    display: flex; flex-direction: column; gap: 18px;
  }
  .w-brand { display: flex; align-items: center; gap: 9px; padding: 0 6px; }
  .w-brand span { font-family: var(--display); font-size: 19px; letter-spacing: -0.02em; }
  /* The older stylesheet gives `#nav` an `order` for the rail it drew;
     here the sidebar's order is the markup's. */
  .w-side > #nav, .w-side > * { order: 0; }
  .w-nav { display: flex; flex-direction: column; gap: 2px; }
  .w-side .w-nav .tab {
    display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0;
    border-radius: 8px; background: transparent; color: var(--ink); font: inherit; font-size: 14px;
    font-weight: 400; text-align: left; cursor: pointer; white-space: nowrap; min-height: 0;
  }
  .w-side .w-nav .tab:hover { background: var(--wash); color: var(--ink); }
  .w-side .w-nav .tab[aria-current="page"] { background: var(--sheet); color: var(--ink); font-weight: 600; }
  .w-side .w-nav .tab .ico { display: none; }
  .w-side .w-nav .tab > span:nth-child(2) { flex: 1; }
  .w-navn { font-family: var(--mono); font-size: 12px; font-weight: 400; color: var(--faint); }
  .w-navn.is-late { color: var(--late); }
  .w-navn.is-blue { color: var(--blue-deep); }
  .w-sidework { display: flex; flex-direction: column; gap: 18px; }
  .w-sgroup { display: flex; flex-direction: column; gap: 2px; }
  .w-slabel {
    margin: 0 10px 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--faint);
  }
  .w-srow {
    display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0;
    border-radius: 8px; background: transparent; color: var(--ink); font: inherit; font-size: 14px;
    text-align: left; cursor: pointer; white-space: nowrap;
  }
  .w-srow:hover { background: var(--wash); }
  .w-srow.is-on { background: var(--sheet); }
  .w-srow.is-quiet { color: var(--dim); font-size: 13px; padding: 6px 10px; }
  .w-srow.is-quiet.is-on { color: var(--ink); font-weight: 600; }
  .w-bdot { width: 8px; height: 8px; border-radius: 2px; flex: none; }
  .w-stitle { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .w-stitle.is-idea { font-style: italic; }
  .w-scount { font-family: var(--mono); font-size: 12px; color: var(--faint); }
  .w-shelp { margin: 8px 10px 0; font-size: 12px; line-height: 1.5; color: var(--faint); }
  .w-foot {
    margin-top: auto; padding: 12px 10px 0; border-top: 1px solid var(--rule);
    font-size: 12px; line-height: 1.5; color: var(--faint);
  }
  .w-footlink {
    border: 0; background: none; padding: 0; font: inherit; color: var(--blue); cursor: pointer;
    text-decoration: underline; white-space: nowrap;
  }

  .w-col { min-width: 0; display: flex; flex-direction: column; }
  .w-top {
    position: sticky; top: 0; z-index: 20; background: var(--paper);
    border-bottom: 1px solid var(--rule); padding: 14px 28px;
  }
  .w-linewrap { position: relative; max-width: 780px; }
  .w-line {
    display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 12px 0 14px;
    background: var(--sheet); border: 1px solid var(--rule-strong); border-radius: 12px;
    box-shadow: var(--sh-line);
  }
  .w-line svg { flex: none; }
  .w-line input {
    flex: 1; min-width: 0; border: 0; outline: none; background: none; font: inherit;
    font-size: 16px; color: var(--ink); height: 100%;
  }
  .w-app .w-line input:focus-visible { outline: none; }
  .w-line:focus-within { border-color: var(--blue); }
  .w-ctx {
    flex: none; font-size: 12px; padding: 3px 8px; border-radius: 999px; background: var(--blue-tint);
    color: var(--blue-deep); white-space: nowrap; max-width: 40%; overflow: hidden; text-overflow: ellipsis;
  }
  .w-kbd {
    flex: none; font-family: var(--mono); font-size: 11px; color: var(--faint);
    border: 1px solid var(--rule); border-radius: 5px; padding: 2px 6px; white-space: nowrap;
  }
  .w-keep { display: none; }
  .w-drop {
    position: absolute; left: 0; right: 0; top: 54px; background: var(--sheet);
    border: 1px solid var(--rule-strong); border-radius: 12px; box-shadow: var(--sh-drop);
    max-height: 66vh; overflow: auto; z-index: 30;
  }
  .w-ans { padding: 16px 18px 10px; border-bottom: 1px solid var(--rule-soft); }
  .w-anst { margin: 0; font-family: var(--display); font-size: 20px; line-height: 1.25; }
  .w-ansr { margin: 6px 0 0; font-family: var(--mono); font-size: 12px; color: var(--faint); }
  .w-keepbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 18px;
    border-bottom: 1px solid var(--rule-soft); background: var(--wash); font-size: 14px;
  }
  .w-keepbar .w-kbd { border-color: var(--rule-mid); }
  .w-pillt {
    font-size: 13px; font-weight: 600; padding: 3px 9px; border-radius: 999px; color: #fff;
    white-space: nowrap;
  }
  .w-where { font-size: 14px; color: var(--dim); }
  .w-dlabel {
    margin: 0; padding: 10px 18px 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--faint);
  }
  .w-dhelp { margin: 0; padding: 10px 18px 14px; font-size: 12px; line-height: 1.6; color: var(--faint); }

  /* A row that opens a record. */
  .w-row {
    display: flex; align-items: center; gap: 12px; width: 100%; padding: 9px 18px; border: 0;
    background: none; font: inherit; color: inherit; text-align: left; cursor: pointer;
  }
  .w-row:hover { background: var(--row-hover); }
  .w-row.is-ans { padding: 10px 18px; border-bottom: 1px solid var(--rule-soft); }
  .w-row.is-sel { background: var(--selected); }
  .w-rt { display: block; font-size: 14px; font-weight: 500; }
  .w-rt.is-struck { text-decoration: line-through; }
  .w-rm { display: block; font-size: 12px; color: var(--faint); }
  .w-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
  .w-dot.is-6 { width: 6px; height: 6px; }
  .w-dot.is-7 { width: 7px; height: 7px; }
  .w-dot.is-9 { width: 9px; height: 9px; }
  .w-dot.is-top { margin-top: 7px; }
  .w-tw {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
    white-space: nowrap;
  }
  .w-tw.is-top { margin-top: 3px; }
  .w-tw.is-sm { font-size: 10.5px; }

  .w-body { display: flex; min-width: 0; flex: 1; }
  .w-app .view.w-main {
    flex: 1; min-width: 0; max-width: none; padding: 34px 36px 80px;
  }

  /* ---- page furniture ---- */
  .w-eyebrow {
    margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--faint);
  }
  .w-h1 {
    margin: 6px 0 0; font-family: var(--display); font-weight: 500; font-size: 38px;
    letter-spacing: -0.025em; line-height: 1.08;
  }
  .w-h1.is-today { font-size: 40px; }
  .w-h1.is-idea { font-style: italic; }
  .w-lead { margin: 10px 0 0; font-size: 16px; line-height: 1.55; color: var(--dim); max-width: 60ch; }
  .w-h2 {
    margin: 40px 0 14px; font-family: var(--display); font-weight: 500; font-size: 24px;
    letter-spacing: -0.015em;
  }
  .w-empty { margin: 28px 0 0; font-size: 15px; color: var(--dim); }

  /* ---- Today ---- */
  .w-two {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(min(330px, 100%), 1fr)); gap: 18px;
    margin-top: 28px; align-items: start;
  }
  .w-card { background: var(--sheet); border: 1px solid var(--rule); border-radius: 14px; overflow: hidden; }
  .w-chead { display: flex; align-items: baseline; gap: 10px; padding: 14px 16px 10px; }
  .w-chead h2 { margin: 0; flex: 1; font-family: var(--display); font-weight: 500; font-size: 19px; letter-spacing: 0; }
  .w-csub { font-size: 12px; color: var(--faint); }
  .w-cnum { font-size: 12px; color: var(--faint); }
  .w-cempty { margin: 0; padding: 4px 16px 16px; font-size: 14px; color: var(--dim); }
  .w-arow {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-top: 1px solid var(--rule-soft);
  }
  .w-arow.is-sel { background: var(--selected); }
  .w-tick {
    flex: none; width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--tick-border);
    background: transparent; color: #fff; font-size: 13px; line-height: 1; cursor: pointer; padding: 0;
    white-space: nowrap;
  }
  .w-tick.is-done { background: var(--today); border-color: var(--today); }
  .w-abtn { border: 0; background: none; padding: 0; font: inherit; color: inherit; text-align: left; cursor: pointer; }
  .w-state {
    flex: none; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
    padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  }
  .w-clabel {
    margin: 0; padding: 12px 16px 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--faint); border-top: 1px solid var(--rule-soft);
  }
  .w-wrow {
    display: flex; gap: 10px; width: 100%; padding: 8px 16px 12px; border: 0; background: none;
    font: inherit; color: inherit; text-align: left; cursor: pointer; font-size: 14px;
  }
  .w-wrow.is-sel { background: var(--selected); }
  .w-wst { font-size: 12px; color: var(--dim); white-space: nowrap; }
  .w-irow { padding: 10px 16px 12px; border-top: 1px solid var(--rule-soft); }
  .w-irow.is-sel { background: var(--selected); }
  .w-ihead {
    display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; padding: 0;
    font: inherit; color: inherit; text-align: left; cursor: pointer;
  }
  .w-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0 18px; }
  .w-chips.is-flat { margin: 8px 0 0; }
  .w-chips.is-pad { margin: 0; padding: 0 16px 16px; }
  .w-first { margin-top: 28px; max-width: 640px; }
  .w-chip {
    font: inherit; font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--rule-mid);
    background: var(--sheet); color: var(--ink-2); cursor: pointer; white-space: nowrap;
  }
  .w-chip:hover { border-color: var(--spoke); color: var(--ink); }
  .w-chip.is-on { background: var(--blue-tint); border-color: var(--blue-border); color: var(--blue-deep); }
  .w-cfoot {
    display: block; width: 100%; padding: 12px 16px; border: 0; border-top: 1px solid var(--rule-soft);
    background: var(--wash); font: inherit; font-size: 13px; color: var(--blue-deep); text-align: left; cursor: pointer;
  }
  .w-bgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr)); gap: 14px; }
  .w-bcard {
    display: flex; flex-direction: column; gap: 10px; padding: 16px; border: 1px solid var(--rule);
    border-radius: 14px; background: var(--sheet); font: inherit; color: inherit; text-align: left;
    cursor: pointer; min-width: 0;
  }
  .w-bcard:hover { border-color: var(--hover-border); }
  .w-bline { display: flex; align-items: center; gap: 8px; }
  .w-bsq { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .w-brole { font-size: 12px; color: var(--faint); }
  .w-btitle { font-family: var(--display); font-size: 19px; line-height: 1.2; }
  .w-bnext { font-size: 13px; color: var(--dim); line-height: 1.5; }

  .w-brec { display: flex; gap: 8px; font-size: 12px; color: var(--dim); min-width: 0; }

  .w-bhours { font-size: 12px; color: var(--faint); }

  /* ---- a bench ---- */
  .w-stats { margin: 10px 0 0; font-size: 15px; color: var(--dim); }
  .w-inlink {
    border: 0; background: none; padding: 0; font: inherit; color: var(--blue); cursor: pointer;
    text-decoration: underline; white-space: nowrap;
  }
  .w-skills { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 14px; }
  .w-slead { font-size: 12px; color: var(--faint); margin-right: 4px; }
  .w-skill {
    font: inherit; font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--blue-border);
    background: var(--blue-tint-2); color: var(--blue-deep); cursor: pointer; white-space: nowrap;
  }
  .w-panel {
    margin-top: 26px; padding: 16px 18px 12px; border: 1px solid var(--rule); border-radius: 14px;
    background: var(--sheet);
  }
