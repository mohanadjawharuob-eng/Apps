  /* ============================================================
     The three rows the whole app is built from. Each is written ONCE
     and read everywhere, so a project cannot read one way on Home and
     another on Projects — the fault two copies of one list always ends
     in.
     ============================================================ */

  /* An action's row. The state is said twice on purpose and in two
     channels: a coloured left edge and a text pill carrying the word —
     "never colour alone", which is the brief's rule and this repo's.
     The tick is a control of its own because completing something where
     no extra information is needed should be one tap; a step that needs
     an answer or a filing location opens instead, and the tick is not
     drawn, because a control that cannot do its job should not be there. */
  function actionRow(a, opts) {
    opts = opts || {};
    var st = actionState(a), meta = ACTION_STATES[st];
    var type = ACTION_TYPES[a.type] || ACTION_TYPES.task;
    /* SAY IT ONCE. On a project's own page the project's name is the
       heading three inches above, and on a person's page so is theirs —
       repeating it on every row is the same sentence four times. */
    var ctx = [];
    if (a.projectId && a.projectId !== opts.inProject) ctx.push(esc(nameOf("projects", a.projectId)));
    if (a.context) ctx.push(esc(clip(a.context, 44)));
    if (a.personId && a.personId !== opts.withPerson) ctx.push(esc(nameOf("people", a.personId)));
    var right = [];
    if (a.dueDate && dayOk(a.dueDate)) right.push('<span class="adate">' + esc(agoWords(a.dueDate)) + "</span>");
    else if (a.type === "waiting" && a.since) right.push('<span class="adate">waiting since ' +
      esc(agoWords(a.since.slice(0, 10))) + "</span>");
    else if (a.type === "upkeep") {
      /* "due" is not an answer to how late. `upkeepDue` already knows how
         far past its interval it is, and the row was throwing that away. */
      var u = upkeepDue(a);
      right.push('<span class="adate">' + esc(
        u.never ? "never done"
        : !u.due ? "next " + agoWords(u.next)
        : u.over === 0 ? "due today"
        : u.over + (u.over === 1 ? " day over" : " days over")) + "</span>");
    }
    right.push(pill(meta.word, meta.tone));

    /* WHICH HALF IS WHICH IS SAID OUT LOUD. A due is derived from the
       record; a task is the one thing somebody types. Folding them into
       one undifferentiated list is what makes a figure stop meaning what
       it says, so the row wears the distinction. */
    var canTick = !a.completedAt && (a.type === "task" || a.type === "upkeep" || a.type === "in_hand");
    return '<div class="arow' + (meta.tone ? " e-" + meta.tone : "") + (a.derived ? " a-derived" : "") + '">' +
      (canTick
        ? '<button class="atick" data-act="action-done" data-id="' + esc(a.id) +
          '" title="Mark done" aria-label="Mark done: ' + esc(a.title) + '">' + ICONS.tick + "</button>"
        : '<span class="atick flat" aria-hidden="true">' + (ICONS[type.ico] || ICONS.tick) + "</span>") +
      '<button class="amain" data-act="action-open" data-id="' + esc(a.id) + '">' +
      '<span class="anm">' + esc(a.title) + "</span>" +
      '<span class="asub">' + esc(type.word) +
      (ctx.length ? " · " + ctx.join(" · ") : "") +
      (a.derived ? " · from the record" : "") + "</span></button>" +
      '<span class="aright">' + right.join("") + "</span></div>";
  }

  function projectRow(p) {
    var st = getProjectState(p.id), pr = getProjectProgress(p.id);
    var below = [];
    if (p.description) below.push(esc(clip(p.description, 70)));
    if (p.jobId) below.push(esc(nameOf("jobs", p.jobId)));
    if (st.late) below.push(numWord(st.late) + " " + plural(st.late, "late action"));
    else if (st.overdue) below.push("was due " + esc(plainDate(p.endDate)));
    else if (st.next) below.push("next: " + esc(clip(st.next.title, 40)));
    var right = pr.total
      ? '<span class="dprog"><span class="dpct">' + Math.round(pr.pct * 100) + "%</span>" +
        '<span class="dpbasis">' + esc(pr.done + " of " + pr.total + " " + pr.basis) + "</span></span>"
      : '<span class="dprog"><span class="dpbasis">nothing to measure yet</span></span>';
    return '<button class="drow e-' + st.tone + '" data-act="proj-open" data-id="' + p.id +
      '" title="' + esc(p.name) + '">' + itile("proj", "proj") +
      '<span class="dmain"><span class="dnm">' + esc(p.name) + "</span>" +
      '<span class="dsub">' + below.join(" · ") + "</span></span>" +
      '<span class="dright">' + right + pill(st.word, st.tone) + "</span>" +
      '<span class="dchev" aria-hidden="true">›</span></button>';
  }

  function assetRow(a) {
    var st = assetState(a), h = openHandle(a);
    var sec = ASSET_SECTIONS.filter(function (s) { return s.id === (a.section || "file"); })[0] || ASSET_SECTIONS[3];
    var below = [esc(a.type || sec.label)];
    if (h.brief) below.push(esc(h.brief));
    else if (a.description) below.push(esc(clip(a.description, 50)));
    var right = "";
    if (a.lastUsedOn && dayOk(a.lastUsedOn)) right += '<span class="adate">' + esc(agoWords(a.lastUsedOn)) + "</span>";
    right += pill(st.word, st.tone);
    return '<button class="drow e-' + st.tone + '" data-act="asset-open" data-id="' + a.id +
      '" title="' + esc(a.name) + '">' + itile(sec.ico, sec.id) +
      '<span class="dmain"><span class="dnm">' + esc(a.name) + "</span>" +
      '<span class="dsub">' + below.join(" · ") + "</span></span>" +
      '<span class="dright">' + right + "</span>" +
      '<span class="dchev" aria-hidden="true">›</span></button>';
  }

  /* ============================================================
     PROJECTS — "What bodies of work am I responsible for, and what
     belongs to each?"

     The strip is Projects · Jobs, and the projects come first: a job is
     who the work is for and a project is the work, and the original
     landed on a list of employers so the two projects nobody was paying
     for were the only ones on the screen you arrived at.
     ============================================================ */

  var projTab = "projects";     // view state: never in `state`, never saved
  var openProj = "";
  var projPage = "overview";
  var projFilter = "";
  var openWf = "";
  var openRun = "";

  var PROJ_FILTERS = [
    { id: "", label: "All" },
    { id: "active", label: "Active" },
    { id: "waiting", label: "Waiting" },
    { id: "completed", label: "Completed" },
    { id: "archived", label: "Archived" }
  ];
  var PROJ_PAGES = [
    { id: "overview", label: "Overview" },
    { id: "work", label: "Work" },
    { id: "tasks", label: "Tasks" },
    { id: "things", label: "Things" },
    { id: "people", label: "People" }
  ];

  function renderProjects() {
    if (openProj) return renderProjectPage();
    var strip = '<div class="strip">' +
      '<button class="spage' + (projTab === "projects" ? " on" : "") + '" data-act="proj-tab" data-id="projects">Projects</button>' +
      '<button class="spage' + (projTab === "jobs" ? " on" : "") + '" data-act="proj-tab" data-id="jobs">Jobs</button>' +
      "</div>";
    if (projTab === "jobs") return renderJobs(strip);

    var all = projectsSorted();
    var rows = all.filter(function (p) {
      return !projFilter || getProjectState(p.id).status === projFilter;
    });
    /* No chips on an empty book: five controls all reading nought above
       "No projects yet." is a row of things that cannot do anything. */
    var chips = !all.length ? "" : '<div class="chips">' + PROJ_FILTERS.map(function (f) {
      var n = f.id ? all.filter(function (p) { return getProjectState(p.id).status === f.id; }).length : all.length;
      return '<button class="chip' + (projFilter === f.id ? " on" : "") + '" data-act="proj-filter" data-id="' +
        f.id + '">' + esc(f.label) + ' <span class="cn">' + n + "</span></button>";
    }).join("") + "</div>";

    var body;
    if (!all.length) {
      body = emptyLines("No projects yet.", "Create a project to give your work a home.");
    } else if (!rows.length) {
      body = emptyLines("Nothing under " + PROJ_FILTERS.filter(function (f) { return f.id === projFilter; })[0].label + ".",
        "The chips above count what each filter holds.");
    } else {
      body = '<div class="rows">' + rows.map(projectRow).join("") + "</div>";
    }
    return pageHead2("Projects", "Why the work exists. Worst first.",
        '<button class="btn primary" data-act="proj-add">New project</button>') +
      strip + chips + panel(projFilter ? "Projects — " + PROJ_FILTERS.filter(function (f) { return f.id === projFilter; })[0].label : "Projects", body);
  }

  function renderJobs(strip) {
    var body;
    if (!state.jobs.length) {
      body = emptyLines("No jobs recorded yet.", "Jobs group projects by employer or claimant.");
    } else {
      body = '<div class="rows">' + state.jobs.map(function (j) {
        var ps = state.projects.filter(function (p) { return p.jobId === j.id; });
        var late = ps.reduce(function (n, p) { return n + getProjectState(p.id).late; }, 0);
        var claimant = j.claimantId ? nameOf("claimants", j.claimantId) : "";
        return rowBtn({
          act: "job-open", id: j.id, name: j.name, tile: itile("job", "job"),
          tone: late ? "late" : "",
          /* The claimant is only worth printing when it is not the job's
             own name — `job-add` creates one per job, so by default the
             two are the same word and the row said it twice. */
          says: (ps.length ? numWord(ps.length) + " " + plural(ps.length, "project") : "Nothing filed under it") +
            (claimant && claimant !== j.name ? " · owed to " + esc(claimant) : "") +
            (late ? " · " + numWord(late) + " " + plural(late, "late action") : ""),
          right: pill(j.status === "closed" ? "Closed" : "Open", j.status === "closed" ? "done" : "live")
        });
      }).join("") + "</div>";
    }
    /* Work under no job keeps its heading here, because it is the one
       thing the list above cannot show: a thesis and a visa belong to no
       employer, and that is the brief's "life underneath that belongs to
       none of them". */
    var loose = state.projects.filter(function (p) { return !p.jobId; });
    var extra = loose.length
      ? panel("Under no job", '<div class="rows">' + loose.map(projectRow).join("") + "</div>")
      : "";
    return pageHead2("Jobs", "Who the work is for. A job is not a project.",
        '<button class="btn primary" data-act="job-add">New job</button>') +
      strip + panel("Jobs", body) + extra;
  }

  /* ============================================================
     A PROJECT PAGE — "What is this project, what is happening inside
     it, and what is connected to it?"

     Five pages and not eight lists. The brief's own strip is Overview ·
     Work · Tasks · Things · People, and the reason to keep it at five
     is written into this repo twice already: eight sub-tabs put the
     last three off the edge of a phone and nobody opened them.

     Nothing on the strip is a list to MAINTAIN. A project's things are
     derived from what its workflows name, and its people from the
     relationships plus the runs — so a thing cannot be on the project
     page and missing from Assets, and a person cannot read "one thing
     is late" here and "clear" on their own row. The brief says it in as
     many words: "Project pages show relationships to assets, not
     copies."
     ============================================================ */

  function renderProjectPage() {
    var p = byId(state.projects, openProj);
    if (!p) {
      return pageHead2("Projects", "",
        '<button class="btn" data-act="proj-back">All projects</button>') +
        panel("This project could not be opened.",
          emptyLines("It is no longer in the record.",
            "It may have been removed on this device or on another one."));
    }
    var st = getProjectState(p.id), pr = getProjectProgress(p.id);
    var sub = [];
    if (p.jobId) sub.push("for " + esc(nameOf("jobs", p.jobId)));
    if (dayOk(p.endDate)) sub.push("due " + esc(plainDate(p.endDate)));
    var head = pageHead2(p.name, sub.join(" · "),
      '<div class="acts">' +
      '<button class="btn" data-act="proj-back">All projects</button>' +
      '<button class="btn" data-act="proj-edit" data-id="' + p.id + '">Edit</button>' +
      '<button class="btn primary" data-act="task-add" data-id="' + p.id + '">New task</button></div>');
    var ident = '<div class="ident e-' + st.tone + '">' + itile("proj", "proj") +
      '<div class="igrow"><p class="isays">' + (p.description ? esc(p.description) : '<span class="dim">No description.</span>') + "</p>" +
      '<p class="imeta">' + pill(st.word, st.tone) +
      (pr.total ? '<span class="dim">' + Math.round(pr.pct * 100) + "% — " +
        esc(pr.done + " of " + pr.total + " " + pr.basis) + "</span>"
        : '<span class="dim">nothing to measure yet</span>') + "</p></div></div>";
    var strip = '<div class="strip">' + PROJ_PAGES.map(function (pg) {
      return '<button class="spage' + (projPage === pg.id ? " on" : "") +
        '" data-act="proj-page" data-id="' + pg.id + '">' + esc(pg.label) + "</button>";
    }).join("") + "</div>";
    return head + ident + strip + projPageBody(p);
  }

  function projPageBody(p) {
    if (projPage === "work") return projWork(p);
    if (projPage === "tasks") return projTasks(p);
    if (projPage === "things") return projThings(p);
    if (projPage === "people") return projPeople(p);
    return projOverview(p);
  }

  /* Overview is the two ends of the project: where it stands, and what
     has left the building. Both halves are LEADS and not copies of the
     pages behind them, and both carry the route to the full list — a
     card that grows into a whole page is how the original's Today tab
     became the screen everybody scrolled past. */
  function projOverview(p) {
    var open = getProjectActions(p.id).filter(function (a) { return !a.completedAt; });
    var order = ["late", "today", "unfiled", "hands", "waiting", "upkeep"];
    open.sort(function (a, b) { return order.indexOf(actionState(a)) - order.indexOf(actionState(b)); });
    var wfs = projectWorkflows(p.id);
    var outs = getProjectOutputs(p.id);
    var people = getProjectPeople(p.id);

    if (!open.length && !wfs.length && !outs.filed.length && !people.length) {
      return panel("Where it stands",
        emptyLines("This project has no recorded work yet.",
          "Attach a workflow, or type the first task."), 
        '<button class="btn primary" data-act="task-add" data-id="' + p.id + '">New task</button>');
    }
    var next = open.length
      ? '<div class="rows">' + open.slice(0, 4).map(function (a) {
            return actionRow(a, { inProject: p.id });
          }).join("") + "</div>" +
        (open.length > 4 ? '<p class="says">' + numWord(open.length - 4) + " more under Tasks and Work.</p>" : "")
      : emptyLines("Nothing is waiting to be done here.", "Everything recorded against it is done.");
    var work = wfs.length
      ? '<div class="rows">' + wfs.slice(0, 3).map(function (w) { return workflowRow(w, p.id); }).join("") + "</div>"
      : emptyLines("No workflows are attached to this project.", "A workflow is how the work is carried out.");
    var left = panel("What to do next", next,
        '<button class="btn quiet" data-act="proj-page" data-id="tasks">Tasks →</button>') +
      panel("How it is carried out", work,
        '<button class="btn quiet" data-act="proj-page" data-id="work">Work →</button>');
    var filed = outs.filed.length
      ? '<div class="rows">' + outs.filed.slice(0, 4).map(function (f) {
          return '<div class="arow e-done"><span class="atick flat" aria-hidden="true">' + ICONS.file + "</span>" +
            '<span class="amain"><span class="anm">' + esc(f.title) + "</span>" +
            '<span class="asub">' + esc(f.workflowName) + (f.where ? " · " + esc(clip(f.where, 34)) : "") + "</span></span>" +
            '<span class="aright"><span class="adate">' + esc(agoWords(f.at)) + "</span>" + pill("Filed", "done") + "</span></div>";
        }).join("") + "</div>"
      : emptyLines("Nothing has left the building yet.",
          "A filing step, once done, is what says a piece of work is finished.");
    var who = people.length
      ? '<div class="rows">' + people.slice(0, 4).map(personRow).join("") + "</div>"
      : emptyLines("No people are connected to this project yet.", "A person is added with what you are waiting on them for.");
    var right = panel("What it has produced", filed) +
      panel("Who is involved", who,
        '<button class="btn quiet" data-act="proj-page" data-id="people">People →</button>');
    return '<div class="grid2">' + left + right + "</div>";
  }

  function projWork(p) {
    var wfs = projectWorkflows(p.id);
    var runs = projectRuns(p.id);
    if (!wfs.length) {
      return panel("Work",
        emptyLines("No workflows are attached to this project.",
          "Write one on Workflows, then start a run of it here."),
        '<button class="btn primary" data-act="wf-add" data-id="' + p.id + '">New workflow</button>');
    }
    var wfBody = '<div class="rows">' + wfs.map(function (w) { return workflowRow(w, p.id); }).join("") + "</div>";
    var runBody = runs.length
      ? '<div class="rows">' + runs.sort(function (a, b) {
          return (a.completedAt ? 1 : 0) - (b.completedAt ? 1 : 0) ||
            (b.startedAt || "").localeCompare(a.startedAt || "");
        }).map(runRow).join("") + "</div>"
      : emptyLines("No runs yet.", "A run is one pass through a workflow. Start one from a workflow above.");
    return panel("Workflows", wfBody,
        '<button class="btn primary" data-act="wf-add" data-id="' + p.id + '">New workflow</button>') +
      panel("Runs", runBody);
  }

  function projTasks(p) {
    var acts = getProjectActions(p.id);
    var open = acts.filter(function (a) { return !a.completedAt; });
    var done = acts.filter(function (a) { return a.completedAt; });
    var body = open.length
      ? '<div class="rows">' + open.sort(function (a, b) {
          var order = ["late", "today", "unfiled", "hands", "waiting", "upkeep"];
          return order.indexOf(actionState(a)) - order.indexOf(actionState(b));
        }).map(function (a) { return actionRow(a, { inProject: p.id }); }).join("") + "</div>"
      : emptyLines("Nothing is waiting to be done here.", "Type a task, or start a run of one of its workflows.");
    var doneBody = done.length
      ? panel("Recently completed", '<div class="rows">' +
          done.slice(-5).reverse().map(function (a) { return actionRow(a, { inProject: p.id }); }).join("") + "</div>")
      : "";
    return panel("Tasks", body,
        '<button class="btn primary" data-act="task-add" data-id="' + p.id + '">New task</button>') + doneBody;
  }

  function projThings(p) {
    var things = getProjectThings(p.id);
    if (!things.length) {
      return panel("Things",
        emptyLines("No things are connected to this project yet.",
          "A thing is connected by being named on one of its workflows, or written onto the project."));
    }
    /* Grouped by the Repo's own sections, in the Repo's own order, so a
       reader who typed a name has one place to look instead of guessing
       between six lists of one item each. */
    var out = "";
    ASSET_SECTIONS.forEach(function (s) {
      var rows = things.filter(function (a) { return (a.section || "file") === s.id; });
      if (!rows.length) return;
      out += panel(s.label, '<div class="rows">' + rows.map(assetRow).join("") + "</div>");
    });
    return out + '<p class="says">These are the things the project is connected to. They live in Assets — this is not a second copy of them.</p>';
  }

  function personRow(r) {
    var out = r.outstanding.length;
    var late = r.outstanding.filter(function (a) { return actionState(a) === "late"; }).length;
    var says = [];
    if (r.person.organization) says.push(esc(r.person.organization));
    if (r.link && r.link.purpose) says.push(esc(r.link.purpose));
    says.push(out ? "Waiting on " + esc(r.person.name) + " for " + numWord(out) + " " + plural(out, "thing")
                  : "Nothing outstanding");
    return rowBtn({
      act: "person-open", id: r.person.id, name: r.person.name, tile: itile("person", "person"),
      tone: late ? "late" : out ? "idle" : "",
      says: says.join(" · "),
      right: out ? pill(late ? "Late" : "Waiting", late ? "late" : "idle") : pill("Clear", "done")
    });
  }

  function projPeople(p) {
    var people = getProjectPeople(p.id);
    var body = people.length
      ? '<div class="rows">' + people.map(personRow).join("") + "</div>"
      : emptyLines("No people are connected to this project yet.",
          "Add one with what you are waiting on them for.");
    return panel("People", body,
      '<button class="btn primary" data-act="person-link" data-id="' + p.id + '">Add a person</button>');
  }

  /* ============================================================
     WORKFLOWS — "What repeatable procedures do I have, and which ones
     are currently being run?"

     A Workflow is a reusable procedure and a WorkflowRun is one
     execution, and in this rebuild they are genuinely two records — not
     one record that is sometimes a template and sometimes a run, which
     is what the original had and what made "a failed run preserves its
     failure point" impossible to say.

     What is NOT here yet is the canvas. A procedure is drawn as a list
     of steps in the order the sequence edges put them, which is a
     legitimate second rendering of one graph — it is the rendering a
     phone gets — and the canvas is the next increment. The screen says
     so rather than leaving a reader to wonder.
     ============================================================ */

  /* A run's own word, from the brief's list: Running · Waiting ·
     Blocked · Complete · Failed. Derived from the run's nodes, so the
     row and the page cannot disagree. */
  function runWord(run) {
    var s = runStand(run);
    if (run.completedAt) return { word: "Complete", tone: "done" };
    if (run.status === "failed") return { word: "Failed", tone: "late" };
    var nodes = workflowNodes(run.workflowId).filter(function (n) { return n.type !== "thing"; });
    var blocked = nodes.some(function (n) { return runNodeState(run, n) === "blocked"; });
    if (blocked) return { word: "Blocked", tone: "drift" };
    var acts = activeRunNodes(run).map(function (n) { return (NODE_TYPES[n.type] || {}).act; });
    if (acts.length && acts.every(function (a) { return a === "waiting"; })) return { word: "Waiting", tone: "idle" };
    if (!s.active && s.unfiled.length) return { word: "Unfiled", tone: "drift" };
    return { word: "Running", tone: "live" };
  }

  function workflowRow(w, pid) {
    var steps = liveNodes(w.id).filter(function (n) { return n.type !== "thing"; }).length;
    var runs = getWorkflowRuns(w.id);
    var last = runs[0];
    var says = [];
    if (w.description) says.push(esc(clip(w.description, 60)));
    says.push(numWord(steps) + " " + plural(steps, "step"));
    if (last) says.push("last run " + esc(agoWords((last.startedAt || "").slice(0, 10))));
    else says.push("never run");
    var right = last ? pill(runWord(last).word, runWord(last).tone) : pill("Template", "idle");
    return '<div class="arow' + (last ? " e-" + runWord(last).tone : "") + '">' +
      '<span class="atick flat" aria-hidden="true">' + ICONS.flow + "</span>" +
      '<button class="amain" data-act="wf-open" data-id="' + w.id + '">' +
      '<span class="anm">' + esc(w.name) + "</span>" +
      '<span class="asub">' + says.join(" · ") + "</span></button>" +
      '<span class="aright">' + right +
      '<button class="btn small" data-act="run-start" data-id="' + w.id +
      (pid ? '" data-proj="' + pid : "") + '">Run</button></span></div>';
  }

  function runRow(run) {
    var s = runStand(run), w = runWord(run);
    var says = [s.workflowName, s.done + " of " + s.total + " steps done"];
    if (s.active) says.push(numWord(s.active) + " " + plural(s.active, "step") + " open");
    if (s.unfiled.length && !s.active) says.push("waiting to be filed");
    if (s.edits) says.push("the workflow has been edited " + numWord(s.edits) + " " +
      plural(s.edits, "time") + " since this run started");
    return rowBtn({
      act: "run-open", id: run.id, name: run.title || s.workflowName, tile: itile("run", "run"),
      tone: w.tone,
      says: says.map(esc).join(" · "),
      right: barSmall(s.pct, w.tone) + pill(w.word, w.tone)
    });
  }
  /* A PROGRESS BAR TAKES ITS ROW'S TONE. Green means healthy state and
     nothing else: a 67% bar in sage inside a card whose edge is rose and
     whose words read "past its date" is one card saying two opposite
     things. Progress is not a state, so it borrows the row's. */
  function barSmall(pct, tone) {
    return '<span class="bar b-' + (tone || "idle") + '"><span style="width:' +
      (clamp(pct, 0, 1) * 100).toFixed(0) + '%"></span></span>';
  }

  function renderWorkflows() {
    if (openRun) return renderRun();
    if (openWf) return renderWorkflow();
    var wfs = state.workflows.slice().sort(function (a, b) { return a.name.localeCompare(b.name); });
    if (!wfs.length) {
      return pageHead2("Workflows", "How the work is carried out.",
          '<button class="btn primary" data-act="wf-add">New workflow</button>') +
        panel("Workflows", emptyLines("No workflows yet.", "Create a procedure you can run again."));
    }
    var running = state.runs.filter(function (r) { return !r.completedAt; });
    var recent = state.runs.filter(function (r) { return !!r.completedAt; })
      .sort(function (a, b) { return (b.completedAt || "").localeCompare(a.completedAt || ""); }).slice(0, 5);
    var runBody = running.length
      ? '<div class="rows">' + running.map(runRow).join("") + "</div>"
      : emptyLines("Nothing is running.", "Press Run on a procedure to start one.");
    return pageHead2("Workflows", "How the work is carried out. A procedure is written once; a run is one pass through it.",
        '<button class="btn primary" data-act="wf-add">New workflow</button>') +
      panel("Running now", runBody) +
      panel("Procedures", '<div class="rows">' + wfs.map(function (w) { return workflowRow(w, ""); }).join("") + "</div>") +
      (recent.length ? panel("Finished runs", '<div class="rows">' + recent.map(runRow).join("") + "</div>") : "");
  }

  /* One workflow, as a list of its steps in sequence order. The order is
     read off the SEQUENCE EDGES and not off array order, because a step
     invented later is appended to the list while belonging in the middle
     of the work — which is how the original's prose reader came to chain
     a filing step backwards onto an archive step. */
  function stepOrder(wfId) {
    var nodes = liveNodes(wfId).filter(function (n) { return n.type !== "thing"; });
    var seq = workflowEdges(wfId).filter(function (e) { return e.type === "sequence"; });
    /* BREADTH FIRST, AND THE ORDER IS THE DEPTH. A depth-first walk put
       the second of two parallel entry steps after everything the first
       one leads to — so "Bring in the control points" was listed after
       the orthophoto had been filed, which is the reverse of the truth.
       The shortest distance from any way in is the right measure, and it
       ignores a back edge for free: the loop's target already has a
       smaller depth, and the minimum keeps it. */
    var depth = {}, queue = [];
    entryNodes(wfId).forEach(function (n) { depth[n.id] = 0; queue.push(n); });
    while (queue.length) {
      var n = queue.shift();
      seq.filter(function (e) { return e.fromNodeId === n.id; }).forEach(function (e) {
        var t = byId(state.wfNodes, e.toNodeId);
        if (!t || t.retired || t.type === "thing") return;
        var d = depth[n.id] + 1;
        if (depth[t.id] == null || d < depth[t.id]) { depth[t.id] = d; queue.push(t); }
      });
    }
    var order = {};
    nodes.forEach(function (n, i) { order[n.id] = i; });
    var placed = nodes.filter(function (n) { return depth[n.id] != null; });
    placed.sort(function (a, b) { return depth[a.id] - depth[b.id] || order[a.id] - order[b.id]; });
    var out = placed.map(function (n) { return { node: n, depth: depth[n.id] }; });
    /* A step nobody pointed anywhere is NAMED, never dropped. A list
       that silently omits half a procedure is worse than one with an
       awkward heading under it. */
    nodes.forEach(function (n) {
      if (depth[n.id] == null) out.push({ node: n, depth: 0, loose: true });
    });
    return out;
  }

  function nodeLine(n, run) {
    var t = NODE_TYPES[n.type] || NODE_TYPES.do;
    var bits = [t.word];
    var who = nodePeople(n).map(function (id) { return nameOf("people", id); });
    if (who.length) bits.push("with " + who.join(" and "));
    if (n.config && n.config.chaseAfterDays) bits.push("chase after " + n.config.chaseAfterDays + " days");
    if (n.config && dayOk(n.config.dueAt)) bits.push("due " + plainDate(n.config.dueAt));
    if (n.config && n.config.join === "all") bits.push("waits for every way in");
    if (n.config && n.config.path) bits.push(clip(n.config.path, 30));
    if (run) {
      var rn = runNodeFor(run.id, n.id);
      if (rn && rn.answer) bits.push("answered “" + rn.answer + "”");
    }
    return bits.join(" · ");
  }

  function renderWorkflow() {
    var w = byId(state.workflows, openWf);
    if (!w) { openWf = ""; return renderWorkflows(); }
    var order = stepOrder(w.id);
    var things = workflowNodes(w.id).filter(function (n) { return n.type === "thing" && !n.retired; });
    var runs = getWorkflowRuns(w.id);
    var stepBody = order.length
      ? '<div class="rows">' + order.map(function (o) {
          var n = o.node, t = NODE_TYPES[n.type] || NODE_TYPES.do;
          var outs = workflowEdges(w.id).filter(function (e) {
            return e.type === "sequence" && e.fromNodeId === n.id;
          });
          var ways = outs.length > 1
            ? '<span class="dsub">Ways out: ' + outs.map(function (e) {
                var tn = byId(state.wfNodes, e.toNodeId);
                return esc((e.label ? "“" + e.label + "” → " : "") + (tn ? tn.label : "(removed)"));
              }).join(" · ") + "</span>"
            : "";
          return '<div class="arow' + (o.loose ? " e-drift" : "") + '">' +
            '<span class="atick flat" aria-hidden="true">' + (ICONS[t.ico] || ICONS.do) + "</span>" +
            '<button class="amain" data-act="node-edit" data-id="' + n.id + '">' +
            '<span class="anm">' + esc(n.label) + "</span>" +
            '<span class="asub">' + esc(nodeLine(n)) +
            (o.loose ? " · nothing comes before or after it" : "") + "</span>" + ways + "</button>" +
            '<span class="aright"><button class="btn small danger" data-act="node-del" data-id="' + n.id +
            '">Remove</button></span></div>';
        }).join("") + "</div>"
      : emptyLines("Nothing happens yet.", "Add the first step.");
    var thingBody = things.length
      ? '<div class="rows">' + things.map(function (n) {
          return rowBtn({ act: "node-edit", id: n.id, name: n.label, tile: itile("thing", "thing"),
            says: "Belongs with a step, and nothing waits on it" });
        }).join("") + "</div>"
      : "";
    return pageHead2(w.name, w.description ? esc(w.description) : "A procedure, written once.",
        '<div class="acts">' +
        '<button class="btn" data-act="wf-back">All workflows</button>' +
        '<button class="btn" data-act="wf-edit" data-id="' + w.id + '">Edit</button>' +
        '<button class="btn primary" data-act="run-start" data-id="' + w.id + '">Run it</button></div>') +
      '<p class="says">Version ' + (num(w.version) || 1) + " · " +
        (w.projectId ? "part of " + esc(nameOf("projects", w.projectId)) : "in no project") +
        " · drawn as a list of steps for now; the canvas is the next piece of the rebuild.</p>" +
      panel("The steps, in order", stepBody,
        '<div class="acts"><button class="btn" data-act="node-add" data-id="' + w.id + '">Add a step</button>' +
        '<button class="btn" data-act="edge-add" data-id="' + w.id + '">Join two steps</button>' +
        '<button class="btn" data-act="thing-add" data-id="' + w.id + '">Add a thing</button></div>') +
      (thingBody ? panel("Things it is done with", thingBody) : "") +
      (runs.length ? panel("Runs of it", '<div class="rows">' + runs.map(runRow).join("") + "</div>") : "");
  }

  function renderRun() {
    var run = byId(state.runs, openRun);
    if (!run) { openRun = ""; return renderWorkflows(); }
    var s = runStand(run), w = runWord(run);
    var order = stepOrder(run.workflowId);
    /* A node a run has entered is retired rather than deleted, so a run
       can name a step that is no longer on the procedure. It is listed
       here and NOT on the workflow, which is the whole point of the
       retirement. */
    workflowNodes(run.workflowId).forEach(function (n) {
      if (!n.retired || n.type === "thing") return;
      if (runNodeFor(run.id, n.id)) order.push({ node: n, depth: 0, retired: true });
    });
    var body = order.map(function (o) {
      var n = o.node, st = runNodeState(run, n), meta = RUN_NODE_STATES[st];
      var t = NODE_TYPES[n.type] || NODE_TYPES.do;
      var acts = [];
      if (st === "active") {
        if (n.type === "ask") acts.push('<button class="btn small primary" data-act="step-answer" data-id="' +
          run.id + ':' + n.id + '">Answer it</button>');
        else acts.push('<button class="btn small primary" data-act="step-done" data-id="' +
          run.id + ':' + n.id + '">Mark done</button>');
        if (n.type === "send" || n.type === "watch") acts.push('<button class="btn small" data-act="step-chase" data-id="' +
          run.id + ':' + n.id + '">Chased today</button>');
        acts.push('<button class="btn small" data-act="step-fail" data-id="' + run.id + ':' + n.id + '">It failed</button>');
      } else if (st === "done") {
        acts.push('<button class="btn small" data-act="step-reopen" data-id="' + run.id + ':' + n.id + '">Reopen</button>');
      }
      return '<div class="arow e-' + meta.tone + (o.retired ? " a-derived" : "") + '">' +
        '<span class="atick flat" aria-hidden="true">' + (ICONS[t.ico] || ICONS.do) + "</span>" +
        '<span class="amain flat"><span class="anm">' + esc(n.label) + "</span>" +
        '<span class="asub">' + esc(nodeLine(n, run)) +
        (o.retired ? " · this step is no longer on the procedure" : "") + "</span></span>" +
        '<span class="aright">' + pill(meta.word, meta.tone) +
        (acts.length ? '<span class="acts">' + acts.join("") + "</span>" : "") + "</span></div>";
    }).join("");
    var head = pageHead2(run.title || s.workflowName,
      esc(s.workflowName) + " · started " + esc(agoWords((run.startedAt || "").slice(0, 10))) +
      (run.projectId ? " · " + esc(nameOf("projects", run.projectId)) : ""),
      '<div class="acts">' +
      '<button class="btn" data-act="run-back">All workflows</button>' +
      (run.completedAt ? "" : '<button class="btn primary" data-act="run-close" data-id="' + run.id + '">Close the run</button>') +
      "</div>");
    var stand = '<div class="ftiles">' +
      tileFig("Where it stands", s.done + " of " + s.total, "steps done", w.tone) +
      tileFig("Open now", String(s.active), s.active ? "being worked or waited on" : "nothing open", s.active ? "live" : "") +
      tileFig("To file", String(s.unfiled.length), s.unfiled.length ? "not put away yet" : "nothing left to file", s.unfiled.length ? "drift" : "") +
      "</div>";
    /* THE WORKFLOW CAN BE EDITED UNDER A RUN — that is the brief's model,
       and it is the one thing the old freeze could never say. So the run
       says how far the two have parted rather than pretending they have
       not. */
    var drift = s.edits
      ? '<p class="says drift-says">The procedure has been edited ' + numWord(s.edits) + " " +
        plural(s.edits, "time") + " since this run started (version " + (num(run.workflowVersion) || 1) +
        " then, version " + (num(run.workflowVersion) + s.edits) + " now). Steps this run has already entered are kept whatever happens to the procedure.</p>"
      : "";
    return head + stand + drift + panel("The steps", body || emptyLines("This run has no steps.", "Its procedure is empty."));
  }

  /* ============================================================
     ACTIONS — "What is the next concrete thing that needs to happen?"

     Two things hold this screen honest. The four summary tiles are
     STATE counts and the groups below them are the same states, so the
     tiles are a partition of the list and a figure can never disagree
     with its own parts. And which half of the list is derived and which
     was typed is said out loud on every row, because a due born from a
     run and a task somebody wrote down are different kinds of fact.
     ============================================================ */

  var ACTION_GROUPS = [
    { key: "late",    head: "Late",          says: "Past its date, or past the day you said you would chase." },
    { key: "today",   head: "Today",         says: "Dated today." },
    { key: "hands",   head: "In your hands", says: "Nobody else is holding these up." },
    { key: "unfiled", head: "Unfiled",       says: "Done, but not put away — the one thing that says work left the building." },
    { key: "waiting", head: "Waiting",       says: "On somebody else, and not late yet." }
  ];

  function renderActions() {
    var open = actionOpen();
    var late = actionsInState("late"), todays = actionsInState("today");
    var wait = actionsInState("waiting"), unf = actionsInState("unfiled");
    var upkeep = actionsInState("upkeep");
    var done = actionAll().filter(function (a) { return a.completedAt; })
      .sort(function (a, b) { return (b.completedAt || "").localeCompare(a.completedAt || ""); }).slice(0, 6);

    var head = pageHead2("Actions", "What happens next. Worst first.",
      '<button class="btn primary" data-act="task-add">New task</button>');

    if (!open.length && !done.length) {
      return head + panel("Actions",
        emptyLines("Nothing needs doing.", "Actions will appear here when work needs your attention."));
    }
    var tiles = '<div class="ftiles">' +
      tileFig("Late", String(late.length), late.length ? "needs doing now" : "nothing late", late.length ? "late" : "") +
      tileFig("Today", String(todays.length), "dated today", todays.length ? "live" : "") +
      tileFig("Waiting", String(wait.length), "on somebody else", wait.length ? "idle" : "") +
      tileFig("Unfiled", String(unf.length), "not put away", unf.length ? "drift" : "") +
      "</div>";

    var groups = ACTION_GROUPS.map(function (g) {
      var rows = actionsInState(g.key);
      if (!rows.length) {
        /* The brief's own words where they apply, and a pointer where
           they would contradict the screen: saying "You are not waiting
           on anyone" above a late chase would be the app disagreeing
           with itself. */
        if (g.key === "waiting") {
          var anyWaiting = actionOpen().some(function (a) { return a.type === "waiting"; });
          return panel(g.head, anyWaiting
            ? emptyLines("Nothing is quietly waiting.", "What you are waiting on is late — it is under Late, above.")
            : emptyLines("You are not waiting on anyone.", "A send or a watch inside a run puts somebody here."));
        }
        if (g.key === "unfiled") return panel(g.head, emptyLines("Nothing is unfiled.", "Every finished run has been put away."));
        return "";
      }
      return panel(g.head, '<p class="says">' + esc(g.says) + "</p>" +
        '<div class="rows">' + rows.map(function (a) { return actionRow(a); }).join("") + "</div>");
    }).join("");

    var upBody = upkeep.length
      ? '<div class="rows">' + upkeep.map(function (a) { return actionRow(a); }).join("") + "</div>"
      : emptyLines("No upkeep recorded.", "Upkeep is every so often since it was last done, never on a date.");
    var doneBody = done.length
      ? '<div class="rows">' + done.map(function (a) { return actionRow(a); }).join("") + "</div>"
      : "";

    return head + tiles + groups +
      panel("Recurring upkeep", upBody,
        '<button class="btn" data-act="upkeep-add">New upkeep</button>') +
      (doneBody ? panel("Recently completed", doneBody) : "") +
      '<p class="says foot">A row marked <em>from the record</em> is derived — a live step of a run, or something outstanding with a person. Everything else was typed.</p>';
  }

  /* ============================================================
     SETTINGS
     ============================================================ */

  /* What each list is called on a screen, as against what it is called in
     the record. `state.wfNodes` is a state key; "steps" is the word a
     reader has. A count printed straight off the key gave "21 wf nodes"
     and "two schedule". */
  var LIST_WORDS = {
    claimants:   ["claimant", "claimants"],
    jobs:        ["job", "jobs"],
    projects:    ["project", "projects"],
    people:      ["person", "people"],
    personLinks: ["person on a project", "people on projects"],
    actions:     ["typed action", "typed actions"],
    assets:      ["thing", "things"],
    workflows:   ["workflow", "workflows"],
    wfNodes:     ["step", "steps"],
    wfEdges:     ["line between steps", "lines between steps"],
    runs:        ["run", "runs"],
    runNodes:    ["step of a run", "steps of runs"],
    schedule:    ["date", "dates"],
    reports:     ["report", "reports"],
    timeEntries: ["stretch of time", "stretches of time"]
  };
  function renderSettings() {
    var counts = STATE_LISTS.map(function (k) {
      var n = state[k].length;
      if (!n) return "";
      var w = LIST_WORDS[k] || [k, k];
      return numWord(n) + " " + (n === 1 ? w[0] : w[1]);
    }).filter(Boolean);
    var theme = state.settings.theme || "";
    return pageHead2("Settings", "The workspace, and how it is kept.") +
      panel("Who this is",
        '<div class="frow"><label for="ownerName">Your name</label>' +
        '<input id="ownerName" type="text" value="' + esc(state.settings.owner) + '" placeholder="Left blank, nothing is invented" />' +
        '<button class="btn" data-act="owner-save">Save</button></div>' +
        '<p class="says">It heads the rail and greets you on Home. Blank is a first-class answer: the rail reads "Mashghal" and Home greets the hour.</p>') +
      panel("Look",
        '<div class="acts">' +
        '<button class="btn' + (theme === "" ? " primary" : "") + '" data-act="theme" data-id="">Follow the system</button>' +
        '<button class="btn' + (theme === "dark" ? " primary" : "") + '" data-act="theme" data-id="dark">Dark</button>' +
        '<button class="btn' + (theme === "light" ? " primary" : "") + '" data-act="theme" data-id="light">Light</button></div>') +
      panel("The record",
        '<p class="says">' + (counts.length ? cap(counts.join(" · ")) + "." : "Nothing recorded yet.") + "</p>" +
        '<div class="acts">' +
        '<button class="btn" data-act="book-export">Save a copy</button>' +
        '<button class="btn" data-act="book-import">Restore a copy</button>' +
        '<button class="btn" data-act="sample">Load the example</button>' +
        '<button class="btn danger" data-act="wipe">Erase everything</button></div>' +
        '<p class="says">This workspace is kept in this browser under its own name, <code>mashghal2.v1</code>. It is a different book from the original app’s — loading the example here cannot touch that one.</p>') +
      panel("What is built, and what is not",
        '<p class="says">This is the round-3 rebuild. The workspace is one set of canonical records — jobs, projects, people, actions, things, workflows with their steps, lines, runs and run steps, dates, reports and stretches of time — with one derived selector per question, and every screen is a view over it. Nothing on any screen is stored, and nothing on one is computed there.</p>' +
        '<p class="says">Built: Home, Projects with their five pages, Jobs, Workflows with runs, Actions, Assets in its six sections including the Library, and Schedule.</p>' +
        '<p class="says">Still to come, in this order: the node canvas, Outputs, and the command bar. Nothing is hidden behind a control that does nothing — a section that is not built is not on the bar.</p>' +
        '<p class="says">The original app is untouched and still holds your work: <a href="../mashghal/">open Mashghal</a>.</p>' +
        '<p class="says dim">Build ' + esc(BUILD) + "</p>");
  }

  /* ============================================================
     ASSETS — one registry viewed six ways.

     Which section an entry is in is STATED and not derived. It is
     tempting to work it out — a path means a file, a url means a
     connection — and it is wrong for one concrete reason: ArcGIS Pro
     has a path AND a licence page, so a derived section would put it
     somewhere the reader did not choose, and a reader who types a name
     should never have to wonder which of six lists it landed in.
     ============================================================ */

  var repoSect = "device";
  var openAsset = "";
  var openPerson = "";
  var openJob = "";

  function assetsIn(sec) {
    return state.assets.filter(function (a) { return (a.section || "file") === sec; })
      .sort(function (a, b) { return a.name.localeCompare(b.name); });
  }
  /* Where else this thing turns up. Stated one way round (a node names
     an asset) and read the other way by walking, so the two can never
     disagree — and it is folded by workflow, because one workflow can
     name the same thing twice and "two workflows" would then read as
     four. */
  function assetUses(id) {
    var out = {};
    state.wfNodes.forEach(function (n) {
      if (!n.config || n.config.assetId !== id) return;
      var w = byId(state.workflows, n.workflowId);
      if (w) out[w.id] = { workflow: w, steps: (out[w.id] ? out[w.id].steps : 0) + 1 };
    });
    return Object.keys(out).map(function (k) { return out[k]; });
  }
  function partsIn(id) {
    return state.assets.filter(function (a) { return a.atId === id; });
  }
  function madeInto(id) {
    return state.assets.filter(function (a) { return (a.fromIds || []).indexOf(id) >= 0; });
  }
  /* Both halves or no row. A label with the value cleared is a blank row
     and a value with no label is a row nobody can read — and a bad merge
     really can leave half a fact in the record. */
  function assetFacts(a) {
    return (a.facts || []).filter(function (f) { return f && f.k && f.v; });
  }

  function renderAssets() {
    if (openAsset) return renderAssetPage();
    var strip = '<div class="strip">' + ASSET_SECTIONS.map(function (s) {
      return '<button class="spage' + (repoSect === s.id ? " on" : "") +
        '" data-act="repo-sect" data-id="' + s.id + '">' + esc(s.label) +
        ' <span class="cn">' + assetsIn(s.id).length + "</span></button>";
    }).join("") + "</div>";
    var sec = ASSET_SECTIONS.filter(function (s) { return s.id === repoSect; })[0] || ASSET_SECTIONS[0];
    /* The Library is read by SUBJECT and by TYPE rather than as a flat
       list, because "everything I have on harbour surveying" is the
       question it exists to answer. It is still the same records. */
    if (sec.id === "lib") {
      return pageHead2("Assets", esc(sec.q),
          '<button class="btn primary" data-act="asset-add" data-id="lib">Save something</button>') +
        strip + libSection();
    }
    var rows = assetsIn(sec.id);
    var body = rows.length
      ? '<div class="rows">' + rows.map(assetRow).join("") + "</div>"
      : emptyLines("Nothing under " + sec.label + " yet.", "Add the first one with the button above.");
    /* The launcher's reason is stated ONCE above the list and never on
       every row: the same twenty words four times, under a card already
       saying them, is the fault this repo records as "say it once". */
    var whyPath = rows.some(function (a) { return !a.url && a.path; })
      ? '<p class="says">A path here is copied rather than opened: a page served over https may not open a file on this computer, and the browser refuses it silently. Paste it into Win+R.</p>'
      : "";
    return pageHead2("Assets", esc(sec.q),
        '<button class="btn primary" data-act="asset-add" data-id="' + sec.id + '">Add to ' + esc(sec.label) + "</button>") +
      strip + panel(sec.label, whyPath + body);
  }

  function factRow(k, v, dim) {
    return "<dt>" + esc(k) + "</dt><dd" + (dim ? ' class="dim"' : "") + ">" + v + "</dd>";
  }
  function renderAssetPage() {
    var a = byId(state.assets, openAsset);
    if (!a) { openAsset = ""; return renderAssets(); }
    var st = assetState(a), h = openHandle(a);
    var sec = ASSET_SECTIONS.filter(function (s) { return s.id === (a.section || "file"); })[0] || ASSET_SECTIONS[3];
    /* Only the rows that EXIST are printed. Half of the poster's labels
       are fields this record does not have, and a table of blanks is
       worse than a shorter table; where a fact is genuinely unstated the
       row says so in words rather than leaving a gap. */
    var rows = factRow("Kind", esc(a.type || sec.label)) +
      factRow("Which list", esc(sec.label)) +
      factRow("How it stands", pill(st.word, st.tone));
    if (a.path) rows += factRow("Where it is", "<code>" + esc(a.path) + "</code>");
    if (a.url) rows += factRow("A link to it", '<a href="' + esc(a.url) + '" target="_blank" rel="noopener noreferrer">' + esc(clip(a.url, 48)) + "</a>");
    if (a.section === "device") rows += factRow("Last used",
      a.lastUsedOn && dayOk(a.lastUsedOn) ? esc(plainDate(a.lastUsedOn)) : "not said", !a.lastUsedOn);
    if (a.atId) rows += factRow("Part of / found at", esc(nameOf("assets", a.atId)));
    if (a.geo && a.geo.lat != null) {
      /* AN EXTENT IS FOUR NUMBERS. Printed as two it reads as a point,
         which is a smaller claim than the record makes — and the stored
         figures go out exactly as they came in, because four decimal
         places is about eleven metres and that is the difference between
         two trenches. */
      var pt = a.geo.lat2 != null;
      rows += factRow(pt ? "Its extent" : "Where on earth",
        '<code>' + a.geo.lat + ", " + a.geo.lon +
        (pt ? " to " + a.geo.lat2 + ", " + a.geo.lon2 : "") + "</code>");
      if (pt) rows += factRow("How big", esc(geoSpan(a.geo)));
    }
    if (a.lang) rows += factRow("Written in", esc(a.lang));
    if ((a.subjects || []).length) rows += factRow("What it is about", esc(a.subjects.join(", ")));
    /* A fact a reader typed has to be correctable, and the pen is dim
       and always there rather than revealed on hover — a hover is no
       gesture at all on a touch screen. */
    assetFacts(a).forEach(function (f) {
      rows += factRow(f.k, '<span class="fval">' + esc(f.v) + "</span>" +
        '<button class="fpen" data-act="asset-fact" data-id="' + a.id + ":" + f.id +
        '" title="Edit ' + esc(f.k) + '" aria-label="Edit ' + esc(f.k) + '">' + ICONS.pen + "</button>");
    });

    var body = (a.body || "")
      ? panel("What it holds",
          '<p class="says">' + numWord(a.body.split("\n").length) + " " +
            plural(a.body.split("\n").length, "line") + "</p>" +
          '<pre class="' + (a.lang ? "snip" : "wrote") + '">' + esc(a.body) + "</pre>",
          '<button class="btn" data-act="asset-copy-body" data-id="' + a.id + '">Copy</button>')
      : "";
    var uses = assetUses(a.id), parts = partsIn(a.id), into = madeInto(a.id);
    var conn = "";
    if ((a.fromIds || []).length) conn += panel("Made from",
      '<div class="rows">' + a.fromIds.map(function (id) {
        var s = byId(state.assets, id);
        return s ? assetRow(s) : '<p class="says dim">' + esc(nameOf("assets", id)) + "</p>";
      }).join("") + "</div>");
    if (into.length) conn += panel("What came of it", '<div class="rows">' + into.map(assetRow).join("") + "</div>");
    if (parts.length) conn += panel("What is in it", '<div class="rows">' + parts.map(assetRow).join("") + "</div>");
    if (uses.length) conn += panel("Where it is used",
      '<div class="rows">' + uses.map(function (u) {
        return rowBtn({ act: "wf-open", id: u.workflow.id, name: u.workflow.name, tile: itile("flow", "flow"),
          says: "Named on " + numWord(u.steps) + " " + plural(u.steps, "step") });
      }).join("") + "</div>");
    if (!conn) conn = panel("What it is connected to",
      emptyLines("Nothing is connected to it yet.", "A workflow step names a thing; a thing can be part of another."));

    var open = h.can
      ? '<a class="btn primary" href="' + esc(h.href) + '" target="_blank" rel="noopener noreferrer">' + esc(h.label) + "</a>"
      : h.kind === "copy"
        ? '<button class="btn primary" data-act="asset-copy" data-id="' + a.id + '">' + esc(h.label) + "</button>"
        : "";
    return pageHead2(a.name, a.description ? esc(a.description) : esc(sec.label),
        '<div class="acts">' +
        '<button class="btn" data-act="asset-back">All assets</button>' +
        '<button class="btn" data-act="asset-edit" data-id="' + a.id + '">Edit</button>' +
        '<button class="btn" data-act="asset-fact-add" data-id="' + a.id + '">Note a fact</button>' +
        open + "</div>") +
      body +
      '<div class="grid2">' +
      panel("The facts", '<dl class="afacts">' + rows + "</dl>" +
        (h.kind === "copy" ? '<p class="says">' + esc(h.why) + " " + esc(h.how) + "</p>" : "") +
        (h.kind === "none" ? '<p class="says">' + esc(h.why) + "</p>" : "")) +
      conn + "</div>";
  }

  /* ---------------- a person, and a job ---------------- */

  function renderPerson() {
    var p = byId(state.people, openPerson);
    if (!p) { openPerson = ""; return renderProjects(); }
    var mine = actionAll().filter(function (a) {

    });
    var links = state.personLinks.filter(function (l) { return l.personId === p.id; });

    (p.contactMethods || []).forEach(function (c) {

    });
    if (p.notes) facts += factRow("Note", esc(p.notes));
    var body = mine.length
      ? '<div class="rows">' + mine.map(function (a) {
            return actionRow(a, { withPerson: p.id });
          }).join("") + "</div>"
      : emptyLines("Nothing is outstanding with " + p.name + ".", "What you are waiting on them for shows up here.");
    var where = links.length
      ? '<div class="rows">' + links.map(function (l) {
          var pr = byId(state.projects, l.projectId);
          return pr ? projectRow(pr) : "";
        }).join("") + "</div>"
      : emptyLines("Not connected to a project.", "A relationship names the project and what it is for.");

        '<div class="acts"><button class="btn" data-act="person-back">Back</button>' +
        '<button class="btn" data-act="person-edit" data-id="' + p.id + '">Edit</button></div>') +
      '<div class="grid2">' +
      panel("What is outstanding", body) +
      (panel("Who they are", '<dl class="afacts">' + facts + "</dl>") +
       panel("On which work", where)) + "</div>";
  }

  function renderJob() {
    var j = byId(state.jobs, openJob);
    if (!j) { openJob = ""; return renderProjects(); }
    var ps = projectsSorted().filter(function (p) { return p.jobId === j.id; });
    var hours = getClaimantHours(j.claimantId);
    var body = ps.length
      ? '<div class="rows">' + ps.map(projectRow).join("") + "</div>"
      : emptyLines("Nothing is filed under it.", "A project names its job when it has one.");
    return pageHead2(j.name, j.description ? esc(j.description) : "",
        '<div class="acts"><button class="btn" data-act="job-back">All jobs</button>' +
        '<button class="btn" data-act="job-edit" data-id="' + j.id + '">Edit</button></div>') +
      panel("Its projects", body) +
      (hours.entries.length
        ? panel("Hours against it",
            '<p class="says">' + esc(hourWords(hours.minutes)) + " over " + numWord(hours.entries.length) + " " +
            plural(hours.entries.length, "entry", "entries") +
            (hours.open ? " · " + numWord(hours.open) + " still open, so counting nowhere" : "") + "</p>")
        : "");

  /* ============================================================
     THE LIBRARY — "What have I learned or built once that I want to be
     able to use again?"

     It is a SECTION of the one registry and not a second store: the
     entries are `state.assets` rows whose section is `lib`, so a script
     is a thing a workflow step can be done with, and the finder, the
     provenance and a project's Things page all reach it without a
     second list to keep in step.

     The brief's own order — search, then type filters, then subject
     filters, then everything — and each of the three is one of its named
     selectors rather than a filter written here.
     ============================================================ */

  var libQuery = "", libType = "", libSubject = "";

  function libFacet(a) {
    /* EXACTLY ONE CHIP PER ENTRY, so the chips partition the list and
       All is their sum. Reading it off `hasBody` was wrong twice over
       the moment a Reference could be saved: a reference has no body, so
       it vanished out of the section it had just been saved into, and
       the language chips summed to four above five rows. */
    if (LIB_TYPES[a.type]) return a.type;
    if (a.body) return a.lang ? "script" : "method";
    return "reference";
  }

  function libSection() {
    var all = libEntries();
    if (!all.length) {
      return emptyLines("Your library is empty.", "Save something you will want to use again.");
    }
    var byType = getLibraryEntriesByType();
    var hits = searchLibrary(libQuery);
    if (libType) hits = hits.filter(function (a) { return libFacet(a) === libType; });
    if (libSubject) hits = hits.filter(function (a) {
      return (a.subjects || []).indexOf(libSubject) >= 0;
    });

    var search = '<div class="frow"><label class="sr" for="libQ">Search the library</label>' +
      '<input id="libQ" type="text" value="' + esc(libQuery) +
      '" placeholder="Search methods, scripts, formulas, references…" autocomplete="off" /></div>';

    var typeChips = '<div class="chips">' +
      '<button class="chip' + (libType ? "" : " on") + '" data-act="lib-type" data-id="">All ' +
      '<span class="cn">' + all.length + "</span></button>" +
      Object.keys(LIB_TYPES).map(function (k) {
        var n = byType[k].length;
        if (!n) return "";
        return '<button class="chip' + (libType === k ? " on" : "") + '" data-act="lib-type" data-id="' + k +
          '">' + esc(LIB_TYPES[k].word) + ' <span class="cn">' + n + "</span></button>";
      }).join("") + "</div>";

    /* A SUBJECT IS A ROW, NOT A CHIP OVER AN EMPTY SCREEN — but the
       filters are chips, because picking one narrows what is already on
       the page rather than being the only way to see anything. A subject
       holding none of the chosen type DROPS OUT rather than reading
       nought, which is the honest meaning of picking "Scripts". */
    var subs = getLibraryEntriesBySubject();
    var subKeys = Object.keys(subs).filter(function (s) {
      return subs[s].some(function (a) { return !libType || libFacet(a) === libType; });
    }).sort();
    var subChips = subKeys.length > 1
      ? '<div class="chips">' +
        '<button class="chip' + (libSubject ? "" : " on") + '" data-act="lib-subject" data-id="">Every subject</button>' +
        subKeys.map(function (s) {
          var n = subs[s].filter(function (a) { return !libType || libFacet(a) === libType; }).length;
          return '<button class="chip' + (libSubject === s ? " on" : "") + '" data-act="lib-subject" data-id="' +
            esc(s) + '">' + esc(s) + ' <span class="cn">' + n + "</span></button>";
        }).join("") + "</div>"
      : "";

    /* A SHORTCUT INTO A LIST YOU CAN ALREADY SEE WHOLE IS NOT A SHORTCUT.
       Three of four entries printed twice on one screen is the say-it-once
       fault dressed as a convenience, so "Recently used" appears only once
       the library is long enough for it to save a scroll. */
    var recent = all.length > 6
      ? all.slice().filter(function (a) { return dayOk(a.lastUsedOn); })
          .sort(function (a, b) { return b.lastUsedOn.localeCompare(a.lastUsedOn); }).slice(0, 3)
      : [];
    var recentBody = recent.length
      ? panel("Recently used", '<div class="rows">' + recent.map(libRow).join("") + "</div>")
      : "";

    var listBody = hits.length
      ? '<div class="rows">' + hits.map(libRow).join("") + "</div>"
      : emptyLines("Nothing matches.", libQuery
          ? "Nothing in the library carries “" + libQuery + "”."
          : "Clear the filters above to see all " + all.length + " of them.");

    return search + typeChips + subChips + recentBody +
      panel(libType ? LIB_TYPES[libType].word + "s" : "Everything you have saved", listBody);
  }

  /* One row, three shapes. Code shows its first line in mono and offers
     Copy; prose shows its first line as prose and offers Copy; a
     reference shows what it POINTS at and offers whatever `openHandle()`
     really can do — so a reference can never grow a button that does
     nothing. The pill is the facet, so the row and the chip above it
     cannot disagree about which group it is in. */
  function libRow(a) {
    var facet = libFacet(a), meta = LIB_TYPES[facet];
    var first = (a.body || "").split("\n").filter(function (l) { return l.trim(); })[0] || "";
    var h = openHandle(a);
    var says;
    if (meta.body === "code") says = '<code>' + esc(clip(first, 52)) + "</code>";
    else if (meta.body === "prose") says = esc(clip(first, 62));
    else says = h.brief ? esc(h.brief) : '<span class="dim">Nothing recorded to point at.</span>';
    var right = "";
    if (a.body) right += '<button class="btn small" data-act="asset-copy-body" data-id="' + a.id + '">Copy</button>';
    else if (h.can) right += '<a class="btn small" href="' + esc(h.href) +
      '" target="_blank" rel="noopener noreferrer">Open</a>';
    return '<div class="arow">' +
      '<span class="atick flat" aria-hidden="true">' + (meta.body === "code" ? ICONS.doc : ICONS.book) + "</span>" +
      '<button class="amain" data-act="asset-open" data-id="' + a.id + '">' +
      '<span class="anm">' + esc(a.name) + "</span>" +
      '<span class="asub">' + says + (a.subjects && a.subjects.length ? " · " + esc(a.subjects.join(", ")) : "") +
      "</span></button>" +
      '<span class="aright">' + pill(meta.word, "idle") + right + "</span></div>";
  }

  /* ============================================================
     SCHEDULE — "What dated work, deadlines and commitments are coming
     up?"

     A VIEW OF DATED RECORDS AND NOT A STORE. Nothing is typed into the
     calendar: every mark comes from a project's end date, an action's
     due date or a schedule record, through `getUpcomingSchedule()` —
     one walk, because two walks would eventually answer the same
     question differently, which is how the original's calendar came to
     print one meeting three times.
     ============================================================ */

  var monthOf = "", dayOf = "";

  function monthKey(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1); }
  function currentMonth() { return monthOf || monthKey(new Date()); }
  function shiftMonth(ym, by) {
    var y = parseInt(ym.slice(0, 4), 10), m = parseInt(ym.slice(5, 7), 10) - 1 + by;
    return (y + Math.floor(m / 12)) + "-" + pad2(((m % 12) + 12) % 12 + 1);
  }
  /* Every mark in the month asked for, and ONLY in that month. A
     function called `calMarks(ym)` that returns marks outside `ym` is a
     trap laid for its second caller — the original's grid never noticed
     because it read only the days it was drawing. */
  function calMarks(ym) {
    var out = {};
    getUpcomingSchedule(400).concat(pastMarks()).forEach(function (m) {
      if (m.at.slice(0, 7) !== ym) return;
      var day = parseInt(m.at.slice(8, 10), 10);
      (out[day] = out[day] || []).push(m);
    });
    return out;
  }
  /* A DATE YOU HAVE MISSED IS THE ONE MOST WORTH SEEING, so the grid
     reads the past as well as the future — `getUpcomingSchedule()` is
     forward-looking by name and by contract, and stretching it backwards
     would make its own name untrue. */
  function pastMarks() {
    var out = [];
    state.schedule.forEach(function (s) {
      if (dayOk(s.at) && s.at < today()) out.push({ at: s.at, title: s.title, kind: s.kind || "date", projectId: s.projectId, id: "sc:" + s.id });
    });
    actionOpen().forEach(function (a) {
      if (a.dueDate && dayOk(a.dueDate) && a.dueDate < today()) out.push({ at: a.dueDate, title: a.title, kind: "action", projectId: a.projectId, id: "ac:" + a.id });
    });
    state.projects.forEach(function (p) {
      if (dayOk(p.endDate) && p.endDate < today()) out.push({ at: p.endDate, title: p.name + " — deadline", kind: "deadline", projectId: p.id, id: "pj:" + p.id });
    });
    return out;
  }
  function markTone(m) {
    if (m.at < today()) return "late";
    if (m.at === today()) return "live";
    return "idle";
  }
  function markWord(m) {
    if (m.at < today()) return "Late";
    if (m.at === today()) return "Today";
    return "Upcoming";
  }

  function renderSchedule() {
    var ym = currentMonth();
    var marks = calMarks(ym);
    var upcoming = getUpcomingSchedule(90);
    var head = pageHead2("Schedule", "A view of dated records. Nothing is typed in here — every date belongs to something else.",
      '<button class="btn" data-act="sched-add">Note a date</button>');

    if (!Object.keys(marks).length && !upcoming.length) {
      return head + panel("Schedule",
        emptyLines("Nothing is scheduled.", "Dates appear here when work has an actual date."));
    }
    var first = new Date(parseInt(ym.slice(0, 4), 10), parseInt(ym.slice(5, 7), 10) - 1, 1);
    var days = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
    var lead = (first.getDay() + 6) % 7;   // weeks start on Monday
    var cells = "";
    for (var i = 0; i < lead; i++) cells += '<span class="cday out"></span>';
    for (var d = 1; d <= days; d++) {
      var iso2 = ym + "-" + pad2(d);
      var on = marks[d] || [];
      var tone = on.length ? on.map(markTone).sort(function (a, b) {
        var r = { late: 0, live: 1, idle: 2 };
        return r[a] - r[b];
      })[0] : "";
      cells += '<button class="cday' + (tone ? " c-" + tone : "") + (iso2 === today() ? " cnow" : "") +
        (dayOf === iso2 ? " csel" : "") + '" data-act="sched-day" data-id="' + iso2 + '"' +
        (on.length ? ' title="' + esc(on.map(function (m) { return m.title; }).join(" · ")) + '"' : "") +
        '><b>' + d + "</b>" +
        (on.length ? '<span class="cn">' + (on.length > 1 ? on.length : "·") + "</span>" : "") + "</button>";
    }
    var grid = '<div class="cnav">' +
      '<button class="btn small" data-act="sched-month" data-id="' + shiftMonth(ym, -1) + '">‹</button>' +
      "<b>" + esc(first.toLocaleDateString(undefined, { month: "long", year: "numeric" })) + "</b>" +
      '<button class="btn small" data-act="sched-month" data-id="' + shiftMonth(ym, 1) + '">›</button>' +
      (ym === monthKey(new Date()) ? "" : '<button class="btn small" data-act="sched-month" data-id="' +
        monthKey(new Date()) + '">This month</button>') + "</div>" +
      '<div class="cweek">' + ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].map(function (w) {
        return "<span>" + w + "</span>";
      }).join("") + "</div>" +
      '<div class="cgrid">' + cells + "</div>";

    /* THE UPCOMING LIST IS THE QUESTION YOU ACTUALLY HAVE ON THE 28TH,
       and the grid cannot answer it because the answer is in October. */
    var rows = dayOf ? (marks[parseInt(dayOf.slice(8, 10), 10)] || []) : upcoming;
    var body = rows.length
      ? '<div class="rows">' + rows.map(function (m) {
          var t = markTone(m), src = m.id.split(":")[0];
          var act = src === "pj" ? "proj-open" : src === "ac" ? "action-open" : "sched-open";
          return '<div class="arow e-' + t + '">' +
            '<span class="atick flat" aria-hidden="true">' + ICONS.cal + "</span>" +
            '<button class="amain" data-act="' + act + '" data-id="' + esc(m.id.split(":").slice(1).join(":")) + '">' +
            '<span class="anm">' + esc(m.title) + "</span>" +
            '<span class="asub">' + esc(cap(m.kind)) +
            (m.projectId ? " · " + esc(nameOf("projects", m.projectId)) : "") + "</span></button>" +
            '<span class="aright"><span class="adate">' + esc(dayName(m.at, "short") + " " + plainDate(m.at)) +
            "</span>" + pill(markWord(m), t) + "</span></div>";
        }).join("") + "</div>"
      : emptyLines(dayOf ? "Nothing on " + plainDate(dayOf) + "." : "Nothing is scheduled.",
          dayOf ? "Pick another day, or clear the day to see what is coming." :
            "Dates appear here when work has an actual date.");
    /* The month's name is inside the navigation, so the panel above it
       says what the panel IS rather than the same three words again. */
    return head + panel("The month", grid) +
      panel(dayOf ? "On " + plainDate(dayOf) : "Upcoming", body,
        dayOf ? '<button class="btn quiet" data-act="sched-day" data-id="">Everything coming →</button>' : "");
  }

  /* ============================================================
     Routing, the rail, and the one place a figure may move.
     ============================================================ */

  function go() { save(); render(); }

  function renderView(v) {
    if (v === "home") return renderHome();
    if (v === "projects") {
      if (openPerson) return renderPerson();
      if (openJob) return renderJob();
      return renderProjects();
    }
    if (v === "workflows") return renderWorkflows();
    if (v === "actions") return renderActions();
    if (v === "assets") return renderAssets();
    if (v === "schedule") return renderSchedule();
    if (v === "settings") return renderSettings();
    return renderHome();
  }

  /* Which project, workflow, run, asset, person or job is open — and
     which strip page is showing — are all VIEW STATE. None of them is in
     `state`, so none reaches a saved copy or survives a reload, and
     every tab always lands on its own list. Keeping it in the record
     meant the tab showed a different screen depending on what you did
     ten minutes ago. */
  function clearOpen() {
    openProj = ""; openWf = ""; openRun = ""; openAsset = ""; openPerson = ""; openJob = "";
    projPage = "overview"; dayOf = "";
  }

  function railPaint() {
    var name = (state.settings.owner || "").trim();
    document.getElementById("brandName").textContent = name ? name.split(/\s+/)[0] + "’s Workspace" : "Mashghal";
    /* The footer says where the book is, not that you are online. There
       is no account here to be online with, so the slot carries the one
       fact that belongs in it. */
    document.getElementById("railFoot").innerHTML =
      '<button class="rwrow" data-tab="settings"><span class="rwico">' + ICONS.settings +
      '</span><span class="rwname">Settings<small>This computer only</small></span></button>';
  }

  /* ============================================================
     THE ACTIONS. The only place in the app where a figure moves, and
     every removal confirms, says what it touches, and offers an undo.
     Nothing here computes anything: each one writes a record and hands
     back to the selectors.
     ============================================================ */

  function projectOptions(blankLabel) {
    return [{ value: "", label: blankLabel || "— no project —" }].concat(
      state.projects.map(function (p) { return { value: p.id, label: p.name }; }));
  }
  function personOptions() {
    return [{ value: "", label: "— nobody —" }].concat(
      state.people.map(function (p) { return { value: p.id, label: p.name }; }));
  }
  function assetOptions(blankLabel, skipId) {
    var groups = ASSET_SECTIONS.map(function (s) {
      var opts = assetsIn(s.id).filter(function (a) { return a.id !== skipId; })
        .map(function (a) { return { value: a.id, label: a.name }; });
      return opts.length ? { group: s.label, options: opts } : null;
    }).filter(Boolean);
    return [{ value: "", label: blankLabel || "— nothing —" }].concat(groups);
  }
  function nodeOptions(wfId, skipId) {
    return liveNodes(wfId).filter(function (n) { return n.id !== skipId; })
      .map(function (n) { return { value: n.id, label: n.label + " (" + (NODE_TYPES[n.type] || {}).word + ")" }; });
  }
  /* A structural edit BUMPS THE VERSION, which is what lets a run say
     how far it has parted from the procedure it started on. */
  function bumpWorkflow(wfId) {
    var w = byId(state.workflows, wfId);
    if (w) { w.version = (num(w.version) || 1) + 1; stamp(w); }

  var ACTIONS = {
    /* --- navigation --- */
    "tab-actions": function () { view = "actions"; clearOpen(); render(); },
    "tab-projects": function () { view = "projects"; clearOpen(); render(); },
    "tab-assets": function () { view = "assets"; clearOpen(); render(); },
    "tab-settings": function () { view = "settings"; clearOpen(); render(); },

    "proj-tab": function (id) { projTab = id; render(); },

    /* --- jobs --- */
    "job-open": function (id) { view = "projects"; clearOpen(); openJob = id; render(); },

    "job-add": function () {

        fields: [
          { key: "name", label: "What is it called", span: true, placeholder: "U. of Balamand" },

    "job-edit": function (id) {
      var j = byId(state.jobs, id); if (!j) return;

    /* --- actions --- */
    "action-open": function (id) {
      var a = actionAll().filter(function (x) { return x.id === id; })[0];
      if (!a) return;
      if (a.derived) {
        /* A derived action is a view of a run's step or a relationship.
           It is opened where it lives, because the record is the thing
           that can be changed — not the reading of it. */
        if (a.workflowRunId) { view = "workflows"; clearOpen(); openRun = a.workflowRunId; render(); return; }
        if (a.personId) { view = "projects"; clearOpen(); openPerson = a.personId; render(); return; }
        return;
      }
      ACTIONS["task-edit"](id);
    },
    "action-done": function (id) {
      var stored = byId(state.actions, id);
      if (stored) {
        if (stored.type === "upkeep") {
          var before = (stored.recurringRule || {}).lastDoneOn || "";
          stored.recurringRule = stored.recurringRule || {};
          stored.recurringRule.lastDoneOn = today();
          stamp(stored); go();
          toast("Ticked " + stored.title, function () {
            stored.recurringRule.lastDoneOn = before; stamp(stored);
          });
          return;
        }
        stored.completedAt = nowISO(); stamp(stored); go();
        toast("Done: " + stored.title, function () { stored.completedAt = ""; stamp(stored); });
        return;
      }
      /* A derived action is completed by completing the thing it is
         derived FROM. Anything else would be two sources of truth for
         one fact, which is the drift this whole rebuild exists to stop. */
      var a = actionAll().filter(function (x) { return x.id === id; })[0];
      if (a && a.workflowRunId && a.nodeId) {
        ACTIONS["step-done"](a.workflowRunId + ":" + a.nodeId);
      }
    },
    "task-add": function (id) {
      openModal({
        title: "New task",
        message: "A task is the one thing somebody types, and it names the work it belongs to. Everything else on Actions is derived from the record.",

          { key: "title", label: "What needs doing", span: true, placeholder: "Send the draft to the supervisor" },

          { key: "personId", label: "Waiting on somebody?", type: "select", options: personOptions(), more: true },
          { key: "notes", label: "Notes", type: "textarea", span: true, more: true }
        ],
        validate: function (v) {
          if (!v.title.trim()) return "It needs a title.";
          if (v.dueDate && !dayOk(v.dueDate)) return "“" + v.dueDate + "” is not a date that exists. Write it as YYYY-MM-DD.";
          return "";
        },
        confirmLabel: "Add it",
        onConfirm: function (v) {
          var a = stamp({ id: uid(), title: v.title.trim(), type: v.personId ? "waiting" : "task",
            projectId: v.projectId, personId: v.personId, assetId: "", dueDate: v.dueDate,
            completedAt: "", status: "open", recurringRule: null, notes: v.notes.trim(),
            since: nowISO(), createdAt: nowISO() });
          state.actions.push(a); go();
          toast("Added " + clip(a.title, 30), function () {
            state.actions = state.actions.filter(function (x) { return x.id !== a.id; });
          });
        }
      });
    },
    "task-edit": function (id) {
      var a = byId(state.actions, id); if (!a) return;
      openModal({
        title: "Edit " + clip(a.title, 26),
        fields: [
          { key: "title", label: "What needs doing", span: true, value: a.title },
          { key: "projectId", label: "Which work", type: "select", value: a.projectId, options: projectOptions() },
          { key: "dueDate", label: "By when", value: a.dueDate, placeholder: "YYYY-MM-DD" },
          { key: "personId", label: "Waiting on somebody?", type: "select", value: a.personId, options: personOptions() },
          { key: "notes", label: "Notes", type: "textarea", span: true, value: a.notes, more: true }
        ],
        validate: function (v) {
          if (!v.title.trim()) return "It needs a title.";
          if (v.dueDate && !dayOk(v.dueDate)) return "“" + v.dueDate + "” is not a date that exists.";
          return "";
        },
        extraBody: '<p class="modal-note">Removing it takes only this line off Actions. Nothing else moves.</p>',
        onConfirm: function (v) {
          a.title = v.title.trim(); a.projectId = v.projectId; a.dueDate = v.dueDate;
          a.personId = v.personId; a.notes = v.notes.trim();
          if (a.type !== "upkeep") a.type = v.personId ? "waiting" : "task";
          stamp(a); go(); toast("Saved");
