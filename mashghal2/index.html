  /* pickDialog — putting something INTO a selection. The pool is grouped by
     kind, because a CV's reader thinks in sections; and something already in
     it is refused by name rather than making a second copy. */
  function pickDialog(ownerRef, relName, title, kinds) {
    var owner = recOf(ownerRef);
    var have = both(ownerRef, relName);
    var groups = [];
    kinds.forEach(function (k) {
      var opts = live(listOf(k)).filter(function (r) {
        return have.indexOf(ref(k, r.id)) < 0;
      }).sort(byName).map(function (r) {
        return { value: ref(k, r.id), label: recName(r, k) };
      });
      if (opts.length) groups.push({ group: KINDS[k].many, options: opts });
    });
    if (!groups.length) {
      toast("Everything there is to pick is already in it");
      return;
    }
    openModal({
      title: title + recName(owner),
      message: "It points at the record rather than copying it, so a correction " +
        "anywhere reaches here.",
      fields: [
        /* A grouped list needs its first entry FOUND, not assumed: a group
           carries no value of its own and reading `.value` off one gives
           undefined. */
        { key: "what", label: "What to put in", type: "select",
          value: groups[0].options[0].value, options: groups, span: true },
        { key: "note", label: "Why, in a few words", value: "", more: true, span: true }
      ],
      confirmLabel: "Put it in",
      onConfirm: function (v) {
        if (!v.what) { toast("Nothing picked"); return; }
        var l = link(ownerRef, relName, v.what, (v.note || "").trim());
        saveGo("Put " + nameOf(v.what) + " in", function () {
          unlink(l.id); saveGo("Taken out");
        });
      }
    });
  }

  /* linkDialog — the one relationship dialog. The RELS table decides what
     may join what, so a picker can never offer a line the model does not
     have: a sherd is FOUND AT a site and an orthophoto is MADE FROM three
     hundred frames, and one list for both would conflate them. */
  var LINKABLE = {
    uses:    ["skill", "lib", "asset", "workflow", "person", "project", "output"],
    learned: ["training", "education", "skill", "lib", "person"],
    about:   ["lib", "project", "output", "skill"],
    shows:   ["project", "output", "role", "lib"],
    cites:   ["lib"],
    withp:   ["person", "project"]
  };
  function linkDialog(fromRef) {
    var from = recOf(fromRef);
    if (!from) { toast("That record is gone"); return; }
    var fromKind = parseRef(fromRef).kind;
    var rels = Object.keys(RELS).filter(function (rel) {
      return rel !== "picks" && (LINKABLE[rel] || []).length;
    });
    var groups = [];
    ["skill", "project", "workflow", "output", "lib", "person", "asset",
     "training", "education", "role", "job", "portfolio"].forEach(function (k) {
      var opts = live(listOf(k)).filter(function (r) {
        return ref(k, r.id) !== fromRef;
      }).sort(byName).map(function (r) {
        return { value: ref(k, r.id), label: recName(r, k) };
      });
      if (opts.length) groups.push({ group: KINDS[k].many, options: opts });
    });
    if (!groups.length) { toast("There is nothing else in the book to link it to"); return; }
    openModal({
      title: "Link " + recName(from, fromKind) + " to…",
      message: "The line is stated one way round and the reverse is worked out, so the " +
        "two can never disagree.",
      wide: true,
      fields: [
        { key: "rel", label: "The line", type: "select", value: "uses",
          options: rels.map(function (rel) {
            return { value: rel, label: cap(RELS[rel].fwd) + " — " + RELS[rel].says };
          }), span: true },
        { key: "to", label: "What", type: "select", value: groups[0].options[0].value,
          options: groups, span: true },
        { key: "note", label: "Note on the line", value: "", more: true, span: true }
      ],
      confirmLabel: "Draw it",
      onConfirm: function (v) {
        if (linkBetween(fromRef, v.rel, v.to)) {
          toast("That line is already there");
          return;
        }
        var l = link(fromRef, v.rel, v.to, (v.note || "").trim());
        saveGo(cap(RELS[v.rel].fwd) + " " + nameOf(v.to), function () {
          unlink(l.id); saveGo("Line cut");
        });
      }
    });
  }

  /* ============================================================
     THE LIBRARY'S OWN DIALOGS.

     SIX KINDS, FOUR FORMS, AND THE SCREEN SAYS SO. The owner asked for
     Python code, Excel formulas, where documents are, links, shortcuts, a
     directory of files and references — and those are not seven
     records. They are four shapes:

       a SCRIPT and a FORMULA are one record with a language;
       a METHOD and a TEMPLATE are one record with none, read as prose;
       a REFERENCE is a citation record with no body;
       a PLACE is a path or a link with a note and no body at all.

     Four doors onto four rooms, with the kind decided FIRST rather than
     reactively — `showWhen` matches another field's value and that is
     settled before the dialog opens, so a picker cannot be hidden on the
     fly. Which is exactly why the kind is the door and not a field.
     ============================================================ */

  function libDialog(kind, e) {
    kind = kind || (e && e.kind) || "script";
    var look = LIB_KINDS[kind] || LIB_KINDS.script;
    if (kind === "reference") return citeDialog(e);
    var code = kind === "script" || kind === "formula";
    var place = kind === "place";
    var fields = [
      { key: "name", label: "What to call it", value: e ? e.name : "", span: true,
        hint: kind === "formula" ? "What it works out \u2014 \u201cArea of a polygon from " +
          "coordinates\u201d reads better in six months than \u201cformula 3\u201d." : "" }
    ];
    if (code) {
      fields.push({ key: "lang", label: "Written in", type: "select",
        value: e ? e.lang : (kind === "formula" ? "Excel" : "Python"),
        options: LIB_LANGS,
        hint: "THE LANGUAGE IS WHAT SAYS A BODY IS CODE \u2014 it is why a formula and a " +
          "script are one record and a method is not." });
      fields.push({ key: "body", label: kind === "formula" ? "The formula" : "The code",
        value: e ? e.body : "", type: "textarea", rows: 10, span: true,
        placeholder: kind === "formula" ? "=INDEX($C$2:$C$99, MATCH(A2, $B$2:$B$99, 0))"
          : "import arcpy",
        hint: "Leading whitespace is kept exactly \u2014 it is what a Python block MEANS. " +
          "Only trailing blank lines go." });
    } else if (!place) {
      fields.push({ key: "body", label: "Write it out", value: e ? e.body : "",
        type: "textarea", rows: 10, span: true,
        hint: kind === "template" ? "The skeleton itself \u2014 headings, field names, a " +
          "naming rule. It is set as prose and wraps, unlike code."
          : "Prose. This is the one kind written to be READ, so it wraps rather than " +
            "scrolling sideways." });
    }
    if (place || !code) {
      fields.push({ key: "path", label: "Where it lives on a machine",
        value: e ? e.path : "", span: place, more: !place,
        placeholder: "D:\\Work\\Anfeh\\GIS",
        hint: place ? "A page served over https may not open a local path \u2014 every " +
          "browser blocks it, and Chrome blocks it silently. So it is copy-only here and " +
          "the screen says why rather than drawing a control that does nothing." : "" });
      fields.push({ key: "url", label: "A link", value: e ? e.url : "",
        span: place, more: !place });
    }
    fields.push({ key: "topics", label: "What it is about", value: e ? (e.topics || []).join(", ") : "",
      span: true, more: !place,
      hint: "Commas. You never create a topic \u2014 you write one onto an entry, which " +
        "keeps the vocabulary a description of the work rather than a taxonomy to keep." +
        (allTopics().length ? " So far: " + listWords(allTopics().slice(0, 8)) + "." : "") });
    fields.push({ key: "from", label: "Where it came from", value: e ? e.from : "",
      more: true, span: true,
      hint: "A colleague, a manual, a paper, \u201cworked it out\u201d. It is the fact " +
        "nobody can reconstruct later." });
    fields.push({ key: "note", label: "Note", value: e ? e.note : "", type: "textarea",
      rows: 3, span: true, more: true });

    openModal({
      title: e ? "Edit " + e.name : "New " + look.word.toLowerCase(),
      message: e ? "" : esc(cap(look.says)) + ".",
      wide: true,
      fields: fields,
      validate: function (v) {
        if (!v.name.trim()) return "It needs a name.";
        if (place && !(v.path || "").trim() && !(v.url || "").trim()) {
          return "A place needs a path or a link \u2014 otherwise there is nothing to open.";
        }
        if (code && !(v.body || "").trim()) {
          return "There is no " + (kind === "formula" ? "formula" : "code") + " in it yet.";
        }
        return "";
      },
      onConfirm: function (v) {
        var rec = e || put("lib", { id: uid(), kind: kind });
        rec.kind = kind;
        rec.name = v.name.trim();
        if (v.lang != null) rec.lang = (v.lang || "").trim();
        /* NEVER TRIM THE FRONT of a body. Only the trailing blank lines a
           textarea collects go. */
        if (v.body != null) rec.body = String(v.body).replace(/\s+$/, "");
        ["path", "url", "from", "note"].forEach(function (k) {
          if (v[k] != null) rec[k] = (v[k] || "").trim();
        });
        rec.topics = topicList(v.topics);
        stamp(rec);
        saveGo(e ? "Saved" : "Added " + rec.name);
      }
    });
  }

  /* ---------------- references and the bibliography ----------------

     THE FEATURE ASKED FOR BY NAME: "for the references, something to make
     it accessible when I want to export a certain bibliography, at least
     in text format". So a reference is a real citation record — not a
     note with a name — because a bibliography cannot be assembled out
     of prose, and four exact machine formats are trustworthy in a way a
     hand-formatted style never is. */

  function citeDialog(e) {
    var c = citeOf(e), t = c.type || "article";
    openModal({
      title: e ? "Edit " + (e.name || "the reference") : "New reference",
      message: e ? "" : "A REFERENCE IS A CITATION RECORD, field by field \u2014 which is " +
        "the only shape a bibliography can be assembled out of. Author, year and title " +
        "are what every format needs; the rest depends on the type.",
      wide: true,
      fields: [
        { key: "type", label: "What sort of thing it is", type: "select", value: t,
          options: CITE_TYPES.map(function (x) {
            return { value: x.value, label: x.label };
          }), span: true,
          hint: "It decides which fields matter and which entry type an export writes. " +
            (CITE_TYPES.filter(function (x) { return x.value === t; })[0] || {}).wants },
        { key: "authors", label: "Authors", value: c.authors || "", span: true,
          placeholder: "Haddad, N.; Mroueh, L.",
          hint: "SEMICOLONS BETWEEN PEOPLE, and either \u201cHaddad, N.\u201d or " +
            "\u201cN. Haddad\u201d \u2014 both are read. A corporate author with no comma " +
            "in it is kept whole." },
        { key: "year", label: "Year", value: c.year || "", placeholder: "2024" },
        { key: "title", label: "Title", value: c.title || "", span: true },
        { key: "container", label: "Journal, book or series it is in",
          value: c.container || "", span: true },
        { key: "publisher", label: "Publisher", value: c.publisher || "" },
        { key: "place", label: "Place of publication", value: c.place || "", more: true },
        { key: "volume", label: "Volume", value: c.volume || "", more: true },
        { key: "issue", label: "Issue", value: c.issue || "", more: true },
        { key: "pages", label: "Pages", value: c.pages || "", more: true },
        { key: "edition", label: "Edition", value: c.edition || "", more: true },
        { key: "editors", label: "Editors", value: c.editors || "", more: true, span: true },
        { key: "institution", label: "Institution or degree-granting body",
          value: c.institution || "", more: true, span: true },
        { key: "doi", label: "DOI", value: c.doi || "", more: true },
        { key: "isbn", label: "ISBN or standard number", value: c.isbn || "", more: true },
        { key: "url", label: "Link", value: c.url || "", more: true, span: true },
        { key: "accessed", label: "Accessed on", value: c.accessed || "", more: true },
        { key: "topics", label: "What it is about",
          value: e ? (e.topics || []).join(", ") : "", span: true, more: true },
        { key: "note", label: "Your own note on it", value: e ? e.note : "",
          type: "textarea", rows: 3, span: true, more: true }
      ],
      validate: function (v) {
        if (!(v.title || "").trim()) return "A reference needs a title \u2014 it is the " +
          "one field nothing can be formatted without.";
        if ((v.year || "").trim() && !/^\d{3,4}[a-z]?$/.test(v.year.trim())) {
          return "\u201c" + v.year + "\u201d is not a year. Four digits, optionally with " +
            "a letter for a second work in the same year.";
        }
        return "";
      },
      onConfirm: function (v) {
        var rec = e || put("lib", { id: uid(), kind: "reference" });
        rec.kind = "reference";
        rec.cite = rec.cite || blankCite();
        CITE_FIELDS.forEach(function (k) {
          if (v[k] != null) rec.cite[k] = (v[k] || "").trim();
        });
        rec.cite.type = v.type;
        /* THE NAME IS THE TITLE, because a reference has no name of its own
           and two records of one fact would drift the first time either was
           corrected. */
        rec.name = rec.cite.title;
        rec.topics = topicList(v.topics);
        rec.note = (v.note || "").trim();
        stamp(rec);
        var gaps = citeComplete(rec);
        saveGo((e ? "Saved" : "Added the reference") +
          (gaps.length ? " \u00b7 still missing " + listWords(gaps) : ""));
      }
    });
  }

  /* pasteDialog — BibTeX and RIS in, because typing eighteen fields per
     paper is how a bibliography feature goes unused. It REFUSES a record
     with no title, NAMES the tags it could not place, and says what is
     missing rather than inventing a year. */
  function pasteDialog() {
    openModal({
      title: "Paste a reference",
      message: "BibTeX or RIS \u2014 the two formats every library catalogue, Zotero and " +
        "Google Scholar will hand you. Several at once is fine. Nothing is fetched and " +
        "nothing is looked up: it is read here, character by character, and what it " +
        "cannot place it names rather than dropping.",
      wide: true,
      fields: [
        { key: "text", label: "Paste it in", value: "", type: "textarea", rows: 12,
          span: true,
          placeholder: "@article{haddad2024,\n  author = {Haddad, N.},\n  title = {...},\n" +
            "  journal = {...},\n  year = {2024}\n}" }
      ],
      confirmLabel: "Read it",
      validate: function (v) {
        return (v.text || "").trim() ? "" : "Nothing pasted.";
      },
      onConfirm: function (v) {
        var got = citeParse(v.text);
        if (!got.records.length) {
          openModal({
            title: "Nothing could be read out of that",
            message: esc(got.why || "It does not look like BibTeX (@article{\u2026}) or " +
              "RIS (TY  - JOUR). Nothing was added."),
            confirmLabel: "Try again", cancelLabel: "Leave it",
            onConfirm: pasteDialog
          });
          return;
        }
        /* The keywords it read become topics, because that is the one
           field a catalogue gives you that this app already has a home for. */
        var added = got.records.map(function (r) {
          return put("lib", { id: uid(), kind: "reference", name: r.cite.title,
            cite: r.cite, topics: r.topics || [], note: "", body: "" });
        });
        var gaps = added.filter(function (r) { return citeComplete(r).length; });
        var msg = [cap(countWords(added.length, "reference", "references")) + " read in."];
        /* ONE BAD RECORD IN TEN DOES NOT LOSE THE OTHER NINE, and it is named
           rather than quietly dropped. */
        if (got.bad.length) {
          msg.push(cap(countWords(got.bad.length, "record", "records")) +
            " in that paste could not be read and " +
            (got.bad.length === 1 ? "was" : "were") + " left out: " + got.bad[0]);
        }
        if (got.unplaced.length) {
          msg.push("Fields it did not recognise, left out rather than guessed at: " +
            listWords(got.unplaced.slice(0, 8)) + ".");
        }
        if (gaps.length) {
          msg.push(cap(countWords(gaps.length, "one of them", "of them")) +
            " still missing something an export needs \u2014 the references page names " +
            "which, so nothing goes out half-formed without saying so.");
        }
        save();
        openModal({
          title: "Read in",
          message: msg.map(esc).join(" "),
          extraBody: '<div class="blk"><pre class="wrote">' +
            esc(added.map(plainCite).join("\n\n")) + "</pre></div>",
          confirmLabel: "Good", cancelLabel: "Undo it all",
          onConfirm: function () { render(); },
          onCancel: function () {
            added.forEach(function (r) {
              var i = state.lib.indexOf(r);
              if (i >= 0) state.lib.splice(i, 1);
            });
            saveGo("Taken back out");
          }
        });
      }
    });
  }

  /* bibDialog — the export. FIVE FORMATS, and the plain one says in its own
     header that it is author\u2013date and NOT APA, MLA, Chicago or Harvard:
     an exact machine format is trustworthy and a hand-rolled named style is
     a plausible wrong answer, which is the one thing this repo refuses. */
  function bibDialog(preScope) {
    var scopes = bibScopes();
    if (!libOf("reference").length) {
      needWords("No references yet", "A bibliography is assembled out of citation " +
        "records, and there are none in the library. Paste some BibTeX or RIS and they " +
        "come in whole.", "cite-paste", "Paste one in");
      return;
    }
    openModal({
      title: "Export a bibliography",
      wide: true,
      fields: [
        { key: "scope", label: "Which references", type: "select",
          value: preScope || scopes[0].value, options: scopes, span: true,
          hint: "\u201cUsed on a project\u201d and \u201cCited by an output\u201d read the " +
            "links you have drawn \u2014 which is most of the point of drawing them." },
        { key: "format", label: "In which format", type: "select", value: "plain",
          options: BIB_FORMATS.map(function (f) {
            return { value: f.value, label: f.label };
          }), span: true },
        { key: "sort", label: "In what order", type: "select", value: "author",
          options: [{ value: "author", label: "Author, then year" },
            { value: "year", label: "Year, newest first" },
            { value: "title", label: "Title" }] }
      ],
      confirmLabel: "Write it out",
      onConfirm: function (v) {
        var list = bibScope(v.scope).get();
        if (!list.length) {
          toast("Nothing in that selection");
          return;
        }
        var fmt = bibFormat(v.format);
        var text = bibExport(list, v.format, v.sort);
        var bad = list.filter(function (e) { return citeComplete(e).length; });
        handOver("bibliography" + (fmt.ext || ".txt"), text, "Your bibliography",
          cap(countWords(list.length, "reference", "references")) + " as " + fmt.label +
          (bad.length ? ", " + countWords(bad.length, "one", "of them") +
            " incomplete \u2014 the file says which, so nothing goes out half-formed " +
            "without saying so." : "."));
      }
    });
  }

  /* A REFUSAL HAS TO CARRY THE WAY OUT, and the way out has to be the right
     one — a toast cannot carry a route, so a refusal that needs to point
     somewhere is never a toast. */
  /* handOver — a file handed to the reader, with an honest heading.
     `backupDialog` in the shared runtime is headed "Your backup" and explains
     how to restore it, which is true of a backup and false of a bibliography,
     a CV or a CSV of hours: a screen may not say something the reader can see
     is untrue. The runtime is byte-identical across five apps so it cannot be
     edited for one of them — this is its sibling, and like every
     hand-written overlay in this repo it calls `trapOverlay`, because ESCAPE
     AND THE FOCUS TRAP BELONG TO THE OVERLAY and not to `openModal`.

     Two ways out, deliberately: some browsers block a download silently, so
     Copy is always there beside it. */
  function handOver(name, text, title, says) {
    closeModal();
    overlay.innerHTML = '<div class="scrim" data-scrim="1">' +
      '<div class="modal" style="max-width:660px" role="dialog" aria-modal="true" ' +
      'aria-label="' + esc(title) + '"><div class="modal-head"><h3>' + esc(title) +
      "</h3><p>" + esc(says || "") + " <b>Save as file</b> puts it in your downloads " +
      "\u2014 some browsers block that silently, so if nothing turns up there, use " +
      "<b>Copy</b>.</p></div>" +
      '<div class="modal-body"><textarea id="hoText" readonly rows="12" ' +
      'spellcheck="false" style="width:100%;font-family:var(--mono);font-size:0.76rem;' +
      "padding:0.6rem;border-radius:8px;border:1px solid var(--rule-mid);" +
      'background:var(--raised);color:var(--ink);resize:vertical">' + esc(text) +
      "</textarea>" +
      '<p class="hint" style="margin-top:0.5rem">' + esc(name) + " \u00b7 " +
      (text.length / 1024).toFixed(1) + " KB \u00b7 " +
      countWords(text.split("\n").length, "line", "lines") + "</p></div>" +
      '<div class="modal-foot"><button class="btn quiet" data-mclose="1">Done</button>' +
      '<button class="btn" data-hofile="1">Save as file</button>' +
      '<button class="btn primary" data-hocopy="1">Copy</button></div></div></div>';
    var ta = document.getElementById("hoText");
    trapOverlay();
    ta.focus();
    overlay.querySelector("[data-mclose]").addEventListener("click", closeModal);
    overlay.querySelector("[data-scrim]").addEventListener("mousedown", function (e) {
      if (e.target === e.currentTarget) closeModal();
    });
    overlay.querySelector("[data-hofile]").addEventListener("click", function () {
      download(name, text, "text/plain");
      toast("If nothing appears in your downloads, this browser blocked it \u2014 use Copy.");
    });
    overlay.querySelector("[data-hocopy]").addEventListener("click", function () {
      function fallback() {
        ta.removeAttribute("readonly");
        ta.focus();
        ta.setSelectionRange(0, ta.value.length);
        var done = false;
        try { done = document.execCommand("copy"); } catch (e) { done = false; }
        ta.setAttribute("readonly", "readonly");
        toast(done ? "Copied" : "Could not copy automatically \u2014 the text is " +
          "selected, copy it by hand.");
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { toast("Copied"); }, fallback);
      } else { fallback(); }
    });
  }

  function needWords(title, message, act, label) {
    openModal({
      title: title, message: esc(message),
      confirmLabel: label || "Take me there", cancelLabel: "Not now",
      onConfirm: function () {
        if (APP.actions[act]) APP.actions[act]("");
      }
    });
  }

  /* ---------------- the older book ---------------- */

  function oldImportDialog() {
    var books = oldBooks();
    if (!books.length) { toast("Nothing older on this browser"); return; }
    var plan = oldPlan(books);
    openModal({
      title: "Import the older book?",
      message: "It is a different shape, so this is <strong>additive and lossy</strong>, " +
        "and both halves of that matter: nothing here is replaced, the old key is never " +
        "written to, and what cannot be carried is named below rather than quietly " +
        "dropped.",
      extraBody: '<div class="blk"><pre class="wrote">' + esc(plan.says) + "</pre></div>",
      confirmLabel: plan.n ? "Bring in " + plan.n : "Nothing to bring",
      cancelLabel: "Leave it alone",
      onConfirm: function () {
        if (!plan.n) { toast("Nothing was brought in"); return; }
        var before = STATE_LISTS.reduce(function (m, k) {
          m[k] = state[k].length; return m;
        }, {});
        plan.run();
        state.settings.offered = true;
        saveGo("Brought in " + plan.n, function () {
          STATE_LISTS.forEach(function (k) { state[k].length = before[k]; });
          saveGo("Taken back out");
        });
      }
    });
  }

  /* WHAT CANNOT BE CARRIED IS NAMED. Hours logged against a claimant have no
     record shape here that keeps their meaning — this app's hours belong
     to a PROJECT — so they are listed as left behind rather than being
     hung off an invented project. */
  function oldPlan(books) {
    var jobs = [], projects = [], lib = [], people = [], assets = [], lost = [];
    books.forEach(function (b) {
      var j;
      try { j = JSON.parse(localStorage.getItem(b.key)); } catch (e) { return; }
      if (!j) return;
      (j.jobs || []).forEach(function (x) {
        if (x && x.name) jobs.push({ id: uid(), name: x.name, kind: "", place: "",
          site: "", note: "Brought in from " + b.what + "." });
      });
      (j.projects || []).forEach(function (x) {
        if (x && x.name) projects.push({ id: uid(), name: x.name, status: "", jobId: "",
          roleId: "", startedOn: "", endedOn: "",
          note: [x.note, "Brought in from " + b.what + "."].filter(Boolean).join(" ") });
      });
      (j.assets || []).forEach(function (x) {
        if (!x || !x.name) return;
        var hasBody2 = x.body || x.lang;
        if (hasBody2) {
          lib.push({ id: uid(), kind: x.lang ? "script" : "method", name: x.name,
            lang: x.lang || "", body: String(x.body || "").replace(/\s+$/, ""),
            topics: topicList((x.topics || []).join(", ")), path: x.path || "",
            url: x.url || "", from: "", note: x.note || "" });
        } else if (x.path || x.url) {
          lib.push({ id: uid(), kind: "place", name: x.name, path: x.path || "",
            url: x.url || "", topics: topicList((x.topics || []).join(", ")),
            from: "", note: x.note || "", body: "" });
        } else {
          assets.push({ id: uid(), name: x.name, kind: x.kind || "", state: x.state || "",
            place: x.place || "", lastUsedOn: "", path: "", url: "", note: x.note || "" });
        }
      });
      (j.contacts || j.people || []).forEach(function (x) {
        if (x && x.name) people.push({ id: uid(), name: x.name, role: x.role || x.does || "",
          org: x.org || "", email: x.email || "", note: x.note || "" });
      });
      /* The cards-and-links book has one list and a role per card. */
      (j.cards || []).forEach(function (x) {
        if (!x || !x.name) return;
        if (x.body || x.lang) {
          lib.push({ id: uid(), kind: x.lang ? "script" : "method", name: x.name,
            lang: x.lang || "", body: String(x.body || "").replace(/\s+$/, ""),
            topics: [], path: x.path || "", url: x.url || "", from: "", note: x.note || "" });
        } else if (x.path || x.url) {
          lib.push({ id: uid(), kind: "place", name: x.name, path: x.path || "",
            url: x.url || "", topics: [], from: "", note: x.note || "", body: "" });
        } else if (x.role === "holds") {
          projects.push({ id: uid(), name: x.name, status: "", jobId: "", roleId: "",
            startedOn: "", endedOn: "", note: x.note || "" });
        }
      });
      if ((j.spans || []).length || (j.hours || []).length) {
        lost.push(countWords(((j.spans || []).length + (j.hours || []).length),
          "time entry", "time entries") + " logged against a claimant");
      }
      if ((j.runs || []).length) {
        lost.push(countWords(j.runs.length, "workflow run", "workflow runs") +
          ", because a run here points at a workflow this book does not have");
      }
      if ((j.links || []).length) {
        lost.push("the lines between records, which mean different things in the two shapes");
      }
    });
    var parts = [];
    if (jobs.length) parts.push(countWords(jobs.length, "employer", "employers"));
    if (projects.length) parts.push(countWords(projects.length, "project", "projects"));
    if (lib.length) parts.push(countWords(lib.length, "library entry", "library entries"));
    if (people.length) parts.push(countWords(people.length, "person", "people"));
    if (assets.length) parts.push(countWords(assets.length, "piece of equipment",
      "pieces of equipment"));
    var says = ["WHAT COMES ACROSS", "-----------------"];
    says.push(parts.length ? parts.join("\n") : "Nothing this shape can hold.");
    says.push("");
    says.push("WHAT STAYS BEHIND");
    says.push("-----------------");
    says.push(lost.length ? lost.join("\n")
      : "Nothing \u2014 everything in it has a shape here.");
    says.push("");
    says.push("The old book is not touched either way. It stays under its own key,");
    says.push("readable by the version of the app that wrote it.");
    return {
      n: parts.length ? listWords(parts) : "",
      says: says.join("\n"),
      run: function () {
        jobs.forEach(function (r) { state.jobs.push(stamp(r)); });
        projects.forEach(function (r) { state.projects.push(stamp(r)); });
        lib.forEach(function (r) { state.lib.push(stamp(r)); });
        people.forEach(function (r) { state.people.push(stamp(r)); });
        assets.forEach(function (r) { state.assets.push(stamp(r)); });
      }
    };
  }

  /* ============================================================
     FEEDING THE BOOK FROM A FILE.

     Coffer imports a plan as a document you paste, and the discipline that
     makes it safe is worth copying exactly: **nothing changes until you
     have seen every line and pressed Import.** So this reads the file,
     reports what it would do, and only then does it.

     Four rules, and each is a fault this repo has already paid for:

       IT IS ADDITIVE, AND THAT IS NOT THE SAME AS A RESTORE. A backup
       REPLACES the book; an import adds to it. Handed a backup this
       refuses and points at Restore, because adding one to a book that
       already holds it would duplicate every record silently.

       A REFERENCE IS A NAME OR A KEY, NEVER AN ID. Nobody writing a file
       by hand can know the app's own ids, so `"role": "GIS analyst"`
       resolves — against the file AND against what is already in the book,
       which is what makes a second import add to the first rather than
       fork it.

       THE SAME NAME IS THE SAME RECORD. A row whose name already exists
       under that kind is not added again; it is reused for the lines that
       point at it, and the report says so. That is what stops "import my
       CV again with one more job" from producing two of everything.

       IT NAMES WHAT IT CANNOT PLACE. An unknown list, an unknown field, a
       date that is not a date, a line whose end does not resolve: each is
       reported against the row it came from and left out. Guessing at any
       of them is the plausible wrong answer this whole app refuses.
     ============================================================ */

  /* The lists a file may carry, in the order the report prints them, with
     the fields each row may hold. A field not in this table is reported
     rather than dropped — a typo like `startOn` for `startedOn` would
     otherwise cost somebody a date they thought they had given. */
  var IMP_KINDS = [
    { kind: "job", word: "Employers", key: "jobs", fields: ["name", "kind", "place", "site", "note"] },
    { kind: "role", word: "Roles", key: "roles", fields: ["name", "job", "startedOn", "endedOn",
      "place", "basis", "note"], refs: { job: "job" },
      dates: [["startedOn", "part"], ["endedOn", "part"]] },
    { kind: "education", word: "Education", key: "education", fields: ["name", "org", "startedOn",
      "endedOn", "result", "note"],
      dates: [["startedOn", "part"], ["endedOn", "part"]] },
    { kind: "training", word: "Training", key: "training", fields: ["name", "org", "on", "hours",
      "kind", "ref", "note"], dates: [["on", "part"]] },
    { kind: "skill", word: "Skills", key: "skills", fields: ["name", "group", "level", "note"],
      words: { level: "SKILL_LEVELS" } },
    { kind: "project", word: "Projects", key: "projects", fields: ["name", "job", "role", "status",
      "startedOn", "endedOn", "note"], refs: { job: "job", role: "role" },
      dates: [["startedOn", "part"], ["endedOn", "part"]],
      words: { status: "PROJ_STATUS" } },
    { kind: "workflow", word: "Workflows", key: "workflows", fields: ["name", "kind", "note", "steps"] },
    { kind: "run", word: "Runs", key: "runs", fields: ["workflow", "project", "startedOn",
      "endedOn", "outcome", "note"], refs: { workflow: "workflow", project: "project" },
      dates: [["startedOn", "part"], ["endedOn", "part"]], noName: true },
    { kind: "action", word: "Actions", key: "actions", fields: ["name", "project", "kind", "when",
      "waitOn", "chaseDays", "chasedOn", "doneAt", "note"], refs: { project: "project" },
      dates: [["when", "part"], ["chasedOn", "part"], ["doneAt", "part"]],
      words: { kind: "ACTION_KINDS" } },
    { kind: "person", word: "People", key: "people", fields: ["name", "role", "org", "email", "note"] },
    { kind: "asset", word: "Equipment", key: "assets", fields: ["name", "kind", "state", "place",
      "lastUsedOn", "path", "url", "note"], dates: [["lastUsedOn", "part"]],
      words: { state: "THING_STATES" } },
    { kind: "output", word: "Outputs", key: "outputs", fields: ["name", "kind", "project", "on",
      "path", "url", "note"], refs: { project: "project" }, dates: [["on", "part"]] },
    { kind: "lib", word: "Library", key: "library", fields: ["name", "kind", "lang", "body", "path",
      "url", "topics", "from", "note", "cite"] },
    { kind: "portfolio", word: "Portfolio", key: "portfolio", fields: ["name", "on", "note"],
      dates: [["on", "part"]] },
    { kind: "cv", word: "CVs", key: "cvs", fields: ["name", "aim", "note"] },
    { kind: "hours", word: "Hours", key: "hours", fields: ["project", "on", "minutes", "note"],
      refs: { project: "project" }, dates: [["on", "day"]], noName: true }
  ];
  function impKind(k) {
    k = String(k || "").trim().toLowerCase();
    return IMP_KINDS.filter(function (x) {
      return x.kind === k || x.key === k || LIST_FOR[x.kind] === k;
    })[0] || null;
  }
  /* The rows a file put under this kind, whichever of its three spellings it
     used. A file naming the same list twice is told rather than having one
     half of it silently win. */
  function impRows(j, K, out) {
    var names = [K.key, K.kind, LIST_FOR[K.kind]].filter(function (n, i, a) {
      return a.indexOf(n) === i && j[n] != null;
    });
    if (names.length > 1) {
      out.problems.push(K.word + ": the file names that list " +
        countWords(names.length, "way", "ways") + " (" + listWords(names) +
        "). Only " + names[0] + " is read.");
    }
    return names.length ? j[names[0]] : null;
  }
  var IMP_WORDS = {
    SKILL_LEVELS: function () { return SKILL_LEVELS.map(function (x) { return x.value; }); },
    PROJ_STATUS: function () { return PROJ_STATUS.map(function (x) { return x.value; }); },
    ACTION_KINDS: function () { return ACTION_KINDS.map(function (x) { return x.value; }); },
    THING_STATES: function () { return THING_STATES.map(function (x) { return x.value; }); }
  };

  /* impRead(text) — the whole of the reading, with nothing written. It
     returns what it WOULD do, which is what the dialog prints. */
  function impRead(text) {
    var out = { ok: false, why: "", j: null, profile: null, kinds: [], links: [],
      problems: [], unplaced: [], newCount: 0, seenCount: 0, linkCount: 0 };
    var raw = String(text || "").trim();
    if (!raw) { out.why = "Nothing pasted yet."; return out; }
    var j;
    try { j = JSON.parse(raw); }
    catch (e) {
      out.why = "That is not valid JSON yet — " + String(e.message || e) +
        ". Check for a missing comma or bracket.";
      return out;
    }
    if (!j || typeof j !== "object" || Array.isArray(j)) {
      out.why = "The file has to be a JSON object with lists inside it, not " +
        (Array.isArray(j) ? "a bare array" : "a " + typeof j) + ".";
      return out;
    }
    /* A BACKUP IS NOT AN IMPORT, and adding one to a book that already
       holds it would duplicate every record without a word. */
    if (j.version && j.settings && j.forgotten) {
      out.why = "That looks like a whole backup of a book rather than an import " +
        "file — it carries a version, settings and the forgotten names. " +
        "Importing it would add a second copy of everything. Use " +
        "“Restore a backup” in Settings instead, which replaces the book.";
      return out;
    }

    /* The map every reference resolves through: a key or a name, per kind,
       pointing either at a row in this file or at a record already in the
       book. Built before anything is validated, because a role in the file
       may legitimately name a project further down it. */
    var byKey = {};
    function keyOf(kind, s) { return kind + "\u0000" + String(s || "").trim().toLowerCase(); }
    IMP_KINDS.forEach(function (K) {
      live(listOf(K.kind)).forEach(function (rec) {
        if (rec.name) byKey[keyOf(K.kind, rec.name)] = { have: rec };
      });
    });

    var known = {};
    IMP_KINDS.forEach(function (K) {
      known[K.kind] = 1; known[K.key] = 1; known[LIST_FOR[K.kind]] = 1;
    });
    known.profile = 1;
    known.links = 1;
    known.mashghal = 1;
    known.note = 1;
    Object.keys(j).forEach(function (k) {
      if (!known[k]) out.unplaced.push(k);
    });

    /* ---- the profile ---- */
    if (j.profile && typeof j.profile === "object") {
      var pr = {}, bad = [];
      Object.keys(j.profile).forEach(function (f) {
        if (PROFILE_KEYS.indexOf(f) < 0) { bad.push(f); return; }
        var v = j.profile[f];
        if (v == null || v === "") return;
        pr[f] = String(v).trim();
      });
      bad.forEach(function (f) {
        out.problems.push("profile: there is no field called “" + f + "”.");
      });
      /* Only the fields it actually states, and only over a blank one —
         an import may fill a gap and may not quietly rewrite what you
         typed. What it would overwrite is reported instead. */
      var sets = [], holds = [];
      Object.keys(pr).forEach(function (f) {
        if (!String(state.profile[f] || "").trim()) sets.push(f);
        else if (String(state.profile[f]).trim() !== pr[f]) holds.push(f);
      });
      if (sets.length || holds.length) {
        out.profile = { values: pr, sets: sets, holds: holds };
      }
    } else if (j.profile) {
      out.problems.push("profile: it has to be an object of fields, not a " +
        typeof j.profile + ".");
    }

    /* ---- pass one: name every row, so a reference can find it ---- */
    IMP_KINDS.forEach(function (K) {
      var rows = impRows(j, K, out);
      if (rows == null) return;
      if (!Array.isArray(rows)) {
        out.problems.push(K.word + ": it has to be a list, not a " +
          typeof rows + ".");
        return;
      }
      rows.forEach(function (row, i) {
        if (!row || typeof row !== "object") return;
        /* A ROW IS FINDABLE BY ITS KEY *AND* BY ITS NAME. Registering only
           one of them made a row carrying a key unreachable by the name
           printed on it, so one line in a file resolved and its neighbour,
           naming the same record the other way, did not. */
        var spellings = [String(row.key || "").trim(),
          String(row.name || "").trim(),
          String((row.cite && row.cite.title) || "").trim()];
        spellings.filter(Boolean).forEach(function (k, which) {
          var kk = keyOf(K.kind, k);
          /* KEEP THE RECORD THE BOOK ALREADY HOLDS. Overwriting the seeded
             entry lost it, so a row whose name was already in the book read
             as new \u2014 which is the whole of "importing twice does not
             give you two of everything", quietly untrue. */
          if (!byKey[kk] || byKey[kk].have) {
            byKey[kk] = { at: i, kind: K.kind,
              have: byKey[kk] ? byKey[kk].have : null };
            return;
          }
          if (byKey[kk].at !== i && which === 0) {
            out.problems.push(K.word + " " + (i + 1) + ": \u201c" + k +
              "\u201d is in this file twice. The second one is left out.");
          }
        });
      });
    });

    /* ---- pass two: validate, and say what each row would do ---- */
    IMP_KINDS.forEach(function (K) {
      var rows = impRows(j, K, { problems: [] });
      if (!Array.isArray(rows) || !rows.length) return;
      var made = [];
      rows.forEach(function (row, i) {
        var at = K.word + " " + (i + 1);
        if (!row || typeof row !== "object" || Array.isArray(row)) {
          out.problems.push(at + ": every row has to be an object.");
          return;
        }
        var name = String(row.name || "").trim();
        /* A REFERENCE HAS NO NAME OF ITS OWN — its name IS its title, which
           is how the dialog writes one too. So a row carrying a citation and
           no name is not nameless. */
        if (!name && K.kind === "lib" && row.cite && typeof row.cite === "object") {
          name = String(row.cite.title || "").trim();
        }
        if (!K.noName && !name) {
          out.problems.push(at + ": it has no name, so there is nothing to call " +
            "it. Row left out.");
          return;
        }
        var rec = { id: uid() }, trouble = false;

        Object.keys(row).forEach(function (f) {
          if (f === "key") return;
          if (K.fields.indexOf(f) < 0) {
            out.problems.push(at + (name ? " (" + name + ")" : "") +
              ": there is no field called “" + f + "” here, so that one field is dropped. " +
              "The row itself still comes in.");
          }
        });

        (K.dates || []).forEach(function (pair) {
          var v = String(row[pair[0]] || "").trim();
          if (!v) return;
          var fine = pair[1] === "day" ? dayOk(v) : partOk(v);
          if (!fine) {
            out.problems.push(at + (name ? " (" + name + ")" : "") + ": “" + v +
              "” is not a date for " + pair[0] + ". " +
              (pair[1] === "day" ? "Write a full day, 2026-09-17."
                : "Write a year, a year and month, or a full day — 2026, " +
                  "2026-09, 2026-09-17.") + " Row left out.");
            trouble = true;
          }
        });

        Object.keys(K.words || {}).forEach(function (f) {
          var v = String(row[f] || "").trim();
          if (!v) return;
          var allowed = IMP_WORDS[K.words[f]]();
          if (allowed.indexOf(v) < 0) {
            out.problems.push(at + (name ? " (" + name + ")" : "") + ": “" + v +
              "” is not one of the words " + f + " can take (" +
              allowed.filter(Boolean).join(", ") + "). Row left out.");
            trouble = true;
          }
        });

        /* Each reference resolves to a row in this file or a record already
           in the book, and a reference to neither is named rather than
           being written as a dangling id. */
        var refs = {};
        Object.keys(K.refs || {}).forEach(function (f) {
          var v = String(row[f] || "").trim();
          if (!v) return;
          var hit = byKey[keyOf(K.refs[f], v)];
          if (!hit) {
            out.problems.push(at + (name ? " (" + name + ")" : "") + ": nothing called " +
              "“" + v + "” to be its " + f + ". Row left out.");
            trouble = true;
            return;
          }
          refs[f] = v;
        });

        if (K.kind === "hours" && !(num(row.minutes) > 0)) {
          out.problems.push(at + ": minutes has to be a number above nought. Row left out.");
          trouble = true;
        }
        if (K.kind === "lib") {
          var lk = String(row.kind || "").trim();
          if (!lk) {
            out.problems.push(at + " (" + name + "): a library entry needs a kind — " +
              "one of " + LIB_ORDER.join(", ") + ". Row left out.");
            trouble = true;
          } else if (LIB_ORDER.indexOf(lk) < 0) {
            out.problems.push(at + " (" + name + "): “" + lk + "” is not a " +
              "library kind. One of " + LIB_ORDER.join(", ") + ". Row left out.");
            trouble = true;
          }
        }
        if (K.kind === "lib" && row.cite != null) {
          if (typeof row.cite !== "object" || Array.isArray(row.cite)) {
            out.problems.push(at + " (" + name + "): cite has to be an object of " +
              "citation fields. Row left out.");
            trouble = true;
          } else {
            Object.keys(row.cite).forEach(function (c) {
              if (c !== "type" && CITE_FIELDS.indexOf(c) < 0) {
                out.problems.push(at + " (" + name + "): there is no citation field " +
                  "called “" + c + "”, so that one field is dropped.");
              }
            });
            var ct = String(row.cite.type || "").trim();
            if (ct && !CITE_TYPES.filter(function (t) { return t.value === ct; })[0]) {
              out.problems.push(at + " (" + name + "): “" + ct + "” is not a kind of " +
                "reference. One of " + CITE_TYPES.map(function (t) { return t.value; })
                  .join(", ") + ". Row left out.");
              trouble = true;
            }
          }
        }
        if (K.kind === "workflow" && row.steps != null && !Array.isArray(row.steps)) {
          out.problems.push(at + " (" + name + "): steps has to be a list. Row left out.");
          trouble = true;
        }
        if (trouble) return;

        var already = name ? byKey[keyOf(K.kind, name)] : null;
        made.push({
          row: row, name: name, refs: refs, at: i,
          have: already && already.have ? already.have : null
        });
      });
      if (!made.length) return;
      var fresh = made.filter(function (m) { return !m.have; }).length;
      out.newCount += fresh;
      out.seenCount += made.length - fresh;
      out.kinds.push({ K: K, made: made, fresh: fresh });
    });

    /* ---- the lines ---- */
    if (j.links != null) {
      if (!Array.isArray(j.links)) {
        out.problems.push("links: it has to be a list.");
      } else {
        j.links.forEach(function (l, i) {
          var at = "Line " + (i + 1);
          if (!l || typeof l !== "object") {
            out.problems.push(at + ": every line has to be an object with a, rel and b.");
            return;
          }
          var rel = String(l.rel || "").trim();
          if (!RELS[rel]) {
            out.problems.push(at + ": “" + rel + "” is not one of the lines " +
              "this app has (" + Object.keys(RELS).join(", ") + "). Left out.");
            return;
          }
          var ends = ["a", "b"].map(function (side) {
            var s = String(l[side] || "").trim();
            var at2 = s.indexOf(":");
            if (at2 < 1) return { bad: "its “" + side + "” end has to read kind:name, like " +
              "“project:Anfeh harbour survey”" };
            var kind = s.slice(0, at2).trim(), nm = s.slice(at2 + 1).trim();
            if (!impKind(kind)) return { bad: "there is no kind called “" + kind + "”" };
            if (!byKey[keyOf(kind, nm)]) {
              return { bad: "nothing called “" + nm + "” under " + kind };
            }
            return { kind: kind, name: nm };
          });
          var bad = ends.filter(function (e) { return e.bad; });
          if (bad.length) {
            out.problems.push(at + ": " + bad[0].bad + ". Left out.");
            return;
          }
          /* A KEY IS SOMETHING YOU TYPE, NOT A NAME OF ANYTHING. A preview
             row reading \u201canfeh uses QGIS\u201d names an internal handle
             at the reader; it prints what the records are called. */
          ends.forEach(function (e) {
            var hit = byKey[keyOf(e.kind, e.name)];
            e.says = (hit && hit.have && hit.have.name) || impSaid(j, e) || e.name;
          });
          out.links.push({ a: ends[0], rel: rel, b: ends[1],
            note: String(l.note || "").trim() });
        });
        out.linkCount = out.links.length;
      }
    }

    out.j = j;
    out.ok = !!(out.kinds.length || out.links.length || out.profile);
    if (!out.ok && !out.problems.length) {
      out.why = "There is nothing in that file this app can hold. It wants lists " +
        "named " + IMP_KINDS.slice(0, 4).map(function (K) { return K.kind; }).join(", ") +
        " and so on — press “What the file looks like” below.";
    }
    return out;
  }

  /* impApply(read) — the only half that writes, and it writes nothing the
     report did not print. It hands back an undo over the ids it made. */
  function impApply(read) {
    var stamp2 = new Date().toISOString();
    var made = [], byKey = {};
    function keyOf(kind, s) { return kind + "\u0000" + String(s || "").trim().toLowerCase(); }
    IMP_KINDS.forEach(function (K) {
      live(listOf(K.kind)).forEach(function (rec) {
        if (rec.name) byKey[keyOf(K.kind, rec.name)] = rec;
      });
    });
    var wasProfile = null;
    if (read.profile) {
      wasProfile = {};
      read.profile.sets.forEach(function (f) {
        wasProfile[f] = state.profile[f];
        state.profile[f] = read.profile.values[f];
      });
    }
    /* Pass one writes the records, so pass two can point at them. A row
       whose name is already in the book is REUSED rather than copied. */
    read.kinds.forEach(function (grp) {
      grp.made.forEach(function (m) {
        if (m.have) { m.rec = m.have; return; }
        var rec = { id: uid(), updatedAt: stamp2 };
        grp.K.fields.forEach(function (f) {
          if (grp.K.refs && grp.K.refs[f]) return;
          if (f === "topics") { rec.topics = topicList((m.row.topics || []).join(", ")); return; }
          if (f === "steps") {
            rec.steps = (m.row.steps || []).map(function (s) {
              return { id: uid(),
                name: String((s && s.name) || s || "").trim(),
                note: String((s && s.note) || "").trim() };
            }).filter(function (s) { return s.name; });
            return;
          }
          if (f === "cite") {
            if (m.row.cite && typeof m.row.cite === "object") {
              rec.cite = blankCite();
              CITE_FIELDS.concat(["type"]).forEach(function (c) {
                if (m.row.cite[c] != null) rec.cite[c] = String(m.row.cite[c]).trim();
              });
              if (!rec.cite.title) rec.cite.title = m.name;
            }
            return;
          }
          if (f === "hours" || f === "minutes" || f === "chaseDays") {
            if (m.row[f] != null && m.row[f] !== "") rec[f] = num(m.row[f]);
            return;
          }
          if (m.row[f] != null) rec[f] = String(m.row[f]).trim();
        });
        /* THE NAME THE READER RESOLVED IS THE NAME THAT GETS WRITTEN. Copied
           off the row instead, a reference \u2014 whose name IS its title and
           which carries no `name` field at all \u2014 landed nameless, and
           every screen then printed a blank row. */
        if (!grp.K.noName) rec.name = m.name;
        if (grp.K.kind === "lib" && !rec.topics) rec.topics = [];
        listOf(grp.K.kind).push(rec);
        made.push({ kind: grp.K.kind, rec: rec });
        m.rec = rec;
        [m.name, m.row.key, m.row.name].filter(Boolean).forEach(function (k) {
          byKey[keyOf(grp.K.kind, k)] = rec;
        });
      });
    });
    /* Pass two fills the references, now that every id exists. */
    read.kinds.forEach(function (grp) {
      grp.made.forEach(function (m) {
        if (m.have) return;
        Object.keys(grp.K.refs || {}).forEach(function (f) {
          if (!m.refs[f]) return;
          var hit = byKey[keyOf(grp.K.refs[f], m.refs[f])];
          if (hit) m.rec[f + "Id"] = hit.id;
        });
        stamp(m.rec);
      });
    });
    var lines = [];
    read.links.forEach(function (l) {
      var A = byKey[keyOf(l.a.kind, l.a.name)];
      var B = byKey[keyOf(l.b.kind, l.b.name)];
      if (!A || !B) return;
      var ra = ref(l.a.kind, A.id), rb = ref(l.b.kind, B.id);
      if (linkBetween(ra, l.rel, rb)) return;   /* already drawn; not a second copy */
      lines.push(link(ra, l.rel, rb, l.note));
    });
    return {
      records: made.length, lines: lines.length,
      undo: function () {
        lines.forEach(function (l) { unlink(l.id); });
        made.slice().reverse().forEach(function (m) {
          var list = listOf(m.kind), i = list.indexOf(m.rec);
          if (i >= 0) list.splice(i, 1);
        });
        if (wasProfile) {
          Object.keys(wasProfile).forEach(function (f) {
            state.profile[f] = wasProfile[f];
          });
        }
      }
    };
  }

  /* ---------------- the dialog ----------------

     Hand-written, because the shared runtime's field spec has no file
     picker and may not grow one for a single app — so it calls
     `trapOverlay`, because ESCAPE AND THE FOCUS TRAP BELONG TO THE OVERLAY
     and a hand-written one is exactly where that is forgotten. */
  function importDialog() {
    closeModal();
    overlay.innerHTML = '<div class="scrim" data-scrim="1">' +
      '<div class="modal" style="max-width:720px" role="dialog" aria-modal="true" ' +
      'aria-label="Feed the book from a file"><div class="modal-head">' +
      "<h3>Feed the book from a file</h3><p>Paste a JSON file below, or choose " +
      "one. <b>Nothing changes until you have read what it would do and pressed " +
      "Bring it in.</b> It adds to the book rather than replacing it, and a " +
      "record whose name is already here is reused rather than copied — so " +
      "importing twice does not give you two of everything.</p></div>" +
      '<div class="modal-body">' +
      '<textarea id="impText" rows="9" spellcheck="false" placeholder="' +
      esc('{\n  "profile": { "name": "…" },\n  "jobs": [ { "name": "…" } ],\n' +
        '  "roles": [ { "name": "…", "job": "…" } ],\n' +
        '  "links": [ { "a": "project:…", "rel": "uses", "b": "skill:…" } ]\n}') +
      '" style="width:100%;font-family:var(--mono);font-size:0.74rem;padding:0.6rem;' +
      "border-radius:8px;border:1px solid var(--rule-mid);background:var(--raised);" +
      'color:var(--ink);resize:vertical"></textarea>' +
      '<div class="page-acts" style="margin-top:0.5rem">' +
      '<label class="btn tiny" style="cursor:pointer">Choose a file' +
      '<input type="file" id="impFile" accept=".json,application/json,.txt,text/plain" ' +
      'style="display:none" /></label>' +
      '<button class="btn tiny" id="impFmt">What the file looks like</button>' +
      '<button class="btn tiny" id="impTpl">Paste a starting template</button></div>' +
      '<div id="impHelp" hidden style="margin-top:0.7rem">' + impHelpHtml() + "</div>" +
      '<div id="impPrev" class="impprev"></div></div>' +
      '<div class="modal-foot"><button class="btn quiet" data-mclose="1">Cancel</button>' +
      '<button class="btn primary" id="impGo" disabled>Bring it in</button>' +
      "</div></div></div>";

    var ta = document.getElementById("impText");
    var prev = document.getElementById("impPrev");
    var go = document.getElementById("impGo");
    var help = document.getElementById("impHelp");
    var current = null;
    trapOverlay();
    ta.focus();

    function paint() {
      var read = impRead(ta.value);
      current = read;
      prev.innerHTML = impReport(read);
      go.disabled = !read.ok;
      go.textContent = read.ok
        ? "Bring in " + countWords(read.newCount, "record", "records") +
          (read.linkCount ? " and " + countWords(read.linkCount, "line", "lines") : "")
        : "Bring it in";
    }
    ta.addEventListener("input", paint);
    paint();

    document.getElementById("impFmt").addEventListener("click", function () {
      help.hidden = !help.hidden;
      this.textContent = help.hidden ? "What the file looks like" : "Hide the format";
    });
    document.getElementById("impTpl").addEventListener("click", function () {
      ta.value = IMP_TEMPLATE;
      paint();
      ta.focus();
    });
    document.getElementById("impFile").addEventListener("change", function () {
      var f = this.files && this.files[0];
      if (!f) return;
      var fr = new FileReader();
      fr.onload = function () { ta.value = String(fr.result || ""); paint(); };
      fr.onerror = function () {
        toast("That file could not be read — paste its text in instead.");
      };
      fr.readAsText(f);
    });
    overlay.querySelector("[data-mclose]").addEventListener("click", closeModal);
    overlay.querySelector("[data-scrim]").addEventListener("mousedown", function (e) {
      if (e.target === e.currentTarget) closeModal();
    });
    go.addEventListener("click", function () {
      if (!current || !current.ok) return;
      var done = impApply(current);
      closeModal();
      saveGo(cap(countWords(done.records, "record", "records")) + " and " +
        countWords(done.lines, "line", "lines") + " brought in", function () {
        done.undo();
        saveGo("Taken back out");
      });
    });
  }

  /* impReport(read) — what it would do, said before it does it. */
  function impReport(read) {
    if (read.why) {
      return '<div class="panel drift"><p class="says">' + esc(read.why) + "</p></div>";
    }
    var out = [];
    if (read.ok) {
      out.push('<div class="panel"><p class="nm">' +
        cap(countWords(read.newCount, "new record", "new records")) +
        (read.seenCount ? ", and " + countWords(read.seenCount, "row", "rows") +
          " already in the book" : "") +
        (read.linkCount ? ", plus " + countWords(read.linkCount, "line", "lines") : "") +
        ".</p>" +
        (read.seenCount ? '<p class="says">A row whose name is already here is ' +
          "reused rather than copied, so the lines can point at it.</p>" : "") +
        "</div>");
    }
    if (read.profile) {
      out.push(sectHead("Your profile", null));
      out.push('<div class="panel"><p class="says">' +
        (read.profile.sets.length
          ? "It would fill " + listWords(read.profile.sets) + "."
          : "Nothing on it is blank, so nothing would be filled.") +
        (read.profile.holds.length
          ? " <strong>It leaves " + listWords(read.profile.holds) + " alone</strong>, " +
            "because you have already written " +
            (read.profile.holds.length === 1 ? "it" : "them") + " — an import " +
            "may fill a gap and may not rewrite what you typed."
          : "") + "</p></div>");
    }
    read.kinds.forEach(function (grp) {
      out.push(sectHead(grp.K.word, grp.made.length));
      out.push('<div class="rows">' + grp.made.map(function (m) {
        return '<div class="row flat"><span class="grow"><span class="nm">' +
          esc(m.name || impNameless(grp.K, m)) + "</span>" +
          '<span class="sub">' + esc(impRowSays(read.j, grp.K, m)) + "</span></span>" +
          (m.have ? '<span class="right"><span class="pill p-done">Already here</span>' +
            "</span>" : "") + "</div>";
      }).join("") + "</div>");
    });
    if (read.links.length) {
      out.push(sectHead("Lines", read.links.length));
      out.push('<div class="rows">' + read.links.map(function (l) {
        return '<div class="row flat"><span class="grow"><span class="nm">' +
          esc(l.a.says || l.a.name) + " " + esc(RELS[l.rel].fwd) + " " +
          esc(l.b.says || l.b.name) + "</span></span></div>";
      }).join("") + "</div>");
    }
    if (read.unplaced.length) {
      out.push('<div class="panel drift"><p class="says"><strong>' +
        cap(countWords(read.unplaced.length, "list", "lists")) +
        " in the file " + (read.unplaced.length === 1 ? "is" : "are") +
        " not something this app holds</strong>, so " +
        (read.unplaced.length === 1 ? "it is" : "they are") + " left out: " +
        esc(listWords(read.unplaced)) + ".</p></div>");
    }

          return '<div class="row flat"><span class="grow"><span class="sub">' +

  /* A record the book already holds, by name. */
  function byBook(kind, name) {
    var want = String(name || "").trim().toLowerCase();
    return live(listOf(kind)).filter(function (r) {
      return String(r.name || "").trim().toLowerCase() === want;
    })[0] || null;
  }
  /* What the FILE calls a row that a line pointed at by key. */
  function impSaid(j, end) {
    var K = impKind(end.kind);
    if (!K) return "";
    var rows = impRows(j, K, { problems: [] });
    if (!Array.isArray(rows)) return "";
    var want = end.name.toLowerCase(), said = "";
    rows.forEach(function (row) {
      if (!row || typeof row !== "object" || said) return;
      var nm = String(row.name || (row.cite && row.cite.title) || "").trim();
      if (!nm) return;
      [row.key, row.name, row.cite && row.cite.title].filter(Boolean)
        .forEach(function (k) {
          if (String(k).trim().toLowerCase() === want) said = nm;
        });
    });
    return said;
  }
  function impNameless(K, m) {
    if (K.kind === "hours") return hm(num(m.row.minutes));
    if (K.kind === "run") return m.refs.workflow || "a run";
    return "(unnamed)";
  }
  /* A KEY IS SOMETHING YOU TYPE, NOT A NAME OF ANYTHING. Left as the handle
     the file used, a role's sub-line read “job: aub”, which reads as the
     employer being called aub. Fixed for the lines and not for the rows is
     half a fix. */
  function impRowSays(j, K, m) {
    var bits = [];
    Object.keys(K.refs || {}).forEach(function (f) {
      if (!m.refs[f]) return;
      var kind = K.refs[f], hit = byBook(kind, m.refs[f]);
      bits.push(f + ": " + ((hit && hit.name) ||
        impSaid(j, { kind: kind, name: m.refs[f] }) || m.refs[f]));
    });
    (K.dates || []).forEach(function (pair) {
      var v = String(m.row[pair[0]] || "").trim();
      if (v) bits.push(partDate(v));
    });
    if (K.kind === "lib" && m.row.kind) bits.unshift(m.row.kind);
    if (K.kind === "skill" && m.row.group) bits.unshift(m.row.group);
    if (m.row.org) bits.unshift(m.row.org);
    return bits.join(" · ");
  }

  /* impHelpHtml() — the format, BUILT FROM THE VALIDATOR ITSELF rather than
     written out beside it. A reference table typed by hand would be wrong
     the first time a field was added, and the fault would be silent: the

  function impHelpHtml() {
    var rows = IMP_KINDS.map(function (K) {
      var fields = K.fields.map(function (f) {

        (K.dates || []).forEach(function (pair) {
          if (pair[0] === f) note = pair[1] === "day" ? "a full day" : "a date";
        });
        if (K.words && K.words[f]) note = "one of: " +
          IMP_WORDS[K.words[f]]().filter(Boolean).join(" / ");
        if (f === "topics") note = "a list of words";
        if (f === "steps") note = "a list of names";
        if (f === "cite") note = "the citation, as its own object";
        return "<code>" + f + "</code>" + (note ? " <span class=\"faint\">" +
          esc(note) + "</span>" : "");
      }).join(", ");
      return "<tr><td class=\"lit\">" + K.key + "</td><td>" + fields +
        (K.noName ? " <span class=\"faint\">(no name of its own)</span>" : "") +

      "blank and leaves what you have already written alone.</p>" +

  /* ============================================================
     THE ACTIONS, AND THE APP OBJECT.

     `APP.actions` is the ONLY place a figure moves. A keyboard shortcut, a
     row, a finder command and a tile all press the same handler, so a key
     can never do something a reader could not have done with a tap, and it
     cannot drift from the button it fires.
     ============================================================ */

  function goRec(r) {
    var p = parseRef(r);
    if (!recOf(r)) { toast(nameOf(r) + " is not in the book"); return; }
    back.push({ tab: view, page: pageAt[view] || "", rec: openRec });
    openRec = r;
    view = TAB_OF[p.kind] || view;
    if (p.kind === "lib") {
      pageAt.library = LIB_PAGE[recOf(r).kind] || "scripts";
    } else if (PAGE_OF[p.kind]) {
      pageAt[TAB_OF[p.kind]] = PAGE_OF[p.kind];
    }
    render();
    window.scrollTo({ top: 0, behavior: "auto" });
  }
  function goPage(tab, page) {
    back.push({ tab: view, page: pageAt[view] || "", rec: openRec });
    openRec = "";
    view = tab;
    if (page) pageAt[tab] = page;
    render();
    window.scrollTo({ top: 0, behavior: "auto" });
  }
  function goBack() {
    var b = back.pop();
    if (!b) { openRec = ""; render(); return; }
    view = b.tab; openRec = b.rec;
    if (b.page) pageAt[b.tab] = b.page;
    render();
  }

  function needRec(kind, idv) {
    var rec = byId(kind, idv);
    if (!rec) toast("That " + KINDS[kind].word.toLowerCase() + " is gone");
    return rec;
  }

  var ACTIONS = {
    /* ---- navigation ---- */
    "open": function (r) { goRec(r); },
    "back": function () { goBack(); },
    "page": function (idv) {
      var p = String(idv || "").split("|");
      pageAt[p[0]] = p[1]; openRec = ""; render();
    },
    "tab-library": function () { goPage("library", ""); },
    "tab-show": function () { goPage("show", ""); },
    "tab-career-page": function (idv) { goPage("career", idv); },
    "tab-work-page": function (idv) { goPage("work", idv); },
    "tab-library-page": function (idv) { goPage("library", idv); },
    "settings": function () { goPage("settings", ""); },
    "guide": function () { goPage("guide", ""); },

    "lib-facet": function (idv) { libTopic = idv || ""; render(); },
    "lib-topic": function (idv) { libTopic = idv || ""; pageAt.library = "topics"; render(); },
    "proj-filter": function (idv) { projFilter = idv || ""; render(); },

    /* ---- the finder ---- */
    "find": function () { openFind(); },
    "find-open": function (r) { closeFind(); goRec(r); },
    "find-page": function (idv) {
      closeFind();
      var p = String(idv || "").split("|");
      goPage(p[0], p[1] || "");
    },
    "find-hint": function (idv) {
      var inp = document.getElementById("findInput");
      inp.value = idv || ""; paintFind(inp.value); inp.focus();
    },
    "find-cmd": function (idv) {
      var p = String(idv || "").split("|");
      closeFind();
      if (ACTIONS[p[0]]) ACTIONS[p[0]](p[1] || "");
    },
    "ask-table": function () { askTable(); },

    /* ---- the look ---- */
    "theme": function () {
      var now = document.documentElement.getAttribute("data-theme");
      ACTIONS["theme-set"](now === "light" ? "dark" : "light");
    },
    "theme-set": function (v) {
      /* WHICH THEME THIS MACHINE SHOWS IS A FACT ABOUT THE MACHINE, like a
         window size — so it lives beside the book and not in it. Two
         copies of it disagreed at once the last time it was in `state`:
         the pre-paint reader stamped the attribute and the freshly loaded
         book then removed it. */
      try {
        if (v) localStorage.setItem(THEME_KEY, v);
        else localStorage.removeItem(THEME_KEY);
      } catch (e) { /* a blocked store is not a reason to fail the toggle */ }
      paintTheme();
      render();
    },

    /* ---- career ---- */
    "profile-edit": function () { profileDialog(); },
    "job-add": function () { jobDialog(null); },
    "job-edit": function (idv) { var r = needRec("job", idv); if (r) jobDialog(r); },
    "job-del": function (idv) {
      var r = needRec("job", idv); if (!r) return;
      var roles = state.roles.filter(function (x) { return x.jobId === r.id; });
      var projs = state.projects.filter(function (x) { return x.jobId === r.id; });
      /* THE WORK STAYS. A role or a project keeps every date, every action
         and every output it had — it simply stops naming an employer,
         and `forgotten` keeps the name so the history still reads
         "American University of Beirut (removed)" rather than losing it. */
      removeRec("job", r, "The employer record goes.",
        (roles.length || projs.length)
          ? cap(listWords([roles.length ? countWords(roles.length, "role", "roles") : "",
              projs.length ? countWords(projs.length, "project", "projects") : ""]
            .filter(Boolean))) + " under it stay exactly as they are, and still read " +
            "its name with “(removed)” after it."
          : "Nothing is filed under it.");
    },
    "proj-add-job": function (idv) { projDialog(null, idv); },
    "role-add": function () { roleDialog(null); },
    "role-edit": function (idv) { var r = needRec("role", idv); if (r) roleDialog(r); },
    "role-del": function (idv) {

      var projs = getExperienceProjects(r.id);
      removeRec("role", r, "The role goes.", projs.length
        ? cap(countWords(projs.length, "project", "projects")) +
          " that ran under it stay, and stop naming a role."
        : "No project names it.");
    },
    "edu-add": function () { eduDialog(null); },
    "edu-edit": function (idv) { var r = needRec("education", idv); if (r) eduDialog(r); },
    "edu-del": function (idv) {
      var r = needRec("education", idv); if (r) removeRec("education", r);
    },
    "train-add": function () { trainDialog(null); },
    "train-edit": function (idv) { var r = needRec("training", idv); if (r) trainDialog(r); },
    "train-del": function (idv) {
      var r = needRec("training", idv); if (!r) return;
      var sk = getTrainingSkills(r.id);
      removeRec("training", r, "The training record goes.", sk.length
        ? cap(countWords(sk.length, "skill", "skills")) + " it taught " +
          (sk.length === 1 ? "loses" : "lose") + " this piece of evidence, and " +
          (sk.length === 1 ? "keeps" : "keep") + " whatever else backs " +
          (sk.length === 1 ? "it" : "them") + "."
        : "");
    },
    "train-copy": function (idv) {
      var r = needRec("training", idv); if (!r) return;
      copyOut([r.name, r.org, r.on ? partDate(r.on) : "", r.ref]
        .filter(Boolean).join(" · "), "Copied the certificate line");
    },
    "skill-add": function () { skillDialog(null); },
    "skill-edit": function (idv) { var r = needRec("skill", idv); if (r) skillDialog(r); },
    "skill-del": function (idv) {
      var r = needRec("skill", idv); if (!r) return;
      var n = skillEvidenceCount(r.id);
      removeRec("skill", r, "The skill goes.", n
        ? "The " + countWords(n, "record", "records") + " that evidenced it " +
          (n === 1 ? "stays" : "stay") + " exactly as " + (n === 1 ? "it is" : "they are") +
          " — only the lines to this skill go."
        : "Nothing evidenced it.");
    },

    /* ---- work ---- */
    "proj-add": function () { projDialog(null); },
    "proj-edit": function (idv) { var r = needRec("project", idv); if (r) projDialog(r); },
    "proj-del": function (idv) {
      var r = needRec("project", idv); if (!r) return;
      var acts = projActions(r.id), outs = getProjectOutputs(r.id);
      var hrs = state.hours.filter(function (h) { return h.projectId === r.id; });
      /* DELETING A PROJECT KEEPS ITS OUTPUTS, because an output really was
         produced and is what a portfolio item and a CV point at — they
         move to naming no project, the same way Coffer's pocket delete
         keeps every entry. Its ACTIONS go, because an action with no work
         behind it is a line nobody can place. */
      removeRec("project", r, "The project goes.",
        [acts.length ? cap(countWords(acts.length, "action", "actions")) + " on it " +
          (acts.length === 1 ? "goes" : "go") + " with it." : "",
         outs.length ? cap(countWords(outs.length, "output", "outputs")) +
          " stay, and stop naming a project." : "",
         hrs.length ? cap(countWords(hrs.length, "time entry", "time entries")) +
          " stay, against no project." : ""].filter(Boolean).join(" "),
        function () {
          var gone = acts.slice();
          gone.forEach(function (a) {
            var i = state.actions.indexOf(a);
            if (i >= 0) state.actions.splice(i, 1);
            dropLinks(ref("action", a.id));
          });
          outs.forEach(function (o) { o.projectId = ""; });
          hrs.forEach(function (h) { h.projectId = ""; });
          return { undo: function () {
            gone.forEach(function (a) { state.actions.push(a); });
            outs.forEach(function (o) { o.projectId = r.id; });
            hrs.forEach(function (h) { h.projectId = r.id; });
          } };
        });
    },
    "wf-add": function () { wfDialog(null); },
    "wf-edit": function (idv) { var r = needRec("workflow", idv); if (r) wfDialog(r); },
    "wf-del": function (idv) {
      var r = needRec("workflow", idv); if (!r) return;
      var runs = getWorkflowRuns(r.id);

  function stepOf(idv) {
    var p = String(idv || "").split("#");
    var w = byId("workflow", parseRef(p[0]).id || p[0].replace(/^workflow:/, ""));
    if (!w || !w.steps) { toast("That workflow is gone"); return null; }
    var s = w.steps.filter(function (x) { return x.id === p[1]; })[0];
    if (!s) { toast("That step is gone"); return null; }
    return { w: w, s: s };
  }

  /* COPYING IS NOT ASSUMED TO WORK. The clipboard API needs a permission
     and a secure context, so a failure hands the text over in a dialog the
     reader can select out of — a control that silently does nothing is
     worse than no control. */
  function copyOut(text, msg) {
    if (!text) { toast("There is nothing to copy"); return; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        toast(msg || "Copied");
      }, function () { handOver("copy.txt", text, "Copy it from here", ""); });
      return;
    }
    handOver("copy.txt", text, "Copy it from here", "");
  }

  function paintTheme() {
    var t = "";
    try { t = localStorage.getItem(THEME_KEY) || ""; } catch (e) { t = ""; }
    if (t) document.documentElement.setAttribute("data-theme", t);
    else document.documentElement.removeAttribute("data-theme");
  }

     Written here rather than in `renderNav()`, which belongs to the shared

  /* ---------------- keys ----------------

     A SHORTCUT IS A KEYBOARD ROUTE TO A CONTROL ALREADY ON THE SCREEN, so
     none of these needed a new action and none can do something a reader
     could not have done with a tap. */
  function wireKeys() {
    document.addEventListener("keydown", function (e) {
      var typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
      if (e.key === "Escape") {
        if (findOn) { closeFind(); return; }
        if (overlay && overlay.innerHTML) return;   /* the overlay owns its own Escape */
        if (openRec) { e.preventDefault(); goBack(); }
        return;
      }
      if ((e.ctrlKey || e.metaKey) && (e.key === "k" || e.key === "K")) {
        e.preventDefault(); openFind(); return;
      }
      if (findOn && e.key === "Enter") { e.preventDefault(); findFirst(); return; }
      if (typing) {
        if ((e.ctrlKey || e.metaKey) && (e.key === "s" || e.key === "S")) {
          /* Inside a TEXTAREA, Enter is a new line — so a body or a
             note was the one field you had to reach for the mouse from. */
          var ok = overlay && overlay.querySelector("[data-mok]");
          if (ok) { e.preventDefault(); ok.click(); }
        }
        return;
      }
      if (e.key === "/") { e.preventDefault(); openFind(); return; }
      if ((e.ctrlKey || e.metaKey) && (e.key === "s" || e.key === "S")) {
        var ok2 = overlay && overlay.querySelector("[data-mok]");
        if (ok2) { e.preventDefault(); ok2.click(); }
        else { e.preventDefault(); toast("Nothing is being edited"); }
        return;
      }
      if ((e.ctrlKey || e.metaKey) && (e.key === "z" || e.key === "Z")) {
        /* THE UNDO IS THE TOAST'S and lives exactly as long as the toast
           does. Keeping one reachable for longer would widen a real hole:
           the example, a restore and a wipe all REPLACE state, and a
           closure captured before that would mutate records the book no
           longer holds. */
        var u = document.querySelector("#toasts .toast button");
        e.preventDefault();
        if (u) u.click();
        else toast("The undo in this app is on the message it prints — there is none up");
        return;
      }
      if ((e.ctrlKey || e.metaKey) && (e.key === "n" || e.key === "N")) {
        var what = newHere();
        e.preventDefault();
        if (what) ACTIONS[what.act]("");
        else toast("Nothing to add on this screen — try Projects, Actions, " +
          "the library or the portfolio");
      }
    });
  }
  /* CTRL+N IS A TABLE, NOT A GUESS: what the screen you are on is a list
     OF. Home and the timeline are other screens' lists, so there it says so
     and names where it does work rather than silently doing nothing. */
  function newHere() {
    if (view === "career") {
      var p = pageNow("career");
      if (p === "roles") return { act: "role-add" };
      if (p === "education") return { act: "edu-add" };
      if (p === "training") return { act: "train-add" };
      if (p === "skills") return { act: "skill-add" };
      return null;
    }
    if (view === "work") {
      var w = pageNow("work");
      if (w === "projects") return { act: "proj-add" };
      if (w === "workflows") return { act: "wf-add" };
      if (w === "actions") return { act: "act-add" };
      if (w === "people") return { act: "person-add" };
      if (w === "equipment") return { act: "asset-add" };
      if (w === "outputs") return { act: "out-add" };
      if (w === "jobs") return { act: "job-add" };
      if (w === "hours") return { act: "hours-add" };
      return null;
    }
    if (view === "library") {
      var l = pageNow("library");
      var k = (PAGES.library.filter(function (x) { return x.id === l; })[0] || {}).lib;
      if (k === "reference") return { act: "cite-paste" };
      if (k) return { act: "lib-add-" + k };
      return { act: "lib-add-script" };
    }
    if (view === "show") {
      return pageNow("show") === "cvs" ? { act: "cv-add" } : { act: "port-add" };
    }
    return null;
  }
