<script>
  /* Runs before the stylesheet, so the theme is decided before the first
     paint. It has its own copy of the key expression because the main script
     has not loaded yet — the same reason Coffer's pre-paint reader repeats
     its own. Paper is the default, so only an explicit choice is stamped. */
  (function () {
    try {
      var t = localStorage.getItem("mashghal2.theme");
      if (t === "light" || t === "dark") {
        document.documentElement.setAttribute("data-theme", t);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", t === "dark" ? "#14171b" : "#f2ede2");
      }
    } catch (e) {}
  })();
</script>

  /* ================= The drafting sheet =================

     Mashghal holds one noun — a card — and one relation — a link. There is
     nothing for eight identity hues to identify, so this palette does what
     the old one could not: it spends ALL of its colour on state.

       · IDENTITY is a glyph and a WORD. A card's kind is text its owner
         typed ("sherd", "visa", "orthophoto"), so it can never have a
         palette entry — and a hue assigned by the app to a word it has
         never heard of would be decoration pretending to be meaning.
       · STATE is the only thing coloured: oxide is late, brass is drift,
         verdigris is in hand. Three rungs, each with a word beside it.

     The surface is a drawing rather than a dashboard. Square corners,
     hairlines instead of fills, one 2px rule under a heading, small-caps
     letterspaced annotations, a scale bar, a title block at the foot. Its
     owner reads site plans and ModelBuilder models professionally; this is
     that register, and it is the whole answer to "it looks generic". */

  :root {
    /* Paper. Warm, because a cold white sheet under a lamp reads as a screen. */
    --paper:   #efe9dc;
    --sheet:   #faf7f0;
    --raised:  #f5f1e7;
    --surface: #faf7f0;

    --ink:     #1b1f24;
    --ink-2:   #454c54;
    --faint:   #565d65;

    --rule:      #c8bfab;   /* a drawn hairline */
    --rule-mid:  #d8d0bd;
    --rule-dim:  #e6dfd0;
    --rule-hard: #1b1f24;   /* the 2px rule under a title */

    /* THERE IS NO `--receded`. It was a text colour in four of this repo's
       rounds and measured 2.63:1 here, on the kind word, the section counts
       and the breadcrumb separator — all of them things a reader has to
       read. Solving it for 4.6:1 landed within one point of `--faint`, which
       IS the answer: a fifth grey whose only honest value is the fourth
       one's does not exist. Dimmer is not the same as invisible. */

    /* State, and nothing else. */
    --oxide:  #a8352a;      /* late */
    --oxide-b:#f0dfdb;
    --brass:  #816109;      /* drift, waiting, stale */
    --brass-b:#efe6cd;
    --verd:   #23604f;      /* in hand, healthy */
    --verd-b: #daeae2;

    /* The one non-state colour: a blueprint annotation, for "you are here". */
    --nav-on:   #24395f;
    --nav-on-fg:#f6f3ec;

    --grid-fine: #ded5c2;
    --grid-bold: #cfc4ad;

    --ink-hover: #0d1014;

    /* Aliases the shared runtime reads. */
    --gain: #23604f;
    --loss: #a8352a;
    --warn: #8a6a12;
    --line-dim: #e6dfd0;

    --serif: "Newsreader", Georgia, "Times New Roman", serif;
    --disp:  "Mashghal Display", "Bricolage Grotesque", system-ui, sans-serif;
    --ui:    "Work Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono:  ui-monospace, "SF Mono", Menlo, Consolas, monospace;

    --fs-xs: 0.68rem;
    --fs-sm: 0.78rem;
    --fs-md: 0.88rem;
    --fs-lg: 1.05rem;

    --t: 110ms ease;
    --sbh: 0px;
  }

  /* Lamp-lit: the same drawing on a drafting table at night. The tokens keep
     their jobs — oxide is still late — they only move off paper. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #13161a; --sheet: #1a1e23; --raised: #1f242a; --surface: #1a1e23;
      --ink: #eae5da; --ink-2: #bdb7ab; --faint: #9aa0a7;
      --rule: #39414b; --rule-mid: #2c333b; --rule-dim: #242a31; --rule-hard: #cfc9bd;
      --oxide: #e9796a; --oxide-b: #38211e;
      --brass: #d6ad4a; --brass-b: #332b16;
      --verd: #65c0a3; --verd-b: #16302a;
      --nav-on: #7ba3dd; --nav-on-fg: #10141a;
      --grid-fine: #232a32; --grid-bold: #2f3842;
      --ink-hover: #ffffff;
      --gain: #65c0a3; --loss: #e9796a; --warn: #d6ad4a;
      --line-dim: #242a31;
    }
  }
  :root[data-theme="dark"] {
    --paper: #13161a; --sheet: #1a1e23; --raised: #1f242a; --surface: #1a1e23;
    --ink: #eae5da; --ink-2: #bdb7ab; --faint: #9aa0a7;
    --rule: #39414b; --rule-mid: #2c333b; --rule-dim: #242a31; --rule-hard: #cfc9bd;
    --oxide: #e9796a; --oxide-b: #38211e;
    --brass: #d6ad4a; --brass-b: #332b16;
    --verd: #65c0a3; --verd-b: #16302a;
    --nav-on: #7ba3dd; --nav-on-fg: #10141a;
    --grid-fine: #232a32; --grid-bold: #2f3842;
    --ink-hover: #ffffff;
    --gain: #65c0a3; --loss: #e9796a; --warn: #d6ad4a;
    --line-dim: #242a31;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--ui); font-size: var(--fs-md); line-height: 1.5;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  img { max-width: 100%; }
  [hidden] { display: none !important; }

  /* ---- the register ---- */

  /* Small caps, letterspaced, in the ink the drawing annotates with. Every
     label on every screen is set this way, because that is what a label on a
     drawing looks like and doing it per component is how eleven type sizes
     accumulated in Coffer. */
  .label, .ann, .sect, .rwhead, .tile .label, .field > .label,
  .modal-more > summary, .cbhead {
    font-family: var(--ui); font-size: var(--fs-xs); font-weight: 600;
    letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint);
  }

  h1, h2, h3 { font-family: var(--disp); font-weight: 500; letter-spacing: -0.015em; margin: 0; }
  h2 { font-size: 1.32rem; }
  h3 { font-size: var(--fs-lg); }

  /* A heading sits on a 2px rule, the way a drawing's does. */
  .page-head {
    display: flex; gap: 0.9rem; align-items: flex-end; justify-content: space-between;
    flex-wrap: wrap; padding-bottom: 0.5rem; margin-bottom: 1rem;
    border-bottom: 2px solid var(--rule-hard);
  }
  .page-head > div:first-child { min-width: 0; flex: 1 1 14rem; }
  .page-head h2 { overflow-wrap: anywhere; }
  .page-head p { margin: 0.2rem 0 0; color: var(--faint); font-size: var(--fs-sm); }
  .page-acts { display: flex; gap: 0.4rem; flex-wrap: wrap; }

  .sect {
    display: flex; align-items: center; gap: 0.6rem; margin: 1.5rem 0 0.6rem;
  }
  .sect::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
  .sect .n { font-family: var(--mono); letter-spacing: 0; color: var(--faint); }

  p.empty { color: var(--faint); font-size: var(--fs-sm); margin: 0.4rem 0; }
  .hint { display: block; color: var(--faint); font-size: var(--fs-xs); margin-top: 0.25rem; }
  .says { color: var(--faint); font-size: var(--fs-sm); margin: 0.2rem 0 0; }

  /* ---- shell ---- */

  .shell { display: flex; min-height: 100vh; align-items: flex-start; }
  .rail {
    position: sticky; top: 0; height: 100vh; width: 218px; flex: 0 0 218px;
    border-right: 1px solid var(--rule); background: var(--sheet);
    display: flex; flex-direction: column; gap: 0.9rem;
    padding: 1rem 0.75rem calc(0.75rem + env(safe-area-inset-bottom, 0px));
    overflow-y: auto;
  }
  /* The rail's order is stated, because `.railtop` is `display: contents` on
     a laptop so its children are the rail's own flex items — and the
     footer, second in the markup for the phone's top row, sat second in the
     column with `margin-top: auto` pushing everything after it down. */
  .brand { order: 1; display: flex; align-items: center; gap: 0.5rem; }
  .brand h1 { font-size: 1.05rem; }
  .brand-mark { display: inline-flex; }
  .railsub { order: 2;
    font-family: var(--mono); font-size: var(--fs-xs); color: var(--faint);
    letter-spacing: 0.04em;
  }
  #nav { order: 3; display: flex; flex-direction: column; gap: 0.15rem; }
  .tab {
    /* Positioned, because the phone's badge is absolute inside it: without
       this it resolved against the page and the count on the FIRST tab was
       drawn ten pixels past the right edge of a 320px screen. */
    position: relative;
    display: flex; align-items: center; gap: 0.55rem; width: 100%;
    padding: 0.42rem 0.55rem; border: 0; background: none; cursor: pointer;
    color: var(--ink-2); font: inherit; font-size: var(--fs-sm); text-align: left;
    border-left: 2px solid transparent; transition: var(--t);
  }
  .tab .ico { display: inline-flex; width: 18px; justify-content: center; color: var(--faint); }
  .tab:hover { color: var(--ink); background: var(--raised); }
  .tab[aria-current="page"] {
    color: var(--ink); font-weight: 600;
    border-left-color: var(--nav-on); background: var(--raised);
  }
  .tab[aria-current="page"] .ico { color: var(--nav-on); }
  .tab .badge {
    margin-left: auto; font-family: var(--mono); font-size: var(--fs-xs);
    color: var(--oxide); font-weight: 700;
  }

  .railquick { order: 4; display: flex; flex-direction: column; gap: 0.1rem; }
  .rwrow {
    display: flex; align-items: center; gap: 0.5rem; width: 100%;
    padding: 0.35rem 0.55rem; border: 0; background: none; cursor: pointer;
    color: var(--ink-2); font: inherit; font-size: var(--fs-sm); text-align: left;
    transition: var(--t);
  }
  .rwrow:hover { color: var(--ink); background: var(--raised); }
  .rwico { display: inline-flex; color: var(--faint); }
  .railme { order: 5; margin-top: auto; border-top: 1px solid var(--rule); padding-top: 0.6rem; }
  .gearbtn {
    display: flex; align-items: center; gap: 0.5rem; width: 100%; border: 0;
    background: none; cursor: pointer; color: var(--ink-2); font: inherit;
    font-size: var(--fs-sm); padding: 0.35rem 0.55rem; transition: var(--t);
  }
  .gearbtn:hover { color: var(--ink); background: var(--raised); }

  .view {
    flex: 1 1 auto; min-width: 0; max-width: 1180px;
    padding: 1.4rem 1.5rem calc(2.5rem + env(safe-area-inset-bottom, 0px));
  }

  /* The title block. Every drawing has one; it says what sheet this is, what
     it is drawn from and when — and here that is the honest place for the
     build string and the count of the record. */
  .titleblock {
    margin-top: 2.5rem; border: 1px solid var(--rule); background: var(--sheet);
    display: flex; flex-wrap: wrap;
  }
  .tbcell {
    flex: 1 1 8rem; min-width: 0; padding: 0.5rem 0.7rem;
    border-right: 1px solid var(--rule-dim);
  }
  .tbcell:last-child { border-right: 0; }
  .tbcell .label { display: block; }
  .tbcell b { font-family: var(--mono); font-size: var(--fs-sm); font-weight: 500; }

  /* ---- controls ---- */

  .btn {
    font: inherit; font-size: var(--fs-sm); cursor: pointer;
    padding: 0.36rem 0.7rem; border: 1px solid var(--rule);
    background: var(--sheet); color: var(--ink-2); text-decoration: none;
    display: inline-flex; align-items: center; gap: 0.35rem;
    transition: var(--t);

  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); font-weight: 600; }
  .btn.primary:hover { background: var(--ink-hover); border-color: var(--ink-hover); color: var(--paper); }
  .btn.quiet { border-color: transparent; background: none; }
  .btn.quiet:hover { border-color: var(--rule); }
  .btn.danger { color: var(--faint); }
  .btn.danger:hover { color: var(--oxide); border-color: var(--oxide); }
  #overlay .btn.danger { background: var(--oxide); border-color: var(--oxide); color: var(--paper); font-weight: 600; }
  #overlay .btn.danger:hover { color: var(--paper); }
  .btn.tiny { padding: 0.2rem 0.45rem; font-size: var(--fs-xs); }
  .btn[disabled] { opacity: 0.45; cursor: default; }

  /* One focus ring for every tappable thing, declared once. Chromium's own
     outline belongs to no design in this app, and it is what every whole-row
     control fell back to until this rule existed. */
  .btn:focus-visible, .tab:focus-visible, .rwrow:focus-visible,
  .gearbtn:focus-visible, .crow:focus-visible, .lmain:focus-visible,
  .chip:focus-visible, .bcrumb:focus-visible, .cvsheet:focus-visible,
  .cvmrow:focus-visible, .tbtn:focus-visible, input:focus-visible,
  select:focus-visible, textarea:focus-visible, summary:focus-visible {
    outline: 2px solid var(--nav-on); outline-offset: 1px;
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  .chip {
    font: inherit; font-size: var(--fs-xs); cursor: pointer;
    padding: 0.22rem 0.55rem; border: 1px solid var(--rule);
    background: none; color: var(--faint); transition: var(--t);
  }
  .chip:hover { color: var(--ink); border-color: var(--ink-2); }
  .chip[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); font-weight: 600; }
  .chips { display: flex; gap: 0.35rem; flex-wrap: wrap; }

  /* A state pill: the colour AND the word, always together. */
  .pill {
    display: inline-block; font-size: var(--fs-xs); font-weight: 700;
    letter-spacing: 0.06em; text-transform: uppercase; padding: 0.1rem 0.4rem;
    border: 1px solid currentColor; white-space: nowrap;
  }
  .p-late { color: var(--oxide); background: var(--oxide-b); }
  .p-drift { color: var(--brass); background: var(--brass-b); }
  .p-hand { color: var(--verd); background: var(--verd-b); }
  .p-calm { color: var(--faint); background: var(--rule-dim); }
  .p-done { color: var(--faint); background: none; }

  /* ---- a card, as a row ---- */

  .crow {
    display: flex; align-items: flex-start; gap: 0.6rem; width: 100%;
    padding: 0.55rem 0.7rem; border: 0; border-bottom: 1px solid var(--rule-dim);
    border-left: 2px solid transparent;
    background: var(--sheet); color: inherit; font: inherit; text-align: left;
    cursor: pointer; transition: var(--t);

  .crow:hover { background: var(--raised); }
  .crow.e-late { border-left-color: var(--oxide); }
  .crow.e-drift { border-left-color: var(--brass); }
  .crow.e-hand { border-left-color: var(--verd); }
  .crow.e-done .cname { color: var(--faint); text-decoration: line-through; text-decoration-thickness: 1px; }
  .rows { border: 1px solid var(--rule); border-bottom: 0; }
  .rows .crow:last-child { border-bottom: 1px solid var(--rule-dim); }

  .cglyph { flex: 0 0 auto; display: inline-flex; color: var(--faint); padding-top: 2px; }
  .cbody { flex: 1 1 0; min-width: 0; }
  .cname { font-weight: 600; overflow-wrap: anywhere; }
  /* A SUB-LINE IS A LINE. Left inline it ran straight on from the kind
     word: "Renew the visa VISAIts day was Sep 17" — two facts welded into
     one word. */
  .csub { display: block; color: var(--faint); font-size: var(--fs-sm); overflow-wrap: anywhere; }
  .ckind {
    font-family: var(--mono); font-size: var(--fs-xs); color: var(--faint);
    letter-spacing: 0.02em;
  }
  .cright { flex: 0 0 auto; display: flex; align-items: center; gap: 0.4rem; }
  .cwhen { font-family: var(--mono); font-size: var(--fs-xs); color: var(--faint); }
  .chev { color: var(--faint); display: inline-flex; }

  @media (max-width: 560px) {
    .crow { flex-wrap: wrap; }
    .cright { width: 100%; padding-left: 1.6rem; }

  /* ---- panels, tiles ---- */

  .panel { border: 1px solid var(--rule); background: var(--sheet); padding: 0.8rem 0.9rem; }
  .panel + .panel { margin-top: 0.6rem; }
  .panel.late { border-left: 2px solid var(--oxide); }
  .panel.drift { border-left: 2px solid var(--brass); }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: 0; border: 1px solid var(--rule); }
  .tile { padding: 0.7rem 0.8rem; border-right: 1px solid var(--rule-dim); background: var(--sheet); }
  .tile:last-child { border-right: 0; }
  .tile-fig { font-family: var(--disp); font-size: 1.6rem; line-height: 1.1; }
  .tile-fig.late { color: var(--oxide); }
  .tile-fig.drift { color: var(--brass); }
  .tile-fig.hand { color: var(--verd); }
  .tile-foot { color: var(--faint); font-size: var(--fs-xs); margin-top: 0.15rem; }
  @media (max-width: 560px) {
    .tiles { grid-template-columns: 1fr; }

            align-items: baseline; gap: 0.6rem; }

  .notes { display: flex; flex-direction: column; gap: 0.4rem; }

  .note-mark.warn { color: var(--brass); }

  .meter { height: 4px; background: var(--rule-dim); overflow: hidden; }
  .meter-fill { height: 100%; }
  .meter-pace { position: relative; }

  /* ---- the breadcrumb ---- */

  /* ---- the sheet ---- */

  .cvwrap { border: 1px solid var(--rule); background: var(--sheet); }
  .cvbox { position: relative; height: 62vh; min-height: 340px; }

  }
  .cvkeys {
    padding: 0.35rem 0.6rem; border-top: 1px solid var(--rule);
    font-size: var(--fs-xs); color: var(--faint);
  }
  .cvkeys kbd {
    font-family: var(--mono); font-size: 0.65rem; border: 1px solid var(--rule);
    padding: 0 0.2rem; color: var(--ink-2);

  /* the drawing's own colours, as classes so the theme toggle moves them */
  .n-box { fill: var(--sheet); stroke: var(--ink-2); }
  .n-oval { fill: var(--sheet); stroke: var(--ink-2); }
  /* `fill: none` IS NOT HIT-TESTABLE, and a dashed frame with a hollow
     middle is most of a holder's area — so a press inside one went
     straight through to the grid and panned the sheet instead of picking
     the card. `pointer-events: all` keeps the frame hollow and makes its
     interior answer a press, which is the whole reason the property
     exists. */
  .n-hold { fill: none; stroke: var(--ink-2); stroke-dasharray: 6 4; pointer-events: all; }
  .n-late { stroke: var(--oxide); }
  .n-drift { stroke: var(--brass); }
  .n-hand { stroke: var(--verd); }
  .n-done { stroke: var(--faint); stroke-dasharray: 4 3; }
  /* There is deliberately no `.n-calm`: WAITING CARRIES NO COLOUR. A card
     waiting three days against a five-day chase is not a problem, and the
     first build coloured it amber as though it were — so it keeps the
     neutral `.n-box` ink and says "waiting on someone" in words. */
  .n-sel { stroke: var(--nav-on); stroke-width: 2.5; fill: none; }
  .n-name { fill: var(--ink); font-family: var(--ui); font-size: 12.5px; font-weight: 600; }
  .n-kind {
    fill: var(--faint); font-family: var(--ui); font-size: 9.5px;
    letter-spacing: 0.1em; text-transform: uppercase;
  }
  .n-word {

    letter-spacing: 0.08em; text-transform: uppercase;
  }
  .w-late { fill: var(--oxide); }
  .w-drift { fill: var(--brass); }
  .w-hand { fill: var(--verd); }
  .w-calm { fill: var(--faint); }
  .w-done { fill: var(--faint); }
  .e-then { stroke: var(--ink-2); fill: none; }
  .e-with { stroke: var(--brass); fill: none; stroke-dasharray: 5 4; }
  .e-dead { stroke: var(--rule); fill: none; }

  .g-bold { stroke: var(--grid-bold); }

    overflow-y: auto; overscroll-behavior: contain;

    padding: 0.4rem 0.6rem; border: 0; background: none; cursor: pointer;
    color: var(--ink-2); font: inherit; font-size: var(--fs-sm); text-align: left;
    text-decoration: none; transition: var(--t);

  .cvmrow:hover { background: var(--raised); color: var(--ink); }
  .cvmrow.loud { color: var(--ink); font-weight: 600; }
  .cvmrow.danger { color: var(--faint); border: 0; }
  .cvmrow.danger:hover { color: var(--oxide); }
  .cvmsep { height: 1px; background: var(--rule-dim); }

  /* ---- the inspector strip ---- */

  /* PICKING A CARD MAY NOT MOVE THE SHEET UNDER THE FINGER. The strip is in
     the flow rather than floating (floated, it covered the zoom buttons),
     so it grows the moment a card is picked — which pushed every card
     down by the height of a row of buttons, and the next press landed on
     the grid or on a different card. A stated minimum is the fix: the
     empty strip is already as tall as the picked one. */
  .selstrip {
    display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap;
    padding: 0.45rem 0.55rem; border-bottom: 1px solid var(--rule);
    background: var(--raised); min-height: 3.4rem;

  .selstrip .who b { overflow-wrap: anywhere; }

  /* ---- the ask box ---- */

  .askbox { display: flex; gap: 0.4rem; flex-wrap: wrap; }
  .askbox input {
    flex: 1 1 14rem; min-width: 0; font: inherit; font-size: var(--fs-md);
    padding: 0.45rem 0.6rem; border: 1px solid var(--rule);
    background: var(--sheet); color: var(--ink);
  }

    padding: 0 0.7rem 0 0; border-bottom: 1px solid var(--rule-dim);
    background: var(--sheet);
  }
  .lrow:hover { background: var(--raised); }

    display: flex; align-items: center; gap: 0.6rem; flex: 1 1 0; min-width: 0;
    padding: 0.5rem 0.7rem; border: 0; background: none; color: inherit;

  .lq { font-family: var(--mono); font-size: var(--fs-xs); color: var(--faint); }

    width: 100%; min-width: 0;
  }
  .field textarea { resize: vertical; font-family: var(--ui); }
  .modal-more { grid-column: 1 / -1; margin-top: 0.7rem; }

    padding: 0.7rem 1rem; border-top: 1px solid var(--rule);

    padding: 0.5rem 0.7rem; font-size: var(--fs-sm);

    padding: 0.4rem 0.8rem;

  .fold { border: 1px solid var(--rule); background: var(--sheet); margin-top: 0.6rem; }

(function () {
  "use strict";

  /* ============================================================
     Mashghal — rev. 4. Two nouns.

     Its owner said the last one did not feel right, and then agreed with
     all four readings of why: it had no point of view, there was too much
     to learn, it looked generic, and it was wrong about their work. Three
     of those four are one fault with one cause.

     Seven rounds running, a new brief arrived and was folded into the old
     structure by asking "what does this app already have that answers
     this?" — so the record grew fifteen lists and the bar grew seven tabs,
     each of them a table the reader had to learn the name of before they
     could find anything. Jobs, projects, workflows, nodes, edges, runs,
     runNodes, actions, assets, people, personLinks, schedule, reports,
     timeEntries. Fourteen nouns for one person's work.

     Every one of them is the same two things:

       A CARD.  Something with a name. A project, a step, a person you are
                waiting on, a deadline, a laptop, a site, a scholarship.
       A LINK.  Either THEN (this comes after that) or WITH (these belong
                together, in no particular order).

     That is the whole model, and it is not a simplification of the brief —
     it is what the brief describes once you stop naming tables. A card
     OPTS INTO BEHAVIOUR rather than having a type:

       waits on someone · has a day · files the work away ·
       holds other cards · opens something · comes round again

     and they compose. A card that waits can be late. A card that files is
     what "unfiled" means. A card that holds is a project — or a site, or a
     job, or a thesis — by the same mechanism, so the app never has to know
     which. THAT is why it can no longer be wrong about the work: the only
     thing it knows about a card's kind is the word its owner typed.

     NOT ONE OF THE SIX BEHAVIOURS IS STORED. Four are read off the field
     that carries them — a day makes a card dated, a name makes it waiting,
     an interval makes it repeat, a path makes it openable — so there is no
     flag that can disagree with the field beside it. The two with no field
     of their own (holding work, filing it away) are the ONLY thing stated,
     as one `role`, for the same reason `parked` is stated in the old app:
     from the outside, a project holding nothing and a card holding nothing
     are the same thing and no derivation can tell them apart.

     And the sections are gone. There is no table to navigate to, because
     there is only one list of cards; a screen is a QUESTION over it. What
     is late is a list, because that is a list. How a piece of work goes is
     a drafting sheet, because that is a shape.
     ============================================================ */

  var BUILD = "w4 · 21 Sep 2026";

     the SITE and not the folder — which is exactly how Coffer's two paths
     came to share one ledger, and how loading the sample in one wiped the
     real book in the other. `mashghal2.v2` is a new key beside the old
     one, so w3's book is not read, not written and not lost: it is
     OFFERED, once, and imported only on a tap. */

  var OLD_KEY = "mashghal2.v1";
  var THEME_KEY = "mashghal2.theme";

     a hue the app assigned to a word it has never heard of would be

    dated: '<svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="3" y="5" width="14" height="12"/><path d="M3 8.6h14M6.6 3.2v3M13.4 3.2v3"/></svg>',
    repeats: '<svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M16.2 8.4A6.4 6.4 0 0 0 4.6 6.2"/><path d="M3.8 11.6A6.4 6.4 0 0 0 15.4 13.8"/><path d="M4.4 3v3.4h3.4M15.6 17v-3.4h-3.4"/></svg>',
    opens: '<svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M11 3.4h5.6V9"/><path d="M16.6 3.4L9.4 10.6"/><path d="M14 11.6v4a1.4 1.4 0 0 1-1.4 1.4H4.4A1.4 1.4 0 0 1 3 15.6V7.4A1.4 1.4 0 0 1 4.4 6h4"/></svg>',
    chev: '<svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M8 5.5l5 4.5-5 4.5"/></svg>',
    tick: '<svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4.4 10.4l3.6 3.4 7.6-8"/></svg>'
