  /* ---------------- the record ---------------- */

  /* Two lists, and the third is the questions you saved. There is no
     `does` object: every behaviour is read off the field that carries it,
     so no flag can disagree with the field beside it. */
  function blank() {
    return {
      version: 2,
      cards: [],
      links: [],
      lenses: [],
      settings: { owner: "", offered: false },
      forgotten: {}
    };
  }

  /* Anything added to the shape goes in one of these two places and
     nowhere else. Coffer lost grants out of a restored backup because two
     sites hand-copied one key list and only one of them was updated. */
  var STATE_LISTS = ["cards", "links", "lenses"];
  var STATE_MAPS = ["forgotten"];

  function adoptState(raw, shape) {
    var s = shape || blank();
    if (!raw || typeof raw !== "object") return s;
    STATE_LISTS.forEach(function (k) { if (Array.isArray(raw[k])) s[k] = raw[k]; });
    STATE_MAPS.forEach(function (k) {
      if (raw[k] && typeof raw[k] === "object" && !Array.isArray(raw[k])) s[k] = raw[k];
    });
    var t = raw.settings || {};
    s.settings.owner = typeof t.owner === "string" ? t.owner : "";
    s.settings.offered = !!t.offered;
    /* THE THEME IS NOT IN THE BOOK. It was, in `settings.theme`, beside a
       pre-paint reader that has to read `localStorage` because the main
       script has not loaded yet — two sources of truth for one fact, and
       they disagreed at once: the reader stamped `data-theme` before the
       first paint and `paintTheme()` then REMOVED it, because the freshly
       loaded book said nothing. Which theme this laptop shows is a fact
       about the laptop, like sync config, not part of the record. */
    return s;
  }

  /* ---------------- the six behaviours, none of them stored ----------------

     Four are the field: a day makes a card dated, a name makes it waiting,
     an interval makes it come round again, a path or a link makes it
     openable. The two with no field of their own are the only thing
     stated, as one `role`. */

  var ROLES = [
    { value: "", label: "Just itself" },
    { value: "holds", label: "It holds other cards" },
    { value: "files", label: "It files the work away" }
  ];

  function does(c) {
    return {
      dated: !!c.when,
      waits: !!c.waitOn,
      repeats: num(c.everyDays) > 0,
      opens: !!(c.path || c.url),
      holds: c.role === "holds",
      files: c.role === "files"
    };
  }

  function doesWords(c) {
    var d = does(c), out = [];
    if (d.holds) out.push("holds other cards");
    if (d.files) out.push("files the work away");
    if (d.dated) out.push("has a day");
    if (d.waits) out.push("waits on someone");
    if (d.repeats) out.push("comes round again");
    if (d.opens) out.push("opens something");
    return out;
  }

  /* ---------------- cards and links ---------------- */

  function cards() { return state.cards; }
  function byId(list, id) {
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }
  function card(id) { return byId(state.cards, id); }
  function cardName(id) {
    var c = card(id);
    if (c) return c.name;
    if (state.forgotten[id]) return state.forgotten[id] + " (removed)";
    return "(removed)";
  }

  function linksOf(id, rel) {
    return state.links.filter(function (l) {
      return (l.from === id || l.to === id) && (!rel || l.rel === rel);
    });
  }
  function comesAfter(id) {   // the cards this one comes after
    return state.links.filter(function (l) { return l.rel === "then" && l.to === id; })
      .map(function (l) { return card(l.from); }).filter(Boolean);
  }
  function comesBefore(id) {  // the cards that come after this one
    return state.links.filter(function (l) { return l.rel === "then" && l.from === id; })
      .map(function (l) { return card(l.to); }).filter(Boolean);
  }
  function alongside(id) {
    return linksOf(id, "with").map(function (l) {
      return card(l.from === id ? l.to : l.from);
    }).filter(Boolean);
  }
  function hasThen(id) {
    return state.links.some(function (l) { return l.rel === "then" && (l.from === id || l.to === id); });
  }
  function linkBetween(a, b, rel) {
    return state.links.filter(function (l) {
      return l.rel === rel && ((l.from === a && l.to === b) || (l.from === b && l.to === a));
    })[0] || null;
  }

  /* Containment is a single stated forward pointer and the reverse is
     walked, so the two can never disagree — the same discipline as the old
     app's `atId`. It is deliberately NOT a link: a step comes AFTER
     another step and a sherd is FOUND AT a site, and conflating those two
     would list the site among the things the step follows. */
  function heldBy(id) { return state.cards.filter(function (c) { return c.in === id; }); }
  function holders() { return state.cards.filter(function (c) { return c.role === "holds"; }); }
  function trailOf(id) {
    var out = [], seen = {}, c = card(id);
    while (c && c.in && !seen[c.in]) {
      seen[c.in] = 1;
      c = card(c.in);
      if (c) out.unshift(c);
    }
    return out;
  }
  /* Everything at or below a card, so a picker can refuse to file something
     inside itself — a loop would make both pages recurse. */
  function underneath(id) {
    var out = [], stack = [id], seen = {};
    while (stack.length) {
      var at = stack.pop();
      heldBy(at).forEach(function (c) {
        if (seen[c.id]) return;
        seen[c.id] = 1; out.push(c); stack.push(c.id);
      });
    }
    return out;
  }

  /* ---------------- the ladder ----------------

     Ten rungs and they PARTITION the cards: every card is on exactly one,
     so the tiles on Now are the list's own parts and a figure can never
     disagree with what is under it. There is a test that adds them up.

     Nothing about it is stored. Late is not a flag — it is a date that has
     gone by, a chase interval that has run out, or an interval since the
     last time something was done. */

  var RUNGS = {
    late:    { word: "Late",                  tone: "late",  rank: 1 },
    due:     { word: "Due again",             tone: "drift", rank: 2 },
    unfiled: { word: "Not filed",             tone: "drift", rank: 3 },
    today:   { word: "Today",                 tone: "hand",  rank: 4 },
    /* EVERY WORD ON THE LADDER HAS TO FIT A CARD ON THE SHEET. "Waiting on
       earlier work" is 130px of small caps against a 158px card, so on the
       drawing it ran out of both sides of the card and straight through the
       kind word beside it. Shortening the sheet's copy alone would be two
       vocabularies for one ladder, so the ladder's own words are short and
       the SENTENCE beside them carries the rest — "Blocked" over "After Fix
       their notes." says more than the long pill did. */
    hand:    { word: "Yours to do",           tone: "hand",  rank: 5 },
    waiting: { word: "Waiting",               tone: "calm",  rank: 6 },
    blocked: { word: "Blocked",               tone: "calm",  rank: 7 },
    calm:    { word: "Not yet due",           tone: "calm",  rank: 8 },
    done:    { word: "Done",                  tone: "done",  rank: 9 },
    thing:   { word: "",                      tone: "",      rank: 10 }
  };

  /* A card is WORK if something about it can come due. A laptop, a person
     and a reference photograph are cards too and they are not on the
     ladder at all — they carry no pill, because a state nobody stated and
     nothing derives is not a state. */
  function doable(c) {
    var d = does(c);
    /* A HOLDER IS ON THE LADDER EXACTLY WHEN ITS RUNG SAYS IT IS. Left out
       of this test, a project whose step was late landed in Now's Late
       section while `openCards()` refused to count it — the sections summed
       to fourteen under a figure reading twelve, which is the one thing a
       partition exists to make impossible. */
    if (d.holds) return holderRung(c) !== "thing";
    return d.dated || d.waits || d.repeats || d.files || hasThen(c.id);
  }

  function chaseSince(c) { return c.chasedOn || c.madeOn || ""; }

  /* Why a card is late, in words, or "". A chase interval of nought is not
     a chase: a wait nobody said when to chase can sit for ever without
     being called late. */
  function lateWhy(c) {
    var d = does(c);
    if (c.doneAt) return "";
    if (d.dated && c.when && c.when < today()) {
      var n = daysBetween(c.when, today());
      return "its day was " + plainDate(c.when) + ", " + numWord(n) + " " + (n === 1 ? "day" : "days") + " ago";
    }
    if (d.waits && num(c.chaseDays) > 0 && chaseSince(c)) {
      var w = daysBetween(chaseSince(c), today());
      if (w >= num(c.chaseDays))
        return "waiting " + numWord(w) + " " + (w === 1 ? "day" : "days") +
          " on " + c.waitOn + ", and " + numWord(num(c.chaseDays)) + " was the chase";
    }
    return "";
  }

  function dueIn(c) {   // for a card that comes round again
    if (!does(c).repeats) return null;
    var every = num(c.everyDays);
    if (!c.lastDoneOn) return 0;
    return daysBetween(today(), addDays(c.lastDoneOn, every));
  }

  function earlierUndone(c) {
    return comesAfter(c.id).filter(function (p) {
      return doable(p) && !p.doneAt && !(does(p).repeats);
    });
  }

  /* A HOLDER'S RUNG IS THE WORST OF WHAT IT HOLDS, and its own missed date
     if that is worse. Read off its own fields alone, a project holding a
     late step read "In your hands — nothing is in the way" on its row and
     "Late · one of seven done" on its own page, twelve pixels apart: two
     answers to one question, which is the fault this whole rebuild is
     about, at the size of one card. It stays a partition, so the tiles are
     still the list's own parts. */
  function rungOf(c) {
    if (does(c).holds) return holderRung(c);
    if (!doable(c)) return "thing";
    var d = does(c);
    if (d.repeats) {
      if (c.doneAt) return "done";
      return dueIn(c) <= 0 ? "due" : "calm";
    }
    if (c.doneAt) return "done";
    if (lateWhy(c)) return "late";
    if (earlierUndone(c).length) return "blocked";
    if (d.files) return "unfiled";
    if (d.dated && c.when === today()) return "today";
    if (d.waits) return "waiting";
    return "hand";
  }

  function holderRung(c) {
    /* Only the non-holders inside it, so a nested project cannot recurse
       back into this function. */
    var work = underneath(c.id).filter(function (x) { return !does(x).holds && doable(x); });
    var mine = "";
    if (c.doneAt) mine = "done";
    else if (lateWhy(c)) mine = "late";
    else if (does(c).dated && c.when === today()) mine = "today";
    if (!work.length) return mine || "thing";
    var worst = "";
    work.forEach(function (x) {
      var k = rungOf(x);
      if (!worst || RUNGS[k].rank < RUNGS[worst].rank) worst = k;
    });
    if (mine && RUNGS[mine].rank < RUNGS[worst].rank) return mine;
    return worst;
  }

  function rung(c) {
    var k = rungOf(c), r = RUNGS[k];
    return { key: k, word: r.word, tone: r.tone, rank: r.rank };
  }

  /* One sentence saying where a card stands, built from the same functions
     the pill is built from — so the word and the sentence under it cannot
     disagree. */
  function stop(s) { return /[.?!…]$/.test(s) ? s : s + "."; }

  function standSays(c) {
    var k = rungOf(c), d = does(c);
    if (does(c).holds) return holderSays(c);
    if (k === "late") return cap(lateWhy(c)) + ".";
    if (k === "due") {
      var over = -dueIn(c);
      return "Last done " + (c.lastDoneOn ? plainDate(c.lastDoneOn) : "never") +
        ", every " + everyWords(num(c.everyDays)) +
        (c.lastDoneOn ? " — " + numWord(over) + " " + (over === 1 ? "day" : "days") + " over." : ".");
    }
    if (k === "calm") return "Every " + everyWords(num(c.everyDays)) + ", next in " +
      numWord(dueIn(c)) + " " + (dueIn(c) === 1 ? "day" : "days") + ".";
    if (k === "unfiled") return "The work before it is finished. This is the filing.";
    if (k === "today") return "Its day is today.";
    if (k === "waiting") {
      /* TWO SENTENCES MAY NOT RUN TOGETHER. "With N. Haddad and L. Mroueh
         three days" read as a sentence that had lost a word, because a list
         of names ran straight into a count with nothing between them. */
      var w = chaseSince(c) ? daysBetween(chaseSince(c), today()) : 0;
      return "With " + c.waitOn +
        (w > 0 ? " for " + numWord(w) + " " + (w === 1 ? "day" : "days") : " since today") +
        (num(c.chaseDays) > 0
          ? "; chase after " + numWord(num(c.chaseDays)) + "."
          : "; no chase set, so it is never called late.");
    }
    if (k === "blocked") {
      var e = earlierUndone(c);
      /* A name can end in a question mark, and "Do we go round again?." is
         a sentence that lost an argument with its own punctuation. */
      return stop("After " + listWords(e.map(function (p) { return p.name; })));
    }
    if (k === "hand") return "Nothing is in the way. Yours to do.";
    if (k === "done") return "Done " + plainDate(c.doneAt) + ".";
    return doesWords(c).length ? cap(listWords(doesWords(c))) + "." : "";
  }

  /* ---------------- the counts the screens are built from ----------------

     One selector per question. Now's tiles, the tab badge and every
     section heading read these, so the figure and its parts are the same
     walk. */

  /* THE LADDER IS OVER WORK, AND A HOLDER IS NOT WORK. A holder still
     carries a derived rung, so its row can never contradict its own page —
     but it is not COUNTED, because Now answers "what needs me" and a
     project does not need you: the step inside it does. Counted, the
     example's two late steps read "five things are late", three of them
     being the containers of the other two. So the tiles and the sections
     are one walk over `workCards()`, and the whole book is those plus the
     holders. */
  function workCards() {
    return state.cards.filter(function (c) { return !does(c).holds; });
  }
  function openCards() {
    return workCards().filter(function (c) { return doable(c) && rungOf(c) !== "done"; });
  }
  function onRung(key) {
    return workCards().filter(function (c) { return rungOf(c) === key; });
  }
  function rungCounts() {
    var out = {};
    Object.keys(RUNGS).forEach(function (k) { out[k] = 0; });
    workCards().forEach(function (c) { out[rungOf(c)]++; });
    return out;
  }
  function lateCount() { return onRung("late").length; }

  function worstFirst(list) {
    return list.slice().sort(function (a, b) {
      var ra = rung(a).rank, rb = rung(b).rank;
      if (ra !== rb) return ra - rb;
      var da = a.when || a.doneAt || "9999", db = b.when || b.doneAt || "9999";
      if (da !== db) return da < db ? -1 : 1;
      return a.name.localeCompare(b.name);
    });
  }

  /* A holder's standing, read off what is in it rather than stored, and it
     is the SAME walk `holderRung()` reads — so the pill on the row and the
     progress on the page cannot disagree. */
  function holderStand(c) {
    var work = underneath(c.id).filter(function (x) { return !does(x).holds && doable(x); });
    var r = rung(c);
    var done = work.filter(function (x) { return rungOf(x) === "done"; }).length;
    return { word: r.word || "Nothing in it yet", tone: r.tone || "calm",
      done: done, total: work.length, held: heldBy(c.id).length };
  }
  /* AND IT NAMES THE BASIS OF ITS OWN FIGURE. "What it holds: 9" over
     "1 of 7 done" is two counts side by side that a reader can see
     disagree; the nine are the cards in it and the seven are the ones that
     can come due, so the sentence says which. */
  function holderSays(c) {
    var st = holderStand(c);
    if (!st.total) {
      return st.held
        ? "Nothing in it can come due — the " + numWord(st.held) +
          (st.held === 1 ? " card" : " cards") + " in it are things, not work."
        : "Nothing is filed under it yet.";
    }
    /* "one of the seven pieces of work in it ARE done" — the verb follows
       the count that is the subject, not the noun beside it. */
    /* "nought of the three" and "three of the three ... are done" under the
       word Done are both the arithmetic showing through the sentence. */
    if (st.done === st.total) {
      return st.total === 1
        ? "The one piece of work in it is done."
        : "All " + numWord(st.total) + " pieces of work in it are done.";
    }
    /* THE PILL CARRIES THE WORD, so the sentence beside it does not. Every
       surface that prints this prints the pill too, and "LATE  Late · one of
       the seven —" is the state said twice in one line. */
    return cap((st.done === 0 ? "none" : numWord(st.done)) + " of the " + numWord(st.total) +
      (st.total === 1 ? " piece" : " pieces") + " of work in it " +
      (st.done === 1 ? "is" : "are") + " done" + (st.done === 0 ? " yet" : "")) + ".";
  }

  /* ---------------- words ---------------- */

  function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
  var NUMS = ["nought", "one", "two", "three", "four", "five", "six", "seven",
    "eight", "nine", "ten", "eleven", "twelve"];
  /* A small count in prose is a WORD; a figure in a tile or a heading stays
     a figure. "1 steps" is what a source scan for this never catches. */
  function numWord(n) { n = Math.round(n); return n >= 0 && n < NUMS.length ? NUMS[n] : String(n); }
  function everyWords(n) {
    if (n === 1) return "day";
    if (n === 7) return "week";
    if (n === 14) return "fortnight";
    if (n === 30 || n === 31) return "month";
    if (n === 365) return "year";
    return numWord(n) + " days";
  }
  /* A SMALL COUNT IN PROSE IS A WORD; a figure in a tile, a title block or
     a heading stays a figure. "1 line in the book" is what no source scan
     for this ever catches. */
  function countWords(n, one, many) {
    return numWord(n) + " " + (n === 1 ? one : many);
  }
  function listWords(a) {
    if (!a.length) return "";
    if (a.length === 1) return a[0];
    if (a.length === 2) return a[0] + " and " + a[1];
    return a.slice(0, -1).join(", ") + " and " + a[a.length - 1];
  }
  function plainDate(s) {
    if (!s) return "";
    var d = parseISO(s);
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  }
  /* Past about a month a count of days stops being an answer — nobody holds
     four months as a number of days — and under a month elapsed time places
     a thing in this week without arithmetic. */
  function agoWords(s) {
    if (!s) return "";
    var n = daysBetween(s, today());
    if (n === 0) return "today";
    if (n === 1) return "yesterday";
    if (n < 0) return "in " + numWord(-n) + " " + (n === -1 ? "day" : "days");
    if (n <= 30) return numWord(n) + " days ago";
    return plainDate(s);
  }
  /* A clip that cuts mid-word can say the opposite of what it meant: "while
     there are notes" cut at sixty read "…while there are no…". Breaking at
     the last space inside the limit, the worst it can do is stop a word
     early. */
  function clip(s, n) {
    s = String(s == null ? "" : s);
    if (s.length <= n) return s;
    var cut = s.slice(0, n), sp = cut.lastIndexOf(" ");
    return (sp > n * 0.5 ? cut.slice(0, sp) : cut).replace(/[ ,;:.]+$/, "") + "…";
  }
  /* A finding, then the one thing to do about it, always that way round and
     the second always the quieter one. */
  function emptyLines(a, b) {
    return '<p class="empty"><b style="color:var(--ink-2)">' + esc(a) + "</b><br />" + esc(b) + "</p>";
  }
  /* A date has to EXIST, not merely be shaped like one: the shape regex
     passes 2026-13-45, which stores, parses to Invalid Date and then
     appears on no screen at all. */
  function dayOk(v) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) return false;
    var d = parseISO(v);
    return !isNaN(d.getTime()) && iso(d) === v;
  }

  /* ============================================================
     A LENS IS A QUESTION, AND IT SAYS HOW IT READ YOURS.

     There are no sections to navigate to, so the way you reach a handful
     of cards out of six hundred is to ask for them. The language is small
     and it is WRITTEN ON THE SCREEN, because a box that can be asked
     anything and says nothing about what it understood is a box nobody
     asks twice — and a wrong answer to a question it misread is
     indistinguishable from a wrong answer.

     There is no model behind it and there never will be: a key is a secret
     in a public repository, a network is a thing this app does not have,
     and something guessing between a reader and their own record is the
     fault every rule in this app is written against. So the terms are
     matched, every one of them has to hit (a second word NARROWS, or
     typing more would widen the search), and anything it could not read is
     named rather than dropped.
     ============================================================ */

  /* A TERM THAT NAMES A RUNG READS THE SAME WALK THE SCREENS READ. The
     ladder is over work — a holder carries a derived rung for its own row
     and is not counted — so "late" had to mean the same thing here as on
     Now, or the saved question "Everything late" answered five under a tile
     reading two. `rung: true` is the mark, and `lensParse` wraps it. */
  var TERMS = [
    { word: "late", says: "a piece of work past its day, or past its chase",
      rung: true, test: function (c) { return rungOf(c) === "late"; } },
    { word: "due", says: "upkeep past its interval",
      rung: true, test: function (c) { return rungOf(c) === "due"; } },
    { word: "unfiled", says: "finished work that was never filed",
      rung: true, test: function (c) { return rungOf(c) === "unfiled"; } },
    { word: "today", says: "its day is today",
      rung: true, test: function (c) { return rungOf(c) === "today"; } },
    { word: "mine", says: "yours to do — nothing in the way",
      rung: true, test: function (c) { return rungOf(c) === "hand"; } },
    { word: "waiting", says: "waiting on somebody",
      rung: true, test: function (c) { return rungOf(c) === "waiting"; } },
    { word: "blocked", says: "waiting on earlier work",
      rung: true, test: function (c) { return rungOf(c) === "blocked"; } },
    { word: "done", says: "finished",
      rung: true, test: function (c) { return rungOf(c) === "done"; } },
    { word: "open", says: "work that is not finished",
      rung: true, test: function (c) { return doable(c) && rungOf(c) !== "done"; } },
    { word: "thing", says: "not work at all — a person, a tool, a photograph",
      rung: true, test: function (c) { return rungOf(c) === "thing"; } },
    { word: "holds", says: "it holds other cards",
      test: function (c) { return does(c).holds; } },
    { word: "files", says: "it files the work away",
      test: function (c) { return does(c).files; } },
    { word: "dated", says: "it has a day",
      test: function (c) { return does(c).dated; } },
    { word: "waits", says: "it waits on someone",
      test: function (c) { return does(c).waits; } },
    { word: "repeats", says: "it comes round again",
      test: function (c) { return does(c).repeats; } },
    { word: "opens", says: "it has a file or a link to open",
      test: function (c) { return does(c).opens; } }
  ];
  var TERM_BY = {};
  TERMS.forEach(function (t) { TERM_BY[t.word] = t; });

  function lensParse(q) {
    var out = { tests: [], read: [], unread: [] };
    String(q || "").trim().split(/\s+/).forEach(function (raw) {
      if (!raw) return;
      var w = raw.toLowerCase();
      if (TERM_BY[w]) {
        var T = TERM_BY[w];
        out.tests.push(T.rung
          ? function (c) { return !does(c).holds && T.test(c); }
          : T.test);
        out.read.push(T.says);
        return;
      }
      var m = /^(kind|in|with):(.+)$/.exec(w);
      if (m) {
        var v = m[2];
        if (m[1] === "kind") {
          out.tests.push(function (c) { return (c.kind || "").toLowerCase().indexOf(v) >= 0; });
          out.read.push('its kind carries "' + m[2] + '"');
        } else if (m[1] === "in") {
          out.tests.push(function (c) {
            return trailOf(c.id).some(function (h) { return h.name.toLowerCase().indexOf(v) >= 0; });
          });
          out.read.push('it is filed under something called "' + m[2] + '"');
        } else {
          out.tests.push(function (c) {
            return alongside(c.id).some(function (o) { return o.name.toLowerCase().indexOf(v) >= 0; });
          });
          out.read.push('it belongs with something called "' + m[2] + '"');
        }
        return;
      }
      if (/^[a-z]+:/.test(w)) { out.unread.push(raw); return; }
      out.tests.push(function (c) {
        return (c.name + " " + (c.kind || "") + " " + (c.note || "") + " " + (c.waitOn || ""))
          .toLowerCase().indexOf(w) >= 0;
      });
      out.read.push('its name, kind or note carries "' + raw + '"');
    });
    return out;
  }

  function lensRun(q) {
    var p = lensParse(q);
    var rows = p.tests.length
      ? state.cards.filter(function (c) { return p.tests.every(function (t) { return t(c); }); })
      : [];
    return { rows: worstFirst(rows), read: p.read, unread: p.unread, asked: !!p.tests.length };
  }

  function lensTable() {
    /* The left column is a literal you type, so it is set in mono at its
       own case: small-capped by the facts table's own label style, "in:name"
       read as "IN:NAME" and stopped looking like something to type. */
    return '<table class="facts lens"><tbody>' + TERMS.map(function (t) {
      return "<tr><th>" + esc(t.word) + "</th><td>" + esc(t.says) + "</td></tr>";
    }).join("") +
      "<tr><th>—</th><td>the words above are about WORK. A card that holds other cards " +
      "carries its own standing on its row, and is reached with <b>holds</b>.</td></tr>" +
      '<tr><th>kind:<i>word</i></th><td>its kind carries that word — your own word, ' +
      "whatever you typed</td></tr>" +
      '<tr><th>in:<i>name</i></th><td>filed under something with that name, at any depth</td></tr>' +
      '<tr><th>with:<i>name</i></th><td>linked WITH something of that name</td></tr>' +
      "<tr><th>anything else</th><td>looked for in the name, the kind, the note and " +
      "who you are waiting on</td></tr></tbody></table>";
  }

  /* The word to type to get a rung back. The rungs and the terms are two
     renderings of one ladder, so the mapping is stated in one place rather
     than guessed at by testing a sample card. */
  var RUNG_WORD = { late: "late", due: "due", unfiled: "unfiled", today: "today",
    hand: "mine", waiting: "waiting", blocked: "blocked", done: "done", thing: "thing" };
  function askWordFor(k) { return RUNG_WORD[k] || "open"; }

  /* ============================================================
     THE SHEET.

     ArcGIS ModelBuilder, deliberately: its owner reads that vocabulary
     professionally, and it already carries the meaning — a cut-corner
     rectangle is a process, an oval is data, an arrow is the flow of work.
     A dashed frame is the one addition, and it is the one this model
     needs: a card that HOLDS other cards is a sheet of its own.

     Three rules, and all three are rules against being clever:

       · A NEW CARD LANDS WHERE YOU ARE LOOKING, and joins nothing unless
         you say what it comes after. A hidden auto-connection is a
         sequence the app wrote.
       · NOTHING RE-LAYS-OUT ON ITS OWN. Tidy is a button, so adding one
         card to a forty-card sheet cannot throw away positions somebody
         placed by hand.
       · THE READER OWNS THE ORDER. Nothing infers a dependency and
         nothing draws a line the record does not hold.

     The sheet is always SCOPED to one holder, with a breadcrumb, the way
     ModelBuilder shows one model rather than every model at once. That is
     what stops it becoming the six-hundred-card hairball the one-list
     model would otherwise draw.
     ============================================================ */

  /* `fitted` starts as null and not "": the top sheet's own id IS "", so an
     empty string here meant the first sheet anybody opened was never
     fitted at all. */
  var CV = { scale: 1, ox: 0, oy: 0, sel: "", nextSeen: 0, fitted: null, max: false };
  var NW = 176, NH = 52;

  function sheetCards() { return heldBy(sheetIn); }
  function sheetIds() {
    var m = {};
    sheetCards().forEach(function (c) { m[c.id] = 1; });
    return m;
  }
  /* Only the lines whose BOTH ends are on this sheet. A line to a card one
     level up would be drawn to nowhere. */
  function sheetLinks() {
    var on = sheetIds();
    return state.links.filter(function (l) { return on[l.from] && on[l.to]; });
  }

  /* A back edge is a DFS stack test and nothing else works. "Is the target
     to the left" calls a forward edge a loop; comparing depth calls a JOIN
     a loop; plain reachability flags every edge in the cycle. Only "points
     at a card still on the stack" marks exactly the edge that closes it. */
  function backEdges() {
    var ls = sheetLinks().filter(function (l) { return l.rel === "then"; });
    var out = {}, next = {};
    ls.forEach(function (l) { (next[l.from] = next[l.from] || []).push(l); });
    var colour = {};
    function walk(id) {
      colour[id] = 1;
      (next[id] || []).forEach(function (l) {
        if (colour[l.to] === 1) out[l.id] = 1;
        else if (!colour[l.to]) walk(l.to);
      });
      colour[id] = 2;
    }
    sheetCards().forEach(function (c) { if (!colour[c.id]) walk(c.id); });
    return out;
  }

  function cvDepths() {
    var on = sheetIds(), ls = sheetLinks().filter(function (l) { return l.rel === "then"; });
    var into = {}, next = {};
    ls.forEach(function (l) {
      (next[l.from] = next[l.from] || []).push(l.to);
      into[l.to] = (into[l.to] || 0) + 1;
    });
    var d = {}, q = [];
    sheetCards().forEach(function (c) { if (!into[c.id]) { d[c.id] = 0; q.push(c.id); } });
    if (!q.length) sheetCards().forEach(function (c) { d[c.id] = 0; });
    /* Shortest distance from any way in, not a depth-first walk: a DFS put
       the second of two parallel ways in after everything the first leads
       to, so the sheet listed a step before the one it follows. The
       minimum also ignores a back edge for free — the loop's target
       already has a smaller depth. */
    while (q.length) {
      var at = q.shift();
      (next[at] || []).forEach(function (to) {
        if (!on[to]) return;
        var v = d[at] + 1;
        if (d[to] == null || v < d[to]) { d[to] = v; q.push(to); }
      });
    }
    sheetCards().forEach(function (c) { if (d[c.id] == null) d[c.id] = 0; });
    return d;
  }

  /* Reading order: the order Tidy places them, so walking with the arrow
     keys matches what is on the screen. */
  function cvOrder() {
    var d = cvDepths();
    return sheetCards().slice().sort(function (a, b) {
      if (d[a.id] !== d[b.id]) return d[a.id] - d[b.id];
      if ((a.y || 0) !== (b.y || 0)) return (a.y || 0) - (b.y || 0);
      return (a.x || 0) - (b.x || 0);
    });
  }

  function cvLayout() {
    var d = cvDepths(), cols = {};
    cvOrder().forEach(function (c) {
      var k = d[c.id];
      (cols[k] = cols[k] || []).push(c);
    });
    var out = {};
    Object.keys(cols).forEach(function (k) {
      cols[k].forEach(function (c, i) {
        out[c.id] = { x: 60 + Number(k) * (NW + 74), y: 60 + i * (NH + 42) };
      });
    });
    return out;
  }
  function cvApplyLayout() {
    var pos = cvLayout(), n = 0;
    sheetCards().forEach(function (c) {
      var p = pos[c.id];
      if (!p) return;
      if (c.x !== p.x || c.y !== p.y) n++;
      c.x = p.x; c.y = p.y; c.updatedAt = new Date().toISOString();
    });
    return n;
  }

  /* A CARD WITH NO POSITION HAS NEVER BEEN PLACED, so placing it is not a
     re-layout. "Nothing re-lays-out on its own" is about throwing away a
     position somebody chose; seeding one nobody has chosen is the opposite,
     and without it nobody ever meets a sheet drawing every card on top of
     every other card at the origin — which is what the sample did, and it
     read as a sheet holding one card. An unplaced card among placed ones
     is nudged clear rather than re-ranking the sheet. */
  function cvSeed() {
    var cs = sheetCards();
    var need = cs.filter(function (c) { return !c.x && !c.y; });
    if (!need.length) return false;
    var pos = cvLayout();
    if (need.length === cs.length) {
      need.forEach(function (c) {
        var p = pos[c.id];
        if (p) { c.x = p.x; c.y = p.y; c.updatedAt = new Date().toISOString(); }
      });
    } else {
      need.forEach(function (c) {
        var p = pos[c.id] || { x: 60, y: 60 };
        var x = p.x, y = p.y;
        for (var guard = 0; guard < 80; guard++) {
          var clash = cs.some(function (o) {
            return o !== c && (o.x || o.y) &&
              Math.abs((o.x || 0) - x) < NW * 0.7 && Math.abs((o.y || 0) - y) < NH * 0.9;
          });
          if (!clash) break;
          x += 34; y += 30;
        }
        c.x = Math.round(x); c.y = Math.round(y);
        c.updatedAt = new Date().toISOString();
      });
    }
    save();
    return true;
  }

  /* Where a new card lands: the middle of what is actually in view, nudged
     until it is not on top of something. Two cards added in a row landed
     on each other, because the centre of the view does not move between
     two adds — and a sheet that draws one card where the record holds two
     is a drawing that lies. */
  function cvCentre() {
    var box = document.querySelector(".cvbox");
    var w = box ? box.clientWidth : 900, h = box ? box.clientHeight : 500;
    var x = (-CV.ox + w / 2) / CV.scale - NW / 2;
    var y = (-CV.oy + h / 2) / CV.scale - NH / 2;
    for (var guard = 0; guard < 60; guard++) {
      var clash = sheetCards().some(function (c) {
        return Math.abs((c.x || 0) - x) < NW * 0.7 && Math.abs((c.y || 0) - y) < NH * 0.9;
      });
      if (!clash) break;
      x += 34; y += 30;
    }
    return { x: Math.round(x), y: Math.round(y) };
  }

  function cvBounds() {
    var cs = sheetCards();
    if (!cs.length) return { x: 0, y: 0, w: 900, h: 500 };
    var x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9;
    cs.forEach(function (c) {
      x1 = Math.min(x1, c.x || 0); y1 = Math.min(y1, c.y || 0);
      x2 = Math.max(x2, (c.x || 0) + NW); y2 = Math.max(y2, (c.y || 0) + NH);
    });
    return { x: x1, y: y1, w: x2 - x1, h: y2 - y1 };
  }

  function cvMinScale() {
    return window.innerWidth < 620 ? 0.7 : 0.45;
  }

  /* The fit anchors when it is floored, then is pulled back so the view
     never shows more empty sheet than work: the floor pins the zoom, so
     spare room in an axis is room nothing can use, and half a phone of
     blank grid above the first card reads as the work having been lost. */
  function cvFit() {
    var box = document.querySelector(".cvbox");
    if (!box) return;
    var w = box.clientWidth, h = box.clientHeight, b = cvBounds();
    var s = Math.min(w / (b.w + 100), h / (b.h + 100), 1.3);
    var floor = cvMinScale();
    if (s < floor) {
      s = floor;
      var anchor = card(CV.sel) || cvFocus();
      CV.scale = s;
      if (anchor) {
        CV.ox = -((anchor.x || 0) + NW / 2) * s + w / 2;
        CV.oy = -((anchor.y || 0) + NH / 2) * s + h / 2;
      } else { CV.ox = 0; CV.oy = 0; }
      CV.ox = Math.min(CV.ox, -b.x * s + 40);
      CV.oy = Math.min(CV.oy, -b.y * s + 40);
      CV.ox = Math.max(CV.ox, -(b.x + b.w) * s + w - 40);
      CV.oy = Math.max(CV.oy, -(b.y + b.h) * s + h - 40);
      return;
    }
    CV.scale = s;
    CV.ox = -b.x * s + (w - b.w * s) / 2;
    CV.oy = -b.y * s + (h - b.h * s) / 2;
    /* A SHORT GRAPH IS NOT CENTRED IN A TALL VIEW. One row of cards in a
       580px box put a quarter of a screen of blank grid above the work and
       another quarter below it, which reads as the work having been lost.
       Past about a third of the view the spare room goes to the bottom. */
    if (b.h * s + 140 < h) CV.oy = -b.y * s + 56;
    if (b.w * s + 140 < w) CV.ox = -b.x * s + 56;
  }

  /* Late first, then in hand, then the way in — the same order the sheet
     is fitted on and the arrow keys start from. */
  function cvFocus() {
    var cs = worstFirst(sheetCards());
    return cs[0] || null;
  }

  /* ---------------- drawing ---------------- */

  function cvNodePath(c) {
    var d = does(c), x = c.x || 0, y = c.y || 0;
    if (d.holds) return { kind: "hold" };
    if (!doable(c)) return { kind: "oval" };
    return { kind: "box" };
  }

  function cvDrawNode(c) {
    var x = c.x || 0, y = c.y || 0, r = rung(c), shape = cvNodePath(c).kind;
    var tone = r.tone ? " n-" + r.tone : "";
    var body;
    if (shape === "oval") {
      body = '<ellipse cx="' + (x + NW / 2) + '" cy="' + (y + NH / 2) + '" rx="' + (NW / 2) +
        '" ry="' + (NH / 2) + '" class="n-oval' + tone + '" stroke-width="1.4" />';
    } else if (shape === "hold") {
      body = '<rect x="' + x + '" y="' + y + '" width="' + NW + '" height="' + NH +
        '" class="n-hold' + tone + '" stroke-width="1.6" />';
    } else {
      /* The cut corner is ModelBuilder's process marker, and it is the one
         thing on the sheet that says "something happens here". */
      body = '<path d="M' + x + " " + y + "h" + (NW - 11) + "l11 11v" + (NH - 11) +
        "H" + x + "z" + '" class="n-box' + tone + '" stroke-width="1.4" />';
    }
    var name = esc(clip(c.name, 24));
    var kind = esc(clip((c.kind || "").toUpperCase(), 11));
    var word = r.word ? esc(r.word.toUpperCase()) : "";
    return '<g data-node="' + esc(c.id) + '">' + body +
      (CV.sel === c.id
        ? (shape === "oval"
            ? '<ellipse cx="' + (x + NW / 2) + '" cy="' + (y + NH / 2) + '" rx="' + (NW / 2 + 4) +
              '" ry="' + (NH / 2 + 4) + '" class="n-sel" />'
            : '<rect x="' + (x - 4) + '" y="' + (y - 4) + '" width="' + (NW + 8) +
              '" height="' + (NH + 8) + '" class="n-sel" />')
        : "") +
      '<text x="' + (x + 10) + '" y="' + (y + 21) + '" class="n-name">' + name + "</text>" +
      (kind ? '<text x="' + (x + 10) + '" y="' + (y + 38) + '" class="n-kind">' + kind + "</text>" : "") +
      (word ? '<text x="' + (x + NW - 10) + '" y="' + (y + 38) + '" text-anchor="end" class="n-word w-' +
        r.tone + '">' + word + "</text>" : "") +
      "</g>";
  }

  /* Which ports a line uses is geometry, not a constant. A forward line to
     a card that is not to the right left the source's right edge, swung
     out past it and came back — a drawing saying the flow goes the wrong
     way. */
  function cvEdgePath(a, b, back) {
    var ax = a.x || 0, ay = a.y || 0, bx = b.x || 0, by = b.y || 0;
    if (back) {
      var topA = { x: ax + NW / 2, y: ay }, topB = { x: bx + NW / 2, y: by };
      var lift = Math.min(topA.y, topB.y) - 46;
      return "M" + topA.x + " " + topA.y + "C" + topA.x + " " + lift + " " +
        topB.x + " " + lift + " " + topB.x + " " + topB.y;
    }
    if (bx > ax + NW * 0.6) {
      var p1 = { x: ax + NW, y: ay + NH / 2 }, p2 = { x: bx, y: by + NH / 2 };
      var mid = (p1.x + p2.x) / 2;
      return "M" + p1.x + " " + p1.y + "C" + mid + " " + p1.y + " " + mid + " " + p2.y +
        " " + p2.x + " " + p2.y;
    }
    var q1 = { x: ax + NW / 2, y: ay + NH }, q2 = { x: bx + NW / 2, y: by };
    var midy = (q1.y + q2.y) / 2;
    return "M" + q1.x + " " + q1.y + "C" + q1.x + " " + midy + " " + q2.x + " " + midy +
      " " + q2.x + " " + q2.y;
  }

  /* THE <svg> ELEMENT IS MOUNTED ONCE AND ONLY ITS CONTENTS ARE REDRAWN.
     Rebuilding the box's innerHTML on every frame destroyed the element
     holding the pointer capture on the FIRST move of a drag — so the card
     never moved, `pointerup` never fired on the live element, and the sheet
     read as a drawing that could be looked at and nothing more. It also
     took the keyboard focus with it. The viewBox is an attribute and the
     cards are the contents; neither needs a new element. */
  function cvZoomHtml() {
    return '<div class="cvzoom">' +
      '<button class="btn tiny" data-cv="out" title="Zoom out" aria-label="Zoom out">\u2212</button>' +
      '<button class="btn tiny" data-cv="in" title="Zoom in" aria-label="Zoom in">+</button>' +
      '<button class="btn tiny" data-cv="fit">Fit</button>' +
      '<button class="btn tiny" data-cv="max">Full</button></div>';
  }

  function cvMount() {
    var box = document.querySelector(".cvbox");
    if (!box) return;
    box.innerHTML = '<svg class="cvsheet" tabindex="0" role="application" ' +
      'aria-label="The sheet. Arrow keys walk the cards, Enter opens what can be done.">' +
      "</svg>" + cvZoomHtml();
    cvWire();
    cvPaint();
  }

  function cvInner() {
    var box = document.querySelector(".cvbox");
    var w = box ? box.clientWidth : 900, h = box ? box.clientHeight : 500;
    var s = CV.scale;
    var vx = -CV.ox / s, vy = -CV.oy / s, vw = w / s, vh = h / s;
    var out = [];

    /* The survey grid, fine at 40 and heavy at 200, panning and zooming
       with the work — so the sheet is a sheet and not a background. */
    out.push('<defs><pattern id="gf" width="40" height="40" patternUnits="userSpaceOnUse">' +
      '<path d="M40 0H0v40" class="g-fine" stroke-width="0.6" fill="none"/></pattern>' +
      '<pattern id="gb" width="200" height="200" patternUnits="userSpaceOnUse">' +
      '<rect width="200" height="200" fill="url(#gf)"/>' +
      '<path d="M200 0H0v200" class="g-bold" stroke-width="1" fill="none"/></pattern>' +
      '<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" ' +
      'orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="var(--ink-2)"/></marker>' +
      '<marker id="ahd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" ' +
      'orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="var(--rule)"/></marker></defs>');
    out.push('<rect x="' + vx.toFixed(1) + '" y="' + vy.toFixed(1) + '" width="' + vw.toFixed(1) +
      '" height="' + vh.toFixed(1) + '" fill="url(#gb)" />');

    var back = backEdges();
    sheetLinks().forEach(function (l) {
      var a = card(l.from), b = card(l.to);
      if (!a || !b) return;
      /* A line is a PATH and not a state, so it carries no state hue: dead
         sequence is dimmer and a loop back is legible by the arc over the
         top rather than by colour. */
      var cls = l.rel === "with" ? "e-with"
        : (a.doneAt && b.doneAt) ? "e-dead" : "e-then";
      var head = l.rel === "with" ? "" :
        ' marker-end="url(#' + (cls === "e-dead" ? "ahd" : "ah") + ')"';
      out.push('<path d="' + cvEdgePath(a, b, !!back[l.id]) + '" class="' + cls +
        '" stroke-width="1.5"' + head + ' />');
      if (l.label) {
        var mx = ((a.x || 0) + (b.x || 0)) / 2 + NW / 2;
        var my = ((a.y || 0) + (b.y || 0)) / 2 + NH / 2;
        /* A LABEL IS MASKED AGAINST WHAT IS BEHIND IT: pushing a label
           clear of another label does nothing about one landing on a
           line. */
        out.push('<rect x="' + (mx - 27) + '" y="' + (my - 9) + '" width="54" height="14" class="lbl-mask" />');
        out.push('<text x="' + mx + '" y="' + (my + 2) + '" text-anchor="middle" class="n-kind">' +
          esc(clip(l.label.toUpperCase(), 10)) + "</text>");
      }
    });
    sheetCards().forEach(function (c) { out.push(cvDrawNode(c)); });
    return out.join("");
  }

  function cvPaint() {
    var box = document.querySelector(".cvbox");
    if (!box) return;
    var el = box.querySelector(".cvsheet");
    if (!el) { cvMount(); return; }
    var w = box.clientWidth, h = box.clientHeight, s = CV.scale;
    el.setAttribute("viewBox", (-CV.ox / s).toFixed(1) + " " + (-CV.oy / s).toFixed(1) +
      " " + (w / s).toFixed(1) + " " + (h / s).toFixed(1));
    el.innerHTML = cvInner();
    var strip = document.getElementById("selStrip");
    if (strip) strip.innerHTML = cvStrip();
    var mx = box.querySelector('[data-cv="max"]');
    if (mx) mx.textContent = CV.max ? "Close" : "Full";
  }


  /* ---------------- what can be done to a card ----------------

     ONE list, two renderings: the strip lays it across and the menu lays
     it down. There is a test that reads both and fails if the strings
     differ — two copies of one list is the same bug as two copies of one
     rule, and the drift would be silent. */

  function cardActs(c, opts) {
    opts = opts || {};
    var out = [], d = does(c), r = rungOf(c);
    /* A HOLDER IS NOT MARKED DONE. Its standing is the standing of what is
       in it, so a "done" on the project itself would be a stated fact
       arguing with a derived one — and six open steps underneath it. */
    if (d.holds) out.push({ act: "sheet-into", label: "Open its sheet", loud: true });
    else if (d.repeats) out.push({ act: "card-tick", label: "Done again today", loud: true });
    else if (c.doneAt) out.push({ act: "card-undone", label: "Reopen it" });
    else if (doable(c)) out.push({ act: "card-done", label: "Mark it done", loud: true });
    if ((r === "waiting" || r === "late") && d.waits) {
      out.push({ act: "card-chased", label: "Chased today" });
    }
    if (d.opens) {
      var h = openHandle(c);
      if (h.href) out.push({ act: "", href: h.href, label: h.label });
      else out.push({ act: "card-copy", label: h.label });
    }
    out.push({ act: "card-edit", label: "Edit" });
    /* Not on the card's own page: a control that quietly does nothing is
       worse than no control, and "Look at it" is what you are doing. */
    if (!opts.here) out.push({ act: "card-open", label: "Look at it" });
    out.push({ act: "cv-then", label: "This comes before…" });
    out.push({ act: "cv-with", label: "Belongs with…" });
    out.push({ act: "card-dup", label: "Duplicate" });
    if (linksOf(c.id).length) out.push({ act: "cv-cut", label: "Cut its lines" });
    out.push({ act: "card-del", label: "Remove", danger: true });
    return out;
  }
  function actBtn(a, id, cls) {
    var klass = cls + (a.loud ? " loud" : "") + (a.danger ? " danger" : "");
    if (a.href) {
      return '<a class="' + klass + '" href="' + esc(a.href) + '" target="_blank" rel="noopener">' +
        esc(a.label) + "</a>";
    }
    return '<button class="' + klass + '" data-act="' + esc(a.act) + '" data-id="' + esc(id) +
      '">' + esc(a.label) + "</button>";
  }

  function cvStrip() {
    var c = card(CV.sel);
    if (!c) {
      return '<div class="selstrip"><div class="who says">Nothing picked. Tap a card, or press an ' +
        "arrow key on the sheet.</div></div>";
    }
    var r = rung(c);
    return '<div class="selstrip"><div class="who"><b>' + esc(c.name) + "</b>" +
      (r.word ? ' <span class="pill p-' + r.tone + '">' + esc(r.word) + "</span>" : "") +
      '<div class="says">' + esc(standSays(c)) + "</div></div>" +
      cardActs(c).map(function (a) { return actBtn(a, c.id, "btn tiny"); }).join("") + "</div>";
  }

  var cvMenuEl = null;
  function cvMenuClose() {
    if (cvMenuEl && cvMenuEl.parentNode) cvMenuEl.parentNode.removeChild(cvMenuEl);
    cvMenuEl = null;
  }
  function cvMenuOpen(c, x, y) {
    cvMenuClose();
    var el = document.createElement("div");
    el.className = "cvmenu";
    el.innerHTML = '<div class="cvmsep"></div>' +
      cardActs(c).map(function (a) { return actBtn(a, c.id, "cvmrow"); }).join("");
    document.body.appendChild(el);
    var mh = el.offsetHeight, mw = el.offsetWidth;
    el.style.left = Math.min(x, window.innerWidth - mw - 8) + "px";
    el.style.top = Math.max(8, Math.min(y, window.innerHeight - mh - 8)) + "px";
    cvMenuEl = el;
  }

  /* ---------------- the sheet's own undo ----------------

     This app's rule is that an undo is the toast's, with no stack, because
     the example, a restored backup and erasing everything all REPLACE
     state and a closure captured before that would mutate records the book
     no longer holds. Both are true at once here because every entry closes
     over IDS AND VALUES, never a record object — putting one back is a
     lookup that no-ops if the thing is gone — and the stack is DROPPED in
     the three named places that swap the book rather than hoped about. The
     toast's Undo calls the same function the toolbar does: two undos for
     one act is the fault two copies of one list is. */

  var cvUndo = [], cvRedo = [];
  function cvPush(label, undo, redo) {
    cvUndo.push({ label: label, undo: undo, redo: redo });
    if (cvUndo.length > 40) cvUndo.shift();
    cvRedo = [];
  }
  function cvClearUndo() { cvUndo = []; cvRedo = []; }
  function cvUndoOne() {
    var e = cvUndo.pop();
    if (!e) { toast("Nothing to take back."); return; }
    e.undo(); cvRedo.push(e); save(); render();
    toast("Took back: " + e.label);
  }
  function cvRedoOne() {
    var e = cvRedo.pop();
    if (!e) { toast("Nothing to put back."); return; }
    e.redo(); cvUndo.push(e); save(); render();
    toast("Put back: " + e.label);
  }

  /* ============================================================
     THE SCREENS ARE QUESTIONS, NOT TABLES.

     Four of them, and each is the one rendering its question deserves:

       NOW    what needs me            — a list, because that is a list
       SHEET  how does this work go    — a drawing, because that is a shape
       INDEX  what have I got          — rows, searchable, and the phone's
                                         rendering of the sheet
       ASK    everything else          — a question over the same cards

     Nothing on any of them is stored and nothing on any of them is
     computed here. Every figure comes from the selector the screen that
     answers it in full also reads, so two screens cannot disagree — and
     the tiles on Now are `rungCounts()`, which is one walk over every
     card, so a figure can never disagree with its own parts.
     ============================================================ */

  var sheetIn = "";     // view state: which holder's sheet is open
  var openCardId = "";  // view state: whose page is open
  var askQ = "";        // view state: the question in the box
  var idxFilter = "";   // view state: the index's chip

  /* THREE ANSWERS TO "OPEN", AND ONLY ONE IS A PLAIN LINK. A page served
     over https may not navigate to file:///C:/… — every browser blocks it
     and Chrome blocks it silently, so a path rendered as a link is a
     control that quietly does nothing, which is worse than no control. */
  function openHandle(c) {
    if (c.url) return { href: c.url, label: "Open the link", how: "" };
    if (c.path) {
      return {
        href: "", label: "Copy the path",
        how: "A page on the web is not allowed to open a file on this computer \u2014 the browser " +
          "refuses, silently. So the path is handed to you to paste into Explorer."
      };
    }
    return { href: "", label: "", how: "" };
  }

  function glyphOf(c) {
    var d = does(c);
    if (d.holds) return ICO.holds;
    if (d.files) return ICO.files;
    if (d.repeats) return ICO.repeats;
    if (d.waits) return ICO.waits;
    if (d.dated) return ICO.dated;
    if (d.opens) return ICO.opens;
    return ICO.card;
  }

  /* One row, everywhere. A row is told what the page around it already
     names, so a card on its holder's own page does not print that holder's
     name three inches under the heading that IS that name. */
  function cardRow(c, opts) {
    opts = opts || {};
    var r = rung(c), sub = [];
    if (!opts.quietState) sub.push(standSays(c));
    var trail = trailOf(c.id);
    if (!opts.inHolder && trail.length) {
      sub.push(trail.map(function (h) { return h.name; }).join(" \u203a "));
    }
    var right = [];
    if (does(c).dated && c.when) right.push('<span class="cwhen">' + esc(plainDate(c.when)) + "</span>");
    if (r.word) right.push('<span class="pill p-' + r.tone + '">' + esc(r.word) + "</span>");
    return '<button class="crow' + (r.tone ? " e-" + r.tone : "") +
      '" data-act="card-open" data-id="' + esc(c.id) + '" title="' + esc(c.name) + '">' +
      '<span class="cglyph" aria-hidden="true">' + glyphOf(c) + "</span>" +
      '<span class="cbody"><span class="cname">' + esc(c.name) + "</span>" +
      (c.kind ? ' <span class="ckind">' + esc(c.kind.toUpperCase()) + "</span>" : "") +
      (sub.filter(Boolean).length ? '<span class="csub">' + esc(sub.filter(Boolean).join(" \u00b7 ")) + "</span>" : "") +
      "</span>" +
      '<span class="cright">' + right.join("") +
      '<span class="chev" aria-hidden="true">' + ICO.chev + "</span></span></button>";
  }
  function rowsHtml(list, opts) {
    if (!list.length) return "";
    return '<div class="rows">' + list.map(function (c) { return cardRow(c, opts); }).join("") + "</div>";
  }

  function sectHead(word, n) {
    return '<div class="sect">' + esc(word) + (n == null ? "" : ' <span class="n">' + n + "</span>") + "</div>";
  }

  /* ---------------- NOW ---------------- */

  function renderNow() {
    if (!state.cards.length) return firstRun();
    var n = rungCounts();
    var name = (state.settings.owner || "").trim().split(/\s+/)[0];
    var hour = new Date().getHours();
    var greet = name ? "Good " + (hour < 12 ? "morning" : hour < 18 ? "afternoon" : "evening") + ", " + name + "."
      : "Good " + (hour < 12 ? "morning" : hour < 18 ? "afternoon" : "evening") + ".";

    /* The headline is a figure, so it counts what its own parts count. It
       read "Nothing is late." above a rose row in the old app because the
       two were two different walks. */
    /* THE HEADLINE COUNTS EXACTLY WHAT THE TILES BESIDE IT SHOW. Counting
       late, due and unfiled while the tiles showed late, unfiled, today and
       in-your-hands gave a reader four figures that added to something
       other than the sentence above them. There is a tile for each of the
       three now, and the sentence names what it counted. */
    var alarm = n.late + n.due + n.unfiled;
    var head = pageHead("Now", esc(greet) + " " + esc(alarm
      ? (alarm === 1
          ? "One thing is past something \u2014 late, due again, or finished and never filed."
          : cap(numWord(alarm)) + " things are past something \u2014 late, due again, " +
            "or finished and never filed.")
      : "Nothing is late, nothing is due again, nothing is waiting to be filed."),
      '<div class="page-acts"><button class="btn primary" data-act="card-add">Put a card down</button></div>');

    var out = [head];
    out.push('<div class="tiles">' +
      tile("Late", String(n.late), n.late ? "past a day or a chase" : "nothing past its day",
        n.late ? "late" : "") +
      tile("Due again", String(n.due), n.due ? "past its interval" : "nothing past its interval",
        n.due ? "drift" : "") +
      tile("Not filed", String(n.unfiled),
        n.unfiled ? "finished, never archived" : "nothing waiting to be filed",
        n.unfiled ? "drift" : "") +
      tile("Today", String(n.today), n.today ? "dated today" : "nothing dated today",
        n.today ? "hand" : "") +
      tile("Yours to do", String(n.hand),
        n.hand ? "nothing in the way" : "nothing else is free to start",
        n.hand ? "hand" : "") +
      "</div>");

    var order = ["late", "due", "unfiled", "today", "hand", "waiting", "blocked"];
    var any = false;
    order.forEach(function (k) {
      var list = worstFirst(onRung(k));
      if (!list.length) return;
      any = true;
      out.push(sectHead(RUNGS[k].word, list.length));
      out.push(rowsHtml(list.slice(0, 40)));
      if (list.length > 40) out.push('<p class="empty">' + (list.length - 40) +
        " more on this rung \u2014 ask for \u201c" + esc(askWordFor(k)) + "\u201d on Ask.</p>");
    });
    if (!any) {
      out.push(emptyLines("Nothing is open.",
        state.cards.length ? "Every card that can come due is done. The Index has the rest."
          : "Put a card down and it will show up here."));
    }
    /* Not yet due is real and quiet, so it is behind a fold rather than
       taking the bottom of the screen. */
    var calm = worstFirst(onRung("calm"));
    if (calm.length) {
      out.push('<details class="fold"><summary><span class="label">Not yet due \u2014 ' +
        calm.length + "</span></summary><div class=\"foldbody\">" + rowsHtml(calm) + "</div></details>");
    }
    out.push(titleBlock("Now", "every card that can come due"));
    return out.join("");
  }

  function firstRun() {
    return pageHead("Mashghal", "An empty book, and two ways into it.") +
      '<div class="panel"><p class="says">This holds two things and nothing else. A <b>card</b> is ' +
      "anything with a name \u2014 a project, a step, somebody you are waiting on, a deadline, a " +
      "laptop, a site. A <b>link</b> says either <b>then</b> (this comes after that) or <b>with</b> " +
      "(these belong together, in no order).</p>" +
      '<p class="says">A card takes on behaviour by being filled in: give it a day and it can be ' +
      "late, name somebody and it can be chased, give it an interval and it comes round again. " +
      "Nothing is a type, so the app never has to know what your work is.</p>" +
      '<div class="page-acts" style="margin-top:0.8rem">' +
      '<button class="btn primary" data-act="sample-load">Show me a worked example</button>' +
      '<button class="btn" data-act="card-add">Put my first card down</button>' +
      (localStorage.getItem(OLD_KEY)
        ? '<button class="btn" data-act="import-old">Bring in my old book</button>' : "") +
      "</div></div>" +
      titleBlock("Mashghal", "nothing recorded yet");
  }

  /* ---------------- THE SHEET ---------------- */

  function crumbs() {
    var here = card(sheetIn);
    /* SAY IT ONCE. At the top there is one crumb and it reads the same word
       as the heading two lines below it, so it is not drawn at all. */
    if (!here) return "";
    var parts = ['<button class="bcrumb" data-act="sheet-into" data-id="">Everything</button>'];
    if (here) {
      trailOf(here.id).forEach(function (h) {
        parts.push('<span class="sep">\u203a</span><button class="bcrumb" data-act="sheet-into" data-id="' +
          esc(h.id) + '">' + esc(clip(h.name, 24)) + "</button>");
      });
      /* The trail ends at the PARENT: the heading an inch below is the
         current sheet's own name, and a crumb repeating it is both a
         duplicate and a control that goes where you already are. */
    }
    return '<div class="crumbs">' + parts.join("") + "</div>";
  }

  function renderSheet() {
    var here = card(sheetIn);
    if (sheetIn && !here) { sheetIn = ""; here = null; }
    var cs = sheetCards();
    var sub = here
      ? (here.kind ? esc(here.kind) + " \u00b7 " : "") + esc(standSays(here))
      : "Cards filed under nothing else. Open one that holds work to go inside it.";

    var out = [crumbs(), pageHead(here ? here.name : "Everything", sub,
      '<div class="page-acts">' +
      '<button class="btn" data-act="cv-undo">Undo</button>' +
      '<button class="btn" data-act="cv-redo">Redo</button>' +
      '<button class="btn" data-act="cv-tidy">Tidy</button>' +
      '<button class="btn primary" data-act="card-add-here">Add a card here</button></div>')];

    if (!cs.length) {
      out.push('<div class="panel">' + emptyLines(
        here ? "Nothing is filed under " + here.name + " yet." : "No cards yet.",
        "Add a card here and it lands in the middle of the sheet.") + "</div>");
      out.push(titleBlock(here ? here.name : "Everything", "empty sheet"));
      return out.join("");
    }

    out.push('<div class="cvwrap"><div id="selStrip">' + cvStrip() + "</div>" +
      '<div class="cvbox' + (CV.max ? " max" : "") + '"></div>' +
      '<div class="cvkeys">' +
      "<kbd>\u2190</kbd><kbd>\u2192</kbd> walk the cards in order \u00b7 " +
      "<kbd>\u2191</kbd><kbd>\u2193</kbd> follow the flow \u00b7 " +
      "<kbd>Enter</kbd> what can be done \u00b7 <kbd>Esc</kbd> let go \u00b7 " +
      "right-click a card for the same list. " +
      "<span style=\"color:var(--faint)\">\u2014 comes after &nbsp; \u00b7\u00b7 belongs with, no order</span>" +
      "</div></div>");

    /* The words fold away under the drawing: the sheet IS the screen, and
       the same cards written out as rows are the rendering a keyboard reads
       and a phone can scan. It remembers nothing, so a sheet always opens
       closed. */
    out.push('<details class="fold"' + (foldOpen ? " open" : "") +
      '><summary><span class="label">Written out \u2014 ' + cs.length +
      (cs.length === 1 ? " card" : " cards") + "</span></summary>" +
      '<div class="foldbody">' + rowsHtml(worstFirst(cs), { inHolder: true }) + "</div></details>");
    out.push(titleBlock(here ? here.name : "Everything",
      cs.length + (cs.length === 1 ? " card" : " cards") + " \u00b7 " +
      sheetLinks().length + (sheetLinks().length === 1 ? " line" : " lines")));
    return out.join("");
  }
  var foldOpen = false;

  /* ---------------- THE INDEX ---------------- */

  function renderIndex() {
    var n = rungCounts();
    var chips = [
      { k: "", label: "All", n: state.cards.length },
      { k: "late", label: "Late", n: n.late },
      { k: "open", label: "Open", n: openCards().length },
      { k: "thing", label: "Things", n: n.thing },
      { k: "holds", label: "Holds work", n: holders().length },
      { k: "done", label: "Done", n: n.done }
    ];
    var list = state.cards;
    if (idxFilter === "open") list = openCards();
    else if (idxFilter === "holds") list = holders();
    else if (idxFilter) list = onRung(idxFilter);

    /* A sentence about nothing should not be printed. */
    var out = [pageHead("Index", state.cards.length
      ? "Every card, worst first. " + cap(countWords(state.cards.length, "card", "cards")) +
        " and " + countWords(state.links.length, "line", "lines") + " in the book."
      : "Nothing in the book yet.",
      '<div class="page-acts"><button class="btn primary" data-act="card-add">Put a card down</button></div>')];
    out.push('<div class="chips">' + chips.map(function (ch) {
      return '<button class="chip" data-act="idx-filter" data-id="' + esc(ch.k) + '" aria-pressed="' +
        (idxFilter === ch.k) + '">' + esc(ch.label) + " \u00b7 " + ch.n + "</button>";
    }).join("") + "</div>");
    /* A chip that empties the list reads as the app having lost your work,
       so each one carries its own count and says so when it is nought. */
    if (!list.length) {
      out.push('<div class="panel">' + emptyLines(
        state.cards.length ? "Nothing on this chip." : "The book is empty.",
        state.cards.length ? "The counts beside each chip say where the cards are."
          : "Put a card down, or load the worked example from Settings.") + "</div>");
    } else {
      out.push(rowsHtml(worstFirst(list).slice(0, 300)));
      if (list.length > 300) out.push('<p class="empty">' + (list.length - 300) +
        " more. Narrow it on Ask.</p>");
    }
    out.push(titleBlock("Index", "every card in the book"));
    return out.join("");
  }

  /* ---------------- ASK ---------------- */

  function renderAsk() {
    var res = lensRun(askQ);
    var out = [pageHead("Ask", "A question over the same cards. There is no model behind it \u2014 " +
      "the words below are matched against the record, so it works with no network and cannot " +
      "invent a figure.",
      '<div class="page-acts"><button class="btn" data-act="lens-add">Save this question</button></div>')];

    out.push('<div class="panel"><div class="askbox">' +
      '<input id="askBox" type="text" value="' + esc(askQ) +
      '" placeholder="late  \u00b7  waiting kind:visa  \u00b7  in:anfeh open" ' +
      'aria-label="Ask a question" autocomplete="off" />' +
      '<button class="btn primary" data-act="ask-run">Ask</button>' +
      (askQ ? '<button class="btn quiet" data-act="ask-clear">Clear</button>' : "") +
      "</div>");
    if (res.asked) {
      /* It says what it read the question as. A box that answers a
         sentence has to say which sentence it thought it heard, or a wrong
         answer is indistinguishable from a wrong question. */
      out.push('<p class="says" style="margin-top:0.5rem"><span class="label">Read as</span> ' +
        esc(res.read.join(", and ")) + "</p>");
    }
    if (res.unread.length) {
      out.push('<p class="says" style="color:var(--oxide)">Not read: ' +
        esc(res.unread.join(", ")) + ". The words it knows are in the table below.</p>");
    }
    out.push("</div>");

    if (res.asked) {
      out.push(sectHead("The answer", res.rows.length));
      if (res.rows.length) out.push(rowsHtml(res.rows.slice(0, 200)));
      else out.push('<div class="panel">' + emptyLines("No card answers that.",
        "Every word has to hit, so a second word narrows rather than widens.") + "</div>");
    }

    if (state.lenses.length) {
      out.push(sectHead("Questions you saved", state.lenses.length));
      out.push('<div class="rows">' + state.lenses.map(function (L) {
        var r = lensRun(L.q);
        return '<div class="lrow"><button class="lmain" data-act="lens-run" data-id="' +
          esc(L.id) + '"><span class="grow"><b>' + esc(L.name) + '</b><div class="lq">' +
          esc(L.q) + "</div></span>" +
          '<span class="cwhen">' + r.rows.length + "</span>" +
          '<span class="chev" aria-hidden="true">' + ICO.chev + "</span></button>" +
          '<button class="btn tiny danger" data-act="lens-del" data-id="' + esc(L.id) +
          '" title="Remove this question">Remove</button></div>';
      }).join("") + "</div>");
    } else {
      out.push(sectHead("Questions you saved", 0));
      out.push('<div class="panel">' + emptyLines("You have saved none yet.",
        "Type one above and press Save this question \u2014 it becomes a row here with its own count.") +
        "</div>");
    }

    out.push('<details class="fold"><summary><span class="label">Every word it knows \u2014 ' +
      (TERMS.length + 4) + "</span></summary>" +
      '<div class="foldbody"><p class="says">All of them AND together, so a second word narrows. ' +
      "A word it does not know is named rather than dropped.</p>" + lensTable() + "</div></details>");
    out.push(titleBlock("Ask", res.asked ? res.rows.length + " of " + state.cards.length + " cards"
      : "nothing asked yet"));
    return out.join("");
  }

  /* ---------------- A CARD'S OWN PAGE ---------------- */

  function renderCard() {
    var c = card(openCardId);
    if (!c) { openCardId = ""; return renderNow(); }
    var r = rung(c), d = does(c), h = openHandle(c);
    var trail = trailOf(c.id);

    var out = [];
    if (trail.length) {
      out.push('<div class="crumbs">' + trail.map(function (x) {
        return '<button class="bcrumb" data-act="card-open" data-id="' + esc(x.id) + '">' +
          esc(clip(x.name, 24)) + '</button><span class="sep">\u203a</span>';
      }).join("") + '<span class="bcrumb here">' + esc(clip(c.name, 28)) + "</span></div>");
    }
    out.push(pageHead(c.name,
      (r.word ? '<span class="pill p-' + r.tone + '">' + esc(r.word) + "</span> " : "") +
      esc(standSays(c)),
      '<div class="page-acts">' +
      cardActs(c, { here: true }).map(function (a) { return actBtn(a, c.id, "btn"); }).join("") +
      "</div>"));

    if (h.how) out.push('<div class="panel drift"><p class="says">' + esc(h.how) + "</p></div>");

    var rows = [];
    rows.push(["What it is", c.kind ? esc(c.kind) : '<span style="color:var(--faint)">not said</span>']);
    rows.push(["What it does", doesWords(c).length
      ? esc(cap(listWords(doesWords(c))))
      : '<span style="color:var(--faint)">nothing yet \u2014 it is just a name</span>']);
    if (trail.length) rows.push(["Filed under", trail.map(function (x) { return esc(x.name); }).join(" \u203a ")]);
    if (d.dated) rows.push(["Its day", esc(plainDate(c.when)) + " \u00b7 " + esc(agoWords(c.when))]);
    if (d.waits) rows.push(["Waiting on", esc(c.waitOn) +
      (chaseSince(c) ? " \u00b7 since " + esc(plainDate(chaseSince(c))) : "") +
      (num(c.chaseDays) > 0 ? " \u00b7 chase after " + esc(everyWords(num(c.chaseDays)))
        : ' \u00b7 <span style="color:var(--faint)">no chase set, so it is never called late</span>')]);
    if (d.repeats) rows.push(["Comes round", "every " + esc(everyWords(num(c.everyDays))) +
      " \u00b7 last done " + (c.lastDoneOn ? esc(plainDate(c.lastDoneOn)) : "never")]);
    if (c.path) rows.push(["Path", '<span style="font-family:var(--mono);font-size:var(--fs-xs)">' +
      esc(c.path) + "</span>"]);
    if (c.url) rows.push(["Link", '<a href="' + esc(c.url) + '" target="_blank" rel="noopener">' +
      esc(clip(c.url, 60)) + "</a>"]);
    if (c.doneAt) rows.push(["Done", esc(plainDate(c.doneAt)) + " \u00b7 " + esc(agoWords(c.doneAt))]);
    rows.push(["Put down", c.madeOn ? esc(plainDate(c.madeOn)) : '<span style="color:var(--faint)">not said</span>']);
    out.push('<table class="facts"><tbody>' + rows.map(function (x) {
      return "<tr><th>" + esc(x[0]) + "</th><td>" + x[1] + "</td></tr>";
    }).join("") + "</tbody></table>");

    /* Say it once: the note is in the sub-line of every ROW, so on a card's
       own page it is the panel and not both. */
    if (c.note) out.push('<div class="panel" style="margin-top:0.8rem"><span class="label">Note</span>' +
      '<p style="margin:0.3rem 0 0;white-space:pre-wrap">' + esc(c.note) + "</p></div>");

    var after = comesAfter(c.id), before = comesBefore(c.id), with_ = alongside(c.id);
    var inside = heldBy(c.id);

    if (d.holds) {
      var st = holderStand(c);
      out.push(sectHead("What it holds", inside.length));
      /* SAY IT ONCE: the standing is this page's own sub-line, three inches
         above. What this panel adds is the two figures the bar is drawn
         from — nine cards in it, seven that can come due — because those
         two counts side by side with nothing naming them is what made the
         heading and the progress look as though they disagreed. */
      out.push('<div class="panel"><p class="says">' +
        cap(numWord(st.held)) + (st.held === 1 ? " card is" : " cards are") +
        " filed under it" +
        (st.total === st.held ? "" : ", " + numWord(st.total) + " of which can come due") +
        ". " + esc(holderSays(c)) + "</p>" +
        /* Progress is not a state, so the bar takes its row's tone: a green
           bar inside a card whose edge is rose is one card saying two
           opposite things. */
        meter(st.total ? st.done / st.total : 0,
          st.tone === "late" ? "var(--oxide)" : st.tone === "drift" ? "var(--brass)" :
          st.tone === "hand" ? "var(--verd)" : "var(--rule)") + "</div>");
      if (inside.length) out.push(rowsHtml(worstFirst(inside), { inHolder: true }));
      else out.push('<div class="panel">' + emptyLines("Nothing is filed under it yet.",
        "Open its sheet and add a card there.") + "</div>");
      /* No second "Open its sheet": it is already the loud button in the
         header, and the same action twice with one of them dressed as a
         choice is the fault this repo records about the equipment row. */
    }

    if (after.length) { out.push(sectHead("It comes after", after.length)); out.push(rowsHtml(after)); }
    if (before.length) { out.push(sectHead("And before", before.length)); out.push(rowsHtml(before)); }
    if (with_.length) {
      out.push(sectHead("Belongs with, in no order", with_.length));
      out.push(rowsHtml(with_));
    }
    if (!after.length && !before.length && !with_.length) {
      out.push(sectHead("Its lines", 0));
      out.push('<div class="panel">' + emptyLines("Nothing is linked to it.",
        'Use "This comes before\u2026" or "Belongs with\u2026" above \u2014 the two are different ' +
        "relations and the app never confuses them.") + "</div>");
    }
    out.push(titleBlock(c.name, (c.kind || "card") + " \u00b7 " +
      (linksOf(c.id).length + (linksOf(c.id).length === 1 ? " line" : " lines"))));
    return out.join("");
  }

  /* ---------------- SETTINGS ---------------- */

  function renderSettings() {
    var n = rungCounts();
    var out = [pageHead("Settings", "Opened a few times a year, which is why it is on the gear " +

    out.push('<div class="panel"><span class="label">Your name</span>' +

      }).join("") + "</div></div>");

      '<p class="says">' + (state.cards.length
        ? cap(countWords(state.cards.length, "card", "cards")) + ", " +

        ? '<button class="btn" data-act="import-old">Bring in the old book</button>' : "") +

    out.push('<div class="panel"><span class="label">What this is</span>' +
      '<p class="says">Mashghal holds two things: a <b>card</b>, which is anything with a name, ' +
      "and a <b>link</b>, which says either <i>then</i> or <i>with</i>. A card takes on behaviour " +
      "by being filled in \u2014 nothing is a type, so nothing about your work has to be a word this " +
      "app already knew.</p>" +
      '<p class="says">Six behaviours: it waits on someone, it has a day, it files the work away, ' +
      "it holds other cards, it opens something, it comes round again. Four of the six are read " +
      "off the field that carries them, so there is no flag to disagree with the field beside it.</p>" +
      '<p class="says">Nothing is sent anywhere. There is no account, no network call and no ' +
