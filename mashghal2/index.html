  /* The title block a drawing has, in the corner where a drawing has one:
     what sheet this is, what it is drawn from, and when. It is also the
     honest home for the build string. */
  function titleBlock(what, from) {
    return '<div class="titleblock">' +
      '<div class="tbcell"><span class="label">Sheet</span><b>' + esc(what) + "</b></div>" +
      '<div class="tbcell"><span class="label">Drawn from</span><b>' + from + "</b></div>" +
      '<div class="tbcell"><span class="label">Date</span><b>' + esc(today()) + "</b></div>" +
      '<div class="tbcell"><span class="label">Rev</span><b>' + esc(BUILD.split(" ")[0]) + "</b></div>" +
      "</div>";
  }

  /* ============================================================
     DRIVING THE SHEET.

     Two traps are encoded here rather than rediscovered:

       · THE COORDINATES OF A PRESS GO STALE IN ONE EVENT. `ev.target` is
         the <svg> under pointer capture, so it never names the card, and
         the sheet's top moved 184 → 269px between `pointerdown` and
         `contextmenu` in the old app because pressing a focusable element
         scrolls it into view. So the card comes from THE PRESS, in the
         context-menu handler and the long-press timer alike.
       · `preventDefault` ON POINTERDOWN STOPS THE BROWSER FOCUSING THE
         SHEET, so every arrow key after a click went to the body and the
         canvas was a pointer-only screen again. It is focused by hand,
         with `preventScroll`.
     ============================================================ */

  var drag = null, pressTimer = null;

  function cvAt(ev, box) {
    var el = box.querySelector(".cvsheet");
    var r = el.getBoundingClientRect();
    return {
      x: (ev.clientX - r.left - CV.ox) / CV.scale,
      y: (ev.clientY - r.top - CV.oy) / CV.scale
    };
  }
  function cvHit(ev) {
    var g = ev.target.closest ? ev.target.closest("[data-node]") : null;
    return g ? g.getAttribute("data-node") : "";
  }

  function cvWire() {
    var box = document.querySelector(".cvbox");
    if (!box) return;
    var el = box.querySelector(".cvsheet");
    if (!el) return;

    box.querySelectorAll("[data-cv]").forEach(function (b) {
      b.addEventListener("click", function () {
        var k = b.getAttribute("data-cv");
        if (k === "in") CV.scale = clamp(CV.scale * 1.2, cvMinScale(), 2.5);
        else if (k === "out") CV.scale = clamp(CV.scale / 1.2, cvMinScale(), 2.5);
        else if (k === "fit") cvFit();
        else if (k === "max") { CV.max = !CV.max; cvMaxPaint(); cvFit(); }
        cvPaint();
      });
    });

    el.addEventListener("pointerdown", function (ev) {
      if (ev.button === 2) return;
      cvMenuClose();
      var id = cvHit(ev), c = id ? card(id) : null;
      var at = cvAt(ev, box);
      drag = {
        id: id, sx: ev.clientX, sy: ev.clientY, moved: false,
        cx: c ? (c.x || 0) : 0, cy: c ? (c.y || 0) : 0,
        ox: CV.ox, oy: CV.oy, at: at
      };
      el.setPointerCapture(ev.pointerId);
      /* Focused by hand: preventDefault would stop the browser doing it,
         and then no arrow key reaches the sheet at all. */
      el.focus({ preventScroll: true });
      if (id) {
        pressTimer = setTimeout(function () {
          pressTimer = null;
          if (drag && drag.id === id && !drag.moved) cvMenuPick(id, ev.clientX, ev.clientY);
        }, 520);
      }
    });

    el.addEventListener("pointermove", function (ev) {
      if (!drag) return;
      var dx = ev.clientX - drag.sx, dy = ev.clientY - drag.sy;
      if (!drag.moved && Math.abs(dx) + Math.abs(dy) < 4) return;
      drag.moved = true;
      if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
      if (drag.id) {
        var c = card(drag.id);
        if (c) { c.x = Math.round(drag.cx + dx / CV.scale); c.y = Math.round(drag.cy + dy / CV.scale); }
      } else {
        CV.ox = drag.ox + dx; CV.oy = drag.oy + dy;
      }
      cvPaint();
    });

    function letGo(ev) {
      if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
      if (!drag) return;
      var d = drag; drag = null;
      if (d.id && d.moved) {
        /* Moving a card picks it, so the strip names what you just moved. */
        CV.sel = d.id;
        var c = card(d.id);
        if (c) {
          var wasX = d.cx, wasY = d.cy, id = d.id, nowX = c.x, nowY = c.y;
          /* A position is LAYOUT and not structure, so moving a card is
             undoable and changes nothing about the work. */
          cvPush("moving " + c.name,
            function () { var k = card(id); if (k) { k.x = wasX; k.y = wasY; } },
            function () { var k = card(id); if (k) { k.x = nowX; k.y = nowY; } });
          c.updatedAt = new Date().toISOString();
          save();
        }
        cvPaint();
      } else if (d.id && !d.moved) {
        /* A tap PICKS a card; it does not open a dialog. Every accidental
           tap used to be a modal. */
        CV.sel = d.id;
        cvPaint();
      } else if (!d.id && !d.moved) {
        /* Letting go on empty space has to mean letting go. The keyboard's
           first key is what picks one. */
        CV.sel = "";
        cvPaint();
      }
    }
    el.addEventListener("pointerup", letGo);
    el.addEventListener("pointercancel", letGo);

    el.addEventListener("contextmenu", function (ev) {
      ev.preventDefault();
      var id = (drag && drag.id) || cvHit(ev);
      if (!id) return;
      cvMenuPick(id, ev.clientX, ev.clientY);
    });

    el.addEventListener("wheel", function (ev) {
      if (!ev.ctrlKey && !ev.metaKey) return;
      ev.preventDefault();
      CV.scale = clamp(CV.scale * (ev.deltaY < 0 ? 1.1 : 1 / 1.1), cvMinScale(), 2.5);
      cvPaint();
    }, { passive: false });

    el.addEventListener("keydown", cvKey);
    el.addEventListener("focus", function () {
      /* The first arrow key has to be able to pick a card: this fires
         BEFORE the press that cleared the selection finishes, so it may
         not pick one itself. */
      if (CV.sel && !card(CV.sel)) CV.sel = "";
    });
  }

  /* `sel` is set, the strip is painted, and the menu opens a frame later
     against a layout that has settled — the strip appearing fires a
     scroll, which is one of the things that closes the menu. */
  function cvMenuPick(id, x, y) {
    CV.sel = id;
    cvPaint();
    var c = card(id);
    if (!c) return;
    requestAnimationFrame(function () { cvMenuOpen(c, x, y); });
  }

  function cvKey(ev) {
    var order = cvOrder();
    if (!order.length) return;
    var k = ev.key;
    if (k === "Escape") { ev.preventDefault(); sheetEscape(); return; }
    if (k === "Enter") {
      ev.preventDefault();
      if (!CV.sel) { CV.sel = (cvFocus() || order[0]).id; cvPaint(); return; }
      var strip = document.getElementById("selStrip");
      var b = strip && strip.querySelector("button, a");
      if (b) b.focus();
      return;
    }
    if (k !== "ArrowLeft" && k !== "ArrowRight" && k !== "ArrowUp" && k !== "ArrowDown") return;
    ev.preventDefault();
    if (!CV.sel) { CV.sel = (cvFocus() || order[0]).id; panTo(card(CV.sel)); cvPaint(); return; }
    if (k === "ArrowLeft" || k === "ArrowRight") {
      /* Reading order always works and can never dead-end, and it wraps
         rather than sticking. */
      var i = -1;
      order.forEach(function (c, j) { if (c.id === CV.sel) i = j; });
      if (i < 0) i = 0;
      i = (i + (k === "ArrowRight" ? 1 : -1) + order.length) % order.length;
      CV.sel = order[i].id;
    } else {
      /* Down and up follow the FLOW, which is what the sheet is actually
         saying, cycling when a card has several ways on. */
      var to = k === "ArrowDown" ? comesBefore(CV.sel) : comesAfter(CV.sel);
      to = to.filter(function (c) { return c.in === sheetIn; });
      if (!to.length) {
        /* A dead end is ANNOUNCED through the toast, which is the app's
           live region and therefore the only channel a screen reader
           hears. */
        toast(k === "ArrowDown" ? "Nothing comes after this one." : "Nothing comes before this one.");
        return;
      }
      CV.nextSeen = (CV.nextSeen || 0);
      CV.sel = to[CV.nextSeen % to.length].id;
      CV.nextSeen = to.length > 1 ? CV.nextSeen + 1 : 0;
    }
    panTo(card(CV.sel));
    cvPaint();
  }

  /* Brings a card into view WITHOUT changing the zoom — a re-fit throws
     away wherever the reader had got to, the same reason the strip is
     repainted rather than the page re-rendered. */
  function panTo(c) {
    if (!c) return;
    var box = document.querySelector(".cvbox");
    if (!box) return;
    var w = box.clientWidth, h = box.clientHeight, s = CV.scale;
    var sx = (c.x || 0) * s + CV.ox, sy = (c.y || 0) * s + CV.oy;
    var pad = 30;
    if (sx < pad) CV.ox += pad - sx;
    if (sx + NW * s > w - pad) CV.ox -= sx + NW * s - (w - pad);
    if (sy < pad) CV.oy += pad - sy;
    if (sy + NH * s > h - pad) CV.oy -= sy + NH * s - (h - pad);
  }

  /* AN ESCAPE STACK IS WRITTEN ONCE. It was written twice in the old app —
     in the sheet's handler and in the document's — and both saw the same
     press, so one Escape cleared the card AND left the full screen, the
     opposite of stacking. */
  function sheetEscape() {
    if (cvMenuEl) { cvMenuClose(); return; }
    if (CV.sel) { CV.sel = ""; cvPaint(); return; }
    if (CV.max) { CV.max = false; cvMaxPaint(); cvFit(); cvPaint(); }
  }
  /* The class goes on the markup as well as being toggled, because any
     render that rebuilds the sheet builds a fresh box — and a box without
     it dropped out of full screen mid-edit while `html.cvmax` stayed on,
     leaving the page unscrollable behind a sheet no longer covering it. */
  function cvMaxPaint() {
    var box = document.querySelector(".cvbox");
    if (box) box.classList.toggle("max", CV.max);
    document.documentElement.classList.toggle("cvmax", CV.max);
  }
  function unmaximize() {
    if (!CV.max) return;
    CV.max = false;
    document.documentElement.classList.remove("cvmax");
  }

  function cvWireDoc() {
    document.addEventListener("keydown", function (ev) {
      if (cvMenuEl && ev.key === "Escape") { ev.preventDefault(); cvMenuClose(); return; }
      if (overlay && overlay.innerHTML) return;
      if (ev.key === "Escape" && (CV.sel || CV.max) && view === "sheet") {
        var on = document.activeElement;
        if (on && on.classList && on.classList.contains("cvsheet")) return;  // its own handler has it
        ev.preventDefault(); sheetEscape();
      }
    });
    document.addEventListener("scroll", cvMenuClose, true);
    document.addEventListener("pointerdown", function (ev) {
      if (cvMenuEl && !cvMenuEl.contains(ev.target)) cvMenuClose();
    });
    window.addEventListener("resize", function () {
      if (view === "sheet") { CV.fitted = null; cvPaint(); }
    });
  }

  /* ============================================================
     DIALOGS AND ACTIONS.

     `ACTIONS` is the only place a figure moves. Every removal confirms,
     says what it touches and offers an undo on the toast; nothing acts on
     its own; and a refusal carries the way out rather than being a toast
     that names a place and leaves you there.
     ============================================================ */

  function stamp(c) { c.updatedAt = new Date().toISOString(); return c; }

  /* The picker for "filed under". It withholds the card itself and
     everything already beneath it, because picking one of those would
     close a loop and both pages would recurse. */
  function holderOptions(exceptId) {
    var out = [{ value: "", label: "— nothing, it sits on the top sheet" }];
    var banned = {};
    if (exceptId) {
      banned[exceptId] = 1;
      underneath(exceptId).forEach(function (c) { banned[c.id] = 1; });
    }
    holders().forEach(function (h) {
      if (banned[h.id]) return;
      var trail = trailOf(h.id).map(function (x) { return x.name; });
      out.push({ value: h.id, label: (trail.length ? trail.join(" › ") + " › " : "") + h.name });
    });
    return out;
  }

  /* ONE DIALOG FOR THE ONE NOUN. Four questions on the face of it and the
     behaviours behind a fold, because a dialog of eleven boxes is a dialog
     people close — and the six things a card can DO are each one field, so
     filling one in is how you opt in. */
  function cardDialog(c, opts) {
    opts = opts || {};
    var isNew = !c;
    var d = c || {};
    openModal({
      title: isNew ? "A new card" : "Edit " + d.name,
      message: isNew
        ? "A card is anything with a name. What it can DO comes from what you fill in below — " +
          "give it a day and it can be late, name somebody and it can be chased, give it an " +
          "interval and it comes round again."
        : "What this card can do is read off these fields, so clearing one takes the behaviour " +
          "with it.",
      confirmLabel: isNew ? "Put it down" : "Save",
      wide: true,
      fields: [
        { key: "name", label: "Name", value: d.name || "", span: true,
          placeholder: "Send the brochure to Patricia" },
        { key: "kind", label: "What it is", value: d.kind || "",
          placeholder: "step, sherd, visa, laptop…",
          hint: "Your own word. The app never decides what your work is." },
        { key: "role", label: "Its part", type: "select", value: d.role || opts.role || "",
          options: ROLES,
          hint: "The two things no field can say for itself." },
        { key: "in", label: "Filed under", type: "select",
          value: d.in || (isNew ? (opts.in || "") : ""), span: true,
          options: holderOptions(isNew ? "" : d.id) },
        /* A note is not a behaviour, so it is not behind the behaviours'
           fold — which also makes that fold's count true. */
        { key: "note", label: "Note", type: "textarea", value: d.note || "", span: true, rows: 2 },
        { key: "when", label: "Its day", type: "date", value: d.when || "", more: true,
          hint: "A day that has gone by makes it late." },
        { key: "waitOn", label: "Waiting on", value: d.waitOn || "", more: true,
          placeholder: "a name", hint: "Naming somebody is what makes it chaseable." },
        { key: "chaseDays", label: "Chase after (days)", type: "number", step: "1", min: 0,
          value: d.chaseDays || "", more: true,
          hint: "Nought means no chase, so it is never called late." },
        { key: "everyDays", label: "Comes round every (days)", type: "number", step: "1", min: 0,
          value: d.everyDays || "", more: true,
          hint: "Every so often since it was last done, so arrears never compound." },
        { key: "path", label: "A path on this computer", value: d.path || "", more: true, span: true,
          hint: "Handed to you to copy — a web page may not open a file, and Chrome refuses silently." },
        { key: "url", label: "A link", value: d.url || "", more: true, span: true }
      ],
      moreLabel: "What it does — six fields, all optional",
      validate: function (v) {
        if (!v.name.trim()) return "It needs a name — that is the one thing a card is.";
        if (v.when && !dayOk(v.when)) return "“" + v.when + "” is not a day that exists.";
        if (num(v.chaseDays) < 0 || num(v.everyDays) < 0) return "An interval cannot be negative.";
        if (v.url && !/^https?:\/\//i.test(v.url.trim()))
          return "A link has to start with http:// or https://, or the browser will not follow it.";
        return "";
      },
      onConfirm: function (v) {
        var fresh = isNew;
        var rec = isNew ? { id: uid(), madeOn: today() } : c;
        rec.name = v.name.trim();
        rec.kind = v.kind.trim();
        rec.role = v.role;
        rec.in = v.in;
        rec.when = v.when;
        rec.waitOn = v.waitOn.trim();
        rec.chaseDays = num(v.chaseDays);
        rec.everyDays = num(v.everyDays);
        rec.path = v.path.trim();
        rec.url = v.url.trim();
        rec.note = v.note;
        /* Naming somebody starts the clock, because "waiting since" is a
           fact nobody would think to type and the day it was written down
           is the honest answer. */
        if (rec.waitOn && !rec.chasedOn) rec.chasedOn = today();
        if (!rec.waitOn) rec.chasedOn = "";
        if (rec.everyDays && !rec.lastDoneOn) rec.lastDoneOn = today();
        stamp(rec);
        if (fresh) {
          /* Placed where you were looking, when the sheet said where.
             Added from anywhere else it carries no position at all, and
             `cvSeed()` gives it one the first time its sheet is drawn. */
          if (opts.at) { rec.x = opts.at.x; rec.y = opts.at.y; }
          state.cards.push(rec);
          /* A new card joins NOTHING unless you say what it comes after: a
             hidden auto-connection is a sequence the app wrote. */
          if (opts.after) {
            state.links.push({ id: uid(), from: opts.after, to: rec.id, rel: "then", label: "",
              updatedAt: new Date().toISOString() });
          }
          CV.sel = rec.id;
          var newId = rec.id;
          cvPush("putting down " + rec.name,
            function () {
              state.cards = state.cards.filter(function (x) { return x.id !== newId; });
              state.links = state.links.filter(function (l) { return l.from !== newId && l.to !== newId; });
            },
            function () { state.cards.push(rec); });
        }
        save(); render();
        toast(fresh ? "Put down " + rec.name + "." : "Saved.",
          fresh ? function () {
            state.cards = state.cards.filter(function (x) { return x.id !== rec.id; });
            state.links = state.links.filter(function (l) { return l.from !== rec.id && l.to !== rec.id; });
            cvClearUndo();
          } : null);
      }
    });
  }

  /* A line is drawn by naming the other end, and the two kinds are asked
     in two dialogs rather than one with a picker: THEN and WITH are
     different relations and a reader choosing between them in a dropdown
     is a reader being asked to classify rather than to say what is true. */
  function linkDialog(c, rel) {
    var pool = sheetCards().filter(function (o) { return o.id !== c.id; });
    if (!pool.length) {
      needWords("Nothing else is on this sheet",
        "A line joins two cards on the same sheet, and " + c.name + " is the only one here. " +
        "Add another card and then draw the line.", "card-add-here", "Add a card here");
      return;
    }
    var already = {};
    linksOf(c.id, rel).forEach(function (l) { already[l.from === c.id ? l.to : l.from] = 1; });
    var free = pool.filter(function (o) { return !already[o.id]; });
    if (!free.length) {
      toast(c.name + " is already joined that way to everything else on this sheet.");
      return;
    }
    /* IT OPENS ON AN END IT CAN ACTUALLY JOIN. Left in sheet order the
       default was often one already joined, so pressing Draw it got a
       refusal — a picker whose first answer is always refused. */
    pool = free.concat(pool.filter(function (o) { return already[o.id]; }));
    openModal({
      title: rel === "then" ? c.name + " comes before…" : c.name + " belongs with…",
      message: rel === "then"
        ? "A <b>then</b> line is sequence: the card you pick waits for this one. A run walks these " +
          "and never touches a <i>with</i> line."
        : "A <b>with</b> line is association and carries <i>no ordering meaning whatsoever</i> — " +
          "a reference photograph or a pair of headphones hangs off a step without becoming " +
          "something it waits for.",
      confirmLabel: "Draw it",
      fields: [
        { key: "to", label: "The other end", type: "select", span: true,
          options: pool.map(function (o) {
            return { value: o.id, label: o.name + (already[o.id] ? "  (already joined)" : "") };
          }) },
        { key: "label", label: "A word on the line", value: "",
          placeholder: rel === "then" ? "if yes / if no" : "", span: true,
          hint: rel === "then" ? "A way out of a decision carries the answer that takes it."
            : "Optional." }
      ],
      validate: function (v) {
        if (!v.to) return "Pick the other end.";
        if (linkBetween(c.id, v.to, rel)) return "Those two are already joined that way.";
        return "";
      },
      onConfirm: function (v) {
        var l = { id: uid(), from: rel === "then" ? c.id : c.id, to: v.to, rel: rel,
          label: v.label.trim(), updatedAt: new Date().toISOString() };
        state.links.push(l);
        cvPush("joining " + c.name + " to " + cardName(v.to),
          function () { state.links = state.links.filter(function (x) { return x.id !== l.id; }); },
          function () { state.links.push(l); });
        save(); render();
        toast((rel === "then" ? "Then: " : "With: ") + c.name + " — " + cardName(v.to) + ".",
          function () {
            state.links = state.links.filter(function (x) { return x.id !== l.id; });
            cvClearUndo();
          });
      }
    });
  }

  /* A refusal has to carry the way out, and the way out has to be the
     right one. A toast cannot carry a route, so a refusal that needs to
     point somewhere may not be a toast. */
  function needWords(title, message, act, label) {
    openModal({
      title: title, message: message,
      confirmLabel: label, cancelLabel: "Not now",
      onConfirm: function () { if (ACTIONS[act]) ACTIONS[act](); }
    });
  }

  var ACTIONS = {
    /* ---- putting a card down ---- */
    "card-add": function () { cardDialog(null, {}); },
    "card-add-here": function () {
      cardDialog(null, { in: sheetIn, at: cvCentre() });
    },
    "card-add-holds": function () { cardDialog(null, { role: "holds" }); },

    "card-open": function (id) {
      if (!card(id)) { toast("That card is gone."); return; }
      openCardId = id; unmaximize(); render();
      window.scrollTo({ top: 0, behavior: "auto" });
    },
    "card-edit": function (id) { var c = card(id); if (c) cardDialog(c); },

    "card-done": function (id) {
      var c = card(id);
      if (!c) return;
      var was = c.doneAt;
      c.doneAt = today(); stamp(c); save(); render();
      var after = comesBefore(c.id).filter(function (x) { return rungOf(x) === "hand" || rungOf(x) === "unfiled"; });
      toast("Done: " + c.name +
        (after.length ? " · " + cap(listWords(after.map(function (x) { return x.name; }))) +
          (after.length === 1 ? " is" : " are") + " now free" : ""),
        function () { c.doneAt = was; stamp(c); });
    },
    "card-undone": function (id) {
      var c = card(id);
      if (!c) return;
      var was = c.doneAt;
      c.doneAt = ""; stamp(c); save(); render();
      toast("Reopened " + c.name + ".", function () { c.doneAt = was; stamp(c); });
    },
    /* Upkeep is ticked, not finished: the interval is still true, so what
       moves is the date it was last done. */
    "card-tick": function (id) {
      var c = card(id);
      if (!c) return;
      var was = c.lastDoneOn;
      c.lastDoneOn = today(); stamp(c); save(); render();
      toast(c.name + " done again · next in " + everyWords(num(c.everyDays)) + ".",
        function () { c.lastDoneOn = was; stamp(c); });
    },
    "card-chased": function (id) {
      var c = card(id);
      if (!c) return;
      var was = c.chasedOn;
      c.chasedOn = today(); stamp(c); save(); render();
      toast("Chased " + c.waitOn + " today.", function () { c.chasedOn = was; stamp(c); });
    },
    "card-copy": function (id) {
      var c = card(id);
      if (!c || !c.path) return;
      function fallback() { toast("Couldn't copy — the path is " + c.path); }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(c.path).then(function () {
          toast("Path copied. Paste it into Explorer.");
        }, fallback);
      } else fallback();
    },
    /* A copy of a card inherits NOT ONE LINE: a copy is a card you are
       about to place somewhere else in the sequence, so inheriting the
       original's predecessors would put it in a flow you have not decided
       on yet. */
    "card-dup": function (id) {
      var c = card(id);
      if (!c) return;
      var n = JSON.parse(JSON.stringify(c));
      n.id = uid(); n.name = c.name + " (copy)"; n.madeOn = today();
      n.doneAt = ""; n.chasedOn = c.waitOn ? today() : "";
      n.x = (c.x || 0) + 30; n.y = (c.y || 0) + 30;
      stamp(n);
      state.cards.push(n);
      CV.sel = n.id;
      cvPush("copying " + c.name,
        function () { state.cards = state.cards.filter(function (x) { return x.id !== n.id; }); },
        function () { state.cards.push(n); });
      save(); render();
      toast("Copied " + c.name + " · no lines came with it.",
        function () {
          state.cards = state.cards.filter(function (x) { return x.id !== n.id; });
          cvClearUndo();
        });
    },

    /* Deleting a card KEEPS everything filed under it: they move up to
       wherever it was, exactly as Coffer's pocket delete keeps every
       entry. The name goes to `forgotten`, so a line still naming it reads
       "(removed)" rather than losing the history. */
    "card-del": function (id) {
      var c = card(id);
      if (!c) return;
      var inside = heldBy(c.id), lines = linksOf(c.id);
      var says = [];
      if (inside.length) says.push("The " + numWord(inside.length) +
        (inside.length === 1 ? " card filed under it moves" : " cards filed under it move") +
        " up to where it was — nothing filed under it is lost.");
      if (lines.length) says.push("Its " + numWord(lines.length) +
        (lines.length === 1 ? " line goes" : " lines go") + " with it.");
      if (!says.length) says.push("Nothing else points at it.");
      confirmAction({
        title: "Remove " + c.name + "?",
        message: says.join(" ") + " There is an undo on the message afterwards.",
        confirmLabel: "Remove it"
      }, function () {
        var keptCards = inside.map(function (x) { return { id: x.id, was: x.in }; });
        var keptLines = lines.slice();
        var pos = state.cards.indexOf(c);
        inside.forEach(function (x) { x.in = c.in; stamp(x); });
        state.cards = state.cards.filter(function (x) { return x.id !== c.id; });
        state.links = state.links.filter(function (l) { return l.from !== c.id && l.to !== c.id; });
        state.forgotten[c.id] = c.name;
        if (openCardId === c.id) openCardId = "";
        if (sheetIn === c.id) sheetIn = c.in || "";
        if (CV.sel === c.id) CV.sel = "";
        cvClearUndo();
        save(); render();
        toast("Removed " + c.name + ".", function () {
          state.cards.splice(Math.min(pos, state.cards.length), 0, c);
          keptCards.forEach(function (k) { var x = card(k.id); if (x) x.in = k.was; });
          keptLines.forEach(function (l) { state.links.push(l); });
          delete state.forgotten[c.id];
        });
      });
    },

    /* ---- lines ---- */
    "cv-then": function (id) { var c = card(id); if (c) linkDialog(c, "then"); },
    "cv-with": function (id) { var c = card(id); if (c) linkDialog(c, "with"); },
    /* Cutting says how many AS A WORD and refuses by name when there are
       none. It does not confirm, because it is reversible and the undo is
       on the toast, which is this app's rule for a routine act. */
    "cv-cut": function (id) {
      var c = card(id);
      if (!c) return;
      var gone = linksOf(c.id);
      if (!gone.length) { toast("No lines touch " + c.name + "."); return; }
      state.links = state.links.filter(function (l) { return l.from !== c.id && l.to !== c.id; });
      cvPush("cutting " + numWord(gone.length) + " lines",
        function () { gone.forEach(function (l) { state.links.push(l); }); },
        function () {
          state.links = state.links.filter(function (l) { return l.from !== c.id && l.to !== c.id; });
        });
      save(); render();
      toast("Cut " + numWord(gone.length) + (gone.length === 1 ? " line" : " lines") +
        " off " + c.name + ".",
        function () { gone.forEach(function (l) { state.links.push(l); }); cvClearUndo(); });
    },
    /* Tidy is a BUTTON. Nothing calls a layout on its own, so adding one
       card to a forty-card sheet cannot throw away positions somebody
       placed by hand. */
    "cv-tidy": function () {
      var was = sheetCards().map(function (c) { return { id: c.id, x: c.x, y: c.y }; });
      var n = cvApplyLayout();
      if (!n) { toast("Already tidy."); return; }
      cvPush("tidying the sheet",
        function () { was.forEach(function (w) { var c = card(w.id); if (c) { c.x = w.x; c.y = w.y; } }); },
        function () { cvApplyLayout(); });
      cvFit(); save(); render();
      toast("Tidied " + numWord(n) + (n === 1 ? " card" : " cards") + ".",
        function () {
          was.forEach(function (w) { var c = card(w.id); if (c) { c.x = w.x; c.y = w.y; } });
          cvClearUndo();
        });
    },
    "cv-undo": function () { cvUndoOne(); },
    "cv-redo": function () { cvRedoOne(); },

    /* ---- moving about ---- */
    "sheet-into": function (id) {
      var c = id ? card(id) : null;
      if (id && !c) { toast("That sheet is gone."); return; }
      if (c && c.role !== "holds") {
        /* One way out, and it is a real one: the dialog that changes the
           card's part. Two buttons that both dismiss, one of them dressed
           as a choice, is the fault this app already records. */
        openModal({
          title: c.name + " does not hold work",
          message: "Only a card whose part is <b>it holds other cards</b> gets a sheet of its own. " +
            "Change its part and it becomes one.",
          confirmLabel: "Edit " + c.name, cancelLabel: "Leave it",
          onConfirm: function () { cardDialog(c); }
        });
        return;
      }
      sheetIn = id || "";
      openCardId = "";
      CV.sel = ""; CV.fitted = null;
      view = "sheet";
      render();
      window.scrollTo({ top: 0, behavior: "auto" });
    },
    "idx-filter": function (id) { idxFilter = id || ""; render(); },
    "tab-settings": function () { openCardId = ""; unmaximize(); view = "settings"; render(); },

    /* ---- asking ---- */
    "ask-run": function () {
      var box = document.getElementById("askBox");
      askQ = box ? box.value : "";
      render();
      var b = document.getElementById("askBox");
      if (b) { b.focus(); b.setSelectionRange(b.value.length, b.value.length); }
    },
    "ask-clear": function () { askQ = ""; render(); },
    "lens-add": function () {
      var box = document.getElementById("askBox");
      var q = (box ? box.value : askQ).trim();
      openModal({
        title: "Save a question",
        message: "It becomes a row on Ask with its own live count. It stores the question, never " +
          "the answer — so it can never go stale.",
        fields: [
          { key: "name", label: "Call it", value: "", span: true, placeholder: "Chasing people" },
          { key: "q", label: "The question", value: q, span: true,
            hint: "Every word has to hit. The table on Ask lists all of them." }
        ],
        validate: function (v) {
          if (!v.name.trim()) return "Give it a name.";
          if (!v.q.trim()) return "There is no question to save.";
          if (lensParse(v.q).unread.length)
            return "It does not know " + lensParse(v.q).unread.join(", ") + ".";
          return "";
        },
        onConfirm: function (v) {
          var L = { id: uid(), name: v.name.trim(), q: v.q.trim(), updatedAt: new Date().toISOString() };
          state.lenses.push(L);
          askQ = L.q; view = "ask"; save(); render();
          toast("Saved “" + L.name + "”.", function () {
            state.lenses = state.lenses.filter(function (x) { return x.id !== L.id; });
          });
        }
      });
    },
    "lens-run": function (id) {
      var L = byId(state.lenses, id);
      if (!L) { toast("That question is gone."); return; }
      askQ = L.q; view = "ask"; openCardId = ""; render();
    },
    "lens-del": function (id) {
      var L = byId(state.lenses, id);
      if (!L) return;
      var pos = state.lenses.indexOf(L);
      state.lenses = state.lenses.filter(function (x) { return x.id !== id; });
      save(); render();
      toast("Removed “" + L.name + "”.", function () { state.lenses.splice(pos, 0, L); });
    },

    /* ---- settings ---- */
    "set-owner": function () {
      openModal({
        title: "Your name",
        message: "The rail and Now greet you by the first name only — nobody is greeted by three. " +
          "Leave it blank and the rail reads Mashghal.",
        fields: [{ key: "owner", label: "Name", value: state.settings.owner || "", span: true }],
        onConfirm: function (v) {
          state.settings.owner = v.owner.trim();
          save(); render();
          toast(state.settings.owner ? "Noted." : "Cleared — the rail reads Mashghal.");
        }
      });
    },
    "set-theme": function (id) {
      try {
        if (id === "light" || id === "dark") localStorage.setItem(THEME_KEY, id);
        else localStorage.removeItem(THEME_KEY);
      } catch (e) {}
      paintTheme(); render();
    },

    "book-out": function () {
      var text = JSON.stringify(state, null, 2);
      backupDialog(STORE_KEY_APP + "-" + today() + ".json", text,
        state.cards.length + " cards and " + state.links.length + " lines");
    },
    "book-in": function () {
      restoreDialog(function (p) {
        if (!p || !Array.isArray(p.cards)) return null;
        return p.cards.length + " cards, " + (Array.isArray(p.links) ? p.links.length : 0) + " lines";
      }, function (p) {
        confirmAction({
          title: "Replace everything with this backup?",
          message: "What is in this browser now is replaced. Back the current book up first if " +
            "you have not — there is no undo on this one.",
          confirmLabel: "Restore it"
        }, function () {
          /* Restored through `adoptState`, the single adoption point,
             because hand-copying a key list at a second site is how Coffer
             lost grants out of a restored backup. */
          state = adoptState(p, blank());
          resetViews();
          save(); render();
          toast("Restored " + state.cards.length + " cards.");
        });
      });
    },
    "book-wipe": function () {
      confirmAction({
        title: "Erase everything?",
        message: "Every card, every line and every saved question in this browser. It is not sent " +
          "anywhere and it is not kept anywhere else, so this is the only copy. There is no undo.",
        confirmLabel: "Erase it all"
      }, function () {
        state = blank();
        resetViews();
        save(); render();
        toast("Erased. An empty book.");
      });
    },
    "sample-load": function () {
      function go() {
        state = adoptState(sampleData(), blank());
        resetViews();
        save(); render();
        toast("The worked example is loaded.");
      }
      if (!state.cards.length) { go(); return; }
      confirmAction({
        title: "Replace your book with the example?",
        message: "Everything in this browser goes. Back it up first if you want to keep it.",
        confirmLabel: "Load the example"
      }, go);
    },

    /* The old book is OFFERED, never read on its own: `mashghal2.v1` is a
       different key holding a different shape, and silently importing it
       would mean this app's first act was to rewrite work it did not
       understand. The import is lossy and SAYS SO. */
    "import-old": function () {
      var raw = null;
      try { raw = localStorage.getItem(OLD_KEY); } catch (e) {}
      if (!raw) { toast("There is no old book in this browser."); return; }
      var old = null;
      try { old = JSON.parse(raw); } catch (e) {}
      if (!old) { toast("The old book is in this browser but cannot be read."); return; }
      var got = importOld(old, true);
      confirmAction({
        title: "Bring in the old book?",
        message: "It holds " + got.cards + " things this app can hold as cards and " +
          got.links + " lines between them. They are ADDED to what you have — nothing here is " +
          "replaced, and the old book is not touched, so it stays exactly where it is." +
          (got.dropped ? " " + cap(numWord(got.dropped)) + " records have no card shape (hours " +
            "logged against a claimant, mostly) and are left behind; the old app still has them."
            : ""),
        confirmLabel: "Bring it in", danger: false
      }, function () {
        var done = importOld(old, false);
        save(); render();
        toast("Brought in " + done.cards + " cards and " + done.links + " lines.");
      });
    }

  function resetViews() {
    sheetIn = ""; openCardId = ""; askQ = ""; idxFilter = "";
    CV.sel = ""; CV.fitted = null; unmaximize();

  /* ============================================================
     BRINGING THE OLD BOOK IN.

     `mashghal2.v1` holds fifteen lists. Most of them ARE cards, which is
     the argument this rebuild rests on — so the import is a mapping and
     not a migration, it is ADDITIVE (nothing here is replaced), and the
     old key is never written to, so w3's book stays exactly where it is.

     It is lossy and says so before it runs. Time logged against a
     claimant is the one thing with no card shape: hours are a sum over
     stretches, not a thing with a name, and inventing a card per stretch
     would put six hundred rows in the Index to say what one figure says.
     ============================================================ */

  function importOld(old, dryRun) {
    var made = {}, cards = [], links = [], dropped = 0;
    function put(rec, name, kind, extra) {
      if (!name) return null;
      var c = { id: uid(), name: String(name), kind: kind, role: "", in: "",
        when: "", waitOn: "", chaseDays: 0, everyDays: 0, lastDoneOn: "",
        path: "", url: "", note: "", doneAt: "",
        madeOn: today(), updatedAt: new Date().toISOString() };
      Object.keys(extra || {}).forEach(function (k) { c[k] = extra[k]; });
      cards.push(c);
      if (rec && rec.id) made[rec.id] = c;
      return c;
    }
    function list(k) { return Array.isArray(old[k]) ? old[k] : []; }

    list("jobs").forEach(function (j) { put(j, j.name, "job", { role: "holds" }); });
    list("projects").forEach(function (p) {
      var c = put(p, p.name, "project", { role: "holds", note: p.note || "",
        when: dayOk(p.endsOn || "") ? p.endsOn : "" });
      if (c && p.jobId && made[p.jobId]) c.in = made[p.jobId].id;
    });
    list("workflows").forEach(function (w) {
      var c = put(w, w.name, "workflow", { role: "holds", note: w.description || "" });
      if (c && w.projectId && made[w.projectId]) c.in = made[w.projectId].id;
    });
    list("wfNodes").forEach(function (n) {
      var c = put(n, n.label || n.name, n.act || "step", {
        role: n.act === "file" ? "files" : "",
        waitOn: (n.recipients || []).join(", "),
        chaseDays: num(n.chaseAfterDays), note: n.note || "",
        when: dayOk(n.dueAt || "") ? n.dueAt : "",
        x: num(n.x) || undefined, y: num(n.y) || undefined
      });
      if (c && n.workflowId && made[n.workflowId]) c.in = made[n.workflowId].id;
    });
    list("wfEdges").forEach(function (e) {
      var a = made[e.from || e.fromNodeId], b = made[e.to || e.toNodeId];
      if (a && b) links.push({ id: uid(), from: a.id, to: b.id,
        rel: e.kind === "link" ? "with" : "then", label: e.label || "",
        updatedAt: new Date().toISOString() });
    });
    list("actions").forEach(function (a) {
      var c = put(a, a.title || a.label, a.type === "upkeep" ? "upkeep" : "task", {
        when: dayOk(a.dueAt || a.when || "") ? (a.dueAt || a.when) : "",
        everyDays: num(a.everyDays), lastDoneOn: dayOk(a.lastDoneOn || "") ? a.lastDoneOn : "",
        waitOn: a.waitingOn || "", note: a.note || "",
        doneAt: dayOk(a.completedOn || "") ? a.completedOn : ""
      });
      if (c && a.projectId && made[a.projectId]) c.in = made[a.projectId].id;
    });
    list("assets").forEach(function (a) {
      var c = put(a, a.name, a.kind || "thing", { path: a.path || "", url: a.url || "",
        note: a.note || a.notes || "" });
      if (c && a.atId && made[a.atId]) c.in = made[a.atId].id;
    });
    list("people").forEach(function (p) {
      put(p, p.name, "person", { note: [p.org, p.role, p.note].filter(Boolean).join(" \u00b7 ") });
    });
    list("timeEntries").forEach(function () { dropped++; });
    list("reports").forEach(function () { dropped++; });
    list("runs").forEach(function () { dropped++; });
    list("runNodes").forEach(function () { dropped++; });
    list("claimants").forEach(function () { dropped++; });

    if (!dryRun) {
      cards.forEach(function (c) { state.cards.push(c); });
      links.forEach(function (l) { state.links.push(l); });
      state.settings.offered = true;
    }
    return { cards: cards.length, links: links.length, dropped: dropped };
  }

  /* ============================================================
     THE WORKED EXAMPLE.

     It has to EXERCISE the app rather than describe it: every one of the
     six behaviours is represented, every rung of the ladder has at least
     one card on it, both kinds of line are drawn, and the kinds are words
     the app has never heard of — sherd, orthophoto, visa — which is the

    var anfeh = C("Anfeh harbour survey", "project", { role: "holds", in: bal.id,
      when: addDays(t, 52), note: "Coastal survey and the festival brochure that came out of it." });

    var send = C("Send it to Patricia Antaki", "send", { in: anfeh.id,

    var file = C("Archive the final version", "file", { in: anfeh.id, role: "files",

    /* Nothing joins the statement to the references: chasing somebody does

    /* Things. They are cards too, they are not work, and they carry no

    var legion = C("Lenovo Legion", "laptop", { path: "C:\\Users\\mohannad",
      note: "PF2XK9QD. The one with the GIS licence on it." });

    /* Upkeep: every so often since it was last done, so arrears never

/* ============================================================
   Shared runtime for all of these apps.

   Two rules learned the hard way, because a published page runs inside
   a sandboxed frame:
     • native confirm() silently returns false  -> never use it
     • <form> submit events never fire          -> never rely on them
   So: every confirmation is an in-page modal, and every action is an
   explicit button click with Enter wired up by hand.
   ============================================================ */

var STORE_KEY = APP.storeKey;

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function num(v) { var n = parseFloat(v); return isFinite(n) ? n : 0; }
function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }
function pad2(n) { return String(n).padStart(2, "0"); }

function iso(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
function today() { return iso(new Date()); }
function parseISO(s) { return new Date(s + "T00:00:00"); }
function addDays(dateStr, n) { var d = parseISO(dateStr); d.setDate(d.getDate() + n); return iso(d); }
function daysBetween(a, b) { return Math.round((parseISO(b) - parseISO(a)) / 86400000); }
function daysUntil(s) { return daysBetween(today(), s); }

function dayName(dateStr, style) {
  return parseISO(dateStr).toLocaleDateString(undefined, { weekday: style || "short" });
}
function niceDate(dateStr) {
  var d = daysUntil(dateStr);
  if (d === 0) return "today";
  if (d === 1) return "tomorrow";
  if (d === -1) return "yesterday";
  return parseISO(dateStr).toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
// Monday-start week containing dateStr
function weekStart(dateStr) {
  var d = parseISO(dateStr);
  var shift = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - shift);
  return iso(d);
}

/* ---------------- storage ---------------- */

/* Two ways the record can be in trouble, and the app used to carry on as
   though neither had happened.

   **It could not be read.** A truncated write, a half-finished sync, a pasted
   backup missing its tail — `JSON.parse` throws, the catch returned a blank
   shape, and the app opened on its first-run screen with not one word said. The
   only rational reading of that screen is "everything is gone", while the text
   was still sitting in storage, and the next thing that saved would write over
   it. An empty book presented as your book is the worst failure this app can
   have, so the raw text is KEPT and `persist()` refuses until somebody decides.

   **It could not be written.** The old code toasted and moved on: four seconds
   later nothing said so, and the screen went on showing a change that would
   vanish on reload. Worse, the sample's own "Example loaded" toast landed
   directly after two failures, so the app claimed success immediately after
   admitting failure. A refused save is sticky now, and the first one opens the
   backup dialog so the work can be copied out of the page it is still in. */
var bookTrouble = { unread: null, unsaved: false, said: false };

function loadState(shape) {
  var raw = null;
  try { raw = localStorage.getItem(STORE_KEY); } catch (e) { raw = null; }
  if (!raw) return shape();
  try {
    return APP.hydrate(JSON.parse(raw), shape());
  } catch (e) {
    bookTrouble.unread = { raw: raw, why: String((e && e.message) || e) };
    return shape();
  }
}

function persist(state) {
  // The unreadable text is the only copy of the work. Writing a blank book
  // over it IS the loss, so nothing is written until it has been dealt with.
  if (bookTrouble.unread) { alarmPaint(); return false; }
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
    if (bookTrouble.unsaved) { bookTrouble.unsaved = false; alarmPaint(); }
    return true;
  } catch (e) {
    bookTrouble.unsaved = true;
    alarmPaint();
    if (!bookTrouble.said) {
      bookTrouble.said = true;
      /* Deferred, because this can be reached from inside a dialog's confirm —
         `go()` saves — and backupDialog takes over the overlay. Opening it on
         top of a closing dialog leaves the scrim behind. */
      var text = "";
      try { text = JSON.stringify(state, null, 2); } catch (e2) { text = ""; }
      setTimeout(function () {
        if (!text) return;
        backupDialog(STORE_KEY + "-unsaved.json", text,
          "this could not be saved to the browser — keep a copy");
      }, 0);
    }
    return false;
  }
}

/* The standing alarm. Not a toast: a toast is for something that happened, and
   these are states the app is IN — it will keep being true until somebody acts,
   so it has to keep being on the screen. Wired with real listeners rather than
   `data-act`, so it works in every app that shares this runtime without any of
   them having to add an action. */
function alarmPaint() {
  var el = document.getElementById("alarm");
  if (!el) return;
  if (bookTrouble.unread) {
    var kb = (bookTrouble.unread.raw.length / 1024).toFixed(1);
    el.innerHTML = '<div class="alarm-box"><b>This book could not be read, and nothing has been saved over it.</b>' +
      "<p>There are " + kb + " KB of text in this browser's storage that is not valid " +
      "— a half-finished write, or a backup pasted in short. What you are looking at is an " +
      "EMPTY book, not yours: nothing has been lost yet, and nothing will be saved until you choose.</p>" +
      '<div class="alarm-acts"><button class="btn primary" data-alarm="keep">Show me the text</button>' +
      '<button class="btn danger" data-alarm="fresh">Throw it away and start fresh</button></div></div>';
    el.querySelector('[data-alarm="keep"]').addEventListener("click", function () {
      backupDialog(STORE_KEY + "-damaged.txt", bookTrouble.unread.raw,
        "the text as it is, unreadable — " + bookTrouble.unread.why);
    });
    el.querySelector('[data-alarm="fresh"]').addEventListener("click", function () {
      confirmAction({
        title: "Throw away the unreadable text?",
        confirmLabel: "Throw it away",
        message: "It is the only copy of whatever was in this browser. Copy it out first if you have not — " +
          "<b>Show me the text</b> hands it to you. After this the app saves normally again and that text is gone."
      }, function () {
        bookTrouble.unread = null;
        alarmPaint();
        save();
        render();
        toast("Starting fresh. Saving works again.");
      });
    });
    return;
  }
  if (bookTrouble.unsaved) {
    /* One line, not a card. The unread alarm can take the top of the screen
       because the page behind it is an empty book and covering it costs
       nothing; this one stands while you carry on working, and a three-line
       card permanently over the top of every screen is its own problem. The
       whole essential fact fits on one line. */
    el.innerHTML = '<div class="alarm-box thin"><b>Not saved.</b>' +
      "<span>Storage is full or blocked, so everything on screen lives only in this tab.</span>" +
      '<button class="btn primary" data-alarm="copy">Copy my book out</button></div>';
    el.querySelector('[data-alarm="copy"]').addEventListener("click", function () {
      var text = "";
      try { text = JSON.stringify(state, null, 2); } catch (e) {}
      if (text) backupDialog(STORE_KEY + "-unsaved.json", text, "what is on the screen, unsaved");
    });
    return;
  }
  el.innerHTML = "";
}

/* ---------------- modal ---------------- */

var overlay, escHandler = null;

function closeModal() {
  overlay.innerHTML = "";
  if (escHandler) { document.removeEventListener("keydown", escHandler); escHandler = null; }
}

/* Escape and a focus trap, for ANY dialog in the overlay. Tab used to walk out
   of the last button and into the page behind the scrim, where a keyboard
   reader could reach controls they could neither see nor click.

   Extracted because openModal was not the only dialog: the backup and restore
   dialogs build the overlay by hand, so they had no Escape at all — the one
   key everybody presses to get out of a modal did nothing, and Tab walked
   straight through the scrim. Anything that writes overlay.innerHTML itself
   calls this. */
function trapOverlay(onEscape) {
  /* `offsetParent !== null` is NOT enough once a dialog can fold fields away.
     Chrome keeps the children of a closed <details> in the layout tree
     (content-visibility: hidden), so they have an offsetParent and Tab walked
     straight into seven fields nobody could see — which is the same fault as
     Tab walking out through the scrim, one level in. The closed-fold test is
     explicit rather than relying on `checkVisibility`, whose options are not
     the same everywhere. */
  var trap = function () {
    return Array.prototype.filter.call(
      overlay.querySelectorAll("button, input, select, textarea, a[href], label, [tabindex]:not([tabindex='-1'])"),
      function (el) {
        if (el.disabled || el.offsetParent === null) return false;
        var fold = el.closest && el.closest("details:not([open])");
        return !(fold && fold !== el && fold.querySelector("summary") !== el);
      });
  };
  escHandler = function (e) {
    if (e.key === "Escape") { closeModal(); if (onEscape) onEscape(); return; }
    if (e.key !== "Tab") return;
    var f = trap();
    if (!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if (!overlay.contains(document.activeElement)) { e.preventDefault(); first.focus(); return; }
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  };
  document.addEventListener("keydown", escHandler);
}

// fields: [{key,label,type,value,options,placeholder,step,min,hint,span,rows}]
function openModal(opts) {
  closeModal();
  var fields = opts.fields || [];

  var html = '<div class="scrim" data-scrim="1"><div class="modal"' +
    (opts.wide ? ' style="max-width:620px"' : "") +
    ' role="dialog" aria-modal="true" aria-label="' + esc(opts.title) + '">' +
    '<div class="modal-head"><h3>' + esc(opts.title) + "</h3>" +
    (opts.message ? "<p>" + opts.message + "</p>" : "") + "</div>";

  /* `more: true` puts a field behind a fold. A dialog asking twelve questions
     is a dialog people close, and the registry's asked for a name, a kind, a
     write-in, which list, a path, a link, where it is kept, how it stands,
     when it was last used, when it was made, what it is part of, what it is
     about and a note — four of which are what anybody actually types. Same
     reasoning as `showWhen`, one level up: a field needed one time in five
     should not be on screen every time.

     Native `<details>`, so a closed fold is out of the tab order for free
     (its contents have no `offsetParent`, which is exactly what
     `trapOverlay` filters on), and `collect()` reads by id, so a folded
     field is still read and still saved. The summary says how many, because
     a fold that does not is a fold nobody opens. */
  if (fields.length) {
    var fieldHtml = function (f) {
      var id = "mf_" + f.key, inner;
      if (f.type === "select") {
        /* An option, or a GROUP of them: `{group, options}` becomes an
           <optgroup>, so a picker over a hundred things can say which section
           each one came from. Native, so on a phone it is the operating
           system's own picker with the headings in it rather than a list this
           app would have to build, scroll and trap focus in. A group carries
           no value of its own — anything that needs a first entry to default
           to has to flatten the list first, which is the lesson Coffer's
           `accountOptions()` learned by defaulting a debt payment to
           `undefined`. */
        function optHtml(o) {
          var v = typeof o === "string" ? o : o.value;
          var l = typeof o === "string" ? o : o.label;
          return '<option value="' + esc(v) + '"' + (String(v) === String(f.value) ? " selected" : "") + ">" + esc(l) + "</option>";
        }
        inner = '<select id="' + id + '">' + (f.options || []).map(function (o) {
          if (o && o.group && o.options) {
            return '<optgroup label="' + esc(o.group) + '">' +
              o.options.map(optHtml).join("") + "</optgroup>";
          }
          return optHtml(o);
        }).join("") + "</select>";
      } else if (f.type === "textarea") {
        inner = '<textarea id="' + id + '" rows="' + (f.rows || 4) + '" spellcheck="false" placeholder="' +
          esc(f.placeholder || "") + '">' + esc(f.value == null ? "" : f.value) + "</textarea>";
      } else {
        inner = '<input id="' + id + '" type="' + (f.type || "text") + '" value="' + esc(f.value == null ? "" : f.value) + '"' +
          (f.placeholder ? ' placeholder="' + esc(f.placeholder) + '"' : "") +
          (f.type === "number" ? ' step="' + (f.step || "0.01") + '"' : "") +
          (f.min != null ? ' min="' + f.min + '"' : "") + ' autocomplete="off" />';
      }
      /* showWhen: {key, is} keeps a field out of the way until the field it
         depends on has that value. The write-in box beside an "Other" picker
         was on screen in every one of these dialogs, under the words "only
         needed if you picked Other above" — a whole extra field, always, to
         serve the one time in fifty it is used. */
      return '<div class="field' + (f.span ? " wide" : "") + '"' +
        (f.showWhen ? ' data-when="' + esc(f.showWhen.key) + '" data-is="' + esc(f.showWhen.is) + '" hidden' : "") +
        '><label class="label" for="' + id + '">' + esc(f.label) + "</label>" + inner +
        (f.hint ? '<span class="hint">' + esc(f.hint) + "</span>" : "") + "</div>";
    };
    var plain = fields.filter(function (f) { return !f.more; });
    var extra = fields.filter(function (f) { return f.more; });
    html += '<div class="modal-body"><div class="fields">' +
      plain.map(fieldHtml).join("") + "</div>";
    if (extra.length) {
      html += '<details class="modal-more"><summary>' +
        esc(opts.moreLabel || ("More \u2014 " + extra.length + (extra.length === 1 ? " field" : " fields"))) +
        '</summary><div class="fields">' + extra.map(fieldHtml).join("") + "</div></details>";
    }
    html += (opts.extraBody || "") + "</div>";
  } else if (opts.extraBody) {
    html += '<div class="modal-body">' + opts.extraBody + "</div>";
  }

  html += '<p class="modal-bad" data-mbad="1" role="alert" hidden></p>' +
    '<div class="modal-foot">' +
    '<button class="btn quiet" data-mclose="1">' + esc(opts.cancelLabel || "Cancel") + "</button>" +
    '<button class="btn ' + (opts.danger ? "danger" : "primary") + '" data-mok="1">' +
    esc(opts.confirmLabel || "Save") + "</button></div></div></div>";

  overlay.innerHTML = html;

  function collect() {
    var out = {};
    fields.forEach(function (f) {
      var el = document.getElementById("mf_" + f.key);
      out[f.key] = f.type === "number" ? num(el.value) : el.value;
    });
    return out;
  }
  /* A refusal belongs in the dialog. It used to go to a toast at the foot of
     the page — 340px below the button on a tall window, behind the eye that
     was on the form — and a toast is also where every routine success goes,
     so the one message that means "nothing happened" looked like all the ones
     that mean "it worked". role="alert" so it is announced as well as shown. */
  function say(bad) {
    var el = overlay.querySelector("[data-mbad]");
    if (!el) { toast(bad); return; }
    el.textContent = bad;
    el.hidden = false;
  }
  function accept() {
    var v = collect();
    if (opts.validate) {
      var bad = opts.validate(v);
      if (bad) { say(bad); return; }
    }
    closeModal();
    if (opts.onConfirm) opts.onConfirm(v);
  }

  overlay.querySelector("[data-mok]").addEventListener("click", accept);
  overlay.querySelector("[data-mclose]").addEventListener("click", function () {
    closeModal(); if (opts.onCancel) opts.onCancel();
  });
  overlay.querySelector("[data-scrim]").addEventListener("mousedown", function (e) {
    if (e.target === e.currentTarget) { closeModal(); if (opts.onCancel) opts.onCancel(); }
  });
  overlay.querySelectorAll(".modal input").forEach(function (i) {
    i.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); accept(); } });
  });
  overlay.querySelectorAll(".modal input, .modal select, .modal textarea").forEach(function (i) {
    i.addEventListener("input", function () {
      var el = overlay.querySelector("[data-mbad]");
      if (el && !el.hidden) el.hidden = true;     // the message outlived the problem
    });
  });

  // Fields that only apply once another answer has been given.
  function dependants() {
    overlay.querySelectorAll("[data-when]").forEach(function (wrap) {
      var on = document.getElementById("mf_" + wrap.getAttribute("data-when"));
      var want = wrap.getAttribute("data-is");
      var show = !!on && String(on.value) === want;
      wrap.hidden = !show;
      if (!show) { var f = wrap.querySelector("input, select, textarea"); if (f) f.value = ""; }
    });
  }
  overlay.querySelectorAll(".modal select, .modal input").forEach(function (i) {
    i.addEventListener("change", dependants);
  });
  dependants();

  trapOverlay(opts.onCancel);

  var firstField = overlay.querySelector(".modal input, .modal select, .modal textarea");
  if (firstField) firstField.focus(); else overlay.querySelector("[data-mok]").focus();
  if (opts.afterOpen) opts.afterOpen();
}

function confirmAction(opts, onYes) {
  openModal({
    title: opts.title, message: opts.message,
    confirmLabel: opts.confirmLabel || "Delete",
    cancelLabel: opts.cancelLabel || "Keep it",
    danger: opts.danger !== false,
    onConfirm: onYes
  });
}

/* ---------------- toast + undo ---------------- */

function toast(msg, undo) {
  var box = document.getElementById("toasts");
  var el = document.createElement("div");
  el.className = "toast";
  /* While the book cannot be written, EVERY message the app gives you says so.
     Without this the app contradicted itself in two channels at once: the
     alarm said the last change was not saved, and a toast beside it said
     "Headphone firmware — next in 90 days · Undo", which reads as done and
     durable. One place, because every success message in every app that shares
     this runtime comes through here. */
  el.innerHTML = "<span>" + esc(msg) +
    (bookTrouble.unsaved ? " \u00b7 <b>not saved</b>" : "") + "</span>";
  function remove() { if (el.parentNode) el.parentNode.removeChild(el); }
  if (undo) {
    var b = document.createElement("button");
    b.textContent = "Undo";
    b.addEventListener("click", function () { undo(); remove(); save(); render(); });
    el.appendChild(b);
  }
  box.appendChild(el);
  while (box.children.length > 3) box.removeChild(box.firstChild);
  setTimeout(remove, undo ? 7000 : 3800);
}

/* ---------------- download ---------------- */

function download(name, content, mime) {
  try {
    var blob = new Blob([content], { type: mime });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = name; a.rel = "noopener";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  } catch (e) {
    toast("This browser blocked the download. Open the saved file directly rather than in a preview frame.");
  }
}
/* A file save can be ignored outright by the browser — inside an embedded
   frame it fails with no error at all — so never claim success. Always offer
   the text too: that route cannot silently fail. */
function backupDialog(name, text, summary) {
  closeModal();
  overlay.innerHTML = '<div class="scrim" data-scrim="1"><div class="modal" style="max-width:640px" role="dialog" aria-modal="true" aria-label="Your backup">' +
    '<div class="modal-head"><h3>Your backup</h3>' +
    "<p>Two ways to keep this. <b>Save as file</b> puts it in your downloads — but some browsers block that " +
    "silently, so if nothing turns up there, use <b>Copy</b> and paste it somewhere safe. Either can be " +
    "restored later.</p></div>" +
    '<div class="modal-body">' +
    '<textarea id="bkText" readonly rows="9" spellcheck="false" ' +
    'style="width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:0.76rem;padding:0.6rem;' +
    'border-radius:8px;border:1px solid var(--rule-mid);background:var(--raised);color:var(--ink);resize:vertical">' +
    esc(text) + "</textarea>" +
    '<p class="hint" style="margin-top:0.5rem">' + (text.length / 1024).toFixed(1) + " KB" +
    (summary ? " · " + esc(summary) : "") + "</p></div>" +
    '<div class="modal-foot">' +
    '<button class="btn quiet" data-mclose="1">Done</button>' +
    '<button class="btn" id="bkFile">Save as file</button>' +
    '<button class="btn primary" id="bkCopy">Copy</button>' +
    "</div></div></div>";

  var ta = document.getElementById("bkText");
  trapOverlay();
  ta.focus();
  overlay.querySelector("[data-mclose]").addEventListener("click", closeModal);
  overlay.querySelector("[data-scrim]").addEventListener("mousedown", function (e) {
    if (e.target === e.currentTarget) closeModal();
  });
  document.getElementById("bkFile").addEventListener("click", function () {
    download(name, text, "application/json");
    toast("If nothing appears in your downloads, this browser blocked it — use Copy.");
  });
  document.getElementById("bkCopy").addEventListener("click", function () {
    function fallback() {
      ta.removeAttribute("readonly");
      ta.focus();
      ta.setSelectionRange(0, ta.value.length);
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) {}
      ta.setAttribute("readonly", "readonly");
      toast(ok ? "Backup copied — paste it somewhere safe."
               : "Couldn't copy automatically. The text is selected — copy it by hand.");
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        toast("Backup copied — paste it somewhere safe.");
      }, fallback);
    } else { fallback(); }
  });
}

// describe(parsed) -> string summary, or null if it isn't one of ours
function restoreDialog(describe, onJson) {
  closeModal();
  overlay.innerHTML = '<div class="scrim" data-scrim="1"><div class="modal" style="max-width:640px" role="dialog" aria-modal="true" aria-label="Restore a backup">' +
    '<div class="modal-head"><h3>Restore a backup</h3>' +
    "<p>Paste the backup text below, or pick the .json file if you saved one. Everything currently in this " +
    "browser will be replaced — you'll get one more chance to confirm.</p></div>" +
    '<div class="modal-body">' +
    '<textarea id="rsText" rows="9" spellcheck="false" placeholder=\'{ "version": 1, … }\' ' +
    'style="width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:0.76rem;padding:0.6rem;' +
    'border-radius:8px;border:1px solid var(--rule-mid);background:var(--surface);color:var(--ink);resize:vertical"></textarea>' +
    '<div id="rsInfo" class="hint" style="margin-top:0.5rem">Nothing pasted yet.</div></div>' +
    '<div class="modal-foot">' +
    '<button class="btn quiet" data-mclose="1">Cancel</button>' +
    '<label class="btn" style="cursor:pointer">Choose a file' +
    '<input type="file" id="rsFile" accept="application/json,.json" style="display:none" /></label>' +
    '<button class="btn primary" id="rsGo">Restore</button>' +
    "</div></div></div>";

  var ta = document.getElementById("rsText");
  var info = document.getElementById("rsInfo");

  function peek() {
    var t = ta.value.trim();
    if (!t) { info.textContent = "Nothing pasted yet."; info.style.color = ""; return null; }
    var p;
    try { p = JSON.parse(t); }
    catch (e) { info.textContent = "That isn't valid JSON yet — make sure you pasted all of it."; info.style.color = "var(--warn)"; return null; }
    var sum = describe(p);
    if (!sum) { info.textContent = "Valid JSON, but it isn't a backup from this app."; info.style.color = "var(--warn)"; return null; }
    info.textContent = "Looks good — " + sum + ".";
    info.style.color = "var(--gain)";
    return p;
  }

  ta.addEventListener("input", peek);
  trapOverlay();
  ta.focus();
  overlay.querySelector("[data-mclose]").addEventListener("click", closeModal);
  overlay.querySelector("[data-scrim]").addEventListener("mousedown", function (e) {
    if (e.target === e.currentTarget) closeModal();
  });
  document.getElementById("rsFile").addEventListener("change", function (e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    var r = new FileReader();
    r.onload = function () { ta.value = r.result; peek(); };
    r.readAsText(file);
  });
  document.getElementById("rsGo").addEventListener("click", function () {
    var parsed = peek();
    if (!parsed) { toast("Paste a valid backup first."); return; }
    closeModal();
    onJson(parsed);
  });
  ta.focus();
}

function csvEscape(rows) {
  return rows.map(function (r) {
    return r.map(function (c) {
      var s = String(c == null ? "" : c).replace(/"/g, '""');
      return /[",\n]/.test(s) ? '"' + s + '"' : s;
    }).join(",");
  }).join("\n");
}

/* ---------------- tooltip ---------------- */

var tipEl;
function showTip(text, x, y) {
  tipEl.textContent = text;
  tipEl.style.left = x + "px";
  tipEl.style.top = y + "px";
  tipEl.classList.add("on");
}
function hideTip() { tipEl.classList.remove("on"); }

function wireHovers(root) {
  root.querySelectorAll("[data-tip]").forEach(function (el) {
    el.addEventListener("mousemove", function (e) { showTip(el.getAttribute("data-tip"), e.clientX, e.clientY); });
    el.addEventListener("mouseleave", hideTip);
  });
}

/* ---------------- charts ---------------- */

function areaChart(points, o) {
  o = o || {};
  if (!points.length) return "";
  var W = 100, H = o.height || 40, pad = 2;
  var vals = points.map(function (p) { return p.value; });
  var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  if (o.baseZero && lo > 0) lo = 0;
  if (lo === hi) { lo -= 1; hi += 1; }
  var span = hi - lo;
  function px(i) { return pad + (points.length === 1 ? (W - 2 * pad) / 2 : i * (W - 2 * pad) / (points.length - 1)); }
  function py(v) { return H - pad - ((v - lo) / span) * (H - 2 * pad); }

  var line = points.map(function (p, i) { return (i ? "L" : "M") + px(i).toFixed(2) + " " + py(p.value).toFixed(2); }).join(" ");
  var area = line + " L" + px(points.length - 1).toFixed(2) + " " + (H - pad) + " L" + px(0).toFixed(2) + " " + (H - pad) + " Z";
  var gid = "g" + Math.random().toString(36).slice(2, 8);
  var stroke = o.color || "var(--c1)";
  var zero = (lo < 0 && hi > 0)
    ? '<line x1="' + pad + '" y1="' + py(0).toFixed(2) + '" x2="' + (W - pad) + '" y2="' + py(0).toFixed(2) +
      '" stroke="var(--rule-strong)" stroke-width="0.25" vector-effect="non-scaling-stroke" />' : "";
  var hits = points.map(function (p, i) {
    var w = (W - 2 * pad) / points.length;
    return '<rect data-tip="' + esc(p.tip || p.label) + '" x="' + (px(i) - w / 2).toFixed(2) +
      '" y="0" width="' + w.toFixed(2) + '" height="' + H + '" fill="transparent" />';
  }).join("");

  return '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none" style="height:' +
    (o.cssHeight || 100) + 'px" role="img" aria-label="' + esc(o.aria || "trend") + '">' +
    '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0%" stop-color="' + stroke + '" stop-opacity="0.26" />' +
    '<stop offset="100%" stop-color="' + stroke + '" stop-opacity="0.02" /></linearGradient></defs>' +
    zero + '<path d="' + area + '" fill="url(#' + gid + ')" />' +
    '<path d="' + line + '" fill="none" stroke="' + stroke + '" stroke-width="1.1" stroke-linejoin="round" ' +
    'stroke-linecap="round" vector-effect="non-scaling-stroke" />' +
    '<circle cx="' + px(points.length - 1).toFixed(2) + '" cy="' + py(points[points.length - 1].value).toFixed(2) +
    '" r="1.5" fill="' + stroke + '" stroke="var(--surface)" stroke-width="0.6" />' + hits + "</svg>";
}

function barChart(rows, o) {
  o = o || {};
  var H = o.height || 118;
  var max = Math.max.apply(null, rows.map(function (r) { return r.value; }).concat([o.min || 1]));
  return '<div style="display:flex;align-items:flex-end;gap:' + (o.gap || "0.4rem") +
    ';border-bottom:1px solid var(--rule-strong);padding-top:0.3rem">' +
    rows.map(function (r) {
      var h = r.value > 0 ? Math.max(Math.round(r.value / max * H), 2) : 0;
      return '<div style="flex:1;display:flex;align-items:flex-end;justify-content:center;height:' + H + 'px">' +
        '<div data-tip="' + esc(r.tip || (r.label + ": " + r.value)) + '" style="width:62%;max-width:26px;height:' + h +
        "px;background:" + (r.color || o.color || "var(--c1)") + ';border-radius:3px 3px 0 0"></div></div>';
    }).join("") + "</div>" +
    '<div style="display:flex;gap:' + (o.gap || "0.4rem") + ';margin-top:0.35rem">' +
    rows.map(function (r) {
      return '<span style="flex:1;text-align:center;font-size:0.66rem;color:var(--faint)">' + esc(r.label) + "</span>";
    }).join("") + "</div>";
}

function meter(pct, color, pacePct) {
  return '<div class="meter">' +
    (pacePct != null && pacePct > 0.02 && pacePct < 0.98
      ? '<div class="meter-pace" style="left:' + (pacePct * 100).toFixed(1) + '%"></div>' : "") +
    '<div class="meter-fill" style="width:' + (clamp(pct, 0, 1) * 100).toFixed(1) + "%;background:" + color + '"></div></div>';
}

/* ---------------- shared bits of markup ---------------- */

function pageHead(title, sub, right) {
  return '<div class="page-head"><div><h2>' + esc(title) + "</h2>" +
    (sub ? "<p>" + sub + "</p>" : "") + "</div>" + (right || "") + "</div>";
}
function notesHtml(notes, emptyMsg) {
  if (!notes.length) return '<p class="empty">' + esc(emptyMsg) + "</p>";
  return '<div class="notes">' + notes.map(function (n) {
    return '<div class="note"><span class="note-mark ' + n.tone + '">' + n.mark + "</span><div>" + n.html + "</div></div>";
  }).join("") + "</div>";
}
function tile(label, fig, foot, cls) {
  return '<div class="tile"><span class="label">' + esc(label) + '</span><div class="tile-fig' +
    (cls ? " " + cls : "") + '"' + (cls === "gain" ? ' style="color:var(--gain)"' : cls === "loss" ? ' style="color:var(--loss)"' : "") +
    ">" + fig + "</div>" + (foot ? '<div class="tile-foot">' + foot + "</div>" : "") + "</div>";
}

/* ---------------- boot harness ---------------- */

var state, view, viewEl;

function save() { persist(state); }

function renderNav() {
  document.getElementById("nav").innerHTML = APP.tabs.map(function (t) {
    return '<button class="tab" data-tab="' + t.id + '"' + (t.id === view ? ' aria-current="page"' : "") + ">" +
      '<span class="ico">' + t.ico + "</span><span>" + t.label + "</span></button>";
  }).join("");
}

function render() {
  if (APP.beforeRender) APP.beforeRender();
  renderNav();
  viewEl.innerHTML = APP.renderView(view);
  if (APP.afterRender) APP.afterRender();
  wireHovers(viewEl);
}

function boot() {
  overlay = document.getElementById("overlay");
  tipEl = document.getElementById("tip");
  viewEl = document.getElementById("view");
  state = loadState(APP.blank);
  view = APP.tabs[0].id;

  document.addEventListener("click", function (e) {
    var tab = e.target.closest("[data-tab]");
    if (tab) {
      view = tab.getAttribute("data-tab");
      hideTip();
      if (APP.onTabChange) APP.onTabChange(view);
      render();
      window.scrollTo({ top: 0, behavior: "auto" });
      return;
    }
    var act = e.target.closest("[data-act]");
    if (!act) return;
    var name = act.getAttribute("data-act");
    if (APP.actions[name]) { hideTip(); APP.actions[name](act.getAttribute("data-id"), act); }
  });

  render();
  alarmPaint();
  if (APP.afterBoot) APP.afterBoot();
}


  boot();
})();
</script>

<script>
  // Registered immediately, not inside window.load. A blocked third-party
  // host once left readyState at "interactive" for ever, so the worker never
  // registered and the app installed as a shortcut instead of an app.
  if ('serviceWorker' in navigator &&
      (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    navigator.serviceWorker.register('./sw.js').catch(function () {});

    /* When a new worker takes over, the page on screen is still the old one —
       skipWaiting and clients.claim swap the controller but never reload the
       document. That is the other half of why a change took two launches to
       show up on the phone. Reloading once on the swap closes it.

       Guarded on there already being a controller, because controllerchange
       also fires on the very first registration, and reloading then is a
       pointless flash on a first visit. */
    if (navigator.serviceWorker.controller) {
      var swapped = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (swapped) return;
        swapped = true;
        location.reload();
      });
    }
  }
</script>
